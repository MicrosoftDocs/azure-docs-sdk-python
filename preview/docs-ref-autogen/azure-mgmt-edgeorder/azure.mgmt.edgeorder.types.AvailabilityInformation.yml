### YamlMime:PythonClass
uid: azure.mgmt.edgeorder.types.AvailabilityInformation
name: AvailabilityInformation
fullName: azure.mgmt.edgeorder.types.AvailabilityInformation
module: azure.mgmt.edgeorder.types
summary: Availability information of a product system.
constructor:
  syntax: AvailabilityInformation()
variables:
- description: 'Current availability stage of the product. Known values are:

    "Available", "Preview", "Signup", "Discoverable", "ComingSoon", "Unavailable",
    and

    "Deprecated".'
  name: availability_stage
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AvailabilityStage">]
- description: 'Reason why the product is disabled. Known values are: "None", "Country",

    "Region", "Feature", "OfferType", "NoSubscriptionInfo", "NotAvailable", and "OutOfStock".'
  name: disabled_reason
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DisabledReason">]
- description: Message for why the product is disabled.
  name: disabled_reason_message
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.edgeorder.types.AvailabilityInformation.availabilityStage
  name: availabilityStage
  summary: '"Available", "Preview",

    "Signup", "Discoverable", "ComingSoon", "Unavailable", and "Deprecated".'
  signature: 'availabilityStage: str | AvailabilityStage'
- uid: azure.mgmt.edgeorder.types.AvailabilityInformation.disabledReason
  name: disabledReason
  summary: '"None", "Country", "Region",

    "Feature", "OfferType", "NoSubscriptionInfo", "NotAvailable", and "OutOfStock".'
  signature: 'disabledReason: str | DisabledReason'
- uid: azure.mgmt.edgeorder.types.AvailabilityInformation.disabledReasonMessage
  name: disabledReasonMessage
  summary: Message for why the product is disabled.
  signature: 'disabledReasonMessage: str'
