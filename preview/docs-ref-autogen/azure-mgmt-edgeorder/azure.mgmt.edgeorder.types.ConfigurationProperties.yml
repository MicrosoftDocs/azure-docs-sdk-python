### YamlMime:PythonClass
uid: azure.mgmt.edgeorder.types.ConfigurationProperties
name: ConfigurationProperties
fullName: azure.mgmt.edgeorder.types.ConfigurationProperties
module: azure.mgmt.edgeorder.types
summary: Properties of configuration.
constructor:
  syntax: ConfigurationProperties()
variables:
- description: Display Name for the product system.
  name: display_name
  types:
  - <xref:str>
- description: Description related to the product system.
  name: description
  types:
  - <xref:<xref:"Description">>
- description: Image information for the product system.
  name: image_information
  types:
  - <xref:list>[<xref:"ImageInformation">]
- description: Cost information for the product system.
  name: cost_information
  types:
  - <xref:<xref:"CostInformation">>
- description: Availability information of the product system.
  name: availability_information
  types:
  - <xref:<xref:"AvailabilityInformation">>
- description: Hierarchy information of a product.
  name: hierarchy_information
  types:
  - <xref:<xref:"HierarchyInformation">>
- description: 'The entity responsible for fulfillment of the item at the given hierarchy

    level. Known values are: "Microsoft" and "External".'
  name: fulfilled_by
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FulfillmentType">]
- description: List of filters supported for a product.
  name: filterable_properties
  types:
  - <xref:list>[<xref:"FilterableProperty">]
- description: Specifications of the configuration.
  name: specifications
  types:
  - <xref:list>[<xref:"Specification">]
- description: Dimensions of the configuration.
  name: dimensions
  types:
  - <xref:<xref:"Dimensions">>
- description: 'Determining nature of provisioning that the configuration supports.

    Known values are: "CloudBased" and "Manual".'
  name: provisioning_support
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningSupport">]
- description: 'Different types of child configurations which exist for this

    configuration, these can be used to populate the child configuration filter.'
  name: child_configuration_types
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"ChildConfigurationType">]]
- description: 'Child configurations present for the configuration after

    applying child configuration filter, grouped by the category name of the child
    configuration.'
  name: grouped_child_configurations
  types:
  - <xref:list>[<xref:"GroupedChildConfigurations">]
- description: 'The Term Commitment Durations that are supported for

    a configuration.'
  name: supported_term_commitment_durations
  types:
  - <xref:list>[<xref:str>]
