  - <xref:<xref:"ProductDetails">>
- description: 'Order item type. Required. Known values are: "Purchase", "Rental",
    and

    "External".'
  name: order_item_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OrderItemType">]
- description: 'Defines the mode of the Order item. Known values are: "Default" and

    "DoNotFulfill".'
  name: order_item_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OrderMode">]
- description: Site Related Details.
  name: site_details
  types:
  - <xref:<xref:"SiteDetails">>
- description: Current Order item Status.
  name: current_stage
  types:
  - <xref:<xref:"StageDetails">>
- description: Order item status history.
  name: order_item_stage_history
  types:
  - <xref:list>[<xref:"StageDetails">]
- description: Customer notification Preferences.
