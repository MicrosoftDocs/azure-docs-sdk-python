### YamlMime:PythonClass
uid: azure.mgmt.edgeorder.types.ProductDetails
name: ProductDetails
fullName: azure.mgmt.edgeorder.types.ProductDetails
module: azure.mgmt.edgeorder.types
summary: Represents product details.
constructor:
  syntax: ProductDetails()
variables:
- description: Display details of the product.
  name: display_info
  types:
  - <xref:<xref:"DisplayInfo">>
- description: 'Hierarchy of the product which uniquely identifies the product.

    Required.'
  name: hierarchy_information
  types:
  - <xref:<xref:"HierarchyInformation">>
- description: 'Double encryption status of the configuration.

    Read-only field. Known values are: "Disabled" and "Enabled".'
  name: product_double_encryption_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DoubleEncryptionStatus">]
- description: 'Identification type of the configuration. Known values are:

    "NotSupported" and "SerialNumber".'
  name: identification_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IdentificationType">]
- description: Device details of the parent configuration.
  name: parent_device_details
  types:
  - <xref:<xref:"DeviceDetails">>
- description: Device Provisioning Details for Parent.
  name: parent_provisioning_details
  types:
  - <xref:<xref:"ProvisioningDetails">>
- description: 'List of additional configurations customer wants in the

    order item apart from the ones included in the base configuration.'
  name: opt_in_additional_configurations
  types:
  - <xref:list>[<xref:"AdditionalConfiguration">]
- description: 'Details of all child configurations that are part of

    the order item.'
  name: child_configuration_device_details
  types:
  - <xref:list>[<xref:"ConfigurationDeviceDetails">]
- description: Term Commitment Information of the Device.
  name: term_commitment_information
  types:
  - <xref:<xref:"TermCommitmentInformation">>
attributes:
- uid: azure.mgmt.edgeorder.types.ProductDetails.childConfigurationDeviceDetails
  name: childConfigurationDeviceDetails
  summary: Details of all child configurations that are part of the order item.
  signature: 'childConfigurationDeviceDetails: list[''ConfigurationDeviceDetails'']'
- uid: azure.mgmt.edgeorder.types.ProductDetails.displayInfo
  name: displayInfo
  summary: Display details of the product.
  signature: 'displayInfo: DisplayInfo'
- uid: azure.mgmt.edgeorder.types.ProductDetails.hierarchyInformation
  name: hierarchyInformation
  summary: Hierarchy of the product which uniquely identifies the product. Required.
  signature: 'hierarchyInformation: Required[HierarchyInformation]'
- uid: azure.mgmt.edgeorder.types.ProductDetails.identificationType
  name: identificationType
  summary: '"NotSupported" and

    "SerialNumber".'
  signature: 'identificationType: str | IdentificationType'
- uid: azure.mgmt.edgeorder.types.ProductDetails.optInAdditionalConfigurations
  name: optInAdditionalConfigurations
  summary: 'List of additional configurations customer wants in the order item apart
    from the ones included

    in the base configuration.'
  signature: 'optInAdditionalConfigurations: list[''AdditionalConfiguration'']'
- uid: azure.mgmt.edgeorder.types.ProductDetails.parentDeviceDetails
  name: parentDeviceDetails
  summary: Device details of the parent configuration.
  signature: 'parentDeviceDetails: DeviceDetails'
- uid: azure.mgmt.edgeorder.types.ProductDetails.parentProvisioningDetails
  name: parentProvisioningDetails
  summary: Device Provisioning Details for Parent.
  signature: 'parentProvisioningDetails: ProvisioningDetails'
- uid: azure.mgmt.edgeorder.types.ProductDetails.productDoubleEncryptionStatus
  name: productDoubleEncryptionStatus
  summary: '"Disabled"

    and "Enabled".'
  signature: 'productDoubleEncryptionStatus: str | DoubleEncryptionStatus'
- uid: azure.mgmt.edgeorder.types.ProductDetails.termCommitmentInformation
  name: termCommitmentInformation
  summary: Term Commitment Information of the Device.
  signature: 'termCommitmentInformation: TermCommitmentInformation'
