### YamlMime:PythonClass
uid: azure.mgmt.mongocluster.types.FirewallRuleProperties
name: FirewallRuleProperties
fullName: azure.mgmt.mongocluster.types.FirewallRuleProperties
module: azure.mgmt.mongocluster.types
summary: The properties of a mongo cluster firewall rule.
constructor:
  syntax: FirewallRuleProperties()
variables:
- description: 'The provisioning state of the firewall rule. Known values are:

    "Succeeded", "Failed", "Canceled", "InProgress", "Updating", and "Dropping".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The start IP address of the mongo cluster firewall rule. Must be IPv4

    format. Required.'
  name: start_ip_address
  types:
  - <xref:str>
- description: 'The end IP address of the mongo cluster firewall rule. Must be IPv4

    format. Required.'
  name: end_ip_address
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.mongocluster.types.FirewallRuleProperties.endIpAddress
  name: endIpAddress
  summary: The end IP address of the mongo cluster firewall rule. Must be IPv4 format.
    Required.
  signature: 'endIpAddress: Required[str]'
- uid: azure.mgmt.mongocluster.types.FirewallRuleProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "InProgress", "Updating", and "Dropping".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.mongocluster.types.FirewallRuleProperties.startIpAddress
  name: startIpAddress
  summary: The start IP address of the mongo cluster firewall rule. Must be IPv4 format.
    Required.
  signature: 'startIpAddress: Required[str]'
