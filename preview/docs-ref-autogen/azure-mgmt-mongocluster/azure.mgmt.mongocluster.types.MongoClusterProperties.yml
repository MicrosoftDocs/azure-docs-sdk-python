### YamlMime:PythonClass
uid: azure.mgmt.mongocluster.types.MongoClusterProperties
name: MongoClusterProperties
fullName: azure.mgmt.mongocluster.types.MongoClusterProperties
module: azure.mgmt.mongocluster.types
summary: The properties of a mongo cluster.
constructor:
  syntax: MongoClusterProperties()
variables:
- description: 'The mode to create a mongo cluster. Known values are: "Default",

    "PointInTimeRestore", "GeoReplica", and "Replica".'
  name: create_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CreateMode">]
- description: The parameters to create a point-in-time restore mongo cluster.
  name: restore_parameters
  types:
  - <xref:<xref:"MongoClusterRestoreParameters">>
- description: The parameters to create a replica mongo cluster.
  name: replica_parameters
  types:
  - <xref:<xref:"MongoClusterReplicaParameters">>
- description: The local administrator properties for the mongo cluster.
  name: administrator
  types:
  - <xref:<xref:"AdministratorProperties">>
- description: 'The Mongo DB server version. Defaults to the latest available version
    if

    not specified.'
  name: server_version
  types:
  - <xref:str>
- description: The default mongo connection string for the cluster.
  name: connection_string
  types:
  - <xref:str>
- description: 'The provisioning state of the mongo cluster. Known values are:

    "Succeeded", "Failed", "Canceled", "InProgress", "Updating", and "Dropping".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The status of the mongo cluster. Known values are: "Ready",

    "Provisioning", "Updating", "Starting", "Stopping", "Stopped", and "Dropping".'
  name: cluster_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MongoClusterStatus">]
- description: 'Whether or not public endpoint access is allowed for this mongo

    cluster. Known values are: "Enabled" and "Disabled".'
  name: public_network_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: The high availability properties of the mongo cluster.
  name: high_availability
  types:
  - <xref:<xref:"HighAvailabilityProperties">>
- description: The storage properties of the mongo cluster.
  name: storage
  types:
  - <xref:<xref:"StorageProperties">>
- description: The sharding properties of the mongo cluster.
  name: sharding
  types:
  - <xref:<xref:"ShardingProperties">>
- description: The compute properties of the mongo cluster.
  name: compute
  types:
  - <xref:<xref:"ComputeProperties">>
- description: The backup properties of the mongo cluster.
  name: backup
  types:
  - <xref:<xref:"BackupProperties">>
- description: The Data API properties of the mongo cluster.
  name: data_api
  types:
  - <xref:<xref:"DataApiProperties">>
- description: List of private endpoint connections.
  name: private_endpoint_connections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: List of private endpoint connections.
  name: preview_features
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"PreviewFeature">]]
- description: The replication properties for the mongo cluster.
  name: replica
  types:
  - <xref:<xref:"ReplicationProperties">>
- description: The infrastructure version the cluster is provisioned on.
  name: infrastructure_version
  types:
  - <xref:str>
- description: The authentication configuration for the cluster.
  name: auth_config
  types:
  - <xref:<xref:"AuthConfigProperties">>
- description: 'The encryption configuration for the cluster. Depends on identity
    being

    configured.'
  name: encryption
  types:
  - <xref:<xref:"EncryptionProperties">>
- description: 'The network bypass mode for the cluster. Setting to ''AzureCosmosDB''

    allows Azure Cosmos DB service to bypass network restrictions. Known values are:
    "None" and

    "AzureCosmosDB".'
  name: network_bypass_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkBypassMode">]
