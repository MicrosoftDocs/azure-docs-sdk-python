  name: sharding
  summary: The sharding properties of the mongo cluster.
  signature: 'sharding: ShardingProperties'
- uid: azure.mgmt.mongocluster.types.MongoClusterUpdateProperties.storage
  name: storage
  summary: The storage properties of the mongo cluster.
  signature: 'storage: StorageProperties'
