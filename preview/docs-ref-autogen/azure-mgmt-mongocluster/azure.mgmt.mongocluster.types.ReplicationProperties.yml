### YamlMime:PythonClass
uid: azure.mgmt.mongocluster.types.ReplicationProperties
name: ReplicationProperties
fullName: azure.mgmt.mongocluster.types.ReplicationProperties
module: azure.mgmt.mongocluster.types
summary: Replica properties of the mongo cluster.
constructor:
  syntax: ReplicationProperties()
variables:
- description: The resource id the source cluster for the replica cluster.
  name: source_resource_id
  types:
  - <xref:str>
- description: 'The replication role of the cluster. Known values are: "Primary",
    "AsyncReplica",

    and "GeoAsyncReplica".'
  name: role
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationRole">]
- description: 'The replication link state of the replica cluster. Known values are:

    "Active", "Catchup", "Provisioning", "Updating", "Broken", and "Reconfiguring".'
  name: replication_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationState">]
attributes:
- uid: azure.mgmt.mongocluster.types.ReplicationProperties.replicationState
  name: replicationState
  summary: '"Active", "Catchup",

    "Provisioning", "Updating", "Broken", and "Reconfiguring".'
  signature: 'replicationState: str | ReplicationState'
- uid: azure.mgmt.mongocluster.types.ReplicationProperties.role
  name: role
  summary: '"Primary", "AsyncReplica", and

    "GeoAsyncReplica".'
  signature: 'role: str | ReplicationRole'
- uid: azure.mgmt.mongocluster.types.ReplicationProperties.sourceResourceId
  name: sourceResourceId
  summary: The resource id the source cluster for the replica cluster.
  signature: 'sourceResourceId: str'
