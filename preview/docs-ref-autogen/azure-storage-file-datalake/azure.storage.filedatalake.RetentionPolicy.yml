uid: azure.storage.filedatalake.RetentionPolicy
name: RetentionPolicy
fullName: azure.storage.filedatalake.RetentionPolicy
module: azure.storage.filedatalake
summary: 'The retention policy which determines how long the associated data should
  persist.


  All required parameters must be populated in order to send to Azure.'
constructor:
  syntax: RetentionPolicy(*args, **kwargs)
  parameters:
  - name: enabled
    description: 'Indicates whether a retention policy is enabled for the storage
      service.

      The default value is False.'
    defaultValue: 'False'
    types:
    - <xref:bool>
  - name: days
    description: 'Indicates the number of days that metrics or logging or soft-deleted
      data should be retained.

      All data older than this value will be deleted.'
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:int>]
