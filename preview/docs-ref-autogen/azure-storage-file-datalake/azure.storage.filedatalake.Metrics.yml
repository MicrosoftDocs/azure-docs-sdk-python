uid: azure.storage.filedatalake.Metrics
name: Metrics
fullName: azure.storage.filedatalake.Metrics
module: azure.storage.filedatalake
summary: 'A summary of request statistics grouped by API in hour or minute aggregates.


  All required parameters must be populated in order to send to Azure.'
constructor:
  syntax: Metrics(*args, **kwargs)
  keywordOnlyParameters:
  - name: version
    description: The version of Storage Analytics to configure. The default value
      is 1.0.
    types:
    - <xref:str>
  - name: enabled
    description: 'Indicates whether metrics are enabled for the Datalake service.

      The default value is *False*.'
    types:
    - <xref:bool>
  - name: include_apis
    description: Indicates whether metrics should generate summary statistics for
      called API operations.
    types:
    - <xref:bool>
  - name: retention_policy
    description: 'Determines how long the associated data should persist. If not specified
      the retention

      policy will be disabled by default.'
    types:
    - <xref:azure.storage.filedatalake.RetentionPolicy>
