  signature: 'claim_name: str'
- uid: azure.mgmt.signalr.models.TrafficThrottleByJwtCustomClaimRule.max_inbound_message_bytes
  name: max_inbound_message_bytes
  summary: 'Maximum accumulated inbound message bytes allowed for the same JWT signature
    within a time

    window. Clients with the same JWT claim will get disconnected if the message bytes
    exceeds this

    value. Default value is 1GB.'
  signature: 'max_inbound_message_bytes: int | None'
- uid: azure.mgmt.signalr.models.TrafficThrottleByJwtCustomClaimRule.type
  name: type
  summary: Required. TRAFFIC_THROTTLE_BY_JWT_CUSTOM_CLAIM_RULE.
