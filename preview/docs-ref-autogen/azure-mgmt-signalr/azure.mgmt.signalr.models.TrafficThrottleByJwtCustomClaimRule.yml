### YamlMime:PythonClass
uid: azure.mgmt.signalr.models.TrafficThrottleByJwtCustomClaimRule
name: TrafficThrottleByJwtCustomClaimRule
fullName: azure.mgmt.signalr.models.TrafficThrottleByJwtCustomClaimRule
module: azure.mgmt.signalr.models
summary: Throttle the client traffic by a custom JWT claim.
constructor:
  syntax: 'TrafficThrottleByJwtCustomClaimRule(*args: Any, **kwargs: Any)'
variables:
- description: 'The name of the claim in the JWT token. The message bytes with the
    same claim

    value will be aggregated. If the claim is not found in the token, the rule will
    be skipped.

    Required.'
  name: claim_name
  types:
  - <xref:str>
- description: 'Maximum accumulated inbound message bytes allowed for the same

    JWT signature within a time window. Clients with the same JWT claim will get disconnected
    if

    the message bytes exceeds this value. Default value is 1GB.'
  name: max_inbound_message_bytes
  types:
  - <xref:int>
- description: 'The aggregation window for the message bytes. The message

    bytes will be aggregated in this window and be reset after the window. Default
    value is 60

    seconds.'
  name: aggregation_window_in_seconds
  types:
  - <xref:int>
- description: Required. TRAFFIC_THROTTLE_BY_JWT_CUSTOM_CLAIM_RULE.
  name: type
  types:
  - <xref:str>
  - <xref:azure.mgmt.signalr.models.TRAFFIC_THROTTLE_BY_JWT_CUSTOM_CLAIM_RULE>
attributes:
- uid: azure.mgmt.signalr.models.TrafficThrottleByJwtCustomClaimRule.aggregation_window_in_seconds
  name: aggregation_window_in_seconds
  summary: 'The aggregation window for the message bytes. The message bytes will be
    aggregated in this

    window and be reset after the window. Default value is 60 seconds.'
  signature: 'aggregation_window_in_seconds: int | None'
- uid: azure.mgmt.signalr.models.TrafficThrottleByJwtCustomClaimRule.claim_name
  name: claim_name
  summary: 'The name of the claim in the JWT token. The message bytes with the same
    claim value will be

    aggregated. If the claim is not found in the token, the rule will be skipped.
