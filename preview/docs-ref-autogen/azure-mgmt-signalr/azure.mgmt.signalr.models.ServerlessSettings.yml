### YamlMime:PythonClass
uid: azure.mgmt.signalr.models.ServerlessSettings
name: ServerlessSettings
fullName: azure.mgmt.signalr.models.ServerlessSettings
module: azure.mgmt.signalr.models
summary: Serverless settings.
constructor:
  syntax: 'ServerlessSettings(*args: Any, **kwargs: Any)'
variables:
- description: 'Gets or sets Client Connection Timeout. Optional to be

    set. Value in seconds. Default value is 30 seconds. Customer should set the timeout
    to a

    shorter period if messages are expected to be sent in shorter intervals, and want
    the client to

    disconnect more quickly after the last message is sent. You can set the timeout
    to a longer

    period if messages are expected to be sent in longer intervals, and they want
    to keep the same

    client connection alive during this session. The service considers the client
    disconnected if

    it hasn''t received a message (including keep-alive) in this interval.'
  name: connection_timeout_in_seconds
  types:
  - <xref:int>
- description: 'Gets or sets the Keep-Alive Interval. Optional to set.

    Value is in seconds. The default value is 15 seconds. Customers should set this
    value to a

    shorter period if they want the service to send keep-alive messages more frequently,
    ensuring

    timely checks of the connection status. Conversely, customers can set this value
    to a longer

    period if they want the service to send keep-alive messages less frequently, reducing
    network

    traffic, but note that it may take longer to detect a disconnection. This interval
    ensures that

    the connection is maintained by sending periodic keep-alive messages to the client.'
  name: keep_alive_interval_in_seconds
  types:
  - <xref:int>
attributes:
