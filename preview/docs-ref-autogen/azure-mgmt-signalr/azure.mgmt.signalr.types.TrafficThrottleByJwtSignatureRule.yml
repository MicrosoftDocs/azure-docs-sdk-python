### YamlMime:PythonClass
uid: azure.mgmt.signalr.types.TrafficThrottleByJwtSignatureRule
name: TrafficThrottleByJwtSignatureRule
fullName: azure.mgmt.signalr.types.TrafficThrottleByJwtSignatureRule
module: azure.mgmt.signalr.types
summary: Throttle the client traffic by the JWT signature.
constructor:
  syntax: TrafficThrottleByJwtSignatureRule()
variables:
- description: 'Maximum accumulated inbound message bytes allowed for the same

    JWT signature within a time window. Clients with the same JWT signature will get
    disconnected

    if the message bytes exceeds this value. Default value is 1GB.'
  name: max_inbound_message_bytes
  types:
  - <xref:int>
- description: 'The aggregation window for the message bytes. The message

    bytes will be aggregated in this window and be reset after the window. Default
    value is 60

    seconds.'
  name: aggregation_window_in_seconds
  types:
  - <xref:int>
- description: Required. TRAFFIC_THROTTLE_BY_JWT_SIGNATURE_RULE.
  name: type
  types:
  - <xref:typing.Literal>[ClientTrafficControlRuleDiscriminator.TRAFFIC_THROTTLE_BY_JWT_SIGNATURE_RULE]
attributes:
- uid: azure.mgmt.signalr.types.TrafficThrottleByJwtSignatureRule.aggregationWindowInSeconds
  name: aggregationWindowInSeconds
  summary: 'The aggregation window for the message bytes. The message bytes will be
    aggregated in this

    window and be reset after the window. Default value is 60 seconds.'
  signature: 'aggregationWindowInSeconds: int'
- uid: azure.mgmt.signalr.types.TrafficThrottleByJwtSignatureRule.maxInboundMessageBytes
  name: maxInboundMessageBytes
  summary: 'Maximum accumulated inbound message bytes allowed for the same JWT signature
    within a time

    window. Clients with the same JWT signature will get disconnected if the message
    bytes exceeds

    this value. Default value is 1GB.'
  signature: 'maxInboundMessageBytes: int'
- uid: azure.mgmt.signalr.types.TrafficThrottleByJwtSignatureRule.type
  name: type
  summary: Required. TRAFFIC_THROTTLE_BY_JWT_SIGNATURE_RULE.
  signature: 'type: TRAFFIC_THROTTLE_BY_JWT_SIGNATURE_RULE: ''TrafficThrottleByJwtSignatureRule''>]'
