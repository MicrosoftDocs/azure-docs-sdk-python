uid: azure.mgmt.signalr.types.ThrottleByJwtSignatureRule
name: ThrottleByJwtSignatureRule
fullName: azure.mgmt.signalr.types.ThrottleByJwtSignatureRule
module: azure.mgmt.signalr.types
summary: Throttle the client connection by the JWT signature.
constructor:
  syntax: ThrottleByJwtSignatureRule()
variables:
- description: 'Maximum connection count allowed for the same JWT signature. Clients
    with the

    same JWT signature will get rejected if the connection count exceeds this value.
    Default value

    is 20.'
  name: max_count
  types:
  - <xref:int>
- description: Required. THROTTLE_BY_JWT_SIGNATURE_RULE.
  name: type
  types:
  - <xref:typing.Literal>[ClientConnectionCountRuleDiscriminator.THROTTLE_BY_JWT_SIGNATURE_RULE]
attributes:
- uid: azure.mgmt.signalr.types.ThrottleByJwtSignatureRule.maxCount
  name: maxCount
  summary: 'Maximum connection count allowed for the same JWT signature. Clients with
    the same JWT

    signature will get rejected if the connection count exceeds this value. Default
    value is 20.'
  signature: 'maxCount: int'
- uid: azure.mgmt.signalr.types.ThrottleByJwtSignatureRule.type
  name: type
  summary: Required. THROTTLE_BY_JWT_SIGNATURE_RULE.
  signature: 'type: THROTTLE_BY_JWT_SIGNATURE_RULE: ''ThrottleByJwtSignatureRule''>]'
