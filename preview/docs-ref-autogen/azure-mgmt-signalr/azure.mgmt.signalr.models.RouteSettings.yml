uid: azure.mgmt.signalr.models.RouteSettings
name: RouteSettings
fullName: azure.mgmt.signalr.models.RouteSettings
module: azure.mgmt.signalr.models
summary: Route settings for the resource.
constructor:
  syntax: 'RouteSettings(*args: Any, **kwargs: Any)'
variables:
- description: 'Gets or sets the server balance weight. A higher value means a

    greater balance of client connections across different app server instances. A
    value of 0

    distributes connections randomly, while a value of 255 ensures maximum balancing.
    The default

    value is 255. Recommended `255` for multiple app servers in same size.'
  name: server_balance_weight
  types:
  - <xref:int>
- description: 'Gets or sets the connection balance weight. A higher value

    means a greater balance of client connections across different server connections.
    A value of 0

    distributes connections randomly, while a value of 255 ensures maximum balancing.
    The default

    value is 255. Recommended `255` for all of the cases.'
  name: connection_balance_weight
  types:
  - <xref:int>
- description: 'Gets or sets the weight for latency-based routing. A higher value

    increases the influence of latency-based routing. A value of 0 disables latency-based
    routing

    entirely, while a value of 255 enables it fully. The default value is 0. Recommended
    `255`

    for replicas or app servers in different regions for disaster recovery.'
  name: latency_weight
  types:
  - <xref:int>
