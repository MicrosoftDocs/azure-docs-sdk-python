uid: azure.mgmt.signalr.types.LiveTraceConfiguration
name: LiveTraceConfiguration
fullName: azure.mgmt.signalr.types.LiveTraceConfiguration
module: azure.mgmt.signalr.types
summary: Live trace configuration of a Microsoft.SignalRService resource.
constructor:
  syntax: LiveTraceConfiguration()
variables:
- description: 'Indicates whether or not enable live trace. When it''s set to true,
    live trace

    client can connect to the service. Otherwise, live trace client can''t connect
    to the service,

    so that you are unable to receive any log, no matter what you configure in "categories".

    Available values: true, false. Case insensitive.'
  name: enabled
  types:
  - <xref:str>
- description: Gets or sets the list of category configurations.
  name: categories
  types:
  - <xref:list>[<xref:"LiveTraceCategory">]
attributes:
