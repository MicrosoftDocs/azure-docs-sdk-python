### YamlMime:PythonClass
uid: azure.mgmt.signalr.types.UpstreamTemplate
name: UpstreamTemplate
fullName: azure.mgmt.signalr.types.UpstreamTemplate
module: azure.mgmt.signalr.types
summary: 'Upstream template item settings. It defines the Upstream URL of the incoming
  requests. The

  template defines the pattern of the event, the hub or the category of the incoming
  request that

  matches current URL template.'
constructor:
  syntax: UpstreamTemplate()
variables:
- description: "Gets or sets the matching pattern for hub names. If not set, it matches\
    \ any\nhub.\nThere are 3 kind of patterns supported:\n\n1. \"*\", it to matches\
    \ any hub name. \n\n2. Combine multiple hubs with \",\", for example \"hub1,hub2\"\
    , it matches \"hub1\" and \"hub2\". \n\n3. The single hub name, for example, \"\
    hub1\", it matches \"hub1\"."
  name: hub_pattern
  types:
  - <xref:str>
- description: "Gets or sets the matching pattern for event names. If not set, it\
    \ matches\nany event.\nThere are 3 kind of patterns supported:\n\n1. \"*\", it\
    \ to matches any event name. \n\n2. Combine multiple events with \",\", for example\
    \ \"connect,disconnect\", it matches event\n\"connect\" and \"disconnect\".\n\
    3. The single event name, for example, \"connect\", it matches \"connect\"."
  name: event_pattern
  types:
  - <xref:str>
- description: "Gets or sets the matching pattern for category names. If not set,\
    \ it\nmatches any category.\nThere are 3 kind of patterns supported:\n\n1. \"\
    *\", it to matches any category name. \n\n2. Combine multiple categories with\
    \ \",\", for example \"connections,messages\", it matches\ncategory \"connections\"\
    \ and \"messages\".\n3. The single category name, for example, \"connections\"\
    , it matches the category \"connections\"."
  name: category_pattern
  types:
  - <xref:str>
- description: 'Gets or sets the Upstream URL template. You can use 3 predefined parameters

    {hub}, {category} {event} inside the template, the value of the Upstream URL is
    dynamically

    calculated when the client request comes in. For example, if the urlTemplate is

    `http://example.com/{hub}/api/{event}`, with a client request from hub `chat`
    connects, it

    will first POST to this URL: `http://example.com/chat/api/connect`. Required.'
  name: url_template
  types:
  - <xref:str>
- description: Upstream auth settings. If not set, no auth is used for upstream messages.
  name: auth
  types:
  - <xref:<xref:"UpstreamAuthSettings">>
attributes:
- uid: azure.mgmt.signalr.types.UpstreamTemplate.auth
  name: auth
  summary: Upstream auth settings. If not set, no auth is used for upstream messages.
  signature: 'auth: UpstreamAuthSettings'
- uid: azure.mgmt.signalr.types.UpstreamTemplate.categoryPattern
  name: categoryPattern
  summary: "Gets or sets the matching pattern for category names. If not set, it matches\
    \ any category.\nThere are 3 kind of patterns supported:\n\n1. \"*\", it to matches\
    \ any category name. \n\n2. Combine multiple categories with \",\", for example\
    \ \"connections,messages\", it matches\ncategory \"connections\" and \"messages\"\
    .\n3. The single category name, for example, \"connections\", it matches the category\n\
    \"connections\"."
  signature: 'categoryPattern: str'
- uid: azure.mgmt.signalr.types.UpstreamTemplate.eventPattern
  name: eventPattern
  summary: "Gets or sets the matching pattern for event names. If not set, it matches\
    \ any event.\nThere are 3 kind of patterns supported:\n\n1. \"*\", it to matches\
    \ any event name. \n\n2. Combine multiple events with \",\", for example \"connect,disconnect\"\
    , it matches event\n\"connect\" and \"disconnect\".\n3. The single event name,\
    \ for example, \"connect\", it matches \"connect\"."
  signature: 'eventPattern: str'
- uid: azure.mgmt.signalr.types.UpstreamTemplate.hubPattern
  name: hubPattern
  summary: "Gets or sets the matching pattern for hub names. If not set, it matches\
    \ any hub.\nThere are 3 kind of patterns supported:\n\n1. \"*\", it to matches\
    \ any hub name. \n\n2. Combine multiple hubs with \",\", for example \"hub1,hub2\"\
    , it matches \"hub1\" and\n\"hub2\".\n3. The single hub name, for example, \"\
    hub1\", it matches \"hub1\"."
  signature: 'hubPattern: str'
- uid: azure.mgmt.signalr.types.UpstreamTemplate.urlTemplate
  name: urlTemplate
  summary: 'Gets or sets the Upstream URL template. You can use 3 predefined parameters
    {hub}, {category}

    {event} inside the template, the value of the Upstream URL is dynamically calculated
    when the

    client request comes in. For example, if the urlTemplate is

    `http://example.com/{hub}/api/{event}`, with a client request from hub `chat`
    connects, it

    will first POST to this URL: `http://example.com/chat/api/connect`. Required.'
  signature: 'urlTemplate: str'
