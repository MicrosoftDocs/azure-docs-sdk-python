### YamlMime:PythonClass
uid: azure.mgmt.signalr.models.SignalRFeature
name: SignalRFeature
fullName: azure.mgmt.signalr.models.SignalRFeature
module: azure.mgmt.signalr.models
summary: Feature of a resource, which controls the runtime behavior.
constructor:
  syntax: 'SignalRFeature(*args: Any, **kwargs: Any)'
variables:
- description: "FeatureFlags is the supported features of Azure SignalR service.\n\
    \n* ServiceMode: Flag for backend server for SignalR service. Values allowed:\
    \ \"Default\": have your own backend server; \"Serverless\": your application\
    \ doesn't have a backend server; \"Classic\": for backward compatibility. Support\
    \ both Default and Serverless mode but not recommended; \"PredefinedOnly\": for\
    \ future use. \n\n* EnableConnectivityLogs: \"true\"/\"false\", to enable/disable\
    \ the connectivity log category respectively. \n\n* EnableMessagingLogs: \"true\"\
    /\"false\", to enable/disable the connectivity log category respectively. \n\n\
    * EnableLiveTrace: Live Trace allows you to know what's happening inside Azure\
    \ SignalR service, it will give you live traces in real time, it will be helpful\
    \ when you developing your own Azure SignalR based web application or self-troubleshooting\
    \ some issues. Please note that live traces are counted as outbound messages that\
    \ will be charged. Values allowed: \"true\"/\"false\", to enable/disable live\
    \ trace feature. Required. Known values are: \"ServiceMode\", \"EnableConnectivityLogs\"\
    , \"EnableMessagingLogs\", and \"EnableLiveTrace\"."
  name: flag
  types:
  - <xref:str>
  - <xref:azure.mgmt.signalr.models.FeatureFlags>
- description: 'Value of the feature flag. See Azure SignalR service document

    [https://docs.microsoft.com/azure/azure-signalr/](https://docs.microsoft.com/azure/azure-signalr/)
    for allowed values. Required.'
  name: value
  types:
  - <xref:str>
- description: Optional properties related to this feature.
  name: properties
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
