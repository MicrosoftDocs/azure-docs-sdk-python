### YamlMime:PythonClass
uid: azure.mgmt.hybridcompute.types.LicenseDetails
name: LicenseDetails
fullName: azure.mgmt.hybridcompute.types.LicenseDetails
module: azure.mgmt.hybridcompute.types
summary: Describes the properties of a License.
constructor:
  syntax: LicenseDetails()
variables:
- description: 'Describes the state of the license. Known values are: "Activated"
    and

    "Deactivated".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LicenseState">]
- description: 'Describes the license target server. Known values are: "Windows Server
    2012",

    "Windows Server 2012 R2", and "Windows Server 2016".'
  name: target
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LicenseTarget">]
- description: 'Describes the edition of the license. The values are either Standard
    or

    Datacenter. Known values are: "Standard" and "Datacenter".'
  name: edition
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LicenseEdition">]
- description: 'Describes the license core type (pCore or vCore). Known values are:
    "pCore" and

    "vCore".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LicenseCoreType">]
- description: Describes the number of processors.
  name: processors
  types:
  - <xref:int>
- description: Describes the number of assigned licenses.
  name: assigned_licenses
  types:
  - <xref:int>
- description: Describes the immutable id.
  name: immutable_id
  types:
  - <xref:str>
- description: A list of volume license details.
  name: volume_license_details
  types:
  - <xref:list>[<xref:"VolumeLicenseDetails">]
attributes:
- uid: azure.mgmt.hybridcompute.types.LicenseDetails.assignedLicenses
  name: assignedLicenses
  summary: Describes the number of assigned licenses.
  signature: 'assignedLicenses: int'
- uid: azure.mgmt.hybridcompute.types.LicenseDetails.edition
  name: edition
  summary: 'Describes the edition of the license. The values are either Standard or
    Datacenter. Known

    values are: "Standard" and "Datacenter".'
  signature: 'edition: str | LicenseEdition'
- uid: azure.mgmt.hybridcompute.types.LicenseDetails.immutableId
  name: immutableId
  summary: Describes the immutable id.
  signature: 'immutableId: str'
- uid: azure.mgmt.hybridcompute.types.LicenseDetails.processors
  name: processors
  summary: Describes the number of processors.
  signature: 'processors: int'
- uid: azure.mgmt.hybridcompute.types.LicenseDetails.state
  name: state
  summary: '"Activated" and "Deactivated".'
  signature: 'state: str | LicenseState'
- uid: azure.mgmt.hybridcompute.types.LicenseDetails.target
  name: target
  summary: '"Windows Server 2012", "Windows

    Server 2012 R2", and "Windows Server 2016".'
  signature: 'target: str | LicenseTarget'
- uid: azure.mgmt.hybridcompute.types.LicenseDetails.type
  name: type
  summary: '"pCore" and "vCore".'
  signature: 'type: str | LicenseCoreType'
- uid: azure.mgmt.hybridcompute.types.LicenseDetails.volumeLicenseDetails
  name: volumeLicenseDetails
  summary: A list of volume license details.
  signature: 'volumeLicenseDetails: list[''VolumeLicenseDetails'']'
