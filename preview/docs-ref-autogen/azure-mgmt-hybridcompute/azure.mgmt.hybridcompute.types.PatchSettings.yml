### YamlMime:PythonClass
uid: azure.mgmt.hybridcompute.types.PatchSettings
name: PatchSettings
fullName: azure.mgmt.hybridcompute.types.PatchSettings
module: azure.mgmt.hybridcompute.types
summary: Specifies the patch settings.
constructor:
  syntax: PatchSettings()
variables:
- description: 'Specifies the assessment mode. Known values are: "ImageDefault" and

    "AutomaticByPlatform".'
  name: assessment_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AssessmentModeTypes">]
- description: 'Specifies the patch mode. Known values are: "ImageDefault",

    "AutomaticByPlatform", "AutomaticByOS", and "Manual".'
  name: patch_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PatchModeTypes">]
- description: 'Captures the hotpatch capability enrollment intent of the customers,

    which enables customers to patch their Windows machines without requiring a reboot.'
  name: enable_hotpatching
  types:
  - <xref:bool>
- description: Status of the hotpatch capability enrollment or disenrollment.
  name: status
  types:
  - <xref:<xref:"PatchSettingsStatus">>
attributes:
- uid: azure.mgmt.hybridcompute.types.PatchSettings.assessmentMode
  name: assessmentMode
  summary: '"ImageDefault" and "AutomaticByPlatform".'
  signature: 'assessmentMode: str | AssessmentModeTypes'
- uid: azure.mgmt.hybridcompute.types.PatchSettings.enableHotpatching
  name: enableHotpatching
  summary: 'Captures the hotpatch capability enrollment intent of the customers, which
    enables customers to

    patch their Windows machines without requiring a reboot.'
  signature: 'enableHotpatching: bool'
- uid: azure.mgmt.hybridcompute.types.PatchSettings.patchMode
  name: patchMode
  summary: '"ImageDefault", "AutomaticByPlatform",

    "AutomaticByOS", and "Manual".'
  signature: 'patchMode: str | PatchModeTypes'
- uid: azure.mgmt.hybridcompute.types.PatchSettings.status
  name: status
  summary: Status of the hotpatch capability enrollment or disenrollment.
  signature: 'status: PatchSettingsStatus'
