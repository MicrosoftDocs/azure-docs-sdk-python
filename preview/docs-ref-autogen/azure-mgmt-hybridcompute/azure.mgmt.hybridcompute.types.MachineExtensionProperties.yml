### YamlMime:PythonClass
uid: azure.mgmt.hybridcompute.types.MachineExtensionProperties
name: MachineExtensionProperties
fullName: azure.mgmt.hybridcompute.types.MachineExtensionProperties
module: azure.mgmt.hybridcompute.types
summary: Describes the properties of a Machine Extension.
constructor:
  syntax: MachineExtensionProperties()
variables:
- description: 'How the extension handler should be forced to update even if the

    extension configuration has not changed.'
  name: force_update_tag
  types:
  - <xref:str>
- description: The name of the extension handler publisher.
  name: publisher
  types:
  - <xref:str>
- description: Specifies the type of the extension; an example is "CustomScriptExtension".
  name: type
  types:
  - <xref:str>
- description: Specifies the version of the script handler.
  name: type_handler_version
  types:
  - <xref:str>
- description: 'Indicates whether the extension should be automatically

    upgraded by the platform if there is a newer version available.'
  name: enable_automatic_upgrade
  types:
  - <xref:bool>
- description: 'Indicates whether the extension should use a newer minor

    version if one is available at deployment time. Once deployed, however, the extension
    will not

    upgrade minor versions unless redeployed, even with this property set to true.'
  name: auto_upgrade_minor_version
  types:
  - <xref:bool>
- description: Json formatted public settings for the extension.
  name: settings
  types:
  - <xref:dict>[<xref:str>, <xref:typing.Any>]
- description: 'The extension can contain either protectedSettings or

    protectedSettingsFromKeyVault or no protected settings at all.'
  name: protected_settings
  types:
  - <xref:dict>[<xref:str>, <xref:typing.Any>]
- description: The provisioning state, which only appears in the response.
  name: provisioning_state
  types:
  - <xref:str>
- description: The machine extension instance view.
  name: instance_view
  types:
  - <xref:<xref:"MachineExtensionInstanceView">>
attributes:
- uid: azure.mgmt.hybridcompute.types.MachineExtensionProperties.autoUpgradeMinorVersion
  name: autoUpgradeMinorVersion
  summary: 'Indicates whether the extension should use a newer minor version if one
    is available at

    deployment time. Once deployed, however, the extension will not upgrade minor
    versions unless

    redeployed, even with this property set to true.'
  signature: 'autoUpgradeMinorVersion: bool'
- uid: azure.mgmt.hybridcompute.types.MachineExtensionProperties.enableAutomaticUpgrade
  name: enableAutomaticUpgrade
  summary: 'Indicates whether the extension should be automatically upgraded by the
    platform if there is a

    newer version available.'
  signature: 'enableAutomaticUpgrade: bool'
- uid: azure.mgmt.hybridcompute.types.MachineExtensionProperties.forceUpdateTag
  name: forceUpdateTag
  summary: 'How the extension handler should be forced to update even if the extension
    configuration has

    not changed.'
  signature: 'forceUpdateTag: str'
- uid: azure.mgmt.hybridcompute.types.MachineExtensionProperties.instanceView
  name: instanceView
  summary: The machine extension instance view.
  signature: 'instanceView: MachineExtensionInstanceView'
- uid: azure.mgmt.hybridcompute.types.MachineExtensionProperties.protectedSettings
  name: protectedSettings
  summary: 'The extension can contain either protectedSettings or protectedSettingsFromKeyVault
    or no

    protected settings at all.'
  signature: 'protectedSettings: dict[str, Any]'
- uid: azure.mgmt.hybridcompute.types.MachineExtensionProperties.provisioningState
  name: provisioningState
  summary: The provisioning state, which only appears in the response.
  signature: 'provisioningState: str'
- uid: azure.mgmt.hybridcompute.types.MachineExtensionProperties.publisher
  name: publisher
  summary: The name of the extension handler publisher.
  signature: 'publisher: str'
- uid: azure.mgmt.hybridcompute.types.MachineExtensionProperties.settings
  name: settings
  summary: Json formatted public settings for the extension.
  signature: 'settings: dict[str, Any]'
- uid: azure.mgmt.hybridcompute.types.MachineExtensionProperties.type
  name: type
  summary: Specifies the type of the extension; an example is "CustomScriptExtension".
  signature: 'type: str'
- uid: azure.mgmt.hybridcompute.types.MachineExtensionProperties.typeHandlerVersion
  name: typeHandlerVersion
  summary: Specifies the version of the script handler.
  signature: 'typeHandlerVersion: str'
