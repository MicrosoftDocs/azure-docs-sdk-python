### YamlMime:PythonClass
uid: azure.mgmt.hybridcompute.types.AgentConfiguration
name: AgentConfiguration
fullName: azure.mgmt.hybridcompute.types.AgentConfiguration
module: azure.mgmt.hybridcompute.types
summary: 'Configurable properties that the user can set locally via the azcmagent
  config command, or

  remotely via ARM.'
constructor:
  syntax: AgentConfiguration()
variables:
- description: Specifies the URL of the proxy to be used.
  name: proxy_url
  types:
  - <xref:str>
- description: 'Specifies the list of ports that the agent will be able to

    listen on.'
  name: incoming_connections_ports
  types:
  - <xref:list>[<xref:str>]
- description: Array of extensions that are allowed to be installed or updated.
  name: extensions_allow_list
  types:
  - <xref:list>[<xref:"ConfigurationExtension">]
- description: 'Array of extensions that are blocked (cannot be installed or

    updated).'
  name: extensions_block_list
  types:
  - <xref:list>[<xref:"ConfigurationExtension">]
- description: List of service names which should not use the specified proxy server.
  name: proxy_bypass
  types:
  - <xref:list>[<xref:str>]
- description: Specifies whether the extension service is enabled or disabled.
  name: extensions_enabled
  types:
  - <xref:str>
- description: 'Specified whether the guest configuration service is enabled

    or disabled.'
  name: guest_configuration_enabled
  types:
  - <xref:str>
- description: 'Name of configuration mode to use. Modes are pre-defined configurations
    of

    security controls, extension allowlists and guest configuration, maintained by
    Microsoft. Known

    values are: "full" and "monitor".'
  name: config_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AgentConfigurationMode">]
attributes:
- uid: azure.mgmt.hybridcompute.types.AgentConfiguration.configMode
  name: configMode
  summary: 'Name of configuration mode to use. Modes are pre-defined configurations
    of security controls,

    extension allowlists and guest configuration, maintained by Microsoft. Known values
    are:

    "full" and "monitor".'
  signature: 'configMode: str | AgentConfigurationMode'
- uid: azure.mgmt.hybridcompute.types.AgentConfiguration.extensionsAllowList
  name: extensionsAllowList
  summary: Array of extensions that are allowed to be installed or updated.
  signature: 'extensionsAllowList: list[''ConfigurationExtension'']'
- uid: azure.mgmt.hybridcompute.types.AgentConfiguration.extensionsBlockList
  name: extensionsBlockList
  summary: Array of extensions that are blocked (cannot be installed or updated).
  signature: 'extensionsBlockList: list[''ConfigurationExtension'']'
- uid: azure.mgmt.hybridcompute.types.AgentConfiguration.extensionsEnabled
  name: extensionsEnabled
  summary: Specifies whether the extension service is enabled or disabled.
  signature: 'extensionsEnabled: str'
- uid: azure.mgmt.hybridcompute.types.AgentConfiguration.guestConfigurationEnabled
  name: guestConfigurationEnabled
  summary: Specified whether the guest configuration service is enabled or disabled.
  signature: 'guestConfigurationEnabled: str'
- uid: azure.mgmt.hybridcompute.types.AgentConfiguration.incomingConnectionsPorts
  name: incomingConnectionsPorts
  summary: Specifies the list of ports that the agent will be able to listen on.
  signature: 'incomingConnectionsPorts: list[str]'
- uid: azure.mgmt.hybridcompute.types.AgentConfiguration.proxyBypass
  name: proxyBypass
  summary: List of service names which should not use the specified proxy server.
  signature: 'proxyBypass: list[str]'
- uid: azure.mgmt.hybridcompute.types.AgentConfiguration.proxyUrl
  name: proxyUrl
  summary: Specifies the URL of the proxy to be used.
  signature: 'proxyUrl: str'
