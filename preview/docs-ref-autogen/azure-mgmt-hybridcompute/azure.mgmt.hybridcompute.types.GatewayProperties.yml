uid: azure.mgmt.hybridcompute.types.GatewayProperties
name: GatewayProperties
fullName: azure.mgmt.hybridcompute.types.GatewayProperties
module: azure.mgmt.hybridcompute.types
summary: Describes the properties of a Gateway Profile.
constructor:
  syntax: GatewayProperties()
variables:
- description: 'The provisioning state, which only appears in the response. Known

    values are: "Creating", "Updating", "Deleting", "Succeeded", "Failed", "Accepted",
    "Canceled",

    and "Deleted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: A unique, immutable, identifier for the Gateway.
  name: gateway_id
  types:
  - <xref:str>
- description: The type of the Gateway resource. "Public"
  name: gateway_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GatewayType">]
- description: The endpoint fqdn for the Gateway.
  name: gateway_endpoint
  types:
  - <xref:str>
- description: Specifies the list of features that are enabled for this Gateway.
  name: allowed_features
  types:
  - <xref:list>[<xref:str>]
- description: 'Specifies the list of domain names that should bypass the gateway.
    Each

    entry must be a valid DNS hostname.'
  name: gateway_bypass
  types:
  - <xref:list>[<xref:str>]
attributes:
