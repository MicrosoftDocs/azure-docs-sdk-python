  signature: 'gatewayBypass: list[str]'
- uid: azure.mgmt.hybridcompute.types.GatewayProperties.gatewayEndpoint
  name: gatewayEndpoint
  summary: The endpoint fqdn for the Gateway.
  signature: 'gatewayEndpoint: str'
- uid: azure.mgmt.hybridcompute.types.GatewayProperties.gatewayId
  name: gatewayId
  summary: A unique, immutable, identifier for the Gateway.
  signature: 'gatewayId: str'
- uid: azure.mgmt.hybridcompute.types.GatewayProperties.gatewayType
  name: gatewayType
  summary: The type of the Gateway resource. "Public"
  signature: 'gatewayType: str | GatewayType'
