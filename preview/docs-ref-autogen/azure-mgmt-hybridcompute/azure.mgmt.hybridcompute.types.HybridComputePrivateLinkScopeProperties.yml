### YamlMime:PythonClass
uid: azure.mgmt.hybridcompute.types.HybridComputePrivateLinkScopeProperties
name: HybridComputePrivateLinkScopeProperties
fullName: azure.mgmt.hybridcompute.types.HybridComputePrivateLinkScopeProperties
module: azure.mgmt.hybridcompute.types
summary: Properties that define a Azure Arc PrivateLinkScope resource.
constructor:
  syntax: HybridComputePrivateLinkScopeProperties()
variables:
- description: 'Indicates whether machines associated with the private link scope

    can also use public Azure Arc service endpoints. Known values are: "Enabled",
    "Disabled", and

    "SecuredByPerimeter".'
  name: public_network_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccessType">]
- description: 'Current state of this PrivateLinkScope: whether or not is has been

    provisioned within the resource group it is defined. Users cannot change this
    value but are

    able to read from it. Values will include Provisioning ,Succeeded, Canceled and
    Failed.'
  name: provisioning_state
  types:
  - <xref:str>
- description: The Guid id of the private link scope.
  name: private_link_scope_id
  types:
  - <xref:str>
- description: The collection of associated Private Endpoint Connections.
  name: private_endpoint_connections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnectionDataModel">]
- description: Enable private link validation for an Azure Arc Extension.
  name: service_extensions
  types:
  - <xref:list>[<xref:"ServiceExtension">]
attributes:
- uid: azure.mgmt.hybridcompute.types.HybridComputePrivateLinkScopeProperties.privateEndpointConnections
  name: privateEndpointConnections
  summary: The collection of associated Private Endpoint Connections.
  signature: 'privateEndpointConnections: list[''PrivateEndpointConnectionDataModel'']'
- uid: azure.mgmt.hybridcompute.types.HybridComputePrivateLinkScopeProperties.privateLinkScopeId
  name: privateLinkScopeId
  summary: The Guid id of the private link scope.
  signature: 'privateLinkScopeId: str'
- uid: azure.mgmt.hybridcompute.types.HybridComputePrivateLinkScopeProperties.provisioningState
  name: provisioningState
  summary: 'whether or not is has been provisioned within the

    resource group it is defined. Users cannot change this value but are able to read
    from it.

    Values will include Provisioning ,Succeeded, Canceled and Failed.'
  signature: 'provisioningState: str'
- uid: azure.mgmt.hybridcompute.types.HybridComputePrivateLinkScopeProperties.publicNetworkAccess
  name: publicNetworkAccess
  summary: 'Indicates whether machines associated with the private link scope can
    also use public Azure Arc

    service endpoints. Known values are: "Enabled", "Disabled", and "SecuredByPerimeter".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccessType'
- uid: azure.mgmt.hybridcompute.types.HybridComputePrivateLinkScopeProperties.serviceExtensions
  name: serviceExtensions
  summary: Enable private link validation for an Azure Arc Extension.
  signature: 'serviceExtensions: list[''ServiceExtension'']'
