### YamlMime:PythonClass
uid: azure.mgmt.horizondb.models.HorizonDbAdministratorProperties
name: HorizonDbAdministratorProperties
fullName: azure.mgmt.horizondb.models.HorizonDbAdministratorProperties
module: azure.mgmt.horizondb.models
summary: Properties of a HorizonDB administrator.
constructor:
  syntax: 'HorizonDbAdministratorProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The display name or UPN of the Entra ID principal. For users, typically

    the User Principal Name (e.g., <xref:mailto:admin@contoso.com>). For groups,

    the group display name. For service principals, the application display name.
    Required.'
  name: principal_name
  types:
  - <xref:str>
- description: 'The type of the Entra ID principal. Required. Known values are:

    "Unknown", "User", "Group", and "ServicePrincipal".'
  name: principal_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.horizondb.models.PrincipalTypes>
- description: 'The Entra ID object identifier of the principal (an RFC 4122 GUID).
    On PUT

    requests, this value comes from the URI path parameter.'
  name: object_id
  types:
  - <xref:str>
- description: 'The Entra ID tenant identifier (an RFC 4122 GUID). If omitted, defaults
    to the

    tenant of the subscription.'
  name: tenant_id
  types:
  - <xref:str>
- description: 'The provisioning state of the administrator. Known values are:

    "Succeeded", "Failed", "Canceled", "InProgress", and "Provisioning".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.horizondb.models.ProvisioningState>
attributes:
- uid: azure.mgmt.horizondb.models.HorizonDbAdministratorProperties.object_id
  name: object_id
  summary: 'The Entra ID object identifier of the principal (an RFC 4122 GUID). On
    PUT requests, this value

    comes from the URI path parameter.'
  signature: 'object_id: str | None'
- uid: azure.mgmt.horizondb.models.HorizonDbAdministratorProperties.principal_name
  name: principal_name
  summary: 'The display name or UPN of the Entra ID principal. For users, typically
    the User Principal Name

    (e.g., <xref:mailto:admin@contoso.com>). For groups, the group display name.

    For service principals, the application display name. Required.'
  signature: 'principal_name: str'
- uid: azure.mgmt.horizondb.models.HorizonDbAdministratorProperties.principal_type
  name: principal_type
  summary: '"Unknown", "User",

    "Group", and "ServicePrincipal".'
  signature: 'principal_type: str | _models.PrincipalTypes'
- uid: azure.mgmt.horizondb.models.HorizonDbAdministratorProperties.provisioning_state
  name: provisioning_state
  summary: '"Succeeded", "Failed",

    "Canceled", "InProgress", and "Provisioning".'
  signature: 'provisioning_state: str | _models.ProvisioningState | None'
