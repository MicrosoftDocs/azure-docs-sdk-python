### YamlMime:PythonClass
uid: azure.mgmt.horizondb.types.HorizonDbClusterProperties
name: HorizonDbClusterProperties
fullName: azure.mgmt.horizondb.types.HorizonDbClusterProperties
module: azure.mgmt.horizondb.types
summary: Properties of a HorizonDB cluster.
constructor:
  syntax: HorizonDbClusterProperties()
variables:
- description: The administrator login name. Required.
  name: administratorLogin
  types:
  - <xref:str>
- description: The administrator login password.
  name: administratorLoginPassword
  types:
  - <xref:str>
- description: The version of the HorizonDB cluster.
  name: version
  types:
  - <xref:str>
- description: 'The mode to create a new HorizonDB cluster. Known values are: "Create",

    "Update", and "PointInTimeRestore".'
  name: createMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CreateModeCluster">]
- description: Restore point creation time specifying the time to restore from.
  name: pointInTimeUTC
  types:
  - <xref:str>
- description: The source cluster resource ID for restore or replica creation.
  name: sourceClusterResourceId
  types:
  - <xref:str>
- description: The pool name for restore or replica operations.
  name: poolName
  types:
  - <xref:str>
- description: Number of replicas.
  name: replicaCount
  types:
  - <xref:int>
- description: Number of vCores.
  name: vCores
  types:
  - <xref:int>
- description: The processor type for the HorizonDB cluster.
  name: processorType
  types:
  - <xref:str>
- description: The network related info.
  name: network
  types:
  - <xref:<xref:"Network">>
- description: 'Current state of the cluster. Known values are: "Ready", "Dropping",
    "Disabled",

    "Starting", "Stopping", "Stopped", "Updating", "Healthy", "Succeeded", and "Upgrading".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"State">]
- description: The fully qualified domain name of the cluster.
  name: fullyQualifiedDomainName
  types:
  - <xref:str>
- description: 'The fully qualified domain name used for readonly endpoint for the

    cluster.'
  name: readonlyEndpoint
  types:
  - <xref:str>
- description: 'The provisioning state of the cluster. Known values are: "Succeeded",

    "Failed", "Canceled", "InProgress", and "Provisioning".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Defines how replicas are placed across availability zones. Known

    values are: "Strict" and "BestEffort".'
  name: zonePlacementPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ZonePlacementPolicy">]
- description: Defines connection to a parameter group.
  name: parameterGroup
  types:
  - <xref:<xref:"HorizonDbClusterParameterGroupConnectionProperties">>
- description: Authentication configuration for the HorizonDB cluster.
  name: authConfig
  types:
  - <xref:<xref:"HorizonDbClusterAuthConfig">>
- description: The compute model for the cluster.
  name: computeModel
  types:
  - <xref:<xref:"HorizonDbComputeModel">>
- description: Mirroring configuration for the HorizonDB cluster.
  name: mirroring
  types:
  - <xref:<xref:"HorizonDbClusterMirroring">>
