### YamlMime:PythonClass
uid: azure.mgmt.horizondb.types.HorizonDbAdministratorPropertiesForAdd
name: HorizonDbAdministratorPropertiesForAdd
fullName: azure.mgmt.horizondb.types.HorizonDbAdministratorPropertiesForAdd
module: azure.mgmt.horizondb.types
summary: The properties for adding a HorizonDB administrator.
constructor:
  syntax: HorizonDbAdministratorPropertiesForAdd()
variables:
- description: 'The display name or UPN of the Entra ID principal. For users, typically

    the User Principal Name (e.g., <xref:mailto:admin@contoso.com>). For groups,

    the group display name. For service principals, the application display name.
    Required.'
  name: principalName
  types:
  - <xref:str>
- description: 'The type of the Entra ID principal. Required. Known values are: "Unknown",

    "User", "Group", and "ServicePrincipal".'
  name: principalType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PrincipalTypes">]
- description: 'The Entra ID tenant identifier (an RFC 4122 GUID). If omitted, defaults
    to the

    tenant of the subscription.'
  name: tenantId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.horizondb.types.HorizonDbAdministratorPropertiesForAdd.principalName
  name: principalName
  summary: 'The display name or UPN of the Entra ID principal. For users, typically
    the User Principal Name

    (e.g., <xref:mailto:admin@contoso.com>). For groups, the group display name.

    For service principals, the application display name. Required.'
  signature: 'principalName: Required[str]'
- uid: azure.mgmt.horizondb.types.HorizonDbAdministratorPropertiesForAdd.principalType
  name: principalType
  summary: '"Unknown", "User",

    "Group", and "ServicePrincipal".'
  signature: 'principalType: Required[str | PrincipalTypes]'
- uid: azure.mgmt.horizondb.types.HorizonDbAdministratorPropertiesForAdd.tenantId
  name: tenantId
  summary: 'The Entra ID tenant identifier (an RFC 4122 GUID). If omitted, defaults
    to the tenant of the

    subscription.'
  signature: 'tenantId: str'
