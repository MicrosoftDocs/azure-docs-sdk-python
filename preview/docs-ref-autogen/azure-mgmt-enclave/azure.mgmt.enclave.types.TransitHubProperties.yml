### YamlMime:PythonClass
uid: azure.mgmt.enclave.types.TransitHubProperties
name: TransitHubProperties
fullName: azure.mgmt.enclave.types.TransitHubProperties
module: azure.mgmt.enclave.types
summary: Describes the properties of an Transit Hub.
constructor:
  syntax: TransitHubProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Accepted", "Creating", "Deleting", "NotSpecified", "Running",
    and

    "Updating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The state of the transitHub. Known values are: "PendingApproval",
    "Approved",

    "PendingUpdate", "Active", and "Failed".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TransitHubState">]
- description: The TransitOption of the transitHub.
  name: transit_option
  types:
  - <xref:<xref:"TransitOption">>
- description: List of resource ids modified by transitHubs.
  name: resource_collection
  types:
  - <xref:list>[<xref:str>]
- description: 'Specifies the security provider for the transit hub. Known values
    are:

    "None" and "AzureFirewall".'
  name: security_provider
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityProvider">]
attributes:
- uid: azure.mgmt.enclave.types.TransitHubProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Accepted", "Creating", "Deleting", "NotSpecified", "Running", and "Updating".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.enclave.types.TransitHubProperties.resourceCollection
  name: resourceCollection
  summary: List of resource ids modified by transitHubs.
  signature: 'resourceCollection: list[str]'
- uid: azure.mgmt.enclave.types.TransitHubProperties.securityProvider
  name: securityProvider
  summary: '"None" and

    "AzureFirewall".'
  signature: 'securityProvider: str | SecurityProvider'
- uid: azure.mgmt.enclave.types.TransitHubProperties.state
  name: state
  summary: '"PendingApproval", "Approved",

    "PendingUpdate", "Active", and "Failed".'
  signature: 'state: str | TransitHubState'
- uid: azure.mgmt.enclave.types.TransitHubProperties.transitOption
  name: transitOption
  summary: The TransitOption of the transitHub.
  signature: 'transitOption: TransitOption'
