uid: azure.mgmt.enclave.types.RoleAssignmentItem
name: RoleAssignmentItem
fullName: azure.mgmt.enclave.types.RoleAssignmentItem
module: azure.mgmt.enclave.types
summary: Role assignment item that indicates which principals should be assigned this
  role definition.
constructor:
  syntax: RoleAssignmentItem()
variables:
- description: Role definition identifier. Required.
  name: role_definition_id
  types:
  - <xref:str>
- description: List of principal IDs to which to assign this role definition.
  name: principals
  types:
  - <xref:list>[<xref:"Principal">]
- description: Condition under which the principal can be granted permission.
  name: condition
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.enclave.types.RoleAssignmentItem.condition
  name: condition
  summary: Condition under which the principal can be granted permission.
  signature: 'condition: str'
- uid: azure.mgmt.enclave.types.RoleAssignmentItem.principals
  name: principals
  summary: List of principal IDs to which to assign this role definition.
  signature: 'principals: list[azure.mgmt.enclave.types.Principal]'
- uid: azure.mgmt.enclave.types.RoleAssignmentItem.roleDefinitionId
  name: roleDefinitionId
  summary: Role definition identifier. Required.
  signature: 'roleDefinitionId: str'
