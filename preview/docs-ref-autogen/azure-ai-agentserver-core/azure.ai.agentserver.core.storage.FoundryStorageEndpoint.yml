### YamlMime:PythonClass
uid: azure.ai.agentserver.core.storage.FoundryStorageEndpoint
name: FoundryStorageEndpoint
fullName: azure.ai.agentserver.core.storage.FoundryStorageEndpoint
module: azure.ai.agentserver.core.storage
summary: '> [!NOTE]

  > This is an experimental class, and may change at any time. Please see [https://aka.ms/azure-ai-agentserver-experimental](https://aka.ms/azure-ai-agentserver-experimental)
  for more information.

  >


  Immutable Foundry storage endpoint configuration.'
constructor:
  syntax: 'FoundryStorageEndpoint(*, storage_base_url: str, api_version: str = ''v1'')'
  parameters:
  - name: storage_base_url
    description: Fully-qualified `.../storage/` base URL.
    isRequired: true
    types:
    - <xref:str>
  - name: api_version
    description: Storage API version appended to every request URL.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: storage_base_url
    isRequired: true
  - name: api_version
    defaultValue: v1
methods:
- uid: azure.ai.agentserver.core.storage.FoundryStorageEndpoint.build_url
  name: build_url
  summary: Build a full storage API URL for *path* with `api-version` appended.
  signature: 'build_url(path: str, **extra_params: str) -> str'
  parameters:
  - name: path
    isRequired: true
- uid: azure.ai.agentserver.core.storage.FoundryStorageEndpoint.from_endpoint
  name: from_endpoint
  summary: Create an endpoint from an explicit Foundry project endpoint URL.
  signature: 'from_endpoint(endpoint: str, *, api_version: str = ''v1'') -> FoundryStorageEndpoint'
  parameters:
  - name: endpoint
    isRequired: true
  keywordOnlyParameters:
  - name: api_version
    defaultValue: v1
- uid: azure.ai.agentserver.core.storage.FoundryStorageEndpoint.from_env
  name: from_env
  summary: Create an endpoint by reading the `FOUNDRY_PROJECT_ENDPOINT` environment
    variable.
  signature: 'from_env(*, api_version: str = ''v1'') -> FoundryStorageEndpoint'
  keywordOnlyParameters:
  - name: api_version
    defaultValue: v1
