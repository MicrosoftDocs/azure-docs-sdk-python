### YamlMime:PythonClass
uid: azure.ai.agentserver.core.storage.FoundryStorageClient
name: FoundryStorageClient
fullName: azure.ai.agentserver.core.storage.FoundryStorageClient
module: azure.ai.agentserver.core.storage
summary: Base HTTP client for the Foundry storage API.
constructor:
  syntax: 'FoundryStorageClient(credential: AsyncTokenCredential, endpoint: FoundryStorageEndpoint,
    *, get_server_version: Callable[[], str] | None = None, sdk_moniker: str | None
    = None, **kwargs: Any)'
  parameters:
  - name: credential
    description: An async credential used to obtain bearer tokens.
    isRequired: true
    types:
    - <xref:AsyncTokenCredential>
  - name: endpoint
    description: Resolved Foundry storage endpoint configuration.
    isRequired: true
    types:
    - <xref:azure.ai.agentserver.core.storage.FoundryStorageEndpoint>
  - name: get_server_version
    description: 'Optional callable returning the server version

      string to use as the `User-Agent` header, evaluated lazily on each

      request. When `None`, Azure Core''s default `UserAgentPolicy` is used.'
    isRequired: true
    types:
    - <xref:typing.Callable>[[], <xref:str>] | <xref:None>
  - name: sdk_moniker
    description: 'SDK moniker for the default `UserAgentPolicy`. Ignored

      when *get_server_version* is supplied.'
    isRequired: true
    types:
    - <xref:str> | <xref:None>
  keywordOnlyParameters:
  - name: get_server_version
    defaultValue: None
  - name: sdk_moniker
    defaultValue: None
methods:
- uid: azure.ai.agentserver.core.storage.FoundryStorageClient.aclose
  name: aclose
  summary: Close the underlying HTTP pipeline client.
  signature: async aclose() -> None
