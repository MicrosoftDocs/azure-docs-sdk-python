### YamlMime:PythonClass
uid: azure.ai.agentserver.core.streaming.EventStreamNotFoundError
name: EventStreamNotFoundError
fullName: azure.ai.agentserver.core.streaming.EventStreamNotFoundError
module: azure.ai.agentserver.core.streaming
summary: "Raised when any operation references a stream id that is not\ncurrently\
  \ a live stream.\n\nunified the previously-distinct\n`EventStreamNotFoundError`\
  \ (never registered) and\n`EventStreamGoneError` (registered then destroyed) into\
  \ this\nsingle error type. Three independent reasons fire this:\n\n* the id was\
  \ never registered (no `get_or_create(id)` ever ran) \n\n* the id was explicitly\
  \ deleted via `streams.delete(id)` \n\n* the id's stream was Closed and its close-clock\
  \ TTL (`close_time + ttl_seconds`) elapsed, causing the registry to auto-tombstone\
  \ \n\nCollapsing the two error types simplifies the developer-facing\nsurface: either\
  \ way, the right behavior is the same (subscribe to\na new id, or treat this id\
  \ as missing). It also stops leaking the\nregistry's internal tombstone bookkeeping\
  \ (whether an id was\n\"previously alive\" or \"never seen\") into the public API.\n\
  \nWire-mapped to HTTP 404 Not Found."
