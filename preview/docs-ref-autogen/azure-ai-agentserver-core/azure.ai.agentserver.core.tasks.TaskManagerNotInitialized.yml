uid: azure.ai.agentserver.core.tasks.TaskManagerNotInitialized
name: TaskManagerNotInitialized
fullName: azure.ai.agentserver.core.tasks.TaskManagerNotInitialized
module: azure.ai.agentserver.core.tasks
summary: "Raised when a resilient-task operation is attempted with no installed manager.\n\
  \nSignals that the resilient-task subsystem is not available in the current\nprocess\
  \ \u2014 for example an in-process test harness that never ran the server\nlifespan,\
  \ or a deployment where the manager failed to initialize at boot.\nSubclasses <xref:RuntimeError>\
  \ for backward compatibility with callers\nthat catch the broader type."
