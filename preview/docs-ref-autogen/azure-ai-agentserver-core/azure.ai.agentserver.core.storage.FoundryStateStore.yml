### YamlMime:PythonClass
uid: azure.ai.agentserver.core.storage.FoundryStateStore
name: FoundryStateStore
fullName: azure.ai.agentserver.core.storage.FoundryStateStore
module: azure.ai.agentserver.core.storage
summary: "> [!NOTE]\n> This is an experimental class, and may change at any time.\
  \ Please see [https://aka.ms/azure-ai-agentserver-experimental](https://aka.ms/azure-ai-agentserver-experimental)\
  \ for more information.\n>\n\nDeveloper-facing client for one explicit Foundry state\
  \ store.\n\nThe instance is bound to a single caller-chosen store `name`. Session\
  \ or\nconversation scoping is expressed by encoding that identity into the store\n\
  name itself (for example `checkpoints/<conversation-id>`), matching spec\nPR 247's\
  \ removal of built-in session isolation.\n\nPrefer <xref:azure.ai.agentserver.core.storage.FoundryStateStore.get_or_create>\
  \ over the constructor: it resolves (or creates)\nthe store's server-side resource\
  \ in one call, so you never need a separate\nlifecycle step before reading or writing\
  \ items:\n\n<!-- literal_block {\"ids\": [], \"classes\": [], \"names\": [], \"\
  dupnames\": [], \"backrefs\": [], \"xml:space\": \"preserve\", \"language\": \"\
  default\", \"force\": false, \"linenos\": false} -->\n\n````default\n\n   store\
  \ = await FoundryStateStore.get_or_create(\"checkpoints/thread-abc\")\n   await\
  \ store.set_item(\"step-1\", {\"done\": False})\n   ````\n\nStore-level operations\
  \ (<xref:azure.ai.agentserver.core.storage.FoundryStateStore.get>, <xref:azure.ai.agentserver.core.storage.FoundryStateStore.update>,\
  \ <xref:azure.ai.agentserver.core.storage.FoundryStateStore.delete>) act on\nthe\
  \ bound store itself. The explicit `*_item` methods\n(<xref:azure.ai.agentserver.core.storage.FoundryStateStore.create_item>,\
  \ <xref:azure.ai.agentserver.core.storage.FoundryStateStore.get_item>, <xref:azure.ai.agentserver.core.storage.FoundryStateStore.set_item>,\n\
  <xref:azure.ai.agentserver.core.storage.FoundryStateStore.delete_item>, <xref:azure.ai.agentserver.core.storage.FoundryStateStore.list_keys>)\
  \ act on individual items within it.\n\nCreate a store-bound durable state-store\
  \ client.\n\nPrefer <xref:azure.ai.agentserver.core.storage.FoundryStateStore.get_or_create>,\
  \ which also resolves the server-side store\nresource; use the constructor directly\
  \ only when you already know the\nstore exists and want to skip that round trip."
constructor:
  syntax: 'FoundryStateStore(name: str, credential: AsyncTokenCredential | None =
    None, endpoint: FoundryStorageEndpoint | str | None = None, *, user_isolation:
    bool = False, item_ttl_seconds: int = 2592000, description: str | None = None,
    tags: Mapping[str, str] | None = None, user_id: str | None = None, api_version:
    str = ''v1'', **kwargs: Any)'
  parameters:
  - name: name
    description: 'The logical state-store name. Encode conversation/thread

      identity into this name when you need that scope.'
    isRequired: true
    types:
    - <xref:str>
  - name: credential
    description: 'Async token credential. Defaults to

      `DefaultAzureCredential` when omitted.'
    defaultValue: None
    types:
    - <xref:AsyncTokenCredential> | <xref:None>
  - name: endpoint
    description: Foundry storage endpoint or project endpoint URL.
    defaultValue: None
    types:
    - <xref:azure.ai.agentserver.core.storage.FoundryStorageEndpoint> | <xref:str>
      | <xref:None>
  keywordOnlyParameters:
  - name: user_isolation
    description: 'Whether item operations should be partitioned

      per resolved user. Fixed at store creation; ignored if the store

      already exists.'
    defaultValue: 'False'
    types:
    - <xref:bool>
  - name: item_ttl_seconds
    description: 'Store-level default TTL inherited by every

      item. Fixed at store creation; ignored if the store already exists.'
    defaultValue: '2592000'
    types:
    - <xref:int>
  - name: description
    description: 'Optional mutable store description, set at

      creation. Change it later with <xref:azure.ai.agentserver.core.storage.FoundryStateStore.update>.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: tags
    description: 'Optional mutable store metadata tags, set at creation.

      Change them later with <xref:azure.ai.agentserver.core.storage.FoundryStateStore.update>.'
    defaultValue: None
    types:
    - <xref:collections.abc.Mapping>[<xref:str>, <xref:str>]
    - <xref:None>
  - name: user_id
    description: Delegated end-user identity for trusted callers.
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: api_version
    description: Storage API version.
    defaultValue: v1
    types:
    - <xref:str>
methods:
- uid: azure.ai.agentserver.core.storage.FoundryStateStore.aclose
  name: aclose
  summary: Close the pipeline client and any owned default credential.
  signature: async aclose() -> None
- uid: azure.ai.agentserver.core.storage.FoundryStateStore.create_item
  name: create_item
  summary: Create a new item and fail on duplicate keys.
  signature: 'async create_item(key: str, value: JSONObject, *, tags: Mapping[str,
    str] | None = None, call_id: str | None = None) -> StateStoreItemRef'
  parameters:
  - name: key
    description: The item key to create.
    isRequired: true
    types:
    - <xref:str>
  - name: value
    description: The item payload as a JSON object.
    isRequired: true
    types:
    - <xref:dict>[<xref:str>, <xref:any>]
  keywordOnlyParameters:
  - name: tags
    description: 'Optional string labels stored with the item and used to

      filter <xref:azure.ai.agentserver.core.storage.FoundryStateStore.list_keys>.'
    defaultValue: None
    types:
    - <xref:collections.abc.Mapping>[<xref:str>, <xref:str>]
    - <xref:None>
  - name: call_id
    description: 'Explicit Foundry call ID to forward. The default

      `None` uses the current request context.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  return:
    description: A reference to the created item.
    types:
    - <xref:azure.ai.agentserver.core.storage.StateStoreItemRef>
- uid: azure.ai.agentserver.core.storage.FoundryStateStore.delete
  name: delete
  summary: Delete the bound store, cascading to every item under it.
  signature: async delete() -> DeletedStateStore
  return:
    description: The deleted-store marker.
    types:
    - <xref:azure.ai.agentserver.core.storage.DeletedStateStore>
- uid: azure.ai.agentserver.core.storage.FoundryStateStore.delete_item
  name: delete_item
  summary: Delete one item by key.
  signature: 'async delete_item(key: str, *, if_match: str | None = None, call_id:
    str | None = None) -> DeletedStateStoreItem'
  parameters:
  - name: key
    description: The item key to delete.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: if_match
    description: Optional concurrency token.
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: call_id
    description: 'Explicit Foundry call ID to forward. The default

      `None` uses the current request context.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  return:
    description: The deleted-item marker.
    types:
    - <xref:azure.ai.agentserver.core.storage.DeletedStateStoreItem>
- uid: azure.ai.agentserver.core.storage.FoundryStateStore.get
  name: get
  summary: Fetch the bound store's own descriptor.
  signature: async get() -> StateStore
  return:
    description: The store descriptor.
    types:
    - <xref:azure.ai.agentserver.core.storage.StateStore>
  exceptions:
  - type: azure.ai.agentserver.core.storage.FoundryStorageNotFoundError
    description: If the store does not exist.
- uid: azure.ai.agentserver.core.storage.FoundryStateStore.get_item
  name: get_item
  summary: Fetch one item by key.
  signature: 'async get_item(key: str, *, call_id: str | None = None) -> StateStoreItem
    | None'
  parameters:
  - name: key
    description: The item key to fetch.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: call_id
    description: 'Explicit Foundry call ID to forward. The default

      `None` uses the current request context.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  return:
    description: The item, or `None` if it does not exist.
    types:
    - <xref:azure.ai.agentserver.core.storage.StateStoreItem>
    - <xref:None>
- uid: azure.ai.agentserver.core.storage.FoundryStateStore.get_or_create
  name: get_or_create
  summary: 'Return a client bound to *name*, creating the store if needed.


    This is the recommended entry point: it resolves the server-side store

    resource in one call (fetch, or create on first use) so callers never

    need a separate lifecycle step before reading or writing items.'
  signature: 'async classmethod get_or_create(name: str, credential: AsyncTokenCredential
    | None = None, endpoint: FoundryStorageEndpoint | str | None = None, *, user_isolation:
    bool = False, item_ttl_seconds: int = 2592000, description: str | None = None,
    tags: Mapping[str, str] | None = None, user_id: str | None = None, api_version:
    str = ''v1'', **kwargs: Any) -> FoundryStateStore'
  parameters:
  - name: name
    description: The logical state-store name. See the constructor.
    isRequired: true
    types:
    - <xref:str>
  - name: credential
    description: Async token credential. See the constructor.
    defaultValue: None
    types:
    - <xref:AsyncTokenCredential> | <xref:None>
  - name: endpoint
    description: Foundry storage endpoint or project endpoint URL.
    defaultValue: None
    types:
    - <xref:azure.ai.agentserver.core.storage.FoundryStorageEndpoint> | <xref:str>
      | <xref:None>
  keywordOnlyParameters:
  - name: user_isolation
    description: 'See the constructor. Only applied if the store

      does not already exist.'
    defaultValue: 'False'
    types:
    - <xref:bool>
  - name: item_ttl_seconds
    description: 'See the constructor. Only applied if the

      store does not already exist.'
    defaultValue: '2592000'
    types:
    - <xref:int>
  - name: description
    description: 'See the constructor. Only applied if the store

      does not already exist.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: tags
    description: 'See the constructor. Only applied if the store does not

      already exist.'
    defaultValue: None
    types:
    - <xref:collections.abc.Mapping>[<xref:str>, <xref:str>]
    - <xref:None>
  - name: user_id
    description: Delegated end-user identity for trusted callers.
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: api_version
    description: Storage API version.
    defaultValue: v1
    types:
    - <xref:str>
  return:
    description: The bound, ready-to-use store client.
    types:
    - <xref:azure.ai.agentserver.core.storage.FoundryStateStore>
- uid: azure.ai.agentserver.core.storage.FoundryStateStore.list_keys
  name: list_keys
  summary: List keys within the bound store.
  signature: 'async list_keys(*, tags: Mapping[str, str] | None = None, limit: int
    | None = None, after: str | None = None, before: str | None = None, order: Literal[''asc'',
    ''desc''] = ''desc'', call_id: str | None = None) -> StateStoreItemKeyPage'
  keywordOnlyParameters:
  - name: tags
    description: 'Optional tag filter; only keys whose tags match every

      provided pair are returned.'
    defaultValue: None
    types:
    - <xref:collections.abc.Mapping>[<xref:str>, <xref:str>]
    - <xref:None>
  - name: limit
    description: Optional maximum number of keys to return in the page.
    defaultValue: None
    types:
    - <xref:int>
    - <xref:None>
  - name: after
    description: 'Return keys ordered after this cursor. Mutually exclusive

      with `before`.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: before
    description: 'Return keys ordered before this cursor. Mutually

      exclusive with `after`.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: order
    description: Sort order, `"asc"` or `"desc"` (default `"desc"`).
    defaultValue: desc
    types:
    - <xref:str>
  - name: call_id
    description: 'Explicit Foundry call ID to forward. The default

      `None` uses the current request context.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  return:
    description: A page of item keys.
    types:
    - <xref:azure.ai.agentserver.core.storage.StateStoreItemKeyPage>
- uid: azure.ai.agentserver.core.storage.FoundryStateStore.set_item
  name: set_item
  summary: Create or replace one item by key.
  signature: 'async set_item(key: str, value: JSONObject, *, tags: Mapping[str, str]
    | None = None, if_match: str | None = None, require_exists: bool = False, call_id:
    str | None = None) -> StateStoreItemRef'
  parameters:
  - name: key
    description: The item key to create or replace.
    isRequired: true
    types:
    - <xref:str>
  - name: value
    description: The item payload as a JSON object.
    isRequired: true
    types:
    - <xref:dict>[<xref:str>, <xref:any>]
  keywordOnlyParameters:
  - name: tags
    description: 'Optional string labels stored with the item and used to

      filter <xref:azure.ai.agentserver.core.storage.FoundryStateStore.list_keys>.'
    defaultValue: None
    types:
    - <xref:collections.abc.Mapping>[<xref:str>, <xref:str>]
    - <xref:None>
  - name: if_match
    description: 'Optional concurrency token; the write only succeeds

      when the current item ETag matches. Mutually exclusive with

      `require_exists`.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: require_exists
    description: 'When `True`, only replace an existing item and

      fail if the key is absent. Mutually exclusive with `if_match`.'
    defaultValue: 'False'
    types:
    - <xref:bool>
  - name: call_id
    description: 'Explicit Foundry call ID to forward. The default

      `None` uses the current request context.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  return:
    description: A reference to the created or replaced item.
    types:
    - <xref:azure.ai.agentserver.core.storage.StateStoreItemRef>
- uid: azure.ai.agentserver.core.storage.FoundryStateStore.update
  name: update
  summary: Update the bound store's mutable metadata (`description` / `tags`).
  signature: 'async update(*, description: str | None | object = <object object>,
    tags: ~collections.abc.Mapping[str, str] | None | object = <object object>) ->
    StateStore'
  keywordOnlyParameters:
  - name: description
    description: 'The new description, or `None` to clear it.

      Omit to leave the description unchanged.'
    defaultValue: <object object at 0x000001E183787F00>
    types:
    - <xref:str>
    - <xref:None>
  - name: tags
    description: 'The new tags (replaces the existing set wholesale), or

      `None` to clear them. Omit to leave the tags unchanged.'
    defaultValue: <object object at 0x000001E183787F00>
    types:
    - <xref:collections.abc.Mapping>[<xref:str>, <xref:str>]
    - <xref:None>
  return:
    description: The updated store descriptor.
    types:
    - <xref:azure.ai.agentserver.core.storage.StateStore>
attributes:
- uid: azure.ai.agentserver.core.storage.FoundryStateStore.name
  name: name
  summary: Return the logical store name bound to this client.
