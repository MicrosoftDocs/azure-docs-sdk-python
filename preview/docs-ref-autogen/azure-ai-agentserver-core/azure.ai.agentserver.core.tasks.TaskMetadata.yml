### YamlMime:PythonClass
uid: azure.ai.agentserver.core.tasks.TaskMetadata
name: TaskMetadata
fullName: azure.ai.agentserver.core.tasks.TaskMetadata
module: azure.ai.agentserver.core.tasks
summary: "Mutable progress dict persisted to the task record's payload.\n\nThe default\
  \ namespace exposes a `MutableMapping` interface\ndirectly. Named namespaces are\
  \ accessed via the **callable**\nprotocol \u2014 `meta(name)` returns a sibling\
  \ namespace facade."
constructor:
  syntax: 'TaskMetadata(initial: dict[str, Any] | None = None, *, flush_callback:
    Callable[[str | None, dict[str, Any]], Awaitable[None]] | None = None, _namespace_name:
    str | None = None, _registry: dict[Optional[str], azure.ai.agentserver.core.tasks._metadata.TaskMetadata]
    | None = None)'
  parameters:
  - name: initial
    description: Initial values for the **default** namespace.
    defaultValue: None
    types:
    - <xref:dict>[<xref:str>, <xref:typing.Any>] | <xref:None>
  - name: flush_callback
    description: 'Async callable invoked by <xref:azure.ai.agentserver.core.tasks.TaskMetadata.flush>
      to

      persist dirty data. Signature: `(namespace, data)` where

      `namespace` is `None` for the default namespace and a

      `str` for named namespaces.'
    isRequired: true
    types:
    - <xref:NamespaceFlushCallback> | <xref:None>
  keywordOnlyParameters:
  - name: flush_callback
    defaultValue: None
  - name: _namespace_name
    defaultValue: None
  - name: _registry
    defaultValue: None
methods:
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.append
  name: append
  summary: 'Append a value to a list.


    Creates the list if the key is absent.'
  signature: 'append(key: str, value: Any) -> None'
  parameters:
  - name: key
    description: Metadata key.
    isRequired: true
    types:
    - <xref:str>
  - name: value
    description: Value to append.
    isRequired: true
    types:
    - <xref:typing.Any>
  exceptions:
  - type: TypeError
    description: If the existing value is not a list.
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.flush
  name: flush
  summary: 'Force-flush this namespace''s pending changes to storage.


    No-op if there are no pending changes in THIS namespace or no

    flush callback. Sibling namespaces are NOT touched.'
  signature: async flush() -> None
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.from_payload
  name: from_payload
  summary: "Construct a fresh <xref:azure.ai.agentserver.core.tasks.TaskMetadata>\
    \ from a recovered payload.\n\nDecodes the per-namespace persistence layout:\n\
    \n* `payload[\"metadata\"]` \u2192 default namespace. \n\n* `payload[\"metadata:<name>\"\
    ]` \u2192 named namespace `<name>`."
  signature: 'from_payload(payload: dict[str, Any] | None, *, flush_callback: Callable[[str
    | None, dict[str, Any]], Awaitable[None]] | None = None) -> TaskMetadata'
  parameters:
  - name: payload
    description: The task's payload dict (or `None`).
    isRequired: true
    types:
    - <xref:dict>[<xref:str>, <xref:typing.Any>] | <xref:None>
  keywordOnlyParameters:
  - name: flush_callback
    description: 'Per-namespace flush callback to wire into

      every restored namespace.'
    defaultValue: None
    types:
    - <xref:NamespaceFlushCallback> | <xref:None>
  return:
    description: 'A fully populated <xref:azure.ai.agentserver.core.tasks.TaskMetadata>
      with all named

      namespaces pre-vivified to their recovered state.'
    types:
    - <xref:azure.ai.agentserver.core.tasks.TaskMetadata>
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.get
  name: get
  summary: Get a value by key.
  signature: 'get(key: str, default: Any = None) -> Any'
  parameters:
  - name: key
    description: Metadata key.
    isRequired: true
    types:
    - <xref:str>
  - name: default
    description: Default value if key is absent.
    defaultValue: None
    types:
    - <xref:typing.Any>
  return:
    description: The value, or *default*.
    types:
    - <xref:typing.Any>
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.increment
  name: increment
  summary: Atomically increment a numeric value.
  signature: 'increment(key: str, delta: int = 1) -> None'
  parameters:
  - name: key
    description: Metadata key.
    isRequired: true
    types:
    - <xref:str>
  - name: delta
    description: Amount to add (default 1).
    defaultValue: '1'
    types:
    - <xref:int>
  exceptions:
  - type: TypeError
    description: If the existing value is not numeric.
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.items
  name: items
  summary: Return a view of metadata key-value pairs.
  signature: items() -> ItemsView[str, Any]
  return:
    description: A view of the metadata key-value pairs.
    types:
    - <xref:collections.abc.ItemsView>[<xref:str>, <xref:typing.Any>]
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.keys
  name: keys
  summary: Return a view of metadata keys.
  signature: keys() -> KeysView[str]
  return:
    description: A view of the metadata keys.
    types:
    - <xref:collections.abc.KeysView>[<xref:str>]
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.pop
  name: pop
  summary: If key is not found, d is returned if given, otherwise KeyError is raised.
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
  parameters:
  - name: key
    isRequired: true
  - name: default
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.popitem
  name: popitem
  summary: as a 2-tuple; but raise KeyError if D is empty.
  signature: popitem() -> (k, v), remove and return some (key, value) pair
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.set
  name: set
  summary: Set a key-value pair in this namespace.
  signature: 'set(key: str, value: Any) -> None'
  parameters:
  - name: key
    description: Metadata key (must be a string).
    isRequired: true
    types:
    - <xref:str>
  - name: value
    description: Any JSON-serializable value.
    isRequired: true
    types:
    - <xref:typing.Any>
  exceptions:
  - type: TypeError
    description: If key is not a string.
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.setdefault
  name: setdefault
  signature: setdefault(k, [d]) -> D.get(k,d), also set D[k]=d if k not in D
  parameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.to_dict
  name: to_dict
  summary: Return a snapshot of this namespace's data.
  signature: to_dict() -> dict[str, Any]
  return:
    description: A shallow copy of the namespace's dict.
    types:
    - <xref:dict>[<xref:str>, <xref:typing.Any>]
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.update
  name: update
  summary: 'If E present and has a .keys() method, does:     for k in E.keys(): D[k]
    = E[k]

    If E present and lacks .keys() method, does:     for (k, v) in E: D[k] = v

    In either case, this is followed by: for k, v in F.items(): D[k] = v'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
  positionalOnlyParameters:
  - name: other
    defaultValue: ()
- uid: azure.ai.agentserver.core.tasks.TaskMetadata.values
  name: values
  summary: Return a view of metadata values.
  signature: values() -> ValuesView[Any]
  return:
    description: A view of the metadata values.
    types:
    - <xref:collections.abc.ValuesView>[<xref:typing.Any>]
