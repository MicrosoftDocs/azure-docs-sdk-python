### YamlMime:PythonClass
uid: azure.mgmt.eventhub.types.EventhubProperties
name: EventhubProperties
fullName: azure.mgmt.eventhub.types.EventhubProperties
module: azure.mgmt.eventhub.types
summary: Properties supplied to the Create Or Update Event Hub operation.
constructor:
  syntax: EventhubProperties()
variables:
- description: Current number of shards on the Event Hub.
  name: partition_ids
  types:
  - <xref:list>[<xref:str>]
- description: Exact time the Event Hub was created.
  name: created_at
  types:
  - <xref:str>
- description: The exact time the message was updated.
  name: updated_at
  types:
  - <xref:str>
- description: 'Number of days to retain the events for this Event Hub, value

    should be 1 to 7 days.'
  name: message_retention_in_days
  types:
  - <xref:int>
- description: 'Number of partitions created for the Event Hub, allowed values are
    from

    1 to 32 partitions.'
  name: partition_count
  types:
  - <xref:int>
- description: 'Enumerates the possible values for the status of the Event Hub. Known
    values are:

    "Active", "Disabled", "Restoring", "SendDisabled", "ReceiveDisabled", "Creating",
    "Deleting",

    "Renaming", and "Unknown".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EntityStatus">]
- description: Properties of capture description.
  name: capture_description
  types:
  - <xref:<xref:"CaptureDescription">>
- description: Event Hub retention settings.
  name: retention_description
  types:
  - <xref:<xref:"RetentionDescription">>
- description: Properties of MessageTimestamp Description.
  name: message_timestamp_description
  types:
  - <xref:<xref:"MessageTimestampDescription">>
- description: 'Denotes the unique identifier for event hub and is generated by service
    while

    creating topic. This identifier can be used in kafka runtime apis wherever a UUID
    is required

    e.g Fetch & Delete Topic. This identifier is not supported in AMQP runtime operations
    yet.'
  name: identifier
  types:
  - <xref:str>
- description: Gets and Sets Metadata of User.
  name: user_metadata
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.eventhub.types.EventhubProperties.captureDescription
  name: captureDescription
  summary: Properties of capture description.
  signature: 'captureDescription: CaptureDescription'
- uid: azure.mgmt.eventhub.types.EventhubProperties.createdAt
  name: createdAt
  summary: Exact time the Event Hub was created.
  signature: 'createdAt: str'
- uid: azure.mgmt.eventhub.types.EventhubProperties.identifier
  name: identifier
  summary: 'Denotes the unique identifier for event hub and is generated by service
    while creating topic.

    This identifier can be used in kafka runtime apis wherever a UUID is required
    e.g Fetch &

    Delete Topic. This identifier is not supported in AMQP runtime operations yet.'
  signature: 'identifier: str'
- uid: azure.mgmt.eventhub.types.EventhubProperties.messageRetentionInDays
  name: messageRetentionInDays
  summary: Number of days to retain the events for this Event Hub, value should be
    1 to 7 days.
  signature: 'messageRetentionInDays: int'
- uid: azure.mgmt.eventhub.types.EventhubProperties.messageTimestampDescription
  name: messageTimestampDescription
  summary: Properties of MessageTimestamp Description.
  signature: 'messageTimestampDescription: MessageTimestampDescription'
- uid: azure.mgmt.eventhub.types.EventhubProperties.partitionCount
  name: partitionCount
  summary: Number of partitions created for the Event Hub, allowed values are from
    1 to 32 partitions.
  signature: 'partitionCount: int'
- uid: azure.mgmt.eventhub.types.EventhubProperties.partitionIds
  name: partitionIds
  summary: Current number of shards on the Event Hub.
  signature: 'partitionIds: list[str]'
- uid: azure.mgmt.eventhub.types.EventhubProperties.retentionDescription
  name: retentionDescription
  summary: Event Hub retention settings.
  signature: 'retentionDescription: RetentionDescription'
- uid: azure.mgmt.eventhub.types.EventhubProperties.status
  name: status
  summary: '"Active",

    "Disabled", "Restoring", "SendDisabled", "ReceiveDisabled", "Creating", "Deleting",

    "Renaming", and "Unknown".'
  signature: 'status: str | EntityStatus'
- uid: azure.mgmt.eventhub.types.EventhubProperties.updatedAt
  name: updatedAt
  summary: The exact time the message was updated.
  signature: 'updatedAt: str'
- uid: azure.mgmt.eventhub.types.EventhubProperties.userMetadata
  name: userMetadata
  summary: Gets and Sets Metadata of User.
  signature: 'userMetadata: str'
