### YamlMime:PythonClass
uid: azure.mgmt.eventhub.types.CaptureDescription
name: CaptureDescription
fullName: azure.mgmt.eventhub.types.CaptureDescription
module: azure.mgmt.eventhub.types
summary: Properties to configure capture description for eventhub.
constructor:
  syntax: CaptureDescription()
variables:
- description: A value that indicates whether capture description is enabled.
  name: enabled
  types:
  - <xref:bool>
- description: 'Enumerates the possible values for the encoding format of capture
    description.

    Note: ''AvroDeflate'' will be deprecated in New API Version. Known values are:
    "Avro" and

    "AvroDeflate".'
  name: encoding
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EncodingCaptureDescription">]
- description: 'The time window allows you to set the frequency with which the

    capture to Azure Blobs will happen, value should between 60 to 900 seconds.'
  name: interval_in_seconds
  types:
  - <xref:int>
- description: 'The size window defines the amount of data built up in your Event

    Hub before an capture operation, value should be between 10485760 to 524288000
    bytes.'
  name: size_limit_in_bytes
  types:
  - <xref:int>
- description: 'Properties of Destination where capture will be stored. (Storage Account,

    Blob Names).'
  name: destination
  types:
  - <xref:<xref:"Destination">>
- description: A value that indicates whether to Skip Empty Archives.
  name: skip_empty_archives
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.eventhub.types.CaptureDescription.destination
  name: destination
  summary: Properties of Destination where capture will be stored. (Storage Account,
    Blob Names).
  signature: 'destination: Destination'
- uid: azure.mgmt.eventhub.types.CaptureDescription.enabled
  name: enabled
  summary: A value that indicates whether capture description is enabled.
  signature: 'enabled: bool'
- uid: azure.mgmt.eventhub.types.CaptureDescription.encoding
  name: encoding
  summary: 'Enumerates the possible values for the encoding format of capture description.
    Note:

    ''AvroDeflate'' will be deprecated in New API Version. Known values are: "Avro"
    and

    "AvroDeflate".'
  signature: 'encoding: str | EncodingCaptureDescription'
- uid: azure.mgmt.eventhub.types.CaptureDescription.intervalInSeconds
  name: intervalInSeconds
  summary: 'The time window allows you to set the frequency with which the capture
    to Azure Blobs will

    happen, value should between 60 to 900 seconds.'
  signature: 'intervalInSeconds: int'
- uid: azure.mgmt.eventhub.types.CaptureDescription.sizeLimitInBytes
  name: sizeLimitInBytes
  summary: 'The size window defines the amount of data built up in your Event Hub
    before an capture

    operation, value should be between 10485760 to 524288000 bytes.'
  signature: 'sizeLimitInBytes: int'
- uid: azure.mgmt.eventhub.types.CaptureDescription.skipEmptyArchives
  name: skipEmptyArchives
  summary: A value that indicates whether to Skip Empty Archives.
  signature: 'skipEmptyArchives: bool'
