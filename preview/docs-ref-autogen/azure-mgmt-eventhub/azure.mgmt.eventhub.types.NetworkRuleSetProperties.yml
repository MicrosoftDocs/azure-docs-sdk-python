  name: trustedServiceAccessEnabled
  summary: Value that indicates whether Trusted Service Access is Enabled or not.
  signature: 'trustedServiceAccessEnabled: bool'
- uid: azure.mgmt.eventhub.types.NetworkRuleSetProperties.virtualNetworkRules
  name: virtualNetworkRules
  summary: List VirtualNetwork Rules.
  signature: 'virtualNetworkRules: list[''NWRuleSetVirtualNetworkRules'']'
