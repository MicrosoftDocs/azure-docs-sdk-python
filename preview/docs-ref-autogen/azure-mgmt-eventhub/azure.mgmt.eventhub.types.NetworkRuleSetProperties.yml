uid: azure.mgmt.eventhub.types.NetworkRuleSetProperties
name: NetworkRuleSetProperties
fullName: azure.mgmt.eventhub.types.NetworkRuleSetProperties
module: azure.mgmt.eventhub.types
summary: NetworkRuleSet properties.
constructor:
  syntax: NetworkRuleSetProperties()
variables:
- description: 'Value that indicates whether Trusted Service Access is

    Enabled or not.'
  name: trusted_service_access_enabled
  types:
  - <xref:bool>
- description: 'Default Action for Network Rule Set. Known values are: "Allow" and

    "Deny".'
  name: default_action
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DefaultAction">]
- description: List VirtualNetwork Rules.
  name: virtual_network_rules
  types:
  - <xref:list>[<xref:"NWRuleSetVirtualNetworkRules">]
- description: List of IpRules.
  name: ip_rules
  types:
  - <xref:list>[<xref:"NWRuleSetIpRules">]
- description: 'This determines if traffic is allowed over public network. By

    default it is enabled. If value is SecuredByPerimeter then Inbound and Outbound
    communication

    is controlled by the network security perimeter and profile''s access rules. Known
    values are:

    "Enabled", "Disabled", and "SecuredByPerimeter".'
  name: public_network_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccessFlag">]
attributes:
- uid: azure.mgmt.eventhub.types.NetworkRuleSetProperties.defaultAction
  name: defaultAction
  summary: '"Allow" and "Deny".'
  signature: 'defaultAction: str | DefaultAction'
- uid: azure.mgmt.eventhub.types.NetworkRuleSetProperties.ipRules
  name: ipRules
  summary: List of IpRules.
  signature: 'ipRules: list[''NWRuleSetIpRules'']'
- uid: azure.mgmt.eventhub.types.NetworkRuleSetProperties.publicNetworkAccess
  name: publicNetworkAccess
  summary: 'This determines if traffic is allowed over public network. By default
    it is enabled. If value

    is SecuredByPerimeter then Inbound and Outbound communication is controlled by
    the network

