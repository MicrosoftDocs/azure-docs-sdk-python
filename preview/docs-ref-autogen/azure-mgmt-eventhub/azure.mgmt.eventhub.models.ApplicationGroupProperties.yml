summary: ApplicationGroupProperties.
constructor:
  syntax: 'ApplicationGroupProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'Determines if Application Group is allowed to create connection with

    namespace or not. Once the isEnabled is set to false, all the existing connections
    of

    application group gets dropped and no new connections will be allowed.'
  name: is_enabled
  types:
  - <xref:bool>
- description: 'The Unique identifier for application group.Supports

    SAS(SASKeyName=KeyName) or AAD(AADAppID=Guid). Required.'
  name: client_app_group_identifier
  types:
  - <xref:str>
- description: 'List of group policies that define the behavior of application group.
    The

    policies can support resource governance scenarios such as limiting ingress or
    egress traffic.'
  name: policies
  types:
  - <xref:list>[<xref:azure.mgmt.eventhub.models.ApplicationGroupPolicy>]
attributes:
- uid: azure.mgmt.eventhub.models.ApplicationGroupProperties.client_app_group_identifier
  name: client_app_group_identifier
