### YamlMime:PythonClass
uid: azure.mgmt.storagesync.types.TriggerChangeDetectionParameters
name: TriggerChangeDetectionParameters
fullName: azure.mgmt.storagesync.types.TriggerChangeDetectionParameters
module: azure.mgmt.storagesync.types
summary: The parameters used when calling trigger change detection action on cloud
  endpoint.
constructor:
  syntax: TriggerChangeDetectionParameters()
variables:
- description: 'Relative path to a directory Azure File share for which change detection

    is to be performed.'
  name: directory_path
  types:
  - <xref:str>
- description: 'Change Detection Mode. Applies to a directory specified in

    directoryPath parameter. Known values are: "Default" and "Recursive".'
  name: change_detection_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ChangeDetectionMode">]
- description: 'Array of relative paths on the Azure File share to be included in
    the change

    detection. Can be files and directories.'
  name: paths
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.storagesync.types.TriggerChangeDetectionParameters.changeDetectionMode
  name: changeDetectionMode
  summary: 'Change Detection Mode. Applies to a directory specified in directoryPath
    parameter. Known

    values are: "Default" and "Recursive".'
  signature: 'changeDetectionMode: str | ChangeDetectionMode'
- uid: azure.mgmt.storagesync.types.TriggerChangeDetectionParameters.directoryPath
  name: directoryPath
  summary: Relative path to a directory Azure File share for which change detection
    is to be performed.
  signature: 'directoryPath: str'
- uid: azure.mgmt.storagesync.types.TriggerChangeDetectionParameters.paths
  name: paths
  summary: 'Array of relative paths on the Azure File share to be included in the
    change detection. Can be

    files and directories.'
  signature: 'paths: list[str]'
