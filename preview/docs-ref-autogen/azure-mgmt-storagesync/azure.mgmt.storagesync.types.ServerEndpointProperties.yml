    values are: "ServerAuthoritative" and "Merge".'
  name: initial_upload_policy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"InitialUploadPolicy">]
- description: Server name.
  name: server_name
  types:
  - <xref:str>
- description: Server Endpoint provisioning status.
  name: server_endpoint_provisioning_status
  types:
  - <xref:<xref:"ServerEndpointProvisioningStatus">>
