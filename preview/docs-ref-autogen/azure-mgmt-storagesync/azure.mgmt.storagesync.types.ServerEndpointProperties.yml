  name: cloud_tiering_status
  types:
  - <xref:<xref:"ServerEndpointCloudTieringStatus">>
- description: Recall status. Only populated if cloud tiering is enabled.
  name: recall_status
  types:
  - <xref:<xref:"ServerEndpointRecallStatus">>
