uid: azure.mgmt.postgresqlflexibleservers.types.ConfigurationProperties
name: ConfigurationProperties
fullName: azure.mgmt.postgresqlflexibleservers.types.ConfigurationProperties
module: azure.mgmt.postgresqlflexibleservers.types
summary: Properties of a configuration (also known as server parameter).
constructor:
  syntax: ConfigurationProperties()
variables:
- description: 'Value of the configuration (also known as server parameter). Required
    to update

    the value assigned to a specific modifiable configuration.'
  name: value
  types:
  - <xref:str>
- description: Description of the configuration (also known as server parameter).
  name: description
  types:
  - <xref:str>
- description: 'Value assigned by default to the configuration (also known as server

    parameter).'
  name: defaultValue
  types:
  - <xref:str>
- description: 'Data type of the configuration (also known as server parameter). Known
    values

    are: "Boolean", "Numeric", "Integer", "Enumeration", "String", and "Set".'
  name: dataType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConfigurationDataType">]
- description: Allowed values of the configuration (also known as server parameter).
  name: allowedValues
  types:
  - <xref:str>
- description: 'Source of the value assigned to the configuration (also known as server

    parameter). Required to update the value assigned to a specific modifiable configuration.'
  name: source
  types:
  - <xref:str>
- description: 'Indicates if it''s a dynamic (true) or static (false) configuration
    (also

    known as server parameter). Static server parameters require a server restart
    after changing

    the value assigned to them, for the change to take effect. Dynamic server parameters
    do not

    require a server restart after changing the value assigned to them, for the change
    to take

    effect.'
  name: isDynamicConfig
  types:
  - <xref:bool>
- description: 'Indicates if it''s a read-only (true) or modifiable (false) configuration

    (also known as server parameter).'
  name: isReadOnly
  types:
  - <xref:bool>
- description: 'Indicates if the value assigned to the configuration (also known

    as server parameter) is pending a server restart for it to take effect.'
  name: isConfigPendingRestart
  types:
  - <xref:bool>
- description: 'Units in which the configuration (also known as server parameter)
    value is

    expressed.'
  name: unit
  types:
  - <xref:str>
- description: 'Link pointing to the documentation of the configuration (also known
    as

    server parameter).'
  name: documentationLink
  types:
  - <xref:str>
