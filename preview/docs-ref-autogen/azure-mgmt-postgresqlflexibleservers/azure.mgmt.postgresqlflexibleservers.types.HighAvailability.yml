### YamlMime:PythonClass
uid: azure.mgmt.postgresqlflexibleservers.types.HighAvailability
name: HighAvailability
fullName: azure.mgmt.postgresqlflexibleservers.types.HighAvailability
module: azure.mgmt.postgresqlflexibleservers.types
summary: High availability properties of a server.
constructor:
  syntax: HighAvailability()
variables:
- description: 'High availability mode for a server. Known values are: "Disabled",
    "ZoneRedundant",

    and "SameZone".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PostgreSqlFlexibleServerHighAvailabilityMode">]
- description: 'Possible states of the standby server created when high availability
    is set to

    SameZone or ZoneRedundant. Known values are: "NotEnabled", "CreatingStandby",

    "ReplicatingData", "FailingOver", "Healthy", "RemovingStandby", "RecreatingStandby",
    and

    "ComputeUpdatingByFailover".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HighAvailabilityState">]
- description: 'Availability zone associated to the standby server created when

    high availability is set to SameZone or ZoneRedundant.'
  name: standbyAvailabilityZone
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.postgresqlflexibleservers.types.HighAvailability.mode
  name: mode
  summary: '"Disabled", "ZoneRedundant", and

    "SameZone".'
  signature: 'mode: str | PostgreSqlFlexibleServerHighAvailabilityMode'
- uid: azure.mgmt.postgresqlflexibleservers.types.HighAvailability.standbyAvailabilityZone
  name: standbyAvailabilityZone
  summary: 'Availability zone associated to the standby server created when high availability
    is set to

    SameZone or ZoneRedundant.'
  signature: 'standbyAvailabilityZone: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.HighAvailability.state
  name: state
  summary: 'Possible states of the standby server created when high availability is
    set to SameZone or

    ZoneRedundant. Known values are: "NotEnabled", "CreatingStandby", "ReplicatingData",

    "FailingOver", "Healthy", "RemovingStandby", "RecreatingStandby", and

    "ComputeUpdatingByFailover".'
  signature: 'state: str | HighAvailabilityState'
