### YamlMime:PythonClass
uid: azure.mgmt.postgresqlflexibleservers.types.Storage
name: Storage
fullName: azure.mgmt.postgresqlflexibleservers.types.Storage
module: azure.mgmt.postgresqlflexibleservers.types
summary: Storage properties of a server.
constructor:
  syntax: Storage()
variables:
- description: Size of storage assigned to a server.
  name: storageSizeGB
  types:
  - <xref:int>
- description: 'Flag to enable or disable the automatic growth of storage size of
    a server when

    available space is nearing zero and conditions allow for automatically growing
    storage size.

    Known values are: "Enabled" and "Disabled".'
  name: autoGrow
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageAutoGrow">]
- description: 'Maximum allocated storage size to which storage autogrow may

    grow, in MB. This value is not a disk-utilization trigger threshold and must be
    at least the

    effective current or requested storage size. Storage conversion uses 1 GB = 1,024
    MB.'
  name: autoGrowMaxThresholdMb
  types:
  - <xref:int>
- description: 'Storage autogrow increment as a percentage of the current

    allocated storage size. This value is not an absolute size increment or a utilization

    threshold.'
  name: autoGrowIncrementPercent
  types:
  - <xref:int>
- description: 'Storage tier of a server. Known values are: "P1", "P2", "P3", "P4",
    "P6", "P10",

    "P15", "P20", "P30", "P40", "P50", "P60", "P70", and "P80".'
  name: tier
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureManagedDiskPerformanceTier">]
- description: 'Maximum IOPS supported for storage. Required when type of storage
    is PremiumV2_LRS

    or UltraSSD_LRS.'
  name: iops
  types:
  - <xref:int>
- description: 'Maximum throughput supported for storage. Required when type of storage
    is

    PremiumV2_LRS or UltraSSD_LRS.'
  name: throughput
  types:
  - <xref:int>
- description: 'Type of storage assigned to a server. Allowed values are Premium_LRS,

    PremiumV2_LRS, or UltraSSD_LRS. If not specified, it defaults to Premium_LRS.
    Known values are:

    "Premium_LRS", "PremiumV2_LRS", and "UltraSSD_LRS".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageType">]
attributes:
- uid: azure.mgmt.postgresqlflexibleservers.types.Storage.autoGrow
  name: autoGrow
  summary: 'Flag to enable or disable the automatic growth of storage size of a server
    when available space

    is nearing zero and conditions allow for automatically growing storage size. Known
    values are:

    "Enabled" and "Disabled".'
  signature: 'autoGrow: str | StorageAutoGrow'
- uid: azure.mgmt.postgresqlflexibleservers.types.Storage.autoGrowIncrementPercent
  name: autoGrowIncrementPercent
  summary: 'Storage autogrow increment as a percentage of the current allocated storage
    size. This value is

    not an absolute size increment or a utilization threshold.'
  signature: 'autoGrowIncrementPercent: int'
- uid: azure.mgmt.postgresqlflexibleservers.types.Storage.autoGrowMaxThresholdMb
  name: autoGrowMaxThresholdMb
  summary: 'Maximum allocated storage size to which storage autogrow may grow, in
    MB. This value is not a

    disk-utilization trigger threshold and must be at least the effective current
    or requested

    storage size. Storage conversion uses 1 GB = 1,024 MB.'
  signature: 'autoGrowMaxThresholdMb: int'
- uid: azure.mgmt.postgresqlflexibleservers.types.Storage.iops
  name: iops
  summary: 'Maximum IOPS supported for storage. Required when type of storage is PremiumV2_LRS
    or

    UltraSSD_LRS.'
  signature: 'iops: int'
- uid: azure.mgmt.postgresqlflexibleservers.types.Storage.storageSizeGB
  name: storageSizeGB
  summary: Size of storage assigned to a server.
  signature: 'storageSizeGB: int'
- uid: azure.mgmt.postgresqlflexibleservers.types.Storage.throughput
  name: throughput
  summary: 'Maximum throughput supported for storage. Required when type of storage
    is PremiumV2_LRS or

    UltraSSD_LRS.'
  signature: 'throughput: int'
- uid: azure.mgmt.postgresqlflexibleservers.types.Storage.tier
  name: tier
  summary: '"P1", "P2", "P3", "P4", "P6", "P10",

    "P15", "P20", "P30", "P40", "P50", "P60", "P70", and "P80".'
  signature: 'tier: str | AzureManagedDiskPerformanceTier'
- uid: azure.mgmt.postgresqlflexibleservers.types.Storage.type
  name: type
  summary: 'Type of storage assigned to a server. Allowed values are Premium_LRS,
    PremiumV2_LRS, or

    UltraSSD_LRS. If not specified, it defaults to Premium_LRS. Known values are:
    "Premium_LRS",

    "PremiumV2_LRS", and "UltraSSD_LRS".'
  signature: 'type: str | StorageType'
