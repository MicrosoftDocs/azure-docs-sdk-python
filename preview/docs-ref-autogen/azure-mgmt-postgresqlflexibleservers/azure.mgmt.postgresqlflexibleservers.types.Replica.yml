### YamlMime:PythonClass
uid: azure.mgmt.postgresqlflexibleservers.types.Replica
name: Replica
fullName: azure.mgmt.postgresqlflexibleservers.types.Replica
module: azure.mgmt.postgresqlflexibleservers.types
summary: Replica properties of a server.
constructor:
  syntax: Replica()
variables:
- description: 'Role of the server in a replication set. Known values are: "None",
    "Primary",

    "AsyncReplica", and "GeoAsyncReplica".'
  name: role
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationRole">]
- description: Maximum number of read replicas allowed for a server.
  name: capacity
  types:
  - <xref:int>
- description: 'Indicates the replication state of a read replica. This property is

    returned only when the target server is a read replica. Possible  values are Active,
    Broken,

    Catchup, Provisioning, Reconfiguring, and Updating. Known values are: "Active",
    "Catchup",

    "Provisioning", "Updating", "Broken", and "Reconfiguring".'
  name: replicationState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationState">]
- description: 'Type of operation to apply on the read replica. This property is write
    only.

    Standalone means that the read replica will be promoted to a standalone server,
    and will become

    a completely independent entity from the replication set. Switchover means that
    the read

    replica will roles with the primary server. Known values are: "Standalone" and
    "Switchover".'
  name: promoteMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReadReplicaPromoteMode">]
- description: 'Data synchronization option to use when processing the operation specified

    in the promoteMode property. This property is write only. Known values are: "Planned"
    and

    "Forced".'
  name: promoteOption
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReadReplicaPromoteOption">]
attributes:
- uid: azure.mgmt.postgresqlflexibleservers.types.Replica.capacity
  name: capacity
  summary: Maximum number of read replicas allowed for a server.
  signature: 'capacity: int'
- uid: azure.mgmt.postgresqlflexibleservers.types.Replica.promoteMode
  name: promoteMode
  summary: 'Type of operation to apply on the read replica. This property is write
    only. Standalone means

    that the read replica will be promoted to a standalone server, and will become
    a completely

    independent entity from the replication set. Switchover means that the read replica
    will roles

    with the primary server. Known values are: "Standalone" and "Switchover".'
  signature: 'promoteMode: str | ReadReplicaPromoteMode'
- uid: azure.mgmt.postgresqlflexibleservers.types.Replica.promoteOption
  name: promoteOption
  summary: 'Data synchronization option to use when processing the operation specified
    in the promoteMode

    property. This property is write only. Known values are: "Planned" and "Forced".'
  signature: 'promoteOption: str | ReadReplicaPromoteOption'
- uid: azure.mgmt.postgresqlflexibleservers.types.Replica.replicationState
  name: replicationState
  summary: 'Indicates the replication state of a read replica. This property is returned
    only when the

    target server is a read replica. Possible  values are Active, Broken, Catchup,
    Provisioning,

    Reconfiguring, and Updating. Known values are: "Active", "Catchup", "Provisioning",

    "Updating", "Broken", and "Reconfiguring".'
  signature: 'replicationState: str | ReplicationState'
- uid: azure.mgmt.postgresqlflexibleservers.types.Replica.role
  name: role
  summary: '"None", "Primary",

    "AsyncReplica", and "GeoAsyncReplica".'
  signature: 'role: str | ReplicationRole'
