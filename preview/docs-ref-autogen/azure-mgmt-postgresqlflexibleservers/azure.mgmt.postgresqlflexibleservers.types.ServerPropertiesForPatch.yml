  signature: 'fipsMode: str | FipsMode'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerPropertiesForPatch.highAvailability
  name: highAvailability
  summary: High availability properties of a server.
  signature: 'highAvailability: HighAvailabilityForPatch'
