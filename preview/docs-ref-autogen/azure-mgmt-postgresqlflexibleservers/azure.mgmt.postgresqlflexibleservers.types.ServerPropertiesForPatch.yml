  signature: 'replica: Replica'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerPropertiesForPatch.replicationRole
  name: replicationRole
  summary: '"None", "Primary",

    "AsyncReplica", and "GeoAsyncReplica".'
  signature: 'replicationRole: str | ReplicationRole'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerPropertiesForPatch.sourceServerResourceId
  name: sourceServerResourceId
  summary: Identifier of the server to be used as the source of the new server.
  signature: 'sourceServerResourceId: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerPropertiesForPatch.storage
  name: storage
  summary: Storage properties of a server.
  signature: 'storage: Storage'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerPropertiesForPatch.version
  name: version
  summary: '"19", "18", "17", "16",

    "15", "14", "13", "12", and "11".'
  signature: 'version: str | PostgresMajorVersion'
