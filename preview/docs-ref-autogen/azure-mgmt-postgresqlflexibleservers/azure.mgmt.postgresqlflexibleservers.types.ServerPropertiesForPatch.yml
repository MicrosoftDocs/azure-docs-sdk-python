  name: availabilityZone
  summary: Availability zone of a server.
  signature: 'availabilityZone: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerPropertiesForPatch.backup
  name: backup
  summary: Backup properties of a server.
  signature: 'backup: BackupForPatch'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerPropertiesForPatch.cluster
  name: cluster
  summary: Cluster properties of a server.
  signature: 'cluster: Cluster'
