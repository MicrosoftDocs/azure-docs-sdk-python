### YamlMime:PythonClass
uid: azure.mgmt.postgresqlflexibleservers.types.ServerPropertiesForPatch
name: ServerPropertiesForPatch
fullName: azure.mgmt.postgresqlflexibleservers.types.ServerPropertiesForPatch
module: azure.mgmt.postgresqlflexibleservers.types
summary: Properties of a server.
constructor:
  syntax: ServerPropertiesForPatch()
variables:
- description: 'Name of the login designated as the first password based

    administrator assigned to your instance of PostgreSQL. Must be specified the first
    time that

    you enable password based authentication on a server. Once set to a given value,
    it cannot be

    changed for the rest of the life of a server. If you disable password based authentication
    on a

    server which had it enabled, this password based role isn''t deleted.'
  name: administratorLogin
  types:
  - <xref:str>
- description: 'Password assigned to the administrator login. As long as

    password authentication is enabled, this password can be changed at any time.'
  name: administratorLoginPassword
  types:
  - <xref:str>
- description: 'Major version of PostgreSQL database engine. Known values are: "19",
    "18", "17",

    "16", "15", "14", "13", "12", and "11".'
  name: version
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PostgresMajorVersion">]
- description: Storage properties of a server.
  name: storage
  types:
  - <xref:<xref:"Storage">>
- description: Backup properties of a server.
  name: backup
  types:
  - <xref:<xref:"BackupForPatch">>
- description: High availability properties of a server.
  name: highAvailability
  types:
  - <xref:<xref:"HighAvailabilityForPatch">>
- description: Maintenance window properties of a server.
  name: maintenanceWindow
  types:
  - <xref:<xref:"MaintenanceWindowForPatch">>
- description: Authentication configuration properties of a server.
  name: authConfig
  types:
  - <xref:<xref:"AuthConfigForPatch">>
- description: Data encryption properties of a server.
  name: dataEncryption
  types:
  - <xref:<xref:"DataEncryption">>
- description: Availability zone of a server.
  name: availabilityZone
  types:
  - <xref:str>
- description: 'Update mode of an existing server. Known values are: "Default" and
    "Update".'
  name: createMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CreateModeForPatch">]
- description: 'Identifier of the server to be used as the source of the new

    server.'
  name: sourceServerResourceId
  types:
  - <xref:str>
- description: 'Role of the server in a replication set. Known values are: "None",

    "Primary", "AsyncReplica", and "GeoAsyncReplica".'
  name: replicationRole
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationRole">]
- description: 'Read replica properties of a server. Required only in case that you
    want to

    promote a server.'
  name: replica
  types:
  - <xref:<xref:"Replica">>
- description: 'Network properties of a server. Only required if you want your server
    to be

    integrated into a virtual network provided by customer.'
  name: network
  types:
  - <xref:<xref:"Network">>
- description: Cluster properties of a server.
  name: cluster
  types:
  - <xref:<xref:"Cluster">>
- description: 'Indicates if FIPS (Federal Information Processing Standards) mode
    is enabled on

    the server. If not specified, the current value is preserved. Known values are:
    "Enabled" and

    "Disabled".'
  name: fipsMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FipsMode">]
attributes:
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerPropertiesForPatch.administratorLogin
  name: administratorLogin
  summary: 'Name of the login designated as the first password based administrator
    assigned to your

    instance of PostgreSQL. Must be specified the first time that you enable password
    based

    authentication on a server. Once set to a given value, it cannot be changed for
    the rest of the

    life of a server. If you disable password based authentication on a server which
    had it

    enabled, this password based role isn''t deleted.'
  signature: 'administratorLogin: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerPropertiesForPatch.administratorLoginPassword
  name: administratorLoginPassword
  summary: 'Password assigned to the administrator login. As long as password authentication
    is enabled,

    this password can be changed at any time.'
  signature: 'administratorLoginPassword: str'
