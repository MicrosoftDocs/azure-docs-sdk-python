  name: createMode
  summary: '"Default" and "Update".'
  signature: 'createMode: str | CreateModeForPatch'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerPropertiesForPatch.dataEncryption
  name: dataEncryption
  summary: Data encryption properties of a server.
  signature: 'dataEncryption: DataEncryption'
