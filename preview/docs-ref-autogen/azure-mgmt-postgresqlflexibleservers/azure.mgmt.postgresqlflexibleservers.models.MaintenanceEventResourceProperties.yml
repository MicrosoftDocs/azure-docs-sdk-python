  types:
  - <xref:str>
- description: 'The customer-facing status of the maintenance event. Required. Known
    values are:

    "Planned", "InProgress", "Complete", "Rescheduled", and "Canceled".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.mgmt.postgresqlflexibleservers.models.MaintenanceEventStatus>
