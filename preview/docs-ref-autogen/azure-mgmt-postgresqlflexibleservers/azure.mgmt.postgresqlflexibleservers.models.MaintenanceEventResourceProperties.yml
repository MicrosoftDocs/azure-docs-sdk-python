variables:
- description: 'A service-generated identifier for this maintenance event, assigned

    by the platform (e.g., ''YL1T-HFG''). The format is not contractual and clients
    should not

    attempt to parse or construct this value.'
  name: maintenance_event_id
  types:
  - <xref:str>
- description: 'The maintenance type (e.g., ''PlannedMaintenance''). Required.

    "PlannedMaintenance"'
