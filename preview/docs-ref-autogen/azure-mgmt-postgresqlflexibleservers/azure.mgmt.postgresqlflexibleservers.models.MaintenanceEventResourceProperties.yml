  name: start_time
  types:
  - <xref:datetime.datetime>
- description: The scheduled end time of the maintenance event (UTC). Required.
  name: end_time
  types:
  - <xref:datetime.datetime>
- description: 'The estimated downtime as an ISO 8601 duration string (e.g., ''PT60S''

    = 60 seconds).'
  name: estimated_downtime
  types:
  - <xref:str>
- description: 'A value indicating whether this maintenance event can be rescheduled
    by the

    customer. Required.'
  name: deferrable
  types:
  - <xref:bool>
- description: 'The latest date/time this maintenance event can be postponed to (UTC).

    Present only when deferrable is true.'
