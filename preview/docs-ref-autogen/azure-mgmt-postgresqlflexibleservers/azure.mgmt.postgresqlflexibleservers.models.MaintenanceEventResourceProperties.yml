  name: rescheduled_from
  types:
  - <xref:datetime.datetime>
- description: The time this maintenance event record was last updated (UTC).
  name: last_updated_time
  types:
  - <xref:datetime.datetime>
- description: 'The initial scheduled start time before any reschedule (UTC). Equals

    startTime when the event has never been rescheduled. Required.'
  name: original_start_time
  types:
  - <xref:datetime.datetime>
