uid: azure.mgmt.postgresqlflexibleservers.types.AuthConfig
name: AuthConfig
fullName: azure.mgmt.postgresqlflexibleservers.types.AuthConfig
module: azure.mgmt.postgresqlflexibleservers.types
summary: Authentication configuration properties of a server.
constructor:
  syntax: AuthConfig()
variables:
- description: 'Indicates if the server supports Microsoft Entra authentication.

    Known values are: "Enabled" and "Disabled".'
  name: activeDirectoryAuth
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MicrosoftEntraAuth">]
- description: 'Indicates if the server supports password based authentication. Known

    values are: "Enabled" and "Disabled".'
  name: passwordAuth
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PasswordBasedAuth">]
- description: Identifier of the tenant of the delegated resource.
  name: tenantId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.postgresqlflexibleservers.types.AuthConfig.activeDirectoryAuth
  name: activeDirectoryAuth
  summary: '"Enabled"

    and "Disabled".'
  signature: 'activeDirectoryAuth: str | MicrosoftEntraAuth'
- uid: azure.mgmt.postgresqlflexibleservers.types.AuthConfig.passwordAuth
  name: passwordAuth
  summary: '"Enabled"

    and "Disabled".'
  signature: 'passwordAuth: str | PasswordBasedAuth'
- uid: azure.mgmt.postgresqlflexibleservers.types.AuthConfig.tenantId
  name: tenantId
  summary: Identifier of the tenant of the delegated resource.
  signature: 'tenantId: str'
