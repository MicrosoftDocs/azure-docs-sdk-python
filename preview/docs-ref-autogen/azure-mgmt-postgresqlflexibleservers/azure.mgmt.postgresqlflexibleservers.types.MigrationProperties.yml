- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.targetDbServerResourceId
  name: targetDbServerResourceId
  summary: Identifier of the target database server resource.
  signature: 'targetDbServerResourceId: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.triggerCutover
  name: triggerCutover
  summary: '"True" and

    "False".'
  signature: 'triggerCutover: str | TriggerCutover'
