  summary: Metadata of source database server.
  signature: 'sourceDbServerMetadata: DbServerMetadata'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.sourceDbServerResourceId
  name: sourceDbServerResourceId
  summary: 'Identifier of the source database server resource, when ''sourceType''
    is

    ''PostgreSQLSingleServer''. For other source types this must be set to ipaddress:port@username
    or

    hostname:port@username.'
  signature: 'sourceDbServerResourceId: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.sourceType
  name: sourceType
  summary: 'ApsaraDB_RDS, AWS, AWS_AURORA, AWS_EC2, AWS_RDS,

    AzureVM, Crunchy_PostgreSQL, Digital_Ocean_Droplets, Digital_Ocean_PostgreSQL,
    EDB,

    EDB_Oracle_Server, EDB_PostgreSQL, GCP, GCP_AlloyDB, GCP_CloudSQL, GCP_Compute,

    Heroku_PostgreSQL, Huawei_Compute, Huawei_RDS, OnPremises, PostgreSQLCosmosDB,

    PostgreSQLFlexibleServer, PostgreSQLSingleServer, or Supabase_PostgreSQL. Known
    values are:

    "OnPremises", "AWS", "GCP", "AzureVM", "PostgreSQLSingleServer", "AWS_RDS",

    "AWS_AURORA", "AWS_EC2", "GCP_CloudSQL", "GCP_AlloyDB", "GCP_Compute", "EDB",

    "EDB_Oracle_Server", "EDB_PostgreSQL", "PostgreSQLFlexibleServer",

    "PostgreSQLCosmosDB", "Huawei_RDS", "Huawei_Compute", "Heroku_PostgreSQL",

    "Crunchy_PostgreSQL", "ApsaraDB_RDS", "Digital_Ocean_Droplets",

    "Digital_Ocean_PostgreSQL", and "Supabase_PostgreSQL".'
  signature: 'sourceType: str | SourceType'
