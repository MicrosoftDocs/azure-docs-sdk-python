### YamlMime:PythonClass
uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties
name: MigrationProperties
fullName: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties
module: azure.mgmt.postgresqlflexibleservers.types
summary: Migration.
constructor:
  syntax: MigrationProperties()
variables:
- description: Identifier of a migration.
  name: migrationId
  types:
  - <xref:str>
- description: Current status of a migration.
  name: currentStatus
  types:
  - <xref:<xref:"MigrationStatus">>
- description: Identifier of the private endpoint migration instance.
  name: migrationInstanceResourceId
  types:
  - <xref:str>
- description: 'Mode used to perform the migration: Online or Offline. Known values
    are:

    "Offline" and "Online".'
  name: migrationMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MigrationMode">]
- description: 'Supported option for a migration. Known values are: "Validate",

    "Migrate", and "ValidateAndMigrate".'
  name: migrationOption
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MigrationOption">]
- description: 'Source server type used for the migration: ApsaraDB_RDS, AWS, AWS_AURORA,

    AWS_EC2, AWS_RDS, AzureVM, Crunchy_PostgreSQL, Digital_Ocean_Droplets,

    Digital_Ocean_PostgreSQL, EDB, EDB_Oracle_Server, EDB_PostgreSQL, GCP, GCP_AlloyDB,

    GCP_CloudSQL, GCP_Compute, Heroku_PostgreSQL, Huawei_Compute, Huawei_RDS, OnPremises,

    PostgreSQLCosmosDB, PostgreSQLFlexibleServer, PostgreSQLSingleServer, or Supabase_PostgreSQL.

    Known values are: "OnPremises", "AWS", "GCP", "AzureVM", "PostgreSQLSingleServer",
    "AWS_RDS",

    "AWS_AURORA", "AWS_EC2", "GCP_CloudSQL", "GCP_AlloyDB", "GCP_Compute", "EDB",

    "EDB_Oracle_Server", "EDB_PostgreSQL", "PostgreSQLFlexibleServer", "PostgreSQLCosmosDB",

    "Huawei_RDS", "Huawei_Compute", "Heroku_PostgreSQL", "Crunchy_PostgreSQL", "ApsaraDB_RDS",

    "Digital_Ocean_Droplets", "Digital_Ocean_PostgreSQL", and "Supabase_PostgreSQL".'
  name: sourceType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SourceType">]
- description: 'SSL mode used by a migration. Default SSL mode for ''PostgreSQLSingleServer''
    is

    ''VerifyFull''. Default SSL mode for other source types is ''Prefer''. Known values
    are: "Prefer",

    "Require", "VerifyCA", and "VerifyFull".'
  name: sslMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SslMode">]
- description: Metadata of source database server.
  name: sourceDbServerMetadata
  types:
  - <xref:<xref:"DbServerMetadata">>
- description: Metadata of target database server.
  name: targetDbServerMetadata
  types:
  - <xref:<xref:"DbServerMetadata">>
- description: 'Identifier of the source database server resource, when

    ''sourceType'' is ''PostgreSQLSingleServer''. For other source types this must
    be set to

    ipaddress:port@username or hostname:port@username.'
  name: sourceDbServerResourceId
  types:
  - <xref:str>
- description: 'Fully qualified domain name (FQDN) or IP address

    of the source server. This property is optional. When provided, the migration
    service will

    always use it to connect to the source server.'
  name: sourceDbServerFullyQualifiedDomainName
  types:
  - <xref:str>
- description: Identifier of the target database server resource.
  name: targetDbServerResourceId
  types:
  - <xref:str>
- description: 'Fully qualified domain name (FQDN) or IP address

    of the target server. This property is optional. When provided, the migration
    service will

    always use it to connect to the target server.'
  name: targetDbServerFullyQualifiedDomainName
  types:
  - <xref:str>
- description: Migration secret parameters.
  name: secretParameters
  types:
  - <xref:<xref:"MigrationSecretParameters">>
- description: Names of databases to migrate.
  name: dbsToMigrate
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates whether to setup logical replication

    on source server, if needed. Known values are: "True" and "False".'
  name: setupLogicalReplicationOnSourceDbIfNeeded
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LogicalReplicationOnSourceServer">]
- description: 'Indicates if databases on the target server can be overwritten when

    already present. If set to ''False'', when the migration workflow detects that
    the database

    already exists on the target server, it will wait for a confirmation. Known values
    are: "True"

    and "False".'
  name: overwriteDbsInTarget
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OverwriteDatabasesOnTargetServer">]
- description: Start time (UTC) for migration window.
  name: migrationWindowStartTimeInUtc
  types:
  - <xref:str>
- description: End time (UTC) for migration window.
  name: migrationWindowEndTimeInUtc
  types:
  - <xref:str>
- description: 'Indicates if roles and permissions must be migrated. Known values
    are:

    "True" and "False".'
  name: migrateRoles
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MigrateRolesAndPermissions">]
- description: 'Indicates if data migration must start right away. Known values are:

    "True" and "False".'
  name: startDataMigration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StartDataMigration">]
- description: 'Indicates if cutover must be triggered for the entire migration. Known

    values are: "True" and "False".'
  name: triggerCutover
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TriggerCutover">]
- description: 'When you want to trigger cutover for specific databases set

    ''triggerCutover'' to ''True'' and the names of the specific databases in this
    array.'
  name: dbsToTriggerCutoverOn
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates if cancel must be triggered for the entire migration. Known
    values are:

    "True" and "False".'
  name: cancel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Cancel">]
- description: 'When you want to trigger cancel for specific databases set

    ''triggerCutover'' to ''True'' and the names of the specific databases in this
    array.'
  name: dbsToCancelMigrationOn
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.cancel
  name: cancel
  summary: '"True" and

    "False".'
  signature: 'cancel: str | Cancel'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.currentStatus
  name: currentStatus
  summary: Current status of a migration.
  signature: 'currentStatus: MigrationStatus'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.dbsToCancelMigrationOn
  name: dbsToCancelMigrationOn
  summary: 'When you want to trigger cancel for specific databases set ''triggerCutover''
    to ''True'' and the

    names of the specific databases in this array.'
  signature: 'dbsToCancelMigrationOn: list[str]'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.dbsToMigrate
  name: dbsToMigrate
  summary: Names of databases to migrate.
  signature: 'dbsToMigrate: list[str]'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.dbsToTriggerCutoverOn
  name: dbsToTriggerCutoverOn
  summary: 'When you want to trigger cutover for specific databases set ''triggerCutover''
    to ''True'' and the

    names of the specific databases in this array.'
  signature: 'dbsToTriggerCutoverOn: list[str]'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.migrateRoles
  name: migrateRoles
  summary: '"True" and "False".'
  signature: 'migrateRoles: str | MigrateRolesAndPermissions'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.migrationId
  name: migrationId
  summary: Identifier of a migration.
  signature: 'migrationId: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.migrationInstanceResourceId
  name: migrationInstanceResourceId
  summary: Identifier of the private endpoint migration instance.
  signature: 'migrationInstanceResourceId: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.migrationMode
  name: migrationMode
  summary: '"Offline" and

    "Online".'
  signature: 'migrationMode: str | MigrationMode'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.migrationOption
  name: migrationOption
  summary: '"Validate", "Migrate", and

    "ValidateAndMigrate".'
  signature: 'migrationOption: str | MigrationOption'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.migrationWindowEndTimeInUtc
  name: migrationWindowEndTimeInUtc
  summary: End time (UTC) for migration window.
  signature: 'migrationWindowEndTimeInUtc: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.migrationWindowStartTimeInUtc
  name: migrationWindowStartTimeInUtc
  summary: Start time (UTC) for migration window.
  signature: 'migrationWindowStartTimeInUtc: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.overwriteDbsInTarget
  name: overwriteDbsInTarget
  summary: 'Indicates if databases on the target server can be overwritten when already
    present. If set to

    ''False'', when the migration workflow detects that the database already exists
    on the target

    server, it will wait for a confirmation. Known values are: "True" and "False".'
  signature: 'overwriteDbsInTarget: str | OverwriteDatabasesOnTargetServer'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.secretParameters
  name: secretParameters
  summary: Migration secret parameters.
  signature: 'secretParameters: MigrationSecretParameters'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.setupLogicalReplicationOnSourceDbIfNeeded
  name: setupLogicalReplicationOnSourceDbIfNeeded
  summary: 'Indicates whether to setup logical replication on source server, if needed.
    Known values are:

    "True" and "False".'
  signature: 'setupLogicalReplicationOnSourceDbIfNeeded: str | LogicalReplicationOnSourceServer'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationProperties.sourceDbServerFullyQualifiedDomainName
  name: sourceDbServerFullyQualifiedDomainName
  summary: 'Fully qualified domain name (FQDN) or IP address of the source server.
