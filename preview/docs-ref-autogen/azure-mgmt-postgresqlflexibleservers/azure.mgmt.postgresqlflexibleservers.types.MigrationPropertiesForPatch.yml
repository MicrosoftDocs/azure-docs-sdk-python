### YamlMime:PythonClass
uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch
name: MigrationPropertiesForPatch
fullName: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch
module: azure.mgmt.postgresqlflexibleservers.types
summary: Migration properties.
constructor:
  syntax: MigrationPropertiesForPatch()
variables:
- description: 'Identifier of the source database server resource, when

    ''sourceType'' is ''PostgreSQLSingleServer''. For other source types this must
    be set to

    ipaddress:port@username or hostname:port@username.'
  name: sourceDbServerResourceId
  types:
  - <xref:str>
- description: 'Fully qualified domain name (FQDN) or IP address

    of the source server. This property is optional. When provided, the migration
    service will

    always use it to connect to the source server.'
  name: sourceDbServerFullyQualifiedDomainName
  types:
  - <xref:str>
- description: 'Fully qualified domain name (FQDN) or IP address

    of the target server. This property is optional. When provided, the migration
    service will

    always use it to connect to the target server.'
  name: targetDbServerFullyQualifiedDomainName
  types:
  - <xref:str>
- description: Migration secret parameters.
  name: secretParameters
  types:
  - <xref:<xref:"MigrationSecretParametersForPatch">>
- description: Names of databases to migrate.
  name: dbsToMigrate
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates whether to setup logical replication

    on source server, if needed. Known values are: "True" and "False".'
  name: setupLogicalReplicationOnSourceDbIfNeeded
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LogicalReplicationOnSourceServer">]
- description: 'Indicates if databases on the target server can be overwritten when

    already present. If set to ''False'', when the migration workflow detects that
    the database

    already exists on the target server, it will wait for a confirmation. Known values
    are: "True"

    and "False".'
  name: overwriteDbsInTarget
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OverwriteDatabasesOnTargetServer">]
- description: Start time (UTC) for migration window.
  name: migrationWindowStartTimeInUtc
  types:
  - <xref:str>
- description: 'Indicates if roles and permissions must be migrated. Known values
    are:

    "True" and "False".'
  name: migrateRoles
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MigrateRolesAndPermissions">]
- description: 'Indicates if data migration must start right away. Known values are:

    "True" and "False".'
  name: startDataMigration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StartDataMigration">]
- description: 'Indicates if cutover must be triggered for the entire migration. Known

    values are: "True" and "False".'
  name: triggerCutover
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TriggerCutover">]
- description: 'When you want to trigger cutover for specific databases set

    ''triggerCutover'' to ''True'' and the names of the specific databases in this
    array.'
  name: dbsToTriggerCutoverOn
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates if cancel must be triggered for the entire migration. Known
    values are:

    "True" and "False".'
  name: cancel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Cancel">]
- description: 'When you want to trigger cancel for specific databases set

    ''triggerCutover'' to ''True'' and the names of the specific databases in this
    array.'
  name: dbsToCancelMigrationOn
  types:
  - <xref:list>[<xref:str>]
- description: 'Mode used to perform the migration: Online or Offline. Known values
    are:

    "Offline" and "Online".'
  name: migrationMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MigrationMode">]
attributes:
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.cancel
  name: cancel
  summary: '"True" and

    "False".'
  signature: 'cancel: str | Cancel'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.dbsToCancelMigrationOn
  name: dbsToCancelMigrationOn
  summary: 'When you want to trigger cancel for specific databases set ''triggerCutover''
    to ''True'' and the

    names of the specific databases in this array.'
  signature: 'dbsToCancelMigrationOn: list[str]'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.dbsToMigrate
  name: dbsToMigrate
  summary: Names of databases to migrate.
  signature: 'dbsToMigrate: list[str]'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.dbsToTriggerCutoverOn
  name: dbsToTriggerCutoverOn
  summary: 'When you want to trigger cutover for specific databases set ''triggerCutover''
    to ''True'' and the

    names of the specific databases in this array.'
  signature: 'dbsToTriggerCutoverOn: list[str]'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.migrateRoles
  name: migrateRoles
  summary: '"True" and "False".'
  signature: 'migrateRoles: str | MigrateRolesAndPermissions'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.migrationMode
  name: migrationMode
  summary: '"Offline" and

    "Online".'
  signature: 'migrationMode: str | MigrationMode'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.migrationWindowStartTimeInUtc
  name: migrationWindowStartTimeInUtc
  summary: Start time (UTC) for migration window.
  signature: 'migrationWindowStartTimeInUtc: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.overwriteDbsInTarget
  name: overwriteDbsInTarget
  summary: 'Indicates if databases on the target server can be overwritten when already
    present. If set to

    ''False'', when the migration workflow detects that the database already exists
    on the target

    server, it will wait for a confirmation. Known values are: "True" and "False".'
  signature: 'overwriteDbsInTarget: str | OverwriteDatabasesOnTargetServer'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.secretParameters
  name: secretParameters
  summary: Migration secret parameters.
  signature: 'secretParameters: MigrationSecretParametersForPatch'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.setupLogicalReplicationOnSourceDbIfNeeded
  name: setupLogicalReplicationOnSourceDbIfNeeded
  summary: 'Indicates whether to setup logical replication on source server, if needed.
    Known values are:

    "True" and "False".'
  signature: 'setupLogicalReplicationOnSourceDbIfNeeded: str | LogicalReplicationOnSourceServer'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.sourceDbServerFullyQualifiedDomainName
  name: sourceDbServerFullyQualifiedDomainName
  summary: 'Fully qualified domain name (FQDN) or IP address of the source server.
    This property is

    optional. When provided, the migration service will always use it to connect to
    the source

    server.'
  signature: 'sourceDbServerFullyQualifiedDomainName: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.sourceDbServerResourceId
  name: sourceDbServerResourceId
  summary: 'Identifier of the source database server resource, when ''sourceType''
    is

    ''PostgreSQLSingleServer''. For other source types this must be set to ipaddress:port@username
    or

    hostname:port@username.'
  signature: 'sourceDbServerResourceId: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.startDataMigration
  name: startDataMigration
  summary: '"True" and "False".'
  signature: 'startDataMigration: str | StartDataMigration'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.targetDbServerFullyQualifiedDomainName
  name: targetDbServerFullyQualifiedDomainName
  summary: 'Fully qualified domain name (FQDN) or IP address of the target server.
    This property is

    optional. When provided, the migration service will always use it to connect to
    the target

    server.'
  signature: 'targetDbServerFullyQualifiedDomainName: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.MigrationPropertiesForPatch.triggerCutover
  name: triggerCutover
  summary: '"True" and

    "False".'
  signature: 'triggerCutover: str | TriggerCutover'
