### YamlMime:PythonClass
uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties
name: ServerProperties
fullName: azure.mgmt.postgresqlflexibleservers.types.ServerProperties
module: azure.mgmt.postgresqlflexibleservers.types
summary: Properties of a server.
constructor:
  syntax: ServerProperties()
variables:
- description: 'Name of the login designated as the first password based

    administrator assigned to your instance of PostgreSQL. Must be specified the first
    time that

    you enable password based authentication on a server. Once set to a given value,
    it cannot be

    changed for the rest of the life of a server. If you disable password based authentication
    on a

    server which had it enabled, this password based role isn''t deleted.'
  name: administratorLogin
  types:
  - <xref:str>
- description: 'Password assigned to the administrator login. As long as

    password authentication is enabled, this password can be changed at any time.'
  name: administratorLoginPassword
  types:
  - <xref:str>
- description: 'Major version of PostgreSQL database engine. Known values are: "19",
    "18", "17",

    "16", "15", "14", "13", "12", and "11".'
  name: version
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PostgresMajorVersion">]
- description: Minor version of PostgreSQL database engine.
  name: minorVersion
  types:
  - <xref:str>
- description: 'Possible states of a server. Known values are: "Ready", "Dropping",
    "Disabled",

    "Starting", "Stopping", "Stopped", "Updating", "Restarting", "Inaccessible", and

    "Provisioning".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServerState">]
- description: Fully qualified domain name of a server.
  name: fullyQualifiedDomainName
  types:
  - <xref:str>
- description: Storage properties of a server.
  name: storage
  types:
  - <xref:<xref:"Storage">>
- description: Authentication configuration properties of a server.
  name: authConfig
  types:
  - <xref:<xref:"AuthConfig">>
- description: Data encryption properties of a server.
  name: dataEncryption
  types:
  - <xref:<xref:"DataEncryption">>
- description: Backup properties of a server.
  name: backup
  types:
  - <xref:<xref:"Backup">>
- description: 'Network properties of a server. Only required if you want your server
    to be

    integrated into a virtual network provided by customer.'
  name: network
  types:
  - <xref:<xref:"Network">>
- description: High availability properties of a server.
  name: highAvailability
  types:
  - <xref:<xref:"HighAvailability">>
- description: Maintenance window properties of a server.
  name: maintenanceWindow
  types:
  - <xref:<xref:"MaintenanceWindow">>
- description: 'Identifier of the server to be used as the source of the new

    server. Required when ''createMode'' is ''PointInTimeRestore'', ''GeoRestore'',
    ''Replica'', or

    ''ReviveDropped''. This property is returned only when the target server is a
    read replica.'
  name: sourceServerResourceId
  types:
  - <xref:str>
- description: 'Creation time (in ISO8601 format) of the backup which you want to
    restore

    in the new server. It''s required when ''createMode'' is ''PointInTimeRestore'',
    ''GeoRestore'', or

    ''ReviveDropped''.'
  name: pointInTimeUTC
  types:
  - <xref:str>
- description: Availability zone of a server.
  name: availabilityZone
  types:
  - <xref:str>
- description: 'Role of the server in a replication set. Known values are: "None",

    "Primary", "AsyncReplica", and "GeoAsyncReplica".'
  name: replicationRole
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationRole">]
- description: Maximum number of read replicas allowed for a server.
  name: replicaCapacity
  types:
  - <xref:int>
- description: 'Read replica properties of a server. Required only in case that you
    want to

    promote a server.'
  name: replica
  types:
  - <xref:<xref:"Replica">>
- description: 'Creation mode of a new server. Known values are: "Default", "Create",

    "Update", "PointInTimeRestore", "GeoRestore", "Replica", and "ReviveDropped".'
  name: createMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CreateMode">]
- description: 'List of private endpoint connections associated with the

    specified server.'
  name: privateEndpointConnections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: Cluster properties of a server.
  name: cluster
  types:
  - <xref:<xref:"Cluster">>
- description: 'Indicates if FIPS (Federal Information Processing Standards) mode
    is enabled on

    the server. If not specified on create, it defaults to Disabled. Known values
    are: "Enabled"

    and "Disabled".'
  name: fipsMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FipsMode">]
attributes:
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.administratorLogin
  name: administratorLogin
  summary: 'Name of the login designated as the first password based administrator
    assigned to your

    instance of PostgreSQL. Must be specified the first time that you enable password
    based

    authentication on a server. Once set to a given value, it cannot be changed for
    the rest of the

    life of a server. If you disable password based authentication on a server which
    had it

    enabled, this password based role isn''t deleted.'
  signature: 'administratorLogin: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.administratorLoginPassword
  name: administratorLoginPassword
  summary: 'Password assigned to the administrator login. As long as password authentication
    is enabled,

    this password can be changed at any time.'
  signature: 'administratorLoginPassword: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.authConfig
  name: authConfig
  summary: Authentication configuration properties of a server.
  signature: 'authConfig: AuthConfig'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.availabilityZone
  name: availabilityZone
  summary: Availability zone of a server.
  signature: 'availabilityZone: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.backup
  name: backup
  summary: Backup properties of a server.
  signature: 'backup: Backup'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.cluster
  name: cluster
  summary: Cluster properties of a server.
  signature: 'cluster: Cluster'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.createMode
  name: createMode
  summary: '"Default", "Create", "Update",

    "PointInTimeRestore", "GeoRestore", "Replica", and "ReviveDropped".'
  signature: 'createMode: str | CreateMode'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.dataEncryption
  name: dataEncryption
  summary: Data encryption properties of a server.
  signature: 'dataEncryption: DataEncryption'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.fipsMode
  name: fipsMode
  summary: 'Indicates if FIPS (Federal Information Processing Standards) mode is enabled
    on the server. If

    not specified on create, it defaults to Disabled. Known values are: "Enabled"
    and

    "Disabled".'
  signature: 'fipsMode: str | FipsMode'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.fullyQualifiedDomainName
  name: fullyQualifiedDomainName
  summary: Fully qualified domain name of a server.
  signature: 'fullyQualifiedDomainName: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.highAvailability
  name: highAvailability
  summary: High availability properties of a server.
  signature: 'highAvailability: HighAvailability'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.maintenanceWindow
  name: maintenanceWindow
  summary: Maintenance window properties of a server.
  signature: 'maintenanceWindow: MaintenanceWindow'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.minorVersion
  name: minorVersion
  summary: Minor version of PostgreSQL database engine.
  signature: 'minorVersion: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.network
  name: network
  summary: 'Network properties of a server. Only required if you want your server
    to be integrated into a

    virtual network provided by customer.'
  signature: 'network: Network'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.pointInTimeUTC
  name: pointInTimeUTC
  summary: 'Creation time (in ISO8601 format) of the backup which you want to restore
    in the new server.

    It''s required when ''createMode'' is ''PointInTimeRestore'', ''GeoRestore'',
    or ''ReviveDropped''.'
  signature: 'pointInTimeUTC: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.privateEndpointConnections
  name: privateEndpointConnections
  summary: List of private endpoint connections associated with the specified server.
  signature: 'privateEndpointConnections: list[''PrivateEndpointConnection'']'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.replica
  name: replica
  summary: Read replica properties of a server. Required only in case that you want
    to promote a server.
  signature: 'replica: Replica'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.replicaCapacity
  name: replicaCapacity
  summary: Maximum number of read replicas allowed for a server.
  signature: 'replicaCapacity: int'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.replicationRole
  name: replicationRole
  summary: '"None", "Primary",

    "AsyncReplica", and "GeoAsyncReplica".'
  signature: 'replicationRole: str | ReplicationRole'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.sourceServerResourceId
  name: sourceServerResourceId
  summary: 'Identifier of the server to be used as the source of the new server. Required
    when ''createMode''

    is ''PointInTimeRestore'', ''GeoRestore'', ''Replica'', or ''ReviveDropped''.
    This property is returned

    only when the target server is a read replica.'
  signature: 'sourceServerResourceId: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.state
  name: state
  summary: '"Ready", "Dropping", "Disabled",

    "Starting", "Stopping", "Stopped", "Updating", "Restarting", "Inaccessible", and

    "Provisioning".'
  signature: 'state: str | ServerState'
- uid: azure.mgmt.postgresqlflexibleservers.types.ServerProperties.storage
  name: storage
  summary: Storage properties of a server.
  signature: 'storage: Storage'
