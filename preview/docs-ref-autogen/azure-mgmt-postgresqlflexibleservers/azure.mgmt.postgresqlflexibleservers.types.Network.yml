uid: azure.mgmt.postgresqlflexibleservers.types.Network
name: Network
fullName: azure.mgmt.postgresqlflexibleservers.types.Network
module: azure.mgmt.postgresqlflexibleservers.types
summary: Network properties of a server.
constructor:
  syntax: Network()
variables:
- description: 'Indicates if public network access is enabled or not. This is only

    supported for servers that are not integrated into a virtual network which is
    owned and

    provided by customer when server is deployed. Known values are: "Enabled" and
    "Disabled".'
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServerPublicNetworkAccessState">]
- description: 'Resource identifier of the delegated subnet. Required during

    creation of a new server, in case you want the server to be integrated into your
    own virtual

    network. For an update operation, you only have to provide this property if you
    want to change

    the value assigned for the private DNS zone.'
  name: delegatedSubnetResourceId
  types:
  - <xref:str>
- description: 'Identifier of the private DNS zone. Required during creation

    of a new server, in case you want the server to be integrated into your own virtual
    network.

    For an update operation, you only have to provide this property if you want to
    change the value

    assigned for the private DNS zone.'
  name: privateDnsZoneArmResourceId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.postgresqlflexibleservers.types.Network.delegatedSubnetResourceId
  name: delegatedSubnetResourceId
  summary: 'Resource identifier of the delegated subnet. Required during creation
    of a new server, in case

    you want the server to be integrated into your own virtual network. For an update
    operation,

    you only have to provide this property if you want to change the value assigned
    for the private

    DNS zone.'
  signature: 'delegatedSubnetResourceId: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.Network.privateDnsZoneArmResourceId
  name: privateDnsZoneArmResourceId
  summary: 'Identifier of the private DNS zone. Required during creation of a new
    server, in case you want

    the server to be integrated into your own virtual network. For an update operation,
    you only

    have to provide this property if you want to change the value assigned for the
    private DNS

    zone.'
  signature: 'privateDnsZoneArmResourceId: str'
- uid: azure.mgmt.postgresqlflexibleservers.types.Network.publicNetworkAccess
  name: publicNetworkAccess
  summary: 'Indicates if public network access is enabled or not. This is only supported
    for servers that

    are not integrated into a virtual network which is owned and provided by customer
    when server

    is deployed. Known values are: "Enabled" and "Disabled".'
  signature: 'publicNetworkAccess: str | ServerPublicNetworkAccessState'
