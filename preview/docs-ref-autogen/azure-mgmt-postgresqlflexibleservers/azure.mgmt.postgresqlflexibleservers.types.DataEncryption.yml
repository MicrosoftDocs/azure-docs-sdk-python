    storage

    associated to the server when it is configured to support geographically redundant
    backups.

    Known values are: "Valid" and "Invalid".'
  name: geoBackupEncryptionKeyStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EncryptionKeyStatus">]
- description: Client id of multi-tenant Microsoft Entra application.
  name: primaryFederatedIdentityClientId
  types:
  - <xref:str>
- description: 'Client id of multi-tenant Microsoft Entra application

    for when it is configured to support geographically redundant backups.'
  name: geoBackupFederatedIdentityClientId
  types:
  - <xref:str>
