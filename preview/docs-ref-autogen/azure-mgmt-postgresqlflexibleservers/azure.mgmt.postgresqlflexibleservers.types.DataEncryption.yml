uid: azure.mgmt.postgresqlflexibleservers.types.DataEncryption
name: DataEncryption
fullName: azure.mgmt.postgresqlflexibleservers.types.DataEncryption
module: azure.mgmt.postgresqlflexibleservers.types
summary: Data encryption properties of a server.
constructor:
  syntax: DataEncryption()
variables:
- description: 'URI of the key in Azure Key Vault used for data encryption of the
    primary

    storage associated to a server.'
  name: primaryKeyURI
  types:
  - <xref:str>
- description: 'Identifier of the user assigned managed identity used to

    access the key in Azure Key Vault for data encryption of the primary storage associated
    to a

    server.'
