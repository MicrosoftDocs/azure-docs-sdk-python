### YamlMime:PythonClass
uid: azure.mgmt.postgresqlflexibleservers.types.RestartParameter
name: RestartParameter
fullName: azure.mgmt.postgresqlflexibleservers.types.RestartParameter
module: azure.mgmt.postgresqlflexibleservers.types
summary: PostgreSQL database engine restart parameters.
constructor:
  syntax: RestartParameter()
variables:
- description: 'Indicates if restart the PostgreSQL database engine should failover

    or switch over from primary to standby. This only works if server has high availability

    enabled.'
  name: restartWithFailover
  types:
  - <xref:bool>
- description: 'Failover mode. Known values are: "PlannedFailover", "ForcedFailover",

    "PlannedSwitchover", and "ForcedSwitchover".'
  name: failoverMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FailoverMode">]
attributes:
- uid: azure.mgmt.postgresqlflexibleservers.types.RestartParameter.failoverMode
  name: failoverMode
  summary: '"PlannedFailover", "ForcedFailover",

    "PlannedSwitchover", and "ForcedSwitchover".'
  signature: 'failoverMode: str | FailoverMode'
- uid: azure.mgmt.postgresqlflexibleservers.types.RestartParameter.restartWithFailover
  name: restartWithFailover
  summary: 'Indicates if restart the PostgreSQL database engine should failover or
    switch over from primary

    to standby. This only works if server has high availability enabled.'
  signature: 'restartWithFailover: bool'
