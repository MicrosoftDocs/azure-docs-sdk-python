### YamlMime:PythonClass
uid: azure.mgmt.containerregistry.types.ReplicationProperties
name: ReplicationProperties
fullName: azure.mgmt.containerregistry.types.ReplicationProperties
module: azure.mgmt.containerregistry.types
summary: The properties of a replication.
constructor:
  syntax: ReplicationProperties()
variables:
- description: 'The provisioning state of the replication at the time the operation

    was called. Known values are: "Creating", "Updating", "Deleting", "Succeeded",
    "Failed", and

    "Canceled".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The status of the replication at the time the operation was called.
  name: status
  types:
  - <xref:<xref:"Status">>
- description: 'Specifies whether the replication''s regional endpoint is

    enabled. Requests will not be routed to a replication whose regional endpoint
    is disabled,

    however its data will continue to be synced with other replications.'
  name: region_endpoint_enabled
  types:
  - <xref:bool>
- description: 'Whether or not zone redundancy is enabled for this container registry

    replication. Known values are: "Enabled" and "Disabled".'
  name: zone_redundancy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ZoneRedundancy">]
attributes:
- uid: azure.mgmt.containerregistry.types.ReplicationProperties.provisioningState
  name: provisioningState
  summary: 'The provisioning state of the replication at the time the operation was
    called. Known values

    are: "Creating", "Updating", "Deleting", "Succeeded", "Failed", and "Canceled".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.containerregistry.types.ReplicationProperties.regionEndpointEnabled
  name: regionEndpointEnabled
  summary: 'Specifies whether the replication''s regional endpoint is enabled. Requests
    will not be routed

    to a replication whose regional endpoint is disabled, however its data will continue
    to be

    synced with other replications.'
  signature: 'regionEndpointEnabled: bool'
- uid: azure.mgmt.containerregistry.types.ReplicationProperties.status
  name: status
  summary: The status of the replication at the time the operation was called.
  signature: 'status: Status'
- uid: azure.mgmt.containerregistry.types.ReplicationProperties.zoneRedundancy
  name: zoneRedundancy
  summary: 'Whether or not zone redundancy is enabled for this container registry
    replication. Known values

    are: "Enabled" and "Disabled".'
  signature: 'zoneRedundancy: str | ZoneRedundancy'
