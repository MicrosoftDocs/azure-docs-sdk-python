### YamlMime:PythonClass
uid: azure.mgmt.containerregistry.models.SyncUpdateProperties
name: SyncUpdateProperties
fullName: azure.mgmt.containerregistry.models.SyncUpdateProperties
module: azure.mgmt.containerregistry.models
summary: The parameters for updating the sync properties of the connected registry
  with its parent.
constructor:
  syntax: 'SyncUpdateProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The cron expression indicating the schedule that the connected registry
    will

    sync with its parent.'
  name: schedule
  types:
  - <xref:str>
- description: 'The time window during which sync is enabled for each schedule occurrence.

    Specify the duration using the format P[n]Y[n]M[n]DT[n]H[n]M[n]S as per ISO8601.'
  name: sync_window
  types:
  - <xref:datetime.timedelta>
- description: 'The period of time for which a message is available to sync before
    it is

    expired. Specify the duration using the format P[n]Y[n]M[n]DT[n]H[n]M[n]S as per
    ISO8601.'
  name: message_ttl
  types:
  - <xref:datetime.timedelta>
- description: 'The authentication type used for the connected registry to sync with
    its

    parent. Known values are: "SyncToken" and "ManagedIdentity".'
  name: auth_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.containerregistry.models.AuthType>
attributes:
- uid: azure.mgmt.containerregistry.models.SyncUpdateProperties.auth_type
  name: auth_type
  summary: 'The authentication type used for the connected registry to sync with its
    parent. Known values

    are: "SyncToken" and "ManagedIdentity".'
  signature: 'auth_type: str | _models.AuthType | None'
- uid: azure.mgmt.containerregistry.models.SyncUpdateProperties.message_ttl
  name: message_ttl
  summary: 'The period of time for which a message is available to sync before it
    is expired. Specify the

    duration using the format P[n]Y[n]M[n]DT[n]H[n]M[n]S as per ISO8601.'
  signature: 'message_ttl: timedelta | None'
- uid: azure.mgmt.containerregistry.models.SyncUpdateProperties.schedule
  name: schedule
  summary: 'The cron expression indicating the schedule that the connected registry
    will sync with its

    parent.'
  signature: 'schedule: str | None'
- uid: azure.mgmt.containerregistry.models.SyncUpdateProperties.sync_window
  name: sync_window
  summary: 'The time window during which sync is enabled for each schedule occurrence.
    Specify the duration

    using the format P[n]Y[n]M[n]DT[n]H[n]M[n]S as per ISO8601.'
  signature: 'sync_window: timedelta | None'
