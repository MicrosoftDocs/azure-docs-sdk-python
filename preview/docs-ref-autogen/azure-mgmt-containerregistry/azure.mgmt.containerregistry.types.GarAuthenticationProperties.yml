### YamlMime:PythonClass
uid: azure.mgmt.containerregistry.types.GarAuthenticationProperties
name: GarAuthenticationProperties
fullName: azure.mgmt.containerregistry.types.GarAuthenticationProperties
module: azure.mgmt.containerregistry.types
summary: Google Artifact Registry (GAR) authentication configuration.
constructor:
  syntax: GarAuthenticationProperties()
variables:
- description: 'Required. Google Artifact Registry (GAR) authentication via workload

    identity federation.'
  name: authentication_type
  types:
  - <xref:typing.Literal>[AdditionalAuthenticationType.GOOGLE_ARTIFACT_REGISTRY]
- description: 'The Google Cloud Platform project that is configured for authentication

    Permissions should be granted to

    principal://iam.googleapis.com/projects/{ProjectNumber}/locations/global/workloadIdentityPools/{WorkloadIdentityPool}/providers/{WorkloadIdentityProvider}/subject/{ManagedIdentityPrincipal}.

    Required.'
  name: project_number
  types:
  - <xref:str>
- description: 'The Google Cloud platform workload identity pool used for

    authentication. Required.'
  name: workload_identity_pool
  types:
  - <xref:str>
- description: 'The Google Cloud Platform workload identity provider used for

    authentication. Required.'
  name: workload_identity_provider
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerregistry.types.GarAuthenticationProperties.authenticationType
  name: authenticationType
  summary: Required. Google Artifact Registry (GAR) authentication via workload identity
    federation.
  signature: 'authenticationType: GOOGLE_ARTIFACT_REGISTRY: ''GoogleArtifactRegistry''>]'
- uid: azure.mgmt.containerregistry.types.GarAuthenticationProperties.projectNumber
  name: projectNumber
  summary: 'The Google Cloud Platform project that is configured for authentication
    Permissions should be

    granted to

    principal://iam.googleapis.com/projects/{ProjectNumber}/locations/global/workloadIdentityPools/{WorkloadIdentityPool}/providers/{WorkloadIdentityProvider}/subject/{ManagedIdentityPrincipal}.

    Required.'
  signature: 'projectNumber: str'
- uid: azure.mgmt.containerregistry.types.GarAuthenticationProperties.workloadIdentityPool
  name: workloadIdentityPool
  summary: The Google Cloud platform workload identity pool used for authentication.
    Required.
  signature: 'workloadIdentityPool: str'
- uid: azure.mgmt.containerregistry.types.GarAuthenticationProperties.workloadIdentityProvider
  name: workloadIdentityProvider
  summary: The Google Cloud Platform workload identity provider used for authentication.
    Required.
  signature: 'workloadIdentityProvider: str'
