uid: azure.mgmt.containerregistry.types.ConnectedRegistryProperties
name: ConnectedRegistryProperties
fullName: azure.mgmt.containerregistry.types.ConnectedRegistryProperties
module: azure.mgmt.containerregistry.types
summary: The properties of a connected registry.
constructor:
  syntax: ConnectedRegistryProperties()
variables:
- description: 'Provisioning state of the resource. Known values are: "Creating",

    "Updating", "Deleting", "Succeeded", "Failed", and "Canceled".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The mode of the connected registry resource that indicates the permissions
    of the

    registry. Required. Known values are: "ReadWrite", "ReadOnly", "Registry", and
    "Mirror".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectedRegistryMode">]
- description: The current version of ACR runtime on the connected registry.
  name: version
  types:
  - <xref:str>
- description: 'The current connection state of the connected registry. Known values

    are: "Online", "Offline", "Syncing", and "Unhealthy".'
  name: connection_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectionState">]
- description: The last activity time of the connected registry.
  name: last_activity_time
  types:
  - <xref:str>
- description: The activation properties of the connected registry.
  name: activation
  types:
  - <xref:<xref:"ActivationProperties">>
- description: The parent of the connected registry. Required.
  name: parent
  types:
  - <xref:<xref:"ParentProperties">>
- description: 'The list of the ACR token resource IDs used to authenticate clients
    to

    the connected registry.'
  name: client_token_ids
  types:
  - <xref:list>[<xref:str>]
- description: The login server properties of the connected registry.
  name: login_server
  types:
  - <xref:<xref:"LoginServerProperties">>
- description: The logging properties of the connected registry.
  name: logging
  types:
  - <xref:<xref:"LoggingProperties">>
- description: The list of current statuses of the connected registry.
  name: status_details
  types:
  - <xref:list>[<xref:"StatusDetailProperties">]
- description: 'The list of notifications subscription information for the connected

    registry.'
  name: notifications_list
  types:
  - <xref:list>[<xref:str>]
- description: The garbage collection properties of the connected registry.
  name: garbage_collection
  types:
  - <xref:<xref:"GarbageCollectionProperties">>
- description: 'The result of the connected registry''s most recent sync with its

    parent.'
  name: registry_sync_result
  types:
  - <xref:<xref:"RegistrySyncResult">>
