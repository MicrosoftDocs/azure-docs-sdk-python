  types:
  - <xref:str>
- description: 'List of source artifacts to be transferred by the pipeline. Specify
    an image

    by repository (''hello-world''). This will use the ''latest'' tag. Specify an
    image by tag

    (''hello-world:latest''). Specify an image by sha256-based manifest digest

    (''hello-world@sha256:abc123'').'
  name: artifacts
