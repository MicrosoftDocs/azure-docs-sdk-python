uid: azure.mgmt.containerregistry.types.GenerateCredentialsParameters
name: GenerateCredentialsParameters
fullName: azure.mgmt.containerregistry.types.GenerateCredentialsParameters
module: azure.mgmt.containerregistry.types
summary: 'The parameters used to generate credentials for a specified token or user
  of a container

  registry.'
constructor:
