  - <xref:str>
- description: 'The expiry date of the generated credentials after which the credentials
    become

    invalid.'
  name: expiry
  types:
  - <xref:str>
- description: "Specifies name of the password which should be regenerated if any\
    \ \u2013 password1 or\npassword2. Known values are: \"password1\" and \"password2\"\
    ."
  name: name
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TokenPasswordName">]
attributes:
- uid: azure.mgmt.containerregistry.types.GenerateCredentialsParameters.expiry
  name: expiry
  summary: The expiry date of the generated credentials after which the credentials
    become invalid.
  signature: 'expiry: str'
- uid: azure.mgmt.containerregistry.types.GenerateCredentialsParameters.name
  name: name
  summary: "Specifies name of the password which should be regenerated if any \u2013\
    \ password1 or password2.\nKnown values are: \"password1\" and \"password2\"."
