uid: azure.mgmt.containerregistry.types.IdentityProperties
name: IdentityProperties
fullName: azure.mgmt.containerregistry.types.IdentityProperties
module: azure.mgmt.containerregistry.types
summary: Managed identity for the resource.
constructor:
  syntax: IdentityProperties()
variables:
- description: The principal ID of resource identity.
  name: principal_id
  types:
  - <xref:str>
- description: The tenant ID of resource.
  name: tenant_id
  types:
  - <xref:str>
- description: 'The identity type. Known values are: "SystemAssigned", "UserAssigned",

    "SystemAssigned, UserAssigned", and "None".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceIdentityType">]
- description: 'The list of user identities associated with the resource. The

    user identity dictionary key references will be ARM resource ids in the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/

    providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}''.'
  name: user_assigned_identities
  types:
  - <xref:dict>[<xref:str>, <xref:"UserIdentityProperties">]
attributes:
- uid: azure.mgmt.containerregistry.types.IdentityProperties.principalId
  name: principalId
  summary: The principal ID of resource identity.
  signature: 'principalId: str'
- uid: azure.mgmt.containerregistry.types.IdentityProperties.tenantId
  name: tenantId
  summary: The tenant ID of resource.
  signature: 'tenantId: str'
- uid: azure.mgmt.containerregistry.types.IdentityProperties.type
  name: type
  summary: '"SystemAssigned", "UserAssigned", "SystemAssigned,

    UserAssigned", and "None".'
  signature: 'type: str | ResourceIdentityType'
- uid: azure.mgmt.containerregistry.types.IdentityProperties.userAssignedIdentities
  name: userAssignedIdentities
  summary: 'The list of user identities associated with the resource. The user identity
