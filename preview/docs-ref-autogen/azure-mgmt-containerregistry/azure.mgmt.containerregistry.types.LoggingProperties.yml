uid: azure.mgmt.containerregistry.types.LoggingProperties
name: LoggingProperties
fullName: azure.mgmt.containerregistry.types.LoggingProperties
module: azure.mgmt.containerregistry.types
summary: The logging properties of the connected registry.
constructor:
  syntax: LoggingProperties()
variables:
- description: 'The verbosity of logs persisted on the connected registry. Known values
    are:

    "Debug", "Information", "Warning", "Error", and "None".'
  name: log_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LogLevel">]
- description: 'Indicates whether audit logs are enabled on the connected registry.

    Known values are: "Enabled" and "Disabled".'
  name: audit_log_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AuditLogStatus">]
attributes:
- uid: azure.mgmt.containerregistry.types.LoggingProperties.auditLogStatus
  name: auditLogStatus
  summary: 'Indicates whether audit logs are enabled on the connected registry. Known
    values are:

    "Enabled" and "Disabled".'
  signature: 'auditLogStatus: str | AuditLogStatus'
- uid: azure.mgmt.containerregistry.types.LoggingProperties.logLevel
  name: logLevel
  summary: '"Debug",

    "Information", "Warning", "Error", and "None".'
  signature: 'logLevel: str | LogLevel'
