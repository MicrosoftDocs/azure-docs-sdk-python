### YamlMime:PythonClass
uid: azure.mgmt.containerregistry.types.WebhookProperties
name: WebhookProperties
fullName: azure.mgmt.containerregistry.types.WebhookProperties
module: azure.mgmt.containerregistry.types
summary: The properties of a webhook.
constructor:
  syntax: WebhookProperties()
variables:
- description: 'The status of the webhook at the time the operation was called. Known
    values are:

    "enabled" and "disabled".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WebhookStatus">]
- description: 'The scope of repositories where the event can be triggered. For example,
    ''foo:>>*<<''

    means events for all tags under repository ''foo''. ''foo:bar'' means events for
    ''foo:bar'' only.

    ''foo'' is equivalent to ''foo:latest''. Empty means all events.'
  name: scope
  types:
  - <xref:str>
- description: The list of actions that trigger the webhook to post notifications.
    Required.
  name: actions
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"WebhookAction">]]
- description: 'The provisioning state of the webhook at the time the operation was

    called. Known values are: "Creating", "Updating", "Deleting", "Succeeded", "Failed",
    and

    "Canceled".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.containerregistry.types.WebhookProperties.actions
  name: actions
  summary: The list of actions that trigger the webhook to post notifications. Required.
  signature: 'actions: Union[str, ForwardRef(''WebhookAction'')]]]'
- uid: azure.mgmt.containerregistry.types.WebhookProperties.provisioningState
  name: provisioningState
  summary: 'The provisioning state of the webhook at the time the operation was called.
    Known values are:

    "Creating", "Updating", "Deleting", "Succeeded", "Failed", and "Canceled".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.containerregistry.types.WebhookProperties.scope
  name: scope
  summary: '>>*<<'' means events

    for all tags under repository ''foo''. ''foo:bar'' means events for ''foo:bar''
    only. ''foo'' is

    equivalent to ''foo:latest''. Empty means all events.'
  signature: 'scope: str'
- uid: azure.mgmt.containerregistry.types.WebhookProperties.status
  name: status
  summary: '"enabled"

    and "disabled".'
  signature: 'status: str | WebhookStatus'
