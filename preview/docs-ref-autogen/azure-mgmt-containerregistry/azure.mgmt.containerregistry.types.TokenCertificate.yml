### YamlMime:PythonClass
uid: azure.mgmt.containerregistry.types.TokenCertificate
name: TokenCertificate
fullName: azure.mgmt.containerregistry.types.TokenCertificate
module: azure.mgmt.containerregistry.types
summary: The properties of a certificate used for authenticating a token.
constructor:
  syntax: TokenCertificate()
variables:
- description: 'Known values are: "certificate1" and "certificate2".'
  name: name
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TokenCertificateName">]
- description: The expiry datetime of the certificate.
  name: expiry
  types:
  - <xref:str>
- description: The thumbprint of the certificate.
  name: thumbprint
  types:
  - <xref:str>
- description: 'Base 64 encoded string of the public certificate1 in PEM format

    that will be used for authenticating the token.'
  name: encoded_pem_certificate
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerregistry.types.TokenCertificate.encodedPemCertificate
  name: encodedPemCertificate
  summary: 'Base 64 encoded string of the public certificate1 in PEM format that will
    be used for

    authenticating the token.'
  signature: 'encodedPemCertificate: str'
- uid: azure.mgmt.containerregistry.types.TokenCertificate.expiry
  name: expiry
  summary: The expiry datetime of the certificate.
  signature: 'expiry: str'
- uid: azure.mgmt.containerregistry.types.TokenCertificate.name
  name: name
  summary: '"certificate1" and "certificate2".'
  signature: 'name: str | TokenCertificateName'
- uid: azure.mgmt.containerregistry.types.TokenCertificate.thumbprint
  name: thumbprint
  summary: The thumbprint of the certificate.
  signature: 'thumbprint: str'
