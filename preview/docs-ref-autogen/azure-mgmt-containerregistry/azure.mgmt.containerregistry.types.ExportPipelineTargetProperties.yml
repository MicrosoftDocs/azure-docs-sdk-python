uid: azure.mgmt.containerregistry.types.ExportPipelineTargetProperties
name: ExportPipelineTargetProperties
fullName: azure.mgmt.containerregistry.types.ExportPipelineTargetProperties
module: azure.mgmt.containerregistry.types
summary: The properties of the export pipeline target.
constructor:
  syntax: ExportPipelineTargetProperties()
variables:
- description: The type of target for the export pipeline.
  name: type
  types:
  - <xref:str>
- description: 'The target uri of the export pipeline. When ''AzureStorageBlob'':

    "[https://accountName.blob.core.windows.net/containerName/blobName](https://accountName.blob.core.windows.net/containerName/blobName)"
    When

    ''AzureStorageBlobContainer'':  "[https://accountName.blob.core.windows.net/containerName](https://accountName.blob.core.windows.net/containerName)".'
  name: uri
  types:
  - <xref:str>
- description: They key vault secret uri to obtain the target storage SAS token.
  name: key_vault_uri
  types:
  - <xref:str>
- description: 'The storage access mode used for the customer storage account. Known

    values are: "ManagedIdentity" and "SasToken".'
  name: storage_access_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageAccessMode">]
attributes:
- uid: azure.mgmt.containerregistry.types.ExportPipelineTargetProperties.keyVaultUri
  name: keyVaultUri
  summary: They key vault secret uri to obtain the target storage SAS token.
  signature: 'keyVaultUri: str'
- uid: azure.mgmt.containerregistry.types.ExportPipelineTargetProperties.storageAccessMode
  name: storageAccessMode
  summary: 'The storage access mode used for the customer storage account. Known values
    are:

    "ManagedIdentity" and "SasToken".'
  signature: 'storageAccessMode: str | StorageAccessMode'
- uid: azure.mgmt.containerregistry.types.ExportPipelineTargetProperties.type
  name: type
  summary: The type of target for the export pipeline.
  signature: 'type: str'
- uid: azure.mgmt.containerregistry.types.ExportPipelineTargetProperties.uri
  name: uri
  summary: 'The target uri of the export pipeline. When ''AzureStorageBlob'':

    "[https://accountName.blob.core.windows.net/containerName/blobName](https://accountName.blob.core.windows.net/containerName/blobName)"
    When

    ''AzureStorageBlobContainer'':  "[https://accountName.blob.core.windows.net/containerName](https://accountName.blob.core.windows.net/containerName)".'
  signature: 'uri: str'
