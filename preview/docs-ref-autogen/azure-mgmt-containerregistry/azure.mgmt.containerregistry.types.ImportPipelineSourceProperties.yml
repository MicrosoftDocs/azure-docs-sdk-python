name: ImportPipelineSourceProperties
fullName: azure.mgmt.containerregistry.types.ImportPipelineSourceProperties
module: azure.mgmt.containerregistry.types
summary: The properties of the import pipeline source.
constructor:
  syntax: ImportPipelineSourceProperties()
variables:
- description: The type of source for the import pipeline. "AzureStorageBlobContainer"
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PipelineSourceType">]
- description: 'The source uri of the import pipeline. When ''AzureStorageBlob'':

    "[https://accountName.blob.core.windows.net/containerName/blobName](https://accountName.blob.core.windows.net/containerName/blobName)"
    When

    ''AzureStorageBlobContainer'': "[https://accountName.blob.core.windows.net/containerName](https://accountName.blob.core.windows.net/containerName)".'
  name: uri
  types:
  - <xref:str>
