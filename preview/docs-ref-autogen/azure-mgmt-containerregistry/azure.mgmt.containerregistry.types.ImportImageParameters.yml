### YamlMime:PythonClass
uid: azure.mgmt.containerregistry.types.ImportImageParameters
name: ImportImageParameters
fullName: azure.mgmt.containerregistry.types.ImportImageParameters
module: azure.mgmt.containerregistry.types
summary: ImportImageParameters.
constructor:
  syntax: ImportImageParameters()
variables:
- description: The source of the image. Required.
  name: source
  types:
  - <xref:<xref:"ImportSource">>
- description: 'List of strings of the form repo[:tag]. When tag is omitted the source
    will

    be used (or ''latest'' if source tag is also omitted).'
  name: target_tags
  types:
  - <xref:list>[<xref:str>]
- description: 'List of strings of repository names to do a manifest only

    copy. No tag will be created.'
  name: untagged_target_repositories
  types:
  - <xref:list>[<xref:str>]
- description: 'When Force, any existing target tags will be overwritten. When NoForce,
    any

    existing target tags will fail the operation before any copying begins. Known
    values are:

    "NoForce" and "Force".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ImportMode">]
attributes:
- uid: azure.mgmt.containerregistry.types.ImportImageParameters.mode
  name: mode
  summary: 'When Force, any existing target tags will be overwritten. When NoForce,
    any existing target

    tags will fail the operation before any copying begins. Known values are: "NoForce"
    and

    "Force".'
  signature: 'mode: str | ImportMode'
- uid: azure.mgmt.containerregistry.types.ImportImageParameters.source
  name: source
  summary: The source of the image. Required.
  signature: 'source: Required[ImportSource]'
- uid: azure.mgmt.containerregistry.types.ImportImageParameters.targetTags
  name: targetTags
  summary: 'tag]. When tag is omitted the source will be used (or

    ''latest'' if source tag is also omitted).'
  signature: 'targetTags: list[str]'
- uid: azure.mgmt.containerregistry.types.ImportImageParameters.untaggedTargetRepositories
  name: untaggedTargetRepositories
  summary: List of strings of repository names to do a manifest only copy. No tag
    will be created.
  signature: 'untaggedTargetRepositories: list[str]'
