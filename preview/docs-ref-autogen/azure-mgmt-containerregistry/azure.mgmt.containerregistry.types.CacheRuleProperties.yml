### YamlMime:PythonClass
uid: azure.mgmt.containerregistry.types.CacheRuleProperties
name: CacheRuleProperties
fullName: azure.mgmt.containerregistry.types.CacheRuleProperties
module: azure.mgmt.containerregistry.types
summary: The properties of a cache rule.
constructor:
  syntax: CacheRuleProperties()
variables:
- description: 'The ARM resource ID of the credential store which is

    associated with the cache rule.'
  name: credential_set_resource_id
  types:
  - <xref:str>
- description: 'Authentication configuration used by the cache rule

    to access the upstream source repository.'
  name: additional_authentication_properties
  types:
  - <xref:<xref:"AdditionalAuthenticationProperties">>
- description: Source repository pulled from upstream.
  name: source_repository
  types:
  - <xref:str>
- description: 'Target repository specified in docker pull command. Eg: docker pull

    myregistry.azurecr.io/{targetRepository}:{tag}.'
  name: target_repository
  types:
  - <xref:str>
- description: The creation date of the cache rule.
  name: creation_date
  types:
  - <xref:str>
- description: 'Provisioning state of the resource. Known values are: "Creating",

    "Updating", "Deleting", "Succeeded", "Failed", and "Canceled".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.containerregistry.types.CacheRuleProperties.additionalAuthenticationProperties
  name: additionalAuthenticationProperties
  summary: Authentication configuration used by the cache rule to access the upstream
    source repository.
  signature: 'additionalAuthenticationProperties: AdditionalAuthenticationProperties'
- uid: azure.mgmt.containerregistry.types.CacheRuleProperties.creationDate
  name: creationDate
  summary: The creation date of the cache rule.
  signature: 'creationDate: str'
- uid: azure.mgmt.containerregistry.types.CacheRuleProperties.credentialSetResourceId
  name: credentialSetResourceId
  summary: The ARM resource ID of the credential store which is associated with the
    cache rule.
  signature: 'credentialSetResourceId: str'
- uid: azure.mgmt.containerregistry.types.CacheRuleProperties.provisioningState
  name: provisioningState
  summary: '"Creating", "Updating", "Deleting",

    "Succeeded", "Failed", and "Canceled".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.containerregistry.types.CacheRuleProperties.sourceRepository
  name: sourceRepository
  summary: Source repository pulled from upstream.
  signature: 'sourceRepository: str'
- uid: azure.mgmt.containerregistry.types.CacheRuleProperties.targetRepository
  name: targetRepository
  summary: 'docker pull

    myregistry.azurecr.io/{targetRepository}:{tag}.'
  signature: 'targetRepository: str'
