### YamlMime:PythonClass
uid: azure.mgmt.containerregistry.types.TokenProperties
name: TokenProperties
fullName: azure.mgmt.containerregistry.types.TokenProperties
module: azure.mgmt.containerregistry.types
summary: The properties of a token.
constructor:
  syntax: TokenProperties()
variables:
- description: The creation date of scope map.
  name: creation_date
  types:
  - <xref:str>
- description: 'Provisioning state of the resource. Known values are: "Creating",

    "Updating", "Deleting", "Succeeded", "Failed", and "Canceled".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The resource ID of the scope map to which the token will be associated

    with.'
  name: scope_map_id
  types:
  - <xref:str>
- description: The credentials that can be used for authenticating the token.
  name: credentials
  types:
  - <xref:<xref:"TokenCredentialsProperties">>
- description: 'The status of the token example enabled or disabled. Known values
    are: "enabled"

    and "disabled".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TokenStatus">]
attributes:
- uid: azure.mgmt.containerregistry.types.TokenProperties.creationDate
  name: creationDate
  summary: The creation date of scope map.
  signature: 'creationDate: str'
- uid: azure.mgmt.containerregistry.types.TokenProperties.credentials
  name: credentials
  summary: The credentials that can be used for authenticating the token.
  signature: 'credentials: TokenCredentialsProperties'
- uid: azure.mgmt.containerregistry.types.TokenProperties.provisioningState
  name: provisioningState
  summary: '"Creating", "Updating", "Deleting",

    "Succeeded", "Failed", and "Canceled".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.containerregistry.types.TokenProperties.scopeMapId
  name: scopeMapId
  summary: The resource ID of the scope map to which the token will be associated
    with.
  signature: 'scopeMapId: str'
- uid: azure.mgmt.containerregistry.types.TokenProperties.status
  name: status
  summary: '"enabled" and

    "disabled".'
  signature: 'status: str | TokenStatus'
