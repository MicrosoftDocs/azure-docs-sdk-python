uid: azure.mgmt.containerregistry.types.RegistrySyncResult
name: RegistrySyncResult
fullName: azure.mgmt.containerregistry.types.RegistrySyncResult
module: azure.mgmt.containerregistry.types
summary: The registry sync result of the connected registry.
constructor:
  syntax: RegistrySyncResult()
variables:
- description: 'The action that triggered the most recent registry sync. Required.
    Known

    values are: "SyncTokenUpdate", "InitialSync", "ManualResync", and "RecoveryService".'
  name: sync_trigger
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyncTrigger">]
- description: 'The status of the connected registry''s most recent sync. Required.
    Known

    values are: "NotActivated", "Syncing", "Failed", "Succeeded", "TimedOut", and
    "Pending".'
  name: sync_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyncState">]
- description: The time that the connected registry's most recent sync started.
  name: last_sync_start_time
  types:
  - <xref:str>
- description: The time that the connected registry's most recent sync ended.
  name: last_sync_end_time
  types:
  - <xref:str>
- description: 'The time that the connected registry''s most recent

    successful sync ended.'
  name: last_successful_sync_end_time
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerregistry.types.RegistrySyncResult.lastSuccessfulSyncEndTime
  name: lastSuccessfulSyncEndTime
  summary: The time that the connected registry's most recent successful sync ended.
  signature: 'lastSuccessfulSyncEndTime: str'
- uid: azure.mgmt.containerregistry.types.RegistrySyncResult.lastSyncEndTime
  name: lastSyncEndTime
  summary: The time that the connected registry's most recent sync ended.
  signature: 'lastSyncEndTime: str'
- uid: azure.mgmt.containerregistry.types.RegistrySyncResult.lastSyncStartTime
  name: lastSyncStartTime
  summary: The time that the connected registry's most recent sync started.
  signature: 'lastSyncStartTime: str'
- uid: azure.mgmt.containerregistry.types.RegistrySyncResult.syncState
  name: syncState
  summary: 'The status of the connected registry''s most recent sync. Required. Known
    values are:

    "NotActivated", "Syncing", "Failed", "Succeeded", "TimedOut", and "Pending".'
  signature: 'syncState: Required[str | SyncState]'
- uid: azure.mgmt.containerregistry.types.RegistrySyncResult.syncTrigger
  name: syncTrigger
  summary: 'The action that triggered the most recent registry sync. Required. Known
