### YamlMime:PythonClass
uid: azure.mgmt.containerregistry.types.WebhookPropertiesCreateParameters
name: WebhookPropertiesCreateParameters
fullName: azure.mgmt.containerregistry.types.WebhookPropertiesCreateParameters
module: azure.mgmt.containerregistry.types
summary: The parameters for creating the properties of a webhook.
constructor:
  syntax: WebhookPropertiesCreateParameters()
variables:
- description: The service URI for the webhook to post notifications. Required.
  name: service_uri
  types:
  - <xref:str>
- description: Custom headers that will be added to the webhook notifications.
  name: custom_headers
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'The status of the webhook at the time the operation was called. Known
    values are:

    "enabled" and "disabled".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WebhookStatus">]
- description: 'The scope of repositories where the event can be triggered. For example,
    ''foo:>>*<<''

    means events for all tags under repository ''foo''. ''foo:bar'' means events for
    ''foo:bar'' only.

    ''foo'' is equivalent to ''foo:latest''. Empty means all events.'
  name: scope
  types:
  - <xref:str>
- description: The list of actions that trigger the webhook to post notifications.
    Required.
  name: actions
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"WebhookAction">]]
attributes:
- uid: azure.mgmt.containerregistry.types.WebhookPropertiesCreateParameters.actions
  name: actions
  summary: The list of actions that trigger the webhook to post notifications. Required.
  signature: 'actions: Union[str, ForwardRef(''WebhookAction'')]]]'
- uid: azure.mgmt.containerregistry.types.WebhookPropertiesCreateParameters.customHeaders
  name: customHeaders
  summary: Custom headers that will be added to the webhook notifications.
  signature: 'customHeaders: dict[str, str]'
- uid: azure.mgmt.containerregistry.types.WebhookPropertiesCreateParameters.scope
  name: scope
  summary: '>>*<<'' means events

    for all tags under repository ''foo''. ''foo:bar'' means events for ''foo:bar''
    only. ''foo'' is

    equivalent to ''foo:latest''. Empty means all events.'
  signature: 'scope: str'
- uid: azure.mgmt.containerregistry.types.WebhookPropertiesCreateParameters.serviceUri
  name: serviceUri
  summary: The service URI for the webhook to post notifications. Required.
  signature: 'serviceUri: Required[str]'
- uid: azure.mgmt.containerregistry.types.WebhookPropertiesCreateParameters.status
  name: status
  summary: '"enabled"

    and "disabled".'
  signature: 'status: str | WebhookStatus'
