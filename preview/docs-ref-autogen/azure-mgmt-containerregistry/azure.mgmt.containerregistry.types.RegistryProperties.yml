  name: metadataSearch
  summary: 'Determines whether registry artifacts are indexed for metadata search.
    Known values are:

    "Enabled" and "Disabled".'
  signature: 'metadataSearch: str | MetadataSearch'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.networkRuleBypassAllowedForTasks
  name: networkRuleBypassAllowedForTasks
  summary: Whether or not Tasks allowed to bypass the network rules for this container
