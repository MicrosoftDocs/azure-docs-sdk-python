  signature: 'networkRuleBypassAllowedForTasks: bool'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.networkRuleBypassOptions
  name: networkRuleBypassOptions
  summary: 'Whether to allow trusted Azure services to access a network restricted
    registry. Known values

    are: "AzureServices" and "None".'
  signature: 'networkRuleBypassOptions: str | NetworkRuleBypassOptions'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.networkRuleSet
  name: networkRuleSet
  summary: The network rule set for a container registry.
  signature: 'networkRuleSet: NetworkRuleSet'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.policies
  name: policies
  summary: The policies for a container registry.
  signature: 'policies: Policies'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.privateEndpointConnections
  name: privateEndpointConnections
  summary: List of private endpoint connections for a container registry.
  signature: 'privateEndpointConnections: list[''PrivateEndpointConnection'']'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.provisioningState
  name: provisioningState
  summary: 'The provisioning state of the container registry at the time the operation
    was called. Known

    values are: "Creating", "Updating", "Deleting", "Succeeded", "Failed", and

    "Canceled".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.publicNetworkAccess
  name: publicNetworkAccess
  summary: 'Whether or not public network access is allowed for the container registry.
    Known values are:

    "Enabled" and "Disabled".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.regionalEndpointHostNames
  name: regionalEndpointHostNames
  summary: List of host names that will serve registry when RegionalEndpoints is enabled.
  signature: 'regionalEndpointHostNames: list[str]'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.regionalEndpoints
  name: regionalEndpoints
  summary: '"Enabled" and

    "Disabled".'
  signature: 'regionalEndpoints: str | RegionalEndpoints'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.roleAssignmentMode
  name: roleAssignmentMode
  summary: '"AbacRepositoryPermissions" and

    "LegacyRegistryPermissions".'
  signature: 'roleAssignmentMode: str | RoleAssignmentMode'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.status
  name: status
  summary: The status of the container registry at the time the operation was called.
  signature: 'status: Status'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.writableCacheRepos
  name: writableCacheRepos
  summary: 'Whether to allow cache operations that write to repositories in this registry.
    Known values

    are: "Enabled" and "Disabled".'
  signature: 'writableCacheRepos: str | WritableCacheRepos'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.zoneRedundancy
  name: zoneRedundancy
  summary: 'Whether or not zone redundancy is enabled for this container registry.
    Known values are:

    "Enabled" and "Disabled".'
  signature: 'zoneRedundancy: str | ZoneRedundancy'
