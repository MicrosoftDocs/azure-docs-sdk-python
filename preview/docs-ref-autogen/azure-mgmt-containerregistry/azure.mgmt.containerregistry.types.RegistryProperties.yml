### YamlMime:PythonClass
uid: azure.mgmt.containerregistry.types.RegistryProperties
name: RegistryProperties
fullName: azure.mgmt.containerregistry.types.RegistryProperties
module: azure.mgmt.containerregistry.types
summary: The properties of a container registry.
constructor:
  syntax: RegistryProperties()
variables:
- description: The URL that can be used to log into the container registry.
  name: login_server
  types:
  - <xref:str>
- description: The creation date of the container registry in ISO8601 format.
  name: creation_date
  types:
  - <xref:str>
- description: 'The provisioning state of the container registry at the time the

    operation was called. Known values are: "Creating", "Updating", "Deleting", "Succeeded",

    "Failed", and "Canceled".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The status of the container registry at the time the operation was
    called.
  name: status
  types:
  - <xref:<xref:"Status">>
- description: The value that indicates whether the admin user is enabled.
  name: admin_user_enabled
  types:
  - <xref:bool>
- description: The network rule set for a container registry.
  name: network_rule_set
  types:
  - <xref:<xref:"NetworkRuleSet">>
- description: The policies for a container registry.
  name: policies
  types:
  - <xref:<xref:"Policies">>
- description: The encryption settings of container registry.
  name: encryption
  types:
  - <xref:<xref:"EncryptionProperty">>
- description: Enable a single data endpoint per region for serving data.
  name: data_endpoint_enabled
  types:
  - <xref:bool>
- description: 'List of host names that will serve data when

    dataEndpointEnabled is true.'
  name: data_endpoint_host_names
  types:
  - <xref:list>[<xref:str>]
- description: 'Enable per-region endpoints for accessing registry. Known values are:

    "Enabled" and "Disabled".'
  name: regional_endpoints
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RegionalEndpoints">]
- description: 'List of host names that will serve registry when

    RegionalEndpoints is enabled.'
  name: regional_endpoint_host_names
  types:
  - <xref:list>[<xref:str>]
- description: 'The connectivity protocol for the registry, such as IPv4 or dual stack

    (IPv4 and IPv6). Known values are: "IPv4" and "IPv4AndIPv6".'
  name: endpoint_protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EndpointProtocol">]
- description: 'List of private endpoint connections for a container

    registry.'
  name: private_endpoint_connections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: 'Whether or not public network access is allowed for the container

    registry. Known values are: "Enabled" and "Disabled".'
  name: public_network_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: 'Whether to allow trusted Azure services to access a network

    restricted registry. Known values are: "AzureServices" and "None".'
  name: network_rule_bypass_options
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkRuleBypassOptions">]
- description: 'Whether or not Tasks allowed to bypass the network

    rules for this container registry.'
  name: network_rule_bypass_allowed_for_tasks
  types:
  - <xref:bool>
- description: 'Whether or not zone redundancy is enabled for this container registry.

    Known values are: "Enabled" and "Disabled".'
  name: zone_redundancy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ZoneRedundancy">]
- description: Enables registry-wide pull from unauthenticated clients.
  name: anonymous_pull_enabled
  types:
  - <xref:bool>
- description: 'Determines whether registry artifacts are indexed for metadata search.

    Known values are: "Enabled" and "Disabled".'
  name: metadata_search
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MetadataSearch">]
- description: 'Determines the domain name label reuse scope.

    Known values are: "Unsecure", "TenantReuse", "SubscriptionReuse", "ResourceGroupReuse",
    and

    "NoReuse".'
  name: auto_generated_domain_name_label_scope
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoGeneratedDomainNameLabelScope">]
- description: 'Whether to allow cache operations that write to repositories in

    this registry. Known values are: "Enabled" and "Disabled".'
  name: writable_cache_repos
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WritableCacheRepos">]
- description: 'Determines registry role assignment mode. Known values are:

    "AbacRepositoryPermissions" and "LegacyRegistryPermissions".'
  name: role_assignment_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RoleAssignmentMode">]
attributes:
- uid: azure.mgmt.containerregistry.types.RegistryProperties.adminUserEnabled
  name: adminUserEnabled
  summary: The value that indicates whether the admin user is enabled.
  signature: 'adminUserEnabled: bool'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.anonymousPullEnabled
  name: anonymousPullEnabled
  summary: Enables registry-wide pull from unauthenticated clients.
  signature: 'anonymousPullEnabled: bool'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.autoGeneratedDomainNameLabelScope
  name: autoGeneratedDomainNameLabelScope
  summary: '"Unsecure", "TenantReuse",

    "SubscriptionReuse", "ResourceGroupReuse", and "NoReuse".'
  signature: 'autoGeneratedDomainNameLabelScope: str | AutoGeneratedDomainNameLabelScope'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.creationDate
  name: creationDate
  summary: The creation date of the container registry in ISO8601 format.
  signature: 'creationDate: str'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.dataEndpointEnabled
  name: dataEndpointEnabled
  summary: Enable a single data endpoint per region for serving data.
  signature: 'dataEndpointEnabled: bool'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.dataEndpointHostNames
  name: dataEndpointHostNames
  summary: List of host names that will serve data when dataEndpointEnabled is true.
  signature: 'dataEndpointHostNames: list[str]'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.encryption
  name: encryption
  summary: The encryption settings of container registry.
  signature: 'encryption: EncryptionProperty'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.endpointProtocol
  name: endpointProtocol
  summary: 'The connectivity protocol for the registry, such as IPv4 or dual stack
    (IPv4 and IPv6). Known

    values are: "IPv4" and "IPv4AndIPv6".'
  signature: 'endpointProtocol: str | EndpointProtocol'
- uid: azure.mgmt.containerregistry.types.RegistryProperties.loginServer
  name: loginServer
  summary: The URL that can be used to log into the container registry.
