### YamlMime:PythonClass
uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters
name: RegistryPropertiesUpdateParameters
fullName: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters
module: azure.mgmt.containerregistry.types
summary: The parameters for updating the properties of a container registry.
constructor:
  syntax: RegistryPropertiesUpdateParameters()
variables:
- description: The value that indicates whether the admin user is enabled.
  name: adminUserEnabled
  types:
  - <xref:bool>
- description: The network rule set for a container registry.
  name: networkRuleSet
  types:
  - <xref:<xref:"NetworkRuleSet">>
- description: The policies for a container registry.
  name: policies
  types:
  - <xref:<xref:"Policies">>
- description: The encryption settings of container registry.
  name: encryption
  types:
  - <xref:<xref:"EncryptionProperty">>
- description: Enable a single data endpoint per region for serving data.
  name: dataEndpointEnabled
  types:
  - <xref:bool>
- description: 'Enable per-region endpoints for accessing registry. Known values are:

    "Enabled" and "Disabled".'
  name: regionalEndpoints
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RegionalEndpoints">]
- description: 'The connectivity protocol for the registry, such as IPv4 or dual stack

    (IPv4 and IPv6). Known values are: "IPv4" and "IPv4AndIPv6".'
  name: endpointProtocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EndpointProtocol">]
- description: 'Whether or not public network access is allowed for the container

    registry. Known values are: "Enabled" and "Disabled".'
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: 'Whether to allow trusted Azure services to access a network

    restricted registry. Known values are: "AzureServices" and "None".'
  name: networkRuleBypassOptions
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkRuleBypassOptions">]
- description: 'Whether to allow ACR Tasks service to access a network

    restricted registry.'
  name: networkRuleBypassAllowedForTasks
  types:
  - <xref:bool>
- description: Enables registry-wide pull from unauthenticated clients.
  name: anonymousPullEnabled
  types:
  - <xref:bool>
- description: 'Determines whether registry artifacts are indexed for metadata search.

    Known values are: "Enabled" and "Disabled".'
  name: metadataSearch
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MetadataSearch">]
- description: 'Whether to allow cache operations that write to repositories in this

    registry. Known values are: "Enabled" and "Disabled".'
  name: writableCacheRepos
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WritableCacheRepos">]
- description: 'Determines registry role assignment mode. Known values are:

    "AbacRepositoryPermissions" and "LegacyRegistryPermissions".'
  name: roleAssignmentMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RoleAssignmentMode">]
attributes:
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.adminUserEnabled
  name: adminUserEnabled
  summary: The value that indicates whether the admin user is enabled.
  signature: 'adminUserEnabled: bool'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.anonymousPullEnabled
  name: anonymousPullEnabled
  summary: Enables registry-wide pull from unauthenticated clients.
  signature: 'anonymousPullEnabled: bool'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.dataEndpointEnabled
  name: dataEndpointEnabled
  summary: Enable a single data endpoint per region for serving data.
  signature: 'dataEndpointEnabled: bool'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.encryption
  name: encryption
  summary: The encryption settings of container registry.
  signature: 'encryption: EncryptionProperty'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.endpointProtocol
  name: endpointProtocol
  summary: 'The connectivity protocol for the registry, such as IPv4 or dual stack
    (IPv4 and IPv6). Known

    values are: "IPv4" and "IPv4AndIPv6".'
  signature: 'endpointProtocol: str | EndpointProtocol'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.metadataSearch
  name: metadataSearch
  summary: 'Determines whether registry artifacts are indexed for metadata search.
    Known values are:

    "Enabled" and "Disabled".'
  signature: 'metadataSearch: str | MetadataSearch'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.networkRuleBypassAllowedForTasks
  name: networkRuleBypassAllowedForTasks
  summary: Whether to allow ACR Tasks service to access a network restricted registry.
  signature: 'networkRuleBypassAllowedForTasks: bool'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.networkRuleBypassOptions
  name: networkRuleBypassOptions
  summary: 'Whether to allow trusted Azure services to access a network restricted
    registry. Known values

    are: "AzureServices" and "None".'
  signature: 'networkRuleBypassOptions: str | NetworkRuleBypassOptions'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.networkRuleSet
  name: networkRuleSet
  summary: The network rule set for a container registry.
  signature: 'networkRuleSet: NetworkRuleSet'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.policies
  name: policies
  summary: The policies for a container registry.
  signature: 'policies: Policies'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.publicNetworkAccess
  name: publicNetworkAccess
  summary: 'Whether or not public network access is allowed for the container registry.
    Known values are:

    "Enabled" and "Disabled".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.regionalEndpoints
  name: regionalEndpoints
  summary: '"Enabled" and

    "Disabled".'
  signature: 'regionalEndpoints: str | RegionalEndpoints'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.roleAssignmentMode
  name: roleAssignmentMode
  summary: '"AbacRepositoryPermissions" and

    "LegacyRegistryPermissions".'
  signature: 'roleAssignmentMode: str | RoleAssignmentMode'
- uid: azure.mgmt.containerregistry.types.RegistryPropertiesUpdateParameters.writableCacheRepos
  name: writableCacheRepos
  summary: 'Whether to allow cache operations that write to repositories in this registry.
