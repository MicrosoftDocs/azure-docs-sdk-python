### YamlMime:PythonClass
uid: azure.mgmt.managedapplications.types.ApplicationProperties
name: ApplicationProperties
fullName: azure.mgmt.managedapplications.types.ApplicationProperties
module: azure.mgmt.managedapplications.types
summary: The managed application properties.
constructor:
  syntax: ApplicationProperties()
variables:
- description: The managed resource group Id.
  name: managed_resource_group_id
  types:
  - <xref:str>
- description: The fully qualified path of managed application definition Id.
  name: application_definition_id
  types:
  - <xref:str>
- description: 'Name and value pairs that define the managed application parameters.
    It can

    be a JObject or a well formed JSON string.'
  name: parameters
  types:
  - <xref:typing.Any>
- description: Name and value pairs that define the managed application outputs.
  name: outputs
  types:
  - <xref:typing.Any>
- description: 'The managed application provisioning state. Known values are:

    "NotSpecified", "Accepted", "Running", "Deleting", "Deleted", "Canceled", "Failed",

    "Succeeded", and "Updating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The managed application billing details.
  name: billing_details
  types:
  - <xref:<xref:"ApplicationBillingDetailsDefinition">>
- description: The managed application Jit access policy.
  name: jit_access_policy
  types:
  - <xref:<xref:"ApplicationJitAccessPolicy">>
- description: The publisher tenant Id.
  name: publisher_tenant_id
  types:
  - <xref:str>
- description: 'The  read-only authorizations property that is retrieved from the

    application package.'
  name: authorizations
  types:
  - <xref:list>[<xref:"ApplicationAuthorization">]
- description: 'The managed application management mode. Known values are:

    "NotSpecified", "Unmanaged", and "Managed".'
  name: management_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationManagementMode">]
- description: 'The read-only customer support property that is retrieved from the

    application package.'
  name: customer_support
  types:
  - <xref:<xref:"ApplicationPackageContact">>
- description: 'The read-only support URLs property that is retrieved from the application

    package.'
  name: support_urls
  types:
  - <xref:<xref:"ApplicationPackageSupportUrls">>
- description: The collection of managed application artifacts.
  name: artifacts
  types:
  - <xref:list>[<xref:"ApplicationArtifact">]
- description: The client entity that created the JIT request.
  name: created_by
  types:
  - <xref:<xref:"ApplicationClientDetails">>
- description: The client entity that last updated the JIT request.
  name: updated_by
  types:
  - <xref:<xref:"ApplicationClientDetails">>
attributes:
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.applicationDefinitionId
  name: applicationDefinitionId
  summary: The fully qualified path of managed application definition Id.
  signature: 'applicationDefinitionId: str'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.artifacts
  name: artifacts
  summary: The collection of managed application artifacts.
  signature: 'artifacts: list[''ApplicationArtifact'']'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.authorizations
  name: authorizations
  summary: The  read-only authorizations property that is retrieved from the application
    package.
  signature: 'authorizations: list[''ApplicationAuthorization'']'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.billingDetails
  name: billingDetails
  summary: The managed application billing details.
  signature: 'billingDetails: ApplicationBillingDetailsDefinition'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.createdBy
  name: createdBy
  summary: The client entity that created the JIT request.
  signature: 'createdBy: ApplicationClientDetails'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.customerSupport
  name: customerSupport
  summary: The read-only customer support property that is retrieved from the application
    package.
  signature: 'customerSupport: ApplicationPackageContact'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.jitAccessPolicy
  name: jitAccessPolicy
  summary: The managed application Jit access policy.
  signature: 'jitAccessPolicy: ApplicationJitAccessPolicy'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.managedResourceGroupId
  name: managedResourceGroupId
  summary: The managed resource group Id.
  signature: 'managedResourceGroupId: str'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.managementMode
  name: managementMode
  summary: '"NotSpecified", "Unmanaged", and

    "Managed".'
  signature: 'managementMode: str | ApplicationManagementMode'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.outputs
  name: outputs
  summary: Name and value pairs that define the managed application outputs.
  signature: 'outputs: Any'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.parameters
  name: parameters
  summary: 'Name and value pairs that define the managed application parameters. It
    can be a JObject or a

    well formed JSON string.'
  signature: 'parameters: Any'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.provisioningState
  name: provisioningState
  summary: '"NotSpecified", "Accepted",

    "Running", "Deleting", "Deleted", "Canceled", "Failed", "Succeeded", and

    "Updating".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.publisherTenantId
  name: publisherTenantId
  summary: The publisher tenant Id.
  signature: 'publisherTenantId: str'
- uid: azure.mgmt.managedapplications.types.ApplicationProperties.supportUrls
  name: supportUrls
  summary: The read-only support URLs property that is retrieved from the application
    package.
  signature: 'supportUrls: ApplicationPackageSupportUrls'
