  - <xref:<xref:"ApplicationNotificationPolicy">>
- description: The managed application locking policy.
  name: locking_policy
  types:
  - <xref:<xref:"ApplicationPackageLockingPolicyDefinition">>
- description: The managed application deployment policy.
  name: deployment_policy
  types:
  - <xref:<xref:"ApplicationDeploymentPolicy">>
- description: 'The managed application management policy that determines publisher''s

    access to the managed resource group.'
  name: management_policy
  types:
  - <xref:<xref:"ApplicationManagementPolicy">>
- description: The managed application provider policies.
  name: policies
  types:
  - <xref:list>[<xref:"ApplicationPolicy">]
