uid: azure.mgmt.networkcloud.models.StorageApplianceConfigurationData
name: StorageApplianceConfigurationData
fullName: azure.mgmt.networkcloud.models.StorageApplianceConfigurationData
module: azure.mgmt.networkcloud.models
summary: StorageApplianceConfigurationData represents configuration for the storage
  application.
constructor:
  syntax: 'StorageApplianceConfigurationData(*args: Any, **kwargs: Any)'
variables:
- description: 'The credentials of the administrative interface on this storage

    appliance. The password field is expected to be an Azure Key Vault key URL. Until
    the cluster

    is converted to utilize managed identity by setting the secret archive settings,
    the actual

    password value should be provided instead. Required.'
  name: admin_credentials
  types:
  - <xref:azure.mgmt.networkcloud.models.AdministrativeCredentials>
- description: 'The slot that storage appliance is in the rack based on the BOM configuration.

    Required.'
  name: rack_slot
  types:
  - <xref:int>
- description: The serial number of the appliance. Required.
  name: serial_number
  types:
  - <xref:str>
- description: 'The user-provided name for the storage appliance that will be

    created from this specification.'
  name: storage_appliance_name
  types:
  - <xref:str>
attributes:
