  name: bmc_mac_address
  summary: The MAC address of the BMC device.
  signature: 'bmc_mac_address: str | None'
- uid: azure.mgmt.networkcloud.models.BareMetalMachineReplaceParameters.boot_mac_address
  name: boot_mac_address
  summary: The MAC address of a NIC connected to the PXE network.
