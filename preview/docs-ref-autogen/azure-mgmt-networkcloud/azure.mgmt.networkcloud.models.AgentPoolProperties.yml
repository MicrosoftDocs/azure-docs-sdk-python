### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.models.AgentPoolProperties
name: AgentPoolProperties
fullName: azure.mgmt.networkcloud.models.AgentPoolProperties
module: azure.mgmt.networkcloud.models
summary: AgentPoolProperties represents the properties of the Kubernetes cluster agent
  pool.
constructor:
  syntax: 'AgentPoolProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The administrator credentials to be used for the nodes in

    this agent pool.'
  name: administrator_configuration
  types:
  - <xref:azure.mgmt.networkcloud.models.AdministratorConfiguration>
- description: The configurations that will be applied to each agent in this agent
    pool.
  name: agent_options
  types:
  - <xref:azure.mgmt.networkcloud.models.AgentOptions>
- description: 'The configuration of networks being attached to the agent

    pool for use by the workloads that run on this Kubernetes cluster.'
  name: attached_network_configuration
  types:
  - <xref:azure.mgmt.networkcloud.models.AttachedNetworkConfiguration>
- description: 'The list of availability zones of the Network Cloud cluster used for

    the provisioning of nodes in this agent pool. If not specified, all availability
    zones will be

    used.'
  name: availability_zones
  types:
  - <xref:list>[<xref:str>]
- description: The number of virtual machines that use this configuration. Required.
  name: count
  types:
  - <xref:int>
- description: The labels applied to the nodes in this agent pool.
  name: labels
  types:
  - <xref:list>[<xref:azure.mgmt.networkcloud.models.KubernetesLabel>]
- description: 'The selection of how this agent pool is utilized, either as a system
    pool or a user

    pool. System pools run the features and critical services for the Kubernetes Cluster,
    while

    user pools are dedicated to user workloads. Every Kubernetes cluster must contain
    at least one

    system node pool with at least one node. Required. Known values are: "System",
    "User", and

    "NotApplicable".'
  name: mode
  types:
  - <xref:str>
  - <xref:azure.mgmt.networkcloud.models.AgentPoolMode>
- description: The taints applied to the nodes in this agent pool.
  name: taints
  types:
  - <xref:list>[<xref:azure.mgmt.networkcloud.models.KubernetesLabel>]
- description: The configuration of the agent pool.
  name: upgrade_settings
  types:
  - <xref:azure.mgmt.networkcloud.models.AgentPoolUpgradeSettings>
- description: 'The name of the VM SKU that determines the size of resources allocated
    for

    node VMs. Required.'
  name: vm_sku_name
  types:
  - <xref:str>
- description: 'The current status of the agent pool. Known values are: "Available",

    "Error", and "Provisioning".'
  name: detailed_status
  types:
  - <xref:str>
  - <xref:azure.mgmt.networkcloud.models.AgentPoolDetailedStatus>
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: The Kubernetes version running in this agent pool.
  name: kubernetes_version
  types:
  - <xref:str>
- description: 'The provisioning state of the agent pool. Known values are:

    "Accepted", "Canceled", "Deleting", "Failed", "InProgress", "Succeeded", and "Updating".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.networkcloud.models.AgentPoolProvisioningState>
attributes:
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.administrator_configuration
  name: administrator_configuration
  summary: The administrator credentials to be used for the nodes in this agent pool.
  signature: 'administrator_configuration: _models.AdministratorConfiguration | None'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.agent_options
  name: agent_options
  summary: The configurations that will be applied to each agent in this agent pool.
  signature: 'agent_options: _models.AgentOptions | None'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.attached_network_configuration
  name: attached_network_configuration
  summary: 'The configuration of networks being attached to the agent pool for use
    by the workloads that

    run on this Kubernetes cluster.'
  signature: 'attached_network_configuration: _models.AttachedNetworkConfiguration
    | None'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.availability_zones
  name: availability_zones
  summary: 'The list of availability zones of the Network Cloud cluster used for the
    provisioning of nodes

    in this agent pool. If not specified, all availability zones will be used.'
  signature: 'availability_zones: list[str] | None'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.count
  name: count
  summary: The number of virtual machines that use this configuration. Required.
  signature: 'count: int'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.detailed_status
  name: detailed_status
  summary: '"Available", "Error", and

    "Provisioning".'
  signature: 'detailed_status: str | _models.AgentPoolDetailedStatus | None'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.detailed_status_message
  name: detailed_status_message
  summary: The descriptive message about the current detailed status.
  signature: 'detailed_status_message: str | None'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.kubernetes_version
  name: kubernetes_version
  summary: The Kubernetes version running in this agent pool.
  signature: 'kubernetes_version: str | None'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.labels
  name: labels
  summary: The labels applied to the nodes in this agent pool.
  signature: 'labels: list[''_models.KubernetesLabel''] | None'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.mode
  name: mode
  summary: 'The selection of how this agent pool is utilized, either as a system pool
    or a user pool.

    System pools run the features and critical services for the Kubernetes Cluster,
    while user

    pools are dedicated to user workloads. Every Kubernetes cluster must contain at
    least one

    system node pool with at least one node. Required. Known values are: "System",
    "User", and

    "NotApplicable".'
  signature: 'mode: str | _models.AgentPoolMode'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.provisioning_state
  name: provisioning_state
  summary: '"Accepted", "Canceled",

    "Deleting", "Failed", "InProgress", "Succeeded", and "Updating".'
  signature: 'provisioning_state: str | _models.AgentPoolProvisioningState | None'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.taints
  name: taints
  summary: The taints applied to the nodes in this agent pool.
  signature: 'taints: list[''_models.KubernetesLabel''] | None'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.upgrade_settings
  name: upgrade_settings
  summary: The configuration of the agent pool.
  signature: 'upgrade_settings: _models.AgentPoolUpgradeSettings | None'
- uid: azure.mgmt.networkcloud.models.AgentPoolProperties.vm_sku_name
  name: vm_sku_name
  summary: The name of the VM SKU that determines the size of resources allocated
    for node VMs. Required.
  signature: 'vm_sku_name: str'
