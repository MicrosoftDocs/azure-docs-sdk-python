uid: azure.mgmt.networkcloud.models.AccessBridgeProperties
name: AccessBridgeProperties
fullName: azure.mgmt.networkcloud.models.AccessBridgeProperties
module: azure.mgmt.networkcloud.models
summary: AccessBridgeProperties captures the input and status for an access bridge.
constructor:
  syntax: 'AccessBridgeProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The IPv4 subnet from which the access bridge allocates an address.

    This subnet must be part of the internal network specified by networkId.'
  name: ipv4_connected_prefix
  types:
  - <xref:str>
- description: 'The IPv6 subnet from which the access bridge allocates an address.

    This subnet must be part of the internal network specified by networkId.'
  name: ipv6_connected_prefix
  types:
  - <xref:str>
- description: 'The resource ID of the internal network in a layer 3 isolation domain

    containing the IP subnets to use. Required.'
  name: network_id
  types:
  - <xref:str>
- description: The list of security rules enforced by the access bridge.
  name: security_rules
  types:
  - <xref:list>[<xref:azure.mgmt.networkcloud.models.AccessBridgeSecurityRule>]
- description: 'The detailed status reported by the access bridge. Known values are:

    "Running", "Degraded", and "Failed".'
  name: detailed_status
  types:
  - <xref:str>
  - <xref:azure.mgmt.networkcloud.models.AccessBridgeDetailedStatus>
- description: The descriptive message that accompanies the detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: The observed endpoints that clients should use to reach the access
    bridge.
  name: endpoints
  types:
  - <xref:list>[<xref:azure.mgmt.networkcloud.models.AccessBridgeEndpoint>]
- description: 'The protocol advertised by the access bridge endpoints. Known values
    are: "TCP"

    and "UDP".'
  name: protocol
  types:
  - <xref:str>
  - <xref:azure.mgmt.networkcloud.models.TransportProtocol>
- description: 'The provisioning state of the access bridge. Known values are:

    "Accepted", "Canceled", "Failed", "Provisioning", and "Succeeded".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.networkcloud.models.AccessBridgeProvisioningState>
