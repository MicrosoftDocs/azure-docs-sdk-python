### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.models.AdministratorConfiguration
name: AdministratorConfiguration
fullName: azure.mgmt.networkcloud.models.AdministratorConfiguration
module: azure.mgmt.networkcloud.models
summary: 'AdministratorConfiguration represents the administrative credentials that
  will be applied to

  the control plane and agent pool nodes in Kubernetes clusters.'
constructor:
  syntax: 'AdministratorConfiguration(*args: Any, **kwargs: Any)'
variables:
- description: 'The user name for the administrator that will be applied to the operating

    systems that run Kubernetes nodes. If not supplied, a user name will be chosen
    by the service.'
  name: admin_username
  types:
  - <xref:str>
- description: 'The SSH configuration for the operating systems that run the nodes
    in

    the Kubernetes cluster. In some cases, specification of public keys may be required
    to produce

    a working environment.'
  name: ssh_public_keys
  types:
  - <xref:list>[<xref:azure.mgmt.networkcloud.models.SshPublicKey>]
attributes:
- uid: azure.mgmt.networkcloud.models.AdministratorConfiguration.admin_username
  name: admin_username
  summary: 'The user name for the administrator that will be applied to the operating
    systems that run

    Kubernetes nodes. If not supplied, a user name will be chosen by the service.'
  signature: 'admin_username: str | None'
- uid: azure.mgmt.networkcloud.models.AdministratorConfiguration.ssh_public_keys
  name: ssh_public_keys
  summary: 'The SSH configuration for the operating systems that run the nodes in
    the Kubernetes cluster.

    In some cases, specification of public keys may be required to produce a working
    environment.'
  signature: 'ssh_public_keys: list[''_models.SshPublicKey''] | None'
