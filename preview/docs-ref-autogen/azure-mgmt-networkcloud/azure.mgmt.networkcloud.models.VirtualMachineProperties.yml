uid: azure.mgmt.networkcloud.models.VirtualMachineProperties
name: VirtualMachineProperties
fullName: azure.mgmt.networkcloud.models.VirtualMachineProperties
module: azure.mgmt.networkcloud.models
summary: VirtualMachineProperties represents the properties of the virtual machine.
constructor:
  syntax: 'VirtualMachineProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The name of the administrator to which the ssh public keys will be
    added

    into the authorized keys. Required.'
  name: admin_username
  types:
  - <xref:str>
- description: 'Selects the boot method for the virtual machine. Known values are:
    "BIOS"

    and "UEFI".'
  name: boot_method
