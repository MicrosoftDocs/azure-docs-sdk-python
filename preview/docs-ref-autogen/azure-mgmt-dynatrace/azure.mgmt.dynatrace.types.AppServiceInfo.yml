### YamlMime:PythonClass
uid: azure.mgmt.dynatrace.types.AppServiceInfo
name: AppServiceInfo
fullName: azure.mgmt.dynatrace.types.AppServiceInfo
module: azure.mgmt.dynatrace.types
summary: Details of App Services having Dynatrace OneAgent installed.
constructor:
  syntax: AppServiceInfo()
variables:
- description: App service resource ID.
  name: resource_id
  types:
  - <xref:str>
- description: Version of the Dynatrace agent installed on the App Service.
  name: version
  types:
  - <xref:str>
- description: 'The monitoring mode of OneAgent. Known values are:

    "CLOUD_INFRASTRUCTURE", "FULL_STACK", and "DISCOVERY".'
  name: monitoring_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MonitoringType">]
- description: 'Update settings of OneAgent. Known values are: "ENABLED" and

    "DISABLED".'
  name: auto_update_setting
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoUpdateSetting">]
- description: 'The current update status of OneAgent. Known values are: "INCOMPATIBLE",

    "OUTDATED", "SCHEDULED", "SUPPRESSED", "UNKNOWN", "UP2DATE", "UPDATE_IN_PROGRESS",

    "UPDATE_PENDING", and "UPDATE_PROBLEM".'
  name: update_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UpdateStatus">]
- description: 'The availability state of OneAgent. Known values are: "CRASHED",

    "LOST", "MONITORED", "PRE_MONITORED", "SHUTDOWN", "UNEXPECTED_SHUTDOWN", "UNKNOWN",
    and

    "UNMONITORED".'
  name: availability_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AvailabilityState">]
- description: 'Tells whether log modules are enabled or not. Known values are: "ENABLED"
    and

    "DISABLED".'
  name: log_module
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LogModule">]
- description: The name of the host group.
  name: host_group
  types:
  - <xref:str>
- description: The name of the host.
  name: host_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.dynatrace.types.AppServiceInfo.autoUpdateSetting
  name: autoUpdateSetting
  summary: '"ENABLED" and "DISABLED".'
  signature: 'autoUpdateSetting: str | AutoUpdateSetting'
- uid: azure.mgmt.dynatrace.types.AppServiceInfo.availabilityState
  name: availabilityState
  summary: '"CRASHED", "LOST", "MONITORED",

    "PRE_MONITORED", "SHUTDOWN", "UNEXPECTED_SHUTDOWN", "UNKNOWN", and "UNMONITORED".'
  signature: 'availabilityState: str | AvailabilityState'
- uid: azure.mgmt.dynatrace.types.AppServiceInfo.hostGroup
  name: hostGroup
  summary: The name of the host group.
  signature: 'hostGroup: str'
- uid: azure.mgmt.dynatrace.types.AppServiceInfo.hostName
  name: hostName
  summary: The name of the host.
  signature: 'hostName: str'
- uid: azure.mgmt.dynatrace.types.AppServiceInfo.logModule
  name: logModule
  summary: '"ENABLED" and "DISABLED".'
  signature: 'logModule: str | LogModule'
- uid: azure.mgmt.dynatrace.types.AppServiceInfo.monitoringType
  name: monitoringType
  summary: '"CLOUD_INFRASTRUCTURE", "FULL_STACK",

    and "DISCOVERY".'
  signature: 'monitoringType: str | MonitoringType'
- uid: azure.mgmt.dynatrace.types.AppServiceInfo.resourceId
  name: resourceId
  summary: App service resource ID.
  signature: 'resourceId: str'
- uid: azure.mgmt.dynatrace.types.AppServiceInfo.updateStatus
  name: updateStatus
  summary: '"INCOMPATIBLE", "OUTDATED",

    "SCHEDULED", "SUPPRESSED", "UNKNOWN", "UP2DATE", "UPDATE_IN_PROGRESS",

    "UPDATE_PENDING", and "UPDATE_PROBLEM".'
  signature: 'updateStatus: str | UpdateStatus'
- uid: azure.mgmt.dynatrace.types.AppServiceInfo.version
  name: version
  summary: Version of the Dynatrace agent installed on the App Service.
  signature: 'version: str'
