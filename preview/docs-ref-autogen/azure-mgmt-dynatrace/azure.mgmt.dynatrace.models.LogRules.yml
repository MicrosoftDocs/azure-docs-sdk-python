### YamlMime:PythonClass
uid: azure.mgmt.dynatrace.models.LogRules
name: LogRules
fullName: azure.mgmt.dynatrace.models.LogRules
module: azure.mgmt.dynatrace.models
summary: Set of rules for sending logs for the Monitor resource.
constructor:
  syntax: 'LogRules(*args: Any, **kwargs: Any)'
variables:
- description: 'Flag specifying if AAD logs should be sent for the Monitor resource.
    Known

    values are: "Enabled" and "Disabled".'
  name: send_aad_logs
  types:
  - <xref:str>
  - <xref:azure.mgmt.dynatrace.models.SendAadLogsStatus>
- description: 'Flag specifying if subscription logs should be sent for the

    Monitor resource. Known values are: "Enabled" and "Disabled".'
  name: send_subscription_logs
  types:
  - <xref:str>
  - <xref:azure.mgmt.dynatrace.models.SendSubscriptionLogsStatus>
- description: 'Flag specifying if activity logs from Azure resources should be sent

    for the Monitor resource. Known values are: "Enabled" and "Disabled".'
  name: send_activity_logs
  types:
  - <xref:str>
  - <xref:azure.mgmt.dynatrace.models.SendActivityLogsStatus>
- description: 'List of filtering tags to be used for capturing logs. This only takes

    effect if SendActivityLogs flag is enabled. If empty, all resources will be captured.
    If only

    Exclude action is specified, the rules will apply to the list of all available
    resources. If

    Include actions are specified, the rules will only include resources with the
    associated tags.'
  name: filtering_tags
  types:
  - <xref:list>[<xref:azure.mgmt.dynatrace.models.FilteringTag>]
attributes:
- uid: azure.mgmt.dynatrace.models.LogRules.filtering_tags
  name: filtering_tags
  summary: 'List of filtering tags to be used for capturing logs. This only takes
    effect if

    SendActivityLogs flag is enabled. If empty, all resources will be captured. If
    only Exclude

    action is specified, the rules will apply to the list of all available resources.
    If Include

    actions are specified, the rules will only include resources with the associated
    tags.'
  signature: 'filtering_tags: list[''_models.FilteringTag''] | None'
- uid: azure.mgmt.dynatrace.models.LogRules.send_aad_logs
  name: send_aad_logs
  summary: 'Flag specifying if AAD logs should be sent for the Monitor resource. Known
    values are:

    "Enabled" and "Disabled".'
  signature: 'send_aad_logs: str | _models.SendAadLogsStatus | None'
- uid: azure.mgmt.dynatrace.models.LogRules.send_activity_logs
  name: send_activity_logs
  summary: 'Flag specifying if activity logs from Azure resources should be sent for
    the Monitor resource.

    Known values are: "Enabled" and "Disabled".'
  signature: 'send_activity_logs: str | _models.SendActivityLogsStatus | None'
- uid: azure.mgmt.dynatrace.models.LogRules.send_subscription_logs
  name: send_subscription_logs
  summary: 'Flag specifying if subscription logs should be sent for the Monitor resource.
    Known values are:

    "Enabled" and "Disabled".'
  signature: 'send_subscription_logs: str | _models.SendSubscriptionLogsStatus | None'
