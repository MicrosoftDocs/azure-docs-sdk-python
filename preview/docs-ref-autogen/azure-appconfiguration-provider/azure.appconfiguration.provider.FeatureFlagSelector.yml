### YamlMime:PythonClass
uid: azure.appconfiguration.provider.FeatureFlagSelector
name: FeatureFlagSelector
fullName: azure.appconfiguration.provider.FeatureFlagSelector
module: azure.appconfiguration.provider
summary: Selects a set of feature flags from the dedicated enhanced feature flag endpoint.
constructor:
  syntax: 'FeatureFlagSelector(*, name_filter: str | None = None, label_filter: str
    | None = ''\x00'', tag_filters: List[str] | None = None)'
  keywordOnlyParameters:
  - name: name_filter
    description: A filter to select feature flags based on their name.
    defaultValue: None
  - name: label_filter
    description: 'A filter to select feature flags based on their labels. Default

      value is i.e. (No Label) as seen in the portal.'
    defaultValue: "\0"
  - name: tag_filters
    description: 'A filter to select feature flags based on their tags. This is a

      list of strings that will be used to match tags on the feature flags. Reserved
      characters (*, , ,)

      must be escaped with backslash if they are part of the value. Tag filters must
      follow the format

      "tagName=tagValue", for empty values use "tagName=" and for null values use
      "tagName=0".'
    defaultValue: None
