### YamlMime:PythonClass
uid: azure.mgmt.domainservices.types.LdapsSettings
name: LdapsSettings
fullName: azure.mgmt.domainservices.types.LdapsSettings
module: azure.mgmt.domainservices.types
summary: Secure LDAP Settings.
constructor:
  syntax: LdapsSettings()
variables:
- description: 'A flag to determine whether or not Secure LDAP is enabled or disabled.
    Known

    values are: "Enabled" and "Disabled".'
  name: ldaps
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Ldaps">]
- description: 'The certificate required to configure Secure LDAP. The parameter passed

    here should be a base64encoded representation of the certificate pfx file.'
  name: pfx_certificate
  types:
  - <xref:str>
- description: 'The password to decrypt the provided Secure LDAP certificate

    pfx file.'
  name: pfx_certificate_password
  types:
  - <xref:str>
- description: Public certificate used to configure secure ldap.
  name: public_certificate
  types:
  - <xref:str>
- description: Thumbprint of configure ldaps certificate.
  name: certificate_thumbprint
  types:
  - <xref:str>
- description: NotAfter DateTime of configure ldaps certificate.
  name: certificate_not_after
  types:
  - <xref:str>
- description: 'A flag to determine whether or not Secure LDAP access over the internet

    is enabled or disabled. Known values are: "Enabled" and "Disabled".'
  name: external_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExternalAccess">]
attributes:
- uid: azure.mgmt.domainservices.types.LdapsSettings.certificateNotAfter
  name: certificateNotAfter
  summary: NotAfter DateTime of configure ldaps certificate.
  signature: 'certificateNotAfter: str'
- uid: azure.mgmt.domainservices.types.LdapsSettings.certificateThumbprint
  name: certificateThumbprint
  summary: Thumbprint of configure ldaps certificate.
  signature: 'certificateThumbprint: str'
- uid: azure.mgmt.domainservices.types.LdapsSettings.externalAccess
  name: externalAccess
  summary: 'A flag to determine whether or not Secure LDAP access over the internet
    is enabled or disabled.

    Known values are: "Enabled" and "Disabled".'
  signature: 'externalAccess: str | ExternalAccess'
- uid: azure.mgmt.domainservices.types.LdapsSettings.ldaps
  name: ldaps
  summary: 'A flag to determine whether or not Secure LDAP is enabled or disabled.
    Known values are:

    "Enabled" and "Disabled".'
  signature: 'ldaps: str | Ldaps'
- uid: azure.mgmt.domainservices.types.LdapsSettings.pfxCertificate
  name: pfxCertificate
  summary: 'The certificate required to configure Secure LDAP. The parameter passed
    here should be a

    base64encoded representation of the certificate pfx file.'
  signature: 'pfxCertificate: str'
- uid: azure.mgmt.domainservices.types.LdapsSettings.pfxCertificatePassword
  name: pfxCertificatePassword
  summary: The password to decrypt the provided Secure LDAP certificate pfx file.
  signature: 'pfxCertificatePassword: str'
- uid: azure.mgmt.domainservices.types.LdapsSettings.publicCertificate
  name: publicCertificate
  summary: Public certificate used to configure secure ldap.
  signature: 'publicCertificate: str'
