### YamlMime:PythonClass
uid: azure.mgmt.domainservices.types.DomainSecuritySettings
name: DomainSecuritySettings
fullName: azure.mgmt.domainservices.types.DomainSecuritySettings
module: azure.mgmt.domainservices.types
summary: Domain Security Settings.
constructor:
  syntax: DomainSecuritySettings()
variables:
- description: 'A flag to determine whether or not NtlmV1 is enabled or disabled.
    Known values

    are: "Enabled" and "Disabled".'
  name: ntlm_v1
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NtlmV1">]
- description: 'A flag to determine whether or not TlsV1 is enabled or disabled. Known
    values

    are: "Enabled" and "Disabled".'
  name: tls_v1
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TlsV1">]
- description: 'A flag to determine whether or not SyncNtlmPasswords is enabled or

    disabled. Known values are: "Enabled" and "Disabled".'
  name: sync_ntlm_passwords
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyncNtlmPasswords">]
- description: 'A flag to determine whether or not SyncKerberosPasswords is

    enabled or disabled. Known values are: "Enabled" and "Disabled".'
  name: sync_kerberos_passwords
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyncKerberosPasswords">]
- description: 'A flag to determine whether or not SyncOnPremPasswords is enabled

    or disabled. Known values are: "Enabled" and "Disabled".'
  name: sync_on_prem_passwords
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyncOnPremPasswords">]
- description: 'A flag to determine whether or not KerberosRc4Encryption is

    enabled or disabled. Known values are: "Enabled" and "Disabled".'
  name: kerberos_rc4_encryption
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KerberosRc4Encryption">]
- description: 'A flag to determine whether or not KerberosArmoring is enabled or

    disabled. Known values are: "Enabled" and "Disabled".'
  name: kerberos_armoring
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KerberosArmoring">]
- description: 'A flag to determine whether or not LdapSigning is enabled or disabled.

    Known values are: "Enabled" and "Disabled".'
  name: ldap_signing
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LdapSigning">]
- description: 'A flag to determine whether or not ChannelBinding is enabled or

    disabled. Known values are: "Enabled" and "Disabled".'
  name: channel_binding
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ChannelBinding">]
- description: 'A flag to determine whether the SyncOnPremSamAccountName

    feature is active. When enabled, the samAccountName attribute in Entra Domain
    Services is

    synchronized from the onPremisesSamAccountName attribute in Entra ID. Known values
    are:

    "Enabled" and "Disabled".'
  name: sync_on_prem_sam_account_name
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyncOnPremSamAccountName">]
