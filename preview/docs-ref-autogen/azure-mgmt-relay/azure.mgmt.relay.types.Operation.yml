  - <xref:bool>
- description: Localized display information for this particular operation.
  name: display
  types:
  - <xref:<xref:"OperationDisplay">>
- description: 'The intended executor of the operation; as in Resource Based Access
    Control

    (RBAC) and audit logs UX. Default value is "user,system". Known values are: "user",
    "system",

    and "user,system".'
  name: origin
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Origin">]
- description: 'Extensible enum. Indicates the action type. "Internal" refers to actions

    that are for internal only APIs. "Internal"'
  name: action_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActionType">]
