### YamlMime:PythonClass
uid: azure.mgmt.relay.types.HybridConnectionProperties
name: HybridConnectionProperties
fullName: azure.mgmt.relay.types.HybridConnectionProperties
module: azure.mgmt.relay.types
summary: Properties of the HybridConnection.
constructor:
  syntax: HybridConnectionProperties()
variables:
- description: The time the hybrid connection was created.
  name: created_at
  types:
  - <xref:str>
- description: The time the namespace was updated.
  name: updated_at
  types:
  - <xref:str>
- description: 'The number of listeners for this hybrid connection. Note that min
    : 1 and

    max:25 are supported.'
  name: listener_count
  types:
  - <xref:int>
- description: 'Returns true if client authorization is needed for this

    hybrid connection; otherwise, false.'
  name: requires_client_authorization
  types:
  - <xref:bool>
- description: 'The usermetadata is a placeholder to store user-defined string data
    for

    the hybrid connection endpoint. For example, it can be used to store descriptive
    data, such as

    a list of teams and their contact information. Also, user-defined configuration
    settings can be

    stored.'
  name: user_metadata
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.relay.types.HybridConnectionProperties.createdAt
  name: createdAt
  summary: The time the hybrid connection was created.
  signature: 'createdAt: str'
- uid: azure.mgmt.relay.types.HybridConnectionProperties.listenerCount
  name: listenerCount
  summary: 25 are supported.
  signature: 'listenerCount: int'
- uid: azure.mgmt.relay.types.HybridConnectionProperties.requiresClientAuthorization
  name: requiresClientAuthorization
  summary: Returns true if client authorization is needed for this hybrid connection;
    otherwise, false.
  signature: 'requiresClientAuthorization: bool'
- uid: azure.mgmt.relay.types.HybridConnectionProperties.updatedAt
  name: updatedAt
  summary: The time the namespace was updated.
  signature: 'updatedAt: str'
- uid: azure.mgmt.relay.types.HybridConnectionProperties.userMetadata
  name: userMetadata
  summary: 'The usermetadata is a placeholder to store user-defined string data for
    the hybrid connection

    endpoint. For example, it can be used to store descriptive data, such as a list
    of teams and

    their contact information. Also, user-defined configuration settings can be stored.'
  signature: 'userMetadata: str'
