### YamlMime:PythonClass
uid: azure.mgmt.relay.types.RelayNamespaceProperties
name: RelayNamespaceProperties
fullName: azure.mgmt.relay.types.RelayNamespaceProperties
module: azure.mgmt.relay.types
summary: Properties of the namespace.
constructor:
  syntax: RelayNamespaceProperties()
variables:
- description: Provisioning state of the Namespace.
  name: provisioningState
  types:
  - <xref:str>
- description: Status of the Namespace.
  name: status
  types:
  - <xref:str>
- description: The time the namespace was created.
  name: createdAt
  types:
  - <xref:str>
- description: The time the namespace was updated.
  name: updatedAt
  types:
  - <xref:str>
- description: Endpoint you can use to perform Service Bus operations.
  name: serviceBusEndpoint
  types:
  - <xref:str>
- description: Identifier for Azure Insights metrics.
  name: metricId
  types:
  - <xref:str>
- description: List of private endpoint connections.
  name: privateEndpointConnections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: 'This determines if traffic is allowed over public network. By

    default it is enabled. Known values are: "Enabled", "Disabled", and "SecuredByPerimeter".'
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: 'The minimum TLS version for the namespace. Supported values are 1.2

    and 1.3. The service defaults to 1.2 when the property is omitted. Existing namespaces

    configured with TLS 1.0 or 1.1 are reported as TLS 1.2. Known values are: "1.2"
    and "1.3".'
  name: minimumTlsVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TlsVersion">]
attributes:
- uid: azure.mgmt.relay.types.RelayNamespaceProperties.createdAt
  name: createdAt
  summary: The time the namespace was created.
  signature: 'createdAt: str'
- uid: azure.mgmt.relay.types.RelayNamespaceProperties.metricId
  name: metricId
  summary: Identifier for Azure Insights metrics.
  signature: 'metricId: str'
- uid: azure.mgmt.relay.types.RelayNamespaceProperties.minimumTlsVersion
  name: minimumTlsVersion
  summary: 'The minimum TLS version for the namespace. Supported values are 1.2 and
    1.3. The service

    defaults to 1.2 when the property is omitted. Existing namespaces configured with
    TLS 1.0 or

    1.1 are reported as TLS 1.2. Known values are: "1.2" and "1.3".'
  signature: 'minimumTlsVersion: str | TlsVersion'
