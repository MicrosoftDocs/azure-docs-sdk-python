  name: publicNetworkAccess
  summary: 'This determines if traffic is allowed over public network. By default
    it is enabled. Known

    values are: "Enabled", "Disabled", and "SecuredByPerimeter".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
