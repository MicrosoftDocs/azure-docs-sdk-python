  name: serviceBusEndpoint
  summary: Endpoint you can use to perform Service Bus operations.
  signature: 'serviceBusEndpoint: str'
- uid: azure.mgmt.relay.types.RelayNamespaceProperties.status
  name: status
  summary: Status of the Namespace.
