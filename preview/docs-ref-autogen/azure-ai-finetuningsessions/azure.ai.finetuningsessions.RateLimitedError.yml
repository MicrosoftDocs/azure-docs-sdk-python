### YamlMime:PythonClass
uid: azure.ai.finetuningsessions.RateLimitedError
name: RateLimitedError
fullName: azure.ai.finetuningsessions.RateLimitedError
module: azure.ai.finetuningsessions
summary: 'The request was throttled with HTTP 429 (rate limit / budget exhausted).


  A subclass of <xref:azure.ai.finetuningsessions.NoCapacityError> so existing `except
  NoCapacityError`

  handlers still catch it. Raised by the SDK when a sample submission stays

  throttled past the client throttle timeout.


  Action: wait `retry_after_sec` seconds and retry, or reduce concurrency.'
constructor:
  syntax: 'RateLimitedError(message: str, *, retry_after_sec: float | None = None,
    reason: str | None = None, response: Any = None, **kwargs: Any)'
  parameters:
  - name: message
    isRequired: true
  keywordOnlyParameters:
  - name: retry_after_sec
    defaultValue: None
  - name: reason
    defaultValue: None
  - name: response
    defaultValue: None
