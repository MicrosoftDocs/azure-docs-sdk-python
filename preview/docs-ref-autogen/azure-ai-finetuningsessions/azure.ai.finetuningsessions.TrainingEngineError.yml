### YamlMime:PythonClass
uid: azure.ai.finetuningsessions.TrainingEngineError
name: TrainingEngineError
fullName: azure.ai.finetuningsessions.TrainingEngineError
module: azure.ai.finetuningsessions
summary: "The engine serving this session has died.\n\nAction: stop the training run,\
  \ alert on-call. LoRA weights in VRAM are\nlost. Do NOT retry on the same session\
  \ \u2014 create a new one (optionally\nfrom the last checkpoint).\n\nAdditional\
  \ keyword arguments are forwarded to the base exception."
constructor:
  syntax: 'TrainingEngineError(message: str, *, session_id: str | None = None, error_code:
    str | None = None, debug_ref: str | None = None, response: Any = None, **kwargs:
    Any)'
  parameters:
  - name: message
    description: Error message.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: session_id
    description: Identifier of the affected session, if known.
    defaultValue: None
  - name: error_code
    description: Server error code, if provided.
    defaultValue: None
  - name: debug_ref
    description: Opaque reference for support tickets, if provided.
    defaultValue: None
  - name: response
    description: HTTP response associated with the error, if available.
    defaultValue: None
    types:
    - <xref:typing.Any>
methods:
- uid: azure.ai.finetuningsessions.TrainingEngineError.add_note
  name: add_note
  summary: "Exception.add_note(note) \u2013\nadd a note to the exception"
  signature: add_note()
- uid: azure.ai.finetuningsessions.TrainingEngineError.raise_with_traceback
  name: raise_with_traceback
  summary: 'Raise the exception with the existing traceback.


    *Deprecated since version 1.22.0:* This method is deprecated as we don''t support
    Python 2 anymore. Use raise/from instead.'
  signature: raise_with_traceback() -> None
- uid: azure.ai.finetuningsessions.TrainingEngineError.with_traceback
  name: with_traceback
  summary: "Exception.with_traceback(tb) \u2013\nset self.__traceback__ to tb and\
    \ return self."
  signature: with_traceback()
