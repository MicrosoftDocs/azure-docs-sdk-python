uid: azure.ai.finetuningsessions.models.FromCheckpoint
name: FromCheckpoint
fullName: azure.ai.finetuningsessions.models.FromCheckpoint
module: azure.ai.finetuningsessions.models
summary: 'Identifies a saved training checkpoint to bootstrap a new session from.


  When passed to <xref:azure.ai.finetuningsessions.FineTuningSession.create>,

  the new session''s LoRA weights, optimizer state, and scheduler step are all

  initialised from the referenced checkpoint (continual fine-tuning).'
