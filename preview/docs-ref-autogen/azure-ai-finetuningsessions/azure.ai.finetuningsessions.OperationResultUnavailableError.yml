### YamlMime:PythonClass
uid: azure.ai.finetuningsessions.OperationResultUnavailableError
name: OperationResultUnavailableError
fullName: azure.ai.finetuningsessions.OperationResultUnavailableError
module: azure.ai.finetuningsessions
summary: 'A terminal operation''s result payload can no longer be returned.


  This error is always non-retryable. When `operation_completed` is true,

  the operation''s side effects may already have been applied, so submitting

  it again could duplicate a training update. When it is false, the operation

  failed but its original error details are no longer available.


  Additional keyword arguments are forwarded to the base exception.'
constructor:
  syntax: 'OperationResultUnavailableError(message: str, *, operation_completed: bool,
    error_code: str | None = None, debug_ref: str | None = None, response: Any = None,
    **kwargs: Any)'
  parameters:
  - name: message
    description: Error message.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: operation_completed
    description: 'Whether the server durably recorded the operation

      as completed before its result payload became unavailable.'
    types:
    - <xref:bool>
  - name: error_code
    description: Server error code identifying the payload-loss outcome, if provided.
    defaultValue: None
  - name: debug_ref
    description: Opaque reference for support tickets, if provided.
    defaultValue: None
  - name: response
    description: HTTP response associated with the error, if available.
    defaultValue: None
    types:
    - <xref:typing.Any>
methods:
