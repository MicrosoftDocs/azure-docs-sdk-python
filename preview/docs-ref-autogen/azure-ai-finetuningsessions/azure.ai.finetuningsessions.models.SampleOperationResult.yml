name: SampleOperationResult
fullName: azure.ai.finetuningsessions.models.SampleOperationResult
module: azure.ai.finetuningsessions.models
summary: 'Sampling result with the tested preview''s nested nullable annotations.


  The pinned emitter cannot represent nested nullable tuple arrays. These

  two fields therefore use the supported model override, not generated-file

  rewriting. Wire pairs remain JSON arrays, just as in the Loom preview.'
constructor:
  syntax: 'SampleOperationResult(*args: Any, **kwargs: Any)'
variables:
- description: 'Backend `usage.prompt_tokens` for the single prompt,

    counted once regardless of the number of sampled sequences. Missing or

    invalid evidence is `None` (unverified), never inferred from input size.'
  name: prompt_tokens
  types:
  - <xref:int>
  - <xref:None>
