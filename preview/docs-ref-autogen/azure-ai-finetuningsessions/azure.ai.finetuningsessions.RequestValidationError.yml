uid: azure.ai.finetuningsessions.RequestValidationError
name: RequestValidationError
fullName: azure.ai.finetuningsessions.RequestValidationError
module: azure.ai.finetuningsessions
summary: "One or more datums in the batch were rejected as invalid.\n\nAction: this\
  \ is terminal for the affected datums \u2014 fix the data.\n\nAdditional keyword\
  \ arguments are forwarded to the base exception."
constructor:
  syntax: 'RequestValidationError(message: str, *, field: str | None = None, error_code:
    str | None = None, debug_ref: str | None = None, response: Any = None, **kwargs:
    Any)'
  parameters:
  - name: message
    description: Error message.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: field
    description: Field that failed validation, if provided.
    defaultValue: None
  - name: error_code
    description: Server error code, if provided.
    defaultValue: None
  - name: debug_ref
    description: Opaque reference for support tickets, if provided.
    defaultValue: None
  - name: response
    description: HTTP response associated with the error, if available.
    defaultValue: None
    types:
    - <xref:typing.Any>
methods:
- uid: azure.ai.finetuningsessions.RequestValidationError.add_note
