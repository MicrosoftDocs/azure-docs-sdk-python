### YamlMime:PythonClass
uid: azure.ai.finetuningsessions.RequestRetryableError
name: RequestRetryableError
fullName: azure.ai.finetuningsessions.RequestRetryableError
module: azure.ai.finetuningsessions
summary: "A request failed transiently and the server marked it safe to retry.\n\n\
  Generic, operation-agnostic retry signal: whenever a failed request\nenvelope carries\
  \ `should_retry: true`, the server is telling the client\nthat this failure is not\
  \ the caller's fault and a fresh attempt (a NEW\nrequest id) can succeed. Current\
  \ producers include sampling failures such\nas a drained/restarted serving pod,\
  \ an orphan-sweep reclaim, or an upstream\nread timeout \u2014 but any operation\
  \ may opt in to this contract by setting the\nflag; the SDK does not gate on specific\
  \ error codes.\n\nThe SDK's `_post_and_poll` catches this and resubmits automatically\n\
  (bounded retries). It is only surfaced to the caller once retries are\nexhausted.\n\
  \nAdditional keyword arguments are forwarded to the base exception."
constructor:
  syntax: 'RequestRetryableError(message: str, *, error_code: str | None = None, retry_after_sec:
    float | None = None, debug_ref: str | None = None, response: Any = None, **kwargs:
    Any)'
  parameters:
  - name: message
    description: Error message.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: error_code
    description: Informational server error code, if provided.
    defaultValue: None
  - name: retry_after_sec
    description: Suggested wait time in seconds before resubmitting, if provided.
    defaultValue: None
  - name: debug_ref
    description: Opaque reference for support tickets, if provided.
    defaultValue: None
  - name: response
    description: HTTP response associated with the error, if available.
    defaultValue: None
    types:
    - <xref:typing.Any>
methods:
- uid: azure.ai.finetuningsessions.RequestRetryableError.add_note
  name: add_note
  summary: "Exception.add_note(note) \u2013\nadd a note to the exception"
  signature: add_note()
- uid: azure.ai.finetuningsessions.RequestRetryableError.raise_with_traceback
  name: raise_with_traceback
  summary: 'Raise the exception with the existing traceback.


