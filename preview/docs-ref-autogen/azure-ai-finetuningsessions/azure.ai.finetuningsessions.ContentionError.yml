### YamlMime:PythonClass
uid: azure.ai.finetuningsessions.ContentionError
name: ContentionError
fullName: azure.ai.finetuningsessions.ContentionError
module: azure.ai.finetuningsessions
summary: 'The engine is temporarily contended (busy with other tenants).


  Action: back off with exponential delay. Do NOT retry immediately.


  The inherited `reason` attribute contains the server-reported reason.


  Additional keyword arguments are forwarded to the base exception.'
constructor:
  syntax: 'ContentionError(message: str, *, retry_after_sec: float | None = None,
    reason: str | None = None, response: Any = None, **kwargs: Any)'
  parameters:
  - name: message
    description: Error message.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: retry_after_sec
    description: Suggested wait time in seconds before retrying, if provided.
    defaultValue: None
  - name: reason
    description: Server-reported reason, if provided.
    defaultValue: None
  - name: response
    description: HTTP response associated with the error, if available.
    defaultValue: None
    types:
    - <xref:typing.Any>
methods:
- uid: azure.ai.finetuningsessions.ContentionError.add_note
  name: add_note
  summary: "Exception.add_note(note) \u2013\nadd a note to the exception"
  signature: add_note()
- uid: azure.ai.finetuningsessions.ContentionError.raise_with_traceback
  name: raise_with_traceback
  summary: 'Raise the exception with the existing traceback.


    *Deprecated since version 1.22.0:* This method is deprecated as we don''t support
    Python 2 anymore. Use raise/from instead.'
  signature: raise_with_traceback() -> None
- uid: azure.ai.finetuningsessions.ContentionError.with_traceback
  name: with_traceback
  summary: "Exception.with_traceback(tb) \u2013\nset self.__traceback__ to tb and\
    \ return self."
  signature: with_traceback()
