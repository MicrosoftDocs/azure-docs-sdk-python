### YamlMime:PythonClass
uid: azure.ai.finetuningsessions.FineTuningSession
name: FineTuningSession
fullName: azure.ai.finetuningsessions.FineTuningSession
module: azure.ai.finetuningsessions
summary: 'Convenience wrapper around a single fine-tuning session.


  Mirrors the hero-code surface from SPEC_FOUNDRY_AICLIENT.md so callers

  can write training loops without constructing raw request bodies.


  Wrap an existing session and start its background heartbeat.'
constructor:
  syntax: 'FineTuningSession(client: FineTuningSessionClient, session_id: str)'
  parameters:
  - name: client
    description: The generated `FineTuningSessionClient`.
    isRequired: true
    types:
    - <xref:azure.ai.finetuningsessions.FineTuningSessionClient>
  - name: session_id
    description: The session ID returned by the server after creating a session.
    isRequired: true
    types:
    - <xref:str>
  - name: client
    description: The generated `FineTuningSessionClient`.
    isRequired: true
    types:
    - <xref:azure.ai.finetuningsessions.FineTuningSessionClient>
  - name: session_id
    description: The session ID returned by the server after creating a session.
    isRequired: true
    types:
    - <xref:str>
methods:
- uid: azure.ai.finetuningsessions.FineTuningSession.close
  name: close
  summary: 'Unload the session from the GPU engine.


    Stops the background heartbeat, then issues the complete request.


    Spec: `session.close()`'
  signature: 'close(**kwargs: Any) -> None'
  return:
    description: None.
    types:
    - <xref:None>
- uid: azure.ai.finetuningsessions.FineTuningSession.create
  name: create
  summary: 'Create a fine-tuning session and wait until the model is loaded.


    Combines `POST /fine_tuning/sessions` (which triggers an async model-load

    on the server) with polling of the returned `request_id` until the load

    completes, then returns a ready-to-use <xref:azure.ai.finetuningsessions.FineTuningSession>.'
  signature: 'create(client: FineTuningSessionClient, *, base_model: str, lora_config:
    LoRAConfig, type: str = ''training'', from_checkpoint: FromCheckpoint | None =
    None, timeout_sec: float = 600.0, user_metadata: dict[str, Any] | None = None,
    training_type: str | TrainingType | None = None) -> FineTuningSession'
  parameters:
  - name: client
    description: The <xref:azure.ai.finetuningsessions.FineTuningSessionClient>.
    isRequired: true
    types:
    - <xref:azure.ai.finetuningsessions.FineTuningSessionClient>
  keywordOnlyParameters:
  - name: base_model
    description: Name of the base model to load (e.g. `"Llama-3.1-8B"`).
    types:
    - <xref:str>
  - name: lora_config
    description: Required LoRA adapter configuration, including rank.
    types:
    - <xref:azure.ai.finetuningsessions.models.LoRAConfig>
  - name: type
    description: Session type string. Defaults to `"training"`.
    defaultValue: training
    types:
    - <xref:str>
  - name: from_checkpoint
    description: 'Optional <xref:azure.ai.finetuningsessions.FromCheckpoint> specifying
      the

      source session and checkpoint to bootstrap from (continual fine-tuning

      / resume from checkpoint).'
    defaultValue: None
    types:
    - <xref:azure.ai.finetuningsessions.models.FromCheckpoint>
    - <xref:None>
  - name: timeout_sec
    description: Maximum seconds to wait for the model to load. Defaults to `600.0`.
    defaultValue: '600.0'
    types:
    - <xref:float>
  - name: user_metadata
    description: 'Optional user-defined metadata to associate with the session.

      Defaults to `None`.'
    defaultValue: None
    types:
    - <xref:dict>[<xref:str>, <xref:typing.Any>]
    - <xref:None>
  - name: training_type
    description: 'Training tier, specified as a string or <xref:azure.ai.finetuningsessions.TrainingType>.

      Set this explicitly to select a tier; omission leaves selection to the service.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:azure.ai.finetuningsessions.models.TrainingType>
    - <xref:None>
  return:
    description: A <xref:azure.ai.finetuningsessions.FineTuningSession> instance ready
      for training operations.
    types:
    - <xref:azure.ai.finetuningsessions.FineTuningSession>
  exceptions:
  - type: RuntimeError
    description: If the server reports status `"failed"` or the timeout expires.
- uid: azure.ai.finetuningsessions.FineTuningSession.create_from_checkpoint
  name: create_from_checkpoint
  summary: 'Create a session resumed from a saved training checkpoint.


    Accepts a source-session/checkpoint path or a loom:// source-session

    weights path. The source weights, optimizer state, and scheduler step

    are restored by the service through the create operation.'
  signature: 'create_from_checkpoint(client: FineTuningSessionClient, *, checkpoint_path:
    str, base_model: str, lora_config: LoRAConfig, type: str = ''training'', timeout_sec:
    float = 600.0) -> FineTuningSession'
  parameters:
  - name: client
    description: Client used to create the resumed session.
    isRequired: true
    types:
    - <xref:azure.ai.finetuningsessions.FineTuningSessionClient>
  keywordOnlyParameters:
  - name: checkpoint_path
    description: Source-session/checkpoint reference.
    types:
    - <xref:str>
  - name: base_model
    description: Base model matching the checkpoint source.
    types:
    - <xref:str>
  - name: lora_config
    description: Required LoRA configuration matching the checkpoint.
    types:
    - <xref:azure.ai.finetuningsessions.models.LoRAConfig>
  - name: type
    description: Session type, defaulting to training.
    defaultValue: training
    types:
    - <xref:str>
  - name: timeout_sec
    description: Maximum seconds to wait for model loading.
    defaultValue: '600.0'
    types:
    - <xref:float>
  return:
    description: The initialized fine-tuning session.
    types:
    - <xref:azure.ai.finetuningsessions.FineTuningSession>
- uid: azure.ai.finetuningsessions.FineTuningSession.delete
  name: delete
  summary: "Delete the session and cascade-delete its models, checkpoints, and sampling\
    \ sessions.\n\nStops the background heartbeat, then issues an HTTP DELETE against\n\
    the session resource; the cascade is performed server-side.\n\nIdempotent \u2014\
    \ a 404 (session already gone) is swallowed.  Any other\nnon-2xx surfaces via\
    \ the standard SDK error path.\n\nSpec: `session.delete()`"
  signature: 'delete(**kwargs: Any) -> None'
  return:
    description: None.
    types:
    - <xref:None>
- uid: azure.ai.finetuningsessions.FineTuningSession.forward
  name: forward
  summary: 'Submit a mini-batch for a forward-only pass (no gradient accumulation).


    Returns per-datum loss-function outputs without accumulating gradients.

    `total_loss` is a training-only field and is None on this result.


    If the batch exceeds `_MAX_CHUNK_LEN` datums or `_MAX_CHUNK_BYTES`

    estimated payload size, the batch is automatically split into chunks.

    Chunks are submitted in parallel and results are combined.'
  signature: 'forward(batch: List[Datum], *, loss_fn: str | LossFn = LossFn.CROSS_ENTROPY,
    loss_fn_config: LossFnConfig | None = None, **kwargs: Any) -> OperationResult'
  parameters:
  - name: batch
    description: List of <xref:azure.ai.finetuningsessions.models.Datum>.
    isRequired: true
    types:
    - <xref:list>[<xref:azure.ai.finetuningsessions.models.Datum>]
  keywordOnlyParameters:
  - name: loss_fn
    description: Loss function name. Defaults to `"cross_entropy"`.
    defaultValue: LossFn.CROSS_ENTROPY
    types:
    - <xref:str>
    - <xref:azure.ai.finetuningsessions.models.LossFn>
  - name: loss_fn_config
    description: Optional per-loss hyper-parameters.
    defaultValue: None
    types:
    - <xref:azure.ai.finetuningsessions.models.LossFnConfig>
    - <xref:None>
  return:
    description: <xref:azure.ai.finetuningsessions.models.ForwardBackwardOperationResult>.
    types:
    - <xref:azure.ai.finetuningsessions.models.ForwardBackwardOperationResult>
- uid: azure.ai.finetuningsessions.FineTuningSession.forward_backward
  name: forward_backward
  summary: 'Submit a mini-batch for a forward + backward pass.


    If the batch exceeds `_MAX_CHUNK_LEN` datums or `_MAX_CHUNK_BYTES`

    estimated payload size, the batch is automatically split into chunks.

    Chunks are submitted in parallel and results are combined.


    Spec: `fb_result = session.forward_backward(batch, loss_fn="cross_entropy")`'
  signature: 'forward_backward(batch: List[Datum], *, loss_fn: str | LossFn = LossFn.CROSS_ENTROPY,
    loss_fn_config: LossFnConfig | None = None, **kwargs: Any) -> OperationResult'
  parameters:
  - name: batch
    description: List of <xref:azure.ai.finetuningsessions.models.Datum>.
    isRequired: true
    types:
    - <xref:list>[<xref:azure.ai.finetuningsessions.models.Datum>]
  keywordOnlyParameters:
  - name: loss_fn
    description: Loss function name. Defaults to `"cross_entropy"`.
    defaultValue: LossFn.CROSS_ENTROPY
    types:
    - <xref:str>
    - <xref:azure.ai.finetuningsessions.models.LossFn>
  - name: loss_fn_config
    description: Optional per-loss hyper-parameters.
    defaultValue: None
    types:
    - <xref:azure.ai.finetuningsessions.models.LossFnConfig>
    - <xref:None>
  return:
    description: <xref:azure.ai.finetuningsessions.models.OperationResult>.
    types:
    - <xref:azure.ai.finetuningsessions.models.OperationResult>
- uid: azure.ai.finetuningsessions.FineTuningSession.heartbeat
  name: heartbeat
  summary: 'Refresh an active session to prevent idle expiry.


    Additional keyword arguments are forwarded to the client''s session heartbeat
    operation.'
  signature: 'heartbeat(**kwargs: Any) -> Any'
  return:
    description: The session heartbeat response.
    types:
    - <xref:azure.ai.finetuningsessions.models.HeartbeatResponse>
- uid: azure.ai.finetuningsessions.FineTuningSession.optim_step
  name: optim_step
  summary: 'Apply accumulated gradients with Adam.


    Blocks until the GPU applies the weight update.


    Spec: `opt_result = session.optim_step(AdamParams(learning_rate=1e-4))`'
  signature: 'optim_step(adam_params: AdamParams, **kwargs: Any) -> OperationResult'
  parameters:
  - name: adam_params
    description: Adam optimizer parameters to use for the weight update.
    isRequired: true
    types:
    - <xref:azure.ai.finetuningsessions.models.AdamParams>
  return:
    description: The result of applying the optimizer update.
    types:
    - <xref:azure.ai.finetuningsessions.models.OperationResult>
- uid: azure.ai.finetuningsessions.FineTuningSession.sample
  name: sample
  summary: "Generate completions using current LoRA weights.\n\nBlocks until the GPU\
    \ finishes sampling.\n\nSpec: `sample_result = session.sample(prompt_tokens, sampling_params,\
    \ checkpoint_id=..., num_samples=4, ...)`\n\nConcurrency is bounded by a lifecycle-scoped\
    \ semaphore (size\n`_MAX_CONCURRENT_SAMPLES`). The permit is held for the FULL\
    \ submit+poll\nlifecycle so a throttled or slow-generating sample does not release\n\
    capacity to a burst queued behind it. A 429 on submit is treated as\nhealthy backpressure\
    \ and retried in place \u2014 honoring `Retry-After` +\njitter \u2014 until `_SAMPLE_THROTTLE_TIMEOUT_SEC`,\
    \ then a typed\n`RateLimitedError` is raised."
  signature: 'sample(prompt_tokens: List[int] | ModelInput, sampling_params: SamplingParams,
    *, checkpoint_id: str, num_samples: int = 1, sampling_session_id: str | None =
    None, seq_id: int | None = None, prompt_logprobs: bool = False, topk_prompt_logprobs:
    int = 0, **kwargs: Any) -> OperationResult'
  parameters:
  - name: prompt_tokens
    description: 'Tokenised input prompt as a list of integer IDs, or a

      structured `ModelInput` for multimodal prompts.'
    isRequired: true
    types:
    - <xref:list>[<xref:int>]
    - <xref:azure.ai.finetuningsessions.models.ModelInput>
  - name: sampling_params
    description: Generation parameters (max_tokens, temperature, etc.).
    isRequired: true
    types:
    - <xref:azure.ai.finetuningsessions.models.SamplingParams>
  keywordOnlyParameters:
  - name: checkpoint_id
    description: Sampler checkpoint ID returned by `save_weights_for_sampler`.
    types:
    - <xref:str>
  - name: num_samples
    description: Number of independent completions to generate. Default 1.
    defaultValue: '1'
    types:
    - <xref:int>
  - name: sampling_session_id
    description: ID returned by a prior `save_weights_for_sampler` call.
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: seq_id
    description: Training step index; must match the one used in `save_weights_for_sampler`.
    defaultValue: None
    types:
    - <xref:int>
    - <xref:None>
  - name: prompt_logprobs
    description: If True, return per-token log-probabilities for the prompt.
    defaultValue: 'False'
    types:
    - <xref:bool>
  - name: topk_prompt_logprobs
    description: Top-k log-probabilities per prompt token. 0 = none. Must be between
      0 and 20 (default 0).
    defaultValue: '0'
    types:
    - <xref:int>
  return:
    description: The sampling result containing the generated completions.
    types:
    - <xref:azure.ai.finetuningsessions.models.OperationResult>
- uid: azure.ai.finetuningsessions.FineTuningSession.save_weights
  name: save_weights
  summary: 'Save a training checkpoint (LoRA weights + optimizer state).


    Blocks until the checkpoint is written to storage.


    Spec: `ckpt_result = session.save_weights("sft_piglatin_v1")`'
  signature: 'save_weights(path: str, **kwargs: Any) -> OperationResult'
  parameters:
  - name: path
    description: Name or identifier of the training checkpoint to save.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: The result of saving the training checkpoint, including its checkpoint
      identifier.
    types:
    - <xref:azure.ai.finetuningsessions.models.OperationResult>
- uid: azure.ai.finetuningsessions.FineTuningSession.save_weights_for_sampler
  name: save_weights_for_sampler
  summary: 'Push current LoRA weights to the sampler (required before calling `sample`).


    Blocks until the sampler weights are ready.


    Spec: `sampler_result = session.save_weights_for_sampler(seq_id=step, sampling_session_seq_id=0)`'
  signature: 'save_weights_for_sampler(seq_id: int, *, sampling_session_seq_id: int
    | None = None, path: str | None = None, **kwargs: Any) -> OperationResult'
  parameters:
  - name: seq_id
    description: "Training step index \u2013 must match the `seq_id` passed to `sample`."
    isRequired: true
    types:
    - <xref:int>
  keywordOnlyParameters:
  - name: sampling_session_seq_id
    description: Ordinal of this sampling session in the run.
    defaultValue: None
    types:
    - <xref:int>
    - <xref:None>
  - name: path
    description: 'Optional explicit checkpoint identifier. Supply this or

      `sampling_session_seq_id`; no identifier is invented from `None`.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  return:
    description: The result of saving sampler weights, including the checkpoint identifier.
    types:
    - <xref:azure.ai.finetuningsessions.models.OperationResult>
