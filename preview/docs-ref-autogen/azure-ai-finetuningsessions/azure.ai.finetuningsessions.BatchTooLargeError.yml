### YamlMime:PythonClass
uid: azure.ai.finetuningsessions.BatchTooLargeError
name: BatchTooLargeError
fullName: azure.ai.finetuningsessions.BatchTooLargeError
module: azure.ai.finetuningsessions
summary: 'The batch exceeded the server''s size limit.


  Action: split the batch into smaller chunks and retry.


  Additional keyword arguments are forwarded to the base exception.'
constructor:
  syntax: 'BatchTooLargeError(message: str, *, max_batch_size: int | None = None,
    actual_batch_size: int | None = None, response: Any = None, **kwargs: Any)'
  parameters:
  - name: message
    description: Error message.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: max_batch_size
    description: Maximum batch size accepted by the server, if reported.
    defaultValue: None
  - name: actual_batch_size
    description: Rejected batch size, if reported.
    defaultValue: None
  - name: response
    description: HTTP response associated with the error, if available.
    defaultValue: None
    types:
    - <xref:typing.Any>
methods:
- uid: azure.ai.finetuningsessions.BatchTooLargeError.add_note
  name: add_note
  summary: "Exception.add_note(note) \u2013\nadd a note to the exception"
  signature: add_note()
- uid: azure.ai.finetuningsessions.BatchTooLargeError.raise_with_traceback
  name: raise_with_traceback
  summary: 'Raise the exception with the existing traceback.


    *Deprecated since version 1.22.0:* This method is deprecated as we don''t support
    Python 2 anymore. Use raise/from instead.'
  signature: raise_with_traceback() -> None
- uid: azure.ai.finetuningsessions.BatchTooLargeError.with_traceback
  name: with_traceback
  summary: "Exception.with_traceback(tb) \u2013\nset self.__traceback__ to tb and\
    \ return self."
  signature: with_traceback()
attributes:
- uid: azure.ai.finetuningsessions.BatchTooLargeError.args
  name: args
