    types:
    - <xref:azure.ai.finetuningsessions.models.OperationResult>
- uid: azure.ai.finetuningsessions.aio.FineTuningSessionClient.forward_async
  name: forward_async
  summary: 'Submit a forward-only pass, return an asyncio Task for the result.


    Awaits all POSTs (with chunking) so that the server assigns UUID v7

    request IDs *before* this method returns.


    **Multi-chunk correctness:** When the batch is split into multiple HTTP

    chunks, this method awaits GPU completion of *all* chunks before

    returning, matching the forward_backward_async behavior.'
  signature: 'async forward_async(session_id: str, batch: List[Datum], *, loss_fn:
    str | LossFn = LossFn.CROSS_ENTROPY, loss_fn_config: LossFnConfig | None = None)
    -> Task[OperationResult]'
  parameters:
  - name: session_id
    description: The session ID.
    isRequired: true
    types:
    - <xref:str>
  - name: batch
    description: List of Datum.
    isRequired: true
    types:
    - <xref:list>[<xref:azure.ai.finetuningsessions.models.Datum>]
  keywordOnlyParameters:
  - name: loss_fn
    description: Loss function name. Defaults to `"cross_entropy"`.
    defaultValue: LossFn.CROSS_ENTROPY
    types:
    - <xref:str>
    - <xref:azure.ai.finetuningsessions.models.LossFn>
  - name: loss_fn_config
    description: Optional per-loss hyper-parameters.
    defaultValue: None
    types:
    - <xref:azure.ai.finetuningsessions.models.LossFnConfig>
    - <xref:None>
  return:
    description: An asyncio.Task whose result is an OperationResult.
    types:
    - <xref:asyncio.Task>[<xref:azure.ai.finetuningsessions.models.OperationResult>]
    - <xref:asyncio.Future>[<xref:azure.ai.finetuningsessions.models.OperationResult>]
