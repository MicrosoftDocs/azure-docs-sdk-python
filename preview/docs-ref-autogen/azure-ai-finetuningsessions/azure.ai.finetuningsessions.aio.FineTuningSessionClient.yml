    description: The session ID returned by `create_session`.
    isRequired: true
    types:
    - <xref:str>
  - name: batch
    description: List of Datum.
    isRequired: true
    types:
    - <xref:list>[<xref:azure.ai.finetuningsessions.models.Datum>]
  keywordOnlyParameters:
  - name: loss_fn
    description: Loss function name. Defaults to `"cross_entropy"`.
    defaultValue: LossFn.CROSS_ENTROPY
    types:
    - <xref:str>
    - <xref:azure.ai.finetuningsessions.models.LossFn>
  - name: loss_fn_config
    description: Optional per-loss hyper-parameters.
    defaultValue: None
