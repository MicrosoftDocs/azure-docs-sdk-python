  name: close
  summary: Drain all heartbeat tasks before closing the HTTP pipeline.
  signature: async close() -> None
- uid: azure.ai.finetuningsessions.aio.FineTuningSessionClient.close_session
  name: close_session
  summary: 'Unload the session from the GPU engine.


    Stops the background heartbeat, then issues the complete request.'
  signature: 'async close_session(session_id: str) -> None'
  parameters:
  - name: session_id
    description: The session ID to close.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: None.
    types:
    - <xref:None>
- uid: azure.ai.finetuningsessions.aio.FineTuningSessionClient.create_session
  name: create_session
  summary: Create a fine-tuning session and wait until the model is loaded.
  signature: 'async create_session(*, base_model: str, lora_config: LoRAConfig, type:
    str = ''training'', from_checkpoint: FromCheckpoint | None = None, timeout_sec:
    float = 600.0, user_metadata: dict[str, Any] | None = None, training_type: str
    | TrainingType | None = None) -> str'
  keywordOnlyParameters:
  - name: base_model
    description: Name of the base model to load.
    types:
    - <xref:str>
  - name: lora_config
    description: Required LoRA adapter configuration, including rank.
    types:
    - <xref:azure.ai.finetuningsessions.models.LoRAConfig>
  - name: type
    description: Session type string. Defaults to `"training"`.
    defaultValue: training
    types:
    - <xref:str>
  - name: from_checkpoint
    description: Optional checkpoint to resume from.
    defaultValue: None
    types:
    - <xref:azure.ai.finetuningsessions.models.FromCheckpoint>
    - <xref:None>
  - name: timeout_sec
    description: Maximum seconds to wait for model load.
    defaultValue: '600.0'
    types:
    - <xref:float>
  - name: user_metadata
    description: 'Optional key/value metadata stored on the session

      record.'
    defaultValue: None
    types:
    - <xref:dict>[<xref:str>, <xref:typing.Any>]
    - <xref:None>
  - name: training_type
    description: 'Training tier, specified as a string or <xref:azure.ai.finetuningsessions.aio.TrainingType>.

      Set this explicitly to select a tier; omission leaves selection to the service.

      Global jobs can run on

      any worker; datazone jobs require a worker in the same datazone as the

      API''s region; Developer Tier jobs use eligible development capacity.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:azure.ai.finetuningsessions.models.TrainingType>
    - <xref:None>
  return:
    description: The `session_id` string (e.g. `"session_abc12345"`).
