- uid: azure.ai.finetuningsessions.aio.FineTuningSessionClient.delete_session
  name: delete_session
  summary: "Delete a session and cascade-delete its models, checkpoints, and sampling\
    \ sessions.\n\nStops the background heartbeat, then issues an HTTP DELETE against\
    \ the\nsession resource; the cascade is performed server-side.\n\nIdempotent \u2014\
    \ a 404 (session already gone) is swallowed.  Any other\nnon-2xx surfaces via\
    \ the standard SDK error path."
  signature: 'async delete_session(session_id: str) -> None'
  parameters:
  - name: session_id
    description: The session ID to delete.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: None.
    types:
    - <xref:None>
- uid: azure.ai.finetuningsessions.aio.FineTuningSessionClient.forward
  name: forward
  summary: 'Submit a mini-batch for a forward-only pass (no gradients).


    Automatically chunks large batches and submits chunks in parallel

