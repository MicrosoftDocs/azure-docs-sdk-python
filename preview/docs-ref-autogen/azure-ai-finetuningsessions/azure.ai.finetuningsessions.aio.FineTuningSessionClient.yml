### YamlMime:PythonClass
uid: azure.ai.finetuningsessions.aio.FineTuningSessionClient
name: FineTuningSessionClient
fullName: azure.ai.finetuningsessions.aio.FineTuningSessionClient
module: azure.ai.finetuningsessions.aio
summary: Async fine-tuning client with token/key authentication and training APIs.
constructor:
  syntax: 'FineTuningSessionClient(endpoint: str, credential: AsyncTokenCredential
    | AzureKeyCredential, **kwargs: Any)'
  parameters:
  - name: endpoint
    description: Foundry project endpoint.
    isRequired: true
    types:
    - <xref:str>
  - name: credential
    description: Token credential or API key for the endpoint.
    isRequired: true
    types:
    - <xref:azure.core.credentials_async.AsyncTokenCredential>
    - <xref:azure.core.credentials.AzureKeyCredential>
methods:
