- uid: azure.ai.finetuningsessions.aio.FineTuningSessionClient.sample
  name: sample
  summary: "Generate completions using current LoRA weights.\n\nConcurrency is bounded\
    \ by a lifecycle-scoped semaphore (size\n`_MAX_CONCURRENT_SAMPLES`). The permit\
    \ is held for the FULL submit+poll\nlifecycle so a throttled or slow-generating\
    \ sample does not release capacity\nto a burst queued behind it. A 429 on submit\
    \ is treated as healthy\nbackpressure and retried in place \u2014 honoring `Retry-After`\
    \ + jitter \u2014 until\n`_SAMPLE_THROTTLE_TIMEOUT_SEC`, then a typed `RateLimitedError`\
    \ is raised."
  signature: 'async sample(session_id: str, prompt_tokens: List[int] | ModelInput,
    sampling_params: SamplingParams, *, checkpoint_id: str, num_samples: int = 1,
    sampling_session_id: str | None = None, seq_id: int | None = None, prompt_logprobs:
    bool = False, topk_prompt_logprobs: int = 0) -> OperationResult'
  parameters:
  - name: session_id
    description: The session ID.
    isRequired: true
    types:
    - <xref:str>
  - name: prompt_tokens
    description: 'Tokenised prompt as a list of integer IDs, or a

      structured `ModelInput` for multimodal prompts.'
    isRequired: true
    types:
    - <xref:list>[<xref:int>]
    - <xref:azure.ai.finetuningsessions.models.ModelInput>
  - name: sampling_params
    description: Generation parameters.
    isRequired: true
    types:
    - <xref:azure.ai.finetuningsessions.models.SamplingParams>
  keywordOnlyParameters:
  - name: checkpoint_id
    description: Sampler checkpoint ID from `save_weights_for_sampler`.
    types:
    - <xref:str>
  - name: num_samples
    description: Number of completions. Default 1.
    defaultValue: '1'
    types:
    - <xref:int>
  - name: sampling_session_id
    description: Optional sampling session ID sent with the request.
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: seq_id
    description: Optional sequence ID sent with the sampling request.
    defaultValue: None
    types:
    - <xref:int>
    - <xref:None>
  - name: prompt_logprobs
    description: If True, return per-token log-probabilities for the prompt.
    defaultValue: 'False'
    types:
    - <xref:bool>
  - name: topk_prompt_logprobs
    description: Top-k log-probabilities per prompt token. 0 = none. Must be between
      0 and 20 (default 0).
    defaultValue: '0'
    types:
    - <xref:int>
  return:
    description: OperationResult.
    types:
    - <xref:azure.ai.finetuningsessions.models.OperationResult>
