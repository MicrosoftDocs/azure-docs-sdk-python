- uid: azure.ai.finetuningsessions.aio.FineTuningSessionClient.forward_backward_async
  name: forward_backward_async
  summary: "Submit a forward+backward pass, return an asyncio Task for the result.\n\
    \nAwaits all POSTs (with chunking) so that the server assigns UUID v7\nrequest\
    \ IDs *before* this method returns.\n\n**Multi-chunk correctness:** When the batch\
    \ is split into multiple HTTP\nchunks, this method awaits GPU completion of *all*\
    \ chunks before\nreturning.  This ensures that a subsequent `optim_step_async`\
    \ POST\ncannot reach the engine until every chunk's gradients have been\naccumulated.\
    \  The returned task resolves immediately with the combined\nresult.\n\nFor single-chunk\
    \ batches (the common case), only the poll phase runs\nin the background \u2014\
    \ fully pipelined, no extra latency.\n\nWhen `max_chunks_per_wave` is set, at\
    \ most that many HTTP chunks are\nregistered at once. Each wave completes before\
    \ the next is posted. This\nbounds the worker's pre-optimizer batch while preserving\
    \ one logical\nforward/backward operation and one subsequent optimizer step."
  signature: 'async forward_backward_async(session_id: str, batch: List[Datum], *,
    loss_fn: str | LossFn = LossFn.CROSS_ENTROPY, loss_fn_config: LossFnConfig | None
    = None, poll_min_sec: float | None = None, poll_max_sec: float | None = None,
    max_chunks_per_wave: int | None = None) -> Task[OperationResult]'
  parameters:
  - name: session_id
    description: The session ID.
    isRequired: true
    types:
    - <xref:str>
  - name: batch
    description: List of Datum.
    isRequired: true
    types:
    - <xref:list>[<xref:azure.ai.finetuningsessions.models.Datum>]
  keywordOnlyParameters:
  - name: loss_fn
    description: Loss function name. Defaults to `"cross_entropy"`.
    defaultValue: LossFn.CROSS_ENTROPY
    types:
    - <xref:str>
    - <xref:azure.ai.finetuningsessions.models.LossFn>
  - name: loss_fn_config
    description: Optional per-loss hyper-parameters.
    defaultValue: None
    types:
    - <xref:azure.ai.finetuningsessions.models.LossFnConfig>
    - <xref:None>
  - name: poll_min_sec
    description: Optional minimum pending-result poll interval.
    defaultValue: None
    types:
    - <xref:float>
    - <xref:None>
  - name: poll_max_sec
    description: Optional maximum pending-result poll interval.
    defaultValue: None
    types:
    - <xref:float>
    - <xref:None>
  - name: max_chunks_per_wave
    description: 'Maximum number of chunks to post before waiting

      for their completion. `None` preserves the existing all-at-once behavior.'
    defaultValue: None
    types:
    - <xref:int>
    - <xref:None>
  return:
    description: An asyncio.Task whose result is an OperationResult.
    types:
    - <xref:asyncio.Task>[<xref:azure.ai.finetuningsessions.models.OperationResult>]
    - <xref:asyncio.Future>[<xref:azure.ai.finetuningsessions.models.OperationResult>]
- uid: azure.ai.finetuningsessions.aio.FineTuningSessionClient.forward_backward_post
  name: forward_backward_post
  summary: 'POST a forward+backward pass without polling for completion.


    Automatically chunks large batches.  Each chunk''s POST is awaited

    sequentially so the server assigns monotonically increasing UUID v7

    request IDs.  Returns a <xref:azure.ai.finetuningsessions.aio.PendingRequests>
    handle whose

    `poll_result()` can be awaited later.


    Use this instead of <xref:azure.ai.finetuningsessions.aio.FineTuningSessionClient.forward_backward>
    when you need to

    guarantee that all forward_backward requests are registered on the

    server *before* a subsequent `optim_step_post`.'
  signature: 'async forward_backward_post(session_id: str, batch: List[Datum], *,
    loss_fn: str | LossFn = LossFn.CROSS_ENTROPY, loss_fn_config: LossFnConfig | None
    = None) -> PendingRequests'
  parameters:
  - name: session_id
    description: The session ID.
    isRequired: true
    types:
    - <xref:str>
  - name: batch
    description: List of Datum.
    isRequired: true
    types:
    - <xref:list>[<xref:azure.ai.finetuningsessions.models.Datum>]
  keywordOnlyParameters:
  - name: loss_fn
    description: Loss function name.
    defaultValue: LossFn.CROSS_ENTROPY
    types:
    - <xref:str>
    - <xref:azure.ai.finetuningsessions.models.LossFn>
  - name: loss_fn_config
    description: Optional per-loss hyper-parameters.
    defaultValue: None
    types:
    - <xref:azure.ai.finetuningsessions.models.LossFnConfig>
    - <xref:None>
  return:
    description: PendingRequests handle.
    types:
    - <xref:azure.ai.finetuningsessions.aio._patch.PendingRequests>
