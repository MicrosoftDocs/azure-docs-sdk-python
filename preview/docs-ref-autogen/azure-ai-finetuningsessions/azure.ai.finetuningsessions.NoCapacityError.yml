uid: azure.ai.finetuningsessions.NoCapacityError
name: NoCapacityError
fullName: azure.ai.finetuningsessions.NoCapacityError
module: azure.ai.finetuningsessions
summary: 'No engine capacity is currently available.


  Action: wait `retry_after_sec` seconds and retry, or switch to a

  different project/endpoint.


  The inherited `reason` attribute contains the server-reported reason

  (for example, `"engine_busy"`).


  Additional keyword arguments are forwarded to the base exception.'
constructor:
  syntax: 'NoCapacityError(message: str, *, retry_after_sec: float | None = None,
    reason: str | None = None, response: Any = None, **kwargs: Any)'
  parameters:
  - name: message
    description: Error message.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: retry_after_sec
    description: Suggested wait time in seconds before retrying, if provided.
    defaultValue: None
  - name: reason
    description: Server-reported reason, if provided.
    defaultValue: None
  - name: response
    description: HTTP response associated with the error, if available.
    defaultValue: None
    types:
    - <xref:typing.Any>
