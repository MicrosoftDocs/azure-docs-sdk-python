### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.types.OsDiskProfile
name: OsDiskProfile
fullName: azure.mgmt.redhatopenshifthcp.types.OsDiskProfile
module: azure.mgmt.redhatopenshifthcp.types
summary: The settings and configuration options for OSDisk.
constructor:
  syntax: OsDiskProfile()
variables:
- description: 'The OS disk size in GiB. Maximum is 4095 GiB for Managed disks. For
    Ephemeral

    disks, the maximum is 2040 GiB; Azure may enforce a lower effective limit based
    on the selected

    VM size''s local cache, temp, or NVMe capacity.'
  name: sizeGiB
  types:
  - <xref:int>
- description: 'The type of the disk storage account


    * [https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types](https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types).
    Known values are: "Premium_LRS", "StandardSSD_LRS", and "Standard_LRS".'
  name: diskStorageAccountType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskStorageAccountType">]
- description: 'The ID of the DiskEncryptionSet resource to use to encrypt the OS
    disks

    for the VMs.

    This needs to exist in the same subscription id listed in the Hosted Cluster,

    HostedCluster.Spec.Platform.Azure.SubscriptionID.

    DiskEncryptionSetID should also exist in a resource group under the same subscription
    id and

    the same location

    listed in the Hosted Cluster, HostedCluster.Spec.Platform.Azure.Location.


    Details on how to create a Disk Encryption Set can be found here:

    [https://learn.microsoft.com/en-us/azure/virtual-machines/disks-enable-customer-managed-keys-portal#set-up-your-disk-encryption-set](https://learn.microsoft.com/en-us/azure/virtual-machines/disks-enable-customer-managed-keys-portal#set-up-your-disk-encryption-set).'
  name: encryptionSetId
  types:
  - <xref:str>
- description: 'The type of the OS disk.


    * [https://learn.microsoft.com/en-us/azure/virtual-machines/ephemeral-os-disks](https://learn.microsoft.com/en-us/azure/virtual-machines/ephemeral-os-disks).
    Known values are: "Managed" and "Ephemeral".'
  name: diskType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OsDiskType">]
attributes:
- uid: azure.mgmt.redhatopenshifthcp.types.OsDiskProfile.diskStorageAccountType
  name: diskStorageAccountType
  summary: 'The type of the disk storage account


    * [https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types](https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types).
    Known values are: "Premium_LRS", "StandardSSD_LRS", and "Standard_LRS". '
  signature: 'diskStorageAccountType: str | DiskStorageAccountType'
- uid: azure.mgmt.redhatopenshifthcp.types.OsDiskProfile.diskType
  name: diskType
  summary: 'The type of the OS disk.


    * [https://learn.microsoft.com/en-us/azure/virtual-machines/ephemeral-os-disks](https://learn.microsoft.com/en-us/azure/virtual-machines/ephemeral-os-disks).
    Known values are: "Managed" and "Ephemeral". '
  signature: 'diskType: str | OsDiskType'
- uid: azure.mgmt.redhatopenshifthcp.types.OsDiskProfile.encryptionSetId
  name: encryptionSetId
  summary: 'The ID of the DiskEncryptionSet resource to use to encrypt the OS disks
    for the VMs.

    This needs to exist in the same subscription id listed in the Hosted Cluster,

    HostedCluster.Spec.Platform.Azure.SubscriptionID.

    DiskEncryptionSetID should also exist in a resource group under the same subscription
    id and

    the same location

    listed in the Hosted Cluster, HostedCluster.Spec.Platform.Azure.Location.


    Details on how to create a Disk Encryption Set can be found here:

    [https://learn.microsoft.com/en-us/azure/virtual-machines/disks-enable-customer-managed-keys-portal#set-up-your-disk-encryption-set](https://learn.microsoft.com/en-us/azure/virtual-machines/disks-enable-customer-managed-keys-portal#set-up-your-disk-encryption-set).'
  signature: 'encryptionSetId: str'
- uid: azure.mgmt.redhatopenshifthcp.types.OsDiskProfile.sizeGiB
  name: sizeGiB
  summary: 'The OS disk size in GiB. Maximum is 4095 GiB for Managed disks. For Ephemeral
    disks, the

    maximum is 2040 GiB; Azure may enforce a lower effective limit based on the selected
    VM size''s

    local cache, temp, or NVMe capacity.'
  signature: 'sizeGiB: int'
