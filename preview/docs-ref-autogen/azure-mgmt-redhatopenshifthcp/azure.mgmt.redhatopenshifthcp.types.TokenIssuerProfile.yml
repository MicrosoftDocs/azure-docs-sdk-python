### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.types.TokenIssuerProfile
name: TokenIssuerProfile
fullName: azure.mgmt.redhatopenshifthcp.types.TokenIssuerProfile
module: azure.mgmt.redhatopenshifthcp.types
summary: 'Token issuer profile This configures how the platform interacts with the
  identity provider and

  how tokens issued from the identity provider are evaluated by the Kubernetes API
  server.'
constructor:
  syntax: TokenIssuerProfile()
variables:
- description: 'This configures the URL used to issue tokens by the identity provider.

    The Kubernetes API server determines how authentication tokens should be handled

    by matching the ''iss'' claim in the JWT to the issuerURL of configured identity
    providers.


    issuerURL must use the ''https'' scheme. Required.'
  name: url
  types:
  - <xref:str>
- description: 'This configures the acceptable audiences the JWT token, issued by
    the identity

    provider, must be issued to. At least one of the entries must match the

    ''aud'' claim in the JWT token.


    audiences must contain at least one entry and must not exceed ten entries. Required.'
  name: audiences
  types:
  - <xref:list>[<xref:str>]
- description: 'The issuer of the token


    Certificate bundle to use to validate server certificates for the configured URL.

    It must be PEM encoded and when not specified, the system trust is used.'
  name: ca
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.redhatopenshifthcp.types.TokenIssuerProfile.audiences
  name: audiences
  summary: 'This configures the acceptable audiences the JWT token, issued by the
    identity

    provider, must be issued to. At least one of the entries must match the

    ''aud'' claim in the JWT token.


    audiences must contain at least one entry and must not exceed ten entries. Required.'
  signature: 'audiences: list[str]'
- uid: azure.mgmt.redhatopenshifthcp.types.TokenIssuerProfile.ca
  name: ca
  summary: 'The issuer of the token


    Certificate bundle to use to validate server certificates for the configured URL.

    It must be PEM encoded and when not specified, the system trust is used.'
  signature: 'ca: str'
- uid: azure.mgmt.redhatopenshifthcp.types.TokenIssuerProfile.url
  name: url
  summary: 'This configures the URL used to issue tokens by the identity provider.

    The Kubernetes API server determines how authentication tokens should be handled

    by matching the ''iss'' claim in the JWT to the issuerURL of configured identity
    providers.


    issuerURL must use the ''https'' scheme. Required.'
  signature: 'url: str'
