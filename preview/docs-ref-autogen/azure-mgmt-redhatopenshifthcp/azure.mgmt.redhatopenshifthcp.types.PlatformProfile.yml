### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.types.PlatformProfile
name: PlatformProfile
fullName: azure.mgmt.redhatopenshifthcp.types.PlatformProfile
module: azure.mgmt.redhatopenshifthcp.types
summary: Azure specific configuration.
constructor:
  syntax: PlatformProfile()
variables:
- description: 'Resource group name to put cluster resources


    If not specified then a unique name is generated from the

    following pattern


    "aro-hcp-" + clusterName + "-" + UUID


    where clusterName means the hcpOpenShiftClusters resource name

    (up to 45 characters) followed by a 16-byte universally unique

    identifier per RFC 4122.'
  name: managedResourceGroup
  types:
  - <xref:str>
- description: 'The Azure resource ID of the worker subnet Note that a subnet cannot
    be reused

    between ARO-HCP Clusters. Required.'
  name: subnetId
  types:
  - <xref:str>
- description: 'The Azure resource ID of a subnet that enables direct, private

    network connectivity between the hosted control plane and your cluster''s nodes.
    This subnet

    must be dedicated to ARO HCP and cannot be shared with the cluster subnet or any
    node pool

    subnets. Required.'
  name: vnetIntegrationSubnetId
  types:
  - <xref:str>
- description: The core outgoing configuration. "LoadBalancer"
  name: outboundType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OutboundType">]
- description: 'ResourceId for the NSG (network security group) attached to the

    cluster subnet


    Note that NSGs cannot be reused for other ARO-HCP clusters. Required.'
  name: networkSecurityGroupId
  types:
  - <xref:str>
- description: 'The configuration that the operators of the cluster have to

    authenticate to Azure. Required.'
  name: operatorsAuthentication
  types:
  - <xref:<xref:"OperatorsAuthenticationProfile">>
- description: 'URL for the OIDC provider to be used for authentication to authenticate

    against user Azure cloud account. Required.'
  name: issuerUrl
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.redhatopenshifthcp.types.PlatformProfile.issuerUrl
  name: issuerUrl
  summary: 'URL for the OIDC provider to be used for authentication to authenticate
    against user Azure

    cloud account. Required.'
  signature: 'issuerUrl: Required[str]'
- uid: azure.mgmt.redhatopenshifthcp.types.PlatformProfile.managedResourceGroup
  name: managedResourceGroup
  summary: 'Resource group name to put cluster resources


    If not specified then a unique name is generated from the

    following pattern


    "aro-hcp-" + clusterName + "-" + UUID


    where clusterName means the hcpOpenShiftClusters resource name

    (up to 45 characters) followed by a 16-byte universally unique

    identifier per RFC 4122.'
  signature: 'managedResourceGroup: str'
- uid: azure.mgmt.redhatopenshifthcp.types.PlatformProfile.networkSecurityGroupId
  name: networkSecurityGroupId
  summary: 'ResourceId for the NSG (network security group) attached to the cluster
    subnet


    Note that NSGs cannot be reused for other ARO-HCP clusters. Required.'
  signature: 'networkSecurityGroupId: Required[str]'
- uid: azure.mgmt.redhatopenshifthcp.types.PlatformProfile.operatorsAuthentication
  name: operatorsAuthentication
  summary: The configuration that the operators of the cluster have to authenticate
    to Azure. Required.
  signature: 'operatorsAuthentication: Required[OperatorsAuthenticationProfile]'
- uid: azure.mgmt.redhatopenshifthcp.types.PlatformProfile.outboundType
  name: outboundType
  summary: The core outgoing configuration. "LoadBalancer"
  signature: 'outboundType: str | OutboundType'
- uid: azure.mgmt.redhatopenshifthcp.types.PlatformProfile.subnetId
  name: subnetId
  summary: 'The Azure resource ID of the worker subnet Note that a subnet cannot be
    reused between ARO-HCP

    Clusters. Required.'
  signature: 'subnetId: Required[str]'
- uid: azure.mgmt.redhatopenshifthcp.types.PlatformProfile.vnetIntegrationSubnetId
  name: vnetIntegrationSubnetId
  summary: 'The Azure resource ID of a subnet that enables direct, private network
    connectivity between the

    hosted control plane and your cluster''s nodes. This subnet must be dedicated
    to ARO HCP and

    cannot be shared with the cluster subnet or any node pool subnets. Required.'
  signature: 'vnetIntegrationSubnetId: Required[str]'
