### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.types.UsernameClaimProfile
name: UsernameClaimProfile
fullName: azure.mgmt.redhatopenshifthcp.types.UsernameClaimProfile
module: azure.mgmt.redhatopenshifthcp.types
summary: 'External Auth claim profile This configures how the username of a cluster
  identity should be

  constructed from the claims in a JWT token issued by the identity provider.'
constructor:
  syntax: UsernameClaimProfile()
variables:
- description: Claim name of the external profile. Required.
  name: claim
  types:
  - <xref:str>
- description: 'Prefix for the claim external profile Must be set when the prefixPolicy
    field is

    set to ''Prefix'' and must be unset otherwise.'
  name: prefix
  types:
  - <xref:str>
- description: 'Prefix policy is an optional field that configures how a prefix should
    be

    applied to the value of the JWT claim specified in the ''claim'' field.


    Allowed values are ''Prefix'', ''NoPrefix'', and ''None''. If not specified, the

    default policy is ''None''.


    When set to ''Prefix'', the value specified in the prefix field will be

    prepended to the value of the JWT claim.

    The prefix field must be set when prefixPolicy is ''Prefix''.


    When set to ''NoPrefix'', no prefix will be prepended to the value

    of the JWT claim.


    When set to ''None'', this means no opinion and the platform is left to choose

    any prefixes that are applied which is subject to change over time.

    Currently, the platform prepends `{issuerURL}#` to the value of the JWT claim

    when the claim is not ''email''.

    As an example, consider the following scenario:

    `prefix` is unset, `issuerURL` is set to `https://myoidc.tld`,

    the JWT claims include "username":"userA" and "email":"userA. Known values are:
    "None",

    "Prefix", and "NoPrefix".'
  name: prefixPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UsernameClaimPrefixPolicy">]
attributes:
- uid: azure.mgmt.redhatopenshifthcp.types.UsernameClaimProfile.claim
  name: claim
  summary: Claim name of the external profile. Required.
  signature: 'claim: Required[str]'
- uid: azure.mgmt.redhatopenshifthcp.types.UsernameClaimProfile.prefix
  name: prefix
  summary: 'Prefix for the claim external profile Must be set when the prefixPolicy
    field is set to

    ''Prefix'' and must be unset otherwise.'
  signature: 'prefix: str'
- uid: azure.mgmt.redhatopenshifthcp.types.UsernameClaimProfile.prefixPolicy
  name: prefixPolicy
  summary: 'Prefix policy is an optional field that configures how a prefix should
    be

    applied to the value of the JWT claim specified in the ''claim'' field.


    Allowed values are ''Prefix'', ''NoPrefix'', and ''None''. If not specified, the

    default policy is ''None''.


    When set to ''Prefix'', the value specified in the prefix field will be

    prepended to the value of the JWT claim.

    The prefix field must be set when prefixPolicy is ''Prefix''.


    When set to ''NoPrefix'', no prefix will be prepended to the value

    of the JWT claim.


    When set to ''None'', this means no opinion and the platform is left to choose

    any prefixes that are applied which is subject to change over time.

    Currently, the platform prepends `{issuerURL}#` to the value of the JWT claim

    when the claim is not ''email''.

    As an example, consider the following scenario:

    `prefix` is unset, `issuerURL` is set to `https://myoidc.tld`,

    the JWT claims include "username":"userA" and "email":"userA. Known values are:

    "None", "Prefix", and "NoPrefix".'
  signature: 'prefixPolicy: str | UsernameClaimPrefixPolicy'
