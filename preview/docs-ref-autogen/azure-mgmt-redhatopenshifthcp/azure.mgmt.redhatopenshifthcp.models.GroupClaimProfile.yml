### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.models.GroupClaimProfile
name: GroupClaimProfile
fullName: azure.mgmt.redhatopenshifthcp.models.GroupClaimProfile
module: azure.mgmt.redhatopenshifthcp.models
summary: 'External Auth claim profile

  This configures how the groups of a cluster identity should be constructed

  from the claims in a JWT token issued by the identity provider. When

  referencing a claim, if the claim is present in the JWT token, its value

  must be a list of groups separated by a comma ('','').


  For example - ''"example"'' and ''"exampleOne", "exampleTwo", "exampleThree"'' are
  valid claim

  values.'
constructor:
  syntax: 'GroupClaimProfile(*args: Any, **kwargs: Any)'
variables:
- description: Claim name of the external profile. Required.
  name: claim
  types:
  - <xref:str>
- description: 'Prefix for the claim external profile If this is specified prefixPolicy
    will be

    set to "Prefix" by default.'
  name: prefix
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.redhatopenshifthcp.models.GroupClaimProfile.claim
  name: claim
  summary: Claim name of the external profile. Required.
  signature: 'claim: str'
- uid: azure.mgmt.redhatopenshifthcp.models.GroupClaimProfile.prefix
  name: prefix
  summary: 'Prefix for the claim external profile If this is specified prefixPolicy
    will be set to

    "Prefix" by default.'
  signature: 'prefix: str | None'
