  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'The set of Azure User-Assigned Managed Identities leveraged for the

    Data Plane operators of the cluster. The set of required managed identities is
    dependent on the

    Cluster''s OpenShift version. Required.'
  name: dataPlaneOperators
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'Represents the information associated to an Azure User-Assigned

    Managed Identity whose purpose is to perform service level actions. Required.'
  name: serviceManagedIdentity
  types:
  - <xref:str>
attributes:
