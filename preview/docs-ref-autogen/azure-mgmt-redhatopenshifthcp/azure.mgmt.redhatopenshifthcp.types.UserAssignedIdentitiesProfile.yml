uid: azure.mgmt.redhatopenshifthcp.types.UserAssignedIdentitiesProfile
name: UserAssignedIdentitiesProfile
fullName: azure.mgmt.redhatopenshifthcp.types.UserAssignedIdentitiesProfile
module: azure.mgmt.redhatopenshifthcp.types
summary: 'Represents the information related to Azure User-Assigned managed identities
  needed to perform

  Operators authentication based on Azure User-Assigned Managed Identities.'
constructor:
  syntax: UserAssignedIdentitiesProfile()
variables:
- description: 'The set of Azure User-Assigned Managed Identities leveraged for

    the Control Plane operators of the cluster. The set of required managed identities
    is dependent

    on the Cluster''s OpenShift version. Required.'
