### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.models.ClusterAutoscalingProfile
name: ClusterAutoscalingProfile
fullName: azure.mgmt.redhatopenshifthcp.models.ClusterAutoscalingProfile
module: azure.mgmt.redhatopenshifthcp.models
summary: 'ClusterAutoscaling specifies auto-scaling behavior that applies to all NodePools
  associated

  with a control plane.'
constructor:
  syntax: 'ClusterAutoscalingProfile(*args: Any, **kwargs: Any)'
variables:
- description: 'maxNodesTotal is the maximum allowable number of nodes for the

    Autoscaler scale out to be operational. The autoscaler will not grow the cluster
    beyond this

    number. If omitted, the autoscaler will not have a maximum limit.'
  name: max_nodes_total
  types:
  - <xref:int>
- description: 'maxPodGracePeriod is the maximum seconds to wait for

    graceful pod termination before scaling down a NodePool. The default is 600 seconds.'
  name: max_pod_grace_period_seconds
  types:
  - <xref:int>
- description: 'maxNodeProvisionTimeSeconds is the maximum time to wait

    for node provisioning before considering the provisioning to be unsuccessful.
    The default is

    900 seconds, or 15 minutes.'
  name: max_node_provision_time_seconds
  types:
  - <xref:int>
- description: 'podPriorityThreshold enables users to schedule "best-effort"

    pods, which shouldn''t trigger autoscaler actions, but only run when there are
    spare resources

    available. The default is -10. See the following for more details:

    [https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/FAQ.md#how-does-cluster-autoscaler-work-with-pod-priority-and-preemption](https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/FAQ.md#how-does-cluster-autoscaler-work-with-pod-priority-and-preemption).'
  name: pod_priority_threshold
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.redhatopenshifthcp.models.ClusterAutoscalingProfile.max_node_provision_time_seconds
  name: max_node_provision_time_seconds
  summary: 'maxNodeProvisionTimeSeconds is the maximum time to wait for node provisioning
    before

    considering the provisioning to be unsuccessful. The default is 900 seconds, or
    15 minutes.'
  signature: 'max_node_provision_time_seconds: int | None'
- uid: azure.mgmt.redhatopenshifthcp.models.ClusterAutoscalingProfile.max_nodes_total
  name: max_nodes_total
  summary: 'maxNodesTotal is the maximum allowable number of nodes for the Autoscaler
    scale out to be

    operational. The autoscaler will not grow the cluster beyond this number. If omitted,
    the

    autoscaler will not have a maximum limit.'
  signature: 'max_nodes_total: int | None'
- uid: azure.mgmt.redhatopenshifthcp.models.ClusterAutoscalingProfile.max_pod_grace_period_seconds
  name: max_pod_grace_period_seconds
  summary: 'maxPodGracePeriod is the maximum seconds to wait for graceful pod termination
    before scaling

    down a NodePool. The default is 600 seconds.'
  signature: 'max_pod_grace_period_seconds: int | None'
- uid: azure.mgmt.redhatopenshifthcp.models.ClusterAutoscalingProfile.pod_priority_threshold
  name: pod_priority_threshold
  summary: 'podPriorityThreshold enables users to schedule "best-effort" pods, which
    shouldn''t trigger

    autoscaler actions, but only run when there are spare resources available. The
    default is -10.

    See the following for more details:

    [https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/FAQ.md#how-does-cluster-autoscaler-work-with-pod-priority-and-preemption](https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/FAQ.md#how-does-cluster-autoscaler-work-with-pod-priority-and-preemption).'
  signature: 'pod_priority_threshold: int | None'
