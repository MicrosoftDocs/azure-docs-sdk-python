### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.types.ExternalAuthClientProfile
name: ExternalAuthClientProfile
fullName: azure.mgmt.redhatopenshifthcp.types.ExternalAuthClientProfile
module: azure.mgmt.redhatopenshifthcp.types
summary: 'External Auth client profile This configures how on-cluster, platform clients
  should request

  tokens from the identity provider.'
constructor:
  syntax: ExternalAuthClientProfile()
variables:
- description: External Auth client component. Required.
  name: component
  types:
  - <xref:<xref:"ExternalAuthClientComponentProfile">>
- description: 'External Auth client id The clientId must appear in the audience field
    of the

    TokenIssuerProfile. Required.'
  name: clientId
  types:
  - <xref:str>
- description: 'external auth client scopes


    This is useful if you have configured claim mappings that requires specific

    scopes to be requested beyond the standard OIDC scopes.

    When omitted, no additional scopes are requested.'
  name: extraScopes
  types:
  - <xref:list>[<xref:str>]
- description: 'Determines the OIDC provider client type. Required. Known values are:

    "Confidential" and "Public".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExternalAuthClientType">]
attributes:
- uid: azure.mgmt.redhatopenshifthcp.types.ExternalAuthClientProfile.clientId
  name: clientId
  summary: 'External Auth client id The clientId must appear in the audience field
    of the

    TokenIssuerProfile. Required.'
  signature: 'clientId: Required[str]'
- uid: azure.mgmt.redhatopenshifthcp.types.ExternalAuthClientProfile.component
  name: component
  summary: External Auth client component. Required.
  signature: 'component: Required[ExternalAuthClientComponentProfile]'
- uid: azure.mgmt.redhatopenshifthcp.types.ExternalAuthClientProfile.extraScopes
  name: extraScopes
  summary: 'external auth client scopes


    This is useful if you have configured claim mappings that requires specific

    scopes to be requested beyond the standard OIDC scopes.

    When omitted, no additional scopes are requested.'
  signature: 'extraScopes: list[str]'
- uid: azure.mgmt.redhatopenshifthcp.types.ExternalAuthClientProfile.type
  name: type
  summary: '"Confidential" and

    "Public".'
  signature: 'type: Required[str | ExternalAuthClientType]'
