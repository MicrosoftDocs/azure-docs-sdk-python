  name: outbound_type
  summary: The core outgoing configuration. "LoadBalancer"
  signature: 'outbound_type: str | _models.OutboundType | None'
- uid: azure.mgmt.redhatopenshifthcp.models.PlatformProfile.subnet_id
  name: subnet_id
  summary: 'The Azure resource ID of the worker subnet Note that a subnet cannot be
