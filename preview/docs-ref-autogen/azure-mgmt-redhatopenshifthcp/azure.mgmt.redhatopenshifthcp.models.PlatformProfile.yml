### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.models.PlatformProfile
name: PlatformProfile
fullName: azure.mgmt.redhatopenshifthcp.models.PlatformProfile
module: azure.mgmt.redhatopenshifthcp.models
summary: Azure specific configuration.
constructor:
  syntax: 'PlatformProfile(*args: Any, **kwargs: Any)'
variables:
- description: 'Resource group name to put cluster resources


    If not specified then a unique name is generated from the

    following pattern


    "aro-hcp-" + clusterName + "-" + UUID


    where clusterName means the hcpOpenShiftClusters resource name

    (up to 45 characters) followed by a 16-byte universally unique

    identifier per RFC 4122.'
  name: managed_resource_group
  types:
  - <xref:str>
- description: 'The Azure resource ID of the worker subnet Note that a subnet cannot
    be reused

    between ARO-HCP Clusters. Required.'
  name: subnet_id
  types:
  - <xref:str>
- description: 'The Azure resource ID of a subnet that enables direct,

    private network connectivity between the hosted control plane and your cluster''s
    nodes. This

    subnet must be dedicated to ARO HCP and cannot be shared with the cluster subnet
    or any node

    pool subnets. Required.'
  name: vnet_integration_subnet_id
  types:
  - <xref:str>
- description: The core outgoing configuration. "LoadBalancer"
  name: outbound_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.redhatopenshifthcp.models.OutboundType>
- description: 'ResourceId for the NSG (network security group) attached to

    the cluster subnet


    Note that NSGs cannot be reused for other ARO-HCP clusters. Required.'
  name: network_security_group_id
  types:
  - <xref:str>
- description: 'The configuration that the operators of the cluster have to

    authenticate to Azure. Required.'
  name: operators_authentication
  types:
  - <xref:azure.mgmt.redhatopenshifthcp.models.OperatorsAuthenticationProfile>
- description: 'URL for the OIDC provider to be used for authentication to authenticate

    against user Azure cloud account. Required.'
  name: issuer_url
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.redhatopenshifthcp.models.PlatformProfile.issuer_url
  name: issuer_url
  summary: 'URL for the OIDC provider to be used for authentication to authenticate
    against user Azure

    cloud account. Required.'
  signature: 'issuer_url: str'
