### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.types.ImageDigestMirror
name: ImageDigestMirror
fullName: azure.mgmt.redhatopenshifthcp.types.ImageDigestMirror
module: azure.mgmt.redhatopenshifthcp.types
summary: "ImageDigestMirror specifies a set of mirror registries to redirect image\
  \ pulls targeting the\n   specified source registries.\n\n   ivar source:\n    \
  \  source matches the repository that users refer to, e.g. in image pull\n     \
  \ specifications. Setting source to a registry hostname, e.g. docker.io, quay.io,\
  \ or\n      registry.redhat.io, will match the image pull specification of the corresponding\
  \ registry.\n      source uses one of the following formats:\n\n      * host[:port]\
  \ \n\n      * host[:port]/namespace[/namespace...] \n\n      * host[:port]/namespace[/namespace...]/repo\
  \ \n\n      * [>>*<<.]host \n\n      for more information about the format, see:\n\
  \n>>`<<[https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md#choosing-a-registry-toml-table](https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md#choosing-a-registry-toml-table)\n\
  \      <[https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md#choosing-a-registry-toml-table](https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md#choosing-a-registry-toml-table)>`_.\n\
  \      Required.\n\n   vartype source:\n      str\n\n   ivar mirrors:\n      mirrors\
  \ is zero or more locations that may also contain the same images. No\n      mirror\
  \ will be configured if not specified. Images can be pulled from these mirrors only\
  \ if\n      they are referenced by their digests. The mirrored location is obtained\
  \ by replacing the part\n      of the input reference that matches source by the\
  \ mirrors entry, e.g. for\n      registry.redhat.io/product/repo reference, a (source,\
  \ mirror) pair >>*<<.redhat.io,\n      mirror.local/redhat causes a mirror.local/redhat/product/repo\
  \ repository to be used. The order\n      of mirrors in this list is treated as\
  \ the user's desired priority, while source is by default\n      considered lower\
  \ priority than all mirrors. If no mirror is specified or all image pulls from\n\
  \      the mirror list fail, the image will continue to be pulled from the repository\
  \ in the pull\n      spec. Other cluster configuration, including (but not limited\
  \ to) other imageDigestMirrors\n      objects, may impact the exact order mirrors\
  \ are contacted in, or some mirrors may be contacted\n      in parallel, so this\
  \ should be considered a preference rather than a guarantee of ordering.\n     \
  \ mirrors uses one of the following formats:\n\n      * host[:port] \n\n      *\
  \ host[:port]/namespace[/namespace...] \n\n      * host[:port]/namespace[/namespace...]/repo\
  \ \n\n      for more information about the format, see:\n\n>>`<<[https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md#choosing-a-registry-toml-table](https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md#choosing-a-registry-toml-table)\n\
  \      <[https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md#choosing-a-registry-toml-table](https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md#choosing-a-registry-toml-table)>`_.\n\
  \      Required.\n\n   vartype mirrors:\n      list[str]"
