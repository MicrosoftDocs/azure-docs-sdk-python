### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.types.KmsEncryptionProfile
name: KmsEncryptionProfile
fullName: azure.mgmt.redhatopenshifthcp.types.KmsEncryptionProfile
module: azure.mgmt.redhatopenshifthcp.types
summary: 'Configure etcd encryption Key Management Service (KMS) key. Your Microsoft
  Entra application

  used to create the cluster must be authorized to access this keyvault, e.g using
  the AzureCLI:

  `az keyvault set-policy -n $KEYVAULT_NAME --key-permissions decrypt encrypt --spn
  (YOUR

  APPLICATION CLIENT ID)`.'
constructor:
  syntax: KmsEncryptionProfile()
variables:
- description: vaultName is the name of the keyvault that contains the secret. Required.
  name: vaultName
  types:
  - <xref:str>
- description: 'visibility of the keyvault that contains the secret. Required. Known
    values

    are: "Public" and "Private".'
  name: visibility
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KeyVaultVisibility">]
- description: The details of the active key. Required.
  name: activeKey
  types:
  - <xref:<xref:"KmsKey">>
attributes:
- uid: azure.mgmt.redhatopenshifthcp.types.KmsEncryptionProfile.activeKey
  name: activeKey
  summary: The details of the active key. Required.
  signature: 'activeKey: Required[KmsKey]'
- uid: azure.mgmt.redhatopenshifthcp.types.KmsEncryptionProfile.vaultName
  name: vaultName
  summary: vaultName is the name of the keyvault that contains the secret. Required.
  signature: 'vaultName: Required[str]'
- uid: azure.mgmt.redhatopenshifthcp.types.KmsEncryptionProfile.visibility
  name: visibility
  summary: '"Public" and

    "Private".'
  signature: 'visibility: Required[str | KeyVaultVisibility]'
