### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.types.ExternalAuthProperties
name: ExternalAuthProperties
fullName: azure.mgmt.redhatopenshifthcp.types.ExternalAuthProperties
module: azure.mgmt.redhatopenshifthcp.types
summary: External Auth profile.
constructor:
  syntax: ExternalAuthProperties()
variables:
- description: 'Provisioning state. Known values are: "Succeeded", "Failed",

    "Canceled", "Accepted", "Deleting", "Provisioning", "Updating", and "AwaitingSecret".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExternalAuthProvisioningState">]
- description: Status of the external auth resource.
  name: status
  types:
  - <xref:<xref:"ResourceStatus">>
- description: Token Issuer profile. Required.
  name: issuer
  types:
  - <xref:<xref:"TokenIssuerProfile">>
- description: 'External Auth OIDC clients There must not be more than 20 entries
    and entries

    must have unique namespace/name pairs.'
  name: clients
  types:
  - <xref:list>[<xref:"ExternalAuthClientProfile">]
- description: 'External Auth claim This configures how claims are validated and applied.

    Required.'
  name: claim
  types:
  - <xref:<xref:"ExternalAuthClaimProfile">>
attributes:
- uid: azure.mgmt.redhatopenshifthcp.types.ExternalAuthProperties.claim
  name: claim
  summary: External Auth claim This configures how claims are validated and applied.
    Required.
  signature: 'claim: Required[ExternalAuthClaimProfile]'
- uid: azure.mgmt.redhatopenshifthcp.types.ExternalAuthProperties.clients
  name: clients
  summary: 'External Auth OIDC clients There must not be more than 20 entries and
    entries must have unique

    namespace/name pairs.'
  signature: 'clients: list[''ExternalAuthClientProfile'']'
- uid: azure.mgmt.redhatopenshifthcp.types.ExternalAuthProperties.issuer
  name: issuer
  summary: Token Issuer profile. Required.
  signature: 'issuer: Required[TokenIssuerProfile]'
- uid: azure.mgmt.redhatopenshifthcp.types.ExternalAuthProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled", "Accepted",

    "Deleting", "Provisioning", "Updating", and "AwaitingSecret".'
  signature: 'provisioningState: str | ExternalAuthProvisioningState'
- uid: azure.mgmt.redhatopenshifthcp.types.ExternalAuthProperties.status
  name: status
  summary: Status of the external auth resource.
  signature: 'status: ResourceStatus'
