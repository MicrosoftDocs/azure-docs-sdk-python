  name: status
  summary: Status of the cluster resource.
  signature: 'status: ResourceStatus'
- uid: azure.mgmt.redhatopenshifthcp.types.HcpOpenShiftClusterProperties.version
  name: version
  summary: Version of the control plane components. Required.
