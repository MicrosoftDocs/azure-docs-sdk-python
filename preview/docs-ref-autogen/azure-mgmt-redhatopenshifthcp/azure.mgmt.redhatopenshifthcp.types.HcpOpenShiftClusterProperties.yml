    WARNING: Updating this array will redeploy all node pools in the cluster.'
  signature: 'imageDigestMirrors: list[''ImageDigestMirror'']'
- uid: azure.mgmt.redhatopenshifthcp.types.HcpOpenShiftClusterProperties.ingress
  name: ingress
  summary: The cluster ingress configuration.
  signature: 'ingress: IngressProfile'
