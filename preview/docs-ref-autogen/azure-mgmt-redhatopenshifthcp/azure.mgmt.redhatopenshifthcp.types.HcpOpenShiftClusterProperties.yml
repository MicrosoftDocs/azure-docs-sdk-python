### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.types.HcpOpenShiftClusterProperties
name: HcpOpenShiftClusterProperties
fullName: azure.mgmt.redhatopenshifthcp.types.HcpOpenShiftClusterProperties
module: azure.mgmt.redhatopenshifthcp.types
summary: HCP cluster properties.
constructor:
  syntax: HcpOpenShiftClusterProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Accepted", "Deleting", "Provisioning", and "Updating".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: Version of the control plane components. Required.
  name: version
  types:
  - <xref:<xref:"VersionProfile">>
- description: Cluster DNS configuration.
  name: dns
  types:
  - <xref:<xref:"DnsProfile">>
- description: Cluster network configuration.
  name: network
  types:
  - <xref:<xref:"NetworkProfile">>
- description: Shows the cluster web console information.
  name: console
  types:
  - <xref:<xref:"ConsoleProfile">>
- description: Shows the cluster API server profile.
  name: api
  types:
  - <xref:<xref:"ApiProfile">>
- description: The cluster ingress configuration.
  name: ingress
  types:
  - <xref:<xref:"IngressProfile">>
- description: Azure platform configuration. Required.
  name: platform
  types:
  - <xref:<xref:"PlatformProfile">>
- description: Configure ClusterAutoscaling .
  name: autoscaling
  types:
  - <xref:<xref:"ClusterAutoscalingProfile">>
- description: Configure ETCD.
  name: etcd
  types:
  - <xref:<xref:"EtcdProfile">>
- description: 'imageDigestMirrors is a set of rules to allow pulling images from
    a

    mirrored registry by using digest specifications.


    WARNING: Updating this array will redeploy all node pools in the cluster.'
  name: imageDigestMirrors
  types:
  - <xref:list>[<xref:"ImageDigestMirror">]
- description: 'nodeDrainTimeoutMinutes is the grace period for how long Pod

    Disruption Budget-protected workloads will be

    respected during any node draining operation. After this grace period, any workloads
    protected

    by Pod Disruption

    Budgets that have not been successfully drained from a node will be forcibly evicted.
    This is

    especially relevant to cluster upgrades.


    Valid values are in minutes and from 0 to 10080 minutes (1 week).

    0 means that the MachinePool can be drained without any time limitation.


    This is the value is used a default for all NodePools. It can be overridden

    by specifying nodeDrainTimeoutMinutes for a given NodePool.'
  name: nodeDrainTimeoutMinutes
  types:
  - <xref:int>
- description: OpenShift internal image registry.
  name: clusterImageRegistry
  types:
  - <xref:<xref:"ClusterImageRegistryProfile">>
- description: Status of the cluster resource.
  name: status
  types:
  - <xref:<xref:"ResourceStatus">>
- description: 'Cryptographic restrictions for kernel and userspace libraries. Known

    values are: "None" and "FIPS".'
  name: cryptoRestrictions
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CryptoRestrictions">]
