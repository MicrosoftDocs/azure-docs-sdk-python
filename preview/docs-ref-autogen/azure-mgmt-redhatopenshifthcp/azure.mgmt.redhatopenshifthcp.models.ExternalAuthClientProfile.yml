fullName: azure.mgmt.redhatopenshifthcp.models.ExternalAuthClientProfile
module: azure.mgmt.redhatopenshifthcp.models
summary: 'External Auth client profile This configures how on-cluster, platform clients
  should request

  tokens from the identity provider.'
constructor:
