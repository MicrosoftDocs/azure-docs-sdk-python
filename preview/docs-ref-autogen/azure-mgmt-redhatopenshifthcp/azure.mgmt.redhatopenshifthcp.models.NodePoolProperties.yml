  name: taints
  summary: Taints for the nodes.
  signature: 'taints: list[''_models.Taint''] | None'
- uid: azure.mgmt.redhatopenshifthcp.models.NodePoolProperties.version
  name: version
  summary: OpenShift version for the nodepool.
  signature: 'version: _models.NodePoolVersionProfile | None'
