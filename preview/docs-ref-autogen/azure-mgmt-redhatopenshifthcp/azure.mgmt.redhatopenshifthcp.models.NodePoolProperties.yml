name: NodePoolProperties
fullName: azure.mgmt.redhatopenshifthcp.models.NodePoolProperties
module: azure.mgmt.redhatopenshifthcp.models
summary: Represents the node pool properties.
constructor:
  syntax: 'NodePoolProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'Provisioning state. Known values are: "Succeeded", "Failed",

    "Canceled", "Accepted", "Deleting", "Provisioning", and "Updating".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.redhatopenshifthcp.models.ProvisioningState>
- description: OpenShift version for the nodepool.
  name: version
  types:
  - <xref:azure.mgmt.redhatopenshifthcp.models.NodePoolVersionProfile>
- description: Azure node pool platform configuration. Required.
  name: platform
  types:
  - <xref:azure.mgmt.redhatopenshifthcp.models.NodePoolPlatformProfile>
- description: "The number of worker nodes, it cannot be used together with autoscaling.\n\
    Validation:\n\n* Minimum: 0 \n\n* Maximum: 200 (only when availabilityZone is\
    \ not specified) \n\n* No maximum when availabilityZone is specified."
  name: replicas
  types:
  - <xref:int>
- description: Auto-repair.
  name: auto_repair
  types:
  - <xref:bool>
- description: Representation of a autoscaling in a node pool.
  name: auto_scaling
  types:
  - <xref:azure.mgmt.redhatopenshifthcp.models.NodePoolAutoScaling>
- description: 'Kubernetes labels to propagate to the NodePool Nodes Note that when
    the labels

    are updated this is only applied to newly create nodes in the Nodepool, existing
    node labels

    remain unchanged.'
  name: labels
  types:
  - <xref:list>[<xref:azure.mgmt.redhatopenshifthcp.models.Label>]
- description: Taints for the nodes.
  name: taints
  types:
  - <xref:list>[<xref:azure.mgmt.redhatopenshifthcp.models.Taint>]
- description: 'nodeDrainTimeoutMinutes is the grace period for how long Pod

    Disruption Budget-protected workloads will be

    respected during any node draining operation. After this grace period, any workloads
    protected

    by Pod Disruption

    Budgets that have not been successfully drained from a node will be forcibly evicted.
    This is

    especially relevant to cluster upgrades.


    Valid values are from 0 to 10080 minutes (1 week) .

    0 means that the NodePool can be drained without any time limitation.


    If unset the cluster nodeDrainTimeoutMinutes value is used as a default.'
  name: node_drain_timeout_minutes
  types:
  - <xref:int>
- description: Status of the node pool resource.
  name: status
  types:
  - <xref:azure.mgmt.redhatopenshifthcp.models.ResourceStatus>
