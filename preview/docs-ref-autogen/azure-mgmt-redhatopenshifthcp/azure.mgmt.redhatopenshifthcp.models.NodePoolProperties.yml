  signature: 'provisioning_state: str | _models.ProvisioningState | None'
- uid: azure.mgmt.redhatopenshifthcp.models.NodePoolProperties.replicas
  name: replicas
  summary: "The number of worker nodes, it cannot be used together with autoscaling.\
    \ Validation:\n\n* Minimum: 0 \n\n* Maximum: 200 (only when availabilityZone is\
    \ not specified) \n\n* No maximum when availabilityZone is specified. "
  signature: 'replicas: int | None'
- uid: azure.mgmt.redhatopenshifthcp.models.NodePoolProperties.status
  name: status
  summary: Status of the node pool resource.
  signature: 'status: _models.ResourceStatus | None'
