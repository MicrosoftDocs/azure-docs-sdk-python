  name: auto_repair
  summary: Auto-repair.
  signature: 'auto_repair: bool | None'
- uid: azure.mgmt.redhatopenshifthcp.models.NodePoolProperties.auto_scaling
  name: auto_scaling
  summary: Representation of a autoscaling in a node pool.
  signature: 'auto_scaling: _models.NodePoolAutoScaling | None'
- uid: azure.mgmt.redhatopenshifthcp.models.NodePoolProperties.labels
  name: labels
  summary: 'Kubernetes labels to propagate to the NodePool Nodes Note that when the
    labels are updated this

    is only applied to newly create nodes in the Nodepool, existing node labels remain
    unchanged.'
  signature: 'labels: list[''_models.Label''] | None'
- uid: azure.mgmt.redhatopenshifthcp.models.NodePoolProperties.node_drain_timeout_minutes
  name: node_drain_timeout_minutes
  summary: 'nodeDrainTimeoutMinutes is the grace period for how long Pod Disruption
    Budget-protected

    workloads will be

    respected during any node draining operation. After this grace period, any workloads
    protected

    by Pod Disruption

    Budgets that have not been successfully drained from a node will be forcibly evicted.
    This is

    especially relevant to cluster upgrades.


    Valid values are from 0 to 10080 minutes (1 week) .

    0 means that the NodePool can be drained without any time limitation.


    If unset the cluster nodeDrainTimeoutMinutes value is used as a default.'
  signature: 'node_drain_timeout_minutes: int | None'
