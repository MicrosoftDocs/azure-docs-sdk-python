constructor:
  syntax: ClusterImageRegistryProfile()
variables:
- description: 'state indicates the desired ImageStream-backed cluster image registry
    installation

    mode. This can only be set during cluster creation and cannot be changed after
    cluster

    creation. Enabled means the ImageStream-backed image registry will be run as pods
    on worker

    nodes in the cluster. Disabled means the ImageStream-backed image registry will
    not be present

    in the cluster. The default is Enabled. Known values are: "Enabled" and "Disabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterImageRegistryState">]
