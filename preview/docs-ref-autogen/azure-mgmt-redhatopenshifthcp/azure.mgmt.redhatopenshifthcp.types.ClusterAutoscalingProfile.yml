### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshifthcp.types.ClusterAutoscalingProfile
name: ClusterAutoscalingProfile
fullName: azure.mgmt.redhatopenshifthcp.types.ClusterAutoscalingProfile
module: azure.mgmt.redhatopenshifthcp.types
summary: 'ClusterAutoscaling specifies auto-scaling behavior that applies to all NodePools
  associated

  with a control plane.'
constructor:
  syntax: ClusterAutoscalingProfile()
variables:
- description: 'maxNodesTotal is the maximum allowable number of nodes for the Autoscaler

    scale out to be operational. The autoscaler will not grow the cluster beyond this
    number. If

    omitted, the autoscaler will not have a maximum limit.'
  name: maxNodesTotal
  types:
  - <xref:int>
- description: 'maxPodGracePeriod is the maximum seconds to wait for graceful

    pod termination before scaling down a NodePool. The default is 600 seconds.'
  name: maxPodGracePeriodSeconds
  types:
  - <xref:int>
- description: 'maxNodeProvisionTimeSeconds is the maximum time to wait for

    node provisioning before considering the provisioning to be unsuccessful. The
    default is 900

    seconds, or 15 minutes.'
  name: maxNodeProvisionTimeSeconds
  types:
  - <xref:int>
- description: 'podPriorityThreshold enables users to schedule "best-effort" pods,

    which shouldn''t trigger autoscaler actions, but only run when there are spare
    resources

    available. The default is -10. See the following for more details:

    [https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/FAQ.md#how-does-cluster-autoscaler-work-with-pod-priority-and-preemption](https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/FAQ.md#how-does-cluster-autoscaler-work-with-pod-priority-and-preemption).'
  name: podPriorityThreshold
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.redhatopenshifthcp.types.ClusterAutoscalingProfile.maxNodeProvisionTimeSeconds
  name: maxNodeProvisionTimeSeconds
  summary: 'maxNodeProvisionTimeSeconds is the maximum time to wait for node provisioning
    before

    considering the provisioning to be unsuccessful. The default is 900 seconds, or
    15 minutes.'
  signature: 'maxNodeProvisionTimeSeconds: int'
- uid: azure.mgmt.redhatopenshifthcp.types.ClusterAutoscalingProfile.maxNodesTotal
  name: maxNodesTotal
  summary: 'maxNodesTotal is the maximum allowable number of nodes for the Autoscaler
    scale out to be

    operational. The autoscaler will not grow the cluster beyond this number. If omitted,
    the

    autoscaler will not have a maximum limit.'
  signature: 'maxNodesTotal: int'
- uid: azure.mgmt.redhatopenshifthcp.types.ClusterAutoscalingProfile.maxPodGracePeriodSeconds
  name: maxPodGracePeriodSeconds
  summary: 'maxPodGracePeriod is the maximum seconds to wait for graceful pod termination
    before scaling

    down a NodePool. The default is 600 seconds.'
  signature: 'maxPodGracePeriodSeconds: int'
- uid: azure.mgmt.redhatopenshifthcp.types.ClusterAutoscalingProfile.podPriorityThreshold
  name: podPriorityThreshold
  summary: 'podPriorityThreshold enables users to schedule "best-effort" pods, which
    shouldn''t trigger

    autoscaler actions, but only run when there are spare resources available. The
    default is -10.

    See the following for more details:

    [https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/FAQ.md#how-does-cluster-autoscaler-work-with-pod-priority-and-preemption](https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/FAQ.md#how-does-cluster-autoscaler-work-with-pod-priority-and-preemption).'
  signature: 'podPriorityThreshold: int'
