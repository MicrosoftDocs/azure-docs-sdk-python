variables:
- description: 'Maximum accumulated inbound message bytes allowed for the same

    JWT signature within a time window. Clients with the same JWT signature will get
    disconnected

    if the message bytes exceeds this value. Default value is 1GB.'
  name: max_inbound_message_bytes
  types:
  - <xref:int>
