constructor:
  syntax: 'GroupPresenceEventFilters(*args: Any, **kwargs: Any)'
variables:
- description: 'The concerning event names. Valid values are "joined", "left". If
    the value

    is null or empty, no presence events will be sent to the event handler. Required.'
  name: event_names
  types:
  - <xref:list>[<xref:str>
  - <xref:azure.mgmt.webpubsub.models.GroupPresenceEventName>]
- description: 'The group filters. Only events from these groups will be sent to the
    event

    handler. Each element is a pattern that may match multiple groups. If null or
    empty, events

    from all groups will be sent (subject to eventNames).'
  name: group_filters
  types:
  - <xref:list>[<xref:str>]
