    value is null or

    empty, no presence events will be sent to the event handler. Required.'
  signature: 'event_names: list[typing.Union[str, ForwardRef(''_models.GroupPresenceEventName'')]]'
- uid: azure.mgmt.webpubsub.models.GroupPresenceEventFilters.group_filters
  name: group_filters
  summary: 'The group filters. Only events from these groups will be sent to the event
    handler. Each

