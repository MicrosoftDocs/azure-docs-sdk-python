### YamlMime:PythonClass
uid: azure.mgmt.webpubsub.types.CustomCertificateProperties
name: CustomCertificateProperties
fullName: azure.mgmt.webpubsub.types.CustomCertificateProperties
module: azure.mgmt.webpubsub.types
summary: Custom certificate properties.
constructor:
  syntax: CustomCertificateProperties()
variables:
- description: 'Provisioning state of the resource. Known values are: "Unknown",

    "Succeeded", "Failed", "Canceled", "Running", "Creating", "Updating", "Deleting",
    and "Moving".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: Base uri of the KeyVault that stores certificate. Required.
  name: key_vault_base_uri
  types:
  - <xref:str>
- description: Certificate secret name. Required.
  name: key_vault_secret_name
  types:
  - <xref:str>
- description: Certificate secret version.
  name: key_vault_secret_version
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.webpubsub.types.CustomCertificateProperties.keyVaultBaseUri
  name: keyVaultBaseUri
  summary: Base uri of the KeyVault that stores certificate. Required.
  signature: 'keyVaultBaseUri: Required[str]'
- uid: azure.mgmt.webpubsub.types.CustomCertificateProperties.keyVaultSecretName
  name: keyVaultSecretName
  summary: Certificate secret name. Required.
  signature: 'keyVaultSecretName: Required[str]'
- uid: azure.mgmt.webpubsub.types.CustomCertificateProperties.keyVaultSecretVersion
  name: keyVaultSecretVersion
  summary: Certificate secret version.
  signature: 'keyVaultSecretVersion: str'
- uid: azure.mgmt.webpubsub.types.CustomCertificateProperties.provisioningState
  name: provisioningState
  summary: '"Unknown", "Succeeded", "Failed",

    "Canceled", "Running", "Creating", "Updating", "Deleting", and "Moving".'
  signature: 'provisioningState: str | ProvisioningState'
