### YamlMime:PythonClass
uid: azure.mgmt.webpubsub.types.EventNameFilter
name: EventNameFilter
fullName: azure.mgmt.webpubsub.types.EventNameFilter
module: azure.mgmt.webpubsub.types
summary: Filter events by their name.
constructor:
  syntax: EventNameFilter()
variables:
- description: 'Gets or sets a list of system events. Supported events: "connected"
    and

    "disconnected". Blocking event "connect" is not supported because it requires
    a response.'
  name: system_events
  types:
  - <xref:list>[<xref:str>]
- description: "Gets or sets a matching pattern for event names.\nThere are 3 kinds\
    \ of patterns supported:\n\n1. \"*\", it matches any event name \n\n2. Combine\
    \ multiple events with \",\", for example \"event1,event2\", it matches events\
    \ \"event1\"\nand \"event2\"\n3. A single event name, for example, \"event1\"\
    , it matches \"event1\"."
  name: user_event_pattern
  types:
  - <xref:str>
- description: Required. EVENT_NAME.
  name: type
  types:
  - <xref:typing.Literal>[EventListenerFilterDiscriminator.EVENT_NAME]
attributes:
- uid: azure.mgmt.webpubsub.types.EventNameFilter.systemEvents
  name: systemEvents
  summary: '"connected" and "disconnected".

    Blocking event "connect" is not supported because it requires a response.'
  signature: 'systemEvents: list[str]'
- uid: azure.mgmt.webpubsub.types.EventNameFilter.type
  name: type
  summary: Required. EVENT_NAME.
  signature: 'type: EVENT_NAME: ''EventName''>]'
- uid: azure.mgmt.webpubsub.types.EventNameFilter.userEventPattern
  name: userEventPattern
  summary: "Gets or sets a matching pattern for event names.\nThere are 3 kinds of\
    \ patterns supported:\n\n1. \"*\", it matches any event name \n\n2. Combine multiple\
    \ events with \",\", for example \"event1,event2\", it matches events\n\"event1\"\
    \ and \"event2\"\n3. A single event name, for example, \"event1\", it matches\
    \ \"event1\"."
  signature: 'userEventPattern: str'
