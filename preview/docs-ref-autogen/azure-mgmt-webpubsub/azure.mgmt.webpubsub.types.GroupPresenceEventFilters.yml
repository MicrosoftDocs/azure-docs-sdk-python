### YamlMime:PythonClass
uid: azure.mgmt.webpubsub.types.GroupPresenceEventFilters
name: GroupPresenceEventFilters
fullName: azure.mgmt.webpubsub.types.GroupPresenceEventFilters
module: azure.mgmt.webpubsub.types
summary: Represents presence event filters for event handler configuration.
constructor:
  syntax: GroupPresenceEventFilters()
variables:
- description: 'The concerning event names. Valid values are "joined", "left". If
    the value

    is null or empty, no presence events will be sent to the event handler. Required.'
  name: event_names
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"GroupPresenceEventName">]]
- description: 'The group filters. Only events from these groups will be sent to the
    event

    handler. Each element is a pattern that may match multiple groups. If null or
    empty, events

    from all groups will be sent (subject to eventNames).'
  name: group_filters
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.webpubsub.types.GroupPresenceEventFilters.eventNames
  name: eventNames
  summary: 'The concerning event names. Valid values are "joined", "left". If the
    value is null or

    empty, no presence events will be sent to the event handler. Required.'
  signature: 'eventNames: Union[str, ForwardRef(''GroupPresenceEventName'')]]]'
- uid: azure.mgmt.webpubsub.types.GroupPresenceEventFilters.groupFilters
  name: groupFilters
  summary: 'The group filters. Only events from these groups will be sent to the event
    handler. Each

    element is a pattern that may match multiple groups. If null or empty, events
    from all groups

    will be sent (subject to eventNames).'
  signature: 'groupFilters: list[str]'
