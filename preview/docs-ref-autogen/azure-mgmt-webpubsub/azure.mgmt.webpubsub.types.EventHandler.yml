### YamlMime:PythonClass
uid: azure.mgmt.webpubsub.types.EventHandler
name: EventHandler
fullName: azure.mgmt.webpubsub.types.EventHandler
module: azure.mgmt.webpubsub.types
summary: Properties of event handler.
constructor:
  syntax: EventHandler()
variables:
- description: 'Gets or sets the URL template for the event handler. The actual URL
    is

    calculated when the corresponding event is triggered. The template supports predefined

    parameters syntax: `{event}`, `{hub}`, and KeyVault reference syntax

    `{@Microsoft.KeyVault(SecretUri=_your_secret_identifier_)}` For example, if the
    template is

    `http://example.com/api/{event}`, when `connect` event is triggered, a POST request
    will be

    sent to the URL `http://example.com/chat/api/connect`. Note: Parameters are not
    allowed in

    the hostname of the URL, and curly brackets `{}` are reserved for parameter syntax
    only. If

    your URL path contains literal curly brackets, please URL-encode them to ensure
    proper

    handling. Required.'
  name: url_template
  types:
  - <xref:str>
- description: "Gets or sets the matching pattern for event names.\nThere are 3 kinds\
    \ of patterns supported:\n\n1. \"*\", it matches any event name \n\n2. Combine\
    \ multiple events with \",\", for example \"event1,event2\", it matches event\
    \ \"event1\" and\n\"event2\"\n3. A single event name, for example, \"event1\"\
    , it matches \"event1\"."
  name: user_event_pattern
  types:
  - <xref:str>
- description: Gets or sets the list of system events.
  name: system_events
  types:
  - <xref:list>[<xref:str>]
- description: Upstream auth settings. If not set, no auth is used for upstream messages.
  name: auth
  types:
  - <xref:<xref:"UpstreamAuthSettings">>
- description: 'The group presence events that this event handler is concerned

    with. Group presence events are triggered when connections join or leave groups
    in the hub. If

    the value is null, no presence events will be sent to this event handler.'
  name: group_presence_events
  types:
  - <xref:<xref:"GroupPresenceEventFilters">>
attributes:
