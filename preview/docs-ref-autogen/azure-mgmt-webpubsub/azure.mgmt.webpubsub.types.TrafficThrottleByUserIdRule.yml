### YamlMime:PythonClass
uid: azure.mgmt.webpubsub.types.TrafficThrottleByUserIdRule
name: TrafficThrottleByUserIdRule
fullName: azure.mgmt.webpubsub.types.TrafficThrottleByUserIdRule
module: azure.mgmt.webpubsub.types
summary: Throttle the client traffic by the user ID.
constructor:
  syntax: TrafficThrottleByUserIdRule()
variables:
- description: 'Maximum accumulated inbound message bytes allowed for the same

    user ID within a time window. Clients with the same user ID will get disconnected
    if the

    message bytes exceeds this value. Default value is 1GB.'
  name: max_inbound_message_bytes
  types:
  - <xref:int>
- description: 'The aggregation window for the message bytes. The message

    bytes will be aggregated in this window and be reset after the window. Default
    value is 60

    seconds.'
  name: aggregation_window_in_seconds
  types:
  - <xref:int>
- description: Required. TRAFFIC_THROTTLE_BY_USER_ID_RULE.
  name: type
  types:
  - <xref:typing.Literal>[ClientTrafficControlRuleDiscriminator.TRAFFIC_THROTTLE_BY_USER_ID_RULE]
attributes:
- uid: azure.mgmt.webpubsub.types.TrafficThrottleByUserIdRule.aggregationWindowInSeconds
  name: aggregationWindowInSeconds
  summary: 'The aggregation window for the message bytes. The message bytes will be
    aggregated in this

    window and be reset after the window. Default value is 60 seconds.'
  signature: 'aggregationWindowInSeconds: int'
- uid: azure.mgmt.webpubsub.types.TrafficThrottleByUserIdRule.maxInboundMessageBytes
  name: maxInboundMessageBytes
  summary: 'Maximum accumulated inbound message bytes allowed for the same user ID
    within a time window.

    Clients with the same user ID will get disconnected if the message bytes exceeds
    this value.

    Default value is 1GB.'
  signature: 'maxInboundMessageBytes: int'
- uid: azure.mgmt.webpubsub.types.TrafficThrottleByUserIdRule.type
  name: type
  summary: Required. TRAFFIC_THROTTLE_BY_USER_ID_RULE.
  signature: 'type: TRAFFIC_THROTTLE_BY_USER_ID_RULE: ''TrafficThrottleByUserIdRule''>]'
