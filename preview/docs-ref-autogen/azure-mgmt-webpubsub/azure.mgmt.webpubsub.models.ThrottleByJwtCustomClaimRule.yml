### YamlMime:PythonClass
uid: azure.mgmt.webpubsub.models.ThrottleByJwtCustomClaimRule
name: ThrottleByJwtCustomClaimRule
fullName: azure.mgmt.webpubsub.models.ThrottleByJwtCustomClaimRule
module: azure.mgmt.webpubsub.models
summary: Throttle the client connection by a custom JWT claim.
constructor:
  syntax: 'ThrottleByJwtCustomClaimRule(*args: Any, **kwargs: Any)'
variables:
- description: 'The name of the claim in the JWT token. The client connection with
    the same

    claim value will be aggregated. If the claim is not found in the token, the connection
    will be

    allowed. Required.'
  name: claim_name
  types:
  - <xref:str>
- description: 'Maximum connection count allowed for the same Jwt claim value. Clients
    with

    the same Jwt claim will get rejected if the connection count exceeds this value.
    Default value

    is 20.'
  name: max_count
  types:
  - <xref:int>
- description: Required. THROTTLE_BY_JWT_CUSTOM_CLAIM_RULE.
  name: type
  types:
  - <xref:str>
  - <xref:azure.mgmt.webpubsub.models.THROTTLE_BY_JWT_CUSTOM_CLAIM_RULE>
attributes:
- uid: azure.mgmt.webpubsub.models.ThrottleByJwtCustomClaimRule.claim_name
  name: claim_name
  summary: 'The name of the claim in the JWT token. The client connection with the
    same claim value will be

    aggregated. If the claim is not found in the token, the connection will be allowed.
    Required.'
  signature: 'claim_name: str'
- uid: azure.mgmt.webpubsub.models.ThrottleByJwtCustomClaimRule.max_count
  name: max_count
  summary: 'Maximum connection count allowed for the same Jwt claim value. Clients
    with the same Jwt claim

    will get rejected if the connection count exceeds this value. Default value is
    20.'
  signature: 'max_count: int | None'
- uid: azure.mgmt.webpubsub.models.ThrottleByJwtCustomClaimRule.type
  name: type
  summary: Required. THROTTLE_BY_JWT_CUSTOM_CLAIM_RULE.
  signature: 'type: THROTTLE_BY_JWT_CUSTOM_CLAIM_RULE: ''ThrottleByJwtCustomClaimRule''>]'
