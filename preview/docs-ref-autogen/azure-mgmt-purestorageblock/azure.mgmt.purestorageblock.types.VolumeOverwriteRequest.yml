### YamlMime:PythonClass
uid: azure.mgmt.purestorageblock.types.VolumeOverwriteRequest
name: VolumeOverwriteRequest
fullName: azure.mgmt.purestorageblock.types.VolumeOverwriteRequest
module: azure.mgmt.purestorageblock.types
summary: Request to overwrite a volume's content from another volume or a snapshot.
constructor:
  syntax: VolumeOverwriteRequest()
variables:
- description: 'Source type for the overwrite operation. Required. Known values are:
    "none",

    "volume", "serialNumber", "snapshot", and "recoverableVolume".'
  name: source_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VolumeSourceType">]
- description: 'Azure resource ID of the source volume group. Required

    when sourceType is ''snapshot'' or when the source volume belongs to a different
    volume group

    than the target.'
  name: source_volume_group_resource_id
  types:
  - <xref:str>
- description: 'Source volume group snapshot and volume snapshot name to restore

    from. Used when sourceType is ''snapshot''.'
  name: source_volume_snapshot
  types:
  - <xref:<xref:"VolumeSnapshotSource">>
- description: 'Serial number of the source volume to overwrite from. Used when

    sourceType is ''serialNumber''.'
  name: source_serial_number
  types:
  - <xref:str>
- description: 'Azure resource ID of the source volume to clone from. Used

    when sourceType is ''volume''.'
  name: source_volume_resource_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.purestorageblock.types.VolumeOverwriteRequest.sourceSerialNumber
  name: sourceSerialNumber
  summary: Serial number of the source volume to overwrite from. Used when sourceType
    is 'serialNumber'.
  signature: 'sourceSerialNumber: str'
- uid: azure.mgmt.purestorageblock.types.VolumeOverwriteRequest.sourceType
  name: sourceType
  summary: '"none", "volume",

    "serialNumber", "snapshot", and "recoverableVolume".'
  signature: 'sourceType: Required[str | VolumeSourceType]'
- uid: azure.mgmt.purestorageblock.types.VolumeOverwriteRequest.sourceVolumeGroupResourceId
  name: sourceVolumeGroupResourceId
  summary: 'Azure resource ID of the source volume group. Required when sourceType
    is ''snapshot'' or when

    the source volume belongs to a different volume group than the target.'
  signature: 'sourceVolumeGroupResourceId: str'
- uid: azure.mgmt.purestorageblock.types.VolumeOverwriteRequest.sourceVolumeResourceId
  name: sourceVolumeResourceId
  summary: Azure resource ID of the source volume to clone from. Used when sourceType
    is 'volume'.
  signature: 'sourceVolumeResourceId: str'
- uid: azure.mgmt.purestorageblock.types.VolumeOverwriteRequest.sourceVolumeSnapshot
  name: sourceVolumeSnapshot
  summary: 'Source volume group snapshot and volume snapshot name to restore from.
    Used when sourceType is

    ''snapshot''.'
  signature: 'sourceVolumeSnapshot: VolumeSnapshotSource'
