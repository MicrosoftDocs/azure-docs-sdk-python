### YamlMime:PythonClass
uid: azure.mgmt.purestorageblock.types.SshPlatformConsoleAuthConfig
name: SshPlatformConsoleAuthConfig
fullName: azure.mgmt.purestorageblock.types.SshPlatformConsoleAuthConfig
module: azure.mgmt.purestorageblock.types
summary: SSH-based platform console authentication configuration.
constructor:
  syntax: SshPlatformConsoleAuthConfig()
variables:
- description: Required. SSH public key authentication.
  name: auth_type
  types:
  - <xref:typing.Literal>[PlatformConsoleAuthType.SSH]
- description: Username to associate with the SSH public key. Required.
  name: username
  types:
  - <xref:str>
- description: SSH public key in OpenSSH authorized_keys format. Required.
  name: public_key
  types:
  - <xref:str>
- description: 'Role to assign to the user on the platform console. Required. Known
    values are:

    "array_admin", "storage_admin", and "read_only".'
  name: role
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PlatformConsoleRole">]
attributes:
- uid: azure.mgmt.purestorageblock.types.SshPlatformConsoleAuthConfig.authType
  name: authType
  summary: Required. SSH public key authentication.
  signature: 'authType: SSH: ''ssh''>]]'
- uid: azure.mgmt.purestorageblock.types.SshPlatformConsoleAuthConfig.publicKey
  name: publicKey
  summary: SSH public key in OpenSSH authorized_keys format. Required.
  signature: 'publicKey: Required[str]'
- uid: azure.mgmt.purestorageblock.types.SshPlatformConsoleAuthConfig.role
  name: role
  summary: 'Role to assign to the user on the platform console. Required. Known values
    are:

    "array_admin", "storage_admin", and "read_only".'
  signature: 'role: Required[str | PlatformConsoleRole]'
- uid: azure.mgmt.purestorageblock.types.SshPlatformConsoleAuthConfig.username
  name: username
  summary: Username to associate with the SSH public key. Required.
  signature: 'username: Required[str]'
