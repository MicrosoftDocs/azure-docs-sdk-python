### YamlMime:PythonClass
uid: azure.mgmt.purestorageblock.types.VolumeGroupProperties
name: VolumeGroupProperties
fullName: azure.mgmt.purestorageblock.types.VolumeGroupProperties
module: azure.mgmt.purestorageblock.types
summary: Properties of a volume group.
constructor:
  syntax: VolumeGroupProperties()
variables:
- description: Pure Storage's internal ID of the storage pool.
  name: storage_pool_internal_id
  types:
  - <xref:str>
- description: Pure Storage's internal ID of the volume group.
  name: volume_group_internal_id
  types:
  - <xref:str>
- description: 'Azure resource ID of the source volume group for

    cloning.'
  name: source_volume_group_resource_id
  types:
  - <xref:str>
- description: 'Indicates the source type for volume group creation. Known values
    are:

    "none", "volumeGroup", "snapshot", and "recoverableVolumeGroup".'
  name: source_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VolumeGroupSourceType">]
- description: 'Azure resource ID of the volume group snapshot to restore

    from.'
  name: source_snapshot_resource_id
  types:
  - <xref:str>
- description: 'Azure resource ID of the soft-deleted volume

    group to recover.'
  name: source_recoverable_volume_group_resource_id
  types:
  - <xref:str>
- description: Performance parameters for the volume group.
  name: performance_parameters
  types:
  - <xref:<xref:"PerformanceParameters">>
- description: Protection parameters for the volume group.
  name: protection_parameters
  types:
  - <xref:<xref:"ProtectionParameters">>
- description: 'Provisioning state of the resource. Known values are: "Succeeded",

    "Failed", "Canceled", "Deleting", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.purestorageblock.types.VolumeGroupProperties.performanceParameters
  name: performanceParameters
  summary: Performance parameters for the volume group.
  signature: 'performanceParameters: PerformanceParameters'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupProperties.protectionParameters
  name: protectionParameters
  summary: Protection parameters for the volume group.
  signature: 'protectionParameters: ProtectionParameters'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Deleting", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupProperties.sourceRecoverableVolumeGroupResourceId
  name: sourceRecoverableVolumeGroupResourceId
  summary: Azure resource ID of the soft-deleted volume group to recover.
  signature: 'sourceRecoverableVolumeGroupResourceId: str'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupProperties.sourceSnapshotResourceId
  name: sourceSnapshotResourceId
  summary: Azure resource ID of the volume group snapshot to restore from.
  signature: 'sourceSnapshotResourceId: str'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupProperties.sourceType
  name: sourceType
  summary: '"none",

    "volumeGroup", "snapshot", and "recoverableVolumeGroup".'
  signature: 'sourceType: str | VolumeGroupSourceType'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupProperties.sourceVolumeGroupResourceId
  name: sourceVolumeGroupResourceId
  summary: Azure resource ID of the source volume group for cloning.
  signature: 'sourceVolumeGroupResourceId: str'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupProperties.storagePoolInternalId
  name: storagePoolInternalId
  summary: Pure Storage's internal ID of the storage pool.
  signature: 'storagePoolInternalId: str'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupProperties.volumeGroupInternalId
  name: volumeGroupInternalId
  summary: Pure Storage's internal ID of the volume group.
  signature: 'volumeGroupInternalId: str'
