### YamlMime:PythonClass
uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties
name: AzureVolumeProperties
fullName: azure.mgmt.purestorageblock.types.AzureVolumeProperties
module: azure.mgmt.purestorageblock.types
summary: Properties of an Azure volume.
constructor:
  syntax: AzureVolumeProperties()
variables:
- description: Storage space usage for the volume.
  name: space
  types:
  - <xref:<xref:"Space">>
- description: Currently provisioned size of the volume, in bytes.
  name: provisioned_size
  types:
  - <xref:int>
- description: Serial number of the volume.
  name: serial_number
  types:
  - <xref:str>
- description: Volume creation date, as an RFC 3339 timestamp.
  name: created_at
  types:
  - <xref:str>
- description: Azure resource ID of the source volume for cloning.
  name: source_volume_resource_id
  types:
  - <xref:str>
- description: 'Azure Resource ID of the source volume group to clone

    from.'
  name: source_volume_group_resource_id
  types:
  - <xref:str>
- description: 'Indicates the source type for volume creation. Known values are: "none",

    "volume", "serialNumber", "snapshot", and "recoverableVolume".'
  name: source_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VolumeSourceType">]
- description: 'Source volume group snapshot and volume snapshot name to restore

    from.'
  name: source_volume_snapshot
  types:
  - <xref:<xref:"VolumeSnapshotSource">>
- description: Serial number of the source volume to import.
  name: source_serial_number
  types:
  - <xref:str>
- description: 'Azure resource ID of the soft-deleted volume to

    recover within the same volume group.'
  name: source_recoverable_volume_resource_id
  types:
  - <xref:str>
- description: Soft-deletion state of the volume.
  name: soft_deletion
  types:
  - <xref:<xref:"DestroyedStateProperties">>
- description: 'Provisioning state of the resource. Known values are: "Succeeded",

    "Failed", "Canceled", "Deleting", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties.createdAt
  name: createdAt
  summary: Volume creation date, as an RFC 3339 timestamp.
  signature: 'createdAt: str'
- uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties.provisionedSize
  name: provisionedSize
  summary: Currently provisioned size of the volume, in bytes.
  signature: 'provisionedSize: int'
- uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Deleting", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties.serialNumber
  name: serialNumber
  summary: Serial number of the volume.
  signature: 'serialNumber: str'
- uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties.softDeletion
  name: softDeletion
  summary: Soft-deletion state of the volume.
  signature: 'softDeletion: DestroyedStateProperties'
- uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties.sourceRecoverableVolumeResourceId
  name: sourceRecoverableVolumeResourceId
  summary: Azure resource ID of the soft-deleted volume to recover within the same
    volume group.
  signature: 'sourceRecoverableVolumeResourceId: str'
- uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties.sourceSerialNumber
  name: sourceSerialNumber
  summary: Serial number of the source volume to import.
  signature: 'sourceSerialNumber: str'
- uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties.sourceType
  name: sourceType
  summary: '"none", "volume",

    "serialNumber", "snapshot", and "recoverableVolume".'
  signature: 'sourceType: str | VolumeSourceType'
- uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties.sourceVolumeGroupResourceId
  name: sourceVolumeGroupResourceId
  summary: Azure Resource ID of the source volume group to clone from.
  signature: 'sourceVolumeGroupResourceId: str'
- uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties.sourceVolumeResourceId
  name: sourceVolumeResourceId
  summary: Azure resource ID of the source volume for cloning.
  signature: 'sourceVolumeResourceId: str'
- uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties.sourceVolumeSnapshot
  name: sourceVolumeSnapshot
  summary: Source volume group snapshot and volume snapshot name to restore from.
  signature: 'sourceVolumeSnapshot: VolumeSnapshotSource'
- uid: azure.mgmt.purestorageblock.types.AzureVolumeProperties.space
  name: space
  summary: Storage space usage for the volume.
  signature: 'space: Space'
