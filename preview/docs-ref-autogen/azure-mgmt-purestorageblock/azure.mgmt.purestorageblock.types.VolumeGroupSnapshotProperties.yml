### YamlMime:PythonClass
uid: azure.mgmt.purestorageblock.types.VolumeGroupSnapshotProperties
name: VolumeGroupSnapshotProperties
fullName: azure.mgmt.purestorageblock.types.VolumeGroupSnapshotProperties
module: azure.mgmt.purestorageblock.types
summary: Properties of a volume group snapshot.
constructor:
  syntax: VolumeGroupSnapshotProperties()
variables:
- description: 'Azure resource ID of the source snapshot to recover from;

    omit for a new manual snapshot.'
  name: source_snapshot_resource_id
  types:
  - <xref:str>
- description: Date and time at which the snapshot was created, as an RFC 3339 timestamp.
  name: created_at
  types:
  - <xref:str>
- description: Whether the snapshot was created by a protection policy.
  name: created_by_policy
  types:
  - <xref:bool>
- description: Soft-deletion state of the snapshot.
  name: soft_deletion
  types:
  - <xref:<xref:"DestroyedStateProperties">>
- description: Storage space usage of the snapshot.
  name: space
  types:
  - <xref:<xref:"Space">>
- description: 'List of individual volume snapshots included in this volume group

    snapshot; populated on single-get, empty or omitted on list for performance.'
  name: volume_snapshots
  types:
  - <xref:list>[<xref:"VolumeSnapshotInfo">]
- description: 'Provisioning state of the resource. Known values are: "Succeeded",

    "Failed", "Canceled", "Deleting", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.purestorageblock.types.VolumeGroupSnapshotProperties.createdAt
  name: createdAt
  summary: Date and time at which the snapshot was created, as an RFC 3339 timestamp.
  signature: 'createdAt: str'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupSnapshotProperties.createdByPolicy
  name: createdByPolicy
  summary: Whether the snapshot was created by a protection policy.
  signature: 'createdByPolicy: bool'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupSnapshotProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Deleting", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupSnapshotProperties.softDeletion
  name: softDeletion
  summary: Soft-deletion state of the snapshot.
  signature: 'softDeletion: DestroyedStateProperties'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupSnapshotProperties.sourceSnapshotResourceId
  name: sourceSnapshotResourceId
  summary: Azure resource ID of the source snapshot to recover from; omit for a new
    manual snapshot.
  signature: 'sourceSnapshotResourceId: str'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupSnapshotProperties.space
  name: space
  summary: Storage space usage of the snapshot.
  signature: 'space: Space'
- uid: azure.mgmt.purestorageblock.types.VolumeGroupSnapshotProperties.volumeSnapshots
  name: volumeSnapshots
  summary: 'List of individual volume snapshots included in this volume group snapshot;
