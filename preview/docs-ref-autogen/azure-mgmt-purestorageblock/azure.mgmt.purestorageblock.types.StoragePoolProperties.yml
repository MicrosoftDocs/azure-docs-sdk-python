### YamlMime:PythonClass
uid: azure.mgmt.purestorageblock.types.StoragePoolProperties
name: StoragePoolProperties
fullName: azure.mgmt.purestorageblock.types.StoragePoolProperties
module: azure.mgmt.purestorageblock.types
summary: Properties of a storage pool.
constructor:
  syntax: StoragePoolProperties()
variables:
- description: Pure Storage's internal ID of the storage pool.
  name: storage_pool_internal_id
  types:
  - <xref:str>
- description: Azure Availability Zone the Pool is located in. Required.
  name: availability_zone
  types:
  - <xref:str>
- description: Network properties of the storage pool. Required.
  name: vnet_injection
  types:
  - <xref:<xref:"VnetInjection">>
- description: 'How long a destroyed object is kept before being eradicated, in

    seconds.'
  name: data_retention_period
  types:
  - <xref:int>
- description: 'Total bandwidth provisioned for the pool, in MB/s.

    Required.'
  name: provisioned_bandwidth_mb_per_sec
  types:
  - <xref:int>
- description: Total I/O operations per second (IOPS) provisioned for the pool.
  name: provisioned_iops
  types:
  - <xref:int>
- description: AVS connection state summary.
  name: avs
  types:
  - <xref:<xref:"AzureVmwareService">>
- description: 'Provisioning state of the resource. Known values are: "Succeeded",

    "Failed", "Canceled", "Deleting", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Azure resource ID of the Pure Storage Cloud service (reservation

    resource) this storage pool belongs to. Required.'
  name: reservation_resource_id
  types:
  - <xref:str>
- description: Platform console access settings for the storage pool.
  name: platform_console_settings
  types:
  - <xref:<xref:"PlatformConsoleSettings">>
attributes:
- uid: azure.mgmt.purestorageblock.types.StoragePoolProperties.availabilityZone
  name: availabilityZone
  summary: Azure Availability Zone the Pool is located in. Required.
  signature: 'availabilityZone: Required[str]'
- uid: azure.mgmt.purestorageblock.types.StoragePoolProperties.avs
  name: avs
  summary: AVS connection state summary.
  signature: 'avs: AzureVmwareService'
- uid: azure.mgmt.purestorageblock.types.StoragePoolProperties.dataRetentionPeriod
  name: dataRetentionPeriod
  summary: How long a destroyed object is kept before being eradicated, in seconds.
  signature: 'dataRetentionPeriod: int'
- uid: azure.mgmt.purestorageblock.types.StoragePoolProperties.platformConsoleSettings
  name: platformConsoleSettings
  summary: Platform console access settings for the storage pool.
  signature: 'platformConsoleSettings: PlatformConsoleSettings'
- uid: azure.mgmt.purestorageblock.types.StoragePoolProperties.provisionedBandwidthMbPerSec
  name: provisionedBandwidthMbPerSec
  summary: Total bandwidth provisioned for the pool, in MB/s. Required.
  signature: 'provisionedBandwidthMbPerSec: Required[int]'
- uid: azure.mgmt.purestorageblock.types.StoragePoolProperties.provisionedIops
  name: provisionedIops
  summary: Total I/O operations per second (IOPS) provisioned for the pool.
  signature: 'provisionedIops: int'
- uid: azure.mgmt.purestorageblock.types.StoragePoolProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Deleting", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.purestorageblock.types.StoragePoolProperties.reservationResourceId
  name: reservationResourceId
  summary: 'Azure resource ID of the Pure Storage Cloud service (reservation resource)
    this storage pool

    belongs to. Required.'
  signature: 'reservationResourceId: Required[str]'
- uid: azure.mgmt.purestorageblock.types.StoragePoolProperties.storagePoolInternalId
  name: storagePoolInternalId
  summary: Pure Storage's internal ID of the storage pool.
  signature: 'storagePoolInternalId: str'
- uid: azure.mgmt.purestorageblock.types.StoragePoolProperties.vnetInjection
  name: vnetInjection
  summary: Network properties of the storage pool. Required.
  signature: 'vnetInjection: Required[VnetInjection]'
