uid: azure.mgmt.hardwaresecuritymodules.types.CloudHsmClusterProperties
name: CloudHsmClusterProperties
fullName: azure.mgmt.hardwaresecuritymodules.types.CloudHsmClusterProperties
module: azure.mgmt.hardwaresecuritymodules.types
summary: Properties of a Cloud HSM Cluster.
constructor:
  syntax: CloudHsmClusterProperties()
variables:
- description: 'State of security domain activation. Known values are: "NotDefined",

    "NotActivated", "Active", "Failed", and "Unknown".'
  name: activationState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActivationState">]
- description: 'The Cloud HSM Cluster''s auto-generated Domain Name

    Label Scope. Known values are: "TenantReuse", "SubscriptionReuse", "ResourceGroupReuse",
    and

    "NoReuse".'
  name: autoGeneratedDomainNameLabelScope
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoGeneratedDomainNameLabelScope">]
- description: An array of Cloud HSM Cluster's HSMs.
  name: hsms
  types:
  - <xref:list>[<xref:"CloudHsmProperties">]
- description: List of private endpoint connection resources.
  name: privateEndpointConnections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: 'The Cloud HSM Cluster''s provisioningState. Known values are:

    "Provisioning", "Succeeded", "Updating", "Failed", "Deleting", and "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The Cloud HSM Cluster public network access. "Disabled"
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: Cloud HSM Cluster status message.
  name: statusMessage
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.hardwaresecuritymodules.types.CloudHsmClusterProperties.activationState
  name: activationState
  summary: '"NotDefined", "NotActivated",

    "Active", "Failed", and "Unknown".'
  signature: 'activationState: str | ActivationState'
- uid: azure.mgmt.hardwaresecuritymodules.types.CloudHsmClusterProperties.autoGeneratedDomainNameLabelScope
  name: autoGeneratedDomainNameLabelScope
  summary: 'The Cloud HSM Cluster''s auto-generated Domain Name Label Scope. Known
