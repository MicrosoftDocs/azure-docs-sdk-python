  name: hsms
  summary: An array of Cloud HSM Cluster's HSMs.
  signature: 'hsms: list[''CloudHsmProperties'']'
- uid: azure.mgmt.hardwaresecuritymodules.types.CloudHsmClusterProperties.privateEndpointConnections
  name: privateEndpointConnections
  summary: List of private endpoint connection resources.
  signature: 'privateEndpointConnections: list[''PrivateEndpointConnection'']'
