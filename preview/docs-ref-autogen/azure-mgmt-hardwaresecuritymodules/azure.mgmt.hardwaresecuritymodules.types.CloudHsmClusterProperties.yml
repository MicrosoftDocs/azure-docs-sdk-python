- uid: azure.mgmt.hardwaresecuritymodules.types.CloudHsmClusterProperties.publicNetworkAccess
  name: publicNetworkAccess
  summary: The Cloud HSM Cluster public network access. "Disabled"
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
