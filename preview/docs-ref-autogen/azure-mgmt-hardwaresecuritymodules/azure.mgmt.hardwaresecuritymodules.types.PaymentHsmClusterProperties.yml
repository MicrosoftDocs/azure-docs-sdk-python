  name: managementTrustedIssuer
  summary: The management trusted issuer for the Payment HSM Cluster. Required.
  signature: 'managementTrustedIssuer: Required[str]'
- uid: azure.mgmt.hardwaresecuritymodules.types.PaymentHsmClusterProperties.privateEndpointConnections
  name: privateEndpointConnections
  summary: List of private endpoint connection resources.
  signature: 'privateEndpointConnections: list[''PaymentHsmClusterPrivateEndpointConnection'']'
