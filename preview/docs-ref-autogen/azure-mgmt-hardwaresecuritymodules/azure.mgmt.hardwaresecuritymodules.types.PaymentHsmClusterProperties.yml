### YamlMime:PythonClass
uid: azure.mgmt.hardwaresecuritymodules.types.PaymentHsmClusterProperties
name: PaymentHsmClusterProperties
fullName: azure.mgmt.hardwaresecuritymodules.types.PaymentHsmClusterProperties
module: azure.mgmt.hardwaresecuritymodules.types
summary: Properties of a Payment HSM Cluster.
constructor:
  syntax: PaymentHsmClusterProperties()
variables:
- description: 'State of security domain activation. Known values are: "NotDefined",

    "NotActivated", "Active", "Failed", and "Unknown".'
  name: activationState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActivationState">]
- description: 'The Payment HSM Cluster''s auto-generated Domain Name

    Label Scope. Known values are: "TenantReuse", "SubscriptionReuse", "ResourceGroupReuse",
    and

    "NoReuse".'
  name: autoGeneratedDomainNameLabelScope
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoGeneratedDomainNameLabelScope">]
- description: An array of Payment HSM Cluster's HSMs.
  name: hsms
  types:
  - <xref:list>[<xref:"PaymentHsmProperties">]
- description: List of private endpoint connection resources.
  name: privateEndpointConnections
  types:
  - <xref:list>[<xref:"PaymentHsmClusterPrivateEndpointConnection">]
- description: 'The Payment HSM Cluster''s provisioningState. Known values are:

    "Provisioning", "Succeeded", "Updating", "Failed", "Deleting", and "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The Payment HSM Cluster public network access. "Disabled"
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: Payment HSM Cluster status message.
  name: statusMessage
  types:
  - <xref:str>
- description: 'The application trusted issuer for the Payment HSM Cluster.

    Required.'
  name: applicationTrustedIssuer
  types:
  - <xref:str>
- description: 'The management trusted issuer for the Payment HSM Cluster.

    Required.'
  name: managementTrustedIssuer
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.hardwaresecuritymodules.types.PaymentHsmClusterProperties.activationState
  name: activationState
  summary: '"NotDefined", "NotActivated",

    "Active", "Failed", and "Unknown".'
  signature: 'activationState: str | ActivationState'
- uid: azure.mgmt.hardwaresecuritymodules.types.PaymentHsmClusterProperties.applicationTrustedIssuer
  name: applicationTrustedIssuer
  summary: The application trusted issuer for the Payment HSM Cluster. Required.
  signature: 'applicationTrustedIssuer: Required[str]'
- uid: azure.mgmt.hardwaresecuritymodules.types.PaymentHsmClusterProperties.autoGeneratedDomainNameLabelScope
  name: autoGeneratedDomainNameLabelScope
  summary: 'The Payment HSM Cluster''s auto-generated Domain Name Label Scope. Known
