### YamlMime:PythonClass
uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineGroupProperties
name: SqlVirtualMachineGroupProperties
fullName: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineGroupProperties
module: azure.mgmt.sqlvirtualmachine.types
summary: The properties of a SQL virtual machine group.
constructor:
  syntax: SqlVirtualMachineGroupProperties()
variables:
- description: Provisioning state to track the async operation status.
  name: provisioning_state
  types:
  - <xref:str>
- description: SQL image offer. Examples may include SQL2016-WS2016, SQL2017-WS2016.
  name: sql_image_offer
  types:
  - <xref:str>
- description: 'SQL image sku. Known values are: "Developer" and "Enterprise".'
  name: sql_image_sku
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SqlVmGroupImageSku">]
- description: Scale type. "HA"
  name: scale_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScaleType">]
- description: 'Type of cluster manager: Windows Server Failover Cluster (WSFC),

    implied by the scale type of the group and the OS type. "WSFC"'
  name: cluster_manager_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterManagerType">]
- description: Cluster type. "Domainful"
  name: cluster_configuration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterConfiguration">]
- description: Cluster Active Directory domain profile.
  name: wsfc_domain_profile
  types:
  - <xref:<xref:"WsfcDomainProfile">>
attributes:
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineGroupProperties.clusterConfiguration
  name: clusterConfiguration
  summary: Cluster type. "Domainful"
  signature: 'clusterConfiguration: str | ClusterConfiguration'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineGroupProperties.clusterManagerType
  name: clusterManagerType
  summary: 'Windows Server Failover Cluster (WSFC), implied by the scale type of

    the group and the OS type. "WSFC"'
  signature: 'clusterManagerType: str | ClusterManagerType'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineGroupProperties.provisioningState
  name: provisioningState
  summary: Provisioning state to track the async operation status.
  signature: 'provisioningState: str'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineGroupProperties.scaleType
  name: scaleType
  summary: Scale type. "HA"
  signature: 'scaleType: str | ScaleType'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineGroupProperties.sqlImageOffer
  name: sqlImageOffer
  summary: SQL image offer. Examples may include SQL2016-WS2016, SQL2017-WS2016.
  signature: 'sqlImageOffer: str'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineGroupProperties.sqlImageSku
  name: sqlImageSku
  summary: '"Developer" and "Enterprise".'
  signature: 'sqlImageSku: str | SqlVmGroupImageSku'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineGroupProperties.wsfcDomainProfile
  name: wsfcDomainProfile
  summary: Cluster Active Directory domain profile.
  signature: 'wsfcDomainProfile: WsfcDomainProfile'
