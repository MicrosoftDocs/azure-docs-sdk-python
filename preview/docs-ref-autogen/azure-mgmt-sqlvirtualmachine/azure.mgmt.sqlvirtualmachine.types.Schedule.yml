### YamlMime:PythonClass
uid: azure.mgmt.sqlvirtualmachine.types.Schedule
name: Schedule
fullName: azure.mgmt.sqlvirtualmachine.types.Schedule
module: azure.mgmt.sqlvirtualmachine.types
summary: Set assessment schedule for SQL Server.
constructor:
  syntax: Schedule()
variables:
- description: Enable or disable assessment schedule on SQL virtual machine.
  name: enable
  types:
  - <xref:bool>
- description: 'Number of weeks to schedule between 2 assessment runs. Takes value
    from

    1-6.'
  name: weekly_interval
  types:
  - <xref:int>
- description: 'Occurrence of the DayOfWeek day within a month to schedule

    assessment. Takes values: 1,2,3,4 and -1. Use -1 for last DayOfWeek day of the
    month.'
  name: monthly_occurrence
  types:
  - <xref:int>
- description: 'Day of the week to run assessment. Known values are: "Monday", "Tuesday",

    "Wednesday", "Thursday", "Friday", "Saturday", and "Sunday".'
  name: day_of_week
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AssessmentDayOfWeek">]
- description: Time of the day in HH:mm format. Eg. 17:30.
  name: start_time
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.sqlvirtualmachine.types.Schedule.dayOfWeek
  name: dayOfWeek
  summary: '"Monday", "Tuesday", "Wednesday",

    "Thursday", "Friday", "Saturday", and "Sunday".'
  signature: 'dayOfWeek: str | AssessmentDayOfWeek'
- uid: azure.mgmt.sqlvirtualmachine.types.Schedule.enable
  name: enable
  summary: Enable or disable assessment schedule on SQL virtual machine.
  signature: 'enable: bool'
- uid: azure.mgmt.sqlvirtualmachine.types.Schedule.monthlyOccurrence
  name: monthlyOccurrence
  summary: '1,2,3,4

    and -1. Use -1 for last DayOfWeek day of the month.'
  signature: 'monthlyOccurrence: int'
- uid: azure.mgmt.sqlvirtualmachine.types.Schedule.startTime
  name: startTime
  signature: 'startTime: str'
- uid: azure.mgmt.sqlvirtualmachine.types.Schedule.weeklyInterval
  name: weeklyInterval
  summary: Number of weeks to schedule between 2 assessment runs. Takes value from
    1-6.
  signature: 'weeklyInterval: int'
