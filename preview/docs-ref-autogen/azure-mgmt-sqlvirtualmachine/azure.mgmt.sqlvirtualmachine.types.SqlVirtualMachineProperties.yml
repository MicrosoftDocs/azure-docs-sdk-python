### YamlMime:PythonClass
uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties
name: SqlVirtualMachineProperties
fullName: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties
module: azure.mgmt.sqlvirtualmachine.types
summary: The SQL virtual machine properties.
constructor:
  syntax: SqlVirtualMachineProperties()
variables:
- description: 'ARM Resource id of underlying virtual machine created from

    SQL marketplace image.'
  name: virtual_machine_resource_id
  types:
  - <xref:str>
- description: Provisioning state to track the async operation status.
  name: provisioning_state
  types:
  - <xref:str>
- description: SQL image offer. Examples include SQL2016-WS2016, SQL2017-WS2016.
  name: sql_image_offer
  types:
  - <xref:str>
- description: 'SQL Server license type. Known values are: "PAYG", "AHUB", and

    "DR".'
  name: sql_server_license_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SqlServerLicenseType">]
- description: 'SQL Server Management type. NOTE: This parameter is not used anymore.
    API

    will automatically detect the Sql Management, refrain from using it. Known values
    are: "Full",

    "LightWeight", and "NoAgent".'
  name: sql_management
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SqlManagementMode">]
- description: 'SQL IaaS Agent least privilege mode. Known values are: "Enabled"

    and "NotSet".'
  name: least_privilege_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LeastPrivilegeMode">]
- description: 'SQL Server edition type. Known values are: "Developer", "Express",

    "Standard", "Enterprise", and "Web".'
  name: sql_image_sku
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SqlImageSku">]
- description: 'ARM resource id of the SQL virtual machine group

    this SQL virtual machine is or will be part of.'
  name: sql_virtual_machine_group_resource_id
  types:
  - <xref:str>
- description: 'Domain credentials for setting up Windows Server Failover

    Cluster for SQL availability group.'
  name: wsfc_domain_credentials
  types:
  - <xref:<xref:"WsfcDomainCredentials">>
- description: 'Domain credentials for setting up Windows Server Failover Cluster
    for SQL

    availability group.'
  name: wsfc_static_ip
  types:
  - <xref:str>
- description: 'Auto patching settings for applying critical security updates to

    SQL virtual machine.'
  name: auto_patching_settings
  types:
  - <xref:<xref:"AutoPatchingSettings">>
- description: Auto backup settings for SQL Server.
  name: auto_backup_settings
  types:
  - <xref:<xref:"AutoBackupSettings">>
- description: Key vault credential settings.
  name: key_vault_credential_settings
  types:
  - <xref:<xref:"KeyVaultCredentialSettings">>
- description: SQL Server configuration management settings.
  name: server_configurations_management_settings
  types:
  - <xref:<xref:"ServerConfigurationsManagementSettings">>
- description: Storage Configuration Settings.
  name: storage_configuration_settings
  types:
  - <xref:<xref:"StorageConfigurationSettings">>
- description: Troubleshooting status.
  name: troubleshooting_status
  types:
  - <xref:<xref:"TroubleshootingStatus">>
- description: SQL best practices Assessment Settings.
  name: assessment_settings
  types:
  - <xref:<xref:"AssessmentSettings">>
- description: Enable automatic upgrade of Sql IaaS extension Agent.
  name: enable_automatic_upgrade
  types:
  - <xref:bool>
- description: 'Additional VM Patching solution enabled on the Virtual Machine.

    Known values are: "WU", "WUMU", and "WSUS".'
  name: additional_vm_patch
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AdditionalOsPatch">]
- description: 'Virtual Machine Identity details used for Sql IaaS

    extension configurations.'
  name: virtual_machine_identity_settings
  types:
  - <xref:<xref:"VirtualMachineIdentity">>
- description: 'Operating System of the current SQL Virtual Machine. Known values
    are: "Windows"

    and "Linux".'
  name: os_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OsType">]
attributes:
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.additionalVmPatch
  name: additionalVmPatch
  summary: '"WU",

    "WUMU", and "WSUS".'
  signature: 'additionalVmPatch: str | AdditionalOsPatch'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.assessmentSettings
  name: assessmentSettings
  summary: SQL best practices Assessment Settings.
  signature: 'assessmentSettings: AssessmentSettings'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.autoBackupSettings
  name: autoBackupSettings
  summary: Auto backup settings for SQL Server.
  signature: 'autoBackupSettings: AutoBackupSettings'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.autoPatchingSettings
  name: autoPatchingSettings
  summary: Auto patching settings for applying critical security updates to SQL virtual
    machine.
  signature: 'autoPatchingSettings: AutoPatchingSettings'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.enableAutomaticUpgrade
  name: enableAutomaticUpgrade
  summary: Enable automatic upgrade of Sql IaaS extension Agent.
  signature: 'enableAutomaticUpgrade: bool'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.keyVaultCredentialSettings
  name: keyVaultCredentialSettings
  summary: Key vault credential settings.
  signature: 'keyVaultCredentialSettings: KeyVaultCredentialSettings'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.leastPrivilegeMode
  name: leastPrivilegeMode
  summary: '"Enabled" and "NotSet".'
  signature: 'leastPrivilegeMode: str | LeastPrivilegeMode'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.osType
  name: osType
  summary: '"Windows" and

    "Linux".'
  signature: 'osType: str | OsType'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.provisioningState
  name: provisioningState
  summary: Provisioning state to track the async operation status.
  signature: 'provisioningState: str'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.serverConfigurationsManagementSettings
  name: serverConfigurationsManagementSettings
  summary: SQL Server configuration management settings.
  signature: 'serverConfigurationsManagementSettings: ServerConfigurationsManagementSettings'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.sqlImageOffer
  name: sqlImageOffer
  summary: SQL image offer. Examples include SQL2016-WS2016, SQL2017-WS2016.
  signature: 'sqlImageOffer: str'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.sqlImageSku
  name: sqlImageSku
  summary: '"Developer", "Express", "Standard",

    "Enterprise", and "Web".'
  signature: 'sqlImageSku: str | SqlImageSku'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.sqlManagement
  name: sqlManagement
  summary: 'This parameter is not used anymore. API will automatically

    detect the Sql Management, refrain from using it. Known values are: "Full", "LightWeight",

    and "NoAgent".'
  signature: 'sqlManagement: str | SqlManagementMode'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.sqlServerLicenseType
  name: sqlServerLicenseType
  summary: '"PAYG", "AHUB", and "DR".'
  signature: 'sqlServerLicenseType: str | SqlServerLicenseType'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.sqlVirtualMachineGroupResourceId
  name: sqlVirtualMachineGroupResourceId
  summary: 'ARM resource id of the SQL virtual machine group this SQL virtual machine
    is or will be part

    of.'
  signature: 'sqlVirtualMachineGroupResourceId: str'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.storageConfigurationSettings
  name: storageConfigurationSettings
  summary: Storage Configuration Settings.
  signature: 'storageConfigurationSettings: StorageConfigurationSettings'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.troubleshootingStatus
  name: troubleshootingStatus
  summary: Troubleshooting status.
  signature: 'troubleshootingStatus: TroubleshootingStatus'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.virtualMachineIdentitySettings
  name: virtualMachineIdentitySettings
  summary: Virtual Machine Identity details used for Sql IaaS extension configurations.
  signature: 'virtualMachineIdentitySettings: VirtualMachineIdentity'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.virtualMachineResourceId
  name: virtualMachineResourceId
  summary: ARM Resource id of underlying virtual machine created from SQL marketplace
    image.
  signature: 'virtualMachineResourceId: str'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.wsfcDomainCredentials
  name: wsfcDomainCredentials
  summary: Domain credentials for setting up Windows Server Failover Cluster for SQL
    availability group.
  signature: 'wsfcDomainCredentials: WsfcDomainCredentials'
- uid: azure.mgmt.sqlvirtualmachine.types.SqlVirtualMachineProperties.wsfcStaticIp
  name: wsfcStaticIp
  summary: Domain credentials for setting up Windows Server Failover Cluster for SQL
    availability group.
  signature: 'wsfcStaticIp: str'
