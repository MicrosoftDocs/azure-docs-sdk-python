### YamlMime:PythonClass
uid: azure.mgmt.computefleet.types.ProxyAgentSettings
name: ProxyAgentSettings
fullName: azure.mgmt.computefleet.types.ProxyAgentSettings
module: azure.mgmt.computefleet.types
summary: 'Specifies ProxyAgent settings while creating the virtual machine. Minimum
  api-version:

  2023-09-01.'
constructor:
  syntax: ProxyAgentSettings()
variables:
- description: 'Specifies whether ProxyAgent feature should be enabled on the virtual
    machine or

    virtual machine scale set.'
  name: enabled
  types:
  - <xref:bool>
- description: 'Specifies the mode that ProxyAgent will execute on if the feature
    is enabled.

    ProxyAgent will start to audit or monitor but not enforce access control over
    requests to host

    endpoints in Audit mode, while in Enforce mode it will enforce access control.
    The default

    value is Enforce mode. Known values are: "Audit" and "Enforce".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Mode">]
- description: 'Increase the value of this property allows user to reset the key used

    for securing communication channel between guest and host.'
  name: key_incarnation_id
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.computefleet.types.ProxyAgentSettings.enabled
  name: enabled
  summary: 'Specifies whether ProxyAgent feature should be enabled on the virtual
    machine or virtual

    machine scale set.'
  signature: 'enabled: bool'
- uid: azure.mgmt.computefleet.types.ProxyAgentSettings.keyIncarnationId
  name: keyIncarnationId
  summary: 'Increase the value of this property allows user to reset the key used
    for securing

    communication channel between guest and host.'
  signature: 'keyIncarnationId: int'
- uid: azure.mgmt.computefleet.types.ProxyAgentSettings.mode
  name: mode
  summary: 'Specifies the mode that ProxyAgent will execute on if the feature is enabled.
    ProxyAgent will

    start to audit or monitor but not enforce access control over requests to host
    endpoints in

    Audit mode, while in Enforce mode it will enforce access control. The default
    value is Enforce

    mode. Known values are: "Audit" and "Enforce".'
  signature: 'mode: str | Mode'
