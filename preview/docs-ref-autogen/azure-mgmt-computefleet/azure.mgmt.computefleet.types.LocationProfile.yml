uid: azure.mgmt.computefleet.types.LocationProfile
name: LocationProfile
fullName: azure.mgmt.computefleet.types.LocationProfile
module: azure.mgmt.computefleet.types
summary: 'Represents the profile for a single additional location in the Fleet. The
  location and the

  virtualMachineProfileOverride (optional).'
constructor:
  syntax: LocationProfile()
variables:
- description: 'The ARM location name of the additional region. If LocationProfile
    is

    specified, then location is required. Required.'
  name: location
  types:
  - <xref:str>
- description: 'An override for

    computeProfile.baseVirtualMachineProfile specific to this region. This override
    is merged with

    the base virtual machine profile to define the final virtual machine profile for
    the resources

    deployed in this location.'
  name: virtual_machine_profile_override
  types:
  - <xref:<xref:"BaseVirtualMachineProfile">>
attributes:
- uid: azure.mgmt.computefleet.types.LocationProfile.location
  name: location
  summary: 'The ARM location name of the additional region. If LocationProfile is
    specified, then location

    is required. Required.'
  signature: 'location: str'
- uid: azure.mgmt.computefleet.types.LocationProfile.virtualMachineProfileOverride
  name: virtualMachineProfileOverride
  summary: 'An override for computeProfile.baseVirtualMachineProfile specific to this
    region. This override

    is merged with the base virtual machine profile to define the final virtual machine
    profile for

    the resources deployed in this location.'
  signature: 'virtualMachineProfileOverride: BaseVirtualMachineProfile'
