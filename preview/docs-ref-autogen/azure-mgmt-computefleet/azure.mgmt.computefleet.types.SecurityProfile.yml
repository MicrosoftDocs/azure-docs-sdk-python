### YamlMime:PythonClass
uid: azure.mgmt.computefleet.types.SecurityProfile
name: SecurityProfile
fullName: azure.mgmt.computefleet.types.SecurityProfile
module: azure.mgmt.computefleet.types
summary: Specifies the Security profile settings for the virtual machine or virtual
  machine scale set.
constructor:
  syntax: SecurityProfile()
variables:
- description: 'Specifies the security settings like secure boot and vTPM used while

    creating the virtual machine. Minimum api-version: 2020-12-01.'
  name: uefi_settings
  types:
  - <xref:<xref:"UefiSettings">>
- description: 'This property can be used by user in the request to enable or disable

    the Host Encryption for the virtual machine or virtual machine scale set. This
    will enable the

    encryption for all the disks including Resource/Temp disk at host itself. The
    default behavior

    is: The Encryption at host will be disabled unless this property is set to true
    for the

    resource.'
  name: encryption_at_host
  types:
  - <xref:bool>
- description: 'Specifies the SecurityType of the virtual machine. It has to be set
    to any

    specified value to enable UefiSettings. The default behavior is: UefiSettings
    will not be

    enabled unless this property is set. Known values are: "TrustedLaunch" and "ConfidentialVM".'
  name: security_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityTypes">]
- description: 'Specifies the Managed Identity used by ADE to get access token for

    keyvault operations.'
  name: encryption_identity
  types:
  - <xref:<xref:"EncryptionIdentity">>
- description: 'Specifies ProxyAgent settings while creating the virtual machine.

    Minimum api-version: 2023-09-01.'
  name: proxy_agent_settings
  types:
  - <xref:<xref:"ProxyAgentSettings">>
attributes:
- uid: azure.mgmt.computefleet.types.SecurityProfile.encryptionAtHost
  name: encryptionAtHost
  summary: 'This property can be used by user in the request to enable or disable
    the Host Encryption for

    the virtual machine or virtual machine scale set. This will enable the encryption
    for all the

    disks including Resource/Temp disk at host itself. The default behavior is: The
    Encryption at

    host will be disabled unless this property is set to true for the resource.'
  signature: 'encryptionAtHost: bool'
- uid: azure.mgmt.computefleet.types.SecurityProfile.encryptionIdentity
  name: encryptionIdentity
  summary: Specifies the Managed Identity used by ADE to get access token for keyvault
    operations.
  signature: 'encryptionIdentity: EncryptionIdentity'
- uid: azure.mgmt.computefleet.types.SecurityProfile.proxyAgentSettings
  name: proxyAgentSettings
  summary: 'Specifies ProxyAgent settings while creating the virtual machine. Minimum
    api-version:

    2023-09-01.'
  signature: 'proxyAgentSettings: ProxyAgentSettings'
- uid: azure.mgmt.computefleet.types.SecurityProfile.securityType
  name: securityType
  summary: 'Specifies the SecurityType of the virtual machine. It has to be set to
    any specified value to

    enable UefiSettings. The default behavior is: UefiSettings will not be enabled
    unless this

    property is set. Known values are: "TrustedLaunch" and "ConfidentialVM".'
  signature: 'securityType: str | SecurityTypes'
- uid: azure.mgmt.computefleet.types.SecurityProfile.uefiSettings
  name: uefiSettings
  summary: 'Specifies the security settings like secure boot and vTPM used while creating
    the virtual

    machine. Minimum api-version: 2020-12-01.'
  signature: 'uefiSettings: UefiSettings'
