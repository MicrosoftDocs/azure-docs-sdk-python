### YamlMime:PythonClass
uid: azure.mgmt.computefleet.types.LinuxVMGuestPatchAutomaticByPlatformSettings
name: LinuxVMGuestPatchAutomaticByPlatformSettings
fullName: azure.mgmt.computefleet.types.LinuxVMGuestPatchAutomaticByPlatformSettings
module: azure.mgmt.computefleet.types
summary: 'Specifies additional settings to be applied when patch mode AutomaticByPlatform
  is selected in

  Linux patch settings.'
constructor:
  syntax: LinuxVMGuestPatchAutomaticByPlatformSettings()
variables:
- description: 'Specifies the reboot setting for all AutomaticByPlatform patch

    installation operations. Known values are: "Unknown", "IfRequired", "Never", and
    "Always".'
  name: reboot_setting
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LinuxVMGuestPatchAutomaticByPlatformRebootSetting">]
- description: 'Enables customer to schedule patching

    without accidental upgrades.'
  name: bypass_platform_safety_checks_on_user_schedule
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.computefleet.types.LinuxVMGuestPatchAutomaticByPlatformSettings.bypassPlatformSafetyChecksOnUserSchedule
  name: bypassPlatformSafetyChecksOnUserSchedule
  summary: Enables customer to schedule patching without accidental upgrades.
  signature: 'bypassPlatformSafetyChecksOnUserSchedule: bool'
- uid: azure.mgmt.computefleet.types.LinuxVMGuestPatchAutomaticByPlatformSettings.rebootSetting
  name: rebootSetting
  summary: 'Specifies the reboot setting for all AutomaticByPlatform patch installation
    operations. Known

    values are: "Unknown", "IfRequired", "Never", and "Always".'
  signature: 'rebootSetting: str | LinuxVMGuestPatchAutomaticByPlatformRebootSetting'
