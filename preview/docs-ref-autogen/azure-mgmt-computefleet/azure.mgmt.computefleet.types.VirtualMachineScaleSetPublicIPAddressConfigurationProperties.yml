uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetPublicIPAddressConfigurationProperties
name: VirtualMachineScaleSetPublicIPAddressConfigurationProperties
fullName: azure.mgmt.computefleet.types.VirtualMachineScaleSetPublicIPAddressConfigurationProperties
module: azure.mgmt.computefleet.types
summary: Describes a virtual machines scale set IP Configuration's PublicIPAddress
  configuration.
constructor:
  syntax: VirtualMachineScaleSetPublicIPAddressConfigurationProperties()
variables:
- description: The idle timeout of the public IP address.
  name: idle_timeout_in_minutes
  types:
  - <xref:int>
- description: The dns settings to be applied on the publicIP addresses .
  name: dns_settings
  types:
  - <xref:<xref:"VirtualMachineScaleSetPublicIPAddressConfigurationDnsSettings">>
- description: The list of IP tags associated with the public IP address.
  name: ip_tags
  types:
  - <xref:list>[<xref:"VirtualMachineScaleSetIpTag">]
- description: The PublicIPPrefix from which to allocate publicIP addresses.
  name: public_ip_prefix
