  - <xref:<xref:"SubResource">>
- description: 'Available from Api-Version 2019-07-01 onwards, it represents

    whether the specific ipconfiguration is IPv4 or IPv6. Default is taken as IPv4.
    Possible values

    are: ''IPv4'' and ''IPv6''. Known values are: "IPv4" and "IPv6".'
  name: public_ip_address_version
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IPVersion">]
- description: 'Specify what happens to the public IP when the VM is deleted. Known
    values

    are: "Delete" and "Detach".'
