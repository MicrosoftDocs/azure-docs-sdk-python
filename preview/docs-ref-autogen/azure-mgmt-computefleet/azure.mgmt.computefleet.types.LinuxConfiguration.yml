### YamlMime:PythonClass
uid: azure.mgmt.computefleet.types.LinuxConfiguration
name: LinuxConfiguration
fullName: azure.mgmt.computefleet.types.LinuxConfiguration
module: azure.mgmt.computefleet.types
summary: 'Specifies the Linux operating system settings on the virtual machine. For
  a list of supported

  Linux distributions, see [Linux on Azure-Endorsed Distributions](https://learn.microsoft.com/azure/virtual-machines/linux/endorsed-distros).'
constructor:
  syntax: LinuxConfiguration()
variables:
- description: 'Specifies whether password authentication should be

    disabled.'
  name: disable_password_authentication
  types:
  - <xref:bool>
- description: Specifies the ssh key configuration for a Linux OS.
  name: ssh
  types:
  - <xref:<xref:"SshConfiguration">>
- description: 'Indicates whether virtual machine agent should be provisioned on the

    virtual machine. When this property is not specified in the request body, default
    behavior is

    to set it to true. This will ensure that VM Agent is installed on the VM so that
    extensions can

    be added to the VM later.'
  name: provision_vm_agent
  types:
  - <xref:bool>
- description: '[Preview Feature] Specifies settings related to VM Guest Patching
    on

    Linux.'
  name: patch_settings
  types:
  - <xref:<xref:"LinuxPatchSettings">>
- description: 'Indicates whether VMAgent Platform Updates is enabled

    for the Linux virtual machine. Default value is false.'
  name: enable_vm_agent_platform_updates
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.computefleet.types.LinuxConfiguration.disablePasswordAuthentication
  name: disablePasswordAuthentication
  summary: Specifies whether password authentication should be disabled.
  signature: 'disablePasswordAuthentication: bool'
- uid: azure.mgmt.computefleet.types.LinuxConfiguration.enableVMAgentPlatformUpdates
  name: enableVMAgentPlatformUpdates
  summary: 'Indicates whether VMAgent Platform Updates is enabled for the Linux virtual
    machine. Default

    value is false.'
  signature: 'enableVMAgentPlatformUpdates: bool'
- uid: azure.mgmt.computefleet.types.LinuxConfiguration.patchSettings
  name: patchSettings
  summary: '[Preview Feature] Specifies settings related to VM Guest Patching on Linux.'
  signature: 'patchSettings: LinuxPatchSettings'
- uid: azure.mgmt.computefleet.types.LinuxConfiguration.provisionVMAgent
  name: provisionVMAgent
  summary: 'Indicates whether virtual machine agent should be provisioned on the virtual
    machine. When this

    property is not specified in the request body, default behavior is to set it to
    true. This will

    ensure that VM Agent is installed on the VM so that extensions can be added to
    the VM later.'
  signature: 'provisionVMAgent: bool'
- uid: azure.mgmt.computefleet.types.LinuxConfiguration.ssh
  name: ssh
  summary: Specifies the ssh key configuration for a Linux OS.
  signature: 'ssh: SshConfiguration'
