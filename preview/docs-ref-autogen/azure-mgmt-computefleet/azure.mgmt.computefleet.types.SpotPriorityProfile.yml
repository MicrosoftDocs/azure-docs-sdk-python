### YamlMime:PythonClass
uid: azure.mgmt.computefleet.types.SpotPriorityProfile
name: SpotPriorityProfile
fullName: azure.mgmt.computefleet.types.SpotPriorityProfile
module: azure.mgmt.computefleet.types
summary: Configuration Options for Spot instances in Compute Fleet.
constructor:
  syntax: SpotPriorityProfile()
variables:
- description: Total capacity to achieve. It is currently in terms of number of VMs.
  name: capacity
  types:
  - <xref:int>
- description: 'Minimum capacity to achieve which cannot be updated. If we will not
    be able

    to "guarantee" minimum capacity, we will reject the request in the sync path itself.'
  name: min_capacity
  types:
  - <xref:int>
- description: Price per hour of each Spot VM will never exceed this.
  name: max_price_per_vm
  types:
  - <xref:float>
- description: 'Eviction Policy to follow when evicting Spot VMs. Known values are:

    "Delete" and "Deallocate".'
  name: eviction_policy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EvictionPolicy">]
- description: 'Allocation strategy to follow when determining the VM sizes

    distribution for Spot VMs. Known values are: "PriceCapacityOptimized", "LowestPrice",
    and

    "CapacityOptimized".'
  name: allocation_strategy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SpotAllocationStrategy">]
- description: 'Flag to enable/disable continuous goal seeking for the desired capacity
    and

    restoration of evicted Spot VMs. If maintain is enabled, AzureFleetRP will use
    all VM sizes in

    vmSizesProfile to create new VMs (if VMs are evicted deleted) or update existing
    VMs with new

    VM sizes (if VMs are evicted deallocated or failed to allocate due to capacity
    constraint) in

    order to achieve the desired capacity. Maintain is enabled by default.'
  name: maintain
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.computefleet.types.SpotPriorityProfile.allocationStrategy
  name: allocationStrategy
  summary: 'Allocation strategy to follow when determining the VM sizes distribution
    for Spot VMs. Known

    values are: "PriceCapacityOptimized", "LowestPrice", and "CapacityOptimized".'
  signature: 'allocationStrategy: str | SpotAllocationStrategy'
- uid: azure.mgmt.computefleet.types.SpotPriorityProfile.capacity
  name: capacity
  summary: Total capacity to achieve. It is currently in terms of number of VMs.
  signature: 'capacity: int'
- uid: azure.mgmt.computefleet.types.SpotPriorityProfile.evictionPolicy
  name: evictionPolicy
  summary: '"Delete" and

    "Deallocate".'
  signature: 'evictionPolicy: str | EvictionPolicy'
- uid: azure.mgmt.computefleet.types.SpotPriorityProfile.maintain
  name: maintain
  summary: 'Flag to enable/disable continuous goal seeking for the desired capacity
    and restoration of

    evicted Spot VMs. If maintain is enabled, AzureFleetRP will use all VM sizes in
    vmSizesProfile

    to create new VMs (if VMs are evicted deleted) or update existing VMs with new
    VM sizes (if VMs

    are evicted deallocated or failed to allocate due to capacity constraint) in order
    to achieve

    the desired capacity. Maintain is enabled by default.'
  signature: 'maintain: bool'
- uid: azure.mgmt.computefleet.types.SpotPriorityProfile.maxPricePerVM
  name: maxPricePerVM
  summary: Price per hour of each Spot VM will never exceed this.
  signature: 'maxPricePerVM: float'
- uid: azure.mgmt.computefleet.types.SpotPriorityProfile.minCapacity
  name: minCapacity
  summary: 'Minimum capacity to achieve which cannot be updated. If we will not be
    able to "guarantee"

    minimum capacity, we will reject the request in the sync path itself.'
  signature: 'minCapacity: int'
