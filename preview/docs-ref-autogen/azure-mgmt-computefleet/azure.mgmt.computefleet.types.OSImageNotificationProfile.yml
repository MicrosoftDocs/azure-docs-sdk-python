### YamlMime:PythonClass
uid: azure.mgmt.computefleet.types.OSImageNotificationProfile
name: OSImageNotificationProfile
fullName: azure.mgmt.computefleet.types.OSImageNotificationProfile
module: azure.mgmt.computefleet.types
summary: Specifies OS Image Scheduled Event related configurations.
constructor:
  syntax: OSImageNotificationProfile()
variables:
- description: 'Length of time a Virtual Machine being reimaged or having its OS

    upgraded will have to potentially approve the OS Image Scheduled Event before
    the event is auto

    approved (timed out). The configuration is specified in ISO 8601 format, and the
    value must not

    exceed 15 minutes (PT15M).'
  name: not_before_timeout
  types:
  - <xref:str>
- description: Specifies whether the OS Image Scheduled event is enabled or disabled.
  name: enable
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.computefleet.types.OSImageNotificationProfile.enable
  name: enable
  summary: Specifies whether the OS Image Scheduled event is enabled or disabled.
  signature: 'enable: bool'
- uid: azure.mgmt.computefleet.types.OSImageNotificationProfile.notBeforeTimeout
  name: notBeforeTimeout
  summary: 'Length of time a Virtual Machine being reimaged or having its OS upgraded
    will have to

    potentially approve the OS Image Scheduled Event before the event is auto approved
    (timed out).

    The configuration is specified in ISO 8601 format, and the value must not exceed
    15 minutes

    (PT15M).'
  signature: 'notBeforeTimeout: str'
