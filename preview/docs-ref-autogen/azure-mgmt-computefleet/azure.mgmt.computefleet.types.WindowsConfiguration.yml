### YamlMime:PythonClass
uid: azure.mgmt.computefleet.types.WindowsConfiguration
name: WindowsConfiguration
fullName: azure.mgmt.computefleet.types.WindowsConfiguration
module: azure.mgmt.computefleet.types
summary: Specifies Windows operating system settings on the virtual machine.
constructor:
  syntax: WindowsConfiguration()
variables:
- description: 'Indicates whether virtual machine agent should be provisioned on the

    virtual machine. When this property is not specified in the request body, it is
    set to true by

    default. This will ensure that VM Agent is installed on the VM so that extensions
    can be added

    to the VM later.'
  name: provision_vm_agent
  types:
  - <xref:bool>
- description: 'Indicates whether Automatic Updates is enabled for the Windows

    virtual machine. Default value is true. For virtual machine scale sets, this property
    can be

    updated and updates will take effect on OS reprovisioning.'
  name: enable_automatic_updates
  types:
  - <xref:bool>
- description: 'Specifies the time zone of the virtual machine. e.g. "Pacific Standard
    Time".

    Possible values can be [TimeZoneInfo.Id](https://learn.microsoft.com/dotnet/api/system.timezoneinfo.id?#System_TimeZoneInfo_Id)
    value

    from time zones returned by [TimeZoneInfo.GetSystemTimeZones](https://learn.microsoft.com/dotnet/api/system.timezoneinfo.getsystemtimezones).'
  name: time_zone
  types:
  - <xref:str>
- description: 'Specifies additional base-64 encoded XML formatted

    information that can be included in the Unattend.xml file, which is used by Windows
    Setup.'
  name: additional_unattend_content
  types:
  - <xref:list>[<xref:"AdditionalUnattendContent">]
- description: '[Preview Feature] Specifies settings related to VM Guest Patching
    on

    Windows.'
  name: patch_settings
  types:
  - <xref:<xref:"PatchSettings">>
- description: 'Specifies the Windows Remote Management listeners. This enables remote
    Windows

    PowerShell.'
  name: win_rm
  types:
  - <xref:<xref:"WinRMConfiguration">>
- description: 'Indicates whether VMAgent Platform Updates is enabled

    for the Windows virtual machine. Default value is false.'
  name: enable_vm_agent_platform_updates
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.computefleet.types.WindowsConfiguration.additionalUnattendContent
  name: additionalUnattendContent
  summary: 'Specifies additional base-64 encoded XML formatted information that can
    be included in the

    Unattend.xml file, which is used by Windows Setup.'
  signature: 'additionalUnattendContent: list[azure.mgmt.computefleet.types.AdditionalUnattendContent]'
- uid: azure.mgmt.computefleet.types.WindowsConfiguration.enableAutomaticUpdates
  name: enableAutomaticUpdates
  summary: 'Indicates whether Automatic Updates is enabled for the Windows virtual
    machine. Default value

    is true. For virtual machine scale sets, this property can be updated and updates
    will take

    effect on OS reprovisioning.'
  signature: 'enableAutomaticUpdates: bool'
- uid: azure.mgmt.computefleet.types.WindowsConfiguration.enableVMAgentPlatformUpdates
  name: enableVMAgentPlatformUpdates
  summary: 'Indicates whether VMAgent Platform Updates is enabled for the Windows
    virtual machine. Default

    value is false.'
  signature: 'enableVMAgentPlatformUpdates: bool'
- uid: azure.mgmt.computefleet.types.WindowsConfiguration.patchSettings
  name: patchSettings
  summary: '[Preview Feature] Specifies settings related to VM Guest Patching on Windows.'
  signature: 'patchSettings: PatchSettings'
- uid: azure.mgmt.computefleet.types.WindowsConfiguration.provisionVMAgent
  name: provisionVMAgent
  summary: 'Indicates whether virtual machine agent should be provisioned on the virtual
    machine. When this

    property is not specified in the request body, it is set to true by default. This
    will ensure

    that VM Agent is installed on the VM so that extensions can be added to the VM
    later.'
  signature: 'provisionVMAgent: bool'
- uid: azure.mgmt.computefleet.types.WindowsConfiguration.timeZone
  name: timeZone
  summary: 'Specifies the time zone of the virtual machine. e.g. "Pacific Standard
    Time". Possible values

    can be [TimeZoneInfo.Id](https://learn.microsoft.com/dotnet/api/system.timezoneinfo.id?#System_TimeZoneInfo_Id)
    value

    from time zones returned by [TimeZoneInfo.GetSystemTimeZones](https://learn.microsoft.com/dotnet/api/system.timezoneinfo.getsystemtimezones).'
  signature: 'timeZone: str'
- uid: azure.mgmt.computefleet.types.WindowsConfiguration.winRM
  name: winRM
  summary: Specifies the Windows Remote Management listeners. This enables remote
    Windows PowerShell.
  signature: 'winRM: WinRMConfiguration'
