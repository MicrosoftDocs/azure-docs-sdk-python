### YamlMime:PythonClass
uid: azure.mgmt.computefleet.types.ComputeProfile
name: ComputeProfile
fullName: azure.mgmt.computefleet.types.ComputeProfile
module: azure.mgmt.computefleet.types
summary: Compute Profile to use for running user's workloads.
constructor:
  syntax: ComputeProfile()
variables:
- description: 'Base Virtual Machine Profile Properties to be specified

    according to

    "specification/compute/resource-manager/Microsoft.Compute/ComputeRP/stable/{computeApiVersion}/virtualMachineScaleSet.json#/definitions/VirtualMachineScaleSetVMProfile".

    Required.'
  name: base_virtual_machine_profile
  types:
  - <xref:<xref:"BaseVirtualMachineProfile">>
- description: 'Specifies the Microsoft.Compute API version to use when creating

    underlying Virtual Machine scale sets and Virtual Machines. The default value
    will be the

    latest supported computeApiVersion by Compute Fleet.'
  name: compute_api_version
  types:
  - <xref:str>
- description: 'Specifies the number of fault domains to use when creating

    the underlying VMSS. A fault domain is a logical group of hardware within an Azure
    datacenter.

    VMs in the same fault domain share a common power source and network switch. If
    not specified,

    defaults to 1, which represents "Max Spreading" (using as many fault domains as
    possible). This

    property cannot be updated.'
  name: platform_fault_domain_count
  types:
  - <xref:int>
- description: 'Specifies VMSS and VM API entity models support

    two additional capabilities as of today: ultraSSDEnabled and hibernationEnabled.

    ultraSSDEnabled: Enables UltraSSD_LRS storage account type on the VMSS VMs. hibernationEnabled:

    Enables the hibernation capability on the VMSS VMs. Default value is null if not
    specified.

    This property cannot be updated once set.'
  name: additional_virtual_machine_capabilities
  types:
  - <xref:<xref:"AdditionalCapabilities">>
attributes:
- uid: azure.mgmt.computefleet.types.ComputeProfile.additionalVirtualMachineCapabilities
  name: additionalVirtualMachineCapabilities
  summary: 'Specifies VMSS and VM API entity models support two additional capabilities
    as of today:

    ultraSSDEnabled and hibernationEnabled. ultraSSDEnabled: Enables UltraSSD_LRS
    storage account

    type on the VMSS VMs. hibernationEnabled: Enables the hibernation capability on
    the VMSS VMs.

    Default value is null if not specified. This property cannot be updated once set.'
  signature: 'additionalVirtualMachineCapabilities: AdditionalCapabilities'
- uid: azure.mgmt.computefleet.types.ComputeProfile.baseVirtualMachineProfile
  name: baseVirtualMachineProfile
  summary: 'Base Virtual Machine Profile Properties to be specified according to

    "specification/compute/resource-manager/Microsoft.Compute/ComputeRP/stable/{computeApiVersion}/virtualMachineScaleSet.json#/definitions/VirtualMachineScaleSetVMProfile".

    Required.'
  signature: 'baseVirtualMachineProfile: BaseVirtualMachineProfile'
- uid: azure.mgmt.computefleet.types.ComputeProfile.computeApiVersion
  name: computeApiVersion
  summary: 'Specifies the Microsoft.Compute API version to use when creating underlying
    Virtual Machine

    scale sets and Virtual Machines. The default value will be the latest supported

    computeApiVersion by Compute Fleet.'
  signature: 'computeApiVersion: str'
- uid: azure.mgmt.computefleet.types.ComputeProfile.platformFaultDomainCount
  name: platformFaultDomainCount
  summary: 'Specifies the number of fault domains to use when creating the underlying
    VMSS. A fault domain

    is a logical group of hardware within an Azure datacenter. VMs in the same fault
    domain share a

    common power source and network switch. If not specified, defaults to 1, which
    represents "Max

    Spreading" (using as many fault domains as possible). This property cannot be
    updated.'
  signature: 'platformFaultDomainCount: int'
