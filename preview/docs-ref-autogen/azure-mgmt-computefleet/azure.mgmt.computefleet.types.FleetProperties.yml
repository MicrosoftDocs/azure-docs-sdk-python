### YamlMime:PythonClass
uid: azure.mgmt.computefleet.types.FleetProperties
name: FleetProperties
fullName: azure.mgmt.computefleet.types.FleetProperties
module: azure.mgmt.computefleet.types
summary: Details of the Compute Fleet.
constructor:
  syntax: FleetProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", "Updating", "Deleting", and "Migrating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: Configuration Options for Spot instances in Compute Fleet.
  name: spot_priority_profile
  types:
  - <xref:<xref:"SpotPriorityProfile">>
- description: Configuration Options for Regular instances in Compute Fleet.
  name: regular_priority_profile
  types:
  - <xref:<xref:"RegularPriorityProfile">>
- description: List of VM sizes supported for Compute Fleet. Required.
  name: vm_sizes_profile
  types:
  - <xref:list>[<xref:"VmSizeProfile">]
- description: Attribute based Fleet.
  name: vm_attributes
  types:
  - <xref:<xref:"VMAttributes">>
- description: 'Represents the configuration for additional locations where

    Fleet resources may be deployed.'
  name: additional_locations_profile
  types:
  - <xref:<xref:"AdditionalLocationsProfile">>
- description: Compute Profile to use for running user's workloads. Required.
  name: compute_profile
  types:
  - <xref:<xref:"ComputeProfile">>
- description: Specifies the time at which the Compute Fleet is created.
  name: time_created
  types:
  - <xref:str>
- description: Specifies the ID which uniquely identifies a Compute Fleet.
  name: unique_id
  types:
  - <xref:str>
- description: 'Mode of the Fleet. Known values are: "Managed" and "Launch".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FleetMode">]
- description: 'VirtualMachine prefix to be used for the virtual machines launched
    by

    Fleet. Can be used only with Launch mode.'
  name: vm_name_prefix
  types:
  - <xref:str>
- description: 'Specifies capacity type for Fleet Regular and Spot priority profiles.

    capacityType is an immutable property. Once set during Fleet creation, it cannot
    be updated.

    Specifying different capacity type for Fleet Regular and Spot priority profiles
    is not allowed.

    Known values are: "VM" and "VCpu".'
  name: capacity_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CapacityType">]
- description: Zone Allocation Policy for Fleet.
  name: zone_allocation_policy
  types:
  - <xref:<xref:"ZoneAllocationPolicy">>
attributes:
- uid: azure.mgmt.computefleet.types.FleetProperties.additionalLocationsProfile
  name: additionalLocationsProfile
  summary: Represents the configuration for additional locations where Fleet resources
    may be deployed.
  signature: 'additionalLocationsProfile: AdditionalLocationsProfile'
- uid: azure.mgmt.computefleet.types.FleetProperties.capacityType
  name: capacityType
  summary: 'Specifies capacity type for Fleet Regular and Spot priority profiles.
    capacityType is an

    immutable property. Once set during Fleet creation, it cannot be updated. Specifying
    different

    capacity type for Fleet Regular and Spot priority profiles is not allowed. Known
    values are:

    "VM" and "VCpu".'
  signature: 'capacityType: str | CapacityType'
- uid: azure.mgmt.computefleet.types.FleetProperties.computeProfile
  name: computeProfile
  summary: Compute Profile to use for running user's workloads. Required.
  signature: 'computeProfile: Required[ComputeProfile]'
- uid: azure.mgmt.computefleet.types.FleetProperties.mode
  name: mode
  summary: '"Managed" and "Launch".'
  signature: 'mode: str | FleetMode'
- uid: azure.mgmt.computefleet.types.FleetProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Creating", "Updating", "Deleting", and "Migrating".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.computefleet.types.FleetProperties.regularPriorityProfile
  name: regularPriorityProfile
  summary: Configuration Options for Regular instances in Compute Fleet.
  signature: 'regularPriorityProfile: RegularPriorityProfile'
- uid: azure.mgmt.computefleet.types.FleetProperties.spotPriorityProfile
  name: spotPriorityProfile
  summary: Configuration Options for Spot instances in Compute Fleet.
  signature: 'spotPriorityProfile: SpotPriorityProfile'
- uid: azure.mgmt.computefleet.types.FleetProperties.timeCreated
  name: timeCreated
  summary: Specifies the time at which the Compute Fleet is created.
  signature: 'timeCreated: str'
- uid: azure.mgmt.computefleet.types.FleetProperties.uniqueId
  name: uniqueId
  summary: Specifies the ID which uniquely identifies a Compute Fleet.
  signature: 'uniqueId: str'
- uid: azure.mgmt.computefleet.types.FleetProperties.vmAttributes
  name: vmAttributes
  summary: Attribute based Fleet.
  signature: 'vmAttributes: VMAttributes'
- uid: azure.mgmt.computefleet.types.FleetProperties.vmNamePrefix
  name: vmNamePrefix
  summary: 'VirtualMachine prefix to be used for the virtual machines launched by
    Fleet. Can be used only

    with Launch mode.'
  signature: 'vmNamePrefix: str'
- uid: azure.mgmt.computefleet.types.FleetProperties.vmSizesProfile
  name: vmSizesProfile
  summary: List of VM sizes supported for Compute Fleet. Required.
  signature: 'vmSizesProfile: Required[list[''VmSizeProfile'']]'
- uid: azure.mgmt.computefleet.types.FleetProperties.zoneAllocationPolicy
  name: zoneAllocationPolicy
  summary: Zone Allocation Policy for Fleet.
  signature: 'zoneAllocationPolicy: ZoneAllocationPolicy'
