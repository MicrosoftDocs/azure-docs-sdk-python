### YamlMime:PythonClass
uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties
name: VirtualMachineScaleSetNetworkConfigurationProperties
fullName: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties
module: azure.mgmt.computefleet.types
summary: Describes a virtual machine scale set network profile's IP configuration.
constructor:
  syntax: VirtualMachineScaleSetNetworkConfigurationProperties()
variables:
- description: 'Specifies the primary network interface in case the virtual machine
    has more

    than 1 network interface.'
  name: primary
  types:
  - <xref:bool>
- description: 'Specifies whether the network interface is accelerated

    networking-enabled.'
  name: enable_accelerated_networking
  types:
  - <xref:bool>
- description: 'Specifies whether the network interface is disabled for tcp

    state tracking.'
  name: disable_tcp_state_tracking
  types:
  - <xref:bool>
- description: Specifies whether the network interface is FPGA networking-enabled.
  name: enable_fpga
  types:
  - <xref:bool>
- description: The network security group.
  name: network_security_group
  types:
  - <xref:<xref:"SubResource">>
- description: The dns settings to be applied on the network interfaces.
  name: dns_settings
  types:
  - <xref:<xref:"VirtualMachineScaleSetNetworkConfigurationDnsSettings">>
- description: Specifies the IP configurations of the network interface. Required.
  name: ip_configurations
  types:
  - <xref:list>[<xref:"VirtualMachineScaleSetIPConfiguration">]
- description: Whether IP forwarding enabled on this NIC.
  name: enable_ip_forwarding
  types:
  - <xref:bool>
- description: 'Specify what happens to the network interface when the VM is deleted.

    Known values are: "Delete" and "Detach".'
  name: delete_option
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeleteOptions">]
- description: 'Specifies whether the Auxiliary mode is enabled for the Network Interface

    resource. Known values are: "None", "AcceleratedConnections", and "Floating".'
  name: auxiliary_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkInterfaceAuxiliaryMode">]
- description: 'Specifies whether the Auxiliary sku is enabled for the Network Interface

    resource. Known values are: "None", "A1", "A2", "A4", and "A8".'
  name: auxiliary_sku
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkInterfaceAuxiliarySku">]
attributes:
- uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties.auxiliaryMode
  name: auxiliaryMode
  summary: 'Specifies whether the Auxiliary mode is enabled for the Network Interface
    resource. Known

    values are: "None", "AcceleratedConnections", and "Floating".'
  signature: 'auxiliaryMode: str | NetworkInterfaceAuxiliaryMode'
- uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties.auxiliarySku
  name: auxiliarySku
  summary: 'Specifies whether the Auxiliary sku is enabled for the Network Interface
    resource. Known values

    are: "None", "A1", "A2", "A4", and "A8".'
  signature: 'auxiliarySku: str | NetworkInterfaceAuxiliarySku'
- uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties.deleteOption
  name: deleteOption
  summary: 'Specify what happens to the network interface when the VM is deleted.
    Known values are:

    "Delete" and "Detach".'
  signature: 'deleteOption: str | DeleteOptions'
- uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties.disableTcpStateTracking
  name: disableTcpStateTracking
  summary: Specifies whether the network interface is disabled for tcp state tracking.
  signature: 'disableTcpStateTracking: bool'
- uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties.dnsSettings
  name: dnsSettings
  summary: The dns settings to be applied on the network interfaces.
  signature: 'dnsSettings: VirtualMachineScaleSetNetworkConfigurationDnsSettings'
- uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties.enableAcceleratedNetworking
  name: enableAcceleratedNetworking
  summary: Specifies whether the network interface is accelerated networking-enabled.
  signature: 'enableAcceleratedNetworking: bool'
- uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties.enableFpga
  name: enableFpga
  summary: Specifies whether the network interface is FPGA networking-enabled.
  signature: 'enableFpga: bool'
- uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties.enableIPForwarding
  name: enableIPForwarding
  summary: Whether IP forwarding enabled on this NIC.
  signature: 'enableIPForwarding: bool'
- uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties.ipConfigurations
  name: ipConfigurations
  summary: Specifies the IP configurations of the network interface. Required.
  signature: 'ipConfigurations: Required[list[''VirtualMachineScaleSetIPConfiguration'']]'
- uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties.networkSecurityGroup
  name: networkSecurityGroup
  summary: The network security group.
  signature: 'networkSecurityGroup: SubResource'
- uid: azure.mgmt.computefleet.types.VirtualMachineScaleSetNetworkConfigurationProperties.primary
  name: primary
  summary: 'Specifies the primary network interface in case the virtual machine has
    more than 1 network

    interface.'
  signature: 'primary: bool'
