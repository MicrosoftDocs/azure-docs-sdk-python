### YamlMime:PythonClass
uid: azure.mgmt.redisenterprise.models.AccessPolicyAssignmentProperties
name: AccessPolicyAssignmentProperties
fullName: azure.mgmt.redisenterprise.models.AccessPolicyAssignmentProperties
module: azure.mgmt.redisenterprise.models
summary: Properties of Redis Enterprise database access policy assignment.
constructor:
  syntax: 'AccessPolicyAssignmentProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'Current provisioning status of the access policy assignment. Known

    values are: "Succeeded", "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.redisenterprise.models.ProvisioningState>
- description: '**Deprecated.** This property always returns "default". Use

    `accessString` to configure custom Redis ACL permissions instead.'
  name: access_policy_name
  types:
  - <xref:str>
- description: 'The Redis ACL permissions string applied to this assignment, for example

    `+@read ~cache:*`. Defaults to `+@all ~*` if not specified.'
  name: access_string
  types:
  - <xref:str>
- description: 'Provisioning error details when the access string failed to apply

    (e.g., invalid ACL syntax). Null when provisioning succeeded.'
  name: provisioning_error
  types:
  - <xref:azure.mgmt.redisenterprise.models.AccessPolicyAssignmentProvisioningError>
- description: The user associated with the access policy. Required.
  name: user
  types:
  - <xref:azure.mgmt.redisenterprise.models.AccessPolicyAssignmentPropertiesUser>
attributes:
- uid: azure.mgmt.redisenterprise.models.AccessPolicyAssignmentProperties.access_policy_name
  name: access_policy_name
  summary: '**Deprecated.** This property always returns "default". Use `accessString`
    to configure

    custom Redis ACL permissions instead.'
  signature: 'access_policy_name: str | None'
- uid: azure.mgmt.redisenterprise.models.AccessPolicyAssignmentProperties.access_string
  name: access_string
  summary: 'The Redis ACL permissions string applied to this assignment, for example
