### YamlMime:PythonClass
uid: azure.mgmt.redisenterprise.types.MigrationValidationRequest
name: MigrationValidationRequest
fullName: azure.mgmt.redisenterprise.types.MigrationValidationRequest
module: azure.mgmt.redisenterprise.types
summary: Properties for validating migration from Azure Cache for Redis to Redis Enterprise.
constructor:
  syntax: MigrationValidationRequest()
variables:
- description: 'The source resource ID to validate migration from. This is the

    resource ID of the Azure Cache for Redis. Required.'
  name: source_resource_id
  types:
  - <xref:str>
- description: 'Sets whether the data is migrated from source to target or not. The

    default value is true.'
  name: skip_data_migration
  types:
  - <xref:bool>
- description: 'Sets whether to ignore warnings when validating if the source cache
    can be

    migrated to the target cache. If this property is true, the isValid property in
    the response

    will ignore warning-level disparities between the source and target resource.
    The default value

    is false.'
  name: force_migrate
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.redisenterprise.types.MigrationValidationRequest.forceMigrate
  name: forceMigrate
  summary: 'Sets whether to ignore warnings when validating if the source cache can
    be migrated to the

    target cache. If this property is true, the isValid property in the response will
    ignore

    warning-level disparities between the source and target resource. The default
    value is false.'
  signature: 'forceMigrate: bool'
- uid: azure.mgmt.redisenterprise.types.MigrationValidationRequest.skipDataMigration
  name: skipDataMigration
  summary: Sets whether the data is migrated from source to target or not. The default
    value is true.
  signature: 'skipDataMigration: bool'
- uid: azure.mgmt.redisenterprise.types.MigrationValidationRequest.sourceResourceId
  name: sourceResourceId
  summary: 'The source resource ID to validate migration from. This is the resource
    ID of the Azure Cache

    for Redis. Required.'
  signature: 'sourceResourceId: str'
