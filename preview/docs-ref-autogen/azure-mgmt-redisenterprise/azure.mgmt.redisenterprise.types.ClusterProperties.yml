### YamlMime:PythonClass
uid: azure.mgmt.redisenterprise.types.ClusterProperties
name: ClusterProperties
fullName: azure.mgmt.redisenterprise.types.ClusterProperties
module: azure.mgmt.redisenterprise.types
summary: 'Properties of Redis Enterprise clusters, as opposed to general resource
  properties like

  location, tags.'
constructor:
  syntax: ClusterProperties()
variables:
- description: 'Enabled by default. If highAvailability is disabled, the data set
    is

    not replicated. This affects the availability SLA, and increases the risk of data
    loss. Known

    values are: "Enabled" and "Disabled".'
  name: high_availability
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HighAvailability">]
- description: "The minimum TLS version for the cluster to support, e.g. '1.2'.\n\
    Newer versions can be added in the future. Note that TLS 1.0 and TLS 1.1 are now\
    \ completely\nobsolete \u2013 you cannot use them. They are mentioned only for\
    \ the sake of consistency with old\nAPI versions. Known values are: \"1.0\", \"\
    1.1\", and \"1.2\"."
  name: minimum_tls_version
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TlsVersion">]
- description: Encryption-at-rest configuration for the cluster.
  name: encryption
  types:
  - <xref:<xref:"ClusterPropertiesEncryption">>
- description: Cluster-level maintenance configuration.
  name: maintenance_configuration
  types:
  - <xref:<xref:"MaintenanceConfiguration">>
- description: DNS name of the cluster endpoint.
  name: host_name
  types:
  - <xref:str>
- description: 'Current provisioning status of the cluster. Known values are:

    "Succeeded", "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Explains the current redundancy strategy of the cluster, which affects

    the expected SLA. Known values are: "None", "LR", and "ZR".'
  name: redundancy_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RedundancyMode">]
- description: 'Current resource status of the cluster. Known values are: "Running",

    "Creating", "CreateFailed", "Updating", "UpdateFailed", "Deleting", "DeleteFailed",
    "Enabling",

    "EnableFailed", "Disabling", "DisableFailed", "Disabled", "Scaling", "ScalingFailed",
    and

    "Moving".'
  name: resource_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceState">]
- description: Version of redis the cluster supports, e.g. '6'.
  name: redis_version
  types:
  - <xref:str>
- description: 'List of private endpoint connections associated with the

    specified Redis Enterprise cluster.'
  name: private_endpoint_connections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: 'The endpoint of the source resource that is currently pointing to
    this

    resource as a result of an ACR/ACRE to AMR migration.'
  name: migrated_endpoint
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.redisenterprise.types.ClusterProperties.encryption
  name: encryption
  summary: Encryption-at-rest configuration for the cluster.
  signature: 'encryption: ClusterPropertiesEncryption'
- uid: azure.mgmt.redisenterprise.types.ClusterProperties.highAvailability
  name: highAvailability
  summary: 'Enabled by default. If highAvailability is disabled, the data set is not
    replicated. This

    affects the availability SLA, and increases the risk of data loss. Known values
    are:

    "Enabled" and "Disabled".'
  signature: 'highAvailability: str | HighAvailability'
- uid: azure.mgmt.redisenterprise.types.ClusterProperties.hostName
  name: hostName
  summary: DNS name of the cluster endpoint.
  signature: 'hostName: str'
- uid: azure.mgmt.redisenterprise.types.ClusterProperties.maintenanceConfiguration
  name: maintenanceConfiguration
  summary: Cluster-level maintenance configuration.
  signature: 'maintenanceConfiguration: MaintenanceConfiguration'
- uid: azure.mgmt.redisenterprise.types.ClusterProperties.migratedEndpoint
  name: migratedEndpoint
  summary: 'The endpoint of the source resource that is currently pointing to this
    resource as a result of

    an ACR/ACRE to AMR migration.'
  signature: 'migratedEndpoint: str'
- uid: azure.mgmt.redisenterprise.types.ClusterProperties.minimumTlsVersion
  name: minimumTlsVersion
  summary: "The minimum TLS version for the cluster to support, e.g. '1.2'. Newer\
    \ versions can be added in\nthe future. Note that TLS 1.0 and TLS 1.1 are now\
    \ completely obsolete \u2013 you cannot use them.\nThey are mentioned only for\
    \ the sake of consistency with old API versions. Known values are:\n\"1.0\", \"\
    1.1\", and \"1.2\"."
  signature: 'minimumTlsVersion: str | TlsVersion'
- uid: azure.mgmt.redisenterprise.types.ClusterProperties.privateEndpointConnections
  name: privateEndpointConnections
  summary: List of private endpoint connections associated with the specified Redis
    Enterprise cluster.
  signature: 'privateEndpointConnections: list[''PrivateEndpointConnection'']'
- uid: azure.mgmt.redisenterprise.types.ClusterProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.redisenterprise.types.ClusterProperties.redisVersion
  name: redisVersion
  summary: Version of redis the cluster supports, e.g. '6'.
  signature: 'redisVersion: str'
- uid: azure.mgmt.redisenterprise.types.ClusterProperties.redundancyMode
  name: redundancyMode
  summary: 'Explains the current redundancy strategy of the cluster, which affects
    the expected SLA. Known

    values are: "None", "LR", and "ZR".'
  signature: 'redundancyMode: str | RedundancyMode'
- uid: azure.mgmt.redisenterprise.types.ClusterProperties.resourceState
  name: resourceState
  summary: '"Running", "Creating",

    "CreateFailed", "Updating", "UpdateFailed", "Deleting", "DeleteFailed", "Enabling",

    "EnableFailed", "Disabling", "DisableFailed", "Disabled", "Scaling",

    "ScalingFailed", and "Moving".'
  signature: 'resourceState: str | ResourceState'
