### YamlMime:PythonClass
uid: azure.mgmt.redisenterprise.types.Persistence
name: Persistence
fullName: azure.mgmt.redisenterprise.types.Persistence
module: azure.mgmt.redisenterprise.types
summary: Persistence-related configuration for the Redis Enterprise database.
constructor:
  syntax: Persistence()
variables:
- description: 'Sets whether AOF is enabled. Note that at most one of AOF or RDB persistence

    may be enabled.'
  name: aof_enabled
  types:
  - <xref:bool>
- description: 'Sets whether RDB is enabled. Note that at most one of AOF or RDB persistence

    may be enabled.'
  name: rdb_enabled
  types:
  - <xref:bool>
- description: 'Sets the frequency at which data is written to disk. Defaults to ''1s'',

    meaning ''every second''. Note that the ''always'' setting is deprecated, because
    of its

    performance impact. Known values are: "1s" and "always".'
  name: aof_frequency
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AofFrequency">]
- description: 'Sets the frequency at which a snapshot of the database is created.
    Known

    values are: "1h", "6h", and "12h".'
  name: rdb_frequency
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RdbFrequency">]
attributes:
- uid: azure.mgmt.redisenterprise.types.Persistence.aofEnabled
  name: aofEnabled
  summary: Sets whether AOF is enabled. Note that at most one of AOF or RDB persistence
    may be enabled.
  signature: 'aofEnabled: bool'
- uid: azure.mgmt.redisenterprise.types.Persistence.aofFrequency
  name: aofFrequency
  summary: 'Sets the frequency at which data is written to disk. Defaults to ''1s'',
    meaning ''every second''.

    Note that the ''always'' setting is deprecated, because of its performance impact.
    Known values

    are: "1s" and "always".'
  signature: 'aofFrequency: str | AofFrequency'
- uid: azure.mgmt.redisenterprise.types.Persistence.rdbEnabled
  name: rdbEnabled
  summary: Sets whether RDB is enabled. Note that at most one of AOF or RDB persistence
    may be enabled.
  signature: 'rdbEnabled: bool'
- uid: azure.mgmt.redisenterprise.types.Persistence.rdbFrequency
  name: rdbFrequency
  summary: '"1h",

    "6h", and "12h".'
  signature: 'rdbFrequency: str | RdbFrequency'
