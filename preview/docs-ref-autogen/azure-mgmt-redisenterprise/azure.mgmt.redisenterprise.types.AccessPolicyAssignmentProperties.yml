### YamlMime:PythonClass
uid: azure.mgmt.redisenterprise.types.AccessPolicyAssignmentProperties
name: AccessPolicyAssignmentProperties
fullName: azure.mgmt.redisenterprise.types.AccessPolicyAssignmentProperties
module: azure.mgmt.redisenterprise.types
summary: Properties of Redis Enterprise database access policy assignment.
constructor:
  syntax: AccessPolicyAssignmentProperties()
variables:
- description: 'Current provisioning status of the access policy assignment. Known

    values are: "Succeeded", "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: '**Deprecated.** This property always returns "default". Use

    `accessString` to configure custom Redis ACL permissions instead.'
  name: access_policy_name
  types:
  - <xref:str>
- description: 'The Redis ACL permissions string applied to this assignment, for example

    `+@read ~cache:*`. Defaults to `+@all ~*` if not specified.'
  name: access_string
  types:
  - <xref:str>
- description: 'Provisioning error details when the access string failed to apply

    (e.g., invalid ACL syntax). Null when provisioning succeeded.'
  name: provisioning_error
  types:
  - <xref:<xref:"AccessPolicyAssignmentProvisioningError">>
- description: The user associated with the access policy. Required.
  name: user
  types:
  - <xref:<xref:"AccessPolicyAssignmentPropertiesUser">>
attributes:
- uid: azure.mgmt.redisenterprise.types.AccessPolicyAssignmentProperties.accessPolicyName
  name: accessPolicyName
  summary: '**Deprecated.** This property always returns "default". Use `accessString`
    to configure

    custom Redis ACL permissions instead.'
  signature: 'accessPolicyName: str'
- uid: azure.mgmt.redisenterprise.types.AccessPolicyAssignmentProperties.accessString
  name: accessString
  summary: 'The Redis ACL permissions string applied to this assignment, for example
    `+@read ~cache:*`.

    Defaults to `+@all ~*` if not specified.'
  signature: 'accessString: str'
- uid: azure.mgmt.redisenterprise.types.AccessPolicyAssignmentProperties.provisioningError
  name: provisioningError
  summary: 'Provisioning error details when the access string failed to apply (e.g.,
    invalid ACL syntax).

    Null when provisioning succeeded.'
  signature: 'provisioningError: AccessPolicyAssignmentProvisioningError'
- uid: azure.mgmt.redisenterprise.types.AccessPolicyAssignmentProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.redisenterprise.types.AccessPolicyAssignmentProperties.user
  name: user
  summary: The user associated with the access policy. Required.
  signature: 'user: Required[AccessPolicyAssignmentPropertiesUser]'
