### YamlMime:PythonClass
uid: azure.mgmt.secretsstoreextension.types.SecretSyncProperties
name: SecretSyncProperties
fullName: azure.mgmt.secretsstoreextension.types.SecretSyncProperties
module: azure.mgmt.secretsstoreextension.types
summary: The properties of the SecretSync instance.
constructor:
  syntax: SecretSyncProperties()
variables:
- description: 'SecretProviderClassName specifies the name of the

    SecretProviderClass resource, which contains the information needed to access
    the cloud

    provider secret store. Required.'
  name: secretProviderClassName
  types:
  - <xref:str>
- description: 'ServiceAccountName specifies the name of the service account used
    to

    access the cloud provider secret store. The audience field in the service account
    token must be

    passed as parameter in the controller configuration. The audience is used when
    requesting a

    token from the API server for the service account; the supported audiences are
    defined by each

    provider. Required.'
  name: serviceAccountName
  types:
  - <xref:str>
- description: 'Type specifies the type of the Kubernetes secret object, e.g.

    `Opaque` or `kubernetes.io/tls`. The controller must have permission to create
    secrets of

    the specified type. Required. Known values are: "Opaque" and "kubernetes.io/tls".'
  name: kubernetesSecretType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KubernetesSecretType">]
- description: 'ForceSynchronization can be used to force the secret

    synchronization. The secret synchronization is triggered by changing the value
    in this field.

    This field is not used to resolve synchronization conflicts.'
  name: forceSynchronization
  types:
  - <xref:str>
- description: 'An array of SecretObjectData that maps secret data from the external

    secret provider to the Kubernetes secret. Each entry specifies the source secret
    in the

    external provider and the corresponding key in the Kubernetes secret. Required.'
  name: objectSecretMapping
  types:
  - <xref:list>[<xref:"KubernetesSecretObjectMapping">]
- description: 'SecretSyncStatus defines the observed state of the secret synchronization

    process.'
  name: status
  types:
  - <xref:<xref:"SecretSyncStatus">>
- description: 'Provisioning state of the SecretSync instance. Known values are:

    "Succeeded", "Failed", and "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.secretsstoreextension.types.SecretSyncProperties.forceSynchronization
  name: forceSynchronization
  summary: 'ForceSynchronization can be used to force the secret synchronization.
    The secret

    synchronization is triggered by changing the value in this field. This field is
    not used to

    resolve synchronization conflicts.'
  signature: 'forceSynchronization: str'
- uid: azure.mgmt.secretsstoreextension.types.SecretSyncProperties.kubernetesSecretType
  name: kubernetesSecretType
  summary: 'Type specifies the type of the Kubernetes secret object, e.g. `Opaque`
    or

    `kubernetes.io/tls`. The controller must have permission to create secrets of
    the specified

    type. Required. Known values are: "Opaque" and "kubernetes.io/tls".'
  signature: 'kubernetesSecretType: Required[str | KubernetesSecretType]'
- uid: azure.mgmt.secretsstoreextension.types.SecretSyncProperties.objectSecretMapping
  name: objectSecretMapping
  summary: 'An array of SecretObjectData that maps secret data from the external secret
    provider to the

    Kubernetes secret. Each entry specifies the source secret in the external provider
    and the

    corresponding key in the Kubernetes secret. Required.'
  signature: 'objectSecretMapping: Required[list[''KubernetesSecretObjectMapping'']]'
- uid: azure.mgmt.secretsstoreextension.types.SecretSyncProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", and

    "Canceled".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.secretsstoreextension.types.SecretSyncProperties.secretProviderClassName
  name: secretProviderClassName
  summary: 'SecretProviderClassName specifies the name of the SecretProviderClass
    resource, which contains

    the information needed to access the cloud provider secret store. Required.'
  signature: 'secretProviderClassName: Required[str]'
- uid: azure.mgmt.secretsstoreextension.types.SecretSyncProperties.serviceAccountName
  name: serviceAccountName
  summary: 'ServiceAccountName specifies the name of the service account used to access
    the cloud provider

    secret store. The audience field in the service account token must be passed as
    parameter in

    the controller configuration. The audience is used when requesting a token from
    the API server

    for the service account; the supported audiences are defined by each provider.
    Required.'
  signature: 'serviceAccountName: Required[str]'
- uid: azure.mgmt.secretsstoreextension.types.SecretSyncProperties.status
  name: status
  summary: SecretSyncStatus defines the observed state of the secret synchronization
    process.
  signature: 'status: SecretSyncStatus'
