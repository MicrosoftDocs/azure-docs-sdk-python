uid: azure.mgmt.secretsstoreextension.types.SecretSyncStatus
name: SecretSyncStatus
fullName: azure.mgmt.secretsstoreextension.types.SecretSyncStatus
module: azure.mgmt.secretsstoreextension.types
summary: SecretSyncStatus defines the observed state of the secret synchronization
  process.
constructor:
  syntax: SecretSyncStatus()
variables:
- description: 'LastSuccessfulSyncTime represents the last time the secret was

    retrieved from the Provider and updated.'
  name: lastSuccessfulSyncTime
