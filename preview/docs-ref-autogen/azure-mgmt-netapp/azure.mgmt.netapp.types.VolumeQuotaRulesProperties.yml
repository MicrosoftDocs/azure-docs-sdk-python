    called. Known values are: "Accepted", "Creating", "Patching", "Updating", "Deleting",
    "Moving",

    "Failed", and "Succeeded".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetAppProvisioningState">]
- description: Size of quota.
  name: quotaSizeInKiBs
  types:
  - <xref:int>
