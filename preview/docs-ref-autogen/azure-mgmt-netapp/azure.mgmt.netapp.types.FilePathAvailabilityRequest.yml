### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.FilePathAvailabilityRequest
name: FilePathAvailabilityRequest
fullName: azure.mgmt.netapp.types.FilePathAvailabilityRequest
module: azure.mgmt.netapp.types
summary: File path availability request content - availability is based on the name
  and the subnetId.
constructor:
  syntax: FilePathAvailabilityRequest()
variables:
- description: File path to verify. Required.
  name: name
  types:
  - <xref:str>
- description: 'The Azure Resource URI for a delegated subnet. Must have the delegation

    Microsoft.NetApp/volumes. Required.'
  name: subnetId
  types:
  - <xref:str>
- description: 'The Azure Resource logical availability zone which is used within
    zone

    mapping lookup for the subscription and region. The lookup will retrieve the physical
    zone

    where volume is placed.'
  name: availabilityZone
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.netapp.types.FilePathAvailabilityRequest.availabilityZone
  name: availabilityZone
  summary: 'The Azure Resource logical availability zone which is used within zone
    mapping lookup for the

    subscription and region. The lookup will retrieve the physical zone where volume
    is placed.'
  signature: 'availabilityZone: str | None'
- uid: azure.mgmt.netapp.types.FilePathAvailabilityRequest.name
  name: name
  summary: File path to verify. Required.
  signature: 'name: str'
- uid: azure.mgmt.netapp.types.FilePathAvailabilityRequest.subnetId
  name: subnetId
  summary: 'The Azure Resource URI for a delegated subnet. Must have the delegation

    Microsoft.NetApp/volumes. Required.'
  signature: 'subnetId: str'
