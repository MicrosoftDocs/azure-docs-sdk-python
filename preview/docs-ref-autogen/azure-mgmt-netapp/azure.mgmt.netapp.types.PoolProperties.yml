### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.PoolProperties
name: PoolProperties
fullName: azure.mgmt.netapp.types.PoolProperties
module: azure.mgmt.netapp.types
summary: Pool properties.
constructor:
  syntax: PoolProperties()
variables:
- description: UUID v4 used to identify the Pool.
  name: pool_id
  types:
  - <xref:str>
- description: 'Provisioned size of the pool (in bytes). Allowed values are 512GiB
    (549755813888

    bytes) or in 1TiB chunks (value must be multiple of 1099511627776). Required.'
  name: size
  types:
  - <xref:int>
- description: 'The service level of the file system. Required. Known values are:

    "Standard", "Premium", "Ultra", "StandardZRS", and "Flexible".'
  name: service_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServiceLevel">]
- description: Azure lifecycle management.
  name: provisioning_state
  types:
  - <xref:str>
- description: Total throughput of pool in MiB/s.
  name: total_throughput_mibps
  types:
  - <xref:float>
- description: Utilized throughput of pool in MiB/s.
  name: utilized_throughput_mibps
  types:
  - <xref:float>
- description: 'Maximum throughput in MiB/s that can be achieved by this pool

    and this will be accepted as input only for manual qosType pool with Flexible
    service level.'
  name: custom_throughput_mibps
  types:
  - <xref:int>
- description: 'The qos type of the pool. Known values are: "Auto" and "Manual".'
  name: qos_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"QosType">]
- description: If enabled (true) the pool can contain cool Access enabled volumes.
  name: cool_access
  types:
  - <xref:bool>
- description: 'Encryption type of the capacity pool, set encryption type for data
    at

    rest for this pool and all volumes in it. This value can only be set when creating
    new pool.

    Known values are: "Single" and "Double".'
  name: encryption_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EncryptionType">]
attributes:
- uid: azure.mgmt.netapp.types.PoolProperties.coolAccess
  name: coolAccess
  summary: If enabled (true) the pool can contain cool Access enabled volumes.
  signature: 'coolAccess: bool'
- uid: azure.mgmt.netapp.types.PoolProperties.customThroughputMibps
  name: customThroughputMibps
  summary: 'Maximum throughput in MiB/s that can be achieved by this pool and this
    will be accepted as

    input only for manual qosType pool with Flexible service level.'
  signature: 'customThroughputMibps: int | None'
- uid: azure.mgmt.netapp.types.PoolProperties.encryptionType
  name: encryptionType
  summary: 'Encryption type of the capacity pool, set encryption type for data at
    rest for this pool and

    all volumes in it. This value can only be set when creating new pool. Known values
    are:

    "Single" and "Double".'
  signature: 'encryptionType: str | EncryptionType | None'
- uid: azure.mgmt.netapp.types.PoolProperties.poolId
  name: poolId
  summary: UUID v4 used to identify the Pool.
  signature: 'poolId: str'
- uid: azure.mgmt.netapp.types.PoolProperties.provisioningState
  name: provisioningState
  summary: Azure lifecycle management.
  signature: 'provisioningState: str'
- uid: azure.mgmt.netapp.types.PoolProperties.qosType
  name: qosType
  summary: '"Auto" and "Manual".'
  signature: 'qosType: str | QosType'
- uid: azure.mgmt.netapp.types.PoolProperties.serviceLevel
  name: serviceLevel
  summary: '"Standard", "Premium",

    "Ultra", "StandardZRS", and "Flexible".'
  signature: 'serviceLevel: Required[str | ServiceLevel]'
- uid: azure.mgmt.netapp.types.PoolProperties.size
  name: size
  summary: 'Provisioned size of the pool (in bytes). Allowed values are 512GiB (549755813888
    bytes) or in

    1TiB chunks (value must be multiple of 1099511627776). Required.'
  signature: 'size: Required[int]'
- uid: azure.mgmt.netapp.types.PoolProperties.totalThroughputMibps
  name: totalThroughputMibps
  summary: Total throughput of pool in MiB/s.
  signature: 'totalThroughputMibps: float'
- uid: azure.mgmt.netapp.types.PoolProperties.utilizedThroughputMibps
  name: utilizedThroughputMibps
  summary: Utilized throughput of pool in MiB/s.
  signature: 'utilizedThroughputMibps: float'
