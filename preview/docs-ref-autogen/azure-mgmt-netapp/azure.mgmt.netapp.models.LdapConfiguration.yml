### YamlMime:PythonClass
uid: azure.mgmt.netapp.models.LdapConfiguration
name: LdapConfiguration
fullName: azure.mgmt.netapp.models.LdapConfiguration
module: azure.mgmt.netapp.models
summary: LDAP configuration.
constructor:
  syntax: 'LdapConfiguration(*args: Any, **kwargs: Any)'
variables:
- description: Name of the LDAP configuration domain.
  name: domain
  types:
  - <xref:str>
- description: List of LDAP server IP addresses (IPv4 only) for the LDAP domain.
  name: ldap_servers
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates the secure LDAP mode for encrypting communication between
    ANF

    storage and customer LDAP servers. Known values are: "LdapOverTLS" and "None".'
  name: secure_ldap_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.netapp.models.SecureLdapType>
- description: 'When LDAP over SSL/TLS is enabled, the LDAP client is required to

    have base64 encoded ldap servers CA certificate.'
  name: server_ca_certificate
  types:
  - <xref:str>
- description: 'The CN host name used while generating the certificate, LDAP Over

    TLS requires the CN host name to create DNS host entry.'
  name: certificate_cn_host
  types:
  - <xref:str>
- description: 'List of DNS server IPv4 addresses for resolving the CN host certificate.

    This parameter is used when LDAP over TLS is enabled.'
  name: dns_servers
  types:
  - <xref:list>[<xref:str>]
- description: Port number for LDAP communication. Default is 389 for LDAP.
  name: ldap_port
  types:
  - <xref:int>
- description: 'This specifies the user DN (Distinguished Name), which overrides the
    base DN for

    user lookups.'
  name: user_dn
  types:
  - <xref:str>
- description: 'This specifies the group DN (Distinguished Name), which overrides
    the base DN

    for group lookups.'
  name: group_dn
  types:
  - <xref:str>
- description: 'This specifies the netgroup DN (Distinguished Name), which overrides
    the

    base DN for netgroup lookups.'
  name: net_group_dn
  types:
  - <xref:str>
- description: 'The authentication level to use when binding to the LDAP

    server, defaults to Anonymous. Known values are: "Anonymous" and "Simple".'
  name: bind_authentication_level
  types:
  - <xref:str>
  - <xref:azure.mgmt.netapp.models.BindAuthenticationLevel>
- description: The distinguished name (DN) to bind as when performing LDAP operations.
  name: bind_dn
  types:
  - <xref:str>
- description: 'The Azure Key Vault configuration where the Bind DN

    (Distinguished Name) user password is stored.'
  name: bind_password_akv_config
  types:
  - <xref:azure.mgmt.netapp.models.BindPasswordAkvConfig>
