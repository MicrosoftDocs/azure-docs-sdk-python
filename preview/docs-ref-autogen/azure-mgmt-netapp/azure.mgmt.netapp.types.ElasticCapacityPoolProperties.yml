### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.ElasticCapacityPoolProperties
name: ElasticCapacityPoolProperties
fullName: azure.mgmt.netapp.types.ElasticCapacityPoolProperties
module: azure.mgmt.netapp.types
summary: Elastic capacity pool properties.
constructor:
  syntax: ElasticCapacityPoolProperties()
variables:
- description: 'Provisioned size of the pool (in bytes). For zoneRedundant service
    level pool,

    value must be in the range 1TiB to 16TiB or 1TiB to 128TiB for supported region.
    Values

    expressed in bytes as multiples of 1TiB till 16TiB and in multiples of 8TiB from
    24TiB to

    128TiB. Pool size can''t be shrunk once it is created. Required.'
  name: size
  types:
  - <xref:int>
- description: The service level of the elastic capacity pool. Required. "ZoneRedundant"
  name: serviceLevel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ElasticServiceLevel">]
- description: 'Azure lifecycle management. Known values are: "Accepted", "Creating",

    "Patching", "Updating", "Deleting", "Moving", "Failed", and "Succeeded".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetAppProvisioningState">]
- description: Encryption settings.
  name: encryption
  types:
  - <xref:<xref:"ElasticEncryptionConfiguration">>
- description: Total throughput of the pool in MiB/s.
  name: totalThroughputMibps
  types:
  - <xref:float>
- description: 'The Azure Resource URI for a delegated subnet. Must have the delegation

    Microsoft.NetApp/elasticVolumes, this is used by all the volumes within the pool.
    Required.'
  name: subnetResourceId
  types:
  - <xref:str>
- description: 'Indicates the current zone of the pool. This can be changed for

    zoneRedundant service level pool with the changeZone action.'
  name: currentZone
  types:
  - <xref:str>
- description: 'Current availability status of the resource. Known values are:

    "Online" and "Offline".'
  name: availabilityStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ElasticResourceAvailabilityStatus">]
- description: 'The Azure Resource URI for an Active Directory

    configuration. This is used by all the SMB volumes within the pool.'
  name: activeDirectoryConfigResourceId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.netapp.types.ElasticCapacityPoolProperties.activeDirectoryConfigResourceId
  name: activeDirectoryConfigResourceId
  summary: 'The Azure Resource URI for an Active Directory configuration. This is
    used by all the SMB

    volumes within the pool.'
  signature: 'activeDirectoryConfigResourceId: str'
- uid: azure.mgmt.netapp.types.ElasticCapacityPoolProperties.availabilityStatus
  name: availabilityStatus
  summary: '"Online" and "Offline".'
  signature: 'availabilityStatus: str | ElasticResourceAvailabilityStatus'
- uid: azure.mgmt.netapp.types.ElasticCapacityPoolProperties.currentZone
  name: currentZone
  summary: 'Indicates the current zone of the pool. This can be changed for zoneRedundant
    service level

    pool with the changeZone action.'
  signature: 'currentZone: str'
- uid: azure.mgmt.netapp.types.ElasticCapacityPoolProperties.encryption
  name: encryption
  summary: Encryption settings.
  signature: 'encryption: ElasticEncryptionConfiguration'
- uid: azure.mgmt.netapp.types.ElasticCapacityPoolProperties.provisioningState
  name: provisioningState
  summary: '"Accepted", "Creating", "Patching",

    "Updating", "Deleting", "Moving", "Failed", and "Succeeded".'
  signature: 'provisioningState: str | NetAppProvisioningState'
- uid: azure.mgmt.netapp.types.ElasticCapacityPoolProperties.serviceLevel
  name: serviceLevel
  summary: The service level of the elastic capacity pool. Required. "ZoneRedundant"
  signature: 'serviceLevel: Required[str | ElasticServiceLevel]'
- uid: azure.mgmt.netapp.types.ElasticCapacityPoolProperties.size
  name: size
  summary: 'Provisioned size of the pool (in bytes). For zoneRedundant service level
    pool, value must be in

    the range 1TiB to 16TiB or 1TiB to 128TiB for supported region. Values expressed
    in bytes as

    multiples of 1TiB till 16TiB and in multiples of 8TiB from 24TiB to 128TiB. Pool
    size can''t be

    shrunk once it is created. Required.'
  signature: 'size: Required[int]'
- uid: azure.mgmt.netapp.types.ElasticCapacityPoolProperties.subnetResourceId
  name: subnetResourceId
  summary: 'The Azure Resource URI for a delegated subnet. Must have the delegation

    Microsoft.NetApp/elasticVolumes, this is used by all the volumes within the pool.
    Required.'
  signature: 'subnetResourceId: Required[str]'
- uid: azure.mgmt.netapp.types.ElasticCapacityPoolProperties.totalThroughputMibps
  name: totalThroughputMibps
  summary: Total throughput of the pool in MiB/s.
  signature: 'totalThroughputMibps: float'
