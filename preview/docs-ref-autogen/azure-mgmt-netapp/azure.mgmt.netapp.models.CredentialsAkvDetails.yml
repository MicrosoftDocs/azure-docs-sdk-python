uid: azure.mgmt.netapp.models.CredentialsAkvDetails
name: CredentialsAkvDetails
fullName: azure.mgmt.netapp.models.CredentialsAkvDetails
module: azure.mgmt.netapp.models
summary: Specifies the Azure Key Vault settings for storing the bucket credentials.
constructor:
  syntax: 'CredentialsAkvDetails(*args: Any, **kwargs: Any)'
variables:
- description: 'The base URI of the Azure Key Vault that is used when storing

    the bucket credentials.'
  name: credentials_key_vault_uri
  types:
  - <xref:str>
- description: 'The name of the secret stored in Azure Key Vault. The associated key
    pair

    has the following structure:


    {

    "access_key_id": "<REDACTED>",

    "secret_access_key": "<REDACTED>"

    }.'
  name: secret_name
  types:
  - <xref:str>
- description: 'Optional resource ID of the managed identity that has access to

    the Azure Key Vault (AKV) secret. If a value is provided, it is used to find a
    matching entry

    in the account''s collection of user-assigned managed identities. If no match
    is found, an

    exception is thrown. If no value is provided, the system-assigned managed identity
    is used.'
  name: user_assigned_identity
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.netapp.models.CredentialsAkvDetails.credentials_key_vault_uri
  name: credentials_key_vault_uri
  summary: The base URI of the Azure Key Vault that is used when storing the bucket
    credentials.
  signature: 'credentials_key_vault_uri: str | None'
- uid: azure.mgmt.netapp.models.CredentialsAkvDetails.secret_name
  name: secret_name
  summary: 'The name of the secret stored in Azure Key Vault. The associated key pair
    has the following

    structure:


    {

    "access_key_id": "<REDACTED>",

    "secret_access_key": "<REDACTED>"

    }.'
  signature: 'secret_name: str | None'
- uid: azure.mgmt.netapp.models.CredentialsAkvDetails.user_assigned_identity
  name: user_assigned_identity
  summary: 'Optional resource ID of the managed identity that has access to the Azure
    Key Vault (AKV)

    secret. If a value is provided, it is used to find a matching entry in the account''s
