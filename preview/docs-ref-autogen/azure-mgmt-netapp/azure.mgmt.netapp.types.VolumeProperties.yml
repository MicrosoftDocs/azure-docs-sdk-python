### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.VolumeProperties
name: VolumeProperties
fullName: azure.mgmt.netapp.types.VolumeProperties
module: azure.mgmt.netapp.types
summary: Volume properties.
constructor:
  syntax: VolumeProperties()
variables:
- description: Unique FileSystem Identifier.
  name: fileSystemId
  types:
  - <xref:str>
- description: 'A unique file path for the volume. Used when creating mount targets.

    Required.'
  name: creationToken
  types:
  - <xref:str>
- description: 'The service level of the file system. Known values are: "Standard",

    "Premium", "Ultra", "StandardZRS", and "Flexible".'
  name: serviceLevel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServiceLevel">]
- description: 'Maximum storage quota allowed for a file system in bytes. This is
    a soft

    quota used for alerting only. For regular volumes, valid values are in the range
    50GiB to

    100TiB. For large volumes, valid values are in the range 100TiB to 500TiB, and
    on an

    exceptional basis, from to 2400GiB to 2400TiB. For extra large volumes, valid
    values are in the

    range 2400GiB to 7200TiB. Values expressed in bytes as multiples of 1 GiB. Required.'
  name: usageThreshold
  types:
  - <xref:int>
- description: Set of export policy rules.
  name: exportPolicy
  types:
  - <xref:<xref:"VolumePropertiesExportPolicy">>
- description: 'Specify the protocol types for the volume. Supported values are NFSv3,

    NFSv4.1, and CIFS. For SMB volumes, specify CIFS. The value SMB isn''t supported
    in the

    protocolTypes property. Default: NFSv3.'
  name: protocolTypes
  types:
  - <xref:list>[<xref:str>]
- description: Azure lifecycle management.
  name: provisioningState
  types:
  - <xref:str>
- description: Resource identifier used to identify the Snapshot.
  name: snapshotId
  types:
  - <xref:str>
- description: 'If enabled (true) the snapshot the volume was created from will be

    automatically deleted after the volume create operation has finished.  Defaults
    to false.'
  name: deleteBaseSnapshot
  types:
  - <xref:bool>
- description: Resource identifier used to identify the Backup.
  name: backupId
  types:
  - <xref:str>
- description: Unique Baremetal Tenant Identifier.
  name: baremetalTenantId
  types:
  - <xref:str>
- description: 'The Azure Resource URI for a delegated subnet. Must have the delegation

    Microsoft.NetApp/volumes. Required.'
  name: subnetId
  types:
  - <xref:str>
- description: 'The original value of the network features type available to the volume

    at the time it was created. Known values are: "Basic", "Standard", "Basic_Standard",
    and

    "Standard_Basic".'
  name: networkFeatures
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkFeatures">]
- description: 'The effective value of the network features type available to

    the volume, or current effective state of update. Known values are: "Basic", "Standard",

    "Basic_Standard", and "Standard_Basic".'
  name: effectiveNetworkFeatures
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkFeatures">]
- description: 'Network Sibling Set ID for the the group of volumes sharing

    networking resources.'
  name: networkSiblingSetId
  types:
  - <xref:str>
- description: 'Provides storage to network proximity information for the

    volume. Known values are: "Default", "T1", "T2", and "AcrossT2".'
  name: storageToNetworkProximity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VolumeStorageToNetworkProximity">]
- description: List of mount targets.
  name: mountTargets
  types:
  - <xref:list>[<xref:"MountTargetProperties">]
- description: 'What type of volume is this. For destination volumes in Cross Region

    Replication, set type to DataProtection. For creating clone volume, set type to
    ShortTermClone.'
  name: volumeType
  types:
  - <xref:str>
- description: 'DataProtection type volumes include an object containing details of
    the

    replication.'
  name: dataProtection
  types:
  - <xref:<xref:"VolumePropertiesDataProtection">>
- description: 'While auto splitting the short term clone

    volume, if the parent pool does not have enough space to accommodate the volume
    after split, it

    will be automatically resized, which will lead to increased billing. To accept
    capacity pool

    size auto grow and create a short term clone volume, set the property as accepted.
    Known values

    are: "Accepted" and "Declined".'
  name: acceptGrowCapacityPoolForShortTermCloneSplit
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AcceptGrowCapacityPoolForShortTermCloneSplit">]
- description: Restoring.
  name: isRestoring
  types:
  - <xref:bool>
- description: 'If enabled (true) the volume will contain a read-only snapshot

    directory which provides access to each of the volume''s snapshots (defaults to
    true).'
  name: snapshotDirectoryVisible
  types:
  - <xref:bool>
- description: 'Describe if a volume is KerberosEnabled. To be use with swagger version

    2020-05-01 or later.'
  name: kerberosEnabled
  types:
  - <xref:bool>
- description: 'The security style of volume, default unix, defaults to ntfs for dual

    protocol or CIFS protocol. Known values are: "ntfs" and "unix".'
  name: securityStyle
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityStyle">]
- description: 'Enables encryption for in-flight smb3 data. Only applicable for

    SMB/DualProtocol volume. To be used with swagger version 2020-08-01 or later.'
  name: smbEncryption
  types:
  - <xref:bool>
- description: 'Enables access-based enumeration share property for SMB

    Shares. Only applicable for SMB/DualProtocol volume. Known values are: "Disabled"
    and

    "Enabled".'
  name: smbAccessBasedEnumeration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SmbAccessBasedEnumeration">]
- description: 'Enables non-browsable property for SMB Shares. Only applicable for

    SMB/DualProtocol volume. Known values are: "Disabled" and "Enabled".'
  name: smbNonBrowsable
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SmbNonBrowsable">]
- description: 'Enables continuously available share property for smb volume.

    Only applicable for SMB volume.'
  name: smbContinuouslyAvailable
  types:
  - <xref:bool>
- description: 'Maximum throughput in MiB/s that can be achieved by this volume and
    this

    will be accepted as input only for manual qosType volume.'
  name: throughputMibps
  types:
  - <xref:float>
- description: 'Actual throughput in MiB/s for auto qosType volumes calculated

    based on size and serviceLevel.'
  name: actualThroughputMibps
  types:
  - <xref:float>
- description: 'Source of key used to encrypt data in volume. Applicable if NetApp

    account has encryption.keySource = ''Microsoft.KeyVault''. Possible values (case-insensitive)

    are: ''Microsoft.NetApp, Microsoft.KeyVault''. Known values are: "Microsoft.NetApp"
    and

    "Microsoft.KeyVault".'
  name: encryptionKeySource
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EncryptionKeySource">]
- description: 'The resource ID of private endpoint for KeyVault. It

    must reside in the same VNET as the volume. Only applicable if encryptionKeySource
    =

    ''Microsoft.KeyVault''.'
  name: keyVaultPrivateEndpointResourceId
  types:
  - <xref:str>
- description: Specifies whether LDAP is enabled or not for a given NFS volume.
  name: ldapEnabled
  types:
  - <xref:bool>
- description: 'Specifies the type of LDAP server for a given NFS volume. Known values

    are: "ActiveDirectory" and "OpenLDAP".'
  name: ldapServerType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LdapServerType">]
- description: Specifies whether Cool Access(tiering) is enabled for the volume.
  name: coolAccess
  types:
  - <xref:bool>
- description: 'Specifies the number of days after which data that is not accessed
    by

    clients will be tiered.'
  name: coolnessPeriod
  types:
  - <xref:int>
- description: 'coolAccessRetrievalPolicy determines the data retrieval

    behavior from the cool tier to standard storage based on the read pattern for
    cool access

    enabled volumes. The possible values for this field are: Default - Data will be
    pulled from

    cool tier to standard storage on random reads. This policy is the default. OnRead
    - All

    client-driven data read is pulled from cool tier to standard storage on both sequential
    and

    random reads. Never - No client-driven data is pulled from cool tier to standard
    storage. Known

    values are: "Default", "OnRead", and "Never".'
  name: coolAccessRetrievalPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CoolAccessRetrievalPolicy">]
- description: 'coolAccessTieringPolicy determines which cold data blocks are

    moved to cool tier. The possible values for this field are: Auto - Moves cold
    user data blocks

    in both the Snapshot copies and the active file system to the cool tier tier.
    This policy is

    the default. SnapshotOnly - Moves user data blocks of the Volume Snapshot copies
    that are not

    associated with the active file system to the cool tier. Known values are: "Auto"
    and

    "SnapshotOnly".'
  name: coolAccessTieringPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CoolAccessTieringPolicy">]
- description: 'UNIX permissions for NFS volume accepted in octal 4 digit format.
    First

    digit selects the set user ID(4), set group ID (2) and sticky (1) attributes.
    Second digit

    selects permission for the owner of the file: read (4), write (2) and execute
    (1). Third

    selects permissions for other users in the same group. the fourth for other users
    not in the

    group. 0755 - gives read/write/execute permissions to owner and read/execute to
    group and other

    users.'
  name: unixPermissions
  types:
  - <xref:str>
- description: 'When a volume is being restored from another volume''s snapshot, will
    show

    the percentage completion of this cloning process. When this value is empty/null
    there is no

    cloning process currently happening on this volume. This value will update every
    5 minutes

    during cloning.'
  name: cloneProgress
  types:
  - <xref:int>
- description: 'Flag indicating whether file access logs are enabled for the volume,

    based on active diagnostic settings present on the volume. Known values are: "Enabled"
    and

    "Disabled".'
  name: fileAccessLogs
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FileAccessLogs">]
- description: 'Specifies whether the volume is enabled for Azure VMware Solution
    (AVS)

    datastore purpose. Known values are: "Enabled" and "Disabled".'
  name: avsDataStore
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AvsDataStore">]
- description: Data store resource unique identifier.
  name: dataStoreResourceId
  types:
  - <xref:list>[<xref:str>]
- description: Specifies if default quota is enabled for the volume.
  name: isDefaultQuotaEnabled
  types:
  - <xref:bool>
- description: 'Default user quota for volume in KiBs. If isDefaultQuotaEnabled

    is set, the minimum value of 4 KiBs applies .'
  name: defaultUserQuotaInKiBs
  types:
  - <xref:int>
- description: 'Default group quota for volume in KiBs. If isDefaultQuotaEnabled

    is set, the minimum value of 4 KiBs applies.'
  name: defaultGroupQuotaInKiBs
  types:
  - <xref:int>
- description: 'Maximum number of files allowed. Needs a service request in order

    to be changed. Only allowed to be changed if volume quota is more than 4TiB.'
  name: maximumNumberOfFiles
  types:
  - <xref:int>
- description: Volume Group Name.
  name: volumeGroupName
  types:
  - <xref:str>
- description: 'Pool Resource Id used in case of creating a volume through volume

    group.'
  name: capacityPoolResourceId
  types:
  - <xref:str>
- description: Proximity placement group associated with the volume.
  name: proximityPlacementGroup
  types:
  - <xref:str>
- description: T2 network information.
  name: t2Network
  types:
  - <xref:str>
- description: 'Volume spec name is the application specific designation or identifier

    for the particular volume in a volume group for e.g. data, log.'
  name: volumeSpecName
  types:
  - <xref:str>
- description: 'Specifies if the volume is encrypted or not. Only available on volumes
    created

    or updated after 2022-01-01.'
  name: encrypted
  types:
  - <xref:bool>
- description: Application specific placement rules for the particular volume.
  name: placementRules
  types:
  - <xref:list>[<xref:"PlacementKeyValuePairs">]
- description: 'Flag indicating whether subvolume operations are enabled on the volume

    Deprecated. Subvolume operations and this flag will be removed in a future API
    version. Known

    values are: "Enabled" and "Disabled".'
  name: enableSubvolumes
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EnableSubvolumes">]
- description: 'The availability zone where the volume is provisioned. This

    refers to the logical availability zone where the volume resides.'
  name: provisionedAvailabilityZone
  types:
  - <xref:str>
- description: Specifies whether volume is a Large Volume or Regular Volume.
  name: isLargeVolume
  types:
  - <xref:bool>
- description: 'Specifies the type of the Large Volume. When set to ''LargeVolume'',
    the

    large volume is created with standard configuration. If it is set to

    ''ExtraLargeVolume7Dot2PiB'', the extra large volume is created with higher capacity
    limit 7.2PiB

    with cool access enabled, delivering higher capacity limit with lower costs. Known
    values are:

    "LargeVolume" and "PremExtraLargeVolume7Dot2PiB".'
  name: largeVolumeType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LargeVolumeType">]
- description: Id of the snapshot or backup that the volume is restored from.
  name: originatingResourceId
  types:
  - <xref:str>
- description: 'Space shared by short term clone volume with parent volume in

    bytes.'
  name: inheritedSizeInBytes
  types:
  - <xref:int>
- description: 'Language supported for volume. Known values are: "c.utf-8", "utf8mb4",
    "ar",

    "ar.utf-8", "hr", "hr.utf-8", "cs", "cs.utf-8", "da", "da.utf-8", "nl", "nl.utf-8",
    "en",

    "en.utf-8", "fi", "fi.utf-8", "fr", "fr.utf-8", "de", "de.utf-8", "he", "he.utf-8",
    "hu",

    "hu.utf-8", "it", "it.utf-8", "ja", "ja.utf-8", "ja-v1", "ja-v1.utf-8", "ja-jp.pck",

    "ja-jp.pck.utf-8", "ja-jp.932", "ja-jp.932.utf-8", "ja-jp.pck-v2", "ja-jp.pck-v2.utf-8",
    "ko",

    "ko.utf-8", "no", "no.utf-8", "pl", "pl.utf-8", "pt", "pt.utf-8", "c", "ro", "ro.utf-8",
    "ru",

    "ru.utf-8", "zh", "zh.utf-8", "zh.gbk", "zh.gbk.utf-8", "zh-tw.big5", "zh-tw.big5.utf-8",

    "zh-tw", "zh-tw.utf-8", "sk", "sk.utf-8", "sl", "sl.utf-8", "es", "es.utf-8",
    "sv", "sv.utf-8",

    "tr", "tr.utf-8", "en-us", and "en-us.utf-8".'
  name: language
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VolumeLanguage">]
- description: 'Specifies whether the volume operates in Breakthrough Mode. Known

    values are: "Enabled" and "Disabled".'
  name: breakthroughMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BreakthroughMode">]
attributes:
- uid: azure.mgmt.netapp.types.VolumeProperties.acceptGrowCapacityPoolForShortTermCloneSplit
  name: acceptGrowCapacityPoolForShortTermCloneSplit
  summary: 'While auto splitting the short term clone volume, if the parent pool does
    not have enough space

    to accommodate the volume after split, it will be automatically resized, which
    will lead to

    increased billing. To accept capacity pool size auto grow and create a short term
    clone volume,

    set the property as accepted. Known values are: "Accepted" and "Declined".'
  signature: 'acceptGrowCapacityPoolForShortTermCloneSplit: str | AcceptGrowCapacityPoolForShortTermCloneSplit'
- uid: azure.mgmt.netapp.types.VolumeProperties.actualThroughputMibps
  name: actualThroughputMibps
  summary: Actual throughput in MiB/s for auto qosType volumes calculated based on
    size and serviceLevel.
  signature: 'actualThroughputMibps: float'
- uid: azure.mgmt.netapp.types.VolumeProperties.avsDataStore
  name: avsDataStore
  summary: 'Specifies whether the volume is enabled for Azure VMware Solution (AVS)
    datastore purpose.

    Known values are: "Enabled" and "Disabled".'
  signature: 'avsDataStore: str | AvsDataStore'
- uid: azure.mgmt.netapp.types.VolumeProperties.backupId
  name: backupId
  summary: Resource identifier used to identify the Backup.
  signature: 'backupId: str | None'
- uid: azure.mgmt.netapp.types.VolumeProperties.baremetalTenantId
  name: baremetalTenantId
  summary: Unique Baremetal Tenant Identifier.
  signature: 'baremetalTenantId: str'
- uid: azure.mgmt.netapp.types.VolumeProperties.breakthroughMode
  name: breakthroughMode
  summary: '"Enabled" and

    "Disabled".'
  signature: 'breakthroughMode: str | BreakthroughMode'
- uid: azure.mgmt.netapp.types.VolumeProperties.capacityPoolResourceId
  name: capacityPoolResourceId
  summary: Pool Resource Id used in case of creating a volume through volume group.
  signature: 'capacityPoolResourceId: str'
- uid: azure.mgmt.netapp.types.VolumeProperties.cloneProgress
  name: cloneProgress
  summary: 'When a volume is being restored from another volume''s snapshot, will
    show the percentage

    completion of this cloning process. When this value is empty/null there is no
    cloning process

    currently happening on this volume. This value will update every 5 minutes during
    cloning.'
  signature: 'cloneProgress: int | None'
- uid: azure.mgmt.netapp.types.VolumeProperties.coolAccess
  name: coolAccess
  summary: Specifies whether Cool Access(tiering) is enabled for the volume.
  signature: 'coolAccess: bool'
- uid: azure.mgmt.netapp.types.VolumeProperties.coolAccessRetrievalPolicy
  name: coolAccessRetrievalPolicy
  summary: 'coolAccessRetrievalPolicy determines the data retrieval behavior from
    the cool tier to standard

    storage based on the read pattern for cool access enabled volumes. The possible
    values for this

    field are: Default - Data will be pulled from cool tier to standard storage on
    random reads.

    This policy is the default. OnRead - All client-driven data read is pulled from
    cool tier to

    standard storage on both sequential and random reads. Never - No client-driven
    data is pulled

    from cool tier to standard storage. Known values are: "Default", "OnRead", and
    "Never".'
  signature: 'coolAccessRetrievalPolicy: str | CoolAccessRetrievalPolicy'
- uid: azure.mgmt.netapp.types.VolumeProperties.coolAccessTieringPolicy
  name: coolAccessTieringPolicy
  summary: 'coolAccessTieringPolicy determines which cold data blocks are moved to
    cool tier. The possible

    values for this field are: Auto - Moves cold user data blocks in both the Snapshot
    copies and

    the active file system to the cool tier tier. This policy is the default. SnapshotOnly
    - Moves

    user data blocks of the Volume Snapshot copies that are not associated with the
    active file

    system to the cool tier. Known values are: "Auto" and "SnapshotOnly".'
  signature: 'coolAccessTieringPolicy: str | CoolAccessTieringPolicy'
- uid: azure.mgmt.netapp.types.VolumeProperties.coolnessPeriod
  name: coolnessPeriod
  summary: Specifies the number of days after which data that is not accessed by clients
    will be tiered.
  signature: 'coolnessPeriod: int'
- uid: azure.mgmt.netapp.types.VolumeProperties.creationToken
  name: creationToken
  summary: A unique file path for the volume. Used when creating mount targets. Required.
  signature: 'creationToken: Required[str]'
- uid: azure.mgmt.netapp.types.VolumeProperties.dataProtection
  name: dataProtection
  summary: DataProtection type volumes include an object containing details of the
    replication.
  signature: 'dataProtection: VolumePropertiesDataProtection'
- uid: azure.mgmt.netapp.types.VolumeProperties.dataStoreResourceId
  name: dataStoreResourceId
  summary: Data store resource unique identifier.
  signature: 'dataStoreResourceId: list[str]'
- uid: azure.mgmt.netapp.types.VolumeProperties.defaultGroupQuotaInKiBs
  name: defaultGroupQuotaInKiBs
  summary: 'Default group quota for volume in KiBs. If isDefaultQuotaEnabled is set,
    the minimum value of 4

    KiBs applies.'
  signature: 'defaultGroupQuotaInKiBs: int'
- uid: azure.mgmt.netapp.types.VolumeProperties.defaultUserQuotaInKiBs
  name: defaultUserQuotaInKiBs
  summary: 'Default user quota for volume in KiBs. If isDefaultQuotaEnabled is set,
    the minimum value of 4

    KiBs applies .'
  signature: 'defaultUserQuotaInKiBs: int'
- uid: azure.mgmt.netapp.types.VolumeProperties.deleteBaseSnapshot
  name: deleteBaseSnapshot
  summary: 'If enabled (true) the snapshot the volume was created from will be automatically
    deleted after

    the volume create operation has finished.  Defaults to false.'
  signature: 'deleteBaseSnapshot: bool'
- uid: azure.mgmt.netapp.types.VolumeProperties.effectiveNetworkFeatures
  name: effectiveNetworkFeatures
  summary: 'The effective value of the network features type available to the volume,
    or current effective

    state of update. Known values are: "Basic", "Standard", "Basic_Standard", and

    "Standard_Basic".'
  signature: 'effectiveNetworkFeatures: str | NetworkFeatures'
- uid: azure.mgmt.netapp.types.VolumeProperties.enableSubvolumes
  name: enableSubvolumes
  summary: 'Flag indicating whether subvolume operations are enabled on the volume
    Deprecated. Subvolume

    operations and this flag will be removed in a future API version. Known values
    are: "Enabled"

    and "Disabled".'
  signature: 'enableSubvolumes: str | EnableSubvolumes'
- uid: azure.mgmt.netapp.types.VolumeProperties.encrypted
  name: encrypted
  summary: 'Specifies if the volume is encrypted or not. Only available on volumes
    created or updated after

    2022-01-01.'
  signature: 'encrypted: bool'
- uid: azure.mgmt.netapp.types.VolumeProperties.encryptionKeySource
  name: encryptionKeySource
  summary: 'Source of key used to encrypt data in volume. Applicable if NetApp account
    has

    encryption.keySource = ''Microsoft.KeyVault''. Possible values (case-insensitive)
    are:

    ''Microsoft.NetApp, Microsoft.KeyVault''. Known values are: "Microsoft.NetApp"
    and

    "Microsoft.KeyVault".'
  signature: 'encryptionKeySource: str | EncryptionKeySource'
- uid: azure.mgmt.netapp.types.VolumeProperties.exportPolicy
  name: exportPolicy
  summary: Set of export policy rules.
  signature: 'exportPolicy: VolumePropertiesExportPolicy'
- uid: azure.mgmt.netapp.types.VolumeProperties.fileAccessLogs
  name: fileAccessLogs
  summary: 'Flag indicating whether file access logs are enabled for the volume, based
    on active diagnostic

    settings present on the volume. Known values are: "Enabled" and "Disabled".'
  signature: 'fileAccessLogs: str | FileAccessLogs'
- uid: azure.mgmt.netapp.types.VolumeProperties.fileSystemId
  name: fileSystemId
  summary: Unique FileSystem Identifier.
  signature: 'fileSystemId: str'
- uid: azure.mgmt.netapp.types.VolumeProperties.inheritedSizeInBytes
  name: inheritedSizeInBytes
  summary: Space shared by short term clone volume with parent volume in bytes.
  signature: 'inheritedSizeInBytes: int | None'
- uid: azure.mgmt.netapp.types.VolumeProperties.isDefaultQuotaEnabled
  name: isDefaultQuotaEnabled
  summary: Specifies if default quota is enabled for the volume.
  signature: 'isDefaultQuotaEnabled: bool'
- uid: azure.mgmt.netapp.types.VolumeProperties.isLargeVolume
  name: isLargeVolume
  summary: Specifies whether volume is a Large Volume or Regular Volume.
  signature: 'isLargeVolume: bool'
- uid: azure.mgmt.netapp.types.VolumeProperties.isRestoring
  name: isRestoring
  summary: Restoring.
  signature: 'isRestoring: bool'
- uid: azure.mgmt.netapp.types.VolumeProperties.kerberosEnabled
  name: kerberosEnabled
  summary: Describe if a volume is KerberosEnabled. To be use with swagger version
    2020-05-01 or later.
  signature: 'kerberosEnabled: bool'
- uid: azure.mgmt.netapp.types.VolumeProperties.keyVaultPrivateEndpointResourceId
  name: keyVaultPrivateEndpointResourceId
  summary: 'The resource ID of private endpoint for KeyVault. It must reside in the
    same VNET as the

    volume. Only applicable if encryptionKeySource = ''Microsoft.KeyVault''.'
  signature: 'keyVaultPrivateEndpointResourceId: str'
- uid: azure.mgmt.netapp.types.VolumeProperties.language
  name: language
  summary: '"c.utf-8", "utf8mb4", "ar",

    "ar.utf-8", "hr", "hr.utf-8", "cs", "cs.utf-8", "da", "da.utf-8", "nl",

    "nl.utf-8", "en", "en.utf-8", "fi", "fi.utf-8", "fr", "fr.utf-8", "de",

    "de.utf-8", "he", "he.utf-8", "hu", "hu.utf-8", "it", "it.utf-8", "ja",

    "ja.utf-8", "ja-v1", "ja-v1.utf-8", "ja-jp.pck", "ja-jp.pck.utf-8", "ja-jp.932",

    "ja-jp.932.utf-8", "ja-jp.pck-v2", "ja-jp.pck-v2.utf-8", "ko", "ko.utf-8", "no",

    "no.utf-8", "pl", "pl.utf-8", "pt", "pt.utf-8", "c", "ro", "ro.utf-8", "ru",

    "ru.utf-8", "zh", "zh.utf-8", "zh.gbk", "zh.gbk.utf-8", "zh-tw.big5",

    "zh-tw.big5.utf-8", "zh-tw", "zh-tw.utf-8", "sk", "sk.utf-8", "sl", "sl.utf-8",

    "es", "es.utf-8", "sv", "sv.utf-8", "tr", "tr.utf-8", "en-us", and

    "en-us.utf-8".'
  signature: 'language: str | VolumeLanguage'
- uid: azure.mgmt.netapp.types.VolumeProperties.largeVolumeType
  name: largeVolumeType
  summary: 'Specifies the type of the Large Volume. When set to ''LargeVolume'', the
    large volume is created

    with standard configuration. If it is set to ''ExtraLargeVolume7Dot2PiB'', the
    extra large volume

    is created with higher capacity limit 7.2PiB with cool access enabled, delivering
    higher

    capacity limit with lower costs. Known values are: "LargeVolume" and

    "PremExtraLargeVolume7Dot2PiB".'
  signature: 'largeVolumeType: str | LargeVolumeType'
- uid: azure.mgmt.netapp.types.VolumeProperties.ldapEnabled
  name: ldapEnabled
  summary: Specifies whether LDAP is enabled or not for a given NFS volume.
  signature: 'ldapEnabled: bool'
- uid: azure.mgmt.netapp.types.VolumeProperties.ldapServerType
  name: ldapServerType
  summary: '"ActiveDirectory"

    and "OpenLDAP".'
  signature: 'ldapServerType: str | LdapServerType'
- uid: azure.mgmt.netapp.types.VolumeProperties.maximumNumberOfFiles
  name: maximumNumberOfFiles
  summary: 'Maximum number of files allowed. Needs a service request in order to be
    changed. Only allowed

    to be changed if volume quota is more than 4TiB.'
  signature: 'maximumNumberOfFiles: int'
- uid: azure.mgmt.netapp.types.VolumeProperties.mountTargets
  name: mountTargets
  summary: List of mount targets.
  signature: 'mountTargets: list[''MountTargetProperties'']'
- uid: azure.mgmt.netapp.types.VolumeProperties.networkFeatures
  name: networkFeatures
  summary: 'The original value of the network features type available to the volume
    at the time it was

    created. Known values are: "Basic", "Standard", "Basic_Standard", and "Standard_Basic".'
  signature: 'networkFeatures: str | NetworkFeatures'
- uid: azure.mgmt.netapp.types.VolumeProperties.networkSiblingSetId
  name: networkSiblingSetId
  summary: Network Sibling Set ID for the the group of volumes sharing networking
    resources.
  signature: 'networkSiblingSetId: str'
- uid: azure.mgmt.netapp.types.VolumeProperties.originatingResourceId
  name: originatingResourceId
  summary: Id of the snapshot or backup that the volume is restored from.
  signature: 'originatingResourceId: str | None'
- uid: azure.mgmt.netapp.types.VolumeProperties.placementRules
  name: placementRules
  summary: Application specific placement rules for the particular volume.
  signature: 'placementRules: list[''PlacementKeyValuePairs'']'
- uid: azure.mgmt.netapp.types.VolumeProperties.protocolTypes
  name: protocolTypes
  summary: 'Specify the protocol types for the volume. Supported values are NFSv3,
    NFSv4.1, and CIFS. For

    SMB volumes, specify CIFS. The value SMB isn''t supported in the protocolTypes
    property.

    Default: NFSv3.'
  signature: 'protocolTypes: list[str]'
- uid: azure.mgmt.netapp.types.VolumeProperties.provisionedAvailabilityZone
  name: provisionedAvailabilityZone
  summary: 'The availability zone where the volume is provisioned. This refers to
    the logical availability

    zone where the volume resides.'
  signature: 'provisionedAvailabilityZone: str | None'
- uid: azure.mgmt.netapp.types.VolumeProperties.provisioningState
  name: provisioningState
  summary: Azure lifecycle management.
  signature: 'provisioningState: str'
- uid: azure.mgmt.netapp.types.VolumeProperties.proximityPlacementGroup
  name: proximityPlacementGroup
  summary: Proximity placement group associated with the volume.
  signature: 'proximityPlacementGroup: str'
- uid: azure.mgmt.netapp.types.VolumeProperties.securityStyle
  name: securityStyle
  summary: 'The security style of volume, default unix, defaults to ntfs for dual
    protocol or CIFS

    protocol. Known values are: "ntfs" and "unix".'
  signature: 'securityStyle: str | SecurityStyle'
- uid: azure.mgmt.netapp.types.VolumeProperties.serviceLevel
  name: serviceLevel
  summary: '"Standard", "Premium", "Ultra",

    "StandardZRS", and "Flexible".'
  signature: 'serviceLevel: str | ServiceLevel'
- uid: azure.mgmt.netapp.types.VolumeProperties.smbAccessBasedEnumeration
  name: smbAccessBasedEnumeration
  summary: 'Enables access-based enumeration share property for SMB Shares. Only applicable
    for

    SMB/DualProtocol volume. Known values are: "Disabled" and "Enabled".'
  signature: 'smbAccessBasedEnumeration: str | SmbAccessBasedEnumeration | None'
- uid: azure.mgmt.netapp.types.VolumeProperties.smbContinuouslyAvailable
  name: smbContinuouslyAvailable
  summary: Enables continuously available share property for smb volume. Only applicable
    for SMB volume.
  signature: 'smbContinuouslyAvailable: bool'
- uid: azure.mgmt.netapp.types.VolumeProperties.smbEncryption
  name: smbEncryption
  summary: 'Enables encryption for in-flight smb3 data. Only applicable for SMB/DualProtocol
    volume. To be

    used with swagger version 2020-08-01 or later.'
  signature: 'smbEncryption: bool'
- uid: azure.mgmt.netapp.types.VolumeProperties.smbNonBrowsable
  name: smbNonBrowsable
  summary: 'Enables non-browsable property for SMB Shares. Only applicable for SMB/DualProtocol
    volume.

    Known values are: "Disabled" and "Enabled".'
  signature: 'smbNonBrowsable: str | SmbNonBrowsable'
- uid: azure.mgmt.netapp.types.VolumeProperties.snapshotDirectoryVisible
  name: snapshotDirectoryVisible
  summary: 'If enabled (true) the volume will contain a read-only snapshot directory
    which provides access

    to each of the volume''s snapshots (defaults to true).'
  signature: 'snapshotDirectoryVisible: bool'
- uid: azure.mgmt.netapp.types.VolumeProperties.snapshotId
  name: snapshotId
  summary: Resource identifier used to identify the Snapshot.
  signature: 'snapshotId: str | None'
- uid: azure.mgmt.netapp.types.VolumeProperties.storageToNetworkProximity
  name: storageToNetworkProximity
  summary: 'Provides storage to network proximity information for the volume. Known
    values are:

    "Default", "T1", "T2", and "AcrossT2".'
  signature: 'storageToNetworkProximity: str | VolumeStorageToNetworkProximity'
- uid: azure.mgmt.netapp.types.VolumeProperties.subnetId
  name: subnetId
  summary: 'The Azure Resource URI for a delegated subnet. Must have the delegation

    Microsoft.NetApp/volumes. Required.'
  signature: 'subnetId: Required[str]'
- uid: azure.mgmt.netapp.types.VolumeProperties.t2Network
  name: t2Network
  summary: T2 network information.
  signature: 't2Network: str'
- uid: azure.mgmt.netapp.types.VolumeProperties.throughputMibps
  name: throughputMibps
  summary: 'Maximum throughput in MiB/s that can be achieved by this volume and this
    will be accepted as

    input only for manual qosType volume.'
  signature: 'throughputMibps: float | None'
- uid: azure.mgmt.netapp.types.VolumeProperties.unixPermissions
  name: unixPermissions
  summary: 'UNIX permissions for NFS volume accepted in octal 4 digit format. First
    digit selects the set

    user ID(4), set group ID (2) and sticky (1) attributes. Second digit selects permission
    for the

    owner of the file: read (4), write (2) and execute (1). Third selects permissions
    for other

    users in the same group. the fourth for other users not in the group. 0755 - gives

    read/write/execute permissions to owner and read/execute to group and other users.'
  signature: 'unixPermissions: str | None'
- uid: azure.mgmt.netapp.types.VolumeProperties.usageThreshold
  name: usageThreshold
  summary: 'Maximum storage quota allowed for a file system in bytes. This is a soft
    quota used for

    alerting only. For regular volumes, valid values are in the range 50GiB to 100TiB.
    For large

    volumes, valid values are in the range 100TiB to 500TiB, and on an exceptional
    basis, from to

    2400GiB to 2400TiB. For extra large volumes, valid values are in the range 2400GiB
    to 7200TiB.

    Values expressed in bytes as multiples of 1 GiB. Required.'
  signature: 'usageThreshold: Required[int]'
- uid: azure.mgmt.netapp.types.VolumeProperties.volumeGroupName
  name: volumeGroupName
  summary: Volume Group Name.
  signature: 'volumeGroupName: str'
- uid: azure.mgmt.netapp.types.VolumeProperties.volumeSpecName
  name: volumeSpecName
  summary: 'Volume spec name is the application specific designation or identifier
    for the particular

    volume in a volume group for e.g. data, log.'
  signature: 'volumeSpecName: str'
- uid: azure.mgmt.netapp.types.VolumeProperties.volumeType
  name: volumeType
  summary: 'What type of volume is this. For destination volumes in Cross Region Replication,
    set type to

    DataProtection. For creating clone volume, set type to ShortTermClone.'
  signature: 'volumeType: str'
