  name: subnetId
  summary: 'The Azure Resource URI for a delegated subnet. Must have the delegation

    Microsoft.NetApp/volumes. Required.'
  signature: 'subnetId: Required[str]'
- uid: azure.mgmt.netapp.types.VolumeProperties.t2Network
  name: t2Network
  summary: T2 network information.
  signature: 't2Network: str'
- uid: azure.mgmt.netapp.types.VolumeProperties.throughputMibps
  name: throughputMibps
  summary: 'Maximum throughput in MiB/s that can be achieved by this volume and this
    will be accepted as

    input only for manual qosType volume.'
  signature: 'throughputMibps: float | None'
- uid: azure.mgmt.netapp.types.VolumeProperties.unixPermissions
  name: unixPermissions
  summary: 'UNIX permissions for NFS volume accepted in octal 4 digit format. First
    digit selects the set

    user ID(4), set group ID (2) and sticky (1) attributes. Second digit selects permission
    for the

    owner of the file: read (4), write (2) and execute (1). Third selects permissions
    for other

    users in the same group. the fourth for other users not in the group. 0755 - gives

    read/write/execute permissions to owner and read/execute to group and other users.'
  signature: 'unixPermissions: str | None'
- uid: azure.mgmt.netapp.types.VolumeProperties.usageThreshold
  name: usageThreshold
  summary: 'Maximum storage quota allowed for a file system in bytes. This is a soft
    quota used for

    alerting only. For regular volumes, valid values are in the range 50GiB to 100TiB.
    For large

    volumes, valid values are in the range 100TiB to 500TiB, and on an exceptional
    basis, from to

    2400GiB to 2400TiB. For extra large volumes, valid values are in the range 2400GiB
    to 7200TiB.

    Values expressed in bytes as multiples of 1 GiB. Required.'
  signature: 'usageThreshold: Required[int]'
- uid: azure.mgmt.netapp.types.VolumeProperties.volumeGroupName
  name: volumeGroupName
  summary: Volume Group Name.
