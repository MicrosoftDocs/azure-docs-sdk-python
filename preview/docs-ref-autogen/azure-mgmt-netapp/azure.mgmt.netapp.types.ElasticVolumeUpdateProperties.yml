uid: azure.mgmt.netapp.types.ElasticVolumeUpdateProperties
name: ElasticVolumeUpdateProperties
fullName: azure.mgmt.netapp.types.ElasticVolumeUpdateProperties
module: azure.mgmt.netapp.types
summary: The updatable properties of the ElasticVolume.
constructor:
  syntax: ElasticVolumeUpdateProperties()
variables:
- description: 'Maximum size allowed for a volume in bytes. Valid values are in the
    range 1GiB to

    16TiB. Values expressed in bytes as multiples of 1 GiB.'
  name: size
  types:
  - <xref:int>
- description: Set of export policy rules.
  name: export_policy
  types:
  - <xref:<xref:"ElasticExportPolicy">>
- description: 'Data protection configuration option for the volume, including snapshot

    policies and backup.'
  name: data_protection
  types:
  - <xref:<xref:"ElasticVolumeDataProtectionPatchProperties">>
- description: 'Controls the visibility of the volume''s read-only snapshot

    directory, which provides access to each of the volume''s snapshots. Known values
    are: "Hidden"

    and "Visible".'
  name: snapshot_directory_visibility
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SnapshotDirectoryVisibility">]
- description: SMB Properties.
  name: smb_properties
  types:
  - <xref:<xref:"ElasticSmbPatchProperties">>
attributes:
