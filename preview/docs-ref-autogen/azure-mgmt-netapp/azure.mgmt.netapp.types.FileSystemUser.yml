### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.FileSystemUser
name: FileSystemUser
fullName: azure.mgmt.netapp.types.FileSystemUser
module: azure.mgmt.netapp.types
summary: 'File System user having access to volume data. For Unix, this is the user''s
  uid and gid. For

  Windows, this is the user''s username. Note that the Unix and Windows user details
  are mutually

  exclusive, meaning one or other must be supplied, but not both.'
constructor:
  syntax: FileSystemUser()
variables:
- description: The effective NFS User ID and Group ID when accessing the volume data.
  name: nfsUser
  types:
  - <xref:<xref:"NfsUser">>
- description: The effective CIFS username when accessing the volume data.
  name: cifsUser
  types:
  - <xref:<xref:"CifsUser">>
attributes:
- uid: azure.mgmt.netapp.types.FileSystemUser.cifsUser
  name: cifsUser
  summary: The effective CIFS username when accessing the volume data.
  signature: 'cifsUser: CifsUser'
- uid: azure.mgmt.netapp.types.FileSystemUser.nfsUser
  name: nfsUser
  summary: The effective NFS User ID and Group ID when accessing the volume data.
  signature: 'nfsUser: NfsUser'
