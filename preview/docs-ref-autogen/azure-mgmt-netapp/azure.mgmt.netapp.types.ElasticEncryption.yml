### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.ElasticEncryption
name: ElasticEncryption
fullName: azure.mgmt.netapp.types.ElasticEncryption
module: azure.mgmt.netapp.types
summary: Encryption settings.
constructor:
  syntax: ElasticEncryption()
variables:
- description: 'The encryption keySource (provider). Possible values (case-insensitive):

    Microsoft.NetApp, Microsoft.KeyVault. Known values are: "Microsoft.NetApp" and

    "Microsoft.KeyVault".'
  name: keySource
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KeySource">]
- description: 'Properties provided by KeyVault. Applicable if keySource is

    ''Microsoft.KeyVault''.'
  name: keyVaultProperties
  types:
  - <xref:<xref:"ElasticKeyVaultProperties">>
- description: 'Identity used to authenticate to KeyVault. Applicable if keySource
    is

    ''Microsoft.KeyVault''.'
  name: identity
  types:
  - <xref:<xref:"ElasticEncryptionIdentity">>
attributes:
- uid: azure.mgmt.netapp.types.ElasticEncryption.identity
  name: identity
  summary: Identity used to authenticate to KeyVault. Applicable if keySource is 'Microsoft.KeyVault'.
  signature: 'identity: ElasticEncryptionIdentity'
- uid: azure.mgmt.netapp.types.ElasticEncryption.keySource
  name: keySource
  summary: 'Microsoft.NetApp,

    Microsoft.KeyVault. Known values are: "Microsoft.NetApp" and "Microsoft.KeyVault".'
  signature: 'keySource: str | KeySource'
- uid: azure.mgmt.netapp.types.ElasticEncryption.keyVaultProperties
  name: keyVaultProperties
  summary: Properties provided by KeyVault. Applicable if keySource is 'Microsoft.KeyVault'.
  signature: 'keyVaultProperties: ElasticKeyVaultProperties'
