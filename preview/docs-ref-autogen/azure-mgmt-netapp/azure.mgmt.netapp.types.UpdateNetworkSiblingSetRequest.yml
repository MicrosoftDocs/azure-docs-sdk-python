### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.UpdateNetworkSiblingSetRequest
name: UpdateNetworkSiblingSetRequest
fullName: azure.mgmt.netapp.types.UpdateNetworkSiblingSetRequest
module: azure.mgmt.netapp.types
summary: Network sibling set update.
constructor:
  syntax: UpdateNetworkSiblingSetRequest()
variables:
- description: 'Network Sibling Set ID for a group of volumes sharing networking

    resources in a subnet. Required.'
  name: networkSiblingSetId
  types:
  - <xref:str>
- description: 'The Azure Resource URI for a delegated subnet. Must have the delegation

    Microsoft.NetApp/volumes. Example

    /subscriptions/subscriptionId/resourceGroups/resourceGroup/providers/Microsoft.Network/virtualNetworks/testVnet/subnets/{mySubnet}.

    Required.'
  name: subnetId
  types:
  - <xref:str>
- description: 'Network sibling set state Id identifying the current state of

    the sibling set. Required.'
  name: networkSiblingSetStateId
  types:
  - <xref:str>
- description: 'Network features available to the volume. Required. Known values are:

    "Basic", "Standard", "Basic_Standard", and "Standard_Basic".'
  name: networkFeatures
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkFeatures">]
attributes:
- uid: azure.mgmt.netapp.types.UpdateNetworkSiblingSetRequest.networkFeatures
  name: networkFeatures
  summary: '"Basic", "Standard",

    "Basic_Standard", and "Standard_Basic".'
  signature: 'networkFeatures: Required[str | NetworkFeatures]'
- uid: azure.mgmt.netapp.types.UpdateNetworkSiblingSetRequest.networkSiblingSetId
  name: networkSiblingSetId
  summary: 'Network Sibling Set ID for a group of volumes sharing networking resources
    in a subnet.

    Required.'
  signature: 'networkSiblingSetId: Required[str]'
- uid: azure.mgmt.netapp.types.UpdateNetworkSiblingSetRequest.networkSiblingSetStateId
  name: networkSiblingSetStateId
  summary: Network sibling set state Id identifying the current state of the sibling
    set. Required.
  signature: 'networkSiblingSetStateId: Required[str]'
- uid: azure.mgmt.netapp.types.UpdateNetworkSiblingSetRequest.subnetId
  name: subnetId
  summary: 'The Azure Resource URI for a delegated subnet. Must have the delegation

    Microsoft.NetApp/volumes. Example

    /subscriptions/subscriptionId/resourceGroups/resourceGroup/providers/Microsoft.Network/virtualNetworks/testVnet/subnets/{mySubnet}.

    Required.'
  signature: 'subnetId: Required[str]'
