### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.CacheUpdateProperties
name: CacheUpdateProperties
fullName: azure.mgmt.netapp.types.CacheUpdateProperties
module: azure.mgmt.netapp.types
summary: The updatable properties of the Cache.
constructor:
  syntax: CacheUpdateProperties()
variables:
- description: 'Maximum storage quota allowed for a file system in bytes. Valid values
    are in the

    range 50GiB to 1PiB. Values expressed in bytes as multiples of 1GiB.'
  name: size
  types:
  - <xref:int>
- description: Set of export policy rules.
  name: export_policy
  types:
  - <xref:<xref:"CachePropertiesExportPolicy">>
- description: 'Set of supported protocol types, which include NFSv3, NFSv4 and SMB

    protocol.'
  name: protocol_types
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"ProtocolTypes">]]
- description: SMB information for the cache.
  name: smb_settings
  types:
  - <xref:<xref:"SmbSettings">>
- description: 'Maximum throughput in MiB/s that can be achieved by this cache volume

    and this will be accepted as input only for manual qosType cache.'
  name: throughput_mibps
  types:
  - <xref:float>
- description: 'The resource ID of private endpoint for KeyVault.

    It must reside in the same VNET as the volume. Only applicable if encryptionKeySource
    =

    ''Microsoft.KeyVault''.'
  name: key_vault_private_endpoint_resource_id
  types:
  - <xref:str>
- description: 'Flag indicating whether a CIFS change notification is enabled

    for the cache. Known values are: "Disabled" and "Enabled".'
  name: cifs_change_notifications
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CifsChangeNotifyState">]
- description: 'Flag indicating whether writeback is enabled for the cache. Known
    values are:

    "Disabled" and "Enabled".'
  name: write_back
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EnableWriteBackState">]
attributes:
- uid: azure.mgmt.netapp.types.CacheUpdateProperties.cifsChangeNotifications
  name: cifsChangeNotifications
  summary: 'Flag indicating whether a CIFS change notification is enabled for the
    cache. Known values are:

    "Disabled" and "Enabled".'
  signature: 'cifsChangeNotifications: str | CifsChangeNotifyState'
- uid: azure.mgmt.netapp.types.CacheUpdateProperties.exportPolicy
  name: exportPolicy
  summary: Set of export policy rules.
  signature: 'exportPolicy: CachePropertiesExportPolicy'
- uid: azure.mgmt.netapp.types.CacheUpdateProperties.keyVaultPrivateEndpointResourceId
  name: keyVaultPrivateEndpointResourceId
  summary: 'The resource ID of private endpoint for KeyVault. It must reside in the
    same VNET as the

    volume. Only applicable if encryptionKeySource = ''Microsoft.KeyVault''.'
  signature: 'keyVaultPrivateEndpointResourceId: str'
- uid: azure.mgmt.netapp.types.CacheUpdateProperties.protocolTypes
  name: protocolTypes
  summary: Set of supported protocol types, which include NFSv3, NFSv4 and SMB protocol.
  signature: 'protocolTypes: list[typing.Union[str, ForwardRef(''ProtocolTypes'')]]'
- uid: azure.mgmt.netapp.types.CacheUpdateProperties.size
  name: size
  summary: 'Maximum storage quota allowed for a file system in bytes. Valid values
    are in the range 50GiB

    to 1PiB. Values expressed in bytes as multiples of 1GiB.'
  signature: 'size: int'
- uid: azure.mgmt.netapp.types.CacheUpdateProperties.smbSettings
  name: smbSettings
  summary: SMB information for the cache.
  signature: 'smbSettings: SmbSettings'
- uid: azure.mgmt.netapp.types.CacheUpdateProperties.throughputMibps
  name: throughputMibps
  summary: 'Maximum throughput in MiB/s that can be achieved by this cache volume
    and this will be accepted

    as input only for manual qosType cache.'
  signature: 'throughputMibps: float'
- uid: azure.mgmt.netapp.types.CacheUpdateProperties.writeBack
  name: writeBack
  summary: '"Disabled" and

    "Enabled".'
  signature: 'writeBack: str | EnableWriteBackState'
