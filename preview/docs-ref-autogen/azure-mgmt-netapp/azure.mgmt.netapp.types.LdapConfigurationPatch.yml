### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.LdapConfigurationPatch
name: LdapConfigurationPatch
fullName: azure.mgmt.netapp.types.LdapConfigurationPatch
module: azure.mgmt.netapp.types
summary: LDAP configuration for PATCH operations (no default values).
constructor:
  syntax: LdapConfigurationPatch()
variables:
- description: Name of the LDAP configuration domain.
  name: domain
  types:
  - <xref:str>
- description: List of LDAP server IP addresses (IPv4 only) for the LDAP domain.
  name: ldap_servers
  types:
  - <xref:list>[<xref:str>]
- description: Specifies whether or not the LDAP traffic needs to be secured via TLS.
  name: ldap_over_tls
  types:
  - <xref:bool>
- description: 'When LDAP over SSL/TLS is enabled, the LDAP client is required to

    have base64 encoded ldap servers CA certificate.'
  name: server_ca_certificate
  types:
  - <xref:str>
- description: 'The CN host name used while generating the certificate, LDAP Over

    TLS requires the CN host name to create DNS host entry.'
  name: certificate_cn_host
  types:
  - <xref:str>
- description: 'List of DNS server IPv4 addresses for resolving the CN host certificate.

    This parameter is used when LDAP over TLS is enabled.'
  name: dns_servers
  types:
  - <xref:list>[<xref:str>]
- description: Port number for LDAP communication. Default is 389 for LDAP.
  name: ldap_port
  types:
  - <xref:int>
- description: 'This specifies the user DN (Distinguished Name), which overrides the
    base DN for

    user lookups.'
  name: user_dn
  types:
  - <xref:str>
- description: 'This specifies the group DN (Distinguished Name), which overrides
    the base DN

    for group lookups.'
  name: group_dn
  types:
  - <xref:str>
- description: 'This specifies the netgroup DN (Distinguished Name), which overrides
    the

    base DN for netgroup lookups.'
  name: net_group_dn
  types:
  - <xref:str>
- description: 'The authentication level to use when binding to the LDAP

    server, defaults to Anonymous. Known values are: "Anonymous" and "Simple".'
  name: bind_authentication_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BindAuthenticationLevel">]
- description: The distinguished name (DN) to bind as when performing LDAP operations.
  name: bind_dn
  types:
  - <xref:str>
- description: 'The Azure Key Vault configuration where the Bind DN

    (Distinguished Name) user password is stored.'
  name: bind_password_akv_config
  types:
  - <xref:<xref:"BindPasswordAkvConfigPatch">>
attributes:
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.bindAuthenticationLevel
  name: bindAuthenticationLevel
  summary: 'The authentication level to use when binding to the LDAP server, defaults
    to Anonymous. Known

    values are: "Anonymous" and "Simple".'
  signature: 'bindAuthenticationLevel: str | BindAuthenticationLevel'
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.bindDN
  name: bindDN
  summary: The distinguished name (DN) to bind as when performing LDAP operations.
  signature: 'bindDN: str'
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.bindPasswordAkvConfig
  name: bindPasswordAkvConfig
  summary: 'The Azure Key Vault configuration where the Bind DN (Distinguished Name)
    user password is

    stored.'
  signature: 'bindPasswordAkvConfig: BindPasswordAkvConfigPatch'
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.certificateCNHost
  name: certificateCNHost
  summary: 'The CN host name used while generating the certificate, LDAP Over TLS
    requires the CN host name

    to create DNS host entry.'
  signature: 'certificateCNHost: str | None'
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.dnsServers
  name: dnsServers
  summary: 'List of DNS server IPv4 addresses for resolving the CN host certificate.
    This parameter is used

    when LDAP over TLS is enabled.'
  signature: 'dnsServers: list[str]'
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.domain
  name: domain
  summary: Name of the LDAP configuration domain.
  signature: 'domain: str'
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.groupDN
  name: groupDN
  summary: 'This specifies the group DN (Distinguished Name), which overrides the
    base DN for group

    lookups.'
  signature: 'groupDN: str'
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.ldapOverTLS
  name: ldapOverTLS
  summary: Specifies whether or not the LDAP traffic needs to be secured via TLS.
  signature: 'ldapOverTLS: bool'
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.ldapPort
  name: ldapPort
  summary: Port number for LDAP communication. Default is 389 for LDAP.
  signature: 'ldapPort: int'
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.ldapServers
  name: ldapServers
  summary: List of LDAP server IP addresses (IPv4 only) for the LDAP domain.
  signature: 'ldapServers: list[str]'
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.netGroupDN
  name: netGroupDN
  summary: 'This specifies the netgroup DN (Distinguished Name), which overrides the
    base DN for netgroup

    lookups.'
  signature: 'netGroupDN: str'
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.serverCACertificate
  name: serverCACertificate
  summary: 'When LDAP over SSL/TLS is enabled, the LDAP client is required to have
    base64 encoded ldap

    servers CA certificate.'
  signature: 'serverCACertificate: str'
- uid: azure.mgmt.netapp.types.LdapConfigurationPatch.userDN
  name: userDN
  summary: This specifies the user DN (Distinguished Name), which overrides the base
    DN for user lookups.
  signature: 'userDN: str'
