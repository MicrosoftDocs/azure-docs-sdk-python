### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.LdapConfiguration
name: LdapConfiguration
fullName: azure.mgmt.netapp.types.LdapConfiguration
module: azure.mgmt.netapp.types
summary: LDAP configuration.
constructor:
  syntax: LdapConfiguration()
variables:
- description: Name of the LDAP configuration domain.
  name: domain
  types:
  - <xref:str>
- description: List of LDAP server IP addresses (IPv4 only) for the LDAP domain.
  name: ldapServers
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates the secure LDAP mode for encrypting communication between
    ANF

    storage and customer LDAP servers. Known values are: "LdapOverTLS" and "None".'
  name: secureLdapType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecureLdapType">]
- description: 'When LDAP over SSL/TLS is enabled, the LDAP client is required to

    have base64 encoded ldap servers CA certificate.'
  name: serverCACertificate
  types:
  - <xref:str>
- description: 'The CN host name used while generating the certificate, LDAP Over
    TLS

    requires the CN host name to create DNS host entry.'
  name: certificateCNHost
  types:
  - <xref:str>
- description: 'List of DNS server IPv4 addresses for resolving the CN host certificate.
    This

    parameter is used when LDAP over TLS is enabled.'
  name: dnsServers
  types:
  - <xref:list>[<xref:str>]
- description: Port number for LDAP communication. Default is 389 for LDAP.
  name: ldapPort
  types:
  - <xref:int>
- description: 'This specifies the user DN (Distinguished Name), which overrides the
    base DN for

    user lookups.'
  name: userDN
  types:
  - <xref:str>
- description: 'This specifies the group DN (Distinguished Name), which overrides
    the base DN

    for group lookups.'
  name: groupDN
  types:
  - <xref:str>
- description: 'This specifies the netgroup DN (Distinguished Name), which overrides
    the base

    DN for netgroup lookups.'
  name: netGroupDN
  types:
  - <xref:str>
- description: 'The authentication level to use when binding to the LDAP server,

    defaults to Anonymous. Known values are: "Anonymous" and "Simple".'
  name: bindAuthenticationLevel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BindAuthenticationLevel">]
- description: The distinguished name (DN) to bind as when performing LDAP operations.
  name: bindDN
  types:
  - <xref:str>
- description: 'The Azure Key Vault configuration where the Bind DN (Distinguished

    Name) user password is stored.'
  name: bindPasswordAkvConfig
  types:
  - <xref:<xref:"BindPasswordAkvConfig">>
attributes:
- uid: azure.mgmt.netapp.types.LdapConfiguration.bindAuthenticationLevel
  name: bindAuthenticationLevel
  summary: 'The authentication level to use when binding to the LDAP server, defaults
    to Anonymous. Known

    values are: "Anonymous" and "Simple".'
  signature: 'bindAuthenticationLevel: str | BindAuthenticationLevel'
- uid: azure.mgmt.netapp.types.LdapConfiguration.bindDN
  name: bindDN
  summary: The distinguished name (DN) to bind as when performing LDAP operations.
  signature: 'bindDN: str'
- uid: azure.mgmt.netapp.types.LdapConfiguration.bindPasswordAkvConfig
  name: bindPasswordAkvConfig
  summary: 'The Azure Key Vault configuration where the Bind DN (Distinguished Name)
    user password is

    stored.'
  signature: 'bindPasswordAkvConfig: BindPasswordAkvConfig'
- uid: azure.mgmt.netapp.types.LdapConfiguration.certificateCNHost
  name: certificateCNHost
  summary: 'The CN host name used while generating the certificate, LDAP Over TLS
    requires the CN host name

    to create DNS host entry.'
  signature: 'certificateCNHost: str | None'
- uid: azure.mgmt.netapp.types.LdapConfiguration.dnsServers
  name: dnsServers
  summary: 'List of DNS server IPv4 addresses for resolving the CN host certificate.
    This parameter is used

    when LDAP over TLS is enabled.'
  signature: 'dnsServers: list[str]'
- uid: azure.mgmt.netapp.types.LdapConfiguration.domain
  name: domain
  summary: Name of the LDAP configuration domain.
  signature: 'domain: str'
- uid: azure.mgmt.netapp.types.LdapConfiguration.groupDN
  name: groupDN
  summary: 'This specifies the group DN (Distinguished Name), which overrides the
    base DN for group

    lookups.'
  signature: 'groupDN: str'
- uid: azure.mgmt.netapp.types.LdapConfiguration.ldapPort
  name: ldapPort
  summary: Port number for LDAP communication. Default is 389 for LDAP.
  signature: 'ldapPort: int'
- uid: azure.mgmt.netapp.types.LdapConfiguration.ldapServers
  name: ldapServers
  summary: List of LDAP server IP addresses (IPv4 only) for the LDAP domain.
  signature: 'ldapServers: list[str]'
- uid: azure.mgmt.netapp.types.LdapConfiguration.netGroupDN
  name: netGroupDN
  summary: 'This specifies the netgroup DN (Distinguished Name), which overrides the
    base DN for netgroup

    lookups.'
  signature: 'netGroupDN: str'
- uid: azure.mgmt.netapp.types.LdapConfiguration.secureLdapType
  name: secureLdapType
  summary: 'Indicates the secure LDAP mode for encrypting communication between ANF
    storage and customer

    LDAP servers. Known values are: "LdapOverTLS" and "None".'
  signature: 'secureLdapType: str | SecureLdapType'
- uid: azure.mgmt.netapp.types.LdapConfiguration.serverCACertificate
  name: serverCACertificate
  summary: 'When LDAP over SSL/TLS is enabled, the LDAP client is required to have
    base64 encoded ldap

    servers CA certificate.'
  signature: 'serverCACertificate: str'
- uid: azure.mgmt.netapp.types.LdapConfiguration.userDN
  name: userDN
  summary: This specifies the user DN (Distinguished Name), which overrides the base
    DN for user lookups.
  signature: 'userDN: str'
