### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.EntraIdConfig
name: EntraIdConfig
fullName: azure.mgmt.netapp.types.EntraIdConfig
module: azure.mgmt.netapp.types
summary: Entra ID configuration for the account.
constructor:
  syntax: EntraIdConfig()
variables:
- description: 'ApplicationId of the app created by customer to provide authentication

    and required API permissions for Microsoft Graph endpoint. Required.'
  name: application_id
  types:
  - <xref:str>
- description: 'Domain of the Active directory synced to Entra ID for hybrid identities.

    Required.'
  name: domain
  types:
  - <xref:str>
- description: 'Using ServerNamePrefix, FQDN (Fully Qualified Domain Name) will be

    generated for SMB share, using this FQDN, SMB Share will be mounted on Entra Joined
    VM.

    Required.'
  name: server_name_prefix
  types:
  - <xref:str>
- description: 'Using AKV config, certificate will be fetched, which will contain

    private key & public certificate, that correspond to the public certificate which
    is uploaded

    on the application created by customer. This will be used further for authentication.'
  name: entra_id_akv_config
  types:
  - <xref:<xref:"EntraIdAkvConfig">>
attributes:
- uid: azure.mgmt.netapp.types.EntraIdConfig.applicationId
  name: applicationId
  summary: 'ApplicationId of the app created by customer to provide authentication
    and required API

    permissions for Microsoft Graph endpoint. Required.'
  signature: 'applicationId: str'
- uid: azure.mgmt.netapp.types.EntraIdConfig.domain
  name: domain
  summary: Domain of the Active directory synced to Entra ID for hybrid identities.
    Required.
  signature: 'domain: str'
- uid: azure.mgmt.netapp.types.EntraIdConfig.entraIdAkvConfig
  name: entraIdAkvConfig
  summary: 'Using AKV config, certificate will be fetched, which will contain private
    key & public

    certificate, that correspond to the public certificate which is uploaded on the
    application

    created by customer. This will be used further for authentication.'
  signature: 'entraIdAkvConfig: EntraIdAkvConfig'
- uid: azure.mgmt.netapp.types.EntraIdConfig.serverNamePrefix
  name: serverNamePrefix
  summary: 'Using ServerNamePrefix, FQDN (Fully Qualified Domain Name) will be generated
    for SMB share,

    using this FQDN, SMB Share will be mounted on Entra Joined VM. Required.'
  signature: 'serverNamePrefix: str'
