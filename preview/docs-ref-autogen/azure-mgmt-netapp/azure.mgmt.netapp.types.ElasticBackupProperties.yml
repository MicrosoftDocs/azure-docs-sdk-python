### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.ElasticBackupProperties
name: ElasticBackupProperties
fullName: azure.mgmt.netapp.types.ElasticBackupProperties
module: azure.mgmt.netapp.types
summary: Elastic Backup properties.
constructor:
  syntax: ElasticBackupProperties()
variables:
- description: The creation date of the backup.
  name: creationDate
  types:
  - <xref:str>
- description: The snapshot creation date of the backup.
  name: snapshotCreationDate
  types:
  - <xref:str>
- description: The completion date of the backup.
  name: completionDate
  types:
  - <xref:str>
- description: 'Azure lifecycle management. Known values are: "Accepted", "Creating",

    "Patching", "Updating", "Deleting", "Moving", "Failed", and "Succeeded".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetAppProvisioningState">]
- description: Size of backup in bytes.
  name: size
  types:
  - <xref:int>
- description: Label for backup.
  name: label
  types:
  - <xref:str>
- description: 'Type of backup Manual or Scheduled. Known values are: "Manual" and

    "Scheduled".'
  name: backupType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ElasticBackupType">]
- description: Failure reason.
  name: failureReason
  types:
  - <xref:str>
- description: ResourceId used to identify the Elastic Volume. Required.
  name: elasticVolumeResourceId
  types:
  - <xref:str>
- description: 'Manual backup using an already existing snapshot. This will always
    be

    CreateNewSnapshot for scheduled backups and UseExistingSnapshot/CreateNewSnapshot
    for manual

    backups. Known values are: "UseExistingSnapshot" and "CreateNewSnapshot".'
  name: snapshotUsage
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SnapshotUsage">]
- description: 'ResourceId used to identify the elastic snapshot resource.

    This is required when an existing snapshot needs to be used for creating a manual
    backup.'
  name: elasticSnapshotResourceId
  types:
  - <xref:str>
- description: ResourceId used to identify the elastic backup policy.
  name: elasticBackupPolicyResourceId
  types:
  - <xref:str>
- description: 'Specifies if the backup is for a large volume. Known values are: "Large"
    and

    "Regular".'
  name: volumeSize
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VolumeSize">]
attributes:
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.backupType
  name: backupType
  summary: '"Manual" and "Scheduled".'
  signature: 'backupType: str | ElasticBackupType'
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.completionDate
  name: completionDate
  summary: The completion date of the backup.
  signature: 'completionDate: str'
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.creationDate
  name: creationDate
  summary: The creation date of the backup.
  signature: 'creationDate: str'
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.elasticBackupPolicyResourceId
  name: elasticBackupPolicyResourceId
  summary: ResourceId used to identify the elastic backup policy.
  signature: 'elasticBackupPolicyResourceId: str'
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.elasticSnapshotResourceId
  name: elasticSnapshotResourceId
  summary: 'ResourceId used to identify the elastic snapshot resource. This is required
    when an existing

    snapshot needs to be used for creating a manual backup.'
  signature: 'elasticSnapshotResourceId: str'
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.elasticVolumeResourceId
  name: elasticVolumeResourceId
  summary: ResourceId used to identify the Elastic Volume. Required.
  signature: 'elasticVolumeResourceId: Required[str]'
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.failureReason
  name: failureReason
  summary: Failure reason.
  signature: 'failureReason: str'
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.label
  name: label
  summary: Label for backup.
  signature: 'label: str'
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.provisioningState
  name: provisioningState
  summary: '"Accepted", "Creating", "Patching",

    "Updating", "Deleting", "Moving", "Failed", and "Succeeded".'
  signature: 'provisioningState: str | NetAppProvisioningState'
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.size
  name: size
  summary: Size of backup in bytes.
  signature: 'size: int'
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.snapshotCreationDate
  name: snapshotCreationDate
  summary: The snapshot creation date of the backup.
  signature: 'snapshotCreationDate: str'
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.snapshotUsage
  name: snapshotUsage
  summary: 'Manual backup using an already existing snapshot. This will always be
    CreateNewSnapshot for

    scheduled backups and UseExistingSnapshot/CreateNewSnapshot for manual backups.
    Known values

    are: "UseExistingSnapshot" and "CreateNewSnapshot".'
  signature: 'snapshotUsage: str | SnapshotUsage'
- uid: azure.mgmt.netapp.types.ElasticBackupProperties.volumeSize
  name: volumeSize
  summary: '"Large" and "Regular".'
  signature: 'volumeSize: str | VolumeSize'
