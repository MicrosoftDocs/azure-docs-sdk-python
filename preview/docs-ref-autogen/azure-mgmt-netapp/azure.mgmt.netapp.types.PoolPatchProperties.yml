### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.PoolPatchProperties
name: PoolPatchProperties
fullName: azure.mgmt.netapp.types.PoolPatchProperties
module: azure.mgmt.netapp.types
summary: Patchable pool properties.
constructor:
  syntax: PoolPatchProperties()
variables:
- description: 'Provisioned size of the pool (in bytes). Allowed values are 512GiB
    (549755813888

    bytes) or in 1TiB chunks (value must be multiple of 1099511627776).'
  name: size
  types:
  - <xref:int>
- description: 'The qos type of the pool. Known values are: "Auto" and "Manual".'
  name: qosType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"QosType">]
- description: If enabled (true) the pool can contain cool Access enabled volumes.
  name: coolAccess
  types:
  - <xref:bool>
- description: 'Maximum throughput in MiB/s that can be achieved by this pool and

    this will be accepted as input only for manual qosType pool with Flexible service
    level.'
  name: customThroughputMibps
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.netapp.types.PoolPatchProperties.coolAccess
  name: coolAccess
  summary: If enabled (true) the pool can contain cool Access enabled volumes.
  signature: 'coolAccess: bool'
- uid: azure.mgmt.netapp.types.PoolPatchProperties.customThroughputMibps
  name: customThroughputMibps
  summary: 'Maximum throughput in MiB/s that can be achieved by this pool and this
    will be accepted as

    input only for manual qosType pool with Flexible service level.'
  signature: 'customThroughputMibps: int | None'
- uid: azure.mgmt.netapp.types.PoolPatchProperties.qosType
  name: qosType
  summary: '"Auto" and "Manual".'
  signature: 'qosType: str | QosType'
- uid: azure.mgmt.netapp.types.PoolPatchProperties.size
  name: size
  summary: 'Provisioned size of the pool (in bytes). Allowed values are 512GiB (549755813888
    bytes) or in

    1TiB chunks (value must be multiple of 1099511627776).'
  signature: 'size: int'
