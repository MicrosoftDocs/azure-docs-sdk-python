### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.CertificateAkvDetails
name: CertificateAkvDetails
fullName: azure.mgmt.netapp.types.CertificateAkvDetails
module: azure.mgmt.netapp.types
summary: Specifies the Azure Key Vault settings for retrieving the bucket server certificate.
constructor:
  syntax: CertificateAkvDetails()
variables:
- description: 'The base URI of the Azure Key Vault that is used when retrieving

    the bucket certificate.'
  name: certificateKeyVaultUri
  types:
  - <xref:str>
- description: The name of the bucket server certificate stored in the Azure Key Vault.
  name: certificateName
  types:
  - <xref:str>
- description: 'Optional resource ID of the managed identity that has access to the

    Azure Key Vault (AKV) secret. If a value is provided, it is used to find a matching
    entry in

    the account''s collection of user-assigned managed identities. If no match is
    found, an

    exception is thrown. If no value is provided, the system-assigned managed identity
    is used.'
  name: userAssignedIdentity
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.netapp.types.CertificateAkvDetails.certificateKeyVaultUri
  name: certificateKeyVaultUri
  summary: The base URI of the Azure Key Vault that is used when retrieving the bucket
    certificate.
  signature: 'certificateKeyVaultUri: str'
- uid: azure.mgmt.netapp.types.CertificateAkvDetails.certificateName
  name: certificateName
  summary: The name of the bucket server certificate stored in the Azure Key Vault.
  signature: 'certificateName: str'
- uid: azure.mgmt.netapp.types.CertificateAkvDetails.userAssignedIdentity
  name: userAssignedIdentity
  summary: 'Optional resource ID of the managed identity that has access to the Azure
    Key Vault (AKV)

    secret. If a value is provided, it is used to find a matching entry in the account''s
    collection

    of user-assigned managed identities. If no match is found, an exception is thrown.
    If no value

    is provided, the system-assigned managed identity is used.'
  signature: 'userAssignedIdentity: str'
