### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.ActiveDirectoryConfigUpdateProperties
name: ActiveDirectoryConfigUpdateProperties
fullName: azure.mgmt.netapp.types.ActiveDirectoryConfigUpdateProperties
module: azure.mgmt.netapp.types
summary: The updatable properties of the ActiveDirectoryConfig.
constructor:
  syntax: ActiveDirectoryConfigUpdateProperties()
variables:
- description: A domain user account with permission to create machine accounts.
  name: userName
  types:
  - <xref:str>
- description: An array of DNS server IP addresses(IPv4 only) for the Active Directory.
  name: dns
  types:
  - <xref:list>[<xref:str>]
- description: 'NetBIOS name of the SMB server. This name will be registered as a
    computer

    account in the AD and used to mount volumes.'
  name: smbServerName
  types:
  - <xref:str>
- description: The Organizational Unit (OU) within the Windows Active Directory.
  name: organizationalUnit
  types:
  - <xref:str>
- description: The Active Directory site the service will limit Domain Controller
    discovery to.
  name: site
  types:
  - <xref:str>
- description: 'Users to be added to the Built-in Backup Operator active directory

    group. A list of unique usernames without domain specifier.'
  name: backupOperators
  types:
  - <xref:list>[<xref:str>]
- description: 'Users to be added to the Built-in Administrators active directory
    group.

    A list of unique usernames without domain specifier.'
  name: administrators
  types:
  - <xref:list>[<xref:str>]
- description: 'Domain Users in the Active directory to be given SecurityPrivilege

    privilege (Needed for SMB Continuously available shares for SQL). A list of unique
    usernames

    without domain specifier.'
  name: securityOperators
  types:
  - <xref:list>[<xref:str>]
- description: Name of the Active Directory domain.
  name: domain
  types:
  - <xref:str>
- description: Access password from Azure KeyVault Secrets to connect Active Directory.
  name: secretPassword
  types:
  - <xref:<xref:"SecretPassword">>
attributes:
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigUpdateProperties.administrators
  name: administrators
  summary: 'Users to be added to the Built-in Administrators active directory group.
    A list of unique

    usernames without domain specifier.'
  signature: 'administrators: list[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigUpdateProperties.backupOperators
  name: backupOperators
  summary: 'Users to be added to the Built-in Backup Operator active directory group.
    A list of unique

    usernames without domain specifier.'
  signature: 'backupOperators: list[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigUpdateProperties.dns
  name: dns
  summary: An array of DNS server IP addresses(IPv4 only) for the Active Directory.
  signature: 'dns: list[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigUpdateProperties.domain
  name: domain
  summary: Name of the Active Directory domain.
  signature: 'domain: str'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigUpdateProperties.organizationalUnit
  name: organizationalUnit
  summary: The Organizational Unit (OU) within the Windows Active Directory.
  signature: 'organizationalUnit: str'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigUpdateProperties.secretPassword
  name: secretPassword
  summary: Access password from Azure KeyVault Secrets to connect Active Directory.
  signature: 'secretPassword: SecretPassword'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigUpdateProperties.securityOperators
  name: securityOperators
  summary: 'Domain Users in the Active directory to be given SecurityPrivilege privilege
    (Needed for SMB

    Continuously available shares for SQL). A list of unique usernames without domain
    specifier.'
  signature: 'securityOperators: list[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigUpdateProperties.site
  name: site
  summary: The Active Directory site the service will limit Domain Controller discovery
    to.
  signature: 'site: str'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigUpdateProperties.smbServerName
  name: smbServerName
  summary: 'NetBIOS name of the SMB server. This name will be registered as a computer
    account in the AD

    and used to mount volumes.'
  signature: 'smbServerName: str'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigUpdateProperties.userName
  name: userName
  summary: A domain user account with permission to create machine accounts.
  signature: 'userName: str'
