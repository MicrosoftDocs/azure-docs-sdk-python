### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.RansomwareProtectionSettings
name: RansomwareProtectionSettings
fullName: azure.mgmt.netapp.types.RansomwareProtectionSettings
module: azure.mgmt.netapp.types
summary: Advanced Ransomware Protection reports (ARP) settings.
constructor:
  syntax: RansomwareProtectionSettings()
variables:
- description: 'The desired value of the Advanced Ransomware Protection

    feature state available to the volume. Known values are: "Disabled" and "Enabled".'
  name: desiredRansomwareProtectionState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DesiredRansomwareProtectionState">]
- description: 'The actual state of the Advanced Ransomware Protection

    feature currently active on the volume. Known values are: "Disabled", "Enabled",
    "Learning",

    and "Paused".'
  name: actualRansomwareProtectionState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActualRansomwareProtectionState">]
attributes:
- uid: azure.mgmt.netapp.types.RansomwareProtectionSettings.actualRansomwareProtectionState
  name: actualRansomwareProtectionState
  summary: 'The actual state of the Advanced Ransomware Protection feature currently
    active on the volume.

    Known values are: "Disabled", "Enabled", "Learning", and "Paused".'
  signature: 'actualRansomwareProtectionState: str | ActualRansomwareProtectionState'
- uid: azure.mgmt.netapp.types.RansomwareProtectionSettings.desiredRansomwareProtectionState
  name: desiredRansomwareProtectionState
  summary: 'The desired value of the Advanced Ransomware Protection feature state
    available to the volume.

    Known values are: "Disabled" and "Enabled".'
  signature: 'desiredRansomwareProtectionState: str | DesiredRansomwareProtectionState'
