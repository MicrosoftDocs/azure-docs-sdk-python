### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.ActiveDirectory
name: ActiveDirectory
fullName: azure.mgmt.netapp.types.ActiveDirectory
module: azure.mgmt.netapp.types
summary: Active Directory.
constructor:
  syntax: ActiveDirectory()
variables:
- description: Id of the Active Directory.
  name: activeDirectoryId
  types:
  - <xref:str>
- description: A domain user account with permission to create machine accounts.
  name: username
  types:
  - <xref:str>
- description: 'Plain text password of Active Directory domain administrator, value
    is masked

    in the response.'
  name: password
  types:
  - <xref:str>
- description: Name of the Active Directory domain.
  name: domain
  types:
  - <xref:str>
- description: 'Comma separated list of DNS server IP addresses (IPv4 only) for the
    Active Directory

    domain.'
  name: dns
  types:
  - <xref:str>
- description: 'Status of the Active Directory. Known values are: "Created", "InUse",
    "Deleted",

    "Error", and "Updating".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActiveDirectoryStatus">]
- description: Any details in regards to the Status of the Active Directory.
  name: statusDetails
  types:
  - <xref:str>
- description: 'NetBIOS name of the SMB server. This name will be registered as a
    computer

    account in the AD and used to mount volumes.'
  name: smbServerName
  types:
  - <xref:str>
- description: The Organizational Unit (OU) within the Windows Active Directory.
  name: organizationalUnit
  types:
  - <xref:str>
- description: The Active Directory site the service will limit Domain Controller
    discovery to.
  name: site
  types:
  - <xref:str>
- description: 'Users to be added to the Built-in Backup Operator active directory

    group. A list of unique usernames without domain specifier.'
  name: backupOperators
  types:
  - <xref:list>[<xref:str>]
- description: 'Users to be added to the Built-in Administrators active directory
    group.

    A list of unique usernames without domain specifier.'
  name: administrators
  types:
  - <xref:list>[<xref:str>]
- description: 'kdc server IP address for the active directory machine. This optional
    parameter is

    used only while creating kerberos volume.'
  name: kdcIP
  types:
  - <xref:str>
- description: 'Name of the active directory machine. This optional parameter is used
    only while

    creating kerberos volume.'
  name: adName
  types:
  - <xref:str>
- description: 'When LDAP over SSL/TLS is enabled, the LDAP client is required

    to have base64 encoded Active Directory Certificate Service''s self-signed root
    CA certificate,

    this optional parameter is used only for dual protocol with LDAP user-mapping
    volumes.'
  name: serverRootCACertificate
  types:
  - <xref:str>
- description: If enabled, AES encryption will be enabled for SMB communication.
  name: aesEncryption
  types:
  - <xref:bool>
- description: Specifies whether or not the LDAP traffic needs to be signed.
  name: ldapSigning
  types:
  - <xref:bool>
- description: 'Domain Users in the Active directory to be given SeSecurityPrivilege

    privilege (Needed for SMB Continuously available shares for SQL). A list of unique
    usernames

    without domain specifier.'
  name: securityOperators
  types:
  - <xref:list>[<xref:str>]
- description: Specifies whether or not the LDAP traffic needs to be secured via TLS.
  name: ldapOverTLS
  types:
  - <xref:bool>
- description: 'If enabled, NFS client local users can also (in addition to

    LDAP users) access the NFS volumes.'
  name: allowLocalNfsUsersWithLdap
  types:
  - <xref:bool>
- description: 'If enabled, Traffic between the SMB server to Domain Controller

    (DC) will be encrypted.'
  name: encryptDCConnections
  types:
  - <xref:bool>
- description: LDAP Search scope options.
  name: ldapSearchScope
  types:
  - <xref:<xref:"LdapSearchScopeOpt">>
- description: 'Comma separated list of IPv4 addresses of preferred

    servers for LDAP client. At most two comma separated IPv4 addresses can be passed.'
  name: preferredServersForLdapClient
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.netapp.types.ActiveDirectory.activeDirectoryId
  name: activeDirectoryId
  summary: Id of the Active Directory.
  signature: 'activeDirectoryId: str | None'
- uid: azure.mgmt.netapp.types.ActiveDirectory.adName
  name: adName
  summary: 'Name of the active directory machine. This optional parameter is used
    only while creating

    kerberos volume.'
  signature: 'adName: str'
- uid: azure.mgmt.netapp.types.ActiveDirectory.administrators
  name: administrators
  summary: 'Users to be added to the Built-in Administrators active directory group.
    A list of unique

    usernames without domain specifier.'
  signature: 'administrators: list[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectory.aesEncryption
  name: aesEncryption
  summary: If enabled, AES encryption will be enabled for SMB communication.
  signature: 'aesEncryption: bool'
- uid: azure.mgmt.netapp.types.ActiveDirectory.allowLocalNfsUsersWithLdap
  name: allowLocalNfsUsersWithLdap
  summary: If enabled, NFS client local users can also (in addition to LDAP users)
    access the NFS volumes.
  signature: 'allowLocalNfsUsersWithLdap: bool'
- uid: azure.mgmt.netapp.types.ActiveDirectory.backupOperators
  name: backupOperators
  summary: 'Users to be added to the Built-in Backup Operator active directory group.
    A list of unique

    usernames without domain specifier.'
  signature: 'backupOperators: list[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectory.dns
  name: dns
  summary: Comma separated list of DNS server IP addresses (IPv4 only) for the Active
    Directory domain.
  signature: 'dns: str'
- uid: azure.mgmt.netapp.types.ActiveDirectory.domain
  name: domain
  summary: Name of the Active Directory domain.
  signature: 'domain: str'
- uid: azure.mgmt.netapp.types.ActiveDirectory.encryptDCConnections
  name: encryptDCConnections
  summary: If enabled, Traffic between the SMB server to Domain Controller (DC) will
    be encrypted.
  signature: 'encryptDCConnections: bool'
- uid: azure.mgmt.netapp.types.ActiveDirectory.kdcIP
  name: kdcIP
  summary: 'kdc server IP address for the active directory machine. This optional
    parameter is used only

    while creating kerberos volume.'
  signature: 'kdcIP: str'
- uid: azure.mgmt.netapp.types.ActiveDirectory.ldapOverTLS
  name: ldapOverTLS
  summary: Specifies whether or not the LDAP traffic needs to be secured via TLS.
  signature: 'ldapOverTLS: bool'
- uid: azure.mgmt.netapp.types.ActiveDirectory.ldapSearchScope
  name: ldapSearchScope
  summary: LDAP Search scope options.
  signature: 'ldapSearchScope: LdapSearchScopeOpt'
- uid: azure.mgmt.netapp.types.ActiveDirectory.ldapSigning
  name: ldapSigning
  summary: Specifies whether or not the LDAP traffic needs to be signed.
  signature: 'ldapSigning: bool'
- uid: azure.mgmt.netapp.types.ActiveDirectory.organizationalUnit
  name: organizationalUnit
  summary: The Organizational Unit (OU) within the Windows Active Directory.
  signature: 'organizationalUnit: str'
- uid: azure.mgmt.netapp.types.ActiveDirectory.password
  name: password
  summary: Plain text password of Active Directory domain administrator, value is
    masked in the response.
  signature: 'password: str'
- uid: azure.mgmt.netapp.types.ActiveDirectory.preferredServersForLdapClient
  name: preferredServersForLdapClient
  summary: 'Comma separated list of IPv4 addresses of preferred servers for LDAP client.
    At most two comma

    separated IPv4 addresses can be passed.'
  signature: 'preferredServersForLdapClient: str'
- uid: azure.mgmt.netapp.types.ActiveDirectory.securityOperators
  name: securityOperators
  summary: 'Domain Users in the Active directory to be given SeSecurityPrivilege privilege
    (Needed for SMB

    Continuously available shares for SQL). A list of unique usernames without domain
    specifier.'
  signature: 'securityOperators: list[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectory.serverRootCACertificate
  name: serverRootCACertificate
  summary: 'When LDAP over SSL/TLS is enabled, the LDAP client is required to have
    base64 encoded Active

    Directory Certificate Service''s self-signed root CA certificate, this optional
    parameter is

    used only for dual protocol with LDAP user-mapping volumes.'
  signature: 'serverRootCACertificate: str'
- uid: azure.mgmt.netapp.types.ActiveDirectory.site
  name: site
  summary: The Active Directory site the service will limit Domain Controller discovery
    to.
  signature: 'site: str'
- uid: azure.mgmt.netapp.types.ActiveDirectory.smbServerName
  name: smbServerName
  summary: 'NetBIOS name of the SMB server. This name will be registered as a computer
    account in the AD

    and used to mount volumes.'
  signature: 'smbServerName: str'
- uid: azure.mgmt.netapp.types.ActiveDirectory.status
  name: status
  summary: '"Created", "InUse", "Deleted",

    "Error", and "Updating".'
  signature: 'status: str | ActiveDirectoryStatus'
- uid: azure.mgmt.netapp.types.ActiveDirectory.statusDetails
  name: statusDetails
  summary: Any details in regards to the Status of the Active Directory.
  signature: 'statusDetails: str'
- uid: azure.mgmt.netapp.types.ActiveDirectory.username
  name: username
  summary: A domain user account with permission to create machine accounts.
  signature: 'username: str'
