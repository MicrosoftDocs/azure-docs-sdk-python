### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties
name: ActiveDirectoryConfigProperties
fullName: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties
module: azure.mgmt.netapp.types
summary: Active Directory Configuration properties.
constructor:
  syntax: ActiveDirectoryConfigProperties()
variables:
- description: A domain user account with permission to create machine accounts.
  name: userName
  types:
  - <xref:str>
- description: An array of DNS server IP addresses(IPv4 only) for the Active Directory.
  name: dns
  types:
  - <xref:list>[<xref:str>]
- description: 'NetBIOS name of the SMB server. This name will be registered as a
    computer

    account in the AD and used to mount volumes.'
  name: smbServerName
  types:
  - <xref:str>
- description: The Organizational Unit (OU) within the Windows Active Directory.
  name: organizationalUnit
  types:
  - <xref:str>
- description: 'The Active Directory site the service will limit Domain Controller
    discovery to.

    Required.'
  name: site
  types:
  - <xref:str>
- description: 'Users to be added to the Built-in Backup Operator active directory

    group. A list of unique usernames without domain specifier.'
  name: backupOperators
  types:
  - <xref:list>[<xref:str>]
- description: 'Users to be added to the Built-in Administrators active directory
    group.

    A list of unique usernames without domain specifier.'
  name: administrators
  types:
  - <xref:list>[<xref:str>]
- description: 'Domain Users in the Active directory to be given SecurityPrivilege

    privilege (Needed for SMB Continuously available shares for SQL). A list of unique
    usernames

    without domain specifier.'
  name: securityOperators
  types:
  - <xref:list>[<xref:str>]
- description: 'Status of the Active Directory. Known values are: "Created",

    "InUse", "Deleted", "Error", and "Updating".'
  name: activeDirectoryStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActiveDirectoryStatus">]
- description: 'Azure lifecycle management. Known values are: "Accepted", "Creating",

    "Patching", "Updating", "Deleting", "Moving", "Failed", and "Succeeded".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetAppProvisioningState">]
- description: Name of the Active Directory domain. Required.
  name: domain
  types:
  - <xref:str>
- description: 'Access password from Azure KeyVault Secrets to connect Active Directory.

    Required.'
  name: secretPassword
  types:
  - <xref:<xref:"SecretPassword">>
attributes:
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties.activeDirectoryStatus
  name: activeDirectoryStatus
  summary: '"Created", "InUse", "Deleted",

    "Error", and "Updating".'
  signature: 'activeDirectoryStatus: str | ActiveDirectoryStatus'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties.administrators
  name: administrators
  summary: 'Users to be added to the Built-in Administrators active directory group.
    A list of unique

    usernames without domain specifier.'
  signature: 'administrators: list[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties.backupOperators
  name: backupOperators
  summary: 'Users to be added to the Built-in Backup Operator active directory group.
    A list of unique

    usernames without domain specifier.'
  signature: 'backupOperators: list[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties.dns
  name: dns
  summary: An array of DNS server IP addresses(IPv4 only) for the Active Directory.
  signature: 'dns: list[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties.domain
  name: domain
  summary: Name of the Active Directory domain. Required.
  signature: 'domain: Required[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties.organizationalUnit
  name: organizationalUnit
  summary: The Organizational Unit (OU) within the Windows Active Directory.
  signature: 'organizationalUnit: str'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties.provisioningState
  name: provisioningState
  summary: '"Accepted", "Creating", "Patching",

    "Updating", "Deleting", "Moving", "Failed", and "Succeeded".'
  signature: 'provisioningState: str | NetAppProvisioningState'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties.secretPassword
  name: secretPassword
  summary: Access password from Azure KeyVault Secrets to connect Active Directory.
    Required.
  signature: 'secretPassword: Required[SecretPassword]'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties.securityOperators
  name: securityOperators
  summary: 'Domain Users in the Active directory to be given SecurityPrivilege privilege
    (Needed for SMB

    Continuously available shares for SQL). A list of unique usernames without domain
    specifier.'
  signature: 'securityOperators: list[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties.site
  name: site
  summary: The Active Directory site the service will limit Domain Controller discovery
    to. Required.
  signature: 'site: Required[str]'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties.smbServerName
  name: smbServerName
  summary: 'NetBIOS name of the SMB server. This name will be registered as a computer
    account in the AD

    and used to mount volumes.'
  signature: 'smbServerName: str'
- uid: azure.mgmt.netapp.types.ActiveDirectoryConfigProperties.userName
  name: userName
  summary: A domain user account with permission to create machine accounts.
  signature: 'userName: str'
