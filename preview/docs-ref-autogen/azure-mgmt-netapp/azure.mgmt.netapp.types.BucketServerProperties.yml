### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.BucketServerProperties
name: BucketServerProperties
fullName: azure.mgmt.netapp.types.BucketServerProperties
module: azure.mgmt.netapp.types
summary: Properties of the server managing the lifecycle of volume buckets.
constructor:
  syntax: BucketServerProperties()
variables:
- description: 'The host part of the bucket URL, resolving to the bucket IP address
    and allowed by

    the server certificate.'
  name: fqdn
  types:
  - <xref:str>
- description: 'Certificate Common Name taken from the certificate installed on

    the bucket server.'
  name: certificateCommonName
  types:
  - <xref:str>
- description: The bucket server's certificate expiry date.
  name: certificateExpiryDate
  types:
  - <xref:str>
- description: The bucket server's IPv4 address.
  name: ipAddress
  types:
  - <xref:str>
- description: 'The base64-encoded contents of a PEM file, which includes both the

    bucket server''s certificate and private key. It is generated by the end user
    and allows the

    user to access volume data in a read-only manner. Note: This is only used when
    Azure Key Vault

    is not configured. This property is mutually exclusive with the Azure Key Vault
    ''akv''

    properties.'
  name: certificateObject
  types:
  - <xref:str>
- description: 'Action to take when there is a certificate conflict.

    Possible values include: ''Update'', ''Fail''. Known values are: "Update" and
    "Fail".'
  name: onCertificateConflictAction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OnCertificateConflictAction">]
attributes:
- uid: azure.mgmt.netapp.types.BucketServerProperties.certificateCommonName
  name: certificateCommonName
  summary: Certificate Common Name taken from the certificate installed on the bucket
    server.
  signature: 'certificateCommonName: str'
- uid: azure.mgmt.netapp.types.BucketServerProperties.certificateExpiryDate
  name: certificateExpiryDate
  summary: The bucket server's certificate expiry date.
  signature: 'certificateExpiryDate: str'
- uid: azure.mgmt.netapp.types.BucketServerProperties.certificateObject
  name: certificateObject
  summary: 'The base64-encoded contents of a PEM file, which includes both the bucket
    server''s certificate

    and private key. It is generated by the end user and allows the user to access
    volume data in a

    read-only manner. Note: This is only used when Azure Key Vault is not configured.
    This property

    is mutually exclusive with the Azure Key Vault ''akv'' properties.'
  signature: 'certificateObject: str'
- uid: azure.mgmt.netapp.types.BucketServerProperties.fqdn
  name: fqdn
  summary: 'The host part of the bucket URL, resolving to the bucket IP address and
    allowed by the server

    certificate.'
  signature: 'fqdn: str'
- uid: azure.mgmt.netapp.types.BucketServerProperties.ipAddress
  name: ipAddress
  summary: The bucket server's IPv4 address.
  signature: 'ipAddress: str'
- uid: azure.mgmt.netapp.types.BucketServerProperties.onCertificateConflictAction
  name: onCertificateConflictAction
  summary: '''Update'', ''Fail''.

    Known values are: "Update" and "Fail".'
  signature: 'onCertificateConflictAction: str | OnCertificateConflictAction'
