### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.ElasticExportPolicyRule
name: ElasticExportPolicyRule
fullName: azure.mgmt.netapp.types.ElasticExportPolicyRule
module: azure.mgmt.netapp.types
summary: Elastic Volume Export Policy Rule.
constructor:
  syntax: ElasticExportPolicyRule()
variables:
- description: 'Controls the priority of the export policy rule. When connecting to
    the volume

    the rule with the lowest index that applies to the connecting client is used.'
  name: ruleIndex
  types:
  - <xref:int>
- description: 'Specifies the Unix file access level for the volume. It encompasses
    both

    read-only and read-write permissions. Additionally, NoAccess can be set to block
    all access to

    the volume. Known values are: "ReadOnly", "ReadWrite", and "NoAccess".'
  name: unixAccessRule
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ElasticUnixAccessRule">]
- description: 'Allows clients to access the volume with the NFSv3 protocol. Enable
    only for NFSv3

    type volumes. Known values are: "Enabled" and "Disabled".'
  name: nfsv3
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ElasticNfsv3Access">]
- description: 'Allows clients to access the volume with at least NFSv4.1 protocol.
    Known values

    are: "Enabled" and "Disabled".'
  name: nfsv4
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ElasticNfsv4Access">]
- description: 'Client ingress specification for the export policy as list of IPv4
    CIDRs,

    IPv4 host addresses and host names.'
  name: allowedClients
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates whether root access to the volume is granted to clients
    affected by

    this rule. Known values are: "Enabled" and "Disabled".'
  name: rootAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ElasticRootAccess">]
attributes:
- uid: azure.mgmt.netapp.types.ElasticExportPolicyRule.allowedClients
  name: allowedClients
  summary: 'Client ingress specification for the export policy as list of IPv4 CIDRs,
    IPv4 host addresses

    and host names.'
  signature: 'allowedClients: list[str]'
- uid: azure.mgmt.netapp.types.ElasticExportPolicyRule.nfsv3
  name: nfsv3
  summary: 'Allows clients to access the volume with the NFSv3 protocol. Enable only
    for NFSv3 type

    volumes. Known values are: "Enabled" and "Disabled".'
  signature: 'nfsv3: str | ElasticNfsv3Access'
- uid: azure.mgmt.netapp.types.ElasticExportPolicyRule.nfsv4
  name: nfsv4
  summary: 'Allows clients to access the volume with at least NFSv4.1 protocol. Known
    values are:

    "Enabled" and "Disabled".'
  signature: 'nfsv4: str | ElasticNfsv4Access'
- uid: azure.mgmt.netapp.types.ElasticExportPolicyRule.rootAccess
  name: rootAccess
  summary: 'Indicates whether root access to the volume is granted to clients affected
    by this rule. Known

    values are: "Enabled" and "Disabled".'
  signature: 'rootAccess: str | ElasticRootAccess'
- uid: azure.mgmt.netapp.types.ElasticExportPolicyRule.ruleIndex
  name: ruleIndex
  summary: 'Controls the priority of the export policy rule. When connecting to the
    volume the rule with

    the lowest index that applies to the connecting client is used.'
  signature: 'ruleIndex: int'
- uid: azure.mgmt.netapp.types.ElasticExportPolicyRule.unixAccessRule
  name: unixAccessRule
  summary: 'Specifies the Unix file access level for the volume. It encompasses both
    read-only and

    read-write permissions. Additionally, NoAccess can be set to block all access
    to the volume.

    Known values are: "ReadOnly", "ReadWrite", and "NoAccess".'
  signature: 'unixAccessRule: str | ElasticUnixAccessRule'
