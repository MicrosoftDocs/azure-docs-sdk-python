### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.CredentialsAkvDetails
name: CredentialsAkvDetails
fullName: azure.mgmt.netapp.types.CredentialsAkvDetails
module: azure.mgmt.netapp.types
summary: Specifies the Azure Key Vault settings for storing the bucket credentials.
constructor:
  syntax: CredentialsAkvDetails()
variables:
- description: 'The base URI of the Azure Key Vault that is used when storing the

    bucket credentials.'
  name: credentialsKeyVaultUri
  types:
  - <xref:str>
- description: 'The name of the secret stored in Azure Key Vault. The associated key
    pair has

    the following structure:


    {

    "access_key_id": "<REDACTED>",

    "secret_access_key": "<REDACTED>"

    }.'
  name: secretName
  types:
  - <xref:str>
- description: 'Optional resource ID of the managed identity that has access to the

    Azure Key Vault (AKV) secret. If a value is provided, it is used to find a matching
    entry in

    the account''s collection of user-assigned managed identities. If no match is
    found, an

    exception is thrown. If no value is provided, the system-assigned managed identity
    is used.'
  name: userAssignedIdentity
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.netapp.types.CredentialsAkvDetails.credentialsKeyVaultUri
  name: credentialsKeyVaultUri
  summary: The base URI of the Azure Key Vault that is used when storing the bucket
    credentials.
  signature: 'credentialsKeyVaultUri: str'
- uid: azure.mgmt.netapp.types.CredentialsAkvDetails.secretName
  name: secretName
  summary: 'The name of the secret stored in Azure Key Vault. The associated key pair
    has the following

    structure:


    {

    "access_key_id": "<REDACTED>",

    "secret_access_key": "<REDACTED>"

    }.'
  signature: 'secretName: str'
- uid: azure.mgmt.netapp.types.CredentialsAkvDetails.userAssignedIdentity
  name: userAssignedIdentity
  summary: 'Optional resource ID of the managed identity that has access to the Azure
    Key Vault (AKV)

    secret. If a value is provided, it is used to find a matching entry in the account''s
    collection

    of user-assigned managed identities. If no match is found, an exception is thrown.
    If no value

    is provided, the system-assigned managed identity is used.'
  signature: 'userAssignedIdentity: str'
