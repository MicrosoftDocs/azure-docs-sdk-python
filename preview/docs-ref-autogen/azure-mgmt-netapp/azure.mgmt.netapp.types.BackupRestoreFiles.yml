### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.BackupRestoreFiles
name: BackupRestoreFiles
fullName: azure.mgmt.netapp.types.BackupRestoreFiles
module: azure.mgmt.netapp.types
summary: Restore payload for Single File Backup Restore.
constructor:
  syntax: BackupRestoreFiles()
variables:
- description: List of files to be restored. Required.
  name: fileList
  types:
  - <xref:list>[<xref:str>]
- description: 'Destination folder where the files will be restored. The path name

    should start with a forward slash. If it is omitted from request then restore
    is done at the

    root folder of the destination volume by default.'
  name: restoreFilePath
  types:
  - <xref:str>
- description: 'Resource Id of the destination volume on which the files need to be

    restored. Required.'
  name: destinationVolumeId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.netapp.types.BackupRestoreFiles.destinationVolumeId
  name: destinationVolumeId
  summary: Resource Id of the destination volume on which the files need to be restored.
    Required.
  signature: 'destinationVolumeId: str'
- uid: azure.mgmt.netapp.types.BackupRestoreFiles.fileList
  name: fileList
  summary: List of files to be restored. Required.
  signature: 'fileList: list[str]'
- uid: azure.mgmt.netapp.types.BackupRestoreFiles.restoreFilePath
  name: restoreFilePath
  summary: 'Destination folder where the files will be restored. The path name should
    start with a forward

    slash. If it is omitted from request then restore is done at the root folder of
    the destination

    volume by default.'
  signature: 'restoreFilePath: str'
