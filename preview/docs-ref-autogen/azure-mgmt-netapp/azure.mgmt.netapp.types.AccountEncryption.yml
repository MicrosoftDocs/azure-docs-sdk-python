uid: azure.mgmt.netapp.types.AccountEncryption
name: AccountEncryption
fullName: azure.mgmt.netapp.types.AccountEncryption
module: azure.mgmt.netapp.types
summary: Encryption settings.
constructor:
  syntax: AccountEncryption()
variables:
- description: 'The encryption keySource (provider). Possible values (case-insensitive):

    Microsoft.NetApp, Microsoft.KeyVault. Known values are: "Microsoft.NetApp" and

    "Microsoft.KeyVault".'
  name: keySource
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KeySource">]
- description: 'Properties provided by KeVault. Applicable if keySource is

    ''Microsoft.KeyVault''.'
  name: keyVaultProperties
  types:
  - <xref:<xref:"KeyVaultProperties">>
- description: 'Identity used to authenticate to KeyVault. Applicable if keySource
    is

    ''Microsoft.KeyVault''.'
  name: identity
  types:
  - <xref:<xref:"EncryptionIdentity">>
attributes:
- uid: azure.mgmt.netapp.types.AccountEncryption.identity
  name: identity
  summary: Identity used to authenticate to KeyVault. Applicable if keySource is 'Microsoft.KeyVault'.
  signature: 'identity: EncryptionIdentity'
- uid: azure.mgmt.netapp.types.AccountEncryption.keySource
  name: keySource
  summary: 'Microsoft.NetApp,

    Microsoft.KeyVault. Known values are: "Microsoft.NetApp" and "Microsoft.KeyVault".'
  signature: 'keySource: str | KeySource'
- uid: azure.mgmt.netapp.types.AccountEncryption.keyVaultProperties
  name: keyVaultProperties
