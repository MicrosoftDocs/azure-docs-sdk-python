### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.ElasticVolumeProperties
name: ElasticVolumeProperties
fullName: azure.mgmt.netapp.types.ElasticVolumeProperties
module: azure.mgmt.netapp.types
summary: Elastic Volume properties.
constructor:
  syntax: ElasticVolumeProperties()
variables:
- description: 'A unique file path for the volume. Used when creating mount targets.
    This

    needs to be unique within the elastic capacity pool. Required.'
  name: file_path
  types:
  - <xref:str>
- description: 'Maximum size allowed for a volume in bytes. Valid values are in the
    range 1GiB to

    16TiB. Values expressed in bytes as multiples of 1 GiB. Required.'
  name: size
  types:
  - <xref:int>
- description: Set of export policy rules.
  name: export_policy
  types:
  - <xref:<xref:"ElasticExportPolicy">>
- description: Set of support protocol types for the elastic volume. Required.
  name: protocol_types
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"ElasticProtocolType">]]
- description: 'Azure lifecycle management. Known values are: "Accepted", "Creating",

    "Patching", "Updating", "Deleting", "Moving", "Failed", and "Succeeded".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetAppProvisioningState">]
- description: 'Current availability status of the resource. Known values are:

    "Online" and "Offline".'
  name: availability_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ElasticResourceAvailabilityStatus">]
- description: Resource identifier used to identify the Elastic Snapshot.
  name: snapshot_resource_id
  types:
  - <xref:str>
- description: List of mount targets that can be used to mount this volume.
  name: mount_targets
  types:
  - <xref:list>[<xref:"ElasticMountTargetProperties">]
- description: 'Data protection configuration option for the volume, including snapshot

    policies and backup.'
  name: data_protection
  types:
  - <xref:<xref:"ElasticVolumeDataProtectionProperties">>
- description: 'Controls the visibility of the volume''s read-only snapshot

    directory, which provides access to each of the volume''s snapshots. Known values
    are: "Hidden"

    and "Visible".'
  name: snapshot_directory_visibility
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SnapshotDirectoryVisibility">]
- description: SMB Properties.
  name: smb_properties
  types:
  - <xref:<xref:"ElasticSmbProperties">>
- description: Resource identifier used to identify the Elastic Backup.
  name: backup_resource_id
  types:
  - <xref:str>
- description: 'The current state of the restoration process. Known values are:

    "Restoring", "Restored", and "Failed".'
  name: restoration_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ElasticVolumeRestorationState">]
attributes:
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.availabilityStatus
  name: availabilityStatus
  summary: '"Online" and "Offline".'
  signature: 'availabilityStatus: str | ElasticResourceAvailabilityStatus'
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.backupResourceId
  name: backupResourceId
  summary: Resource identifier used to identify the Elastic Backup.
  signature: 'backupResourceId: str'
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.dataProtection
  name: dataProtection
  summary: Data protection configuration option for the volume, including snapshot
    policies and backup.
  signature: 'dataProtection: ElasticVolumeDataProtectionProperties'
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.exportPolicy
  name: exportPolicy
  summary: Set of export policy rules.
  signature: 'exportPolicy: ElasticExportPolicy'
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.filePath
  name: filePath
  summary: 'A unique file path for the volume. Used when creating mount targets. This
    needs to be unique

    within the elastic capacity pool. Required.'
  signature: 'filePath: Required[str]'
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.mountTargets
  name: mountTargets
  summary: List of mount targets that can be used to mount this volume.
  signature: 'mountTargets: list[''ElasticMountTargetProperties'']'
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.protocolTypes
  name: protocolTypes
  summary: Set of support protocol types for the elastic volume. Required.
  signature: 'protocolTypes: Union[str, ForwardRef(''ElasticProtocolType'')]]]'
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.provisioningState
  name: provisioningState
  summary: '"Accepted", "Creating", "Patching",

    "Updating", "Deleting", "Moving", "Failed", and "Succeeded".'
  signature: 'provisioningState: str | NetAppProvisioningState'
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.restorationState
  name: restorationState
  summary: '"Restoring", "Restored",

    and "Failed".'
  signature: 'restorationState: str | ElasticVolumeRestorationState'
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.size
  name: size
  summary: 'Maximum size allowed for a volume in bytes. Valid values are in the range
    1GiB to 16TiB. Values

    expressed in bytes as multiples of 1 GiB. Required.'
  signature: 'size: Required[int]'
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.smbProperties
  name: smbProperties
  summary: SMB Properties.
  signature: 'smbProperties: ElasticSmbProperties'
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.snapshotDirectoryVisibility
  name: snapshotDirectoryVisibility
  summary: 'Controls the visibility of the volume''s read-only snapshot directory,
    which provides access to

    each of the volume''s snapshots. Known values are: "Hidden" and "Visible".'
  signature: 'snapshotDirectoryVisibility: str | SnapshotDirectoryVisibility'
- uid: azure.mgmt.netapp.types.ElasticVolumeProperties.snapshotResourceId
  name: snapshotResourceId
  summary: Resource identifier used to identify the Elastic Snapshot.
  signature: 'snapshotResourceId: str'
