  signature: 'actualThroughputMibps: float'
- uid: azure.mgmt.netapp.types.CacheProperties.cacheState
  name: cacheState
  summary: '"ClusterPeeringOfferSent",

    "VserverPeeringOfferSent", "Creating", "Succeeded", and "Failed".'
  signature: 'cacheState: str | CacheLifeCycleState'
- uid: azure.mgmt.netapp.types.CacheProperties.cacheSubnetResourceId
  name: cacheSubnetResourceId
  summary: 'The Azure Resource URI for a delegated cache subnet that will be used
