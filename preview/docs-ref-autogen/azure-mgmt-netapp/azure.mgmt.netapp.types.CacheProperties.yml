### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.CacheProperties
name: CacheProperties
fullName: azure.mgmt.netapp.types.CacheProperties
module: azure.mgmt.netapp.types
summary: Cache resource properties.
constructor:
  syntax: CacheProperties()
variables:
- description: The file path of the Cache. Required.
  name: filePath
  types:
  - <xref:str>
- description: 'Maximum storage quota allowed for a file system in bytes. Valid values
    are in the

    range 50GiB to 1PiB. Values expressed in bytes as multiples of 1GiB. Required.'
  name: size
  types:
  - <xref:int>
- description: Set of export policy rules.
  name: exportPolicy
  types:
  - <xref:<xref:"CachePropertiesExportPolicy">>
- description: 'Set of supported protocol types, which include NFSv3, NFSv4 and SMB

    protocol.'
  name: protocolTypes
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"ProtocolTypes">]]
- description: 'Azure lifecycle management. Known values are: "Creating", "Updating",

    "Deleting", "Failed", "Succeeded", and "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CacheProvisioningState">]
- description: 'Azure NetApp Files Cache lifecycle management. Known values are:

    "ClusterPeeringOfferSent", "VserverPeeringOfferSent", "Creating", "Succeeded",
    and "Failed".'
  name: cacheState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CacheLifeCycleState">]
- description: 'The Azure Resource URI for a delegated cache subnet that will be

    used to allocate data IPs. Required.'
  name: cacheSubnetResourceId
  types:
  - <xref:str>
- description: 'The Azure Resource URI for a delegated subnet that will be used

    for ANF Intercluster Interface IP addresses. Required.'
  name: peeringSubnetResourceId
  types:
  - <xref:str>
- description: List of mount targets that can be used to mount this cache.
  name: mountTargets
  types:
  - <xref:list>[<xref:"CacheMountTargetProperties">]
- description: 'Describe if a cache is Kerberos enabled. Known values are: "Disabled"
    and

    "Enabled".'
  name: kerberos
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KerberosState">]
- description: SMB information for the cache.
  name: smbSettings
  types:
  - <xref:<xref:"SmbSettings">>
- description: 'Maximum throughput in MiB/s that can be achieved by this cache volume

    and this will be accepted as input only for manual qosType cache.'
  name: throughputMibps
  types:
  - <xref:float>
- description: 'Actual throughput in MiB/s for auto qosType volumes calculated

    based on size and serviceLevel.'
  name: actualThroughputMibps
  types:
  - <xref:float>
- description: 'Source of key used to encrypt data in the cache. Applicable if

    NetApp account has encryption.keySource = ''Microsoft.KeyVault''. Possible values

    (case-insensitive) are: ''Microsoft.NetApp, Microsoft.KeyVault''. Required. Known
    values are:

    "Microsoft.NetApp" and "Microsoft.KeyVault".'
  name: encryptionKeySource
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EncryptionKeySource">]
- description: 'The resource ID of private endpoint for KeyVault. It

    must reside in the same VNET as the volume. Only applicable if encryptionKeySource
    =

    ''Microsoft.KeyVault''.'
  name: keyVaultPrivateEndpointResourceId
  types:
  - <xref:str>
- description: Maximum number of files allowed.
  name: maximumNumberOfFiles
  types:
  - <xref:int>
- description: 'Specifies if the cache is encryption or not. Known values are: "Disabled"
    and

    "Enabled".'
  name: encryption
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EncryptionState">]
- description: 'Language supported for volume. Known values are: "c.utf-8", "utf8mb4",
    "ar",

    "ar.utf-8", "hr", "hr.utf-8", "cs", "cs.utf-8", "da", "da.utf-8", "nl", "nl.utf-8",
    "en",

    "en.utf-8", "fi", "fi.utf-8", "fr", "fr.utf-8", "de", "de.utf-8", "he", "he.utf-8",
    "hu",

    "hu.utf-8", "it", "it.utf-8", "ja", "ja.utf-8", "ja-v1", "ja-v1.utf-8", "ja-jp.pck",

    "ja-jp.pck.utf-8", "ja-jp.932", "ja-jp.932.utf-8", "ja-jp.pck-v2", "ja-jp.pck-v2.utf-8",
    "ko",

    "ko.utf-8", "no", "no.utf-8", "pl", "pl.utf-8", "pt", "pt.utf-8", "c", "ro", "ro.utf-8",
    "ru",

    "ru.utf-8", "zh", "zh.utf-8", "zh.gbk", "zh.gbk.utf-8", "zh-tw.big5", "zh-tw.big5.utf-8",

    "zh-tw", "zh-tw.utf-8", "sk", "sk.utf-8", "sl", "sl.utf-8", "es", "es.utf-8",
    "sv", "sv.utf-8",

    "tr", "tr.utf-8", "en-us", and "en-us.utf-8".'
  name: language
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VolumeLanguage">]
- description: 'Specifies whether LDAP is enabled or not for flexcache volume. Known
    values are:

    "Disabled" and "Enabled".'
  name: ldap
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LdapState">]
- description: 'Specifies the type of LDAP server for flexcache volume. Known values
    are:

    "ActiveDirectory" and "OpenLDAP".'
  name: ldapServerType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LdapServerType">]
- description: Origin cluster information. Required.
  name: originClusterInformation
  types:
  - <xref:<xref:"OriginClusterInformation">>
- description: 'Flag indicating whether a CIFS change notification is enabled

    for the cache. Known values are: "Disabled" and "Enabled".'
  name: cifsChangeNotifications
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CifsChangeNotifyState">]
- description: 'Flag indicating whether the global file lock is enabled for the cache.

    Known values are: "Disabled" and "Enabled".'
  name: globalFileLocking
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GlobalFileLockingState">]
- description: 'Flag indicating whether writeback is enabled for the cache. Known
    values are:

    "Disabled" and "Enabled".'
  name: writeBack
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EnableWriteBackState">]
- description: 'Flag indicating whether file access logs are enabled for the Cache,
    based

    on active diagnostic settings present on the Cache. Known values are: "Enabled"
    and "Disabled".'
  name: fileAccessLogs
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CacheFileAccessLogs">]
attributes:
- uid: azure.mgmt.netapp.types.CacheProperties.actualThroughputMibps
  name: actualThroughputMibps
  summary: Actual throughput in MiB/s for auto qosType volumes calculated based on
