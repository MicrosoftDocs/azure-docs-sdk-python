    "Microsoft.KeyVault".'
  signature: 'encryptionKeySource: Required[str | EncryptionKeySource]'
- uid: azure.mgmt.netapp.types.CacheProperties.exportPolicy
  name: exportPolicy
  summary: Set of export policy rules.
  signature: 'exportPolicy: CachePropertiesExportPolicy'
- uid: azure.mgmt.netapp.types.CacheProperties.fileAccessLogs
  name: fileAccessLogs
  summary: 'Flag indicating whether file access logs are enabled for the Cache, based
    on active diagnostic

    settings present on the Cache. Known values are: "Enabled" and "Disabled".'
  signature: 'fileAccessLogs: str | CacheFileAccessLogs'
- uid: azure.mgmt.netapp.types.CacheProperties.filePath
  name: filePath
  summary: The file path of the Cache. Required.
  signature: 'filePath: Required[str]'
- uid: azure.mgmt.netapp.types.CacheProperties.globalFileLocking
  name: globalFileLocking
  summary: 'Flag indicating whether the global file lock is enabled for the cache.
