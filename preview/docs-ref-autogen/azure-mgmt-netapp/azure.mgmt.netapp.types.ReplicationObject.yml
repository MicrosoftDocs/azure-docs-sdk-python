### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.ReplicationObject
name: ReplicationObject
fullName: azure.mgmt.netapp.types.ReplicationObject
module: azure.mgmt.netapp.types
summary: Replication properties.
constructor:
  syntax: ReplicationObject()
variables:
- description: Id.
  name: replicationId
  types:
  - <xref:str>
- description: 'Indicates whether the local volume is the source or destination for
    the

    Volume Replication. Known values are: "src" and "dst".'
  name: endpointType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EndpointType">]
- description: 'Schedule. Known values are: "_10minutely", "hourly", and "daily".'
  name: replicationSchedule
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationSchedule">]
- description: 'The resource ID of the remote volume. Required for cross region

    and cross zone replication.'
  name: remoteVolumeResourceId
  types:
  - <xref:str>
- description: 'The full path to a volume that is to be migrated into ANF. Required
    for

    Migration volumes.'
  name: remotePath
  types:
  - <xref:<xref:"RemotePath">>
- description: The remote region for the other end of the Volume Replication.
  name: remoteVolumeRegion
  types:
  - <xref:str>
- description: A list of destination replications.
  name: destinationReplications
  types:
  - <xref:list>[<xref:"DestinationReplication">]
- description: 'Property that only applies to external replications.

    Provides a machine-readable value for the status of the external replication setup.
    Known

    values are: "ClusterPeerRequired", "ClusterPeerPending", "VServerPeerRequired",

    "ReplicationCreateRequired", and "NoActionRequired".'
  name: externalReplicationSetupStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExternalReplicationSetupStatus">]
- description: 'Contains human-readable instructions on what the next step

    is to finish the external replication setup.'
  name: externalReplicationSetupInfo
  types:
  - <xref:str>
- description: 'The mirror state property describes the current status of data replication

    for a replication. It provides insight into whether the data is actively being
    mirrored, if the

    replication process has been paused, or if it has yet to be initialized. Known
    values are:

    "Uninitialized", "Mirrored", and "Broken".'
  name: mirrorState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MirrorState">]
- description: 'The status of the Volume Replication. Known values are: "Idle" and

    "Transferring".'
  name: relationshipStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VolumeReplicationRelationshipStatus">]
attributes:
- uid: azure.mgmt.netapp.types.ReplicationObject.destinationReplications
  name: destinationReplications
  summary: A list of destination replications.
  signature: 'destinationReplications: list[''DestinationReplication'']'
- uid: azure.mgmt.netapp.types.ReplicationObject.endpointType
  name: endpointType
  summary: 'Indicates whether the local volume is the source or destination for the
    Volume Replication.

    Known values are: "src" and "dst".'
  signature: 'endpointType: str | EndpointType'
- uid: azure.mgmt.netapp.types.ReplicationObject.externalReplicationSetupInfo
  name: externalReplicationSetupInfo
  summary: 'Contains human-readable instructions on what the next step is to finish
    the external

    replication setup.'
  signature: 'externalReplicationSetupInfo: str'
- uid: azure.mgmt.netapp.types.ReplicationObject.externalReplicationSetupStatus
  name: externalReplicationSetupStatus
  summary: 'Property that only applies to external replications. Provides a machine-readable
    value for the

    status of the external replication setup. Known values are: "ClusterPeerRequired",

    "ClusterPeerPending", "VServerPeerRequired", "ReplicationCreateRequired", and

    "NoActionRequired".'
  signature: 'externalReplicationSetupStatus: str | ExternalReplicationSetupStatus'
- uid: azure.mgmt.netapp.types.ReplicationObject.mirrorState
  name: mirrorState
  summary: 'The mirror state property describes the current status of data replication
    for a replication.

    It provides insight into whether the data is actively being mirrored, if the replication

    process has been paused, or if it has yet to be initialized. Known values are:

    "Uninitialized", "Mirrored", and "Broken".'
  signature: 'mirrorState: str | MirrorState'
- uid: azure.mgmt.netapp.types.ReplicationObject.relationshipStatus
  name: relationshipStatus
  summary: '"Idle" and "Transferring".'
  signature: 'relationshipStatus: str | VolumeReplicationRelationshipStatus'
- uid: azure.mgmt.netapp.types.ReplicationObject.remotePath
  name: remotePath
  summary: The full path to a volume that is to be migrated into ANF. Required for
    Migration volumes.
  signature: 'remotePath: RemotePath'
- uid: azure.mgmt.netapp.types.ReplicationObject.remoteVolumeRegion
  name: remoteVolumeRegion
  summary: The remote region for the other end of the Volume Replication.
  signature: 'remoteVolumeRegion: str'
- uid: azure.mgmt.netapp.types.ReplicationObject.remoteVolumeResourceId
  name: remoteVolumeResourceId
  summary: The resource ID of the remote volume. Required for cross region and cross
    zone replication.
  signature: 'remoteVolumeResourceId: str'
- uid: azure.mgmt.netapp.types.ReplicationObject.replicationId
  name: replicationId
  summary: Id.
  signature: 'replicationId: str'
- uid: azure.mgmt.netapp.types.ReplicationObject.replicationSchedule
  name: replicationSchedule
  summary: '"_10minutely", "hourly", and "daily".'
  signature: 'replicationSchedule: str | ReplicationSchedule'
