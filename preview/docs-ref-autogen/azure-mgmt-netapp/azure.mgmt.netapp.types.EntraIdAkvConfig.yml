    Required.'
  name: azure_key_vault_uri
  types:
  - <xref:str>
- description: The name of the certificate in Azure Key Vault. Required.
  name: certificate_name
  types:
  - <xref:str>
- description: 'The ARM resource identifier of the user assigned identity used to

    authenticate with key vault.'
  name: user_assigned_identity
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.netapp.types.EntraIdAkvConfig.azureKeyVaultUri
  name: azureKeyVaultUri
  summary: The Azure Key Vault URI where the Entra ID credentials are stored. Required.
  signature: 'azureKeyVaultUri: str'
- uid: azure.mgmt.netapp.types.EntraIdAkvConfig.certificateName
  name: certificateName
  summary: The name of the certificate in Azure Key Vault. Required.
  signature: 'certificateName: str'
- uid: azure.mgmt.netapp.types.EntraIdAkvConfig.userAssignedIdentity
  name: userAssignedIdentity
  summary: The ARM resource identifier of the user assigned identity used to authenticate
