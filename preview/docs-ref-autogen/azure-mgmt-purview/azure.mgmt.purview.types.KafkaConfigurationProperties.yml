### YamlMime:PythonClass
uid: azure.mgmt.purview.types.KafkaConfigurationProperties
name: KafkaConfigurationProperties
fullName: azure.mgmt.purview.types.KafkaConfigurationProperties
module: azure.mgmt.purview.types
summary: 'The kafka configuration properties of the event streaming service attached
  to the Purview

  account for kafka notifications.'
constructor:
  syntax: KafkaConfigurationProperties()
variables:
- description: Consumer group for hook event hub.
  name: consumer_group
  types:
  - <xref:str>
- description: 'Credentials to access the event streaming service attached to the
    purview

    account.'
  name: credentials
  types:
  - <xref:<xref:"Credentials">>
- description: 'Optional partition Id for notification event hub. If not set, all

    partitions will be leveraged.'
  name: event_hub_partition_id
  types:
  - <xref:str>
- name: event_hub_resource_id
  types:
  - <xref:str>
- description: 'The event hub type. Known values are: "Notification" and "Hook".'
  name: event_hub_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EventHubType">]
- description: 'The state of the event streaming service. Known values are:

    "Disabled" and "Enabled".'
  name: event_streaming_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EventStreamingState">]
- description: 'The event streaming service type. Known values are: "None",

    "Managed", and "Azure".'
  name: event_streaming_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EventStreamingType">]
attributes:
- uid: azure.mgmt.purview.types.KafkaConfigurationProperties.consumerGroup
  name: consumerGroup
  summary: Consumer group for hook event hub.
  signature: 'consumerGroup: str'
- uid: azure.mgmt.purview.types.KafkaConfigurationProperties.credentials
  name: credentials
  summary: Credentials to access the event streaming service attached to the purview
    account.
  signature: 'credentials: Credentials'
- uid: azure.mgmt.purview.types.KafkaConfigurationProperties.eventHubPartitionId
  name: eventHubPartitionId
  summary: Optional partition Id for notification event hub. If not set, all partitions
    will be leveraged.
  signature: 'eventHubPartitionId: str'
- uid: azure.mgmt.purview.types.KafkaConfigurationProperties.eventHubType
  name: eventHubType
  summary: '"Notification" and "Hook".'
  signature: 'eventHubType: str | EventHubType'
- uid: azure.mgmt.purview.types.KafkaConfigurationProperties.eventStreamingState
  name: eventStreamingState
  summary: '"Disabled" and "Enabled".'
  signature: 'eventStreamingState: str | EventStreamingState'
- uid: azure.mgmt.purview.types.KafkaConfigurationProperties.eventStreamingType
  name: eventStreamingType
  summary: '"None", "Managed", and "Azure".'
  signature: 'eventStreamingType: str | EventStreamingType'
- uid: azure.mgmt.purview.types.KafkaConfigurationProperties.eventHubResourceId
  name: eventHubResourceId
  signature: 'eventHubResourceId: str'
