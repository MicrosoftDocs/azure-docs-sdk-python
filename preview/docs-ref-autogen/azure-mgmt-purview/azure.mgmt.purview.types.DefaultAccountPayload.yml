### YamlMime:PythonClass
uid: azure.mgmt.purview.types.DefaultAccountPayload
name: DefaultAccountPayload
fullName: azure.mgmt.purview.types.DefaultAccountPayload
module: azure.mgmt.purview.types
summary: Payload to get and set the default account in the given scope.
constructor:
  syntax: DefaultAccountPayload()
variables:
- description: The name of the account that is set as the default.
  name: account_name
  types:
  - <xref:str>
- description: The resource group name of the account that is set as the default.
  name: resource_group_name
  types:
  - <xref:str>
- description: The scope object ID. For example, sub ID or tenant ID.
  name: scope
  types:
  - <xref:str>
- description: The scope tenant in which the default account is set.
  name: scope_tenant_id
  types:
  - <xref:str>
- description: 'The scope where the default account is set. Known values are: "Tenant"
    and

    "Subscription".'
  name: scope_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScopeType">]
- description: The subscription ID of the account that is set as the default.
  name: subscription_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.purview.types.DefaultAccountPayload.accountName
  name: accountName
  summary: The name of the account that is set as the default.
  signature: 'accountName: str'
- uid: azure.mgmt.purview.types.DefaultAccountPayload.resourceGroupName
  name: resourceGroupName
  summary: The resource group name of the account that is set as the default.
  signature: 'resourceGroupName: str'
- uid: azure.mgmt.purview.types.DefaultAccountPayload.scope
  name: scope
  summary: The scope object ID. For example, sub ID or tenant ID.
  signature: 'scope: str'
- uid: azure.mgmt.purview.types.DefaultAccountPayload.scopeTenantId
  name: scopeTenantId
  summary: The scope tenant in which the default account is set.
  signature: 'scopeTenantId: str'
- uid: azure.mgmt.purview.types.DefaultAccountPayload.scopeType
  name: scopeType
  summary: '"Tenant" and "Subscription".'
  signature: 'scopeType: str | ScopeType'
- uid: azure.mgmt.purview.types.DefaultAccountPayload.subscriptionId
  name: subscriptionId
  summary: The subscription ID of the account that is set as the default.
  signature: 'subscriptionId: str'
