  syntax: 'KafkaConfigurationProperties(*args: Any, **kwargs: Any)'
variables:
- description: Consumer group for hook event hub.
  name: consumer_group
  types:
  - <xref:str>
- description: 'Credentials to access the event streaming service attached to the
    purview

    account.'
  name: credentials
  types:
  - <xref:azure.mgmt.purview.models.Credentials>
- description: 'Optional partition Id for notification event hub. If not set, all

    partitions will be leveraged.'
