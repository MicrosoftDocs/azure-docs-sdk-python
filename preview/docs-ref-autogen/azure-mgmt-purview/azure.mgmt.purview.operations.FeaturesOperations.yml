- uid: azure.mgmt.purview.operations.FeaturesOperations.account_get
  name: account_get
  summary: 'Gets a list of features and their status for the account. Status of enabled
    features will be

    true. Status of disabled features will be false. Features that don''t exist will
    be excluded

    from the results.


    Gets details from a list of feature names.'
  signature: 'account_get(resource_group_name: str, account_name: str, feature_request:
    _models.BatchFeatureRequest, *, content_type: str = ''application/json'', **kwargs:
    Any) -> _models.BatchFeatureStatus'
  parameters:
  - name: resource_group_name
    description: 'The name of the resource group. The name is case insensitive.

      Required.'
    isRequired: true
    types:
    - <xref:str>
  - name: account_name
    description: The name of the account. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: feature_request
    description: 'Request body with feature names. Is either a BatchFeatureRequest
      type

      or a IO[bytes] type. Required.'
    isRequired: true
    types:
    - <xref:azure.mgmt.purview.models.BatchFeatureRequest>
    - <xref:azure.mgmt.purview.types.BatchFeatureRequest>
    - <xref:typing.IO>[<xref:bytes>]
  return:
    description: BatchFeatureStatus. The BatchFeatureStatus is compatible with MutableMapping
    types:
    - <xref:azure.mgmt.purview.models.BatchFeatureStatus>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
