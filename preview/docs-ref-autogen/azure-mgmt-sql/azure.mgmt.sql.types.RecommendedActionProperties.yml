### YamlMime:PythonClass
uid: azure.mgmt.sql.types.RecommendedActionProperties
name: RecommendedActionProperties
fullName: azure.mgmt.sql.types.RecommendedActionProperties
module: azure.mgmt.sql.types
summary: Properties for a Database, Server or Elastic Pool Recommended Action.
constructor:
  syntax: RecommendedActionProperties()
variables:
- description: Gets the reason for recommending this action. e.g., DuplicateIndex.
  name: recommendationReason
  types:
  - <xref:str>
- description: Gets the time since when this recommended action is valid.
  name: validSince
  types:
  - <xref:str>
- description: Gets time when this recommended action was last refreshed.
  name: lastRefresh
  types:
  - <xref:str>
- description: Gets the info of the current state the recommended action is in. Required.
  name: state
  types:
  - <xref:<xref:"RecommendedActionStateInfo">>
- description: Gets if this recommended action is actionable by user.
  name: isExecutableAction
  types:
  - <xref:bool>
- description: 'Gets if changes applied by this recommended action can be reverted
    by

    user.'
  name: isRevertableAction
  types:
  - <xref:bool>
- description: 'Gets if this recommended action was suggested some time ago but user

    chose to ignore this and system added a new recommended action again.'
  name: isArchivedAction
  types:
  - <xref:bool>
- description: 'Gets the time when system started applying this recommended

    action on the user resource. e.g., index creation start time.'
  name: executeActionStartTime
  types:
  - <xref:str>
- description: 'Gets the time taken for applying this recommended action on user

    resource. e.g., time taken for index creation.'
  name: executeActionDuration
  types:
  - <xref:str>
- description: 'Gets the time when system started reverting changes of this

    recommended action on user resource. e.g., time when index drop is executed.'
  name: revertActionStartTime
  types:
  - <xref:str>
- description: 'Gets the time taken for reverting changes of this recommended

    action on user resource. e.g., time taken for dropping the created index.'
  name: revertActionDuration
  types:
  - <xref:str>
- description: 'Gets if approval for applying this recommended action was given

    by user/system. Known values are: "User" and "System".'
  name: executeActionInitiatedBy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecommendedActionInitiatedBy">]
- description: 'Gets the time when this recommended action was approved for

    execution.'
  name: executeActionInitiatedTime
  types:
  - <xref:str>
- description: 'Gets if approval for reverting this recommended action was given

    by user/system. Known values are: "User" and "System".'
  name: revertActionInitiatedBy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecommendedActionInitiatedBy">]
- description: 'Gets the time when this recommended action was approved for

    revert.'
  name: revertActionInitiatedTime
  types:
  - <xref:str>
- description: 'Gets the impact of this recommended action. Possible values are 1
    - Low impact, 2

    - Medium Impact and 3 - High Impact.'
  name: score
  types:
  - <xref:int>
- description: 'Gets the implementation details of this recommended action for

    user to apply it manually.'
  name: implementationDetails
  types:
  - <xref:<xref:"RecommendedActionImplementationInfo">>
- description: 'Gets the error details if and why this recommended action is put to
    error

    state.'
  name: errorDetails
  types:
  - <xref:<xref:"RecommendedActionErrorInfo">>
- description: 'Gets the estimated impact info for this recommended action e.g.,

    Estimated CPU gain, Estimated Disk Space change.'
  name: estimatedImpact
  types:
  - <xref:list>[<xref:"RecommendedActionImpactRecord">]
- description: 'Gets the observed/actual impact info for this recommended action e.g.,

    Actual CPU gain, Actual Disk Space change.'
  name: observedImpact
  types:
  - <xref:list>[<xref:"RecommendedActionImpactRecord">]
- description: 'Gets the time series info of metrics for this recommended action e.g.,
    CPU

    consumption time series.'
  name: timeSeries
  types:
  - <xref:list>[<xref:"RecommendedActionMetricInfo">]
- description: Gets the linked objects, if any.
  name: linkedObjects
  types:
  - <xref:list>[<xref:str>]
- description: Gets additional details specific to this recommended action.
  name: details
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
attributes:
- uid: azure.mgmt.sql.types.RecommendedActionProperties.details
  name: details
  summary: Gets additional details specific to this recommended action.
  signature: 'details: dict[str, str]'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.errorDetails
  name: errorDetails
  summary: Gets the error details if and why this recommended action is put to error
    state.
  signature: 'errorDetails: RecommendedActionErrorInfo'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.estimatedImpact
  name: estimatedImpact
  summary: 'Gets the estimated impact info for this recommended action e.g., Estimated
    CPU gain, Estimated

    Disk Space change.'
  signature: 'estimatedImpact: list[''RecommendedActionImpactRecord'']'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.executeActionDuration
  name: executeActionDuration
  summary: 'Gets the time taken for applying this recommended action on user resource.
    e.g., time taken for

    index creation.'
  signature: 'executeActionDuration: str'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.executeActionInitiatedBy
  name: executeActionInitiatedBy
  summary: 'Gets if approval for applying this recommended action was given by user/system.
    Known values

    are: "User" and "System".'
  signature: 'executeActionInitiatedBy: str | RecommendedActionInitiatedBy'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.executeActionInitiatedTime
  name: executeActionInitiatedTime
  summary: Gets the time when this recommended action was approved for execution.
  signature: 'executeActionInitiatedTime: str'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.executeActionStartTime
  name: executeActionStartTime
  summary: 'Gets the time when system started applying this recommended action on
    the user resource. e.g.,

    index creation start time.'
  signature: 'executeActionStartTime: str'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.implementationDetails
  name: implementationDetails
  summary: Gets the implementation details of this recommended action for user to
    apply it manually.
  signature: 'implementationDetails: RecommendedActionImplementationInfo'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.isArchivedAction
  name: isArchivedAction
  summary: 'Gets if this recommended action was suggested some time ago but user chose
    to ignore this and

    system added a new recommended action again.'
  signature: 'isArchivedAction: bool'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.isExecutableAction
  name: isExecutableAction
  summary: Gets if this recommended action is actionable by user.
  signature: 'isExecutableAction: bool'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.isRevertableAction
  name: isRevertableAction
  summary: Gets if changes applied by this recommended action can be reverted by user.
  signature: 'isRevertableAction: bool'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.lastRefresh
  name: lastRefresh
  summary: Gets time when this recommended action was last refreshed.
  signature: 'lastRefresh: str'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.linkedObjects
  name: linkedObjects
  summary: Gets the linked objects, if any.
  signature: 'linkedObjects: list[str]'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.observedImpact
  name: observedImpact
  summary: 'Gets the observed/actual impact info for this recommended action e.g.,
    Actual CPU gain, Actual

    Disk Space change.'
  signature: 'observedImpact: list[''RecommendedActionImpactRecord'']'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.recommendationReason
  name: recommendationReason
  summary: Gets the reason for recommending this action. e.g., DuplicateIndex.
  signature: 'recommendationReason: str'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.revertActionDuration
  name: revertActionDuration
  summary: 'Gets the time taken for reverting changes of this recommended action on
    user resource. e.g.,

    time taken for dropping the created index.'
  signature: 'revertActionDuration: str'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.revertActionInitiatedBy
  name: revertActionInitiatedBy
  summary: 'Gets if approval for reverting this recommended action was given by user/system.
    Known values

    are: "User" and "System".'
  signature: 'revertActionInitiatedBy: str | RecommendedActionInitiatedBy'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.revertActionInitiatedTime
  name: revertActionInitiatedTime
  summary: Gets the time when this recommended action was approved for revert.
  signature: 'revertActionInitiatedTime: str'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.revertActionStartTime
  name: revertActionStartTime
  summary: 'Gets the time when system started reverting changes of this recommended
    action on user

    resource. e.g., time when index drop is executed.'
  signature: 'revertActionStartTime: str'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.score
  name: score
  summary: 'Gets the impact of this recommended action. Possible values are 1 - Low
    impact, 2 - Medium

    Impact and 3 - High Impact.'
  signature: 'score: int'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.state
  name: state
  summary: Gets the info of the current state the recommended action is in. Required.
  signature: 'state: Required[RecommendedActionStateInfo]'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.timeSeries
  name: timeSeries
  summary: 'Gets the time series info of metrics for this recommended action e.g.,
    CPU consumption time

    series.'
  signature: 'timeSeries: list[''RecommendedActionMetricInfo'']'
- uid: azure.mgmt.sql.types.RecommendedActionProperties.validSince
  name: validSince
  summary: Gets the time since when this recommended action is valid.
  signature: 'validSince: str'
