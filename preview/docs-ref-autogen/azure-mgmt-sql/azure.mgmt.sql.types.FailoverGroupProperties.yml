### YamlMime:PythonClass
uid: azure.mgmt.sql.types.FailoverGroupProperties
name: FailoverGroupProperties
fullName: azure.mgmt.sql.types.FailoverGroupProperties
module: azure.mgmt.sql.types
summary: Properties of a failover group.
constructor:
  syntax: FailoverGroupProperties()
variables:
- description: Read-write endpoint of the failover group instance. Required.
  name: readWriteEndpoint
  types:
  - <xref:<xref:"FailoverGroupReadWriteEndpoint">>
- description: Read-only endpoint of the failover group instance.
  name: readOnlyEndpoint
  types:
  - <xref:<xref:"FailoverGroupReadOnlyEndpoint">>
- description: 'Local replication role of the failover group instance. Known values
    are:

    "Primary" and "Secondary".'
  name: replicationRole
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FailoverGroupReplicationRole">]
- description: Replication state of the failover group instance.
  name: replicationState
  types:
  - <xref:str>
- description: List of partner server information for the failover group. Required.
  name: partnerServers
  types:
  - <xref:list>[<xref:"PartnerInfo">]
- description: List of databases in the failover group.
  name: databases
  types:
  - <xref:list>[<xref:str>]
- description: 'Databases secondary type on partner server. Known values are: "Geo"
    and

    "Standby".'
  name: secondaryType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FailoverGroupDatabasesSecondaryType">]
attributes:
- uid: azure.mgmt.sql.types.FailoverGroupProperties.databases
  name: databases
  summary: List of databases in the failover group.
  signature: 'databases: list[str]'
- uid: azure.mgmt.sql.types.FailoverGroupProperties.partnerServers
  name: partnerServers
  summary: List of partner server information for the failover group. Required.
  signature: 'partnerServers: Required[list[''PartnerInfo'']]'
- uid: azure.mgmt.sql.types.FailoverGroupProperties.readOnlyEndpoint
  name: readOnlyEndpoint
  summary: Read-only endpoint of the failover group instance.
  signature: 'readOnlyEndpoint: FailoverGroupReadOnlyEndpoint'
- uid: azure.mgmt.sql.types.FailoverGroupProperties.readWriteEndpoint
  name: readWriteEndpoint
  summary: Read-write endpoint of the failover group instance. Required.
  signature: 'readWriteEndpoint: Required[FailoverGroupReadWriteEndpoint]'
- uid: azure.mgmt.sql.types.FailoverGroupProperties.replicationRole
  name: replicationRole
  summary: '"Primary" and

    "Secondary".'
  signature: 'replicationRole: str | FailoverGroupReplicationRole'
- uid: azure.mgmt.sql.types.FailoverGroupProperties.replicationState
  name: replicationState
  summary: Replication state of the failover group instance.
  signature: 'replicationState: str'
- uid: azure.mgmt.sql.types.FailoverGroupProperties.secondaryType
  name: secondaryType
  summary: '"Geo" and "Standby".'
  signature: 'secondaryType: str | FailoverGroupDatabasesSecondaryType'
