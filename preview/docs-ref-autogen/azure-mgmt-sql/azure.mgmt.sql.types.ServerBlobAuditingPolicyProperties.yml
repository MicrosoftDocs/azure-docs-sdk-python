### YamlMime:PythonClass
uid: azure.mgmt.sql.types.ServerBlobAuditingPolicyProperties
name: ServerBlobAuditingPolicyProperties
fullName: azure.mgmt.sql.types.ServerBlobAuditingPolicyProperties
module: azure.mgmt.sql.types
summary: Properties of a server blob auditing policy.
constructor:
  syntax: ServerBlobAuditingPolicyProperties()
variables:
- description: 'Specifies the state of devops audit. If state is Enabled, devops

    logs will be sent to Azure Monitor.

    In order to send the events to Azure Monitor, specify ''State'' as ''Enabled'',

    ''IsAzureMonitorTargetEnabled'' as true and ''IsDevopsAuditEnabled'' as true


    When using REST API to configure auditing, Diagnostic Settings with ''DevOpsOperationsAudit''

    diagnostic logs category on the master database should also be created.


    Diagnostic Settings URI format:

    PUT

    [https://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Sql/servers/{serverName}/databases/master/providers/microsoft.insights/diagnosticSettings/{settingsName}?api-version=2017-05-01-preview](https://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Sql/servers/{serverName}/databases/master/providers/microsoft.insights/diagnosticSettings/{settingsName}?api-version=2017-05-01-preview)


    For more information, see [Diagnostic Settings REST API](https://go.microsoft.com/fwlink/?linkid=2033207)

    or [Diagnostic Settings PowerShell](https://go.microsoft.com/fwlink/?linkid=2033043).'
  name: isDevopsAuditEnabled
  types:
  - <xref:bool>
- description: 'Specifies the number of days to keep in the audit logs in the storage

    account.'
  name: retentionDays
  types:
  - <xref:int>
- description: 'Specifies the Actions-Groups and Actions to audit.


    The recommended set of action groups to use is the following combination - this
    will audit all

    the queries and stored procedures executed against the database, as well as successful
    and

    failed logins:


    BATCH_COMPLETED_GROUP,

    SUCCESSFUL_DATABASE_AUTHENTICATION_GROUP,

    FAILED_DATABASE_AUTHENTICATION_GROUP.


    This above combination is also the set that is configured by default when enabling
    auditing

    from the Azure portal.


    The supported action groups to audit are (note: choose only specific groups that
    cover your

    auditing needs. Using unnecessary groups could lead to very large quantities of
    audit records):


    APPLICATION_ROLE_CHANGE_PASSWORD_GROUP

    BACKUP_RESTORE_GROUP

    DATABASE_LOGOUT_GROUP

    DATABASE_OBJECT_CHANGE_GROUP

    DATABASE_OBJECT_OWNERSHIP_CHANGE_GROUP

    DATABASE_OBJECT_PERMISSION_CHANGE_GROUP

    DATABASE_OPERATION_GROUP

    DATABASE_PERMISSION_CHANGE_GROUP

    DATABASE_PRINCIPAL_CHANGE_GROUP

    DATABASE_PRINCIPAL_IMPERSONATION_GROUP

    DATABASE_ROLE_MEMBER_CHANGE_GROUP

    FAILED_DATABASE_AUTHENTICATION_GROUP

    SCHEMA_OBJECT_ACCESS_GROUP

    SCHEMA_OBJECT_CHANGE_GROUP

    SCHEMA_OBJECT_OWNERSHIP_CHANGE_GROUP

    SCHEMA_OBJECT_PERMISSION_CHANGE_GROUP

    SUCCESSFUL_DATABASE_AUTHENTICATION_GROUP

    USER_CHANGE_PASSWORD_GROUP

    BATCH_STARTED_GROUP

    BATCH_COMPLETED_GROUP

    DBCC_GROUP

    DATABASE_OWNERSHIP_CHANGE_GROUP

    DATABASE_CHANGE_GROUP

    LEDGER_OPERATION_GROUP


    These are groups that cover all sql statements and stored procedures executed
    against the

    database, and should not be used in combination with other groups as this will
    result in

    duplicate audit logs.


    For more information, see [Database-Level Audit Action Groups](https://docs.microsoft.com/en-us/sql/relational-databases/security/auditing/sql-server-audit-action-groups-and-actions#database-level-audit-action-groups).


    For Database auditing policy, specific Actions can also be specified (note that
    Actions cannot

    be specified for Server auditing policy). The supported actions to audit are:

    SELECT

    UPDATE

    INSERT

    DELETE

    EXECUTE

    RECEIVE

    REFERENCES


    The general form for defining an action to be audited is:

    {action} ON {object} BY {principal}


    Note that <object> in the above format can refer to an object like a table, view,
    or stored

    procedure, or an entire database or schema. For the latter cases, the forms DATABASE::{db_name}

    and SCHEMA::{schema_name} are used, respectively.


    For example:

    SELECT on dbo.myTable by public

    SELECT on DATABASE::myDatabase by public

    SELECT on SCHEMA::mySchema by public


    For more information, see [Database-Level Audit Actions](https://docs.microsoft.com/en-us/sql/relational-databases/security/auditing/sql-server-audit-action-groups-and-actions#database-level-audit-actions).'
  name: auditActionsAndGroups
  types:
  - <xref:list>[<xref:str>]
- description: 'Specifies whether storageAccountAccessKey value is the

    storage''s secondary key.'
  name: isStorageSecondaryKeyInUse
  types:
  - <xref:bool>
- description: 'Specifies whether audit events are sent to Azure Monitor.

    In order to send the events to Azure Monitor, specify ''State'' as ''Enabled''
    and

    ''IsAzureMonitorTargetEnabled'' as true.


    When using REST API to configure auditing, Diagnostic Settings with ''SQLSecurityAuditEvents''

    diagnostic logs category on the database should be also created.

    Note that for server level audit you should use the ''master'' database as {databaseName}.


    Diagnostic Settings URI format:

    PUT

    [https://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Sql/servers/{serverName}/databases/{databaseName}/providers/microsoft.insights/diagnosticSettings/{settingsName}?api-version=2017-05-01-preview](https://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Sql/servers/{serverName}/databases/{databaseName}/providers/microsoft.insights/diagnosticSettings/{settingsName}?api-version=2017-05-01-preview)


    For more information, see [Diagnostic Settings REST API](https://go.microsoft.com/fwlink/?linkid=2033207)

    or [Diagnostic Settings PowerShell](https://go.microsoft.com/fwlink/?linkid=2033043).'
  name: isAzureMonitorTargetEnabled
  types:
  - <xref:bool>
- description: 'Specifies the amount of time in milliseconds that can elapse before
    audit

    actions are forced to be processed. The default minimum value is 1000 (1 second).
    The maximum

    is 2,147,483,647.'
  name: queueDelayMs
  types:
  - <xref:int>
- description: 'Specifies whether Managed Identity is used to access blob

    storage.'
  name: isManagedIdentityInUse
  types:
  - <xref:bool>
- description: 'Specifies the state of the audit. If state is Enabled, storageEndpoint
    or

    isAzureMonitorTargetEnabled are required. Required. Known values are: "Enabled"
    and "Disabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BlobAuditingPolicyState">]
- description: 'Specifies the blob storage endpoint (e.g.

    [https://MyAccount.blob.core.windows.net](https://MyAccount.blob.core.windows.net)).
    If state

    is Enabled, storageEndpoint or isAzureMonitorTargetEnabled is required.'
  name: storageEndpoint
  types:
  - <xref:str>
- description: "Specifies the identifier key of the auditing storage account.\nIf\
    \ state is Enabled and storageEndpoint is specified, not specifying the\nstorageAccountAccessKey\
    \ will use SQL server system-assigned managed identity to access the\nstorage.\n\
    Prerequisites for using managed identity authentication:\n\n1. Assign SQL Server\
    \ a system-assigned managed identity in Azure Active Directory (AAD). \n\n2. Grant\
    \ SQL Server identity access to the storage account by adding 'Storage Blob Data\n\
    Contributor' RBAC role to the server identity.\nFor more information, see [Auditing\
    \ to storage using Managed Identity\nauthentication](https://go.microsoft.com/fwlink/?linkid=2114355)."
  name: storageAccountAccessKey
  types:
  - <xref:str>
- description: Specifies the blob storage subscription Id.
  name: storageAccountSubscriptionId
  types:
  - <xref:str>
