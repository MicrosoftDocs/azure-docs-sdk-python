### YamlMime:PythonClass
uid: azure.mgmt.sql.types.DataMaskingRuleProperties
name: DataMaskingRuleProperties
fullName: azure.mgmt.sql.types.DataMaskingRuleProperties
module: azure.mgmt.sql.types
summary: The properties of a database data masking rule.
constructor:
  syntax: DataMaskingRuleProperties()
variables:
- description: The rule Id.
  name: id
  types:
  - <xref:str>
- description: 'The rule state. Used to delete a rule. To delete an existing rule,
    specify the

    schemaName, tableName, columnName, maskingFunction, and specify ruleState as disabled.
    However,

    if the rule doesn''t already exist, the rule will be created with ruleState set
    to enabled,

    regardless of the provided value of ruleState. Known values are: "Enabled" and
    "Disabled".'
  name: ruleState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataMaskingRuleState">]
- description: The schema name on which the data masking rule is applied. Required.
  name: schemaName
  types:
  - <xref:str>
- description: The table name on which the data masking rule is applied. Required.
  name: tableName
  types:
  - <xref:str>
- description: The column name on which the data masking rule is applied. Required.
  name: columnName
  types:
  - <xref:str>
- description: The alias name. This is a legacy parameter and is no longer used.
  name: aliasName
  types:
  - <xref:str>
- description: 'The masking function that is used for the data masking rule. Required.

    Known values are: "Default", "CCN", "Email", "Number", "SSN", and "Text".'
  name: maskingFunction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataMaskingFunction">]
- description: 'The numberFrom property of the masking rule. Required if maskingFunction
    is

    set to Number, otherwise this parameter will be ignored.'
  name: numberFrom
  types:
  - <xref:str>
- description: 'The numberTo property of the data masking rule. Required if maskingFunction
    is

    set to Number, otherwise this parameter will be ignored.'
  name: numberTo
  types:
  - <xref:str>
- description: 'If maskingFunction is set to Text, the number of characters to show
    unmasked

    in the beginning of the string. Otherwise, this parameter will be ignored.'
  name: prefixSize
  types:
  - <xref:str>
- description: 'If maskingFunction is set to Text, the number of characters to show
    unmasked

    at the end of the string. Otherwise, this parameter will be ignored.'
  name: suffixSize
  types:
  - <xref:str>
- description: 'If maskingFunction is set to Text, the character to use for masking

    the unexposed part of the string. Otherwise, this parameter will be ignored.'
  name: replacementString
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.sql.types.DataMaskingRuleProperties.aliasName
  name: aliasName
  summary: The alias name. This is a legacy parameter and is no longer used.
  signature: 'aliasName: str'
- uid: azure.mgmt.sql.types.DataMaskingRuleProperties.columnName
  name: columnName
  summary: The column name on which the data masking rule is applied. Required.
  signature: 'columnName: Required[str]'
- uid: azure.mgmt.sql.types.DataMaskingRuleProperties.id
  name: id
  summary: The rule Id.
  signature: 'id: str'
- uid: azure.mgmt.sql.types.DataMaskingRuleProperties.maskingFunction
  name: maskingFunction
  summary: 'The masking function that is used for the data masking rule. Required.
    Known values are:

    "Default", "CCN", "Email", "Number", "SSN", and "Text".'
  signature: 'maskingFunction: Required[str | DataMaskingFunction]'
- uid: azure.mgmt.sql.types.DataMaskingRuleProperties.numberFrom
  name: numberFrom
  summary: 'The numberFrom property of the masking rule. Required if maskingFunction
    is set to Number,

    otherwise this parameter will be ignored.'
  signature: 'numberFrom: str'
- uid: azure.mgmt.sql.types.DataMaskingRuleProperties.numberTo
  name: numberTo
  summary: 'The numberTo property of the data masking rule. Required if maskingFunction
    is set to Number,

    otherwise this parameter will be ignored.'
  signature: 'numberTo: str'
- uid: azure.mgmt.sql.types.DataMaskingRuleProperties.prefixSize
  name: prefixSize
  summary: 'If maskingFunction is set to Text, the number of characters to show unmasked
    in the beginning

    of the string. Otherwise, this parameter will be ignored.'
  signature: 'prefixSize: str'
- uid: azure.mgmt.sql.types.DataMaskingRuleProperties.replacementString
  name: replacementString
  summary: 'If maskingFunction is set to Text, the character to use for masking the
    unexposed part of the

    string. Otherwise, this parameter will be ignored.'
  signature: 'replacementString: str'
- uid: azure.mgmt.sql.types.DataMaskingRuleProperties.ruleState
  name: ruleState
  summary: 'The rule state. Used to delete a rule. To delete an existing rule, specify
    the schemaName,

    tableName, columnName, maskingFunction, and specify ruleState as disabled. However,
    if the rule

    doesn''t already exist, the rule will be created with ruleState set to enabled,
    regardless of

    the provided value of ruleState. Known values are: "Enabled" and "Disabled".'
  signature: 'ruleState: str | DataMaskingRuleState'
- uid: azure.mgmt.sql.types.DataMaskingRuleProperties.schemaName
  name: schemaName
  summary: The schema name on which the data masking rule is applied. Required.
  signature: 'schemaName: Required[str]'
- uid: azure.mgmt.sql.types.DataMaskingRuleProperties.suffixSize
  name: suffixSize
  summary: 'If maskingFunction is set to Text, the number of characters to show unmasked
    at the end of the

    string. Otherwise, this parameter will be ignored.'
  signature: 'suffixSize: str'
- uid: azure.mgmt.sql.types.DataMaskingRuleProperties.tableName
  name: tableName
  summary: The table name on which the data masking rule is applied. Required.
  signature: 'tableName: Required[str]'
