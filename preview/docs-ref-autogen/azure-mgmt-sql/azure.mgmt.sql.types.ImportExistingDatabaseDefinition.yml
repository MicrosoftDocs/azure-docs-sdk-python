### YamlMime:PythonClass
uid: azure.mgmt.sql.types.ImportExistingDatabaseDefinition
name: ImportExistingDatabaseDefinition
fullName: azure.mgmt.sql.types.ImportExistingDatabaseDefinition
module: azure.mgmt.sql.types
summary: Contains the information necessary to perform import operation for existing
  database.
constructor:
  syntax: ImportExistingDatabaseDefinition()
variables:
- description: 'Storage key type: StorageAccessKey, SharedAccessKey, or ManagedIdentity.

    Required. Known values are: "SharedAccessKey", "StorageAccessKey", and "ManagedIdentity".'
  name: storageKeyType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageKeyType">]
- description: 'Storage key for the storage account. If StorageKeyType is ManagedIdentity,

    this field should specify the Managed Identity''s resource ID. Required.'
  name: storageKey
  types:
  - <xref:str>
- description: Storage Uri. Required.
  name: storageUri
  types:
  - <xref:str>
- description: 'Administrator login name. If AuthenticationType is ManagedIdentity,

    this field should specify the Managed Identity''s resource ID. Required.'
  name: administratorLogin
  types:
  - <xref:str>
- description: 'Administrator login password. If AuthenticationType is

    ManagedIdentity, this field should not be specified.'
  name: administratorLoginPassword
  types:
  - <xref:str>
- description: 'Type of credentials provided for access to the target SQL server:

    SQL, ADPassword or ManagedIdentity.'
  name: authenticationType
  types:
  - <xref:str>
- description: Optional resource information to enable network isolation for request.
  name: networkIsolation
  types:
  - <xref:<xref:"NetworkIsolationSettings">>
attributes:
- uid: azure.mgmt.sql.types.ImportExistingDatabaseDefinition.administratorLogin
  name: administratorLogin
  summary: 'Administrator login name. If AuthenticationType is ManagedIdentity, this
    field should specify

    the Managed Identity''s resource ID. Required.'
  signature: 'administratorLogin: Required[str]'
- uid: azure.mgmt.sql.types.ImportExistingDatabaseDefinition.administratorLoginPassword
  name: administratorLoginPassword
  summary: 'Administrator login password. If AuthenticationType is ManagedIdentity,
    this field should not

    be specified.'
  signature: 'administratorLoginPassword: str'
- uid: azure.mgmt.sql.types.ImportExistingDatabaseDefinition.authenticationType
  name: authenticationType
  summary: 'SQL, ADPassword or

    ManagedIdentity.'
  signature: 'authenticationType: str'
- uid: azure.mgmt.sql.types.ImportExistingDatabaseDefinition.networkIsolation
  name: networkIsolation
  summary: Optional resource information to enable network isolation for request.
  signature: 'networkIsolation: NetworkIsolationSettings'
- uid: azure.mgmt.sql.types.ImportExistingDatabaseDefinition.storageKey
  name: storageKey
  summary: 'Storage key for the storage account. If StorageKeyType is ManagedIdentity,
    this field should

    specify the Managed Identity''s resource ID. Required.'
  signature: 'storageKey: Required[str]'
- uid: azure.mgmt.sql.types.ImportExistingDatabaseDefinition.storageKeyType
  name: storageKeyType
  summary: 'StorageAccessKey, SharedAccessKey, or ManagedIdentity. Required. Known
    values

    are: "SharedAccessKey", "StorageAccessKey", and "ManagedIdentity".'
  signature: 'storageKeyType: Required[str | StorageKeyType]'
