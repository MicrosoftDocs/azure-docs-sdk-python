### YamlMime:PythonClass
uid: azure.mgmt.sql.types.InstancePoolProperties
name: InstancePoolProperties
fullName: azure.mgmt.sql.types.InstancePoolProperties
module: azure.mgmt.sql.types
summary: Properties of an instance pool.
constructor:
  syntax: InstancePoolProperties()
variables:
- description: Resource ID of the subnet to place this instance pool in. Required.
  name: subnetId
  types:
  - <xref:str>
- description: Count of vCores belonging to this instance pool. Required.
  name: vCores
  types:
  - <xref:int>
- description: 'The license type. Possible values are ''LicenseIncluded'' (price for
    SQL

    license is included) and ''BasePrice'' (without SQL license price). Required.
    Known values are:

    "LicenseIncluded" and "BasePrice".'
  name: licenseType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"InstancePoolLicenseType">]
- description: The Dns Zone that the managed instance pool is in.
  name: dnsZone
  types:
  - <xref:str>
- description: 'Specifies maintenance configuration id to apply to this

    managed instance.'
  name: maintenanceConfigurationId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.sql.types.InstancePoolProperties.dnsZone
  name: dnsZone
  summary: The Dns Zone that the managed instance pool is in.
  signature: 'dnsZone: str'
- uid: azure.mgmt.sql.types.InstancePoolProperties.licenseType
  name: licenseType
  summary: 'The license type. Possible values are ''LicenseIncluded'' (price for SQL
    license is included) and

    ''BasePrice'' (without SQL license price). Required. Known values are: "LicenseIncluded"
    and

    "BasePrice".'
  signature: 'licenseType: Required[str | InstancePoolLicenseType]'
- uid: azure.mgmt.sql.types.InstancePoolProperties.maintenanceConfigurationId
  name: maintenanceConfigurationId
  summary: Specifies maintenance configuration id to apply to this managed instance.
  signature: 'maintenanceConfigurationId: str'
- uid: azure.mgmt.sql.types.InstancePoolProperties.subnetId
  name: subnetId
  summary: Resource ID of the subnet to place this instance pool in. Required.
  signature: 'subnetId: Required[str]'
- uid: azure.mgmt.sql.types.InstancePoolProperties.vCores
  name: vCores
  summary: Count of vCores belonging to this instance pool. Required.
  signature: 'vCores: Required[int]'
