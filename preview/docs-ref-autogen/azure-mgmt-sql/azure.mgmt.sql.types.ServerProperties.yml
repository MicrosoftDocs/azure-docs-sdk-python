### YamlMime:PythonClass
uid: azure.mgmt.sql.types.ServerProperties
name: ServerProperties
fullName: azure.mgmt.sql.types.ServerProperties
module: azure.mgmt.sql.types
summary: The properties of a server.
constructor:
  syntax: ServerProperties()
variables:
- description: 'Administrator username for the server. Once created it cannot be

    changed.'
  name: administratorLogin
  types:
  - <xref:str>
- description: 'The administrator login password (required for server

    creation).'
  name: administratorLoginPassword
  types:
  - <xref:str>
- description: The version of the server.
  name: version
  types:
  - <xref:str>
- description: The state of the server.
  name: state
  types:
  - <xref:str>
- description: The fully qualified domain name of the server.
  name: fullyQualifiedDomainName
  types:
  - <xref:str>
- description: List of private endpoint connections on a server.
  name: privateEndpointConnections
  types:
  - <xref:list>[<xref:"ServerPrivateEndpointConnection">]
- description: 'Minimal TLS version. Allowed values: ''None'', 1.0'', ''1.1'', ''1.2'',

    ''1.3''. Known values are: "None", "1.0", "1.1", "1.2", and "1.3".'
  name: minimalTlsVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MinimalTlsVersion">]
- description: 'Whether or not public endpoint access is allowed for this server.

    Value is optional but if passed in, must be ''Enabled'' or ''Disabled'' or ''SecuredByPerimeter''.

    Known values are: "Enabled", "Disabled", and "SecuredByPerimeter".'
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServerPublicNetworkAccessFlag">]
- description: 'Whether or not existing server has a workspace created and if it allows

    connection from workspace. Known values are: "Connected" and "Disconnected".'
  name: workspaceFeature
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServerWorkspaceFeature">]
- description: 'The resource id of a user assigned identity to be used by

    default.'
  name: primaryUserAssignedIdentityId
  types:
  - <xref:str>
- description: The Client id used for cross tenant CMK scenario.
  name: federatedClientId
  types:
  - <xref:str>
- description: A CMK URI of the key to use for encryption.
  name: keyId
  types:
  - <xref:str>
- description: 'The Azure Active Directory administrator can be utilized during server

    creation and for server updates, except for the azureADOnlyAuthentication property.
    To update

    the azureADOnlyAuthentication property, individual API must be used.'
  name: administrators
  types:
  - <xref:<xref:"ServerExternalAdministrator">>
- description: 'Whether or not to restrict outbound network access for

    this server.  Value is optional but if passed in, must be ''Enabled'' or ''Disabled''.
    Known values

    are: "Enabled", "Disabled", and "SecuredByPerimeter".'
  name: restrictOutboundNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServerNetworkAccessFlag">]
- description: 'Whether or not to enable IPv6 support for this server.  Value is optional

    but if passed in, must be ''Enabled'' or ''Disabled''. Known values are: "Enabled",
    "Disabled", and

    "SecuredByPerimeter".'
  name: isIPv6Enabled
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServerNetworkAccessFlag">]
- description: 'Status of external governance. Known values are: "Enabled" and

    "Disabled".'
  name: externalGovernanceStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExternalGovernanceStatus">]
- description: Number of days this server will stay soft-deleted.
  name: retentionDays
  types:
  - <xref:int>
- description: 'Create mode for server, only valid values for this are Normal and
    Restore.

    Known values are: "Normal" and "Restore".'
  name: createMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServerCreateMode">]
attributes:
- uid: azure.mgmt.sql.types.ServerProperties.administratorLogin
  name: administratorLogin
  summary: Administrator username for the server. Once created it cannot be changed.
  signature: 'administratorLogin: str'
- uid: azure.mgmt.sql.types.ServerProperties.administratorLoginPassword
  name: administratorLoginPassword
  summary: The administrator login password (required for server creation).
  signature: 'administratorLoginPassword: str'
- uid: azure.mgmt.sql.types.ServerProperties.administrators
  name: administrators
  summary: 'The Azure Active Directory administrator can be utilized during server
    creation and for server

    updates, except for the azureADOnlyAuthentication property. To update the

    azureADOnlyAuthentication property, individual API must be used.'
  signature: 'administrators: ServerExternalAdministrator'
- uid: azure.mgmt.sql.types.ServerProperties.createMode
  name: createMode
  summary: 'Create mode for server, only valid values for this are Normal and Restore.
    Known values are:

    "Normal" and "Restore".'
  signature: 'createMode: str | ServerCreateMode'
- uid: azure.mgmt.sql.types.ServerProperties.externalGovernanceStatus
  name: externalGovernanceStatus
  summary: '"Enabled" and "Disabled".'
  signature: 'externalGovernanceStatus: str | ExternalGovernanceStatus'
- uid: azure.mgmt.sql.types.ServerProperties.federatedClientId
  name: federatedClientId
  summary: The Client id used for cross tenant CMK scenario.
  signature: 'federatedClientId: str'
- uid: azure.mgmt.sql.types.ServerProperties.fullyQualifiedDomainName
  name: fullyQualifiedDomainName
  summary: The fully qualified domain name of the server.
  signature: 'fullyQualifiedDomainName: str'
- uid: azure.mgmt.sql.types.ServerProperties.isIPv6Enabled
  name: isIPv6Enabled
  summary: 'Whether or not to enable IPv6 support for this server.  Value is optional
    but if passed in,

    must be ''Enabled'' or ''Disabled''. Known values are: "Enabled", "Disabled",
    and

    "SecuredByPerimeter".'
  signature: 'isIPv6Enabled: str | ServerNetworkAccessFlag'
- uid: azure.mgmt.sql.types.ServerProperties.keyId
  name: keyId
  summary: A CMK URI of the key to use for encryption.
  signature: 'keyId: str'
- uid: azure.mgmt.sql.types.ServerProperties.minimalTlsVersion
  name: minimalTlsVersion
  summary: '''None'', 1.0'', ''1.1'', ''1.2'', ''1.3''. Known values are:

    "None", "1.0", "1.1", "1.2", and "1.3".'
  signature: 'minimalTlsVersion: str | MinimalTlsVersion'
- uid: azure.mgmt.sql.types.ServerProperties.primaryUserAssignedIdentityId
  name: primaryUserAssignedIdentityId
  summary: The resource id of a user assigned identity to be used by default.
  signature: 'primaryUserAssignedIdentityId: str'
- uid: azure.mgmt.sql.types.ServerProperties.privateEndpointConnections
  name: privateEndpointConnections
  summary: List of private endpoint connections on a server.
  signature: 'privateEndpointConnections: list[''ServerPrivateEndpointConnection'']'
- uid: azure.mgmt.sql.types.ServerProperties.publicNetworkAccess
  name: publicNetworkAccess
  summary: 'Whether or not public endpoint access is allowed for this server.  Value
    is optional but if

    passed in, must be ''Enabled'' or ''Disabled'' or ''SecuredByPerimeter''. Known
    values are:

    "Enabled", "Disabled", and "SecuredByPerimeter".'
  signature: 'publicNetworkAccess: str | ServerPublicNetworkAccessFlag'
- uid: azure.mgmt.sql.types.ServerProperties.restrictOutboundNetworkAccess
  name: restrictOutboundNetworkAccess
  summary: 'Whether or not to restrict outbound network access for this server.  Value
    is optional but if

    passed in, must be ''Enabled'' or ''Disabled''. Known values are: "Enabled", "Disabled",
    and

    "SecuredByPerimeter".'
  signature: 'restrictOutboundNetworkAccess: str | ServerNetworkAccessFlag'
- uid: azure.mgmt.sql.types.ServerProperties.retentionDays
  name: retentionDays
  summary: Number of days this server will stay soft-deleted.
  signature: 'retentionDays: int'
- uid: azure.mgmt.sql.types.ServerProperties.state
  name: state
  summary: The state of the server.
  signature: 'state: str'
- uid: azure.mgmt.sql.types.ServerProperties.version
  name: version
  summary: The version of the server.
  signature: 'version: str'
- uid: azure.mgmt.sql.types.ServerProperties.workspaceFeature
  name: workspaceFeature
  summary: 'Whether or not existing server has a workspace created and if it allows
    connection from

    workspace. Known values are: "Connected" and "Disconnected".'
  signature: 'workspaceFeature: str | ServerWorkspaceFeature'
