### YamlMime:PythonClass
uid: azure.mgmt.sql.types.ReplicationLinkProperties
name: ReplicationLinkProperties
fullName: azure.mgmt.sql.types.ReplicationLinkProperties
module: azure.mgmt.sql.types
summary: Properties of a replication link.
constructor:
  syntax: ReplicationLinkProperties()
variables:
- description: Resource partner server.
  name: partnerServer
  types:
  - <xref:str>
- description: Resource partner database.
  name: partnerDatabase
  types:
  - <xref:str>
- description: Resource partner database Id.
  name: partnerDatabaseId
  types:
  - <xref:str>
- description: Resource partner location.
  name: partnerLocation
  types:
  - <xref:str>
- description: 'Local replication role. Known values are: "Primary", "Secondary",

    "NonReadableSecondary", "Source", and "Copy".'
  name: role
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationRole">]
- description: 'Partner replication role. Known values are: "Primary", "Secondary",

    "NonReadableSecondary", "Source", and "Copy".'
  name: partnerRole
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationRole">]
- description: Replication mode.
  name: replicationMode
  types:
  - <xref:str>
- description: Time at which the link was created.
  name: startTime
  types:
  - <xref:str>
- description: Seeding completion percentage for the link.
  name: percentComplete
  types:
  - <xref:int>
- description: 'Replication state (PENDING, SEEDING, CATCHUP, SUSPENDED). Known values

    are: "PENDING", "SEEDING", "CATCH_UP", and "SUSPENDED".'
  name: replicationState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationState">]
- description: Whether the user is currently allowed to terminate the link.
  name: isTerminationAllowed
  types:
  - <xref:bool>
- description: 'Link type (GEO, NAMED, STANDBY). Update operation does not support
    NAMED. Known

    values are: "GEO", "NAMED", and "STANDBY".'
  name: linkType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationLinkType">]
attributes:
- uid: azure.mgmt.sql.types.ReplicationLinkProperties.isTerminationAllowed
  name: isTerminationAllowed
  summary: Whether the user is currently allowed to terminate the link.
  signature: 'isTerminationAllowed: bool'
- uid: azure.mgmt.sql.types.ReplicationLinkProperties.linkType
  name: linkType
  summary: 'Link type (GEO, NAMED, STANDBY). Update operation does not support NAMED.
    Known values are:

    "GEO", "NAMED", and "STANDBY".'
  signature: 'linkType: str | ReplicationLinkType'
- uid: azure.mgmt.sql.types.ReplicationLinkProperties.partnerDatabase
  name: partnerDatabase
  summary: Resource partner database.
  signature: 'partnerDatabase: str'
- uid: azure.mgmt.sql.types.ReplicationLinkProperties.partnerDatabaseId
  name: partnerDatabaseId
  summary: Resource partner database Id.
  signature: 'partnerDatabaseId: str'
- uid: azure.mgmt.sql.types.ReplicationLinkProperties.partnerLocation
  name: partnerLocation
  summary: Resource partner location.
  signature: 'partnerLocation: str'
- uid: azure.mgmt.sql.types.ReplicationLinkProperties.partnerRole
  name: partnerRole
  summary: '"Primary", "Secondary",

    "NonReadableSecondary", "Source", and "Copy".'
  signature: 'partnerRole: str | ReplicationRole'
- uid: azure.mgmt.sql.types.ReplicationLinkProperties.partnerServer
  name: partnerServer
  summary: Resource partner server.
  signature: 'partnerServer: str'
- uid: azure.mgmt.sql.types.ReplicationLinkProperties.percentComplete
  name: percentComplete
  summary: Seeding completion percentage for the link.
  signature: 'percentComplete: int'
- uid: azure.mgmt.sql.types.ReplicationLinkProperties.replicationMode
  name: replicationMode
  summary: Replication mode.
  signature: 'replicationMode: str'
- uid: azure.mgmt.sql.types.ReplicationLinkProperties.replicationState
  name: replicationState
  summary: '"PENDING",

    "SEEDING", "CATCH_UP", and "SUSPENDED".'
  signature: 'replicationState: str | ReplicationState'
- uid: azure.mgmt.sql.types.ReplicationLinkProperties.role
  name: role
  summary: '"Primary", "Secondary", "NonReadableSecondary",

    "Source", and "Copy".'
  signature: 'role: str | ReplicationRole'
- uid: azure.mgmt.sql.types.ReplicationLinkProperties.startTime
  name: startTime
  summary: Time at which the link was created.
  signature: 'startTime: str'
