### YamlMime:PythonClass
uid: azure.mgmt.sql.types.SecurityAlertsPolicyProperties
name: SecurityAlertsPolicyProperties
fullName: azure.mgmt.sql.types.SecurityAlertsPolicyProperties
module: azure.mgmt.sql.types
summary: Properties of a security alert policy.
constructor:
  syntax: SecurityAlertsPolicyProperties()
variables:
- description: 'Specifies the state of the policy, whether it is enabled or disabled
    or a policy

    has not been applied yet on the specific database. Required. Known values are:
    "Enabled" and

    "Disabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityAlertsPolicyState">]
- description: 'Specifies an array of alerts that are disabled. Allowed values are:

    Sql_Injection, Sql_Injection_Vulnerability, Access_Anomaly, Data_Exfiltration,
    Unsafe_Action,

    Brute_Force.'
  name: disabledAlerts
  types:
  - <xref:list>[<xref:str>]
- description: Specifies an array of e-mail addresses to which the alert is sent.
  name: emailAddresses
  types:
  - <xref:list>[<xref:str>]
- description: Specifies that the alert is sent to the account administrators.
  name: emailAccountAdmins
  types:
  - <xref:bool>
- description: 'Specifies the blob storage endpoint (e.g.

    [https://MyAccount.blob.core.windows.net](https://MyAccount.blob.core.windows.net)).
    This

    blob storage will hold all Threat Detection audit logs.'
  name: storageEndpoint
  types:
  - <xref:str>
- description: 'Specifies the identifier key of the Threat Detection audit

    storage account.'
  name: storageAccountAccessKey
  types:
  - <xref:str>
- description: Specifies the number of days to keep in the Threat Detection audit
    logs.
  name: retentionDays
  types:
  - <xref:int>
- description: Specifies the UTC creation time of the policy.
  name: creationTime
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.sql.types.SecurityAlertsPolicyProperties.creationTime
  name: creationTime
  summary: Specifies the UTC creation time of the policy.
  signature: 'creationTime: str'
- uid: azure.mgmt.sql.types.SecurityAlertsPolicyProperties.disabledAlerts
  name: disabledAlerts
  summary: 'Sql_Injection,

    Sql_Injection_Vulnerability, Access_Anomaly, Data_Exfiltration, Unsafe_Action,
    Brute_Force.'
  signature: 'disabledAlerts: list[str]'
- uid: azure.mgmt.sql.types.SecurityAlertsPolicyProperties.emailAccountAdmins
  name: emailAccountAdmins
  summary: Specifies that the alert is sent to the account administrators.
  signature: 'emailAccountAdmins: bool'
- uid: azure.mgmt.sql.types.SecurityAlertsPolicyProperties.emailAddresses
  name: emailAddresses
  summary: Specifies an array of e-mail addresses to which the alert is sent.
  signature: 'emailAddresses: list[str]'
- uid: azure.mgmt.sql.types.SecurityAlertsPolicyProperties.retentionDays
  name: retentionDays
  summary: Specifies the number of days to keep in the Threat Detection audit logs.
  signature: 'retentionDays: int'
- uid: azure.mgmt.sql.types.SecurityAlertsPolicyProperties.state
  name: state
  summary: 'Specifies the state of the policy, whether it is enabled or disabled or
    a policy has not been

    applied yet on the specific database. Required. Known values are: "Enabled" and
    "Disabled".'
  signature: 'state: Required[str | SecurityAlertsPolicyState]'
- uid: azure.mgmt.sql.types.SecurityAlertsPolicyProperties.storageAccountAccessKey
  name: storageAccountAccessKey
  summary: Specifies the identifier key of the Threat Detection audit storage account.
  signature: 'storageAccountAccessKey: str'
- uid: azure.mgmt.sql.types.SecurityAlertsPolicyProperties.storageEndpoint
  name: storageEndpoint
  summary: '//MyAccount.blob.core.windows.net

    <[https://MyAccount.blob.core.windows.net](https://MyAccount.blob.core.windows.net)>`_).
    This blob storage will hold all Threat Detection

    audit logs.'
  signature: 'storageEndpoint: str'
