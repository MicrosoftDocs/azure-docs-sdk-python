### YamlMime:PythonClass
uid: azure.mgmt.sql.types.SyncMemberProperties
name: SyncMemberProperties
fullName: azure.mgmt.sql.types.SyncMemberProperties
module: azure.mgmt.sql.types
summary: Properties of a sync member with support to MI.
constructor:
  syntax: SyncMemberProperties()
variables:
- description: 'Database type of the sync member. Known values are: "AzureSqlDatabase"
    and

    "SqlServerDatabase".'
  name: databaseType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyncMemberDbType">]
- description: ARM resource id of the sync agent in the sync member.
  name: syncAgentId
  types:
  - <xref:str>
- description: SQL Server database id of the sync member.
  name: sqlServerDatabaseId
  types:
  - <xref:str>
- description: 'ARM resource id of the sync member logical database,

    for sync members in Azure.'
  name: syncMemberAzureDatabaseResourceId
  types:
  - <xref:str>
- description: Whether to use private link connection.
  name: usePrivateLinkConnection
  types:
  - <xref:bool>
- description: 'Private endpoint name of the sync member if use private link

    connection is enabled, for sync members in Azure.'
  name: privateEndpointName
  types:
  - <xref:str>
- description: Server name of the member database in the sync member.
  name: serverName
  types:
  - <xref:str>
- description: Database name of the member database in the sync member.
  name: databaseName
  types:
  - <xref:str>
- description: User name of the member database in the sync member.
  name: userName
  types:
  - <xref:str>
- description: Password of the member database in the sync member.
  name: password
  types:
  - <xref:str>
- description: 'Sync direction of the sync member. Known values are: "Bidirectional",

    "OneWayMemberToHub", and "OneWayHubToMember".'
  name: syncDirection
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyncDirection">]
- description: 'Sync state of the sync member. Known values are: "SyncInProgress",

    "SyncSucceeded", "SyncFailed", "DisabledTombstoneCleanup", "DisabledBackupRestore",

    "SyncSucceededWithWarnings", "SyncCancelling", "SyncCancelled", "UnProvisioned",

    "Provisioning", "Provisioned", "ProvisionFailed", "DeProvisioning", "DeProvisioned",

    "DeProvisionFailed", "Reprovisioning", "ReprovisionFailed", and "UnReprovisioned".'
  name: syncState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyncMemberState">]
