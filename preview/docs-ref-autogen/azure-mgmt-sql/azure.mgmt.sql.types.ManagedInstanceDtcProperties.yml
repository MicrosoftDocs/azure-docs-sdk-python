    "Created", "InProgress", "Succeeded", "Failed", and "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.sql.types.ManagedInstanceDtcProperties.dtcEnabled
  name: dtcEnabled
  summary: Active status of managed instance DTC.
  signature: 'dtcEnabled: bool'
- uid: azure.mgmt.sql.types.ManagedInstanceDtcProperties.dtcHostNameDnsSuffix
  name: dtcHostNameDnsSuffix
  summary: Host name dns suffix of managed instance DTC.
  signature: 'dtcHostNameDnsSuffix: str'
- uid: azure.mgmt.sql.types.ManagedInstanceDtcProperties.externalDnsSuffixSearchList
  name: externalDnsSuffixSearchList
  summary: External dns suffix search list of managed instance DTC.
  signature: 'externalDnsSuffixSearchList: list[str]'
