### YamlMime:PythonClass
uid: azure.mgmt.sql.types.ManagedInstanceDtcProperties
name: ManagedInstanceDtcProperties
fullName: azure.mgmt.sql.types.ManagedInstanceDtcProperties
module: azure.mgmt.sql.types
summary: The properties of managed instance DTC.
constructor:
  syntax: ManagedInstanceDtcProperties()
variables:
- description: Active status of managed instance DTC.
  name: dtcEnabled
  types:
  - <xref:bool>
- description: Security settings of managed instance DTC.
  name: securitySettings
  types:
  - <xref:<xref:"ManagedInstanceDtcSecuritySettings">>
- description: External dns suffix search list of managed instance DTC.
  name: externalDnsSuffixSearchList
  types:
  - <xref:list>[<xref:str>]
- description: Host name dns suffix of managed instance DTC.
  name: dtcHostNameDnsSuffix
  types:
  - <xref:str>
- description: 'Status of FQDN of managed instance DTC. Toggling this setting might
    trigger

    a restart of the managed instance.'
  name: fqdnEnabled
  types:
  - <xref:bool>
