### YamlMime:PythonClass
uid: azure.mgmt.sql.types.ElasticPoolProperties
name: ElasticPoolProperties
fullName: azure.mgmt.sql.types.ElasticPoolProperties
module: azure.mgmt.sql.types
summary: Properties of an elastic pool.
constructor:
  syntax: ElasticPoolProperties()
variables:
- description: 'The state of the elastic pool. Known values are: "Creating", "Ready",
    and

    "Disabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ElasticPoolState">]
- description: The creation date of the elastic pool (ISO8601 format).
  name: creationDate
  types:
  - <xref:str>
- description: The storage limit for the database elastic pool in bytes.
  name: maxSizeBytes
  types:
  - <xref:int>
- description: Minimal capacity that serverless pool will not shrink below, if not
    paused.
  name: minCapacity
  types:
  - <xref:float>
- description: The per database settings for the elastic pool.
  name: perDatabaseSettings
  types:
  - <xref:<xref:"ElasticPoolPerDatabaseSettings">>
- description: 'Whether or not this elastic pool is zone redundant, which means the

    replicas of this elastic pool will be spread across multiple availability zones.'
  name: zoneRedundant
  types:
  - <xref:bool>
- description: 'The license type to apply for this elastic pool. Known values are:

    "LicenseIncluded" and "BasePrice".'
  name: licenseType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ElasticPoolLicenseType">]
- description: 'Maintenance configuration id assigned to the elastic pool.

    This configuration defines the period when the maintenance updates will will occur.'
  name: maintenanceConfigurationId
  types:
  - <xref:str>
- description: 'The number of secondary replicas associated with the

    Business Critical, Premium, or Hyperscale edition elastic pool that are used to
    provide high

    availability. Applicable only to Hyperscale elastic pools.'
  name: highAvailabilityReplicaCount
  types:
  - <xref:int>
- description: 'Time in minutes after which elastic pool is automatically paused.
    A value

    of -1 means that automatic pause is disabled.'
  name: autoPauseDelay
  types:
  - <xref:int>
- description: 'Type of enclave requested on the elastic pool. Known values are:

    "Default" and "VBS".'
  name: preferredEnclaveType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AlwaysEncryptedEnclaveType">]
- description: 'Specifies the availability zone the pool''s primary replica is pinned

    to. Known values are: "NoPreference", "1", "2", and "3".'
  name: availabilityZone
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AvailabilityZoneType">]
- description: The name and tier of the current SKU.
  name: currentSku
  types:
  - <xref:<xref:"Sku">>
attributes:
- uid: azure.mgmt.sql.types.ElasticPoolProperties.autoPauseDelay
  name: autoPauseDelay
  summary: 'Time in minutes after which elastic pool is automatically paused. A value
    of -1 means that

    automatic pause is disabled.'
  signature: 'autoPauseDelay: int'
- uid: azure.mgmt.sql.types.ElasticPoolProperties.availabilityZone
  name: availabilityZone
  summary: 'Specifies the availability zone the pool''s primary replica is pinned
    to. Known values are:

    "NoPreference", "1", "2", and "3".'
  signature: 'availabilityZone: str | AvailabilityZoneType'
- uid: azure.mgmt.sql.types.ElasticPoolProperties.creationDate
  name: creationDate
  summary: The creation date of the elastic pool (ISO8601 format).
  signature: 'creationDate: str'
- uid: azure.mgmt.sql.types.ElasticPoolProperties.currentSku
  name: currentSku
  summary: The name and tier of the current SKU.
  signature: 'currentSku: Sku'
- uid: azure.mgmt.sql.types.ElasticPoolProperties.highAvailabilityReplicaCount
  name: highAvailabilityReplicaCount
  summary: 'The number of secondary replicas associated with the Business Critical,
    Premium, or Hyperscale

    edition elastic pool that are used to provide high availability. Applicable only
    to Hyperscale

    elastic pools.'
  signature: 'highAvailabilityReplicaCount: int'
- uid: azure.mgmt.sql.types.ElasticPoolProperties.licenseType
  name: licenseType
  summary: '"LicenseIncluded" and

    "BasePrice".'
  signature: 'licenseType: str | ElasticPoolLicenseType'
- uid: azure.mgmt.sql.types.ElasticPoolProperties.maintenanceConfigurationId
  name: maintenanceConfigurationId
  summary: 'Maintenance configuration id assigned to the elastic pool. This configuration
    defines the

    period when the maintenance updates will will occur.'
  signature: 'maintenanceConfigurationId: str'
- uid: azure.mgmt.sql.types.ElasticPoolProperties.maxSizeBytes
  name: maxSizeBytes
  summary: The storage limit for the database elastic pool in bytes.
  signature: 'maxSizeBytes: int'
- uid: azure.mgmt.sql.types.ElasticPoolProperties.minCapacity
  name: minCapacity
  summary: Minimal capacity that serverless pool will not shrink below, if not paused.
  signature: 'minCapacity: float'
- uid: azure.mgmt.sql.types.ElasticPoolProperties.perDatabaseSettings
  name: perDatabaseSettings
  summary: The per database settings for the elastic pool.
  signature: 'perDatabaseSettings: ElasticPoolPerDatabaseSettings'
- uid: azure.mgmt.sql.types.ElasticPoolProperties.preferredEnclaveType
  name: preferredEnclaveType
  summary: '"Default" and "VBS".'
  signature: 'preferredEnclaveType: str | AlwaysEncryptedEnclaveType'
- uid: azure.mgmt.sql.types.ElasticPoolProperties.state
  name: state
  summary: '"Creating", "Ready", and "Disabled".'
  signature: 'state: str | ElasticPoolState'
- uid: azure.mgmt.sql.types.ElasticPoolProperties.zoneRedundant
  name: zoneRedundant
  summary: 'Whether or not this elastic pool is zone redundant, which means the replicas
    of this elastic

    pool will be spread across multiple availability zones.'
  signature: 'zoneRedundant: bool'
