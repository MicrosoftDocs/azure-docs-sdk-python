uid: azure.mgmt.sql.types.DistributedAvailabilityGroupProperties
name: DistributedAvailabilityGroupProperties
fullName: azure.mgmt.sql.types.DistributedAvailabilityGroupProperties
module: azure.mgmt.sql.types
summary: The properties of a distributed availability group.
constructor:
  syntax: DistributedAvailabilityGroupProperties()
variables:
- description: Name of the distributed availability group.
  name: distributedAvailabilityGroupName
  types:
  - <xref:str>
- description: ID of the distributed availability group.
  name: distributedAvailabilityGroupId
  types:
  - <xref:str>
- description: 'Replication mode of the link. Known values are: "Async" and "Sync".'
  name: replicationMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationModeType">]
- description: 'SQL server side link role. Known values are: "Primary" and "Secondary".'
  name: partnerLinkRole
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LinkRole">]
- description: SQL server side availability group name.
  name: partnerAvailabilityGroupName
  types:
  - <xref:str>
- description: SQL server side endpoint - IP or DNS resolvable name.
  name: partnerEndpoint
  types:
  - <xref:str>
- description: 'Managed instance side link role. Known values are: "Primary" and

    "Secondary".'
  name: instanceLinkRole
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LinkRole">]
- description: Managed instance side availability group name.
  name: instanceAvailabilityGroupName
  types:
  - <xref:str>
- description: 'The link failover mode - can be Manual if intended to be used for
    two-way

    failover with a supported SQL Server, or None for one-way failover to Azure. Known
    values are:

    "None" and "Manual".'
  name: failoverMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FailoverModeType">]
- description: "Database seeding mode \u2013 can be Automatic (default), or Manual\
    \ for supported\nscenarios. Known values are: \"Automatic\" and \"Manual\"."
  name: seedingMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SeedingModeType">]
- description: 'Specifies whether the link operates in single-database or multi-database
    mode.

    Known values are: "SingleDatabase" and "MultiDatabase".'
  name: linkMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LinkModeType">]
- description: Databases in the distributed availability group.
  name: databases
  types:
  - <xref:list>[<xref:"DistributedAvailabilityGroupDatabase">]
