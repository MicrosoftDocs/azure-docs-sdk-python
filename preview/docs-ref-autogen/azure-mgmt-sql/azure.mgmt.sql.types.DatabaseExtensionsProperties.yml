### YamlMime:PythonClass
uid: azure.mgmt.sql.types.DatabaseExtensionsProperties
name: DatabaseExtensionsProperties
fullName: azure.mgmt.sql.types.DatabaseExtensionsProperties
module: azure.mgmt.sql.types
summary: Contains the database information after a successful Import, Export, or PolybaseImport.
constructor:
  syntax: DatabaseExtensionsProperties()
variables:
- description: 'Operation mode of the operation: Import, Export, or PolybaseImport.

    Required. Known values are: "PolybaseImport", "Import", and "Export".'
  name: operationMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperationMode">]
- description: 'Storage key type: StorageAccessKey, SharedAccessKey or ManagedIdentity.

    Required. Known values are: "SharedAccessKey", "StorageAccessKey", and "ManagedIdentity".'
  name: storageKeyType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageKeyType">]
- description: 'Storage key for the storage account. If StorageKeyType is ManagedIdentity,

    this field should specify the Managed Identity''s resource ID. Required.'
  name: storageKey
  types:
  - <xref:str>
- description: Storage Uri for the storage account. Required.
  name: storageUri
  types:
  - <xref:str>
- description: 'Administrator login name. If AuthenticationType is ManagedIdentity,

    this field should specify the Managed Identity''s resource ID.'
  name: administratorLogin
  types:
  - <xref:str>
- description: 'Administrator login password. If AuthenticationType is

    ManagedIdentity, this field should not be specified.'
  name: administratorLoginPassword
  types:
  - <xref:str>
- description: 'Authentication type used to access the SQL: Sql, ADPassword or

    ManagedIdentity.'
  name: authenticationType
  types:
  - <xref:str>
- description: 'Database edition for the newly created database in the case of an
    import

    operation.'
  name: databaseEdition
  types:
  - <xref:str>
- description: 'Database service level objective for the newly created database in

    the case of an import operation.'
  name: serviceObjectiveName
  types:
  - <xref:str>
- description: 'Database max size in bytes for the newly created database in the case
    of an

    import operation.'
  name: maxSizeBytes
  types:
  - <xref:str>
- description: Optional resource information to enable network isolation for request.
  name: networkIsolation
  types:
  - <xref:<xref:"NetworkIsolationSettings">>
attributes:
- uid: azure.mgmt.sql.types.DatabaseExtensionsProperties.administratorLogin
  name: administratorLogin
  summary: 'Administrator login name. If AuthenticationType is ManagedIdentity, this
    field should specify

    the Managed Identity''s resource ID.'
  signature: 'administratorLogin: str'
- uid: azure.mgmt.sql.types.DatabaseExtensionsProperties.administratorLoginPassword
  name: administratorLoginPassword
  summary: 'Administrator login password. If AuthenticationType is ManagedIdentity,
    this field should not

    be specified.'
  signature: 'administratorLoginPassword: str'
- uid: azure.mgmt.sql.types.DatabaseExtensionsProperties.authenticationType
  name: authenticationType
  summary: Sql, ADPassword or ManagedIdentity.
  signature: 'authenticationType: str'
- uid: azure.mgmt.sql.types.DatabaseExtensionsProperties.databaseEdition
  name: databaseEdition
  summary: Database edition for the newly created database in the case of an import
    operation.
  signature: 'databaseEdition: str'
- uid: azure.mgmt.sql.types.DatabaseExtensionsProperties.maxSizeBytes
  name: maxSizeBytes
  summary: Database max size in bytes for the newly created database in the case of
    an import operation.
  signature: 'maxSizeBytes: str'
- uid: azure.mgmt.sql.types.DatabaseExtensionsProperties.networkIsolation
  name: networkIsolation
  summary: Optional resource information to enable network isolation for request.
  signature: 'networkIsolation: NetworkIsolationSettings'
- uid: azure.mgmt.sql.types.DatabaseExtensionsProperties.operationMode
  name: operationMode
  summary: 'Import, Export, or PolybaseImport. Required. Known values are:

    "PolybaseImport", "Import", and "Export".'
  signature: 'operationMode: Required[str | OperationMode]'
- uid: azure.mgmt.sql.types.DatabaseExtensionsProperties.serviceObjectiveName
  name: serviceObjectiveName
  summary: 'Database service level objective for the newly created database in the
    case of an import

    operation.'
  signature: 'serviceObjectiveName: str'
- uid: azure.mgmt.sql.types.DatabaseExtensionsProperties.storageKey
  name: storageKey
  summary: 'Storage key for the storage account. If StorageKeyType is ManagedIdentity,
    this field should

    specify the Managed Identity''s resource ID. Required.'
  signature: 'storageKey: Required[str]'
- uid: azure.mgmt.sql.types.DatabaseExtensionsProperties.storageKeyType
  name: storageKeyType
  summary: 'StorageAccessKey, SharedAccessKey or ManagedIdentity. Required. Known
    values

    are: "SharedAccessKey", "StorageAccessKey", and "ManagedIdentity".'
  signature: 'storageKeyType: Required[str | StorageKeyType]'
- uid: azure.mgmt.sql.types.DatabaseExtensionsProperties.storageUri
  name: storageUri
  summary: Storage Uri for the storage account. Required.
  signature: 'storageUri: Required[str]'
