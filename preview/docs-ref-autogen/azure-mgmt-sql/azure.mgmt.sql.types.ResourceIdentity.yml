### YamlMime:PythonClass
uid: azure.mgmt.sql.types.ResourceIdentity
name: ResourceIdentity
fullName: azure.mgmt.sql.types.ResourceIdentity
module: azure.mgmt.sql.types
summary: Azure Active Directory identity configuration for a resource.
constructor:
  syntax: ResourceIdentity()
variables:
- description: The resource ids of the user assigned identities to use.
  name: userAssignedIdentities
  types:
  - <xref:dict>[<xref:str>, <xref:"UserIdentity">]
- description: The Azure Active Directory principal id.
  name: principalId
  types:
  - <xref:str>
- description: 'The identity type. Set this to ''SystemAssigned'' in order to automatically
    create

    and assign an Azure Active Directory principal for the resource. Known values
    are: "None",

    "SystemAssigned", "UserAssigned", and "SystemAssigned,UserAssigned".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IdentityType">]
- description: The Azure Active Directory tenant id.
  name: tenantId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.sql.types.ResourceIdentity.principalId
  name: principalId
  summary: The Azure Active Directory principal id.
  signature: 'principalId: str'
- uid: azure.mgmt.sql.types.ResourceIdentity.tenantId
  name: tenantId
  summary: The Azure Active Directory tenant id.
  signature: 'tenantId: str'
- uid: azure.mgmt.sql.types.ResourceIdentity.type
  name: type
  summary: 'The identity type. Set this to ''SystemAssigned'' in order to automatically
    create and assign an

    Azure Active Directory principal for the resource. Known values are: "None",

    "SystemAssigned", "UserAssigned", and "SystemAssigned,UserAssigned".'
  signature: 'type: str | IdentityType'
- uid: azure.mgmt.sql.types.ResourceIdentity.userAssignedIdentities
  name: userAssignedIdentities
  summary: The resource ids of the user assigned identities to use.
  signature: 'userAssignedIdentities: dict[str, ''UserIdentity'']'
