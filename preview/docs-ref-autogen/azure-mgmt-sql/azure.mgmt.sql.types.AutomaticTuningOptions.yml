### YamlMime:PythonClass
uid: azure.mgmt.sql.types.AutomaticTuningOptions
name: AutomaticTuningOptions
fullName: azure.mgmt.sql.types.AutomaticTuningOptions
module: azure.mgmt.sql.types
summary: Automatic tuning properties for individual advisors.
constructor:
  syntax: AutomaticTuningOptions()
variables:
- description: 'Automatic tuning option desired state. Known values are: "Off", "On",
    and

    "Default".'
  name: desiredState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutomaticTuningOptionModeDesired">]
- description: 'Automatic tuning option actual state. Known values are: "Off" and
    "On".'
  name: actualState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutomaticTuningOptionModeActual">]
- description: Reason code if desired and actual state are different.
  name: reasonCode
  types:
  - <xref:int>
- description: 'Reason description if desired and actual state are different. Known
    values

    are: "Default", "Disabled", "AutoConfigured", "InheritedFromServer", "QueryStoreOff",

    "QueryStoreReadOnly", and "NotSupported".'
  name: reasonDesc
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutomaticTuningDisabledReason">]
attributes:
- uid: azure.mgmt.sql.types.AutomaticTuningOptions.actualState
  name: actualState
  summary: '"Off" and "On".'
  signature: 'actualState: str | AutomaticTuningOptionModeActual'
- uid: azure.mgmt.sql.types.AutomaticTuningOptions.desiredState
  name: desiredState
  summary: '"Off", "On", and "Default".'
  signature: 'desiredState: str | AutomaticTuningOptionModeDesired'
- uid: azure.mgmt.sql.types.AutomaticTuningOptions.reasonCode
  name: reasonCode
  summary: Reason code if desired and actual state are different.
  signature: 'reasonCode: int'
- uid: azure.mgmt.sql.types.AutomaticTuningOptions.reasonDesc
  name: reasonDesc
  summary: '"Default",

    "Disabled", "AutoConfigured", "InheritedFromServer", "QueryStoreOff",

    "QueryStoreReadOnly", and "NotSupported".'
  signature: 'reasonDesc: str | AutomaticTuningDisabledReason'
