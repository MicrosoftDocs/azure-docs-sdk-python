### YamlMime:PythonClass
uid: azure.mgmt.sql.types.RecommendedActionStateInfo
name: RecommendedActionStateInfo
fullName: azure.mgmt.sql.types.RecommendedActionStateInfo
module: azure.mgmt.sql.types
summary: 'Contains information of current state for an Azure SQL Database, Server
  or Elastic Pool

  Recommended Action.'
constructor:
  syntax: RecommendedActionStateInfo()
variables:
- description: 'Current state the recommended action is in. Some commonly used states
    are:

    Active      -> recommended action is active and no action has been taken yet.
    Pending     ->

    recommended action is approved for and is awaiting execution. Executing   -> recommended
    action

    is being applied on the user database. Verifying   -> recommended action was applied
    and is

    being verified of its usefulness by the system. Success     -> recommended action
    was applied

    and improvement found during verification. Pending Revert  -> verification found
    little or no

    improvement so recommended action is queued for revert or user has manually reverted.
    Reverting

    -> changes made while applying recommended action are being reverted on the user
    database.

    Reverted    -> successfully reverted the changes made by recommended action on
    user database.

    Ignored     -> user explicitly ignored/discarded the recommended action. Required.
    Known values

    are: "Active", "Pending", "Executing", "Verifying", "PendingRevert", "RevertCancelled",

    "Reverting", "Reverted", "Ignored", "Expired", "Monitoring", "Resolved", "Success",
    and

    "Error".'
  name: currentValue
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecommendedActionCurrentState">]
- description: 'Gets who initiated the execution of this recommended action. Possible

    Value are: User    -> When user explicity notified system to apply the recommended
    action.

    System  -> When auto-execute status of this advisor was set to ''Enabled'', in
    which case the

    system applied it. Known values are: "User" and "System".'
  name: actionInitiatedBy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecommendedActionInitiatedBy">]
- description: Gets the time when the state was last modified.
  name: lastModified
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.sql.types.RecommendedActionStateInfo.actionInitiatedBy
  name: actionInitiatedBy
  summary: 'User    ->

    When user explicity notified system to apply the recommended action. System  ->
    When

    auto-execute status of this advisor was set to ''Enabled'', in which case the
    system applied it.

    Known values are: "User" and "System".'
  signature: 'actionInitiatedBy: str | RecommendedActionInitiatedBy'
- uid: azure.mgmt.sql.types.RecommendedActionStateInfo.currentValue
  name: currentValue
  summary: 'Active      ->

    recommended action is active and no action has been taken yet. Pending     ->
    recommended

    action is approved for and is awaiting execution. Executing   -> recommended action
    is being

    applied on the user database. Verifying   -> recommended action was applied and
    is being

    verified of its usefulness by the system. Success     -> recommended action was
    applied and

    improvement found during verification. Pending Revert  -> verification found little
    or no

    improvement so recommended action is queued for revert or user has manually reverted.
    Reverting

    -> changes made while applying recommended action are being reverted on the user
    database.

    Reverted    -> successfully reverted the changes made by recommended action on
    user database.

    Ignored     -> user explicitly ignored/discarded the recommended action. Required.
    Known values

    are: "Active", "Pending", "Executing", "Verifying", "PendingRevert",

    "RevertCancelled", "Reverting", "Reverted", "Ignored", "Expired", "Monitoring",

    "Resolved", "Success", and "Error".'
  signature: 'currentValue: Required[str | RecommendedActionCurrentState]'
- uid: azure.mgmt.sql.types.RecommendedActionStateInfo.lastModified
  name: lastModified
  summary: Gets the time when the state was last modified.
  signature: 'lastModified: str'
