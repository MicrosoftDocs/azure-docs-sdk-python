### YamlMime:PythonClass
uid: azure.mgmt.sql.types.SyncGroupProperties
name: SyncGroupProperties
fullName: azure.mgmt.sql.types.SyncGroupProperties
module: azure.mgmt.sql.types
summary: Properties of a sync group with support to MI.
constructor:
  syntax: SyncGroupProperties()
variables:
- description: Sync interval of the sync group.
  name: interval
  types:
  - <xref:int>
- description: Last sync time of the sync group.
  name: lastSyncTime
  types:
  - <xref:str>
- description: 'Conflict resolution policy of the sync group. Known values are:

    "HubWin" and "MemberWin".'
  name: conflictResolutionPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyncConflictResolutionPolicy">]
- description: ARM resource id of the sync database in the sync group.
  name: syncDatabaseId
  types:
  - <xref:str>
- description: User name for the sync group hub database credential.
  name: hubDatabaseUserName
  types:
  - <xref:str>
- description: Password for the sync group hub database credential.
  name: hubDatabasePassword
  types:
  - <xref:str>
- description: 'Sync state of the sync group. Known values are: "NotReady", "Error",

    "Warning", "Progressing", and "Good".'
  name: syncState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyncGroupState">]
- description: Sync schema of the sync group.
  name: schema
  types:
  - <xref:<xref:"SyncGroupSchema">>
- description: If conflict logging is enabled.
  name: enableConflictLogging
  types:
  - <xref:bool>
- description: Conflict logging retention period.
  name: conflictLoggingRetentionInDays
  types:
  - <xref:int>
- description: If use private link connection is enabled.
  name: usePrivateLinkConnection
  types:
  - <xref:bool>
- description: 'Private endpoint name of the sync group if use private link

    connection is enabled.'
  name: privateEndpointName
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.sql.types.SyncGroupProperties.conflictLoggingRetentionInDays
  name: conflictLoggingRetentionInDays
  summary: Conflict logging retention period.
  signature: 'conflictLoggingRetentionInDays: int'
- uid: azure.mgmt.sql.types.SyncGroupProperties.conflictResolutionPolicy
  name: conflictResolutionPolicy
  summary: '"HubWin" and "MemberWin".'
  signature: 'conflictResolutionPolicy: str | SyncConflictResolutionPolicy'
- uid: azure.mgmt.sql.types.SyncGroupProperties.enableConflictLogging
  name: enableConflictLogging
  summary: If conflict logging is enabled.
  signature: 'enableConflictLogging: bool'
- uid: azure.mgmt.sql.types.SyncGroupProperties.hubDatabasePassword
  name: hubDatabasePassword
  summary: Password for the sync group hub database credential.
  signature: 'hubDatabasePassword: str'
- uid: azure.mgmt.sql.types.SyncGroupProperties.hubDatabaseUserName
  name: hubDatabaseUserName
  summary: User name for the sync group hub database credential.
  signature: 'hubDatabaseUserName: str'
- uid: azure.mgmt.sql.types.SyncGroupProperties.interval
  name: interval
  summary: Sync interval of the sync group.
  signature: 'interval: int'
- uid: azure.mgmt.sql.types.SyncGroupProperties.lastSyncTime
  name: lastSyncTime
  summary: Last sync time of the sync group.
  signature: 'lastSyncTime: str'
- uid: azure.mgmt.sql.types.SyncGroupProperties.privateEndpointName
  name: privateEndpointName
  summary: Private endpoint name of the sync group if use private link connection
    is enabled.
  signature: 'privateEndpointName: str'
- uid: azure.mgmt.sql.types.SyncGroupProperties.schema
  name: schema
  summary: Sync schema of the sync group.
  signature: 'schema: SyncGroupSchema'
- uid: azure.mgmt.sql.types.SyncGroupProperties.syncDatabaseId
  name: syncDatabaseId
  summary: ARM resource id of the sync database in the sync group.
  signature: 'syncDatabaseId: str'
- uid: azure.mgmt.sql.types.SyncGroupProperties.syncState
  name: syncState
  summary: '"NotReady", "Error", "Warning",

    "Progressing", and "Good".'
  signature: 'syncState: str | SyncGroupState'
- uid: azure.mgmt.sql.types.SyncGroupProperties.usePrivateLinkConnection
  name: usePrivateLinkConnection
  summary: If use private link connection is enabled.
  signature: 'usePrivateLinkConnection: bool'
