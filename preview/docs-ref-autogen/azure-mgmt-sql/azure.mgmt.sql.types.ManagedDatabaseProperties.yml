### YamlMime:PythonClass
uid: azure.mgmt.sql.types.ManagedDatabaseProperties
name: ManagedDatabaseProperties
fullName: azure.mgmt.sql.types.ManagedDatabaseProperties
module: azure.mgmt.sql.types
summary: The managed database's properties.
constructor:
  syntax: ManagedDatabaseProperties()
variables:
- description: Collation of the managed database.
  name: collation
  types:
  - <xref:str>
- description: 'Status of the database. Known values are: "Online", "Offline", "Shutdown",

    "Creating", "Inaccessible", "Restoring", "Updating", "Stopping", "Stopped", "Starting",

    "DbMoving", and "DbCopying".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ManagedDatabaseStatus">]
- description: Creation date of the database.
  name: creationDate
  types:
  - <xref:str>
- description: Earliest restore point in time for point in time restore.
  name: earliestRestorePoint
  types:
  - <xref:str>
- description: 'Conditional. If createMode is PointInTimeRestore, this value is

    required. Specifies the point in time (ISO8601 format) of the source database
    that will be

    restored to create the new database.'
  name: restorePointInTime
  types:
  - <xref:str>
- description: Geo paired region.
  name: defaultSecondaryLocation
  types:
  - <xref:str>
- description: 'Collation of the metadata catalog. Known values are: "DATABASE_DEFAULT"

    and "SQL_Latin1_General_CP1_CI_AS".'
  name: catalogCollation
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CatalogCollationType">]
- description: 'Managed database create mode. PointInTimeRestore: Create a database
    by

    restoring a point in time backup of an existing database. SourceDatabaseName,

    SourceManagedInstanceName and PointInTime must be specified. RestoreExternalBackup:
    Create a

    database by restoring from external backup files. Collation, StorageContainerUri
    and

    StorageContainerSasToken must be specified. Recovery: Creates a database by restoring
    a

    geo-replicated backup. RecoverableDatabaseId must be specified as the recoverable
    database

    resource ID to restore. RestoreLongTermRetentionBackup: Create a database by restoring
    from a

    long term retention backup (longTermRetentionBackupResourceId required). Known
    values are:

    "Default", "RestoreExternalBackup", "PointInTimeRestore", "Recovery", and

    "RestoreLongTermRetentionBackup".'
  name: createMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ManagedDatabaseCreateMode">]
- description: 'Conditional. If createMode is RestoreExternalBackup, this value is

    required. Specifies the uri of the storage container where backups for this restore
    are stored.'
  name: storageContainerUri
  types:
  - <xref:str>
- description: 'The resource identifier of the source database associated with create

    operation of this database.'
  name: sourceDatabaseId
  types:
  - <xref:str>
- description: 'The resource identifier of the cross-subscription

    source database associated with create operation of this database.'
  name: crossSubscriptionSourceDatabaseId
  types:
  - <xref:str>
- description: 'The restorable dropped database resource id to restore when

    creating this database.'
  name: restorableDroppedDatabaseId
  types:
  - <xref:str>
- description: 'The restorable cross-subscription dropped

    database resource id to restore when creating this database.'
  name: crossSubscriptionRestorableDroppedDatabaseId
  types:
  - <xref:str>
- description: 'Conditional. If createMode is RestoreExternalBackup, this value

    is used. Specifies the identity used for storage container authentication. Can
    be

    ''SharedAccessSignature'' or ''ManagedIdentity''; if not specified ''SharedAccessSignature''
    is

    assumed.'
  name: storageContainerIdentity
  types:
  - <xref:str>
- description: 'Conditional. If createMode is RestoreExternalBackup and

    storageContainerIdentity is not ManagedIdentity, this value is required. Specifies
    the storage

    container sas token.'
  name: storageContainerSasToken
  types:
  - <xref:str>
- description: 'Instance Failover Group resource identifier that this managed database

    belongs to.'
  name: failoverGroupId
  types:
  - <xref:str>
- description: 'The resource identifier of the recoverable database associated

    with create operation of this database.'
  name: recoverableDatabaseId
  types:
  - <xref:str>
- description: 'The name of the Long Term Retention backup to be used

    for restore of this managed database.'
  name: longTermRetentionBackupResourceId
  types:
  - <xref:str>
- description: Whether to auto complete restore of this managed database.
  name: autoCompleteRestore
  types:
  - <xref:bool>
- description: Last backup file name for restore of this managed database.
  name: lastBackupName
  types:
  - <xref:str>
- description: 'Target managed instance id used in

    cross-subscription restore.'
  name: crossSubscriptionTargetManagedInstanceId
  types:
  - <xref:str>
- description: 'Whether or not this database is a ledger database, which means all
    tables in

    the database are ledger tables. Note: the value of this property cannot be changed
    after the

    database has been created.'
  name: isLedgerOn
  types:
  - <xref:bool>
- description: 'Additional observability and troubleshooting information for

    databases in ''Inaccessible'' state.'
  name: extendedAccessibilityInfo
  types:
  - <xref:<xref:"ManagedDatabaseExtendedAccessibilityInfo">>
attributes:
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.autoCompleteRestore
  name: autoCompleteRestore
  summary: Whether to auto complete restore of this managed database.
  signature: 'autoCompleteRestore: bool'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.catalogCollation
  name: catalogCollation
  summary: '"DATABASE_DEFAULT" and

    "SQL_Latin1_General_CP1_CI_AS".'
  signature: 'catalogCollation: str | CatalogCollationType'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.collation
  name: collation
  summary: Collation of the managed database.
  signature: 'collation: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.createMode
  name: createMode
  summary: 'Create a database by restoring a point in

    time backup of an existing database. SourceDatabaseName, SourceManagedInstanceName
    and

    PointInTime must be specified. RestoreExternalBackup: Create a database by restoring
    from

    external backup files. Collation, StorageContainerUri and StorageContainerSasToken
    must be

    specified. Recovery: Creates a database by restoring a geo-replicated backup.

    RecoverableDatabaseId must be specified as the recoverable database resource ID
    to restore.

    RestoreLongTermRetentionBackup: Create a database by restoring from a long term
    retention

    backup (longTermRetentionBackupResourceId required). Known values are: "Default",

    "RestoreExternalBackup", "PointInTimeRestore", "Recovery", and

    "RestoreLongTermRetentionBackup".'
  signature: 'createMode: str | ManagedDatabaseCreateMode'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.creationDate
  name: creationDate
  summary: Creation date of the database.
  signature: 'creationDate: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.crossSubscriptionRestorableDroppedDatabaseId
  name: crossSubscriptionRestorableDroppedDatabaseId
  summary: 'The restorable cross-subscription dropped database resource id to restore
    when creating this

    database.'
  signature: 'crossSubscriptionRestorableDroppedDatabaseId: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.crossSubscriptionSourceDatabaseId
  name: crossSubscriptionSourceDatabaseId
  summary: 'The resource identifier of the cross-subscription source database associated
    with create

    operation of this database.'
  signature: 'crossSubscriptionSourceDatabaseId: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.crossSubscriptionTargetManagedInstanceId
  name: crossSubscriptionTargetManagedInstanceId
  summary: Target managed instance id used in cross-subscription restore.
  signature: 'crossSubscriptionTargetManagedInstanceId: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.defaultSecondaryLocation
  name: defaultSecondaryLocation
  summary: Geo paired region.
  signature: 'defaultSecondaryLocation: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.earliestRestorePoint
  name: earliestRestorePoint
  summary: Earliest restore point in time for point in time restore.
  signature: 'earliestRestorePoint: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.extendedAccessibilityInfo
  name: extendedAccessibilityInfo
  summary: Additional observability and troubleshooting information for databases
    in 'Inaccessible' state.
  signature: 'extendedAccessibilityInfo: ManagedDatabaseExtendedAccessibilityInfo'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.failoverGroupId
  name: failoverGroupId
  summary: Instance Failover Group resource identifier that this managed database
    belongs to.
  signature: 'failoverGroupId: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.isLedgerOn
  name: isLedgerOn
  summary: 'Whether or not this database is a ledger database, which means all tables
    in the database are

    ledger tables. Note: the value of this property cannot be changed after the database
    has been

    created.'
  signature: 'isLedgerOn: bool'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.lastBackupName
  name: lastBackupName
  summary: Last backup file name for restore of this managed database.
  signature: 'lastBackupName: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.longTermRetentionBackupResourceId
  name: longTermRetentionBackupResourceId
  summary: The name of the Long Term Retention backup to be used for restore of this
    managed database.
  signature: 'longTermRetentionBackupResourceId: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.recoverableDatabaseId
  name: recoverableDatabaseId
  summary: 'The resource identifier of the recoverable database associated with create
    operation of this

    database.'
  signature: 'recoverableDatabaseId: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.restorableDroppedDatabaseId
  name: restorableDroppedDatabaseId
  summary: The restorable dropped database resource id to restore when creating this
    database.
  signature: 'restorableDroppedDatabaseId: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.restorePointInTime
  name: restorePointInTime
  summary: 'Conditional. If createMode is PointInTimeRestore, this value is required.
    Specifies the point

    in time (ISO8601 format) of the source database that will be restored to create
    the new

    database.'
  signature: 'restorePointInTime: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.sourceDatabaseId
  name: sourceDatabaseId
  summary: 'The resource identifier of the source database associated with create
    operation of this

    database.'
  signature: 'sourceDatabaseId: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.status
  name: status
  summary: '"Online", "Offline", "Shutdown", "Creating",

    "Inaccessible", "Restoring", "Updating", "Stopping", "Stopped", "Starting",

    "DbMoving", and "DbCopying".'
  signature: 'status: str | ManagedDatabaseStatus'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.storageContainerIdentity
  name: storageContainerIdentity
  summary: 'Conditional. If createMode is RestoreExternalBackup, this value is used.
    Specifies the identity

    used for storage container authentication. Can be ''SharedAccessSignature'' or
    ''ManagedIdentity'';

    if not specified ''SharedAccessSignature'' is assumed.'
  signature: 'storageContainerIdentity: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.storageContainerSasToken
  name: storageContainerSasToken
  summary: 'Conditional. If createMode is RestoreExternalBackup and storageContainerIdentity
    is not

    ManagedIdentity, this value is required. Specifies the storage container sas token.'
  signature: 'storageContainerSasToken: str'
- uid: azure.mgmt.sql.types.ManagedDatabaseProperties.storageContainerUri
  name: storageContainerUri
  summary: 'Conditional. If createMode is RestoreExternalBackup, this value is required.
    Specifies the uri

    of the storage container where backups for this restore are stored.'
  signature: 'storageContainerUri: str'
