### YamlMime:PythonClass
uid: azure.mgmt.sql.types.ServerKeyProperties
name: ServerKeyProperties
fullName: azure.mgmt.sql.types.ServerKeyProperties
module: azure.mgmt.sql.types
summary: Properties for a server key execution.
constructor:
  syntax: ServerKeyProperties()
variables:
- description: Subregion of the server key.
  name: subregion
  types:
  - <xref:str>
- description: 'The server key type like ''ServiceManaged'', ''AzureKeyVault''. Required.

    Known values are: "ServiceManaged" and "AzureKeyVault".'
  name: serverKeyType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServerKeyType">]
- description: 'The URI of the server key. If the ServerKeyType is AzureKeyVault,
    then the URI is

    required. The AKV URI is required to be in this format:

    ''[https://YourVaultName.vault.azure.net/keys/YourKeyName/YourKeyVersion](https://YourVaultName.vault.azure.net/keys/YourKeyName/YourKeyVersion)''
    or can be

    ''[https://YourVaultName.vault.azure.net/keys/YourKeyName](https://YourVaultName.vault.azure.net/keys/YourKeyName)''.'
  name: uri
  types:
  - <xref:str>
- description: Thumbprint of the server key.
  name: thumbprint
  types:
  - <xref:str>
- description: The server key creation date.
  name: creationDate
  types:
  - <xref:str>
- description: Key auto rotation opt-in flag. Either true or false.
  name: autoRotationEnabled
  types:
  - <xref:bool>
- description: The version of the server key.
  name: keyVersion
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.sql.types.ServerKeyProperties.autoRotationEnabled
  name: autoRotationEnabled
  summary: Key auto rotation opt-in flag. Either true or false.
  signature: 'autoRotationEnabled: bool'
- uid: azure.mgmt.sql.types.ServerKeyProperties.creationDate
  name: creationDate
  summary: The server key creation date.
  signature: 'creationDate: str'
- uid: azure.mgmt.sql.types.ServerKeyProperties.keyVersion
  name: keyVersion
  summary: The version of the server key.
  signature: 'keyVersion: str'
- uid: azure.mgmt.sql.types.ServerKeyProperties.serverKeyType
  name: serverKeyType
  summary: 'The server key type like ''ServiceManaged'', ''AzureKeyVault''. Required.
    Known values are:

    "ServiceManaged" and "AzureKeyVault".'
  signature: 'serverKeyType: Required[str | ServerKeyType]'
- uid: azure.mgmt.sql.types.ServerKeyProperties.subregion
  name: subregion
  summary: Subregion of the server key.
  signature: 'subregion: str'
- uid: azure.mgmt.sql.types.ServerKeyProperties.thumbprint
  name: thumbprint
  summary: Thumbprint of the server key.
  signature: 'thumbprint: str'
- uid: azure.mgmt.sql.types.ServerKeyProperties.uri
  name: uri
  summary: 'The URI of the server key. If the ServerKeyType is AzureKeyVault, then
    the URI is required. The

    AKV URI is required to be in this format:

    ''[https://YourVaultName.vault.azure.net/keys/YourKeyName/YourKeyVersion](https://YourVaultName.vault.azure.net/keys/YourKeyName/YourKeyVersion)''
    or can be

    ''[https://YourVaultName.vault.azure.net/keys/YourKeyName](https://YourVaultName.vault.azure.net/keys/YourKeyName)''.'
  signature: 'uri: str'
