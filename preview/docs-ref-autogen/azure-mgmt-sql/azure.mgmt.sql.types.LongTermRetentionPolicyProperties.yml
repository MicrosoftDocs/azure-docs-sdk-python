### YamlMime:PythonClass
uid: azure.mgmt.sql.types.LongTermRetentionPolicyProperties
name: LongTermRetentionPolicyProperties
fullName: azure.mgmt.sql.types.LongTermRetentionPolicyProperties
module: azure.mgmt.sql.types
summary: Properties of a long term retention policy.
constructor:
  syntax: LongTermRetentionPolicyProperties()
variables:
- description: 'The setting for whether to enable time-based immutability for

    future backups. When set, future backups will have TimeBasedImmutability enabled.
    Known values

    are: "Enabled" and "Disabled".'
  name: timeBasedImmutability
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TimeBasedImmutability">]
- description: 'The setting for time-based immutability mode for future backup

    (Value can be either Locked or UnLocked. Only effective if TimeBasedImmutability
    is enabled).

    Caution: Immutability of LTR backup cannot be removed if TimeBasedImmutabilityMode
    is Locked.

    Known values are: "Locked" and "Unlocked".'
  name: timeBasedImmutabilityMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TimeBasedImmutabilityMode">]
- description: The weekly retention policy for an LTR backup in an ISO 8601 format.
  name: weeklyRetention
  types:
  - <xref:str>
- description: The monthly retention policy for an LTR backup in an ISO 8601 format.
  name: monthlyRetention
  types:
  - <xref:str>
- description: The yearly retention policy for an LTR backup in an ISO 8601 format.
  name: yearlyRetention
  types:
  - <xref:str>
- description: The week of year to take the yearly backup in an ISO 8601 format.
  name: weekOfYear
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.sql.types.LongTermRetentionPolicyProperties.monthlyRetention
  name: monthlyRetention
  summary: The monthly retention policy for an LTR backup in an ISO 8601 format.
  signature: 'monthlyRetention: str'
- uid: azure.mgmt.sql.types.LongTermRetentionPolicyProperties.timeBasedImmutability
  name: timeBasedImmutability
  summary: 'The setting for whether to enable time-based immutability for future backups.
    When set, future

    backups will have TimeBasedImmutability enabled. Known values are: "Enabled" and

    "Disabled".'
  signature: 'timeBasedImmutability: str | TimeBasedImmutability'
- uid: azure.mgmt.sql.types.LongTermRetentionPolicyProperties.timeBasedImmutabilityMode
  name: timeBasedImmutabilityMode
  summary: 'The setting for time-based immutability mode for future backup (Value
    can be either Locked or

    UnLocked. Only effective if TimeBasedImmutability is enabled). Caution: Immutability
    of LTR

    backup cannot be removed if TimeBasedImmutabilityMode is Locked. Known values
    are: "Locked"

    and "Unlocked".'
  signature: 'timeBasedImmutabilityMode: str | TimeBasedImmutabilityMode'
- uid: azure.mgmt.sql.types.LongTermRetentionPolicyProperties.weekOfYear
  name: weekOfYear
  summary: The week of year to take the yearly backup in an ISO 8601 format.
  signature: 'weekOfYear: int'
- uid: azure.mgmt.sql.types.LongTermRetentionPolicyProperties.weeklyRetention
  name: weeklyRetention
  summary: The weekly retention policy for an LTR backup in an ISO 8601 format.
  signature: 'weeklyRetention: str'
- uid: azure.mgmt.sql.types.LongTermRetentionPolicyProperties.yearlyRetention
  name: yearlyRetention
  summary: The yearly retention policy for an LTR backup in an ISO 8601 format.
  signature: 'yearlyRetention: str'
