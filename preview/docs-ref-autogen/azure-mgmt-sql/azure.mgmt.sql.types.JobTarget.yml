### YamlMime:PythonClass
uid: azure.mgmt.sql.types.JobTarget
name: JobTarget
fullName: azure.mgmt.sql.types.JobTarget
module: azure.mgmt.sql.types
summary: 'A job target, for example a specific database or a container of databases
  that is evaluated

  during job execution.'
constructor:
  syntax: JobTarget()
variables:
- description: 'Whether the target is included or excluded from the group. Known values

    are: "Include" and "Exclude".'
  name: membershipType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"JobTargetGroupMembershipType">]
- description: 'The target type. Required. Known values are: "TargetGroup", "SqlDatabase",

    "SqlElasticPool", "SqlShardMap", and "SqlServer".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"JobTargetType">]
- description: The target server name.
  name: serverName
  types:
  - <xref:str>
- description: The target database name.
  name: databaseName
  types:
  - <xref:str>
- description: The target elastic pool name.
  name: elasticPoolName
  types:
  - <xref:str>
- description: The target shard map.
  name: shardMapName
  types:
  - <xref:str>
- description: 'The resource ID of the credential that is used during job execution
    to

    connect to the target and determine the list of databases inside the target.'
  name: refreshCredential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.sql.types.JobTarget.databaseName
  name: databaseName
  summary: The target database name.
  signature: 'databaseName: str'
- uid: azure.mgmt.sql.types.JobTarget.elasticPoolName
  name: elasticPoolName
  summary: The target elastic pool name.
  signature: 'elasticPoolName: str'
- uid: azure.mgmt.sql.types.JobTarget.membershipType
  name: membershipType
  summary: '"Include" and

    "Exclude".'
  signature: 'membershipType: str | JobTargetGroupMembershipType'
- uid: azure.mgmt.sql.types.JobTarget.refreshCredential
  name: refreshCredential
  summary: 'The resource ID of the credential that is used during job execution to
    connect to the target

    and determine the list of databases inside the target.'
  signature: 'refreshCredential: str'
- uid: azure.mgmt.sql.types.JobTarget.serverName
  name: serverName
  summary: The target server name.
  signature: 'serverName: str'
- uid: azure.mgmt.sql.types.JobTarget.shardMapName
  name: shardMapName
  summary: The target shard map.
  signature: 'shardMapName: str'
- uid: azure.mgmt.sql.types.JobTarget.type
  name: type
  summary: '"TargetGroup", "SqlDatabase",

    "SqlElasticPool", "SqlShardMap", and "SqlServer".'
  signature: 'type: Required[str | JobTargetType]'
