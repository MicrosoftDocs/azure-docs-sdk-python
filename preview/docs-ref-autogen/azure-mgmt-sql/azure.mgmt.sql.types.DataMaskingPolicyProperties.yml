### YamlMime:PythonClass
uid: azure.mgmt.sql.types.DataMaskingPolicyProperties
name: DataMaskingPolicyProperties
fullName: azure.mgmt.sql.types.DataMaskingPolicyProperties
module: azure.mgmt.sql.types
summary: The properties of a database data masking policy.
constructor:
  syntax: DataMaskingPolicyProperties()
variables:
- description: 'The state of the data masking policy. Required. Known values are:

    "Enabled" and "Disabled".'
  name: dataMaskingState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataMaskingState">]
- description: 'The list of the exempt principals. Specifies the semicolon-separated

    list of database users for which the data masking policy does not apply. The specified
    users

    receive data results without masking for all of the database queries.'
  name: exemptPrincipals
  types:
  - <xref:str>
- description: 'The list of the application principals. This is a legacy parameter

    and is no longer used.'
  name: applicationPrincipals
  types:
  - <xref:str>
- description: The masking level. This is a legacy parameter and is no longer used.
  name: maskingLevel
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.sql.types.DataMaskingPolicyProperties.applicationPrincipals
  name: applicationPrincipals
  summary: The list of the application principals. This is a legacy parameter and
    is no longer used.
  signature: 'applicationPrincipals: str'
- uid: azure.mgmt.sql.types.DataMaskingPolicyProperties.dataMaskingState
  name: dataMaskingState
  summary: '"Enabled" and "Disabled".'
  signature: 'dataMaskingState: Required[str | DataMaskingState]'
- uid: azure.mgmt.sql.types.DataMaskingPolicyProperties.exemptPrincipals
  name: exemptPrincipals
  summary: 'The list of the exempt principals. Specifies the semicolon-separated list
    of database users for

    which the data masking policy does not apply. The specified users receive data
    results without

    masking for all of the database queries.'
  signature: 'exemptPrincipals: str'
- uid: azure.mgmt.sql.types.DataMaskingPolicyProperties.maskingLevel
  name: maskingLevel
  summary: The masking level. This is a legacy parameter and is no longer used.
  signature: 'maskingLevel: str'
