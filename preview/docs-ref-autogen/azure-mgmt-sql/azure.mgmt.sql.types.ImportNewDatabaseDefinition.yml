### YamlMime:PythonClass
uid: azure.mgmt.sql.types.ImportNewDatabaseDefinition
name: ImportNewDatabaseDefinition
fullName: azure.mgmt.sql.types.ImportNewDatabaseDefinition
module: azure.mgmt.sql.types
summary: Contains the information necessary to perform import operation for new database.
constructor:
  syntax: ImportNewDatabaseDefinition()
variables:
- description: Name of the import database.
  name: databaseName
  types:
  - <xref:str>
- description: Edition of the import database.
  name: edition
  types:
  - <xref:str>
- description: Service level objective name of the import database.
  name: serviceObjectiveName
  types:
  - <xref:str>
- description: Max size in bytes for the import database.
  name: maxSizeBytes
  types:
  - <xref:str>
- description: 'Storage key type: StorageAccessKey, SharedAccessKey, or ManagedIdentity.

    Required. Known values are: "SharedAccessKey", "StorageAccessKey", and "ManagedIdentity".'
  name: storageKeyType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageKeyType">]
- description: 'Storage key for the storage account. If StorageKeyType is ManagedIdentity,

    this field should specify the Managed Identity''s resource ID. Required.'
  name: storageKey
  types:
  - <xref:str>
- description: Storage Uri. Required.
  name: storageUri
  types:
  - <xref:str>
- description: 'Administrator login name. If AuthenticationType is ManagedIdentity,

    this field should specify the Managed Identity''s resource ID. Required.'
  name: administratorLogin
  types:
  - <xref:str>
- description: 'Administrator login password. If AuthenticationType is

    ManagedIdentity, this field should not be specified.'
  name: administratorLoginPassword
  types:
  - <xref:str>
- description: 'Type of credentials provided for access to the target SQL server:

    SQL, ADPassword or ManagedIdentity.'
  name: authenticationType
  types:
  - <xref:str>
- description: Optional resource information to enable network isolation for request.
  name: networkIsolation
  types:
  - <xref:<xref:"NetworkIsolationSettings">>
attributes:
- uid: azure.mgmt.sql.types.ImportNewDatabaseDefinition.administratorLogin
  name: administratorLogin
  summary: 'Administrator login name. If AuthenticationType is ManagedIdentity, this
    field should specify

    the Managed Identity''s resource ID. Required.'
  signature: 'administratorLogin: Required[str]'
- uid: azure.mgmt.sql.types.ImportNewDatabaseDefinition.administratorLoginPassword
  name: administratorLoginPassword
  summary: 'Administrator login password. If AuthenticationType is ManagedIdentity,
    this field should not

    be specified.'
  signature: 'administratorLoginPassword: str'
- uid: azure.mgmt.sql.types.ImportNewDatabaseDefinition.authenticationType
  name: authenticationType
  summary: 'SQL, ADPassword or

    ManagedIdentity.'
  signature: 'authenticationType: str'
- uid: azure.mgmt.sql.types.ImportNewDatabaseDefinition.databaseName
  name: databaseName
  summary: Name of the import database.
  signature: 'databaseName: str'
- uid: azure.mgmt.sql.types.ImportNewDatabaseDefinition.edition
  name: edition
  summary: Edition of the import database.
  signature: 'edition: str'
- uid: azure.mgmt.sql.types.ImportNewDatabaseDefinition.maxSizeBytes
  name: maxSizeBytes
  summary: Max size in bytes for the import database.
  signature: 'maxSizeBytes: str'
- uid: azure.mgmt.sql.types.ImportNewDatabaseDefinition.networkIsolation
  name: networkIsolation
  summary: Optional resource information to enable network isolation for request.
  signature: 'networkIsolation: NetworkIsolationSettings'
- uid: azure.mgmt.sql.types.ImportNewDatabaseDefinition.serviceObjectiveName
  name: serviceObjectiveName
  summary: Service level objective name of the import database.
  signature: 'serviceObjectiveName: str'
- uid: azure.mgmt.sql.types.ImportNewDatabaseDefinition.storageKey
  name: storageKey
  summary: 'Storage key for the storage account. If StorageKeyType is ManagedIdentity,
    this field should

    specify the Managed Identity''s resource ID. Required.'
  signature: 'storageKey: Required[str]'
- uid: azure.mgmt.sql.types.ImportNewDatabaseDefinition.storageKeyType
  name: storageKeyType
  summary: 'StorageAccessKey, SharedAccessKey, or ManagedIdentity. Required. Known
    values

    are: "SharedAccessKey", "StorageAccessKey", and "ManagedIdentity".'
  signature: 'storageKeyType: Required[str | StorageKeyType]'
- uid: azure.mgmt.sql.types.ImportNewDatabaseDefinition.storageUri
  name: storageUri
  summary: Storage Uri. Required.
  signature: 'storageUri: Required[str]'
