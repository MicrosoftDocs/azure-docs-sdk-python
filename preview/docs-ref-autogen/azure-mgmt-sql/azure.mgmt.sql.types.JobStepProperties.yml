summary: Properties of a job step.
constructor:
  syntax: JobStepProperties()
variables:
- description: 'The job step''s index within the job. If not specified when creating
    the job step,

    it will be created as the last step. If not specified when updating the job step,
    the step id

    is not modified.'
  name: stepId
  types:
  - <xref:int>
- description: 'The resource ID of the target group that the job step will be executed
    on.

    Required.'
  name: targetGroup
  types:
  - <xref:str>
- description: 'The resource ID of the job credential that will be used to connect
    to the

    targets.'
  name: credential
  types:
  - <xref:str>
- description: The action payload of the job step. Required.
  name: action
  types:
  - <xref:<xref:"JobStepAction">>
- description: Output destination properties of the job step.
  name: output
  types:
  - <xref:<xref:"JobStepOutput">>
- description: Execution options for the job step.
  name: executionOptions
  types:
  - <xref:<xref:"JobStepExecutionOptions">>
