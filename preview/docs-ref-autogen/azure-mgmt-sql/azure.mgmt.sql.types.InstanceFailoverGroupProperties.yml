  - <xref:typing.Union>[<xref:str>, <xref:"SecondaryInstanceType">]
- description: Read-write endpoint of the failover group instance. Required.
  name: readWriteEndpoint
  types:
  - <xref:<xref:"InstanceFailoverGroupReadWriteEndpoint">>
- description: Read-only endpoint of the failover group instance.
  name: readOnlyEndpoint
  types:
  - <xref:<xref:"InstanceFailoverGroupReadOnlyEndpoint">>
- description: 'Local replication role of the failover group instance. Known values
    are:

    "Primary" and "Secondary".'
