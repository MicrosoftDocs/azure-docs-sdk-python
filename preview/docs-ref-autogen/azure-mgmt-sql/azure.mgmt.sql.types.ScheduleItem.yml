### YamlMime:PythonClass
uid: azure.mgmt.sql.types.ScheduleItem
name: ScheduleItem
fullName: azure.mgmt.sql.types.ScheduleItem
module: azure.mgmt.sql.types
summary: Schedule info describing when the server should be started or stopped.
constructor:
  syntax: ScheduleItem()
variables:
- description: 'Start day. Required. Known values are: "Sunday", "Monday", "Tuesday",

    "Wednesday", "Thursday", "Friday", and "Saturday".'
  name: startDay
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DayOfWeek">]
- description: Start time. Required.
  name: startTime
  types:
  - <xref:str>
- description: 'Stop day. Required. Known values are: "Sunday", "Monday", "Tuesday",

    "Wednesday", "Thursday", "Friday", and "Saturday".'
  name: stopDay
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DayOfWeek">]
- description: Stop time. Required.
  name: stopTime
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.sql.types.ScheduleItem.startDay
  name: startDay
  summary: '"Sunday", "Monday", "Tuesday", "Wednesday",

    "Thursday", "Friday", and "Saturday".'
  signature: 'startDay: Required[str | DayOfWeek]'
- uid: azure.mgmt.sql.types.ScheduleItem.startTime
  name: startTime
  summary: Start time. Required.
  signature: 'startTime: Required[str]'
- uid: azure.mgmt.sql.types.ScheduleItem.stopDay
  name: stopDay
  summary: '"Sunday", "Monday", "Tuesday", "Wednesday",

    "Thursday", "Friday", and "Saturday".'
  signature: 'stopDay: Required[str | DayOfWeek]'
- uid: azure.mgmt.sql.types.ScheduleItem.stopTime
  name: stopTime
  summary: Stop time. Required.
  signature: 'stopTime: Required[str]'
