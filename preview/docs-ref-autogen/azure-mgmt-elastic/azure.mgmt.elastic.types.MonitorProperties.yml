### YamlMime:PythonClass
uid: azure.mgmt.elastic.types.MonitorProperties
name: MonitorProperties
fullName: azure.mgmt.elastic.types.MonitorProperties
module: azure.mgmt.elastic.types
summary: Properties specific to the monitor resource.
constructor:
  syntax: MonitorProperties()
variables:
- description: 'Provisioning state of the monitor resource. Known values are:

    "Accepted", "Creating", "Updating", "Deleting", "Succeeded", "Failed", "Canceled",
    "Deleted",

    and "NotSpecified".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Flag specifying if the resource monitoring is enabled or disabled.

    Known values are: "Enabled" and "Disabled".'
  name: monitoring_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MonitoringStatus">]
- description: Elastic cloud properties.
  name: elastic_properties
  types:
  - <xref:<xref:"ElasticProperties">>
- description: User information.
  name: user_info
  types:
  - <xref:<xref:"UserInfo">>
- description: Plan details of the monitor resource.
  name: plan_details
  types:
  - <xref:<xref:"PlanDetails">>
- description: Version of elastic of the monitor resource.
  name: version
  types:
  - <xref:str>
- description: State of the Azure Subscription containing the monitor resource.
  name: subscription_state
  types:
  - <xref:str>
- description: 'Status of Azure Subscription where Marketplace SaaS is

    located.'
  name: saa_s_azure_subscription_status
  types:
  - <xref:str>
- description: Name of the marketing campaign.
  name: source_campaign_name
  types:
  - <xref:str>
- description: A unique identifier associated with the campaign.
  name: source_campaign_id
  types:
  - <xref:str>
- description: 'Known values are: "Unknown" and "MonitorLogs".'
  name: liftr_resource_category
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LiftrResourceCategories">]
- description: The priority of the resource.
  name: liftr_resource_preference
  types:
  - <xref:int>
- description: Flag to determine if User API Key has to be generated and shared.
  name: generate_api_key
  types:
  - <xref:bool>
- description: 'Hosting type of the monitor resource - either Hosted deployments OR

    Serverless Projects. Known values are: "Hosted" and "Serverless".'
  name: hosting_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HostingType">]
- description: 'Project details of the monitor resource IF it belongs to Serverless

    offer kind.'
  name: project_details
  types:
  - <xref:<xref:"ProjectDetails">>
