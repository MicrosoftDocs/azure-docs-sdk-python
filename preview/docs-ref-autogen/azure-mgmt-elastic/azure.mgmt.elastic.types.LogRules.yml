### YamlMime:PythonClass
uid: azure.mgmt.elastic.types.LogRules
name: LogRules
fullName: azure.mgmt.elastic.types.LogRules
module: azure.mgmt.elastic.types
summary: Set of rules for sending logs for the Monitor resource.
constructor:
  syntax: LogRules()
variables:
- description: Flag specifying if AAD logs should be sent for the Monitor resource.
  name: send_aad_logs
  types:
  - <xref:bool>
- description: 'Flag specifying if subscription logs should be sent for the

    Monitor resource.'
  name: send_subscription_logs
  types:
  - <xref:bool>
- description: 'Flag specifying if activity logs from Azure resources should be sent

    for the Monitor resource.'
  name: send_activity_logs
  types:
  - <xref:bool>
- description: 'List of filtering tags to be used for capturing logs. This only takes

    effect if SendActivityLogs flag is enabled. If empty, all resources will be captured.
    If only

    Exclude action is specified, the rules will apply to the list of all available
    resources. If

    Include actions are specified, the rules will only include resources with the
    associated tags.'
  name: filtering_tags
  types:
  - <xref:list>[<xref:"FilteringTag">]
attributes:
- uid: azure.mgmt.elastic.types.LogRules.filteringTags
  name: filteringTags
  summary: 'List of filtering tags to be used for capturing logs. This only takes
    effect if

    SendActivityLogs flag is enabled. If empty, all resources will be captured. If
    only Exclude

    action is specified, the rules will apply to the list of all available resources.
    If Include

    actions are specified, the rules will only include resources with the associated
    tags.'
  signature: 'filteringTags: list[azure.mgmt.elastic.types.FilteringTag]'
- uid: azure.mgmt.elastic.types.LogRules.sendAadLogs
  name: sendAadLogs
  summary: Flag specifying if AAD logs should be sent for the Monitor resource.
  signature: 'sendAadLogs: bool'
- uid: azure.mgmt.elastic.types.LogRules.sendActivityLogs
  name: sendActivityLogs
  summary: Flag specifying if activity logs from Azure resources should be sent for
    the Monitor resource.
  signature: 'sendActivityLogs: bool'
- uid: azure.mgmt.elastic.types.LogRules.sendSubscriptionLogs
  name: sendSubscriptionLogs
  summary: Flag specifying if subscription logs should be sent for the Monitor resource.
  signature: 'sendSubscriptionLogs: bool'
