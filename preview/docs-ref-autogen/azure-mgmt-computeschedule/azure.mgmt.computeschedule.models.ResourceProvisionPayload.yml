variables:
- description: 'Virtual machine profile object that contains VM properties

    that are common across all VMs in this batch  (if you want to create 100 VMs in
    this request,

    and they all have same vmSize, then include vmSize in baseProfile).'
  name: virtual_machine_base_profile
  types:
  - <xref:azure.mgmt.computeschedule.models.BulkVMConfiguration>
- description: 'Virtual machine profile array that contains VM properties that

    needs to be overridden for each VM in the batch (if you want to create 100 VMs,
    they all need a

    distinct computerName property, you pass computerNames for each VM in batch in
    this array),

    service will merge baseProfile with VM specific overrides and create a merged
    VMProfile.'
  name: virtual_machine_overrides
  types:
  - <xref:list>[<xref:azure.mgmt.computeschedule.models.BulkVMConfiguration>]
