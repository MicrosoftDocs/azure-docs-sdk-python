- uid: azure.appconfiguration.FeatureFlagClient.set_feature_flag
  name: set_feature_flag
  summary: "Add or update a FeatureFlag.\nIf the feature flag identified by name and\
    \ label does not exist, this is a create.\nOtherwise this is an update.\n\nExample\n\
    \n<!-- literal_block {\"ids\": [], \"classes\": [], \"names\": [], \"dupnames\"\
    : [], \"backrefs\": [], \"xml:space\": \"preserve\", \"force\": false, \"language\"\
    : \"python\", \"highlight_args\": {}, \"linenos\": false} -->\n\n````python\n\n\
    \   feature_flag = FeatureFlag(\n       name=\"MyFeatureFlag\",\n       enabled=True\n\
    \   )\n   returned_feature_flag = client.set_feature_flag(feature_flag)\n   ````"
  signature: 'set_feature_flag(feature_flag: FeatureFlag, match_condition: MatchConditions
    = MatchConditions.Unconditionally, *, etag: str | None = None, **kwargs: Any)
    -> FeatureFlag'
  parameters:
  - name: feature_flag
    description: The FeatureFlag to be added (if not exists)             or updated
      (if exists) to the service
    isRequired: true
    types:
    - <xref:azure.appconfiguration.FeatureFlag>
  - name: match_condition
    description: The match condition to use upon the etag
    defaultValue: MatchConditions.Unconditionally
    types:
    - <xref:azure.core.MatchConditions>
  keywordOnlyParameters:
  - name: etag
    description: Check if the FeatureFlag is changed.             Will use the value
      from param feature_flag if not set.
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  return:
    description: The FeatureFlag returned from the service
    types:
    - <xref:azure.appconfiguration.FeatureFlag>
  exceptions:
  - type: azure.appconfiguration.ResourceReadOnlyError
  - type: azure.core.exceptions.HttpResponseError
  - type: azure.core.exceptions.ClientAuthenticationError
  - type: azure.core.exceptions.ResourceModifiedError
  - type: azure.core.exceptions.ResourceNotModifiedError
