- uid: azure.appconfiguration.FeatureFlagClient.list_feature_flags
  name: list_feature_flags
  summary: "Find the FeatureFlag objects, optionally filtered by name, label, tags\
    \ and accept_datetime.\n\nExample\n\n<!-- literal_block {\"ids\": [], \"classes\"\
    : [], \"names\": [], \"dupnames\": [], \"backrefs\": [], \"xml:space\": \"preserve\"\
    , \"force\": false, \"language\": \"python\", \"highlight_args\": {}, \"linenos\"\
    : false} -->\n\n````python\n\n   # List feature flags\n   feature_flags = client.list_feature_flags()\n\
    \   for flag in feature_flags:\n       print(flag.name, flag.enabled)\n\n   #\
    \ Detect changes across pages using etags\n   feature_flags = client.list_feature_flags(name_filter=\"\
    sample_*\")\n   match_conditions = [page.etag for page in feature_flags.by_page()]\n\
    \n   feature_flags = client.list_feature_flags(name_filter=\"sample_*\")\n   for\
    \ page in feature_flags.by_page(match_conditions=match_conditions):\n       #\
    \ Only pages that changed are returned\n       for flag in page:\n           print(flag.name,\
    \ flag.enabled)\n   ````"
  signature: 'list_feature_flags(*, name_filter: str | None = None, label_filter:
    str | None = None, tags_filter: List[str] | None = None, accept_datetime: datetime
    | str | None = None, fields: List[str | FeatureFlagFields] | None = None, **kwargs:
    Any) -> FeatureFlagPaged'
  keywordOnlyParameters:
  - name: name_filter
    description: 'Filter results based on their feature flag names. ''*'' can be used
      as wildcard at the end

      of the filter. Default is *None*.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: label_filter
    description: Filter results based on their labels. Default is *None*.
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: tags_filter
    description: Filter results based on their tags. Default is *None*.
    defaultValue: None
    types:
    - <xref:list>[<xref:str>]
    - <xref:None>
  - name: accept_datetime
    description: Retrieve FeatureFlag that existed at this datetime
    defaultValue: None
    types:
    - <xref:datetime.datetime>
    - <xref:str>
    - <xref:None>
  - name: fields
    description: Specify which fields to include in the results. If not specified,
      will include all fields.
    defaultValue: None
    types:
    - <xref:list>[<xref:str>]
    - <xref:list>[<xref:azure.appconfiguration.FeatureFlagFields>]
    - <xref:None>
  return:
