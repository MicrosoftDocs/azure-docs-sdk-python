    : false} -->\n\n````python\n\n   feature_flag = await async_client.get_feature_flag(name=\"\
    MyFeatureFlag\")\n   ````"
  signature: 'async get_feature_flag(name: str, label: str | None = None, etag: str
    | None = ''*'', match_condition: MatchConditions = MatchConditions.Unconditionally,
    *, accept_datetime: datetime | str | None = None, **kwargs: Any) -> FeatureFlag
    | None'
