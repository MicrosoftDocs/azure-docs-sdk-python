### YamlMime:PythonClass
uid: azure.appconfiguration.ConfigurationSettingPaged
name: ConfigurationSettingPaged
fullName: azure.appconfiguration.ConfigurationSettingPaged
module: azure.appconfiguration
summary: "An iterable of ConfigurationSettings that supports etag-based change detection.\n\
  \nThis class extends ItemPaged to provide efficient monitoring of configuration\
  \ changes\nby using ETags. When used with the *match_conditions* parameter in *by_page()*,\n\
  it only returns pages that have changed since the provided ETags were collected.\n\
  \nExample:\n\n<!-- literal_block {\"ids\": [], \"classes\": [], \"names\": [], \"\
  dupnames\": [], \"backrefs\": [], \"xml:space\": \"preserve\", \"force\": false,\
  \ \"language\": \"python\", \"highlight_args\": {}, \"linenos\": false} -->\n\n\
  ````python\n\n   # Get initial page ETags\n   items = client.list_configuration_settings(key_filter=\"\
  sample_*\")\n   match_conditions = [page.etag for page in items.by_page()]\n\n \
  \  # Later, check for changes - only changed pages are returned\n   items = client.list_configuration_settings(key_filter=\"\
  sample_*\")\n   for page in items.by_page(match_conditions=match_conditions):\n\
  \       # Process only changed pages\n       pass\n   ````\n\nReturn an iterator\
  \ of items.\n\nargs and kwargs will be passed to the PageIterator constructor directly,\n\
  except page_iterator_class"
constructor:
  syntax: 'ConfigurationSettingPaged(*args: Any, **kwargs: Any)'
methods:
- uid: azure.appconfiguration.ConfigurationSettingPaged.by_page
  name: by_page
  summary: Get an iterator of pages of objects, instead of an iterator of objects.
  signature: 'by_page(continuation_token: str | None = None, *, match_conditions:
    List[str] | None = None) -> Any'
  parameters:
  - name: continuation_token
    description: 'An opaque continuation token. This value can be retrieved from the

      continuation_token field of a previous generator object. If specified,

      this generator will begin returning results from this point.'
    defaultValue: None
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: match_conditions
    description: 'A list of etags to check for changes. If provided, the iterator
      will

      check each page against the corresponding etag and only return pages that have
      changed.'
    defaultValue: None
    types:
    - <xref:list>[<xref:str>]
    - <xref:None>
  return:
    description: An iterator of pages (themselves iterator of objects)
    types:
    - <xref:iterator>[<xref:iterator>[<xref:ReturnType>]]
- uid: azure.appconfiguration.ConfigurationSettingPaged.next
  name: next
  summary: Get the next item in the iterator.
  signature: next() -> ReturnType
  return:
    description: The next item in the iterator.
    types:
    - <xref:ReturnType>
  exceptions:
  - type: StopIteration
    description: If there are no more items to return.
