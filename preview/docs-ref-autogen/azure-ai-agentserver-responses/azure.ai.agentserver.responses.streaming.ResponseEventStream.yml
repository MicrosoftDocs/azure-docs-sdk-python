- uid: azure.ai.agentserver.responses.streaming.ResponseEventStream.internal_metadata
  name: internal_metadata
  summary: 'Live, mutable response-level framework-internal metadata.


    A convenience proxy backed by a reserved `_internal_metadata` key

    inside the response''s public `metadata` map. The private bag is

    JSON-encoded into the string-valued metadata slot required by Foundry

    storage. Read / write / delete in place

    (`stream.internal_metadata["phase"] = 3`). Stripped from every

    client-facing payload and persisted at the next

    `yield stream.checkpoint()` (and at terminal).'
  return:
    types:
    - <xref:collections.abc.MutableMapping>[<xref:str>, <xref:typing.Any>]
- uid: azure.ai.agentserver.responses.streaming.ResponseEventStream.response
  name: response
  summary: Return the current response envelope.
  return:
    description: The mutable response envelope being built by this stream.
    types:
    - <xref:azure.ai.agentserver.responses.models.ResponseObject>
