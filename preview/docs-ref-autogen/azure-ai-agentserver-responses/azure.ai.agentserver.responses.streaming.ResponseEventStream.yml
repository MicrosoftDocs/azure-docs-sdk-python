- uid: azure.ai.agentserver.responses.streaming.ResponseEventStream.checkpoint
  name: checkpoint
  summary: "Return a checkpoint event to `yield` for persistence.\n\nUsage (inside\
    \ a resilient background response handler):\n\n<!-- literal_block {\"ids\": [],\
    \ \"classes\": [], \"names\": [], \"dupnames\": [], \"backrefs\": [], \"xml:space\"\
    : \"preserve\", \"language\": \"default\", \"force\": false, \"linenos\": false}\
    \ -->\n\n````default\n\n   yield stream.checkpoint()\n   ````\n\nYielding the\
    \ event persists the current `stream.response`\nsnapshot via the storage provider.\
    \ It is processed by the orchestrator\nand is NOT forwarded to the SSE wire (internal\
    \ control signal).\n\nSemantics (enforced by the orchestrator):\n\n* **Deterministic\
    \ + developer-driven** \u2014 only where the handler yields one; there are no\
    \ periodic / implicit checkpoints. \n\n* **Backpressure** \u2014 because the orchestrator\
    \ fully processes the event (awaiting the provider write) before requesting the\
    \ next event, the handler is suspended at the yield until the persist completes.\
    \ \n\n* **Resilient background only** \u2014 persists only when the deployment\
    \ has `resilient_background=True` and the request is `background=True` (\u21D2\
    \ `store=True`); a no-op otherwise. \n\n* **Idempotent** \u2014 a snapshot byte-identical\
    \ to the last persisted one is skipped. \n\n* **Failures swallowed** \u2014 provider\
    \ errors are logged, never raised into the handler; recovery falls back to the\
    \ previously-persisted snapshot. \n\n* **After terminal** \u2014 a checkpoint\
    \ yielded after a terminal event is dropped. \n\nPersists the response with whatever\
    \ `status` it currently has \u2014 the\ncheckpoint never overrides it."
  signature: checkpoint() -> ResponseCheckpointEvent
  return:
    description: The checkpoint event to yield.
    types:
    - <xref:azure.ai.agentserver.responses.streaming._checkpoint.ResponseCheckpointEvent>
