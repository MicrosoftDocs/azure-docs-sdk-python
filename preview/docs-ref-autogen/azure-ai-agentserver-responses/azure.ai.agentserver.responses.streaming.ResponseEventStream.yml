uid: azure.ai.agentserver.responses.streaming.ResponseEventStream
name: ResponseEventStream
fullName: azure.ai.agentserver.responses.streaming.ResponseEventStream
module: azure.ai.agentserver.responses.streaming
summary: 'Response event stream with deterministic sequence numbers.


  Initialize a new response event stream.'
constructor:
  syntax: 'ResponseEventStream(*, response_id: str | None = None, agent_reference:
    AgentReference | dict[str, Any] | None = None, model: str | None = None, request:
    CreateResponse | None = None, response: ResponseObject | None = None)'
  parameters:
  - name: response_id
    description: Unique identifier for the response. Inferred from *response* if omitted.
    isRequired: true
    types:
    - <xref:str> | <xref:None>
  - name: agent_reference
    description: Optional agent reference model.
    isRequired: true
    types:
    - <xref:azure.ai.agentserver.responses.models.AgentReference> | <xref:None>
  - name: model
    description: Optional model identifier to stamp on the response.
    isRequired: true
    types:
    - <xref:str> | <xref:None>
  - name: request
    description: Optional create-response request to seed the response envelope from.
    isRequired: true
    types:
    - <xref:azure.ai.agentserver.responses.models.CreateResponse> | <xref:None>
  - name: response
    description: Optional pre-existing response envelope to build upon.
    isRequired: true
    types:
    - <xref:azure.ai.agentserver.responses.models.ResponseObject> | <xref:None>
  keywordOnlyParameters:
  - name: response_id
    defaultValue: None
  - name: agent_reference
    defaultValue: None
  - name: model
    defaultValue: None
  - name: request
    defaultValue: None
  - name: response
    defaultValue: None
