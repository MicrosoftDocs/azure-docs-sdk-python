- uid: azure.ai.agentserver.responses.ResponsesAgentServerHost.register_pre_shutdown_callback
  name: register_pre_shutdown_callback
  summary: "Register a synchronous callback to run on SIGTERM signal receipt.\n\n\
    Callbacks run from inside the SIGTERM signal handler,\nBEFORE Hypercorn begins\
    \ its graceful drain. Use this to\nset asyncio events that long-running request\
    \ handlers observe via\ntheir cancellation-polling loops, so they can return before\n\
    Hypercorn waits the full `graceful_shutdown_timeout` for the\nrequest to complete.\n\
    \nCallbacks MUST be non-blocking and signal-safe \u2014 they execute\nsynchronously\
    \ on the main thread inside the signal handler. The\ntypical pattern is:\n\n<!--\
    \ literal_block {\"ids\": [], \"classes\": [], \"names\": [], \"dupnames\": [],\
    \ \"backrefs\": [], \"xml:space\": \"preserve\", \"language\": \"default\", \"\
    force\": false, \"linenos\": false} -->\n\n````default\n\n   shutdown_event =\
    \ asyncio.Event()\n   app.register_pre_shutdown_callback(shutdown_event.set)\n\
    \   ````\n\nNote: `asyncio.Event.set()` is safe to call from a signal\nhandler\
    \ when the event loop is running on the same thread."
  signature: 'register_pre_shutdown_callback(fn: Callable[[], None]) -> None'
  parameters:
  - name: fn
    description: A synchronous, non-blocking callable.
    isRequired: true
    types:
    - <xref:typing.Callable>[[], <xref:None>]
- uid: azure.ai.agentserver.responses.ResponsesAgentServerHost.register_server_version
  name: register_server_version
  summary: "Register a version segment for the `x-platform-server` header.\n\nProtocol\
    \ packages (e.g. responses, invocations) call this in their\n`__init__` to add\
    \ their own portion.  Handler developers can also\ncall it to append a custom\
    \ version string.  Duplicates are ignored.\n\nUse <xref:azure.ai.agentserver.core.build_server_version>\
    \ to\nbuild a standard segment:\n\n<!-- literal_block {\"ids\": [], \"classes\"\
    : [], \"names\": [], \"dupnames\": [], \"backrefs\": [], \"xml:space\": \"preserve\"\
    , \"language\": \"default\", \"force\": false, \"linenos\": false} -->\n\n````default\n\
    \n   from azure.ai.agentserver.core import build_server_version\n\n   app.register_server_version(\n\
    \       build_server_version(\"my-library\", \"2.0.0\")\n   )\n   ````"
  signature: 'register_server_version(version_segment: str) -> None'
  parameters:
  - name: version_segment
    description: The version string to register.
    isRequired: true
    types:
    - <xref:str>
  exceptions:
  - type: ValueError
    description: If *version_segment* is empty or whitespace-only.
- uid: azure.ai.agentserver.responses.ResponsesAgentServerHost.request_shutdown
  name: request_shutdown
  summary: 'Signal that shutdown is imminent.


    Sets the internal shutdown flag immediately so that in-flight

    foreground requests observe the cancellation signal without waiting

    for the ASGI lifespan shutdown phase (which only fires after all

    requests drain).


    Call this from a process signal handler (SIGTERM) or before

    triggering the ASGI server''s shutdown to avoid deadlocking

    foreground handlers that await the cancellation signal.'
  signature: request_shutdown() -> None
- uid: azure.ai.agentserver.responses.ResponsesAgentServerHost.response_acceptor
  name: response_acceptor
  summary: "Register a function as the acceptance hook for steerable conversations.\n\
    \nThe acceptance hook is called when a new turn is queued on an\nalready-active\
    \ steerable conversation. It returns the typed\n`ResponseObject` (`status=\"queued\"\
    `) surfaced to the HTTP caller.\n\nUsage:\n\n<!-- literal_block {\"ids\": [],\
    \ \"classes\": [], \"names\": [], \"dupnames\": [], \"backrefs\": [], \"xml:space\"\
    : \"preserve\", \"language\": \"default\", \"force\": false, \"linenos\": false}\
    \ -->\n\n````default\n\n   from azure.ai.agentserver.responses import (\n    \
    \   CreateResponse, ResponseContext, ResponseObject,\n   )\n\n   @app.response_acceptor\n\
    \   def my_acceptor(\n       request: CreateResponse, context: ResponseContext\n\
    \   ) -> ResponseObject:\n       return ResponseObject(\n           {\n      \
    \         \"id\": context.response_id,\n               \"object\": \"response\"\
    ,\n               \"status\": \"queued\",\n           }\n       )\n   ````"
  signature: 'response_acceptor(fn: Any) -> Any'
  parameters:
  - name: fn
    description: 'A callable accepting `(request, context)` and returning a

      <xref:azure.ai.agentserver.responses.models.ResponseObject>.'
    isRequired: true
    types:
    - <xref:typing.Callable>
  return:
    description: The original function (unmodified).
    types:
    - <xref:typing.Callable>
- uid: azure.ai.agentserver.responses.ResponsesAgentServerHost.response_handler
  name: response_handler
  summary: "Register a function as the create-response handler.\n\nHandler MUST be\
    \ `async def` and accept exactly three\npositional parameters: `(request, context,\
    \ cancellation_signal)`.\nSync handlers and 2-arg signatures are rejected at decoration\n\
    time with <xref:TypeError>.\n\nCancellation is observed via the `cancellation_signal`\
    \ (an\n<xref:asyncio.Event> set on client cancel, `/cancel` API,\nor steering\
    \ pressure). Server shutdown is a **distinct** signal\nobserved via `context.shutdown`\
    \ \u2014 shutdown does NOT fire the\ncancellation signal; handlers that care about\
    \ both must inspect\neach independently. The cancellation cause is inspected via\n\
    `context.client_cancelled` (explicit cancel or non-bg\ndisconnect) or \u2014 for\
    \ steering pressure \u2014 neither\n`client_cancelled` nor `shutdown.is_set()`\
    \ (the signal\nfires with no cause flag).\n\nUsage:\n\n<!-- literal_block {\"\
    ids\": [], \"classes\": [], \"names\": [], \"dupnames\": [], \"backrefs\": [],\
    \ \"xml:space\": \"preserve\", \"language\": \"default\", \"force\": false, \"\
    linenos\": false} -->\n\n````default\n\n   @app.response_handler\n   async def\
    \ my_handler(request, context, cancellation_signal):\n       while not cancellation_signal.is_set():\n\
    \           if context.shutdown.is_set():\n               return await context.exit_for_recovery()\n\
    \           yield event\n   ````"
