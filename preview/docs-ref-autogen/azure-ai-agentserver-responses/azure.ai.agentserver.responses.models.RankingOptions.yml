name: RankingOptions
fullName: azure.ai.agentserver.responses.models.RankingOptions
module: azure.ai.agentserver.responses.models
summary: RankingOptions.
constructor:
  syntax: RankingOptions()
variables:
- description: 'The ranker to use for the file search. Known values are: "auto" and

    "default-2024-11-15".'
  name: ranker
  types:
  - <xref:RankerVersionType>
- description: 'The score threshold for the file search, a number between 0 and 1.

    Numbers closer to 1 will attempt to return only the most relevant results, but
    may return fewer

    results.'
  name: score_threshold
  types:
  - <xref:float>
- description: 'Weights that control how reciprocal rank fusion balances semantic

    embedding matches versus sparse keyword matches when hybrid search is enabled.'
