uid: azure.ai.agentserver.responses.models.Prompt
name: Prompt
fullName: azure.ai.agentserver.responses.models.Prompt
module: azure.ai.agentserver.responses.models
summary: 'Reference to a prompt template and its variables. Learn more: /docs/guides/text?api-mode=responses#reusable-prompts.'
constructor:
  syntax: Prompt()
variables:
- description: The unique identifier of the prompt template to use. Required.
  name: id
  types:
  - <xref:str>
- name: version
  types:
  - <xref:str>
- name: variables
  types:
  - <xref:<xref:"ResponsePromptVariables">>
methods:
