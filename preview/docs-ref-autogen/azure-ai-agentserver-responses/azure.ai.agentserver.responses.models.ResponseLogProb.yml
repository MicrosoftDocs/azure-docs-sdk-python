name: ResponseLogProb
fullName: azure.ai.agentserver.responses.models.ResponseLogProb
module: azure.ai.agentserver.responses.models
summary: 'A logprob is the logarithmic probability that the model assigns to producing
  a particular token

  at a given position in the sequence. Less-negative (higher) logprob values indicate
  greater

  model confidence in that token choice.'
constructor:
  syntax: ResponseLogProb()
variables:
- description: A possible text token. Required.
  name: token
  types:
  - <xref:str>
- description: The log probability of this token. Required.
  name: logprob
  types:
  - <xref:float>
- description: The log probabilities of up to 20 of the most likely tokens.
  name: top_logprobs
  types:
  - <xref:list>[<xref:"ResponseLogProbTopLogprobs">]
