    description: 'If a non-deleted response with

      the same id already exists.'
- uid: azure.ai.agentserver.responses.FileResponseStore.delete_response
  name: delete_response
  summary: 'Soft-delete a stored response envelope by identifier.


    Writes a deleted marker file so that subsequent

    <xref:azure.ai.agentserver.responses.FileResponseStore.create_response> calls
    with the same id can re-create the

    entry while concurrent reads see a `KeyError`. Mirrors

    <xref:azure.ai.agentserver.responses.InMemoryResponseProvider>.'
  signature: 'async delete_response(response_id: str, *, context: PlatformContext
    | None = None) -> None'
  parameters:
  - name: response_id
    description: The response identifier.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: context
    description: "Platform context (accepted but unused \u2014\nmatches <xref:azure.ai.agentserver.responses.InMemoryResponseProvider>)."
    defaultValue: None
    types:
    - <xref:azure.ai.agentserver.responses.PlatformContext> | <xref:None>
  return:
    types:
    - <xref:None>
  exceptions:
  - type: KeyError
    description: If the response does not exist or has already been deleted.
- uid: azure.ai.agentserver.responses.FileResponseStore.get_history_item_ids
  name: get_history_item_ids
  summary: "Resolve history item ids from previous response and/or conversation.\n\
    \nMirrors <xref:azure.ai.agentserver.responses.InMemoryResponseProvider.get_history_item_ids>:\n\
    \n* When `previous_response_id` is set, contributes that response's `history_item_ids\
    \ + input_item_ids + output_item_ids`. \n\n* When `conversation_id` is set, iterates\
    \ all non-deleted responses in that conversation and contributes their `history_item_ids\
    \ + input_item_ids + output_item_ids`. \n\n* Both may be set; results are concatenated\
    \ in the same order. \n\n* When over `limit`, keeps the most recent N item IDs\
    \ from the resolved chain, preserving chronological order in the returned slice.\
    \ \n\nDeleted responses are skipped (matches the in-memory provider)."
  signature: 'async get_history_item_ids(previous_response_id: str | None, conversation_id:
    str | None, limit: int, *, context: PlatformContext | None = None) -> list[str]'
  parameters:
  - name: previous_response_id
    description: Optional response id to chain history from.
    isRequired: true
    types:
    - <xref:str> | <xref:None>
  - name: conversation_id
    description: Optional conversation id to scope history lookup.
    isRequired: true
    types:
    - <xref:str> | <xref:None>
  - name: limit
    description: Maximum number of item IDs to return (most recent N).
    isRequired: true
    types:
    - <xref:int>
  keywordOnlyParameters:
  - name: context
    description: "Platform context (accepted but unused \u2014\nmatches <xref:azure.ai.agentserver.responses.InMemoryResponseProvider>)."
    defaultValue: None
    types:
    - <xref:azure.ai.agentserver.responses.PlatformContext> | <xref:None>
  return:
    description: List of item IDs from the resolved chain (possibly empty).
    types:
    - <xref:list>[<xref:str>]
