- uid: azure.ai.agentserver.responses.FileResponseStore.update_response
  name: update_response
  summary: "Update a stored response envelope.\n\nOutput items present on the updated\
    \ response are persisted to the\nper-response items directory and the global items\
    \ index so that\n<xref:azure.ai.agentserver.responses.FileResponseStore.get_items>\
    \ can resolve them on subsequent history lookups \u2014\nmatches <xref:azure.ai.agentserver.responses.InMemoryResponseProvider>."
  signature: 'async update_response(response: ResponseObject, *, context: PlatformContext
    | None = None) -> None'
  parameters:
  - name: response
    description: The new response envelope.
    isRequired: true
    types:
    - <xref:azure.ai.agentserver.responses.ResponseObject>
  keywordOnlyParameters:
  - name: context
    description: "Platform context (accepted but unused \u2014\nmatches <xref:azure.ai.agentserver.responses.InMemoryResponseProvider>)."
    defaultValue: None
    types:
    - <xref:azure.ai.agentserver.responses.PlatformContext> | <xref:None>
  return:
    types:
    - <xref:None>
  exceptions:
