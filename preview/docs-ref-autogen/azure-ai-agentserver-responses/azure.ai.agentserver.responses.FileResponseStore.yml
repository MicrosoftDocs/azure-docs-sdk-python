### YamlMime:PythonClass
uid: azure.ai.agentserver.responses.FileResponseStore
name: FileResponseStore
fullName: azure.ai.agentserver.responses.FileResponseStore
module: azure.ai.agentserver.responses
summary: 'File-backed response store provider.


  Implements <xref:azure.ai.agentserver.responses.ResponseProviderProtocol>. Streaming
  concerns are

  handled separately by the process-wide

  `azure.ai.agentserver.core.streaming.streams` registry, configured

  by the responses hosting layer.'
constructor:
  syntax: 'FileResponseStore(storage_dir: str | Path | None = None)'
  parameters:
  - name: storage_dir
    description: "Root directory for the store. Created if it does\nnot exist. Subdirectories\
      \ `responses/`, `items/`, and\n`conversations/` are managed by the store. Defaults\
      \ to\n`resolve_state_subdir(\"responses\")` \u2014 a `responses` directory\n\
      under the shared agent-server state root (`AGENTSERVER_STATE_ROOT`,\nor `~/.agentserver`\
      \ when unset), alongside `tasks` and\n`streams`."
    defaultValue: None
    types:
    - <xref:str> | <xref:pathlib.Path> | <xref:None>
methods:
