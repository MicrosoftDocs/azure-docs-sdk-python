fullName: azure.ai.agentserver.responses.ConversationChainMetadataNamespace
module: azure.ai.agentserver.responses
summary: "Public Protocol describing the shape of `context.conversation_chain_metadata`.\n\
  \nHandlers type-annotate their interactions with the metadata namespace\nusing this\
  \ Protocol. The concrete implementation\n(`_DeveloperMetadataFacade`) is internal\
  \ \u2014 handlers never need to\nknow about it directly.\n\nUse `context.conversation_chain_metadata[\"\
  key\"] = value` for the default\nnamespace, or `context.conversation_chain_metadata(\"\
  my_namespace\")[\"key\"] = value`\nfor a named namespace. Keys (and namespace names)\
  \ starting with `_`\nare rejected \u2014 those are reserved for framework-internal\
  \ layers.\n\nThe Protocol mirrors the standard <xref:MutableMapping> shape (so\n\
  handlers can `iter()`, `len()`, `clear()`, `pop()`, etc.) and\nadds two namespace-specific\
  \ operations:\n\n* `__call__(name)` returns a sibling namespace facade. \n\n* `await\
  \ flush()` forces the underlying resilient write to land before the handler proceeds\
  \ with a side effect."
