### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.IpConfiguration
name: IpConfiguration
fullName: azure.mgmt.servicefabricmanagedclusters.types.IpConfiguration
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Specifies an IP configuration of the network interface.
constructor:
  syntax: IpConfiguration()
variables:
- description: Name of the network interface. Required.
  name: name
  types:
  - <xref:str>
- description: 'Specifies an array of references to backend

    address pools of application gateways. A node type can reference backend address
    pools of

    multiple application gateways. Multiple node types cannot use the same application
    gateway.'
  name: applicationGatewayBackendAddressPools
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'Specifies an array of references to backend address

    pools of load balancers. A node type can reference backend address pools of one
    public and one

    internal load balancer. Multiple node types cannot use the same basic sku load
    balancer.'
  name: loadBalancerBackendAddressPools
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'Specifies an array of references to inbound Nat pools of the

    load balancers. A node type can reference inbound nat pools of one public and
    one internal load

    balancer. Multiple node types cannot use the same basic sku load balancer.'
  name: loadBalancerInboundNatPools
  types:
  - <xref:list>[<xref:"SubResource">]
- description: Specifies the subnet of the network interface.
  name: subnet
  types:
  - <xref:<xref:"SubResource">>
- description: 'Specifies whether the IP configuration''s private IP is IPv4 or

    IPv6. Default is IPv4. Known values are: "IPv4" and "IPv6".'
  name: privateIPAddressVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PrivateIPAddressVersion">]
- description: 'The public IP address configuration of the network

    interface.'
  name: publicIPAddressConfiguration
  types:
  - <xref:<xref:"IpConfigurationPublicIPAddressConfiguration">>
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.IpConfiguration.applicationGatewayBackendAddressPools
  name: applicationGatewayBackendAddressPools
  summary: 'Specifies an array of references to backend address pools of application
    gateways. A node type

    can reference backend address pools of multiple application gateways. Multiple
    node types

    cannot use the same application gateway.'
  signature: 'applicationGatewayBackendAddressPools: list[''SubResource'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.IpConfiguration.loadBalancerBackendAddressPools
  name: loadBalancerBackendAddressPools
  summary: 'Specifies an array of references to backend address pools of load balancers.
    A node type can

    reference backend address pools of one public and one internal load balancer.
    Multiple node

    types cannot use the same basic sku load balancer.'
  signature: 'loadBalancerBackendAddressPools: list[''SubResource'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.IpConfiguration.loadBalancerInboundNatPools
  name: loadBalancerInboundNatPools
  summary: 'Specifies an array of references to inbound Nat pools of the load balancers.
    A node type can

    reference inbound nat pools of one public and one internal load balancer. Multiple
    node types

    cannot use the same basic sku load balancer.'
  signature: 'loadBalancerInboundNatPools: list[''SubResource'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.IpConfiguration.name
  name: name
  summary: Name of the network interface. Required.
  signature: 'name: Required[str]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.IpConfiguration.privateIPAddressVersion
  name: privateIPAddressVersion
  summary: 'Specifies whether the IP configuration''s private IP is IPv4 or IPv6.
    Default is IPv4. Known

    values are: "IPv4" and "IPv6".'
  signature: 'privateIPAddressVersion: str | PrivateIPAddressVersion'
- uid: azure.mgmt.servicefabricmanagedclusters.types.IpConfiguration.publicIPAddressConfiguration
  name: publicIPAddressConfiguration
  summary: The public IP address configuration of the network interface.
  signature: 'publicIPAddressConfiguration: IpConfigurationPublicIPAddressConfiguration'
- uid: azure.mgmt.servicefabricmanagedclusters.types.IpConfiguration.subnet
  name: subnet
  summary: Specifies the subnet of the network interface.
  signature: 'subnet: SubResource'
