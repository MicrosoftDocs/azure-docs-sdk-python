### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeApplicationHealthPolicy
name: RuntimeApplicationHealthPolicy
fullName: azure.mgmt.servicefabricmanagedclusters.types.RuntimeApplicationHealthPolicy
module: azure.mgmt.servicefabricmanagedclusters.types
summary: 'Cluster level definition for a health policy used to evaluate the health
  of an application or

  one of its children entities.'
constructor:
  syntax: RuntimeApplicationHealthPolicy()
variables:
- description: 'Indicates whether warnings are treated with the same severity as

    errors. Required.'
  name: considerWarningAsError
  types:
  - <xref:bool>
- description: 'The maximum allowed percentage of unhealthy

    deployed applications. Allowed values are Byte values from zero to 100. The percentage

    represents the maximum tolerated percentage of deployed applications that can
    be unhealthy

    before the application is considered in error. This is calculated by dividing
    the number of

    unhealthy deployed applications over the number of nodes where the application
    is currently

    deployed on in the cluster. The computation rounds up to tolerate one failure
    on small numbers

    of nodes. Default percentage is zero. Required.'
  name: maxPercentUnhealthyDeployedApplications
  types:
  - <xref:int>
- description: 'The health policy used by default to evaluate the health

    of a service type.'
  name: defaultServiceTypeHealthPolicy
  types:
  - <xref:<xref:"RuntimeServiceTypeHealthPolicy">>
- description: 'The map with service type health policy per service type

    name. The map is empty by default.'
  name: serviceTypeHealthPolicyMap
  types:
  - <xref:dict>[<xref:str>, <xref:"RuntimeServiceTypeHealthPolicy">]
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeApplicationHealthPolicy.considerWarningAsError
  name: considerWarningAsError
  summary: Indicates whether warnings are treated with the same severity as errors.
    Required.
  signature: 'considerWarningAsError: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeApplicationHealthPolicy.defaultServiceTypeHealthPolicy
  name: defaultServiceTypeHealthPolicy
  summary: The health policy used by default to evaluate the health of a service type.
  signature: 'defaultServiceTypeHealthPolicy: RuntimeServiceTypeHealthPolicy'
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeApplicationHealthPolicy.maxPercentUnhealthyDeployedApplications
  name: maxPercentUnhealthyDeployedApplications
  summary: 'The maximum allowed percentage of unhealthy deployed applications. Allowed
    values are Byte

    values from zero to 100. The percentage represents the maximum tolerated percentage
    of deployed

    applications that can be unhealthy before the application is considered in error.
    This is

    calculated by dividing the number of unhealthy deployed applications over the
    number of nodes

    where the application is currently deployed on in the cluster. The computation
    rounds up to

    tolerate one failure on small numbers of nodes. Default percentage is zero. Required.'
  signature: 'maxPercentUnhealthyDeployedApplications: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeApplicationHealthPolicy.serviceTypeHealthPolicyMap
  name: serviceTypeHealthPolicyMap
  summary: The map with service type health policy per service type name. The map
    is empty by default.
  signature: 'serviceTypeHealthPolicyMap: dict[str, azure.mgmt.servicefabricmanagedclusters.types.RuntimeServiceTypeHealthPolicy]'
