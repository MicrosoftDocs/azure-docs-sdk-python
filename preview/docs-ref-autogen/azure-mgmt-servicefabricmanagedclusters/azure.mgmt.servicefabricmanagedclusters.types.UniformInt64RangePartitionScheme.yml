### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.UniformInt64RangePartitionScheme
name: UniformInt64RangePartitionScheme
fullName: azure.mgmt.servicefabricmanagedclusters.types.UniformInt64RangePartitionScheme
module: azure.mgmt.servicefabricmanagedclusters.types
summary: 'Describes a partitioning scheme where an integer range is allocated evenly
  across a number of

  partitions.'
constructor:
  syntax: UniformInt64RangePartitionScheme()
variables:
- description: The number of partitions. Required.
  name: count
  types:
  - <xref:int>
- description: 'The lower bound of the partition key range that should be split between
    the

    partition ''Count''. Required.'
  name: lowKey
  types:
  - <xref:int>
- description: 'The upper bound of the partition key range that should be split between
    the

    partition ''Count''. Required.'
  name: highKey
  types:
  - <xref:int>
- description: 'Specifies how the service is partitioned. Required. Indicates that
    the

    partition is based on Int64 key ranges, and is a UniformInt64RangePartitionScheme
    object. The

    value is 1.'
  name: partitionScheme
  types:
  - <xref:typing.Literal>[PartitionScheme.UNIFORM_INT64_RANGE]
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.UniformInt64RangePartitionScheme.count
  name: count
  summary: The number of partitions. Required.
  signature: 'count: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.UniformInt64RangePartitionScheme.highKey
  name: highKey
  summary: 'The upper bound of the partition key range that should be split between
    the partition ''Count''.

    Required.'
  signature: 'highKey: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.UniformInt64RangePartitionScheme.lowKey
  name: lowKey
  summary: 'The lower bound of the partition key range that should be split between
    the partition ''Count''.

    Required.'
  signature: 'lowKey: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.UniformInt64RangePartitionScheme.partitionScheme
  name: partitionScheme
  summary: 'Specifies how the service is partitioned. Required. Indicates that the
    partition is based on

    Int64 key ranges, and is a UniformInt64RangePartitionScheme object. The value
    is 1.'
  signature: 'partitionScheme: UNIFORM_INT64_RANGE: ''UniformInt64Range''>]'
