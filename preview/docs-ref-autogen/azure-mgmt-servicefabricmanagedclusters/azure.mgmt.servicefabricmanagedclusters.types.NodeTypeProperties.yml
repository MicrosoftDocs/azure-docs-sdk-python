### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties
name: NodeTypeProperties
fullName: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties
module: azure.mgmt.servicefabricmanagedclusters.types
summary: 'Describes a node type in the cluster, each node type represents sub set
  of nodes in the

  cluster.'
constructor:
  syntax: NodeTypeProperties()
variables:
- description: 'Indicates the Service Fabric system services for the cluster will
    run on this

    node type. This setting cannot be changed once the node type is created. Required.'
  name: isPrimary
  types:
  - <xref:bool>
- description: 'The number of nodes in the node type. **Values:** -1 - Use when auto

    scale rules are configured or sku.capacity is defined 0 - Not supported >0 - Use
    for manual

    scale. Required.'
  name: vmInstanceCount
  types:
  - <xref:int>
- description: 'Disk size for the managed disk attached to the vms on the node type
    in

    GBs.'
  name: dataDiskSizeGB
  types:
  - <xref:int>
- description: 'Managed data disk type. Specifies the storage account type for the
    managed

    disk. Known values are: "Standard_LRS", "StandardSSD_LRS", "Premium_LRS", "PremiumV2_LRS",

    "StandardSSD_ZRS", and "Premium_ZRS".'
  name: dataDiskType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskType">]
- description: 'Managed data disk letter. It can not use the reserved letter C or
    D and

    it can not change after created.'
  name: dataDiskLetter
  types:
  - <xref:str>
- description: 'The placement tags applied to nodes in the node type, which can be

    used to indicate where certain services (workload) should run.'
  name: placementProperties
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'The capacity tags applied to the nodes in the node type, the cluster
    resource

    manager uses these tags to understand how much resource a node has.'
  name: capacities
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'The range of ports from which cluster assigned port to Service Fabric

    applications.'
  name: applicationPorts
  types:
  - <xref:<xref:"EndpointRangeDescription">>
- description: 'The range of ephemeral ports that nodes in this node type should be

    configured with.'
  name: ephemeralPorts
  types:
  - <xref:<xref:"EndpointRangeDescription">>
- description: 'The size of virtual machines in the pool. All virtual machines in
    a pool are the

    same size. For example, Standard_D3.'
  name: vmSize
  types:
  - <xref:str>
- description: 'The publisher of the Azure Virtual Machines Marketplace image. For

    example, Canonical or MicrosoftWindowsServer.'
  name: vmImagePublisher
  types:
  - <xref:str>
- description: 'The offer type of the Azure Virtual Machines Marketplace image. For

    example, UbuntuServer or WindowsServer.'
  name: vmImageOffer
  types:
  - <xref:str>
- description: 'The SKU of the Azure Virtual Machines Marketplace image. For example,

    14.04.0-LTS or 2012-R2-Datacenter.'
  name: vmImageSku
  types:
  - <xref:str>
- description: 'The version of the Azure Virtual Machines Marketplace image. A value
    of

    ''latest'' can be specified to select the latest version of an image. If omitted,
    the default is

    ''latest''.'
  name: vmImageVersion
  types:
  - <xref:str>
- description: The secrets to install in the virtual machines.
  name: vmSecrets
  types:
  - <xref:list>[<xref:"VaultSecretGroup">]
- description: Set of extensions that should be installed onto the virtual machines.
  name: vmExtensions
  types:
  - <xref:list>[<xref:"VMSSExtension">]
- description: 'Identities to assign to the virtual machine scale set under the node

    type.'
  name: vmManagedIdentity
  types:
  - <xref:<xref:"VmManagedIdentity">>
- description: Indicates if the node type can only host Stateless workloads.
  name: isStateless
  types:
  - <xref:bool>
- description: 'Indicates if scale set associated with the node type can be

    composed of multiple placement groups.'
  name: multiplePlacementGroups
  types:
  - <xref:bool>
- description: 'Indicates the node type uses its own frontend configurations

    instead of the default one for the cluster. This setting can only be specified
    for non-primary

    node types and can not be added or removed after the node type is created.'
  name: frontendConfigurations
  types:
  - <xref:list>[<xref:"FrontendConfiguration">]
- description: 'The Network Security Rules for this node type. This setting can

    only be specified for node types that are configured with frontend configurations.'
  name: networkSecurityRules
  types:
  - <xref:list>[<xref:"NetworkSecurityRule">]
- description: Additional managed data disks.
  name: additionalDataDisks
  types:
  - <xref:list>[<xref:"VmssDataDisk">]
- description: 'Enable or disable the Host Encryption for the virtual machines on

    the node type. This will enable the encryption for all the disks including Resource/Temp
    disk

    at host itself. Default: The Encryption at host will be disabled unless this property
    is set to

    true for the resource.'
  name: enableEncryptionAtHost
  types:
  - <xref:bool>
- description: 'The provisioning state of the node type resource. Known values are:

    "None", "Creating", "Created", "Updating", "Succeeded", "Failed", "Canceled",
    "Deleting",

    "Deleted", and "Other".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ManagedResourceProvisioningState">]
- description: 'Specifies whether the network interface is accelerated

    networking-enabled.'
  name: enableAcceleratedNetworking
  types:
  - <xref:bool>
- description: 'Specifies whether the use public load balancer. If not

    specified and the node type doesn''t have its own frontend configuration, it will
    be attached to

    the default load balancer. If the node type uses its own Load balancer and

    useDefaultPublicLoadBalancer is true, then the frontend has to be an Internal
    Load Balancer. If

    the node type uses its own Load balancer and useDefaultPublicLoadBalancer is false
    or not set,

    then the custom load balancer must include a public load balancer to provide outbound

    connectivity.'
  name: useDefaultPublicLoadBalancer
  types:
  - <xref:bool>
- description: 'Specifies whether to use the temporary disk for the service fabric
    data

    root, in which case no managed data disk will be attached and the temporary disk
    will be used.

    It is only allowed for stateless node types.'
  name: useTempDataDisk
  types:
  - <xref:bool>
- description: 'Specifies whether the node type should be overprovisioned. It is

    only allowed for stateless node types.'
  name: enableOverProvisioning
  types:
  - <xref:bool>
- description: 'Specifies the availability zones where the node type would span across.
    If the

    cluster is not spanning across availability zones, initiates az migration for
    the cluster.'
  name: zones
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates whether the node type will be Spot Virtual Machines. Azure
    will

    allocate the VMs if there is capacity available and the VMs can be evicted at
    any time.'
  name: isSpotVM
  types:
  - <xref:bool>
- description: 'Specifies the full host group resource Id. This property is used for

    deploying on azure dedicated hosts.'
  name: hostGroupId
  types:
  - <xref:str>
- description: 'Indicates whether to use ephemeral os disk. The sku selected on the

    vmSize property needs to support this feature.'
  name: useEphemeralOSDisk
  types:
  - <xref:bool>
- description: 'Indicates the time duration after which the platform will not try
    to

    restore the VMSS SPOT instances specified as ISO 8601.'
  name: spotRestoreTimeout
  types:
  - <xref:str>
- description: 'Specifies the eviction policy for virtual machines in a SPOT node
    type.

    Default is Delete. Known values are: "Delete" and "Deallocate".'
  name: evictionPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EvictionPolicyType">]
- description: 'Indicates the resource id of the vm image. This parameter is used
    for

    custom vm image.'
  name: vmImageResourceId
  types:
  - <xref:str>
- description: Indicates the resource id of the subnet for the node type.
  name: subnetId
  types:
  - <xref:str>
- description: 'Specifies the actions to be performed on the vms before bootstrapping
    the

    service fabric runtime.'
  name: vmSetupActions
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"VmSetupAction">]]
- description: 'Specifies the security type of the nodeType. Supported values include

    Standard, TrustedLaunch and ConfidentialVM. Known values are: "TrustedLaunch",
    "Standard", and

    "ConfidentialVM".'
  name: securityType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityType">]
- description: 'Specifies the EncryptionType of the managed disk. It is set to

    DiskWithVMGuestState for encryption of the managed disk along with VMGuestState
    blob and

    VMGuestStateOnly for encryption of just the VMGuestState blob. Note: It can be
    set for only

    Confidential VMs. Known values are: "DiskWithVMGuestState" and "VMGuestStateOnly".'
  name: securityEncryptionType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityEncryptionType">]
- description: 'Specifies whether secure boot should be enabled on the nodeType. Can

    only be used with TrustedLaunch and ConfidentialVM SecurityType.'
  name: secureBootEnabled
  types:
  - <xref:bool>
- description: 'Specifies whether each node is allocated its own public IPv4 address.

    This is only supported on secondary node types with custom Load Balancers.'
  name: enableNodePublicIP
  types:
  - <xref:bool>
- description: 'Specifies whether each node is allocated its own public IPv6

    address. This is only supported on secondary node types with custom Load Balancers.'
  name: enableNodePublicIPv6
  types:
  - <xref:bool>
- description: 'Indicates the resource id of the vm shared galleries image. This

    parameter is used for custom vm image.'
  name: vmSharedGalleryImageId
  types:
  - <xref:str>
- description: 'Specifies the resource id of a NAT Gateway to attach to the subnet
    of this

    node type. Node type must use custom load balancer.'
  name: natGatewayId
  types:
  - <xref:str>
- description: 'Specifies the NAT configuration on default public Load Balancer for

    the node type. This is only supported for node types use the default public Load
    Balancer.'
  name: natConfigurations
  types:
  - <xref:list>[<xref:"NodeTypeNatConfig">]
- description: 'Specifies information about the marketplace image used to create the
    virtual

    machine. This element is only used for marketplace images. Before you can use
    a marketplace

    image from an API, you must enable the image for programmatic use. In the Azure
    portal, find

    the marketplace image that you want to use and then click Want to deploy programmatically,
    Get

    Started ->. Enter any required information and then click Save.'
  name: vmImagePlan
  types:
  - <xref:<xref:"VmImagePlan">>
- description: 'Specifies the service artifact reference id used to set same

    image version for all virtual machines in the scale set when using ''latest''
    image version.'
  name: serviceArtifactReferenceId
  types:
  - <xref:str>
- description: 'Specifies the resource id of the DSCP configuration to apply to the

    node type network interface.'
  name: dscpConfigurationId
  types:
  - <xref:str>
- description: 'Specifies the settings for any additional

    secondary network interfaces to attach to the node type.'
  name: additionalNetworkInterfaceConfigurations
  types:
  - <xref:list>[<xref:"AdditionalNetworkInterfaceConfiguration">]
- description: 'Specifies the computer name prefix. Limited to 9 characters. If

    specified, allows for a longer name to be specified for the node type name.'
  name: computerNamePrefix
  types:
  - <xref:str>
- description: 'Specifies the gallery applications that should be made available to
    the

    underlying VMSS.'
  name: vmApplications
  types:
  - <xref:list>[<xref:"VmApplication">]
- description: 'Setting this to true allows stateless node types to scale out without
    equal

    distribution across zones.'
  name: zoneBalance
  types:
  - <xref:bool>
- description: 'Specifies the node type should be configured for only outbound traffic

    and not inbound traffic.'
  name: isOutboundOnly
  types:
  - <xref:bool>
- description: 'Specifies whether the node type should use a resilient

    ephemeral OS disk when using a supported SKU size. A resilient ephemeral OS disk
    provides

    improved reliability for ephemeral OS disks by enabling full caching.'
  name: enableResilientEphemeralOsDisk
  types:
  - <xref:bool>
- description: 'Specifies the scale in policy for the node type, which will be used
    when

    scale in happens on the cluster. If not specified, the default is Default which
    means the

    platform will decide which nodes to remove during scale in.'
  name: scaleInPolicy
  types:
  - <xref:<xref:"ScaleInPolicy">>
- description: Specifies the settings for the proxy agent on the node type.
  name: proxyAgentSettings
  types:
  - <xref:<xref:"ProxyAgentSettings">>
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.additionalDataDisks
  name: additionalDataDisks
  summary: Additional managed data disks.
  signature: 'additionalDataDisks: list[''VmssDataDisk'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.additionalNetworkInterfaceConfigurations
  name: additionalNetworkInterfaceConfigurations
  summary: 'Specifies the settings for any additional secondary network interfaces
    to attach to the node

    type.'
  signature: 'additionalNetworkInterfaceConfigurations: list[''AdditionalNetworkInterfaceConfiguration'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.applicationPorts
  name: applicationPorts
  summary: The range of ports from which cluster assigned port to Service Fabric applications.
  signature: 'applicationPorts: EndpointRangeDescription'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.capacities
  name: capacities
  summary: 'The capacity tags applied to the nodes in the node type, the cluster resource
    manager uses

    these tags to understand how much resource a node has.'
  signature: 'capacities: dict[str, str]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.computerNamePrefix
  name: computerNamePrefix
  summary: 'Specifies the computer name prefix. Limited to 9 characters. If specified,
    allows for a longer

    name to be specified for the node type name.'
  signature: 'computerNamePrefix: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.dataDiskLetter
  name: dataDiskLetter
  summary: 'Managed data disk letter. It can not use the reserved letter C or D and
    it can not change after

    created.'
  signature: 'dataDiskLetter: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.dataDiskSizeGB
  name: dataDiskSizeGB
  summary: Disk size for the managed disk attached to the vms on the node type in
    GBs.
  signature: 'dataDiskSizeGB: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.dataDiskType
  name: dataDiskType
  summary: 'Managed data disk type. Specifies the storage account type for the managed
    disk. Known values

    are: "Standard_LRS", "StandardSSD_LRS", "Premium_LRS", "PremiumV2_LRS",

    "StandardSSD_ZRS", and "Premium_ZRS".'
  signature: 'dataDiskType: str | DiskType'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.dscpConfigurationId
  name: dscpConfigurationId
  summary: 'Specifies the resource id of the DSCP configuration to apply to the node
    type network

    interface.'
  signature: 'dscpConfigurationId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.enableAcceleratedNetworking
  name: enableAcceleratedNetworking
  summary: Specifies whether the network interface is accelerated networking-enabled.
  signature: 'enableAcceleratedNetworking: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.enableEncryptionAtHost
  name: enableEncryptionAtHost
  summary: 'Enable or disable the Host Encryption for the virtual machines on the
    node type. This will

    enable the encryption for all the disks including Resource/Temp disk at host itself.
    Default:

    The Encryption at host will be disabled unless this property is set to true for
    the resource.'
  signature: 'enableEncryptionAtHost: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.enableNodePublicIP
  name: enableNodePublicIP
  summary: 'Specifies whether each node is allocated its own public IPv4 address.
    This is only supported on

    secondary node types with custom Load Balancers.'
  signature: 'enableNodePublicIP: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.enableNodePublicIPv6
  name: enableNodePublicIPv6
  summary: 'Specifies whether each node is allocated its own public IPv6 address.
    This is only supported on

    secondary node types with custom Load Balancers.'
  signature: 'enableNodePublicIPv6: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.enableOverProvisioning
  name: enableOverProvisioning
  summary: 'Specifies whether the node type should be overprovisioned. It is only
    allowed for stateless

    node types.'
  signature: 'enableOverProvisioning: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.enableResilientEphemeralOsDisk
  name: enableResilientEphemeralOsDisk
  summary: 'Specifies whether the node type should use a resilient ephemeral OS disk
    when using a supported

    SKU size. A resilient ephemeral OS disk provides improved reliability for ephemeral
    OS disks by

    enabling full caching.'
  signature: 'enableResilientEphemeralOsDisk: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.ephemeralPorts
  name: ephemeralPorts
  summary: The range of ephemeral ports that nodes in this node type should be configured
    with.
  signature: 'ephemeralPorts: EndpointRangeDescription'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.evictionPolicy
  name: evictionPolicy
  summary: 'Specifies the eviction policy for virtual machines in a SPOT node type.
    Default is Delete.

    Known values are: "Delete" and "Deallocate".'
  signature: 'evictionPolicy: str | EvictionPolicyType'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.frontendConfigurations
  name: frontendConfigurations
  summary: 'Indicates the node type uses its own frontend configurations instead of
    the default one for the

    cluster. This setting can only be specified for non-primary node types and can
    not be added or

    removed after the node type is created.'
  signature: 'frontendConfigurations: list[''FrontendConfiguration'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.hostGroupId
  name: hostGroupId
  summary: 'Specifies the full host group resource Id. This property is used for deploying
    on azure

    dedicated hosts.'
  signature: 'hostGroupId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.isOutboundOnly
  name: isOutboundOnly
  summary: Specifies the node type should be configured for only outbound traffic
    and not inbound traffic.
  signature: 'isOutboundOnly: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.isPrimary
  name: isPrimary
  summary: 'Indicates the Service Fabric system services for the cluster will run
    on this node type. This

    setting cannot be changed once the node type is created. Required.'
  signature: 'isPrimary: Required[bool]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.isSpotVM
  name: isSpotVM
  summary: 'Indicates whether the node type will be Spot Virtual Machines. Azure will
    allocate the VMs if

    there is capacity available and the VMs can be evicted at any time.'
  signature: 'isSpotVM: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.isStateless
  name: isStateless
  summary: Indicates if the node type can only host Stateless workloads.
  signature: 'isStateless: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.multiplePlacementGroups
  name: multiplePlacementGroups
  summary: 'Indicates if scale set associated with the node type can be composed of
    multiple placement

    groups.'
  signature: 'multiplePlacementGroups: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.natConfigurations
  name: natConfigurations
  summary: 'Specifies the NAT configuration on default public Load Balancer for the
    node type. This is only

    supported for node types use the default public Load Balancer.'
  signature: 'natConfigurations: list[''NodeTypeNatConfig'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.natGatewayId
  name: natGatewayId
  summary: 'Specifies the resource id of a NAT Gateway to attach to the subnet of
    this node type. Node type

    must use custom load balancer.'
  signature: 'natGatewayId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.networkSecurityRules
  name: networkSecurityRules
  summary: 'The Network Security Rules for this node type. This setting can only be
    specified for node

    types that are configured with frontend configurations.'
  signature: 'networkSecurityRules: list[''NetworkSecurityRule'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.placementProperties
  name: placementProperties
  summary: 'The placement tags applied to nodes in the node type, which can be used
    to indicate where

    certain services (workload) should run.'
  signature: 'placementProperties: dict[str, str]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.provisioningState
  name: provisioningState
  summary: '"None", "Creating",

    "Created", "Updating", "Succeeded", "Failed", "Canceled", "Deleting", "Deleted",

    and "Other".'
  signature: 'provisioningState: str | ManagedResourceProvisioningState'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.proxyAgentSettings
  name: proxyAgentSettings
  summary: Specifies the settings for the proxy agent on the node type.
  signature: 'proxyAgentSettings: ProxyAgentSettings'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.scaleInPolicy
  name: scaleInPolicy
  summary: 'Specifies the scale in policy for the node type, which will be used when
    scale in happens on

    the cluster. If not specified, the default is Default which means the platform
    will decide

    which nodes to remove during scale in.'
  signature: 'scaleInPolicy: ScaleInPolicy'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.secureBootEnabled
  name: secureBootEnabled
  summary: 'Specifies whether secure boot should be enabled on the nodeType. Can only
    be used with

    TrustedLaunch and ConfidentialVM SecurityType.'
  signature: 'secureBootEnabled: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.securityEncryptionType
  name: securityEncryptionType
  summary: 'Specifies the EncryptionType of the managed disk. It is set to DiskWithVMGuestState
    for

    encryption of the managed disk along with VMGuestState blob and VMGuestStateOnly
    for encryption

    of just the VMGuestState blob. Note: It can be set for only Confidential VMs.
    Known values are:

    "DiskWithVMGuestState" and "VMGuestStateOnly".'
  signature: 'securityEncryptionType: str | SecurityEncryptionType'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.securityType
  name: securityType
  summary: 'Specifies the security type of the nodeType. Supported values include
    Standard, TrustedLaunch

    and ConfidentialVM. Known values are: "TrustedLaunch", "Standard", and "ConfidentialVM".'
  signature: 'securityType: str | SecurityType'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.serviceArtifactReferenceId
  name: serviceArtifactReferenceId
  summary: 'Specifies the service artifact reference id used to set same image version
    for all virtual

    machines in the scale set when using ''latest'' image version.'
  signature: 'serviceArtifactReferenceId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.spotRestoreTimeout
  name: spotRestoreTimeout
  summary: 'Indicates the time duration after which the platform will not try to restore
    the VMSS SPOT

    instances specified as ISO 8601.'
  signature: 'spotRestoreTimeout: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.subnetId
  name: subnetId
  summary: Indicates the resource id of the subnet for the node type.
  signature: 'subnetId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.useDefaultPublicLoadBalancer
  name: useDefaultPublicLoadBalancer
  summary: 'Specifies whether the use public load balancer. If not specified and the
    node type doesn''t have

    its own frontend configuration, it will be attached to the default load balancer.
    If the node

    type uses its own Load balancer and useDefaultPublicLoadBalancer is true, then
    the frontend has

    to be an Internal Load Balancer. If the node type uses its own Load balancer and

    useDefaultPublicLoadBalancer is false or not set, then the custom load balancer
    must include a

    public load balancer to provide outbound connectivity.'
  signature: 'useDefaultPublicLoadBalancer: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.useEphemeralOSDisk
  name: useEphemeralOSDisk
  summary: 'Indicates whether to use ephemeral os disk. The sku selected on the vmSize
    property needs to

    support this feature.'
  signature: 'useEphemeralOSDisk: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.useTempDataDisk
  name: useTempDataDisk
  summary: 'Specifies whether to use the temporary disk for the service fabric data
    root, in which case no

    managed data disk will be attached and the temporary disk will be used. It is
    only allowed for

    stateless node types.'
  signature: 'useTempDataDisk: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmApplications
  name: vmApplications
  summary: Specifies the gallery applications that should be made available to the
    underlying VMSS.
  signature: 'vmApplications: list[''VmApplication'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmExtensions
  name: vmExtensions
  summary: Set of extensions that should be installed onto the virtual machines.
  signature: 'vmExtensions: list[''VMSSExtension'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmImageOffer
  name: vmImageOffer
  summary: 'The offer type of the Azure Virtual Machines Marketplace image. For example,
    UbuntuServer or

    WindowsServer.'
  signature: 'vmImageOffer: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmImagePlan
  name: vmImagePlan
  summary: 'Specifies information about the marketplace image used to create the virtual
    machine. This

    element is only used for marketplace images. Before you can use a marketplace
    image from an

    API, you must enable the image for programmatic use. In the Azure portal, find
    the marketplace

    image that you want to use and then click Want to deploy programmatically, Get
    Started ->.

    Enter any required information and then click Save.'
  signature: 'vmImagePlan: VmImagePlan'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmImagePublisher
  name: vmImagePublisher
  summary: 'The publisher of the Azure Virtual Machines Marketplace image. For example,
    Canonical or

    MicrosoftWindowsServer.'
  signature: 'vmImagePublisher: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmImageResourceId
  name: vmImageResourceId
  summary: Indicates the resource id of the vm image. This parameter is used for custom
    vm image.
  signature: 'vmImageResourceId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmImageSku
  name: vmImageSku
  summary: 'The SKU of the Azure Virtual Machines Marketplace image. For example,
    14.04.0-LTS or

    2012-R2-Datacenter.'
  signature: 'vmImageSku: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmImageVersion
  name: vmImageVersion
  summary: 'The version of the Azure Virtual Machines Marketplace image. A value of
    ''latest'' can be

    specified to select the latest version of an image. If omitted, the default is
    ''latest''.'
  signature: 'vmImageVersion: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmInstanceCount
  name: vmInstanceCount
  summary: '** -1 - Use when auto scale rules are configured

    or sku.capacity is defined 0 - Not supported >0 - Use for manual scale. Required.'
  signature: 'vmInstanceCount: Required[int]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmManagedIdentity
  name: vmManagedIdentity
  summary: Identities to assign to the virtual machine scale set under the node type.
  signature: 'vmManagedIdentity: VmManagedIdentity'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmSecrets
  name: vmSecrets
  summary: The secrets to install in the virtual machines.
  signature: 'vmSecrets: list[''VaultSecretGroup'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmSetupActions
  name: vmSetupActions
  summary: 'Specifies the actions to be performed on the vms before bootstrapping
    the service fabric

    runtime.'
  signature: 'vmSetupActions: list[typing.Union[str, ForwardRef(''VmSetupAction'')]]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmSharedGalleryImageId
  name: vmSharedGalleryImageId
  summary: 'Indicates the resource id of the vm shared galleries image. This parameter
    is used for custom

    vm image.'
  signature: 'vmSharedGalleryImageId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.vmSize
  name: vmSize
  summary: 'The size of virtual machines in the pool. All virtual machines in a pool
    are the same size. For

    example, Standard_D3.'
  signature: 'vmSize: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.zoneBalance
  name: zoneBalance
  summary: 'Setting this to true allows stateless node types to scale out without
    equal distribution across

    zones.'
  signature: 'zoneBalance: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.NodeTypeProperties.zones
  name: zones
  summary: 'Specifies the availability zones where the node type would span across.
    If the cluster is not

    spanning across availability zones, initiates az migration for the cluster.'
  signature: 'zones: list[str]'
