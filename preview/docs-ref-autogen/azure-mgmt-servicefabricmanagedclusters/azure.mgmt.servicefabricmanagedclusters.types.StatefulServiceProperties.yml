### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties
name: StatefulServiceProperties
fullName: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties
module: azure.mgmt.servicefabricmanagedclusters.types
summary: The properties of a stateful service resource.
constructor:
  syntax: StatefulServiceProperties()
variables:
- description: 'The placement constraints as a string. Placement constraints are

    boolean expressions on node properties and allow for restricting a service to
    particular nodes

    based on the service requirements. For example, to place a service on nodes where
    NodeType is

    blue specify the following: "NodeColor == blue)".'
  name: placementConstraints
  types:
  - <xref:str>
- description: 'A list that describes the correlation of the service with other

    services.'
  name: correlationScheme
  types:
  - <xref:list>[<xref:"ServiceCorrelation">]
- description: 'The service load metrics is given as an array of ServiceLoadMetric

    objects.'
  name: serviceLoadMetrics
  types:
  - <xref:list>[<xref:"ServiceLoadMetric">]
- description: 'A list that describes the correlation of the service with other

    services.'
  name: servicePlacementPolicies
  types:
  - <xref:list>[<xref:"ServicePlacementPolicy">]
- description: 'Specifies the move cost for the service. Known values are: "Zero",

    "Low", "Medium", and "High".'
  name: defaultMoveCost
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MoveCost">]
- description: Scaling policies for this service.
  name: scalingPolicies
  types:
  - <xref:list>[<xref:"ScalingPolicy">]
- description: 'The current deployment or provisioning state, which only appears in

    the response.'
  name: provisioningState
  types:
  - <xref:str>
- description: The name of the service type. Required.
  name: serviceTypeName
  types:
  - <xref:str>
- description: Describes how the service is partitioned. Required.
  name: partitionDescription
  types:
  - <xref:<xref:"Partition">>
- description: 'The activation Mode of the service package. Known values

    are: "SharedProcess" and "ExclusiveProcess".'
  name: servicePackageActivationMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServicePackageActivationMode">]
- description: 'Dns name used for the service. If this is specified, then the DNS
    name

    can be used to return the IP addresses of service endpoints for application layer
    protocols

    (e.g., HTTP). When updating serviceDnsName, old name may be temporarily resolvable.
    However,

    rely on new name. When removing serviceDnsName, removed name may temporarily be
    resolvable. Do

    not rely on the name being unresolvable.'
  name: serviceDnsName
  types:
  - <xref:str>
- description: 'A flag indicating whether this is a persistent service which stores

    states on the local disk. If it is then the value of this property is true, if
    not it is false.'
  name: hasPersistedState
  types:
  - <xref:bool>
- description: The target replica set size as a number.
  name: targetReplicaSetSize
  types:
  - <xref:int>
- description: The minimum replica set size as a number.
  name: minReplicaSetSize
  types:
  - <xref:int>
- description: 'The duration between when a replica goes down and when a new

    replica is created, represented in ISO 8601 format "hh:mm:ss".'
  name: replicaRestartWaitDuration
  types:
  - <xref:str>
- description: 'The maximum duration for which a partition is allowed to be in a

    state of quorum loss, represented in ISO 8601 format "hh:mm:ss".'
  name: quorumLossWaitDuration
  types:
  - <xref:str>
- description: 'The definition on how long StandBy replicas should be

    maintained before being removed, represented in ISO 8601 format "hh:mm:ss".'
  name: standByReplicaKeepDuration
  types:
  - <xref:str>
- description: 'The duration for which replicas can stay InBuild before

    reporting that build is stuck, represented in ISO 8601 format "hh:mm:ss".'
  name: servicePlacementTimeLimit
  types:
  - <xref:str>
- description: 'The kind of service (Stateless or Stateful). Required. Uses Service
    Fabric

    to make its state or part of its state highly available and reliable. The value
    is 1.'
  name: serviceKind
  types:
  - <xref:typing.Literal>[ServiceKind.STATEFUL]
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.correlationScheme
  name: correlationScheme
  summary: A list that describes the correlation of the service with other services.
  signature: 'correlationScheme: list[''ServiceCorrelation'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.defaultMoveCost
  name: defaultMoveCost
  summary: '"Zero", "Low", "Medium", and

    "High".'
  signature: 'defaultMoveCost: str | MoveCost'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.hasPersistedState
  name: hasPersistedState
  summary: 'A flag indicating whether this is a persistent service which stores states
    on the local disk.

    If it is then the value of this property is true, if not it is false.'
  signature: 'hasPersistedState: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.minReplicaSetSize
  name: minReplicaSetSize
  summary: The minimum replica set size as a number.
  signature: 'minReplicaSetSize: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.partitionDescription
  name: partitionDescription
  summary: Describes how the service is partitioned. Required.
  signature: 'partitionDescription: Required[Partition]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.placementConstraints
  name: placementConstraints
  summary: 'The placement constraints as a string. Placement constraints are boolean
    expressions on node

    properties and allow for restricting a service to particular nodes based on the
    service

    requirements. For example, to place a service on nodes where NodeType is blue
    specify the

    following: "NodeColor == blue)".'
  signature: 'placementConstraints: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.provisioningState
  name: provisioningState
  summary: The current deployment or provisioning state, which only appears in the
    response.
  signature: 'provisioningState: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.quorumLossWaitDuration
  name: quorumLossWaitDuration
  summary: 'The maximum duration for which a partition is allowed to be in a state
    of quorum loss,

    represented in ISO 8601 format "hh:mm:ss".'
  signature: 'quorumLossWaitDuration: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.replicaRestartWaitDuration
  name: replicaRestartWaitDuration
  summary: 'The duration between when a replica goes down and when a new replica is
    created, represented in

    ISO 8601 format "hh:mm:ss".'
  signature: 'replicaRestartWaitDuration: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.scalingPolicies
  name: scalingPolicies
  summary: Scaling policies for this service.
  signature: 'scalingPolicies: list[''ScalingPolicy'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.serviceDnsName
  name: serviceDnsName
  summary: 'Dns name used for the service. If this is specified, then the DNS name
    can be used to return

    the IP addresses of service endpoints for application layer protocols (e.g., HTTP).
    When

    updating serviceDnsName, old name may be temporarily resolvable. However, rely
    on new name.

    When removing serviceDnsName, removed name may temporarily be resolvable. Do not
    rely on the

    name being unresolvable.'
  signature: 'serviceDnsName: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.serviceKind
  name: serviceKind
  summary: 'The kind of service (Stateless or Stateful). Required. Uses Service Fabric
    to make its state or

    part of its state highly available and reliable. The value is 1.'
  signature: 'serviceKind: STATEFUL: ''Stateful''>]]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.serviceLoadMetrics
  name: serviceLoadMetrics
  summary: The service load metrics is given as an array of ServiceLoadMetric objects.
  signature: 'serviceLoadMetrics: list[''ServiceLoadMetric'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.servicePackageActivationMode
  name: servicePackageActivationMode
  summary: '"SharedProcess" and

    "ExclusiveProcess".'
  signature: 'servicePackageActivationMode: str | ServicePackageActivationMode'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.servicePlacementPolicies
  name: servicePlacementPolicies
  summary: A list that describes the correlation of the service with other services.
  signature: 'servicePlacementPolicies: list[''ServicePlacementPolicy'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.servicePlacementTimeLimit
  name: servicePlacementTimeLimit
  summary: 'The duration for which replicas can stay InBuild before reporting that
    build is stuck,

    represented in ISO 8601 format "hh:mm:ss".'
  signature: 'servicePlacementTimeLimit: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.serviceTypeName
  name: serviceTypeName
  summary: The name of the service type. Required.
  signature: 'serviceTypeName: Required[str]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.standByReplicaKeepDuration
  name: standByReplicaKeepDuration
  summary: 'The definition on how long StandBy replicas should be maintained before
    being removed,

    represented in ISO 8601 format "hh:mm:ss".'
  signature: 'standByReplicaKeepDuration: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.StatefulServiceProperties.targetReplicaSetSize
  name: targetReplicaSetSize
  summary: The target replica set size as a number.
  signature: 'targetReplicaSetSize: int'
