### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.FrontendConfiguration
name: FrontendConfiguration
fullName: azure.mgmt.servicefabricmanagedclusters.types.FrontendConfiguration
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Describes the frontend configurations for the node type.
constructor:
  syntax: FrontendConfiguration()
variables:
- description: 'The IP address type of this frontend configuration. If omitted the
    default

    value is IPv4. Known values are: "IPv4" and "IPv6".'
  name: ipAddressType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IPAddressType">]
- description: 'The resource Id of the Load Balancer backend address

    pool that the VM instances of the node type are associated with. The format of
    the resource Id

    is

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/loadBalancers/{loadBalancerName}/backendAddressPools/{backendAddressPoolName}''.'
  name: loadBalancerBackendAddressPoolId
  types:
  - <xref:str>
- description: 'The resource Id of the Load Balancer inbound NAT pool that

    the VM instances of the node type are associated with. The format of the resource
    Id is

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/loadBalancers/{loadBalancerName}/inboundNatPools/{inboundNatPoolName}''.'
  name: loadBalancerInboundNatPoolId
  types:
  - <xref:str>
- description: 'The resource Id of application gateway backend

    address pool. The format of the resource Id is

    ''/subscriptions/<subscriptionId>/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/applicationGateways/{applicationGatewayName}/backendAddressPools/{backendAddressPoolName}''.'
  name: applicationGatewayBackendAddressPoolId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.FrontendConfiguration.applicationGatewayBackendAddressPoolId
  name: applicationGatewayBackendAddressPoolId
  summary: 'The resource Id of application gateway backend address pool. The format
    of the resource Id is

    ''/subscriptions/<subscriptionId>/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/applicationGateways/{applicationGatewayName}/backendAddressPools/{backendAddressPoolName}''.'
  signature: 'applicationGatewayBackendAddressPoolId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.FrontendConfiguration.ipAddressType
  name: ipAddressType
  summary: 'The IP address type of this frontend configuration. If omitted the default
    value is IPv4. Known

    values are: "IPv4" and "IPv6".'
  signature: 'ipAddressType: str | IPAddressType'
- uid: azure.mgmt.servicefabricmanagedclusters.types.FrontendConfiguration.loadBalancerBackendAddressPoolId
  name: loadBalancerBackendAddressPoolId
  summary: 'The resource Id of the Load Balancer backend address pool that the VM
    instances of the node

    type are associated with. The format of the resource Id is

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/loadBalancers/{loadBalancerName}/backendAddressPools/{backendAddressPoolName}''.'
  signature: 'loadBalancerBackendAddressPoolId: str'
