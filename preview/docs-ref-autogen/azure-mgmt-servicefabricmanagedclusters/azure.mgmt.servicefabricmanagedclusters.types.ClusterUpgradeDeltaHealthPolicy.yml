### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterUpgradeDeltaHealthPolicy
name: ClusterUpgradeDeltaHealthPolicy
fullName: azure.mgmt.servicefabricmanagedclusters.types.ClusterUpgradeDeltaHealthPolicy
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Describes the delta health policies for the cluster upgrade.
constructor:
  syntax: ClusterUpgradeDeltaHealthPolicy()
variables:
- description: 'The maximum allowed percentage of nodes health degradation

    allowed during cluster upgrades. The delta is measured between the state of the
    nodes at the

    beginning of upgrade and the state of the nodes at the time of the health evaluation.
    The check

    is performed after every upgrade domain upgrade completion to make sure the global
    state of the

    cluster is within tolerated limits. Required.'
  name: maxPercentDeltaUnhealthyNodes
  types:
  - <xref:int>
- description: 'The maximum allowed percentage of upgrade

    domain nodes health degradation allowed during cluster upgrades. The delta is
    measured between

    the state of the upgrade domain nodes at the beginning of upgrade and the state
    of the upgrade

    domain nodes at the time of the health evaluation. The check is performed after
    every upgrade

    domain upgrade completion for all completed upgrade domains to make sure the state
    of the

    upgrade domains is within tolerated limits.'
  name: maxPercentUpgradeDomainDeltaUnhealthyNodes
  types:
  - <xref:int>
- description: 'The maximum allowed percentage of applications

    health degradation allowed during cluster upgrades. The delta is measured between
    the state of

    the applications at the beginning of upgrade and the state of the applications
    at the time of

    the health evaluation. The check is performed after every upgrade domain upgrade
    completion to

    make sure the global state of the cluster is within tolerated limits. System services
    are not

    included in this. NOTE: This value will overwrite the value specified in

    properties.UpgradeDescription.HealthPolicy.MaxPercentUnhealthyApplications.'
  name: maxPercentDeltaUnhealthyApplications
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterUpgradeDeltaHealthPolicy.maxPercentDeltaUnhealthyApplications
  name: maxPercentDeltaUnhealthyApplications
  summary: 'The maximum allowed percentage of applications health degradation allowed
    during cluster

    upgrades. The delta is measured between the state of the applications at the beginning
    of

    upgrade and the state of the applications at the time of the health evaluation.
    The check is

    performed after every upgrade domain upgrade completion to make sure the global
    state of the

    cluster is within tolerated limits. System services are not included in this.
    NOTE: This value

    will overwrite the value specified in

    properties.UpgradeDescription.HealthPolicy.MaxPercentUnhealthyApplications.'
  signature: 'maxPercentDeltaUnhealthyApplications: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterUpgradeDeltaHealthPolicy.maxPercentDeltaUnhealthyNodes
  name: maxPercentDeltaUnhealthyNodes
  summary: 'The maximum allowed percentage of nodes health degradation allowed during
    cluster upgrades. The

    delta is measured between the state of the nodes at the beginning of upgrade and
    the state of

    the nodes at the time of the health evaluation. The check is performed after every
    upgrade

    domain upgrade completion to make sure the global state of the cluster is within
    tolerated

    limits. Required.'
  signature: 'maxPercentDeltaUnhealthyNodes: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterUpgradeDeltaHealthPolicy.maxPercentUpgradeDomainDeltaUnhealthyNodes
  name: maxPercentUpgradeDomainDeltaUnhealthyNodes
  summary: 'The maximum allowed percentage of upgrade domain nodes health degradation
    allowed during

    cluster upgrades. The delta is measured between the state of the upgrade domain
    nodes at the

    beginning of upgrade and the state of the upgrade domain nodes at the time of
    the health

    evaluation. The check is performed after every upgrade domain upgrade completion
    for all

    completed upgrade domains to make sure the state of the upgrade domains is within
    tolerated

    limits.'
  signature: 'maxPercentUpgradeDomainDeltaUnhealthyNodes: int'
