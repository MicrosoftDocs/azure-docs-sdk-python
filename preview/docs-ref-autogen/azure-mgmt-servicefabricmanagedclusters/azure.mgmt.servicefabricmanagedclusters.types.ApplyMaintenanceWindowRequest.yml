### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.ApplyMaintenanceWindowRequest
name: ApplyMaintenanceWindowRequest
fullName: azure.mgmt.servicefabricmanagedclusters.types.ApplyMaintenanceWindowRequest
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Describes the request to apply a maintenance window on a Service Fabric Managed
  Cluster.
constructor:
  syntax: ApplyMaintenanceWindowRequest()
variables:
- description: 'Effective start date of the maintenance window in yyyy-MM-dd HH:mm
    format.

    If not provided, defaults to the current time.'
  name: startDateTime
  types:
  - <xref:str>
- description: 'Duration of the maintenance window in hh:mm format. If not provided,
    defaults

    to 5 hours. Example: 08:30 for 8 and a half hours.'
  name: duration
  types:
  - <xref:str>
- description: 'Name of the timezone. List of timezones can be obtained by executing

    [System.TimeZoneInfo]::GetSystemTimeZones() in PowerShell. If not provided, defaults
    to UTC.

    Example: Pacific Standard Time, UTC, W. Europe Standard Time, Korea Standard Time,
    Central

    Australia Standard Time.'
  name: timeZone
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.ApplyMaintenanceWindowRequest.duration
  name: duration
  summary: 'mm format. If not provided, defaults to 5 hours.

    Example: 08:30 for 8 and a half hours.'
  signature: 'duration: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ApplyMaintenanceWindowRequest.startDateTime
  name: startDateTime
  summary: 'mm format. If not provided,

    defaults to the current time.'
  signature: 'startDateTime: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ApplyMaintenanceWindowRequest.timeZone
  name: timeZone
  summary: 'Name of the timezone. List of timezones can be obtained by executing

    [System.TimeZoneInfo]::GetSystemTimeZones() in PowerShell. If not provided, defaults
    to UTC.

    Example: Pacific Standard Time, UTC, W. Europe Standard Time, Korea Standard Time,
    Central

    Australia Standard Time.'
  signature: 'timeZone: str'
