### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.ServiceLoadMetric
name: ServiceLoadMetric
fullName: azure.mgmt.servicefabricmanagedclusters.types.ServiceLoadMetric
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Specifies a metric to load balance a service during runtime.
constructor:
  syntax: ServiceLoadMetric()
variables:
- description: 'The name of the metric. If the service chooses to report load during
    runtime, the

    load metric name should match the name that is specified in Name exactly. Note
    that metric

    names are case sensitive. Required.'
  name: name
  types:
  - <xref:str>
- description: 'The service load metric relative weight, compared to other metrics
    configured for

    this service, as a number. Known values are: "Zero", "Low", "Medium", and "High".'
  name: weight
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServiceLoadMetricWeight">]
- description: 'Used only for Stateful services. The default amount of load, as a

    number, that this service creates for this metric when it is a Primary replica.'
  name: primaryDefaultLoad
  types:
  - <xref:int>
- description: 'Used only for Stateful services. The default amount of load, as a

    number, that this service creates for this metric when it is a Secondary replica.'
  name: secondaryDefaultLoad
  types:
  - <xref:int>
- description: 'Used only for Stateless services. The default amount of load, as a
    number,

    that this service creates for this metric.'
  name: defaultLoad
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.ServiceLoadMetric.defaultLoad
  name: defaultLoad
  summary: 'Used only for Stateless services. The default amount of load, as a number,
    that this service

    creates for this metric.'
  signature: 'defaultLoad: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ServiceLoadMetric.name
  name: name
  summary: 'The name of the metric. If the service chooses to report load during runtime,
    the load metric

    name should match the name that is specified in Name exactly. Note that metric
    names are case

    sensitive. Required.'
  signature: 'name: Required[str]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ServiceLoadMetric.primaryDefaultLoad
  name: primaryDefaultLoad
  summary: 'Used only for Stateful services. The default amount of load, as a number,
    that this service

    creates for this metric when it is a Primary replica.'
  signature: 'primaryDefaultLoad: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ServiceLoadMetric.secondaryDefaultLoad
  name: secondaryDefaultLoad
  summary: 'Used only for Stateful services. The default amount of load, as a number,
    that this service

    creates for this metric when it is a Secondary replica.'
  signature: 'secondaryDefaultLoad: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ServiceLoadMetric.weight
  name: weight
  summary: 'The service load metric relative weight, compared to other metrics configured
    for this service,

    as a number. Known values are: "Zero", "Low", "Medium", and "High".'
  signature: 'weight: str | ServiceLoadMetricWeight'
