  name: sourceAddressPrefix
  summary: 'The CIDR or source IP range. Asterisk ''*'' can also be used to match
    all source IPs. Default

    tags such as ''VirtualNetwork'', ''AzureLoadBalancer'' and ''Internet'' can also
    be used. If this is

    an ingress rule, specifies where network traffic originates from.'
  signature: 'sourceAddressPrefix: str'
