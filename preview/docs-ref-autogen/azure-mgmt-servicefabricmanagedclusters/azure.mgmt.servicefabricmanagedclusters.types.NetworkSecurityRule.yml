### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.NetworkSecurityRule
name: NetworkSecurityRule
fullName: azure.mgmt.servicefabricmanagedclusters.types.NetworkSecurityRule
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Describes a network security rule.
constructor:
  syntax: NetworkSecurityRule()
variables:
- description: Network security rule name. Required.
  name: name
  types:
  - <xref:str>
- description: Network security rule description.
  name: description
  types:
  - <xref:str>
- description: 'Network protocol this rule applies to. Required. Known values are:
    "http",

    "https", "tcp", "udp", "icmp", "ah", and "esp".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NsgProtocol">]
- description: The CIDR or source IP ranges.
  name: sourceAddressPrefixes
  types:
  - <xref:list>[<xref:str>]
- description: 'The destination address prefixes. CIDR or destination IP

    ranges.'
  name: destinationAddressPrefixes
  types:
  - <xref:list>[<xref:str>]
- description: The source port ranges.
  name: sourcePortRanges
  types:
  - <xref:list>[<xref:str>]
- description: The destination port ranges.
  name: destinationPortRanges
  types:
  - <xref:list>[<xref:str>]
- description: 'The CIDR or source IP range. Asterisk ''*'' can also be used to match

    all source IPs. Default tags such as ''VirtualNetwork'', ''AzureLoadBalancer''
    and ''Internet'' can

    also be used. If this is an ingress rule, specifies where network traffic originates
    from.'
  name: sourceAddressPrefix
  types:
  - <xref:str>
- description: 'The destination address prefix. CIDR or destination IP range.

    Asterisk ''*'' can also be used to match all source IPs. Default tags such as
    ''VirtualNetwork'',

    ''AzureLoadBalancer'' and ''Internet'' can also be used.'
  name: destinationAddressPrefix
  types:
  - <xref:str>
- description: 'The source port or range. Integer or range between 0 and 65535. Asterisk

    ''*'' can also be used to match all ports.'
  name: sourcePortRange
  types:
  - <xref:str>
- description: 'he destination port or range. Integer or range between 0 and 65535.

    Asterisk ''*'' can also be used to match all ports.'
  name: destinationPortRange
  types:
  - <xref:str>
- description: 'The network traffic is allowed or denied. Required. Known values are:
    "allow" and

    "deny".'
  name: access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Access">]
- description: 'The priority of the rule. The value can be in the range 1000 to 3000.
    Values

    outside this range are reserved for Service Fabric ManagerCluster Resource Provider.
    The

    priority number must be unique for each rule in the collection. The lower the
    priority number,

    the higher the priority of the rule. Required.'
  name: priority
  types:
  - <xref:int>
- description: 'Network security rule direction. Required. Known values are: "inbound"
    and

    "outbound".'
  name: direction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Direction">]
