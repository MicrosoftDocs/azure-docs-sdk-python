### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterUpgradePolicy
name: ClusterUpgradePolicy
fullName: azure.mgmt.servicefabricmanagedclusters.types.ClusterUpgradePolicy
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Describes the policy used when upgrading the cluster.
constructor:
  syntax: ClusterUpgradePolicy()
variables:
- description: 'If true, then processes are forcefully restarted during upgrade even
    when

    the code version has not changed (the upgrade only changes configuration or data).'
  name: forceRestart
  types:
  - <xref:bool>
- description: 'The cluster health policy defines a health policy used to evaluate
    the

    health of the cluster during a cluster upgrade.'
  name: healthPolicy
  types:
  - <xref:<xref:"ClusterHealthPolicy">>
- description: 'The cluster delta health policy defines a health policy used to

    evaluate the health of the cluster during a cluster upgrade.'
  name: deltaHealthPolicy
  types:
  - <xref:<xref:"ClusterUpgradeDeltaHealthPolicy">>
- description: 'The cluster monitoring policy describes the parameters for monitoring

    an upgrade in Monitored mode.'
  name: monitoringPolicy
  types:
  - <xref:<xref:"ClusterMonitoringPolicy">>
- description: 'The maximum amount of time to block processing of an

    upgrade domain and prevent loss of availability when there are unexpected issues.
    When this

    timeout expires, processing of the upgrade domain will proceed regardless of availability
    loss

    issues. The timeout is reset at the start of each upgrade domain. The timeout
    can be in either

    hh:mm:ss or in d.hh:mm:ss.ms format. This value must be between 00:00:00 and 49710.06:28:15

    (unsigned 32 bit integer for seconds).'
  name: upgradeReplicaSetCheckTimeout
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterUpgradePolicy.deltaHealthPolicy
  name: deltaHealthPolicy
  summary: 'The cluster delta health policy defines a health policy used to evaluate
    the health of the

    cluster during a cluster upgrade.'
  signature: 'deltaHealthPolicy: ClusterUpgradeDeltaHealthPolicy'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterUpgradePolicy.forceRestart
  name: forceRestart
  summary: 'If true, then processes are forcefully restarted during upgrade even when
    the code version has

    not changed (the upgrade only changes configuration or data).'
  signature: 'forceRestart: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterUpgradePolicy.healthPolicy
  name: healthPolicy
  summary: 'The cluster health policy defines a health policy used to evaluate the
    health of the cluster

    during a cluster upgrade.'
  signature: 'healthPolicy: ClusterHealthPolicy'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterUpgradePolicy.monitoringPolicy
  name: monitoringPolicy
  summary: 'The cluster monitoring policy describes the parameters for monitoring
    an upgrade in Monitored

    mode.'
  signature: 'monitoringPolicy: ClusterMonitoringPolicy'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterUpgradePolicy.upgradeReplicaSetCheckTimeout
  name: upgradeReplicaSetCheckTimeout
  summary: 'The maximum amount of time to block processing of an upgrade domain and
    prevent loss of

    availability when there are unexpected issues. When this timeout expires, processing
    of the

    upgrade domain will proceed regardless of availability loss issues. The timeout
    is reset at the

    start of each upgrade domain. The timeout can be in either hh:mm:ss or in d.hh:mm:ss.ms
    format.

    This value must be between 00:00:00 and 49710.06:28:15 (unsigned 32 bit integer
    for seconds).'
  signature: 'upgradeReplicaSetCheckTimeout: str'
