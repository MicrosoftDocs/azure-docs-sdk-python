### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.ServicePlacementInvalidDomainPolicy
name: ServicePlacementInvalidDomainPolicy
fullName: azure.mgmt.servicefabricmanagedclusters.types.ServicePlacementInvalidDomainPolicy
module: azure.mgmt.servicefabricmanagedclusters.types
summary: 'Describes the policy to be used for placement of a Service Fabric service
  where a particular

  fault or upgrade domain should not be used for placement of the instances or replicas
  of that

  service.'
constructor:
  syntax: ServicePlacementInvalidDomainPolicy()
variables:
- description: The name of the domain that should not be used for placement. Required.
  name: domainName
  types:
  - <xref:str>
- description: 'The type of placement policy for a service fabric service. Following
    are the

    possible values. Required. Indicates that the ServicePlacementPolicyDescription
    is of type

    ServicePlacementInvalidDomainPolicyDescription, which indicates that a particular
    fault or

    upgrade domain cannot be used for placement of this service. The value is 0.'
  name: type
  types:
  - <xref:typing.Literal>[ServicePlacementPolicyType.INVALID_DOMAIN]
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.ServicePlacementInvalidDomainPolicy.domainName
  name: domainName
  summary: The name of the domain that should not be used for placement. Required.
  signature: 'domainName: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ServicePlacementInvalidDomainPolicy.type
  name: type
  summary: 'The type of placement policy for a service fabric service. Following are
    the possible values.

    Required. Indicates that the ServicePlacementPolicyDescription is of type

    ServicePlacementInvalidDomainPolicyDescription, which indicates that a particular
    fault or

    upgrade domain cannot be used for placement of this service. The value is 0.'
  signature: 'type: INVALID_DOMAIN: ''InvalidDomain''>]'
