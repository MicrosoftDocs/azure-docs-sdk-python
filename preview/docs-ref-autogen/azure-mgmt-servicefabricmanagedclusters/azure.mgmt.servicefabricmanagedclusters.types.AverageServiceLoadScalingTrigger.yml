### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.AverageServiceLoadScalingTrigger
name: AverageServiceLoadScalingTrigger
fullName: azure.mgmt.servicefabricmanagedclusters.types.AverageServiceLoadScalingTrigger
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Represents a scaling policy related to an average load of a metric/resource
  of a service.
constructor:
  syntax: AverageServiceLoadScalingTrigger()
variables:
- description: The name of the metric for which usage should be tracked. Required.
  name: metricName
  types:
  - <xref:str>
- description: 'The lower limit of the load below which a scale in operation should

    be performed. Required.'
  name: lowerLoadThreshold
  types:
  - <xref:float>
- description: 'The upper limit of the load beyond which a scale out operation should

    be performed. Required.'
  name: upperLoadThreshold
  types:
  - <xref:float>
- description: 'The period in seconds on which a decision is made whether to scale
    or not.

    This property should come in ISO 8601 format "hh:mm:ss". Required.'
  name: scaleInterval
  types:
  - <xref:str>
- description: 'Flag determines whether only the load of primary replica should be

    considered for scaling. If set to true, then trigger will only consider the load
    of primary

    replicas of stateful service. If set to false, trigger will consider load of all
    replicas. This

    parameter cannot be set to true for stateless service. Required.'
  name: useOnlyPrimaryLoad
  types:
  - <xref:bool>
- description: 'Specifies the trigger associated with this scaling policy. Required.
    Represents a

    scaling policy related to an average load of a metric/resource of a service. The
    value is 1.'
  name: kind
  types:
  - <xref:typing.Literal>[ServiceScalingTriggerKind.AVERAGE_SERVICE_LOAD_TRIGGER]
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.AverageServiceLoadScalingTrigger.kind
  name: kind
  summary: 'Specifies the trigger associated with this scaling policy. Required. Represents
    a scaling

    policy related to an average load of a metric/resource of a service. The value
    is 1.'
  signature: 'kind: AVERAGE_SERVICE_LOAD_TRIGGER: ''AverageServiceLoadTrigger''>]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.AverageServiceLoadScalingTrigger.lowerLoadThreshold
  name: lowerLoadThreshold
  summary: The lower limit of the load below which a scale in operation should be
    performed. Required.
  signature: 'lowerLoadThreshold: float'
- uid: azure.mgmt.servicefabricmanagedclusters.types.AverageServiceLoadScalingTrigger.metricName
  name: metricName
  summary: The name of the metric for which usage should be tracked. Required.
  signature: 'metricName: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.AverageServiceLoadScalingTrigger.scaleInterval
  name: scaleInterval
  summary: 'The period in seconds on which a decision is made whether to scale or
    not. This property should

    come in ISO 8601 format "hh:mm:ss". Required.'
  signature: 'scaleInterval: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.AverageServiceLoadScalingTrigger.upperLoadThreshold
  name: upperLoadThreshold
  summary: The upper limit of the load beyond which a scale out operation should be
    performed. Required.
  signature: 'upperLoadThreshold: float'
- uid: azure.mgmt.servicefabricmanagedclusters.types.AverageServiceLoadScalingTrigger.useOnlyPrimaryLoad
  name: useOnlyPrimaryLoad
  summary: 'Flag determines whether only the load of primary replica should be considered
    for scaling. If

    set to true, then trigger will only consider the load of primary replicas of stateful
    service.

    If set to false, trigger will consider load of all replicas. This parameter cannot
    be set to

    true for stateless service. Required.'
  signature: 'useOnlyPrimaryLoad: bool'
