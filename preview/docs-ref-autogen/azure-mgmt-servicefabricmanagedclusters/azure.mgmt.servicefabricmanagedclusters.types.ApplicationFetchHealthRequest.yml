### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.ApplicationFetchHealthRequest
name: ApplicationFetchHealthRequest
fullName: azure.mgmt.servicefabricmanagedclusters.types.ApplicationFetchHealthRequest
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Parameters for fetching the health of an application.
constructor:
  syntax: ApplicationFetchHealthRequest()
variables:
- description: 'Allows filtering of the health events returned in the response

    based on health state. Known values are: "Default", "None", "Ok", "Warning", "Error",
    and

    "All".'
  name: eventsHealthStateFilter
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthFilter">]
- description: 'Allows filtering of the deployed applications

    health state objects returned in the result of application health query based
    on their health

    state. Known values are: "Default", "None", "Ok", "Warning", "Error", and "All".'
  name: deployedApplicationsHealthStateFilter
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthFilter">]
- description: 'Allows filtering of the services health state objects returned

    in the result of services health query based on their health state. Known values
    are:

    "Default", "None", "Ok", "Warning", "Error", and "All".'
  name: servicesHealthStateFilter
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthFilter">]
- description: 'Indicates whether the health statistics should be returned as

    part of the query result. False by default. The statistics show the number of
    children entities

    in health state Ok, Warning, and Error.'
  name: excludeHealthStatistics
  types:
  - <xref:bool>
- description: 'Request timeout for the health query in seconds. The default value
    is 60

    seconds.'
  name: timeout
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.ApplicationFetchHealthRequest.deployedApplicationsHealthStateFilter
  name: deployedApplicationsHealthStateFilter
  summary: 'Allows filtering of the deployed applications health state objects returned
    in the result of

    application health query based on their health state. Known values are: "Default",
    "None",

    "Ok", "Warning", "Error", and "All".'
  signature: 'deployedApplicationsHealthStateFilter: str | HealthFilter'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ApplicationFetchHealthRequest.eventsHealthStateFilter
  name: eventsHealthStateFilter
  summary: 'Allows filtering of the health events returned in the response based on
    health state. Known

    values are: "Default", "None", "Ok", "Warning", "Error", and "All".'
  signature: 'eventsHealthStateFilter: str | HealthFilter'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ApplicationFetchHealthRequest.excludeHealthStatistics
  name: excludeHealthStatistics
  summary: 'Indicates whether the health statistics should be returned as part of
    the query result. False

    by default. The statistics show the number of children entities in health state
    Ok, Warning,

    and Error.'
  signature: 'excludeHealthStatistics: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ApplicationFetchHealthRequest.servicesHealthStateFilter
  name: servicesHealthStateFilter
  summary: 'Allows filtering of the services health state objects returned in the
    result of services health

    query based on their health state. Known values are: "Default", "None", "Ok",

    "Warning", "Error", and "All".'
  signature: 'servicesHealthStateFilter: str | HealthFilter'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ApplicationFetchHealthRequest.timeout
  name: timeout
  summary: Request timeout for the health query in seconds. The default value is 60
    seconds.
  signature: 'timeout: int'
