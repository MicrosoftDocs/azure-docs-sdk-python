### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeRollingUpgradeUpdateMonitoringPolicy
name: RuntimeRollingUpgradeUpdateMonitoringPolicy
fullName: azure.mgmt.servicefabricmanagedclusters.types.RuntimeRollingUpgradeUpdateMonitoringPolicy
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Describes the parameters for updating a rolling upgrade of application or
  cluster.
constructor:
  syntax: RuntimeRollingUpgradeUpdateMonitoringPolicy()
variables:
- description: 'The mode used to monitor health during a rolling upgrade. Required.

    Known values are: "UnmonitoredAuto", "UnmonitoredManual", and "Monitored".'
  name: rollingUpgradeMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RuntimeRollingUpgradeMode">]
- description: 'If true, then processes are forcefully restarted during upgrade even
    when

    the code version has not changed (the upgrade only changes configuration or data).'
  name: forceRestart
  types:
  - <xref:bool>
- description: 'The maximum amount of time to block processing of

    an upgrade domain and prevent loss of availability when there are unexpected issues.
    When this

    timeout expires, processing of the upgrade domain will proceed regardless of availability
    loss

    issues. The timeout is reset at the start of each upgrade domain. Valid values
    are between 0

    and 42949672925 inclusive. (unsigned 32-bit integer).'
  name: replicaSetCheckTimeoutInMilliseconds
  types:
  - <xref:int>
- description: 'The compensating action to perform when a Monitored upgrade encounters

    monitoring policy or health policy violations. Invalid indicates the failure action
    is invalid.

    Rollback specifies that the upgrade will start rolling back automatically. Manual
    indicates

    that the upgrade will switch to UnmonitoredManual upgrade mode. Known values are:
    "Rollback"

    and "Manual".'
  name: failureAction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RuntimeFailureAction">]
- description: 'The amount of time to wait after completing an

    upgrade domain before applying health policies. It is first interpreted as a string

    representing an ISO 8601 duration. If that fails, then it is interpreted as a
    number

    representing the total number of milliseconds.'
  name: healthCheckWaitDurationInMilliseconds
  types:
  - <xref:str>
- description: 'The amount of time that the application or

    cluster must remain healthy before the upgrade proceeds to the next upgrade domain.
    It is first

    interpreted as a string representing an ISO 8601 duration. If that fails, then
    it is

    interpreted as a number representing the total number of milliseconds.'
  name: healthCheckStableDurationInMilliseconds
  types:
  - <xref:str>
- description: 'The amount of time to retry health evaluation when

    the application or cluster is unhealthy before FailureAction is executed. It is
    first

    interpreted as a string representing an ISO 8601 duration. If that fails, then
    it is

    interpreted as a number representing the total number of milliseconds.'
  name: healthCheckRetryTimeoutInMilliseconds
  types:
  - <xref:str>
- description: 'The amount of time the overall upgrade has to complete

    before FailureAction is executed. It is first interpreted as a string representing
    an ISO 8601

    duration. If that fails, then it is interpreted as a number representing the total
    number of

    milliseconds.'
  name: upgradeTimeoutInMilliseconds
  types:
  - <xref:str>
- description: 'The amount of time each upgrade domain has to

    complete before FailureAction is executed. It is first interpreted as a string
    representing an

    ISO 8601 duration. If that fails, then it is interpreted as a number representing
    the total

    number of milliseconds.'
  name: upgradeDomainTimeoutInMilliseconds
  types:
  - <xref:str>
- description: 'Duration in seconds, to wait before a stateless

    instance is closed, to allow the active requests to drain gracefully. This would
    be effective

    when the instance is closing during the application/cluster upgrade, only for
    those instances

    which have a non-zero delay duration configured in the service description.'
  name: instanceCloseDelayDurationInSeconds
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeRollingUpgradeUpdateMonitoringPolicy.failureAction
  name: failureAction
  summary: 'The compensating action to perform when a Monitored upgrade encounters
    monitoring policy or

    health policy violations. Invalid indicates the failure action is invalid. Rollback
    specifies

    that the upgrade will start rolling back automatically. Manual indicates that
    the upgrade will

    switch to UnmonitoredManual upgrade mode. Known values are: "Rollback" and "Manual".'
  signature: 'failureAction: str | RuntimeFailureAction'
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeRollingUpgradeUpdateMonitoringPolicy.forceRestart
  name: forceRestart
  summary: 'If true, then processes are forcefully restarted during upgrade even when
    the code version has

    not changed (the upgrade only changes configuration or data).'
  signature: 'forceRestart: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeRollingUpgradeUpdateMonitoringPolicy.healthCheckRetryTimeoutInMilliseconds
  name: healthCheckRetryTimeoutInMilliseconds
  summary: 'The amount of time to retry health evaluation when the application or
    cluster is unhealthy

    before FailureAction is executed. It is first interpreted as a string representing
    an ISO 8601

    duration. If that fails, then it is interpreted as a number representing the total
    number of

    milliseconds.'
  signature: 'healthCheckRetryTimeoutInMilliseconds: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeRollingUpgradeUpdateMonitoringPolicy.healthCheckStableDurationInMilliseconds
  name: healthCheckStableDurationInMilliseconds
  summary: 'The amount of time that the application or cluster must remain healthy
    before the upgrade

    proceeds to the next upgrade domain. It is first interpreted as a string representing
    an ISO

    8601 duration. If that fails, then it is interpreted as a number representing
    the total number

    of milliseconds.'
  signature: 'healthCheckStableDurationInMilliseconds: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeRollingUpgradeUpdateMonitoringPolicy.healthCheckWaitDurationInMilliseconds
  name: healthCheckWaitDurationInMilliseconds
  summary: 'The amount of time to wait after completing an upgrade domain before applying
    health policies.

    It is first interpreted as a string representing an ISO 8601 duration. If that
    fails, then it

    is interpreted as a number representing the total number of milliseconds.'
  signature: 'healthCheckWaitDurationInMilliseconds: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeRollingUpgradeUpdateMonitoringPolicy.instanceCloseDelayDurationInSeconds
  name: instanceCloseDelayDurationInSeconds
  summary: 'Duration in seconds, to wait before a stateless instance is closed, to
    allow the active

    requests to drain gracefully. This would be effective when the instance is closing
    during the

    application/cluster upgrade, only for those instances which have a non-zero delay
    duration

    configured in the service description.'
  signature: 'instanceCloseDelayDurationInSeconds: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeRollingUpgradeUpdateMonitoringPolicy.replicaSetCheckTimeoutInMilliseconds
  name: replicaSetCheckTimeoutInMilliseconds
  summary: 'The maximum amount of time to block processing of an upgrade domain and
    prevent loss of

    availability when there are unexpected issues. When this timeout expires, processing
    of the

    upgrade domain will proceed regardless of availability loss issues. The timeout
    is reset at the

    start of each upgrade domain. Valid values are between 0 and 42949672925 inclusive.
    (unsigned

    32-bit integer).'
  signature: 'replicaSetCheckTimeoutInMilliseconds: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeRollingUpgradeUpdateMonitoringPolicy.rollingUpgradeMode
  name: rollingUpgradeMode
  summary: 'The mode used to monitor health during a rolling upgrade. Required. Known
    values are:

    "UnmonitoredAuto", "UnmonitoredManual", and "Monitored".'
  signature: 'rollingUpgradeMode: Required[str | RuntimeRollingUpgradeMode]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeRollingUpgradeUpdateMonitoringPolicy.upgradeDomainTimeoutInMilliseconds
  name: upgradeDomainTimeoutInMilliseconds
  summary: 'The amount of time each upgrade domain has to complete before FailureAction
    is executed. It is

    first interpreted as a string representing an ISO 8601 duration. If that fails,
    then it is

    interpreted as a number representing the total number of milliseconds.'
  signature: 'upgradeDomainTimeoutInMilliseconds: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.RuntimeRollingUpgradeUpdateMonitoringPolicy.upgradeTimeoutInMilliseconds
  name: upgradeTimeoutInMilliseconds
  summary: 'The amount of time the overall upgrade has to complete before FailureAction
    is executed. It is

    first interpreted as a string representing an ISO 8601 duration. If that fails,
    then it is

    interpreted as a number representing the total number of milliseconds.'
  signature: 'upgradeTimeoutInMilliseconds: str'
