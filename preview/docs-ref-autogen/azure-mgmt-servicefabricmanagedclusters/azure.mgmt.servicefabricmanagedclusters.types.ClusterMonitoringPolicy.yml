### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterMonitoringPolicy
name: ClusterMonitoringPolicy
fullName: azure.mgmt.servicefabricmanagedclusters.types.ClusterMonitoringPolicy
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Describes the monitoring policies for the cluster upgrade.
constructor:
  syntax: ClusterMonitoringPolicy()
variables:
- description: 'The length of time to wait after completing an upgrade domain

    before performing health checks. The duration can be in either hh:mm:ss or in
    d.hh:mm:ss.ms

    format. Required.'
  name: healthCheckWaitDuration
  types:
  - <xref:str>
- description: 'The amount of time that the application or cluster must remain

    healthy before the upgrade proceeds to the next upgrade domain. The duration can
    be in either

    hh:mm:ss or in d.hh:mm:ss.ms format. Required.'
  name: healthCheckStableDuration
  types:
  - <xref:str>
- description: 'The amount of time to retry health evaluation when the

    application or cluster is unhealthy before the upgrade rolls back. The timeout
    can be in either

    hh:mm:ss or in d.hh:mm:ss.ms format. Required.'
  name: healthCheckRetryTimeout
  types:
  - <xref:str>
- description: 'The amount of time the overall upgrade has to complete before the
    upgrade

    rolls back. The timeout can be in either hh:mm:ss or in d.hh:mm:ss.ms format.
    Required.'
  name: upgradeTimeout
  types:
  - <xref:str>
- description: 'The amount of time each upgrade domain has to complete before the

    upgrade rolls back. The timeout can be in either hh:mm:ss or in d.hh:mm:ss.ms
    format. Required.'
  name: upgradeDomainTimeout
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterMonitoringPolicy.healthCheckRetryTimeout
  name: healthCheckRetryTimeout
  summary: 'The amount of time to retry health evaluation when the application or
    cluster is unhealthy

    before the upgrade rolls back. The timeout can be in either hh:mm:ss or in d.hh:mm:ss.ms

    format. Required.'
  signature: 'healthCheckRetryTimeout: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterMonitoringPolicy.healthCheckStableDuration
  name: healthCheckStableDuration
  summary: 'The amount of time that the application or cluster must remain healthy
    before the upgrade

    proceeds to the next upgrade domain. The duration can be in either hh:mm:ss or
    in d.hh:mm:ss.ms

    format. Required.'
  signature: 'healthCheckStableDuration: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterMonitoringPolicy.healthCheckWaitDuration
  name: healthCheckWaitDuration
  summary: 'The length of time to wait after completing an upgrade domain before performing
    health checks.

    The duration can be in either hh:mm:ss or in d.hh:mm:ss.ms format. Required.'
  signature: 'healthCheckWaitDuration: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterMonitoringPolicy.upgradeDomainTimeout
  name: upgradeDomainTimeout
  summary: 'The amount of time each upgrade domain has to complete before the upgrade
    rolls back. The

    timeout can be in either hh:mm:ss or in d.hh:mm:ss.ms format. Required.'
  signature: 'upgradeDomainTimeout: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ClusterMonitoringPolicy.upgradeTimeout
  name: upgradeTimeout
  summary: 'The amount of time the overall upgrade has to complete before the upgrade
    rolls back. The

    timeout can be in either hh:mm:ss or in d.hh:mm:ss.ms format. Required.'
  signature: 'upgradeTimeout: str'
