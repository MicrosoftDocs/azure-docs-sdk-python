### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties
name: VMSSExtensionProperties
fullName: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Describes the properties of a Virtual Machine Scale Set Extension.
constructor:
  syntax: VMSSExtensionProperties()
variables:
- description: The name of the extension handler publisher. Required.
  name: publisher
  types:
  - <xref:str>
- description: 'Specifies the type of the extension; an example is "CustomScriptExtension".

    Required.'
  name: type
  types:
  - <xref:str>
- description: Specifies the version of the script handler. Required.
  name: typeHandlerVersion
  types:
  - <xref:str>
- description: 'Indicates whether the extension should use a newer minor version

    if one is available at deployment time. Once deployed, however, the extension
    will not upgrade

    minor versions unless redeployed, even with this property set to true.'
  name: autoUpgradeMinorVersion
  types:
  - <xref:bool>
- description: Json formatted public settings for the extension.
  name: settings
  types:
  - <xref:typing.Any>
- description: 'The extension can contain either protectedSettings or

    protectedSettingsFromKeyVault or no protected settings at all.'
  name: protectedSettings
  types:
  - <xref:typing.Any>
- description: 'If a value is provided and is different from the previous value, the

    extension handler will be forced to update even if the extension configuration
    has not changed.'
  name: forceUpdateTag
  types:
  - <xref:str>
- description: 'Collection of extension names after which this extension needs

    to be provisioned.'
  name: provisionAfterExtensions
  types:
  - <xref:list>[<xref:str>]
- description: The provisioning state, which only appears in the response.
  name: provisioningState
  types:
  - <xref:str>
- description: 'Indicates whether the extension should be automatically upgraded

    by the platform if there is a newer version of the extension available.'
  name: enableAutomaticUpgrade
  types:
  - <xref:bool>
- description: Indicates the setup order for the extension.
  name: setupOrder
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"VmssExtensionSetupOrder">]]
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties.autoUpgradeMinorVersion
  name: autoUpgradeMinorVersion
  summary: 'Indicates whether the extension should use a newer minor version if one
    is available at

    deployment time. Once deployed, however, the extension will not upgrade minor
    versions unless

    redeployed, even with this property set to true.'
  signature: 'autoUpgradeMinorVersion: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties.enableAutomaticUpgrade
  name: enableAutomaticUpgrade
  summary: 'Indicates whether the extension should be automatically upgraded by the
    platform if there is a

    newer version of the extension available.'
  signature: 'enableAutomaticUpgrade: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties.forceUpdateTag
  name: forceUpdateTag
  summary: 'If a value is provided and is different from the previous value, the extension
    handler will be

    forced to update even if the extension configuration has not changed.'
  signature: 'forceUpdateTag: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties.protectedSettings
  name: protectedSettings
  summary: 'The extension can contain either protectedSettings or protectedSettingsFromKeyVault
    or no

    protected settings at all.'
  signature: 'protectedSettings: Any'
- uid: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties.provisionAfterExtensions
  name: provisionAfterExtensions
  summary: Collection of extension names after which this extension needs to be provisioned.
  signature: 'provisionAfterExtensions: list[str]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties.provisioningState
  name: provisioningState
  summary: The provisioning state, which only appears in the response.
  signature: 'provisioningState: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties.publisher
  name: publisher
  summary: The name of the extension handler publisher. Required.
  signature: 'publisher: Required[str]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties.settings
  name: settings
  summary: Json formatted public settings for the extension.
  signature: 'settings: Any'
- uid: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties.setupOrder
  name: setupOrder
  summary: Indicates the setup order for the extension.
  signature: 'setupOrder: list[typing.Union[str, ForwardRef(''VmssExtensionSetupOrder'')]]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties.type
  name: type
  summary: Specifies the type of the extension; an example is "CustomScriptExtension".
    Required.
  signature: 'type: Required[str]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.VMSSExtensionProperties.typeHandlerVersion
  name: typeHandlerVersion
  summary: Specifies the version of the script handler. Required.
  signature: 'typeHandlerVersion: Required[str]'
