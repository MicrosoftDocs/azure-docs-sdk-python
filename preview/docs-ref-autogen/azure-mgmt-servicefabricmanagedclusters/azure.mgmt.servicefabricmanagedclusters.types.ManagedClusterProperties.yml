### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties
name: ManagedClusterProperties
fullName: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Describes the managed cluster resource properties.
constructor:
  syntax: ManagedClusterProperties()
variables:
- description: The cluster dns name. Required.
  name: dnsName
  types:
  - <xref:str>
- description: 'The fully qualified domain name associated with the public load balancer
    of the

    cluster.'
  name: fqdn
  types:
  - <xref:str>
- description: The IPv4 address associated with the public load balancer of the cluster.
  name: ipv4Address
  types:
  - <xref:str>
- description: A service generated unique identifier for the cluster resource.
  name: clusterId
  types:
  - <xref:str>
- description: 'The current state of the cluster. Known values are: "WaitingForNodes",

    "Deploying", "BaselineUpgrade", "Upgrading", "UpgradeFailed", and "Ready".'
  name: clusterState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterState">]
- description: List of thumbprints of the cluster certificates.
  name: clusterCertificateThumbprints
  types:
  - <xref:list>[<xref:str>]
- description: The port used for client connections to the cluster.
  name: clientConnectionPort
  types:
  - <xref:int>
- description: The port used for HTTP connections to the cluster.
  name: httpGatewayConnectionPort
  types:
  - <xref:int>
- description: VM admin user name. Required.
  name: adminUserName
  types:
  - <xref:str>
- description: VM admin user password.
  name: adminPassword
  types:
  - <xref:str>
- description: 'Load balancing rules that are applied to the public load balancer
    of

    the cluster.'
  name: loadBalancingRules
  types:
  - <xref:list>[<xref:"LoadBalancingRule">]
- description: 'Setting this to true enables RDP access to the VM. The default NSG
    rule

    opens RDP port to Internet which can be overridden with custom Network Security
    Rules. The

    default value for this setting is false.'
  name: allowRdpAccess
  types:
  - <xref:bool>
- description: 'Custom Network Security Rules that are applied to the Virtual

    Network of the cluster.'
  name: networkSecurityRules
  types:
  - <xref:list>[<xref:"NetworkSecurityRule">]
- description: Client certificates that are allowed to manage the cluster.
  name: clients
  types:
  - <xref:list>[<xref:"ClientCertificate">]
- description: The AAD authentication settings of the cluster.
  name: azureActiveDirectory
  types:
  - <xref:<xref:"AzureActiveDirectory">>
- description: The list of custom fabric settings to configure the cluster.
  name: fabricSettings
  types:
  - <xref:list>[<xref:"SettingsSectionDescription">]
- description: 'The provisioning state of the managed cluster resource. Known values

    are: "None", "Creating", "Created", "Updating", "Succeeded", "Failed", "Canceled",
    "Deleting",

    "Deleted", and "Other".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ManagedResourceProvisioningState">]
- description: 'The Service Fabric runtime version of the cluster. This property is

    required when **clusterUpgradeMode** is set to ''Manual''. To get list of available
    Service

    Fabric versions for new clusters use <xref:./ClusterVersion.md>. To get the

    list of available version for existing clusters use **availableClusterVersions**.'
  name: clusterCodeVersion
  types:
  - <xref:str>
- description: 'The upgrade mode of the cluster when new Service Fabric runtime

    version is available. Known values are: "Automatic" and "Manual".'
  name: clusterUpgradeMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterUpgradeMode">]
- description: 'Indicates when new cluster runtime version upgrades will be

    applied after they are released. By default is Wave0. Only applies when **clusterUpgradeMode**

    is set to ''Automatic''. Known values are: "Wave0", "Wave1", and "Wave2".'
  name: clusterUpgradeCadence
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterUpgradeCadence">]
- description: List of add-on features to enable on the cluster.
  name: addonFeatures
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"ManagedClusterAddOnFeature">]]
- description: 'Enables automatic OS upgrade for node types created using OS images

    with version ''latest''. The default value for this setting is false.'
  name: enableAutoOSUpgrade
  types:
  - <xref:bool>
- description: Indicates if the cluster has zone resiliency.
  name: zonalResiliency
  types:
  - <xref:bool>
- description: The policy used to clean up unused versions.
  name: applicationTypeVersionsCleanupPolicy
  types:
  - <xref:<xref:"ApplicationTypeVersionsCleanupPolicy">>
- description: 'Setting this to true creates IPv6 address space for the default VNet
    used by

    the cluster. This setting cannot be changed once the cluster is created. The default
    value for

    this setting is false.'
  name: enableIpv6
  types:
  - <xref:bool>
- description: 'If specified, the node types for the cluster are created in this subnet
    instead

    of the default VNet. The **networkSecurityRules** specified for the cluster are
    also applied to

    this subnet. This setting cannot be changed once the cluster is created.'
  name: subnetId
  types:
  - <xref:str>
- description: The list of IP tags associated with the default public IP address of
    the cluster.
  name: ipTags
  types:
  - <xref:list>[<xref:"IpTag">]
- description: IPv6 address for the cluster if IPv6 is enabled.
  name: ipv6Address
  types:
  - <xref:str>
- description: 'Setting this to true will link the IPv4 address as the

    ServicePublicIP of the IPv6 address. It can only be set to True if IPv6 is enabled
    on the

    cluster.'
  name: enableServicePublicIP
  types:
  - <xref:bool>
- description: Auxiliary subnets for the cluster.
  name: auxiliarySubnets
  types:
  - <xref:list>[<xref:"Subnet">]
- description: Service endpoints for subnets in the cluster.
  name: serviceEndpoints
  types:
  - <xref:list>[<xref:"ServiceEndpoint">]
- description: 'Indicates the update mode for Cross Az clusters. Known values are:

    "Standard" and "Fast".'
  name: zonalUpdateMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ZonalUpdateMode">]
- description: 'For new clusters, this parameter indicates that it uses Bring your
    own

    VNet, but the subnet is specified at node type level; and for such clusters, the
    subnetId

    property is required for node types.'
  name: useCustomVnet
  types:
  - <xref:bool>
- description: 'Specify the resource id of a public IPv4 prefix that the load balancer

    will allocate a public IPv4 address from. This setting cannot be changed once
    the cluster is

    created.'
  name: publicIPPrefixId
  types:
  - <xref:str>
- description: 'Specify the resource id of a public IPv6 prefix that the load

    balancer will allocate a public IPv6 address from. This setting cannot be changed
    once the

    cluster is created.'
  name: publicIPv6PrefixId
  types:
  - <xref:str>
- description: 'Specify the resource id of a DDoS network protection plan that will

    be associated with the virtual network of the cluster.'
  name: ddosProtectionPlanId
  types:
  - <xref:str>
- description: The policy to use when upgrading the cluster.
  name: upgradeDescription
  types:
  - <xref:<xref:"ClusterUpgradePolicy">>
- description: 'The port used for token-auth based HTTPS connections

    to the cluster. Cannot be set to the same port as HttpGatewayEndpoint.'
  name: httpGatewayTokenAuthConnectionPort
  types:
  - <xref:int>
- description: 'If true, token-based authentication is not allowed on

    the HttpGatewayEndpoint. This is required to support TLS versions 1.3 and above.
    If token-based

    authentication is used, HttpGatewayTokenAuthConnectionPort must be defined.'
  name: enableHttpGatewayExclusiveAuthMode
  types:
  - <xref:bool>
- description: 'This property is the entry point to using a public CA

    cert for your cluster cert. It specifies the level of reuse allowed for the custom
    FQDN

    created, matching the subject of the public CA cert. Known values are: "TenantReuse",

    "SubscriptionReuse", "ResourceGroupReuse", and "NoReuse".'
  name: autoGeneratedDomainNameLabelScope
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoGeneratedDomainNameLabelScope">]
- description: 'The number of outbound ports allocated for SNAT for each node in

    the backend pool of the default load balancer. The default value is 0 which provides
    dynamic

    port allocation based on pool size.'
  name: allocatedOutboundPorts
  types:
  - <xref:int>
- description: 'The VM image the node types are configured with. This property controls
    the

    Service Fabric component packages to be used for the cluster. Allowed values are:
    ''Windows''.

    The default value is ''Windows''.'
  name: VMImage
  types:
  - <xref:str>
- description: 'Enable the creation of node types with only outbound traffic

    enabled. If set, a separate load balancer backend pool will be created for node
    types with

    inbound traffic enabled. Can only be set at the time of cluster creation.'
  name: enableOutboundOnlyNodeTypes
  types:
  - <xref:bool>
- description: 'Determines whether to skip the assignment of the managed

    network security group (SF-NSG) to the cluster subnet when using a bring-your-own
    virtual

    network (BYOVNET) configuration. The default value is false.'
  name: skipManagedNsgAssignment
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.VMImage
  name: VMImage
  summary: 'The VM image the node types are configured with. This property controls
    the Service Fabric

    component packages to be used for the cluster. Allowed values are: ''Windows''.
    The default value

    is ''Windows''.'
  signature: 'VMImage: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.addonFeatures
  name: addonFeatures
  summary: List of add-on features to enable on the cluster.
  signature: 'addonFeatures: list[typing.Union[str, ForwardRef(''ManagedClusterAddOnFeature'')]]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.adminPassword
  name: adminPassword
  summary: VM admin user password.
  signature: 'adminPassword: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.adminUserName
  name: adminUserName
  summary: VM admin user name. Required.
  signature: 'adminUserName: Required[str]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.allocatedOutboundPorts
  name: allocatedOutboundPorts
  summary: 'The number of outbound ports allocated for SNAT for each node in the backend
    pool of the

    default load balancer. The default value is 0 which provides dynamic port allocation
    based on

    pool size.'
  signature: 'allocatedOutboundPorts: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.allowRdpAccess
  name: allowRdpAccess
  summary: 'Setting this to true enables RDP access to the VM. The default NSG rule
    opens RDP port to

    Internet which can be overridden with custom Network Security Rules. The default
    value for this

    setting is false.'
  signature: 'allowRdpAccess: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.applicationTypeVersionsCleanupPolicy
  name: applicationTypeVersionsCleanupPolicy
  summary: The policy used to clean up unused versions.
  signature: 'applicationTypeVersionsCleanupPolicy: ApplicationTypeVersionsCleanupPolicy'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.autoGeneratedDomainNameLabelScope
  name: autoGeneratedDomainNameLabelScope
  summary: 'This property is the entry point to using a public CA cert for your cluster
    cert. It specifies

    the level of reuse allowed for the custom FQDN created, matching the subject of
    the public CA

    cert. Known values are: "TenantReuse", "SubscriptionReuse", "ResourceGroupReuse",
    and

    "NoReuse".'
  signature: 'autoGeneratedDomainNameLabelScope: str | AutoGeneratedDomainNameLabelScope'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.auxiliarySubnets
  name: auxiliarySubnets
  summary: Auxiliary subnets for the cluster.
  signature: 'auxiliarySubnets: list[''Subnet'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.azureActiveDirectory
  name: azureActiveDirectory
  summary: The AAD authentication settings of the cluster.
  signature: 'azureActiveDirectory: AzureActiveDirectory'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.clientConnectionPort
  name: clientConnectionPort
  summary: The port used for client connections to the cluster.
  signature: 'clientConnectionPort: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.clients
  name: clients
  summary: Client certificates that are allowed to manage the cluster.
  signature: 'clients: list[''ClientCertificate'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.clusterCertificateThumbprints
  name: clusterCertificateThumbprints
  summary: List of thumbprints of the cluster certificates.
  signature: 'clusterCertificateThumbprints: list[str]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.clusterCodeVersion
  name: clusterCodeVersion
  summary: 'The Service Fabric runtime version of the cluster. This property is required
    when

    **clusterUpgradeMode** is set to ''Manual''. To get list of available Service
    Fabric versions for

    new clusters use <xref:./ClusterVersion.md>. To get the list of available

    version for existing clusters use **availableClusterVersions**.'
  signature: 'clusterCodeVersion: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.clusterId
  name: clusterId
  summary: A service generated unique identifier for the cluster resource.
  signature: 'clusterId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.clusterState
  name: clusterState
  summary: '"WaitingForNodes", "Deploying",

    "BaselineUpgrade", "Upgrading", "UpgradeFailed", and "Ready".'
  signature: 'clusterState: str | ClusterState'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.clusterUpgradeCadence
  name: clusterUpgradeCadence
  summary: 'Indicates when new cluster runtime version upgrades will be applied after
    they are released. By

    default is Wave0. Only applies when **clusterUpgradeMode** is set to ''Automatic''.
    Known values

    are: "Wave0", "Wave1", and "Wave2".'
  signature: 'clusterUpgradeCadence: str | ClusterUpgradeCadence'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.clusterUpgradeMode
  name: clusterUpgradeMode
  summary: 'The upgrade mode of the cluster when new Service Fabric runtime version
    is available. Known

    values are: "Automatic" and "Manual".'
  signature: 'clusterUpgradeMode: str | ClusterUpgradeMode'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.ddosProtectionPlanId
  name: ddosProtectionPlanId
  summary: 'Specify the resource id of a DDoS network protection plan that will be
    associated with the

    virtual network of the cluster.'
  signature: 'ddosProtectionPlanId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.dnsName
  name: dnsName
  summary: The cluster dns name. Required.
  signature: 'dnsName: Required[str]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.enableAutoOSUpgrade
  name: enableAutoOSUpgrade
  summary: 'Enables automatic OS upgrade for node types created using OS images with
    version ''latest''. The

    default value for this setting is false.'
  signature: 'enableAutoOSUpgrade: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.enableHttpGatewayExclusiveAuthMode
  name: enableHttpGatewayExclusiveAuthMode
  summary: 'If true, token-based authentication is not allowed on the HttpGatewayEndpoint.
    This is required

    to support TLS versions 1.3 and above. If token-based authentication is used,

    HttpGatewayTokenAuthConnectionPort must be defined.'
  signature: 'enableHttpGatewayExclusiveAuthMode: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.enableIpv6
  name: enableIpv6
  summary: 'Setting this to true creates IPv6 address space for the default VNet used
    by the cluster. This

    setting cannot be changed once the cluster is created. The default value for this
    setting is

    false.'
  signature: 'enableIpv6: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.enableOutboundOnlyNodeTypes
  name: enableOutboundOnlyNodeTypes
  summary: 'Enable the creation of node types with only outbound traffic enabled.
    If set, a separate load

    balancer backend pool will be created for node types with inbound traffic enabled.
    Can only be

    set at the time of cluster creation.'
  signature: 'enableOutboundOnlyNodeTypes: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.enableServicePublicIP
  name: enableServicePublicIP
  summary: 'Setting this to true will link the IPv4 address as the ServicePublicIP
    of the IPv6 address. It

    can only be set to True if IPv6 is enabled on the cluster.'
  signature: 'enableServicePublicIP: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.fabricSettings
  name: fabricSettings
  summary: The list of custom fabric settings to configure the cluster.
  signature: 'fabricSettings: list[''SettingsSectionDescription'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.fqdn
  name: fqdn
  summary: The fully qualified domain name associated with the public load balancer
    of the cluster.
  signature: 'fqdn: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.httpGatewayConnectionPort
  name: httpGatewayConnectionPort
  summary: The port used for HTTP connections to the cluster.
  signature: 'httpGatewayConnectionPort: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.httpGatewayTokenAuthConnectionPort
  name: httpGatewayTokenAuthConnectionPort
  summary: 'The port used for token-auth based HTTPS connections to the cluster. Cannot
    be set to the same

    port as HttpGatewayEndpoint.'
  signature: 'httpGatewayTokenAuthConnectionPort: int'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.ipTags
  name: ipTags
  summary: The list of IP tags associated with the default public IP address of the
    cluster.
  signature: 'ipTags: list[''IpTag'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.ipv4Address
  name: ipv4Address
  summary: The IPv4 address associated with the public load balancer of the cluster.
  signature: 'ipv4Address: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.ipv6Address
  name: ipv6Address
  summary: IPv6 address for the cluster if IPv6 is enabled.
  signature: 'ipv6Address: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.loadBalancingRules
  name: loadBalancingRules
  summary: Load balancing rules that are applied to the public load balancer of the
    cluster.
  signature: 'loadBalancingRules: list[''LoadBalancingRule'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.networkSecurityRules
  name: networkSecurityRules
  summary: Custom Network Security Rules that are applied to the Virtual Network of
    the cluster.
  signature: 'networkSecurityRules: list[''NetworkSecurityRule'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.provisioningState
  name: provisioningState
  summary: '"None",

    "Creating", "Created", "Updating", "Succeeded", "Failed", "Canceled", "Deleting",

    "Deleted", and "Other".'
  signature: 'provisioningState: str | ManagedResourceProvisioningState'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.publicIPPrefixId
  name: publicIPPrefixId
  summary: 'Specify the resource id of a public IPv4 prefix that the load balancer
    will allocate a public

    IPv4 address from. This setting cannot be changed once the cluster is created.'
  signature: 'publicIPPrefixId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.publicIPv6PrefixId
  name: publicIPv6PrefixId
  summary: 'Specify the resource id of a public IPv6 prefix that the load balancer
    will allocate a public

    IPv6 address from. This setting cannot be changed once the cluster is created.'
  signature: 'publicIPv6PrefixId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.serviceEndpoints
  name: serviceEndpoints
  summary: Service endpoints for subnets in the cluster.
  signature: 'serviceEndpoints: list[''ServiceEndpoint'']'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.skipManagedNsgAssignment
  name: skipManagedNsgAssignment
  summary: 'Determines whether to skip the assignment of the managed network security
    group (SF-NSG) to the

    cluster subnet when using a bring-your-own virtual network (BYOVNET) configuration.
    The default

    value is false.'
  signature: 'skipManagedNsgAssignment: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.subnetId
  name: subnetId
  summary: 'If specified, the node types for the cluster are created in this subnet
    instead of the default

    VNet. The **networkSecurityRules** specified for the cluster are also applied
    to this subnet.

    This setting cannot be changed once the cluster is created.'
  signature: 'subnetId: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.upgradeDescription
  name: upgradeDescription
  summary: The policy to use when upgrading the cluster.
  signature: 'upgradeDescription: ClusterUpgradePolicy'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.useCustomVnet
  name: useCustomVnet
  summary: 'For new clusters, this parameter indicates that it uses Bring your own
    VNet, but the subnet is

    specified at node type level; and for such clusters, the subnetId property is
    required for node

    types.'
  signature: 'useCustomVnet: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.zonalResiliency
  name: zonalResiliency
  summary: Indicates if the cluster has zone resiliency.
  signature: 'zonalResiliency: bool'
- uid: azure.mgmt.servicefabricmanagedclusters.types.ManagedClusterProperties.zonalUpdateMode
  name: zonalUpdateMode
  summary: '"Standard" and "Fast".'
  signature: 'zonalUpdateMode: str | ZonalUpdateMode'
