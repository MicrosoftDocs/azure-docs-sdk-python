### YamlMime:PythonClass
uid: azure.mgmt.servicefabricmanagedclusters.types.AveragePartitionLoadScalingTrigger
name: AveragePartitionLoadScalingTrigger
fullName: azure.mgmt.servicefabricmanagedclusters.types.AveragePartitionLoadScalingTrigger
module: azure.mgmt.servicefabricmanagedclusters.types
summary: Represents a scaling trigger related to an average load of a metric/resource
  of a partition.
constructor:
  syntax: AveragePartitionLoadScalingTrigger()
variables:
- description: The name of the metric for which usage should be tracked. Required.
  name: metricName
  types:
  - <xref:str>
- description: 'The lower limit of the load below which a scale in operation should

    be performed. Required.'
  name: lowerLoadThreshold
  types:
  - <xref:float>
- description: 'The upper limit of the load beyond which a scale out operation should

    be performed. Required.'
  name: upperLoadThreshold
  types:
  - <xref:float>
- description: 'The period in seconds on which a decision is made whether to scale
    or not.

    This property should come in ISO 8601 format "hh:mm:ss". Required.'
  name: scaleInterval
  types:
  - <xref:str>
- description: 'Specifies the trigger associated with this scaling policy. Required.
    Represents a

    scaling trigger related to an average load of a metric/resource of a partition.
    The value is 0.'
  name: kind
  types:
  - <xref:typing.Literal>[ServiceScalingTriggerKind.AVERAGE_PARTITION_LOAD_TRIGGER]
attributes:
- uid: azure.mgmt.servicefabricmanagedclusters.types.AveragePartitionLoadScalingTrigger.kind
  name: kind
  summary: 'Specifies the trigger associated with this scaling policy. Required. Represents
    a scaling

    trigger related to an average load of a metric/resource of a partition. The value
    is 0.'
  signature: 'kind: AVERAGE_PARTITION_LOAD_TRIGGER: ''AveragePartitionLoadTrigger''>]'
- uid: azure.mgmt.servicefabricmanagedclusters.types.AveragePartitionLoadScalingTrigger.lowerLoadThreshold
  name: lowerLoadThreshold
  summary: The lower limit of the load below which a scale in operation should be
    performed. Required.
  signature: 'lowerLoadThreshold: float'
- uid: azure.mgmt.servicefabricmanagedclusters.types.AveragePartitionLoadScalingTrigger.metricName
  name: metricName
  summary: The name of the metric for which usage should be tracked. Required.
  signature: 'metricName: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.AveragePartitionLoadScalingTrigger.scaleInterval
  name: scaleInterval
  summary: 'The period in seconds on which a decision is made whether to scale or
    not. This property should

    come in ISO 8601 format "hh:mm:ss". Required.'
  signature: 'scaleInterval: str'
- uid: azure.mgmt.servicefabricmanagedclusters.types.AveragePartitionLoadScalingTrigger.upperLoadThreshold
  name: upperLoadThreshold
  summary: The upper limit of the load beyond which a scale out operation should be
    performed. Required.
  signature: 'upperLoadThreshold: float'
