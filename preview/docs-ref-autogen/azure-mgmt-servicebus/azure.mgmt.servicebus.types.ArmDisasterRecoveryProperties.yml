### YamlMime:PythonClass
uid: azure.mgmt.servicebus.types.ArmDisasterRecoveryProperties
name: ArmDisasterRecoveryProperties
fullName: azure.mgmt.servicebus.types.ArmDisasterRecoveryProperties
module: azure.mgmt.servicebus.types
summary: Properties required to the Create Or Update Alias(Disaster Recovery configurations).
constructor:
  syntax: ArmDisasterRecoveryProperties()
variables:
- description: 'Provisioning state of the Alias(Disaster Recovery configuration) -

    possible values ''Accepted'' or ''Succeeded'' or ''Failed''. Known values are:
    "Accepted",

    "Succeeded", and "Failed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningStateDR">]
- description: Number of entities pending to be replicated.
  name: pending_replication_operations_count
  types:
  - <xref:int>
- description: 'ARM Id of the Primary/Secondary eventhub namespace name, which is
    part

    of GEO DR pairing.'
  name: partner_namespace
  types:
  - <xref:str>
- description: 'Primary/Secondary eventhub namespace name, which is part of GEO DR

    pairing.'
  name: alternate_name
  types:
  - <xref:str>
- description: 'role of namespace in GEO DR - possible values ''Primary'' or ''PrimaryNotReplicating''

    or ''Secondary''. Known values are: "Primary", "PrimaryNotReplicating", and "Secondary".'
  name: role
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RoleDisasterRecovery">]
attributes:
- uid: azure.mgmt.servicebus.types.ArmDisasterRecoveryProperties.alternateName
  name: alternateName
  summary: Primary/Secondary eventhub namespace name, which is part of GEO DR pairing.
  signature: 'alternateName: str'
- uid: azure.mgmt.servicebus.types.ArmDisasterRecoveryProperties.partnerNamespace
  name: partnerNamespace
  summary: ARM Id of the Primary/Secondary eventhub namespace name, which is part
    of GEO DR pairing.
  signature: 'partnerNamespace: str'
- uid: azure.mgmt.servicebus.types.ArmDisasterRecoveryProperties.pendingReplicationOperationsCount
  name: pendingReplicationOperationsCount
  summary: Number of entities pending to be replicated.
  signature: 'pendingReplicationOperationsCount: int'
- uid: azure.mgmt.servicebus.types.ArmDisasterRecoveryProperties.provisioningState
  name: provisioningState
  summary: 'Provisioning state of the Alias(Disaster Recovery configuration) - possible
    values ''Accepted''

    or ''Succeeded'' or ''Failed''. Known values are: "Accepted", "Succeeded", and
    "Failed".'
  signature: 'provisioningState: str | ProvisioningStateDR'
- uid: azure.mgmt.servicebus.types.ArmDisasterRecoveryProperties.role
  name: role
  summary: 'role of namespace in GEO DR - possible values ''Primary'' or ''PrimaryNotReplicating''
    or

    ''Secondary''. Known values are: "Primary", "PrimaryNotReplicating", and "Secondary".'
  signature: 'role: str | RoleDisasterRecovery'
