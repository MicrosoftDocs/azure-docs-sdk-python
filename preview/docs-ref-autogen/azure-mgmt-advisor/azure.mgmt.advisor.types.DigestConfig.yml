### YamlMime:PythonClass
uid: azure.mgmt.advisor.types.DigestConfig
name: DigestConfig
fullName: azure.mgmt.advisor.types.DigestConfig
module: azure.mgmt.advisor.types
summary: Advisor Digest configuration entity.
constructor:
  syntax: DigestConfig()
variables:
- description: 'Name of digest configuration. Value is case-insensitive and must be
    unique within a

    subscription.'
  name: name
  types:
  - <xref:str>
- description: Action group resource id used by digest.
  name: action_group_resource_id
  types:
  - <xref:str>
- description: 'Frequency that digest will be triggered, in days. Value must be between
    7 and

    30 days inclusive.'
  name: frequency
  types:
  - <xref:int>
- description: 'Categories to send digest for. If categories are not provided, then
    digest

    will be sent for all categories.'
  name: categories
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"Category">]]
- description: 'Language for digest content body. Value must be ISO 639-1 code for
    one of Azure

    portal supported languages. Otherwise, it will be converted into one. Default
    value is English

    (en).'
  name: language
  types:
  - <xref:str>
- description: 'State of digest configuration. Known values are: "Active" and "Disabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DigestConfigState">]
attributes:
- uid: azure.mgmt.advisor.types.DigestConfig.actionGroupResourceId
  name: actionGroupResourceId
  summary: Action group resource id used by digest.
  signature: 'actionGroupResourceId: str'
- uid: azure.mgmt.advisor.types.DigestConfig.categories
  name: categories
  summary: 'Categories to send digest for. If categories are not provided, then digest
    will be sent for all

    categories.'
  signature: 'categories: list[typing.Union[str, ForwardRef(''Category'')]]'
- uid: azure.mgmt.advisor.types.DigestConfig.frequency
  name: frequency
  summary: 'Frequency that digest will be triggered, in days. Value must be between
    7 and 30 days

    inclusive.'
  signature: 'frequency: int'
- uid: azure.mgmt.advisor.types.DigestConfig.language
  name: language
  summary: 'Language for digest content body. Value must be ISO 639-1 code for one
    of Azure portal

    supported languages. Otherwise, it will be converted into one. Default value is
    English (en).'
  signature: 'language: str'
- uid: azure.mgmt.advisor.types.DigestConfig.name
  name: name
  summary: 'Name of digest configuration. Value is case-insensitive and must be unique
    within a

    subscription.'
  signature: 'name: str'
- uid: azure.mgmt.advisor.types.DigestConfig.state
  name: state
  summary: '"Active" and "Disabled".'
  signature: 'state: str | DigestConfigState'
