### YamlMime:PythonClass
uid: azure.mgmt.advisor.models.RecommendationProperties
name: RecommendationProperties
fullName: azure.mgmt.advisor.models.RecommendationProperties
module: azure.mgmt.advisor.models
summary: The properties of the recommendation.
constructor:
  syntax: 'RecommendationProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The category of the recommendation. Known values are: "HighAvailability",

    "Security", "Performance", "Cost", and "OperationalExcellence".'
  name: category
  types:
  - <xref:str>
  - <xref:azure.mgmt.advisor.models.Category>
- description: 'The sub-category of the recommendation. Known values are: "HighAvailability",

    "BusinessContinuity", "DisasterRecovery", "Scalability", "MonitoringAndAlerting",

    "ServiceUpgradeAndRetirement", "Other", "PrioritizedRecommendations", and "Personalized".'
  name: control
  types:
  - <xref:str>
  - <xref:azure.mgmt.advisor.models.Control>
- description: 'The business impact of the recommendation. Known values are: "High",
    "Medium",

    and "Low".'
  name: impact
  types:
  - <xref:str>
  - <xref:azure.mgmt.advisor.models.Impact>
- description: The resource type identified by Advisor.
  name: impacted_field
  types:
  - <xref:str>
- description: The resource identified by Advisor.
  name: impacted_value
  types:
  - <xref:str>
- description: 'The state of the Recommendation. Known values are: "New",

    "Postponed", "Dismissed", and "Completed".'
  name: recommendation_status
  types:
  - <xref:str>
  - <xref:azure.mgmt.advisor.models.RecommendationStatus>
- description: 'The type of recommendation completion, which is either MarkedByUser
    or

    SystemVerified.'
  name: completion_type
  types:
  - <xref:str>
- description: 'The reason the Recommendation was dismissed. Known values

    are: "ExcessiveCostInvestmentRequired", "TooComplexOrImpracticalToImplement",

    "AnAlternativeSolutionIsAlreadyInPlace", "IncompatibleWithTheCurrentConfiguration",

    "ImplementationStepsAreUnclear", "RiskIsAcceptable", and "Other".'
  name: recommendation_dismiss_reason
  types:
  - <xref:str>
  - <xref:azure.mgmt.advisor.models.RecommendationDismissReason>
- description: The time the Recommendation was postponed until.
  name: postponed_until_date_time
  types:
  - <xref:datetime.datetime>
- description: 'The most recent time Advisor evaluated the recommendation for validity

    (re-ingested).'
  name: last_refreshed
  types:
  - <xref:datetime.datetime>
- description: 'The most recent time the recommendation state changed (manual or

    automated).'
  name: last_updated
  types:
  - <xref:datetime.datetime>
- description: The created time of the recommendation.
  name: created_time
  types:
  - <xref:datetime.datetime>
- description: The recommendation metadata.
  name: metadata
  types:
  - <xref:dict>[<xref:str>, <xref:any>]
- description: The recommendation-type GUID.
  name: recommendation_type_id
  types:
  - <xref:str>
- description: 'The potential risk of not implementing the recommendation. Known values
    are:

    "Error", "Warning", and "None".'
  name: risk
  types:
  - <xref:str>
  - <xref:azure.mgmt.advisor.models.Risk>
- description: A summary of the recommendation.
  name: short_description
  types:
  - <xref:azure.mgmt.advisor.models.ShortDescription>
- description: The single snoozed or dismissed rule for the recommendation.
  name: suppression_id
  types:
  - <xref:str>
- description: Extended properties.
  name: extended_properties
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Metadata of resource that was assessed.
  name: resource_metadata
  types:
  - <xref:azure.mgmt.advisor.models.ResourceMetadata>
- description: The detailed description of recommendation.
  name: description
  types:
  - <xref:str>
- description: The label of recommendation.
  name: label
  types:
  - <xref:str>
- description: The link to learn more about recommendation and generation logic.
  name: learn_more_link
  types:
  - <xref:str>
- description: The potential benefit of implementing recommendation.
  name: potential_benefits
  types:
  - <xref:str>
- description: The list of recommended actions to implement recommendation.
  name: actions
  types:
  - <xref:list>[<xref:dict>[<xref:str>, <xref:any>]]
- description: The automated way to apply recommendation.
  name: remediation
  types:
  - <xref:dict>[<xref:str>, <xref:any>]
- description: 'The recommendation metadata properties exposed to customer

    to provide additional information.'
  name: exposed_metadata_properties
  types:
  - <xref:dict>[<xref:str>, <xref:any>]
- description: The properties of a tracked recommendation.
  name: tracked_properties
  types:
  - <xref:azure.mgmt.advisor.models.TrackedRecommendationProperties>
- description: The Review that this Recommendation belongs to.
  name: review
  types:
  - <xref:azure.mgmt.advisor.models.RecommendationPropertiesReview>
- description: The Workload that this Resource belongs to.
  name: resource_workload
  types:
  - <xref:azure.mgmt.advisor.models.RecommendationPropertiesResourceWorkload>
- description: The Source System that this Recommendation originated from.
  name: source_system
  types:
  - <xref:str>
- description: Additional notes for the Recommendation.
  name: notes
  types:
  - <xref:str>
