### YamlMime:PythonClass
uid: azure.mgmt.advisor.types.ConfigDataProperties
name: ConfigDataProperties
fullName: azure.mgmt.advisor.types.ConfigDataProperties
module: azure.mgmt.advisor.types
summary: Configuration data properties.
constructor:
  syntax: ConfigDataProperties()
variables:
- description: 'Exclude the resource from Advisor evaluations. Valid values: False
    (default) or

    True.'
  name: exclude
  types:
  - <xref:bool>
- description: 'Minimum percentage threshold for Advisor low CPU utilization

    evaluation. Valid only for subscriptions. Valid values: 5 (default), 10, 15 or
    20. Known values

    are: "5", "10", "15", and "20".'
  name: low_cpu_threshold
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CpuThreshold">]
- description: 'Minimum duration for Advisor low CPU utilization evaluation. Valid
    only for

    subscriptions. Valid values: 7 (default), 14, 21, 30, 60 or 90. Known values are:
    "7", "14",

    "21", "30", "60", and "90".'
  name: duration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Duration">]
- description: Advisor digest configuration. Valid only for subscriptions.
  name: digests
  types:
  - <xref:list>[<xref:"DigestConfig">]
attributes:
- uid: azure.mgmt.advisor.types.ConfigDataProperties.digests
  name: digests
  summary: Advisor digest configuration. Valid only for subscriptions.
  signature: 'digests: list[''DigestConfig'']'
- uid: azure.mgmt.advisor.types.ConfigDataProperties.duration
  name: duration
  summary: 'Minimum duration for Advisor low CPU utilization evaluation. Valid only
    for subscriptions.

    Valid values: 7 (default), 14, 21, 30, 60 or 90. Known values are: "7", "14",
    "21",

    "30", "60", and "90".'
  signature: 'duration: str | Duration'
- uid: azure.mgmt.advisor.types.ConfigDataProperties.exclude
  name: exclude
  summary: False (default) or True.
  signature: 'exclude: bool'
- uid: azure.mgmt.advisor.types.ConfigDataProperties.lowCpuThreshold
  name: lowCpuThreshold
  summary: 'Minimum percentage threshold for Advisor low CPU utilization evaluation.
    Valid only for

    subscriptions. Valid values: 5 (default), 10, 15 or 20. Known values are: "5",
    "10",

    "15", and "20".'
  signature: 'lowCpuThreshold: str | CpuThreshold'
