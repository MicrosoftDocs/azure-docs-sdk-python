- uid: azure.mgmt.advisor.operations.RecommendationsOperations.list
  name: list
  summary: 'Obtains cached recommendations for a subscription. The recommendations
    are generated or

    computed by invoking generateRecommendations.'
  signature: 'list(*, filter: str | None = None, top: int | None = None, skip_token:
    str | None = None, **kwargs: Any) -> ItemPaged[ResourceRecommendationBase]'
  keywordOnlyParameters:
  - name: filter
    description: 'The filter to apply to the recommendations.<br>Filter can be applied
      to

      properties [''ResourceId'', ''ResourceGroup'', ''RecommendationTypeGuid'', ''<xref:category>'',

      ''SubCategory'', ''RetirementDate'', ''<xref:recommendationStatus>''] with

      operators [''eq'', ''and'', ''or'', ''lt'', ''gt'', ''le'', ''ge'']<br>.

      <br>**Note:** `Control` is a legacy filter property and will be deprecated in
      the future.

      Please use `SubCategory` for filtering recommendation subcategory.<br>

      <br>**Note:** `RecommendationStatus` filter is available from API Version 2026-02-01-preview

      and onwards.<br>

      <br>Valid options for SubCategory:<br>[''BusinessContinuity'', ''DisasterRecovery'',

      ''HighAvailability'', ''MonitoringAndAlerting'', ''Other'', ''Personalized'',

      ''PrioritizedRecommendations'', ''Scalability'', ''ServiceUpgradeAndRetirement'',
      ''Validation'']<br>

      <br>Example:<br>- $filter=Category eq ''Cost'' and ResourceGroup eq

      ''MyResourceGroup''<br>-$filter=SubCategory eq ''ServiceUpgradeAndRetirement''
      and RetirementDate

      le ''2024-01-01'' and RetirementDate ge ''2028-01-01''. Default value is None.'
    defaultValue: None
    types:
    - <xref:str>
  - name: top
    description: 'The number of recommendations per page if a paged version of this
      API is being

      used. Default value is None.'
    defaultValue: None
    types:
    - <xref:int>
  - name: skip_token
    description: 'The page-continuation token to use with a paged version of this
      API.

      Default value is None.'
    defaultValue: None
    types:
    - <xref:str>
  return:
    description: An iterator like instance of ResourceRecommendationBase
    types:
    - <xref:azure.core.paging.ItemPaged>[<xref:azure.mgmt.advisor.models.ResourceRecommendationBase>]
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
