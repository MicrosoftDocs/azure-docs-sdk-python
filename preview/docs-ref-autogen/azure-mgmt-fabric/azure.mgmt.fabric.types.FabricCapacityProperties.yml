uid: azure.mgmt.fabric.types.FabricCapacityProperties
name: FabricCapacityProperties
fullName: azure.mgmt.fabric.types.FabricCapacityProperties
module: azure.mgmt.fabric.types
summary: The Microsoft Fabric capacity properties.
constructor:
  syntax: FabricCapacityProperties()
variables:
- description: 'The current deployment state of Microsoft Fabric resource. The

    provisioningState is to indicate states for resource provisioning. Known values
    are:

    "Succeeded", "Failed", "Canceled", "Deleting", "Provisioning", and "Updating".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The current state of Microsoft Fabric resource. The state is to indicate
    more

    states outside of resource provisioning. Known values are: "Active", "Provisioning",
    "Failed",

    "Updating", "Deleting", "Suspending", "Suspended", "Pausing", "Paused", "Resuming",
    "Scaling",

    and "Preparing".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceState">]
- description: The capacity overage properties of the Fabric capacity resource. Required.
  name: overage
  types:
  - <xref:<xref:"CapacityOverageProperties">>
- description: The capacity administration. Required.
  name: administration
  types:
  - <xref:<xref:"CapacityAdministration">>
