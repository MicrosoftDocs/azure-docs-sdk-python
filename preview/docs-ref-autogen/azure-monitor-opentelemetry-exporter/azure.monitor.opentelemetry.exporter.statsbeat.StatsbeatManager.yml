### YamlMime:PythonClass
uid: azure.monitor.opentelemetry.exporter.statsbeat.StatsbeatManager
name: StatsbeatManager
fullName: azure.monitor.opentelemetry.exporter.statsbeat.StatsbeatManager
module: azure.monitor.opentelemetry.exporter.statsbeat
summary: Thread-safe singleton manager for Statsbeat metrics collection with dynamic
  reconfiguration support.
constructor:
  syntax: 'StatsbeatManager(*args: Any, **kwargs: Any)'
methods:
- uid: azure.monitor.opentelemetry.exporter.statsbeat.StatsbeatManager.add_additional_metric_callbacks
  name: add_additional_metric_callbacks
  summary: Register additional callbacks for a built-in statsbeat metric.
  signature: 'add_additional_metric_callbacks(metric_name: str, callback: Callable[[CallbackOptions],
    Iterable[Observation]]) -> None'
  parameters:
  - name: metric_name
    description: Name of the built-in statsbeat metric.
    isRequired: true
    types:
    - <xref:str>
  - name: callback
    description: Callback that yields observations for the metric.
    isRequired: true
    types:
    - <xref:typing.Callable>[[<xref:opentelemetry.metrics.CallbackOptions>], <xref:typing.Iterable>[<xref:opentelemetry.metrics.Observation>]]
- uid: azure.monitor.opentelemetry.exporter.statsbeat.StatsbeatManager.get_additional_metric_callbacks
  name: get_additional_metric_callbacks
  summary: Return registered callbacks for a built-in statsbeat metric.
  signature: 'get_additional_metric_callbacks(metric_name: str) -> Iterable[Callable[[CallbackOptions],
    Iterable[Observation]]]'
  parameters:
  - name: metric_name
    description: Name of the built-in statsbeat metric.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: Registered callbacks for the provided metric name.
    types:
    - '<xref:typing.Iterable>[<xref:typing.Callable>[[<xref:opentelemetry.metrics.CallbackOptions>],
      <xref:typing.Iterable>[<xref:opentelemetry.metrics.Observation>]]] # <xref:pylint>:
      <xref:disable>=<xref:line>-<xref:too>-<xref:long>'
- uid: azure.monitor.opentelemetry.exporter.statsbeat.StatsbeatManager.get_current_config
  name: get_current_config
  summary: Get a copy of the current statsbeat configuration.
  signature: get_current_config() -> StatsbeatConfig | None
  return:
    description: Copy of current StatsbeatConfig instance if initialized, None otherwise
    types:
    - <xref:typing.Optional>[<xref:azure.monitor.opentelemetry.exporter.statsbeat.StatsbeatConfig>]
- uid: azure.monitor.opentelemetry.exporter.statsbeat.StatsbeatManager.initialize
  name: initialize
  signature: 'initialize(config: StatsbeatConfig) -> bool'
  parameters:
  - name: config
    isRequired: true
- uid: azure.monitor.opentelemetry.exporter.statsbeat.StatsbeatManager.is_initialized
  name: is_initialized
  summary: Check if the StatsbeatManager is currently initialized.
  signature: is_initialized() -> bool
  return:
    description: True if initialized, False otherwise
    types:
    - <xref:bool>
- uid: azure.monitor.opentelemetry.exporter.statsbeat.StatsbeatManager.shutdown
  name: shutdown
  signature: shutdown() -> bool
