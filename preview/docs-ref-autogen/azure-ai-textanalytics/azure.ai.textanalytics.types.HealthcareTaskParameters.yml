### YamlMime:PythonClass
uid: azure.ai.textanalytics.types.HealthcareTaskParameters
name: HealthcareTaskParameters
fullName: azure.ai.textanalytics.types.HealthcareTaskParameters
module: azure.ai.textanalytics.types
summary: Supported parameters for a Healthcare task.
constructor:
  syntax: HealthcareTaskParameters()
variables:
- description: logging opt out.
  name: loggingOptOut
  types:
  - <xref:bool>
- description: model version.
  name: modelVersion
  types:
  - <xref:str>
- description: 'Specifies the method used to interpret string offsets. Known values
    are:

    "TextElements_v8", "UnicodeCodePoint", and "Utf16CodeUnit".'
  name: stringIndexType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StringIndexType">]
- description: 'The FHIR Spec version that the result will use to format the fhirBundle.
    For

    additional information see [https://www.hl7.org/fhir/overview.html](https://www.hl7.org/fhir/overview.html).
    "4.0.1"'
  name: fhirVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FhirVersion">]
- description: 'Document type that can be provided as input for Fhir Documents. Expect
    to

    have fhirVersion provided when used. Behavior of using None enum is the same as
    not using the

    documentType parameter. Known values are: "None", "ClinicalTrial", "DischargeSummary",

    "ProgressNote", "HistoryAndPhysical", "Consult", "Imaging", "Pathology", and "ProcedureNote".'
  name: documentType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthcareDocumentType">]
