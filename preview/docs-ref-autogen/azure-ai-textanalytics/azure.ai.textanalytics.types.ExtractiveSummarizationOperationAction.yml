  task.
constructor:
  syntax: ExtractiveSummarizationOperationAction()
variables:
- description: task name.
  name: taskName
  types:
  - <xref:str>
- description: 'The Extractive Summarization kind of the long running task. Required.
    Extractive

    summarization task.'
  name: kind
