### YamlMime:PythonClass
uid: azure.ai.textanalytics.types.EntitiesActionContent
name: EntitiesActionContent
fullName: azure.ai.textanalytics.types.EntitiesActionContent
module: azure.ai.textanalytics.types
summary: Supported parameters for an Entity Recognition task.
constructor:
  syntax: EntitiesActionContent()
variables:
- description: logging opt out.
  name: loggingOptOut
  types:
  - <xref:bool>
- description: model version.
  name: modelVersion
  types:
  - <xref:str>
- description: '(Optional) parameter to provide the string index type used to interpret

    string offsets. Defaults to TextElements (Graphemes). Known values are: "TextElements_v8",

    "UnicodeCodePoint", and "Utf16CodeUnit".'
  name: stringIndexType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StringIndexType">]
- description: '(Optional) request parameter that limits the output to the requested

    entity types included in this list. We will apply inclusionList before exclusionList.'
  name: inclusionList
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"EntityCategory">]]
- description: '(Optional) request parameter that filters out any entities that are

    included the excludeList. When a user specifies an excludeList, they cannot get
    a prediction

    returned with an entity in that list. We will apply inclusionList before exclusionList.'
  name: exclusionList
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"EntityCategory">]]
- description: '(Optional) describes the type of overlap policy to apply to the ner

    output.'
  name: overlapPolicy
  types:
  - <xref:<xref:"EntityOverlapPolicy">>
- description: '(Optional) request parameter that allows the user to provide settings

    for running the inference.'
  name: inferenceOptions
  types:
  - <xref:<xref:"EntityInferenceConfig">>
methods:
- uid: azure.ai.textanalytics.types.EntitiesActionContent.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.ai.textanalytics.types.EntitiesActionContent.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.ai.textanalytics.types.EntitiesActionContent.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.ai.textanalytics.types.EntitiesActionContent.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.textanalytics.types.EntitiesActionContent.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.ai.textanalytics.types.EntitiesActionContent.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.ai.textanalytics.types.EntitiesActionContent.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.ai.textanalytics.types.EntitiesActionContent.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.ai.textanalytics.types.EntitiesActionContent.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.textanalytics.types.EntitiesActionContent.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.ai.textanalytics.types.EntitiesActionContent.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.ai.textanalytics.types.EntitiesActionContent.exclusionList
  name: exclusionList
  summary: '(Optional) request parameter that filters out any entities that are included
    the excludeList.

    When a user specifies an excludeList, they cannot get a prediction returned with
    an entity in

    that list. We will apply inclusionList before exclusionList.'
  signature: 'exclusionList: list[typing.Union[str, ForwardRef(''EntityCategory'')]]'
- uid: azure.ai.textanalytics.types.EntitiesActionContent.inclusionList
  name: inclusionList
  summary: '(Optional) request parameter that limits the output to the requested entity
    types included in

    this list. We will apply inclusionList before exclusionList.'
  signature: 'inclusionList: list[typing.Union[str, ForwardRef(''EntityCategory'')]]'
- uid: azure.ai.textanalytics.types.EntitiesActionContent.inferenceOptions
  name: inferenceOptions
  summary: '(Optional) request parameter that allows the user to provide settings
    for running the

    inference.'
  signature: 'inferenceOptions: EntityInferenceConfig'
- uid: azure.ai.textanalytics.types.EntitiesActionContent.loggingOptOut
  name: loggingOptOut
  summary: logging opt out.
  signature: 'loggingOptOut: bool'
- uid: azure.ai.textanalytics.types.EntitiesActionContent.modelVersion
  name: modelVersion
  summary: model version.
  signature: 'modelVersion: str'
- uid: azure.ai.textanalytics.types.EntitiesActionContent.overlapPolicy
  name: overlapPolicy
  summary: (Optional) describes the type of overlap policy to apply to the ner output.
  signature: 'overlapPolicy: EntityOverlapPolicy'
- uid: azure.ai.textanalytics.types.EntitiesActionContent.stringIndexType
  name: stringIndexType
  summary: '(Optional) parameter to provide the string index type used to interpret
    string offsets.

    Defaults to TextElements (Graphemes). Known values are: "TextElements_v8",

    "UnicodeCodePoint", and "Utf16CodeUnit".'
  signature: 'stringIndexType: str | StringIndexType'
