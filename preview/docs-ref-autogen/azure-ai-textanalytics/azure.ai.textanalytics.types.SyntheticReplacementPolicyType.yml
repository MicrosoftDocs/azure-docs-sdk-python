### YamlMime:PythonClass
uid: azure.ai.textanalytics.types.SyntheticReplacementPolicyType
name: SyntheticReplacementPolicyType
fullName: azure.ai.textanalytics.types.SyntheticReplacementPolicyType
module: azure.ai.textanalytics.types
summary: Represents the policy of replacing detected PII with synthetic values.
constructor:
  syntax: SyntheticReplacementPolicyType()
variables:
- description: '(Optional) describes the PII categories to which the redaction policy
    will

    be applied. If not specified, the redaction policy will be applied to all PII
    categories.'
  name: entityTypes
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"PiiCategoriesExclude">]]
- description: (Optional) name of the redaction policy for identification purposes.
  name: policyName
  types:
  - <xref:str>
- description: '(Optional) flag to indicate whether this redaction policy is the default

    policy to be applied when no specific policy is defined for a PII category. Only
    one policy can

    be marked as default.'
  name: isDefault
  types:
  - <xref:bool>
- description: 'The entity RedactionPolicy object kind. Required. Replace detected
    entities

    with synthetic values.'
  name: policyKind
  types:
  - <xref:typing.Literal>[RedactionPolicyKind.SYNTHETIC_REPLACEMENT]
- description: 'Optional flag to indicate whether to preserve the original data

    format in the synthetic replacement. Default is false.'
  name: preserveDataFormat
  types:
  - <xref:bool>
