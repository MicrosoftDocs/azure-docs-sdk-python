  name: entityTypes
  summary: '(Optional) describes the PII categories to which the redaction policy
    will be applied. If not

    specified, the redaction policy will be applied to all PII categories.'
  signature: 'entityTypes: list[typing.Union[str, ForwardRef(''PiiCategoriesExclude'')]]'
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.isDefault
  name: isDefault
  summary: '(Optional) flag to indicate whether this redaction policy is the default
    policy to be applied

    when no specific policy is defined for a PII category. Only one policy can be
    marked as

    default.'
  signature: 'isDefault: bool'
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.policyKind
  name: policyKind
  summary: 'The entity RedactionPolicy object kind. Required. React detected entities
    with redaction

    character.'
  signature: 'policyKind: CHARACTER_MASK: ''characterMask''>]]'
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.policyName
  name: policyName
  summary: (Optional) name of the redaction policy for identification purposes.
  signature: 'policyName: str'
