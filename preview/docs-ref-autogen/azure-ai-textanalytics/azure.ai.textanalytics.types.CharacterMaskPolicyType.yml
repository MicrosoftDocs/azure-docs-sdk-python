### YamlMime:PythonClass
uid: azure.ai.textanalytics.types.CharacterMaskPolicyType
name: CharacterMaskPolicyType
fullName: azure.ai.textanalytics.types.CharacterMaskPolicyType
module: azure.ai.textanalytics.types
summary: Represents the policy of redacting with a redaction character.
constructor:
  syntax: CharacterMaskPolicyType()
variables:
- description: '(Optional) describes the PII categories to which the redaction policy
    will

    be applied. If not specified, the redaction policy will be applied to all PII
    categories.'
  name: entityTypes
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"PiiCategoriesExclude">]]
- description: (Optional) name of the redaction policy for identification purposes.
  name: policyName
  types:
  - <xref:str>
- description: '(Optional) flag to indicate whether this redaction policy is the default

    policy to be applied when no specific policy is defined for a PII category. Only
    one policy can

    be marked as default.'
  name: isDefault
  types:
  - <xref:bool>
- description: 'The entity RedactionPolicy object kind. Required. React detected entities

    with redaction character.'
  name: policyKind
  types:
  - <xref:typing.Literal>[RedactionPolicyKind.CHARACTER_MASK]
- description: 'Optional parameter to use a Custom Character to be used for redaction

    in PII responses. Default character will bce * as before. We allow specific ascii
    characters

    for redaction. Known values are: "!", "#", "$", "%", "&", "*", "+", "-", "=",
    "?", "@", "^",

    "_", and "~".'
  name: redactionCharacter
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RedactionCharacter">]
- description: 'Optional parameter to indicate the length of unmasked characters at
    the end

    of the redacted PII entity. Default is 0.'
  name: unmaskLength
  types:
  - <xref:int>
- description: 'Optional parameter to indicate whether to unmask characters from the
    end

    of the redacted PII entity. Default is true.'
  name: unmaskFromEnd
  types:
  - <xref:bool>
methods:
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
