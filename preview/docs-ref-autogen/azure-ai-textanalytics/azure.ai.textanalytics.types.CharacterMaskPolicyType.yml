  name: redactionCharacter
  summary: 'Optional parameter to use a Custom Character to be used for redaction
    in PII responses. Default

    character will bce * as before. We allow specific ascii characters for redaction.
    Known values

    are: "!", "#", "$", "%", "&", "*", "+", "-", "=", "?", "@", "^", "_",

    and "~".'
  signature: 'redactionCharacter: str | RedactionCharacter'
- uid: azure.ai.textanalytics.types.CharacterMaskPolicyType.unmaskFromEnd
  name: unmaskFromEnd
  summary: 'Optional parameter to indicate whether to unmask characters from the end
