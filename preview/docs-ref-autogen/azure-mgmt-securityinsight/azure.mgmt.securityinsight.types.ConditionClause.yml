### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.ConditionClause
name: ConditionClause
fullName: azure.mgmt.securityinsight.types.ConditionClause
module: azure.mgmt.securityinsight.types
summary: Represents a single clause to be evaluated by a NormalizedCondition.
constructor:
  syntax: ConditionClause()
variables:
- description: 'The connective used to join all values in this ConditionClause. Known

    values are: "And" and "Or".'
  name: clauseConnective
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Connective">]
- description: The name of the field that is evaluated. Required.
  name: field
  types:
  - <xref:str>
- description: 'Represents an operator in a ConditionClause. Required. Known values
    are:

    "Equals", "NotEquals", "LessThan", "LessThanEqual", "GreaterThan", "GreaterThanEqual",

    "StringContains", "StringNotContains", "StringStartsWith", "StringNotStartsWith",

    "StringEndsWith", "StringNotEndsWith", "StringIsEmpty", "IsNull", "IsTrue", "IsFalse",

    "ArrayContains", "ArrayNotContains", "OnOrAfterRelative", "AfterRelative",

    "OnOrBeforeRelative", "BeforeRelative", "OnOrAfterAbsolute", "AfterAbsolute",

    "OnOrBeforeAbsolute", and "BeforeAbsolute".'
  name: operator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Operator">]
- description: The top level connective operator for this condition. Required.
  name: values
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.securityinsight.types.ConditionClause.clauseConnective
  name: clauseConnective
  summary: '"And" and

    "Or".'
  signature: 'clauseConnective: str | Connective'
- uid: azure.mgmt.securityinsight.types.ConditionClause.field
  name: field
  summary: The name of the field that is evaluated. Required.
  signature: 'field: Required[str]'
- uid: azure.mgmt.securityinsight.types.ConditionClause.operator
  name: operator
  summary: '"Equals",

    "NotEquals", "LessThan", "LessThanEqual", "GreaterThan", "GreaterThanEqual",

    "StringContains", "StringNotContains", "StringStartsWith", "StringNotStartsWith",

    "StringEndsWith", "StringNotEndsWith", "StringIsEmpty", "IsNull", "IsTrue",

    "IsFalse", "ArrayContains", "ArrayNotContains", "OnOrAfterRelative", "AfterRelative",

    "OnOrBeforeRelative", "BeforeRelative", "OnOrAfterAbsolute", "AfterAbsolute",

    "OnOrBeforeAbsolute", and "BeforeAbsolute".'
  signature: 'operator: Required[str | Operator]'
