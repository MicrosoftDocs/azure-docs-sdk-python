### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.ScheduledAlertRuleProperties
name: ScheduledAlertRuleProperties
fullName: azure.mgmt.securityinsight.types.ScheduledAlertRuleProperties
module: azure.mgmt.securityinsight.types
summary: Scheduled alert rule base property bag.
constructor:
  syntax: ScheduledAlertRuleProperties()
variables:
- description: The query that creates alerts for this rule.
  name: query
  types:
  - <xref:str>
- description: The frequency (in ISO 8601 duration format) for this alert rule to
    run.
  name: queryFrequency
  types:
  - <xref:str>
- description: The period (in ISO 8601 duration format) that this alert rule looks
    at.
  name: queryPeriod
  types:
  - <xref:str>
- description: 'The severity for alerts created by this alert rule. Known values are:
    "High",

    "Medium", "Low", and "Informational".'
  name: severity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AlertSeverity">]
- description: 'The operation against the threshold that triggers alert rule. Known

    values are: "GreaterThan", "LessThan", "Equal", and "NotEqual".'
  name: triggerOperator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TriggerOperator">]
- description: The threshold triggers this alert rule.
  name: triggerThreshold
  types:
  - <xref:int>
- description: The event grouping settings.
  name: eventGroupingSettings
  types:
  - <xref:<xref:"EventGroupingSettings">>
- description: 'Dictionary of string key-value pairs of columns to be attached to
    the

    alert.'
  name: customDetails
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Array of the entity mappings of the alert rule.
  name: entityMappings
  types:
  - <xref:list>[<xref:"EntityMapping">]
- description: The alert details override settings.
  name: alertDetailsOverride
  types:
  - <xref:<xref:"AlertDetailsOverride">>
- description: Array of the sentinel entity mappings of the alert rule.
  name: sentinelEntitiesMappings
  types:
  - <xref:list>[<xref:"SentinelEntityMapping">]
- description: The Name of the alert rule template used to create this rule.
  name: alertRuleTemplateName
  types:
  - <xref:str>
- description: 'The version of the alert rule template used to create this rule -
    in

    format <a.b.c>, where all are numbers, for example 0 <1.0.2>.'
  name: templateVersion
  types:
  - <xref:str>
- description: The description of the alert rule.
  name: description
  types:
  - <xref:str>
- description: The display name for alerts created by this alert rule. Required.
  name: displayName
  types:
  - <xref:str>
- description: Determines whether this alert rule is enabled or disabled. Required.
  name: enabled
  types:
  - <xref:bool>
- description: The last time that this alert rule has been modified.
  name: lastModifiedUtc
  types:
  - <xref:str>
- description: 'The suppression (in ISO 8601 duration format) to wait since last

    time this alert rule been triggered. Required.'
  name: suppressionDuration
  types:
  - <xref:str>
- description: 'Determines whether the suppression for this alert rule is enabled
    or

    disabled. Required.'
  name: suppressionEnabled
  types:
  - <xref:bool>
- description: The tactics of the alert rule.
  name: tactics
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"AttackTactic">]]
- description: The techniques of the alert rule.
  name: techniques
  types:
  - <xref:list>[<xref:str>]
- description: The sub-techniques of the alert rule.
  name: subTechniques
  types:
  - <xref:list>[<xref:str>]
- description: 'The settings of the incidents that created from alerts triggered

    by this analytics rule.'
  name: incidentConfiguration
  types:
  - <xref:<xref:"IncidentConfiguration">>
attributes:
