### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.RepositoryAccess
name: RepositoryAccess
fullName: azure.mgmt.securityinsight.types.RepositoryAccess
module: azure.mgmt.securityinsight.types
summary: Credentials to access repository.
constructor:
  syntax: RepositoryAccess()
variables:
- description: 'The kind of repository access credentials. Required. Known values
    are: "OAuth",

    "PAT", and "App".'
  name: kind
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RepositoryAccessKind">]
- description: OAuth Code. Required when `kind` is `OAuth`.
  name: code
  types:
  - <xref:str>
- description: OAuth State. Required when `kind` is `OAuth`.
  name: state
  types:
  - <xref:str>
- description: OAuth ClientId. Required when `kind` is `OAuth`.
  name: clientId
  types:
  - <xref:str>
- description: Personal Access Token. Required when `kind` is `PAT`.
  name: token
  types:
  - <xref:str>
- description: 'Application installation ID. Required when `kind` is `App`. Supported

    by `GitHub` only.'
  name: installationId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.securityinsight.types.RepositoryAccess.clientId
  name: clientId
  summary: OAuth ClientId. Required when `kind` is `OAuth`.
  signature: 'clientId: str'
- uid: azure.mgmt.securityinsight.types.RepositoryAccess.code
  name: code
  summary: OAuth Code. Required when `kind` is `OAuth`.
  signature: 'code: str'
- uid: azure.mgmt.securityinsight.types.RepositoryAccess.installationId
  name: installationId
  summary: Application installation ID. Required when `kind` is `App`. Supported by
    `GitHub` only.
  signature: 'installationId: str'
- uid: azure.mgmt.securityinsight.types.RepositoryAccess.kind
  name: kind
  summary: '"OAuth", "PAT", and

    "App".'
  signature: 'kind: Required[str | RepositoryAccessKind]'
- uid: azure.mgmt.securityinsight.types.RepositoryAccess.state
  name: state
  summary: OAuth State. Required when `kind` is `OAuth`.
  signature: 'state: str'
- uid: azure.mgmt.securityinsight.types.RepositoryAccess.token
  name: token
  summary: Personal Access Token. Required when `kind` is `PAT`.
  signature: 'token: str'
