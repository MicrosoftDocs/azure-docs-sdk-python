### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.MetadataProperties
name: MetadataProperties
fullName: azure.mgmt.securityinsight.types.MetadataProperties
module: azure.mgmt.securityinsight.types
summary: Metadata property bag.
constructor:
  syntax: MetadataProperties()
variables:
- description: 'Static ID for the content.  Used to identify dependencies and content
    from

    solutions or community.  Hard-coded/static for out of the box content and solutions.
    Can be

    optionally set for user created content to define dependencies.  If an active
    content item is

    made from a template, both will have the same contentId.'
  name: contentId
  types:
  - <xref:str>
- description: 'Full parent resource ID of the content item the metadata is for.  This
    is the

    full resource ID including the scope (subscription and resource group). Required.'
  name: parentId
  types:
  - <xref:str>
- description: 'Version of the content.  Default and recommended format is numeric
    (e.g. 1, 1.0,

    1.0.0, 1.0.0.0), following ARM template best practices.  Can also be any string,
    but then we

    cannot guarantee any version checks.'
  name: version
  types:
  - <xref:str>
- description: The kind of content the metadata is for. Required.
  name: kind
  types:
  - <xref:str>
- description: Source of the content.  This is where/how it was created.
  name: source
  types:
  - <xref:<xref:"MetadataSource">>
- description: The creator of the content item.
  name: author
  types:
  - <xref:<xref:"MetadataAuthor">>
- description: Support information for the metadata - type, name, contact information.
  name: support
  types:
  - <xref:<xref:"MetadataSupport">>
- description: 'Dependencies for the content item, what other content items it requires
    to

    work.  Can describe more complex dependencies using a recursive/nested structure.
    For a single

    dependency an id/kind/version can be supplied or operator/criteria for complex
    formats.'
  name: dependencies
  types:
  - <xref:<xref:"MetadataDependencies">>
- description: Categories for the solution content item.
  name: categories
  types:
  - <xref:<xref:"MetadataCategories">>
- description: Providers for the solution content item.
  name: providers
  types:
  - <xref:list>[<xref:str>]
- description: first publish date of solution content item.
  name: firstPublishDate
  types:
  - <xref:str>
- description: last publish date of solution content item.
  name: lastPublishDate
  types:
  - <xref:str>
- description: The custom version of the content. A optional free text.
  name: customVersion
  types:
  - <xref:str>
- description: 'Schema version of the content. Can be used to distinguish between

    different flow based on the schema version.'
  name: contentSchemaVersion
  types:
  - <xref:str>
- description: the icon identifier. this id can later be fetched from the solution
    template.
  name: icon
  types:
  - <xref:str>
- description: the tactics the resource covers.
  name: threatAnalysisTactics
  types:
  - <xref:list>[<xref:str>]
- description: 'the techniques the resource covers, these have to be aligned

    with the tactics being used.'
  name: threatAnalysisTechniques
  types:
  - <xref:list>[<xref:str>]
- description: preview image file names. These will be taken from the solution artifacts.
  name: previewImages
  types:
  - <xref:list>[<xref:str>]
- description: 'preview image file names. These will be taken from the solution

    artifacts. used for dark theme support.'
  name: previewImagesDark
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.securityinsight.types.MetadataProperties.author
  name: author
  summary: The creator of the content item.
  signature: 'author: MetadataAuthor'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.categories
  name: categories
  summary: Categories for the solution content item.
  signature: 'categories: MetadataCategories'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.contentId
  name: contentId
  summary: 'Static ID for the content.  Used to identify dependencies and content
    from solutions or

    community.  Hard-coded/static for out of the box content and solutions. Can be
    optionally set

    for user created content to define dependencies.  If an active content item is
    made from a

    template, both will have the same contentId.'
  signature: 'contentId: str'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.contentSchemaVersion
  name: contentSchemaVersion
  summary: 'Schema version of the content. Can be used to distinguish between different
    flow based on the

    schema version.'
  signature: 'contentSchemaVersion: str'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.customVersion
  name: customVersion
  summary: The custom version of the content. A optional free text.
  signature: 'customVersion: str'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.dependencies
  name: dependencies
  summary: 'Dependencies for the content item, what other content items it requires
    to work.  Can describe

    more complex dependencies using a recursive/nested structure. For a single dependency
    an

    id/kind/version can be supplied or operator/criteria for complex formats.'
  signature: 'dependencies: MetadataDependencies'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.firstPublishDate
  name: firstPublishDate
  summary: first publish date of solution content item.
  signature: 'firstPublishDate: str'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.icon
  name: icon
  summary: the icon identifier. this id can later be fetched from the solution template.
  signature: 'icon: str'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.kind
  name: kind
  summary: The kind of content the metadata is for. Required.
  signature: 'kind: str'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.lastPublishDate
  name: lastPublishDate
  summary: last publish date of solution content item.
  signature: 'lastPublishDate: str'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.parentId
  name: parentId
  summary: 'Full parent resource ID of the content item the metadata is for.  This
    is the full resource ID

    including the scope (subscription and resource group). Required.'
  signature: 'parentId: str'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.previewImages
  name: previewImages
  summary: preview image file names. These will be taken from the solution artifacts.
  signature: 'previewImages: list[str]'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.previewImagesDark
  name: previewImagesDark
  summary: 'preview image file names. These will be taken from the solution artifacts.
    used for dark theme

    support.'
  signature: 'previewImagesDark: list[str]'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.providers
  name: providers
  summary: Providers for the solution content item.
  signature: 'providers: list[str]'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.source
  name: source
  summary: Source of the content.  This is where/how it was created.
  signature: 'source: MetadataSource'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.support
  name: support
  summary: Support information for the metadata - type, name, contact information.
  signature: 'support: MetadataSupport'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.threatAnalysisTactics
  name: threatAnalysisTactics
  summary: the tactics the resource covers.
  signature: 'threatAnalysisTactics: list[str]'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.threatAnalysisTechniques
  name: threatAnalysisTechniques
  summary: the techniques the resource covers, these have to be aligned with the tactics
    being used.
  signature: 'threatAnalysisTechniques: list[str]'
- uid: azure.mgmt.securityinsight.types.MetadataProperties.version
  name: version
  summary: 'Version of the content.  Default and recommended format is numeric (e.g.
    1, 1.0, 1.0.0,

    1.0.0.0), following ARM template best practices.  Can also be any string, but
    then we cannot

    guarantee any version checks.'
  signature: 'version: str'
