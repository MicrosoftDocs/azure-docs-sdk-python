### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.GroupingConfiguration
name: GroupingConfiguration
fullName: azure.mgmt.securityinsight.types.GroupingConfiguration
module: azure.mgmt.securityinsight.types
summary: Grouping configuration property bag.
constructor:
  syntax: GroupingConfiguration()
variables:
- description: Grouping enabled. Required.
  name: enabled
  types:
  - <xref:bool>
- description: Re-open closed matching incidents. Required.
  name: reopenClosedIncident
  types:
  - <xref:bool>
- description: 'Limit the group to alerts created within the lookback duration (in
    ISO

    8601 duration format). Required.'
  name: lookbackDuration
  types:
  - <xref:str>
- description: 'Grouping matching method. When method is Selected at least one of

    groupByEntities, groupByAlertDetails, groupByCustomDetails must be provided and
    not empty.

    Required. Known values are: "AllEntities", "AnyAlert", and "Selected".'
  name: matchingMethod
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MatchingMethod">]
- description: 'A list of entity types to group by (when matchingMethod is Selected).

    Only entities defined in the current alert rule may be used.'
  name: groupByEntities
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"EntityMappingType">]]
- description: 'A list of alert details to group by (when matchingMethod is

    Selected).'
  name: groupByAlertDetails
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"AlertDetail">]]
- description: 'A list of custom details keys to group by (when matchingMethod is

    Selected). Only keys defined in the current alert rule may be used.'
  name: groupByCustomDetails
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.securityinsight.types.GroupingConfiguration.enabled
  name: enabled
  summary: Grouping enabled. Required.
  signature: 'enabled: Required[bool]'
- uid: azure.mgmt.securityinsight.types.GroupingConfiguration.groupByAlertDetails
  name: groupByAlertDetails
  summary: A list of alert details to group by (when matchingMethod is Selected).
  signature: 'groupByAlertDetails: list[typing.Union[str, ForwardRef(''AlertDetail'')]]'
- uid: azure.mgmt.securityinsight.types.GroupingConfiguration.groupByCustomDetails
  name: groupByCustomDetails
  summary: 'A list of custom details keys to group by (when matchingMethod is Selected).
    Only keys defined

    in the current alert rule may be used.'
  signature: 'groupByCustomDetails: list[str]'
- uid: azure.mgmt.securityinsight.types.GroupingConfiguration.groupByEntities
  name: groupByEntities
  summary: 'A list of entity types to group by (when matchingMethod is Selected).
    Only entities defined in

    the current alert rule may be used.'
  signature: 'groupByEntities: list[typing.Union[str, ForwardRef(''EntityMappingType'')]]'
- uid: azure.mgmt.securityinsight.types.GroupingConfiguration.lookbackDuration
  name: lookbackDuration
  summary: 'Limit the group to alerts created within the lookback duration (in ISO
    8601 duration format).

    Required.'
  signature: 'lookbackDuration: Required[str]'
- uid: azure.mgmt.securityinsight.types.GroupingConfiguration.matchingMethod
  name: matchingMethod
  summary: 'Grouping matching method. When method is Selected at least one of groupByEntities,

    groupByAlertDetails, groupByCustomDetails must be provided and not empty. Required.
    Known

    values are: "AllEntities", "AnyAlert", and "Selected".'
  signature: 'matchingMethod: Required[str | MatchingMethod]'
- uid: azure.mgmt.securityinsight.types.GroupingConfiguration.reopenClosedIncident
  name: reopenClosedIncident
  summary: Re-open closed matching incidents. Required.
  signature: 'reopenClosedIncident: Required[bool]'
