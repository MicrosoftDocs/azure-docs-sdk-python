### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.FileImportProperties
name: FileImportProperties
fullName: azure.mgmt.securityinsight.types.FileImportProperties
module: azure.mgmt.securityinsight.types
summary: Describes the FileImport's properties.
constructor:
  syntax: FileImportProperties()
variables:
- description: 'Describes how to ingest the records in the file. Required. Known values

    are: "IngestOnlyIfAllAreValid", "IngestAnyValidRecords", and "Unspecified".'
  name: ingestionMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IngestionMode">]
- description: 'The content type of this file. Required. Known values are: "BasicIndicator",

    "StixIndicator", and "Unspecified".'
  name: contentType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FileImportContentType">]
- description: The time the file was imported.
  name: createdTimeUTC
  types:
  - <xref:str>
- description: 'Represents the error file (if the import was ingested with errors
    or failed

    the validation).'
  name: errorFile
  types:
  - <xref:<xref:"FileMetadata">>
- description: 'An ordered list of some of the errors that were encountered during

    validation.'
  name: errorsPreview
  types:
  - <xref:list>[<xref:"ValidationError">]
- description: Represents the imported file. Required.
  name: importFile
  types:
  - <xref:<xref:"FileMetadata">>
- description: The number of records that have been successfully ingested.
  name: ingestedRecordCount
  types:
  - <xref:int>
- description: The source for the data in the file. Required.
  name: source
  types:
  - <xref:str>
- description: 'The state of the file import. Known values are: "FatalError", "Ingested",

    "IngestedWithErrors", "InProgress", "Invalid", "WaitingForUpload", and "Unspecified".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FileImportState">]
- description: The number of records in the file.
  name: totalRecordCount
  types:
  - <xref:int>
- description: The number of records that have passed validation.
  name: validRecordCount
  types:
  - <xref:int>
- description: 'The time the files associated with this import are deleted from

    the storage account.'
  name: filesValidUntilTimeUTC
  types:
  - <xref:str>
- description: 'The time the file import record is soft deleted from the

    database and history.'
  name: importValidUntilTimeUTC
  types:
  - <xref:str>
attributes:
