### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.MetadataDependencies
name: MetadataDependencies
fullName: azure.mgmt.securityinsight.types.MetadataDependencies
module: azure.mgmt.securityinsight.types
summary: 'Dependencies for the content item, what other content items it requires
  to work.  Can describe

  more complex dependencies using a recursive/nested structure. For a single dependency
  an

  id/kind/version can be supplied or operator/criteria for complex dependencies.'
constructor:
  syntax: MetadataDependencies()
variables:
- description: Id of the content item we depend on.
  name: contentId
  types:
  - <xref:str>
- description: 'Type of the content item we depend on. Known values are: "DataConnector",

    "DataType", "Workbook", "WorkbookTemplate", "Playbook", "PlaybookTemplate",

    "AnalyticsRuleTemplate", "AnalyticsRule", "HuntingQuery", "InvestigationQuery",
    "Parser",

    "Watchlist", "WatchlistTemplate", "Solution", "AzureFunction", "LogicAppsCustomConnector",

    "AutomationRule", "ResourcesDataConnector", "Notebook", "Standalone", "SummaryRule",
    and

    "CustomDetection".'
  name: kind
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Kind">]
- description: 'Version of the the content item we depend on.  Can be blank, * or
    missing to

    indicate any version fulfills the dependency.  If version does not match our defined
    numeric

    format then an exact match is required.'
  name: version
  types:
  - <xref:str>
- description: Name of the content item.
  name: name
  types:
  - <xref:str>
- description: 'Operator used for list of dependencies in criteria array. Known values
    are:

    "AND" and "OR".'
  name: operator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MetadataDependencyOperator">]
- description: 'This is the list of dependencies we must fulfill, according to the
    AND/OR

    operator.'
  name: criteria
  types:
  - <xref:list>[<xref:"MetadataDependencies">]
attributes:
- uid: azure.mgmt.securityinsight.types.MetadataDependencies.contentId
  name: contentId
  summary: Id of the content item we depend on.
  signature: 'contentId: str'
- uid: azure.mgmt.securityinsight.types.MetadataDependencies.criteria
  name: criteria
  summary: This is the list of dependencies we must fulfill, according to the AND/OR
    operator.
  signature: 'criteria: list[''MetadataDependencies'']'
- uid: azure.mgmt.securityinsight.types.MetadataDependencies.kind
  name: kind
  summary: '"DataConnector", "DataType",

    "Workbook", "WorkbookTemplate", "Playbook", "PlaybookTemplate",

    "AnalyticsRuleTemplate", "AnalyticsRule", "HuntingQuery", "InvestigationQuery",

    "Parser", "Watchlist", "WatchlistTemplate", "Solution", "AzureFunction",

    "LogicAppsCustomConnector", "AutomationRule", "ResourcesDataConnector", "Notebook",

    "Standalone", "SummaryRule", and "CustomDetection".'
  signature: 'kind: str | Kind'
- uid: azure.mgmt.securityinsight.types.MetadataDependencies.name
  name: name
  summary: Name of the content item.
  signature: 'name: str'
- uid: azure.mgmt.securityinsight.types.MetadataDependencies.operator
  name: operator
  summary: '"AND" and "OR".'
  signature: 'operator: str | MetadataDependencyOperator'
- uid: azure.mgmt.securityinsight.types.MetadataDependencies.version
  name: version
  summary: 'Version of the the content item we depend on.  Can be blank, * or missing
    to indicate any

    version fulfills the dependency.  If version does not match our defined numeric
    format then an

    exact match is required.'
  signature: 'version: str'
