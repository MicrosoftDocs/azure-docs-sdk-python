### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.FusionSourceSubTypeSetting
name: FusionSourceSubTypeSetting
fullName: azure.mgmt.securityinsight.types.FusionSourceSubTypeSetting
module: azure.mgmt.securityinsight.types
summary: Represents a supported source subtype configuration under a source signal
  in Fusion detection.
constructor:
  syntax: FusionSourceSubTypeSetting()
variables:
- description: 'Determines whether this source subtype under source signal is enabled
    or

    disabled in Fusion detection. Required.'
  name: enabled
  types:
  - <xref:bool>
- description: 'The Name of the source subtype under a given source signal in Fusion

    detection. Refer to Fusion alert rule template for supported values. Required.'
  name: sourceSubTypeName
  types:
  - <xref:str>
- description: 'The display name of source subtype under a source signal

    consumed in Fusion detection.'
  name: sourceSubTypeDisplayName
  types:
  - <xref:str>
- description: 'Severity configuration for a source subtype consumed in fusion

    detection. Required.'
  name: severityFilters
  types:
  - <xref:<xref:"FusionSubTypeSeverityFilter">>
attributes:
- uid: azure.mgmt.securityinsight.types.FusionSourceSubTypeSetting.enabled
  name: enabled
  summary: 'Determines whether this source subtype under source signal is enabled
    or disabled in Fusion

    detection. Required.'
  signature: 'enabled: bool'
- uid: azure.mgmt.securityinsight.types.FusionSourceSubTypeSetting.severityFilters
  name: severityFilters
  summary: Severity configuration for a source subtype consumed in fusion detection.
    Required.
  signature: 'severityFilters: FusionSubTypeSeverityFilter'
- uid: azure.mgmt.securityinsight.types.FusionSourceSubTypeSetting.sourceSubTypeDisplayName
  name: sourceSubTypeDisplayName
  summary: The display name of source subtype under a source signal consumed in Fusion
    detection.
  signature: 'sourceSubTypeDisplayName: str'
- uid: azure.mgmt.securityinsight.types.FusionSourceSubTypeSetting.sourceSubTypeName
  name: sourceSubTypeName
  summary: 'The Name of the source subtype under a given source signal in Fusion detection.
    Refer to Fusion

    alert rule template for supported values. Required.'
  signature: 'sourceSubTypeName: str'
