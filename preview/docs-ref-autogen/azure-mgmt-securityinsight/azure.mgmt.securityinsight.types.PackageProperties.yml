### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.PackageProperties
name: PackageProperties
fullName: azure.mgmt.securityinsight.types.PackageProperties
module: azure.mgmt.securityinsight.types
summary: Describes package properties.
constructor:
  syntax: PackageProperties()
variables:
- description: The content id of the package.
  name: contentId
  types:
  - <xref:str>
- description: 'Unique ID for the content. It should be generated based on the

    contentId, contentKind and the contentVersion of the package.'
  name: contentProductId
  types:
  - <xref:str>
- description: 'The package kind. Known values are: "Solution" and "Standalone".'
  name: contentKind
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PackageKind">]
- description: The version of the content schema.
  name: contentSchemaVersion
  types:
  - <xref:str>
- description: 'Flag indicates if this is a newly published package. Known values
    are: "true" and

    "false".'
  name: isNew
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Flag">]
- description: 'Flag indicates if this package is in preview. Known values are: "true"
    and

    "false".'
  name: isPreview
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Flag">]
- description: 'Flag indicates if this package is among the featured list. Known values
    are:

    "true" and "false".'
  name: isFeatured
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Flag">]
- description: 'Flag indicates if this template is deprecated. Known values are: "true"
    and

    "false".'
  name: isDeprecated
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Flag">]
- description: the latest version number of the package.
  name: version
  types:
  - <xref:str>
- description: The display name of the package.
  name: displayName
  types:
  - <xref:str>
- description: The description of the package.
  name: description
  types:
  - <xref:str>
- description: The publisher display name of the package.
  name: publisherDisplayName
  types:
  - <xref:str>
- description: The source of the package.
  name: source
  types:
  - <xref:<xref:"MetadataSource">>
- description: The author of the package.
  name: author
  types:
  - <xref:<xref:"MetadataAuthor">>
- description: The support tier of the package.
  name: support
  types:
  - <xref:<xref:"MetadataSupport">>
- description: The support tier of the package.
  name: dependencies
  types:
  - <xref:<xref:"MetadataDependencies">>
- description: Providers for the package item.
  name: providers
  types:
  - <xref:list>[<xref:str>]
- description: first publish date package item.
  name: firstPublishDate
  types:
  - <xref:str>
- description: last publish date for the package item.
  name: lastPublishDate
  types:
  - <xref:str>
- description: The categories of the package.
  name: categories
  types:
  - <xref:<xref:"MetadataCategories">>
- description: the tactics the resource covers.
  name: threatAnalysisTactics
  types:
  - <xref:list>[<xref:str>]
- description: 'the techniques the resource covers, these have to be aligned

    with the tactics being used.'
  name: threatAnalysisTechniques
  types:
  - <xref:list>[<xref:str>]
- description: the icon identifier. this id can later be fetched from the content
    metadata.
  name: icon
  types:
  - <xref:str>
