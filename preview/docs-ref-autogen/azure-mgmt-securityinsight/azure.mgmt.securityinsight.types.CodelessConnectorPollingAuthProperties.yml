uid: azure.mgmt.securityinsight.types.CodelessConnectorPollingAuthProperties
name: CodelessConnectorPollingAuthProperties
fullName: azure.mgmt.securityinsight.types.CodelessConnectorPollingAuthProperties
module: azure.mgmt.securityinsight.types
summary: Describe the authentication properties needed to successfully authenticate
  with the server.
constructor:
  syntax: CodelessConnectorPollingAuthProperties()
variables:
- description: The authentication type. Required.
  name: authType
  types:
  - <xref:str>
- description: The header name which the token is sent with.
  name: apiKeyName
  types:
  - <xref:str>
- description: A prefix send in the header before the actual token.
  name: apiKeyIdentifier
  types:
  - <xref:str>
- description: Marks if the key should sent in header.
  name: isApiKeyInPostPayload
  types:
  - <xref:str>
- description: Describes the flow name, for example 'AuthCode' for Oauth 2.0.
  name: flowName
  types:
  - <xref:str>
- description: The endpoint used to issue a token, used in Oauth 2.0 flow.
  name: tokenEndpoint
  types:
  - <xref:str>
- description: The endpoint used to authorize the user, used in Oauth 2.0 flow.
  name: authorizationEndpoint
  types:
  - <xref:str>
- description: 'The query parameters used in authorization request,

    used in Oauth 2.0 flow.'
  name: authorizationEndpointQueryParameters
  types:
  - <xref:typing.Any>
- description: 'The redirect endpoint where we will get the authorization code, used

    in Oauth 2.0 flow.'
  name: redirectionEndpoint
  types:
  - <xref:str>
- description: The query headers used in token request, used in Oauth 2.0 flow.
  name: tokenEndpointHeaders
  types:
  - <xref:typing.Any>
- description: 'The query parameters used in token request, used in Oauth

    2.0 flow.'
  name: tokenEndpointQueryParameters
  types:
  - <xref:typing.Any>
- description: 'Marks if we should send the client secret in header or payload,

    used in Oauth 2.0 flow.'
  name: isClientSecretInHeader
  types:
  - <xref:bool>
- description: The OAuth token scope.
  name: scope
  types:
  - <xref:str>
