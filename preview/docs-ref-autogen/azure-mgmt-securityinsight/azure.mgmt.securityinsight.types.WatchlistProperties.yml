### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.WatchlistProperties
name: WatchlistProperties
fullName: azure.mgmt.securityinsight.types.WatchlistProperties
module: azure.mgmt.securityinsight.types
summary: Describes watchlist properties.
constructor:
  syntax: WatchlistProperties()
variables:
- description: The id (a Guid) of the watchlist.
  name: watchlistId
  types:
  - <xref:str>
- description: The display name of the watchlist. Required.
  name: displayName
  types:
  - <xref:str>
- description: The provider of the watchlist. Required.
  name: provider
  types:
  - <xref:str>
- description: The filename of the watchlist, called 'source'.
  name: source
  types:
  - <xref:str>
- description: 'The sourceType of the watchlist. Known values are: "Local" and

    "AzureStorage".'
  name: sourceType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SourceType">]
- description: The time the watchlist was created.
  name: created
  types:
  - <xref:str>
- description: The last time the watchlist was updated.
  name: updated
  types:
  - <xref:str>
- description: Describes a user that created the watchlist.
  name: createdBy
  types:
  - <xref:<xref:"UserInfo">>
- description: Describes a user that updated the watchlist.
  name: updatedBy
  types:
  - <xref:<xref:"UserInfo">>
- description: A description of the watchlist.
  name: description
  types:
  - <xref:str>
- description: The type of the watchlist.
  name: watchlistType
  types:
  - <xref:str>
- description: The alias of the watchlist.
  name: watchlistAlias
  types:
  - <xref:str>
- description: A flag that indicates if the watchlist is deleted or not.
  name: isDeleted
  types:
  - <xref:bool>
- description: List of labels relevant to this watchlist.
  name: labels
  types:
  - <xref:list>[<xref:str>]
- description: The default duration of a watchlist (in ISO 8601 duration format).
  name: defaultDuration
  types:
  - <xref:str>
- description: The tenantId where the watchlist belongs to.
  name: tenantId
  types:
  - <xref:str>
- description: The number of lines in a csv/tsv content to skip before the header.
  name: numberOfLinesToSkip
  types:
  - <xref:int>
- description: 'The raw content that represents to watchlist items to create. In case
    of

    csv/tsv content type, it''s the content of the file that will parsed by the endpoint.'
  name: rawContent
  types:
  - <xref:str>
- description: 'The search key is used to optimize query performance when using

    watchlists for joins with other data. For example, enable a column with IP addresses
    to be the

    designated SearchKey field, then use this field as the key field when joining
    to other event

    data by IP address. Required.'
  name: itemsSearchKey
  types:
  - <xref:str>
- description: 'The content type of the raw content. Example : text/csv or text/tsv.'
  name: contentType
  types:
  - <xref:str>
- description: 'The status of the Watchlist upload : New, InProgress or Complete.
    **Note**

    : When a Watchlist upload status is InProgress, the Watchlist cannot be deleted.'
  name: uploadStatus
  types:
  - <xref:str>
- description: 'Describes provisioning state. Known values are: "New", "InProgress",

    "Uploading", "Deleting", "Succeeded", "Failed", and "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WatchlistProvisioningState">]
