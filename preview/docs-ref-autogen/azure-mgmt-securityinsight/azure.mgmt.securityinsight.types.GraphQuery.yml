### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.GraphQuery
name: GraphQuery
fullName: azure.mgmt.securityinsight.types.GraphQuery
module: azure.mgmt.securityinsight.types
summary: The graph query to show the volume of data arriving into the workspace over
  time.
constructor:
  syntax: GraphQuery()
variables:
- description: 'Gets or sets the metric name that the query is checking. For example:
    ''Total

    data receive''. Required.'
  name: metricName
  types:
  - <xref:str>
- description: Gets or sets the legend for the graph. Required.
  name: legend
  types:
  - <xref:str>
- description: 'Gets or sets the base query for the graph. The base query is wrapped
    by

    Sentinel UI infra with a KQL query, that measures the volume over time. Required.'
  name: baseQuery
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.securityinsight.types.GraphQuery.baseQuery
  name: baseQuery
  summary: 'Gets or sets the base query for the graph. The base query is wrapped by
    Sentinel UI infra with

    a KQL query, that measures the volume over time. Required.'
  signature: 'baseQuery: str'
- uid: azure.mgmt.securityinsight.types.GraphQuery.legend
  name: legend
  summary: Gets or sets the legend for the graph. Required.
  signature: 'legend: str'
- uid: azure.mgmt.securityinsight.types.GraphQuery.metricName
  name: metricName
  summary: '''Total data receive''.

    Required.'
  signature: 'metricName: str'
