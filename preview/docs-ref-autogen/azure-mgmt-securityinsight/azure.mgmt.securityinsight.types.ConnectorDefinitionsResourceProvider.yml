uid: azure.mgmt.securityinsight.types.ConnectorDefinitionsResourceProvider
name: ConnectorDefinitionsResourceProvider
fullName: azure.mgmt.securityinsight.types.ConnectorDefinitionsResourceProvider
module: azure.mgmt.securityinsight.types
summary: 'The resource provider details include the required permissions for the user
  to create

  connections. The user should have the required permissions(ReadWrite, ..) in the
  specified

  scope ProviderPermissionsScope against the specified resource provider.'
