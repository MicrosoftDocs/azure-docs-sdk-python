    "Malware",

    "Process", "RegistryKey", "RegistryValue", "SecurityGroup", "URL", "IoTDevice",

    "SecurityAlert", "HuntingBookmark", "MailCluster", "MailMessage", "Mailbox", "SubmissionMail",

