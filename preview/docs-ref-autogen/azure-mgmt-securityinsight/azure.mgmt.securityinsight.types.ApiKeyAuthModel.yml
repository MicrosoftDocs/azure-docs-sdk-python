### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.ApiKeyAuthModel
name: ApiKeyAuthModel
fullName: azure.mgmt.securityinsight.types.ApiKeyAuthModel
module: azure.mgmt.securityinsight.types
summary: 'Model for authentication with the API Key. Will result in additional header
  on the request

  (default behavior) to the remote server: ''ApiKeyName: ApiKeyIdentifier ApiKey''.
  If

  ''IsApiKeyInPostPayload'' is true it will send it in the body of the request and
  not the header.'
constructor:
  syntax: ApiKeyAuthModel()
variables:
- description: API Key for the user secret key credential. Required.
  name: apiKey
  types:
  - <xref:str>
- description: API Key name. Required.
  name: apiKeyName
  types:
  - <xref:str>
- description: API Key Identifier.
  name: apiKeyIdentifier
  types:
  - <xref:str>
- description: Flag to indicate if API key is set in HTTP POST payload.
  name: isApiKeyInPostPayload
  types:
  - <xref:bool>
- description: The auth type. Required. APIKey.
  name: type
  types:
  - <xref:typing.Literal>[CcpAuthType.API_KEY]
attributes:
- uid: azure.mgmt.securityinsight.types.ApiKeyAuthModel.apiKey
  name: apiKey
  summary: API Key for the user secret key credential. Required.
  signature: 'apiKey: str'
