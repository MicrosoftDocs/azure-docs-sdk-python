  name: apiKeyIdentifier
  summary: API Key Identifier.
  signature: 'apiKeyIdentifier: str'
- uid: azure.mgmt.securityinsight.types.ApiKeyAuthModel.apiKeyName
  name: apiKeyName
  summary: API Key name. Required.
  signature: 'apiKeyName: str'
- uid: azure.mgmt.securityinsight.types.ApiKeyAuthModel.isApiKeyInPostPayload
  name: isApiKeyInPostPayload
  summary: Flag to indicate if API key is set in HTTP POST payload.
  signature: 'isApiKeyInPostPayload: bool'
- uid: azure.mgmt.securityinsight.types.ApiKeyAuthModel.type
