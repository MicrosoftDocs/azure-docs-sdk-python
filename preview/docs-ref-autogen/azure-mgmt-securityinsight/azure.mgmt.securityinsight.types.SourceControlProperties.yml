### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.SourceControlProperties
name: SourceControlProperties
fullName: azure.mgmt.securityinsight.types.SourceControlProperties
module: azure.mgmt.securityinsight.types
summary: Describes source control properties.
constructor:
  syntax: SourceControlProperties()
variables:
- description: The id (a Guid) of the source control.
  name: id
  types:
  - <xref:str>
- description: 'The version number associated with the source control. Known values
    are: "V1"

    and "V2".'
  name: version
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Version">]
- description: The display name of the source control. Required.
  name: displayName
  types:
  - <xref:str>
- description: A description of the source control.
  name: description
  types:
  - <xref:str>
- description: 'The repository type of the source control. Required. Known values
    are: "Github"

    and "AzureDevOps".'
  name: repoType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RepoType">]
- description: Array of source control content types. Required.
  name: contentTypes
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"ContentType">]]
- description: Repository metadata. Required.
  name: repository
  types:
  - <xref:<xref:"Repository">>
- description: Service principal metadata.
  name: servicePrincipal
  types:
  - <xref:<xref:"ServicePrincipal">>
- description: Workload Identity metadata.
  name: workloadIdentityFederation
  types:
  - <xref:<xref:"WorkloadIdentityFederation">>
- description: 'Repository access credentials. This is write-only object and it never

    returns back to a user.'
  name: repositoryAccess
  types:
  - <xref:<xref:"RepositoryAccess">>
- description: Information regarding the resources created in user's repository.
  name: repositoryResourceInfo
  types:
  - <xref:<xref:"RepositoryResourceInfo">>
- description: Information regarding the latest deployment for the source control.
  name: lastDeploymentInfo
  types:
  - <xref:<xref:"DeploymentInfo">>
- description: Information regarding the pull request of the source control.
  name: pullRequest
  types:
  - <xref:<xref:"PullRequest">>
attributes:
