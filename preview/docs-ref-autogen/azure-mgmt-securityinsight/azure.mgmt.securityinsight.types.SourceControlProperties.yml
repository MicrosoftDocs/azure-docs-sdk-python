  name: contentTypes
  summary: Array of source control content types. Required.
  signature: 'contentTypes: Union[str, ForwardRef(''ContentType'')]]]'
- uid: azure.mgmt.securityinsight.types.SourceControlProperties.description
  name: description
  summary: A description of the source control.
  signature: 'description: str'
