### YamlMime:PythonClass
uid: azure.mgmt.securityinsight.types.IncidentProperties
name: IncidentProperties
fullName: azure.mgmt.securityinsight.types.IncidentProperties
module: azure.mgmt.securityinsight.types
summary: Describes incident properties.
constructor:
  syntax: IncidentProperties()
variables:
- description: The title of the incident. Required.
  name: title
  types:
  - <xref:str>
- description: The description of the incident.
  name: description
  types:
  - <xref:str>
- description: 'The severity of the incident. Required. Known values are: "High",
    "Medium",

    "Low", and "Informational".'
  name: severity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IncidentSeverity">]
- description: 'The status of the incident. Required. Known values are: "New", "Active",
    and

    "Closed".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IncidentStatus">]
- description: 'The reason the incident was closed. Known values are: "Undetermined",

    "TruePositive", "BenignPositive", and "FalsePositive".'
  name: classification
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IncidentClassification">]
- description: 'The classification reason the incident was closed with. Known

    values are: "SuspiciousActivity", "SuspiciousButExpected", "IncorrectAlertLogic",
    and

    "InaccurateData".'
  name: classificationReason
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IncidentClassificationReason">]
- description: Describes the reason the incident was closed.
  name: classificationComment
  types:
  - <xref:str>
- description: Describes a user that the incident is assigned to.
  name: owner
  types:
  - <xref:<xref:"IncidentOwnerInfo">>
- description: List of labels relevant to this incident.
  name: labels
  types:
  - <xref:list>[<xref:"IncidentLabel">]
- description: The time of the first activity in the incident.
  name: firstActivityTimeUtc
  types:
  - <xref:str>
- description: The time of the last activity in the incident.
  name: lastActivityTimeUtc
  types:
  - <xref:str>
- description: The last time the incident was updated.
  name: lastModifiedTimeUtc
  types:
  - <xref:str>
- description: The time the incident was created.
  name: createdTimeUtc
  types:
  - <xref:str>
- description: A sequential number.
  name: incidentNumber
  types:
  - <xref:int>
- description: Additional data on the incident.
  name: additionalData
  types:
  - <xref:<xref:"IncidentAdditionalData">>
- description: List of resource ids of Analytic rules related to the incident.
  name: relatedAnalyticRuleIds
  types:
  - <xref:list>[<xref:str>]
- description: The deep-link url to the incident in Azure portal.
  name: incidentUrl
  types:
  - <xref:str>
- description: The name of the source provider that generated the incident.
  name: providerName
  types:
  - <xref:str>
- description: The incident ID assigned by the incident provider.
  name: providerIncidentId
  types:
  - <xref:str>
- description: Describes a team for the incident.
  name: teamInformation
  types:
  - <xref:<xref:"TeamInformation">>
