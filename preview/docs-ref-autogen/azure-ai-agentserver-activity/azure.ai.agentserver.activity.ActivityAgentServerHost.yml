- uid: azure.ai.agentserver.activity.ActivityAgentServerHost.register_pre_shutdown_callback
  name: register_pre_shutdown_callback
  summary: "Register a synchronous callback to run on SIGTERM signal receipt.\n\n\
    Callbacks run from inside the SIGTERM signal handler,\nBEFORE Hypercorn begins\
    \ its graceful drain. Use this to\nset asyncio events that long-running request\
    \ handlers observe via\ntheir cancellation-polling loops, so they can return before\n\
    Hypercorn waits the full `graceful_shutdown_timeout` for the\nrequest to complete.\n\
    \nCallbacks MUST be non-blocking and signal-safe \u2014 they execute\nsynchronously\
    \ on the main thread inside the signal handler. The\ntypical pattern is:\n\n<!--\
    \ literal_block {\"ids\": [], \"classes\": [], \"names\": [], \"dupnames\": [],\
    \ \"backrefs\": [], \"xml:space\": \"preserve\", \"language\": \"default\", \"\
    force\": false, \"linenos\": false} -->\n\n````default\n\n   shutdown_event =\
    \ asyncio.Event()\n   app.register_pre_shutdown_callback(shutdown_event.set)\n\
    \   ````\n\nNote: `asyncio.Event.set()` is safe to call from a signal\nhandler\
    \ when the event loop is running on the same thread."
  signature: 'register_pre_shutdown_callback(fn: Callable[[], None]) -> None'
  parameters:
  - name: fn
    description: A synchronous, non-blocking callable.
    isRequired: true
    types:
    - <xref:typing.Callable>[[], <xref:None>]
- uid: azure.ai.agentserver.activity.ActivityAgentServerHost.register_server_version
  name: register_server_version
  summary: "Register a version segment for the `x-platform-server` header.\n\nProtocol\
    \ packages (e.g. responses, invocations) call this in their\n`__init__` to add\
    \ their own portion.  Handler developers can also\ncall it to append a custom\
    \ version string.  Duplicates are ignored.\n\nUse <xref:azure.ai.agentserver.core.build_server_version>\
    \ to\nbuild a standard segment:\n\n<!-- literal_block {\"ids\": [], \"classes\"\
    : [], \"names\": [], \"dupnames\": [], \"backrefs\": [], \"xml:space\": \"preserve\"\
    , \"language\": \"default\", \"force\": false, \"linenos\": false} -->\n\n````default\n\
    \n   from azure.ai.agentserver.core import build_server_version\n\n   app.register_server_version(\n\
    \       build_server_version(\"my-library\", \"2.0.0\")\n   )\n   ````"
  signature: 'register_server_version(version_segment: str) -> None'
  parameters:
  - name: version_segment
    description: The version string to register.
    isRequired: true
    types:
    - <xref:str>
  exceptions:
  - type: ValueError
    description: If *version_segment* is empty or whitespace-only.
