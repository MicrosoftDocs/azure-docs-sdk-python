    types:
    - <xref:typing.Optional>[<xref:microsoft_agents.hosting.core.HttpAdapterBase>]
- uid: azure.ai.agentserver.activity.ActivityAgentServerHost.agent_app
  name: agent_app
  summary: 'The underlying M365 `AgentApplication` for handler registration.


    Capture it (`app = host.agent_app`) and register handlers on it, for

    example `@app.activity("message")` / `@app.error`, or use it

    standalone.'
  return:
    description: The hosted `AgentApplication`.
    types:
    - <xref:microsoft_agents.hosting.core.AgentApplication>
  exceptions:
  - type: AttributeError
    description: When the host was created with a custom `request_handler` `AgentApplication`
      is initialized.
- uid: azure.ai.agentserver.activity.ActivityAgentServerHost.connection_config
  name: connection_config
  summary: 'The resolved M365 `CONNECTIONS__*` mapping used to build the stack.


    Exposes the connection config the host resolved (the caller-supplied

    `connection_config` keyword, or the values derived from the

    Foundry-native identity) so callers can inspect the exact settings the

    M365 stack was built from. Distinct from <xref:config> (the core Foundry

    `AgentConfig`). `None` when the host was created with a custom

    `request_handler` (the M365 stack is not built in that mode).'
  return:
    description: The resolved connection config, or `None` in custom-handler mode.
    types:
    - <xref:typing.Optional>[<xref:typing.Mapping>[<xref:str>, <xref:str>]]
