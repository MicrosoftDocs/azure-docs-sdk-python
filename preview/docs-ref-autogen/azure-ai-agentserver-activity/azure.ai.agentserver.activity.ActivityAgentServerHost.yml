### YamlMime:PythonClass
uid: azure.ai.agentserver.activity.ActivityAgentServerHost
name: ActivityAgentServerHost
fullName: azure.ai.agentserver.activity.ActivityAgentServerHost
module: azure.ai.agentserver.activity
summary: "Activity protocol host for Azure AI Hosted Agents.\n\nA <xref:azure.ai.agentserver.core.AgentServerHost>\
  \ subclass that adds\nthe activity protocol endpoint at `POST /activity/messages`.\
  \ A single\nconstructor selects one of three mutually-exclusive modes from the arguments\n\
  you pass (an invalid combination raises `ValueError`):\n\n1. **Build the M365 stack\
  \ (default).** Pass neither `agent_app` nor `request_handler`. The M365 Agents SDK\
  \ is initialized eagerly from the environment (optionally overriding `storage` /\
  \ `connection_manager` / `adapter` / `authorization` / `connection_config`). The\
  \ built `AgentApplication` is exposed as the <xref:azure.ai.agentserver.activity.ActivityAgentServerHost.agent_app>\
  \ property \u2014 capture it (`app = host.agent_app`) and register handlers with\
  \ `@app.activity(...)` / `@app.error`, reaching the rest of the M365 surface (`message`\
  \ / `proactive` / `auth` ...) the same way. \n\n2. **Inject a pre-built ``AgentApplication``.**\
  \ Pass `agent_app=<app>` to host an `AgentApplication` you built yourself, as-is.\
  \ It is exposed as <xref:azure.ai.agentserver.activity.ActivityAgentServerHost.agent_app>.\
  \ \n\n3. **Custom request handler.** Pass `request_handler=<fn>` to own the request\
  \ pipeline entirely; the M365 SDK is not initialized, <xref:azure.ai.agentserver.activity.ActivityAgentServerHost.agent_app>\
  \ is unavailable, and the handler receives the raw Starlette `Request` with `request.state.activity`\
  \ set to the parsed dict. \n\nSee the package overview (<xref:azure.ai.agentserver.activity>)\
  \ for runnable\nusage examples of all three construction modes.\n\nInitialize the\
  \ host, selecting the construction mode from the arguments.\n\nThe mode is inferred\
  \ from which of `agent_app` / `request_handler` is\nsupplied (see the class docstring);\
  \ passing an invalid combination raises\n`ValueError` so a bad configuration cannot\
  \ be expressed."
constructor:
  syntax: 'ActivityAgentServerHost(*, agent_app: AgentApplication | None = None, request_handler:
    Callable[[Request], Awaitable[Response]] | None = None, digital_worker: bool =
    False, storage: Storage | None = None, connection_manager: MsalConnectionManager
    | None = None, adapter: HttpAdapterBase | None = None, authorization: Authorization
    | None = None, connection_config: Mapping[str, str] | None = None, **kwargs: Any)'
  keywordOnlyParameters:
  - name: agent_app
    description: 'A pre-built M365 `AgentApplication` to host as-is

      (mode 2). Mutually exclusive with `request_handler` and with the

      M365-build overrides. Defaults to `None` (build the stack).'
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:microsoft_agents.hosting.core.AgentApplication>]
  - name: request_handler
    description: 'A custom `async def handler(request) -> Response`

      that owns the pipeline (mode 3). Mutually exclusive with `agent_app`

      and the M365-build overrides. Defaults to `None`.'
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:typing.Callable>[[<xref:starlette.requests.Request>],
      <xref:typing.Awaitable>[<xref:starlette.responses.Response>]]]
  - name: digital_worker
    description: 'Selects the outbound-auth model. `False` (the

      default) is the **simple** model: the agent *instance* identity mints

      the Bot Connector token directly. `True` is the **digital-worker**

      model: the *blueprint* identity with the federated-identity (FMI)

      token exchange.'
    defaultValue: 'False'
    types:
    - <xref:bool>
  - name: storage
    description: Optional storage backend for the built M365 stack.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:microsoft_agents.hosting.core.Storage>]
  - name: connection_manager
    description: Optional M365 connection manager.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:microsoft_agents.authentication.msal.MsalConnectionManager>]
  - name: adapter
    description: Optional channel adapter.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:microsoft_agents.hosting.core.HttpAdapterBase>]
  - name: authorization
    description: Optional M365 `Authorization` instance.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:microsoft_agents.hosting.core.Authorization>]
  - name: connection_config
    description: 'Optional connection config (the M365

      `CONNECTIONS__*` mapping) for the built M365 stack. When supplied it

      also drives the outbound-auth client id, and it is exposed after

      construction as <xref:azure.ai.agentserver.activity.ActivityAgentServerHost.connection_config>.'
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:typing.Mapping>[<xref:str>, <xref:str>]]
  - name: agent_app
    description: 'A pre-built `AgentApplication` to host as-is, or

      `None` to build the M365 stack. Mutually exclusive with

      `request_handler` and the M365-build overrides.'
    types:
    - <xref:typing.Optional>[<xref:microsoft_agents.hosting.core.AgentApplication>]
  - name: request_handler
    description: 'A custom async request handler that owns the

      pipeline, or `None`. Mutually exclusive with `agent_app` and the

      M365-build overrides.'
    types:
    - <xref:typing.Optional>[<xref:typing.Callable>[[<xref:starlette.requests.Request>],
      <xref:typing.Awaitable>[<xref:starlette.responses.Response>]]]
  - name: digital_worker
    description: 'Selects the outbound-auth model (see the class

      docstring). Defaults to the simple model.'
    types:
    - <xref:bool>
  - name: storage
    description: Optional storage backend for the built M365 stack.
    types:
    - <xref:typing.Optional>[<xref:microsoft_agents.hosting.core.Storage>]
  - name: connection_manager
    description: Optional M365 connection manager.
    types:
    - <xref:typing.Optional>[<xref:microsoft_agents.authentication.msal.MsalConnectionManager>]
  - name: adapter
    description: Optional channel adapter.
    types:
    - <xref:typing.Optional>[<xref:microsoft_agents.hosting.core.HttpAdapterBase>]
  - name: authorization
    description: Optional M365 `Authorization` instance.
    types:
    - <xref:typing.Optional>[<xref:microsoft_agents.hosting.core.Authorization>]
  - name: connection_config
    description: 'Optional connection config (the M365

      `CONNECTIONS__*` mapping) for the built M365 stack. When supplied it

      also drives the outbound-auth client id, and it is exposed after

      construction as <xref:azure.ai.agentserver.activity.ActivityAgentServerHost.connection_config>.'
    types:
    - <xref:typing.Optional>[<xref:typing.Mapping>[<xref:str>, <xref:str>]]
