### YamlMime:PythonClass
uid: azure.storage.queue.RetentionPolicy
name: RetentionPolicy
fullName: azure.storage.queue.RetentionPolicy
module: azure.storage.queue
summary: 'The retention policy which determines how long the associated data should

  persist.


  All required parameters must be populated in order to send to Azure.'
constructor:
  syntax: 'RetentionPolicy(enabled: bool = False, days: int | None = None)'
  parameters:
  - name: enabled
    description: 'Required. Indicates whether a retention policy is enabled

      for the storage service.'
    defaultValue: 'False'
    types:
    - <xref:bool>
  - name: days
    description: 'Indicates the number of days that metrics or logging or

      soft-deleted data should be retained. All data older than this value will

      be deleted.'
    defaultValue: None
    types:
    - <xref:int>
