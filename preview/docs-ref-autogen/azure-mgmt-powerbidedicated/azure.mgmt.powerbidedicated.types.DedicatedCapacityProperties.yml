### YamlMime:PythonClass
uid: azure.mgmt.powerbidedicated.types.DedicatedCapacityProperties
name: DedicatedCapacityProperties
fullName: azure.mgmt.powerbidedicated.types.DedicatedCapacityProperties
module: azure.mgmt.powerbidedicated.types
summary: Properties of Dedicated Capacity resource.
constructor:
  syntax: DedicatedCapacityProperties()
variables:
- description: A collection of Dedicated capacity administrators.
  name: administration
  types:
  - <xref:<xref:"DedicatedCapacityAdministrators">>
- description: 'Specifies the generation of the Power BI Embedded capacity. If no
    value is

    specified, the default value ''Gen2'' is used. [Learn More](https://docs.microsoft.com/power-bi/developer/embedded/power-bi-embedded-generation-2).

    Known values are: "Gen1" and "Gen2".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Mode">]
- description: Tenant ID for the capacity. Used for creating Pro Plus capacity.
  name: tenant_id
  types:
  - <xref:str>
- description: Capacity name.
  name: friendly_name
  types:
  - <xref:str>
- description: 'The current state of PowerBI Dedicated resource. The state is to indicate
    more

    states outside of resource provisioning. Known values are: "Deleting", "Succeeded",
    "Failed",

    "Paused", "Suspended", "Provisioning", "Updating", "Suspending", "Pausing", "Resuming",

    "Preparing", and "Scaling".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"State">]
- description: 'The current deployment state of PowerBI Dedicated resource. The

    provisioningState is to indicate states for resource provisioning. Known values
    are:

    "Deleting", "Succeeded", "Failed", "Paused", "Suspended", "Provisioning", "Updating",

    "Suspending", "Pausing", "Resuming", "Preparing", and "Scaling".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CapacityProvisioningState">]
attributes:
- uid: azure.mgmt.powerbidedicated.types.DedicatedCapacityProperties.provisioningState
  name: provisioningState
  summary: 'The current deployment state of PowerBI Dedicated resource. The provisioningState
    is to

    indicate states for resource provisioning. Known values are: "Deleting", "Succeeded",

    "Failed", "Paused", "Suspended", "Provisioning", "Updating", "Suspending",

    "Pausing", "Resuming", "Preparing", and "Scaling".'
  signature: 'provisioningState: str | CapacityProvisioningState'
- uid: azure.mgmt.powerbidedicated.types.DedicatedCapacityProperties.state
  name: state
  summary: 'The current state of PowerBI Dedicated resource. The state is to indicate
    more states outside

    of resource provisioning. Known values are: "Deleting", "Succeeded", "Failed",

    "Paused", "Suspended", "Provisioning", "Updating", "Suspending", "Pausing",

    "Resuming", "Preparing", and "Scaling".'
  signature: 'state: str | State'
- uid: azure.mgmt.powerbidedicated.types.DedicatedCapacityProperties.administration
  name: administration
  signature: 'administration: DedicatedCapacityAdministrators'
- uid: azure.mgmt.powerbidedicated.types.DedicatedCapacityProperties.friendlyName
  name: friendlyName
  signature: 'friendlyName: str'
- uid: azure.mgmt.powerbidedicated.types.DedicatedCapacityProperties.mode
  name: mode
  signature: 'mode: str | Mode'
- uid: azure.mgmt.powerbidedicated.types.DedicatedCapacityProperties.tenantId
  name: tenantId
  signature: 'tenantId: str'
