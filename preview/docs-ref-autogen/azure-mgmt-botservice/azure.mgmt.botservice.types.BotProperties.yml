  - <xref:dict>[<xref:str>, <xref:str>]
- description: Contains resource parameters defined as key/value pairs.
  name: parameters
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: The bot's manifest url.
  name: manifest_url
  types:
  - <xref:str>
