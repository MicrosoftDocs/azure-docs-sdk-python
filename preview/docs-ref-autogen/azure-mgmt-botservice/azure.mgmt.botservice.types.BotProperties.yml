constructor:
  syntax: BotProperties()
variables:
- description: The Name of the bot. Required.
  name: display_name
  types:
  - <xref:str>
- description: The description of the bot.
  name: description
  types:
  - <xref:str>
- description: The Icon Url of the bot.
  name: icon_url
  types:
  - <xref:str>
