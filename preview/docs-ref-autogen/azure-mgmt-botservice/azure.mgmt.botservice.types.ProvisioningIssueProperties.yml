uid: azure.mgmt.botservice.types.ProvisioningIssueProperties
name: ProvisioningIssueProperties
fullName: azure.mgmt.botservice.types.ProvisioningIssueProperties
module: azure.mgmt.botservice.types
summary: Properties of Provisioning Issue.
constructor:
  syntax: ProvisioningIssueProperties()
variables:
- description: Type of Issue.
  name: issue_type
  types:
  - <xref:str>
- description: 'Provisioning state of Network Security Perimeter configuration propagation.

    Known values are: "Warning" and "Error".'
  name: severity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Severity">]
- description: Description of the issue.
  name: description
  types:
  - <xref:str>
- description: 'ARM IDs of resources that can be associated to the same perimeter

    to remediate the issue.'
  name: suggested_resource_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'Access rules that can be added to the same profile to remediate

    the issue.'
  name: suggested_access_rules
  types:
  - <xref:list>[<xref:"NspAccessRule">]
attributes:
- uid: azure.mgmt.botservice.types.ProvisioningIssueProperties.description
  name: description
  summary: Description of the issue.
  signature: 'description: str'
- uid: azure.mgmt.botservice.types.ProvisioningIssueProperties.issueType
  name: issueType
  summary: Type of Issue.
  signature: 'issueType: str'
- uid: azure.mgmt.botservice.types.ProvisioningIssueProperties.severity
  name: severity
  summary: 'Provisioning state of Network Security Perimeter configuration propagation.
    Known values are:

    "Warning" and "Error".'
  signature: 'severity: str | Severity'
- uid: azure.mgmt.botservice.types.ProvisioningIssueProperties.suggestedAccessRules
  name: suggestedAccessRules
  summary: Access rules that can be added to the same profile to remediate the issue.
  signature: 'suggestedAccessRules: list[''NspAccessRule'']'
