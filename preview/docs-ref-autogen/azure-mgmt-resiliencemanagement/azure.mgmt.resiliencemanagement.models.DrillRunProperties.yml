    values are: "System" and "User".'
  name: triggered_by
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.JobTriggeredBy>
- description: 'Discriminator for the Job object hierarchy. Required. Drill Oober
    job which

    represents a given instance of Drill.'
