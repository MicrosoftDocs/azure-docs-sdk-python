### YamlMime:PythonClass
uid: azure.mgmt.resiliencemanagement.types.ResourceCrossZoneVmRecoveryProtectionSetting
name: ResourceCrossZoneVmRecoveryProtectionSetting
fullName: azure.mgmt.resiliencemanagement.types.ResourceCrossZoneVmRecoveryProtectionSetting
module: azure.mgmt.resiliencemanagement.types
summary: 'Definition of recovery orchestration resource protection with cross-zone
  (zonally resilient) VM

  recovery.'
constructor:
  syntax: ResourceCrossZoneVmRecoveryProtectionSetting()
variables:
- description: Required. Cross zone recovery enabled Azure VMs.
  name: protectionSolutionType
  types:
  - <xref:typing.Literal>[ResourceProtectionSolutionType.CROSS_ZONE_VM_RECOVERY]
- description: 'Customer-requested logical target availability zone for zonal failover
    (a

    positive availability-zone id, e.g. "1", "2", "3"; additional zones are accepted
    where the

    region exposes them). Always optional; when omitted the service selects a healthy
    zone.

    Immutable per failover.'
  name: targetZone
  types:
  - <xref:str>
- description: 'ARM resource ID of the Capacity Reservation Group (in the

    same subscription as the VM) to use when moving the VM to the target zone.'
  name: capacityReservationGroupId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.resiliencemanagement.types.ResourceCrossZoneVmRecoveryProtectionSetting.capacityReservationGroupId
  name: capacityReservationGroupId
  summary: 'ARM resource ID of the Capacity Reservation Group (in the same subscription
    as the VM) to use

    when moving the VM to the target zone.'
  signature: 'capacityReservationGroupId: str'
- uid: azure.mgmt.resiliencemanagement.types.ResourceCrossZoneVmRecoveryProtectionSetting.protectionSolutionType
  name: protectionSolutionType
  summary: Required. Cross zone recovery enabled Azure VMs.
  signature: 'protectionSolutionType: CROSS_ZONE_VM_RECOVERY: ''CrossZoneVMRecovery''>]'
- uid: azure.mgmt.resiliencemanagement.types.ResourceCrossZoneVmRecoveryProtectionSetting.targetZone
  name: targetZone
  summary: 'Customer-requested logical target availability zone for zonal failover
    (a positive

    availability-zone id, e.g. "1", "2", "3"; additional zones are accepted where
    the region

    exposes them). Always optional; when omitted the service selects a healthy zone.
    Immutable per

    failover.'
  signature: 'targetZone: str'
