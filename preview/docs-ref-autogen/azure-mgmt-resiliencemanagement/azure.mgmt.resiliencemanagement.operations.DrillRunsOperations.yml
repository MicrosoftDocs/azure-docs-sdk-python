- uid: azure.mgmt.resiliencemanagement.operations.DrillRunsOperations.begin_generate_report
  name: begin_generate_report
  summary: 'This generates, or regenerates, the report for this Drill Run. The action
    is idempotent and is

    safe to call at any time: a call that arrives while a generation is already running
    joins it,

    and a call made after a failed attempt retries it. A report that has been finalized
    is never

    regenerated.'
