### YamlMime:PythonClass
uid: azure.mgmt.resiliencemanagement.models.RecoveryJobProperties
name: RecoveryJobProperties
fullName: azure.mgmt.resiliencemanagement.models.RecoveryJobProperties
module: azure.mgmt.resiliencemanagement.models
summary: Definition of recovery job associated with Recovery Orchestration Plan.
constructor:
  syntax: 'RecoveryJobProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The current status of the job execution. Known values are: "NotApplicable",

    "NotStarted", "Pending", "InProgress", "Completed", "CompletedWithWarnings", "Failed",

    "Skipped", "Cancelling", "Cancelled", and "Paused".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.JobStatus>
- description: The start time of the job execution.
  name: start_time
  types:
  - <xref:datetime.datetime>
- description: The end time of the job execution.
  name: end_time
  types:
  - <xref:datetime.datetime>
- description: The time elapsed during the execution of this job.
  name: duration
  types:
  - <xref:datetime.timedelta>
- description: Details of any errors that occurred during the execution of this job.
  name: error_details
  types:
  - <xref:azure.mgmt.resiliencemanagement.models.JobErrorInfo>
- description: 'The resource for which this job was created. This is typically the
    resource

    that the job is intended to manage or operate on.'
  name: resource_id
  types:
  - <xref:str>
- description: The operation that this job is intended to perform.
  name: operation
  types:
  - <xref:str>
- description: Details of any retries that have been attempted for this job.
  name: retry_details
  types:
  - <xref:list>[<xref:azure.mgmt.resiliencemanagement.models.JobRetryDetails>]
- description: Additional information about the job.
  name: job_extended_info
  types:
  - <xref:azure.mgmt.resiliencemanagement.models.JobExtendedInfo>
- description: User Comments.
  name: user_comments
  types:
  - <xref:list>[<xref:azure.mgmt.resiliencemanagement.models.JobUserComment>]
- description: Execution configurations for the job.
  name: execution_configurations
  types:
  - <xref:azure.mgmt.resiliencemanagement.models.ExecutionConfigurations>
- description: 'Indicates whether the job was triggered by the system or a user. Known

    values are: "System" and "User".'
  name: triggered_by
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.JobTriggeredBy>
- description: 'Discriminator for the Job object hierarchy. Required. Recovery Orchestration

    Plan created job.'
  name: job_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.RECOVERY_PLAN>
- description: 'The provisioning state of the recovery job. Known values are:

    "Succeeded", "Failed", "Canceled", "Provisioning", "Updating", "Deleting", "Accepted",
    and

    "NeedsAttention".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.ProvisioningState>
attributes:
- uid: azure.mgmt.resiliencemanagement.models.RecoveryJobProperties.job_type
  name: job_type
  summary: Discriminator for the Job object hierarchy. Required. Recovery Orchestration
    Plan created job.
  signature: 'job_type: RECOVERY_PLAN: ''RecoveryPlan''>]'
- uid: azure.mgmt.resiliencemanagement.models.RecoveryJobProperties.provisioning_state
  name: provisioning_state
  summary: '"Succeeded", "Failed",

    "Canceled", "Provisioning", "Updating", "Deleting", "Accepted", and

    "NeedsAttention".'
  signature: 'provisioning_state: str | _models.ProvisioningState | None'
