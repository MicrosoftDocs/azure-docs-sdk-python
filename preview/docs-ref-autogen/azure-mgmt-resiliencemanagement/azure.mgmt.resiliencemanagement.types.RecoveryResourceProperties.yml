### YamlMime:PythonClass
uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties
name: RecoveryResourceProperties
fullName: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties
module: azure.mgmt.resiliencemanagement.types
summary: 'Definition of recovery orchestration resource property associated with recovery
  orchestration

  plan.'
constructor:
  syntax: RecoveryResourceProperties()
variables:
- description: 'A unique id for the recovery resource, which is a GUID.

    Required.'
  name: recoveryResourceUniqueId
  types:
  - <xref:str>
- description: 'Provisioning state. Known values are: "Succeeded", "Failed",

    "Canceled", "Provisioning", "Updating", "Deleting", "Accepted", and "NeedsAttention".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Resource ID of the Azure resource associated with the recovery orchestration

    plan and linked to the recovery resource.'
  name: resourceId
  types:
  - <xref:str>
- description: 'Original location of the Azure resource associated with the recovery

    orchestration plan and linked to the recovery resource.'
  name: resourceLocation
  types:
  - <xref:str>
- description: 'Physical zones of the Azure resource associated with the recovery

    orchestration plan and linked to the recovery resource.'
  name: resourcePhysicalZones
  types:
  - <xref:list>[<xref:str>]
- description: 'A state that indicates the resource status with respect to the recovery

    orchestration plan. Known values are: "Included" and "Excluded".'
  name: inclusionState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceInclusionState">]
- description: 'Indicating if resource needs user attention and action, details will
    be

    found in attentionReasons.'
  name: needsAttention
  types:
  - <xref:bool>
- description: Reason for the resource to be in need of attention.
  name: attentionReasons
  types:
  - <xref:list>[<xref:str>]
- description: 'A status that indicates the protection status of a resource with an

    Azure solution for regional or zonal recovery. Known values are: "Unknown", "Protected",

    "NotProtected", and "HighlyAvailable".'
  name: protectionStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceProtectionStatus">]
- description: 'A list of ResourceProtectionSolutions with which the

    recovery orchestration resource is protected.'
  name: resourceProtectionSolutions
  types:
  - <xref:list>[<xref:"ResourceProtectionSolutionSettings">]
- description: 'A setting that indicates the protection solution

    selected. Known values are: "None", "AzureNative", "AzureSiteRecovery", "CrossZoneVMRecovery",

    and "CustomRunbook".'
  name: selectedProtectionSolutionType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceProtectionSolutionType">]
- description: 'Resource protection solution settings of the

    protection solutions recovery orchestration resource is protected with.'
  name: selectedProtectionSolutionSetting
  types:
  - <xref:<xref:"ResourceBaseProtectionSolutionSetting">>
- description: 'The recovery orchestration group id associated with the recovery

    resources.'
  name: recoveryGroupId
  types:
  - <xref:str>
- description: 'Identity details associated to the resource, which will be used for

    performing any operations on it.'
  name: associatedIdentity
  types:
  - <xref:<xref:"AssociatedIdentity">>
- description: Error details associated with the resource.
  name: errorDetails
  types:
  - <xref:<xref:"ErrorDetail">>
attributes:
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.associatedIdentity
  name: associatedIdentity
  summary: 'Identity details associated to the resource, which will be used for performing
    any operations

    on it.'
  signature: 'associatedIdentity: AssociatedIdentity'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.attentionReasons
  name: attentionReasons
  summary: Reason for the resource to be in need of attention.
  signature: 'attentionReasons: list[str]'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.errorDetails
  name: errorDetails
  summary: Error details associated with the resource.
  signature: 'errorDetails: ErrorDetail'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.inclusionState
  name: inclusionState
  summary: 'A state that indicates the resource status with respect to the recovery
    orchestration plan.

    Known values are: "Included" and "Excluded".'
  signature: 'inclusionState: str | ResourceInclusionState'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.needsAttention
  name: needsAttention
  summary: 'Indicating if resource needs user attention and action, details will be
    found in

    attentionReasons.'
  signature: 'needsAttention: bool'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.protectionStatus
  name: protectionStatus
  summary: 'A status that indicates the protection status of a resource with an Azure
    solution for regional

    or zonal recovery. Known values are: "Unknown", "Protected", "NotProtected", and

    "HighlyAvailable".'
  signature: 'protectionStatus: str | ResourceProtectionStatus'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Provisioning", "Updating", "Deleting", "Accepted", and "NeedsAttention".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.recoveryGroupId
  name: recoveryGroupId
  summary: The recovery orchestration group id associated with the recovery resources.
  signature: 'recoveryGroupId: str'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.recoveryResourceUniqueId
  name: recoveryResourceUniqueId
  summary: A unique id for the recovery resource, which is a GUID. Required.
  signature: 'recoveryResourceUniqueId: Required[str]'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.resourceId
  name: resourceId
  summary: 'Resource ID of the Azure resource associated with the recovery orchestration
    plan and linked to

    the recovery resource.'
  signature: 'resourceId: str'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.resourceLocation
  name: resourceLocation
  summary: 'Original location of the Azure resource associated with the recovery orchestration
    plan and

    linked to the recovery resource.'
  signature: 'resourceLocation: str'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.resourcePhysicalZones
  name: resourcePhysicalZones
  summary: 'Physical zones of the Azure resource associated with the recovery orchestration
    plan and linked

    to the recovery resource.'
  signature: 'resourcePhysicalZones: list[str]'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.resourceProtectionSolutions
  name: resourceProtectionSolutions
  summary: 'A list of ResourceProtectionSolutions with which the recovery orchestration
    resource is

    protected.'
  signature: 'resourceProtectionSolutions: list[''ResourceProtectionSolutionSettings'']'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.selectedProtectionSolutionSetting
  name: selectedProtectionSolutionSetting
  summary: 'Resource protection solution settings of the protection solutions recovery
    orchestration

    resource is protected with.'
  signature: 'selectedProtectionSolutionSetting: ResourceBaseProtectionSolutionSetting'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryResourceProperties.selectedProtectionSolutionType
  name: selectedProtectionSolutionType
  summary: '"None",

    "AzureNative", "AzureSiteRecovery", "CrossZoneVMRecovery", and "CustomRunbook".'
  signature: 'selectedProtectionSolutionType: str | ResourceProtectionSolutionType'
