    plan and linked to the recovery resource.'
  signature: 'recoveryLocations: list[str]'
- uid: azure.mgmt.resiliencemanagement.types.ResourceProtectionSolutionSettings.replicaResources
  name: replicaResources
  summary: List of Replica resources to which replication is happening.
  signature: 'replicaResources: list[str]'
- uid: azure.mgmt.resiliencemanagement.types.ResourceProtectionSolutionSettings.replicationRole
  name: replicationRole
  summary: '"Unknown",

    "Primary", and "Replica".'
  signature: 'replicationRole: str | ResourceReplicationRole'
