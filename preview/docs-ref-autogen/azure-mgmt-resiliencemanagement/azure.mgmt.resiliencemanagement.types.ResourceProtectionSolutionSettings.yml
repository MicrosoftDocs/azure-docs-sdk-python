    "None", "AzureNative", "AzureSiteRecovery", "CrossZoneVMRecovery", and

    "CustomRunbook".'
  signature: 'protectionSolutionType: str | ResourceProtectionSolutionType'
- uid: azure.mgmt.resiliencemanagement.types.ResourceProtectionSolutionSettings.protectionStatus
  name: protectionStatus
  summary: 'A status that indicates the protection status of a resource with an Azure
    solution for regional

    or zonal recovery. Known values are: "Unknown", "Protected", "NotProtected", and

    "HighlyAvailable".'
  signature: 'protectionStatus: str | ResourceProtectionStatus'
- uid: azure.mgmt.resiliencemanagement.types.ResourceProtectionSolutionSettings.recoveryLocations
  name: recoveryLocations
  summary: 'List of recovery locations of the Azure resource associated with the recovery
