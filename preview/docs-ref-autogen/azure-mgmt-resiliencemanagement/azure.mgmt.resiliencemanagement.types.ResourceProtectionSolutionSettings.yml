  summary: 'Active locations of the Azure resource associated with the recovery orchestration
    plan and

    linked to the recovery resource.'
  signature: 'activeLocations: list[str]'
- uid: azure.mgmt.resiliencemanagement.types.ResourceProtectionSolutionSettings.activePhysicalZones
  name: activePhysicalZones
  summary: Active Resource location and physical zones of Azure Resource.
  signature: 'activePhysicalZones: list[str]'
- uid: azure.mgmt.resiliencemanagement.types.ResourceProtectionSolutionSettings.failoverState
  name: failoverState
  summary: '"None",

    "FailedOver", "FailedOverCommitPending", and "FailedOverReprotectPending".'
  signature: 'failoverState: str | FailoverState'
- uid: azure.mgmt.resiliencemanagement.types.ResourceProtectionSolutionSettings.isAutoFailover
  name: isAutoFailover
  summary: Is AutoFailover configured for the resource replication. Required.
  signature: 'isAutoFailover: Required[bool]'
- uid: azure.mgmt.resiliencemanagement.types.ResourceProtectionSolutionSettings.primaryResource
  name: primaryResource
  summary: Primary resource which is getting replicated.
  signature: 'primaryResource: str'
