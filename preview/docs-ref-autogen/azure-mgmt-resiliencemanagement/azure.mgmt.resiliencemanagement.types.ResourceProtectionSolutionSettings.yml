### YamlMime:PythonClass
uid: azure.mgmt.resiliencemanagement.types.ResourceProtectionSolutionSettings
name: ResourceProtectionSolutionSettings
fullName: azure.mgmt.resiliencemanagement.types.ResourceProtectionSolutionSettings
module: azure.mgmt.resiliencemanagement.types
summary: Definition of recovery resource resource protection solution settings.
constructor:
  syntax: ResourceProtectionSolutionSettings()
variables:
- description: 'A setting that indicates the resource protected with which

    recovery solution. Known values are: "None", "AzureNative", "AzureSiteRecovery",

    "CrossZoneVMRecovery", and "CustomRunbook".'
  name: protectionSolutionType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceProtectionSolutionType">]
- description: 'A status that indicates the protection status of a resource with an

    Azure solution for regional or zonal recovery. Known values are: "Unknown", "Protected",

    "NotProtected", and "HighlyAvailable".'
  name: protectionStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceProtectionStatus">]
- description: 'Resource ID of the Azure resource associated with the recovery orchestration

    plan and linked to the recovery resource.'
  name: resourceId
  types:
  - <xref:str>
- description: 'Active location of the Azure resource associated with the recovery

    orchestration plan and linked to the recovery resource.'
  name: activeLocation
  types:
  - <xref:str>
- description: 'Active locations of the Azure resource associated with the recovery

    orchestration plan and linked to the recovery resource.'
  name: activeLocations
  types:
  - <xref:list>[<xref:str>]
- description: Active Resource location and physical zones of Azure Resource.
  name: activePhysicalZones
  types:
  - <xref:list>[<xref:str>]
- description: 'List of recovery locations of the Azure resource associated with the

    recovery orchestration plan and linked to the recovery resource.'
  name: recoveryLocations
  types:
  - <xref:list>[<xref:str>]
- description: 'Specifies the role of the resource in the replication process. Known

    values are: "Unknown", "Primary", and "Replica".'
  name: replicationRole
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceReplicationRole">]
- description: Primary resource which is getting replicated.
  name: primaryResource
  types:
  - <xref:str>
- description: List of Replica resources to which replication is happening.
  name: replicaResources
  types:
  - <xref:list>[<xref:str>]
- description: Is AutoFailover configured for the resource replication. Required.
  name: isAutoFailover
  types:
  - <xref:bool>
- description: 'Failover state of the recovery orchestration resource. Known values
    are:

    "None", "FailedOver", "FailedOverCommitPending", and "FailedOverReprotectPending".'
  name: failoverState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FailoverState">]
- description: 'TestFailover state of the recovery orchestration resource. Known

    values are: "None" and "TestFailoverCleanupPending".'
  name: testFailoverState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TestFailoverState">]
