### YamlMime:PythonClass
uid: azure.mgmt.resiliencemanagement.models.ReportStageStatus
name: ReportStageStatus
fullName: azure.mgmt.resiliencemanagement.models.ReportStageStatus
module: azure.mgmt.resiliencemanagement.models
summary: Report generation status for a single Drill Run stage.
constructor:
  syntax: 'ReportStageStatus(*args: Any, **kwargs: Any)'
variables:
- description: 'Name of the Drill Run stage this status applies to. Required. Known

    values are: "FaultInjection", "Failover", "Reprotect", "FailoverReverse", and

    "ReprotectReverse".'
  name: drill_run_stage
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.DrillRunSubtasks>
- description: 'Report generation status for this stage. Known values are:

    "NotStarted", "InProgress", "Succeeded", and "Failed".'
  name: generation_status
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.DrillReportGenerationStatus>
- description: Timestamp of the last report generation attempt for this stage.
  name: last_attempt_timestamp
  types:
  - <xref:datetime.datetime>
- description: Error from the last failed report generation attempt for this stage.
  name: last_error
  types:
  - <xref:azure.mgmt.resiliencemanagement.models.ErrorDetails>
attributes:
- uid: azure.mgmt.resiliencemanagement.models.ReportStageStatus.drill_run_stage
  name: drill_run_stage
  summary: 'Name of the Drill Run stage this status applies to. Required. Known values
    are:

    "FaultInjection", "Failover", "Reprotect", "FailoverReverse", and "ReprotectReverse".'
  signature: 'drill_run_stage: str | _models.DrillRunSubtasks'
- uid: azure.mgmt.resiliencemanagement.models.ReportStageStatus.generation_status
  name: generation_status
  summary: '"NotStarted", "InProgress",

    "Succeeded", and "Failed".'
  signature: 'generation_status: str | _models.DrillReportGenerationStatus | None'
- uid: azure.mgmt.resiliencemanagement.models.ReportStageStatus.last_attempt_timestamp
  name: last_attempt_timestamp
  summary: Timestamp of the last report generation attempt for this stage.
  signature: 'last_attempt_timestamp: datetime | None'
- uid: azure.mgmt.resiliencemanagement.models.ReportStageStatus.last_error
  name: last_error
  summary: Error from the last failed report generation attempt for this stage.
  signature: 'last_error: _models.ErrorDetails | None'
