### YamlMime:PythonClass
uid: azure.mgmt.resiliencemanagement.types.RecoveryPlanProperties
name: RecoveryPlanProperties
fullName: azure.mgmt.resiliencemanagement.types.RecoveryPlanProperties
module: azure.mgmt.resiliencemanagement.types
summary: Properties of the recovery orchestration plan.
constructor:
  syntax: RecoveryPlanProperties()
variables:
- description: 'The provisioning state of the recovery orchestration plan. Known

    values are: "Succeeded", "Failed", "Canceled", "Provisioning", "Updating", "Deleting",

    "Accepted", and "NeedsAttention".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The type of the recovery orchestration plan, which can be set during
    creation

    but cannot be changed afterward. Required. Known values are: "Regional" and "Zonal".'
  name: planType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecoveryPlanType">]
- description: 'The current state of the recovery orchestration plan. Known values
    are:

    "UnderEdit", "Warning", and "Ready".'
  name: planState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecoveryPlanState">]
- description: A description of the recovery orchestration plan. Required.
  name: planDescription
  types:
  - <xref:str>
- description: 'Settings for the recovery orchestration groups associated with the

    recovery orchestration plan. Required.'
  name: recoveryGroupsSetting
  types:
  - <xref:<xref:"RecoveryGroupsSetting">>
- description: The status of the most recent failover operation executed.
  name: latestFailoverStatus
  types:
  - <xref:<xref:"RecoveryPlanFailoverOperationStatus">>
- description: The status of the most recent validation performed.
  name: latestValidationStatus
  types:
  - <xref:<xref:"RecoveryPlanOperationStatus">>
- description: Error details associated with the resource.
  name: errorDetails
  types:
  - <xref:<xref:"ErrorDetail">>
attributes:
- uid: azure.mgmt.resiliencemanagement.types.RecoveryPlanProperties.errorDetails
  name: errorDetails
  summary: Error details associated with the resource.
  signature: 'errorDetails: ErrorDetail'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryPlanProperties.latestFailoverStatus
  name: latestFailoverStatus
  summary: The status of the most recent failover operation executed.
  signature: 'latestFailoverStatus: RecoveryPlanFailoverOperationStatus'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryPlanProperties.latestValidationStatus
  name: latestValidationStatus
  summary: The status of the most recent validation performed.
  signature: 'latestValidationStatus: RecoveryPlanOperationStatus'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryPlanProperties.planDescription
  name: planDescription
  summary: A description of the recovery orchestration plan. Required.
  signature: 'planDescription: Required[str]'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryPlanProperties.planState
  name: planState
  summary: '"UnderEdit",

    "Warning", and "Ready".'
  signature: 'planState: str | RecoveryPlanState'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryPlanProperties.planType
  name: planType
  summary: 'The type of the recovery orchestration plan, which can be set during creation
    but cannot be

    changed afterward. Required. Known values are: "Regional" and "Zonal".'
  signature: 'planType: Required[str | RecoveryPlanType]'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryPlanProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Provisioning", "Updating", "Deleting", "Accepted", and

    "NeedsAttention".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.resiliencemanagement.types.RecoveryPlanProperties.recoveryGroupsSetting
  name: recoveryGroupsSetting
  summary: 'Settings for the recovery orchestration groups associated with the recovery
    orchestration plan.

    Required.'
  signature: 'recoveryGroupsSetting: Required[RecoveryGroupsSetting]'
