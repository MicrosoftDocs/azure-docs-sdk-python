### YamlMime:PythonClass
uid: azure.mgmt.resiliencemanagement.models.RecoveryJobResourceProperties
name: RecoveryJobResourceProperties
fullName: azure.mgmt.resiliencemanagement.models.RecoveryJobResourceProperties
module: azure.mgmt.resiliencemanagement.models
summary: 'Properties of a recovery orchestration job resource associated with a recovery
  orchestration

  plan.'
constructor:
  syntax: 'RecoveryJobResourceProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The current status of the job execution. Known values are: "NotApplicable",

    "NotStarted", "Pending", "InProgress", "Completed", "CompletedWithWarnings", "Failed",

    "Skipped", "Cancelling", "Cancelled", and "Paused".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.JobStatus>
- description: The start time of the job execution.
  name: start_time
  types:
  - <xref:datetime.datetime>
- description: The end time of the job execution.
  name: end_time
  types:
  - <xref:datetime.datetime>
- description: The time elapsed during the execution of this job.
  name: duration
  types:
  - <xref:datetime.timedelta>
- description: Details of any errors that occurred during the execution of this job.
  name: error_details
  types:
  - <xref:azure.mgmt.resiliencemanagement.models.JobErrorInfo>
- description: 'The resource for which this job was created. This is typically the
    resource

    that the job is intended to manage or operate on.'
  name: resource_id
  types:
  - <xref:str>
- description: The operation that this job is intended to perform.
  name: operation
  types:
  - <xref:str>
- description: Details of any retries that have been attempted for this job.
  name: retry_details
  types:
  - <xref:list>[<xref:azure.mgmt.resiliencemanagement.models.JobRetryDetails>]
- description: Additional information about the job.
  name: job_extended_info
  types:
  - <xref:azure.mgmt.resiliencemanagement.models.JobExtendedInfo>
- description: User Comments.
  name: user_comments
  types:
  - <xref:list>[<xref:azure.mgmt.resiliencemanagement.models.JobUserComment>]
- description: Id of the Job under which this job-resource exists.
  name: job_id
  types:
  - <xref:str>
- description: Id of the job-task to which this job resource is associated.
  name: task_id
  types:
  - <xref:str>
- description: Friendly name of the job-task to which this job resource is associated.
  name: task_name
  types:
  - <xref:str>
- description: 'Discriminator for the Job object hierarchy. Required. Recovery

    Orchestration Plan created job resource.'
  name: job_resource_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.RECOVERY_PLAN>
- description: 'The provisioning state of the recovery job resource. Known values

    are: "Succeeded", "Failed", "Canceled", "Provisioning", "Updating", "Deleting",
    "Accepted", and

    "NeedsAttention".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.ProvisioningState>
- description: 'A setting that indicates the protection solution selected.

    Known values are: "None", "AzureNative", "AzureSiteRecovery", "CrossZoneVMRecovery",
    and

    "CustomRunbook".'
  name: protection_solution_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.ResourceProtectionSolutionType>
- description: The recovery action settings.
  name: recovery_group_action_settings
  types:
  - <xref:azure.mgmt.resiliencemanagement.models.RecoveryGroupActionSettings>
attributes:
- uid: azure.mgmt.resiliencemanagement.models.RecoveryJobResourceProperties.job_resource_type
  name: job_resource_type
  summary: 'Discriminator for the Job object hierarchy. Required. Recovery Orchestration
    Plan created job

    resource.'
  signature: 'job_resource_type: RECOVERY_PLAN: ''RecoveryPlan''>]'
- uid: azure.mgmt.resiliencemanagement.models.RecoveryJobResourceProperties.protection_solution_type
  name: protection_solution_type
  summary: '"None",

    "AzureNative", "AzureSiteRecovery", "CrossZoneVMRecovery", and "CustomRunbook".'
  signature: 'protection_solution_type: str | _models.ResourceProtectionSolutionType
    | None'
- uid: azure.mgmt.resiliencemanagement.models.RecoveryJobResourceProperties.provisioning_state
  name: provisioning_state
  summary: '"Succeeded",

    "Failed", "Canceled", "Provisioning", "Updating", "Deleting", "Accepted", and

    "NeedsAttention".'
  signature: 'provisioning_state: str | _models.ProvisioningState | None'
- uid: azure.mgmt.resiliencemanagement.models.RecoveryJobResourceProperties.recovery_group_action_settings
  name: recovery_group_action_settings
  summary: The recovery action settings.
  signature: 'recovery_group_action_settings: _models.RecoveryGroupActionSettings
    | None'
