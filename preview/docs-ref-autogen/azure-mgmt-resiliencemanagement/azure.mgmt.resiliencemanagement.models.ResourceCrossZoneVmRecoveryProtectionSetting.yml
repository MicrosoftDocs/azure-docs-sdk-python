### YamlMime:PythonClass
uid: azure.mgmt.resiliencemanagement.models.ResourceCrossZoneVmRecoveryProtectionSetting
name: ResourceCrossZoneVmRecoveryProtectionSetting
fullName: azure.mgmt.resiliencemanagement.models.ResourceCrossZoneVmRecoveryProtectionSetting
module: azure.mgmt.resiliencemanagement.models
summary: 'Definition of recovery orchestration resource protection with cross-zone
  (zonally resilient) VM

  recovery.'
constructor:
  syntax: 'ResourceCrossZoneVmRecoveryProtectionSetting(*args: Any, **kwargs: Any)'
variables:
- description: Required. Cross zone recovery enabled Azure VMs.
  name: protection_solution_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.CROSS_ZONE_VM_RECOVERY>
- description: 'Customer-requested logical target availability zone for zonal failover
    (a

    positive availability-zone id, e.g. "1", "2", "3"; additional zones are accepted
    where the

    region exposes them). Always optional; when omitted the service selects a healthy
    zone.

    Immutable per failover.'
  name: target_zone
  types:
  - <xref:str>
- description: 'ARM resource ID of the Capacity Reservation Group (in the

    same subscription as the VM) to use when moving the VM to the target zone.'
  name: capacity_reservation_group_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.resiliencemanagement.models.ResourceCrossZoneVmRecoveryProtectionSetting.capacity_reservation_group_id
  name: capacity_reservation_group_id
  summary: 'ARM resource ID of the Capacity Reservation Group (in the same subscription
    as the VM) to use

    when moving the VM to the target zone.'
  signature: 'capacity_reservation_group_id: str | None'
- uid: azure.mgmt.resiliencemanagement.models.ResourceCrossZoneVmRecoveryProtectionSetting.protection_solution_type
  name: protection_solution_type
  summary: Required. Cross zone recovery enabled Azure VMs.
  signature: 'protection_solution_type: CROSS_ZONE_VM_RECOVERY: ''CrossZoneVMRecovery''>]'
- uid: azure.mgmt.resiliencemanagement.models.ResourceCrossZoneVmRecoveryProtectionSetting.target_zone
  name: target_zone
  summary: 'Customer-requested logical target availability zone for zonal failover
    (a positive

    availability-zone id, e.g. "1", "2", "3"; additional zones are accepted where
    the region

    exposes them). Always optional; when omitted the service selects a healthy zone.
    Immutable per

    failover.'
  signature: 'target_zone: str | None'
