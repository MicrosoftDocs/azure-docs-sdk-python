### YamlMime:PythonClass
uid: azure.mgmt.resiliencemanagement.types.AttentionReason
name: AttentionReason
fullName: azure.mgmt.resiliencemanagement.types.AttentionReason
module: azure.mgmt.resiliencemanagement.types
summary: Reason why the Drill is in NeedsAttention state, and not ready to run.
constructor:
  syntax: AttentionReason()
variables:
- description: 'Drill object does not have the necessary RBAC to run the chaos

    resource. Known values are: "Set" and "NotSet".'
  name: drillRbacOnChaosResource
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RBACState">]
- description: 'Permissions needed by the Drill MSI to run the chaos

    resource.'
  name: rbacNeededForDrillOnChaosResource
  types:
  - <xref:list>[<xref:str>]
- description: 'Drill object does not have the necessary RBAC to run the

    Recovery Plan. Known values are: "Set" and "NotSet".'
  name: drillRbacOnRecoveryPlan
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RBACState">]
- description: 'Permissions needed by the Drill MSI to run the Recovery

    Plan.'
  name: rbacNeededForDrillOnRecoveryPlan
  types:
  - <xref:list>[<xref:str>]
- description: 'Associated RO ready or not. Known values are: "UnderEdit", "Warning",
    and

    "Ready".'
  name: roReadiness
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecoveryPlanState">]
- description: 'RBAC required by Chaos Resource MSI not setup on the target

    resources. Known values are: "Set" and "NotSet".'
  name: rbacOnTargetResources
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RBACState">]
- description: 'RBAC required by AutomationAccount for runbook MSI not setup

    on the target resources. Known values are: "Set" and "NotSet".'
  name: runbookFaultRbacOnTargets
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RBACState">]
- description: 'Chaos resource for faulting exists or not. Known values are: "Exists"
    and

    "NotExists".'
  name: chaosResource
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExtensionObjectState">]
- description: Reason for Chaos Resource Creation failure.
  name: chaosResourceCreationFailureReasons
  types:
  - <xref:list>[<xref:str>]
- description: 'Resources associated in Recovery Plan and Drill are

    out of sync. Known values are: "InSync" and "OutOfSync".'
  name: recoveryPlanAndDrillResourcesState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RelativeResourceCompositionState">]
- description: 'Resources in Service Group and Drill are out of sync.

    Known values are: "InSync" and "OutOfSync".'
  name: serviceGroupAndDrillResourcesState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RelativeResourceCompositionState">]
- description: 'User MSI associated with Drill object is deleted. Known values are:

    "Exists" and "NotExists".'
  name: drillUserMsi
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExtensionObjectState">]
- description: 'User MSI associated with chaos resource object is deleted. Known

    values are: "Exists" and "NotExists".'
  name: chaosResourceUserMsi
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExtensionObjectState">]
- description: 'Included resource in Drill. Known values are: "Exists" and

    "NotExists".'
  name: includedResourceInDrill
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExtensionObjectState">]
- description: 'Drill MSI does not have the necessary RBAC to read the

    Drill Monitoring resources. Known values are: "Set" and "NotSet".'
  name: drillRbacOnMonitoringResources
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RBACState">]
- description: Errors related to Drill Monitoring resources.
  name: drillMonitoringErrors
  types:
  - <xref:list>[<xref:"ErrorDetails">]
- description: 'Monitoring Resources created for Drill. Known values are:

    "Exists" and "NotExists".'
  name: drillMonitoringResources
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExtensionObjectState">]
- description: 'Monitoring RBAC required by Drill MSI not setup on the

    target resources. Known values are: "Set" and "NotSet".'
  name: monitoringRbacOnDrillResources
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RBACState">]
- description: 'Permissions needed by the Drill MSI to

    Upload service group health data for monitoring.'
  name: rbacNeededForDrillOnDrillMonitoringResources
  types:
  - <xref:list>[<xref:str>]
- description: 'Permissions needed by the Drill MSI to read health

    metrics data for resources in service group.'
  name: rbacNeededForDrillOnDrillResources
  types:
  - <xref:list>[<xref:str>]
- description: 'List of required required Azure resource providers that

    are not registered in the subscription specified for chaos resource.'
  name: missingRequiredResourceProviders
  types:
  - <xref:list>[<xref:str>]
- description: 'Neither an Azure Health Model nor an SLI is configured for

    the Drill. Execution is blocked until a monitoring source is configured.'
  name: monitoringSourceNotConfigured
  types:
  - <xref:bool>
- description: 'Whether the selected Azure Health Model still exists. Known values

    are: "Exists" and "NotExists".'
  name: healthModelExists
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExtensionObjectState">]
- description: 'Whether the selected discovery rule still exists. Known values are:

    "Exists" and "NotExists".'
  name: discoveryRuleExists
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExtensionObjectState">]
- description: 'Whether the Drill identity has the necessary RBAC (Reader) to

    read the selected Azure Health Model. Known values are: "Set" and "NotSet".'
  name: drillRbacOnHealthModel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RBACState">]
- description: 'Permissions needed by the Drill identity to read the

    selected Azure Health Model.'
  name: rbacNeededForDrillOnHealthModel
  types:
  - <xref:list>[<xref:str>]
- description: 'Rolled-up RBAC state: NotSet if the Drill identity is missing the

    necessary RBAC to read any selected SLI. Known values are: "Set" and "NotSet".'
  name: drillRbacOnSli
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RBACState">]
- description: 'Per-SLI attention status for each SLI selected for Drill

    monitoring.'
  name: sliAttentionStatuses
  types:
  - <xref:list>[<xref:"SliAttentionStatus">]
