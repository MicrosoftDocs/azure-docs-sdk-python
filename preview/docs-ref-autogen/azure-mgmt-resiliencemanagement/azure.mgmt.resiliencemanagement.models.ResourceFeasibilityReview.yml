### YamlMime:PythonClass
uid: azure.mgmt.resiliencemanagement.models.ResourceFeasibilityReview
name: ResourceFeasibilityReview
fullName: azure.mgmt.resiliencemanagement.models.ResourceFeasibilityReview
module: azure.mgmt.resiliencemanagement.models
summary: Result of a single feasibility review performed against one resource in a
  recovery plan.
constructor:
  syntax: 'ResourceFeasibilityReview(*args: Any, **kwargs: Any)'
variables:
- description: The resource feasibility review type. Required. "SkuCapacity"
  name: feasibility_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.ResourceFeasibilityReviewType>
- description: 'Fully qualified ARM resource type evaluated, e.g.

    `Microsoft.Compute/virtualMachines`. Required.'
  name: resource_type
  types:
  - <xref:str>
- description: 'The SKU the resource is currently configured to recover into,

    enriched for comparison against the recommendations. Absent when it could not
    be resolved, and

    always absent on `Passed` and `NotApplicable` reviews.'
  name: current_target_sku
  types:
  - <xref:azure.mgmt.resiliencemanagement.models.SkuDetails>
- description: 'Outcome of this feasibility review. Required. Known values are: "Unavailable",

    "Passed", "Flagged", and "NotApplicable".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.ResourceFeasibilityReviewStatus>
- description: 'Alternative SKUs surfaced for this review. Absent or empty means

    a `Flagged` review has no alternatives, an `Unavailable` review has no applicable

    recommendations to surface, or the review has a minimal `Passed` / `NotApplicable`
    outcome.

    Callers should treat an absent array and an empty array identically.'
  name: recommended_target_skus
  types:
  - <xref:list>[<xref:azure.mgmt.resiliencemanagement.models.SkuDetails>]
attributes:
- uid: azure.mgmt.resiliencemanagement.models.ResourceFeasibilityReview.current_target_sku
  name: current_target_sku
  summary: 'The SKU the resource is currently configured to recover into, enriched
    for comparison against

    the recommendations. Absent when it could not be resolved, and always absent on
    `Passed` and

    `NotApplicable` reviews.'
  signature: 'current_target_sku: _models.SkuDetails | None'
- uid: azure.mgmt.resiliencemanagement.models.ResourceFeasibilityReview.feasibility_type
  name: feasibility_type
  summary: The resource feasibility review type. Required. "SkuCapacity"
  signature: 'feasibility_type: str | _models.ResourceFeasibilityReviewType'
- uid: azure.mgmt.resiliencemanagement.models.ResourceFeasibilityReview.recommended_target_skus
  name: recommended_target_skus
  summary: 'Alternative SKUs surfaced for this review. Absent or empty means a `Flagged`
    review has no

    alternatives, an `Unavailable` review has no applicable recommendations to surface,
    or the

    review has a minimal `Passed` / `NotApplicable` outcome. Callers should treat
    an absent

    array and an empty array identically.'
  signature: 'recommended_target_skus: list[''_models.SkuDetails''] | None'
- uid: azure.mgmt.resiliencemanagement.models.ResourceFeasibilityReview.resource_type
  name: resource_type
  summary: 'Fully qualified ARM resource type evaluated, e.g. `Microsoft.Compute/virtualMachines`.

    Required.'
  signature: 'resource_type: str'
- uid: azure.mgmt.resiliencemanagement.models.ResourceFeasibilityReview.status
  name: status
  summary: '"Unavailable", "Passed",

    "Flagged", and "NotApplicable".'
  signature: 'status: str | _models.ResourceFeasibilityReviewStatus'
