### YamlMime:PythonClass
uid: azure.mgmt.resiliencemanagement.types.SliAttentionStatus
name: SliAttentionStatus
fullName: azure.mgmt.resiliencemanagement.types.SliAttentionStatus
module: azure.mgmt.resiliencemanagement.types
summary: Per-SLI attention status of a Drill.
constructor:
  syntax: SliAttentionStatus()
variables:
- description: Full ARM Id of the SLI this status refers to. Required.
  name: sliId
  types:
  - <xref:str>
- description: 'User-declared category of the SLI. Required. Known values are: "Availability"
    and

    "Latency".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SliType">]
- description: 'Whether the selected SLI still exists. Known values are: "Exists"
    and

    "NotExists".'
  name: exists
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExtensionObjectState">]
- description: 'Whether the user-declared SLI type matches the SLI''s actual category.
    Known

    values are: "Matched" and "Mismatched".'
  name: typeMatch
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SliTypeMatchState">]
- description: 'Rolled-up RBAC state: NotSet if the Drill identity is missing

    Monitoring Reader on any of the SLI''s destination Azure Monitor Workspaces. Known
    values are:

    "Set" and "NotSet".'
  name: drillRbacOnDestinationAmw
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RBACState">]
- description: 'The destination Azure Monitor Workspaces that are still

    missing the Monitoring Reader grant for the Drill identity.'
  name: rbacNeededOnDestinationAmws
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.resiliencemanagement.types.SliAttentionStatus.drillRbacOnDestinationAmw
  name: drillRbacOnDestinationAmw
  summary: 'NotSet if the Drill identity is missing Monitoring Reader on any of the

    SLI''s destination Azure Monitor Workspaces. Known values are: "Set" and "NotSet".'
  signature: 'drillRbacOnDestinationAmw: str | RBACState'
- uid: azure.mgmt.resiliencemanagement.types.SliAttentionStatus.exists
  name: exists
  summary: '"Exists" and "NotExists".'
  signature: 'exists: str | ExtensionObjectState'
- uid: azure.mgmt.resiliencemanagement.types.SliAttentionStatus.rbacNeededOnDestinationAmws
  name: rbacNeededOnDestinationAmws
  summary: 'The destination Azure Monitor Workspaces that are still missing the Monitoring
    Reader grant for

    the Drill identity.'
  signature: 'rbacNeededOnDestinationAmws: list[str]'
- uid: azure.mgmt.resiliencemanagement.types.SliAttentionStatus.sliId
  name: sliId
  summary: Full ARM Id of the SLI this status refers to. Required.
  signature: 'sliId: Required[str]'
- uid: azure.mgmt.resiliencemanagement.types.SliAttentionStatus.type
  name: type
  summary: '"Availability" and

    "Latency".'
  signature: 'type: Required[str | SliType]'
- uid: azure.mgmt.resiliencemanagement.types.SliAttentionStatus.typeMatch
  name: typeMatch
  summary: 'Whether the user-declared SLI type matches the SLI''s actual category.
    Known values are:

    "Matched" and "Mismatched".'
  signature: 'typeMatch: str | SliTypeMatchState'
