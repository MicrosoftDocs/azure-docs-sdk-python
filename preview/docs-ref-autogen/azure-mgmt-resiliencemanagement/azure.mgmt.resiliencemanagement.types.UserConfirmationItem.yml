uid: azure.mgmt.resiliencemanagement.types.UserConfirmationItem
name: UserConfirmationItem
fullName: azure.mgmt.resiliencemanagement.types.UserConfirmationItem
module: azure.mgmt.resiliencemanagement.types
summary: Represents a user confirmation for a high availability solution.
constructor:
  syntax: UserConfirmationItem()
variables:
- description: 'The solution display name of the high availability solution.

    Required. Known values are: "ZonePinnedVmWithZrsDisk" and "VmInMultiZoneVmss".'
  name: solutionDisplayName
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SolutionDisplayName">]
- description: 'The confirmation status of the high availability solution. Required.

    Known values are: "ApprovedByUser", "ApprovalPending", "ApprovalNotNeeded", and

    "RejectedByUser".'
  name: confirmationStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConfirmationStatus">]
- description: 'The reason for requesting user confirmation for the high

    availability solution. Known values are: "ZonePinnedZrsDataDisksConditional" and

    "VmInMultiZoneScaleSetStatelessOnly".'
  name: reasonForRequestingConfirmation
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReasonForRequestingConfirmation">]
