### YamlMime:PythonClass
uid: azure.mgmt.resiliencemanagement.models.DrillReportSummary
name: DrillReportSummary
fullName: azure.mgmt.resiliencemanagement.models.DrillReportSummary
module: azure.mgmt.resiliencemanagement.models
summary: 'Public, read-only summary of report generation for a Drill Run. Exposes
  status and pointers

  only - the report content and internal storage locations are never surfaced.'
constructor:
  syntax: 'DrillReportSummary(*args: Any, **kwargs: Any)'
variables:
- description: 'Overall report generation status for the Drill Run. Known values are:

    "NotStarted", "InProgress", "Succeeded", and "Failed".'
  name: generation_status
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.DrillReportGenerationStatus>
- description: Per-stage report generation statuses.
  name: stage_statuses
  types:
  - <xref:list>[<xref:azure.mgmt.resiliencemanagement.models.ReportStageStatus>]
- description: Formats the report is currently available for download in.
  name: available_formats
  types:
  - <xref:list>[<xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.DrillReportFormat>]
- description: Timestamp of the last successful report generation.
  name: last_generated_timestamp
  types:
  - <xref:datetime.datetime>
- description: Schema version of the generated report content.
  name: schema_version
  types:
  - <xref:str>
- description: 'Finalization state of the report. A finalized report is immutable.

    Known values are: "NotFinalized" and "Finalized".'
  name: finalization_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.resiliencemanagement.models.DrillReportFinalizationState>
- description: Error from the last failed report generation attempt.
  name: last_error
  types:
  - <xref:azure.mgmt.resiliencemanagement.models.ErrorDetails>
attributes:
- uid: azure.mgmt.resiliencemanagement.models.DrillReportSummary.available_formats
  name: available_formats
  summary: Formats the report is currently available for download in.
  signature: 'available_formats: list[typing.Union[str, ForwardRef(''_models.DrillReportFormat'')]]
    | None'
- uid: azure.mgmt.resiliencemanagement.models.DrillReportSummary.finalization_state
  name: finalization_state
  summary: 'Finalization state of the report. A finalized report is immutable. Known
    values are:

    "NotFinalized" and "Finalized".'
  signature: 'finalization_state: str | _models.DrillReportFinalizationState | None'
- uid: azure.mgmt.resiliencemanagement.models.DrillReportSummary.generation_status
  name: generation_status
  summary: '"NotStarted",

    "InProgress", "Succeeded", and "Failed".'
  signature: 'generation_status: str | _models.DrillReportGenerationStatus | None'
- uid: azure.mgmt.resiliencemanagement.models.DrillReportSummary.last_error
  name: last_error
  summary: Error from the last failed report generation attempt.
  signature: 'last_error: _models.ErrorDetails | None'
- uid: azure.mgmt.resiliencemanagement.models.DrillReportSummary.last_generated_timestamp
  name: last_generated_timestamp
  summary: Timestamp of the last successful report generation.
  signature: 'last_generated_timestamp: datetime | None'
- uid: azure.mgmt.resiliencemanagement.models.DrillReportSummary.schema_version
  name: schema_version
  summary: Schema version of the generated report content.
  signature: 'schema_version: str | None'
- uid: azure.mgmt.resiliencemanagement.models.DrillReportSummary.stage_statuses
  name: stage_statuses
  summary: Per-stage report generation statuses.
  signature: 'stage_statuses: list[''_models.ReportStageStatus''] | None'
