### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.ScheduledActionsSchedule
name: ScheduledActionsSchedule
fullName: azure.mgmt.compute.bulkaction.types.ScheduledActionsSchedule
module: azure.mgmt.compute.bulkaction.types
summary: Specify the schedule in which the scheduled action is supposed to follow.
constructor:
  syntax: ScheduledActionsSchedule()
variables:
- description: The time the scheduled action is supposed to run on. Required.
  name: scheduled_time
  types:
  - <xref:str>
- description: The timezone the scheduled time is specified on. Required.
  name: time_zone
  types:
  - <xref:str>
- description: 'The week days the scheduled action is supposed to run on. If empty,

    it means it will run on every week day.'
  name: requested_week_days
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"WeekDay">]]
- description: 'The months the scheduled action is supposed to run on. If empty, it

    means it will run on every month.'
  name: requested_months
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"Month">]]
- description: 'The days of the month the scheduled action is supposed to

    run on. If empty, it means it will run on every day of the month.'
  name: requested_days_of_the_month
  types:
  - <xref:list>[<xref:int>]
- description: 'The execution parameters the scheduled action is supposed to

    follow.'
  name: execution_parameters
  types:
  - <xref:<xref:"RecurringScheduledActionsExecutionParameters">>
- description: 'The type of deadline the scheduled action is supposed to follow for
    the

    schedule. If no value is passed, it will default to InitiateAt. Known values are:
    "Unknown",

    "InitiateAt", and "CompleteBy".'
  name: deadline_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecurringScheduledActionsDeadlineType">]
attributes:
- uid: azure.mgmt.compute.bulkaction.types.ScheduledActionsSchedule.deadlineType
  name: deadlineType
  summary: 'The type of deadline the scheduled action is supposed to follow for the
    schedule. If no value

    is passed, it will default to InitiateAt. Known values are: "Unknown", "InitiateAt",
    and

    "CompleteBy".'
  signature: 'deadlineType: str | RecurringScheduledActionsDeadlineType'
- uid: azure.mgmt.compute.bulkaction.types.ScheduledActionsSchedule.executionParameters
  name: executionParameters
  summary: The execution parameters the scheduled action is supposed to follow.
  signature: 'executionParameters: RecurringScheduledActionsExecutionParameters'
- uid: azure.mgmt.compute.bulkaction.types.ScheduledActionsSchedule.requestedDaysOfTheMonth
  name: requestedDaysOfTheMonth
  summary: 'The days of the month the scheduled action is supposed to run on. If empty,
    it means it will

    run on every day of the month.'
  signature: 'requestedDaysOfTheMonth: list[int]'
- uid: azure.mgmt.compute.bulkaction.types.ScheduledActionsSchedule.requestedMonths
  name: requestedMonths
  summary: 'The months the scheduled action is supposed to run on. If empty, it means
    it will run on every

    month.'
  signature: 'requestedMonths: list[typing.Union[str, ForwardRef(''Month'')]]'
- uid: azure.mgmt.compute.bulkaction.types.ScheduledActionsSchedule.requestedWeekDays
  name: requestedWeekDays
  summary: 'The week days the scheduled action is supposed to run on. If empty, it
    means it will run on

    every week day.'
  signature: 'requestedWeekDays: list[typing.Union[str, ForwardRef(''WeekDay'')]]'
- uid: azure.mgmt.compute.bulkaction.types.ScheduledActionsSchedule.scheduledTime
  name: scheduledTime
  summary: The time the scheduled action is supposed to run on. Required.
  signature: 'scheduledTime: Required[str]'
- uid: azure.mgmt.compute.bulkaction.types.ScheduledActionsSchedule.timeZone
  name: timeZone
  summary: The timezone the scheduled time is specified on. Required.
  signature: 'timeZone: Required[str]'
