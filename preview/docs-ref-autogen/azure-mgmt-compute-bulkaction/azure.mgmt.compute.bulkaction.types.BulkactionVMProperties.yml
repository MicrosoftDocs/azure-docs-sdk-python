### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties
name: BulkactionVMProperties
fullName: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties
module: azure.mgmt.compute.bulkaction.types
summary: Describes the properties of a Virtual Machine for bulk create.
constructor:
  syntax: BulkactionVMProperties()
variables:
- description: 'Specifies Redeploy, Reboot and

    ScheduledEventsAdditionalPublishingTargets Scheduled Event related configurations
    for the

    virtual machine.'
  name: scheduledEventsPolicy
  types:
  - <xref:<xref:"ScheduledEventsPolicy">>
- description: Specifies the storage settings for the virtual machine disks.
  name: storageProfile
  types:
  - <xref:<xref:"StorageProfile">>
- description: Specifies the hardware profile for the virtual machine.
  name: hardwareProfile
  types:
  - <xref:<xref:"HardwareProfile">>
- description: 'Specifies additional capabilities enabled or disabled on the

    virtual machine.'
  name: additionalCapabilities
  types:
  - <xref:<xref:"AdditionalCapabilities">>
- description: 'Specifies the operating system settings used while creating the virtual

    machine. Some of the settings cannot be changed once VM is provisioned.'
  name: osProfile
  types:
  - <xref:<xref:"OSProfile">>
- description: Specifies the network interfaces of the virtual machine.
  name: networkProfile
  types:
  - <xref:<xref:"NetworkProfile">>
- description: Specifies the Security related profile settings for the virtual machine.
  name: securityProfile
  types:
  - <xref:<xref:"SecurityProfile">>
- description: 'Specifies the boot diagnostic settings state. Minimum compute

    api-version: 2015-06-15.'
  name: diagnosticsProfile
  types:
  - <xref:<xref:"DiagnosticsProfile">>
- description: 'Specifies that the image or disk that is being used was licensed

    on-premises. <br><br> Possible values for Windows Server operating system are:
    <br><br>

    Windows_Client <br><br> Windows_Server <br><br> Possible values for Linux Server
    operating

    system are: <br><br> RHEL_BYOS (for RHEL) <br><br> SLES_BYOS (for SUSE) <br><br>
    For more

    information, see [Azure Hybrid Use Benefit for Windows Server](https://docs.microsoft.com/azure/virtual-machines/windows/hybrid-use-benefit-licensing)

    <br><br> [Azure Hybrid Use Benefit for Linux Server](https://docs.microsoft.com/azure/virtual-machines/linux/azure-hybrid-benefit-linux)
    <br><br>

    Minimum api-version: 2015-06-15.'
  name: licenseType
  types:
  - <xref:str>
- description: 'Specifies the time alloted for all extensions to start. The time

    duration should be between 15 minutes and 120 minutes (inclusive) and should be
    specified in

    ISO 8601 format. The default value is 90 minutes (PT1H30M). Minimum compute api-version:

    2020-06-01.'
  name: extensionsTimeBudget
  types:
  - <xref:str>
- description: Specifies Scheduled Event related configurations.
  name: scheduledEventsProfile
  types:
  - <xref:<xref:"ScheduledEventsProfile">>
- description: 'UserData for the VM, which must be base-64 encoded. Customer should
    not pass

    any secrets in here. Minimum compute api-version: 2021-03-01.'
  name: userData
  types:
  - <xref:str>
- description: 'Specifies information about the capacity reservation that is used
    to

    allocate virtual machine. Minimum compute api-version: 2021-04-01.'
  name: capacityReservation
  types:
  - <xref:<xref:"CapacityReservationProfile">>
- description: 'Specifies the gallery applications that should be made available to

    the VM.'
  name: applicationProfile
  types:
  - <xref:<xref:"ApplicationProfile">>
- description: Virtual Machine Extensions Array to be applied to the Virtual Machines.
  name: vmExtensions
  types:
  - <xref:list>[<xref:"BulkactionVMExtension">]
attributes:
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.additionalCapabilities
  name: additionalCapabilities
  summary: Specifies additional capabilities enabled or disabled on the virtual machine.
  signature: 'additionalCapabilities: AdditionalCapabilities'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.applicationProfile
  name: applicationProfile
  summary: Specifies the gallery applications that should be made available to the
    VM.
  signature: 'applicationProfile: ApplicationProfile'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.capacityReservation
  name: capacityReservation
  summary: 'Specifies information about the capacity reservation that is used to allocate
    virtual machine.

    Minimum compute api-version: 2021-04-01.'
  signature: 'capacityReservation: CapacityReservationProfile'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.diagnosticsProfile
  name: diagnosticsProfile
  summary: 2015-06-15.
  signature: 'diagnosticsProfile: DiagnosticsProfile'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.extensionsTimeBudget
  name: extensionsTimeBudget
  summary: 'Specifies the time alloted for all extensions to start. The time duration
    should be between 15

    minutes and 120 minutes (inclusive) and should be specified in ISO 8601 format.
    The default

    value is 90 minutes (PT1H30M). Minimum compute api-version: 2020-06-01.'
  signature: 'extensionsTimeBudget: str'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.hardwareProfile
  name: hardwareProfile
  summary: Specifies the hardware profile for the virtual machine.
  signature: 'hardwareProfile: HardwareProfile'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.licenseType
  name: licenseType
  summary: 'Specifies that the image or disk that is being used was licensed on-premises.
    <br><br> Possible

    values for Windows Server operating system are: <br><br> Windows_Client <br><br>
    Windows_Server

    <br><br> Possible values for Linux Server operating system are: <br><br> RHEL_BYOS
    (for RHEL)

    <br><br> SLES_BYOS (for SUSE) <br><br> For more information, see [Azure Hybrid
    Use Benefit for

    Windows Server](https://docs.microsoft.com/azure/virtual-machines/windows/hybrid-use-benefit-licensing)

    <br><br> [Azure Hybrid Use Benefit for Linux Server](https://docs.microsoft.com/azure/virtual-machines/linux/azure-hybrid-benefit-linux)
    <br><br>

    Minimum api-version: 2015-06-15.'
  signature: 'licenseType: str'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.networkProfile
  name: networkProfile
  summary: Specifies the network interfaces of the virtual machine.
  signature: 'networkProfile: NetworkProfile'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.osProfile
  name: osProfile
  summary: 'Specifies the operating system settings used while creating the virtual
    machine. Some of the

    settings cannot be changed once VM is provisioned.'
  signature: 'osProfile: OSProfile'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.scheduledEventsPolicy
  name: scheduledEventsPolicy
  summary: 'Specifies Redeploy, Reboot and ScheduledEventsAdditionalPublishingTargets
    Scheduled Event

    related configurations for the virtual machine.'
  signature: 'scheduledEventsPolicy: ScheduledEventsPolicy'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.scheduledEventsProfile
  name: scheduledEventsProfile
  summary: Specifies Scheduled Event related configurations.
  signature: 'scheduledEventsProfile: ScheduledEventsProfile'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.securityProfile
  name: securityProfile
  summary: Specifies the Security related profile settings for the virtual machine.
  signature: 'securityProfile: SecurityProfile'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.storageProfile
  name: storageProfile
  summary: Specifies the storage settings for the virtual machine disks.
  signature: 'storageProfile: StorageProfile'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.userData
  name: userData
  summary: 'UserData for the VM, which must be base-64 encoded. Customer should not
    pass any secrets in

    here. Minimum compute api-version: 2021-03-01.'
  signature: 'userData: str'
- uid: azure.mgmt.compute.bulkaction.types.BulkactionVMProperties.vmExtensions
  name: vmExtensions
  summary: Virtual Machine Extensions Array to be applied to the Virtual Machines.
  signature: 'vmExtensions: list[azure.mgmt.compute.bulkaction.types.BulkactionVMExtension]'
