### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.VMDiskSecurityProfile
name: VMDiskSecurityProfile
fullName: azure.mgmt.compute.bulkaction.types.VMDiskSecurityProfile
module: azure.mgmt.compute.bulkaction.types
summary: 'Specifies the security profile settings for the managed disk. **Note:**
  It can only be set for

  Confidential VMs.'
constructor:
  syntax: VMDiskSecurityProfile()
variables:
- description: 'Specifies the EncryptionType of the managed disk. It is set to

    DiskWithVMGuestState for encryption of the managed disk along with VMGuestState
    blob,

    VMGuestStateOnly for encryption of just the VMGuestState blob, and NonPersistedTPM
    for not

    persisting firmware state in the VMGuestState blob.. **Note:** It can be set for
    only

    Confidential VMs. Known values are: "VMGuestStateOnly", "DiskWithVMGuestState",
    and

    "NonPersistedTPM".'
  name: securityEncryptionType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityEncryptionTypes">]
- description: 'Specifies the customer managed disk encryption set resource id for
    the

    managed disk that is used for Customer Managed Key encrypted ConfidentialVM OS
    Disk and VMGuest

    blob.'
  name: diskEncryptionSet
  types:
  - <xref:<xref:"DiskEncryptionSetParametersContent">>
attributes:
- uid: azure.mgmt.compute.bulkaction.types.VMDiskSecurityProfile.diskEncryptionSet
  name: diskEncryptionSet
  summary: 'Specifies the customer managed disk encryption set resource id for the
    managed disk that is

    used for Customer Managed Key encrypted ConfidentialVM OS Disk and VMGuest blob.'
  signature: 'diskEncryptionSet: DiskEncryptionSetParametersContent'
- uid: azure.mgmt.compute.bulkaction.types.VMDiskSecurityProfile.securityEncryptionType
  name: securityEncryptionType
  summary: 'Specifies the EncryptionType of the managed disk. It is set to DiskWithVMGuestState
    for

    encryption of the managed disk along with VMGuestState blob, VMGuestStateOnly
    for encryption of

    just the VMGuestState blob, and NonPersistedTPM for not persisting firmware state
    in the

    VMGuestState blob.. **Note:** It can be set for only Confidential VMs. Known values
    are:

    "VMGuestStateOnly", "DiskWithVMGuestState", and "NonPersistedTPM".'
  signature: 'securityEncryptionType: str | SecurityEncryptionTypes'
