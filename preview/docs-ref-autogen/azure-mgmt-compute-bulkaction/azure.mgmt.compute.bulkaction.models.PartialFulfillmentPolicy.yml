### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.models.PartialFulfillmentPolicy
name: PartialFulfillmentPolicy
fullName: azure.mgmt.compute.bulkaction.models.PartialFulfillmentPolicy
module: azure.mgmt.compute.bulkaction.models
summary: 'Controls how partial fulfillment is handled for a BulkCreateCustom request.
  When enabled, Azure

  creates only the VMs or vCPUs it has high confidence can be successfully allocated,
  instead of

  attempting the entire request and potentially returning allocation failures.'
constructor:
  syntax: 'PartialFulfillmentPolicy(*args: Any, **kwargs: Any)'
variables:
- description: 'The amount of capacity that was actually attempted, expressed in the

    units specified by capacityType. When partial fulfillment is enabled, this value
    can be less

    than the requested capacity.'
  name: fulfilled_capacity
  types:
  - <xref:int>
- description: 'Specifies whether partial fulfillment is allowed. When Enabled, Azure
    creates as

    many VMs as it has high confidence can be successfully allocated. When Disabled,
    Azure attempts

    to create all requested VMs, which may result into allocation failures. Known
    values are:

    "Enabled" and "Disabled".'
  name: mode
  types:
  - <xref:str>
  - <xref:azure.mgmt.compute.bulkaction.models.PartialFulfillmentMode>
- description: 'Indicates why the fulfilled capacity is less than the requested capacity.

    Possible values include InsufficientCapacity and InsufficientQuota. Returned only
    in the create

    response when partial fulfillment is enabled and the request cannot be fully satisfied.
    Known

    values are: "InsufficientCapacity", "InsufficientQuota", and "None".'
  name: reason
  types:
  - <xref:str>
  - <xref:azure.mgmt.compute.bulkaction.models.PartialFulfillmentReason>
attributes:
- uid: azure.mgmt.compute.bulkaction.models.PartialFulfillmentPolicy.fulfilled_capacity
  name: fulfilled_capacity
  summary: 'The amount of capacity that was actually attempted, expressed in the units
    specified by

    capacityType. When partial fulfillment is enabled, this value can be less than
    the requested

    capacity.'
  signature: 'fulfilled_capacity: int | None'
- uid: azure.mgmt.compute.bulkaction.models.PartialFulfillmentPolicy.mode
  name: mode
  summary: 'Specifies whether partial fulfillment is allowed. When Enabled, Azure
    creates as many VMs as it

    has high confidence can be successfully allocated. When Disabled, Azure attempts
    to create all

    requested VMs, which may result into allocation failures. Known values are: "Enabled"
    and

    "Disabled".'
  signature: 'mode: str | _models.PartialFulfillmentMode | None'
- uid: azure.mgmt.compute.bulkaction.models.PartialFulfillmentPolicy.reason
  name: reason
  summary: 'Indicates why the fulfilled capacity is less than the requested capacity.
    Possible values

    include InsufficientCapacity and InsufficientQuota. Returned only in the create
    response when

    partial fulfillment is enabled and the request cannot be fully satisfied. Known
    values are:

    "InsufficientCapacity", "InsufficientQuota", and "None".'
  signature: 'reason: str | _models.PartialFulfillmentReason | None'
