### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.ComputeProfile
name: ComputeProfile
fullName: azure.mgmt.compute.bulkaction.types.ComputeProfile
module: azure.mgmt.compute.bulkaction.types
summary: Compute Profile to configure the Virtual Machines.
constructor:
  syntax: ComputeProfile()
variables:
- description: 'Base Virtual Machine Profile Properties to be specified

    according to

    specification/compute/resource-manager/Microsoft.Compute/ComputeRP/stable/{computeApiVersion}/virtualMachine.json#/definitions/VirtualMachineProperties.

    Required.'
  name: virtual_machine_profile
  types:
  - <xref:<xref:"BulkactionVMProperties">>
- description: 'Virtual Machine Extensions Array to be specified according to

    specification/compute/resource-manager/Microsoft.Compute/ComputeRP/stable/{computeApiVersion}/virtualMachine.json#/definitions/VirtualMachineExtension.'
  name: extensions
  types:
  - <xref:list>[<xref:"BulkactionVMExtension">]
- description: 'Specifies the Microsoft.Compute API version to use when creating

    underlying Virtual Machines. The default value will be the latest supported computeApiVersion

    by LaunchBulkInstancesOperation.'
  name: compute_api_version
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.compute.bulkaction.types.ComputeProfile.computeApiVersion
  name: computeApiVersion
  summary: 'Specifies the Microsoft.Compute API version to use when creating underlying
    Virtual Machines.

    The default value will be the latest supported computeApiVersion by

    LaunchBulkInstancesOperation.'
  signature: 'computeApiVersion: str'
- uid: azure.mgmt.compute.bulkaction.types.ComputeProfile.extensions
  name: extensions
  summary: 'Virtual Machine Extensions Array to be specified according to

    specification/compute/resource-manager/Microsoft.Compute/ComputeRP/stable/{computeApiVersion}/virtualMachine.json#/definitions/VirtualMachineExtension.'
  signature: 'extensions: list[azure.mgmt.compute.bulkaction.types.BulkactionVMExtension]'
- uid: azure.mgmt.compute.bulkaction.types.ComputeProfile.virtualMachineProfile
  name: virtualMachineProfile
  summary: 'Base Virtual Machine Profile Properties to be specified according to

    specification/compute/resource-manager/Microsoft.Compute/ComputeRP/stable/{computeApiVersion}/virtualMachine.json#/definitions/VirtualMachineProperties.

    Required.'
  signature: 'virtualMachineProfile: BulkactionVMProperties'
