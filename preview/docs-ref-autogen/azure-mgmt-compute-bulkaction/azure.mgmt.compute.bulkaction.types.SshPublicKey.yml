### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.SshPublicKey
name: SshPublicKey
fullName: azure.mgmt.compute.bulkaction.types.SshPublicKey
module: azure.mgmt.compute.bulkaction.types
summary: 'Contains information about SSH certificate public key and the path on the
  Linux VM where the

  public key is placed.'
constructor:
  syntax: SshPublicKey()
variables:
- description: 'Specifies the full path on the created VM where ssh public key is
    stored. If the

    file already exists, the specified key is appended to the file. Example:

    /home/user/.ssh/authorized_keys.'
  name: path
  types:
  - <xref:str>
- description: 'SSH public key certificate used to authenticate with the VM through
    ssh. The key

    needs to be at least 2048-bit and in ssh-rsa format. For creating ssh keys, see
    [Create SSH

    keys on Linux and Mac for Linux VMs in

    Azure]`https://docs.microsoft.com/azure/virtual-machines/linux/create-ssh-keys-detailed

    <[https://docs.microsoft.com/azure/virtual-machines/linux/create-ssh-keys-detailed](https://docs.microsoft.com/azure/virtual-machines/linux/create-ssh-keys-detailed)>`_).'
  name: keyData
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.compute.bulkaction.types.SshPublicKey.keyData
  name: keyData
  summary: 'SSH public key certificate used to authenticate with the VM through ssh.
    The key needs to be at

    least 2048-bit and in ssh-rsa format. For creating ssh keys, see [Create SSH keys
    on Linux and

    Mac for Linux VMs in

    Azure]`https://docs.microsoft.com/azure/virtual-machines/linux/create-ssh-keys-detailed

    <[https://docs.microsoft.com/azure/virtual-machines/linux/create-ssh-keys-detailed](https://docs.microsoft.com/azure/virtual-machines/linux/create-ssh-keys-detailed)>`_).'
  signature: 'keyData: str'
- uid: azure.mgmt.compute.bulkaction.types.SshPublicKey.path
  name: path
  summary: 'Specifies the full path on the created VM where ssh public key is stored.
    If the file already

    exists, the specified key is appended to the file. Example: /home/user/.ssh/authorized_keys.'
  signature: 'path: str'
