### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.FlexProperties
name: FlexProperties
fullName: azure.mgmt.compute.bulkaction.types.FlexProperties
module: azure.mgmt.compute.bulkaction.types
summary: The flex properties for flexible VM creation.
constructor:
  syntax: FlexProperties()
variables:
- description: The list of VM size profiles to use for flex creation. Required.
  name: vmSizeProfiles
  types:
  - <xref:list>[<xref:"VmSizeProfile">]
- description: 'The operating system type for the VMs. Required. Known values are:
    "Windows" and

    "Linux".'
  name: osType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OsType">]
- description: The priority profile for VM allocation. Required.
  name: priorityProfile
  types:
  - <xref:<xref:"PriorityProfile">>
- description: 'The zone allocation policy for distributing VMs across availability

    zones.'
  name: zoneAllocationPolicy
  types:
  - <xref:<xref:"ZoneAllocationPolicy">>
- description: 'The minimum number of VMs that must be successfully created for the
    request

    to proceed. If fewer than this number can be allocated, the entire request is
    automatically

    rejected.'
  name: minCapacity
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.compute.bulkaction.types.FlexProperties.minCapacity
  name: minCapacity
  summary: 'The minimum number of VMs that must be successfully created for the request
    to proceed. If

    fewer than this number can be allocated, the entire request is automatically rejected.'
  signature: 'minCapacity: int'
- uid: azure.mgmt.compute.bulkaction.types.FlexProperties.osType
  name: osType
  summary: '"Windows" and "Linux".'
  signature: 'osType: Required[str | OsType]'
- uid: azure.mgmt.compute.bulkaction.types.FlexProperties.priorityProfile
  name: priorityProfile
  summary: The priority profile for VM allocation. Required.
  signature: 'priorityProfile: Required[PriorityProfile]'
- uid: azure.mgmt.compute.bulkaction.types.FlexProperties.vmSizeProfiles
  name: vmSizeProfiles
  summary: The list of VM size profiles to use for flex creation. Required.
  signature: 'vmSizeProfiles: Required[list[''VmSizeProfile'']]'
- uid: azure.mgmt.compute.bulkaction.types.FlexProperties.zoneAllocationPolicy
  name: zoneAllocationPolicy
  summary: The zone allocation policy for distributing VMs across availability zones.
  signature: 'zoneAllocationPolicy: ZoneAllocationPolicy'
