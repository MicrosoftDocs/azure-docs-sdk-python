### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomOverridesProfile
name: BulkCreateCustomOverridesProfile
fullName: azure.mgmt.compute.bulkaction.types.BulkCreateCustomOverridesProfile
module: azure.mgmt.compute.bulkaction.types
summary: 'Groups the per-VM overrides with the name prefix that names any override
  that does not supply

  its own VM name.'
constructor:
  syntax: BulkCreateCustomOverridesProfile()
variables:
- description: 'Prefix used to build the ARM VM name ({prefix}_{index}) for

    overrides that omit a virtualMachineName. Required when any override is unnamed
    and rejected

    when every override is named.'
  name: virtualMachineNamePrefix
  types:
  - <xref:str>
- description: 'Per-VM overrides. The count is the VM count and must equal capacity.
    Each

    override maps to VM index i.'
  name: overrides
  types:
  - <xref:list>[<xref:"BulkCreateCustomOverride">]
attributes:
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomOverridesProfile.overrides
  name: overrides
  summary: 'Per-VM overrides. The count is the VM count and must equal capacity. Each
    override maps to VM

    index i.'
  signature: 'overrides: list[azure.mgmt.compute.bulkaction.types.BulkCreateCustomOverride]'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomOverridesProfile.virtualMachineNamePrefix
  name: virtualMachineNamePrefix
  summary: 'Prefix used to build the ARM VM name ({prefix}_{index}) for overrides
    that omit a

    virtualMachineName. Required when any override is unnamed and rejected when every
    override is

    named.'
  signature: 'virtualMachineNamePrefix: str'
