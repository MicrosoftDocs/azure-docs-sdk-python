uid: azure.mgmt.compute.bulkaction.models.CapacityRecommendationParameters
name: CapacityRecommendationParameters
fullName: azure.mgmt.compute.bulkaction.models.CapacityRecommendationParameters
module: azure.mgmt.compute.bulkaction.models
summary: 'The parameters used to request capacity/placement recommendations for a
  start operation.

  Placement recommendations are only computed if the VM fails to start due to an allocation

  failure.'
constructor:
  syntax: 'CapacityRecommendationParameters(*args: Any, **kwargs: Any)'
variables:
- description: 'The list of desired Azure regions to be considered for the capacity

    recommendation.'
  name: desired_locations
  types:
  - <xref:list>[<xref:str>]
- description: 'The list of desired VM sizes (SKUs) to be considered for the capacity

    recommendation.'
  name: desired_sizes
  types:
  - <xref:list>[<xref:str>]
- description: 'Whether the capacity recommendation should be computed per

    availability zone.'
  name: availability_zones
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.compute.bulkaction.models.CapacityRecommendationParameters.availability_zones
  name: availability_zones
  summary: Whether the capacity recommendation should be computed per availability
    zone.
  signature: 'availability_zones: bool | None'
- uid: azure.mgmt.compute.bulkaction.models.CapacityRecommendationParameters.desired_locations
  name: desired_locations
  summary: The list of desired Azure regions to be considered for the capacity recommendation.
  signature: 'desired_locations: list[str] | None'
- uid: azure.mgmt.compute.bulkaction.models.CapacityRecommendationParameters.desired_sizes
  name: desired_sizes
  summary: The list of desired VM sizes (SKUs) to be considered for the capacity recommendation.
