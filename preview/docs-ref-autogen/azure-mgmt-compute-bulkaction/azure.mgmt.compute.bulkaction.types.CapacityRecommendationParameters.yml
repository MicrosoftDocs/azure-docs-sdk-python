### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.CapacityRecommendationParameters
name: CapacityRecommendationParameters
fullName: azure.mgmt.compute.bulkaction.types.CapacityRecommendationParameters
module: azure.mgmt.compute.bulkaction.types
summary: 'The parameters used to request capacity/placement recommendations for a
  start operation.

  Placement recommendations are only computed if the VM fails to start due to an allocation

  failure.'
constructor:
  syntax: CapacityRecommendationParameters()
variables:
- description: 'The list of desired Azure regions to be considered for the capacity

    recommendation.'
  name: desiredLocations
  types:
  - <xref:list>[<xref:str>]
- description: 'The list of desired VM sizes (SKUs) to be considered for the capacity

    recommendation.'
  name: desiredSizes
  types:
  - <xref:list>[<xref:str>]
- description: 'Whether the capacity recommendation should be computed per

    availability zone.'
  name: availabilityZones
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.compute.bulkaction.types.CapacityRecommendationParameters.availabilityZones
  name: availabilityZones
  summary: Whether the capacity recommendation should be computed per availability
    zone.
  signature: 'availabilityZones: bool'
- uid: azure.mgmt.compute.bulkaction.types.CapacityRecommendationParameters.desiredLocations
  name: desiredLocations
  summary: The list of desired Azure regions to be considered for the capacity recommendation.
  signature: 'desiredLocations: list[str]'
- uid: azure.mgmt.compute.bulkaction.types.CapacityRecommendationParameters.desiredSizes
  name: desiredSizes
  summary: The list of desired VM sizes (SKUs) to be considered for the capacity recommendation.
  signature: 'desiredSizes: list[str]'
