### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.models.ExecutionParameters
name: ExecutionParameters
fullName: azure.mgmt.compute.bulkaction.models.ExecutionParameters
module: azure.mgmt.compute.bulkaction.models
summary: Extra details needed to run the user's request.
constructor:
  syntax: 'ExecutionParameters(*args: Any, **kwargs: Any)'
variables:
- description: 'Details that could optimize the user''s request. Known values

    are: "Cost", "Availability", and "CostAvailabilityBalanced".'
  name: optimization_preference
  types:
  - <xref:str>
  - <xref:azure.mgmt.compute.bulkaction.models.OptimizationPreference>
- description: Retry policy the user can pass.
  name: retry_policy
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.RetryPolicy>
- description: 'When true on an executeStart request, run a post-Start VM agent

    health check and engage the fallback chain if the guest agent does not report
    Ready. Ignored

    for non-Start operations.'
  name: verify_vm_agent_health
  types:
  - <xref:bool>
- description: 'Capacity recommendation parameters for the request.

    When provided on an executeStart request, the service computes placement recommendations
    only

    if the VM fails to start due to an allocation failure; the recommendations for
    the desired

    sizes and locations are then surfaced in the operation''s capacityRecommendation
    response.'
  name: capacity_recommendation_parameters
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.CapacityRecommendationParameters>
attributes:
- uid: azure.mgmt.compute.bulkaction.models.ExecutionParameters.capacity_recommendation_parameters
  name: capacity_recommendation_parameters
  summary: 'Capacity recommendation parameters for the request. When provided on an
    executeStart request,

    the service computes placement recommendations only if the VM fails to start due
    to an

    allocation failure; the recommendations for the desired sizes and locations are
    then surfaced

    in the operation''s capacityRecommendation response.'
  signature: 'capacity_recommendation_parameters: _models.CapacityRecommendationParameters
    | None'
- uid: azure.mgmt.compute.bulkaction.models.ExecutionParameters.optimization_preference
  name: optimization_preference
  summary: '"Cost", "Availability",

    and "CostAvailabilityBalanced".'
  signature: 'optimization_preference: str | _models.OptimizationPreference | None'
- uid: azure.mgmt.compute.bulkaction.models.ExecutionParameters.retry_policy
  name: retry_policy
  summary: Retry policy the user can pass.
  signature: 'retry_policy: _models.RetryPolicy | None'
- uid: azure.mgmt.compute.bulkaction.models.ExecutionParameters.verify_vm_agent_health
  name: verify_vm_agent_health
  summary: 'When true on an executeStart request, run a post-Start VM agent health
    check and engage the

    fallback chain if the guest agent does not report Ready. Ignored for non-Start
    operations.'
  signature: 'verify_vm_agent_health: bool | None'
