### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.VirtualMachineIdentity
name: VirtualMachineIdentity
fullName: azure.mgmt.compute.bulkaction.types.VirtualMachineIdentity
module: azure.mgmt.compute.bulkaction.types
summary: Identity for the virtual machine.
constructor:
  syntax: VirtualMachineIdentity()
variables:
- description: 'The principal id of virtual machine identity. This property will only
    be

    provided for a system assigned identity.'
  name: principalId
  types:
  - <xref:str>
- description: 'The tenant id associated with the virtual machine. This property will
    only be

    provided for a system assigned identity.'
  name: tenantId
  types:
  - <xref:str>
- description: 'The type of identity used for the virtual machine. The type ''SystemAssigned,

    UserAssigned'' includes both an implicitly created identity and a set of user
    assigned

    identities. The type ''None'' will remove any identities from the virtual machine.
    Known values

    are: "SystemAssigned", "UserAssigned", "SystemAssigned, UserAssigned", and "None".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceIdentityType">]
- description: 'The list of user identities associated with the Virtual Machine.

    The user identity dictionary key references will be ARM resource ids in the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}''.'
  name: userAssignedIdentities
  types:
  - <xref:dict>[<xref:str>, <xref:"UserAssignedIdentitiesValue">]
attributes:
- uid: azure.mgmt.compute.bulkaction.types.VirtualMachineIdentity.principalId
  name: principalId
  summary: 'The principal id of virtual machine identity. This property will only
    be provided for a system

    assigned identity.'
  signature: 'principalId: str'
- uid: azure.mgmt.compute.bulkaction.types.VirtualMachineIdentity.tenantId
  name: tenantId
  summary: 'The tenant id associated with the virtual machine. This property will
    only be provided for a

    system assigned identity.'
  signature: 'tenantId: str'
- uid: azure.mgmt.compute.bulkaction.types.VirtualMachineIdentity.type
  name: type
  summary: 'The type of identity used for the virtual machine. The type ''SystemAssigned,
    UserAssigned''

    includes both an implicitly created identity and a set of user assigned identities.
    The type

    ''None'' will remove any identities from the virtual machine. Known values are:

    "SystemAssigned", "UserAssigned", "SystemAssigned, UserAssigned", and "None".'
  signature: 'type: str | ResourceIdentityType'
- uid: azure.mgmt.compute.bulkaction.types.VirtualMachineIdentity.userAssignedIdentities
  name: userAssignedIdentities
  summary: 'The list of user identities associated with the Virtual Machine. The user
    identity dictionary

    key references will be ARM resource ids in the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}''.'
  signature: 'userAssignedIdentities: dict[str, ''UserAssignedIdentitiesValue'']'
