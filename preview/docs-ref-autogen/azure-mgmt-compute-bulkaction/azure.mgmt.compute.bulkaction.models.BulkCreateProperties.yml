### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.models.BulkCreateProperties
name: BulkCreateProperties
fullName: azure.mgmt.compute.bulkaction.models.BulkCreateProperties
module: azure.mgmt.compute.bulkaction.models
summary: Details of the BulkCreate.
constructor:
  syntax: 'BulkCreateProperties(*args: Any, **kwargs: Any)'
variables:
- description: The UTC time the BulkCreate resource was created.
  name: created_time
  types:
  - <xref:datetime.datetime>
- description: 'The status of the last operation. Known values are: "Creating",

    "Succeeded", "Failed", "Deleting", and "Canceled".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.compute.bulkaction.models.ProvisioningState>
- description: Total capacity to achieve. It can be in terms of VMs or vCPUs. Required.
  name: capacity
  types:
  - <xref:int>
- description: 'Specifies capacity type for launching instances. It can be in terms
    of VMs

    or vCPUs. Known values are: "VM" and "VCpu".'
  name: capacity_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.compute.bulkaction.models.CapacityType>
- description: 'The minimum capacity, expressed in units specified by capacityType,
    that

    Azure must be able to allocate for the request to proceed. If Azure cannot allocate
    at least

    this capacity with high confidence, the request is rejected with 409 Conflict

    (InsufficientCapacity) and no VMs are created. Otherwise, Azure allocates as much
    capacity as

    possible, up to the requested capacity. Must be greater than 0, less than capacity,
    and

    requires partialFulfillmentPolicy.mode to be Enabled.'
  name: min_capacity
  types:
  - <xref:int>
- description: 'Controls how partial fulfillment is handled for a BulkCreate

    request. When enabled, Azure creates only the VMs or vCPUs it has high confidence
    can be

    successfully allocated, instead of attempting the entire request and potentially
    returning

    allocation failures.'
  name: partial_fulfillment_policy
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.PartialFulfillmentPolicy>
- description: 'Configuration Options for Regular or Spot instances in BulkCreate.

    Required.'
  name: priority_profile
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.PriorityProfile>
- description: 'List of VM sizes supported for BulkCreate. Every virtual machine is

    created from the operation-level computeProfile regardless of the size selected,
    so no

    per-VM-size override can be supplied here.'
  name: vm_sizes_profile
  types:
  - <xref:list>[<xref:azure.mgmt.compute.bulkaction.models.BulkCreateVmSizeProfile>]
- description: 'Compute Profile to configure the Virtual Machines. Applied uniformly
    to

    every virtual machine created by the operation. Required.'
  name: compute_profile
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.ComputeProfile>
- description: Zone Allocation Policy for launching instances.
  name: zone_allocation_policy
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.ZoneAllocationPolicy>
- description: 'Extra parameters that control how the request is executed,

    including the retry policy.'
  name: execution_parameters
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.ExecutionParameters>
attributes:
- uid: azure.mgmt.compute.bulkaction.models.BulkCreateProperties.capacity
  name: capacity
  summary: Total capacity to achieve. It can be in terms of VMs or vCPUs. Required.
  signature: 'capacity: int'
- uid: azure.mgmt.compute.bulkaction.models.BulkCreateProperties.capacity_type
  name: capacity_type
  summary: 'Specifies capacity type for launching instances. It can be in terms of
    VMs or vCPUs. Known

    values are: "VM" and "VCpu".'
  signature: 'capacity_type: str | _models.CapacityType | None'
- uid: azure.mgmt.compute.bulkaction.models.BulkCreateProperties.compute_profile
  name: compute_profile
  summary: 'Compute Profile to configure the Virtual Machines. Applied uniformly to
    every virtual machine

    created by the operation. Required.'
  signature: 'compute_profile: _models.ComputeProfile'
- uid: azure.mgmt.compute.bulkaction.models.BulkCreateProperties.created_time
  name: created_time
  summary: The UTC time the BulkCreate resource was created.
  signature: 'created_time: datetime | None'
- uid: azure.mgmt.compute.bulkaction.models.BulkCreateProperties.execution_parameters
  name: execution_parameters
  summary: Extra parameters that control how the request is executed, including the
    retry policy.
  signature: 'execution_parameters: _models.ExecutionParameters | None'
- uid: azure.mgmt.compute.bulkaction.models.BulkCreateProperties.min_capacity
  name: min_capacity
  summary: 'The minimum capacity, expressed in units specified by capacityType, that
    Azure must be able to

    allocate for the request to proceed. If Azure cannot allocate at least this capacity
    with high

    confidence, the request is rejected with 409 Conflict (InsufficientCapacity) and
    no VMs are

    created. Otherwise, Azure allocates as much capacity as possible, up to the requested
    capacity.

    Must be greater than 0, less than capacity, and requires partialFulfillmentPolicy.mode
    to be

    Enabled.'
  signature: 'min_capacity: int | None'
- uid: azure.mgmt.compute.bulkaction.models.BulkCreateProperties.partial_fulfillment_policy
  name: partial_fulfillment_policy
  summary: 'Controls how partial fulfillment is handled for a BulkCreate request.
    When enabled, Azure

    creates only the VMs or vCPUs it has high confidence can be successfully allocated,
    instead of

    attempting the entire request and potentially returning allocation failures.'
  signature: 'partial_fulfillment_policy: _models.PartialFulfillmentPolicy | None'
- uid: azure.mgmt.compute.bulkaction.models.BulkCreateProperties.priority_profile
  name: priority_profile
  summary: Configuration Options for Regular or Spot instances in BulkCreate. Required.
  signature: 'priority_profile: _models.PriorityProfile'
- uid: azure.mgmt.compute.bulkaction.models.BulkCreateProperties.provisioning_state
  name: provisioning_state
  summary: '"Creating", "Succeeded", "Failed",

    "Deleting", and "Canceled".'
  signature: 'provisioning_state: str | _models.ProvisioningState | None'
- uid: azure.mgmt.compute.bulkaction.models.BulkCreateProperties.vm_sizes_profile
  name: vm_sizes_profile
  summary: 'List of VM sizes supported for BulkCreate. Every virtual machine is created
    from the

    operation-level computeProfile regardless of the size selected, so no per-VM-size
    override can

    be supplied here.'
  signature: 'vm_sizes_profile: list[''_models.BulkCreateVmSizeProfile''] | None'
- uid: azure.mgmt.compute.bulkaction.models.BulkCreateProperties.zone_allocation_policy
  name: zone_allocation_policy
  summary: Zone Allocation Policy for launching instances.
  signature: 'zone_allocation_policy: _models.ZoneAllocationPolicy | None'
