### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.LinuxPatchSettings
name: LinuxPatchSettings
fullName: azure.mgmt.compute.bulkaction.types.LinuxPatchSettings
module: azure.mgmt.compute.bulkaction.types
summary: Specifies settings related to VM Guest Patching on Linux.
constructor:
  syntax: LinuxPatchSettings()
variables:
- description: 'Specifies the mode of VM Guest Patching to IaaS virtual machine or
    virtual

    machines associated to virtual machine scale set with OrchestrationMode as Flexible.<br
    /><br

    /> Possible values are:<br /><br /> **ImageDefault** - The virtual machine''s
    default patching

    configuration is used. <br /><br /> **AutomaticByPlatform** - The virtual machine
    will be

    automatically updated by the platform. The property provisionVMAgent must be true.
    Known values

    are: "ImageDefault" and "AutomaticByPlatform".'
  name: patchMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LinuxVMGuestPatchMode">]
- description: 'Specifies the mode of VM Guest Patch Assessment for the IaaS virtual

    machine.<br /><br /> Possible values are:<br /><br /> **ImageDefault** - You control
    the timing

    of patch assessments on a virtual machine. <br /><br /> **AutomaticByPlatform**
    - The platform

    will trigger periodic patch assessments. The property provisionVMAgent must be
    true. Known

    values are: "ImageDefault" and "AutomaticByPlatform".'
  name: assessmentMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LinuxPatchAssessmentMode">]
- description: 'Specifies additional settings for patch mode

    AutomaticByPlatform in VM Guest Patching on Linux.'
  name: automaticByPlatformSettings
  types:
  - <xref:<xref:"LinuxVMGuestPatchAutomaticByPlatformSettings">>
attributes:
- uid: azure.mgmt.compute.bulkaction.types.LinuxPatchSettings.assessmentMode
  name: assessmentMode
  summary: 'Specifies the mode of VM Guest Patch Assessment for the IaaS virtual machine.<br
    /><br />

    Possible values are:<br /><br /> **ImageDefault** - You control the timing of
    patch assessments

    on a virtual machine. <br /><br /> **AutomaticByPlatform** - The platform will
    trigger periodic

    patch assessments. The property provisionVMAgent must be true. Known values are:

    "ImageDefault" and "AutomaticByPlatform".'
  signature: 'assessmentMode: str | LinuxPatchAssessmentMode'
- uid: azure.mgmt.compute.bulkaction.types.LinuxPatchSettings.automaticByPlatformSettings
  name: automaticByPlatformSettings
  summary: Specifies additional settings for patch mode AutomaticByPlatform in VM
    Guest Patching on Linux.
  signature: 'automaticByPlatformSettings: LinuxVMGuestPatchAutomaticByPlatformSettings'
- uid: azure.mgmt.compute.bulkaction.types.LinuxPatchSettings.patchMode
  name: patchMode
  summary: 'Specifies the mode of VM Guest Patching to IaaS virtual machine or virtual
    machines associated

    to virtual machine scale set with OrchestrationMode as Flexible.<br /><br /> Possible
    values

    are:<br /><br /> **ImageDefault** - The virtual machine''s default patching configuration
    is

    used. <br /><br /> **AutomaticByPlatform** - The virtual machine will be automatically
    updated

    by the platform. The property provisionVMAgent must be true. Known values are:
    "ImageDefault"

    and "AutomaticByPlatform".'
  signature: 'patchMode: str | LinuxVMGuestPatchMode'
