  name: auxiliaryMode
  summary: 'Specifies whether the Auxiliary mode is enabled for the Network Interface
    resource. Known

    values are: "None", "AcceleratedConnections", and "Floating".'
  signature: 'auxiliaryMode: str | NetworkInterfaceAuxiliaryMode'
- uid: azure.mgmt.compute.bulkaction.types.VirtualMachineNetworkInterfaceConfigurationProperties.auxiliarySku
  name: auxiliarySku
  summary: 'Specifies whether the Auxiliary sku is enabled for the Network Interface
    resource. Known values

    are: "None", "A1", "A2", "A4", and "A8".'
  signature: 'auxiliarySku: str | NetworkInterfaceAuxiliarySku'
