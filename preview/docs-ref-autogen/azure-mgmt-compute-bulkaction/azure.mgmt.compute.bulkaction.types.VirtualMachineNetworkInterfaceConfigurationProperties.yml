  name: enableFpga
  summary: Specifies whether the network interface is FPGA networking-enabled.
  signature: 'enableFpga: bool'
- uid: azure.mgmt.compute.bulkaction.types.VirtualMachineNetworkInterfaceConfigurationProperties.enableIPForwarding
  name: enableIPForwarding
  summary: Whether IP forwarding enabled on this NIC.
  signature: 'enableIPForwarding: bool'
- uid: azure.mgmt.compute.bulkaction.types.VirtualMachineNetworkInterfaceConfigurationProperties.ipConfigurations
  name: ipConfigurations
  summary: Specifies the IP configurations of the network interface. Required.
  signature: 'ipConfigurations: Required[list[''VirtualMachineNetworkInterfaceIPConfiguration'']]'
- uid: azure.mgmt.compute.bulkaction.types.VirtualMachineNetworkInterfaceConfigurationProperties.networkSecurityGroup
  name: networkSecurityGroup
