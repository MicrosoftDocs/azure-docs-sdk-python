### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.models.VirtualMachineReimageParameters
name: VirtualMachineReimageParameters
fullName: azure.mgmt.compute.bulkaction.models.VirtualMachineReimageParameters
module: azure.mgmt.compute.bulkaction.models
summary: The parameters for reimaging a virtual machine. The operating system disk
  is always reimaged.
constructor:
  syntax: 'VirtualMachineReimageParameters(*args: Any, **kwargs: Any)'
variables:
- description: 'Indicates whether to reimage the temporary disk. The default value
    is

    `false`. This option is supported only for virtual machines or virtual machine
    scale sets

    that use an ephemeral operating system disk.'
  name: temp_disk
  types:
  - <xref:bool>
- description: 'The exact image version to use when reimaging the operating system
    disk.

    When omitted, the disk is reimaged to its current image version.'
  name: exact_version
  types:
  - <xref:str>
- description: 'The operating system profile used when reimaging a non-ephemeral operating

    system disk.'
  name: os_profile
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.OSProfileProvisioningData>
attributes:
- uid: azure.mgmt.compute.bulkaction.models.VirtualMachineReimageParameters.exact_version
  name: exact_version
  summary: 'The exact image version to use when reimaging the operating system disk.
    When omitted, the disk

    is reimaged to its current image version.'
  signature: 'exact_version: str | None'
- uid: azure.mgmt.compute.bulkaction.models.VirtualMachineReimageParameters.os_profile
  name: os_profile
  summary: The operating system profile used when reimaging a non-ephemeral operating
    system disk.
  signature: 'os_profile: _models.OSProfileProvisioningData | None'
- uid: azure.mgmt.compute.bulkaction.models.VirtualMachineReimageParameters.temp_disk
  name: temp_disk
  summary: 'Indicates whether to reimage the temporary disk. The default value is
    `false`. This option is

    supported only for virtual machines or virtual machine scale sets that use an
    ephemeral

    operating system disk.'
  signature: 'temp_disk: bool | None'
