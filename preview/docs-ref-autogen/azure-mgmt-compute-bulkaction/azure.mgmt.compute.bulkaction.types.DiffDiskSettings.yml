### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.DiffDiskSettings
name: DiffDiskSettings
fullName: azure.mgmt.compute.bulkaction.types.DiffDiskSettings
module: azure.mgmt.compute.bulkaction.types
summary: 'Describes the parameters of ephemeral disk settings that can be specified
  for operating system

  disk. Note: The ephemeral disk settings can only be specified for managed disk.'
constructor:
  syntax: DiffDiskSettings()
variables:
- description: Specifies the ephemeral disk settings for operating system disk. "Local"
  name: option
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiffDiskOptions">]
- description: 'Specifies the ephemeral disk placement for operating system disk.
    Possible

    values are: CacheDisk, ResourceDisk, NvmeDisk. The defaulting behavior is: CacheDisk
    if one is

    configured for the VM size otherwise ResourceDisk or NvmeDisk is used. Minimum
    api-version for

    NvmeDisk: 2024-03-01. Known values are: "CacheDisk", "ResourceDisk", and "NvmeDisk".'
  name: placement
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiffDiskPlacement">]
attributes:
- uid: azure.mgmt.compute.bulkaction.types.DiffDiskSettings.option
  name: option
  summary: Specifies the ephemeral disk settings for operating system disk. "Local"
  signature: 'option: str | DiffDiskOptions'
- uid: azure.mgmt.compute.bulkaction.types.DiffDiskSettings.placement
  name: placement
  summary: 'Specifies the ephemeral disk placement for operating system disk. Possible
    values are:

    CacheDisk, ResourceDisk, NvmeDisk. The defaulting behavior is: CacheDisk if one
    is configured

    for the VM size otherwise ResourceDisk or NvmeDisk is used. Minimum api-version
    for NvmeDisk:

    2024-03-01. Known values are: "CacheDisk", "ResourceDisk", and "NvmeDisk".'
  signature: 'placement: str | DiffDiskPlacement'
