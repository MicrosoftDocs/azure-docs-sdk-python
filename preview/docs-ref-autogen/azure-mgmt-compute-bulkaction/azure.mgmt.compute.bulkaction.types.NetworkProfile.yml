### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.NetworkProfile
name: NetworkProfile
fullName: azure.mgmt.compute.bulkaction.types.NetworkProfile
module: azure.mgmt.compute.bulkaction.types
summary: Specifies the network interfaces or the networking configuration of the virtual
  machine.
constructor:
  syntax: NetworkProfile()
variables:
- description: 'Specifies the list of resource Ids for the network interfaces

    associated with the virtual machine.'
  name: network_interfaces
  types:
  - <xref:list>[<xref:"NetworkInterfaceReference">]
- description: 'specifies the Microsoft.Network API version used when creating

    networking resources in the Network Interface Configurations. Known values are:
    "2020-11-01"

    and "2022-11-01".'
  name: network_api_version
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkApiVersion">]
- description: 'Specifies the networking configurations that will be

    used to create the virtual machine networking resources.'
  name: network_interface_configurations
  types:
  - <xref:list>[<xref:"VirtualMachineNetworkInterfaceConfiguration">]
attributes:
- uid: azure.mgmt.compute.bulkaction.types.NetworkProfile.networkApiVersion
  name: networkApiVersion
  summary: 'specifies the Microsoft.Network API version used when creating networking
    resources in the

    Network Interface Configurations. Known values are: "2020-11-01" and "2022-11-01".'
  signature: 'networkApiVersion: str | NetworkApiVersion'
- uid: azure.mgmt.compute.bulkaction.types.NetworkProfile.networkInterfaceConfigurations
  name: networkInterfaceConfigurations
  summary: 'Specifies the networking configurations that will be used to create the
    virtual machine

    networking resources.'
  signature: 'networkInterfaceConfigurations: list[''VirtualMachineNetworkInterfaceConfiguration'']'
- uid: azure.mgmt.compute.bulkaction.types.NetworkProfile.networkInterfaces
  name: networkInterfaces
  summary: 'Specifies the list of resource Ids for the network interfaces associated
    with the virtual

    machine.'
  signature: 'networkInterfaces: list[''NetworkInterfaceReference'']'
