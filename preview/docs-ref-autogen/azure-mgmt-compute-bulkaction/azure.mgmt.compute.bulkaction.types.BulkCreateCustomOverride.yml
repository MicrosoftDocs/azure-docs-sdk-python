uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomOverride
name: BulkCreateCustomOverride
fullName: azure.mgmt.compute.bulkaction.types.BulkCreateCustomOverride
module: azure.mgmt.compute.bulkaction.types
summary: A single per-VM override. Extends the shared override fields with a per-VM
  name.
constructor:
  syntax: BulkCreateCustomOverride()
variables:
- description: 'ARM VM name for this VM. Optional; when omitted the name is

    generated from the prefix as {prefix}_{index}.'
  name: virtual_machine_name
  types:
  - <xref:str>
- description: 'VM profile, the same shape as operation-level

    ComputeProfile.virtualMachineProfile. Overrides the operation-level VM profile.'
  name: virtual_machine_profile
  types:
  - <xref:<xref:"BulkactionVMProperties">>
- description: Tags overriding the operation-level tags.
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Identity overriding the operation-level identity.
  name: identity
  types:
  - <xref:<xref:"VirtualMachineIdentity">>
- description: Plan overriding the operation-level plan.
  name: plan
  types:
  - <xref:<xref:"Plan">>
- description: 'Extensions. When non-empty they replace the operation-level extensions;
    when

    omitted the operation-level extensions are inherited.'
  name: extensions
  types:
  - <xref:list>[<xref:"BulkactionVMExtension">]
