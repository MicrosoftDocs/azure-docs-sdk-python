  name: partialFulfillmentPolicy
  summary: 'Controls how partial fulfillment is handled for a BulkCreateCustom request.
    When enabled, Azure

    creates only the VMs or vCPUs it has high confidence can be successfully allocated,
    instead of

    attempting the entire request and potentially returning allocation failures.'
  signature: 'partialFulfillmentPolicy: PartialFulfillmentPolicy'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomProperties.priorityProfile
  name: priorityProfile
  summary: Configuration Options for Regular or Spot instances in BulkCreateCustom.
    Required.
  signature: 'priorityProfile: Required[BulkCreateCustomPriorityProfile]'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomProperties.provisioningState
  name: provisioningState
  summary: '"Creating", "Succeeded", "Failed",

    "Deleting", and "Canceled".'
  signature: 'provisioningState: str | ProvisioningState'
