### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomProperties
name: BulkCreateCustomProperties
fullName: azure.mgmt.compute.bulkaction.types.BulkCreateCustomProperties
module: azure.mgmt.compute.bulkaction.types
summary: Details of the BulkCreateCustom.
constructor:
  syntax: BulkCreateCustomProperties()
variables:
- description: The UTC time the BulkCreateCustom resource was created.
  name: createdTime
  types:
  - <xref:str>
- description: 'The status of the last operation. Known values are: "Creating",

    "Succeeded", "Failed", "Deleting", and "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: Total capacity to achieve. It can be in terms of VMs or vCPUs. Required.
  name: capacity
  types:
  - <xref:int>
- description: 'Specifies capacity type for launching instances. It can be in terms
    of VMs

    or vCPUs. Known values are: "VM" and "VCpu".'
  name: capacityType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CapacityType">]
- description: 'The minimum capacity, expressed in units specified by capacityType,
    that

    Azure must be able to allocate for the request to proceed. If Azure cannot allocate
    at least

    this capacity with high confidence, the request is rejected with 409 Conflict

    (InsufficientCapacity) and no VMs are created. Otherwise, Azure allocates as much
    capacity as

    possible, up to the requested capacity. Must be greater than 0, less than capacity,
    and

    requires partialFulfillmentPolicy.mode to be Enabled.'
  name: minCapacity
  types:
  - <xref:int>
- description: 'Controls how partial fulfillment is handled for a

    BulkCreateCustom request. When enabled, Azure creates only the VMs or vCPUs it
    has high

    confidence can be successfully allocated, instead of attempting the entire request
    and

    potentially returning allocation failures.'
  name: partialFulfillmentPolicy
  types:
  - <xref:<xref:"PartialFulfillmentPolicy">>
- description: The virtual machine resources resolved for the operation.
  name: resources
  types:
  - <xref:list>[<xref:"BulkCreateCustomResource">]
- description: 'Configuration Options for Regular or Spot instances in BulkCreateCustom.

    Required.'
  name: priorityProfile
  types:
  - <xref:<xref:"BulkCreateCustomPriorityProfile">>
- description: List of VM sizes supported for BulkCreateCustom.
  name: vmSizesProfile
  types:
  - <xref:list>[<xref:"BulkCreateCustomVmSizeProfile">]
- description: Compute Profile to configure the Virtual Machines. Required.
  name: computeProfile
  types:
  - <xref:<xref:"ComputeProfile">>
- description: Zone Allocation Policy for launching instances.
  name: zoneAllocationPolicy
  types:
  - <xref:<xref:"BulkCreateCustomZoneAllocationPolicy">>
- description: 'Per-VM overrides and the shared name prefix, specified when the

    operation is created.'
  name: overridesProfile
  types:
  - <xref:<xref:"BulkCreateCustomOverridesProfile">>
- description: 'Extra parameters that control how the request is executed, including

    the retry policy.'
  name: executionParameters
  types:
  - <xref:<xref:"ExecutionParameters">>
attributes:
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomProperties.capacity
  name: capacity
  summary: Total capacity to achieve. It can be in terms of VMs or vCPUs. Required.
  signature: 'capacity: Required[int]'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomProperties.capacityType
  name: capacityType
  summary: 'Specifies capacity type for launching instances. It can be in terms of
    VMs or vCPUs. Known

    values are: "VM" and "VCpu".'
  signature: 'capacityType: str | CapacityType'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomProperties.computeProfile
  name: computeProfile
  summary: Compute Profile to configure the Virtual Machines. Required.
  signature: 'computeProfile: Required[ComputeProfile]'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomProperties.createdTime
  name: createdTime
  summary: The UTC time the BulkCreateCustom resource was created.
  signature: 'createdTime: str'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomProperties.executionParameters
  name: executionParameters
  summary: Extra parameters that control how the request is executed, including the
    retry policy.
  signature: 'executionParameters: ExecutionParameters'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomProperties.minCapacity
  name: minCapacity
  summary: 'The minimum capacity, expressed in units specified by capacityType, that
    Azure must be able to

    allocate for the request to proceed. If Azure cannot allocate at least this capacity
    with high

    confidence, the request is rejected with 409 Conflict (InsufficientCapacity) and
    no VMs are

    created. Otherwise, Azure allocates as much capacity as possible, up to the requested
    capacity.

    Must be greater than 0, less than capacity, and requires partialFulfillmentPolicy.mode
    to be

    Enabled.'
  signature: 'minCapacity: int'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomProperties.overridesProfile
  name: overridesProfile
  summary: Per-VM overrides and the shared name prefix, specified when the operation
