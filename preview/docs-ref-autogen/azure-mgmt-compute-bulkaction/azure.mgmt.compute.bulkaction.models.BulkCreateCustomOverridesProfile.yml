uid: azure.mgmt.compute.bulkaction.models.BulkCreateCustomOverridesProfile
name: BulkCreateCustomOverridesProfile
fullName: azure.mgmt.compute.bulkaction.models.BulkCreateCustomOverridesProfile
module: azure.mgmt.compute.bulkaction.models
summary: 'Groups the per-VM overrides with the name prefix that names any override
  that does not supply

  its own VM name.'
constructor:
  syntax: 'BulkCreateCustomOverridesProfile(*args: Any, **kwargs: Any)'
variables:
- description: 'Prefix used to build the ARM VM name ({prefix}_{index}) for

    overrides that omit a virtualMachineName. Required when any override is unnamed
    and rejected

    when every override is named.'
  name: virtual_machine_name_prefix
  types:
  - <xref:str>
- description: 'Per-VM overrides. The count is the VM count and must equal capacity.
    Each

    override maps to VM index i.'
  name: overrides
  types:
  - <xref:list>[<xref:azure.mgmt.compute.bulkaction.models.BulkCreateCustomOverride>]
