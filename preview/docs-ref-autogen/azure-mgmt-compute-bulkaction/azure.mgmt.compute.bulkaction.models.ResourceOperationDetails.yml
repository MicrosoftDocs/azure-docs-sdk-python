uid: azure.mgmt.compute.bulkaction.models.ResourceOperationDetails
name: ResourceOperationDetails
fullName: azure.mgmt.compute.bulkaction.models.ResourceOperationDetails
module: azure.mgmt.compute.bulkaction.models
summary: The status and settings for an operation on one virtual machine.
constructor:
  syntax: 'ResourceOperationDetails(*args: Any, **kwargs: Any)'
variables:
- description: 'The operation ID used to track the action for this virtual machine.

    Required.'
  name: operation_id
  types:
  - <xref:str>
- description: The virtual machine's Azure resource ID.
  name: resource_id
  types:
  - <xref:str>
- description: 'The type of operation performed on the virtual machine. Known values
    are:

    "Start", "Deallocate", "Hibernate", "Create", and "Delete".'
  name: op_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.compute.bulkaction.models.ResourceOperationType>
- description: The subscription ID associated with the bulk action.
  name: subscription_id
  types:
  - <xref:str>
- description: The requested deadline for the operation.
  name: deadline
  types:
  - <xref:datetime.datetime>
- description: 'Specifies whether the deadline time indicates the time at which the

    operation should start or should be complete. Known values are: "InitiateAt" and
    "CompleteBy".'
  name: deadline_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.compute.bulkaction.models.DeadlineType>
- description: 'The current state of the operation. Known values are: "Scheduled",
    "Executing",

    "Succeeded", "Failed", "Cancelled", and "Blocked".'
  name: state
  types:
  - <xref:str>
  - <xref:azure.mgmt.compute.bulkaction.models.OperationState>
- description: The time zone used to interpret the operation deadline.
  name: timezone
  types:
  - <xref:str>
- description: Contains error details if the operation does not succeed.
  name: resource_operation_error
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.ResourceOperationError>
- description: 'Information about the fallback operation attempted after the

    requested operation did not succeed.'
  name: fallback_operation_info
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.FallbackOperationInfo>
- description: The date and time when the operation completed.
  name: completed_at
  types:
  - <xref:datetime.datetime>
- description: The retry settings for the bulk action.
  name: retry_policy
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.RetryPolicy>
- description: 'Caller-provided context associated with the virtual

    machine operation.'
  name: resource_notification_details
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.ResourceNotificationDetails>
- description: 'The capacity/placement recommendation computed for the

    operation, if requested.'
  name: capacity_recommendation
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.CapacityRecommendation>
