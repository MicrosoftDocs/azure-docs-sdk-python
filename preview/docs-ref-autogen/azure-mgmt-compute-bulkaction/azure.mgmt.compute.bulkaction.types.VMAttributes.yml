### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.VMAttributes
name: VMAttributes
fullName: azure.mgmt.compute.bulkaction.types.VMAttributes
module: azure.mgmt.compute.bulkaction.types
summary: VMAttributes that will be used to filter VMSizes which will be used to launch
  instances.
constructor:
  syntax: VMAttributes()
variables:
- description: 'The range of vCpuCount specified from Min to Max. Must be specified
    if

    VMAttributes are specified, either Min or Max is required if specified. Required.'
  name: v_cpu_count
  types:
  - <xref:<xref:"VMAttributeMinMaxInteger">>
- description: 'The range of memory specified from Min to Max. Must be specified if

    VMAttributes are specified, either Min or Max is required if specified. Required.'
  name: memory_in_gi_b
  types:
  - <xref:<xref:"VMAttributeMinMaxDouble">>
- description: 'The VM architecture types specified as a list. Must be specified if

    VMAttributes are specified. Must be compatible with image used. Required.'
  name: architecture_types
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"ArchitectureType">]]
- description: 'The range of memory in GiB per vCPU specified from min to max.

    Optional parameter. Either Min or Max is required if specified.'
  name: memory_in_gi_b_per_v_cpu
  types:
  - <xref:<xref:"VMAttributeMinMaxDouble">>
- description: 'Specifies whether the VMSize supporting local storage should be

    used to launch instances or not. Included - Default if not specified as most Azure
    VMs support

    local storage. Known values are: "Excluded", "Included", and "Required".'
  name: local_storage_support
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VMAttributeSupport">]
- description: 'LocalStorageSupport should be set to "Included" or "Required" to

    use this VMAttribute. If localStorageSupport is "Excluded", this VMAttribute can
    not be used.'
  name: local_storage_in_gi_b
  types:
  - <xref:<xref:"VMAttributeMinMaxDouble">>
- description: 'The local storage disk types specified as a list.

    LocalStorageSupport should be set to "Included" or "Required" to use this VMAttribute.
    If

    localStorageSupport is "Excluded", this VMAttribute can not be used.'
  name: local_storage_disk_types
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"LocalStorageDiskType">]]
- description: 'The range of data disk count specified from Min to Max. Optional

    parameter. Either Min or Max is required if specified.'
  name: data_disk_count
  types:
  - <xref:<xref:"VMAttributeMinMaxInteger">>
- description: 'The range of network interface count specified from Min to Max.

    Optional parameter. Either Min or Max is required if specified.'
  name: network_interface_count
  types:
  - <xref:<xref:"VMAttributeMinMaxInteger">>
- description: 'The range of network bandwidth in Mbps specified from Min to

    Max. Optional parameter. Either Min or Max is required if specified.'
  name: network_bandwidth_in_mbps
  types:
  - <xref:<xref:"VMAttributeMinMaxDouble">>
- description: 'Specifies whether the VMSize supporting RDMA (Remote Direct Memory
    Access)

    should be used to build launch instances or not. Known values are: "Excluded",
    "Included", and

    "Required".'
  name: rdma_support
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VMAttributeSupport">]
- description: 'The range of RDMA (Remote Direct Memory Access) network

    interface count specified from Min to Max. Optional parameter. Either Min or Max
    is required if

    specified. rdmaSupport should be set to "Included" or "Required" to use this VMAttribute.
    If

    rdmaSupport is "Excluded", this VMAttribute can not be used.'
  name: rdma_network_interface_count
  types:
  - <xref:<xref:"VMAttributeMinMaxInteger">>
- description: 'Specifies whether the VMSize supporting accelerator should be used

    to launch instances or not. acceleratorSupport should be set to "Included" or
    "Required" to use

    this VMAttribute. If acceleratorSupport is "Excluded", this VMAttribute can not
    be used. Known

    values are: "Excluded", "Included", and "Required".'
  name: accelerator_support
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VMAttributeSupport">]
- description: 'The accelerator manufacturers specified as a list.

    acceleratorSupport should be set to "Included" or "Required" to use this VMAttribute.
    If

    acceleratorSupport is "Excluded", this VMAttribute can not be used.'
  name: accelerator_manufacturers
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"AcceleratorManufacturer">]]
- description: 'The accelerator types specified as a list. acceleratorSupport should

    be set to "Included" or "Required" to use this VMAttribute. If acceleratorSupport
    is

    "Excluded", this VMAttribute can not be used.'
  name: accelerator_types
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"AcceleratorType">]]
- description: 'The range of accelerator count specified from min to max. Optional

    parameter. Either Min or Max is required if specified. acceleratorSupport should
    be set to

    "Included" or "Required" to use this VMAttribute. If acceleratorSupport is "Excluded",
    this

    VMAttribute can not be used.'
  name: accelerator_count
  types:
  - <xref:<xref:"VMAttributeMinMaxInteger">>
- description: The VM category specified as a list. Optional parameter.
  name: vm_categories
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"VMCategory">]]
- description: The VM CPU manufacturers specified as a list. Optional parameter.
  name: cpu_manufacturers
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"CpuManufacturer">]]
- description: The hyperV generations specified as a list. Optional parameter.
  name: hyper_v_generations
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"HyperVGeneration">]]
- description: 'Specifies whether the VMSize supporting burstable capability should
    be

    used to launch instances or not. Known values are: "Excluded", "Included", and
    "Required".'
  name: burstable_support
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VMAttributeSupport">]
- description: 'Specifies which VMSizes should be allowed while filtering on

    VMAttributes. Cannot be specified together with excludedVMSizes. Maximum of 10
    VM sizes

    allowed. Optional parameter.'
  name: allowed_vm_sizes
  types:
  - <xref:list>[<xref:str>]
- description: 'Specifies which VMSizes should be excluded while filtering on

    VMAttributes. Cannot be specified together with allowedVMSizes. Maximum of 10
    VM sizes allowed.

    Optional parameter.'
  name: excluded_vm_sizes
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.acceleratorCount
  name: acceleratorCount
  summary: 'The range of accelerator count specified from min to max. Optional parameter.
    Either Min or Max

    is required if specified. acceleratorSupport should be set to "Included" or "Required"
    to

    use this VMAttribute. If acceleratorSupport is "Excluded", this VMAttribute can
    not be used.'
  signature: 'acceleratorCount: VMAttributeMinMaxInteger'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.acceleratorManufacturers
  name: acceleratorManufacturers
  summary: 'The accelerator manufacturers specified as a list. acceleratorSupport
    should be set to

    "Included" or "Required" to use this VMAttribute. If acceleratorSupport is "Excluded",

    this VMAttribute can not be used.'
  signature: 'acceleratorManufacturers: list[typing.Union[str, ForwardRef(''AcceleratorManufacturer'')]]'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.acceleratorSupport
  name: acceleratorSupport
  summary: 'Specifies whether the VMSize supporting accelerator should be used to
    launch instances or not.

    acceleratorSupport should be set to "Included" or "Required" to use this VMAttribute.
    If

    acceleratorSupport is "Excluded", this VMAttribute can not be used. Known values
    are:

    "Excluded", "Included", and "Required".'
  signature: 'acceleratorSupport: str | VMAttributeSupport'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.acceleratorTypes
  name: acceleratorTypes
  summary: 'The accelerator types specified as a list. acceleratorSupport should be
    set to "Included" or

    "Required" to use this VMAttribute. If acceleratorSupport is "Excluded", this
    VMAttribute

    can not be used.'
  signature: 'acceleratorTypes: list[typing.Union[str, ForwardRef(''AcceleratorType'')]]'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.allowedVMSizes
  name: allowedVMSizes
  summary: 'Specifies which VMSizes should be allowed while filtering on VMAttributes.
    Cannot be specified

    together with excludedVMSizes. Maximum of 10 VM sizes allowed. Optional parameter.'
  signature: 'allowedVMSizes: list[str]'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.architectureTypes
  name: architectureTypes
  summary: 'The VM architecture types specified as a list. Must be specified if VMAttributes
    are specified.

    Must be compatible with image used. Required.'
  signature: 'architectureTypes: Union[str, ForwardRef(''ArchitectureType'')]]]'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.burstableSupport
  name: burstableSupport
  summary: 'Specifies whether the VMSize supporting burstable capability should be
    used to launch instances

    or not. Known values are: "Excluded", "Included", and "Required".'
  signature: 'burstableSupport: str | VMAttributeSupport'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.cpuManufacturers
  name: cpuManufacturers
  summary: The VM CPU manufacturers specified as a list. Optional parameter.
  signature: 'cpuManufacturers: list[typing.Union[str, ForwardRef(''CpuManufacturer'')]]'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.dataDiskCount
  name: dataDiskCount
  summary: 'The range of data disk count specified from Min to Max. Optional parameter.
    Either Min or Max

    is required if specified.'
  signature: 'dataDiskCount: VMAttributeMinMaxInteger'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.excludedVMSizes
  name: excludedVMSizes
  summary: 'Specifies which VMSizes should be excluded while filtering on VMAttributes.
    Cannot be specified

    together with allowedVMSizes. Maximum of 10 VM sizes allowed. Optional parameter.'
  signature: 'excludedVMSizes: list[str]'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.hyperVGenerations
  name: hyperVGenerations
  summary: The hyperV generations specified as a list. Optional parameter.
  signature: 'hyperVGenerations: list[typing.Union[str, ForwardRef(''HyperVGeneration'')]]'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.localStorageDiskTypes
  name: localStorageDiskTypes
  summary: 'The local storage disk types specified as a list. LocalStorageSupport
    should be set to

    "Included" or "Required" to use this VMAttribute. If localStorageSupport is "Excluded",

    this VMAttribute can not be used.'
  signature: 'localStorageDiskTypes: list[typing.Union[str, ForwardRef(''LocalStorageDiskType'')]]'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.localStorageInGiB
  name: localStorageInGiB
  summary: 'LocalStorageSupport should be set to "Included" or "Required" to use this
    VMAttribute. If

    localStorageSupport is "Excluded", this VMAttribute can not be used.'
  signature: 'localStorageInGiB: VMAttributeMinMaxDouble'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.localStorageSupport
  name: localStorageSupport
  summary: 'Specifies whether the VMSize supporting local storage should be used to
    launch instances or

    not. Included - Default if not specified as most Azure VMs support local storage.
    Known values

    are: "Excluded", "Included", and "Required".'
  signature: 'localStorageSupport: str | VMAttributeSupport'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.memoryInGiB
  name: memoryInGiB
  summary: 'The range of memory specified from Min to Max. Must be specified if VMAttributes
    are specified,

    either Min or Max is required if specified. Required.'
  signature: 'memoryInGiB: Required[VMAttributeMinMaxDouble]'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.memoryInGiBPerVCpu
  name: memoryInGiBPerVCpu
  summary: 'The range of memory in GiB per vCPU specified from min to max. Optional
    parameter. Either Min

    or Max is required if specified.'
  signature: 'memoryInGiBPerVCpu: VMAttributeMinMaxDouble'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.networkBandwidthInMbps
  name: networkBandwidthInMbps
  summary: 'The range of network bandwidth in Mbps specified from Min to Max. Optional
    parameter. Either

    Min or Max is required if specified.'
  signature: 'networkBandwidthInMbps: VMAttributeMinMaxDouble'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.networkInterfaceCount
  name: networkInterfaceCount
  summary: 'The range of network interface count specified from Min to Max. Optional
    parameter. Either Min

    or Max is required if specified.'
  signature: 'networkInterfaceCount: VMAttributeMinMaxInteger'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.rdmaNetworkInterfaceCount
  name: rdmaNetworkInterfaceCount
  summary: 'The range of RDMA (Remote Direct Memory Access) network interface count
    specified from Min to

    Max. Optional parameter. Either Min or Max is required if specified. rdmaSupport
    should be set

    to "Included" or "Required" to use this VMAttribute. If rdmaSupport is "Excluded",
    this

    VMAttribute can not be used.'
  signature: 'rdmaNetworkInterfaceCount: VMAttributeMinMaxInteger'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.rdmaSupport
  name: rdmaSupport
  summary: 'Specifies whether the VMSize supporting RDMA (Remote Direct Memory Access)
    should be used to

    build launch instances or not. Known values are: "Excluded", "Included", and "Required".'
  signature: 'rdmaSupport: str | VMAttributeSupport'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.vCpuCount
  name: vCpuCount
  summary: 'The range of vCpuCount specified from Min to Max. Must be specified if
    VMAttributes are

    specified, either Min or Max is required if specified. Required.'
  signature: 'vCpuCount: Required[VMAttributeMinMaxInteger]'
- uid: azure.mgmt.compute.bulkaction.types.VMAttributes.vmCategories
  name: vmCategories
  summary: The VM category specified as a list. Optional parameter.
  signature: 'vmCategories: list[typing.Union[str, ForwardRef(''VMCategory'')]]'
