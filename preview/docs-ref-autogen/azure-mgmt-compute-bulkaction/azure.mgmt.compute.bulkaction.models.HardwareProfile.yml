uid: azure.mgmt.compute.bulkaction.models.HardwareProfile
name: HardwareProfile
fullName: azure.mgmt.compute.bulkaction.models.HardwareProfile
module: azure.mgmt.compute.bulkaction.models
summary: Specifies the hardware profile for the virtual machine.
constructor:
  syntax: 'HardwareProfile(*args: Any, **kwargs: Any)'
variables:
- description: 'Specifies the size of the virtual machine. The enum data type is currently

    deprecated and will be removed by December 23rd 2023. The recommended way to get
    the list of

    available sizes is using these APIs: [List all available virtual machine sizes
    in an

    availability set](https://docs.microsoft.com/rest/api/compute/availabilitysets/listavailablesizes),
    [List all

    available virtual machine sizes in a region](https://docs.microsoft.com/rest/api/compute/resourceskus/list),
    [List all available virtual

    machine sizes for resizing](https://docs.microsoft.com/rest/api/compute/virtualmachines/listavailablesizes).
    For more

    information about virtual machine sizes, see [Sizes for virtual machines](https://docs.microsoft.com/azure/virtual-machines/sizes).
    The available VM sizes depend on

    region and availability set.'
  name: vm_size
  types:
  - <xref:str>
- description: 'Specifies the properties for customizing the size of the virtual

    machine. Minimum api-version: 2021-07-01. This feature is still in preview mode
    and is not

    supported for VirtualMachineScaleSet. Please follow the instructions in [VM Customization](https://aka.ms/vmcustomization)
    for more details.'
  name: vm_size_properties
  types:
  - <xref:azure.mgmt.compute.bulkaction.models.VmSizeProperties>
