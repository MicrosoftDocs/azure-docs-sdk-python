uid: azure.mgmt.compute.bulkaction.types.ExecutionParameters
name: ExecutionParameters
fullName: azure.mgmt.compute.bulkaction.types.ExecutionParameters
module: azure.mgmt.compute.bulkaction.types
summary: The execution settings for a bulk action.
constructor:
  syntax: ExecutionParameters()
variables:
- description: The retry settings for the bulk action.
  name: retryPolicy
  types:
  - <xref:<xref:"RetryPolicy">>
- description: 'If true, Bulk Actions verifies the virtual machine guest agent

    health after a start operation. Setting this property to true for any other operation
    causes

    the request to fail.'
  name: verifyVmAgentHealth
  types:
  - <xref:bool>
- description: 'Capacity recommendation parameters for the request.

    When provided on an executeStart request, the service computes placement recommendations
    only

    if the VM fails to start due to an allocation failure; the recommendations for
    the desired

    sizes and locations are then surfaced in the operation''s capacityRecommendation
    response.'
  name: capacityRecommendationParameters
  types:
  - <xref:<xref:"CapacityRecommendationParameters">>
- description: Additional configuration for Create.
  name: additionalCreateParameters
  types:
  - <xref:dict>[<xref:str>, <xref:typing.Any>]
attributes:
- uid: azure.mgmt.compute.bulkaction.types.ExecutionParameters.additionalCreateParameters
  name: additionalCreateParameters
  summary: Additional configuration for Create.
  signature: 'additionalCreateParameters: dict[str, Any]'
- uid: azure.mgmt.compute.bulkaction.types.ExecutionParameters.capacityRecommendationParameters
  name: capacityRecommendationParameters
  summary: 'Capacity recommendation parameters for the request. When provided on an
    executeStart request,

    the service computes placement recommendations only if the VM fails to start due
    to an

    allocation failure; the recommendations for the desired sizes and locations are
    then surfaced

    in the operation''s capacityRecommendation response.'
  signature: 'capacityRecommendationParameters: CapacityRecommendationParameters'
- uid: azure.mgmt.compute.bulkaction.types.ExecutionParameters.retryPolicy
  name: retryPolicy
  summary: The retry settings for the bulk action.
  signature: 'retryPolicy: RetryPolicy'
- uid: azure.mgmt.compute.bulkaction.types.ExecutionParameters.verifyVmAgentHealth
