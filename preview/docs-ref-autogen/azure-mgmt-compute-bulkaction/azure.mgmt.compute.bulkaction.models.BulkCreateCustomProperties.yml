    that

    Azure must be able to allocate for the request to proceed. If Azure cannot allocate
    at least

    this capacity with high confidence, the request is rejected with 409 Conflict

    (InsufficientCapacity) and no VMs are created. Otherwise, Azure allocates as much
    capacity as

    possible, up to the requested capacity. Must be greater than 0, less than capacity,
    and

    requires partialFulfillmentPolicy.mode to be Enabled.'
