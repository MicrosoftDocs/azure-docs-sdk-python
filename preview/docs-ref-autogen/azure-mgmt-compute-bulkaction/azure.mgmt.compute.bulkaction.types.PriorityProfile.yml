### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.PriorityProfile
name: PriorityProfile
fullName: azure.mgmt.compute.bulkaction.types.PriorityProfile
module: azure.mgmt.compute.bulkaction.types
summary: The priority profile for flex VM creation.
constructor:
  syntax: PriorityProfile()
variables:
- description: 'The priority type for VM allocation. Known values are: "Regular" and
    "Spot".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PriorityType">]
- description: 'Price per hour of each Spot VM will never exceed this. Available from

    2026-04-06-preview.'
  name: max_price_per_vm
  types:
  - <xref:float>
- description: 'Eviction Policy to follow when evicting Spot VMs. Available from

    2026-04-06-preview. Known values are: "Delete" and "Deallocate".'
  name: eviction_policy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EvictionPolicy">]
- description: 'The allocation strategy for VM size selection. Known values are:

    "LowestPrice", "Prioritized", and "CapacityOptimized".'
  name: allocation_strategy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AllocationStrategy">]
attributes:
- uid: azure.mgmt.compute.bulkaction.types.PriorityProfile.allocationStrategy
  name: allocationStrategy
  summary: '"LowestPrice",

    "Prioritized", and "CapacityOptimized".'
  signature: 'allocationStrategy: str | AllocationStrategy'
- uid: azure.mgmt.compute.bulkaction.types.PriorityProfile.evictionPolicy
  name: evictionPolicy
  summary: 'Eviction Policy to follow when evicting Spot VMs. Available from 2026-04-06-preview.
    Known

    values are: "Delete" and "Deallocate".'
  signature: 'evictionPolicy: str | EvictionPolicy'
- uid: azure.mgmt.compute.bulkaction.types.PriorityProfile.maxPricePerVM
  name: maxPricePerVM
  summary: Price per hour of each Spot VM will never exceed this. Available from 2026-04-06-preview.
  signature: 'maxPricePerVM: float'
- uid: azure.mgmt.compute.bulkaction.types.PriorityProfile.type
  name: type
  summary: '"Regular" and "Spot".'
  signature: 'type: str | PriorityType'
