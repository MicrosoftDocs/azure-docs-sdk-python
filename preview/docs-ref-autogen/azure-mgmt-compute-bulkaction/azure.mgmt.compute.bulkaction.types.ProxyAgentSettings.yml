### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.ProxyAgentSettings
name: ProxyAgentSettings
fullName: azure.mgmt.compute.bulkaction.types.ProxyAgentSettings
module: azure.mgmt.compute.bulkaction.types
summary: 'Specifies ProxyAgent settings for the virtual machine or virtual machine
  scale set. Minimum

  api-version: 2023-09-01.'
constructor:
  syntax: ProxyAgentSettings()
variables:
- description: 'Specifies whether ProxyAgent feature should be enabled on the virtual
    machine or

    virtual machine scale set.'
  name: enabled
  types:
  - <xref:bool>
- description: 'Specifies the mode that ProxyAgent will execute on. Warning: this
    property has been

    deprecated, please specify ''mode'' under particular hostendpoint setting. Known
    values are:

    "Audit" and "Enforce".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Mode">]
- description: 'Increase the value of this property allows users to reset the key
    used

    for securing communication channel between guest and host.'
  name: keyIncarnationId
  types:
  - <xref:int>
- description: 'Specifies the Wire Server endpoint settings while creating the virtual

    machine or virtual machine scale set. Minimum api-version: 2024-03-01.'
  name: wireServer
  types:
  - <xref:<xref:"HostEndpointSettings">>
- description: 'Specifies the IMDS endpoint settings while creating the virtual machine
    or virtual

    machine scale set. Minimum api-version: 2024-03-01.'
  name: imds
  types:
  - <xref:<xref:"HostEndpointSettings">>
- description: 'Specify whether to implicitly install the ProxyAgent Extension.

    This option is currently applicable only for Linux Os.'
  name: addProxyAgentExtension
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.compute.bulkaction.types.ProxyAgentSettings.addProxyAgentExtension
  name: addProxyAgentExtension
  summary: 'Specify whether to implicitly install the ProxyAgent Extension. This option
    is currently

    applicable only for Linux Os.'
  signature: 'addProxyAgentExtension: bool'
- uid: azure.mgmt.compute.bulkaction.types.ProxyAgentSettings.enabled
  name: enabled
  summary: 'Specifies whether ProxyAgent feature should be enabled on the virtual
    machine or virtual

    machine scale set.'
  signature: 'enabled: bool'
- uid: azure.mgmt.compute.bulkaction.types.ProxyAgentSettings.imds
  name: imds
  summary: 'Specifies the IMDS endpoint settings while creating the virtual machine
    or virtual machine

    scale set. Minimum api-version: 2024-03-01.'
  signature: 'imds: HostEndpointSettings'
- uid: azure.mgmt.compute.bulkaction.types.ProxyAgentSettings.keyIncarnationId
  name: keyIncarnationId
  summary: 'Increase the value of this property allows users to reset the key used
    for securing

    communication channel between guest and host.'
  signature: 'keyIncarnationId: int'
- uid: azure.mgmt.compute.bulkaction.types.ProxyAgentSettings.mode
  name: mode
  summary: 'this property has been deprecated,

    please specify ''mode'' under particular hostendpoint setting. Known values are:
    "Audit" and

    "Enforce".'
  signature: 'mode: str | Mode'
- uid: azure.mgmt.compute.bulkaction.types.ProxyAgentSettings.wireServer
  name: wireServer
  summary: 'Specifies the Wire Server endpoint settings while creating the virtual
    machine or virtual

    machine scale set. Minimum api-version: 2024-03-01.'
  signature: 'wireServer: HostEndpointSettings'
