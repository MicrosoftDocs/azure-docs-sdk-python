### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomPriorityProfile
name: BulkCreateCustomPriorityProfile
fullName: azure.mgmt.compute.bulkaction.types.BulkCreateCustomPriorityProfile
module: azure.mgmt.compute.bulkaction.types
summary: Configuration options for Regular or Spot instances in BulkCreateCustom.
constructor:
  syntax: BulkCreateCustomPriorityProfile()
variables:
- description: 'The priority type for VM allocation. Known values are: "Regular" and
    "Spot".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PriorityType">]
- description: Price per hour of each Spot VM will never exceed this.
  name: max_price_per_vm
  types:
  - <xref:float>
- description: 'Eviction Policy to follow when evicting Spot VMs. Known values are:

    "Delete" and "Deallocate".'
  name: eviction_policy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EvictionPolicy">]
- description: 'The allocation strategy for VM size selection. Known values are:

    "LowestPrice" and "Prioritized".'
  name: allocation_strategy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BulkCreateCustomAllocationStrategy">]
attributes:
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomPriorityProfile.allocationStrategy
  name: allocationStrategy
  summary: '"LowestPrice" and

    "Prioritized".'
  signature: 'allocationStrategy: str | BulkCreateCustomAllocationStrategy'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomPriorityProfile.evictionPolicy
  name: evictionPolicy
  summary: '"Delete" and

    "Deallocate".'
  signature: 'evictionPolicy: str | EvictionPolicy'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomPriorityProfile.maxPricePerVM
  name: maxPricePerVM
  summary: Price per hour of each Spot VM will never exceed this.
  signature: 'maxPricePerVM: float'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomPriorityProfile.type
  name: type
  summary: '"Regular" and "Spot".'
  signature: 'type: str | PriorityType'
