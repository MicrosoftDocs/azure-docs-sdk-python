uid: azure.mgmt.compute.bulkaction.types.VirtualMachinePublicIPAddressConfigurationProperties
name: VirtualMachinePublicIPAddressConfigurationProperties
fullName: azure.mgmt.compute.bulkaction.types.VirtualMachinePublicIPAddressConfigurationProperties
module: azure.mgmt.compute.bulkaction.types
summary: Describes a virtual machines IP Configuration's PublicIPAddress configuration.
constructor:
  syntax: VirtualMachinePublicIPAddressConfigurationProperties()
variables:
- description: The idle timeout of the public IP address.
  name: idle_timeout_in_minutes
  types:
  - <xref:int>
- description: 'Specify what happens to the public IP address when the VM is deleted.

    Known values are: "Delete" and "Detach".'
  name: delete_option
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeleteOptions">]
- description: The dns settings to be applied on the publicIP addresses .
  name: dns_settings
