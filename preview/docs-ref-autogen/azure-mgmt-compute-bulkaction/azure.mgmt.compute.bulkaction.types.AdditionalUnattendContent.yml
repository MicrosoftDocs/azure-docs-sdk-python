### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.AdditionalUnattendContent
name: AdditionalUnattendContent
fullName: azure.mgmt.compute.bulkaction.types.AdditionalUnattendContent
module: azure.mgmt.compute.bulkaction.types
summary: 'Specifies additional XML formatted information that can be included in the
  Unattend.xml file,

  which is used by Windows Setup. Contents are defined by setting name, component
  name, and the

  pass in which the content is applied.'
constructor:
  syntax: AdditionalUnattendContent()
variables:
- description: 'The pass name. Currently, the only allowable value is OobeSystem.
    Default

    value is "OobeSystem".'
  name: pass_name
  types:
  - <xref:typing.Literal>["OobeSystem"]
- description: 'The component name. Currently, the only allowable value is

    Microsoft-Windows-Shell-Setup. Default value is "Microsoft-Windows-Shell-Setup".'
  name: component_name
  types:
  - <xref:typing.Literal>["Microsoft-Windows-Shell-Setup"]
- description: 'Specifies the name of the setting to which the content applies. Possible

    values are: FirstLogonCommands and AutoLogon. Known values are: "AutoLogon" and

    "FirstLogonCommands".'
  name: setting_name
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SettingNames">]
- description: 'Specifies the XML formatted content that is added to the unattend.xml
    file for

    the specified path and component. The XML must be less than 4KB and must include
    the root

    element for the setting or feature that is being inserted.'
  name: content
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.compute.bulkaction.types.AdditionalUnattendContent.componentName
  name: componentName
  summary: 'The component name. Currently, the only allowable value is Microsoft-Windows-Shell-Setup.

    Default value is "Microsoft-Windows-Shell-Setup".'
  signature: 'componentName: Literal[''Microsoft-Windows-Shell-Setup'']'
- uid: azure.mgmt.compute.bulkaction.types.AdditionalUnattendContent.content
  name: content
  summary: 'Specifies the XML formatted content that is added to the unattend.xml
    file for the specified

    path and component. The XML must be less than 4KB and must include the root element
    for the

    setting or feature that is being inserted.'
  signature: 'content: str'
- uid: azure.mgmt.compute.bulkaction.types.AdditionalUnattendContent.passName
  name: passName
  summary: 'The pass name. Currently, the only allowable value is OobeSystem. Default
    value is

    "OobeSystem".'
  signature: 'passName: Literal[''OobeSystem'']'
- uid: azure.mgmt.compute.bulkaction.types.AdditionalUnattendContent.settingName
  name: settingName
  summary: 'Specifies the name of the setting to which the content applies. Possible
    values are:

    FirstLogonCommands and AutoLogon. Known values are: "AutoLogon" and "FirstLogonCommands".'
  signature: 'settingName: str | SettingNames'
