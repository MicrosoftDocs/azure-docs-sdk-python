### YamlMime:PythonClass
uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomVmSizeProfile
name: BulkCreateCustomVmSizeProfile
fullName: azure.mgmt.compute.bulkaction.types.BulkCreateCustomVmSizeProfile
module: azure.mgmt.compute.bulkaction.types
summary: 'A VM size profile entry that may additionally carry an optional per-VM-size
  profile override.

  Every VM that the service assigns to this size inherits the override, layered on
  top of the

  operation-level base profile and beneath any per-VM override. Present only on the

  bulkCreateCustom endpoint; the uniform endpoint rejects a non-null override.'
constructor:
  syntax: BulkCreateCustomVmSizeProfile()
variables:
- description: The name of the VM size, eg Standard_D2ads_v5. Required.
  name: name
  types:
  - <xref:str>
- description: The rank of this VM size in the priority order. Required.
  name: rank
  types:
  - <xref:int>
- description: 'Optional per-VM-size profile override applied to every VM the service
    assigns

    to this size. A size maps to many VMs, so virtualMachineName is not part of this
    shape.

    virtualMachineProfile is layered beneath any per-VM override; tags, identity,
    and plan are

    merged with the per-VM override, with the per-VM value winning.'
  name: override
  types:
  - <xref:<xref:"BulkCreateCustomOverrideBase">>
attributes:
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomVmSizeProfile.name
  name: name
  summary: The name of the VM size, eg Standard_D2ads_v5. Required.
  signature: 'name: str'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomVmSizeProfile.override
  name: override
  summary: 'Optional per-VM-size profile override applied to every VM the service
    assigns to this size. A

    size maps to many VMs, so virtualMachineName is not part of this shape. virtualMachineProfile

    is layered beneath any per-VM override; tags, identity, and plan are merged with
    the per-VM

    override, with the per-VM value winning.'
  signature: 'override: BulkCreateCustomOverrideBase'
- uid: azure.mgmt.compute.bulkaction.types.BulkCreateCustomVmSizeProfile.rank
  name: rank
  summary: The rank of this VM size in the priority order. Required.
  signature: 'rank: int'
