### YamlMime:PythonClass
uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams
name: RemoteSharePointKnowledgeSourceParams
fullName: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams
module: azure.search.documents.knowledgebases.types
summary: Specifies runtime parameters for a remote SharePoint knowledge source.
constructor:
  syntax: RemoteSharePointKnowledgeSourceParams()
variables:
- description: The name of the index the params apply to. Required.
  name: knowledgeSourceName
  types:
  - <xref:str>
- description: 'Indicates whether references should be included for data retrieved

    from this source.'
  name: includeReferences
  types:
  - <xref:bool>
- description: 'Indicates whether references should include the structured

    data obtained during retrieval in their payload.'
  name: includeReferenceSourceData
  types:
  - <xref:bool>
- description: 'Indicates that this knowledge source should bypass source selection

    and always be queried at retrieval time.'
  name: alwaysQuerySource
  types:
  - <xref:bool>
- description: 'Indicates that this knowledge source should be excluded from the

    request''s candidate set and never queried at retrieval time. The exclusion is
    request-local and

    does not modify knowledge base membership. Cannot be combined with alwaysQuerySource
    on the

    same knowledge source.'
  name: neverQuerySource
  types:
  - <xref:bool>
- description: 'Indicates that the entire retrieval request should fail if retrieval
    from

    this knowledge source encounters an error. Defaults to false.'
  name: failOnError
  types:
  - <xref:bool>
- description: 'The reranker threshold all retrieved documents must meet to be

    included in the response.'
  name: rerankerThreshold
  types:
  - <xref:float>
- description: 'Overrides the knowledge source''s stored resultsProcessing for this

    retrieve call only. When omitted, the stored knowledge source value applies. Known
    values are:

    "rerank" and "none".'
  name: resultsProcessing
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KnowledgeSourceResultsProcessing">]
- description: 'Limits the maximum number of documents returned from this knowledge

    source.'
  name: maxOutputDocuments
  types:
  - <xref:int>
- description: 'Indicates whether image serving should be enabled for this knowledge

    source at retrieval time. When true, images extracted during ingestion are delivered
    to

    downstream models.'
  name: enableImageServing
  types:
  - <xref:bool>
- description: 'The discriminator value. Required. A knowledge source that reads data
    from remote

    SharePoint.'
  name: kind
  types:
  - <xref:typing.Literal>[KnowledgeSourceKind.REMOTE_SHARE_POINT]
- description: 'A filter condition applied to the SharePoint data source. It must

    be specified in the Keyword Query Language syntax. It will be combined as a conjunction
    with

    the filter expression specified in the knowledge source definition.'
  name: filterExpressionAddOn
  types:
  - <xref:str>
methods:
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.alwaysQuerySource
  name: alwaysQuerySource
  summary: 'Indicates that this knowledge source should bypass source selection and
    always be queried at

    retrieval time.'
  signature: 'alwaysQuerySource: bool'
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.enableImageServing
  name: enableImageServing
  summary: 'Indicates whether image serving should be enabled for this knowledge source
    at retrieval time.

    When true, images extracted during ingestion are delivered to downstream models.'
  signature: 'enableImageServing: bool'
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.failOnError
  name: failOnError
  summary: 'Indicates that the entire retrieval request should fail if retrieval from
    this knowledge source

    encounters an error. Defaults to false.'
  signature: 'failOnError: bool'
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.filterExpressionAddOn
  name: filterExpressionAddOn
  summary: 'A filter condition applied to the SharePoint data source. It must be specified
    in the Keyword

    Query Language syntax. It will be combined as a conjunction with the filter expression

    specified in the knowledge source definition.'
  signature: 'filterExpressionAddOn: str'
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.includeReferenceSourceData
  name: includeReferenceSourceData
  summary: 'Indicates whether references should include the structured data obtained
    during retrieval in

    their payload.'
  signature: 'includeReferenceSourceData: bool'
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.includeReferences
  name: includeReferences
  summary: Indicates whether references should be included for data retrieved from
    this source.
  signature: 'includeReferences: bool'
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.kind
  name: kind
  summary: The discriminator value. Required. A knowledge source that reads data from
    remote SharePoint.
  signature: 'kind: REMOTE_SHARE_POINT: ''remoteSharePoint''>]]'
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.knowledgeSourceName
  name: knowledgeSourceName
  summary: The name of the index the params apply to. Required.
  signature: 'knowledgeSourceName: Required[str]'
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.maxOutputDocuments
  name: maxOutputDocuments
  summary: Limits the maximum number of documents returned from this knowledge source.
  signature: 'maxOutputDocuments: int'
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.neverQuerySource
  name: neverQuerySource
  summary: 'Indicates that this knowledge source should be excluded from the request''s
    candidate set and

    never queried at retrieval time. The exclusion is request-local and does not modify
    knowledge

    base membership. Cannot be combined with alwaysQuerySource on the same knowledge
    source.'
  signature: 'neverQuerySource: bool'
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.rerankerThreshold
  name: rerankerThreshold
  summary: The reranker threshold all retrieved documents must meet to be included
    in the response.
  signature: 'rerankerThreshold: float'
- uid: azure.search.documents.knowledgebases.types.RemoteSharePointKnowledgeSourceParams.resultsProcessing
  name: resultsProcessing
  summary: 'Overrides the knowledge source''s stored resultsProcessing for this retrieve
    call only. When

    omitted, the stored knowledge source value applies. Known values are: "rerank"
    and "none".'
  signature: 'resultsProcessing: str | KnowledgeSourceResultsProcessing'
