### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.ClassicSimilarityAlgorithm
name: ClassicSimilarityAlgorithm
fullName: azure.search.documents.indexes.types.ClassicSimilarityAlgorithm
module: azure.search.documents.indexes.types
summary: 'Legacy similarity algorithm which uses the Lucene TFIDFSimilarity implementation
  of TF-IDF.

  This variation of TF-IDF introduces static document length normalization as well
  as

  coordinating factors that penalize documents that only partially match the searched
  queries.'
constructor:
  syntax: ClassicSimilarityAlgorithm()
variables:
- description: 'The discriminator for derived types. Required. Default value is

    "#Microsoft.Azure.Search.ClassicSimilarity".'
  name: '@odata.type'
  types:
