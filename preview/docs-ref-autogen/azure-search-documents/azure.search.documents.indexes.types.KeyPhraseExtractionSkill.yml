uid: azure.search.documents.indexes.types.KeyPhraseExtractionSkill
name: KeyPhraseExtractionSkill
fullName: azure.search.documents.indexes.types.KeyPhraseExtractionSkill
module: azure.search.documents.indexes.types
summary: A skill that uses text analytics for key phrase extraction.
constructor:
  syntax: KeyPhraseExtractionSkill()
variables:
- description: 'The name of the skill which uniquely identifies it within the skillset.
    A skill

    with no name defined will be given a default name of its 1-based index in the
    skills array,

    prefixed with the character ''#''.'
  name: name
  types:
  - <xref:str>
- description: 'The description of the skill which describes the inputs, outputs,
    and usage

    of the skill.'
  name: description
  types:
  - <xref:str>
- description: 'Represents the level at which operations take place, such as the document
    root

    or document content (for example, /document or /document/content). The default
    is /document.'
  name: context
  types:
  - <xref:str>
- description: 'Inputs of the skills could be a column in the source data set, or
    the output of

    an upstream skill. Required.'
  name: inputs
  types:
  - <xref:list>[<xref:"InputFieldMappingEntry">]
- description: 'The output of a skill is either a field in a search index, or a value
    that can

    be consumed as an input by another skill. Required.'
  name: outputs
  types:
  - <xref:list>[<xref:"OutputFieldMappingEntry">]
- description: 'A value indicating which language code to use. Default is `en`.

    Known values are: "da", "nl", "en", "fi", "fr", "de", "it", "ja", "ko", "no",
    "pl", "pt-PT",

    "pt-BR", "ru", "es", and "sv".'
  name: defaultLanguageCode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KeyPhraseExtractionSkillLanguage">]
- description: 'A number indicating how many key phrases to return. If absent, all

    identified key phrases will be returned.'
  name: maxKeyPhraseCount
  types:
  - <xref:int>
- description: 'The version of the model to use when calling the Text Analytics service.
    It

    will default to the latest available when not specified. We recommend you do not
    specify this

    value unless absolutely necessary.'
  name: modelVersion
  types:
  - <xref:str>
- description: 'A URI fragment specifying the type of skill. Required. Default value
    is

    "#Microsoft.Skills.Text.KeyPhraseExtractionSkill".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Skills.Text.KeyPhraseExtractionSkill"]
