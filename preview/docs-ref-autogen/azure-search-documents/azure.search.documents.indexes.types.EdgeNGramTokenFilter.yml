### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.EdgeNGramTokenFilter
name: EdgeNGramTokenFilter
fullName: azure.search.documents.indexes.types.EdgeNGramTokenFilter
module: azure.search.documents.indexes.types
summary: 'Generates n-grams of the given size(s) starting from the front or the back
  of an input token.

  This token filter is implemented using Apache Lucene.'
constructor:
  syntax: EdgeNGramTokenFilter()
variables:
- description: 'The name of the token filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: The minimum n-gram length. Default is 1. Must be less than the value
    of maxGram.
  name: minGram
  types:
  - <xref:int>
- description: The maximum n-gram length. Default is 2.
  name: maxGram
  types:
  - <xref:int>
- description: 'Specifies which side of the input the n-gram should be generated from.
    Default is

    "front". Known values are: "front" and "back".'
  name: side
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EdgeNGramTokenFilterSide">]
- description: 'A URI fragment specifying the type of token filter. Required. Default

    value is "#Microsoft.Azure.Search.EdgeNGramTokenFilter".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.EdgeNGramTokenFilter"]
