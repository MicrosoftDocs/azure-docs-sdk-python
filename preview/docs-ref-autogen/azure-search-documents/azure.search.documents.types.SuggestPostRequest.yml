### YamlMime:PythonClass
uid: azure.search.documents.types.SuggestPostRequest
name: SuggestPostRequest
fullName: azure.search.documents.types.SuggestPostRequest
module: azure.search.documents.types
summary: SuggestPostRequest.
constructor:
  syntax: SuggestPostRequest()
variables:
- description: An OData expression that filters the documents considered for suggestions.
  name: filter
  types:
  - <xref:str>
- description: 'A value indicating whether to use fuzzy matching for the suggestion
    query. Default

    is false. When set to true, the query will find suggestions even if there''s a
    substituted or

    missing character in the search text. While this provides a better experience
    in some

    scenarios, it comes at a performance cost as fuzzy suggestion searches are slower
    and consume

    more resources.'
  name: fuzzy
  types:
  - <xref:bool>
- description: 'A string tag that is appended to hit highlights. Must be set with

    highlightPreTag. If omitted, hit highlighting of suggestions is disabled.'
  name: highlightPostTag
  types:
  - <xref:str>
- description: 'A string tag that is prepended to hit highlights. Must be set with

    highlightPostTag. If omitted, hit highlighting of suggestions is disabled.'
  name: highlightPreTag
  types:
  - <xref:str>
- description: 'A number between 0 and 100 indicating the percentage of the index
    that

    must be covered by a suggestion query in order for the query to be reported as
    a success. This

    parameter can be useful for ensuring search availability even for services with
    only one

    replica. The default is 80.'
  name: minimumCoverage
  types:
  - <xref:float>
- description: 'The comma-separated list of OData $orderby expressions by which to
    sort the

    results. Each expression can be either a field name or a call to either the geo.distance()
    or

    the search.score() functions. Each expression can be followed by asc to indicate
    ascending, or

    desc to indicate descending. The default is ascending order. Ties will be broken
    by the match

    scores of documents. If no $orderby is specified, the default sort order is descending
    by

    document match score. There can be at most 32 $orderby clauses.'
  name: orderby
  types:
  - <xref:list>[<xref:str>]
- description: 'The search text to use to suggest documents. Must be at least 1 character,
    and no

    more than 100 characters. Required.'
  name: search
  types:
  - <xref:str>
- description: 'The comma-separated list of field names to search for the specified
    search

    text. Target fields must be included in the specified suggester.'
  name: searchFields
  types:
  - <xref:list>[<xref:str>]
- description: 'The comma-separated list of fields to retrieve. If unspecified, only
    the key

    field will be included in the results.'
  name: select
  types:
  - <xref:list>[<xref:str>]
- description: 'The name of the suggester as specified in the suggesters collection
    that''s

    part of the index definition. Required.'
  name: suggesterName
  types:
  - <xref:str>
- description: 'The number of suggestions to retrieve. This must be a value between
    1 and 100. The

    default is 5.'
  name: top
  types:
  - <xref:int>
methods:
- uid: azure.search.documents.types.SuggestPostRequest.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.types.SuggestPostRequest.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.types.SuggestPostRequest.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.types.SuggestPostRequest.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.types.SuggestPostRequest.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.types.SuggestPostRequest.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.types.SuggestPostRequest.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.types.SuggestPostRequest.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.types.SuggestPostRequest.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.types.SuggestPostRequest.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.types.SuggestPostRequest.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.types.SuggestPostRequest.filter
  name: filter
  summary: An OData expression that filters the documents considered for suggestions.
  signature: 'filter: str'
- uid: azure.search.documents.types.SuggestPostRequest.fuzzy
  name: fuzzy
  summary: 'A value indicating whether to use fuzzy matching for the suggestion query.
    Default is false.

    When set to true, the query will find suggestions even if there''s a substituted
    or missing

    character in the search text. While this provides a better experience in some
    scenarios, it

    comes at a performance cost as fuzzy suggestion searches are slower and consume
    more resources.'
  signature: 'fuzzy: bool'
- uid: azure.search.documents.types.SuggestPostRequest.highlightPostTag
  name: highlightPostTag
  summary: 'A string tag that is appended to hit highlights. Must be set with highlightPreTag.
    If omitted,

    hit highlighting of suggestions is disabled.'
  signature: 'highlightPostTag: str'
- uid: azure.search.documents.types.SuggestPostRequest.highlightPreTag
  name: highlightPreTag
  summary: 'A string tag that is prepended to hit highlights. Must be set with highlightPostTag.
    If

    omitted, hit highlighting of suggestions is disabled.'
  signature: 'highlightPreTag: str'
- uid: azure.search.documents.types.SuggestPostRequest.minimumCoverage
  name: minimumCoverage
  summary: 'A number between 0 and 100 indicating the percentage of the index that
    must be covered by a

    suggestion query in order for the query to be reported as a success. This parameter
    can be

    useful for ensuring search availability even for services with only one replica.
    The default is

    80.'
  signature: 'minimumCoverage: float'
- uid: azure.search.documents.types.SuggestPostRequest.orderby
  name: orderby
  summary: 'The comma-separated list of OData $orderby expressions by which to sort
    the results. Each

    expression can be either a field name or a call to either the geo.distance() or
    the

    search.score() functions. Each expression can be followed by asc to indicate ascending,
    or desc

    to indicate descending. The default is ascending order. Ties will be broken by
    the match scores

    of documents. If no $orderby is specified, the default sort order is descending
    by document

    match score. There can be at most 32 $orderby clauses.'
  signature: 'orderby: list[str]'
- uid: azure.search.documents.types.SuggestPostRequest.search
  name: search
  summary: 'The search text to use to suggest documents. Must be at least 1 character,
    and no more than 100

    characters. Required.'
  signature: 'search: str'
- uid: azure.search.documents.types.SuggestPostRequest.searchFields
  name: searchFields
  summary: 'The comma-separated list of field names to search for the specified search
    text. Target fields

    must be included in the specified suggester.'
  signature: 'searchFields: list[str]'
- uid: azure.search.documents.types.SuggestPostRequest.select
  name: select
  summary: 'The comma-separated list of fields to retrieve. If unspecified, only the
    key field will be

    included in the results.'
  signature: 'select: list[str]'
- uid: azure.search.documents.types.SuggestPostRequest.suggesterName
  name: suggesterName
  summary: 'The name of the suggester as specified in the suggesters collection that''s
    part of the index

    definition. Required.'
  signature: 'suggesterName: str'
- uid: azure.search.documents.types.SuggestPostRequest.top
  name: top
  summary: 'The number of suggestions to retrieve. This must be a value between 1
    and 100. The default is

    5.'
  signature: 'top: int'
