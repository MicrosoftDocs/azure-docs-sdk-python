### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.SearchIndexKnowledgeSource
name: SearchIndexKnowledgeSource
fullName: azure.search.documents.indexes.types.SearchIndexKnowledgeSource
module: azure.search.documents.indexes.types
summary: Knowledge Source targeting a search index.
constructor:
  syntax: SearchIndexKnowledgeSource()
variables:
- description: The name of the knowledge source. Required.
  name: name
  types:
  - <xref:str>
- description: Optional user-defined description.
  name: description
  types:
  - <xref:str>
- description: 'Controls whether results from this knowledge source are reranked

    before they are included in the final result set. Defaults to ''rerank'' when
    not specified.

    Known values are: "rerank" and "none".'
  name: resultsProcessing
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KnowledgeSourceResultsProcessing">]
- description: The ETag of the knowledge source.
  name: '@odata.etag'
  types:
  - <xref:str>
- description: 'A description of an encryption key that you create in Azure Key Vault.

    This key is used to provide an additional level of encryption-at-rest for your
    knowledge source

    definition when you want full assurance that no one, not even Microsoft, can decrypt
    them. Once

    you have encrypted your knowledge source definition, it will always remain encrypted.
    The

    search service will ignore attempts to set this property to null. You can change
    this property

    as needed if you want to rotate your encryption key; Your knowledge source definition
    will be

    unaffected. Encryption with customer-managed keys is not available for free search
    services,

    and is only available for paid services created on or after January 1, 2019.'
  name: encryptionKey
  types:
  - <xref:<xref:"SearchResourceEncryptionKey">>
- description: Required. A knowledge source that reads data from a Search Index.
  name: kind
  types:
  - <xref:typing.Literal>[KnowledgeSourceKind.SEARCH_INDEX]
- description: The parameters for the knowledge source. Required.
  name: searchIndexParameters
  types:
  - <xref:<xref:"SearchIndexKnowledgeSourceParameters">>
