uid: azure.search.documents.indexes.types.AIServicesAccountIdentity
name: AIServicesAccountIdentity
fullName: azure.search.documents.indexes.types.AIServicesAccountIdentity
module: azure.search.documents.indexes.types
summary: The multi-region account of an Azure AI service resource that's attached
  to a skillset.
constructor:
  syntax: AIServicesAccountIdentity()
variables:
- description: Description of the Azure AI service resource attached to a skillset.
  name: description
  types:
  - <xref:str>
- description: 'The user-assigned managed identity used for connections to AI Service.
    If not

    specified, the system-assigned managed identity is used. On updates to the skillset,
    if the

    identity is unspecified, the value remains unchanged. If set to "none", the value
    of this

    property is cleared.'
  name: identity
  types:
  - <xref:<xref:"SearchIndexerDataIdentity">>
- description: 'The subdomain/Azure AI Services endpoint url for the corresponding
    AI

    Service. Required.'
  name: subdomainUrl
  types:
  - <xref:str>
- description: 'A URI fragment specifying the type of Azure AI service resource attached

    to a skillset. Required. Default value is "#Microsoft.Azure.Search.AIServicesByIdentity".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.AIServicesByIdentity"]
