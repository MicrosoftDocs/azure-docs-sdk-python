### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.SearchSuggester
name: SearchSuggester
fullName: azure.search.documents.indexes.types.SearchSuggester
module: azure.search.documents.indexes.types
summary: Defines how the Suggest API should apply to a group of fields in the index.
constructor:
  syntax: SearchSuggester()
variables:
- description: The name of the suggester. Required.
  name: name
  types:
  - <xref:str>
- description: 'A value indicating the capabilities of the suggester. Required. Default
    value

    is "analyzingInfixMatching".'
  name: searchMode
  types:
  - <xref:typing.Literal>["analyzingInfixMatching"]
- description: 'The list of field names to which the suggester applies. Each field
    must be

    searchable. Required.'
  name: sourceFields
  types:
  - <xref:list>[<xref:str>]
methods:
- uid: azure.search.documents.indexes.types.SearchSuggester.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.SearchSuggester.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.SearchSuggester.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.SearchSuggester.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.SearchSuggester.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.SearchSuggester.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.SearchSuggester.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.SearchSuggester.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.SearchSuggester.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.SearchSuggester.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.SearchSuggester.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.SearchSuggester.name
  name: name
  summary: The name of the suggester. Required.
  signature: 'name: str'
- uid: azure.search.documents.indexes.types.SearchSuggester.searchMode
  name: searchMode
  summary: 'A value indicating the capabilities of the suggester. Required. Default
    value is

    "analyzingInfixMatching".'
  signature: 'searchMode: Literal[''analyzingInfixMatching'']'
- uid: azure.search.documents.indexes.types.SearchSuggester.sourceFields
  name: sourceFields
  summary: 'The list of field names to which the suggester applies. Each field must
    be searchable.

    Required.'
  signature: 'sourceFields: list[str]'
