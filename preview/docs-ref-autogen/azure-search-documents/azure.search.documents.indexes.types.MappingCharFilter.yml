### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.MappingCharFilter
name: MappingCharFilter
fullName: azure.search.documents.indexes.types.MappingCharFilter
module: azure.search.documents.indexes.types
summary: 'A character filter that applies mappings defined with the mappings option.
  Matching is greedy

  (longest pattern matching at a given point wins). Replacement is allowed to be the
  empty

  string. This character filter is implemented using Apache Lucene.'
constructor:
  syntax: MappingCharFilter()
variables:
- description: 'The name of the char filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: 'A list of mappings of the following format: "a=>b" (all occurrences
    of the

    character "a" will be replaced with character "b"). Required.'
  name: mappings
  types:
  - <xref:list>[<xref:str>]
- description: 'A URI fragment specifying the type of char filter. Required. Default

    value is "#Microsoft.Azure.Search.MappingCharFilter".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.MappingCharFilter"]
methods:
- uid: azure.search.documents.indexes.types.MappingCharFilter.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.MappingCharFilter.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.MappingCharFilter.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.MappingCharFilter.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.MappingCharFilter.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.MappingCharFilter.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.MappingCharFilter.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.MappingCharFilter.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.MappingCharFilter.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.MappingCharFilter.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.MappingCharFilter.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.MappingCharFilter.mappings
  name: mappings
  signature: 'mappings: list[str]'
- uid: azure.search.documents.indexes.types.MappingCharFilter.name
  name: name
  signature: 'name: str'
