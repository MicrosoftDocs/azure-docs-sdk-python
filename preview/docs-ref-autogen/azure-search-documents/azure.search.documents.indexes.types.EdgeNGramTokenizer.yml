### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.EdgeNGramTokenizer
name: EdgeNGramTokenizer
fullName: azure.search.documents.indexes.types.EdgeNGramTokenizer
module: azure.search.documents.indexes.types
summary: 'Tokenizes the input from an edge into n-grams of the given size(s). This
  tokenizer is

  implemented using Apache Lucene.'
constructor:
  syntax: EdgeNGramTokenizer()
variables:
- description: 'The name of the tokenizer. It must only contain letters, digits, spaces,
    dashes or

    underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: 'The minimum n-gram length. Default is 1. Maximum is 300. Must be less
    than the

    value of maxGram.'
  name: minGram
  types:
  - <xref:int>
- description: The maximum n-gram length. Default is 2. Maximum is 300.
  name: maxGram
  types:
  - <xref:int>
- description: Character classes to keep in the tokens.
  name: tokenChars
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"TokenCharacterKind">]]
- description: 'A URI fragment specifying the type of tokenizer. Required. Default
    value

    is "#Microsoft.Azure.Search.EdgeNGramTokenizer".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.EdgeNGramTokenizer"]
