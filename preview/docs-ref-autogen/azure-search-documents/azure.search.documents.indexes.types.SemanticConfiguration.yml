### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.SemanticConfiguration
name: SemanticConfiguration
fullName: azure.search.documents.indexes.types.SemanticConfiguration
module: azure.search.documents.indexes.types
summary: Defines a specific configuration to be used in the context of semantic capabilities.
constructor:
  syntax: SemanticConfiguration()
variables:
- description: The name of the semantic configuration. Required.
  name: name
  types:
  - <xref:str>
- description: 'Describes the title, content, and keyword fields to be used for

    semantic ranking, captions, highlights, and answers. At least one of the three
    sub properties

    (titleField, prioritizedKeywordsFields and prioritizedContentFields) need to be
    set. Required.'
  name: prioritizedFields
  types:
  - <xref:<xref:"SemanticPrioritizedFields">>
- description: 'Specifies the score type to be used for the sort order of the search

    results. Known values are: "BoostedRerankerScore" and "RerankerScore".'
  name: rankingOrder
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RankingOrder">]
- description: 'Determines which semantic or query rewrite models to use during model

    flighting/upgrades.'
  name: flightingOptIn
  types:
  - <xref:bool>
methods:
- uid: azure.search.documents.indexes.types.SemanticConfiguration.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.SemanticConfiguration.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.SemanticConfiguration.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.SemanticConfiguration.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.SemanticConfiguration.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.SemanticConfiguration.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.SemanticConfiguration.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.SemanticConfiguration.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.SemanticConfiguration.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.SemanticConfiguration.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.SemanticConfiguration.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.SemanticConfiguration.flightingOptIn
  name: flightingOptIn
  summary: Determines which semantic or query rewrite models to use during model flighting/upgrades.
  signature: 'flightingOptIn: bool'
- uid: azure.search.documents.indexes.types.SemanticConfiguration.name
  name: name
  summary: The name of the semantic configuration. Required.
  signature: 'name: Required[str]'
- uid: azure.search.documents.indexes.types.SemanticConfiguration.prioritizedFields
  name: prioritizedFields
  summary: 'Describes the title, content, and keyword fields to be used for semantic
    ranking, captions,

    highlights, and answers. At least one of the three sub properties (titleField,

    prioritizedKeywordsFields and prioritizedContentFields) need to be set. Required.'
  signature: 'prioritizedFields: Required[SemanticPrioritizedFields]'
- uid: azure.search.documents.indexes.types.SemanticConfiguration.rankingOrder
  name: rankingOrder
  summary: 'Specifies the score type to be used for the sort order of the search results.
    Known values are:

    "BoostedRerankerScore" and "RerankerScore".'
  signature: 'rankingOrder: str | RankingOrder | None'
