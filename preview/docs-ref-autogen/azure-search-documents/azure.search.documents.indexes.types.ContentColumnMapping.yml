### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.ContentColumnMapping
name: ContentColumnMapping
fullName: azure.search.documents.indexes.types.ContentColumnMapping
module: azure.search.documents.indexes.types
summary: Maps a SQL column to a search index field.
constructor:
  syntax: ContentColumnMapping()
variables:
- description: Target index field name. Required.
  name: name
  types:
  - <xref:str>
- description: SQL column name. Required.
  name: sourceField
  types:
  - <xref:str>
- description: Azure AI Search field type (e.g., Edm.String, Edm.Int32). Required.
  name: searchFieldType
  types:
  - <xref:str>
methods:
- uid: azure.search.documents.indexes.types.ContentColumnMapping.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.ContentColumnMapping.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.ContentColumnMapping.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.ContentColumnMapping.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.ContentColumnMapping.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.ContentColumnMapping.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.ContentColumnMapping.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.ContentColumnMapping.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.ContentColumnMapping.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.ContentColumnMapping.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.ContentColumnMapping.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.ContentColumnMapping.name
  name: name
  summary: Target index field name. Required.
  signature: 'name: str'
- uid: azure.search.documents.indexes.types.ContentColumnMapping.searchFieldType
  name: searchFieldType
  summary: Azure AI Search field type (e.g., Edm.String, Edm.Int32). Required.
  signature: 'searchFieldType: str'
- uid: azure.search.documents.indexes.types.ContentColumnMapping.sourceField
  name: sourceField
  summary: SQL column name. Required.
  signature: 'sourceField: str'
