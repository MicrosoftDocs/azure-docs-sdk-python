### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.WebApiVectorizer
name: WebApiVectorizer
fullName: azure.search.documents.indexes.types.WebApiVectorizer
module: azure.search.documents.indexes.types
summary: 'Specifies a user-defined vectorizer for generating the vector embedding
  of a query string.

  Integration of an external vectorizer is achieved using the custom Web API interface
  of a

  skillset.'
constructor:
  syntax: WebApiVectorizer()
variables:
- description: The name to associate with this particular vectorization method. Required.
  name: name
  types:
  - <xref:str>
- description: Specifies the properties of the user-defined vectorizer.
  name: customWebApiParameters
  types:
  - <xref:<xref:"WebApiVectorizerParameters">>
- description: 'The name of the kind of vectorization method being configured for
    use with vector

    search. Required. Generate embeddings using a custom web endpoint at query time.'
  name: kind
  types:
  - <xref:typing.Literal>[VectorSearchVectorizerKind.CUSTOM_WEB_API]
methods:
- uid: azure.search.documents.indexes.types.WebApiVectorizer.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.WebApiVectorizer.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.WebApiVectorizer.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.WebApiVectorizer.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.WebApiVectorizer.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.WebApiVectorizer.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.WebApiVectorizer.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.WebApiVectorizer.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.WebApiVectorizer.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.WebApiVectorizer.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.WebApiVectorizer.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.WebApiVectorizer.customWebApiParameters
  name: customWebApiParameters
  summary: Specifies the properties of the user-defined vectorizer.
  signature: 'customWebApiParameters: WebApiVectorizerParameters'
- uid: azure.search.documents.indexes.types.WebApiVectorizer.kind
  name: kind
  summary: 'The name of the kind of vectorization method being configured for use
    with vector search.

    Required. Generate embeddings using a custom web endpoint at query time.'
  signature: 'kind: CUSTOM_WEB_API: ''customWebApi''>]'
- uid: azure.search.documents.indexes.types.WebApiVectorizer.name
  name: name
  summary: The name to associate with this particular vectorization method. Required.
  signature: 'name: str'
