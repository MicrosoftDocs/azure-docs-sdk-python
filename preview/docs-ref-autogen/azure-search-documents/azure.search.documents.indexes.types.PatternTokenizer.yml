### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.PatternTokenizer
name: PatternTokenizer
fullName: azure.search.documents.indexes.types.PatternTokenizer
module: azure.search.documents.indexes.types
summary: 'Tokenizer that uses regex pattern matching to construct distinct tokens.
  This tokenizer is

  implemented using Apache Lucene.'
constructor:
  syntax: PatternTokenizer()
variables:
- description: 'The name of the tokenizer. It must only contain letters, digits, spaces,
    dashes or

    underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: 'A regular expression pattern to match token separators. Default is
    an expression

    that matches one or more non-word characters.'
  name: pattern
  types:
  - <xref:str>
- description: 'Regular expression flags, specified as a ''|'' separated string of
    RegexFlags

    values.'
  name: flags
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"RegexFlags">]]
- description: 'The zero-based ordinal of the matching group in the regular expression
    pattern to

    extract into tokens. Use -1 if you want to use the entire pattern to split the
    input into

    tokens, irrespective of matching groups. Default is -1.'
  name: group
  types:
  - <xref:int>
- description: 'A URI fragment specifying the type of tokenizer. Required. Default
    value

    is "#Microsoft.Azure.Search.PatternTokenizer".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.PatternTokenizer"]
methods:
- uid: azure.search.documents.indexes.types.PatternTokenizer.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.PatternTokenizer.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.PatternTokenizer.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.PatternTokenizer.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.PatternTokenizer.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.PatternTokenizer.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.PatternTokenizer.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.PatternTokenizer.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.PatternTokenizer.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.PatternTokenizer.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.PatternTokenizer.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.PatternTokenizer.flags
  name: flags
  signature: 'flags: list[typing.Union[str, ForwardRef(''RegexFlags'')]]'
- uid: azure.search.documents.indexes.types.PatternTokenizer.group
  name: group
  signature: 'group: int'
- uid: azure.search.documents.indexes.types.PatternTokenizer.name
  name: name
  signature: 'name: Required[str]'
- uid: azure.search.documents.indexes.types.PatternTokenizer.pattern
  name: pattern
  signature: 'pattern: str'
