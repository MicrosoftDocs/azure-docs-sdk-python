### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.CustomNormalizer
name: CustomNormalizer
fullName: azure.search.documents.indexes.types.CustomNormalizer
module: azure.search.documents.indexes.types
summary: 'Allows you to configure normalization for filterable, sortable, and facetable
  fields, which by

  default operate with strict matching. This is a user-defined configuration consisting
  of at

  least one or more filters, which modify the token that is stored.'
constructor:
  syntax: CustomNormalizer()
variables:
- description: 'The name of the char filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: 'A list of token filters used to filter out or modify the input token.
    For

    example, you can specify a lowercase filter that converts all characters to lowercase.
    The

    filters are run in the order in which they are listed.'
  name: tokenFilters
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"TokenFilterName">]]
- description: 'A list of character filters used to prepare input text before it is

    processed. For instance, they can replace certain characters or symbols. The filters
    are run in

    the order in which they are listed.'
  name: charFilters
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"CharFilterName">]]
- description: 'A URI fragment specifying the type of normalizer. Required. Default

    value is "#Microsoft.Azure.Search.CustomNormalizer".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.CustomNormalizer"]
