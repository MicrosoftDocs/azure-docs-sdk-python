name: AzureMachineLearningVectorizer
fullName: azure.search.documents.indexes.types.AzureMachineLearningVectorizer
module: azure.search.documents.indexes.types
summary: 'Specifies an Azure Machine Learning endpoint deployed via the Azure AI Foundry
  Model Catalog

  for generating the vector embedding of a query string.'
constructor:
  syntax: AzureMachineLearningVectorizer()
variables:
- description: The name to associate with this particular vectorization method. Required.
  name: name
  types:
