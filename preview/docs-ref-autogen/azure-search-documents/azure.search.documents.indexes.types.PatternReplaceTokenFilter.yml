### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.PatternReplaceTokenFilter
name: PatternReplaceTokenFilter
fullName: azure.search.documents.indexes.types.PatternReplaceTokenFilter
module: azure.search.documents.indexes.types
summary: 'A character filter that replaces characters in the input string. It uses
  a regular expression

  to identify character sequences to preserve and a replacement pattern to identify
  characters to

  replace. For example, given the input text "aa bb aa bb", pattern "(aa)\s+(bb)",
  and

  replacement "$1#$2", the result would be "aa#bb aa#bb". This token filter is implemented
  using

  Apache Lucene.'
constructor:
  syntax: PatternReplaceTokenFilter()
variables:
- description: 'The name of the token filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: A regular expression pattern. Required.
  name: pattern
  types:
  - <xref:str>
- description: The replacement text. Required.
  name: replacement
  types:
  - <xref:str>
- description: 'A URI fragment specifying the type of token filter. Required. Default

    value is "#Microsoft.Azure.Search.PatternReplaceTokenFilter".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.PatternReplaceTokenFilter"]
