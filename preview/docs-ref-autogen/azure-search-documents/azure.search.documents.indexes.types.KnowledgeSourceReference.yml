### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.KnowledgeSourceReference
name: KnowledgeSourceReference
fullName: azure.search.documents.indexes.types.KnowledgeSourceReference
module: azure.search.documents.indexes.types
summary: Reference to a knowledge source.
constructor:
  syntax: KnowledgeSourceReference()
variables:
- description: The name of the knowledge source. Required.
  name: name
  types:
  - <xref:str>
- description: 'Indicates whether image serving should be enabled for this knowledge

    source. When true, images extracted during ingestion are delivered to downstream
    models at

    query time.'
  name: enableImageServing
  types:
  - <xref:bool>
- description: 'Indicates whether freshness-aware retrieval should be enabled for
    this

    knowledge source. When true, a freshness scoring profile is applied during retrieval
    to bias

    results toward newer documents.'
  name: enableFreshness
  types:
  - <xref:bool>
methods:
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.enableFreshness
  name: enableFreshness
  summary: 'Indicates whether freshness-aware retrieval should be enabled for this
    knowledge source. When

    true, a freshness scoring profile is applied during retrieval to bias results
    toward newer

    documents.'
  signature: 'enableFreshness: bool'
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.enableImageServing
  name: enableImageServing
  summary: 'Indicates whether image serving should be enabled for this knowledge source.
    When true, images

    extracted during ingestion are delivered to downstream models at query time.'
  signature: 'enableImageServing: bool'
- uid: azure.search.documents.indexes.types.KnowledgeSourceReference.name
  name: name
  summary: The name of the knowledge source. Required.
  signature: 'name: str'
