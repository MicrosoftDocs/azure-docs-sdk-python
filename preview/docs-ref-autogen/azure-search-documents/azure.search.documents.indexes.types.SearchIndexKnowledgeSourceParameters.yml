### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.SearchIndexKnowledgeSourceParameters
name: SearchIndexKnowledgeSourceParameters
fullName: azure.search.documents.indexes.types.SearchIndexKnowledgeSourceParameters
module: azure.search.documents.indexes.types
summary: Parameters for search index knowledge source.
constructor:
  syntax: SearchIndexKnowledgeSourceParameters()
variables:
- description: The name of the Search index. Required.
  name: searchIndexName
  types:
  - <xref:str>
- description: Used to request additional fields for referenced source data.
  name: sourceDataFields
  types:
  - <xref:list>[<xref:"SearchIndexFieldReference">]
- description: Used to restrict which fields to search on the search index.
  name: searchFields
  types:
  - <xref:list>[<xref:"SearchIndexFieldReference">]
- description: 'Used to specify a different semantic configuration on the

    target search index other than the default one.'
  name: semanticConfigurationName
  types:
  - <xref:str>
- description: 'A default filter condition applied to the index at retrieval time
    (e.g.,

    ''State eq VA''). Can be overridden at query time via knowledge source runtime
    parameters.'
  name: baseFilter
  types:
  - <xref:str>
- description: 'Default hints that guide query planning toward useful filters and
    boosts for

    this search index knowledge source. Request-time query hints replace these defaults
    as a

    complete object.'
  name: queryHints
  types:
  - <xref:<xref:"SearchIndexKnowledgeSourceQueryHints">>
