### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.TagScoringFunction
name: TagScoringFunction
fullName: azure.search.documents.indexes.types.TagScoringFunction
module: azure.search.documents.indexes.types
summary: 'Defines a function that boosts scores of documents with string values matching
  a given list of

  tags.'
constructor:
  syntax: TagScoringFunction()
variables:
- description: The name of the field used as input to the scoring function. Required.
  name: fieldName
  types:
  - <xref:str>
- description: 'A multiplier for the raw score. Must be a positive number not equal
    to 1.0.

    Required.'
  name: boost
  types:
  - <xref:float>
- description: 'A value indicating how boosting will be interpolated across document

    scores; defaults to "Linear". Known values are: "linear", "constant", "quadratic",
    and

    "logarithmic".'
  name: interpolation
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScoringFunctionInterpolation">]
- description: Parameter values for the tag scoring function. Required.
  name: tag
  types:
  - <xref:<xref:"TagScoringParameters">>
- description: 'Indicates the type of function to use. Valid values include magnitude,
    freshness,

    distance, and tag. The function type must be lower case. Required. Default value
    is "tag".'
  name: type
  types:
  - <xref:typing.Literal>["tag"]
methods:
- uid: azure.search.documents.indexes.types.TagScoringFunction.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.TagScoringFunction.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.TagScoringFunction.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.TagScoringFunction.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.TagScoringFunction.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.TagScoringFunction.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.TagScoringFunction.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.TagScoringFunction.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.TagScoringFunction.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.TagScoringFunction.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.TagScoringFunction.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.TagScoringFunction.boost
  name: boost
  summary: A multiplier for the raw score. Must be a positive number not equal to
    1.0. Required.
  signature: 'boost: Required[float]'
- uid: azure.search.documents.indexes.types.TagScoringFunction.fieldName
  name: fieldName
  summary: The name of the field used as input to the scoring function. Required.
  signature: 'fieldName: Required[str]'
- uid: azure.search.documents.indexes.types.TagScoringFunction.interpolation
  name: interpolation
  summary: 'A value indicating how boosting will be interpolated across document scores;
    defaults to

    "Linear". Known values are: "linear", "constant", "quadratic", and "logarithmic".'
  signature: 'interpolation: str | ScoringFunctionInterpolation'
- uid: azure.search.documents.indexes.types.TagScoringFunction.tag
  name: tag
  summary: Parameter values for the tag scoring function. Required.
  signature: 'tag: Required[TagScoringParameters]'
- uid: azure.search.documents.indexes.types.TagScoringFunction.type
  name: type
  summary: 'Indicates the type of function to use. Valid values include magnitude,
    freshness, distance, and

    tag. The function type must be lower case. Required. Default value is "tag".'
  signature: 'type: Required[Literal[''tag'']]'
