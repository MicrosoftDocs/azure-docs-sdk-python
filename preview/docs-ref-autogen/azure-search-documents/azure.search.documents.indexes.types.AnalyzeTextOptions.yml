### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.AnalyzeTextOptions
name: AnalyzeTextOptions
fullName: azure.search.documents.indexes.types.AnalyzeTextOptions
module: azure.search.documents.indexes.types
summary: Specifies some text and analysis components used to break that text into
  tokens.
constructor:
  syntax: AnalyzeTextOptions()
variables:
- description: The text to break into tokens. Required.
  name: text
  types:
  - <xref:str>
- description: 'The name of the analyzer to use to break the given text. If this parameter
    is

    not specified, you must specify a tokenizer instead. The tokenizer and analyzer
    parameters are

    mutually exclusive. Known values are: "ar.microsoft", "ar.lucene", "hy.lucene",
    "bn.microsoft",

    "eu.lucene", "bg.microsoft", "bg.lucene", "ca.microsoft", "ca.lucene", "zh-Hans.microsoft",

    "zh-Hans.lucene", "zh-Hant.microsoft", "zh-Hant.lucene", "hr.microsoft", "cs.microsoft",

    "cs.lucene", "da.microsoft", "da.lucene", "nl.microsoft", "nl.lucene", "en.microsoft",

    "en.lucene", "et.microsoft", "fi.microsoft", "fi.lucene", "fr.microsoft", "fr.lucene",

    "gl.lucene", "de.microsoft", "de.lucene", "el.microsoft", "el.lucene", "gu.microsoft",

    "he.microsoft", "hi.microsoft", "hi.lucene", "hu.microsoft", "hu.lucene", "is.microsoft",

    "id.microsoft", "id.lucene", "ga.lucene", "it.microsoft", "it.lucene", "ja.microsoft",

    "ja.lucene", "kn.microsoft", "ko.microsoft", "ko.lucene", "lv.microsoft", "lv.lucene",

    "lt.microsoft", "ml.microsoft", "ms.microsoft", "mr.microsoft", "nb.microsoft",
    "no.lucene",

    "fa.lucene", "pl.microsoft", "pl.lucene", "pt-BR.microsoft", "pt-BR.lucene", "pt-PT.microsoft",

    "pt-PT.lucene", "pa.microsoft", "ro.microsoft", "ro.lucene", "ru.microsoft", "ru.lucene",

    "sr-cyrillic.microsoft", "sr-latin.microsoft", "sk.microsoft", "sl.microsoft",
    "es.microsoft",

    "es.lucene", "sv.microsoft", "sv.lucene", "ta.microsoft", "te.microsoft", "th.microsoft",

    "th.lucene", "tr.microsoft", "tr.lucene", "uk.microsoft", "ur.microsoft", "vi.microsoft",

    "standard.lucene", "standardasciifolding.lucene", "keyword", "pattern", "simple",
    "stop", and

    "whitespace".'
  name: analyzer
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LexicalAnalyzerName">]
- description: 'The name of the tokenizer to use to break the given text. If this
    parameter is

    not specified, you must specify an analyzer instead. The tokenizer and analyzer
    parameters are

    mutually exclusive. Known values are: "classic", "edgeNGram", "keyword_v2", "letter",

    "lowercase", "microsoft_language_tokenizer", "microsoft_language_stemming_tokenizer",
    "nGram",

    "path_hierarchy_v2", "pattern", "standard_v2", "uax_url_email", and "whitespace".'
  name: tokenizer
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LexicalTokenizerName">]
- description: 'The name of the normalizer to use to normalize the given text. Known
    values

    are: "asciifolding", "elision", "lowercase", "standard", and "uppercase".'
  name: normalizer
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LexicalNormalizerName">]
- description: 'An optional list of token filters to use when breaking the given text.
    This

    parameter can only be set when using the tokenizer parameter.'
  name: tokenFilters
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"TokenFilterName">]]
- description: 'An optional list of character filters to use when breaking the given
    text.

    This parameter can only be set when using the tokenizer parameter.'
  name: charFilters
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"CharFilterName">]]
methods:
- uid: azure.search.documents.indexes.types.AnalyzeTextOptions.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.AnalyzeTextOptions.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.AnalyzeTextOptions.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.AnalyzeTextOptions.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.AnalyzeTextOptions.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.AnalyzeTextOptions.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.AnalyzeTextOptions.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.AnalyzeTextOptions.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.AnalyzeTextOptions.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.AnalyzeTextOptions.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.AnalyzeTextOptions.values
  name: values
  signature: values() -> an object providing a view on D's values
