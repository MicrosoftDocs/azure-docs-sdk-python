### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.CjkBigramTokenFilter
name: CjkBigramTokenFilter
fullName: azure.search.documents.indexes.types.CjkBigramTokenFilter
module: azure.search.documents.indexes.types
summary: 'Forms bigrams of CJK terms that are generated from the standard tokenizer.
  This token filter is

  implemented using Apache Lucene.'
constructor:
  syntax: CjkBigramTokenFilter()
variables:
- description: 'The name of the token filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: The scripts to ignore.
  name: ignoreScripts
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"CjkBigramTokenFilterScripts">]]
- description: 'A value indicating whether to output both unigrams and bigrams (if
    true),

    or just bigrams (if false). Default is false.'
  name: outputUnigrams
  types:
  - <xref:bool>
- description: 'A URI fragment specifying the type of token filter. Required. Default

    value is "#Microsoft.Azure.Search.CjkBigramTokenFilter".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.CjkBigramTokenFilter"]
