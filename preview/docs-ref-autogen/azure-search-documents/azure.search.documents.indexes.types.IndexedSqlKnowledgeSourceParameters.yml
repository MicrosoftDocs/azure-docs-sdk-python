  - <xref:list>[<xref:"ContentColumnMapping">]
- description: 'Optional column mappings for embedding vector fields. If omitted,
    no

    vector fields are created.'
  name: embeddingColumns
  types:
  - <xref:list>[<xref:"EmbeddingColumnMapping">]
- description: 'Consolidates all general ingestion settings including embedding

    model, schedule, and identity.'
  name: ingestionParameters
  types:
  - <xref:<xref:"KnowledgeSourceIngestionParameters">>
- description: 'Default hints that guide query planning toward useful filters and
    boosts for

    this index-backed knowledge source. Request-time query hints replace these defaults
    as a

    complete object.'
  name: queryHints
  types:
  - <xref:<xref:"SearchIndexKnowledgeSourceQueryHints">>
- description: Resources created by the knowledge source.
  name: createdResources
  types:
  - <xref:<xref:"CreatedResources">>
