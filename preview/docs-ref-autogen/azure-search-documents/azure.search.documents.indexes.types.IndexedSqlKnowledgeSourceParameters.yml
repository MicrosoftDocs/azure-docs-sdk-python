uid: azure.search.documents.indexes.types.IndexedSqlKnowledgeSourceParameters
name: IndexedSqlKnowledgeSourceParameters
fullName: azure.search.documents.indexes.types.IndexedSqlKnowledgeSourceParameters
module: azure.search.documents.indexes.types
summary: Parameters for indexed SQL knowledge source.
constructor:
  syntax: IndexedSqlKnowledgeSourceParameters()
variables:
- description: 'The connection string for the Azure SQL Database or SQL Managed

    Instance. Required.'
  name: connectionString
  types:
  - <xref:str>
- description: 'The name of the table or view to index. Can be schema-qualified (e.g.,

    ''dbo.MyTable''). Required.'
  name: tableOrView
  types:
  - <xref:str>
- description: 'Optional column name for high water mark change detection. If

    provided, uses HighWaterMarkChangeDetectionPolicy.'
