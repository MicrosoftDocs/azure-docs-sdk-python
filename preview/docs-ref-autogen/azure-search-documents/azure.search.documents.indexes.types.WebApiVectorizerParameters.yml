  name: authIdentity
  summary: 'The user-assigned managed identity used for outbound connections. If an
    authResourceId is

    provided and it''s not specified, the system-assigned managed identity is used.
    On updates to

    the indexer, if the identity is unspecified, the value remains unchanged. If set
