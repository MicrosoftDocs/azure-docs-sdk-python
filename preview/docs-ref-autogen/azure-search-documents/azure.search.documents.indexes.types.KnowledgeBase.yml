### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.KnowledgeBase
name: KnowledgeBase
fullName: azure.search.documents.indexes.types.KnowledgeBase
module: azure.search.documents.indexes.types
summary: Represents a knowledge base definition.
constructor:
  syntax: KnowledgeBase()
variables:
- description: The name of the knowledge base. Required.
  name: name
  types:
  - <xref:str>
- description: Knowledge sources referenced by this knowledge base. Required.
  name: knowledgeSources
  types:
  - <xref:list>[<xref:"KnowledgeSourceReference">]
- description: Contains configuration options on how to connect to AI models.
  name: models
  types:
  - <xref:list>[<xref:"KnowledgeBaseModel">]
- description: The retrieval reasoning effort configuration.
  name: retrievalReasoningEffort
  types:
  - <xref:<xref:"KnowledgeRetrievalReasoningEffort">>
- description: 'The output mode for the knowledge base. Known values are: "extractiveData"

    and "answerSynthesis".'
  name: outputMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KnowledgeRetrievalOutputMode">]
- description: The ETag of the knowledge base.
  name: '@odata.etag'
  types:
  - <xref:str>
- description: A description of an encryption key that you create in Azure Key Vault.
  name: encryptionKey
  types:
  - <xref:<xref:"SearchResourceEncryptionKey">>
- description: The description of the knowledge base.
  name: description
  types:
  - <xref:str>
- description: 'User-defined key-value pairs for categorizing the knowledge base and
    attributing

    its usage and costs.'
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'Instructions considered by the knowledge base when developing

    query plan.'
  name: retrievalInstructions
  types:
  - <xref:str>
- description: 'Instructions considered by the knowledge base when generating

    answers.'
  name: answerInstructions
  types:
  - <xref:str>
- description: 'Options to control Cross-Origin Resource Sharing (CORS) for the knowledge

    base.'
  name: corsOptions
  types:
  - <xref:<xref:"CorsOptions">>
- description: 'Persisted request-wide retrieve defaults for this knowledge base.
    These

    values apply to retrieve requests that omit the corresponding fields; request-time
    values take

    precedence when present.'
  name: retrieveDefaults
  types:
  - <xref:<xref:"KnowledgeBaseRetrieveDefaults">>
methods:
- uid: azure.search.documents.indexes.types.KnowledgeBase.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.KnowledgeBase.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.KnowledgeBase.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.KnowledgeBase.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.KnowledgeBase.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.KnowledgeBase.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.KnowledgeBase.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.KnowledgeBase.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.KnowledgeBase.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.KnowledgeBase.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.KnowledgeBase.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.KnowledgeBase.answerInstructions
  name: answerInstructions
  signature: 'answerInstructions: str'
- uid: azure.search.documents.indexes.types.KnowledgeBase.corsOptions
  name: corsOptions
  signature: 'corsOptions: CorsOptions'
- uid: azure.search.documents.indexes.types.KnowledgeBase.description
  name: description
  signature: 'description: str'
- uid: azure.search.documents.indexes.types.KnowledgeBase.encryptionKey
  name: encryptionKey
  signature: 'encryptionKey: SearchResourceEncryptionKey | None'
- uid: azure.search.documents.indexes.types.KnowledgeBase.knowledgeSources
  name: knowledgeSources
  signature: 'knowledgeSources: Required[list[''KnowledgeSourceReference'']]'
- uid: azure.search.documents.indexes.types.KnowledgeBase.models
  name: models
  signature: 'models: list[''KnowledgeBaseModel'']'
- uid: azure.search.documents.indexes.types.KnowledgeBase.name
  name: name
  signature: 'name: Required[str]'
- uid: azure.search.documents.indexes.types.KnowledgeBase.outputMode
  name: outputMode
  signature: 'outputMode: str | KnowledgeRetrievalOutputMode'
- uid: azure.search.documents.indexes.types.KnowledgeBase.retrievalInstructions
  name: retrievalInstructions
  signature: 'retrievalInstructions: str'
- uid: azure.search.documents.indexes.types.KnowledgeBase.retrievalReasoningEffort
  name: retrievalReasoningEffort
  signature: 'retrievalReasoningEffort: KnowledgeRetrievalReasoningEffort'
- uid: azure.search.documents.indexes.types.KnowledgeBase.retrieveDefaults
  name: retrieveDefaults
  signature: 'retrieveDefaults: KnowledgeBaseRetrieveDefaults'
- uid: azure.search.documents.indexes.types.KnowledgeBase.tags
  name: tags
  signature: 'tags: dict[str, str]'
