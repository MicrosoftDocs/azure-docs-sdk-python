### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration
name: ExhaustiveKnnAlgorithmConfiguration
fullName: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration
module: azure.search.documents.indexes.types
summary: 'Contains configuration options specific to the exhaustive KNN algorithm
  used during querying,

  which will perform brute-force search across the entire vector index.'
constructor:
  syntax: ExhaustiveKnnAlgorithmConfiguration()
variables:
- description: The name to associate with this particular configuration. Required.
  name: name
  types:
  - <xref:str>
- description: Contains the parameters specific to exhaustive KNN algorithm.
  name: exhaustiveKnnParameters
  types:
  - <xref:<xref:"ExhaustiveKnnParameters">>
- description: 'The name of the kind of algorithm being configured for use with vector
    search.

    Required. Exhaustive KNN algorithm which will perform brute-force search.'
  name: kind
  types:
  - <xref:typing.Literal>[VectorSearchAlgorithmKind.EXHAUSTIVE_KNN]
methods:
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.exhaustiveKnnParameters
  name: exhaustiveKnnParameters
  summary: Contains the parameters specific to exhaustive KNN algorithm.
  signature: 'exhaustiveKnnParameters: ExhaustiveKnnParameters'
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.kind
  name: kind
  summary: 'The name of the kind of algorithm being configured for use with vector
    search. Required.

    Exhaustive KNN algorithm which will perform brute-force search.'
  signature: 'kind: EXHAUSTIVE_KNN: ''exhaustiveKnn''>]'
- uid: azure.search.documents.indexes.types.ExhaustiveKnnAlgorithmConfiguration.name
  name: name
  summary: The name to associate with this particular configuration. Required.
  signature: 'name: str'
