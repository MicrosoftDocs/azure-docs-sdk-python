### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.SnowballTokenFilter
name: SnowballTokenFilter
fullName: azure.search.documents.indexes.types.SnowballTokenFilter
module: azure.search.documents.indexes.types
summary: 'A filter that stems words using a Snowball-generated stemmer. This token
  filter is implemented

  using Apache Lucene.'
constructor:
  syntax: SnowballTokenFilter()
variables:
- description: 'The name of the token filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: 'The language to use. Required. Known values are: "armenian", "basque",

    "catalan", "danish", "dutch", "english", "finnish", "french", "german", "german2",
    "hungarian",

    "italian", "kp", "lovins", "norwegian", "porter", "portuguese", "romanian", "russian",

    "spanish", "swedish", and "turkish".'
  name: language
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SnowballTokenFilterLanguage">]
- description: 'A URI fragment specifying the type of token filter. Required. Default

    value is "#Microsoft.Azure.Search.SnowballTokenFilter".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.SnowballTokenFilter"]
methods:
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.language
  name: language
  signature: 'language: Required[str | SnowballTokenFilterLanguage]'
- uid: azure.search.documents.indexes.types.SnowballTokenFilter.name
  name: name
  signature: 'name: Required[str]'
