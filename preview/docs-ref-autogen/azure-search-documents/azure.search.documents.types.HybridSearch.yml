### YamlMime:PythonClass
uid: azure.search.documents.types.HybridSearch
name: HybridSearch
fullName: azure.search.documents.types.HybridSearch
module: azure.search.documents.types
summary: The query parameters to configure hybrid search behaviors.
constructor:
  syntax: HybridSearch()
variables:
- description: 'Determines the maximum number of documents to be retrieved by the
    text

    query portion of a hybrid search request. Those documents will be combined with
    the documents

    matching the vector queries to produce a single final list of results. Choosing
    a larger

    maxTextRecallSize value will allow retrieving and paging through more documents
    (using the top

    and skip parameters), at the cost of higher resource utilization and higher latency.
    The value

    needs to be between 1 and 10,000. Default is 1000.'
  name: maxTextRecallSize
  types:
  - <xref:int>
- description: 'Determines whether the count and facets should includes all documents

    that matched the search query, or only the documents that are retrieved within
    the

    ''maxTextRecallSize'' window. Known values are: "countRetrievableResults" and
    "countAllResults".'
  name: countAndFacetMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HybridCountAndFacetMode">]
methods:
- uid: azure.search.documents.types.HybridSearch.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.types.HybridSearch.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.types.HybridSearch.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.types.HybridSearch.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.types.HybridSearch.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.types.HybridSearch.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.types.HybridSearch.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.types.HybridSearch.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.types.HybridSearch.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.types.HybridSearch.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.types.HybridSearch.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.types.HybridSearch.countAndFacetMode
  name: countAndFacetMode
  summary: 'Determines whether the count and facets should includes all documents
    that matched the search

    query, or only the documents that are retrieved within the ''maxTextRecallSize''
    window. Known

    values are: "countRetrievableResults" and "countAllResults".'
  signature: 'countAndFacetMode: str | HybridCountAndFacetMode'
- uid: azure.search.documents.types.HybridSearch.maxTextRecallSize
  name: maxTextRecallSize
  summary: 'Determines the maximum number of documents to be retrieved by the text
    query portion of a

    hybrid search request. Those documents will be combined with the documents matching
    the vector

    queries to produce a single final list of results. Choosing a larger maxTextRecallSize
    value

    will allow retrieving and paging through more documents (using the top and skip
    parameters), at

    the cost of higher resource utilization and higher latency. The value needs to
    be between 1 and

    10,000. Default is 1000.'
  signature: 'maxTextRecallSize: int'
