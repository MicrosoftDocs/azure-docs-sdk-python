### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.TextTranslationSkill
name: TextTranslationSkill
fullName: azure.search.documents.indexes.types.TextTranslationSkill
module: azure.search.documents.indexes.types
summary: A skill to translate text from one language to another.
constructor:
  syntax: TextTranslationSkill()
variables:
- description: 'The name of the skill which uniquely identifies it within the skillset.
    A skill

    with no name defined will be given a default name of its 1-based index in the
    skills array,

    prefixed with the character ''#''.'
  name: name
  types:
  - <xref:str>
- description: 'The description of the skill which describes the inputs, outputs,
    and usage

    of the skill.'
  name: description
  types:
  - <xref:str>
- description: 'Represents the level at which operations take place, such as the document
    root

    or document content (for example, /document or /document/content). The default
    is /document.'
  name: context
  types:
  - <xref:str>
- description: 'Inputs of the skills could be a column in the source data set, or
    the output of

    an upstream skill. Required.'
  name: inputs
  types:
  - <xref:list>[<xref:"InputFieldMappingEntry">]
- description: 'The output of a skill is either a field in a search index, or a value
    that can

    be consumed as an input by another skill. Required.'
  name: outputs
  types:
  - <xref:list>[<xref:"OutputFieldMappingEntry">]
- description: 'The language code to translate documents into for documents that

    don''t specify the to language explicitly. Required. Known values are: "af", "ar",
    "bn", "bs",

    "bg", "yue", "ca", "zh-Hans", "zh-Hant", "hr", "cs", "da", "nl", "en", "et", "fj",
    "fil", "fi",

    "fr", "de", "el", "ht", "he", "hi", "mww", "hu", "is", "id", "it", "ja", "sw",
    "tlh",

    "tlh-Latn", "tlh-Piqd", "ko", "lv", "lt", "mg", "ms", "mt", "nb", "fa", "pl",
    "pt", "pt-br",

    "pt-PT", "otq", "ro", "ru", "sm", "sr-Cyrl", "sr-Latn", "sk", "sl", "es", "sv",
    "ty", "ta",

    "te", "th", "to", "tr", "uk", "ur", "vi", "cy", "yua", "ga", "kn", "mi", "ml",
    and "pa".'
  name: defaultToLanguageCode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TextTranslationSkillLanguage">]
- description: 'The language code to translate documents from for documents that

    don''t specify the from language explicitly. Known values are: "af", "ar", "bn",
    "bs", "bg",

    "yue", "ca", "zh-Hans", "zh-Hant", "hr", "cs", "da", "nl", "en", "et", "fj", "fil",
    "fi", "fr",

    "de", "el", "ht", "he", "hi", "mww", "hu", "is", "id", "it", "ja", "sw", "tlh",
    "tlh-Latn",

    "tlh-Piqd", "ko", "lv", "lt", "mg", "ms", "mt", "nb", "fa", "pl", "pt", "pt-br",
    "pt-PT",

    "otq", "ro", "ru", "sm", "sr-Cyrl", "sr-Latn", "sk", "sl", "es", "sv", "ty", "ta",
    "te", "th",

    "to", "tr", "uk", "ur", "vi", "cy", "yua", "ga", "kn", "mi", "ml", and "pa".'
  name: defaultFromLanguageCode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TextTranslationSkillLanguage">]
- description: 'The language code to translate documents from when neither the

    fromLanguageCode input nor the defaultFromLanguageCode parameter are provided,
    and the

    automatic language detection is unsuccessful. Default is `en`. Known values are:
    "af", "ar",

    "bn", "bs", "bg", "yue", "ca", "zh-Hans", "zh-Hant", "hr", "cs", "da", "nl", "en",
    "et", "fj",

    "fil", "fi", "fr", "de", "el", "ht", "he", "hi", "mww", "hu", "is", "id", "it",
    "ja", "sw",

    "tlh", "tlh-Latn", "tlh-Piqd", "ko", "lv", "lt", "mg", "ms", "mt", "nb", "fa",
    "pl", "pt",

    "pt-br", "pt-PT", "otq", "ro", "ru", "sm", "sr-Cyrl", "sr-Latn", "sk", "sl", "es",
    "sv", "ty",

    "ta", "te", "th", "to", "tr", "uk", "ur", "vi", "cy", "yua", "ga", "kn", "mi",
    "ml", and "pa".'
  name: suggestedFrom
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TextTranslationSkillLanguage">]
- description: 'A URI fragment specifying the type of skill. Required. Default value
    is

    "#Microsoft.Skills.Text.TranslationSkill".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Skills.Text.TranslationSkill"]
