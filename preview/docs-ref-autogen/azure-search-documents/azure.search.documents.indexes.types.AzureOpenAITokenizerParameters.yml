uid: azure.search.documents.indexes.types.AzureOpenAITokenizerParameters
name: AzureOpenAITokenizerParameters
fullName: azure.search.documents.indexes.types.AzureOpenAITokenizerParameters
module: azure.search.documents.indexes.types
summary: Azure OpenAI Tokenizer parameters.
constructor:
  syntax: AzureOpenAITokenizerParameters()
variables:
- description: 'Only applies if the unit is set to azureOpenAITokens. Options include

    ''R50k_base'', ''P50k_base'', ''P50k_edit'' and ''CL100k_base''. The default value
    is ''CL100k_base''.

    Known values are: "r50k_base", "p50k_base", "p50k_edit", and "cl100k_base".'
  name: encoderModelName
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SplitSkillEncoderModelName">]
- description: '(Optional) Only applies if the unit is set to azureOpenAITokens.

    This parameter defines a collection of special tokens that are permitted within
    the

    tokenization process.'
  name: allowedSpecialTokens
  types:
  - <xref:list>[<xref:str>]
