### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.SplitSkill
name: SplitSkill
fullName: azure.search.documents.indexes.types.SplitSkill
module: azure.search.documents.indexes.types
summary: A skill to split a string into chunks of text.
constructor:
  syntax: SplitSkill()
variables:
- description: 'The name of the skill which uniquely identifies it within the skillset.
    A skill

    with no name defined will be given a default name of its 1-based index in the
    skills array,

    prefixed with the character ''#''.'
  name: name
  types:
  - <xref:str>
- description: 'The description of the skill which describes the inputs, outputs,
    and usage

    of the skill.'
  name: description
  types:
  - <xref:str>
- description: 'Represents the level at which operations take place, such as the document
    root

    or document content (for example, /document or /document/content). The default
    is /document.'
  name: context
  types:
  - <xref:str>
- description: 'Inputs of the skills could be a column in the source data set, or
    the output of

    an upstream skill. Required.'
  name: inputs
  types:
  - <xref:list>[<xref:"InputFieldMappingEntry">]
- description: 'The output of a skill is either a field in a search index, or a value
    that can

    be consumed as an input by another skill. Required.'
  name: outputs
  types:
  - <xref:list>[<xref:"OutputFieldMappingEntry">]
- description: 'A value indicating which language code to use. Default is `en`.

    Known values are: "am", "bs", "cs", "da", "de", "en", "es", "et", "fi", "fr",
    "he", "hi", "hr",

    "hu", "id", "is", "it", "ja", "ko", "lv", "nb", "nl", "pl", "pt", "pt-br", "ru",
    "sk", "sl",

    "sr", "sv", "tr", "ur", and "zh".'
  name: defaultLanguageCode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SplitSkillLanguage">]
- description: 'A value indicating which split mode to perform. Known values are:
    "pages"

    and "sentences".'
  name: textSplitMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TextSplitMode">]
- description: The desired maximum page length. Default is 10000.
  name: maximumPageLength
  types:
  - <xref:int>
- description: 'Only applicable when textSplitMode is set to ''pages''. If specified,

    n+1th chunk will start with this number of characters/tokens from the end of the
    nth chunk.'
  name: pageOverlapLength
  types:
  - <xref:int>
- description: 'Only applicable when textSplitMode is set to ''pages''. If specified,

    the SplitSkill will discontinue splitting after processing the first ''maximumPagesToTake''

    pages, in order to improve performance when only a few initial pages are needed
    from each

    document.'
  name: maximumPagesToTake
  types:
  - <xref:int>
- description: 'Only applies if textSplitMode is set to pages. There are two possible
    values. The

    choice of the values will decide the length (maximumPageLength and pageOverlapLength)

    measurement. The default is ''characters'', which means the length will be measured
    by character.

    Known values are: "characters" and "azureOpenAITokens".'
  name: unit
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SplitSkillUnit">]
- description: 'Only applies if the unit is set to azureOpenAITokens. If

    specified, the splitSkill will use these parameters when performing the tokenization.
    The

    parameters are a valid ''encoderModelName'' and an optional ''allowedSpecialTokens''
    property.'
  name: azureOpenAITokenizerParameters
  types:
  - <xref:<xref:"AzureOpenAITokenizerParameters">>
- description: 'A URI fragment specifying the type of skill. Required. Default value
    is

    "#Microsoft.Skills.Text.SplitSkill".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Skills.Text.SplitSkill"]
