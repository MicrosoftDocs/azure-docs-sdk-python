uid: azure.search.documents.indexes.types.AzureOpenAIVectorizerParameters
name: AzureOpenAIVectorizerParameters
fullName: azure.search.documents.indexes.types.AzureOpenAIVectorizerParameters
module: azure.search.documents.indexes.types
summary: Specifies the parameters for connecting to the Azure OpenAI resource.
constructor:
  syntax: AzureOpenAIVectorizerParameters()
variables:
- description: The resource URI of the Azure OpenAI resource.
  name: resourceUri
  types:
  - <xref:str>
- description: ID of the Azure OpenAI model deployment on the designated resource.
  name: deploymentId
  types:
  - <xref:str>
- description: API key of the designated Azure OpenAI resource.
  name: apiKey
  types:
  - <xref:str>
- description: The user-assigned managed identity used for outbound connections.
  name: authIdentity
  types:
  - <xref:<xref:"SearchIndexerDataIdentity">>
- description: 'The name of the embedding model that is deployed at the provided deploymentId

    path. Known values are: "text-embedding-ada-002", "text-embedding-3-large",

    "text-embedding-3-small", "gpt-4o", "gpt-4o-mini", "gpt-4.1", "gpt-4.1-mini",
    "gpt-4.1-nano",

    "gpt-5", "gpt-5-mini", "gpt-5-nano", "gpt-5.1", "gpt-5.2", "gpt-5.4", "gpt-5.4-mini",

    "gpt-5.4-nano", "gpt-5.5", "gpt-5.6-sol", "gpt-5.6-terra", and "gpt-5.6-luna".'
  name: modelName
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureOpenAIModelName">]
