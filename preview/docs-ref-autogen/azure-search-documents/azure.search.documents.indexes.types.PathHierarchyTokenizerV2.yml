### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2
name: PathHierarchyTokenizerV2
fullName: azure.search.documents.indexes.types.PathHierarchyTokenizerV2
module: azure.search.documents.indexes.types
summary: Tokenizer for path-like hierarchies. This tokenizer is implemented using
  Apache Lucene.
constructor:
  syntax: PathHierarchyTokenizerV2()
variables:
- description: 'The name of the tokenizer. It must only contain letters, digits, spaces,
    dashes or

    underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: The delimiter character to use. Default is "/".
  name: delimiter
  types:
  - <xref:str>
- description: A value that, if set, replaces the delimiter character. Default is
    "/".
  name: replacement
  types:
  - <xref:str>
- description: The maximum token length. Default and maximum is 300.
  name: maxTokenLength
  types:
  - <xref:int>
- description: 'A value indicating whether to generate tokens in reverse order. Default
    is

    false.'
  name: reverse
  types:
  - <xref:bool>
- description: The number of initial tokens to skip. Default is 0.
  name: skip
  types:
  - <xref:int>
- description: 'A URI fragment specifying the type of tokenizer. Required. Default
    value

    is "#Microsoft.Azure.Search.PathHierarchyTokenizerV2".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.PathHierarchyTokenizerV2"]
methods:
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
