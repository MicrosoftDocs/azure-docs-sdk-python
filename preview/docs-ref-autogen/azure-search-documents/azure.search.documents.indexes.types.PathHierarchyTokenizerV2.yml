  name: delimiter
  signature: 'delimiter: str'
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.maxTokenLength
  name: maxTokenLength
  signature: 'maxTokenLength: int'
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.name
  name: name
  signature: 'name: str'
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.replacement
  name: replacement
  signature: 'replacement: str'
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.reverse
  name: reverse
  signature: 'reverse: bool'
- uid: azure.search.documents.indexes.types.PathHierarchyTokenizerV2.skip
  name: skip
  signature: 'skip: int'
