### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey
name: SearchResourceEncryptionKey
fullName: azure.search.documents.indexes.types.SearchResourceEncryptionKey
module: azure.search.documents.indexes.types
summary: 'A customer-managed encryption key in Azure Key Vault. Keys that you create
  and manage can be

  used to encrypt or decrypt data-at-rest, such as indexes and synonym maps.'
constructor:
  syntax: SearchResourceEncryptionKey()
variables:
- description: 'The name of your Azure Key Vault key to be used to encrypt your data
    at

    rest. Required.'
  name: keyVaultKeyName
  types:
  - <xref:str>
- description: 'The version of your Azure Key Vault key to be used to encrypt your

    data at rest.'
  name: keyVaultKeyVersion
  types:
  - <xref:str>
- description: 'The URI of your Azure Key Vault, also referred to as DNS name, that
    contains

    the key to be used to encrypt your data at rest. An example URI might be

    `https://my-keyvault-name.vault.azure.net`. Required.'
  name: keyVaultUri
  types:
  - <xref:str>
- description: 'Optional Azure Active Directory credentials used for accessing your

    Azure Key Vault. Not required if using managed identity instead.'
  name: accessCredentials
  types:
  - <xref:<xref:"AzureActiveDirectoryApplicationCredentials">>
- description: 'An explicit managed identity to use for this encryption key. If not
    specified

    and the access credentials property is null, the system-assigned managed identity
    is used. On

    update to the resource, if the explicit identity is unspecified, it remains unchanged.
    If

    "none" is specified, the value of this property is cleared.'
  name: identity
  types:
  - <xref:<xref:"SearchIndexerDataIdentity">>
- description: 'An optional value indicating whether this key is a service-level key.

    Default is false.'
  name: isServiceLevelKey
  types:
  - <xref:bool>
methods:
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.accessCredentials
  name: accessCredentials
  summary: 'Optional Azure Active Directory credentials used for accessing your Azure
    Key Vault. Not

    required if using managed identity instead.'
  signature: 'accessCredentials: AzureActiveDirectoryApplicationCredentials'
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.identity
  name: identity
  summary: 'An explicit managed identity to use for this encryption key. If not specified
    and the access

    credentials property is null, the system-assigned managed identity is used. On
    update to the

    resource, if the explicit identity is unspecified, it remains unchanged. If "none"
    is

    specified, the value of this property is cleared.'
  signature: 'identity: SearchIndexerDataNoneIdentity | SearchIndexerDataUserAssignedIdentity
    | None'
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.isServiceLevelKey
  name: isServiceLevelKey
  summary: An optional value indicating whether this key is a service-level key. Default
    is false.
  signature: 'isServiceLevelKey: bool'
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.keyVaultKeyName
  name: keyVaultKeyName
  summary: The name of your Azure Key Vault key to be used to encrypt your data at
    rest. Required.
  signature: 'keyVaultKeyName: str'
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.keyVaultKeyVersion
  name: keyVaultKeyVersion
  summary: The version of your Azure Key Vault key to be used to encrypt your data
    at rest.
  signature: 'keyVaultKeyVersion: str'
- uid: azure.search.documents.indexes.types.SearchResourceEncryptionKey.keyVaultUri
  name: keyVaultUri
  summary: 'The URI of your Azure Key Vault, also referred to as DNS name, that contains
    the key to be used

    to encrypt your data at rest. An example URI might be

    `https://my-keyvault-name.vault.azure.net`. Required.'
  signature: 'keyVaultUri: str'
