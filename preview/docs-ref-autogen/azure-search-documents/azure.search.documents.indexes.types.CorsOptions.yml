### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.CorsOptions
name: CorsOptions
fullName: azure.search.documents.indexes.types.CorsOptions
module: azure.search.documents.indexes.types
summary: Defines options to control Cross-Origin Resource Sharing (CORS) for an index.
constructor:
  syntax: CorsOptions()
variables:
- description: 'The list of origins from which JavaScript code will be granted access
    to

    your index. Can contain a list of hosts of the form

    {protocol}://{fully-qualified-domain-name}[:{port#}], or a single ''*'' to allow
    all origins (not

    recommended). Required.'
  name: allowedOrigins
  types:
  - <xref:list>[<xref:str>]
- description: 'The duration for which browsers should cache CORS preflight responses.

    Defaults to 5 minutes.'
  name: maxAgeInSeconds
  types:
  - <xref:int>
