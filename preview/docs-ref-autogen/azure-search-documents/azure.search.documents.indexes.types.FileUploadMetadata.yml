### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.FileUploadMetadata
name: FileUploadMetadata
fullName: azure.search.documents.indexes.types.FileUploadMetadata
module: azure.search.documents.indexes.types
summary: 'The JSON ''metadata'' part of a multipart/form-data file upload: the full
  file name/path and

  custom key/value metadata. The parsing mode and extraction mode are both chosen
  by the service

  and are not supplied by the caller.'
constructor:
  syntax: FileUploadMetadata()
variables:
- description: 'The full relative file name/path to store the file under (prefixes
    are derived

    from it).'
  name: fileName
  types:
  - <xref:str>
- description: Custom key/value metadata to store with the file.
  name: metadata
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
methods:
- uid: azure.search.documents.indexes.types.FileUploadMetadata.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.FileUploadMetadata.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.FileUploadMetadata.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.FileUploadMetadata.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.FileUploadMetadata.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.FileUploadMetadata.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.FileUploadMetadata.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.FileUploadMetadata.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.FileUploadMetadata.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.FileUploadMetadata.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.FileUploadMetadata.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.FileUploadMetadata.fileName
  name: fileName
  summary: The full relative file name/path to store the file under (prefixes are
    derived from it).
  signature: 'fileName: str'
- uid: azure.search.documents.indexes.types.FileUploadMetadata.metadata
  name: metadata
  summary: Custom key/value metadata to store with the file.
  signature: 'metadata: dict[str, str]'
