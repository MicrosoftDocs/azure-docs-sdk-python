### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.KeepTokenFilter
name: KeepTokenFilter
fullName: azure.search.documents.indexes.types.KeepTokenFilter
module: azure.search.documents.indexes.types
summary: 'A token filter that only keeps tokens with text contained in a specified
  list of words. This

  token filter is implemented using Apache Lucene.'
constructor:
  syntax: KeepTokenFilter()
variables:
- description: 'The name of the token filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: The list of words to keep. Required.
  name: keepWords
  types:
  - <xref:list>[<xref:str>]
- description: 'A value indicating whether to lower case all words first. Default
    is

    false.'
  name: keepWordsCase
  types:
  - <xref:bool>
- description: 'A URI fragment specifying the type of token filter. Required. Default

    value is "#Microsoft.Azure.Search.KeepTokenFilter".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.KeepTokenFilter"]
