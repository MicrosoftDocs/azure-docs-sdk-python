### YamlMime:PythonClass
uid: azure.search.documents.indexes.models.FieldMapping
name: FieldMapping
fullName: azure.search.documents.indexes.models.FieldMapping
module: azure.search.documents.indexes.models
summary: Defines a mapping between a field in a data source and a target field in
  an index.
constructor:
  syntax: 'FieldMapping(*args: Any, **kwargs: Any)'
variables:
- description: The name of the field in the data source. Required.
  name: source_field_name
  types:
  - <xref:str>
- description: 'The name of the target field in the index. Same as the source field

    name by default.'
  name: target_field_name
  types:
  - <xref:str>
- description: A function to apply to each source field value before indexing.
  name: mapping_function
  types:
  - <xref:azure.search.documents.indexes.models.FieldMappingFunction>
methods:
- uid: azure.search.documents.indexes.models.FieldMapping.as_dict
  name: as_dict
  summary: Return a dict that can be turned into json using json.dump.
  signature: 'as_dict(*, exclude_readonly: bool = False) -> dict[str, Any]'
  keywordOnlyParameters:
  - name: exclude_readonly
    description: Whether to remove the readonly properties.
    defaultValue: 'False'
    types:
    - <xref:bool>
  return:
    description: A dict JSON compatible object
    types:
    - <xref:dict>
- uid: azure.search.documents.indexes.models.FieldMapping.clear
  name: clear
  summary: Remove all items from the dictionary.
  signature: clear() -> None
- uid: azure.search.documents.indexes.models.FieldMapping.copy
  name: copy
  signature: copy() -> Model
- uid: azure.search.documents.indexes.models.FieldMapping.get
  name: get
  summary: 'Get the value for key if key is in the dictionary, else default.

    :param str key: The key to look up.

    :param any default: The value to return if key is not in the dictionary. Defaults
    to None

    :returns: The value for key if key is in the dictionary, else default.

    :rtype: any'
  signature: 'get(key: str, default: Any = None) -> Any'
  parameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.models.FieldMapping.items
  name: items
  signature: items() -> ItemsView[str, Any]
  return:
    description: a set-like object providing a view on the mapping's items
    types:
    - <xref:typing.ItemsView>
- uid: azure.search.documents.indexes.models.FieldMapping.keys
  name: keys
  signature: keys() -> KeysView[str]
  return:
    description: a set-like object providing a view on the mapping's keys
    types:
    - <xref:typing.KeysView>
- uid: azure.search.documents.indexes.models.FieldMapping.pop
  name: pop
  summary: 'Removes specified key and return the corresponding value.

    :param str key: The key to pop.

    :param any default: The value to return if key is not in the dictionary

    :returns: The value corresponding to the key.

    :rtype: any

    :raises KeyError: If key is not found and default is not given.'
  signature: 'pop(key: str, default: ~typing.Any = <object object>) -> Any'
  parameters:
  - name: key
    isRequired: true
  - name: default
- uid: azure.search.documents.indexes.models.FieldMapping.popitem
  name: popitem
  summary: 'Removes and returns some (key, value) pair

    :returns: The (key, value) pair.

    :rtype: tuple

    :raises KeyError: if the dictionary is empty.'
  signature: popitem() -> tuple[str, Any]
- uid: azure.search.documents.indexes.models.FieldMapping.setdefault
  name: setdefault
  summary: 'Return the value for key if key is in the dictionary; otherwise set the
    key to

    default and return default.

    :param str key: The key to look up.

    :param any default: The value to set if key is not in the dictionary

    :returns: The value for key if key is in the dictionary, else default.

    :rtype: any'
  signature: 'setdefault(key: str, default: ~typing.Any = <object object>) -> Any'
  parameters:
  - name: key
    isRequired: true
  - name: default
- uid: azure.search.documents.indexes.models.FieldMapping.update
  name: update
  summary: 'Update the dictionary from a mapping or an iterable of key-value pairs.

    :param any args: Either a mapping object or an iterable of key-value pairs.'
  signature: 'update(*args: Any, **kwargs: Any) -> None'
- uid: azure.search.documents.indexes.models.FieldMapping.values
  name: values
  signature: values() -> ValuesView[Any]
  return:
    description: an object providing a view on the mapping's values
    types:
    - <xref:typing.ValuesView>
attributes:
- uid: azure.search.documents.indexes.models.FieldMapping.mapping_function
  name: mapping_function
  summary: A function to apply to each source field value before indexing.
  signature: 'mapping_function: _models.FieldMappingFunction | None'
- uid: azure.search.documents.indexes.models.FieldMapping.source_field_name
  name: source_field_name
  summary: The name of the field in the data source. Required.
  signature: 'source_field_name: str'
- uid: azure.search.documents.indexes.models.FieldMapping.target_field_name
  name: target_field_name
  summary: The name of the target field in the index. Same as the source field name
    by default.
  signature: 'target_field_name: str | None'
