### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.ChatCompletionCommonModelParameters
name: ChatCompletionCommonModelParameters
fullName: azure.search.documents.indexes.types.ChatCompletionCommonModelParameters
module: azure.search.documents.indexes.types
summary: Common language model parameters for Chat Completions. If omitted, default
  values are used.
constructor:
  syntax: ChatCompletionCommonModelParameters()
variables:
- description: 'The name of the model to use (e.g., ''gpt-4o'', etc.). Default is
    null if not

    specified.'
  name: model
  types:
  - <xref:str>
- description: 'A float in the range [-2,2] that reduces or increases likelihood of

    repeated tokens. Default is 0.'
  name: frequencyPenalty
  types:
  - <xref:float>
- description: 'A float in the range [-2,2] that penalizes new tokens based on their

    existing presence. Default is 0.'
  name: presencePenalty
  types:
  - <xref:float>
- description: Maximum number of tokens to generate.
  name: maxTokens
  types:
  - <xref:int>
- description: Sampling temperature. Default is 0.7.
  name: temperature
  types:
  - <xref:float>
- description: 'Random seed for controlling deterministic outputs. If omitted, randomization
    is

    used.'
  name: seed
  types:
  - <xref:int>
- description: List of stop sequences that will cut off text generation. Default is
    none.
  name: stop
  types:
  - <xref:list>[<xref:str>]
