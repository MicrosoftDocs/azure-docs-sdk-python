### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters
name: McpServerOutputParsingSplitParameters
fullName: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters
module: azure.search.documents.indexes.types
summary: Parameters for split output parsing.
constructor:
  syntax: McpServerOutputParsingSplitParameters()
variables:
- description: 'The text split mode to use. Known values are: "pages" and "sentences".'
  name: textSplitMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TextSplitMode">]
- description: The maximum number of characters per page.
  name: maximumPageLength
  types:
  - <xref:int>
- description: The number of characters to overlap between pages.
  name: pageOverlapLength
  types:
  - <xref:int>
- description: The maximum number of pages to take from the output.
  name: maximumPagesToTake
  types:
  - <xref:int>
- description: 'A value indicating which language code to use. Default is `en`.

    Known values are: "am", "bs", "cs", "da", "de", "en", "es", "et", "fi", "fr",
    "he", "hi", "hr",

    "hu", "id", "is", "it", "ja", "ko", "lv", "nb", "nl", "pl", "pt", "pt-br", "ru",
    "sk", "sl",

    "sr", "sv", "tr", "ur", and "zh".'
  name: defaultLanguageCode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SplitSkillLanguage">]
methods:
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.defaultLanguageCode
  name: defaultLanguageCode
  summary: '"am",

    "bs", "cs", "da", "de", "en", "es", "et", "fi", "fr", "he", "hi", "hr",

    "hu", "id", "is", "it", "ja", "ko", "lv", "nb", "nl", "pl", "pt",

    "pt-br", "ru", "sk", "sl", "sr", "sv", "tr", "ur", and "zh".'
  signature: 'defaultLanguageCode: str | SplitSkillLanguage'
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.maximumPageLength
  name: maximumPageLength
  summary: The maximum number of characters per page.
  signature: 'maximumPageLength: int'
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.maximumPagesToTake
  name: maximumPagesToTake
  summary: The maximum number of pages to take from the output.
  signature: 'maximumPagesToTake: int'
- uid: azure.search.documents.indexes.types.McpServerOutputParsingSplitParameters.pageOverlapLength
  name: pageOverlapLength
  summary: The number of characters to overlap between pages.
