### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.LuceneStandardAnalyzer
name: LuceneStandardAnalyzer
fullName: azure.search.documents.indexes.types.LuceneStandardAnalyzer
module: azure.search.documents.indexes.types
summary: 'Standard Apache Lucene analyzer; Composed of the standard tokenizer, lowercase
  filter and stop

  filter.'
constructor:
  syntax: LuceneStandardAnalyzer()
variables:
- description: 'The name of the analyzer. It must only contain letters, digits, spaces,
    dashes or

    underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: 'The maximum token length. Default is 255. Tokens longer than the maximum

    length are split. The maximum token length that can be used is 300 characters.'
  name: maxTokenLength
  types:
  - <xref:int>
- description: A list of stopwords.
  name: stopwords
  types:
  - <xref:list>[<xref:str>]
- description: 'A URI fragment specifying the type of analyzer. Required. Default
    value

    is "#Microsoft.Azure.Search.StandardAnalyzer".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.StandardAnalyzer"]
