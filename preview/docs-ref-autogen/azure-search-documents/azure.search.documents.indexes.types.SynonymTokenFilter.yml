### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.SynonymTokenFilter
name: SynonymTokenFilter
fullName: azure.search.documents.indexes.types.SynonymTokenFilter
module: azure.search.documents.indexes.types
summary: 'Matches single or multi-word synonyms in a token stream. This token filter
  is implemented using

  Apache Lucene.'
constructor:
  syntax: SynonymTokenFilter()
variables:
- description: 'The name of the token filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: 'A list of synonyms in following one of two formats: 1. incredible,

    unbelievable, fabulous => amazing - all terms on the left side of => symbol will
    be replaced

    with all terms on its right side; 2. incredible, unbelievable, fabulous, amazing
    - comma

    separated list of equivalent words. Set the expand option to change how this list
    is

    interpreted. Required.'
  name: synonyms
  types:
  - <xref:list>[<xref:str>]
- description: A value indicating whether to case-fold input for matching. Default
    is false.
  name: ignoreCase
  types:
  - <xref:bool>
- description: 'A value indicating whether all words in the list of synonyms (if =>
    notation is

    not used) will map to one another. If true, all words in the list of synonyms
    (if => notation

    is not used) will map to one another. The following list: incredible, unbelievable,
    fabulous,

    amazing is equivalent to: incredible, unbelievable, fabulous, amazing => incredible,

    unbelievable, fabulous, amazing. If false, the following list: incredible, unbelievable,

    fabulous, amazing will be equivalent to: incredible, unbelievable, fabulous, amazing
    =>

    incredible. Default is true.'
  name: expand
  types:
  - <xref:bool>
- description: 'A URI fragment specifying the type of token filter. Required. Default

    value is "#Microsoft.Azure.Search.SynonymTokenFilter".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.SynonymTokenFilter"]
methods:
- uid: azure.search.documents.indexes.types.SynonymTokenFilter.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.SynonymTokenFilter.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.SynonymTokenFilter.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.SynonymTokenFilter.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.SynonymTokenFilter.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.SynonymTokenFilter.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.SynonymTokenFilter.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.SynonymTokenFilter.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.SynonymTokenFilter.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.SynonymTokenFilter.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.SynonymTokenFilter.values
  name: values
  signature: values() -> an object providing a view on D's values
