### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.SearchIndexerDataSourceConnection
name: SearchIndexerDataSourceConnection
fullName: azure.search.documents.indexes.types.SearchIndexerDataSourceConnection
module: azure.search.documents.indexes.types
summary: Represents a datasource definition, which can be used to configure an indexer.
constructor:
  syntax: SearchIndexerDataSourceConnection()
variables:
- description: The name of the datasource. Required.
  name: name
  types:
  - <xref:str>
- description: The description of the datasource.
  name: description
  types:
  - <xref:str>
- description: 'The type of the datasource. Required. Known values are: "azuresql",
    "cosmosdb",

    "azureblob", "azuretable", "mysql", "adlsgen2", "onelake", and "sharepoint".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SearchIndexerDataSourceType">]
- description: 'A specific type of the data source, in case the resource is capable
    of different

    modalities. For example, ''MongoDb'' for certain ''cosmosDb'' accounts.'
  name: subType
  types:
  - <xref:str>
- description: Credentials for the datasource. Required.
  name: credentials
  types:
  - <xref:<xref:"DataSourceCredentials">>
- description: The data container for the datasource. Required.
  name: container
  types:
  - <xref:<xref:"SearchIndexerDataContainer">>
- description: 'An explicit managed identity to use for this datasource. If not specified
    and

    the connection string is a managed identity, the system-assigned managed identity
    is used. If

    not specified, the value remains unchanged. If "none" is specified, the value
    of this property

    is cleared.'
  name: identity
  types:
  - <xref:<xref:"SearchIndexerDataIdentity">>
- description: Ingestion options with various types of permission data.
  name: indexerPermissionOptions
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"IndexerPermissionOption">]]
- description: The data change detection policy for the datasource.
  name: dataChangeDetectionPolicy
  types:
  - <xref:<xref:"DataChangeDetectionPolicy">>
- description: The data deletion detection policy for the datasource.
  name: dataDeletionDetectionPolicy
  types:
  - <xref:<xref:"DataDeletionDetectionPolicy">>
- description: The ETag of the data source.
  name: '@odata.etag'
  types:
  - <xref:str>
- description: 'A description of an encryption key that you create in Azure Key Vault.

    This key is used to provide an additional level of encryption-at-rest for your
    datasource

    definition when you want full assurance that no one, not even Microsoft, can decrypt
    your data

    source definition. Once you have encrypted your data source definition, it will
    always remain

    encrypted. The search service will ignore attempts to set this property to null.
    You can change

    this property as needed if you want to rotate your encryption key; Your datasource
    definition

    will be unaffected. Encryption with customer-managed keys is not available for
    free search

    services, and is only available for paid services created on or after January
    1, 2019.'
  name: encryptionKey
  types:
  - <xref:<xref:"SearchResourceEncryptionKey">>
