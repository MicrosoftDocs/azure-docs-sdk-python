### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.CustomEntityLookupSkill
name: CustomEntityLookupSkill
fullName: azure.search.documents.indexes.types.CustomEntityLookupSkill
module: azure.search.documents.indexes.types
summary: A skill looks for text from a custom, user-defined list of words and phrases.
constructor:
  syntax: CustomEntityLookupSkill()
variables:
- description: 'The name of the skill which uniquely identifies it within the skillset.
    A skill

    with no name defined will be given a default name of its 1-based index in the
    skills array,

    prefixed with the character ''#''.'
  name: name
  types:
  - <xref:str>
- description: 'The description of the skill which describes the inputs, outputs,
    and usage

    of the skill.'
  name: description
  types:
  - <xref:str>
- description: 'Represents the level at which operations take place, such as the document
    root

    or document content (for example, /document or /document/content). The default
    is /document.'
  name: context
  types:
  - <xref:str>
- description: 'Inputs of the skills could be a column in the source data set, or
    the output of

    an upstream skill. Required.'
  name: inputs
  types:
  - <xref:list>[<xref:"InputFieldMappingEntry">]
- description: 'The output of a skill is either a field in a search index, or a value
    that can

    be consumed as an input by another skill. Required.'
  name: outputs
  types:
  - <xref:list>[<xref:"OutputFieldMappingEntry">]
- description: 'A value indicating which language code to use. Default is `en`.

    Known values are: "da", "de", "en", "es", "fi", "fr", "it", "ko", and "pt".'
  name: defaultLanguageCode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CustomEntityLookupSkillLanguage">]
- description: 'Path to a JSON or CSV file containing all the target text to match

    against. This entity definition is read at the beginning of an indexer run. Any
    updates to this

    file during an indexer run will not take effect until subsequent runs. This config
    must be

    accessible over HTTPS.'
  name: entitiesDefinitionUri
  types:
  - <xref:str>
- description: The inline CustomEntity definition.
  name: inlineEntitiesDefinition
  types:
  - <xref:list>[<xref:"CustomEntity">]
- description: 'A global flag for CaseSensitive. If CaseSensitive is not set

    in CustomEntity, this value will be the default value.'
  name: globalDefaultCaseSensitive
  types:
  - <xref:bool>
- description: 'A global flag for AccentSensitive. If AccentSensitive is

    not set in CustomEntity, this value will be the default value.'
  name: globalDefaultAccentSensitive
  types:
  - <xref:bool>
- description: 'A global flag for FuzzyEditDistance. If FuzzyEditDistance

    is not set in CustomEntity, this value will be the default value.'
  name: globalDefaultFuzzyEditDistance
  types:
  - <xref:int>
- description: 'A URI fragment specifying the type of skill. Required. Default value
    is

    "#Microsoft.Skills.Text.CustomEntityLookupSkill".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Skills.Text.CustomEntityLookupSkill"]
