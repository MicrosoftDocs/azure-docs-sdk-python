### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.SearchIndex
name: SearchIndex
fullName: azure.search.documents.indexes.types.SearchIndex
module: azure.search.documents.indexes.types
summary: 'Represents a search index definition, which describes the fields and search
  behavior of an

  index.'
constructor:
  syntax: SearchIndex()
variables:
- description: The name of the index. Required.
  name: name
  types:
  - <xref:str>
- description: The description of the index.
  name: description
  types:
  - <xref:str>
- description: The fields of the index. Required.
  name: fields
  types:
  - <xref:list>[<xref:"SearchField">]
- description: The scoring profiles for the index.
  name: scoringProfiles
  types:
  - <xref:list>[<xref:"ScoringProfile">]
- description: 'The name of the scoring profile to use if none is specified in the

    query. If this property is not set and no scoring profile is specified in the
    query, then

    default scoring (tf-idf) will be used.'
  name: defaultScoringProfile
  types:
  - <xref:str>
- description: Options to control Cross-Origin Resource Sharing (CORS) for the index.
  name: corsOptions
  types:
  - <xref:<xref:"CorsOptions">>
- description: The suggesters for the index.
  name: suggesters
  types:
  - <xref:list>[<xref:"SearchSuggester">]
- description: The analyzers for the index.
  name: analyzers
  types:
  - <xref:list>[<xref:"LexicalAnalyzer">]
- description: The tokenizers for the index.
  name: tokenizers
  types:
  - <xref:list>[<xref:"LexicalTokenizer">]
- description: The token filters for the index.
  name: tokenFilters
  types:
  - <xref:list>[<xref:"TokenFilter">]
- description: The character filters for the index.
  name: charFilters
  types:
  - <xref:list>[<xref:"CharFilter">]
- description: The normalizers for the index.
  name: normalizers
  types:
  - <xref:list>[<xref:"LexicalNormalizer">]
- description: 'A description of an encryption key that you create in Azure Key Vault.

    This key is used to provide an additional level of encryption-at-rest for your
    data when you

    want full assurance that no one, not even Microsoft, can decrypt your data. Once
    you have

    encrypted your data, it will always remain encrypted. The search service will
    ignore attempts

    to set this property to null. You can change this property as needed if you want
    to rotate your

    encryption key; Your data will be unaffected. Encryption with customer-managed
    keys is not

    available for free search services, and is only available for paid services created
    on or after

    January 1, 2019.'
  name: encryptionKey
  types:
  - <xref:<xref:"SearchResourceEncryptionKey">>
- description: 'The type of similarity algorithm to be used when scoring and ranking
    the

    documents matching a search query. The similarity algorithm can only be defined
    at index

    creation time and cannot be modified on existing indexes. If null, the ClassicSimilarity

    algorithm is used.'
  name: similarity
  types:
  - <xref:<xref:"SimilarityAlgorithm">>
- description: Defines parameters for a search index that influence semantic capabilities.
  name: semantic
  types:
  - <xref:<xref:"SemanticSearch">>
- description: Contains configuration options related to vector search.
  name: vectorSearch
  types:
  - <xref:<xref:"VectorSearch">>
- description: 'A value indicating whether permission filtering is enabled for

    the index. Known values are: "enabled" and "disabled".'
  name: permissionFilterOption
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SearchIndexPermissionFilterOption">]
- description: A value indicating whether Purview is enabled for the index.
  name: purviewEnabled
  types:
  - <xref:bool>
- description: 'Configures a SharePoint connector app registration

    for the index, enabling document-level permissions from SharePoint. If provided,
    the

    applicationId and federatedCredentialId properties are required.'
  name: sharePointConnectorAppRegistration
  types:
  - <xref:<xref:"SharePointConnectorAppRegistration">>
- description: The ETag of the index.
  name: '@odata.etag'
  types:
  - <xref:str>
