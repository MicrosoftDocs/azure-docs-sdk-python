name: KnowledgeBaseActivityStartedEvent
fullName: azure.search.documents.knowledgebases.models.KnowledgeBaseActivityStartedEvent
module: azure.search.documents.knowledgebases.models
summary: Emitted immediately before an individual retrieval activity begins executing.
constructor:
  syntax: 'KnowledgeBaseActivityStartedEvent(*args: Any, **kwargs: Any)'
variables:
- description: 'The ID of the activity record, matching the `id` on the corresponding

    `activity.completed` event. Required.'
  name: id
  types:
  - <xref:int>
- description: 'The type of the activity that has started. Required. Known values
    are:

    "searchIndex", "azureBlob", "indexedSharePoint", "indexedOneLake", "web", "remoteSharePoint",

    "workIQ", "fabricDataAgent", "fabricOntology", "mcpServer", "file", "indexedSql",

    "modelQueryPlanning", "modelAnswerSynthesis", "modelWebSummarization", and "agenticReasoning".'
  name: type
  types:
  - <xref:str>
  - <xref:azure.search.documents.knowledgebases.models.KnowledgeBaseActivityRecordType>
- description: The time at which the activity started. Required.
  name: started_at
  types:
  - <xref:datetime.datetime>
- description: 'The knowledge source used by the activity, when the activity

    targets a knowledge source.'
  name: knowledge_source_name
  types:
  - <xref:str>
