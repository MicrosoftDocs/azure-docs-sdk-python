### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.WorkIQKnowledgeSourceParameters
name: WorkIQKnowledgeSourceParameters
fullName: azure.search.documents.indexes.types.WorkIQKnowledgeSourceParameters
module: azure.search.documents.indexes.types
summary: Parameters for a WorkIQ knowledge source.
constructor:
  syntax: WorkIQKnowledgeSourceParameters()
variables:
- description: 'The customer-owned Microsoft Entra app registration configuration

    used for on-behalf-of authentication to the Work IQ API. The customer registers
    a tenant-owned

    Entra app, grants it the WorkIQAgent.Ask delegated permission, and configures
    a federated

    credential so Azure AI Search can authenticate as that app without a stored client
    secret.

    Required.'
  name: entraAppAuthentication
  types:
  - <xref:<xref:"EntraAppAuthentication">>
