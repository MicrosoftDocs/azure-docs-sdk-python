    mechanism but do not want the field to be visible to the end user. This property
    must be true

    for key fields, and it must be null for complex fields. This property can be changed
    on

    existing fields. Enabling this property does not cause any increase in index storage

    requirements. Default is true for simple fields, false for vector fields, and
    null for complex

    fields.'
  signature: 'retrievable: bool'
- uid: azure.search.documents.indexes.types.SearchField.searchAnalyzer
  name: searchAnalyzer
  summary: 'The name of the analyzer used at search time for the field. This option
    can be used only with

    searchable fields. It must be set together with indexAnalyzer and it cannot be
    set together

    with the analyzer option. This property cannot be set to the name of a language
    analyzer; use

    the analyzer property instead if you need a language analyzer. This analyzer can
    be updated on

    an existing field. Must be null for complex fields. Known values are: "ar.microsoft",

    "ar.lucene", "hy.lucene", "bn.microsoft", "eu.lucene", "bg.microsoft", "bg.lucene",

    "ca.microsoft", "ca.lucene", "zh-Hans.microsoft", "zh-Hans.lucene",

    "zh-Hant.microsoft", "zh-Hant.lucene", "hr.microsoft", "cs.microsoft", "cs.lucene",

    "da.microsoft", "da.lucene", "nl.microsoft", "nl.lucene", "en.microsoft",

    "en.lucene", "et.microsoft", "fi.microsoft", "fi.lucene", "fr.microsoft",

    "fr.lucene", "gl.lucene", "de.microsoft", "de.lucene", "el.microsoft", "el.lucene",

    "gu.microsoft", "he.microsoft", "hi.microsoft", "hi.lucene", "hu.microsoft",

    "hu.lucene", "is.microsoft", "id.microsoft", "id.lucene", "ga.lucene",

    "it.microsoft", "it.lucene", "ja.microsoft", "ja.lucene", "kn.microsoft",

    "ko.microsoft", "ko.lucene", "lv.microsoft", "lv.lucene", "lt.microsoft",

    "ml.microsoft", "ms.microsoft", "mr.microsoft", "nb.microsoft", "no.lucene",

    "fa.lucene", "pl.microsoft", "pl.lucene", "pt-BR.microsoft", "pt-BR.lucene",

    "pt-PT.microsoft", "pt-PT.lucene", "pa.microsoft", "ro.microsoft", "ro.lucene",

    "ru.microsoft", "ru.lucene", "sr-cyrillic.microsoft", "sr-latin.microsoft",

    "sk.microsoft", "sl.microsoft", "es.microsoft", "es.lucene", "sv.microsoft",

    "sv.lucene", "ta.microsoft", "te.microsoft", "th.microsoft", "th.lucene",

    "tr.microsoft", "tr.lucene", "uk.microsoft", "ur.microsoft", "vi.microsoft",

    "standard.lucene", "standardasciifolding.lucene", "keyword", "pattern", "simple",

    "stop", and "whitespace".'
  signature: 'searchAnalyzer: str | LexicalAnalyzerName | None'
- uid: azure.search.documents.indexes.types.SearchField.searchable
  name: searchable
  summary: 'A value indicating whether the field is full-text searchable. This means
    it will undergo

    analysis such as word-breaking during indexing. If you set a searchable field
    to a value like

    "sunny day", internally it will be split into the individual tokens "sunny" and
    "day".

    This enables full-text searches for these terms. Fields of type Edm.String or

    Collection(Edm.String) are searchable by default. This property must be false
    for simple fields

    of other non-string data types, and it must be null for complex fields. Note:
    searchable fields

    consume extra space in your index to accommodate additional tokenized versions
    of the field

    value for full-text searches. If you want to save space in your index and you
    don''t need a

    field to be included in searches, set searchable to false.'
  signature: 'searchable: bool'
- uid: azure.search.documents.indexes.types.SearchField.sensitivityLabelId
  name: sensitivityLabelId
  summary: 'A value indicating whether the field should be used for sensitivity label
    ID filtering. This

    enables document-level filtering based on Microsoft Purview sensitivity label
    IDs.'
  signature: 'sensitivityLabelId: bool'
- uid: azure.search.documents.indexes.types.SearchField.sensitivityLabelName
  name: sensitivityLabelName
  summary: 'A value indicating whether the field contains the name of a Microsoft
    Purview sensitivity label

    applied to the document.'
  signature: 'sensitivityLabelName: bool'
- uid: azure.search.documents.indexes.types.SearchField.sharepointSiteUrl
  name: sharepointSiteUrl
  summary: 'A value indicating whether the field contains a SharePoint site URL used
    for SharePoint

    group-based filtering.'
  signature: 'sharepointSiteUrl: bool'
- uid: azure.search.documents.indexes.types.SearchField.sortable
  name: sortable
  summary: 'A value indicating whether to enable the field to be referenced in $orderby
    expressions. By

    default, the search engine sorts results by score, but in many experiences users
    will want to

    sort by fields in the documents. A simple field can be sortable only if it is
    single-valued (it

    has a single value in the scope of the parent document). Simple collection fields
    cannot be

    sortable, since they are multi-valued. Simple sub-fields of complex collections
    are also

    multi-valued, and therefore cannot be sortable. This is true whether it''s an
    immediate parent

    field, or an ancestor field, that''s the complex collection. Complex fields cannot
    be sortable

    and the sortable property must be null for such fields. The default for sortable
    is true for

    single-valued simple fields, false for multi-valued simple fields, and null for
    complex fields.'
  signature: 'sortable: bool'
- uid: azure.search.documents.indexes.types.SearchField.sourceDocumentId
  name: sourceDocumentId
  summary: 'A value indicating whether the field contains the source document identifier
    used for Purview

    audit tracking.'
  signature: 'sourceDocumentId: bool'
- uid: azure.search.documents.indexes.types.SearchField.stored
  name: stored
  summary: 'An immutable value indicating whether the field will be persisted separately
    on disk to be

    returned in a search result. You can disable this option if you don''t plan to
    return the field

    contents in a search response to save on storage overhead. This can only be set
    during index

    creation and only for vector fields. This property cannot be changed for existing
    fields or set

    as false for new fields. If this property is set as false, the property ''retrievable''
    must also

    be set to false. This property must be true or unset for key fields, for new fields,
    and for

    non-vector fields, and it must be null for complex fields. Disabling this property
    will reduce

    index storage requirements. The default is true for vector fields.'
  signature: 'stored: bool'
- uid: azure.search.documents.indexes.types.SearchField.synonymMaps
  name: synonymMaps
  summary: 'A list of the names of synonym maps to associate with this field. This
    option can be used only

    with searchable fields. Currently only one synonym map per field is supported.
    Assigning a

    synonym map to a field ensures that query terms targeting that field are expanded
    at query-time

    using the rules in the synonym map. This attribute can be changed on existing
    fields. Must be

    null or an empty collection for complex fields.'
  signature: 'synonymMaps: list[str]'
- uid: azure.search.documents.indexes.types.SearchField.type
  name: type
  summary: '"Edm.String", "Edm.Int32",

    "Edm.Int64", "Edm.Double", "Edm.Boolean", "Edm.DateTimeOffset", "Edm.GeographyPoint",

    "Edm.ComplexType", "Edm.Single", "Edm.Half", "Edm.Int16", "Edm.SByte", and

    "Edm.Byte".'
  signature: 'type: Required[str | SearchFieldDataType]'
- uid: azure.search.documents.indexes.types.SearchField.vectorEncoding
  name: vectorEncoding
  summary: The encoding format to interpret the field contents. "packedBit"
  signature: 'vectorEncoding: str | VectorEncodingFormat | None'
- uid: azure.search.documents.indexes.types.SearchField.vectorSearchProfile
  name: vectorSearchProfile
  summary: 'The name of the vector search profile that specifies the algorithm and
    vectorizer to use when

    searching the vector field.'
  signature: 'vectorSearchProfile: str | None'
