### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.StopwordsTokenFilter
name: StopwordsTokenFilter
fullName: azure.search.documents.indexes.types.StopwordsTokenFilter
module: azure.search.documents.indexes.types
summary: 'Removes stop words from a token stream. This token filter is implemented
  using Apache Lucene.

  See

  [http://lucene.apache.org/core/4_10_3/analyzers-common/org/apache/lucene/analysis/core/StopFilter.html](http://lucene.apache.org/core/4_10_3/analyzers-common/org/apache/lucene/analysis/core/StopFilter.html).'
constructor:
  syntax: StopwordsTokenFilter()
variables:
- description: 'The name of the token filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: 'The list of stopwords. This property and the stopwords list property
    cannot

    both be set.'
  name: stopwords
  types:
  - <xref:list>[<xref:str>]
- description: 'A predefined list of stopwords to use. This property and the stopwords

    property cannot both be set. Default is English. Known values are: "arabic", "armenian",

    "basque", "brazilian", "bulgarian", "catalan", "czech", "danish", "dutch", "english",

    "finnish", "french", "galician", "german", "greek", "hindi", "hungarian", "indonesian",

    "irish", "italian", "latvian", "norwegian", "persian", "portuguese", "romanian",
    "russian",

    "sorani", "spanish", "swedish", "thai", and "turkish".'
  name: stopwordsList
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StopwordsList">]
- description: 'A value indicating whether to ignore case. If true, all words are
    converted

    to lower case first. Default is false.'
  name: ignoreCase
  types:
  - <xref:bool>
- description: 'A value indicating whether to ignore the last search term if it''s
    a stop

    word. Default is true.'
  name: removeTrailing
  types:
  - <xref:bool>
- description: 'A URI fragment specifying the type of token filter. Required. Default

    value is "#Microsoft.Azure.Search.StopwordsTokenFilter".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.StopwordsTokenFilter"]
