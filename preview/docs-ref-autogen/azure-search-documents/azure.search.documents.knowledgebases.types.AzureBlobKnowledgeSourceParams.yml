### YamlMime:PythonClass
uid: azure.search.documents.knowledgebases.types.AzureBlobKnowledgeSourceParams
name: AzureBlobKnowledgeSourceParams
fullName: azure.search.documents.knowledgebases.types.AzureBlobKnowledgeSourceParams
module: azure.search.documents.knowledgebases.types
summary: Specifies runtime parameters for a azure blob knowledge source.
constructor:
  syntax: AzureBlobKnowledgeSourceParams()
variables:
- description: The name of the index the params apply to. Required.
  name: knowledgeSourceName
  types:
  - <xref:str>
- description: 'Indicates whether references should be included for data retrieved

    from this source.'
  name: includeReferences
  types:
  - <xref:bool>
- description: 'Indicates whether references should include the structured

    data obtained during retrieval in their payload.'
  name: includeReferenceSourceData
  types:
  - <xref:bool>
- description: 'Indicates that this knowledge source should bypass source selection

    and always be queried at retrieval time.'
  name: alwaysQuerySource
  types:
  - <xref:bool>
- description: 'Indicates that this knowledge source should be excluded from the

    request''s candidate set and never queried at retrieval time. The exclusion is
    request-local and

    does not modify knowledge base membership. Cannot be combined with alwaysQuerySource
    on the

    same knowledge source.'
  name: neverQuerySource
  types:
  - <xref:bool>
- description: 'Indicates that the entire retrieval request should fail if retrieval
    from

    this knowledge source encounters an error. Defaults to false.'
  name: failOnError
  types:
  - <xref:bool>
- description: 'The reranker threshold all retrieved documents must meet to be

    included in the response.'
  name: rerankerThreshold
  types:
  - <xref:float>
- description: 'Overrides the knowledge source''s stored resultsProcessing for this

    retrieve call only. When omitted, the stored knowledge source value applies. Known
    values are:

    "rerank" and "none".'
  name: resultsProcessing
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KnowledgeSourceResultsProcessing">]
- description: 'Limits the maximum number of documents returned from this knowledge

    source.'
  name: maxOutputDocuments
  types:
  - <xref:int>
- description: 'Indicates whether image serving should be enabled for this knowledge

    source at retrieval time. When true, images extracted during ingestion are delivered
    to

    downstream models.'
  name: enableImageServing
  types:
  - <xref:bool>
- description: 'The discriminator value. Required. A knowledge source that read and
    ingest data

    from Azure Blob Storage to a Search Index.'
  name: kind
  types:
  - <xref:typing.Literal>[KnowledgeSourceKind.AZURE_BLOB]
- description: 'Hints that guide query planning toward useful filters and boosts.
    If

    specified, this object replaces the complete set of query hints configured on
    the knowledge

    source.'
  name: queryHintOverrides
  types:
  - <xref:<xref:"SearchIndexKnowledgeSourceQueryHints">>
methods:
