uid: azure.search.documents.indexes.types.SearchIndexKnowledgeSourceFilterHint
name: SearchIndexKnowledgeSourceFilterHint
fullName: azure.search.documents.indexes.types.SearchIndexKnowledgeSourceFilterHint
module: azure.search.documents.indexes.types
summary: 'A hint that identifies a field and representative values the query planner
  can use when

  constructing a filter.'
constructor:
  syntax: SearchIndexKnowledgeSourceFilterHint()
variables:
- description: The name of the filterable search index field. Required.
  name: field
