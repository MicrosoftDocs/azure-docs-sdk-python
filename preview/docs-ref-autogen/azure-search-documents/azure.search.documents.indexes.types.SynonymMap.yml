### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.SynonymMap
name: SynonymMap
fullName: azure.search.documents.indexes.types.SynonymMap
module: azure.search.documents.indexes.types
summary: Represents a synonym map definition.
constructor:
  syntax: SynonymMap()
variables:
- description: The name of the synonym map. Required.
  name: name
  types:
  - <xref:str>
- description: 'The format of the synonym map. Only the ''solr'' format is currently
    supported.

    Required. Default value is "solr".'
  name: format
  types:
  - <xref:typing.Literal>["solr"]
- description: 'A series of synonym rules in the specified synonym map format. The
    rules must

    be separated by newlines. Required.'
  name: synonyms
  types:
  - <xref:list>[<xref:str>]
- description: 'A description of an encryption key that you create in Azure Key Vault.

    This key is used to provide an additional level of encryption-at-rest for your
    data when you

    want full assurance that no one, not even Microsoft, can decrypt your data. Once
    you have

    encrypted your data, it will always remain encrypted. The search service will
    ignore attempts

    to set this property to null. You can change this property as needed if you want
    to rotate your

    encryption key; Your data will be unaffected. Encryption with customer-managed
    keys is not

    available for free search services, and is only available for paid services created
    on or after

    January 1, 2019.'
  name: encryptionKey
  types:
  - <xref:<xref:"SearchResourceEncryptionKey">>
- description: The ETag of the synonym map.
  name: '@odata.etag'
  types:
  - <xref:str>
methods:
- uid: azure.search.documents.indexes.types.SynonymMap.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.SynonymMap.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.SynonymMap.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.SynonymMap.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.SynonymMap.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.SynonymMap.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.SynonymMap.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.SynonymMap.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.SynonymMap.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.SynonymMap.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.SynonymMap.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.SynonymMap.encryptionKey
  name: encryptionKey
  signature: 'encryptionKey: SearchResourceEncryptionKey | None'
- uid: azure.search.documents.indexes.types.SynonymMap.format
  name: format
  signature: 'format: Literal[''solr'']'
- uid: azure.search.documents.indexes.types.SynonymMap.name
  name: name
  signature: 'name: str'
- uid: azure.search.documents.indexes.types.SynonymMap.synonyms
  name: synonyms
  signature: 'synonyms: list[str]'
