### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.ShingleTokenFilter
name: ShingleTokenFilter
fullName: azure.search.documents.indexes.types.ShingleTokenFilter
module: azure.search.documents.indexes.types
summary: 'Creates combinations of tokens as a single token. This token filter is implemented
  using Apache

  Lucene.'
constructor:
  syntax: ShingleTokenFilter()
variables:
- description: 'The name of the token filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: The maximum shingle size. Default and minimum value is 2.
  name: maxShingleSize
  types:
  - <xref:int>
- description: 'The minimum shingle size. Default and minimum value is 2. Must be
    less

    than the value of maxShingleSize.'
  name: minShingleSize
  types:
  - <xref:int>
- description: 'A value indicating whether the output stream will contain the input

    tokens (unigrams) as well as shingles. Default is true.'
  name: outputUnigrams
  types:
  - <xref:bool>
- description: 'A value indicating whether to output unigrams for those times

    when no shingles are available. This property takes precedence when outputUnigrams
    is set to

    false. Default is false.'
  name: outputUnigramsIfNoShingles
  types:
  - <xref:bool>
- description: 'The string to use when joining adjacent tokens to form a shingle.
    Default

    is a single space (" ").'
  name: tokenSeparator
  types:
  - <xref:str>
- description: 'The string to insert for each position at which there is no token.
    Default

    is an underscore ("_").'
  name: filterToken
  types:
  - <xref:str>
- description: 'A URI fragment specifying the type of token filter. Required. Default

    value is "#Microsoft.Azure.Search.ShingleTokenFilter".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.ShingleTokenFilter"]
