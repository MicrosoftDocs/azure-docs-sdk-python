### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.ScoringProfile
name: ScoringProfile
fullName: azure.search.documents.indexes.types.ScoringProfile
module: azure.search.documents.indexes.types
summary: Defines parameters for a search index that influence scoring in search queries.
constructor:
  syntax: ScoringProfile()
variables:
- description: The name of the scoring profile. Required.
  name: name
  types:
  - <xref:str>
- description: Parameters that boost scoring based on text matches in certain index
    fields.
  name: text
  types:
  - <xref:<xref:"TextWeights">>
- description: The collection of functions that influence the scoring of documents.
  name: functions
  types:
  - <xref:list>[<xref:"ScoringFunction">]
- description: 'A value indicating how the results of individual scoring functions

    should be combined. Defaults to "Sum". Ignored if there are no scoring functions.
    Known values

    are: "sum", "average", "minimum", "maximum", "firstMatching", and "product".'
  name: functionAggregation
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScoringFunctionAggregation">]
methods:
- uid: azure.search.documents.indexes.types.ScoringProfile.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.ScoringProfile.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.ScoringProfile.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.ScoringProfile.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.ScoringProfile.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.ScoringProfile.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.ScoringProfile.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.ScoringProfile.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.ScoringProfile.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.ScoringProfile.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.ScoringProfile.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.ScoringProfile.functionAggregation
  name: functionAggregation
  summary: 'A value indicating how the results of individual scoring functions should
    be combined. Defaults

    to "Sum". Ignored if there are no scoring functions. Known values are: "sum",
    "average",

    "minimum", "maximum", "firstMatching", and "product".'
  signature: 'functionAggregation: str | ScoringFunctionAggregation'
- uid: azure.search.documents.indexes.types.ScoringProfile.functions
  name: functions
  summary: The collection of functions that influence the scoring of documents.
  signature: 'functions: list[''ScoringFunction'']'
- uid: azure.search.documents.indexes.types.ScoringProfile.name
  name: name
  summary: The name of the scoring profile. Required.
  signature: 'name: Required[str]'
- uid: azure.search.documents.indexes.types.ScoringProfile.text
  name: text
  summary: Parameters that boost scoring based on text matches in certain index fields.
  signature: 'text: TextWeights | None'
