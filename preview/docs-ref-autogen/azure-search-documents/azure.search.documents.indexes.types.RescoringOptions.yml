### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.RescoringOptions
name: RescoringOptions
fullName: azure.search.documents.indexes.types.RescoringOptions
module: azure.search.documents.indexes.types
summary: Contains the options for rescoring.
constructor:
  syntax: RescoringOptions()
variables:
- description: 'If set to true, after the initial search on the compressed vectors,
    the

    similarity scores are recalculated using the full-precision vectors. This will
    improve recall

    at the expense of latency.'
  name: enableRescoring
  types:
  - <xref:bool>
- description: 'Default oversampling factor. Oversampling retrieves a greater set
    of

    potential documents to offset the resolution loss due to quantization. This increases
    the set

    of results that will be rescored on full-precision vectors. Minimum value is 1,
    meaning no

    oversampling (1x). This parameter can only be set when ''enableRescoring'' is
    true. Higher values

    improve recall at the expense of latency.'
  name: defaultOversampling
  types:
  - <xref:float>
- description: 'Controls the storage method for original vectors. This setting is

    immutable. Known values are: "preserveOriginals" and "discardOriginals".'
  name: rescoreStorageMethod
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VectorSearchCompressionRescoreStorageMethod">]
methods:
- uid: azure.search.documents.indexes.types.RescoringOptions.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.RescoringOptions.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.RescoringOptions.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.RescoringOptions.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.RescoringOptions.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.RescoringOptions.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.RescoringOptions.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.RescoringOptions.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.RescoringOptions.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.RescoringOptions.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.RescoringOptions.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.RescoringOptions.defaultOversampling
  name: defaultOversampling
  summary: 'Default oversampling factor. Oversampling retrieves a greater set of potential
    documents to

    offset the resolution loss due to quantization. This increases the set of results
    that will be

    rescored on full-precision vectors. Minimum value is 1, meaning no oversampling
    (1x). This

    parameter can only be set when ''enableRescoring'' is true. Higher values improve
    recall at the

    expense of latency.'
  signature: 'defaultOversampling: float | None'
- uid: azure.search.documents.indexes.types.RescoringOptions.enableRescoring
  name: enableRescoring
  summary: 'If set to true, after the initial search on the compressed vectors, the
    similarity scores are

    recalculated using the full-precision vectors. This will improve recall at the
    expense of

    latency.'
  signature: 'enableRescoring: bool | None'
- uid: azure.search.documents.indexes.types.RescoringOptions.rescoreStorageMethod
  name: rescoreStorageMethod
  summary: 'Controls the storage method for original vectors. This setting is immutable.
    Known values are:

    "preserveOriginals" and "discardOriginals".'
  signature: 'rescoreStorageMethod: str | VectorSearchCompressionRescoreStorageMethod
    | None'
