- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.key
  name: key
  summary: (Required for key authentication) The key for the AML service.
  signature: 'key: str | None'
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.modelName
  name: modelName
  summary: 'The name of the embedding model from the Azure AI Foundry Catalog that
    is deployed at the

    provided endpoint. Known values are: "OpenAI-CLIP-Image-Text-Embeddings-vit-base-patch32",

    "OpenAI-CLIP-Image-Text-Embeddings-ViT-Large-Patch14-336",

    "Facebook-DinoV2-Image-Embeddings-ViT-Base", "Facebook-DinoV2-Image-Embeddings-ViT-Giant",

    "Cohere-embed-v3-english", "Cohere-embed-v3-multilingual", and "Cohere-embed-v4".'
  signature: 'modelName: str | AIFoundryModelCatalogName'
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.region
  name: region
  summary: (Optional for token authentication). The region the AML service is deployed
    in.
  signature: 'region: str | None'
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.resourceId
  name: resourceId
  summary: '(Required for token authentication). The Azure Resource Manager resource
    ID of the AML service.

    It should be in the format

    subscriptions/{guid}/resourceGroups/{resource-group-name}/Microsoft.MachineLearningServices/workspaces/{workspace-name}/services/{service_name}.'
  signature: 'resourceId: str | None'
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.timeout
  name: timeout
  summary: (Optional) When specified, indicates the timeout for the http client making
    the API call.
  signature: 'timeout: str | None'
- uid: azure.search.documents.indexes.types.AzureMachineLearningParameters.uri
  name: uri
  summary: '(Required for no authentication or key authentication) The scoring URI
    of the AML service to

    which the JSON payload will be sent. Only the https URI scheme is allowed. Required.'
  signature: 'uri: Required[str | None]'
