### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.IndexingParameters
name: IndexingParameters
fullName: azure.search.documents.indexes.types.IndexingParameters
module: azure.search.documents.indexes.types
summary: Represents parameters for indexer execution.
constructor:
  syntax: IndexingParameters()
variables:
- description: 'The number of items that are read from the data source and indexed
    as a single

    batch in order to improve performance. The default depends on the data source
    type.'
  name: batchSize
  types:
  - <xref:int>
- description: 'The maximum number of items that can fail indexing for indexer execution

    to still be considered successful. -1 means no limit. Default is 0.'
  name: maxFailedItems
  types:
  - <xref:int>
- description: 'The maximum number of items in a single batch that can fail

    indexing for the batch to still be considered successful. -1 means no limit. Default
    is 0.'
  name: maxFailedItemsPerBatch
  types:
  - <xref:int>
- description: 'A dictionary of indexer-specific configuration properties. Each name
    is

    the name of a specific property. Each value must be of a primitive type.'
  name: configuration
  types:
  - <xref:<xref:"IndexingParametersConfiguration">>
methods:
- uid: azure.search.documents.indexes.types.IndexingParameters.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.IndexingParameters.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.IndexingParameters.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.IndexingParameters.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.IndexingParameters.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.IndexingParameters.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.IndexingParameters.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.IndexingParameters.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.IndexingParameters.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.IndexingParameters.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.IndexingParameters.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.IndexingParameters.batchSize
  name: batchSize
  summary: 'The number of items that are read from the data source and indexed as
    a single batch in order

    to improve performance. The default depends on the data source type.'
  signature: 'batchSize: int | None'
- uid: azure.search.documents.indexes.types.IndexingParameters.configuration
  name: configuration
  summary: 'A dictionary of indexer-specific configuration properties. Each name is
    the name of a specific

    property. Each value must be of a primitive type.'
  signature: 'configuration: IndexingParametersConfiguration'
- uid: azure.search.documents.indexes.types.IndexingParameters.maxFailedItems
  name: maxFailedItems
  summary: 'The maximum number of items that can fail indexing for indexer execution
    to still be considered

    successful. -1 means no limit. Default is 0.'
  signature: 'maxFailedItems: int | None'
- uid: azure.search.documents.indexes.types.IndexingParameters.maxFailedItemsPerBatch
  name: maxFailedItemsPerBatch
  summary: 'The maximum number of items in a single batch that can fail indexing for
    the batch to still be

    considered successful. -1 means no limit. Default is 0.'
  signature: 'maxFailedItemsPerBatch: int | None'
