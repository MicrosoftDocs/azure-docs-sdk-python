### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.EntraAppAuthentication
name: EntraAppAuthentication
fullName: azure.search.documents.indexes.types.EntraAppAuthentication
module: azure.search.documents.indexes.types
summary: 'Configuration for a customer-owned Microsoft Entra app registration used
  for federated

  credential-based on-behalf-of authentication.'
constructor:
  syntax: EntraAppAuthentication()
variables:
- description: 'The application (client) ID of the customer-owned Entra app registration.

    Required.'
  name: applicationId
  types:
  - <xref:str>
- description: 'The federated credential ID configured on the app registration,

    enabling the search service to authenticate as the app without a stored client
    secret.

    Required.'
  name: federatedCredentialId
  types:
  - <xref:str>
- description: 'The tenant ID of the app registration. Required when the app registration
    is in

    a different tenant than the search service. If omitted, the search service''s
    tenant is used.'
  name: tenantId
  types:
  - <xref:str>
