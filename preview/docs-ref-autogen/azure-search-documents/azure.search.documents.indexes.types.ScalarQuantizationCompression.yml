### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.ScalarQuantizationCompression
name: ScalarQuantizationCompression
fullName: azure.search.documents.indexes.types.ScalarQuantizationCompression
module: azure.search.documents.indexes.types
summary: 'Contains configuration options specific to the scalar quantization compression
  method used

  during indexing and querying.'
constructor:
  syntax: ScalarQuantizationCompression()
variables:
- description: The name to associate with this particular configuration. Required.
  name: name
  types:
  - <xref:str>
- description: Contains the options for rescoring.
  name: rescoringOptions
  types:
  - <xref:<xref:"RescoringOptions">>
- description: 'The number of dimensions to truncate the vectors to. Truncating the

    vectors reduces the size of the vectors and the amount of data that needs to be
    transferred

    during search. This can save storage cost and improve search performance at the
    expense of

    recall. It should be only used for embeddings trained with Matryoshka Representation
    Learning

    (MRL) such as OpenAI text-embedding-3-large (small). The default value is null,
    which means no

    truncation.'
  name: truncationDimension
  types:
  - <xref:int>
- description: Contains the parameters specific to Scalar Quantization.
  name: scalarQuantizationParameters
  types:
  - <xref:<xref:"ScalarQuantizationParameters">>
- description: 'The name of the kind of compression method being configured for use
    with vector

    search. Required. Scalar Quantization, a type of compression method. In scalar
    quantization,

    the original vectors values are compressed to a narrower type by discretizing
    and representing

    each component of a vector using a reduced set of quantized values, thereby reducing
    the

    overall data size.'
  name: kind
  types:
  - <xref:typing.Literal>[VectorSearchCompressionKind.SCALAR_QUANTIZATION]
methods:
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.kind
  name: kind
  summary: 'The name of the kind of compression method being configured for use with
    vector search.

    Required. Scalar Quantization, a type of compression method. In scalar quantization,
    the

    original vectors values are compressed to a narrower type by discretizing and
    representing each

    component of a vector using a reduced set of quantized values, thereby reducing
    the overall

    data size.'
  signature: 'kind: SCALAR_QUANTIZATION: ''scalarQuantization''>]'
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.name
  name: name
  summary: The name to associate with this particular configuration. Required.
  signature: 'name: str'
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.rescoringOptions
  name: rescoringOptions
  summary: Contains the options for rescoring.
  signature: 'rescoringOptions: RescoringOptions | None'
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.scalarQuantizationParameters
  name: scalarQuantizationParameters
  summary: Contains the parameters specific to Scalar Quantization.
  signature: 'scalarQuantizationParameters: ScalarQuantizationParameters'
- uid: azure.search.documents.indexes.types.ScalarQuantizationCompression.truncationDimension
  name: truncationDimension
  summary: 'The number of dimensions to truncate the vectors to. Truncating the vectors
    reduces the size of

    the vectors and the amount of data that needs to be transferred during search.
    This can save

    storage cost and improve search performance at the expense of recall. It should
    be only used

    for embeddings trained with Matryoshka Representation Learning (MRL) such as OpenAI

    text-embedding-3-large (small). The default value is null, which means no truncation.'
  signature: 'truncationDimension: int | None'
