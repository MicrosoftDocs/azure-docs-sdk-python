### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter
name: DictionaryDecompounderTokenFilter
fullName: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter
module: azure.search.documents.indexes.types
summary: 'Decomposes compound words found in many Germanic languages. This token filter
  is implemented

  using Apache Lucene.'
constructor:
  syntax: DictionaryDecompounderTokenFilter()
variables:
- description: 'The name of the token filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: The list of words to match against. Required.
  name: wordList
  types:
  - <xref:list>[<xref:str>]
- description: 'The minimum word size. Only words longer than this get processed.
    Default is

    5. Maximum is 300.'
  name: minWordSize
  types:
  - <xref:int>
- description: 'The minimum subword size. Only subwords longer than this are outputted.

    Default is 2. Maximum is 300.'
  name: minSubwordSize
  types:
  - <xref:int>
- description: 'The maximum subword size. Only subwords shorter than this are outputted.

    Default is 15. Maximum is 300.'
  name: maxSubwordSize
  types:
  - <xref:int>
- description: 'A value indicating whether to add only the longest matching subword
    to

    the output. Default is false.'
  name: onlyLongestMatch
  types:
  - <xref:bool>
- description: 'A URI fragment specifying the type of token filter. Required. Default

    value is "#Microsoft.Azure.Search.DictionaryDecompounderTokenFilter".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.DictionaryDecompounderTokenFilter"]
methods:
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
