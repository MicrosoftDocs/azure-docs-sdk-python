  name: minSubwordSize
  signature: 'minSubwordSize: int'
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.minWordSize
  name: minWordSize
  signature: 'minWordSize: int'
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.name
  name: name
  signature: 'name: str'
- uid: azure.search.documents.indexes.types.DictionaryDecompounderTokenFilter.onlyLongestMatch
  name: onlyLongestMatch
  signature: 'onlyLongestMatch: bool'
