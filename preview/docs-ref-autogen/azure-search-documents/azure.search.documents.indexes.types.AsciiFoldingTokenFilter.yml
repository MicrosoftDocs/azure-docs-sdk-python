### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.AsciiFoldingTokenFilter
name: AsciiFoldingTokenFilter
fullName: azure.search.documents.indexes.types.AsciiFoldingTokenFilter
module: azure.search.documents.indexes.types
summary: 'Converts alphabetic, numeric, and symbolic Unicode characters which are
  not in the first 127

  ASCII characters (the "Basic Latin" Unicode block) into their ASCII equivalents,
  if such

  equivalents exist. This token filter is implemented using Apache Lucene.'
constructor:
  syntax: AsciiFoldingTokenFilter()
variables:
- description: 'The name of the token filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: 'A value indicating whether the original token will be kept. Default
    is

    false.'
  name: preserveOriginal
  types:
  - <xref:bool>
- description: 'A URI fragment specifying the type of token filter. Required. Default

    value is "#Microsoft.Azure.Search.AsciiFoldingTokenFilter".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.AsciiFoldingTokenFilter"]
