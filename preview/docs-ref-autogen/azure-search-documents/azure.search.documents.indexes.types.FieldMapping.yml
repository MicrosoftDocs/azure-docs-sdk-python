### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.FieldMapping
name: FieldMapping
fullName: azure.search.documents.indexes.types.FieldMapping
module: azure.search.documents.indexes.types
summary: Defines a mapping between a field in a data source and a target field in
  an index.
constructor:
  syntax: FieldMapping()
variables:
- description: The name of the field in the data source. Required.
  name: sourceFieldName
  types:
  - <xref:str>
- description: 'The name of the target field in the index. Same as the source field
    name

    by default.'
  name: targetFieldName
  types:
  - <xref:str>
- description: A function to apply to each source field value before indexing.
  name: mappingFunction
  types:
  - <xref:<xref:"FieldMappingFunction">>
methods:
- uid: azure.search.documents.indexes.types.FieldMapping.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.FieldMapping.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.FieldMapping.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.FieldMapping.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.FieldMapping.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.FieldMapping.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.FieldMapping.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.FieldMapping.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.FieldMapping.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.FieldMapping.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.FieldMapping.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.FieldMapping.mappingFunction
  name: mappingFunction
  summary: A function to apply to each source field value before indexing.
  signature: 'mappingFunction: FieldMappingFunction | None'
- uid: azure.search.documents.indexes.types.FieldMapping.sourceFieldName
  name: sourceFieldName
  summary: The name of the field in the data source. Required.
  signature: 'sourceFieldName: str'
- uid: azure.search.documents.indexes.types.FieldMapping.targetFieldName
  name: targetFieldName
  summary: The name of the target field in the index. Same as the source field name
    by default.
  signature: 'targetFieldName: str'
