### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.HnswParameters
name: HnswParameters
fullName: azure.search.documents.indexes.types.HnswParameters
module: azure.search.documents.indexes.types
summary: Contains the parameters specific to the HNSW algorithm.
constructor:
  syntax: HnswParameters()
variables:
- description: 'The number of bi-directional links created for every new element during
    construction.

    Increasing this parameter value may improve recall and reduce retrieval times
    for datasets with

    high intrinsic dimensionality at the expense of increased memory consumption and
    longer

    indexing time.'
  name: m
  types:
  - <xref:int>
- description: 'The size of the dynamic list containing the nearest neighbors, which
    is

    used during index time. Increasing this parameter may improve index quality, at
    the expense of

    increased indexing time. At a certain point, increasing this parameter leads to
    diminishing

    returns.'
  name: efConstruction
  types:
  - <xref:int>
- description: 'The size of the dynamic list containing the nearest neighbors, which
    is used

    during search time. Increasing this parameter may improve search results, at the
    expense of

    slower search. At a certain point, increasing this parameter leads to diminishing
    returns.'
  name: efSearch
  types:
  - <xref:int>
- description: 'The similarity metric to use for vector comparisons. Known values
    are: "cosine",

    "euclidean", "dotProduct", and "hamming".'
  name: metric
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VectorSearchAlgorithmMetric">]
methods:
- uid: azure.search.documents.indexes.types.HnswParameters.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.HnswParameters.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.HnswParameters.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.HnswParameters.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.HnswParameters.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.HnswParameters.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.HnswParameters.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.HnswParameters.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.HnswParameters.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.HnswParameters.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.HnswParameters.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.HnswParameters.efConstruction
  name: efConstruction
  summary: 'The size of the dynamic list containing the nearest neighbors, which is
    used during index time.

    Increasing this parameter may improve index quality, at the expense of increased
    indexing time.

    At a certain point, increasing this parameter leads to diminishing returns.'
  signature: 'efConstruction: int'
- uid: azure.search.documents.indexes.types.HnswParameters.efSearch
  name: efSearch
  summary: 'The size of the dynamic list containing the nearest neighbors, which is
    used during search

    time. Increasing this parameter may improve search results, at the expense of
    slower search. At

    a certain point, increasing this parameter leads to diminishing returns.'
  signature: 'efSearch: int'
- uid: azure.search.documents.indexes.types.HnswParameters.m
  name: m
  summary: 'The number of bi-directional links created for every new element during
    construction.

    Increasing this parameter value may improve recall and reduce retrieval times
    for datasets with

    high intrinsic dimensionality at the expense of increased memory consumption and
    longer

    indexing time.'
  signature: 'm: int'
- uid: azure.search.documents.indexes.types.HnswParameters.metric
  name: metric
  summary: '"cosine",

    "euclidean", "dotProduct", and "hamming".'
  signature: 'metric: str | VectorSearchAlgorithmMetric | None'
