### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.ElisionTokenFilter
name: ElisionTokenFilter
fullName: azure.search.documents.indexes.types.ElisionTokenFilter
module: azure.search.documents.indexes.types
summary: 'Removes elisions. For example, "l''avion" (the plane) will be converted
  to "avion" (plane). This

  token filter is implemented using Apache Lucene.'
constructor:
  syntax: ElisionTokenFilter()
variables:
- description: 'The name of the token filter. It must only contain letters, digits,
    spaces, dashes

    or underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: The set of articles to remove.
  name: articles
  types:
  - <xref:list>[<xref:str>]
- description: 'A URI fragment specifying the type of token filter. Required. Default

    value is "#Microsoft.Azure.Search.ElisionTokenFilter".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.ElisionTokenFilter"]
