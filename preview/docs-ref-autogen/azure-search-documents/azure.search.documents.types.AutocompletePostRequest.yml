### YamlMime:PythonClass
uid: azure.search.documents.types.AutocompletePostRequest
name: AutocompletePostRequest
fullName: azure.search.documents.types.AutocompletePostRequest
module: azure.search.documents.types
summary: AutocompletePostRequest.
constructor:
  syntax: AutocompletePostRequest()
variables:
- description: The search text on which to base autocomplete results. Required.
  name: search
  types:
  - <xref:str>
- description: 'Specifies the mode for Autocomplete. The default is ''oneTerm''. Use

    ''twoTerms'' to get shingles and ''oneTermWithContext'' to use the current context
    while producing

    auto-completed terms. Known values are: "oneTerm", "twoTerms", and "oneTermWithContext".'
  name: autocompleteMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutocompleteMode">]
- description: 'An OData expression that filters the documents used to produce completed
    terms

    for the Autocomplete result.'
  name: filter
  types:
  - <xref:str>
- description: 'A value indicating whether to use fuzzy matching for the autocomplete
    query.

    Default is false. When set to true, the query will autocomplete terms even if
    there''s a

    substituted or missing character in the search text. While this provides a better
    experience in

    some scenarios, it comes at a performance cost as fuzzy autocomplete queries are
    slower and

    consume more resources.'
  name: fuzzy
  types:
  - <xref:bool>
- description: 'A string tag that is appended to hit highlights. Must be set with

    highlightPreTag. If omitted, hit highlighting is disabled.'
  name: highlightPostTag
  types:
  - <xref:str>
- description: 'A string tag that is prepended to hit highlights. Must be set with

    highlightPostTag. If omitted, hit highlighting is disabled.'
  name: highlightPreTag
  types:
  - <xref:str>
- description: 'A number between 0 and 100 indicating the percentage of the index
    that

    must be covered by an autocomplete query in order for the query to be reported
    as a success.

    This parameter can be useful for ensuring search availability even for services
    with only one

    replica. The default is 80.'
  name: minimumCoverage
  types:
  - <xref:float>
- description: 'The comma-separated list of field names to consider when querying
    for

    auto-completed terms. Target fields must be included in the specified suggester.'
  name: searchFields
  types:
  - <xref:list>[<xref:str>]
- description: 'The name of the suggester as specified in the suggesters collection
    that''s

    part of the index definition. Required.'
  name: suggesterName
  types:
  - <xref:str>
- description: 'The number of auto-completed terms to retrieve. This must be a value
    between 1 and

    100. The default is 5.'
  name: top
  types:
  - <xref:int>
methods:
- uid: azure.search.documents.types.AutocompletePostRequest.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.types.AutocompletePostRequest.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.types.AutocompletePostRequest.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.types.AutocompletePostRequest.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.types.AutocompletePostRequest.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.types.AutocompletePostRequest.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.types.AutocompletePostRequest.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.types.AutocompletePostRequest.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.types.AutocompletePostRequest.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.types.AutocompletePostRequest.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.types.AutocompletePostRequest.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.types.AutocompletePostRequest.autocompleteMode
  name: autocompleteMode
  summary: 'Specifies the mode for Autocomplete. The default is ''oneTerm''. Use ''twoTerms''
    to get shingles

    and ''oneTermWithContext'' to use the current context while producing auto-completed
    terms. Known

    values are: "oneTerm", "twoTerms", and "oneTermWithContext".'
  signature: 'autocompleteMode: str | AutocompleteMode'
- uid: azure.search.documents.types.AutocompletePostRequest.filter
  name: filter
  summary: 'An OData expression that filters the documents used to produce completed
    terms for the

    Autocomplete result.'
  signature: 'filter: str'
- uid: azure.search.documents.types.AutocompletePostRequest.fuzzy
  name: fuzzy
  summary: 'A value indicating whether to use fuzzy matching for the autocomplete
    query. Default is false.

    When set to true, the query will autocomplete terms even if there''s a substituted
    or missing

    character in the search text. While this provides a better experience in some
    scenarios, it

    comes at a performance cost as fuzzy autocomplete queries are slower and consume
    more

    resources.'
  signature: 'fuzzy: bool'
- uid: azure.search.documents.types.AutocompletePostRequest.highlightPostTag
  name: highlightPostTag
  summary: 'A string tag that is appended to hit highlights. Must be set with highlightPreTag.
    If omitted,

    hit highlighting is disabled.'
  signature: 'highlightPostTag: str'
- uid: azure.search.documents.types.AutocompletePostRequest.highlightPreTag
  name: highlightPreTag
  summary: 'A string tag that is prepended to hit highlights. Must be set with highlightPostTag.
    If

    omitted, hit highlighting is disabled.'
  signature: 'highlightPreTag: str'
- uid: azure.search.documents.types.AutocompletePostRequest.minimumCoverage
  name: minimumCoverage
  summary: 'A number between 0 and 100 indicating the percentage of the index that
    must be covered by an

    autocomplete query in order for the query to be reported as a success. This parameter
    can be

    useful for ensuring search availability even for services with only one replica.
    The default is

    80.'
  signature: 'minimumCoverage: float'
- uid: azure.search.documents.types.AutocompletePostRequest.search
  name: search
  summary: The search text on which to base autocomplete results. Required.
  signature: 'search: Required[str]'
- uid: azure.search.documents.types.AutocompletePostRequest.searchFields
  name: searchFields
  summary: 'The comma-separated list of field names to consider when querying for
    auto-completed terms.

    Target fields must be included in the specified suggester.'
  signature: 'searchFields: list[str]'
- uid: azure.search.documents.types.AutocompletePostRequest.suggesterName
  name: suggesterName
  summary: 'The name of the suggester as specified in the suggesters collection that''s
    part of the index

    definition. Required.'
  signature: 'suggesterName: Required[str]'
- uid: azure.search.documents.types.AutocompletePostRequest.top
  name: top
  summary: 'The number of auto-completed terms to retrieve. This must be a value between
    1 and 100. The

    default is 5.'
  signature: 'top: int'
