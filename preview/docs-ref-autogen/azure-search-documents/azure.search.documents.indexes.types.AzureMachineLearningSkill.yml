### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.AzureMachineLearningSkill
name: AzureMachineLearningSkill
fullName: azure.search.documents.indexes.types.AzureMachineLearningSkill
module: azure.search.documents.indexes.types
summary: 'The AML skill allows you to extend AI enrichment with a custom Azure Machine
  Learning (AML)

  model. Once an AML model is trained and deployed, an AML skill integrates it into
  AI

  enrichment.'
constructor:
  syntax: AzureMachineLearningSkill()
variables:
- description: 'The name of the skill which uniquely identifies it within the skillset.
    A skill

    with no name defined will be given a default name of its 1-based index in the
    skills array,

    prefixed with the character ''#''.'
  name: name
  types:
  - <xref:str>
- description: 'The description of the skill which describes the inputs, outputs,
    and usage

    of the skill.'
  name: description
  types:
  - <xref:str>
- description: 'Represents the level at which operations take place, such as the document
    root

    or document content (for example, /document or /document/content). The default
    is /document.'
  name: context
  types:
  - <xref:str>
- description: 'Inputs of the skills could be a column in the source data set, or
    the output of

    an upstream skill. Required.'
  name: inputs
  types:
  - <xref:list>[<xref:"InputFieldMappingEntry">]
- description: 'The output of a skill is either a field in a search index, or a value
    that can

    be consumed as an input by another skill. Required.'
  name: outputs
  types:
  - <xref:list>[<xref:"OutputFieldMappingEntry">]
- description: '(Required for no authentication or key authentication) The scoring
    URI of the AML

    service to which the JSON payload will be sent. Only the https URI scheme is allowed.'
  name: uri
  types:
  - <xref:str>
- description: (Required for key authentication) The key for the AML service.
  name: key
  types:
  - <xref:str>
- description: '(Required for token authentication). The Azure Resource Manager resource
    ID

    of the AML service. It should be in the format

    subscriptions/{guid}/resourceGroups/{resource-group-name}/Microsoft.MachineLearningServices/workspaces/{workspace-name}/services/{service_name}.'
  name: resourceId
  types:
  - <xref:str>
- description: '(Optional) When specified, indicates the timeout for the http client
    making the

    API call.'
  name: timeout
  types:
  - <xref:str>
- description: (Optional for token authentication). The region the AML service is
    deployed in.
  name: region
  types:
  - <xref:str>
- description: '(Optional) When specified, indicates the number of calls the indexer

    will make in parallel to the endpoint you have provided. You can decrease this
    value if your

    endpoint is failing under too high of a request load, or raise it if your endpoint
    is able to

    accept more requests and you would like an increase in the performance of the
    indexer. If not

    set, a default value of 5 is used. The degreeOfParallelism can be set to a maximum
    of 10 and a

    minimum of 1.'
  name: degreeOfParallelism
  types:
  - <xref:int>
- description: 'A URI fragment specifying the type of skill. Required. Default value
    is

    "#Microsoft.Skills.Custom.AmlSkill".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Skills.Custom.AmlSkill"]
