### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.AzureOpenAIEmbeddingSkill
name: AzureOpenAIEmbeddingSkill
fullName: azure.search.documents.indexes.types.AzureOpenAIEmbeddingSkill
module: azure.search.documents.indexes.types
summary: 'Allows you to generate a vector embedding for a given text input using the
  Azure OpenAI

  resource.'
constructor:
  syntax: AzureOpenAIEmbeddingSkill()
variables:
- description: 'The name of the skill which uniquely identifies it within the skillset.
    A skill

    with no name defined will be given a default name of its 1-based index in the
    skills array,

    prefixed with the character ''#''.'
  name: name
  types:
  - <xref:str>
- description: 'The description of the skill which describes the inputs, outputs,
    and usage

    of the skill.'
  name: description
  types:
  - <xref:str>
- description: 'Represents the level at which operations take place, such as the document
    root

    or document content (for example, /document or /document/content). The default
    is /document.'
  name: context
  types:
  - <xref:str>
- description: 'Inputs of the skills could be a column in the source data set, or
    the output of

    an upstream skill. Required.'
  name: inputs
  types:
  - <xref:list>[<xref:"InputFieldMappingEntry">]
- description: 'The output of a skill is either a field in a search index, or a value
    that can

    be consumed as an input by another skill. Required.'
  name: outputs
  types:
  - <xref:list>[<xref:"OutputFieldMappingEntry">]
- description: The resource URI of the Azure OpenAI resource.
  name: resourceUri
  types:
  - <xref:str>
- description: ID of the Azure OpenAI model deployment on the designated resource.
  name: deploymentId
  types:
  - <xref:str>
- description: API key of the designated Azure OpenAI resource.
  name: apiKey
  types:
  - <xref:str>
- description: The user-assigned managed identity used for outbound connections.
  name: authIdentity
  types:
  - <xref:<xref:"SearchIndexerDataIdentity">>
- description: 'The name of the embedding model that is deployed at the provided deploymentId

    path. Known values are: "text-embedding-ada-002", "text-embedding-3-large",

    "text-embedding-3-small", "gpt-4o", "gpt-4o-mini", "gpt-4.1", "gpt-4.1-mini",
    "gpt-4.1-nano",

    "gpt-5", "gpt-5-mini", "gpt-5-nano", "gpt-5.1", "gpt-5.2", "gpt-5.4", "gpt-5.4-mini",

    "gpt-5.4-nano", "gpt-5.5", "gpt-5.6-sol", "gpt-5.6-terra", and "gpt-5.6-luna".'
  name: modelName
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureOpenAIModelName">]
- description: 'The number of dimensions the resulting output embeddings should have.
    Only

    supported in text-embedding-3 and later models.'
  name: dimensions
  types:
  - <xref:int>
- description: 'A URI fragment specifying the type of skill. Required. Default value
    is

    "#Microsoft.Skills.Text.AzureOpenAIEmbeddingSkill".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Skills.Text.AzureOpenAIEmbeddingSkill"]
