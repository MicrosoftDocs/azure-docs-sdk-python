uid: azure.search.documents.indexes.types.IndexedSharePointKnowledgeSourceParameters
name: IndexedSharePointKnowledgeSourceParameters
fullName: azure.search.documents.indexes.types.IndexedSharePointKnowledgeSourceParameters
module: azure.search.documents.indexes.types
summary: Parameters for SharePoint knowledge source.
constructor:
  syntax: IndexedSharePointKnowledgeSourceParameters()
variables:
- description: 'SharePoint connection string with format:

    SharePointOnlineEndpoint=[SharePoint site url];ApplicationId=[Azure AD App

    ID];ApplicationSecret=[Azure AD App client secret];TenantId=[SharePoint site tenant
    id].

    Required.'
  name: connectionString
  types:
  - <xref:str>
- description: 'Specifies which SharePoint libraries to access. Required. Known values

    are: "defaultSiteLibrary", "allSiteLibraries", and "useQuery".'
  name: containerName
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IndexedSharePointContainerName">]
- description: Optional query to filter SharePoint content.
  name: query
  types:
  - <xref:str>
- description: Consolidates all general ingestion settings.
  name: ingestionParameters
  types:
  - <xref:<xref:"KnowledgeSourceIngestionParameters">>
- description: 'Default hints that guide query planning toward useful filters and
    boosts for

    this index-backed knowledge source. Request-time query hints replace these defaults
    as a

    complete object.'
  name: queryHints
  types:
  - <xref:<xref:"SearchIndexKnowledgeSourceQueryHints">>
- description: Resources created by the knowledge source.
  name: createdResources
  types:
  - <xref:<xref:"CreatedResources">>
