### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.HnswAlgorithmConfiguration
name: HnswAlgorithmConfiguration
fullName: azure.search.documents.indexes.types.HnswAlgorithmConfiguration
module: azure.search.documents.indexes.types
summary: 'Contains configuration options specific to the HNSW approximate nearest
  neighbors algorithm

  used during indexing and querying. The HNSW algorithm offers a tunable trade-off
  between search

  speed and accuracy.'
constructor:
  syntax: HnswAlgorithmConfiguration()
variables:
- description: The name to associate with this particular configuration. Required.
  name: name
  types:
  - <xref:str>
- description: Contains the parameters specific to HNSW algorithm.
  name: hnswParameters
  types:
  - <xref:<xref:"HnswParameters">>
- description: 'The name of the kind of algorithm being configured for use with vector
    search.

    Required. HNSW (Hierarchical Navigable Small World), a type of approximate nearest
    neighbors

    algorithm.'
  name: kind
  types:
  - <xref:typing.Literal>[VectorSearchAlgorithmKind.HNSW]
