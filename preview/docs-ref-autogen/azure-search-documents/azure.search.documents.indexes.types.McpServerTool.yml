### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.McpServerTool
name: McpServerTool
fullName: azure.search.documents.indexes.types.McpServerTool
module: azure.search.documents.indexes.types
summary: Represents a single tool within an MCP server knowledge source.
constructor:
  syntax: McpServerTool()
variables:
- description: The name of the MCP tool to invoke.
  name: name
  types:
  - <xref:str>
- description: Optional configuration for parsing the tool's output.
  name: outputParsing
  types:
  - <xref:<xref:"McpServerOutputParsing">>
- description: 'Controls whether the parsed results from this tool are reranked.

    Defaults to ''rerank'' when not specified. Known values are: "rerank" and "none".'
  name: resultsProcessing
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KnowledgeSourceResultsProcessing">]
- description: 'Optional post-parsing token cap for this tool''s output. Must be greater

    than 0 when specified.'
  name: maxOutputTokens
  types:
  - <xref:int>
methods:
- uid: azure.search.documents.indexes.types.McpServerTool.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.McpServerTool.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.McpServerTool.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.McpServerTool.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.McpServerTool.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.McpServerTool.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.McpServerTool.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.McpServerTool.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.McpServerTool.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.McpServerTool.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.McpServerTool.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.McpServerTool.maxOutputTokens
  name: maxOutputTokens
  summary: Optional post-parsing token cap for this tool's output. Must be greater
    than 0 when specified.
  signature: 'maxOutputTokens: int'
- uid: azure.search.documents.indexes.types.McpServerTool.name
  name: name
  summary: The name of the MCP tool to invoke.
  signature: 'name: str'
- uid: azure.search.documents.indexes.types.McpServerTool.outputParsing
  name: outputParsing
  summary: Optional configuration for parsing the tool's output.
  signature: 'outputParsing: McpServerOutputParsing'
- uid: azure.search.documents.indexes.types.McpServerTool.resultsProcessing
  name: resultsProcessing
  summary: 'Controls whether the parsed results from this tool are reranked. Defaults
    to ''rerank'' when not

    specified. Known values are: "rerank" and "none".'
  signature: 'resultsProcessing: str | KnowledgeSourceResultsProcessing'
