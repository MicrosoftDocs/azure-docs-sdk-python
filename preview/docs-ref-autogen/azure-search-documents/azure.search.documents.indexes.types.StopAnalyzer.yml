uid: azure.search.documents.indexes.types.StopAnalyzer
name: StopAnalyzer
fullName: azure.search.documents.indexes.types.StopAnalyzer
module: azure.search.documents.indexes.types
summary: 'Divides text at non-letters; Applies the lowercase and stopword token filters.
  This analyzer is

  implemented using Apache Lucene.'
constructor:
  syntax: StopAnalyzer()
variables:
- description: 'The name of the analyzer. It must only contain letters, digits, spaces,
    dashes or

    underscores, can only start and end with alphanumeric characters, and is limited
    to 128

    characters. Required.'
  name: name
  types:
  - <xref:str>
- description: A list of stopwords.
  name: stopwords
  types:
  - <xref:list>[<xref:str>]
- description: 'A URI fragment specifying the type of analyzer. Required. Default
    value

    is "#Microsoft.Azure.Search.StopAnalyzer".'
