  signature: 'oversampling: float'
- uid: azure.search.documents.types.VectorizableImageBinaryQuery.perDocumentVectorLimit
  name: perDocumentVectorLimit
  summary: 'Controls how many vectors can be matched from each document in a vector
    search query. Setting

    it to 1 ensures at most one vector per document is matched, guaranteeing results
    come from

    distinct documents. Setting it to 0 (unlimited) allows multiple relevant vectors
    from the same

    document to be matched. Default is 0.'
  signature: 'perDocumentVectorLimit: int'
- uid: azure.search.documents.types.VectorizableImageBinaryQuery.threshold
  name: threshold
  summary: 'The threshold used for vector queries. Note this can only be set if all
    ''fields'' use the same

    similarity metric.'
  signature: 'threshold: SearchScoreThreshold | VectorSimilarityThreshold'
- uid: azure.search.documents.types.VectorizableImageBinaryQuery.weight
  name: weight
  summary: 'Relative weight of the vector query when compared to other vector query
    and/or the text query

    within the same search request. This value is used when combining the results
    of multiple

    ranking lists produced by the different vector queries and/or the results retrieved
    through the

    text query. The higher the weight, the higher the documents that matched that
    query will be in

    the final ranking. Default is 1.0 and the value needs to be a positive number
