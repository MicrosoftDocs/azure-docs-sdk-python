  signature: 'kind: IMAGE_BINARY: ''imageBinary''>]'
- uid: azure.search.documents.types.VectorizableImageBinaryQuery.oversampling
  name: oversampling
  summary: 'Oversampling factor. Minimum value is 1. It overrides the ''defaultOversampling''
