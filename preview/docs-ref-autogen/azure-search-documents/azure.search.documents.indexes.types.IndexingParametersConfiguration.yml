### YamlMime:PythonClass
uid: azure.search.documents.indexes.types.IndexingParametersConfiguration
name: IndexingParametersConfiguration
fullName: azure.search.documents.indexes.types.IndexingParametersConfiguration
module: azure.search.documents.indexes.types
summary: 'A dictionary of indexer-specific configuration properties. Each name is
  the name of a specific

  property. Each value must be of a primitive type.'
constructor:
  syntax: IndexingParametersConfiguration()
variables:
- description: 'Represents the parsing mode for indexing from an Azure blob data source.

    Known values are: "default", "text", "delimitedText", "json", "jsonArray", "jsonLines",
    and

    "markdown".'
  name: parsingMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BlobIndexerParsingMode">]
- description: 'Comma-delimited list of filename extensions to ignore when

    processing from Azure blob storage.  For example, you could exclude ".png, .mp4"
    to skip over

    those files during indexing.'
  name: excludedFileNameExtensions
  types:
  - <xref:str>
- description: 'Comma-delimited list of filename extensions to select when

    processing from Azure blob storage.  For example, you could focus indexing on
    specific

    application files ".docx, .pptx, .msg" to specifically include those file types.'
  name: indexedFileNameExtensions
  types:
  - <xref:str>
- description: 'For Azure blobs, set to false if you want to continue

    indexing when an unsupported content type is encountered, and you don''t know
    all the content

    types (file extensions) in advance.'
  name: failOnUnsupportedContentType
  types:
  - <xref:bool>
- description: 'For Azure blobs, set to false if you want to continue

    indexing if a document fails indexing.'
  name: failOnUnprocessableDocument
  types:
  - <xref:bool>
- description: 'For Azure blobs, set this property to true

    to still index storage metadata for blob content that is too large to process.
    Oversized blobs

    are treated as errors by default. For limits on blob size, see

    [https://learn.microsoft.com/azure/search/search-limits-quotas-capacity](https://learn.microsoft.com/azure/search/search-limits-quotas-capacity).'
  name: indexStorageMetadataOnlyForOversizedDocuments
  types:
  - <xref:bool>
- description: 'For CSV blobs, specifies a comma-delimited list of column headers,

    useful for mapping source fields to destination fields in an index.'
  name: delimitedTextHeaders
  types:
  - <xref:str>
- description: 'For CSV blobs, specifies the end-of-line single-character

    delimiter for CSV files where each line starts a new document (for example, "|").'
  name: delimitedTextDelimiter
  types:
  - <xref:str>
- description: 'For CSV blobs, indicates that the first (non-blank) line of

    each blob contains headers.'
  name: firstLineContainsHeaders
  types:
  - <xref:bool>
- description: 'Specifies the submode that will determine whether a markdown file

    will be parsed into exactly one search document or multiple search documents.
    Default is

    `oneToMany`. Known values are: "oneToMany" and "oneToOne".'
  name: markdownParsingSubmode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MarkdownParsingSubmode">]
- description: 'Specifies the max header depth that will be considered while

    grouping markdown content. Default is `h6`. Known values are: "h1", "h2", "h3",
    "h4", "h5",

    and "h6".'
  name: markdownHeaderDepth
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MarkdownHeaderDepth">]
- description: 'For JSON arrays, given a structured or semi-structured document, you
    can

    specify a path to the array using this property.'
  name: documentRoot
  types:
  - <xref:str>
- description: 'Specifies the data to extract from Azure blob storage and tells the

    indexer which data to extract from image content when "imageAction" is set to
    a value other

    than "none".  This applies to embedded image content in a .PDF or other application,
    or image

    files such as .jpg and .png, in Azure blobs. Known values are: "storageMetadata",

    "allMetadata", and "contentAndMetadata".'
  name: dataToExtract
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BlobIndexerDataToExtract">]
- description: 'Determines how to process embedded images and image files in Azure
    blob

    storage.  Setting the "imageAction" configuration to any value other than "none"
    requires that

    a skillset also be attached to that indexer. Known values are: "none",

    "generateNormalizedImages", and "generateNormalizedImagePerPage".'
  name: imageAction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BlobIndexerImageAction">]
- description: 'If true, will create a path //document//file_data that is an

    object representing the original file data downloaded from your blob data source.
    This allows

    you to pass the original file data to a custom skill for processing within the
    enrichment

    pipeline, or to the Document Extraction skill.'
  name: allowSkillsetToReadFileData
  types:
  - <xref:bool>
- description: 'Determines algorithm for text extraction from PDF files in

    Azure blob storage. Known values are: "none" and "detectAngles".'
  name: pdfTextRotationAlgorithm
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BlobIndexerPDFTextRotationAlgorithm">]
- description: 'Specifies the environment in which the indexer should execute.

    Known values are: "standard" and "private".'
  name: executionEnvironment
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IndexerExecutionEnvironment">]
- description: 'Increases the timeout beyond the 5-minute default for Azure SQL database

    data sources, specified in the format "hh:mm:ss".'
  name: queryTimeout
  types:
  - <xref:str>
methods:
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.allowSkillsetToReadFileData
  name: allowSkillsetToReadFileData
  summary: 'If true, will create a path //document//file_data that is an object representing
    the original

    file data downloaded from your blob data source. This allows you to pass the original
    file data

    to a custom skill for processing within the enrichment pipeline, or to the Document
    Extraction

    skill.'
  signature: 'allowSkillsetToReadFileData: bool'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.dataToExtract
  name: dataToExtract
  summary: 'Specifies the data to extract from Azure blob storage and tells the indexer
    which data to

    extract from image content when "imageAction" is set to a value other than "none".  This

    applies to embedded image content in a .PDF or other application, or image files
    such as .jpg

    and .png, in Azure blobs. Known values are: "storageMetadata", "allMetadata",
    and

    "contentAndMetadata".'
  signature: 'dataToExtract: str | BlobIndexerDataToExtract'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.delimitedTextDelimiter
  name: delimitedTextDelimiter
  summary: 'For CSV blobs, specifies the end-of-line single-character delimiter for
    CSV files where each

    line starts a new document (for example, "|").'
  signature: 'delimitedTextDelimiter: str'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.delimitedTextHeaders
  name: delimitedTextHeaders
  summary: 'For CSV blobs, specifies a comma-delimited list of column headers, useful
    for mapping source

    fields to destination fields in an index.'
  signature: 'delimitedTextHeaders: str'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.documentRoot
  name: documentRoot
  summary: 'For JSON arrays, given a structured or semi-structured document, you can
    specify a path to the

    array using this property.'
  signature: 'documentRoot: str'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.excludedFileNameExtensions
  name: excludedFileNameExtensions
  summary: 'Comma-delimited list of filename extensions to ignore when processing
    from Azure blob storage.

    For example, you could exclude ".png, .mp4" to skip over those files during indexing.'
  signature: 'excludedFileNameExtensions: str'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.executionEnvironment
  name: executionEnvironment
  summary: '"standard"

    and "private".'
  signature: 'executionEnvironment: str | IndexerExecutionEnvironment'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.failOnUnprocessableDocument
  name: failOnUnprocessableDocument
  summary: For Azure blobs, set to false if you want to continue indexing if a document
    fails indexing.
  signature: 'failOnUnprocessableDocument: bool'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.failOnUnsupportedContentType
  name: failOnUnsupportedContentType
  summary: 'For Azure blobs, set to false if you want to continue indexing when an
    unsupported content type

    is encountered, and you don''t know all the content types (file extensions) in
    advance.'
  signature: 'failOnUnsupportedContentType: bool'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.firstLineContainsHeaders
  name: firstLineContainsHeaders
  summary: For CSV blobs, indicates that the first (non-blank) line of each blob contains
    headers.
  signature: 'firstLineContainsHeaders: bool'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.imageAction
  name: imageAction
  summary: 'Determines how to process embedded images and image files in Azure blob
    storage.  Setting the

    "imageAction" configuration to any value other than "none" requires that a skillset
    also be

    attached to that indexer. Known values are: "none", "generateNormalizedImages",
    and

    "generateNormalizedImagePerPage".'
  signature: 'imageAction: str | BlobIndexerImageAction'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.indexStorageMetadataOnlyForOversizedDocuments
  name: indexStorageMetadataOnlyForOversizedDocuments
  summary: 'For Azure blobs, set this property to true to still index storage metadata
    for blob content

    that is too large to process. Oversized blobs are treated as errors by default.
    For limits on

    blob size, see [https://learn.microsoft.com/azure/search/search-limits-quotas-capacity](https://learn.microsoft.com/azure/search/search-limits-quotas-capacity).'
  signature: 'indexStorageMetadataOnlyForOversizedDocuments: bool'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.indexedFileNameExtensions
  name: indexedFileNameExtensions
  summary: 'Comma-delimited list of filename extensions to select when processing
    from Azure blob storage.

    For example, you could focus indexing on specific application files ".docx, .pptx,
    .msg" to

    specifically include those file types.'
  signature: 'indexedFileNameExtensions: str'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.markdownHeaderDepth
  name: markdownHeaderDepth
  summary: 'Specifies the max header depth that will be considered while grouping
    markdown content. Default

    is `h6`. Known values are: "h1", "h2", "h3", "h4", "h5", and "h6".'
  signature: 'markdownHeaderDepth: str | MarkdownHeaderDepth | None'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.markdownParsingSubmode
  name: markdownParsingSubmode
  summary: 'Specifies the submode that will determine whether a markdown file will
    be parsed into exactly

    one search document or multiple search documents. Default is `oneToMany`. Known
    values are:

    "oneToMany" and "oneToOne".'
  signature: 'markdownParsingSubmode: str | MarkdownParsingSubmode | None'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.parsingMode
  name: parsingMode
  summary: 'Represents the parsing mode for indexing from an Azure blob data source.
    Known values are:

    "default", "text", "delimitedText", "json", "jsonArray", "jsonLines", and

    "markdown".'
  signature: 'parsingMode: str | BlobIndexerParsingMode'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.pdfTextRotationAlgorithm
  name: pdfTextRotationAlgorithm
  summary: 'Determines algorithm for text extraction from PDF files in Azure blob
    storage. Known values

    are: "none" and "detectAngles".'
  signature: 'pdfTextRotationAlgorithm: str | BlobIndexerPDFTextRotationAlgorithm'
- uid: azure.search.documents.indexes.types.IndexingParametersConfiguration.queryTimeout
  name: queryTimeout
  summary: 'Increases the timeout beyond the 5-minute default for Azure SQL database
    data sources,

    specified in the format "hh:mm:ss".'
  signature: 'queryTimeout: str'
