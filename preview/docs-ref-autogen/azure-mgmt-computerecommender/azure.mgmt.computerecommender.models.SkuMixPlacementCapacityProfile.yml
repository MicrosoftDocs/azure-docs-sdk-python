### YamlMime:PythonClass
uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityProfile
name: SkuMixPlacementCapacityProfile
fullName: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityProfile
module: azure.mgmt.computerecommender.models
summary: Capacity-related properties for the placement request.
constructor:
  syntax: 'SkuMixPlacementCapacityProfile(*args: Any, **kwargs: Any)'
variables:
- description: 'The capacity to run the workload. For VMs: [1..10,000]. For vCPUs:

    [1..100,000]. Required.'
  name: capacity
  types:
  - <xref:int>
- description: 'The unit type for the capacity value. Required. Known values are:
    "VM" and

    "VCpu".'
  name: capacity_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.computerecommender.models.SkuMixPlacementCapacityType>
- description: 'The priority of the VMs to allocate. Required. Known values are: "Regular"
    and

    "Spot".'
  name: priority
  types:
  - <xref:str>
  - <xref:azure.mgmt.computerecommender.models.SkuMixPlacementPriority>
- description: 'Required when priority is Spot. Contains spot-specific

    configuration.'
  name: spot_priority_profile
  types:
  - <xref:azure.mgmt.computerecommender.models.SkuMixPlacementSpotPriorityProfile>
- description: 'The allocation strategy for determining the optimal SKU split. Known

    values are: "LowestPrice", "Prioritized", and "EvictionOptimized".'
  name: allocation_strategy
  types:
  - <xref:str>
  - <xref:azure.mgmt.computerecommender.models.SkuMixPlacementAllocationStrategy>
- description: 'The OS type. Required when allocationStrategy is LowestPrice because
    pricing

    varies by OS. Known values are: "Windows" and "Linux".'
  name: os_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.computerecommender.models.SkuMixPlacementOSType>
- description: 'Zone allocation policy. Default: BestEffortBalanced.'
  name: zone_allocation_policy
  types:
  - <xref:azure.mgmt.computerecommender.models.SkuMixPlacementZoneAllocationPolicy>
attributes:
- uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityProfile.allocation_strategy
  name: allocation_strategy
  summary: 'The allocation strategy for determining the optimal SKU split. Known values
    are:

    "LowestPrice", "Prioritized", and "EvictionOptimized".'
  signature: 'allocation_strategy: str | _models.SkuMixPlacementAllocationStrategy
    | None'
- uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityProfile.capacity
  name: capacity
  summary: '[1..100,000]. Required.'
  signature: 'capacity: int'
- uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityProfile.capacity_type
  name: capacity_type
  summary: '"VM" and "VCpu".'
  signature: 'capacity_type: str | _models.SkuMixPlacementCapacityType'
- uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityProfile.os_type
  name: os_type
  summary: 'The OS type. Required when allocationStrategy is LowestPrice because pricing
    varies by OS.

    Known values are: "Windows" and "Linux".'
  signature: 'os_type: str | _models.SkuMixPlacementOSType | None'
- uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityProfile.priority
  name: priority
  summary: '"Regular" and "Spot".'
  signature: 'priority: str | _models.SkuMixPlacementPriority'
- uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityProfile.spot_priority_profile
  name: spot_priority_profile
  summary: Required when priority is Spot. Contains spot-specific configuration.
  signature: 'spot_priority_profile: _models.SkuMixPlacementSpotPriorityProfile |
    None'
- uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityProfile.zone_allocation_policy
  name: zone_allocation_policy
  summary: BestEffortBalanced.
  signature: 'zone_allocation_policy: _models.SkuMixPlacementZoneAllocationPolicy
    | None'
