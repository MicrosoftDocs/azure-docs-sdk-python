### YamlMime:PythonClass
uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityLimit
name: SkuMixPlacementCapacityLimit
fullName: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityLimit
module: azure.mgmt.computerecommender.models
summary: 'Capacity availability for a single requested (VM size, zone) combination,
  independent of the

  recommended placement.'
constructor:
  syntax: 'SkuMixPlacementCapacityLimit(*args: Any, **kwargs: Any)'
variables:
- description: VM size name (e.g. Standard_D2s_v3). Required.
  name: name
  types:
  - <xref:str>
- description: 'Priority of this entry (Regular or Spot). Required. Known values are:
    "Regular"

    and "Spot".'
  name: priority
  types:
  - <xref:str>
  - <xref:azure.mgmt.computerecommender.models.SkuMixPlacementPriority>
- description: Logical zone (e.g. "1", "2", "3"). Omitted or empty for regional requests.
  name: zone
  types:
  - <xref:str>
- description: 'Upper bound, in VMs, on how much capacity can be allocated for this
    (VM size,

    zone): the smallest of the requested capacity, the available capacity, and the
    available quota,

    but never below the capacity already recommended for the slot. 0 when nothing
    is available.

    Required.'
  name: limit
  types:
  - <xref:int>
- description: 'Why the limit is below the requested capacity, or None when the request
    is fully

    available. Required. Known values are: "None", "InsufficientCapacity", "InsufficientQuota",
    and

    "SkuNotAvailable".'
  name: reason
  types:
  - <xref:str>
  - <xref:azure.mgmt.computerecommender.models.SkuMixPlacementCapacityLimitReason>
attributes:
- uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityLimit.limit
  name: limit
  summary: 'the

    smallest of the requested capacity, the available capacity, and the available
    quota, but never

    below the capacity already recommended for the slot. 0 when nothing is available.
    Required.'
  signature: 'limit: int'
- uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityLimit.name
  name: name
  summary: VM size name (e.g. Standard_D2s_v3). Required.
  signature: 'name: str'
- uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityLimit.priority
  name: priority
  summary: '"Regular" and "Spot".'
  signature: 'priority: str | _models.SkuMixPlacementPriority'
- uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityLimit.reason
  name: reason
  summary: 'Why the limit is below the requested capacity, or None when the request
    is fully available.

    Required. Known values are: "None", "InsufficientCapacity", "InsufficientQuota",
    and

    "SkuNotAvailable".'
  signature: 'reason: str | _models.SkuMixPlacementCapacityLimitReason'
- uid: azure.mgmt.computerecommender.models.SkuMixPlacementCapacityLimit.zone
  name: zone
  summary: Logical zone (e.g. "1", "2", "3"). Omitted or empty for regional requests.
  signature: 'zone: str | None'
