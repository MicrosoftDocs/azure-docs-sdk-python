### YamlMime:PythonClass
uid: azure.mgmt.computerecommender.types.SkuMixPlacementCapacityProfile
name: SkuMixPlacementCapacityProfile
fullName: azure.mgmt.computerecommender.types.SkuMixPlacementCapacityProfile
module: azure.mgmt.computerecommender.types
summary: Capacity-related properties for the placement request.
constructor:
  syntax: SkuMixPlacementCapacityProfile()
variables:
- description: 'The capacity to run the workload. For VMs: [1..10,000]. For vCPUs:

    [1..100,000]. Required.'
  name: capacity
  types:
  - <xref:int>
- description: 'The unit type for the capacity value. Required. Known values are:
    "VM" and

    "VCpu".'
  name: capacityType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SkuMixPlacementCapacityType">]
- description: 'The priority of the VMs to allocate. Required. Known values are: "Regular"
    and

    "Spot".'
  name: priority
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SkuMixPlacementPriority">]
- description: 'Required when priority is Spot. Contains spot-specific

    configuration.'
  name: spotPriorityProfile
  types:
  - <xref:<xref:"SkuMixPlacementSpotPriorityProfile">>
- description: 'The allocation strategy for determining the optimal SKU split. Known

    values are: "LowestPrice", "Prioritized", and "EvictionOptimized".'
  name: allocationStrategy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SkuMixPlacementAllocationStrategy">]
- description: 'The OS type. Required when allocationStrategy is LowestPrice because
    pricing

    varies by OS. Known values are: "Windows" and "Linux".'
  name: osType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SkuMixPlacementOSType">]
- description: 'Zone allocation policy. Default: BestEffortBalanced.'
  name: zoneAllocationPolicy
  types:
  - <xref:<xref:"SkuMixPlacementZoneAllocationPolicy">>
attributes:
- uid: azure.mgmt.computerecommender.types.SkuMixPlacementCapacityProfile.allocationStrategy
  name: allocationStrategy
  summary: 'The allocation strategy for determining the optimal SKU split. Known values
    are:

    "LowestPrice", "Prioritized", and "EvictionOptimized".'
  signature: 'allocationStrategy: str | SkuMixPlacementAllocationStrategy'
- uid: azure.mgmt.computerecommender.types.SkuMixPlacementCapacityProfile.capacity
  name: capacity
  summary: '[1..100,000]. Required.'
  signature: 'capacity: Required[int]'
- uid: azure.mgmt.computerecommender.types.SkuMixPlacementCapacityProfile.capacityType
  name: capacityType
  summary: '"VM" and "VCpu".'
  signature: 'capacityType: Required[str | SkuMixPlacementCapacityType]'
- uid: azure.mgmt.computerecommender.types.SkuMixPlacementCapacityProfile.osType
  name: osType
  summary: 'The OS type. Required when allocationStrategy is LowestPrice because pricing
    varies by OS.

    Known values are: "Windows" and "Linux".'
  signature: 'osType: str | SkuMixPlacementOSType'
- uid: azure.mgmt.computerecommender.types.SkuMixPlacementCapacityProfile.priority
  name: priority
  summary: '"Regular" and "Spot".'
  signature: 'priority: Required[str | SkuMixPlacementPriority]'
- uid: azure.mgmt.computerecommender.types.SkuMixPlacementCapacityProfile.spotPriorityProfile
  name: spotPriorityProfile
  summary: Required when priority is Spot. Contains spot-specific configuration.
  signature: 'spotPriorityProfile: SkuMixPlacementSpotPriorityProfile'
- uid: azure.mgmt.computerecommender.types.SkuMixPlacementCapacityProfile.zoneAllocationPolicy
  name: zoneAllocationPolicy
  summary: BestEffortBalanced.
  signature: 'zoneAllocationPolicy: SkuMixPlacementZoneAllocationPolicy'
