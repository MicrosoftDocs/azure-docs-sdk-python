  signature: 'runningState: str | RunningState'
- uid: azure.mgmt.confidentialledger.types.LedgerProperties.scittConfiguration
  name: scittConfiguration
  summary: The SCITT Configuration that needs to be set for the Confidential Ledger.
  signature: 'scittConfiguration: str'
- uid: azure.mgmt.confidentialledger.types.LedgerProperties.storageUsageBytes
  name: storageUsageBytes
  summary: Current storage usage of the Confidential Ledger, in bytes.
  signature: 'storageUsageBytes: int'
- uid: azure.mgmt.confidentialledger.types.LedgerProperties.subjectName
  name: subjectName
  summary: CN=CCF Node.
  signature: 'subjectName: str'
- uid: azure.mgmt.confidentialledger.types.LedgerProperties.workerThreads
  name: workerThreads
  summary: 'Number of additional threads processing incoming client requests in the
    enclave (modify with

    care!).'
  signature: 'workerThreads: int'
- uid: azure.mgmt.confidentialledger.types.LedgerProperties.writeLBAddressPrefix
  name: writeLBAddressPrefix
  summary: write.
  signature: 'writeLBAddressPrefix: str'
