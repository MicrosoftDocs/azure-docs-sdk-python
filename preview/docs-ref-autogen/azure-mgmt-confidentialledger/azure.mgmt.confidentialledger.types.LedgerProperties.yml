### YamlMime:PythonClass
uid: azure.mgmt.confidentialledger.types.LedgerProperties
name: LedgerProperties
fullName: azure.mgmt.confidentialledger.types.LedgerProperties
module: azure.mgmt.confidentialledger.types
summary: Additional Confidential Ledger properties.
constructor:
  syntax: LedgerProperties()
variables:
- description: Unique name for the Confidential Ledger.
  name: ledger_name
  types:
  - <xref:str>
- description: Endpoint for calling Ledger Service.
  name: ledger_uri
  types:
  - <xref:str>
- description: Endpoint for accessing network identity.
  name: identity_service_uri
  types:
  - <xref:str>
- description: Internal namespace for the Ledger.
  name: ledger_internal_namespace
  types:
  - <xref:str>
- description: 'Object representing RunningState for Ledger. Known values are: "Active",

    "Paused", "Unknown", "Pausing", and "Resuming".'
  name: running_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RunningState">]
- description: 'Type of Confidential Ledger. Known values are: "Unknown", "Public",
    and

    "Private".'
  name: ledger_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LedgerType">]
- description: 'Provisioning state of Ledger Resource. Known values are: "Unknown",

    "Succeeded", "Failed", "Canceled", "Creating", "Deleting", and "Updating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'SKU associated with the ledger. Known values are: "Standard", "Basic",
    and

    "Unknown".'
  name: ledger_sku
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LedgerSku">]
- description: Array of all AAD based Security Principals.
  name: aad_based_security_principals
  types:
  - <xref:list>[<xref:"AADBasedSecurityPrincipal">]
- description: Array of all cert based Security Principals.
  name: cert_based_security_principals
  types:
  - <xref:list>[<xref:"CertBasedSecurityPrincipal">]
- description: 'CCF Property for the logging level for the untrusted host: Trace,
    Debug,

    Info, Fail, Fatal.'
  name: host_level
  types:
  - <xref:str>
- description: 'CCF Property for the maximum size of the http request body: 1MB,

    5MB, 10MB.'
  name: max_body_size_in_mb
  types:
  - <xref:int>
- description: 'CCF Property for the subject name to include in the node certificate.

    Default: CN=CCF Node.'
  name: subject_name
  types:
  - <xref:str>
- description: Number of CCF nodes in the ACC Ledger.
  name: node_count
  types:
  - <xref:int>
- description: 'Prefix for the write load balancer. Example: write.'
  name: write_lb_address_prefix
  types:
  - <xref:str>
- description: 'Number of additional threads processing incoming client requests in
    the

    enclave (modify with care!).'
  name: worker_threads
  types:
  - <xref:int>
- description: 'Enclave platform of the Confidential Ledger. Known values are:

    "IntelSgx" and "AmdSevSnp".'
  name: enclave_platform
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EnclavePlatform">]
- description: 'Application type of the Confidential Ledger. Known values are:

    "ConfidentialLedger" and "CodeTransparency".'
  name: application_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationType">]
- description: 'The SCITT Configuration that needs to be set for the Confidential

    Ledger.'
  name: scitt_configuration
  types:
  - <xref:str>
- description: Current storage usage of the Confidential Ledger, in bytes.
  name: storage_usage_bytes
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.confidentialledger.types.LedgerProperties.aadBasedSecurityPrincipals
  name: aadBasedSecurityPrincipals
  summary: Array of all AAD based Security Principals.
  signature: 'aadBasedSecurityPrincipals: list[''AADBasedSecurityPrincipal'']'
- uid: azure.mgmt.confidentialledger.types.LedgerProperties.applicationType
  name: applicationType
  summary: '"ConfidentialLedger" and

    "CodeTransparency".'
  signature: 'applicationType: str | ApplicationType'
- uid: azure.mgmt.confidentialledger.types.LedgerProperties.certBasedSecurityPrincipals
  name: certBasedSecurityPrincipals
  summary: Array of all cert based Security Principals.
  signature: 'certBasedSecurityPrincipals: list[''CertBasedSecurityPrincipal'']'
- uid: azure.mgmt.confidentialledger.types.LedgerProperties.enclavePlatform
  name: enclavePlatform
  summary: '"IntelSgx" and "AmdSevSnp".'
  signature: 'enclavePlatform: str | EnclavePlatform'
