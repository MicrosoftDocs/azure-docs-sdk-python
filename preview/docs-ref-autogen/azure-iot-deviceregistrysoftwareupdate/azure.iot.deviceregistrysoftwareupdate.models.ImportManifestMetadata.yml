variables:
- description: 'Azure Blob location from which the import manifest can be downloaded
    by Device

    Update for Device Registry. This is typically a read-only SAS-protected blob URL
    with an

    expiration set to at least 4 hours. Required.'
  name: url
  types:
  - <xref:str>
- description: File size in number of bytes. Required.
  name: size_in_bytes
  types:
  - <xref:int>
- description: 'A JSON object containing the hash(es) of the file. At least SHA256
    hash is

    required. This object can be thought of as a set of key-value pairs where the
    key is the hash

    algorithm, and the value is the hash of the file calculated using that algorithm.
    Required.'
