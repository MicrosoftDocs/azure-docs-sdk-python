uid: azure.iot.deviceregistrysoftwareupdate.types.FileImportMetadata
name: FileImportMetadata
fullName: azure.iot.deviceregistrysoftwareupdate.types.FileImportMetadata
module: azure.iot.deviceregistrysoftwareupdate.types
summary: Metadata describing an update file.
constructor:
