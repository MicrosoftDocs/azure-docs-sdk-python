### YamlMime:PythonClass
uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata
name: ImportManifestMetadata
fullName: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata
module: azure.iot.deviceregistrysoftwareupdate.types
summary: 'Metadata describing the import manifest, a document which describes the
  files and other

  metadata about an update version.'
constructor:
  syntax: ImportManifestMetadata()
variables:
- description: 'Azure Blob location from which the import manifest can be downloaded
    by Device

    Update for Device Registry. This is typically a read-only SAS-protected blob URL
    with an

    expiration set to at least 4 hours. Required.'
  name: url
  types:
  - <xref:str>
- description: File size in number of bytes. Required.
  name: sizeInBytes
  types:
  - <xref:int>
- description: 'A JSON object containing the hash(es) of the file. At least SHA256
    hash is

    required. This object can be thought of as a set of key-value pairs where the
    key is the hash

    algorithm, and the value is the hash of the file calculated using that algorithm.
    Required.'
  name: hashes
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
methods:
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.hashes
  name: hashes
  summary: 'A JSON object containing the hash(es) of the file. At least SHA256 hash
    is required. This

    object can be thought of as a set of key-value pairs where the key is the hash
    algorithm, and

    the value is the hash of the file calculated using that algorithm. Required.'
  signature: 'hashes: dict[str, str]'
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.sizeInBytes
  name: sizeInBytes
  summary: File size in number of bytes. Required.
  signature: 'sizeInBytes: int'
- uid: azure.iot.deviceregistrysoftwareupdate.types.ImportManifestMetadata.url
  name: url
  summary: 'Azure Blob location from which the import manifest can be downloaded by
    Device Update for

    Device Registry. This is typically a read-only SAS-protected blob URL with an
    expiration set to

    at least 4 hours. Required.'
  signature: 'url: str'
