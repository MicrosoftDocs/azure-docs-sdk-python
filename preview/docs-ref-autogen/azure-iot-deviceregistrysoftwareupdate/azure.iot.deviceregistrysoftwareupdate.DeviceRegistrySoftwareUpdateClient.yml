name: DeviceRegistrySoftwareUpdateClient
fullName: azure.iot.deviceregistrysoftwareupdate.DeviceRegistrySoftwareUpdateClient
module: azure.iot.deviceregistrysoftwareupdate
summary: 'Software Update for Device Registry is an Azure service that enables customers
  to publish

  updates for their IoT devices to the cloud, and then deploy that update to their
  devices

  (approve updates to groups of devices managed and provisioned in Device Registry).
  It leverages

  the proven security and reliability of the Windows Update platform, optimized for
  IoT devices.

  It works globally and knows when and how to update devices, enabling customers to
  focus on

  their business goals and let Software Update for Device Registry handle the updates.'
