uid: azure.mgmt.iothub.types.RoutingEventHubProperties
name: RoutingEventHubProperties
fullName: azure.mgmt.iothub.types.RoutingEventHubProperties
module: azure.mgmt.iothub.types
summary: The properties related to an event hub endpoint.
constructor:
  syntax: RoutingEventHubProperties()
variables:
- description: Id of the event hub endpoint.
  name: id
  types:
  - <xref:str>
- description: The connection string of the event hub endpoint.
  name: connection_string
  types:
  - <xref:str>
- description: The url of the event hub endpoint. It must include the protocol sb://.
  name: endpoint_uri
  types:
  - <xref:str>
- description: Event hub name on the event hub namespace.
  name: entity_path
  types:
  - <xref:str>
- description: 'Method used to authenticate against the event hub endpoint. Known

    values are: "keyBased" and "identityBased".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AuthenticationType">]
- description: Managed identity properties of routing event hub endpoint.
  name: identity
  types:
  - <xref:<xref:"ManagedIdentity">>
- description: 'The name that identifies this endpoint. The name can only include
    alphanumeric

    characters, periods, underscores, hyphens and has a maximum length of 64 characters.
    The

    following names are reserved:  events, fileNotifications, $default. Endpoint names
    must be

    unique across endpoint types. Required.'
  name: name
  types:
  - <xref:str>
- description: The subscription identifier of the event hub endpoint.
  name: subscription_id
  types:
  - <xref:str>
- description: The name of the resource group of the event hub endpoint.
  name: resource_group
  types:
  - <xref:str>
