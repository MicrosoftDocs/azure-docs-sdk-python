### YamlMime:PythonClass
uid: azure.mgmt.iothub.types.RoutingEndpoints
name: RoutingEndpoints
fullName: azure.mgmt.iothub.types.RoutingEndpoints
module: azure.mgmt.iothub.types
summary: 'The properties related to the custom endpoints to which your IoT hub routes
  messages based on

  the routing rules. A maximum of 10 custom endpoints are allowed across all endpoint
  types for

  paid hubs and only 1 custom endpoint is allowed across all endpoint types for free
  hubs.'
constructor:
  syntax: RoutingEndpoints()
variables:
- description: 'The list of Service Bus queue endpoints that IoT hub routes the

    messages to, based on the routing rules.'
  name: service_bus_queues
  types:
  - <xref:list>[<xref:"RoutingServiceBusQueueEndpointProperties">]
- description: 'The list of Service Bus topic endpoints that the IoT hub routes the

    messages to, based on the routing rules.'
  name: service_bus_topics
  types:
  - <xref:list>[<xref:"RoutingServiceBusTopicEndpointProperties">]
- description: 'The list of Event Hubs endpoints that IoT hub routes messages to,
    based on

    the routing rules. This list does not include the built-in Event Hubs endpoint.'
  name: event_hubs
  types:
  - <xref:list>[<xref:"RoutingEventHubProperties">]
- description: 'The list of storage container endpoints that IoT hub routes messages

    to, based on the routing rules.'
  name: storage_containers
  types:
  - <xref:list>[<xref:"RoutingStorageContainerProperties">]
- description: 'The list of Cosmos DB container endpoints that IoT hub routes

    messages to, based on the routing rules.'
  name: cosmos_db_sql_containers
  types:
  - <xref:list>[<xref:"RoutingCosmosDBSqlApiProperties">]
- description: 'The list of event stream endpoints that IoT hub routes messages to,
    based

    on the routing rules.'
  name: event_streams
  types:
  - <xref:list>[<xref:"RoutingEventStreamProperties">]
attributes:
- uid: azure.mgmt.iothub.types.RoutingEndpoints.cosmosDBSqlContainers
  name: cosmosDBSqlContainers
  summary: 'The list of Cosmos DB container endpoints that IoT hub routes messages
    to, based on the routing

    rules.'
  signature: 'cosmosDBSqlContainers: list[azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties]'
- uid: azure.mgmt.iothub.types.RoutingEndpoints.eventHubs
  name: eventHubs
  summary: 'The list of Event Hubs endpoints that IoT hub routes messages to, based
    on the routing rules.

    This list does not include the built-in Event Hubs endpoint.'
  signature: 'eventHubs: list[azure.mgmt.iothub.types.RoutingEventHubProperties]'
- uid: azure.mgmt.iothub.types.RoutingEndpoints.eventStreams
  name: eventStreams
  summary: The list of event stream endpoints that IoT hub routes messages to, based
    on the routing rules.
  signature: 'eventStreams: list[azure.mgmt.iothub.types.RoutingEventStreamProperties]'
- uid: azure.mgmt.iothub.types.RoutingEndpoints.serviceBusQueues
  name: serviceBusQueues
  summary: 'The list of Service Bus queue endpoints that IoT hub routes the messages
    to, based on the

    routing rules.'
  signature: 'serviceBusQueues: list[azure.mgmt.iothub.types.RoutingServiceBusQueueEndpointProperties]'
- uid: azure.mgmt.iothub.types.RoutingEndpoints.serviceBusTopics
  name: serviceBusTopics
  summary: 'The list of Service Bus topic endpoints that the IoT hub routes the messages
    to, based on the

    routing rules.'
  signature: 'serviceBusTopics: list[azure.mgmt.iothub.types.RoutingServiceBusTopicEndpointProperties]'
- uid: azure.mgmt.iothub.types.RoutingEndpoints.storageContainers
  name: storageContainers
  summary: 'The list of storage container endpoints that IoT hub routes messages to,
    based on the routing

    rules.'
  signature: 'storageContainers: list[azure.mgmt.iothub.types.RoutingStorageContainerProperties]'
