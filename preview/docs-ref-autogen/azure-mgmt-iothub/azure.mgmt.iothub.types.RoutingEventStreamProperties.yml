### YamlMime:PythonClass
uid: azure.mgmt.iothub.types.RoutingEventStreamProperties
name: RoutingEventStreamProperties
fullName: azure.mgmt.iothub.types.RoutingEventStreamProperties
module: azure.mgmt.iothub.types
summary: The properties related to an event stream endpoint.
constructor:
  syntax: RoutingEventStreamProperties()
variables:
- description: 'The name that identifies this endpoint. The name can only include
    alphanumeric

    characters, periods, underscores, hyphens and has a maximum length of 64 characters.
    The

    following names are reserved:  events, fileNotifications, $default. Endpoint names
    must be

    unique across endpoint types. Required.'
  name: name
  types:
  - <xref:str>
- description: Id of the event stream endpoint.
  name: id
  types:
  - <xref:str>
- description: 'The url of the underlying event hub namespace of the event stream
    endpoint.

    It must include the protocol sb://. Required.'
  name: endpoint_uri
  types:
  - <xref:str>
- description: Event hub name on the event hub namespace. Required.
  name: entity_path
  types:
  - <xref:str>
- description: 'Method used to authenticate against the event stream endpoint.

    "identityBased"'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EventStreamAuthenticationType">]
- description: Managed identity properties of routing event stream endpoint.
  name: identity
  types:
  - <xref:<xref:"ManagedIdentity">>
- description: 'The unique GUID of the target Microsoft Fabric workspace for the event

    stream endpoint.'
  name: workspace_id
  types:
  - <xref:str>
- description: The unique GUID of the target event stream under the workspace.
  name: event_stream_id
  types:
  - <xref:str>
- description: The unique GUID of the custom source for the event stream.
  name: source_id
  types:
  - <xref:str>
