### YamlMime:PythonClass
uid: azure.mgmt.iothub.types.ImportDevicesRequest
name: ImportDevicesRequest
fullName: azure.mgmt.iothub.types.ImportDevicesRequest
module: azure.mgmt.iothub.types
summary: Use to provide parameters when requesting an import of all devices in the
  hub.
constructor:
  syntax: ImportDevicesRequest()
variables:
- description: The input blob container URI. Required.
  name: input_blob_container_uri
  types:
  - <xref:str>
- description: The output blob container URI. Required.
  name: output_blob_container_uri
  types:
  - <xref:str>
- description: 'The blob name to be used when importing from the provided input blob

    container.'
  name: input_blob_name
  types:
  - <xref:str>
- description: The blob name to use for storing the status of the import job.
  name: output_blob_name
  types:
  - <xref:str>
- description: 'Specifies authentication type being used for connecting to the

    storage account. Known values are: "keyBased" and "identityBased".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AuthenticationType">]
- description: Managed identity properties of storage endpoint for import devices.
  name: identity
  types:
  - <xref:<xref:"ManagedIdentity">>
- description: The value indicating whether configurations should be imported.
  name: include_configurations
  types:
  - <xref:bool>
- description: 'The blob name to be used when importing configurations from the

    provided input blob container.'
  name: configurations_blob_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.iothub.types.ImportDevicesRequest.authenticationType
  name: authenticationType
  summary: 'Specifies authentication type being used for connecting to the storage
    account. Known values

    are: "keyBased" and "identityBased".'
  signature: 'authenticationType: str | AuthenticationType'
- uid: azure.mgmt.iothub.types.ImportDevicesRequest.configurationsBlobName
  name: configurationsBlobName
  summary: The blob name to be used when importing configurations from the provided
    input blob container.
  signature: 'configurationsBlobName: str'
- uid: azure.mgmt.iothub.types.ImportDevicesRequest.identity
  name: identity
  summary: Managed identity properties of storage endpoint for import devices.
  signature: 'identity: ManagedIdentity'
- uid: azure.mgmt.iothub.types.ImportDevicesRequest.includeConfigurations
  name: includeConfigurations
  summary: The value indicating whether configurations should be imported.
  signature: 'includeConfigurations: bool'
- uid: azure.mgmt.iothub.types.ImportDevicesRequest.inputBlobContainerUri
  name: inputBlobContainerUri
  summary: The input blob container URI. Required.
  signature: 'inputBlobContainerUri: Required[str]'
- uid: azure.mgmt.iothub.types.ImportDevicesRequest.inputBlobName
  name: inputBlobName
  summary: The blob name to be used when importing from the provided input blob container.
  signature: 'inputBlobName: str'
- uid: azure.mgmt.iothub.types.ImportDevicesRequest.outputBlobContainerUri
  name: outputBlobContainerUri
  summary: The output blob container URI. Required.
  signature: 'outputBlobContainerUri: Required[str]'
- uid: azure.mgmt.iothub.types.ImportDevicesRequest.outputBlobName
  name: outputBlobName
  summary: The blob name to use for storing the status of the import job.
  signature: 'outputBlobName: str'
