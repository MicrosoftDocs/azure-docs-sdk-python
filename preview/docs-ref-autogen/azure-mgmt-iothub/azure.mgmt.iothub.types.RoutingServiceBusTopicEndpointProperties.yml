### YamlMime:PythonClass
uid: azure.mgmt.iothub.types.RoutingServiceBusTopicEndpointProperties
name: RoutingServiceBusTopicEndpointProperties
fullName: azure.mgmt.iothub.types.RoutingServiceBusTopicEndpointProperties
module: azure.mgmt.iothub.types
summary: The properties related to service bus topic endpoint types.
constructor:
  syntax: RoutingServiceBusTopicEndpointProperties()
variables:
- description: Id of the service bus topic endpoint.
  name: id
  types:
  - <xref:str>
- description: The connection string of the service bus topic endpoint.
  name: connection_string
  types:
  - <xref:str>
- description: 'The url of the service bus topic endpoint. It must include the protocol

    sb://.'
  name: endpoint_uri
  types:
  - <xref:str>
- description: Queue name on the service bus topic.
  name: entity_path
  types:
  - <xref:str>
- description: 'Method used to authenticate against the service bus topic endpoint.

    Known values are: "keyBased" and "identityBased".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AuthenticationType">]
- description: Managed identity properties of routing service bus topic endpoint.
  name: identity
  types:
  - <xref:<xref:"ManagedIdentity">>
- description: 'The name that identifies this endpoint. The name can only include
    alphanumeric

    characters, periods, underscores, hyphens and has a maximum length of 64 characters.
    The

    following names are reserved:  events, fileNotifications, $default. Endpoint names
    must be

    unique across endpoint types.  The name need not be the same as the actual topic
    name.

    Required.'
  name: name
  types:
  - <xref:str>
- description: The subscription identifier of the service bus topic endpoint.
  name: subscription_id
  types:
  - <xref:str>
- description: The name of the resource group of the service bus topic endpoint.
  name: resource_group
  types:
  - <xref:str>
