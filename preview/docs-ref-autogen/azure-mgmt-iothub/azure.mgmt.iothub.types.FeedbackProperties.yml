### YamlMime:PythonClass
uid: azure.mgmt.iothub.types.FeedbackProperties
name: FeedbackProperties
fullName: azure.mgmt.iothub.types.FeedbackProperties
module: azure.mgmt.iothub.types
summary: The properties of the feedback queue for cloud-to-device messages.
constructor:
  syntax: FeedbackProperties()
variables:
- description: 'The lock duration for the feedback queue. See:

    [https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-messaging#cloud-to-device-messages](https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-messaging#cloud-to-device-messages).'
  name: lock_duration_as_iso8601
  types:
  - <xref:str>
- description: 'The period of time for which a message is available to consume before
    it

    is expired by the IoT hub. See:

    [https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-messaging#cloud-to-device-messages](https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-messaging#cloud-to-device-messages).'
  name: ttl_as_iso8601
  types:
  - <xref:str>
- description: 'The number of times the IoT hub attempts to deliver a message on the

    feedback queue. See:

    [https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-messaging#cloud-to-device-messages](https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-messaging#cloud-to-device-messages).'
  name: max_delivery_count
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.iothub.types.FeedbackProperties.lockDurationAsIso8601
  name: lockDurationAsIso8601
  summary: 'The lock duration for the feedback queue. See:

    [https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-messaging#cloud-to-device-messages](https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-messaging#cloud-to-device-messages).'
  signature: 'lockDurationAsIso8601: str'
- uid: azure.mgmt.iothub.types.FeedbackProperties.maxDeliveryCount
  name: maxDeliveryCount
  summary: 'The number of times the IoT hub attempts to deliver a message on the feedback
    queue. See:

    [https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-messaging#cloud-to-device-messages](https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-messaging#cloud-to-device-messages).'
  signature: 'maxDeliveryCount: int'
- uid: azure.mgmt.iothub.types.FeedbackProperties.ttlAsIso8601
  name: ttlAsIso8601
  summary: 'The period of time for which a message is available to consume before
    it is expired by the IoT

    hub. See:

    [https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-messaging#cloud-to-device-messages](https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-messaging#cloud-to-device-messages).'
  signature: 'ttlAsIso8601: str'
