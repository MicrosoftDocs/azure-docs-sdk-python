### YamlMime:PythonClass
uid: azure.mgmt.iothub.types.StorageEndpointProperties
name: StorageEndpointProperties
fullName: azure.mgmt.iothub.types.StorageEndpointProperties
module: azure.mgmt.iothub.types
summary: The properties of the Azure Storage endpoint for file upload.
constructor:
  syntax: StorageEndpointProperties()
variables:
- description: 'The period of time for which the SAS URI generated by IoT Hub for

    file upload is valid. See:

    [https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-file-upload#file-upload-notification-configuration-options](https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-file-upload#file-upload-notification-configuration-options).'
  name: sas_ttl_as_iso8601
  types:
  - <xref:str>
- description: 'The connection string for the Azure Storage account to which files
    are

    uploaded. Required.'
  name: connection_string
  types:
  - <xref:str>
- description: 'The name of the root container where you upload files. The container
    need

    not exist but should be creatable using the connectionString specified. Required.'
  name: container_name
  types:
  - <xref:str>
- description: 'Specifies authentication type being used for connecting to the

    storage account. Known values are: "keyBased" and "identityBased".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AuthenticationType">]
- description: Managed identity properties of storage endpoint for file upload.
  name: identity
  types:
  - <xref:<xref:"ManagedIdentity">>
attributes:
- uid: azure.mgmt.iothub.types.StorageEndpointProperties.authenticationType
  name: authenticationType
  summary: 'Specifies authentication type being used for connecting to the storage
    account. Known values

    are: "keyBased" and "identityBased".'
  signature: 'authenticationType: str | AuthenticationType'
- uid: azure.mgmt.iothub.types.StorageEndpointProperties.connectionString
  name: connectionString
  summary: The connection string for the Azure Storage account to which files are
    uploaded. Required.
  signature: 'connectionString: Required[str]'
- uid: azure.mgmt.iothub.types.StorageEndpointProperties.containerName
  name: containerName
  summary: 'The name of the root container where you upload files. The container need
    not exist but should

    be creatable using the connectionString specified. Required.'
  signature: 'containerName: Required[str]'
- uid: azure.mgmt.iothub.types.StorageEndpointProperties.identity
  name: identity
  summary: Managed identity properties of storage endpoint for file upload.
  signature: 'identity: ManagedIdentity'
- uid: azure.mgmt.iothub.types.StorageEndpointProperties.sasTtlAsIso8601
  name: sasTtlAsIso8601
  summary: 'The period of time for which the SAS URI generated by IoT Hub for file
    upload is valid. See:

    [https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-file-upload#file-upload-notification-configuration-options](https://docs.microsoft.com/azure/iot-hub/iot-hub-devguide-file-upload#file-upload-notification-configuration-options).'
  signature: 'sasTtlAsIso8601: str'
