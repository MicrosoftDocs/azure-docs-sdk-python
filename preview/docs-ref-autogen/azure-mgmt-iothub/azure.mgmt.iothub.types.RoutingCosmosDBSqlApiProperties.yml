### YamlMime:PythonClass
uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties
name: RoutingCosmosDBSqlApiProperties
fullName: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties
module: azure.mgmt.iothub.types
summary: The properties related to a cosmos DB sql container endpoint.
constructor:
  syntax: RoutingCosmosDBSqlApiProperties()
variables:
- description: 'The name that identifies this endpoint. The name can only include
    alphanumeric

    characters, periods, underscores, hyphens and has a maximum length of 64 characters.
    The

    following names are reserved:  events, fileNotifications, $default. Endpoint names
    must be

    unique across endpoint types. Required.'
  name: name
  types:
  - <xref:str>
- description: Id of the cosmos DB sql container endpoint.
  name: id
  types:
  - <xref:str>
- description: The subscription identifier of the cosmos DB account.
  name: subscription_id
  types:
  - <xref:str>
- description: The name of the resource group of the cosmos DB account.
  name: resource_group
  types:
  - <xref:str>
- description: 'The url of the cosmos DB account. It must include the protocol [https://](https://).

    Required.'
  name: endpoint_uri
  types:
  - <xref:str>
- description: 'Method used to authenticate against the cosmos DB sql container

    endpoint. Known values are: "keyBased" and "identityBased".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AuthenticationType">]
- description: Managed identity properties of routing cosmos DB container endpoint.
  name: identity
  types:
  - <xref:<xref:"ManagedIdentity">>
- description: The primary key of the cosmos DB account.
  name: primary_key
  types:
  - <xref:str>
- description: The secondary key of the cosmos DB account.
  name: secondary_key
  types:
  - <xref:str>
- description: The name of the cosmos DB database in the cosmos DB account. Required.
  name: database_name
  types:
  - <xref:str>
- description: 'The name of the cosmos DB sql container in the cosmos DB database.

    Required.'
  name: container_name
  types:
  - <xref:str>
- description: 'The name of the partition key associated with this cosmos DB sql

    container if one exists. This is an optional parameter.'
  name: partition_key_name
  types:
  - <xref:str>
- description: 'The template for generating a synthetic partition key value for

    use with this cosmos DB sql container. The template must include at least one
    of the following

    placeholders: {iothub}, {deviceid}, {DD}, {MM}, and {YYYY}. Any one placeholder
    may be

    specified at most once, but order and non-placeholder components are arbitrary.
    This parameter

    is only required if PartitionKeyName is specified.'
  name: partition_key_template
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.authenticationType
  name: authenticationType
  summary: 'Method used to authenticate against the cosmos DB sql container endpoint.
    Known values are:

    "keyBased" and "identityBased".'
  signature: 'authenticationType: str | AuthenticationType'
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.containerName
  name: containerName
  summary: The name of the cosmos DB sql container in the cosmos DB database. Required.
  signature: 'containerName: Required[str]'
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.databaseName
  name: databaseName
  summary: The name of the cosmos DB database in the cosmos DB account. Required.
  signature: 'databaseName: Required[str]'
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.endpointUri
  name: endpointUri
  summary: //. Required.
  signature: 'endpointUri: Required[str]'
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.id
  name: id
  summary: Id of the cosmos DB sql container endpoint.
  signature: 'id: str'
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.identity
  name: identity
  summary: Managed identity properties of routing cosmos DB container endpoint.
  signature: 'identity: ManagedIdentity'
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.name
  name: name
  summary: 'The name that identifies this endpoint. The name can only include alphanumeric
    characters,

    periods, underscores, hyphens and has a maximum length of 64 characters. The following
    names

    are reserved:  events, fileNotifications, $default. Endpoint names must be unique
    across

    endpoint types. Required.'
  signature: 'name: Required[str]'
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.partitionKeyName
  name: partitionKeyName
  summary: 'The name of the partition key associated with this cosmos DB sql container
    if one exists. This

    is an optional parameter.'
  signature: 'partitionKeyName: str'
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.partitionKeyTemplate
  name: partitionKeyTemplate
  summary: 'The template for generating a synthetic partition key value for use with
    this cosmos DB sql

    container. The template must include at least one of the following placeholders:
    {iothub},

    {deviceid}, {DD}, {MM}, and {YYYY}. Any one placeholder may be specified at most
    once, but

    order and non-placeholder components are arbitrary. This parameter is only required
    if

    PartitionKeyName is specified.'
  signature: 'partitionKeyTemplate: str'
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.primaryKey
  name: primaryKey
  summary: The primary key of the cosmos DB account.
  signature: 'primaryKey: str'
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.resourceGroup
  name: resourceGroup
  summary: The name of the resource group of the cosmos DB account.
  signature: 'resourceGroup: str'
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.secondaryKey
  name: secondaryKey
  summary: The secondary key of the cosmos DB account.
  signature: 'secondaryKey: str'
- uid: azure.mgmt.iothub.types.RoutingCosmosDBSqlApiProperties.subscriptionId
  name: subscriptionId
  summary: The subscription identifier of the cosmos DB account.
  signature: 'subscriptionId: str'
