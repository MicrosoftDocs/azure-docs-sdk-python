  name: connectionString
  summary: The connection string of the storage account.
  signature: 'connectionString: str'
- uid: azure.mgmt.iothub.types.RoutingStorageContainerProperties.containerName
  name: containerName
  summary: The name of storage container in the storage account. Required.
  signature: 'containerName: Required[str]'
- uid: azure.mgmt.iothub.types.RoutingStorageContainerProperties.encoding
  name: encoding
  summary: 'Encoding that is used to serialize messages to blobs. Supported values
    are ''avro'',

    ''avrodeflate'', and ''JSON''. Default value is ''avro''. Known values are: "Avro",

    "AvroDeflate", and "JSON".'
  signature: 'encoding: str | RoutingStorageContainerPropertiesEncoding'
- uid: azure.mgmt.iothub.types.RoutingStorageContainerProperties.endpointUri
  name: endpointUri
  summary: //.
  signature: 'endpointUri: str'
- uid: azure.mgmt.iothub.types.RoutingStorageContainerProperties.fileNameFormat
  name: fileNameFormat
  summary: 'File name format for the blob. Default format is

    {iothub}/{partition}/{YYYY}/{MM}/{DD}/{HH}/{mm}. All parameters are mandatory
    but can be

    reordered.'
  signature: 'fileNameFormat: str'
- uid: azure.mgmt.iothub.types.RoutingStorageContainerProperties.id
  name: id
  summary: Id of the storage container endpoint.
  signature: 'id: str'
- uid: azure.mgmt.iothub.types.RoutingStorageContainerProperties.identity
  name: identity
  summary: Managed identity properties of routing storage endpoint.
  signature: 'identity: ManagedIdentity'
- uid: azure.mgmt.iothub.types.RoutingStorageContainerProperties.maxChunkSizeInBytes
  name: maxChunkSizeInBytes
  summary: 'Maximum number of bytes for each blob written to storage. Value should
    be between

    10485760(10MB) and 524288000(500MB). Default value is 314572800(300MB).'
  signature: 'maxChunkSizeInBytes: int'
- uid: azure.mgmt.iothub.types.RoutingStorageContainerProperties.name
  name: name
  summary: 'The name that identifies this endpoint. The name can only include alphanumeric
    characters,

    periods, underscores, hyphens and has a maximum length of 64 characters. The following
    names

    are reserved:  events, fileNotifications, $default. Endpoint names must be unique
    across

    endpoint types. Required.'
  signature: 'name: Required[str]'
- uid: azure.mgmt.iothub.types.RoutingStorageContainerProperties.resourceGroup
  name: resourceGroup
  summary: The name of the resource group of the storage account.
  signature: 'resourceGroup: str'
