uid: azure.mgmt.cloudhealth.types.LogAnalyticsSignal
name: LogAnalyticsSignal
fullName: azure.mgmt.cloudhealth.types.LogAnalyticsSignal
module: azure.mgmt.cloudhealth.types
summary: A Log Analytics Query signal instance assigned to an entity.
constructor:
  syntax: LogAnalyticsSignal()
variables:
- description: Unique name of the signal within the entity. Required.
  name: name
  types:
  - <xref:str>
- description: 'Optional reference to a signal definition that provides default

    values.'
  name: signalDefinitionName
  types:
  - <xref:str>
- description: Current status of the signal.
  name: status
  types:
  - <xref:<xref:"SignalStatus">>
- description: Kind of the signal instance. Required. LOG_ANALYTICS_QUERY.
  name: signalKind
  types:
  - <xref:typing.Literal>[SignalKind.LOG_ANALYTICS_QUERY]
- description: Query text in KQL syntax.
  name: queryText
  types:
  - <xref:str>
- description: 'Time range of signal. ISO duration format like PT10M. If not specified,
    the

    KQL query must define a time range.'
  name: timeGrain
  types:
  - <xref:str>
- description: 'Name of the column in the result set to evaluate against the thresholds.

    Defaults to the first column in the result set if not specified. The column must
    be numeric.'
  name: valueColumnName
  types:
  - <xref:str>
- description: Display name.
  name: displayName
  types:
  - <xref:str>
- description: 'Interval in which the signal is being evaluated. Defaults to PT1M
    (1

    minute). Known values are: "PT1M", "PT5M", "PT10M", "PT15M", "PT30M", "PT1H",
    and "PT2H".'
  name: refreshInterval
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RefreshInterval">]
- description: Unit of the signal result (e.g. Bytes, MilliSeconds, Percent, Count)).
  name: dataUnit
  types:
  - <xref:str>
- description: Evaluation rules for the signal definition.
  name: evaluationRules
  types:
  - <xref:<xref:"EvaluationRule">>
