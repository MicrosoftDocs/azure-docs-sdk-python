uid: azure.mgmt.cloudhealth.models.HealthReportRequest
name: HealthReportRequest
fullName: azure.mgmt.cloudhealth.models.HealthReportRequest
module: azure.mgmt.cloudhealth.models
summary: Health report that's submitted for a specific signal.
constructor:
  syntax: 'HealthReportRequest(*args: Any, **kwargs: Any)'
variables:
- description: Name of the entity signal to report health for. Required.
  name: signal_name
  types:
  - <xref:str>
- description: 'Health state to report for the signal. Required. Known values are:

    "Healthy", "Degraded", "Unhealthy", and "Unknown".'
  name: health_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.cloudhealth.models.HealthState>
- description: Reported value of the signal.
  name: value
  types:
  - <xref:float>
- description: Evaluation rules that were used to determine the reported health state.
  name: evaluation_rules
  types:
  - <xref:azure.mgmt.cloudhealth.models.HealthReportEvaluationRule>
- description: 'Number of minutes until the health report expires. Defaults to 60
    (1

    hour) if not specified.'
  name: expires_in_minutes
  types:
  - <xref:int>
- description: Optional additional context or description for the health report.
  name: additional_context
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cloudhealth.models.HealthReportRequest.additional_context
  name: additional_context
  summary: Optional additional context or description for the health report.
  signature: 'additional_context: str | None'
- uid: azure.mgmt.cloudhealth.models.HealthReportRequest.evaluation_rules
  name: evaluation_rules
  summary: Evaluation rules that were used to determine the reported health state.
  signature: 'evaluation_rules: _models.HealthReportEvaluationRule | None'
- uid: azure.mgmt.cloudhealth.models.HealthReportRequest.expires_in_minutes
  name: expires_in_minutes
  summary: Number of minutes until the health report expires. Defaults to 60 (1 hour)
    if not specified.
  signature: 'expires_in_minutes: int | None'
- uid: azure.mgmt.cloudhealth.models.HealthReportRequest.health_state
  name: health_state
  summary: '"Healthy", "Degraded",

    "Unhealthy", and "Unknown".'
  signature: 'health_state: str | _models.HealthState'
- uid: azure.mgmt.cloudhealth.models.HealthReportRequest.signal_name
  name: signal_name
  summary: Name of the entity signal to report health for. Required.
  signature: 'signal_name: str'
- uid: azure.mgmt.cloudhealth.models.HealthReportRequest.value
  name: value
  summary: Reported value of the signal.
  signature: 'value: float | None'
