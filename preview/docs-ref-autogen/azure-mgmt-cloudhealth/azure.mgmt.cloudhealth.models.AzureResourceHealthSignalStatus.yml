### YamlMime:PythonClass
uid: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus
name: AzureResourceHealthSignalStatus
fullName: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus
module: azure.mgmt.cloudhealth.models
summary: 'Status of an Azure Resource Health signal, including availability information
  reported by Azure

  Resource Health.'
constructor:
  syntax: 'AzureResourceHealthSignalStatus(*args: Any, **kwargs: Any)'
variables:
- description: 'Health state of this signal. Known values are: "Healthy", "Degraded",

    "Unhealthy", and "Unknown".'
  name: health_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.cloudhealth.models.HealthState>
- description: Reported value of the signal.
  name: value
  types:
  - <xref:float>
- description: Timestamp when the value was reported.
  name: reported_at
  types:
  - <xref:datetime.datetime>
- description: Error message if the signal status cannot be retrieved.
  name: error
  types:
  - <xref:str>
- description: Additional context as provided by the submitter.
  name: additional_context
  types:
  - <xref:str>
- description: 'Availability state of the Azure resource as reported by Azure

    Resource Health. Known values are: "Available", "Unavailable", "Degraded", and
    "Unknown".'
  name: availability_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.cloudhealth.models.ResourceHealthAvailabilityState>
- description: 'Whether the status changing event was planned or unplanned. Known
    values are:

    "Planned" and "Unplanned".'
  name: category
  types:
  - <xref:str>
  - <xref:azure.mgmt.cloudhealth.models.ResourceHealthCategory>
- description: 'Detailed status of the Azure resource as reported by Azure Resource

    Health.'
  name: detailed_status
  types:
  - <xref:str>
- description: 'Human-readable summary of the current availability state from Azure
    Resource

    Health.'
  name: summary
  types:
  - <xref:str>
- description: 'Reason type for the current availability state (e.g. ''Unplanned'',
    ''Planned'',

    ''UserInitiated''). Known values are: "Unplanned", "Planned", and "UserInitiated".'
  name: reason_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.cloudhealth.models.ResourceHealthReasonType>
- description: 'Whether the current availability state is ''Persistent'' or ''Transient''.

    Known values are: "Persistent" and "Transient".'
  name: reason_chronicity
  types:
  - <xref:str>
  - <xref:azure.mgmt.cloudhealth.models.ResourceHealthReasonChronicity>
- description: 'Timestamp when Azure Resource Health observed the current

    availability state.'
  name: availability_reported_time
  types:
  - <xref:datetime.datetime>
attributes:
