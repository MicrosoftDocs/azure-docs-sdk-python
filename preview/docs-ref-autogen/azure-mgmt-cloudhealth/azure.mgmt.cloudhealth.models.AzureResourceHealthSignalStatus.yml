  name: additional_context
  summary: Additional context as provided by the submitter.
  signature: 'additional_context: str | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus.availability_reported_time
  name: availability_reported_time
  summary: Timestamp when Azure Resource Health observed the current availability
    state.
  signature: 'availability_reported_time: datetime | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus.availability_state
  name: availability_state
  summary: 'Availability state of the Azure resource as reported by Azure Resource
    Health. Known values

    are: "Available", "Unavailable", "Degraded", and "Unknown".'
  signature: 'availability_state: str | _models.ResourceHealthAvailabilityState |
    None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus.category
  name: category
  summary: '"Planned" and

    "Unplanned".'
  signature: 'category: str | _models.ResourceHealthCategory | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus.detailed_status
  name: detailed_status
  summary: Detailed status of the Azure resource as reported by Azure Resource Health.
  signature: 'detailed_status: str | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus.error
  name: error
  summary: Error message if the signal status cannot be retrieved.
  signature: 'error: str | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus.health_state
  name: health_state
  summary: '"Healthy", "Degraded", "Unhealthy", and

    "Unknown".'
  signature: 'health_state: str | _models.HealthState | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus.reason_chronicity
  name: reason_chronicity
  summary: 'Whether the current availability state is ''Persistent'' or ''Transient''.
    Known values are:

    "Persistent" and "Transient".'
  signature: 'reason_chronicity: str | _models.ResourceHealthReasonChronicity | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus.reason_type
  name: reason_type
  summary: 'Reason type for the current availability state (e.g. ''Unplanned'', ''Planned'',
    ''UserInitiated'').

    Known values are: "Unplanned", "Planned", and "UserInitiated".'
  signature: 'reason_type: str | _models.ResourceHealthReasonType | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus.reported_at
  name: reported_at
  summary: Timestamp when the value was reported.
  signature: 'reported_at: datetime | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus.summary
  name: summary
  summary: Human-readable summary of the current availability state from Azure Resource
    Health.
  signature: 'summary: str | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceHealthSignalStatus.value
  name: value
  summary: Reported value of the signal.
  signature: 'value: float | None'
