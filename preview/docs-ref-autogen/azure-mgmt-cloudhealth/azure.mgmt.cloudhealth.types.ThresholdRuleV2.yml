### YamlMime:PythonClass
uid: azure.mgmt.cloudhealth.types.ThresholdRuleV2
name: ThresholdRuleV2
fullName: azure.mgmt.cloudhealth.types.ThresholdRuleV2
module: azure.mgmt.cloudhealth.types
summary: Threshold-based evaluation rule for a signal definition.
constructor:
  syntax: ThresholdRuleV2()
variables:
- description: 'Operator how to compare the signal value with the threshold. Required.
    Known

    values are: "GreaterThan", "LessThan", "LessThanOrEqual", "GreaterThanOrEqual",
    "Equal",

    "NotEqual", and "Dynamic".'
  name: operator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SignalOperator">]
- description: Threshold value.
  name: threshold
  types:
  - <xref:float>
- description: 'Sensitivity level for dynamic threshold detection. Only applicable
    when

    operator is Dynamic. Known values are: "Low", "Medium", and "High".'
  name: sensitivity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DynamicThresholdSensitivity">]
- description: 'ISO 8601 duration for the historical look-back window used by dynamic

    threshold computation. Only applicable when operator is Dynamic. Known values
    are: "PT5M",

    "PT15M", "PT30M", and "PT1H".'
  name: look_back_window
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LookBackWindow">]
attributes:
- uid: azure.mgmt.cloudhealth.types.ThresholdRuleV2.lookBackWindow
  name: lookBackWindow
  summary: 'ISO 8601 duration for the historical look-back window used by dynamic
    threshold computation.

    Only applicable when operator is Dynamic. Known values are: "PT5M", "PT15M", "PT30M",
    and

    "PT1H".'
  signature: 'lookBackWindow: str | LookBackWindow'
- uid: azure.mgmt.cloudhealth.types.ThresholdRuleV2.operator
  name: operator
  summary: 'Operator how to compare the signal value with the threshold. Required.
    Known values are:

    "GreaterThan", "LessThan", "LessThanOrEqual", "GreaterThanOrEqual", "Equal",

    "NotEqual", and "Dynamic".'
  signature: 'operator: Required[str | SignalOperator]'
- uid: azure.mgmt.cloudhealth.types.ThresholdRuleV2.sensitivity
  name: sensitivity
  summary: 'Sensitivity level for dynamic threshold detection. Only applicable when
    operator is Dynamic.

    Known values are: "Low", "Medium", and "High".'
  signature: 'sensitivity: str | DynamicThresholdSensitivity'
- uid: azure.mgmt.cloudhealth.types.ThresholdRuleV2.threshold
  name: threshold
  summary: Threshold value.
  signature: 'threshold: float'
