  signature: 'discoveredBy: str'
- uid: azure.mgmt.cloudhealth.types.EntityProperties.displayName
  name: displayName
  summary: Display name.
  signature: 'displayName: str'
- uid: azure.mgmt.cloudhealth.types.EntityProperties.healthObjective
  name: healthObjective
  summary: Health objective as a percentage of time the entity should be healthy.
  signature: 'healthObjective: float'
- uid: azure.mgmt.cloudhealth.types.EntityProperties.healthState
  name: healthState
  summary: '"Healthy", "Degraded", "Unhealthy", and

    "Unknown".'
  signature: 'healthState: str | HealthState'
- uid: azure.mgmt.cloudhealth.types.EntityProperties.icon
  name: icon
  summary: Visual icon definition. If not set, a default icon is used.
  signature: 'icon: IconDefinition'
- uid: azure.mgmt.cloudhealth.types.EntityProperties.impact
  name: impact
  summary: '"Standard", "Limited",

    and "Suppressed".'
  signature: 'impact: str | EntityImpact'
- uid: azure.mgmt.cloudhealth.types.EntityProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Creating", and "Deleting".'
  signature: 'provisioningState: str | HealthModelProvisioningState'
- uid: azure.mgmt.cloudhealth.types.EntityProperties.signalAggregationGroups
  name: signalAggregationGroups
  summary: 'the same signal

    may appear in more than one group''s members. Each group is evaluated independently
    according to

    its strategy, and a shared signal can contribute to multiple group states and
    related per-group

    telemetry. Group states contribute alongside any ungrouped signals and the

    dependency-aggregated child health to the entity''s overall worst-of composite.'
  signature: 'signalAggregationGroups: list[''SignalAggregationGroup'']'
- uid: azure.mgmt.cloudhealth.types.EntityProperties.signalGroups
  name: signalGroups
  summary: Signal groups which are assigned to this entity.
  signature: 'signalGroups: SignalGroups'
- uid: azure.mgmt.cloudhealth.types.EntityProperties.tags
  name: tags
  summary: Optional set of tags (key-value pairs).
  signature: 'tags: dict[str, str]'
