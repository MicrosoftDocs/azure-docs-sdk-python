uid: azure.mgmt.cloudhealth.types.EntityProperties
name: EntityProperties
fullName: azure.mgmt.cloudhealth.types.EntityProperties
module: azure.mgmt.cloudhealth.types
summary: Properties which are common across all kinds of entities.
constructor:
  syntax: EntityProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthModelProvisioningState">]
- description: Display name.
  name: display_name
  types:
  - <xref:str>
- description: Positioning of the entity on the model canvas.
  name: canvas_position
  types:
  - <xref:<xref:"EntityCoordinates">>
- description: Visual icon definition. If not set, a default icon is used.
  name: icon
  types:
  - <xref:<xref:"IconDefinition">>
- description: Health objective as a percentage of time the entity should be healthy.
  name: health_objective
  types:
  - <xref:float>
- description: 'Impact of the entity in health state propagation. Known values are:
    "Standard",

    "Limited", and "Suppressed".'
  name: impact
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EntityImpact">]
- description: Optional set of tags (key-value pairs).
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Signal groups which are assigned to this entity.
  name: signal_groups
  types:
  - <xref:<xref:"SignalGroups">>
- description: 'Discovered by which discovery rule. If set, the entity cannot be deleted

    manually.'
  name: discovered_by
  types:
  - <xref:str>
- description: 'Health state of this entity. Known values are: "Healthy", "Degraded",

    "Unhealthy", "Unknown", and "Deleted".'
  name: health_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthState">]
- description: Alert configuration for this entity.
  name: alerts
  types:
  - <xref:<xref:"EntityAlerts">>
