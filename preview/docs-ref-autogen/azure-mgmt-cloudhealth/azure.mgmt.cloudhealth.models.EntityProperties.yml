- description: Signal groups which are assigned to this entity.
  name: signal_groups
  types:
  - <xref:azure.mgmt.cloudhealth.models.SignalGroups>
- description: 'Logical aggregation groups over the signals on this entity.

    Overlap is allowed: the same signal may appear in more than one group''s members.
    Each group is

    evaluated independently according to its strategy, and a shared signal can contribute
    to

    multiple group states and related per-group telemetry. Group states contribute
    alongside any

    ungrouped signals and the dependency-aggregated child health to the entity''s
    overall worst-of

    composite.'
  name: signal_aggregation_groups
  types:
  - <xref:list>[<xref:azure.mgmt.cloudhealth.models.SignalAggregationGroup>]
- description: 'Discovered by which discovery rule. If set, the entity cannot be deleted

    manually.'
  name: discovered_by
  types:
  - <xref:str>
- description: 'Health state of this entity. Known values are: "Healthy", "Degraded",

    "Unhealthy", and "Unknown".'
  name: health_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.cloudhealth.models.HealthState>
- description: Alert configuration for this entity.
  name: alerts
  types:
  - <xref:azure.mgmt.cloudhealth.models.EntityAlerts>
