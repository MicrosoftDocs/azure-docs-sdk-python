### YamlMime:PythonClass
uid: azure.mgmt.cloudhealth.types.HealthReportRequest
name: HealthReportRequest
fullName: azure.mgmt.cloudhealth.types.HealthReportRequest
module: azure.mgmt.cloudhealth.types
summary: Health report that's submitted for a specific signal.
constructor:
  syntax: HealthReportRequest()
variables:
- description: Name of the entity signal to report health for. Required.
  name: signal_name
  types:
  - <xref:str>
- description: 'Health state to report for the signal. Required. Known values are:

    "Healthy", "Degraded", "Unhealthy", "Unknown", and "Deleted".'
  name: health_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthState">]
- description: Reported value of the signal.
  name: value
  types:
  - <xref:float>
- description: Evaluation rules that were used to determine the reported health state.
  name: evaluation_rules
  types:
  - <xref:<xref:"HealthReportEvaluationRule">>
- description: 'Number of minutes until the health report expires. Defaults to 60
    (1

    hour) if not specified.'
  name: expires_in_minutes
  types:
  - <xref:int>
- description: Optional additional context or description for the health report.
  name: additional_context
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cloudhealth.types.HealthReportRequest.additionalContext
  name: additionalContext
  summary: Optional additional context or description for the health report.
  signature: 'additionalContext: str'
- uid: azure.mgmt.cloudhealth.types.HealthReportRequest.evaluationRules
  name: evaluationRules
  summary: Evaluation rules that were used to determine the reported health state.
  signature: 'evaluationRules: HealthReportEvaluationRule'
- uid: azure.mgmt.cloudhealth.types.HealthReportRequest.expiresInMinutes
  name: expiresInMinutes
  summary: Number of minutes until the health report expires. Defaults to 60 (1 hour)
    if not specified.
  signature: 'expiresInMinutes: int'
- uid: azure.mgmt.cloudhealth.types.HealthReportRequest.healthState
  name: healthState
  summary: '"Healthy", "Degraded",

    "Unhealthy", "Unknown", and "Deleted".'
  signature: 'healthState: Required[str | HealthState]'
- uid: azure.mgmt.cloudhealth.types.HealthReportRequest.signalName
  name: signalName
  summary: Name of the entity signal to report health for. Required.
  signature: 'signalName: Required[str]'
- uid: azure.mgmt.cloudhealth.types.HealthReportRequest.value
  name: value
  summary: Reported value of the signal.
  signature: 'value: float'
