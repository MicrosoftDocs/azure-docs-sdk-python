### YamlMime:PythonClass
uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus
name: AzureResourceHealthSignalStatus
fullName: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus
module: azure.mgmt.cloudhealth.types
summary: 'Status of an Azure Resource Health signal, including availability information
  reported by Azure

  Resource Health.'
constructor:
  syntax: AzureResourceHealthSignalStatus()
variables:
- description: 'Health state of this signal. Known values are: "Healthy", "Degraded",

    "Unhealthy", and "Unknown".'
  name: healthState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthState">]
- description: Reported value of the signal.
  name: value
  types:
  - <xref:float>
- description: Timestamp when the value was reported.
  name: reportedAt
  types:
  - <xref:str>
- description: Error message if the signal status cannot be retrieved.
  name: error
  types:
  - <xref:str>
- description: Additional context as provided by the submitter.
  name: additionalContext
  types:
  - <xref:str>
- description: 'Availability state of the Azure resource as reported by Azure Resource

    Health. Known values are: "Available", "Unavailable", "Degraded", and "Unknown".'
  name: availabilityState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceHealthAvailabilityState">]
- description: 'Whether the status changing event was planned or unplanned. Known
    values are:

    "Planned" and "Unplanned".'
  name: category
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceHealthCategory">]
- description: 'Detailed status of the Azure resource as reported by Azure Resource

    Health.'
  name: detailedStatus
  types:
  - <xref:str>
- description: 'Human-readable summary of the current availability state from Azure
    Resource

    Health.'
  name: summary
  types:
  - <xref:str>
- description: 'Reason type for the current availability state (e.g. ''Unplanned'',
    ''Planned'',

    ''UserInitiated''). Known values are: "Unplanned", "Planned", and "UserInitiated".'
  name: reasonType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceHealthReasonType">]
- description: 'Whether the current availability state is ''Persistent'' or ''Transient''.

    Known values are: "Persistent" and "Transient".'
  name: reasonChronicity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceHealthReasonChronicity">]
- description: 'Timestamp when Azure Resource Health observed the current

    availability state.'
  name: availabilityReportedTime
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus.additionalContext
  name: additionalContext
  summary: Additional context as provided by the submitter.
  signature: 'additionalContext: str'
- uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus.availabilityReportedTime
  name: availabilityReportedTime
  summary: Timestamp when Azure Resource Health observed the current availability
    state.
  signature: 'availabilityReportedTime: str'
- uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus.availabilityState
  name: availabilityState
  summary: 'Availability state of the Azure resource as reported by Azure Resource
    Health. Known values

    are: "Available", "Unavailable", "Degraded", and "Unknown".'
  signature: 'availabilityState: str | ResourceHealthAvailabilityState'
- uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus.category
  name: category
  summary: '"Planned" and

    "Unplanned".'
  signature: 'category: str | ResourceHealthCategory'
- uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus.detailedStatus
  name: detailedStatus
  summary: Detailed status of the Azure resource as reported by Azure Resource Health.
  signature: 'detailedStatus: str'
- uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus.error
  name: error
  summary: Error message if the signal status cannot be retrieved.
  signature: 'error: str'
- uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus.healthState
  name: healthState
  summary: '"Healthy", "Degraded", "Unhealthy", and

    "Unknown".'
  signature: 'healthState: str | HealthState'
- uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus.reasonChronicity
  name: reasonChronicity
  summary: 'Whether the current availability state is ''Persistent'' or ''Transient''.
    Known values are:

    "Persistent" and "Transient".'
  signature: 'reasonChronicity: str | ResourceHealthReasonChronicity'
- uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus.reasonType
  name: reasonType
  summary: 'Reason type for the current availability state (e.g. ''Unplanned'', ''Planned'',
    ''UserInitiated'').

    Known values are: "Unplanned", "Planned", and "UserInitiated".'
  signature: 'reasonType: str | ResourceHealthReasonType'
- uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus.reportedAt
  name: reportedAt
  summary: Timestamp when the value was reported.
  signature: 'reportedAt: str'
- uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus.summary
  name: summary
  summary: Human-readable summary of the current availability state from Azure Resource
    Health.
  signature: 'summary: str'
- uid: azure.mgmt.cloudhealth.types.AzureResourceHealthSignalStatus.value
  name: value
  summary: Reported value of the signal.
  signature: 'value: float'
