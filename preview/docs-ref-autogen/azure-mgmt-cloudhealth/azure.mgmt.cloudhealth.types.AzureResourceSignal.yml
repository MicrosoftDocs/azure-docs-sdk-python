### YamlMime:PythonClass
uid: azure.mgmt.cloudhealth.types.AzureResourceSignal
name: AzureResourceSignal
fullName: azure.mgmt.cloudhealth.types.AzureResourceSignal
module: azure.mgmt.cloudhealth.types
summary: An Azure Resource Metric signal instance assigned to an entity.
constructor:
  syntax: AzureResourceSignal()
variables:
- description: Unique name of the signal within the entity. Required.
  name: name
  types:
  - <xref:str>
- description: 'Optional reference to a signal definition that provides default

    values.'
  name: signal_definition_name
  types:
  - <xref:str>
- description: Current status of the signal.
  name: status
  types:
  - <xref:<xref:"SignalStatus">>
- description: Kind of the signal instance. Required. AZURE_RESOURCE_METRIC.
  name: signal_kind
  types:
  - <xref:typing.Literal>[SignalKind.AZURE_RESOURCE_METRIC]
- description: Metric namespace.
  name: metric_namespace
  types:
  - <xref:str>
- description: Name of the metric.
  name: metric_name
  types:
  - <xref:str>
- description: Time range of signal. ISO duration format like PT10M.
  name: time_grain
  types:
  - <xref:str>
- description: 'Type of aggregation to apply to the metric. Known values are: "None",

    "Average", "Count", "Minimum", "Maximum", and "Total".'
  name: aggregation_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MetricAggregationType">]
- description: 'Optional: Dimension filter to apply to the dimension. Must only be
    set

    if also Dimension is set.'
  name: dimension_filter
  types:
  - <xref:str>
- description: Display name.
  name: display_name
  types:
  - <xref:str>
- description: 'Interval in which the signal is being evaluated. Defaults to PT1M
    (1

    minute). Known values are: "PT1M", "PT5M", "PT10M", "PT15M", "PT30M", "PT1H",
    and "PT2H".'
  name: refresh_interval
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RefreshInterval">]
- description: Unit of the signal result (e.g. Bytes, MilliSeconds, Percent, Count)).
  name: data_unit
  types:
  - <xref:str>
- description: Evaluation rules for the signal definition.
  name: evaluation_rules
  types:
  - <xref:<xref:"EvaluationRule">>
attributes:
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.aggregationType
  name: aggregationType
  summary: '"None", "Average", "Count",

    "Minimum", "Maximum", and "Total".'
  signature: 'aggregationType: str | MetricAggregationType'
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.dataUnit
  name: dataUnit
  summary: Unit of the signal result (e.g. Bytes, MilliSeconds, Percent, Count)).
  signature: 'dataUnit: str'
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.dimensionFilter
  name: dimensionFilter
  summary: 'Dimension filter to apply to the dimension. Must only be set if also Dimension
    is

    set.'
  signature: 'dimensionFilter: str'
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.displayName
  name: displayName
  summary: Display name.
  signature: 'displayName: str'
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.evaluationRules
  name: evaluationRules
  summary: Evaluation rules for the signal definition.
  signature: 'evaluationRules: EvaluationRule'
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.metricName
  name: metricName
  summary: Name of the metric.
  signature: 'metricName: str'
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.metricNamespace
  name: metricNamespace
  summary: Metric namespace.
  signature: 'metricNamespace: str'
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.name
  name: name
  summary: Unique name of the signal within the entity. Required.
  signature: 'name: Required[str]'
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.refreshInterval
  name: refreshInterval
  summary: 'Interval in which the signal is being evaluated. Defaults to PT1M (1 minute).
    Known values are:

    "PT1M", "PT5M", "PT10M", "PT15M", "PT30M", "PT1H", and "PT2H".'
  signature: 'refreshInterval: str | RefreshInterval'
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.signalDefinitionName
  name: signalDefinitionName
  summary: Optional reference to a signal definition that provides default values.
  signature: 'signalDefinitionName: str'
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.signalKind
  name: signalKind
  summary: Kind of the signal instance. Required. AZURE_RESOURCE_METRIC.
  signature: 'signalKind: AZURE_RESOURCE_METRIC: ''AzureResourceMetric''>]]'
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.status
  name: status
  summary: Current status of the signal.
  signature: 'status: SignalStatus'
- uid: azure.mgmt.cloudhealth.types.AzureResourceSignal.timeGrain
  name: timeGrain
  summary: Time range of signal. ISO duration format like PT10M.
  signature: 'timeGrain: str'
