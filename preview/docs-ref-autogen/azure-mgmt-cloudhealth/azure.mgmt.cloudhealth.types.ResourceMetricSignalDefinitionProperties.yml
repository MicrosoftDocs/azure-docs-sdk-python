uid: azure.mgmt.cloudhealth.types.ResourceMetricSignalDefinitionProperties
name: ResourceMetricSignalDefinitionProperties
fullName: azure.mgmt.cloudhealth.types.ResourceMetricSignalDefinitionProperties
module: azure.mgmt.cloudhealth.types
summary: Azure Resource Metric Signal Definition properties.
constructor:
  syntax: ResourceMetricSignalDefinitionProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthModelProvisioningState">]
- description: Display name.
  name: displayName
  types:
  - <xref:str>
- description: 'Interval in which the signal is being evaluated. Defaults to PT1M
    (1

    minute). Known values are: "PT1M", "PT5M", "PT10M", "PT15M", "PT30M", "PT1H",
    and "PT2H".'
  name: refreshInterval
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RefreshInterval">]
- description: Optional set of tags (key-value pairs).
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Unit of the signal result (e.g. Bytes, MilliSeconds, Percent, Count)).
  name: dataUnit
  types:
  - <xref:str>
- description: Evaluation rules for the signal definition. Required.
  name: evaluationRules
  types:
  - <xref:<xref:"EvaluationRule">>
- description: Kind of the signal definition. Required. AZURE_RESOURCE_METRIC.
  name: signalKind
  types:
  - <xref:typing.Literal>[SignalKind.AZURE_RESOURCE_METRIC]
- description: Metric namespace. Required.
  name: metricNamespace
  types:
  - <xref:str>
- description: Name of the metric. Required.
  name: metricName
  types:
  - <xref:str>
- description: Time range of signal. ISO duration format like PT10M. Required.
  name: timeGrain
  types:
  - <xref:str>
- description: 'Type of aggregation to apply to the metric. Required. Known values
    are:

    "None", "Average", "Count", "Minimum", "Maximum", and "Total".'
  name: aggregationType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MetricAggregationType">]
- description: 'Optional: Dimension filter to apply to the dimension.'
  name: dimensionFilter
  types:
  - <xref:str>
