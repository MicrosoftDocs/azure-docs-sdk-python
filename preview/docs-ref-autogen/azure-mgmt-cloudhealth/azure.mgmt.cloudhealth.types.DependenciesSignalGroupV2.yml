### YamlMime:PythonClass
uid: azure.mgmt.cloudhealth.types.DependenciesSignalGroupV2
name: DependenciesSignalGroupV2
fullName: azure.mgmt.cloudhealth.types.DependenciesSignalGroupV2
module: azure.mgmt.cloudhealth.types
summary: Properties for dependent entities, i.e. child entities.
constructor:
  syntax: DependenciesSignalGroupV2()
variables:
- description: 'Aggregation type for child dependencies. Required. Known values are:

    "WorstOf", "MinHealthy", and "MaxNotHealthy".'
  name: aggregation_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DependenciesAggregationType">]
- description: "Degraded threshold for aggregation. For MinHealthy: parent is\ndegraded\
    \ when healthy count/percentage falls to or below this value. For MaxNotHealthy:\
    \ parent\nis degraded when not-healthy count/percentage reaches or exceeds this\
    \ value. Optional \u2014 if not\nset, there is no degraded state (transitions\
    \ directly from Healthy to Unhealthy)."
  name: degraded_threshold
  types:
  - <xref:float>
- description: 'Unhealthy threshold for aggregation. For MinHealthy: parent is

    unhealthy when healthy count/percentage falls to or below this value. For MaxNotHealthy:
    parent

    is unhealthy when not-healthy count/percentage reaches or exceeds this value.
    Required when

    aggregationType is MinHealthy or MaxNotHealthy.'
  name: unhealthy_threshold
  types:
  - <xref:float>
- description: 'Unit type for the aggregation thresholds. Required when aggregationType
    is

    MinHealthy or MaxNotHealthy. Known values are: "Absolute" and "Percentage".'
  name: unit
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DependenciesAggregationUnit">]
- description: 'If true, children with Unknown health state are excluded from aggregation

    calculations. Defaults to true.'
  name: ignore_unknown
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.cloudhealth.types.DependenciesSignalGroupV2.aggregationType
  name: aggregationType
  summary: '"WorstOf",

    "MinHealthy", and "MaxNotHealthy".'
  signature: 'aggregationType: Required[str | DependenciesAggregationType]'
- uid: azure.mgmt.cloudhealth.types.DependenciesSignalGroupV2.degradedThreshold
  name: degradedThreshold
  summary: "parent is degraded when healthy\ncount/percentage falls to or below this\
    \ value. For MaxNotHealthy: parent is degraded when\nnot-healthy count/percentage\
    \ reaches or exceeds this value. Optional \u2014 if not set, there is no\ndegraded\
    \ state (transitions directly from Healthy to Unhealthy)."
  signature: 'degradedThreshold: float'
- uid: azure.mgmt.cloudhealth.types.DependenciesSignalGroupV2.ignoreUnknown
  name: ignoreUnknown
  summary: 'If true, children with Unknown health state are excluded from aggregation
    calculations.

    Defaults to true.'
  signature: 'ignoreUnknown: bool'
- uid: azure.mgmt.cloudhealth.types.DependenciesSignalGroupV2.unhealthyThreshold
  name: unhealthyThreshold
  summary: 'parent is unhealthy when healthy

    count/percentage falls to or below this value. For MaxNotHealthy: parent is unhealthy
    when

    not-healthy count/percentage reaches or exceeds this value. Required when aggregationType
    is

    MinHealthy or MaxNotHealthy.'
  signature: 'unhealthyThreshold: float'
- uid: azure.mgmt.cloudhealth.types.DependenciesSignalGroupV2.unit
  name: unit
  summary: 'Unit type for the aggregation thresholds. Required when aggregationType
    is MinHealthy or

    MaxNotHealthy. Known values are: "Absolute" and "Percentage".'
  signature: 'unit: str | DependenciesAggregationUnit'
