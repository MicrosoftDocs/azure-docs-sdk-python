### YamlMime:PythonClass
uid: azure.mgmt.cloudhealth.models.GetSignalRecommendationsResponse
name: GetSignalRecommendationsResponse
fullName: azure.mgmt.cloudhealth.models.GetSignalRecommendationsResponse
module: azure.mgmt.cloudhealth.models
summary: "Response from `getSignalRecommendations` containing two independent suggestion\
  \ streams for\nthe Azure resource type represented by the target Entity. `recommendedSignals`\
  \ lists signals\nbroadly recommended to be enabled by default; `recommendedConfigurations`\
  \ lists additional\nmetrics that are not broadly applicable but, if a caller chooses\
  \ to monitor one of them, ship\nwith suggested starting-point thresholds. The two\
  \ arrays are independent \u2014 items are not paired\nby index, and callers should\
  \ treat them as two separate suggestion streams."
constructor:
  syntax: 'GetSignalRecommendationsResponse(*args: Any, **kwargs: Any)'
variables:
- description: "Signals that are broadly recommended to be enabled by default for\n\
    health models monitoring an Entity of this resource type. Each entry is a complete\
    \ signal\nconfiguration (metric, aggregation, thresholds) ready to be added to\
    \ a health model.\nIndependent of `recommendedConfigurations` \u2014 not paired\
    \ by index. Required."
  name: recommended_signals
  types:
  - <xref:list>[<xref:azure.mgmt.cloudhealth.models.SignalConfiguration>]
- description: "Additional signal configurations for metrics that are not\nbroadly\
    \ applicable to every health model for an Entity of this resource type, but if\
    \ a caller\nchooses to monitor one of these metrics, the provided thresholds are\
    \ suggested as a starting\npoint. Independent of `recommendedSignals` \u2014 not\
    \ paired by index. Required."
  name: recommended_configurations
  types:
  - <xref:list>[<xref:azure.mgmt.cloudhealth.models.SignalConfiguration>]
