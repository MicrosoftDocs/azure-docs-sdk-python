  signature: 'dataUnit: str'
- uid: azure.mgmt.cloudhealth.types.PrometheusMetricsSignalDefinitionProperties.displayName
  name: displayName
  summary: Display name.
  signature: 'displayName: str'
- uid: azure.mgmt.cloudhealth.types.PrometheusMetricsSignalDefinitionProperties.evaluationRules
  name: evaluationRules
  summary: Evaluation rules for the signal definition. Required.
  signature: 'evaluationRules: Required[EvaluationRule]'
