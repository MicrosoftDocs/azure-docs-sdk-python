### YamlMime:PythonClass
uid: azure.mgmt.cloudhealth.types.PrometheusMetricsSignalDefinitionProperties
name: PrometheusMetricsSignalDefinitionProperties
fullName: azure.mgmt.cloudhealth.types.PrometheusMetricsSignalDefinitionProperties
module: azure.mgmt.cloudhealth.types
summary: Prometheus Metrics Signal Definition properties.
constructor:
  syntax: PrometheusMetricsSignalDefinitionProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthModelProvisioningState">]
- description: Display name.
  name: display_name
  types:
  - <xref:str>
- description: 'Interval in which the signal is being evaluated. Defaults to PT1M
    (1

    minute). Known values are: "PT1M", "PT5M", "PT10M", "PT15M", "PT30M", "PT1H",
    and "PT2H".'
  name: refresh_interval
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RefreshInterval">]
- description: Optional set of tags (key-value pairs).
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Unit of the signal result (e.g. Bytes, MilliSeconds, Percent, Count)).
  name: data_unit
  types:
  - <xref:str>
- description: Evaluation rules for the signal definition. Required.
  name: evaluation_rules
  types:
  - <xref:<xref:"EvaluationRule">>
- description: Kind of the signal definition. Required. PROMETHEUS_METRICS_QUERY.
  name: signal_kind
  types:
  - <xref:typing.Literal>[SignalKind.PROMETHEUS_METRICS_QUERY]
- description: Query text in PromQL syntax. Required.
  name: query_text
  types:
  - <xref:str>
- description: Time range of signal. ISO duration format like PT10M.
  name: time_grain
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cloudhealth.types.PrometheusMetricsSignalDefinitionProperties.dataUnit
  name: dataUnit
