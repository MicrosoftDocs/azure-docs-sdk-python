### YamlMime:PythonClass
uid: azure.mgmt.cloudhealth.types.LogAnalyticsQuerySignalDefinitionProperties
name: LogAnalyticsQuerySignalDefinitionProperties
fullName: azure.mgmt.cloudhealth.types.LogAnalyticsQuerySignalDefinitionProperties
module: azure.mgmt.cloudhealth.types
summary: Log Analytics Query Signal Definition properties.
constructor:
  syntax: LogAnalyticsQuerySignalDefinitionProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthModelProvisioningState">]
- description: Display name.
  name: display_name
  types:
  - <xref:str>
- description: 'Interval in which the signal is being evaluated. Defaults to PT1M
    (1

    minute). Known values are: "PT1M", "PT5M", "PT10M", "PT15M", "PT30M", "PT1H",
    and "PT2H".'
  name: refresh_interval
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RefreshInterval">]
- description: Optional set of tags (key-value pairs).
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Unit of the signal result (e.g. Bytes, MilliSeconds, Percent, Count)).
  name: data_unit
  types:
  - <xref:str>
- description: Evaluation rules for the signal definition. Required.
  name: evaluation_rules
  types:
  - <xref:<xref:"EvaluationRule">>
- description: Kind of the signal definition. Required. LOG_ANALYTICS_QUERY.
  name: signal_kind
  types:
  - <xref:typing.Literal>[SignalKind.LOG_ANALYTICS_QUERY]
- description: Query text in KQL syntax. Required.
  name: query_text
  types:
  - <xref:str>
- description: 'Time range of signal. ISO duration format like PT10M. If not specified,
    the

    KQL query must define a time range.'
  name: time_grain
  types:
  - <xref:str>
- description: 'Name of the column in the result set to evaluate against the

    thresholds. Defaults to the first column in the result set if not specified. The
    column must be

    numeric.'
  name: value_column_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cloudhealth.types.LogAnalyticsQuerySignalDefinitionProperties.dataUnit
  name: dataUnit
  summary: Unit of the signal result (e.g. Bytes, MilliSeconds, Percent, Count)).
  signature: 'dataUnit: str'
- uid: azure.mgmt.cloudhealth.types.LogAnalyticsQuerySignalDefinitionProperties.displayName
  name: displayName
  summary: Display name.
  signature: 'displayName: str'
- uid: azure.mgmt.cloudhealth.types.LogAnalyticsQuerySignalDefinitionProperties.evaluationRules
  name: evaluationRules
  summary: Evaluation rules for the signal definition. Required.
  signature: 'evaluationRules: Required[EvaluationRule]'
- uid: azure.mgmt.cloudhealth.types.LogAnalyticsQuerySignalDefinitionProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Creating", and "Deleting".'
  signature: 'provisioningState: str | HealthModelProvisioningState'
- uid: azure.mgmt.cloudhealth.types.LogAnalyticsQuerySignalDefinitionProperties.queryText
  name: queryText
  summary: Query text in KQL syntax. Required.
  signature: 'queryText: Required[str]'
- uid: azure.mgmt.cloudhealth.types.LogAnalyticsQuerySignalDefinitionProperties.refreshInterval
  name: refreshInterval
  summary: 'Interval in which the signal is being evaluated. Defaults to PT1M (1 minute).
    Known values are:

    "PT1M", "PT5M", "PT10M", "PT15M", "PT30M", "PT1H", and "PT2H".'
  signature: 'refreshInterval: str | RefreshInterval'
- uid: azure.mgmt.cloudhealth.types.LogAnalyticsQuerySignalDefinitionProperties.signalKind
  name: signalKind
  summary: Kind of the signal definition. Required. LOG_ANALYTICS_QUERY.
  signature: 'signalKind: LOG_ANALYTICS_QUERY: ''LogAnalyticsQuery''>]]'
- uid: azure.mgmt.cloudhealth.types.LogAnalyticsQuerySignalDefinitionProperties.tags
  name: tags
  summary: Optional set of tags (key-value pairs).
  signature: 'tags: dict[str, str]'
- uid: azure.mgmt.cloudhealth.types.LogAnalyticsQuerySignalDefinitionProperties.timeGrain
  name: timeGrain
  summary: 'Time range of signal. ISO duration format like PT10M. If not specified,
    the KQL query must

    define a time range.'
  signature: 'timeGrain: str'
- uid: azure.mgmt.cloudhealth.types.LogAnalyticsQuerySignalDefinitionProperties.valueColumnName
  name: valueColumnName
  summary: 'Name of the column in the result set to evaluate against the thresholds.
    Defaults to the first

    column in the result set if not specified. The column must be numeric.'
  signature: 'valueColumnName: str'
