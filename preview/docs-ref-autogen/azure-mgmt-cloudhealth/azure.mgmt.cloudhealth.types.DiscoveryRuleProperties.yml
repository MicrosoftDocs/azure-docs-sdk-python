### YamlMime:PythonClass
uid: azure.mgmt.cloudhealth.types.DiscoveryRuleProperties
name: DiscoveryRuleProperties
fullName: azure.mgmt.cloudhealth.types.DiscoveryRuleProperties
module: azure.mgmt.cloudhealth.types
summary: Discovery rule properties.
constructor:
  syntax: DiscoveryRuleProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthModelProvisioningState">]
- description: Display name.
  name: displayName
  types:
  - <xref:str>
- description: 'Reference to the name of the authentication setting which is used

    for querying Azure Resource Graph. The same authentication setting will also be
    assigned to any

    discovered entities. Required.'
  name: authenticationSetting
  types:
  - <xref:str>
- description: 'Whether to create relationships between the discovered entities

    based on a set of built-in rules. These relationships cannot be manually deleted.
    Required.

    Known values are: "Enabled" and "Disabled".'
  name: discoverRelationships
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiscoveryRuleRelationshipDiscoveryBehavior">]
- description: 'Whether to add all recommended signals to the discovered entities.

    Required. Known values are: "Enabled" and "Disabled".'
  name: addRecommendedSignals
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiscoveryRuleRecommendedSignalsBehavior">]
- description: 'Specification of the discovery rule defining how entities are discovered.

    Required.'
  name: specification
  types:
  - <xref:<xref:"DiscoveryRuleSpecification">>
- description: 'Whether to automatically add a signal for the Azure resource''s

    availability state from Azure Resource Health to the discovered entities. Defaults
    to

    `Enabled`: discovery rules updated via this API version without setting this field
    will begin

    emitting a Resource Health availability signal. Pass `Disabled` to preserve

    pre-`2026-05-01-preview` behavior. Known values are: "Enabled" and "Disabled".'
  name: addResourceHealthSignal
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceHealthAvailabilityStateSignalBehavior">]
- description: Error details if the last discovery operation failed.
  name: error
  types:
  - <xref:<xref:"DiscoveryError">>
- description: 'Name of the entity which represents the discovery rule. Note: It might
    take a

    few minutes after creating the discovery rule until the entity is created.'
  name: entityName
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cloudhealth.types.DiscoveryRuleProperties.addRecommendedSignals
  name: addRecommendedSignals
  summary: 'Whether to add all recommended signals to the discovered entities. Required.
    Known values are:

    "Enabled" and "Disabled".'
  signature: 'addRecommendedSignals: Required[str | DiscoveryRuleRecommendedSignalsBehavior]'
- uid: azure.mgmt.cloudhealth.types.DiscoveryRuleProperties.addResourceHealthSignal
  name: addResourceHealthSignal
  summary: 'Whether to automatically add a signal for the Azure resource''s availability
    state from Azure

    Resource Health to the discovered entities. Defaults to `Enabled`: discovery rules
    updated

    via this API version without setting this field will begin emitting a Resource
    Health

    availability signal. Pass `Disabled` to preserve pre-`2026-05-01-preview` behavior.
    Known

    values are: "Enabled" and "Disabled".'
  signature: 'addResourceHealthSignal: str | ResourceHealthAvailabilityStateSignalBehavior'
- uid: azure.mgmt.cloudhealth.types.DiscoveryRuleProperties.authenticationSetting
  name: authenticationSetting
  summary: 'Reference to the name of the authentication setting which is used for
    querying Azure Resource

    Graph. The same authentication setting will also be assigned to any discovered
    entities.

    Required.'
  signature: 'authenticationSetting: Required[str]'
- uid: azure.mgmt.cloudhealth.types.DiscoveryRuleProperties.discoverRelationships
  name: discoverRelationships
  summary: 'Whether to create relationships between the discovered entities based
    on a set of built-in

    rules. These relationships cannot be manually deleted. Required. Known values
    are: "Enabled"

    and "Disabled".'
  signature: 'discoverRelationships: Required[str | DiscoveryRuleRelationshipDiscoveryBehavior]'
- uid: azure.mgmt.cloudhealth.types.DiscoveryRuleProperties.displayName
  name: displayName
  summary: Display name.
  signature: 'displayName: str'
- uid: azure.mgmt.cloudhealth.types.DiscoveryRuleProperties.entityName
  name: entityName
  summary: 'It might take a few minutes after

    creating the discovery rule until the entity is created.'
  signature: 'entityName: str'
- uid: azure.mgmt.cloudhealth.types.DiscoveryRuleProperties.error
  name: error
  summary: Error details if the last discovery operation failed.
  signature: 'error: DiscoveryError'
- uid: azure.mgmt.cloudhealth.types.DiscoveryRuleProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Creating", and "Deleting".'
  signature: 'provisioningState: str | HealthModelProvisioningState'
- uid: azure.mgmt.cloudhealth.types.DiscoveryRuleProperties.specification
  name: specification
  summary: Specification of the discovery rule defining how entities are discovered.
    Required.
  signature: 'specification: Required[DiscoveryRuleSpecification]'
