### YamlMime:PythonClass
uid: azure.mgmt.cloudhealth.models.AzureResourceSignal
name: AzureResourceSignal
fullName: azure.mgmt.cloudhealth.models.AzureResourceSignal
module: azure.mgmt.cloudhealth.models
summary: An Azure Resource Metric signal instance assigned to an entity.
constructor:
  syntax: 'AzureResourceSignal(*args: Any, **kwargs: Any)'
variables:
- description: Unique name of the signal within the entity. Required.
  name: name
  types:
  - <xref:str>
- description: 'Optional reference to a signal definition that provides default

    values.'
  name: signal_definition_name
  types:
  - <xref:str>
- description: Current status of the signal.
  name: status
  types:
  - <xref:azure.mgmt.cloudhealth.models.SignalStatus>
- description: Kind of the signal instance. Required. AZURE_RESOURCE_METRIC.
  name: signal_kind
  types:
  - <xref:str>
  - <xref:azure.mgmt.cloudhealth.models.AZURE_RESOURCE_METRIC>
- description: Metric namespace.
  name: metric_namespace
  types:
  - <xref:str>
- description: Name of the metric.
  name: metric_name
  types:
  - <xref:str>
- description: Time range of signal. ISO duration format like PT10M.
  name: time_grain
  types:
  - <xref:str>
- description: 'Type of aggregation to apply to the metric. Known values are: "None",

    "Average", "Count", "Minimum", "Maximum", and "Total".'
  name: aggregation_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.cloudhealth.models.MetricAggregationType>
- description: 'Optional: Dimension filter to apply to the dimension.'
  name: dimension_filter
  types:
  - <xref:str>
- description: Display name.
  name: display_name
  types:
  - <xref:str>
- description: 'Interval in which the signal is being evaluated. Defaults to PT1M
    (1

    minute). Known values are: "PT1M", "PT5M", "PT10M", "PT15M", "PT30M", "PT1H",
    and "PT2H".'
  name: refresh_interval
  types:
  - <xref:str>
  - <xref:azure.mgmt.cloudhealth.models.RefreshInterval>
- description: Unit of the signal result (e.g. Bytes, MilliSeconds, Percent, Count)).
  name: data_unit
  types:
  - <xref:str>
- description: Evaluation rules for the signal definition.
  name: evaluation_rules
  types:
  - <xref:azure.mgmt.cloudhealth.models.EvaluationRule>
