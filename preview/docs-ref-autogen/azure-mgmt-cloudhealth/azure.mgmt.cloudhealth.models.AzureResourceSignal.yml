- uid: azure.mgmt.cloudhealth.models.AzureResourceSignal.aggregation_type
  name: aggregation_type
  summary: '"None", "Average", "Count",

    "Minimum", "Maximum", and "Total".'
  signature: 'aggregation_type: str | _models.MetricAggregationType | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceSignal.data_unit
  name: data_unit
  summary: Unit of the signal result (e.g. Bytes, MilliSeconds, Percent, Count)).
  signature: 'data_unit: str | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceSignal.dimension_filter
  name: dimension_filter
  summary: Dimension filter to apply to the dimension.
  signature: 'dimension_filter: str | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceSignal.display_name
  name: display_name
  summary: Display name.
  signature: 'display_name: str | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceSignal.evaluation_rules
  name: evaluation_rules
  summary: Evaluation rules for the signal definition.
  signature: 'evaluation_rules: _models.EvaluationRule | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceSignal.metric_name
  name: metric_name
  summary: Name of the metric.
  signature: 'metric_name: str | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceSignal.metric_namespace
  name: metric_namespace
  summary: Metric namespace.
  signature: 'metric_namespace: str | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceSignal.refresh_interval
  name: refresh_interval
  summary: 'Interval in which the signal is being evaluated. Defaults to PT1M (1 minute).
    Known values are:

    "PT1M", "PT5M", "PT10M", "PT15M", "PT30M", "PT1H", and "PT2H".'
  signature: 'refresh_interval: str | _models.RefreshInterval | None'
- uid: azure.mgmt.cloudhealth.models.AzureResourceSignal.signal_kind
  name: signal_kind
  summary: Kind of the signal instance. Required. AZURE_RESOURCE_METRIC.
  signature: 'signal_kind: AZURE_RESOURCE_METRIC: ''AzureResourceMetric''>]'
- uid: azure.mgmt.cloudhealth.models.AzureResourceSignal.time_grain
  name: time_grain
  summary: Time range of signal. ISO duration format like PT10M.
  signature: 'time_grain: str | None'
