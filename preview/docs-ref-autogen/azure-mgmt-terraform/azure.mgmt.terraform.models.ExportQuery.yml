### YamlMime:PythonClass
uid: azure.mgmt.terraform.models.ExportQuery
name: ExportQuery
fullName: azure.mgmt.terraform.models.ExportQuery
module: azure.mgmt.terraform.models
summary: Uses ARG (Azure Resource Graph) query to choose resources to be exported.
constructor:
  syntax: 'ExportQuery(*args: Any, **kwargs: Any)'
variables:
- description: 'The target Azure Terraform provider. Defaults to `azurerm`. Known

    values are: "azurerm" and "azapi".'
  name: target_provider
  types:
  - <xref:str>
  - <xref:azure.mgmt.terraform.models.TargetProvider>
- description: 'Whether to output all non-computed properties in the generated Terraform

    configuration. If set to `false` empty-valued properties will be omitted from
    the

    configuration. Defaults to `true`.'
  name: full_properties
  types:
  - <xref:bool>
- description: 'Mask sensitive attributes in the Terraform configuration. Defaults
    to

    `true`.'
  name: mask_sensitive
  types:
  - <xref:bool>
- description: 'Whether to include role assignments assigned to the resources

    exported. Defaults to `false`. This is deprecated in favor of `includeExtensions`
    (with

    `role-assignments` specified).'
  name: include_role_assignment
  types:
  - <xref:bool>
- description: 'Include extension resource types directly associated to the resources

    exported.'
  name: include_extensions
  types:
  - <xref:list>[<xref:str>
  - <xref:azure.mgmt.terraform.models.AzureExtensionResourceType>]
- description: 'Whether to include internal resources managed by Azure in the

    exported configuration. Defaults to `false`.'
  name: include_managed_resource
  types:
  - <xref:bool>
- description: 'Excludes specified Azure Resource Ids. Case-insensitive Azure

    Resource ID regular expression. Example:

    `["/subscriptions/[0-9a-f-]+/resourceGroups/my-rg.*"]`.'
  name: exclude_azure_resource
  types:
  - <xref:list>[<xref:str>]
- description: 'Excludes specified Terraform resource types. Example:

    `["azurerm_virtual_network"]`.'
  name: exclude_terraform_resource
  types:
  - <xref:list>[<xref:str>]
- description: 'The ARG where predicate. Multiple predicates can be combined using
    `and`

    operator. Example: `resourceGroup =~ "my-rg" and type =~

    "microsoft.network/virtualnetworks"`. The default ARG table is `Resources`, use
    ''table''

    property to query a different table. Required.'
  name: query
  types:
  - <xref:str>
- description: The id prefix for the exported Terraform resources. Defaults to `res-`.
  name: name_pattern
  types:
  - <xref:str>
- description: Recursively includes child resources. Defaults to `false`.
  name: recursive
  types:
  - <xref:bool>
- description: Has to be `ExportQuery` to distinguish from other types. Required.
    EXPORT_QUERY.
  name: type
  types:
  - <xref:str>
  - <xref:azure.mgmt.terraform.models.EXPORT_QUERY>
- description: 'Includes the resource group in the exported Terraform resources.

    Defaults to `false`.'
  name: include_resource_group
  types:
  - <xref:bool>
- description: The ARG table name. Defaults to 'Resources'.
  name: table
  types:
  - <xref:str>
- description: 'The ARG Scope Filter parameter. Known values are:

    "AtScopeAndBelow", "AtScopeAndAbove", "AtScopeAboveAndBelow", and "AtScopeExact".'
  name: authorization_scope_filter
  types:
  - <xref:str>
  - <xref:azure.mgmt.terraform.models.AuthorizationScopeFilter>
attributes:
- uid: azure.mgmt.terraform.models.ExportQuery.authorization_scope_filter
  name: authorization_scope_filter
  summary: '"AtScopeAndBelow", "AtScopeAndAbove",

    "AtScopeAboveAndBelow", and "AtScopeExact".'
  signature: 'authorization_scope_filter: str | _models.AuthorizationScopeFilter |
    None'
- uid: azure.mgmt.terraform.models.ExportQuery.include_resource_group
  name: include_resource_group
  summary: Includes the resource group in the exported Terraform resources. Defaults
    to `false`.
  signature: 'include_resource_group: bool | None'
- uid: azure.mgmt.terraform.models.ExportQuery.name_pattern
  name: name_pattern
  summary: The id prefix for the exported Terraform resources. Defaults to `res-`.
  signature: 'name_pattern: str | None'
- uid: azure.mgmt.terraform.models.ExportQuery.query
  name: query
  summary: 'The ARG where predicate. Multiple predicates can be combined using `and`
    operator. Example:

    `resourceGroup =~ "my-rg" and type =~ "microsoft.network/virtualnetworks"`. The
    default

    ARG table is `Resources`, use ''table'' property to query a different table. Required.'
  signature: 'query: str'
- uid: azure.mgmt.terraform.models.ExportQuery.recursive
  name: recursive
  summary: Recursively includes child resources. Defaults to `false`.
  signature: 'recursive: bool | None'
- uid: azure.mgmt.terraform.models.ExportQuery.table
  name: table
  summary: The ARG table name. Defaults to 'Resources'.
  signature: 'table: str | None'
- uid: azure.mgmt.terraform.models.ExportQuery.type
  name: type
  summary: Has to be `ExportQuery` to distinguish from other types. Required. EXPORT_QUERY.
  signature: 'type: EXPORT_QUERY: ''ExportQuery''>]'
