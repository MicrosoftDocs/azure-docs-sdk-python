### YamlMime:PythonClass
uid: azure.mgmt.terraform.models.BaseExportModel
name: BaseExportModel
fullName: azure.mgmt.terraform.models.BaseExportModel
module: azure.mgmt.terraform.models
summary: 'The base export parameter.


  You probably want to use the sub-classes and not this class directly. Known sub-classes
  are:

  ExportQuery, ExportResource, ExportResourceGroup'
constructor:
  syntax: 'BaseExportModel(*args: Any, **kwargs: Any)'
variables:
- description: 'The parameter type. Required. Known values are: "ExportResource",

    "ExportResourceGroup", and "ExportQuery".'
  name: type
  types:
  - <xref:str>
  - <xref:azure.mgmt.terraform.models.Type>
- description: 'The target Azure Terraform provider. Defaults to `azurerm`. Known

    values are: "azurerm" and "azapi".'
  name: target_provider
  types:
  - <xref:str>
  - <xref:azure.mgmt.terraform.models.TargetProvider>
- description: 'Whether to output all non-computed properties in the generated Terraform

    configuration. If set to `false` empty-valued properties will be omitted from
    the

    configuration. Defaults to `true`.'
  name: full_properties
  types:
  - <xref:bool>
- description: 'Mask sensitive attributes in the Terraform configuration. Defaults
    to

    `true`.'
  name: mask_sensitive
  types:
  - <xref:bool>
- description: 'Whether to include role assignments assigned to the resources

    exported. Defaults to `false`. This is deprecated in favor of `includeExtensions`
    (with

    `role-assignments` specified).'
  name: include_role_assignment
  types:
  - <xref:bool>
- description: 'Include extension resource types directly associated to the resources

    exported.'
  name: include_extensions
  types:
  - <xref:list>[<xref:str>
  - <xref:azure.mgmt.terraform.models.AzureExtensionResourceType>]
- description: 'Whether to include internal resources managed by Azure in the

    exported configuration. Defaults to `false`.'
  name: include_managed_resource
  types:
  - <xref:bool>
- description: 'Excludes specified Azure Resource Ids. Case-insensitive Azure

    Resource ID regular expression. Example:

    `["/subscriptions/[0-9a-f-]+/resourceGroups/my-rg.*"]`.'
  name: exclude_azure_resource
  types:
  - <xref:list>[<xref:str>]
- description: 'Excludes specified Terraform resource types. Example:

    `["azurerm_virtual_network"]`.'
  name: exclude_terraform_resource
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.terraform.models.BaseExportModel.exclude_azure_resource
  name: exclude_azure_resource
  summary: 'Excludes specified Azure Resource Ids. Case-insensitive Azure Resource
    ID regular expression.

    Example: `["/subscriptions/[0-9a-f-]+/resourceGroups/my-rg.*"]`.'
  signature: 'exclude_azure_resource: list[str] | None'
- uid: azure.mgmt.terraform.models.BaseExportModel.exclude_terraform_resource
  name: exclude_terraform_resource
  summary: '`["azurerm_virtual_network"]`.'
  signature: 'exclude_terraform_resource: list[str] | None'
- uid: azure.mgmt.terraform.models.BaseExportModel.full_properties
  name: full_properties
  summary: 'Whether to output all non-computed properties in the generated Terraform
    configuration. If set

    to `false` empty-valued properties will be omitted from the configuration. Defaults
    to

    `true`.'
  signature: 'full_properties: bool | None'
- uid: azure.mgmt.terraform.models.BaseExportModel.include_extensions
  name: include_extensions
  summary: Include extension resource types directly associated to the resources exported.
  signature: 'include_extensions: list[typing.Union[str, ForwardRef(''_models.AzureExtensionResourceType'')]]
    | None'
- uid: azure.mgmt.terraform.models.BaseExportModel.include_managed_resource
  name: include_managed_resource
  summary: 'Whether to include internal resources managed by Azure in the exported
    configuration. Defaults

    to `false`.'
  signature: 'include_managed_resource: bool | None'
- uid: azure.mgmt.terraform.models.BaseExportModel.include_role_assignment
  name: include_role_assignment
  summary: 'Whether to include role assignments assigned to the resources exported.
    Defaults to `false`.

    This is deprecated in favor of `includeExtensions` (with `role-assignments` specified).'
  signature: 'include_role_assignment: bool | None'
- uid: azure.mgmt.terraform.models.BaseExportModel.mask_sensitive
  name: mask_sensitive
  summary: Mask sensitive attributes in the Terraform configuration. Defaults to `true`.
  signature: 'mask_sensitive: bool | None'
- uid: azure.mgmt.terraform.models.BaseExportModel.target_provider
  name: target_provider
  summary: '"azurerm" and

    "azapi".'
  signature: 'target_provider: str | _models.TargetProvider | None'
- uid: azure.mgmt.terraform.models.BaseExportModel.type
  name: type
  summary: '"ExportResource", "ExportResourceGroup",

    and "ExportQuery".'
  signature: 'type: str'
