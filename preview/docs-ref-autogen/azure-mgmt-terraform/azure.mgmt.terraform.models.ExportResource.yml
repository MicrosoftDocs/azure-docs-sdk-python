### YamlMime:PythonClass
uid: azure.mgmt.terraform.models.ExportResource
name: ExportResource
fullName: azure.mgmt.terraform.models.ExportResource
module: azure.mgmt.terraform.models
summary: Specified resources to be exported by their ids.
constructor:
  syntax: 'ExportResource(*args: Any, **kwargs: Any)'
variables:
- description: 'The target Azure Terraform provider. Defaults to `azurerm`. Known

    values are: "azurerm" and "azapi".'
  name: target_provider
  types:
  - <xref:str>
  - <xref:azure.mgmt.terraform.models.TargetProvider>
- description: 'Whether to output all non-computed properties in the generated Terraform

    configuration. If set to `false` empty-valued properties will be omitted from
    the

    configuration. Defaults to `true`.'
  name: full_properties
  types:
  - <xref:bool>
- description: 'Mask sensitive attributes in the Terraform configuration. Defaults
    to

    `true`.'
  name: mask_sensitive
  types:
  - <xref:bool>
- description: 'Whether to include role assignments assigned to the resources

    exported. Defaults to `false`. This is deprecated in favor of `includeExtensions`
    (with

    `role-assignments` specified).'
  name: include_role_assignment
  types:
  - <xref:bool>
- description: 'Include extension resource types directly associated to the resources

    exported.'
  name: include_extensions
  types:
  - <xref:list>[<xref:str>
  - <xref:azure.mgmt.terraform.models.AzureExtensionResourceType>]
- description: 'Whether to include internal resources managed by Azure in the

    exported configuration. Defaults to `false`.'
  name: include_managed_resource
  types:
  - <xref:bool>
- description: 'Excludes specified Azure Resource Ids. Case-insensitive Azure

    Resource ID regular expression. Example:

    `["/subscriptions/[0-9a-f-]+/resourceGroups/my-rg.*"]`.'
  name: exclude_azure_resource
  types:
  - <xref:list>[<xref:str>]
- description: 'Excludes specified Terraform resource types. Example:

    `["azurerm_virtual_network"]`.'
  name: exclude_terraform_resource
  types:
  - <xref:list>[<xref:str>]
- description: 'The id(s) of the resource to be exported. Example:

    >>`<<["/subscriptions/12345678-1234-1234-1234-1234567890ab/resourceGroups/my-rg"].
    Required.'
  name: resource_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The Terraform id of the exported resource. Only effective when

    `resourceIds` contains only one item. Defaults to `res-0`.'
  name: resource_name
  types:
  - <xref:str>
- description: 'The Terraform resource type to map to. Only effective when `resourceIds`

    has one item. Example: `azurerm_virtual_network`. Automatic type mapping will
    be performed if

    not provided.'
  name: resource_type
  types:
  - <xref:str>
- description: The id prefix for the exported Terraform resources. Defaults to `res-`.
  name: name_pattern
  types:
  - <xref:str>
- description: 'Has to be `ExportResource` to distinguish from other types. Required.

    EXPORT_RESOURCE.'
  name: type
  types:
  - <xref:str>
  - <xref:azure.mgmt.terraform.models.EXPORT_RESOURCE>
- description: Recursively includes child resources. Defaults to `false`.
  name: recursive
  types:
  - <xref:bool>
- description: 'Includes the resource group in the exported Terraform resources.

    Defaults to `false`.'
  name: include_resource_group
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.terraform.models.ExportResource.include_resource_group
  name: include_resource_group
  summary: Includes the resource group in the exported Terraform resources. Defaults
    to `false`.
  signature: 'include_resource_group: bool | None'
- uid: azure.mgmt.terraform.models.ExportResource.name_pattern
  name: name_pattern
  summary: The id prefix for the exported Terraform resources. Defaults to `res-`.
  signature: 'name_pattern: str | None'
- uid: azure.mgmt.terraform.models.ExportResource.recursive
  name: recursive
  summary: Recursively includes child resources. Defaults to `false`.
  signature: 'recursive: bool | None'
- uid: azure.mgmt.terraform.models.ExportResource.resource_ids
  name: resource_ids
  summary: 'The id(s) of the resource to be exported. Example:

    >>`<<["/subscriptions/12345678-1234-1234-1234-1234567890ab/resourceGroups/my-rg"].
    Required.'
  signature: 'resource_ids: list[str]'
- uid: azure.mgmt.terraform.models.ExportResource.resource_name
  name: resource_name
  summary: 'The Terraform id of the exported resource. Only effective when `resourceIds`
    contains only

    one item. Defaults to `res-0`.'
  signature: 'resource_name: str | None'
- uid: azure.mgmt.terraform.models.ExportResource.resource_type
  name: resource_type
  summary: 'The Terraform resource type to map to. Only effective when `resourceIds`
    has one item.

    Example: `azurerm_virtual_network`. Automatic type mapping will be performed if
    not provided.'
  signature: 'resource_type: str | None'
- uid: azure.mgmt.terraform.models.ExportResource.type
  name: type
  summary: Has to be `ExportResource` to distinguish from other types. Required. EXPORT_RESOURCE.
  signature: 'type: EXPORT_RESOURCE: ''ExportResource''>]'
