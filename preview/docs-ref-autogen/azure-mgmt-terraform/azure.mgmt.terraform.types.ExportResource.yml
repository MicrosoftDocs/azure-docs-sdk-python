### YamlMime:PythonClass
uid: azure.mgmt.terraform.types.ExportResource
name: ExportResource
fullName: azure.mgmt.terraform.types.ExportResource
module: azure.mgmt.terraform.types
summary: Specified resources to be exported by their ids.
constructor:
  syntax: ExportResource()
variables:
- description: 'The target Azure Terraform provider. Defaults to `azurerm`. Known

    values are: "azurerm" and "azapi".'
  name: targetProvider
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TargetProvider">]
- description: 'Whether to output all non-computed properties in the generated Terraform

    configuration. If set to `false` empty-valued properties will be omitted from
    the

    configuration. Defaults to `true`.'
  name: fullProperties
  types:
  - <xref:bool>
- description: 'Mask sensitive attributes in the Terraform configuration. Defaults
    to

    `true`.'
  name: maskSensitive
  types:
  - <xref:bool>
- description: 'Whether to include role assignments assigned to the resources

    exported. Defaults to `false`. This is deprecated in favor of `includeExtensions`
    (with

    `role-assignments` specified).'
  name: includeRoleAssignment
  types:
  - <xref:bool>
- description: 'Include extension resource types directly associated to the resources

    exported.'
  name: includeExtensions
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"AzureExtensionResourceType">]]
- description: 'Whether to include internal resources managed by Azure in the

    exported configuration. Defaults to `false`.'
  name: includeManagedResource
  types:
  - <xref:bool>
- description: 'Excludes specified Azure Resource Ids. Case-insensitive Azure

    Resource ID regular expression. Example:

    `["/subscriptions/[0-9a-f-]+/resourceGroups/my-rg.*"]`.'
  name: excludeAzureResource
  types:
  - <xref:list>[<xref:str>]
- description: 'Excludes specified Terraform resource types. Example:

    `["azurerm_virtual_network"]`.'
  name: excludeTerraformResource
  types:
  - <xref:list>[<xref:str>]
- description: 'The id(s) of the resource to be exported. Example:

    >>`<<["/subscriptions/12345678-1234-1234-1234-1234567890ab/resourceGroups/my-rg"].
    Required.'
  name: resourceIds
  types:
  - <xref:list>[<xref:str>]
- description: 'The Terraform id of the exported resource. Only effective when

    `resourceIds` contains only one item. Defaults to `res-0`.'
  name: resourceName
  types:
  - <xref:str>
- description: 'The Terraform resource type to map to. Only effective when `resourceIds`

    has one item. Example: `azurerm_virtual_network`. Automatic type mapping will
    be performed if

    not provided.'
  name: resourceType
  types:
  - <xref:str>
- description: The id prefix for the exported Terraform resources. Defaults to `res-`.
  name: namePattern
  types:
  - <xref:str>
- description: 'Has to be `ExportResource` to distinguish from other types. Required.

    EXPORT_RESOURCE.'
  name: type
  types:
  - <xref:typing.Literal>[Type.EXPORT_RESOURCE]
- description: Recursively includes child resources. Defaults to `false`.
  name: recursive
  types:
  - <xref:bool>
- description: 'Includes the resource group in the exported Terraform resources.

    Defaults to `false`.'
  name: includeResourceGroup
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.terraform.types.ExportResource.excludeAzureResource
  name: excludeAzureResource
  summary: 'Excludes specified Azure Resource Ids. Case-insensitive Azure Resource
    ID regular expression.

    Example: `["/subscriptions/[0-9a-f-]+/resourceGroups/my-rg.*"]`.'
  signature: 'excludeAzureResource: list[str]'
- uid: azure.mgmt.terraform.types.ExportResource.excludeTerraformResource
  name: excludeTerraformResource
  summary: '`["azurerm_virtual_network"]`.'
  signature: 'excludeTerraformResource: list[str]'
- uid: azure.mgmt.terraform.types.ExportResource.fullProperties
  name: fullProperties
  summary: 'Whether to output all non-computed properties in the generated Terraform
    configuration. If set

    to `false` empty-valued properties will be omitted from the configuration. Defaults
    to

    `true`.'
  signature: 'fullProperties: bool'
- uid: azure.mgmt.terraform.types.ExportResource.includeExtensions
  name: includeExtensions
  summary: Include extension resource types directly associated to the resources exported.
  signature: 'includeExtensions: list[typing.Union[str, ForwardRef(''AzureExtensionResourceType'')]]'
- uid: azure.mgmt.terraform.types.ExportResource.includeManagedResource
  name: includeManagedResource
  summary: 'Whether to include internal resources managed by Azure in the exported
    configuration. Defaults

    to `false`.'
  signature: 'includeManagedResource: bool'
- uid: azure.mgmt.terraform.types.ExportResource.includeResourceGroup
  name: includeResourceGroup
  summary: Includes the resource group in the exported Terraform resources. Defaults
    to `false`.
  signature: 'includeResourceGroup: bool'
- uid: azure.mgmt.terraform.types.ExportResource.includeRoleAssignment
  name: includeRoleAssignment
  summary: 'Whether to include role assignments assigned to the resources exported.
    Defaults to `false`.

    This is deprecated in favor of `includeExtensions` (with `role-assignments` specified).'
  signature: 'includeRoleAssignment: bool'
- uid: azure.mgmt.terraform.types.ExportResource.maskSensitive
  name: maskSensitive
  summary: Mask sensitive attributes in the Terraform configuration. Defaults to `true`.
  signature: 'maskSensitive: bool'
- uid: azure.mgmt.terraform.types.ExportResource.namePattern
  name: namePattern
  summary: The id prefix for the exported Terraform resources. Defaults to `res-`.
  signature: 'namePattern: str'
- uid: azure.mgmt.terraform.types.ExportResource.recursive
  name: recursive
  summary: Recursively includes child resources. Defaults to `false`.
  signature: 'recursive: bool'
- uid: azure.mgmt.terraform.types.ExportResource.resourceIds
  name: resourceIds
  summary: 'The id(s) of the resource to be exported. Example:

    >>`<<["/subscriptions/12345678-1234-1234-1234-1234567890ab/resourceGroups/my-rg"].
    Required.'
  signature: 'resourceIds: Required[list[str]]'
- uid: azure.mgmt.terraform.types.ExportResource.resourceName
  name: resourceName
  summary: 'The Terraform id of the exported resource. Only effective when `resourceIds`
    contains only

    one item. Defaults to `res-0`.'
  signature: 'resourceName: str'
- uid: azure.mgmt.terraform.types.ExportResource.resourceType
  name: resourceType
  summary: 'The Terraform resource type to map to. Only effective when `resourceIds`
    has one item.

    Example: `azurerm_virtual_network`. Automatic type mapping will be performed if
    not provided.'
  signature: 'resourceType: str'
- uid: azure.mgmt.terraform.types.ExportResource.targetProvider
  name: targetProvider
  summary: '"azurerm" and

    "azapi".'
  signature: 'targetProvider: str | TargetProvider'
- uid: azure.mgmt.terraform.types.ExportResource.type
  name: type
  summary: Has to be `ExportResource` to distinguish from other types. Required. EXPORT_RESOURCE.
  signature: 'type: EXPORT_RESOURCE: ''ExportResource''>]]'
