### YamlMime:PythonClass
uid: azure.mgmt.guestconfig.types.ConfigurationSetting
name: ConfigurationSetting
fullName: azure.mgmt.guestconfig.types.ConfigurationSetting
module: azure.mgmt.guestconfig.types
summary: Configuration setting of LCM (Local Configuration Manager).
constructor:
  syntax: ConfigurationSetting()
variables:
- description: 'Specifies how the LCM(Local Configuration Manager) actually applies

    the configuration to the target nodes. Possible values are ApplyOnly, ApplyAndMonitor,
    and

    ApplyAndAutoCorrect. Known values are: "ApplyOnly", "ApplyAndMonitor", and

    "ApplyAndAutoCorrect".'
  name: configuration_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConfigurationMode">]
- description: 'If true - new configurations downloaded from the pull service are

    allowed to overwrite the old ones on the target node. Otherwise, false.'
  name: allow_module_overwrite
  types:
  - <xref:bool>
- description: 'Specifies what happens after a reboot during the application of a

    configuration. The possible values are ContinueConfiguration and StopConfiguration.
    Known

    values are: "ContinueConfiguration" and "StopConfiguration".'
  name: action_after_reboot
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActionAfterReboot">]
- description: 'The time interval, in minutes, at which the LCM checks a pull

    service to get updated configurations. This value is ignored if the LCM is not
    configured in

    pull mode. The default value is 30.'
  name: refresh_frequency_mins
  types:
  - <xref:float>
- description: 'Set this to true to automatically reboot the node after a configuration

    that requires reboot is applied. Otherwise, you will have to manually reboot the
    node for any

    configuration that requires it. The default value is false. To use this setting
    when a reboot

    condition is enacted by something other than DSC (such as Windows Installer),
    combine this

    setting with the xPendingReboot module.'
  name: reboot_if_needed
  types:
  - <xref:bool>
- description: 'How often, in minutes, the current configuration is

    checked and applied. This property is ignored if the ConfigurationMode property
    is set to

    ApplyOnly. The default value is 15.'
  name: configuration_mode_frequency_mins
  types:
  - <xref:float>
attributes:
- uid: azure.mgmt.guestconfig.types.ConfigurationSetting.actionAfterReboot
  name: actionAfterReboot
  summary: 'Specifies what happens after a reboot during the application of a configuration.
    The possible

    values are ContinueConfiguration and StopConfiguration. Known values are:

    "ContinueConfiguration" and "StopConfiguration".'
  signature: 'actionAfterReboot: str | ActionAfterReboot'
- uid: azure.mgmt.guestconfig.types.ConfigurationSetting.allowModuleOverwrite
  name: allowModuleOverwrite
  summary: 'If true - new configurations downloaded from the pull service are allowed
    to overwrite the old

    ones on the target node. Otherwise, false.'
  signature: 'allowModuleOverwrite: bool'
- uid: azure.mgmt.guestconfig.types.ConfigurationSetting.configurationMode
  name: configurationMode
  summary: 'Specifies how the LCM(Local Configuration Manager) actually applies the
    configuration to the

    target nodes. Possible values are ApplyOnly, ApplyAndMonitor, and ApplyAndAutoCorrect.
    Known

    values are: "ApplyOnly", "ApplyAndMonitor", and "ApplyAndAutoCorrect".'
  signature: 'configurationMode: str | ConfigurationMode'
- uid: azure.mgmt.guestconfig.types.ConfigurationSetting.configurationModeFrequencyMins
  name: configurationModeFrequencyMins
  summary: 'How often, in minutes, the current configuration is checked and applied.
    This property is

    ignored if the ConfigurationMode property is set to ApplyOnly. The default value
    is 15.'
  signature: 'configurationModeFrequencyMins: float'
- uid: azure.mgmt.guestconfig.types.ConfigurationSetting.rebootIfNeeded
  name: rebootIfNeeded
  summary: 'Set this to true to automatically reboot the node after a configuration
    that requires reboot is

    applied. Otherwise, you will have to manually reboot the node for any configuration
    that

    requires it. The default value is false. To use this setting when a reboot condition
    is enacted

    by something other than DSC (such as Windows Installer), combine this setting
    with the

    xPendingReboot module.'
  signature: 'rebootIfNeeded: bool'
- uid: azure.mgmt.guestconfig.types.ConfigurationSetting.refreshFrequencyMins
  name: refreshFrequencyMins
  summary: 'The time interval, in minutes, at which the LCM checks a pull service
    to get updated

    configurations. This value is ignored if the LCM is not configured in pull mode.
    The default

    value is 30.'
  signature: 'refreshFrequencyMins: float'
