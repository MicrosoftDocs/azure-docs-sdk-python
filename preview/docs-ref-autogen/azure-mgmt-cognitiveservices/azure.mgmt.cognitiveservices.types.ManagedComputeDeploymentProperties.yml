### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties
name: ManagedComputeDeploymentProperties
fullName: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties
module: azure.mgmt.cognitiveservices.types
summary: Properties of a Cognitive Services managed compute deployment.
constructor:
  syntax: ManagedComputeDeploymentProperties()
variables:
- description: 'AzureML Registry model asset URI. Required on creation; immutable
    after creation.

    Example: azureml://registries/{registry}/models/{model}/versions/{version}. Required.'
  name: model
  types:
  - <xref:str>
- description: 'Deployment template identifier. Optional on creation. Accepts an

    AzureML Registry deployment template URI or a project-scoped deployment template
    path for

    VmManagedCompute. Examples:

    azureml://registries/{registry}/deploymenttemplates/{template}/versions/{version},

    projects/{project}/deploymentTemplates/{template}/versions/{version}.'
  name: deploymentTemplate
  types:
  - <xref:str>
- description: 'Accelerator type (e.g., H100_80GB). Optional on creation; immutable

    after creation.'
  name: acceleratorType
  types:
  - <xref:str>
- description: 'Template auto-upgrade policy. Defaults to

    OnceNewDefaultVersionAvailable. Known values are: "OnceNewDefaultVersionAvailable",

    "OnceCurrentVersionExpired", and "NoAutoUpgrade".'
  name: versionUpgradeOption
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentModelVersionUpgradeOption">]
- description: 'Deployment capabilities represented as key-value pairs. Example: {

    assetsV2: "true" }.'
  name: capabilities
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'Foundry compute ARM resource ID for VM-backed managed compute deployments.

    Required when sku.name is VmManagedCompute; immutable after creation.'
  name: computeId
  types:
  - <xref:str>
- description: 'Scheduling priority for VM-backed managed compute deployments. Immutable
    after

    creation.'
  name: priority
  types:
  - <xref:str>
- description: 'Read-only. Number of accelerators (GPUs) consumed by each model

    instance, sourced from the deployment template.'
  name: acceleratorsPerInstance
  types:
  - <xref:int>
- description: 'Read-only. Total accelerators allocated: sku.capacity (instances)
    x

    acceleratorsPerInstance.'
  name: totalAccelerators
  types:
  - <xref:int>
- description: 'Read-only. Current provisioning state. Known values are: "Accepted",

    "Creating", "Deleting", "Moving", "Failed", "Succeeded", "Canceled", "ResolvingDNS",
    and

    "ExtensionUnreachable".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Read-only. Status message and timestamp from the last provisioning

    operation.'
  name: provisioningDetails
  types:
  - <xref:<xref:"ManagedComputeDeploymentProvisioningDetails">>
- description: 'Read-only. Inference route paths relative to the account endpoint.
    Populated when

    provisioningState is Succeeded.'
  name: routes
  types:
  - <xref:<xref:"ManagedComputeDeploymentRoutes">>
attributes:
- uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties.acceleratorType
  name: acceleratorType
  summary: Accelerator type (e.g., H100_80GB). Optional on creation; immutable after
    creation.
  signature: 'acceleratorType: str'
- uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties.acceleratorsPerInstance
  name: acceleratorsPerInstance
  summary: 'Read-only. Number of accelerators (GPUs) consumed by each model instance,
    sourced from the

    deployment template.'
  signature: 'acceleratorsPerInstance: int'
- uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties.capabilities
  name: capabilities
  summary: '"true" }.'
  signature: 'capabilities: dict[str, str]'
- uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties.computeId
  name: computeId
  summary: 'Foundry compute ARM resource ID for VM-backed managed compute deployments.
    Required when

    sku.name is VmManagedCompute; immutable after creation.'
  signature: 'computeId: str'
- uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties.deploymentTemplate
  name: deploymentTemplate
  summary: 'Deployment template identifier. Optional on creation. Accepts an AzureML
    Registry deployment

    template URI or a project-scoped deployment template path for VmManagedCompute.
    Examples:

    azureml://registries/{registry}/deploymenttemplates/{template}/versions/{version},

    projects/{project}/deploymentTemplates/{template}/versions/{version}.'
  signature: 'deploymentTemplate: str'
- uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties.model
  name: model
  summary: 'AzureML Registry model asset URI. Required on creation; immutable after
    creation. Example:

    azureml://registries/{registry}/models/{model}/versions/{version}. Required.'
  signature: 'model: Required[str]'
- uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties.priority
  name: priority
  summary: Scheduling priority for VM-backed managed compute deployments. Immutable
    after creation.
  signature: 'priority: str'
- uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties.provisioningDetails
  name: provisioningDetails
  summary: Read-only. Status message and timestamp from the last provisioning operation.
  signature: 'provisioningDetails: ManagedComputeDeploymentProvisioningDetails'
- uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties.provisioningState
  name: provisioningState
  summary: '"Accepted", "Creating",

    "Deleting", "Moving", "Failed", "Succeeded", "Canceled", "ResolvingDNS", and

    "ExtensionUnreachable".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties.routes
  name: routes
  summary: 'Read-only. Inference route paths relative to the account endpoint. Populated
    when

    provisioningState is Succeeded.'
  signature: 'routes: ManagedComputeDeploymentRoutes'
- uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties.totalAccelerators
  name: totalAccelerators
  summary: sku.capacity (instances) x acceleratorsPerInstance.
  signature: 'totalAccelerators: int'
- uid: azure.mgmt.cognitiveservices.types.ManagedComputeDeploymentProperties.versionUpgradeOption
  name: versionUpgradeOption
  summary: 'Template auto-upgrade policy. Defaults to OnceNewDefaultVersionAvailable.
    Known values are:

    "OnceNewDefaultVersionAvailable", "OnceCurrentVersionExpired", and "NoAutoUpgrade".'
  signature: 'versionUpgradeOption: str | DeploymentModelVersionUpgradeOption'
