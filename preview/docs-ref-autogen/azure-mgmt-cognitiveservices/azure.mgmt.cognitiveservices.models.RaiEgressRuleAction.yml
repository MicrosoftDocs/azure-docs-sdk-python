### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.models.RaiEgressRuleAction
name: RaiEgressRuleAction
fullName: azure.mgmt.cognitiveservices.models.RaiEgressRuleAction
module: azure.mgmt.cognitiveservices.models
summary: "The action an egress rule takes when it matches.\n\n* Allow/Deny: no additional\
  \ fields needed; headers and rewrite must not be set. \n\n* Transform: headers is\
  \ required with at least one entry; rewrite must not be set. \n\n* Rewrite: rewrite\
  \ is required with at least one of scheme/host/path; \n\nheaders is optional for\
  \ injecting headers alongside the redirect."
constructor:
  syntax: 'RaiEgressRuleAction(*args: Any, **kwargs: Any)'
variables:
- description: 'The kind of action. Required. Known values are: "Allow", "Deny",

    "Transform", and "Rewrite".'
  name: action_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.cognitiveservices.models.RaiEgressRuleActionType>
- description: 'Header transforms to apply. Required for Transform; optional for Rewrite;
    not

    allowed for Allow or Deny.'
  name: headers
  types:
  - <xref:list>[<xref:azure.mgmt.cognitiveservices.models.RaiEgressHeaderTransform>]
- description: Destination override. Required for Rewrite; not allowed otherwise.
  name: rewrite
  types:
  - <xref:azure.mgmt.cognitiveservices.models.RaiEgressRewriteTarget>
attributes:
- uid: azure.mgmt.cognitiveservices.models.RaiEgressRuleAction.action_type
  name: action_type
  summary: '"Allow", "Deny", "Transform", and

    "Rewrite".'
  signature: 'action_type: str | _models.RaiEgressRuleActionType'
- uid: azure.mgmt.cognitiveservices.models.RaiEgressRuleAction.headers
  name: headers
  summary: 'Header transforms to apply. Required for Transform; optional for Rewrite;
    not allowed for Allow

    or Deny.'
  signature: 'headers: list[''_models.RaiEgressHeaderTransform''] | None'
- uid: azure.mgmt.cognitiveservices.models.RaiEgressRuleAction.rewrite
  name: rewrite
  summary: Destination override. Required for Rewrite; not allowed otherwise.
  signature: 'rewrite: _models.RaiEgressRewriteTarget | None'
