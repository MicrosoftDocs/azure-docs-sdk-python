### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.models.RaiEgressRuleMatch
name: RaiEgressRuleMatch
fullName: azure.mgmt.cognitiveservices.models.RaiEgressRuleMatch
module: azure.mgmt.cognitiveservices.models
summary: 'The match criteria for an egress rule. If both host and path are omitted,
  the rule matches all

  traffic. Host uses DNS wildcard syntax (e.g., "*.openai.com" matches "api.openai.com").
  Path

  uses URI prefix matching with ''*'' as a single-segment wildcard (e.g., "/v1/>>*<<"
  matches

  "/v1/chat").'
constructor:
  syntax: 'RaiEgressRuleMatch(*args: Any, **kwargs: Any)'
variables:
- description: 'Host pattern to match using DNS wildcard syntax (e.g., "*.openai.com").
    A leading

    "*." matches any subdomain. Omit to match all hosts.'
  name: host
  types:
  - <xref:str>
- description: 'Path pattern to match using URI prefix with ''*'' wildcard (e.g.,
    "/v1/>>*<<"). Omit to

    match all paths.'
  name: path
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cognitiveservices.models.RaiEgressRuleMatch.host
  name: host
  summary: 'Host pattern to match using DNS wildcard syntax (e.g., "*.openai.com").
    A leading "*."

    matches any subdomain. Omit to match all hosts.'
  signature: 'host: str | None'
- uid: azure.mgmt.cognitiveservices.models.RaiEgressRuleMatch.path
  name: path
  summary: 'Path pattern to match using URI prefix with ''*'' wildcard (e.g., "/v1/>>*<<").
    Omit to match all

    paths.'
  signature: 'path: str | None'
