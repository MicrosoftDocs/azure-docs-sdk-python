### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.CapabilitySettings
name: CapabilitySettings
fullName: azure.mgmt.cognitiveservices.types.CapabilitySettings
module: azure.mgmt.cognitiveservices.types
summary: 'Extensible agent capability configuration. Carries the Azure resource IDs
  of the agent storage

  dependencies. Modeled as an object so future capability-backed resources can be
  added without

  changing the account or project contract.'
constructor:
  syntax: CapabilitySettings()
variables:
- description: Azure resource ID of the document store used by agent runtime state.
  name: documentStore
  types:
  - <xref:str>
- description: Azure resource ID of the vector store used by agent retrieval and indexing.
  name: vectorStore
  types:
  - <xref:str>
- description: Azure resource ID of the blob store used by agent file and artifact
    storage.
  name: blobStore
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cognitiveservices.types.CapabilitySettings.blobStore
  name: blobStore
  summary: Azure resource ID of the blob store used by agent file and artifact storage.
  signature: 'blobStore: str'
- uid: azure.mgmt.cognitiveservices.types.CapabilitySettings.documentStore
  name: documentStore
  summary: Azure resource ID of the document store used by agent runtime state.
  signature: 'documentStore: str'
- uid: azure.mgmt.cognitiveservices.types.CapabilitySettings.vectorStore
  name: vectorStore
  summary: Azure resource ID of the vector store used by agent retrieval and indexing.
  signature: 'vectorStore: str'
