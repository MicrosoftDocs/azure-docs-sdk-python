### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.RaiPolicyProperties
name: RaiPolicyProperties
fullName: azure.mgmt.cognitiveservices.types.RaiPolicyProperties
module: azure.mgmt.cognitiveservices.types
summary: Azure OpenAI Content Filters properties.
constructor:
  syntax: RaiPolicyProperties()
variables:
- description: 'Content Filters policy type. Known values are: "UserManaged" and "SystemManaged".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RaiPolicyType">]
- description: 'Rai policy mode. The enum value mapping is as below: Default = 0,
    Deferred=1,

    Blocking=2, Asynchronous_filter =3. Please use ''Asynchronous_filter'' after 2025-06-01.
    It is

    the same as ''Deferred'' in previous version. Known values are: "Default", "Deferred",

    "Blocking", and "Asynchronous_filter".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RaiPolicyMode">]
- description: Name of Rai policy.
  name: basePolicyName
  types:
  - <xref:str>
- description: The list of Content Filters.
  name: contentFilters
  types:
  - <xref:list>[<xref:"RaiPolicyContentFilter">]
- description: The list of custom Blocklist.
  name: customBlocklists
  types:
  - <xref:list>[<xref:"CustomBlocklistConfig">]
- description: The list of Safety Providers.
  name: safetyProviders
  types:
  - <xref:list>[<xref:"SafetyProviderConfig">]
- description: 'Egress (outbound network) policy controlling which external endpoints

    sandboxed agents can reach. Includes rules with Allow/Deny/Transform/Rewrite actions.'
  name: egressPolicy
  types:
  - <xref:<xref:"RaiEgressPolicyConfig">>
attributes:
- uid: azure.mgmt.cognitiveservices.types.RaiPolicyProperties.basePolicyName
  name: basePolicyName
  summary: Name of Rai policy.
  signature: 'basePolicyName: str'
- uid: azure.mgmt.cognitiveservices.types.RaiPolicyProperties.contentFilters
  name: contentFilters
  summary: The list of Content Filters.
  signature: 'contentFilters: list[''RaiPolicyContentFilter'']'
- uid: azure.mgmt.cognitiveservices.types.RaiPolicyProperties.customBlocklists
  name: customBlocklists
  summary: The list of custom Blocklist.
  signature: 'customBlocklists: list[''CustomBlocklistConfig'']'
- uid: azure.mgmt.cognitiveservices.types.RaiPolicyProperties.egressPolicy
  name: egressPolicy
  summary: 'Egress (outbound network) policy controlling which external endpoints
    sandboxed agents can

    reach. Includes rules with Allow/Deny/Transform/Rewrite actions.'
  signature: 'egressPolicy: RaiEgressPolicyConfig'
- uid: azure.mgmt.cognitiveservices.types.RaiPolicyProperties.mode
  name: mode
  summary: 'Default = 0, Deferred=1, Blocking=2,

    Asynchronous_filter =3. Please use ''Asynchronous_filter'' after 2025-06-01. It
    is the same as

    ''Deferred'' in previous version. Known values are: "Default", "Deferred", "Blocking",
    and

    "Asynchronous_filter".'
  signature: 'mode: str | RaiPolicyMode'
- uid: azure.mgmt.cognitiveservices.types.RaiPolicyProperties.safetyProviders
  name: safetyProviders
  summary: The list of Safety Providers.
  signature: 'safetyProviders: list[''SafetyProviderConfig'']'
- uid: azure.mgmt.cognitiveservices.types.RaiPolicyProperties.type
  name: type
  summary: '"UserManaged" and "SystemManaged".'
  signature: 'type: str | RaiPolicyType'
