### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.CapabilityHostProperties
name: CapabilityHostProperties
fullName: azure.mgmt.cognitiveservices.types.CapabilityHostProperties
module: azure.mgmt.cognitiveservices.types
summary: CapabilityHostProperties.
constructor:
  syntax: CapabilityHostProperties()
variables:
- description: The asset description text.
  name: description
  types:
  - <xref:str>
- description: Tag dictionary. Tags can be added, removed, and updated.
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: List of AI services connections.
  name: aiServicesConnections
  types:
  - <xref:list>[<xref:str>]
- description: Kind of this capability host. "Agents"
  name: capabilityHostKind
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CapabilityHostKind">]
- description: Customer subnet info to help set up this capability host.
  name: customerSubnet
  types:
  - <xref:str>
- description: 'Provisioning state for the CapabilityHost. Known values are:

    "Succeeded", "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CapabilityHostProvisioningState">]
- description: 'List of connection names from those available in the account or

    project to be used as a storage resource.'
  name: storageConnections
  types:
  - <xref:list>[<xref:str>]
- description: 'List of connection names from those available in the account or

    project to be used for Thread storage.'
  name: threadStorageConnections
  types:
  - <xref:list>[<xref:str>]
- description: 'List of connection names from those available in the account or

    project to be used for vector database (e.g. CosmosDB).'
  name: vectorStoreConnections
  types:
  - <xref:list>[<xref:str>]
- description: 'Whether public hosting environment is enabled for the

    capability host.'
  name: enablePublicHostingEnvironment
  types:
  - <xref:bool>
