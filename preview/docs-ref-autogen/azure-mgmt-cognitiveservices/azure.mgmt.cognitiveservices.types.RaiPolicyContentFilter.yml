### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.RaiPolicyContentFilter
name: RaiPolicyContentFilter
fullName: azure.mgmt.cognitiveservices.types.RaiPolicyContentFilter
module: azure.mgmt.cognitiveservices.types
summary: Azure OpenAI Content Filter.
constructor:
  syntax: RaiPolicyContentFilter()
variables:
- description: Name of ContentFilter.
  name: name
  types:
  - <xref:str>
- description: If the ContentFilter is enabled.
  name: enabled
  types:
  - <xref:bool>
- description: 'Level at which content is filtered. Known values are: "Low", "Medium",

    and "High".'
  name: severityThreshold
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ContentLevel">]
- description: If blocking would occur.
  name: blocking
  types:
  - <xref:bool>
- description: 'Content source to apply the Content Filters. Known values are: "Prompt",

    "Completion", "PreToolCall", "PostToolCall", "PreRun", and "PostRun".'
  name: source
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RaiPolicyContentSource">]
- description: 'The action types to apply to the content filters. Known values are:
    "None",

    "BLOCKING", "ANNOTATING", "HITL", and "RETRY".'
  name: action
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RaiActionType">]
