### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.DeploymentProperties
name: DeploymentProperties
fullName: azure.mgmt.cognitiveservices.types.DeploymentProperties
module: azure.mgmt.cognitiveservices.types
summary: Properties of Cognitive Services account deployment.
constructor:
  syntax: DeploymentProperties()
variables:
- description: 'Gets the status of the resource at the time the operation was called.

    Known values are: "Accepted", "Creating", "Deleting", "Moving", "Failed", "Succeeded",

    "Disabled", and "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentProvisioningState">]
- description: Properties of Cognitive Services account deployment model.
  name: model
  types:
  - <xref:<xref:"DeploymentModel">>
- description: 'The resource ID of the context cache container associated with

    this deployment.'
  name: contextCacheContainerId
  types:
  - <xref:str>
- description: 'Speculative decoding settings for the deployment. This configuration

    applies to Fireworks model formats.'
  name: speculativeDecoding
  types:
  - <xref:<xref:"DeploymentSpeculativeDecoding">>
- description: 'Properties of Cognitive Services account deployment model. (Deprecated,

    please use Deployment.sku instead.).'
  name: scaleSettings
  types:
  - <xref:<xref:"DeploymentScaleSettings">>
- description: The capabilities.
  name: capabilities
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: The name of RAI policy.
  name: raiPolicyName
  types:
  - <xref:str>
- description: The call rate limit Cognitive Services account.
  name: callRateLimit
  types:
  - <xref:<xref:"CallRateLimit">>
- name: rateLimits
  types:
  - <xref:list>[<xref:"ThrottlingRule">]
- description: 'Deployment model version upgrade option. Known values are:

    "OnceNewDefaultVersionAvailable", "OnceCurrentVersionExpired", and "NoAutoUpgrade".'
  name: versionUpgradeOption
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentModelVersionUpgradeOption">]
- description: If the dynamic throttling is enabled.
  name: dynamicThrottlingEnabled
  types:
  - <xref:bool>
- description: The current capacity.
  name: currentCapacity
  types:
  - <xref:int>
- description: Internal use only.
  name: capacitySettings
  types:
  - <xref:<xref:"DeploymentCapacitySettings">>
- description: The name of parent deployment.
  name: parentDeploymentName
  types:
  - <xref:str>
- description: 'Specifies the deployment name that should serve requests when

    the request would have otherwise been throttled due to reaching current deployment
    throughput

    limit.'
  name: spilloverDeploymentName
  types:
  - <xref:str>
- description: 'The service tier for the deployment. Determines the pricing and performance

    level for request processing. Use ''Default'' for standard pricing or ''Priority''
    for

    higher-priority processing with premium pricing. Note: Pause operations are only
    supported on

    Standard, DataZoneStandard, and GlobalStandard SKUs. Known values are: "Default"
    and

    "Priority".'
  name: serviceTier
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServiceTier">]
- description: 'The state of the deployment. Controls whether the deployment is

    accepting inference requests. Use ''Running'' for active deployments that process
    requests, or

    ''Paused'' to temporarily stop inference while preserving the deployment configuration.
    Known

    values are: "Running" and "Paused".'
  name: deploymentState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentState">]
- description: 'Routing configuration for the model-router deployment. This property
    is only

    applicable when the deployed model is ''model-router'' version 2025-11-18 or later.
    Allows you to

    select the models subset for routing and the routing mode (balanced, quality,
    cost) for routing

    across all supported models or the model subset.'
  name: routing
  types:
  - <xref:<xref:"DeploymentRouting">>
attributes:
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.callRateLimit
  name: callRateLimit
  summary: The call rate limit Cognitive Services account.
  signature: 'callRateLimit: CallRateLimit'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.capabilities
  name: capabilities
  summary: The capabilities.
  signature: 'capabilities: dict[str, str]'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.capacitySettings
  name: capacitySettings
  summary: Internal use only.
  signature: 'capacitySettings: DeploymentCapacitySettings'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.contextCacheContainerId
  name: contextCacheContainerId
  summary: The resource ID of the context cache container associated with this deployment.
  signature: 'contextCacheContainerId: str'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.currentCapacity
  name: currentCapacity
  summary: The current capacity.
  signature: 'currentCapacity: int'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.deploymentState
  name: deploymentState
  summary: 'The state of the deployment. Controls whether the deployment is accepting
    inference requests.

    Use ''Running'' for active deployments that process requests, or ''Paused'' to
    temporarily stop

    inference while preserving the deployment configuration. Known values are: "Running"
    and

    "Paused".'
  signature: 'deploymentState: str | DeploymentState | None'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.dynamicThrottlingEnabled
  name: dynamicThrottlingEnabled
  summary: If the dynamic throttling is enabled.
  signature: 'dynamicThrottlingEnabled: bool'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.model
  name: model
  summary: Properties of Cognitive Services account deployment model.
  signature: 'model: DeploymentModel'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.parentDeploymentName
  name: parentDeploymentName
  summary: The name of parent deployment.
  signature: 'parentDeploymentName: str'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.provisioningState
  name: provisioningState
  summary: 'Gets the status of the resource at the time the operation was called.
    Known values are:

    "Accepted", "Creating", "Deleting", "Moving", "Failed", "Succeeded", "Disabled",

    and "Canceled".'
  signature: 'provisioningState: str | DeploymentProvisioningState'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.raiPolicyName
  name: raiPolicyName
  summary: The name of RAI policy.
  signature: 'raiPolicyName: str'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.routing
  name: routing
  summary: 'Routing configuration for the model-router deployment. This property is
    only applicable when

    the deployed model is ''model-router'' version 2025-11-18 or later. Allows you
    to select the

    models subset for routing and the routing mode (balanced, quality, cost) for routing
    across all

    supported models or the model subset.'
  signature: 'routing: DeploymentRouting'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.scaleSettings
  name: scaleSettings
  summary: 'Properties of Cognitive Services account deployment model. (Deprecated,
    please use

    Deployment.sku instead.).'
  signature: 'scaleSettings: DeploymentScaleSettings'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.serviceTier
  name: serviceTier
  summary: 'The service tier for the deployment. Determines the pricing and performance
    level for request

    processing. Use ''Default'' for standard pricing or ''Priority'' for higher-priority
    processing

    with premium pricing. Note: Pause operations are only supported on Standard, DataZoneStandard,

    and GlobalStandard SKUs. Known values are: "Default" and "Priority".'
  signature: 'serviceTier: str | ServiceTier | None'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.speculativeDecoding
  name: speculativeDecoding
  summary: 'Speculative decoding settings for the deployment. This configuration applies
    to Fireworks model

    formats.'
  signature: 'speculativeDecoding: DeploymentSpeculativeDecoding'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.spilloverDeploymentName
  name: spilloverDeploymentName
  summary: 'Specifies the deployment name that should serve requests when the request
    would have otherwise

    been throttled due to reaching current deployment throughput limit.'
  signature: 'spilloverDeploymentName: str'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.versionUpgradeOption
  name: versionUpgradeOption
  summary: '"OnceNewDefaultVersionAvailable",

    "OnceCurrentVersionExpired", and "NoAutoUpgrade".'
  signature: 'versionUpgradeOption: str | DeploymentModelVersionUpgradeOption'
- uid: azure.mgmt.cognitiveservices.types.DeploymentProperties.rateLimits
  name: rateLimits
  signature: 'rateLimits: list[''ThrottlingRule'']'
