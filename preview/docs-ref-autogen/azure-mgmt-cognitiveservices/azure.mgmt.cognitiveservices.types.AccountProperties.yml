- uid: azure.mgmt.cognitiveservices.types.AccountProperties.agentHostingConfigurations
  name: agentHostingConfigurations
  summary: 'Customer-owned AKS hosting configurations for Foundry agents. This property
    can only be

    specified when the account is created; an existing account without a hosting configuration

    cannot add one later. This API version supports exactly one configuration, while
    the array

    shape is reserved for future API versions that may support multiple configurations.
    Once set,

    the configuration cannot be changed, removed, or reordered. Account update requests
    should omit

    this property or send the complete existing value unchanged. Responses only include
    hosting

    configuration types defined by the requested API version.'
  signature: 'agentHostingConfigurations: list[''AgentHostingConfiguration'']'
