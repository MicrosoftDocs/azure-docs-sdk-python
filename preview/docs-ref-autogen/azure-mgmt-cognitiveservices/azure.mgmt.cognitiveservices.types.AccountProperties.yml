### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.AccountProperties
name: AccountProperties
fullName: azure.mgmt.cognitiveservices.types.AccountProperties
module: azure.mgmt.cognitiveservices.types
summary: Properties of Cognitive Services account.
constructor:
  syntax: AccountProperties()
variables:
- description: 'Gets the status of the cognitive services account at the time the

    operation was called. Known values are: "Accepted", "Creating", "Deleting", "Moving",
    "Failed",

    "Succeeded", "Canceled", "ResolvingDNS", and "ExtensionUnreachable".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: Endpoint of the created account.
  name: endpoint
  types:
  - <xref:str>
- description: The internal identifier (deprecated, do not use this property).
  name: internalId
  types:
  - <xref:str>
- description: 'Gets the capabilities of the cognitive services account. Each item

    indicates the capability of a specific feature. The values are read-only and for
    reference

    only.'
  name: capabilities
  types:
  - <xref:list>[<xref:"SkuCapability">]
- description: If the resource is migrated from an existing key.
  name: isMigrated
  types:
  - <xref:bool>
- description: Resource migration token.
  name: migrationToken
  types:
  - <xref:str>
- description: Sku change info of account.
  name: skuChangeInfo
  types:
  - <xref:<xref:"SkuChangeInfo">>
- description: Optional subdomain name used for token-based authentication.
  name: customSubDomainName
  types:
  - <xref:str>
- description: 'A collection of rules governing the accessibility from specific network

    locations.'
  name: networkAcls
  types:
  - <xref:<xref:"NetworkRuleSet">>
- description: The encryption properties for this resource.
  name: encryption
  types:
  - <xref:<xref:"Encryption">>
- description: The storage accounts for this resource.
  name: userOwnedStorage
  types:
  - <xref:list>[<xref:"UserOwnedStorage">]
- description: The user owned AML account properties.
  name: amlWorkspace
  types:
  - <xref:<xref:"UserOwnedAmlWorkspace">>
- description: 'The private endpoint connection associated with the Cognitive

    Services account.'
  name: privateEndpointConnections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: 'Whether or not public endpoint access is allowed for this account.

    Known values are: "Enabled" and "Disabled".'
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: The api properties for special APIs.
  name: apiProperties
  types:
  - <xref:<xref:"ApiProperties">>
- description: Gets the date of cognitive services account creation.
  name: dateCreated
  types:
  - <xref:str>
- description: The call rate limit Cognitive Services account.
  name: callRateLimit
  types:
  - <xref:<xref:"CallRateLimit">>
- description: The flag to enable dynamic throttling.
  name: dynamicThrottlingEnabled
  types:
  - <xref:bool>
- description: The flag to disable stored completions.
  name: storedCompletionsDisabled
  types:
  - <xref:bool>
- description: 'Specifies whether A365 logging is enabled. Defaults to true. Set to

    false to opt out.'
  name: a365LoggingEnabled
  types:
  - <xref:bool>
- name: quotaLimit
  types:
  - <xref:<xref:"QuotaLimit">>
- name: restrictOutboundNetworkAccess
  types:
  - <xref:bool>
- name: allowedFqdnList
  types:
  - <xref:list>[<xref:str>]
- name: disableLocalAuth
  types:
  - <xref:bool>
- description: Dictionary of <string>.
  name: endpoints
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- name: restore
  types:
  - <xref:bool>
- description: The deletion date, only available for deleted account.
  name: deletionDate
  types:
  - <xref:str>
- description: The scheduled purge date, only available for deleted account.
  name: scheduledPurgeDate
  types:
  - <xref:str>
- description: The multiregion settings of Cognitive Services account.
  name: locations
  types:
  - <xref:<xref:"MultiRegionSettings">>
- description: 'The commitment plan associations of Cognitive Services

    account.'
  name: commitmentPlanAssociations
  types:
  - <xref:list>[<xref:"CommitmentPlanAssociation">]
- description: The abuse penalty.
  name: abusePenalty
  types:
  - <xref:<xref:"AbusePenalty">>
- description: Cognitive Services Rai Monitor Config.
  name: raiMonitorConfig
  types:
  - <xref:<xref:"RaiMonitorConfig">>
- name: networkInjections
  types:
  - <xref:list>[<xref:"NetworkInjection">]
- description: 'Represents the foundry auto-upgrade configuration for a Cognitive

    Services account.'
  name: foundryAutoUpgrade
  types:
  - <xref:<xref:"FoundryAutoUpgrade">>
- description: 'Specifies whether this resource support project management as

    child resources, used as containers for access management, data isolation and
    cost in AI

    Foundry.'
  name: allowProjectManagement
  types:
  - <xref:bool>
- description: 'Specifies the project, by project name, that is targeted when data
    plane

    endpoints are called without a project parameter.'
  name: defaultProject
  types:
  - <xref:str>
- description: 'Specifies the projects, by project name, that are associated with

    this resource.'
  name: associatedProjects
  types:
  - <xref:list>[<xref:str>]
- description: 'Reusable default agent capability settings inherited by child

    projects.'
  name: capabilitySettings
  types:
  - <xref:<xref:"CapabilitySettings">>
- description: 'Customer-owned AKS hosting configurations for Foundry agents.

    This property can only be specified when the account is created; an existing account
    without a

    hosting configuration cannot add one later. This API version supports exactly
    one

    configuration, while the array shape is reserved for future API versions that
    may support

    multiple configurations. Once set, the configuration cannot be changed, removed,
    or reordered.

    Account update requests should omit this property or send the complete existing
    value

    unchanged. Responses only include hosting configuration types defined by the requested
    API

    version.'
  name: agentHostingConfigurations
  types:
  - <xref:list>[<xref:"AgentHostingConfiguration">]
attributes:
- uid: azure.mgmt.cognitiveservices.types.AccountProperties.a365LoggingEnabled
  name: a365LoggingEnabled
  summary: Specifies whether A365 logging is enabled. Defaults to true. Set to false
    to opt out.
