### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.RaiEgressPolicyConfig
name: RaiEgressPolicyConfig
fullName: azure.mgmt.cognitiveservices.types.RaiEgressPolicyConfig
module: azure.mgmt.cognitiveservices.types
summary: 'Egress (outbound network) policy configuration nested within an RAI policy.
  Controls which

  external endpoints sandboxed agents can reach and what transformations (header injection,
  URL

  rewrite) are applied to matching traffic.'
constructor:
  syntax: RaiEgressPolicyConfig()
variables:
- description: 'The enforcement mode for egress rules. If omitted on create, the server
    defaults to

    Enforced. On subsequent GET requests, the server always returns the effective
    mode. Known

    values are: "Enforced" and "Audit".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RaiEgressMode">]
- description: "The default action when no user-defined rules match. Deny blocks unmatched\n\
    traffic; Allow permits it. Transform and Rewrite rules are always applied to their\
    \ matched\ntraffic regardless of this setting \u2014 defaultAction only governs\
    \ traffic that does not match any\nrule. If omitted on create, the server defaults\
    \ to Deny (fail-closed). On subsequent GET\nrequests, the server always returns\
    \ the effective value. Known values are: \"Allow\" and \"Deny\"."
  name: defaultAction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RaiEgressDefaultAction">]
- description: Description of the egress policy.
  name: description
  types:
  - <xref:str>
- description: 'Ordered list of egress rules. First matching rule wins. Rules are
    evaluated in

    declaration order; the first rule whose match criteria are satisfied determines
    the action

    taken on the request.'
  name: rules
  types:
  - <xref:list>[<xref:"RaiEgressRule">]
attributes:
- uid: azure.mgmt.cognitiveservices.types.RaiEgressPolicyConfig.defaultAction
  name: defaultAction
  summary: "The default action when no user-defined rules match. Deny blocks unmatched\
    \ traffic; Allow\npermits it. Transform and Rewrite rules are always applied to\
    \ their matched traffic regardless\nof this setting \u2014 defaultAction only\
    \ governs traffic that does not match any rule. If omitted\non create, the server\
    \ defaults to Deny (fail-closed). On subsequent GET requests, the server\nalways\
    \ returns the effective value. Known values are: \"Allow\" and \"Deny\"."
  signature: 'defaultAction: str | RaiEgressDefaultAction'
- uid: azure.mgmt.cognitiveservices.types.RaiEgressPolicyConfig.description
  name: description
  summary: Description of the egress policy.
  signature: 'description: str'
- uid: azure.mgmt.cognitiveservices.types.RaiEgressPolicyConfig.mode
  name: mode
  summary: 'The enforcement mode for egress rules. If omitted on create, the server
    defaults to Enforced.

    On subsequent GET requests, the server always returns the effective mode. Known
    values are:

    "Enforced" and "Audit".'
  signature: 'mode: str | RaiEgressMode'
- uid: azure.mgmt.cognitiveservices.types.RaiEgressPolicyConfig.rules
  name: rules
  summary: 'Ordered list of egress rules. First matching rule wins. Rules are evaluated
    in declaration

    order; the first rule whose match criteria are satisfied determines the action
    taken on the

    request.'
  signature: 'rules: list[''RaiEgressRule'']'
