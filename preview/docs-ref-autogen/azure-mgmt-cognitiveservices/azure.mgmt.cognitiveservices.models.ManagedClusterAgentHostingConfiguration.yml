### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.models.ManagedClusterAgentHostingConfiguration
name: ManagedClusterAgentHostingConfiguration
fullName: azure.mgmt.cognitiveservices.models.ManagedClusterAgentHostingConfiguration
module: azure.mgmt.cognitiveservices.models
summary: Configuration for hosting Foundry agents on an Azure Kubernetes Service managed
  cluster.
constructor:
  syntax: 'ManagedClusterAgentHostingConfiguration(*args: Any, **kwargs: Any)'
variables:
- description: Unique name of the hosting configuration within the Foundry account.
    Required.
  name: name
  types:
  - <xref:str>
- description: 'Type of infrastructure used to host Foundry agents. Required. Agents
    are

    hosted on an Azure Kubernetes Service managed cluster.'
  name: hosting_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.cognitiveservices.models.MANAGED_CLUSTER>
- description: 'Azure resource ID of the user-assigned managed

    identity used by the Foundry resource provider to manage the hosting configuration.
    The

    identity must be assigned to the Foundry account in identity.userAssignedIdentities.
    Required.'
  name: hosting_management_identity_resource_id
  types:
  - <xref:str>
- description: 'Azure resource ID of the separate user-assigned managed

    identity federated to service accounts on the AKS cluster. Hosted agents use this
    identity to

    access the Azure Storage blob data plane. Required.'
  name: workload_identity_resource_id
  types:
  - <xref:str>
- description: 'Azure resource ID of the customer-owned AKS managed cluster that

    runs the hosted agent workloads. Required.'
  name: cluster_resource_id
  types:
  - <xref:str>
- description: 'Azure resource ID of the customer-owned storage account used

    by the hosted agents. The storage account must be in the same subscription and
    region as the

    AKS cluster, and its data-plane endpoint must be reachable from the workload network.
    Required.'
  name: storage_account_resource_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cognitiveservices.models.ManagedClusterAgentHostingConfiguration.cluster_resource_id
  name: cluster_resource_id
  summary: 'Azure resource ID of the customer-owned AKS managed cluster that runs
    the hosted agent

    workloads. Required.'
  signature: 'cluster_resource_id: str'
- uid: azure.mgmt.cognitiveservices.models.ManagedClusterAgentHostingConfiguration.hosting_management_identity_resource_id
  name: hosting_management_identity_resource_id
  summary: 'Azure resource ID of the user-assigned managed identity used by the Foundry
    resource provider

    to manage the hosting configuration. The identity must be assigned to the Foundry
    account in

    identity.userAssignedIdentities. Required.'
  signature: 'hosting_management_identity_resource_id: str'
- uid: azure.mgmt.cognitiveservices.models.ManagedClusterAgentHostingConfiguration.hosting_type
  name: hosting_type
  summary: 'Type of infrastructure used to host Foundry agents. Required. Agents are
    hosted on an Azure

    Kubernetes Service managed cluster.'
  signature: 'hosting_type: MANAGED_CLUSTER: ''ManagedCluster''>]'
- uid: azure.mgmt.cognitiveservices.models.ManagedClusterAgentHostingConfiguration.storage_account_resource_id
  name: storage_account_resource_id
  summary: 'Azure resource ID of the customer-owned storage account used by the hosted
    agents. The storage

    account must be in the same subscription and region as the AKS cluster, and its
    data-plane

    endpoint must be reachable from the workload network. Required.'
  signature: 'storage_account_resource_id: str'
- uid: azure.mgmt.cognitiveservices.models.ManagedClusterAgentHostingConfiguration.workload_identity_resource_id
  name: workload_identity_resource_id
  summary: 'Azure resource ID of the separate user-assigned managed identity federated
    to service accounts

    on the AKS cluster. Hosted agents use this identity to access the Azure Storage
    blob data

    plane. Required.'
  signature: 'workload_identity_resource_id: str'
