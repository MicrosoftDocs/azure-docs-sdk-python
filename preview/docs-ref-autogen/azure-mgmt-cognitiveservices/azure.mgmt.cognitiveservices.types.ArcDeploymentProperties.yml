### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties
name: ArcDeploymentProperties
fullName: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties
module: azure.mgmt.cognitiveservices.types
summary: Properties of a Cognitive Services Arc deployment.
constructor:
  syntax: ArcDeploymentProperties()
variables:
- description: Model reference. Required on creation and immutable after creation.
    Required.
  name: model
  types:
  - <xref:<xref:"ArcDeploymentModel">>
- description: 'Full Azure resource ID of the Foundry inference extension on the target

    Arc-enabled Kubernetes cluster. Required on creation and immutable after creation.
    Required.'
  name: extensionId
  types:
  - <xref:str>
- description: 'Inference runtime. Required on creation and immutable after creation.
    Required.

    Known values are: "vllm" and "onnx-genai".'
  name: runtime
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ArcDeploymentRuntime">]
- description: 'Compute type for the deployment. Required on creation and immutable
    after

    creation. Required. Known values are: "gpu" and "cpu".'
  name: compute
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ArcDeploymentComputeType">]
- description: 'Optional deployment template identifier for advanced vLLM tuning.

    Allowed only when runtime is vllm. Example:

    azureml://registries/{registry}/deploymenttemplates/{template}/versions/{version}.'
  name: deploymentTemplate
  types:
  - <xref:str>
- description: 'Read-only. Effective vLLM runtime parameters resolved for the deployed

    model. Returned only when runtime is vllm.'
  name: vllmParameters
  types:
  - <xref:<xref:"ArcDeploymentVllmParameters">>
- description: Physical replica count on the Arc cluster. Required.
  name: replicas
  types:
  - <xref:int>
- description: Per-replica Kubernetes resource requests and limits. Required.
  name: resources
  types:
  - <xref:<xref:"ArcDeploymentKubernetesResources">>
- description: 'Kubernetes node selector key-value map used to schedule pods onto
    nodes

    with matching labels.'
  name: nodeSelector
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'The deployment state. Known values are: "Running" and "Paused".'
  name: deploymentState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentState">]
- description: The name of RAI policy.
  name: raiPolicyName
  types:
  - <xref:str>
- description: 'Read-only. Current provisioning state. Known values are: "Accepted",

    "Creating", "Deleting", "Moving", "Failed", "Succeeded", "Canceled", "ResolvingDNS",
    and

    "ExtensionUnreachable".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Read-only. Status message and timestamp from the last provisioning

    operation.'
  name: provisioningDetails
  types:
  - <xref:<xref:"ArcDeploymentProvisioningDetails">>
- description: 'Read-only. Base URL for inference calls to this deployment on the
    Arc

    cluster. Populated when provisioningState is Succeeded.'
  name: inferenceEndpoint
  types:
  - <xref:str>
- description: Read-only. Deployment capabilities represented as key-value pairs.
  name: capabilities
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
attributes:
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.capabilities
  name: capabilities
  summary: Read-only. Deployment capabilities represented as key-value pairs.
  signature: 'capabilities: dict[str, str]'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.compute
  name: compute
  summary: 'Compute type for the deployment. Required on creation and immutable after
    creation. Required.

    Known values are: "gpu" and "cpu".'
  signature: 'compute: Required[str | ArcDeploymentComputeType]'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.deploymentState
  name: deploymentState
  summary: '"Running" and "Paused".'
  signature: 'deploymentState: str | DeploymentState'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.deploymentTemplate
  name: deploymentTemplate
  summary: 'Optional deployment template identifier for advanced vLLM tuning. Allowed
    only when runtime is

    vllm. Example:

    azureml://registries/{registry}/deploymenttemplates/{template}/versions/{version}.'
  signature: 'deploymentTemplate: str'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.extensionId
  name: extensionId
  summary: 'Full Azure resource ID of the Foundry inference extension on the target
    Arc-enabled Kubernetes

    cluster. Required on creation and immutable after creation. Required.'
  signature: 'extensionId: Required[str]'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.inferenceEndpoint
  name: inferenceEndpoint
  summary: 'Read-only. Base URL for inference calls to this deployment on the Arc
    cluster. Populated when

    provisioningState is Succeeded.'
  signature: 'inferenceEndpoint: str'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.model
  name: model
  summary: Model reference. Required on creation and immutable after creation. Required.
  signature: 'model: Required[ArcDeploymentModel]'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.nodeSelector
  name: nodeSelector
  summary: Kubernetes node selector key-value map used to schedule pods onto nodes
    with matching labels.
  signature: 'nodeSelector: dict[str, str]'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.provisioningDetails
  name: provisioningDetails
  summary: Read-only. Status message and timestamp from the last provisioning operation.
  signature: 'provisioningDetails: ArcDeploymentProvisioningDetails'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.provisioningState
  name: provisioningState
  summary: '"Accepted", "Creating",

    "Deleting", "Moving", "Failed", "Succeeded", "Canceled", "ResolvingDNS", and

    "ExtensionUnreachable".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.raiPolicyName
  name: raiPolicyName
  summary: The name of RAI policy.
  signature: 'raiPolicyName: str'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.replicas
  name: replicas
  summary: Physical replica count on the Arc cluster. Required.
  signature: 'replicas: Required[int]'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.resources
  name: resources
  summary: Per-replica Kubernetes resource requests and limits. Required.
  signature: 'resources: Required[ArcDeploymentKubernetesResources]'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.runtime
  name: runtime
  summary: 'Inference runtime. Required on creation and immutable after creation.
    Required. Known values

    are: "vllm" and "onnx-genai".'
  signature: 'runtime: Required[str | ArcDeploymentRuntime]'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentProperties.vllmParameters
  name: vllmParameters
  summary: 'Read-only. Effective vLLM runtime parameters resolved for the deployed
    model. Returned only

    when runtime is vllm.'
  signature: 'vllmParameters: ArcDeploymentVllmParameters'
