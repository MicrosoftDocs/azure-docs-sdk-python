  - <xref:str>
- description: Target path (literal string). Original path (and query) is kept if
    omitted.
  name: path
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cognitiveservices.types.RaiEgressRewriteTarget.host
  name: host
  summary: Target host. Original host is kept if omitted.
  signature: 'host: str'
- uid: azure.mgmt.cognitiveservices.types.RaiEgressRewriteTarget.path
  name: path
  summary: Target path (literal string). Original path (and query) is kept if omitted.
