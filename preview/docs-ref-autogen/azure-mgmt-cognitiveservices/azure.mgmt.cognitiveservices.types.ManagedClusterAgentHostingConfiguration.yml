### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.ManagedClusterAgentHostingConfiguration
name: ManagedClusterAgentHostingConfiguration
fullName: azure.mgmt.cognitiveservices.types.ManagedClusterAgentHostingConfiguration
module: azure.mgmt.cognitiveservices.types
summary: Configuration for hosting Foundry agents on an Azure Kubernetes Service managed
  cluster.
constructor:
  syntax: ManagedClusterAgentHostingConfiguration()
variables:
- description: Unique name of the hosting configuration within the Foundry account.
    Required.
  name: name
  types:
  - <xref:str>
- description: 'Type of infrastructure used to host Foundry agents. Required. Agents
    are

    hosted on an Azure Kubernetes Service managed cluster.'
  name: hostingType
  types:
  - <xref:typing.Literal>[AgentHostingType.MANAGED_CLUSTER]
- description: 'Azure resource ID of the user-assigned managed

    identity used by the Foundry resource provider to manage the hosting configuration.
    The

    identity must be assigned to the Foundry account in identity.userAssignedIdentities.
    Required.'
  name: hostingManagementIdentityResourceId
  types:
  - <xref:str>
- description: 'Azure resource ID of the separate user-assigned managed

    identity federated to service accounts on the AKS cluster. Hosted agents use this
    identity to

    access the Azure Storage blob data plane. Required.'
  name: workloadIdentityResourceId
  types:
  - <xref:str>
- description: 'Azure resource ID of the customer-owned AKS managed cluster that runs

    the hosted agent workloads. Required.'
  name: clusterResourceId
  types:
  - <xref:str>
- description: 'Azure resource ID of the customer-owned storage account used by

    the hosted agents. The storage account must be in the same subscription and region
    as the AKS

    cluster, and its data-plane endpoint must be reachable from the workload network.
    Required.'
  name: storageAccountResourceId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cognitiveservices.types.ManagedClusterAgentHostingConfiguration.clusterResourceId
  name: clusterResourceId
  summary: 'Azure resource ID of the customer-owned AKS managed cluster that runs
    the hosted agent

    workloads. Required.'
  signature: 'clusterResourceId: str'
- uid: azure.mgmt.cognitiveservices.types.ManagedClusterAgentHostingConfiguration.hostingManagementIdentityResourceId
  name: hostingManagementIdentityResourceId
  summary: 'Azure resource ID of the user-assigned managed identity used by the Foundry
    resource provider

    to manage the hosting configuration. The identity must be assigned to the Foundry
    account in

    identity.userAssignedIdentities. Required.'
  signature: 'hostingManagementIdentityResourceId: str'
- uid: azure.mgmt.cognitiveservices.types.ManagedClusterAgentHostingConfiguration.hostingType
  name: hostingType
  summary: 'Type of infrastructure used to host Foundry agents. Required. Agents are
    hosted on an Azure

    Kubernetes Service managed cluster.'
  signature: 'hostingType: MANAGED_CLUSTER: ''ManagedCluster''>]'
- uid: azure.mgmt.cognitiveservices.types.ManagedClusterAgentHostingConfiguration.name
  name: name
  summary: Unique name of the hosting configuration within the Foundry account. Required.
  signature: 'name: str'
- uid: azure.mgmt.cognitiveservices.types.ManagedClusterAgentHostingConfiguration.storageAccountResourceId
  name: storageAccountResourceId
  summary: 'Azure resource ID of the customer-owned storage account used by the hosted
    agents. The storage

    account must be in the same subscription and region as the AKS cluster, and its
    data-plane

    endpoint must be reachable from the workload network. Required.'
  signature: 'storageAccountResourceId: str'
- uid: azure.mgmt.cognitiveservices.types.ManagedClusterAgentHostingConfiguration.workloadIdentityResourceId
  name: workloadIdentityResourceId
  summary: 'Azure resource ID of the separate user-assigned managed identity federated
    to service accounts

    on the AKS cluster. Hosted agents use this identity to access the Azure Storage
    blob data

    plane. Required.'
  signature: 'workloadIdentityResourceId: str'
