variables:
- description: 'Gets the status of the cognitive services project at the time the

    operation was called. Known values are: "Accepted", "Creating", "Deleting", "Moving",
    "Failed",

    "Succeeded", "Canceled", "ResolvingDNS", and "ExtensionUnreachable".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The display name of the Cognitive Services Project.
  name: displayName
  types:
  - <xref:str>
- description: The description of the Cognitive Services Project.
  name: description
  types:
  - <xref:str>
- description: The list of endpoint for this Cognitive Services Project.
  name: endpoints
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Indicates whether the project is the default project for the account.
  name: isDefault
  types:
  - <xref:bool>
- description: 'Effective agent capability settings for the project. Optional partial

    override of the account defaults; omitted fields inherit from the parent account
    when present.

    Settable only at create time.'
  name: capabilitySettings
  types:
  - <xref:<xref:"CapabilitySettings">>
