### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.ArcDeploymentResourceRequirements
name: ArcDeploymentResourceRequirements
fullName: azure.mgmt.cognitiveservices.types.ArcDeploymentResourceRequirements
module: azure.mgmt.cognitiveservices.types
summary: 'Kubernetes resource requirements for an Arc deployment replica. Specify
  either cpu and memory

  together, or gpu. GPU is supported only in limits, not requests.'
constructor:
  syntax: ArcDeploymentResourceRequirements()
variables:
- description: 'Kubernetes CPU quantity string, for example 500m, 2, 4, or 8. Required
    with memory

    when specifying CPU and memory limits. Do not specify with gpu.'
  name: cpu
  types:
  - <xref:str>
- description: 'Kubernetes memory quantity string, for example 512Mi, 2Gi, or 16Gi.
    Required with

    cpu when specifying CPU and memory limits. Do not specify with gpu.'
  name: memory
  types:
  - <xref:str>
- description: 'Kubernetes GPU quantity, for example 1, 2, or 5. Required when specifying
    GPU

    limits. Do not specify with cpu or memory.'
  name: gpu
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentResourceRequirements.cpu
  name: cpu
  summary: 'Kubernetes CPU quantity string, for example 500m, 2, 4, or 8. Required
    with memory when

    specifying CPU and memory limits. Do not specify with gpu.'
  signature: 'cpu: str'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentResourceRequirements.gpu
  name: gpu
  summary: 'Kubernetes GPU quantity, for example 1, 2, or 5. Required when specifying
    GPU limits. Do not

    specify with cpu or memory.'
  signature: 'gpu: int'
- uid: azure.mgmt.cognitiveservices.types.ArcDeploymentResourceRequirements.memory
  name: memory
  summary: 'Kubernetes memory quantity string, for example 512Mi, 2Gi, or 16Gi. Required
    with cpu when

    specifying CPU and memory limits. Do not specify with gpu.'
  signature: 'memory: str'
