### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.WorkbenchProperties
name: WorkbenchProperties
fullName: azure.mgmt.cognitiveservices.types.WorkbenchProperties
module: azure.mgmt.cognitiveservices.types
summary: Properties for a Workbench resource.
constructor:
  syntax: WorkbenchProperties()
variables:
- description: 'ARM resource ID of the parent cluster that hosts this workbench.

    Required.'
  name: targetClusterId
  types:
  - <xref:str>
- description: Container image URI (e.g., MCR or ACR image path) for the workbench.
    Required.
  name: imageLink
  types:
  - <xref:str>
- description: 'ISO 8601 duration before the idle workbench is automatically shut

    down (e.g., ''PT30M'').'
  name: idleTimeBeforeShutdown
  types:
  - <xref:str>
- description: The dataset ID to mount for the workbench.
  name: datasetId
  types:
  - <xref:str>
- description: SSH configuration for remote access to the workbench.
  name: sshSettings
  types:
  - <xref:<xref:"SshSettings">>
- description: Network connectivity endpoints assigned to the workbench.
  name: connectivityEndpoints
  types:
  - <xref:<xref:"ConnectivityEndpoints">>
- description: The web endpoint URL for accessing the workbench.
  name: webEndpoint
  types:
  - <xref:str>
- description: 'Provisioning state of the workbench resource. Known values are:

    "Accepted", "Succeeded", "Failed", "Canceled", "Deleting", "Scaling", "Disabled",
    "Starting",

    "Stopping", "Restarting", and "Stopped".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ComputeProvisioningState">]
- description: Error details for the workbench resource.
  name: errors
  types:
  - <xref:list>[<xref:"ErrorDetail">]
- description: Creation time of the workbench resource.
  name: creationTime
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cognitiveservices.types.WorkbenchProperties.connectivityEndpoints
  name: connectivityEndpoints
  summary: Network connectivity endpoints assigned to the workbench.
  signature: 'connectivityEndpoints: ConnectivityEndpoints'
- uid: azure.mgmt.cognitiveservices.types.WorkbenchProperties.creationTime
  name: creationTime
  summary: Creation time of the workbench resource.
  signature: 'creationTime: str'
- uid: azure.mgmt.cognitiveservices.types.WorkbenchProperties.datasetId
  name: datasetId
  summary: The dataset ID to mount for the workbench.
  signature: 'datasetId: str'
- uid: azure.mgmt.cognitiveservices.types.WorkbenchProperties.errors
  name: errors
  summary: Error details for the workbench resource.
  signature: 'errors: list[''ErrorDetail'']'
- uid: azure.mgmt.cognitiveservices.types.WorkbenchProperties.idleTimeBeforeShutdown
  name: idleTimeBeforeShutdown
  summary: ISO 8601 duration before the idle workbench is automatically shut down
    (e.g., 'PT30M').
  signature: 'idleTimeBeforeShutdown: str'
- uid: azure.mgmt.cognitiveservices.types.WorkbenchProperties.imageLink
  name: imageLink
  summary: Container image URI (e.g., MCR or ACR image path) for the workbench. Required.
  signature: 'imageLink: Required[str]'
