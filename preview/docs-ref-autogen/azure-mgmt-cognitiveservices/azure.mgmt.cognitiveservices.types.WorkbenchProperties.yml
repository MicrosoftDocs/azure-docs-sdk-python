  name: provisioningState
  summary: '"Accepted", "Succeeded",

    "Failed", "Canceled", "Deleting", "Scaling", "Disabled", "Starting", "Stopping",

    "Restarting", and "Stopped".'
  signature: 'provisioningState: str | ComputeProvisioningState'
- uid: azure.mgmt.cognitiveservices.types.WorkbenchProperties.sshSettings
  name: sshSettings
  summary: SSH configuration for remote access to the workbench.
  signature: 'sshSettings: SshSettings'
- uid: azure.mgmt.cognitiveservices.types.WorkbenchProperties.targetClusterId
  name: targetClusterId
  summary: ARM resource ID of the parent cluster that hosts this workbench. Required.
  signature: 'targetClusterId: Required[str]'
- uid: azure.mgmt.cognitiveservices.types.WorkbenchProperties.webEndpoint
  name: webEndpoint
  summary: The web endpoint URL for accessing the workbench.
  signature: 'webEndpoint: str'
