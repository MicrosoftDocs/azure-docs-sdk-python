### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.NetworkRuleSet
name: NetworkRuleSet
fullName: azure.mgmt.cognitiveservices.types.NetworkRuleSet
module: azure.mgmt.cognitiveservices.types
summary: A set of rules governing the network accessibility.
constructor:
  syntax: NetworkRuleSet()
variables:
- description: 'The default action when no rule from ipRules and from virtualNetworkRules

    match. This is only used after the bypass property has been evaluated. Known values
    are:

    "Allow" and "Deny".'
  name: defaultAction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkRuleAction">]
- description: 'Setting for trusted services. Known values are: "None" and "AzureServices".'
  name: bypass
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ByPassSelection">]
- description: The list of IP address rules.
  name: ipRules
  types:
  - <xref:list>[<xref:"IpRule">]
- description: The list of virtual network rules.
  name: virtualNetworkRules
  types:
  - <xref:list>[<xref:"VirtualNetworkRule">]
attributes:
- uid: azure.mgmt.cognitiveservices.types.NetworkRuleSet.bypass
  name: bypass
  summary: '"None" and "AzureServices".'
  signature: 'bypass: str | ByPassSelection'
- uid: azure.mgmt.cognitiveservices.types.NetworkRuleSet.defaultAction
  name: defaultAction
  summary: 'The default action when no rule from ipRules and from virtualNetworkRules
    match. This is only

    used after the bypass property has been evaluated. Known values are: "Allow" and
    "Deny".'
  signature: 'defaultAction: str | NetworkRuleAction'
- uid: azure.mgmt.cognitiveservices.types.NetworkRuleSet.ipRules
  name: ipRules
  summary: The list of IP address rules.
  signature: 'ipRules: list[''IpRule'']'
- uid: azure.mgmt.cognitiveservices.types.NetworkRuleSet.virtualNetworkRules
  name: virtualNetworkRules
  summary: The list of virtual network rules.
  signature: 'virtualNetworkRules: list[''VirtualNetworkRule'']'
