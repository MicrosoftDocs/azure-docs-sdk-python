### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.QuotaTierUpgradeEligibilityInfo
name: QuotaTierUpgradeEligibilityInfo
fullName: azure.mgmt.cognitiveservices.types.QuotaTierUpgradeEligibilityInfo
module: azure.mgmt.cognitiveservices.types
summary: Information about the quota tier upgrade eligibility for the subscription.
constructor:
  syntax: QuotaTierUpgradeEligibilityInfo()
variables:
- description: Name of the next quota tier for the subscription.
  name: nextTierName
  types:
  - <xref:str>
- description: 'Specifies whether an upgrade to the next quota tier is

    available. Known values are: "Available" and "NotAvailable".'
  name: upgradeAvailabilityStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UpgradeAvailabilityStatus">]
- description: 'The date after which the current tier will be upgraded to the next

    tier if the TierUpgradePolicy is "OnceUpgradeIsAvailable" (UTC).'
  name: upgradeApplicableDate
  types:
  - <xref:str>
- description: 'Reason in case the subscription is not eligible for upgrade

    to the next tier.'
  name: upgradeUnavailabilityReason
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cognitiveservices.types.QuotaTierUpgradeEligibilityInfo.nextTierName
  name: nextTierName
  summary: Name of the next quota tier for the subscription.
  signature: 'nextTierName: str | None'
- uid: azure.mgmt.cognitiveservices.types.QuotaTierUpgradeEligibilityInfo.upgradeApplicableDate
  name: upgradeApplicableDate
  summary: 'The date after which the current tier will be upgraded to the next tier
    if the

    TierUpgradePolicy is "OnceUpgradeIsAvailable" (UTC).'
  signature: 'upgradeApplicableDate: str | None'
- uid: azure.mgmt.cognitiveservices.types.QuotaTierUpgradeEligibilityInfo.upgradeAvailabilityStatus
  name: upgradeAvailabilityStatus
  summary: 'Specifies whether an upgrade to the next quota tier is available. Known
    values are:

    "Available" and "NotAvailable".'
  signature: 'upgradeAvailabilityStatus: str | UpgradeAvailabilityStatus'
- uid: azure.mgmt.cognitiveservices.types.QuotaTierUpgradeEligibilityInfo.upgradeUnavailabilityReason
  name: upgradeUnavailabilityReason
  summary: Reason in case the subscription is not eligible for upgrade to the next
    tier.
  signature: 'upgradeUnavailabilityReason: str | None'
