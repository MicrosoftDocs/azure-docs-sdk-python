### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties
name: AgenticApplicationProperties
fullName: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties
module: azure.mgmt.cognitiveservices.types
summary: Resource type representing an agentic application as a management construct.
constructor:
  syntax: AgenticApplicationProperties()
variables:
- description: The asset description text.
  name: description
  types:
  - <xref:str>
- description: Tag dictionary. Tags can be added, removed, and updated.
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: The display name of the application.
  name: displayName
  types:
  - <xref:str>
- description: The application's dedicated invocation endpoint.
  name: baseUrl
  types:
  - <xref:str>
- description: 'The list of agent definitions comprising this application, returned
    as references

    to the objects under the parent project; use this to obtain a flat list of all
    agent-version

    pairs represented by this application.'
  name: agents
  types:
  - <xref:list>[<xref:"AgentReferenceProperties">]
- description: The EntraId Agentic Blueprint of the application.
  name: agentIdentityBlueprint
  types:
  - <xref:<xref:"AssignedIdentity">>
- description: The (default) agent instance identity of the application.
  name: defaultInstanceIdentity
  types:
  - <xref:<xref:"AssignedIdentity">>
- description: 'Gets or sets the authorization policy associated with this agentic

    application instance.'
  name: authorizationPolicy
  types:
  - <xref:<xref:"ApplicationAuthorizationPolicy">>
- description: 'Gets or sets the traffic routing policy for the application''s

    deployments.'
  name: trafficRoutingPolicy
  types:
  - <xref:<xref:"ApplicationTrafficRoutingPolicy">>
- description: 'Provisioning state of the application. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AgenticApplicationProvisioningState">]
- description: Enabledstate of the application.
  name: isEnabled
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties.agentIdentityBlueprint
  name: agentIdentityBlueprint
  summary: The EntraId Agentic Blueprint of the application.
  signature: 'agentIdentityBlueprint: AssignedIdentity | None'
- uid: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties.agents
  name: agents
  summary: 'The list of agent definitions comprising this application, returned as
    references to the

    objects under the parent project; use this to obtain a flat list of all agent-version
    pairs

    represented by this application.'
  signature: 'agents: list[''AgentReferenceProperties''] | None'
- uid: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties.authorizationPolicy
  name: authorizationPolicy
  summary: Gets or sets the authorization policy associated with this agentic application
    instance.
  signature: 'authorizationPolicy: ApplicationAuthorizationPolicy | None'
- uid: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties.baseUrl
  name: baseUrl
  summary: The application's dedicated invocation endpoint.
  signature: 'baseUrl: str | None'
- uid: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties.defaultInstanceIdentity
  name: defaultInstanceIdentity
  summary: The (default) agent instance identity of the application.
  signature: 'defaultInstanceIdentity: AssignedIdentity | None'
- uid: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties.displayName
  name: displayName
  summary: The display name of the application.
  signature: 'displayName: str | None'
- uid: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties.isEnabled
  name: isEnabled
  summary: Enabledstate of the application.
  signature: 'isEnabled: bool'
- uid: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | AgenticApplicationProvisioningState'
- uid: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties.trafficRoutingPolicy
  name: trafficRoutingPolicy
  summary: Gets or sets the traffic routing policy for the application's deployments.
  signature: 'trafficRoutingPolicy: ApplicationTrafficRoutingPolicy | None'
- uid: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties.description
  name: description
  signature: 'description: str | None'
- uid: azure.mgmt.cognitiveservices.types.AgenticApplicationProperties.tags
  name: tags
  signature: 'tags: dict[str, str] | None'
