### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.ManagedAgentDeployment
name: ManagedAgentDeployment
fullName: azure.mgmt.cognitiveservices.types.ManagedAgentDeployment
module: azure.mgmt.cognitiveservices.types
summary: 'Represents a managed agent deployment where the underlying infrastructure
  is managed by the

  platform in the deployer''s subscription.'
constructor:
  syntax: ManagedAgentDeployment()
variables:
- description: The asset description text.
  name: description
  types:
  - <xref:str>
- description: Tag dictionary. Tags can be added, removed, and updated.
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Gets or sets the display name of the deployment.
  name: displayName
  types:
  - <xref:str>
- description: Gets or sets the unique identifier of the deployment.
  name: deploymentId
  types:
  - <xref:str>
- description: 'Gets or sets the current operational state of the deployment (and,
    intrinsically,

    of the comprising agents). Known values are: "Starting", "Running", "Stopping",
    "Stopped",

    "Failed", "Deleting", "Deleted", and "Updating".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AgentDeploymentState">]
- description: 'Gets or sets the supported protocol types and versions exposed by
    this

    deployment.'
  name: protocols
  types:
  - <xref:list>[<xref:"AgentProtocolVersion">]
- description: Returns a flat list of agent:version deployed in this deployment.
  name: agents
  types:
  - <xref:list>[<xref:"VersionedAgentReference">]
- description: 'Gets or sets the provisioning state of the agent deployment. Known

    values are: "Succeeded", "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AgentDeploymentProvisioningState">]
- description: 'Gets or sets the type of deployment for the agent. Required. The

    underlying infra is managed by the platform in the deployer''s subscription.'
  name: deploymentType
  types:
  - <xref:typing.Literal>[AgentDeploymentType.MANAGED]
attributes:
- uid: azure.mgmt.cognitiveservices.types.ManagedAgentDeployment.agents
  name: agents
  summary: version deployed in this deployment.
  signature: 'agents: list[''VersionedAgentReference''] | None'
- uid: azure.mgmt.cognitiveservices.types.ManagedAgentDeployment.deploymentId
  name: deploymentId
  summary: Gets or sets the unique identifier of the deployment.
  signature: 'deploymentId: str | None'
- uid: azure.mgmt.cognitiveservices.types.ManagedAgentDeployment.deploymentType
  name: deploymentType
  summary: 'Gets or sets the type of deployment for the agent. Required. The underlying
    infra is managed by

    the platform in the deployer''s subscription.'
  signature: 'deploymentType: MANAGED: ''Managed''>]]'
- uid: azure.mgmt.cognitiveservices.types.ManagedAgentDeployment.description
  name: description
  summary: The asset description text.
  signature: 'description: str | None'
- uid: azure.mgmt.cognitiveservices.types.ManagedAgentDeployment.displayName
  name: displayName
  summary: Gets or sets the display name of the deployment.
  signature: 'displayName: str | None'
- uid: azure.mgmt.cognitiveservices.types.ManagedAgentDeployment.protocols
  name: protocols
  summary: Gets or sets the supported protocol types and versions exposed by this
    deployment.
  signature: 'protocols: list[''AgentProtocolVersion''] | None'
- uid: azure.mgmt.cognitiveservices.types.ManagedAgentDeployment.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | AgentDeploymentProvisioningState'
- uid: azure.mgmt.cognitiveservices.types.ManagedAgentDeployment.state
  name: state
  summary: 'Gets or sets the current operational state of the deployment (and, intrinsically,
    of the

    comprising agents). Known values are: "Starting", "Running", "Stopping", "Stopped",

    "Failed", "Deleting", "Deleted", and "Updating".'
  signature: 'state: str | AgentDeploymentState | None'
- uid: azure.mgmt.cognitiveservices.types.ManagedAgentDeployment.tags
  name: tags
  summary: Tag dictionary. Tags can be added, removed, and updated.
  signature: 'tags: dict[str, str] | None'
