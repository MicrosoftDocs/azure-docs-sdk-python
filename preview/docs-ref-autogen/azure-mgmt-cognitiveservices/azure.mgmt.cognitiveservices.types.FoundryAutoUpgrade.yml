uid: azure.mgmt.cognitiveservices.types.FoundryAutoUpgrade
name: FoundryAutoUpgrade
fullName: azure.mgmt.cognitiveservices.types.FoundryAutoUpgrade
module: azure.mgmt.cognitiveservices.types
summary: 'Represents the foundry auto-upgrade configuration for a Cognitive Services
  account. Customers

  can opt out of auto-upgrade by setting mode to Disabled.'
constructor:
  syntax: FoundryAutoUpgrade()
variables:
- description: 'Gets or sets the auto-upgrade mode. Known values are: "Enabled" and
    "Disabled".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FoundryAutoUpgradeMode">]
- description: 'Gets or sets a value indicating whether the auto-upgrade is planned

    by Microsoft.'
  name: plannedByMicrosoft
  types:
  - <xref:bool>
- description: Gets or sets the status reason for the auto-upgrade configuration.
  name: statusReason
  types:
  - <xref:str>
- description: Gets or sets the scheduled time for the auto-upgrade.
  name: scheduledAt
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cognitiveservices.types.FoundryAutoUpgrade.mode
  name: mode
  summary: '"Enabled" and "Disabled".'
  signature: 'mode: str | FoundryAutoUpgradeMode'
- uid: azure.mgmt.cognitiveservices.types.FoundryAutoUpgrade.plannedByMicrosoft
  name: plannedByMicrosoft
  summary: Gets or sets a value indicating whether the auto-upgrade is planned by
    Microsoft.
  signature: 'plannedByMicrosoft: bool'
- uid: azure.mgmt.cognitiveservices.types.FoundryAutoUpgrade.scheduledAt
