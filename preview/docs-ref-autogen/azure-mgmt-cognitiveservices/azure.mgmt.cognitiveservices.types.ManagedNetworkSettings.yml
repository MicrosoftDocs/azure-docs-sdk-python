### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.ManagedNetworkSettings
name: ManagedNetworkSettings
fullName: azure.mgmt.cognitiveservices.types.ManagedNetworkSettings
module: azure.mgmt.cognitiveservices.types
summary: Managed Network settings for a cognitive services account.
constructor:
  syntax: ManagedNetworkSettings()
variables:
- description: 'Isolation mode for the managed network of a cognitive services account.

    Known values are: "Disabled", "AllowInternetOutbound", and "AllowOnlyApprovedOutbound".'
  name: isolationMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IsolationMode">]
- name: networkId
  types:
  - <xref:str>
- description: Dictionary of <OutboundRule>.
  name: outboundRules
  types:
  - <xref:dict>[<xref:str>, <xref:"OutboundRule">]
- description: 'Status of the Provisioning for the managed network of a cognitive
    services

    account.'
  name: status
  types:
  - <xref:<xref:"ManagedNetworkProvisionStatus">>
- description: 'Firewall Sku used for FQDN Rules. Known values are: "Standard" and
    "Basic".'
  name: firewallSku
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FirewallSku">]
- description: 'The Kind of the managed network. Users can switch from V1 to V2 for

    granular access controls, but cannot switch back to V1 once V2 is enabled. Known
    values are:

    "V1" and "V2".'
  name: managedNetworkKind
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ManagedNetworkKind">]
- description: Public IP address assigned to the Azure Firewall.
  name: firewallPublicIpAddress
  types:
  - <xref:str>
- description: 'The provisioning state of the managed network settings. Known values

    are: "Deferred", "Updating", "Succeeded", "Failed", "Deleting", and "Deleted".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ManagedNetworkProvisioningState">]
attributes:
- uid: azure.mgmt.cognitiveservices.types.ManagedNetworkSettings.firewallPublicIpAddress
  name: firewallPublicIpAddress
  summary: Public IP address assigned to the Azure Firewall.
  signature: 'firewallPublicIpAddress: str | None'
- uid: azure.mgmt.cognitiveservices.types.ManagedNetworkSettings.firewallSku
  name: firewallSku
  summary: '"Standard" and "Basic".'
  signature: 'firewallSku: str | FirewallSku'
- uid: azure.mgmt.cognitiveservices.types.ManagedNetworkSettings.isolationMode
  name: isolationMode
  summary: 'Isolation mode for the managed network of a cognitive services account.
    Known values are:

    "Disabled", "AllowInternetOutbound", and "AllowOnlyApprovedOutbound".'
  signature: 'isolationMode: str | IsolationMode'
- uid: azure.mgmt.cognitiveservices.types.ManagedNetworkSettings.managedNetworkKind
  name: managedNetworkKind
  summary: 'The Kind of the managed network. Users can switch from V1 to V2 for granular
    access controls,

    but cannot switch back to V1 once V2 is enabled. Known values are: "V1" and "V2".'
  signature: 'managedNetworkKind: str | ManagedNetworkKind'
- uid: azure.mgmt.cognitiveservices.types.ManagedNetworkSettings.outboundRules
  name: outboundRules
  summary: Dictionary of <OutboundRule>.
  signature: 'outboundRules: dict[str, ''OutboundRule''] | None'
- uid: azure.mgmt.cognitiveservices.types.ManagedNetworkSettings.provisioningState
  name: provisioningState
  summary: '"Deferred",

    "Updating", "Succeeded", "Failed", "Deleting", and "Deleted".'
  signature: 'provisioningState: str | ManagedNetworkProvisioningState'
- uid: azure.mgmt.cognitiveservices.types.ManagedNetworkSettings.status
  name: status
  summary: Status of the Provisioning for the managed network of a cognitive services
    account.
  signature: 'status: ManagedNetworkProvisionStatus'
- uid: azure.mgmt.cognitiveservices.types.ManagedNetworkSettings.networkId
  name: networkId
  signature: 'networkId: str'
