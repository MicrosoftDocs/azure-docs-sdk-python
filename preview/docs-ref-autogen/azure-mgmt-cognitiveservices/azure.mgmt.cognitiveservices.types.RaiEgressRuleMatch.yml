### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.RaiEgressRuleMatch
name: RaiEgressRuleMatch
fullName: azure.mgmt.cognitiveservices.types.RaiEgressRuleMatch
module: azure.mgmt.cognitiveservices.types
summary: 'The match criteria for an egress rule. If both host and path are omitted,
  the rule matches all

  traffic. Host uses DNS wildcard syntax (e.g., "*.openai.com" matches "api.openai.com").
  Path

  uses URI prefix matching with an asterisk as a single-segment wildcard. For example,
  "/v1/*"

  matches "/v1/chat".'
constructor:
  syntax: RaiEgressRuleMatch()
variables:
- description: 'Host pattern to match using DNS wildcard syntax (e.g., "*.openai.com").
    A leading

    "*." matches any subdomain. Omit to match all hosts.'
  name: host
  types:
  - <xref:str>
- description: 'Path pattern to match using URI prefix matching. An asterisk serves
    as a

    single-segment wildcard. For example, "/v1/*" matches "/v1/chat". Omit to match
    all paths.'
  name: path
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cognitiveservices.types.RaiEgressRuleMatch.host
  name: host
  summary: 'Host pattern to match using DNS wildcard syntax (e.g., "*.openai.com").
    A leading "*."

    matches any subdomain. Omit to match all hosts.'
  signature: 'host: str'
- uid: azure.mgmt.cognitiveservices.types.RaiEgressRuleMatch.path
  name: path
  summary: 'Path pattern to match using URI prefix matching. An asterisk serves as
    a single-segment

    wildcard. For example, "/v1/*" matches "/v1/chat". Omit to match all paths.'
  signature: 'path: str'
