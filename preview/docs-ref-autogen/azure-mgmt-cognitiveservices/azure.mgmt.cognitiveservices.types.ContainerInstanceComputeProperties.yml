### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.ContainerInstanceComputeProperties
name: ContainerInstanceComputeProperties
fullName: azure.mgmt.cognitiveservices.types.ContainerInstanceComputeProperties
module: azure.mgmt.cognitiveservices.types
summary: Properties for a Container Instance compute resource.
constructor:
  syntax: ContainerInstanceComputeProperties()
variables:
- description: The location of the compute resource. Required.
  name: location
  types:
  - <xref:str>
- description: 'Provisioning state of the compute resource. Known values are:

    "Accepted", "Succeeded", "Failed", "Canceled", "Deleting", "Scaling", "Disabled",
    "Starting",

    "Stopping", "Restarting", and "Stopped".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ComputeProvisioningState">]
- description: Error details for the compute resource.
  name: errors
  types:
  - <xref:list>[<xref:"ErrorDetail">]
- description: Creation time of the compute resource.
  name: creationTime
  types:
  - <xref:str>
- description: The type of compute resource. Required. Container Instance compute
    type.
  name: computeType
  types:
  - <xref:typing.Literal>[ComputeType.CONTAINER_INSTANCE]
- description: 'ARM resource ID of the parent cluster that hosts this container

    instance. Required.'
  name: targetClusterId
  types:
  - <xref:str>
- description: 'Container image URI (e.g., MCR or ACR image path) for the container
    instance.

    Required.'
  name: imageLink
  types:
  - <xref:str>
- description: 'ISO 8601 duration before the idle instance is automatically shut

    down (e.g., ''PT30M'').'
  name: idleTimeBeforeShutdown
  types:
  - <xref:str>
- description: SSH configuration for remote access to the container instance.
  name: sshSettings
  types:
  - <xref:<xref:"SshSettings">>
- description: Network connectivity endpoints assigned to the container instance.
  name: connectivityEndpoints
  types:
  - <xref:<xref:"ConnectivityEndpoints">>
