### YamlMime:PythonClass
uid: azure.mgmt.cognitiveservices.types.RaiEgressRuleAction
name: RaiEgressRuleAction
fullName: azure.mgmt.cognitiveservices.types.RaiEgressRuleAction
module: azure.mgmt.cognitiveservices.types
summary: "The action an egress rule takes when it matches.\n\n* Allow/Deny: no additional\
  \ fields needed; headers and rewrite must not be set. \n\n* Transform: headers is\
  \ required with at least one entry; rewrite must not be set. \n\n* Rewrite: rewrite\
  \ is required with at least one of scheme/host/path; \n\nheaders is optional for\
  \ injecting headers alongside the redirect."
constructor:
  syntax: RaiEgressRuleAction()
variables:
- description: 'The kind of action. Required. Known values are: "Allow", "Deny", "Transform",

    and "Rewrite".'
  name: actionType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RaiEgressRuleActionType">]
- description: 'Header transforms to apply. Required for Transform; optional for Rewrite;
    not

    allowed for Allow or Deny.'
  name: headers
  types:
  - <xref:list>[<xref:"RaiEgressHeaderTransform">]
- description: Destination override. Required for Rewrite; not allowed otherwise.
  name: rewrite
  types:
  - <xref:<xref:"RaiEgressRewriteTarget">>
attributes:
- uid: azure.mgmt.cognitiveservices.types.RaiEgressRuleAction.actionType
  name: actionType
  summary: '"Allow", "Deny", "Transform", and

    "Rewrite".'
  signature: 'actionType: Required[str | RaiEgressRuleActionType]'
- uid: azure.mgmt.cognitiveservices.types.RaiEgressRuleAction.headers
  name: headers
  summary: 'Header transforms to apply. Required for Transform; optional for Rewrite;
    not allowed for Allow

    or Deny.'
  signature: 'headers: list[''RaiEgressHeaderTransform'']'
- uid: azure.mgmt.cognitiveservices.types.RaiEgressRuleAction.rewrite
  name: rewrite
  summary: Destination override. Required for Rewrite; not allowed otherwise.
  signature: 'rewrite: RaiEgressRewriteTarget'
