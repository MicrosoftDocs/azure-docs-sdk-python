### YamlMime:PythonClass
uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties
name: ClusterServerProperties
fullName: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties
module: azure.mgmt.cosmosdbforpostgresql.types
summary: The properties of a server in cluster.
constructor:
  syntax: ClusterServerProperties()
variables:
- description: The edition of a server.
  name: server_edition
  types:
  - <xref:str>
- description: The storage of a server in MB.
  name: storage_quota_in_mb
  types:
  - <xref:int>
- description: The vCores count of a server.
  name: v_cores
  types:
  - <xref:int>
- description: If high availability (HA) is enabled or not for the server.
  name: enable_ha
  types:
  - <xref:bool>
- description: If public access is enabled on server.
  name: enable_public_ip_access
  types:
  - <xref:bool>
- description: 'If server database is set to read-only by system maintenance depending
    on

    high disk space usage.'
  name: is_read_only
  types:
  - <xref:bool>
- description: The administrator's login name of the servers in the cluster.
  name: administrator_login
  types:
  - <xref:str>
- description: The fully qualified domain name of a server.
  name: fully_qualified_domain_name
  types:
  - <xref:str>
- description: 'The role of server in the cluster. Known values are: "Coordinator"
    and "Worker".'
  name: role
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServerRole">]
- description: A state of a cluster/server that is visible to user.
  name: state
  types:
  - <xref:str>
- description: A state of HA feature for the cluster.
  name: ha_state
  types:
  - <xref:str>
- description: Availability Zone information of the server.
  name: availability_zone
  types:
  - <xref:str>
- description: The major PostgreSQL version of server.
  name: postgresql_version
  types:
  - <xref:str>
- description: The Citus extension version of server.
  name: citus_version
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.availabilityZone
  name: availabilityZone
  summary: Availability Zone information of the server.
  signature: 'availabilityZone: str'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.citusVersion
  name: citusVersion
  summary: The Citus extension version of server.
  signature: 'citusVersion: str'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.fullyQualifiedDomainName
  name: fullyQualifiedDomainName
  summary: The fully qualified domain name of a server.
  signature: 'fullyQualifiedDomainName: str'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.haState
  name: haState
  summary: A state of HA feature for the cluster.
  signature: 'haState: str'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.postgresqlVersion
  name: postgresqlVersion
  summary: The major PostgreSQL version of server.
  signature: 'postgresqlVersion: str'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.role
  name: role
  summary: '"Coordinator" and "Worker".'
  signature: 'role: str | ServerRole'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.state
  name: state
  summary: A state of a cluster/server that is visible to user.
  signature: 'state: str'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.administratorLogin
  name: administratorLogin
  signature: 'administratorLogin: str'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.enableHa
  name: enableHa
  signature: 'enableHa: bool'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.enablePublicIpAccess
  name: enablePublicIpAccess
  signature: 'enablePublicIpAccess: bool'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.isReadOnly
  name: isReadOnly
  signature: 'isReadOnly: bool'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.serverEdition
  name: serverEdition
  signature: 'serverEdition: str'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.storageQuotaInMb
  name: storageQuotaInMb
  signature: 'storageQuotaInMb: int'
- uid: azure.mgmt.cosmosdbforpostgresql.types.ClusterServerProperties.vCores
  name: vCores
  signature: 'vCores: int'
