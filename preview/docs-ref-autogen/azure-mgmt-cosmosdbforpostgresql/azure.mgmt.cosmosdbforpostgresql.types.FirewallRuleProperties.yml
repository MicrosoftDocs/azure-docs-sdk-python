  signature: 'endIpAddress: Required[str]'
- uid: azure.mgmt.cosmosdbforpostgresql.types.FirewallRuleProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Canceled",

    "InProgress", and "Failed".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.cosmosdbforpostgresql.types.FirewallRuleProperties.startIpAddress
  name: startIpAddress
  summary: The start IP address of the cluster firewall rule. Must be IPv4 format.
