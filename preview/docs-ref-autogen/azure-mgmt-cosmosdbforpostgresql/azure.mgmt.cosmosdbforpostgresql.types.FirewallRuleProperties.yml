name: FirewallRuleProperties
fullName: azure.mgmt.cosmosdbforpostgresql.types.FirewallRuleProperties
module: azure.mgmt.cosmosdbforpostgresql.types
summary: The properties of a cluster firewall rule.
constructor:
  syntax: FirewallRuleProperties()
variables:
