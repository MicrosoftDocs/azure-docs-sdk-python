  name: enabled
  summary: Gets or sets whether or not the namespace is currently enabled.
  signature: 'enabled: bool'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.metricId
  name: metricId
  summary: Azure Insights Metrics id.
  signature: 'metricId: str'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.name
  name: name
  summary: 'Name of the Notification Hubs namespace. This is immutable property, set
    automatically by the

    service when the namespace is created.'
  signature: 'name: str'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.namespaceType
  name: namespaceType
  summary: '"Messaging" and "NotificationHub".'
  signature: 'namespaceType: str | NamespaceType'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.networkAcls
  name: networkAcls
  summary: A collection of network authorization rules.
  signature: 'networkAcls: NetworkAcls'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.pnsCredentials
  name: pnsCredentials
  summary: Collection of Notification Hub or Notification Hub Namespace PNS credentials.
  signature: 'pnsCredentials: PnsCredentials'
