    this property.'
  signature: 'region: str'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.replicationRegion
  name: replicationRegion
  summary: '"Default", "WestUs2", "NorthEurope",

    "AustraliaEast", "BrazilSouth", "SouthEastAsia", "SouthAfricaNorth", and "None".'
  signature: 'replicationRegion: str | ReplicationRegion'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.scaleUnit
  name: scaleUnit
  summary: Gets or sets scaleUnit where the namespace gets created.
  signature: 'scaleUnit: str'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.serviceBusEndpoint
  name: serviceBusEndpoint
  summary: Gets or sets endpoint you can use to perform NotificationHub operations.
  signature: 'serviceBusEndpoint: str'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.status
  name: status
  summary: '"Created", "Creating", "Suspended", and "Deleting".'
  signature: 'status: str | NamespaceStatus'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.subscriptionId
  name: subscriptionId
  summary: Namespace subscription id.
  signature: 'subscriptionId: str'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.updatedAt
  name: updatedAt
  summary: Time when the namespace was updated.
  signature: 'updatedAt: str'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.zoneRedundancy
  name: zoneRedundancy
  summary: '"Disabled" and "Enabled".'
  signature: 'zoneRedundancy: str | ZoneRedundancyPreference'
