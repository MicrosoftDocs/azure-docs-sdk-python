  signature: 'provisioningState: str | OperationProvisioningState'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.publicNetworkAccess
  name: publicNetworkAccess
  summary: '"Enabled" and "Disabled".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.region
  name: region
  summary: 'Region. The value is always set to the same value as Namespace.Location,
