  name: privateEndpointConnections
  summary: Private Endpoint Connections for namespace.
  signature: 'privateEndpointConnections: list[''PrivateEndpointConnectionResource'']'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.provisioningState
  name: provisioningState
  summary: '"Unknown", "InProgress",

