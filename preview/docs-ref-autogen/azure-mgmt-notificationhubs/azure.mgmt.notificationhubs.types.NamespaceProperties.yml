### YamlMime:PythonClass
uid: azure.mgmt.notificationhubs.types.NamespaceProperties
name: NamespaceProperties
fullName: azure.mgmt.notificationhubs.types.NamespaceProperties
module: azure.mgmt.notificationhubs.types
summary: Represents namespace properties.
constructor:
  syntax: NamespaceProperties()
variables:
- description: 'Name of the Notification Hubs namespace. This is immutable property,
    set

    automatically by the service when the namespace is created.'
  name: name
  types:
  - <xref:str>
- description: 'Defines values for OperationProvisioningState. Known values are:

    "Unknown", "InProgress", "Succeeded", "Failed", "Canceled", "Pending", and "Disabled".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperationProvisioningState">]
- description: 'Namespace status. Known values are: "Created", "Creating", "Suspended",
    and

    "Deleting".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NamespaceStatus">]
- description: Gets or sets whether or not the namespace is currently enabled.
  name: enabled
  types:
  - <xref:bool>
- description: Gets or sets whether or not the namespace is set as Critical.
  name: critical
  types:
  - <xref:bool>
- description: Namespace subscription id.
  name: subscription_id
  types:
  - <xref:str>
- description: 'Region. The value is always set to the same value as Namespace.Location,
    so we

    are deprecating this property.'
  name: region
  types:
  - <xref:str>
- description: Azure Insights Metrics id.
  name: metric_id
  types:
  - <xref:str>
- description: Time when the namespace was created.
  name: created_at
  types:
  - <xref:str>
- description: Time when the namespace was updated.
  name: updated_at
  types:
  - <xref:str>
- description: 'Defines values for NamespaceType. Known values are: "Messaging" and

    "NotificationHub".'
  name: namespace_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NamespaceType">]
- description: 'Allowed replication region. Known values are: "Default", "WestUs2",

    "NorthEurope", "AustraliaEast", "BrazilSouth", "SouthEastAsia", "SouthAfricaNorth",
    and "None".'
  name: replication_region
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationRegion">]
- description: 'Namespace SKU name. Known values are: "Disabled" and "Enabled".'
  name: zone_redundancy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ZoneRedundancyPreference">]
- description: A collection of network authorization rules.
  name: network_acls
  types:
  - <xref:<xref:"NetworkAcls">>
- description: 'Collection of Notification Hub or Notification Hub Namespace PNS

    credentials.'
  name: pns_credentials
  types:
  - <xref:<xref:"PnsCredentials">>
- description: 'Gets or sets endpoint you can use to perform NotificationHub

    operations.'
  name: service_bus_endpoint
  types:
  - <xref:str>
- description: Private Endpoint Connections for namespace.
  name: private_endpoint_connections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnectionResource">]
- description: Gets or sets scaleUnit where the namespace gets created.
  name: scale_unit
  types:
  - <xref:str>
- description: Deprecated.
  name: data_center
  types:
  - <xref:str>
- description: 'Type of public network access. Known values are: "Enabled" and

    "Disabled".'
  name: public_network_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
attributes:
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.createdAt
  name: createdAt
  summary: Time when the namespace was created.
  signature: 'createdAt: str'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.critical
  name: critical
  summary: Gets or sets whether or not the namespace is set as Critical.
  signature: 'critical: bool'
- uid: azure.mgmt.notificationhubs.types.NamespaceProperties.dataCenter
  name: dataCenter
  summary: Deprecated.
  signature: 'dataCenter: str'
