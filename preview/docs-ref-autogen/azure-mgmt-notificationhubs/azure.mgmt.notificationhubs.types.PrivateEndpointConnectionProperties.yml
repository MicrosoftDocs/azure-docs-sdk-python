### YamlMime:PythonClass
uid: azure.mgmt.notificationhubs.types.PrivateEndpointConnectionProperties
name: PrivateEndpointConnectionProperties
fullName: azure.mgmt.notificationhubs.types.PrivateEndpointConnectionProperties
module: azure.mgmt.notificationhubs.types
summary: Private Endpoint Connection properties.
constructor:
  syntax: PrivateEndpointConnectionProperties()
variables:
- description: 'State of Private Endpoint Connection. Known values are: "Unknown",

    "Succeeded", "Creating", "Updating", "UpdatingByProxy", "Deleting", "DeletingByProxy",
    and

    "Deleted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PrivateEndpointConnectionProvisioningState">]
- description: 'Represents a Private Endpoint that is connected to Notification Hubs

    namespace using Private Endpoint Connection.'
  name: private_endpoint
  types:
  - <xref:<xref:"RemotePrivateEndpointConnection">>
- description: 'List of group ids. For Notification Hubs, it always contains a single

    "namespace" element.'
  name: group_ids
  types:
  - <xref:list>[<xref:str>]
- description: State of the Private Link Service connection.
  name: private_link_service_connection_state
  types:
  - <xref:<xref:"RemotePrivateLinkServiceConnectionState">>
attributes:
- uid: azure.mgmt.notificationhubs.types.PrivateEndpointConnectionProperties.groupIds
  name: groupIds
  summary: List of group ids. For Notification Hubs, it always contains a single "namespace"
    element.
  signature: 'groupIds: list[str]'
- uid: azure.mgmt.notificationhubs.types.PrivateEndpointConnectionProperties.privateEndpoint
  name: privateEndpoint
  summary: 'Represents a Private Endpoint that is connected to Notification Hubs namespace
    using Private

    Endpoint Connection.'
  signature: 'privateEndpoint: RemotePrivateEndpointConnection'
- uid: azure.mgmt.notificationhubs.types.PrivateEndpointConnectionProperties.privateLinkServiceConnectionState
  name: privateLinkServiceConnectionState
  summary: State of the Private Link Service connection.
  signature: 'privateLinkServiceConnectionState: RemotePrivateLinkServiceConnectionState'
- uid: azure.mgmt.notificationhubs.types.PrivateEndpointConnectionProperties.provisioningState
  name: provisioningState
  summary: '"Unknown", "Succeeded",

    "Creating", "Updating", "UpdatingByProxy", "Deleting", "DeletingByProxy", and

    "Deleted".'
  signature: 'provisioningState: str | PrivateEndpointConnectionProvisioningState'
