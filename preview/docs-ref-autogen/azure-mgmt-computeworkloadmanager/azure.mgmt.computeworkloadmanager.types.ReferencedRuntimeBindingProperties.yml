variables:
- description: 'The provisioning state of the runtime binding. Known values are:

    "Succeeded", "Failed", "Canceled", "Accepted", "Provisioning", "Updating", and
    "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The provider resource created or referenced by the binding.
  name: providerResourceId
  types:
  - <xref:str>
- description: The runtime identity configuration for a managed runtime.
  name: identityProfile
  types:
  - <xref:<xref:"RuntimeIdentityProfile">>
- description: The runtime network configuration for a managed runtime.
  name: networkProfile
  types:
  - <xref:<xref:"RuntimeNetworkProfile">>
- description: 'Indicates that the runtime is customer-owned. Required. Workload

    Manager attaches an existing customer-owned resource.'
  name: provisioningMode
  types:
  - <xref:typing.Literal>[RuntimeBindingProvisioningMode.REFERENCED]
- description: The existing customer-owned runtime resource. Required.
  name: resourceId
  types:
  - <xref:str>
