  name: provisioningMode
  summary: 'Indicates that Workload Manager owns the runtime. Required. Workload Manager
    creates and owns

    the provider resource.'
  signature: 'provisioningMode: MANAGED: ''Managed''>]]'
- uid: azure.mgmt.computeworkloadmanager.types.ManagedRuntimeBindingProperties.provisioningState
  name: provisioningState
