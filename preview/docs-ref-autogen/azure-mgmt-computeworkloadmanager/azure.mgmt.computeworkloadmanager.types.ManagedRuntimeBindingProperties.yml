  name: managedProfile
  summary: The limited service-managed runtime configuration. Required.
  signature: 'managedProfile: Required[ManagedRuntimeProfile]'
- uid: azure.mgmt.computeworkloadmanager.types.ManagedRuntimeBindingProperties.networkProfile
  name: networkProfile
  summary: The runtime network configuration for a managed runtime.
  signature: 'networkProfile: RuntimeNetworkProfile'
