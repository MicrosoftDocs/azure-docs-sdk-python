uid: azure.mgmt.computeworkloadmanager.types.ManagedRuntimeBindingProperties
name: ManagedRuntimeBindingProperties
fullName: azure.mgmt.computeworkloadmanager.types.ManagedRuntimeBindingProperties
module: azure.mgmt.computeworkloadmanager.types
summary: Properties of a runtime provisioned and owned by Workload Manager.
constructor:
  syntax: ManagedRuntimeBindingProperties()
variables:
- description: 'The provisioning state of the runtime binding. Known values are:

    "Succeeded", "Failed", "Canceled", "Accepted", "Provisioning", "Updating", and
    "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The provider resource created or referenced by the binding.
  name: providerResourceId
  types:
  - <xref:str>
- description: The runtime identity configuration for a managed runtime.
  name: identityProfile
  types:
  - <xref:<xref:"RuntimeIdentityProfile">>
- description: The runtime network configuration for a managed runtime.
  name: networkProfile
  types:
  - <xref:<xref:"RuntimeNetworkProfile">>
- description: 'Indicates that Workload Manager owns the runtime. Required. Workload

    Manager creates and owns the provider resource.'
  name: provisioningMode
  types:
  - <xref:typing.Literal>[RuntimeBindingProvisioningMode.MANAGED]
- description: The limited service-managed runtime configuration. Required.
  name: managedProfile
  types:
  - <xref:<xref:"ManagedRuntimeProfile">>
