### YamlMime:PythonClass
uid: azure.mgmt.paloaltonetworksngfw.types.DNSSettings
name: DNSSettings
fullName: azure.mgmt.paloaltonetworksngfw.types.DNSSettings
module: azure.mgmt.paloaltonetworksngfw.types
summary: DNS Proxy settings for Firewall.
constructor:
  syntax: DNSSettings()
variables:
- description: 'Enable DNS proxy, disabled by default. Known values are: "DISABLED"
    and

    "ENABLED".'
  name: enable_dns_proxy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DNSProxy">]
- description: 'Enabled DNS proxy type, disabled by default. Known values are: "CUSTOM"

    and "AZURE".'
  name: enabled_dns_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EnabledDNSType">]
- description: List of IPs associated with the Firewall.
  name: dns_servers
  types:
  - <xref:list>[<xref:"IPAddress">]
attributes:
- uid: azure.mgmt.paloaltonetworksngfw.types.DNSSettings.dnsServers
  name: dnsServers
  summary: List of IPs associated with the Firewall.
  signature: 'dnsServers: list[''IPAddress'']'
- uid: azure.mgmt.paloaltonetworksngfw.types.DNSSettings.enableDnsProxy
  name: enableDnsProxy
  summary: '"DISABLED" and "ENABLED".'
  signature: 'enableDnsProxy: str | DNSProxy'
- uid: azure.mgmt.paloaltonetworksngfw.types.DNSSettings.enabledDnsType
  name: enabledDnsType
  summary: '"CUSTOM" and "AZURE".'
  signature: 'enabledDnsType: str | EnabledDNSType'
