### YamlMime:PythonClass
uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties
name: FirewallDeploymentProperties
fullName: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties
module: azure.mgmt.paloaltonetworksngfw.types
summary: Properties specific to the Firewall resource deployment.
constructor:
  syntax: FirewallDeploymentProperties()
variables:
- description: panEtag info.
  name: pan_etag
  types:
  - <xref:str>
- description: Firewall SKU type, Default will be STANDARD.
  name: firewall_sku
  types:
  - <xref:str>
- description: Network settings. Required.
  name: network_profile
  types:
  - <xref:<xref:"NetworkProfile">>
- description: 'Panorama Managed: Default is False. Default will be CloudSec

    managed. Known values are: "TRUE" and "FALSE".'
  name: is_panorama_managed
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BooleanEnum">]
- description: 'Strata Cloud Managed: Default is False. Default will be CloudSec

    managed. Known values are: "TRUE" and "FALSE".'
  name: is_strata_cloud_managed
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BooleanEnum">]
- description: Panorama Configuration.
  name: panorama_config
  types:
  - <xref:<xref:"PanoramaConfig">>
- description: 'Strata Cloud Manager Configuration, only applicable if

    Strata Cloud Manager is selected.'
  name: strata_cloud_manager_config
  types:
  - <xref:<xref:"StrataCloudManagerConfig">>
- description: Associated Rulestack.
  name: associated_rulestack
  types:
  - <xref:<xref:"RulestackDetails">>
- description: DNS settings for Firewall. Required.
  name: dns_settings
  types:
  - <xref:<xref:"DNSSettings">>
- description: Frontend settings for Firewall.
  name: front_end_settings
  types:
  - <xref:list>[<xref:"FrontendSetting">]
- description: 'Provisioning state of the resource. Known values are: "Accepted",

    "Creating", "Updating", "Deleting", "Succeeded", "Failed", "Canceled", "Deleted",
    and

    "NotSpecified".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: Billing plan information. Required.
  name: plan_data
  types:
  - <xref:<xref:"PlanData">>
- description: Marketplace details. Required.
  name: marketplace_details
  types:
  - <xref:<xref:"MarketplaceDetails">>
attributes:
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.associatedRulestack
  name: associatedRulestack
  summary: Associated Rulestack.
  signature: 'associatedRulestack: RulestackDetails'
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.dnsSettings
  name: dnsSettings
  summary: DNS settings for Firewall. Required.
  signature: 'dnsSettings: Required[DNSSettings]'
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.firewallSku
  name: firewallSku
  summary: Firewall SKU type, Default will be STANDARD.
  signature: 'firewallSku: str'
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.frontEndSettings
  name: frontEndSettings
  summary: Frontend settings for Firewall.
  signature: 'frontEndSettings: list[''FrontendSetting'']'
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.isPanoramaManaged
  name: isPanoramaManaged
  summary: 'Default is False. Default will be CloudSec managed. Known values are:

    "TRUE" and "FALSE".'
  signature: 'isPanoramaManaged: str | BooleanEnum'
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.isStrataCloudManaged
  name: isStrataCloudManaged
  summary: 'Default is False. Default will be CloudSec managed. Known values are:

    "TRUE" and "FALSE".'
  signature: 'isStrataCloudManaged: str | BooleanEnum'
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.marketplaceDetails
  name: marketplaceDetails
  summary: Marketplace details. Required.
  signature: 'marketplaceDetails: Required[MarketplaceDetails]'
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.networkProfile
  name: networkProfile
  summary: Network settings. Required.
  signature: 'networkProfile: Required[NetworkProfile]'
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.panEtag
  name: panEtag
  summary: panEtag info.
  signature: 'panEtag: str'
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.panoramaConfig
  name: panoramaConfig
  summary: Panorama Configuration.
  signature: 'panoramaConfig: PanoramaConfig'
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.planData
  name: planData
  summary: Billing plan information. Required.
  signature: 'planData: Required[PlanData]'
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.provisioningState
  name: provisioningState
  summary: '"Accepted", "Creating", "Updating",

    "Deleting", "Succeeded", "Failed", "Canceled", "Deleted", and "NotSpecified".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.paloaltonetworksngfw.types.FirewallDeploymentProperties.strataCloudManagerConfig
  name: strataCloudManagerConfig
  summary: Strata Cloud Manager Configuration, only applicable if Strata Cloud Manager
    is selected.
  signature: 'strataCloudManagerConfig: StrataCloudManagerConfig'
