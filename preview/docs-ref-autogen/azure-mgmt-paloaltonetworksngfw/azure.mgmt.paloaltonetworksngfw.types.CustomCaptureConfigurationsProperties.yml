### YamlMime:PythonClass
uid: azure.mgmt.paloaltonetworksngfw.types.CustomCaptureConfigurationsProperties
name: CustomCaptureConfigurationsProperties
fullName: azure.mgmt.paloaltonetworksngfw.types.CustomCaptureConfigurationsProperties
module: azure.mgmt.paloaltonetworksngfw.types
summary: "Properties of a Custom Capture Configuration. NOTE: this is a sync proxy\
  \ resource, NOT an LRO \u2014\nthere is intentionally no provisioningState field."
constructor:
  syntax: CustomCaptureConfigurationsProperties()
variables:
- description: 'List of filters to match packets against (1-4 entries). Required on
    PUT

    (input). May be omitted in GET responses while pcapStatus is InProgress because
    the backend has

    not finalized echo-back yet; echoed in terminal Success responses.'
  name: pcap_filter
  types:
  - <xref:list>[<xref:"CustomCaptureConfigurationsFilter">]
- description: 'List of firewall stages where packets should be captured (1-4 entries).

    Required on PUT (input). May be omitted in GET responses while pcapStatus is InProgress
    because

    the backend has not finalized echo-back yet; echoed in terminal Success responses.'
  name: pcap_stages
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"CustomCaptureConfigurationsStage">]]
- description: 'Capture duration in seconds (1-180). Required on PUT (input). May
    be

    omitted in GET responses while pcapStatus is InProgress because the backend has
    not finalized

    echo-back yet; echoed in terminal Success responses.'
  name: duration_in_sec
  types:
  - <xref:int>
- description: 'ARM resource ID of the customer''s storage account where the

    capture file will be written. Required on PUT (input). May be omitted in GET responses
    while

    pcapStatus is InProgress because the backend has not finalized echo-back yet;
    echoed in

    terminal Success responses.'
  name: storage_account_resource_id
  types:
  - <xref:str>
- description: 'Current capture status. Read-only. Clients should poll GET until this
    is

    Success or Failed. Known values are: "InProgress", "Success", and "Failed".'
  name: pcap_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CustomCaptureConfigurationsStatus">]
- description: 'Detailed reason for the current status, populated by PAN. Typically

    set when pcapStatus is Failed. Read-only.'
  name: pcap_detail_reason
  types:
  - <xref:str>
- description: 'Polling-cadence hint in seconds. Set on non-terminal responses

    (pcapStatus = InProgress) so clients know how long to wait before the next GET.
    Omitted on

    terminal responses (Success / Failed). Read-only.'
  name: next_check_in_seconds
  types:
  - <xref:int>
- description: 'Human-readable status message for display in client UIs (Portal blade,
    CLI

    output, etc.). English only. Read-only.'
  name: message
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.paloaltonetworksngfw.types.CustomCaptureConfigurationsProperties.durationInSec
  name: durationInSec
  summary: 'Capture duration in seconds (1-180). Required on PUT (input). May be omitted
    in GET responses

    while pcapStatus is InProgress because the backend has not finalized echo-back
    yet; echoed in

    terminal Success responses.'
  signature: 'durationInSec: int'
- uid: azure.mgmt.paloaltonetworksngfw.types.CustomCaptureConfigurationsProperties.message
  name: message
  summary: 'Human-readable status message for display in client UIs (Portal blade,
    CLI output, etc.).

    English only. Read-only.'
  signature: 'message: str'
- uid: azure.mgmt.paloaltonetworksngfw.types.CustomCaptureConfigurationsProperties.nextCheckInSeconds
  name: nextCheckInSeconds
  summary: 'Polling-cadence hint in seconds. Set on non-terminal responses (pcapStatus
    = InProgress) so

    clients know how long to wait before the next GET. Omitted on terminal responses
    (Success /

    Failed). Read-only.'
  signature: 'nextCheckInSeconds: int'
- uid: azure.mgmt.paloaltonetworksngfw.types.CustomCaptureConfigurationsProperties.pcapDetailReason
  name: pcapDetailReason
  summary: 'Detailed reason for the current status, populated by PAN. Typically set
    when pcapStatus is

    Failed. Read-only.'
  signature: 'pcapDetailReason: str'
- uid: azure.mgmt.paloaltonetworksngfw.types.CustomCaptureConfigurationsProperties.pcapFilter
  name: pcapFilter
  summary: 'List of filters to match packets against (1-4 entries). Required on PUT
    (input). May be omitted

    in GET responses while pcapStatus is InProgress because the backend has not finalized
    echo-back

    yet; echoed in terminal Success responses.'
  signature: 'pcapFilter: list[''CustomCaptureConfigurationsFilter'']'
- uid: azure.mgmt.paloaltonetworksngfw.types.CustomCaptureConfigurationsProperties.pcapStages
  name: pcapStages
  summary: 'List of firewall stages where packets should be captured (1-4 entries).
    Required on PUT

    (input). May be omitted in GET responses while pcapStatus is InProgress because
    the backend has

    not finalized echo-back yet; echoed in terminal Success responses.'
  signature: 'pcapStages: list[typing.Union[str, ForwardRef(''CustomCaptureConfigurationsStage'')]]'
- uid: azure.mgmt.paloaltonetworksngfw.types.CustomCaptureConfigurationsProperties.pcapStatus
  name: pcapStatus
  summary: 'Current capture status. Read-only. Clients should poll GET until this
    is Success or Failed.

    Known values are: "InProgress", "Success", and "Failed".'
  signature: 'pcapStatus: str | CustomCaptureConfigurationsStatus'
- uid: azure.mgmt.paloaltonetworksngfw.types.CustomCaptureConfigurationsProperties.storageAccountResourceId
  name: storageAccountResourceId
  summary: 'ARM resource ID of the customer''s storage account where the capture file
    will be written.

    Required on PUT (input). May be omitted in GET responses while pcapStatus is InProgress
    because

    the backend has not finalized echo-back yet; echoed in terminal Success responses.'
  signature: 'storageAccountResourceId: str'
