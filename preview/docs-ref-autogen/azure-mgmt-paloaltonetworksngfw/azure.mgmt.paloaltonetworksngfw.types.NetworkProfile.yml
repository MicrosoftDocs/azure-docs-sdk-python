### YamlMime:PythonClass
uid: azure.mgmt.paloaltonetworksngfw.types.NetworkProfile
name: NetworkProfile
fullName: azure.mgmt.paloaltonetworksngfw.types.NetworkProfile
module: azure.mgmt.paloaltonetworksngfw.types
summary: Network settings for Firewall.
constructor:
  syntax: NetworkProfile()
variables:
- description: Vnet configurations.
  name: vnet_configuration
  types:
  - <xref:<xref:"VnetConfiguration">>
- description: Vwan configurations.
  name: vwan_configuration
  types:
  - <xref:<xref:"VwanConfiguration">>
- description: 'vnet or vwan, cannot be updated. Required. Known values are: "VNET"
    and

    "VWAN".'
  name: network_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkType">]
- description: List of IPs associated with the Firewall. Required.
  name: public_ips
  types:
  - <xref:list>[<xref:"IPAddress">]
- description: 'Enable egress NAT, enabled by default. Required. Known values are:

    "DISABLED" and "ENABLED".'
  name: enable_egress_nat
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EgressNat">]
- description: Egress nat IP to use.
  name: egress_nat_ip
  types:
  - <xref:list>[<xref:"IPAddress">]
- description: Non-RFC 1918 address.
  name: trusted_ranges
  types:
  - <xref:list>[<xref:str>]
- description: 'Array of ipv4 destination address for which source

    NAT is to be performed.'
  name: private_source_nat_rules_destination
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.paloaltonetworksngfw.types.NetworkProfile.egressNatIp
  name: egressNatIp
  summary: Egress nat IP to use.
  signature: 'egressNatIp: list[''IPAddress'']'
- uid: azure.mgmt.paloaltonetworksngfw.types.NetworkProfile.enableEgressNat
  name: enableEgressNat
  summary: '"DISABLED" and

    "ENABLED".'
  signature: 'enableEgressNat: Required[str | EgressNat]'
- uid: azure.mgmt.paloaltonetworksngfw.types.NetworkProfile.networkType
  name: networkType
  summary: '"VNET" and "VWAN".'
  signature: 'networkType: Required[str | NetworkType]'
- uid: azure.mgmt.paloaltonetworksngfw.types.NetworkProfile.privateSourceNatRulesDestination
  name: privateSourceNatRulesDestination
  summary: Array of ipv4 destination address for which source NAT is to be performed.
  signature: 'privateSourceNatRulesDestination: list[str]'
- uid: azure.mgmt.paloaltonetworksngfw.types.NetworkProfile.publicIps
  name: publicIps
  summary: List of IPs associated with the Firewall. Required.
  signature: 'publicIps: Required[list[''IPAddress'']]'
- uid: azure.mgmt.paloaltonetworksngfw.types.NetworkProfile.trustedRanges
  name: trustedRanges
  summary: Non-RFC 1918 address.
  signature: 'trustedRanges: list[str]'
- uid: azure.mgmt.paloaltonetworksngfw.types.NetworkProfile.vnetConfiguration
  name: vnetConfiguration
  summary: Vnet configurations.
  signature: 'vnetConfiguration: VnetConfiguration'
- uid: azure.mgmt.paloaltonetworksngfw.types.NetworkProfile.vwanConfiguration
  name: vwanConfiguration
  summary: Vwan configurations.
  signature: 'vwanConfiguration: VwanConfiguration'
