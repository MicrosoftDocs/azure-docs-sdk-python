### YamlMime:PythonClass
uid: azure.mgmt.paloaltonetworksngfw.types.PanoramaConfig
name: PanoramaConfig
fullName: azure.mgmt.paloaltonetworksngfw.types.PanoramaConfig
module: azure.mgmt.paloaltonetworksngfw.types
summary: Panorama Config.
constructor:
  syntax: PanoramaConfig()
variables:
- description: 'Base64 encoded string representing Panorama parameters to be used
    by

    Firewall to connect to Panorama. This string is generated via azure plugin in
    Panorama.

    Required.'
  name: config_string
  types:
  - <xref:str>
- description: VM auth key for panorama connectivity.
  name: vm_auth_key
  types:
  - <xref:str>
- description: Primary Panorama Server IP address value in dotted format for IPv4.
  name: panorama_server
  types:
  - <xref:str>
- description: Secondary Panorama Server IP address value in dotted format for IPv4.
  name: panorama_server2
  types:
  - <xref:str>
- description: Panorama Device Group to join.
  name: dg_name
  types:
  - <xref:str>
- description: Panorama Template Stack to join - (Once configured we can not edit
    the value).
  name: tpl_name
  types:
  - <xref:str>
- description: Panorama Collector Group to join - (Once configured we can not edit
    the value).
  name: cg_name
  types:
  - <xref:str>
- description: Resource name(may be unique) for PN admin.
  name: host_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.paloaltonetworksngfw.types.PanoramaConfig.cgName
  name: cgName
  summary: Panorama Collector Group to join - (Once configured we can not edit the
    value).
  signature: 'cgName: str'
- uid: azure.mgmt.paloaltonetworksngfw.types.PanoramaConfig.configString
  name: configString
  summary: 'Base64 encoded string representing Panorama parameters to be used by Firewall
    to connect to

    Panorama. This string is generated via azure plugin in Panorama. Required.'
  signature: 'configString: str'
- uid: azure.mgmt.paloaltonetworksngfw.types.PanoramaConfig.dgName
  name: dgName
  summary: Panorama Device Group to join.
  signature: 'dgName: str'
- uid: azure.mgmt.paloaltonetworksngfw.types.PanoramaConfig.hostName
  name: hostName
  summary: Resource name(may be unique) for PN admin.
  signature: 'hostName: str'
- uid: azure.mgmt.paloaltonetworksngfw.types.PanoramaConfig.panoramaServer
  name: panoramaServer
  summary: Primary Panorama Server IP address value in dotted format for IPv4.
  signature: 'panoramaServer: str'
- uid: azure.mgmt.paloaltonetworksngfw.types.PanoramaConfig.panoramaServer2
  name: panoramaServer2
  summary: Secondary Panorama Server IP address value in dotted format for IPv4.
  signature: 'panoramaServer2: str'
- uid: azure.mgmt.paloaltonetworksngfw.types.PanoramaConfig.tplName
  name: tplName
  summary: Panorama Template Stack to join - (Once configured we can not edit the
    value).
  signature: 'tplName: str'
- uid: azure.mgmt.paloaltonetworksngfw.types.PanoramaConfig.vmAuthKey
  name: vmAuthKey
  summary: VM auth key for panorama connectivity.
  signature: 'vmAuthKey: str'
