### YamlMime:PythonClass
uid: azure.mgmt.billingtrust.models.DomainEntry
name: DomainEntry
fullName: azure.mgmt.billingtrust.models.DomainEntry
module: azure.mgmt.billingtrust.models
summary: 'A domain entry within an education qualification rule. `domainNames` and
  `tenantId` are

  supplied on creation; `state` and `error` are returned by the service.'
constructor:
  syntax: 'DomainEntry(*args: Any, **kwargs: Any)'
variables:
- description: Domain names associated with a tenant. Required.
  name: domain_names
  types:
  - <xref:list>[<xref:str>]
- description: 'The Microsoft Entra tenant ID owning these domains. Defaults to the
    calling

    user''s tenant when omitted.'
  name: tenant_id
  types:
  - <xref:str>
- description: 'The verification state of this domain entry. Server-managed. Known
    values are:

    "pending", "actionRequired", "failed", and "succeeded".'
  name: state
  types:
  - <xref:str>
  - <xref:azure.mgmt.billingtrust.models.DomainEntryState>
- description: 'Error detail when state is `failed` or `actionRequired`. Omitted otherwise.

    Server-managed.'
  name: error
  types:
  - <xref:azure.mgmt.billingtrust.models.ErrorDetail>
attributes:
- uid: azure.mgmt.billingtrust.models.DomainEntry.domain_names
  name: domain_names
  summary: Domain names associated with a tenant. Required.
  signature: 'domain_names: list[str]'
- uid: azure.mgmt.billingtrust.models.DomainEntry.error
  name: error
  summary: Error detail when state is `failed` or `actionRequired`. Omitted otherwise.
    Server-managed.
  signature: 'error: _models.ErrorDetail | None'
- uid: azure.mgmt.billingtrust.models.DomainEntry.state
  name: state
  summary: '"pending",

    "actionRequired", "failed", and "succeeded".'
  signature: 'state: str | _models.DomainEntryState | None'
- uid: azure.mgmt.billingtrust.models.DomainEntry.tenant_id
  name: tenant_id
  summary: 'The Microsoft Entra tenant ID owning these domains. Defaults to the calling
    user''s tenant when

    omitted.'
  signature: 'tenant_id: str | None'
