uid: azure.mgmt.billingtrust.types.TaxId
name: TaxId
fullName: azure.mgmt.billingtrust.types.TaxId
module: azure.mgmt.billingtrust.types
summary: Tax id entry associated with the sold-to identity.
constructor:
  syntax: TaxId()
variables:
- description: Tax id value (e.g. the VAT / GST / EIN identifier string).
  name: value
  types:
  - <xref:str>
- description: ISO 3166-1 alpha-2 country code the tax id is registered in.
  name: country
  types:
  - <xref:str>
- description: Scope of the tax id (e.g. `Federal`, `State`).
  name: scope
  types:
  - <xref:str>
- description: 'Status of the tax id. Known values are: "valid", "invalid", and "other".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TaxIdStatus">]
- description: "Type of tax id (e.g. `VAT`, `GST`, `EIN`). Extensible \u2014 additional\
    \ types may\nbe returned as upstream registries evolve."
  name: type
  types:
  - <xref:str>
