- uid: azure.mgmt.billingtrust.operations.RulesOperations.update
  name: update
  summary: 'Update a Rule. The PATCH body is discriminated by `kind` and must match
    the existing rule''s

    kind. For `eduQualification` rules, only `supplementalDocuments` is patchable,
    and only

    when `evaluationState == actionRequired`. For `businessVerification` rules, the
    patchable

    fields are `supplementalDocuments` and `externalId`, and only when `evaluationState`
    is

    `pending` or `actionRequired`. All other field/state combinations are rejected
    with 400

    InvalidParameterValue or 409 RuleNotActionable.'
  signature: 'update(resource_uri: str, rule_name: str, properties: _models.RulePatchProperties,
    *, content_type: str = ''application/json'', **kwargs: Any) -> _models.Rule'
  parameters:
  - name: resource_uri
    description: 'The fully qualified Azure Resource manager identifier of the resource.

      Required.'
    isRequired: true
    types:
    - <xref:str>
  - name: rule_name
    description: "The name of the rule. Rules are created by the service when the\
      \ parent\nassessment is created \u2014 the available rule names are determined\
      \ by the assessment template.\nNames start with an alphanumeric character and\
      \ may contain letters, digits, underscores, and\nhyphens. Required."
    isRequired: true
    types:
    - <xref:str>
  - name: properties
    description: 'The resource properties to be updated. Is either a RulePatchProperties
      type

      or a IO[bytes] type. Required.'
    isRequired: true
    types:
    - <xref:azure.mgmt.billingtrust.models.RulePatchProperties>
    - <xref:azure.mgmt.billingtrust.types.RulePatchProperties>
    - <xref:typing.IO>[<xref:bytes>]
  return:
    description: Rule. The Rule is compatible with MutableMapping
    types:
    - <xref:azure.mgmt.billingtrust.models.Rule>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
