methods:
- uid: azure.mgmt.billingtrust.operations.RulesOperations.create_or_update
  name: create_or_update
  summary: 'Create or update a Rule. **This operation is required for RPaaS tracked-resource
    cache

    population and MUST remain in the public spec.** Rules are created by the service
    when the

    parent assessment is created; they are not directly creatable by end users. All
    customer PUT

    calls are rejected at runtime with `OperationNotAllowed` via the RPaaS

    ResourceCreationValidate extension. Use PATCH to modify rule fields that the customer
    is

    authorized to change. Peer RPs with the same topology (extension singleton parent
    + proxy

    child) declare an identical public PUT for the same RPaaS cache-population reason:

    Microsoft.ScVmm/virtualMachineInstances/guestAgents,

    Microsoft.ConnectedVMwarevSphere/virtualMachineInstances/guestAgents.'
  signature: 'create_or_update(resource_uri: str, rule_name: str, resource: _models.Rule,
    *, content_type: str = ''application/json'', **kwargs: Any) -> _models.Rule'
  parameters:
  - name: resource_uri
    description: 'The fully qualified Azure Resource manager identifier of the resource.

      Required.'
    isRequired: true
    types:
    - <xref:str>
  - name: rule_name
    description: "The name of the rule. Rules are created by the service when the\
      \ parent\nassessment is created \u2014 the available rule names are determined\
      \ by the assessment template.\nNames start with an alphanumeric character and\
      \ may contain letters, digits, underscores, and\nhyphens. Required."
    isRequired: true
    types:
    - <xref:str>
  - name: resource
    description: 'Resource create parameters. Is either a Rule type or a IO[bytes]
      type.

      Required.'
    isRequired: true
    types:
    - <xref:azure.mgmt.billingtrust.models.Rule>
    - <xref:azure.mgmt.billingtrust.types.Rule>
    - <xref:typing.IO>[<xref:bytes>]
  return:
    description: Rule. The Rule is compatible with MutableMapping
    types:
    - <xref:azure.mgmt.billingtrust.models.Rule>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
