### YamlMime:PythonClass
uid: azure.mgmt.billingtrust.types.BusinessVerificationRulePatchProperties
name: BusinessVerificationRulePatchProperties
fullName: azure.mgmt.billingtrust.types.BusinessVerificationRulePatchProperties
module: azure.mgmt.billingtrust.types
summary: 'Patch body for a businessVerification rule. Settable while evaluationState
  is `pending` or

  `actionRequired`. `externalId` lets the customer disambiguate an ambiguous verification

  match (e.g. via DUNS); `supplementalDocuments` carries references to documents uploaded
  via

  the assessment-scoped upload-token action.'
constructor:
  syntax: BusinessVerificationRulePatchProperties()
variables:
- description: 'Required. Business verification rule. Verifies the business identity
    of the billing

    account.'
  name: kind
  types:
  - <xref:typing.Literal>[RuleKind.BUSINESS_VERIFICATION]
- description: 'Optional external-registry identifier (e.g. DUNS) used to disambiguate

    ambiguous verification matches.'
  name: external_id
  types:
  - <xref:<xref:"ExternalId">>
- description: 'References to supplemental documents (businessVerification rules

    only; only settable while evaluationState is `pending` or `actionRequired`).'
  name: supplemental_documents
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.billingtrust.types.BusinessVerificationRulePatchProperties.externalId
  name: externalId
  summary: 'Optional external-registry identifier (e.g. DUNS) used to disambiguate
    ambiguous verification

    matches.'
  signature: 'externalId: ExternalId'
- uid: azure.mgmt.billingtrust.types.BusinessVerificationRulePatchProperties.kind
  name: kind
  summary: Required. Business verification rule. Verifies the business identity of
    the billing account.
  signature: 'kind: BUSINESS_VERIFICATION: ''businessVerification''>]'
- uid: azure.mgmt.billingtrust.types.BusinessVerificationRulePatchProperties.supplementalDocuments
  name: supplementalDocuments
  summary: 'References to supplemental documents (businessVerification rules only;
    only settable while

    evaluationState is `pending` or `actionRequired`).'
  signature: 'supplementalDocuments: list[str]'
