### YamlMime:PythonClass
uid: azure.mgmt.billingtrust.types.BusinessVerificationRuleProperties
name: BusinessVerificationRuleProperties
fullName: azure.mgmt.billingtrust.types.BusinessVerificationRuleProperties
module: azure.mgmt.billingtrust.types
summary: 'Properties of a business verification rule. Verifies the billing account''s

  business identity.


  Sold-to fields (`soldTo`, `registrationNumber`, `taxIds`) reflect the billing

  account''s information on file and cannot be supplied by end users.'
constructor:
  syntax: BusinessVerificationRuleProperties()
variables:
- description: 'The evaluation state of the rule. Server-managed. Known values are:

    "pending", "running", "actionRequired", "underReview", "skipped", "failed", "succeeded",

    "succeededWithOverride", "failedWithOverride", and "expired".'
  name: evaluation_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RuleState">]
- description: 'Error information when evaluationState is `failed` or `actionRequired`.

    Server-managed.'
  name: error
  types:
  - <xref:<xref:"ErrorDetail">>
- description: 'The provisioning state of the resource. Known values are:

    "Succeeded", "Failed", "Canceled", "Provisioning", "Updating", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Required. Business verification rule. Verifies the business identity
    of the billing

    account.'
  name: kind
  types:
  - <xref:typing.Literal>[RuleKind.BUSINESS_VERIFICATION]
- description: 'Sold-to identity used for business verification. Populated from the
    billing

    account at the time the rule is created. Server-managed.'
  name: sold_to
  types:
  - <xref:<xref:"SoldTo">>
- description: 'Registration number context (allowed types and registration id).

    Populated from the billing account at the time the rule is created. Server-managed.'
  name: registration_number
  types:
  - <xref:<xref:"RegistrationNumber">>
- description: 'Tax ids associated with the sold-to identity. Populated from the billing
    account

    at the time the rule is created. Server-managed.'
  name: tax_ids
  types:
  - <xref:list>[<xref:"TaxId">]
- description: 'Optional external-registry identifier (e.g. DUNS) used to disambiguate

    verification matches. Settable on PATCH while `evaluationState` is `pending` or

    `actionRequired`.'
  name: external_id
  types:
  - <xref:<xref:"ExternalId">>
- description: 'References to supplemental documents (businessVerification rules

    only; only settable while evaluationState is `pending` or `actionRequired`).'
  name: supplemental_documents
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.billingtrust.types.BusinessVerificationRuleProperties.error
  name: error
  summary: Error information when evaluationState is `failed` or `actionRequired`.
    Server-managed.
  signature: 'error: ErrorDetail'
- uid: azure.mgmt.billingtrust.types.BusinessVerificationRuleProperties.evaluationState
  name: evaluationState
  summary: '"pending", "running",

    "actionRequired", "underReview", "skipped", "failed", "succeeded",

    "succeededWithOverride", "failedWithOverride", and "expired".'
  signature: 'evaluationState: str | RuleState'
- uid: azure.mgmt.billingtrust.types.BusinessVerificationRuleProperties.externalId
  name: externalId
  summary: 'Optional external-registry identifier (e.g. DUNS) used to disambiguate
    verification matches.

    Settable on PATCH while `evaluationState` is `pending` or `actionRequired`.'
  signature: 'externalId: ExternalId'
- uid: azure.mgmt.billingtrust.types.BusinessVerificationRuleProperties.kind
  name: kind
  summary: Required. Business verification rule. Verifies the business identity of
    the billing account.
  signature: 'kind: BUSINESS_VERIFICATION: ''businessVerification''>]]'
- uid: azure.mgmt.billingtrust.types.BusinessVerificationRuleProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Provisioning", "Updating", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.billingtrust.types.BusinessVerificationRuleProperties.registrationNumber
  name: registrationNumber
  summary: 'Registration number context (allowed types and registration id). Populated
    from the billing

    account at the time the rule is created. Server-managed.'
  signature: 'registrationNumber: RegistrationNumber'
- uid: azure.mgmt.billingtrust.types.BusinessVerificationRuleProperties.soldTo
  name: soldTo
  summary: 'Sold-to identity used for business verification. Populated from the billing
    account at the time

    the rule is created. Server-managed.'
  signature: 'soldTo: SoldTo'
- uid: azure.mgmt.billingtrust.types.BusinessVerificationRuleProperties.supplementalDocuments
  name: supplementalDocuments
  summary: 'References to supplemental documents (businessVerification rules only;
    only settable while

    evaluationState is `pending` or `actionRequired`).'
  signature: 'supplementalDocuments: list[str]'
- uid: azure.mgmt.billingtrust.types.BusinessVerificationRuleProperties.taxIds
  name: taxIds
  summary: 'Tax ids associated with the sold-to identity. Populated from the billing
    account at the time

    the rule is created. Server-managed.'
  signature: 'taxIds: list[''TaxId'']'
