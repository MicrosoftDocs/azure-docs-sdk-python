### YamlMime:PythonClass
uid: azure.mgmt.billingtrust.types.AssessmentProperties
name: AssessmentProperties
fullName: azure.mgmt.billingtrust.types.AssessmentProperties
module: azure.mgmt.billingtrust.types
summary: The properties of an Assessment resource.
constructor:
  syntax: AssessmentProperties()
variables:
- description: 'The name of the assessment template whose rules will be evaluated
    (e.g.

    ''Edu''). Immutable after creation. Required. Known values are: "Edu", "BusinessVerification",

    "PayeeEnrollment", and "PayeeProfile".'
  name: assessment_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AssessmentType">]
- description: 'The aggregated evaluation state of all active rules within this

    assessment. Known values are: "pending", "running", "actionRequired", "underReview",
    "failed",

    "succeeded", "succeededWithOverride", "failedWithOverride", and "expired".'
  name: evaluation_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AssessmentState">]
- description: 'The next scheduled re-evaluation of this assessment. Only present
    when

    one or more rules in this assessment have a configured recurrence.'
  name: next_evaluation
  types:
  - <xref:str>
- description: Error information when evaluationState is failed.
  name: error
  types:
  - <xref:<xref:"ErrorDetail">>
- description: "Optional initial values applied to the rules created with this\nassessment.\
    \ Write-only \u2014 these values are routed to the per-kind rules and are not\
    \ returned on\nread."
  name: initial_values
  types:
  - <xref:list>[<xref:"InitialRuleValueBase">]
- description: 'The provisioning state of the resource. Known values are:

    "Succeeded", "Failed", "Canceled", "Provisioning", "Updating", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.billingtrust.types.AssessmentProperties.assessmentType
  name: assessmentType
  summary: 'The name of the assessment template whose rules will be evaluated (e.g.
    ''Edu''). Immutable after

    creation. Required. Known values are: "Edu", "BusinessVerification", "PayeeEnrollment",

    and "PayeeProfile".'
  signature: 'assessmentType: Required[str | AssessmentType]'
- uid: azure.mgmt.billingtrust.types.AssessmentProperties.error
  name: error
  summary: Error information when evaluationState is failed.
  signature: 'error: ErrorDetail'
- uid: azure.mgmt.billingtrust.types.AssessmentProperties.evaluationState
  name: evaluationState
  summary: 'The aggregated evaluation state of all active rules within this assessment.
    Known values are:

    "pending", "running", "actionRequired", "underReview", "failed", "succeeded",

    "succeededWithOverride", "failedWithOverride", and "expired".'
  signature: 'evaluationState: str | AssessmentState'
- uid: azure.mgmt.billingtrust.types.AssessmentProperties.initialValues
  name: initialValues
  summary: "Optional initial values applied to the rules created with this assessment.\
    \ Write-only \u2014 these\nvalues are routed to the per-kind rules and are not\
    \ returned on read."
  signature: 'initialValues: list[''InitialRuleValueBase'']'
- uid: azure.mgmt.billingtrust.types.AssessmentProperties.nextEvaluation
  name: nextEvaluation
  summary: 'The next scheduled re-evaluation of this assessment. Only present when
    one or more rules in

    this assessment have a configured recurrence.'
  signature: 'nextEvaluation: str'
- uid: azure.mgmt.billingtrust.types.AssessmentProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Provisioning", "Updating", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
