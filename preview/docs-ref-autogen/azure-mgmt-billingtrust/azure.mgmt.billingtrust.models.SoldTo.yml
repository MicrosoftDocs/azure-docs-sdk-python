uid: azure.mgmt.billingtrust.models.SoldTo
name: SoldTo
fullName: azure.mgmt.billingtrust.models.SoldTo
module: azure.mgmt.billingtrust.models
summary: "Sold-to identity used for business verification.\n\n**Data classification\
  \ \u2014 Personally Identifiable Information (PII):** This\nmodel carries customer/contact\
  \ PII (names, email, phone, postal address).\nProducers (service code paths populating\
  \ SoldTo) and consumers (anything\nemitting it to logs / telemetry) MUST treat individual\
  \ field values as\nPII and avoid clear-text logging. BillingTrust's existing runtime\n\
  discipline keeps SoldTo out of Geneva logs (see\n`Services/Rpaas/RpaasRuleProjector.cs`\
  \ \u2014 raw bodies and parsed error\nmessages are filtered before emission). Downstream\
  \ consumers of the\npublic OpenAPI surface should follow the same convention. Tracked\
  \ for\nfollow-up alignment with ARM ARG002 (control-plane PII guidance) \u2014 see\n\
  PR description."
