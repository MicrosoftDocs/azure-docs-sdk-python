### YamlMime:PythonClass
uid: azure.mgmt.billingtrust.types.EduQualificationRuleProperties
name: EduQualificationRuleProperties
fullName: azure.mgmt.billingtrust.types.EduQualificationRuleProperties
module: azure.mgmt.billingtrust.types
summary: 'Properties of an eduQualification rule. Verifies education-domain ownership
  for a billing

  account.'
constructor:
  syntax: EduQualificationRuleProperties()
variables:
- description: 'The evaluation state of the rule. Server-managed. Known values are:

    "pending", "running", "actionRequired", "underReview", "skipped", "failed", "succeeded",

    "succeededWithOverride", "failedWithOverride", and "expired".'
  name: evaluation_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RuleState">]
- description: 'Error information when evaluationState is `failed` or `actionRequired`.

    Server-managed.'
  name: error
  types:
  - <xref:<xref:"ErrorDetail">>
- description: 'The provisioning state of the resource. Known values are:

    "Succeeded", "Failed", "Canceled", "Provisioning", "Updating", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Required. Education qualification rule. Verifies education-domain
    ownership for the

    billing account.'
  name: kind
  types:
  - <xref:typing.Literal>[RuleKind.EDU_QUALIFICATION]
- description: Per-tenant domain entries to verify.
  name: domains
  types:
  - <xref:list>[<xref:"DomainEntry">]
- description: 'References to supplemental documents. Settable only when

    evaluationState is `actionRequired`.'
  name: supplemental_documents
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.billingtrust.types.EduQualificationRuleProperties.domains
  name: domains
  summary: Per-tenant domain entries to verify.
  signature: 'domains: list[''DomainEntry'']'
- uid: azure.mgmt.billingtrust.types.EduQualificationRuleProperties.error
  name: error
  summary: Error information when evaluationState is `failed` or `actionRequired`.
    Server-managed.
  signature: 'error: ErrorDetail'
- uid: azure.mgmt.billingtrust.types.EduQualificationRuleProperties.evaluationState
  name: evaluationState
  summary: '"pending", "running",

    "actionRequired", "underReview", "skipped", "failed", "succeeded",

    "succeededWithOverride", "failedWithOverride", and "expired".'
  signature: 'evaluationState: str | RuleState'
- uid: azure.mgmt.billingtrust.types.EduQualificationRuleProperties.kind
  name: kind
  summary: 'Required. Education qualification rule. Verifies education-domain ownership
    for the billing

    account.'
  signature: 'kind: EDU_QUALIFICATION: ''eduQualification''>]]'
- uid: azure.mgmt.billingtrust.types.EduQualificationRuleProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Provisioning", "Updating", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.billingtrust.types.EduQualificationRuleProperties.supplementalDocuments
  name: supplementalDocuments
  summary: References to supplemental documents. Settable only when evaluationState
    is `actionRequired`.
  signature: 'supplementalDocuments: list[str]'
