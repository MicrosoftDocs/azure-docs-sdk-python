### YamlMime:PythonClass
uid: azure.mgmt.billingtrust.types.DomainEntry
name: DomainEntry
fullName: azure.mgmt.billingtrust.types.DomainEntry
module: azure.mgmt.billingtrust.types
summary: 'A domain entry within an education qualification rule. `domainNames` and
  `tenantId` are

  supplied on creation; `state` and `error` are returned by the service.'
constructor:
  syntax: DomainEntry()
variables:
- description: Domain names associated with a tenant. Required.
  name: domain_names
  types:
  - <xref:list>[<xref:str>]
- description: 'The Microsoft Entra tenant ID owning these domains. Defaults to the
    calling

    user''s tenant when omitted.'
  name: tenant_id
  types:
  - <xref:str>
- description: 'The verification state of this domain entry. Server-managed. Known
    values are:

    "pending", "actionRequired", "failed", and "succeeded".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DomainEntryState">]
- description: 'Error detail when state is `failed` or `actionRequired`. Omitted otherwise.

    Server-managed.'
  name: error
  types:
  - <xref:<xref:"ErrorDetail">>
attributes:
- uid: azure.mgmt.billingtrust.types.DomainEntry.domainNames
  name: domainNames
  summary: Domain names associated with a tenant. Required.
  signature: 'domainNames: Required[list[str]]'
- uid: azure.mgmt.billingtrust.types.DomainEntry.error
  name: error
  summary: Error detail when state is `failed` or `actionRequired`. Omitted otherwise.
    Server-managed.
  signature: 'error: ErrorDetail'
- uid: azure.mgmt.billingtrust.types.DomainEntry.state
  name: state
  summary: '"pending",

    "actionRequired", "failed", and "succeeded".'
  signature: 'state: str | DomainEntryState'
- uid: azure.mgmt.billingtrust.types.DomainEntry.tenantId
  name: tenantId
  summary: 'The Microsoft Entra tenant ID owning these domains. Defaults to the calling
    user''s tenant when

    omitted.'
  signature: 'tenantId: str'
