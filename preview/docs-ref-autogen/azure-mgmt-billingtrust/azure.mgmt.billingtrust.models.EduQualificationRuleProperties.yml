### YamlMime:PythonClass
uid: azure.mgmt.billingtrust.models.EduQualificationRuleProperties
name: EduQualificationRuleProperties
fullName: azure.mgmt.billingtrust.models.EduQualificationRuleProperties
module: azure.mgmt.billingtrust.models
summary: 'Properties of an eduQualification rule. Verifies education-domain ownership
  for a billing

  account.'
constructor:
  syntax: 'EduQualificationRuleProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The evaluation state of the rule. Server-managed. Known values are:

    "pending", "running", "actionRequired", "underReview", "skipped", "failed", "succeeded",

    "succeededWithOverride", "failedWithOverride", and "expired".'
  name: evaluation_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.billingtrust.models.RuleState>
- description: 'Error information when evaluationState is `failed` or `actionRequired`.

    Server-managed.'
  name: error
  types:
  - <xref:azure.mgmt.billingtrust.models.ErrorDetail>
- description: 'The provisioning state of the resource. Known values are:

    "Succeeded", "Failed", "Canceled", "Provisioning", "Updating", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.billingtrust.models.ProvisioningState>
- description: 'Required. Education qualification rule. Verifies education-domain
    ownership for the

    billing account.'
  name: kind
  types:
  - <xref:str>
  - <xref:azure.mgmt.billingtrust.models.EDU_QUALIFICATION>
- description: Per-tenant domain entries to verify.
  name: domains
  types:
  - <xref:list>[<xref:azure.mgmt.billingtrust.models.DomainEntry>]
- description: 'References to supplemental documents. Settable only when

    evaluationState is `actionRequired`.'
  name: supplemental_documents
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.billingtrust.models.EduQualificationRuleProperties.domains
  name: domains
  summary: Per-tenant domain entries to verify.
  signature: 'domains: list[''_models.DomainEntry''] | None'
- uid: azure.mgmt.billingtrust.models.EduQualificationRuleProperties.kind
  name: kind
  summary: 'Required. Education qualification rule. Verifies education-domain ownership
    for the billing

    account.'
  signature: 'kind: EDU_QUALIFICATION: ''eduQualification''>]'
- uid: azure.mgmt.billingtrust.models.EduQualificationRuleProperties.supplemental_documents
  name: supplemental_documents
  summary: References to supplemental documents. Settable only when evaluationState
    is `actionRequired`.
  signature: 'supplemental_documents: list[str] | None'
