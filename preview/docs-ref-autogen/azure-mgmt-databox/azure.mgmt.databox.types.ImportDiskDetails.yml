  name: bit_locker_key
  types:
  - <xref:str>
- description: 'Path to backed up manifest, only returned if

    enableManifestBackup is true.'
  name: backup_manifest_cloud_path
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.databox.types.ImportDiskDetails.backupManifestCloudPath
  name: backupManifestCloudPath
  summary: Path to backed up manifest, only returned if enableManifestBackup is true.
  signature: 'backupManifestCloudPath: str'
- uid: azure.mgmt.databox.types.ImportDiskDetails.bitLockerKey
  name: bitLockerKey
  summary: BitLocker key used to encrypt the disk. Required.
  signature: 'bitLockerKey: str'
- uid: azure.mgmt.databox.types.ImportDiskDetails.manifestFile
  name: manifestFile
  summary: The relative path of the manifest file on the disk. Required.
  signature: 'manifestFile: str'
- uid: azure.mgmt.databox.types.ImportDiskDetails.manifestHash
  name: manifestHash
  summary: The Base16-encoded MD5 hash of the manifest file on the disk. Required.
