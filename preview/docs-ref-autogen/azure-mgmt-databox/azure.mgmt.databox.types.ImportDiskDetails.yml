uid: azure.mgmt.databox.types.ImportDiskDetails
name: ImportDiskDetails
fullName: azure.mgmt.databox.types.ImportDiskDetails
module: azure.mgmt.databox.types
summary: Import disk details.
constructor:
  syntax: ImportDiskDetails()
variables:
- description: The relative path of the manifest file on the disk. Required.
  name: manifest_file
  types:
  - <xref:str>
- description: The Base16-encoded MD5 hash of the manifest file on the disk. Required.
  name: manifest_hash
  types:
  - <xref:str>
