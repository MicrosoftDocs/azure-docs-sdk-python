### YamlMime:PythonClass
uid: azure.mgmt.databox.types.DataBoxHeavyAccountCopyLogDetails
name: DataBoxHeavyAccountCopyLogDetails
fullName: azure.mgmt.databox.types.DataBoxHeavyAccountCopyLogDetails
module: azure.mgmt.databox.types
summary: Copy log details for a storage account for Databox heavy.
constructor:
  syntax: DataBoxHeavyAccountCopyLogDetails()
variables:
- description: Account name.
  name: account_name
  types:
  - <xref:str>
- description: Link for copy logs.
  name: copy_log_link
  types:
  - <xref:list>[<xref:str>]
- description: 'Link for copy verbose logs. This will be set only when the

    LogCollectionLevel is set to verbose.'
  name: copy_verbose_log_link
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates the type of job details. Required. Data Box Heavy

    orders.'
  name: copy_log_details_type
  types:
  - <xref:typing.Literal>[ClassDiscriminator.DATA_BOX_HEAVY]
attributes:
- uid: azure.mgmt.databox.types.DataBoxHeavyAccountCopyLogDetails.accountName
  name: accountName
  summary: Account name.
  signature: 'accountName: str'
- uid: azure.mgmt.databox.types.DataBoxHeavyAccountCopyLogDetails.copyLogDetailsType
  name: copyLogDetailsType
  summary: Indicates the type of job details. Required. Data Box Heavy orders.
  signature: 'copyLogDetailsType: DATA_BOX_HEAVY: ''DataBoxHeavy''>]'
- uid: azure.mgmt.databox.types.DataBoxHeavyAccountCopyLogDetails.copyLogLink
  name: copyLogLink
  summary: Link for copy logs.
  signature: 'copyLogLink: list[str]'
- uid: azure.mgmt.databox.types.DataBoxHeavyAccountCopyLogDetails.copyVerboseLogLink
