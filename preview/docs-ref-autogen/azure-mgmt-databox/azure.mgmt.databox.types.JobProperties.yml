  name: isCancellable
  summary: Describes whether the job is cancellable or not.
  signature: 'isCancellable: bool'
- uid: azure.mgmt.databox.types.JobProperties.isCancellableWithoutFee
  name: isCancellableWithoutFee
  summary: Flag to indicate cancellation of scheduled job.
  signature: 'isCancellableWithoutFee: bool'
- uid: azure.mgmt.databox.types.JobProperties.isDeletable
  name: isDeletable
  summary: Describes whether the job is deletable or not.
  signature: 'isDeletable: bool'
