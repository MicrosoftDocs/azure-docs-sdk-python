    "Completed", "CompletedWithErrors", "Cancelled", "Failed_IssueReportedAtCustomer",

    "Failed_IssueDetectedAtAzureDC", "Aborted", "CompletedWithWarnings",

    "ReadyToDispatchFromAzureDC", "ReadyToReceiveAtAzureDC", "Created", "ShippedToAzureDC",

    "AwaitingShipmentDetails", "PreparingToShipFromAzureDC", and "ShippedToCustomer".'
  signature: 'delayedStage: str | StageName'
- uid: azure.mgmt.databox.types.JobProperties.deliveryInfo
  name: deliveryInfo
  summary: Delivery Info of Job.
  signature: 'deliveryInfo: JobDeliveryInfo'
- uid: azure.mgmt.databox.types.JobProperties.deliveryType
  name: deliveryType
  summary: '"NonScheduled" and "Scheduled".'
  signature: 'deliveryType: str | JobDeliveryType'
- uid: azure.mgmt.databox.types.JobProperties.details
  name: details
  summary: Details of a job run. This field will only be sent for expand details filter.
