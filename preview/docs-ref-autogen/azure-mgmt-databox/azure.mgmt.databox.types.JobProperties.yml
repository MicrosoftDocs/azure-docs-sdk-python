  signature: 'reverseShippingDetailsUpdate: str | ReverseShippingDetailsEditStatus'
- uid: azure.mgmt.databox.types.JobProperties.reverseTransportPreferenceUpdate
  name: reverseTransportPreferenceUpdate
  summary: '"Enabled",

