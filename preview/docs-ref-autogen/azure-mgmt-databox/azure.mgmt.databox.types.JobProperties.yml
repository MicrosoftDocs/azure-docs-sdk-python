  signature: 'reverseTransportPreferenceUpdate: str | ReverseTransportPreferenceEditStatus'
- uid: azure.mgmt.databox.types.JobProperties.startTime
  name: startTime
  summary: Time at which the job was started in UTC ISO 8601 format.
  signature: 'startTime: str'
- uid: azure.mgmt.databox.types.JobProperties.status
  name: status
  summary: '"DeviceOrdered",

    "DevicePrepared", "Dispatched", "Delivered", "PickedUp", "AtAzureDC", "DataCopy",

    "Completed", "CompletedWithErrors", "Cancelled", "Failed_IssueReportedAtCustomer",

    "Failed_IssueDetectedAtAzureDC", "Aborted", "CompletedWithWarnings",

    "ReadyToDispatchFromAzureDC", "ReadyToReceiveAtAzureDC", "Created", "ShippedToAzureDC",

    "AwaitingShipmentDetails", "PreparingToShipFromAzureDC", and "ShippedToCustomer".'
  signature: 'status: str | StageName'
- uid: azure.mgmt.databox.types.JobProperties.transferType
  name: transferType
  summary: '"ImportToAzure" and

    "ExportFromAzure".'
  signature: 'transferType: Required[str | TransferType]'
