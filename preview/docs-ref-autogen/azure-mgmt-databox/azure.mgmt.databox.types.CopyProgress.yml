  name: filesProcessed
  summary: Number of files processed.
  signature: 'filesProcessed: int'
- uid: azure.mgmt.databox.types.CopyProgress.invalidDirectoriesProcessed
  name: invalidDirectoriesProcessed
  summary: To indicate directories renamed.
  signature: 'invalidDirectoriesProcessed: int'
- uid: azure.mgmt.databox.types.CopyProgress.invalidFileBytesUploaded
  name: invalidFileBytesUploaded
  summary: 'Total amount of data not adhering to azure naming conventions which were
    processed by automatic

    renaming.'
  signature: 'invalidFileBytesUploaded: int'
- uid: azure.mgmt.databox.types.CopyProgress.invalidFilesProcessed
  name: invalidFilesProcessed
  summary: 'Number of files not adhering to azure naming conventions which were processed
