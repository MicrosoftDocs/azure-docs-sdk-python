  name: dataAccountType
  summary: '"StorageAccount" and "ManagedDisk".'
  signature: 'dataAccountType: str | DataAccountType'
- uid: azure.mgmt.databox.types.CopyProgress.directoriesErroredOut
  name: directoriesErroredOut
  summary: To indicate directories errored out in the job.
  signature: 'directoriesErroredOut: int'
- uid: azure.mgmt.databox.types.CopyProgress.error
  name: error
  summary: Error, if any, in the stage.
  signature: 'error: CloudError'
- uid: azure.mgmt.databox.types.CopyProgress.filesErroredOut
  name: filesErroredOut
  summary: Number of files which could not be copied.
  signature: 'filesErroredOut: int'
