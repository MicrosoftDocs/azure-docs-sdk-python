  name: accountId
  summary: Id of the account where the data needs to be uploaded.
  signature: 'accountId: str'
- uid: azure.mgmt.databox.types.CopyProgress.actions
  name: actions
  summary: Available actions on the job.
  signature: 'actions: list[typing.Union[str, ForwardRef(''CustomerResolutionCode'')]]'
- uid: azure.mgmt.databox.types.CopyProgress.bytesProcessed
  name: bytesProcessed
  summary: To indicate bytes transferred.
  signature: 'bytesProcessed: int'
