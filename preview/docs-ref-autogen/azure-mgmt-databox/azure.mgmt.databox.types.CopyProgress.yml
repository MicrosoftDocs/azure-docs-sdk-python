  name: totalBytesToProcess
  summary: Total amount of data to be processed by the job.
  signature: 'totalBytesToProcess: int'
- uid: azure.mgmt.databox.types.CopyProgress.totalFilesToProcess
  name: totalFilesToProcess
  summary: Total files to process.
  signature: 'totalFilesToProcess: int'
- uid: azure.mgmt.databox.types.CopyProgress.transferType
  name: transferType
  summary: '"ImportToAzure" and "ExportFromAzure".'
  signature: 'transferType: str | TransferType'
