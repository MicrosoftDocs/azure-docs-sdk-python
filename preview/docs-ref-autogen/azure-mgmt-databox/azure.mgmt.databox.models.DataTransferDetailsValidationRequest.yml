### YamlMime:PythonClass
uid: azure.mgmt.databox.models.DataTransferDetailsValidationRequest
name: DataTransferDetailsValidationRequest
fullName: azure.mgmt.databox.models.DataTransferDetailsValidationRequest
module: azure.mgmt.databox.models
summary: Request to validate export and import data details.
constructor:
  syntax: 'DataTransferDetailsValidationRequest(*args: Any, **kwargs: Any)'
variables:
- description: List of DataTransfer details to be used to export data from azure.
  name: data_export_details
  types:
  - <xref:list>[<xref:azure.mgmt.databox.models.DataExportDetails>]
- description: List of DataTransfer details to be used to import data to azure.
  name: data_import_details
  types:
  - <xref:list>[<xref:azure.mgmt.databox.models.DataImportDetails>]
- description: 'Device type. Required. Known values are: "DataBox", "DataBoxDisk",

    "DataBoxHeavy", and "DataBoxCustomerDisk".'
  name: device_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.databox.models.SkuName>
- description: 'Type of the transfer. Required. Known values are: "ImportToAzure"
    and

    "ExportFromAzure".'
  name: transfer_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.databox.models.TransferType>
- description: 'The customer friendly name of the combination of version and capacity
    of the

    device. This field is necessary only at the time of ordering the newer generation
    device i.e.

    AzureDataBox120 and AzureDataBox525 as of Feb/2025. Known values are: "DataBox",
    "DataBoxDisk",

    "DataBoxHeavy", "DataBoxCustomerDisk", "AzureDataBox120", and "AzureDataBox525".'
  name: model
  types:
  - <xref:str>
  - <xref:azure.mgmt.databox.models.ModelName>
- description: 'Identifies the type of validation request. Required. Identify request

    and response of data transfer details validation.'
  name: validation_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.databox.models.VALIDATE_DATA_TRANSFER_DETAILS>
attributes:
- uid: azure.mgmt.databox.models.DataTransferDetailsValidationRequest.data_export_details
  name: data_export_details
  summary: List of DataTransfer details to be used to export data from azure.
  signature: 'data_export_details: list[''_models.DataExportDetails''] | None'
- uid: azure.mgmt.databox.models.DataTransferDetailsValidationRequest.data_import_details
  name: data_import_details
  summary: List of DataTransfer details to be used to import data to azure.
  signature: 'data_import_details: list[''_models.DataImportDetails''] | None'
- uid: azure.mgmt.databox.models.DataTransferDetailsValidationRequest.device_type
  name: device_type
  summary: '"DataBox", "DataBoxDisk", "DataBoxHeavy", and

    "DataBoxCustomerDisk".'
  signature: 'device_type: str | _models.SkuName'
- uid: azure.mgmt.databox.models.DataTransferDetailsValidationRequest.model
  name: model
  summary: 'The customer friendly name of the combination of version and capacity
    of the device. This field

    is necessary only at the time of ordering the newer generation device i.e. AzureDataBox120
    and

    AzureDataBox525 as of Feb/2025. Known values are: "DataBox", "DataBoxDisk",

    "DataBoxHeavy", "DataBoxCustomerDisk", "AzureDataBox120", and "AzureDataBox525".'
  signature: 'model: str | _models.ModelName | None'
- uid: azure.mgmt.databox.models.DataTransferDetailsValidationRequest.transfer_type
  name: transfer_type
  summary: '"ImportToAzure" and "ExportFromAzure".'
  signature: 'transfer_type: str | _models.TransferType'
- uid: azure.mgmt.databox.models.DataTransferDetailsValidationRequest.validation_type
  name: validation_type
  summary: 'Identifies the type of validation request. Required. Identify request
    and response of data

    transfer details validation.'
  signature: 'validation_type: VALIDATE_DATA_TRANSFER_DETAILS: ''ValidateDataTransferDetails''>]'
