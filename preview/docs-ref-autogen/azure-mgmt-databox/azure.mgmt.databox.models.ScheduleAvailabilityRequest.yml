uid: azure.mgmt.databox.models.ScheduleAvailabilityRequest
name: ScheduleAvailabilityRequest
fullName: azure.mgmt.databox.models.ScheduleAvailabilityRequest
module: azure.mgmt.databox.models
summary: 'Request body to get the availability for scheduling orders.


  You probably want to use the sub-classes and not this class directly. Known sub-classes
  are:

  DataBoxScheduleAvailabilityRequest, DiskScheduleAvailabilityRequest,

  HeavyScheduleAvailabilityRequest'
constructor:
  syntax: 'ScheduleAvailabilityRequest(*args: Any, **kwargs: Any)'
variables:
