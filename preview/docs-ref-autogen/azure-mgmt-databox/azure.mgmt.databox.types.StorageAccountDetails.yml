### YamlMime:PythonClass
uid: azure.mgmt.databox.types.StorageAccountDetails
name: StorageAccountDetails
fullName: azure.mgmt.databox.types.StorageAccountDetails
module: azure.mgmt.databox.types
summary: Details for the storage account.
constructor:
  syntax: StorageAccountDetails()
variables:
- description: 'Password for all the shares to be created on the device. Should not
    be

    passed for TransferType:ExportFromAzure jobs. If this is not passed, the service
    will generate

    password itself. This will not be returned in Get Call. Password Requirements
    :  Password must

    be minimum of 12 and maximum of 64 characters. Password must have at least one
    uppercase

    alphabet, one number and one special character. Password cannot have the following
    characters :

    IilLoO0 Password can have only alphabets, numbers and these characters : @#-$%^!+=;:_()]+.'
  name: share_password
  types:
  - <xref:str>
- description: Storage Account Resource Id. Required.
  name: storage_account_id
  types:
  - <xref:str>
- description: 'Account Type of the data to be transferred. Required. Storage Accounts

    .'
  name: data_account_type
  types:
  - <xref:typing.Literal>[DataAccountType.STORAGE_ACCOUNT]
attributes:
- uid: azure.mgmt.databox.types.StorageAccountDetails.dataAccountType
  name: dataAccountType
  summary: Account Type of the data to be transferred. Required. Storage Accounts
    .
  signature: 'dataAccountType: STORAGE_ACCOUNT: ''StorageAccount''>]'
- uid: azure.mgmt.databox.types.StorageAccountDetails.sharePassword
  name: sharePassword
  summary: 'Password for all the shares to be created on the device. Should not be
    passed for

    TransferType:ExportFromAzure jobs. If this is not passed, the service will generate
    password

    itself. This will not be returned in Get Call. Password Requirements :  Password
    must be

    minimum of 12 and maximum of 64 characters. Password must have at least one uppercase
    alphabet,

    one number and one special character. Password cannot have the following characters
    : IilLoO0

    Password can have only alphabets, numbers and these characters : @#-$%^!+=;:_()]+.'
  signature: 'sharePassword: str'
- uid: azure.mgmt.databox.types.StorageAccountDetails.storageAccountId
  name: storageAccountId
  summary: Storage Account Resource Id. Required.
  signature: 'storageAccountId: str'
