### YamlMime:PythonClass
uid: azure.mgmt.databox.types.DeviceErasureDetails
name: DeviceErasureDetails
fullName: azure.mgmt.databox.types.DeviceErasureDetails
module: azure.mgmt.databox.types
summary: 'Device erasure details with erasure completion status, secure erasure sas
  key and

  erasureordestructionlog sas key.'
constructor:
  syntax: DeviceErasureDetails()
variables:
- description: 'Holds the device erasure completion status. Known values are:

    "None", "InProgress", "Succeeded", "Failed", "Cancelled", "Cancelling", "SucceededWithErrors",

    "WaitingForCustomerAction", "SucceededWithWarnings", "WaitingForCustomerActionForKek",

    "WaitingForCustomerActionForCleanUp", "CustomerActionPerformedForCleanUp", and

    "CustomerActionPerformed".'
  name: device_erasure_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StageStatus">]
- description: 'Shared access key to download cleanup or

    destruction certificate for device.'
  name: erasure_or_destruction_certificate_sas_key
  types:
  - <xref:str>
- description: 'Shared access key to download secure erasure

    certificate for the device.'
  name: secure_erasure_certificate_sas_key
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.databox.types.DeviceErasureDetails.deviceErasureStatus
  name: deviceErasureStatus
  summary: '"None", "InProgress",

    "Succeeded", "Failed", "Cancelled", "Cancelling", "SucceededWithErrors",

    "WaitingForCustomerAction", "SucceededWithWarnings", "WaitingForCustomerActionForKek",

    "WaitingForCustomerActionForCleanUp", "CustomerActionPerformedForCleanUp", and

    "CustomerActionPerformed".'
  signature: 'deviceErasureStatus: str | StageStatus'
- uid: azure.mgmt.databox.types.DeviceErasureDetails.erasureOrDestructionCertificateSasKey
  name: erasureOrDestructionCertificateSasKey
  summary: Shared access key to download cleanup or destruction certificate for device.
  signature: 'erasureOrDestructionCertificateSasKey: str'
- uid: azure.mgmt.databox.types.DeviceErasureDetails.secureErasureCertificateSasKey
  name: secureErasureCertificateSasKey
  summary: Shared access key to download secure erasure certificate for the device.
  signature: 'secureErasureCertificateSasKey: str'
