### YamlMime:PythonClass
uid: azure.mgmt.databox.types.ShareCredentialDetails
name: ShareCredentialDetails
fullName: azure.mgmt.databox.types.ShareCredentialDetails
module: azure.mgmt.databox.types
summary: Credential details of the shares in account.
constructor:
  syntax: ShareCredentialDetails()
variables:
- description: Name of the share.
  name: share_name
  types:
  - <xref:str>
- description: 'Type of the share. Known values are: "UnknownType", "HCS", "BlockBlob",

    "PageBlob", "AzureFile", and "ManagedDisk".'
  name: share_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ShareDestinationFormatType">]
- description: User name for the share.
  name: user_name
  types:
  - <xref:str>
- description: Password for the share.
  name: password
  types:
  - <xref:str>
- description: Access protocols supported on the device.
  name: supported_access_protocols
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"AccessProtocol">]]
attributes:
- uid: azure.mgmt.databox.types.ShareCredentialDetails.password
  name: password
  summary: Password for the share.
  signature: 'password: str'
- uid: azure.mgmt.databox.types.ShareCredentialDetails.shareName
  name: shareName
  summary: Name of the share.
  signature: 'shareName: str'
- uid: azure.mgmt.databox.types.ShareCredentialDetails.shareType
  name: shareType
  summary: '"UnknownType", "HCS", "BlockBlob", "PageBlob",

    "AzureFile", and "ManagedDisk".'
  signature: 'shareType: str | ShareDestinationFormatType'
- uid: azure.mgmt.databox.types.ShareCredentialDetails.supportedAccessProtocols
  name: supportedAccessProtocols
  summary: Access protocols supported on the device.
  signature: 'supportedAccessProtocols: list[typing.Union[str, ForwardRef(''AccessProtocol'')]]'
- uid: azure.mgmt.databox.types.ShareCredentialDetails.userName
  name: userName
  summary: User name for the share.
  signature: 'userName: str'
