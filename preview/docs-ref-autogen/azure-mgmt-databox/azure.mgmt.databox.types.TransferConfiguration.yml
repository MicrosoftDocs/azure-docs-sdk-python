### YamlMime:PythonClass
uid: azure.mgmt.databox.types.TransferConfiguration
name: TransferConfiguration
fullName: azure.mgmt.databox.types.TransferConfiguration
module: azure.mgmt.databox.types
summary: Configuration for defining the transfer of data.
constructor:
  syntax: TransferConfiguration()
variables:
- description: 'Type of the configuration for transfer. Required. Known

    values are: "TransferAll" and "TransferUsingFilter".'
  name: transfer_configuration_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TransferConfigurationType">]
- description: 'Map of filter type and the details to filter. This field is

    required only if the TransferConfigurationType is given as TransferUsingFilter.'
  name: transfer_filter_details
  types:
  - <xref:<xref:"TransferConfigurationTransferFilterDetails">>
- description: 'Map of filter type and the details to transfer all data. This field

    is required only if the TransferConfigurationType is given as TransferAll.'
  name: transfer_all_details
  types:
  - <xref:<xref:"TransferConfigurationTransferAllDetails">>
attributes:
- uid: azure.mgmt.databox.types.TransferConfiguration.transferAllDetails
  name: transferAllDetails
  summary: 'Map of filter type and the details to transfer all data. This field is
    required only if the

    TransferConfigurationType is given as TransferAll.'
  signature: 'transferAllDetails: TransferConfigurationTransferAllDetails'
- uid: azure.mgmt.databox.types.TransferConfiguration.transferConfigurationType
  name: transferConfigurationType
  summary: '"TransferAll" and

    "TransferUsingFilter".'
  signature: 'transferConfigurationType: Required[str | TransferConfigurationType]'
- uid: azure.mgmt.databox.types.TransferConfiguration.transferFilterDetails
  name: transferFilterDetails
  summary: 'Map of filter type and the details to filter. This field is required only
    if the

    TransferConfigurationType is given as TransferUsingFilter.'
  signature: 'transferFilterDetails: TransferConfigurationTransferFilterDetails'
