  signature: 'device_type: str | _models.SkuName'
- uid: azure.mgmt.databox.models.SkuAvailabilityValidationRequest.location
  name: location
  summary: 'Location for data transfer. For locations check:

    [https://management.azure.com/subscriptions/SUBSCRIPTIONID/locations?api-version=2018-01-01](https://management.azure.com/subscriptions/SUBSCRIPTIONID/locations?api-version=2018-01-01).

    Required.'
  signature: 'location: str'
