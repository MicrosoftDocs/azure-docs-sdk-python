### YamlMime:PythonClass
uid: azure.mgmt.databox.types.SkuProperties
name: SkuProperties
fullName: azure.mgmt.databox.types.SkuProperties
module: azure.mgmt.databox.types
summary: Properties of the sku.
constructor:
  syntax: SkuProperties()
variables:
- description: The map of data location to service location.
  name: data_location_to_service_location_map
  types:
  - <xref:list>[<xref:"DataLocationToServiceLocationMap">]
- description: Capacity of the Sku.
  name: capacity
  types:
  - <xref:<xref:"SkuCapacity">>
- description: Cost of the Sku.
  name: costs
  types:
  - <xref:list>[<xref:"SkuCost">]
- description: Api versions that support this Sku.
  name: api_versions
  types:
  - <xref:list>[<xref:str>]
- description: 'Reason why the Sku is disabled. Known values are: "None", "Country",

    "Region", "Feature", "OfferType", and "NoSubscriptionInfo".'
  name: disabled_reason
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SkuDisabledReason">]
- description: Message for why the Sku is disabled.
  name: disabled_reason_message
  types:
  - <xref:str>
- description: Required feature to access the sku.
  name: required_feature
  types:
  - <xref:str>
- description: 'List of all the Countries in the SKU specific

    commerce boundary.'
  name: countries_within_commerce_boundary
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.databox.types.SkuProperties.apiVersions
  name: apiVersions
  summary: Api versions that support this Sku.
  signature: 'apiVersions: list[str]'
- uid: azure.mgmt.databox.types.SkuProperties.capacity
  name: capacity
  summary: Capacity of the Sku.
  signature: 'capacity: SkuCapacity'
- uid: azure.mgmt.databox.types.SkuProperties.costs
  name: costs
  summary: Cost of the Sku.
  signature: 'costs: list[''SkuCost'']'
- uid: azure.mgmt.databox.types.SkuProperties.countriesWithinCommerceBoundary
  name: countriesWithinCommerceBoundary
  summary: List of all the Countries in the SKU specific commerce boundary.
  signature: 'countriesWithinCommerceBoundary: list[str]'
- uid: azure.mgmt.databox.types.SkuProperties.dataLocationToServiceLocationMap
  name: dataLocationToServiceLocationMap
  summary: The map of data location to service location.
  signature: 'dataLocationToServiceLocationMap: list[''DataLocationToServiceLocationMap'']'
- uid: azure.mgmt.databox.types.SkuProperties.disabledReason
  name: disabledReason
