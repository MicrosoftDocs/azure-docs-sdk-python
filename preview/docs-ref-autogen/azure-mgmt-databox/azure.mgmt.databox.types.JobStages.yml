### YamlMime:PythonClass
uid: azure.mgmt.databox.types.JobStages
name: JobStages
fullName: azure.mgmt.databox.types.JobStages
module: azure.mgmt.databox.types
summary: Job stages.
constructor:
  syntax: JobStages()
variables:
- description: 'Name of the job stage. Known values are: "DeviceOrdered", "DevicePrepared",

    "Dispatched", "Delivered", "PickedUp", "AtAzureDC", "DataCopy", "Completed",

    "CompletedWithErrors", "Cancelled", "Failed_IssueReportedAtCustomer",

    "Failed_IssueDetectedAtAzureDC", "Aborted", "CompletedWithWarnings",

    "ReadyToDispatchFromAzureDC", "ReadyToReceiveAtAzureDC", "Created", "ShippedToAzureDC",

    "AwaitingShipmentDetails", "PreparingToShipFromAzureDC", and "ShippedToCustomer".'
  name: stage_name
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StageName">]
- description: Display name of the job stage.
  name: display_name
  types:
  - <xref:str>
- description: 'Status of the job stage. Known values are: "None", "InProgress",

    "Succeeded", "Failed", "Cancelled", "Cancelling", "SucceededWithErrors",

    "WaitingForCustomerAction", "SucceededWithWarnings", "WaitingForCustomerActionForKek",

    "WaitingForCustomerActionForCleanUp", "CustomerActionPerformedForCleanUp", and

    "CustomerActionPerformed".'
  name: stage_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StageStatus">]
- description: Time for the job stage in UTC ISO 8601 format.
  name: stage_time
  types:
  - <xref:str>
- description: Job Stage Details.
  name: job_stage_details
  types:
  - <xref:typing.Any>
- description: Delay information for the job stages.
  name: delay_information
  types:
  - <xref:list>[<xref:"JobDelayDetails">]
attributes:
- uid: azure.mgmt.databox.types.JobStages.delayInformation
  name: delayInformation
  summary: Delay information for the job stages.
  signature: 'delayInformation: list[''JobDelayDetails'']'
- uid: azure.mgmt.databox.types.JobStages.displayName
  name: displayName
  summary: Display name of the job stage.
  signature: 'displayName: str'
- uid: azure.mgmt.databox.types.JobStages.jobStageDetails
  name: jobStageDetails
  summary: Job Stage Details.
  signature: 'jobStageDetails: Any'
- uid: azure.mgmt.databox.types.JobStages.stageName
  name: stageName
  summary: '"DeviceOrdered", "DevicePrepared", "Dispatched",

    "Delivered", "PickedUp", "AtAzureDC", "DataCopy", "Completed",

    "CompletedWithErrors", "Cancelled", "Failed_IssueReportedAtCustomer",

    "Failed_IssueDetectedAtAzureDC", "Aborted", "CompletedWithWarnings",

    "ReadyToDispatchFromAzureDC", "ReadyToReceiveAtAzureDC", "Created", "ShippedToAzureDC",

    "AwaitingShipmentDetails", "PreparingToShipFromAzureDC", and "ShippedToCustomer".'
  signature: 'stageName: str | StageName'
- uid: azure.mgmt.databox.types.JobStages.stageStatus
  name: stageStatus
  summary: '"None", "InProgress", "Succeeded", "Failed",

    "Cancelled", "Cancelling", "SucceededWithErrors", "WaitingForCustomerAction",

    "SucceededWithWarnings", "WaitingForCustomerActionForKek",

    "WaitingForCustomerActionForCleanUp", "CustomerActionPerformedForCleanUp", and

    "CustomerActionPerformed".'
  signature: 'stageStatus: str | StageStatus'
- uid: azure.mgmt.databox.types.JobStages.stageTime
  name: stageTime
  summary: Time for the job stage in UTC ISO 8601 format.
  signature: 'stageTime: str'
