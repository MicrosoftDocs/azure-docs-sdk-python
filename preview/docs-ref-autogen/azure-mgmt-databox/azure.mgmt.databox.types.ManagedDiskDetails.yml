### YamlMime:PythonClass
uid: azure.mgmt.databox.types.ManagedDiskDetails
name: ManagedDiskDetails
fullName: azure.mgmt.databox.types.ManagedDiskDetails
module: azure.mgmt.databox.types
summary: Details of the managed disks.
constructor:
  syntax: ManagedDiskDetails()
variables:
- description: 'Password for all the shares to be created on the device. Should not
    be

    passed for TransferType:ExportFromAzure jobs. If this is not passed, the service
    will generate

    password itself. This will not be returned in Get Call. Password Requirements
    :  Password must

    be minimum of 12 and maximum of 64 characters. Password must have at least one
    uppercase

    alphabet, one number and one special character. Password cannot have the following
    characters :

    IilLoO0 Password can have only alphabets, numbers and these characters : @#-$%^!+=;:_()]+.'
  name: share_password
  types:
  - <xref:str>
- description: Resource Group Id of the compute disks. Required.
  name: resource_group_id
  types:
  - <xref:str>
- description: 'Resource Id of the storage account that can be used to copy

    the vhd for staging. Required.'
  name: staging_storage_account_id
  types:
  - <xref:str>
- description: 'Account Type of the data to be transferred. Required. Azure Managed

    disk storage.'
  name: data_account_type
  types:
  - <xref:typing.Literal>[DataAccountType.MANAGED_DISK]
attributes:
- uid: azure.mgmt.databox.types.ManagedDiskDetails.dataAccountType
  name: dataAccountType
  summary: Account Type of the data to be transferred. Required. Azure Managed disk
    storage.
  signature: 'dataAccountType: MANAGED_DISK: ''ManagedDisk''>]'
- uid: azure.mgmt.databox.types.ManagedDiskDetails.resourceGroupId
  name: resourceGroupId
  summary: Resource Group Id of the compute disks. Required.
  signature: 'resourceGroupId: str'
- uid: azure.mgmt.databox.types.ManagedDiskDetails.sharePassword
  name: sharePassword
  summary: 'Password for all the shares to be created on the device. Should not be
    passed for

    TransferType:ExportFromAzure jobs. If this is not passed, the service will generate
    password

    itself. This will not be returned in Get Call. Password Requirements :  Password
    must be

    minimum of 12 and maximum of 64 characters. Password must have at least one uppercase
    alphabet,

    one number and one special character. Password cannot have the following characters
    : IilLoO0

    Password can have only alphabets, numbers and these characters : @#-$%^!+=;:_()]+.'
  signature: 'sharePassword: str'
- uid: azure.mgmt.databox.types.ManagedDiskDetails.stagingStorageAccountId
  name: stagingStorageAccountId
  summary: Resource Id of the storage account that can be used to copy the vhd for
    staging. Required.
  signature: 'stagingStorageAccountId: str'
