### YamlMime:PythonClass
uid: azure.mgmt.databox.types.DataExportDetails
name: DataExportDetails
fullName: azure.mgmt.databox.types.DataExportDetails
module: azure.mgmt.databox.types
summary: Details of the data to be used for exporting data from azure.
constructor:
  syntax: DataExportDetails()
variables:
- description: Configuration for the data transfer. Required.
  name: transfer_configuration
  types:
  - <xref:<xref:"TransferConfiguration">>
- description: 'Level of the logs to be collected. Known values are: "Error" and

    "Verbose".'
  name: log_collection_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LogCollectionLevel">]
- description: Account details of the data to be transferred. Required.
  name: account_details
  types:
  - <xref:<xref:"DataAccountDetails">>
attributes:
- uid: azure.mgmt.databox.types.DataExportDetails.accountDetails
  name: accountDetails
  summary: Account details of the data to be transferred. Required.
  signature: 'accountDetails: Required[DataAccountDetails]'
- uid: azure.mgmt.databox.types.DataExportDetails.logCollectionLevel
  name: logCollectionLevel
  summary: '"Error" and "Verbose".'
  signature: 'logCollectionLevel: str | LogCollectionLevel'
- uid: azure.mgmt.databox.types.DataExportDetails.transferConfiguration
  name: transferConfiguration
  summary: Configuration for the data transfer. Required.
  signature: 'transferConfiguration: Required[TransferConfiguration]'
