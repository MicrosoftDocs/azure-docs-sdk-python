uid: azure.mgmt.databox.types.CreateOrderLimitForSubscriptionValidationRequest
name: CreateOrderLimitForSubscriptionValidationRequest
fullName: azure.mgmt.databox.types.CreateOrderLimitForSubscriptionValidationRequest
module: azure.mgmt.databox.types
summary: Request to validate create order limit for current subscription.
constructor:
  syntax: CreateOrderLimitForSubscriptionValidationRequest()
variables:
- description: 'Device type to be used for the job. Required. Known values are: "DataBox",

    "DataBoxDisk", "DataBoxHeavy", and "DataBoxCustomerDisk".'
  name: device_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SkuName">]
- description: 'The customer friendly name of the combination of version and capacity
    of the

    device. This field is necessary only at the time of ordering the newer generation
    device i.e.

    AzureDataBox120 and AzureDataBox525 as of Feb/2025. Known values are: "DataBox",
    "DataBoxDisk",

    "DataBoxHeavy", "DataBoxCustomerDisk", "AzureDataBox120", and "AzureDataBox525".'
  name: model
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ModelName">]
- description: 'Identifies the type of validation request. Required. Identify request

    and response of create order limit for subscription validation.'
  name: validation_type
  types:
  - <xref:typing.Literal>[ValidationInputDiscriminator.VALIDATE_CREATE_ORDER_LIMIT]
attributes:
- uid: azure.mgmt.databox.types.CreateOrderLimitForSubscriptionValidationRequest.deviceType
  name: deviceType
  summary: '"DataBox", "DataBoxDisk",

    "DataBoxHeavy", and "DataBoxCustomerDisk".'
  signature: 'deviceType: Required[str | SkuName]'
- uid: azure.mgmt.databox.types.CreateOrderLimitForSubscriptionValidationRequest.model
  name: model
  summary: 'The customer friendly name of the combination of version and capacity
