### YamlMime:PythonClass
uid: azure.mgmt.databox.types.AccountCredentialDetails
name: AccountCredentialDetails
fullName: azure.mgmt.databox.types.AccountCredentialDetails
module: azure.mgmt.databox.types
summary: Credential details of the account.
constructor:
  syntax: AccountCredentialDetails()
variables:
- description: Name of the account.
  name: account_name
  types:
  - <xref:str>
- description: 'Type of the account. Known values are: "StorageAccount" and

    "ManagedDisk".'
  name: data_account_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataAccountType">]
- description: 'Connection string of the account endpoint to use the account

    as a storage endpoint on the device.'
  name: account_connection_string
  types:
  - <xref:str>
- description: Per share level unencrypted access credentials.
  name: share_credential_details
  types:
  - <xref:list>[<xref:"ShareCredentialDetails">]
attributes:
- uid: azure.mgmt.databox.types.AccountCredentialDetails.accountConnectionString
  name: accountConnectionString
  summary: 'Connection string of the account endpoint to use the account as a storage
    endpoint on the

    device.'
  signature: 'accountConnectionString: str'
- uid: azure.mgmt.databox.types.AccountCredentialDetails.accountName
  name: accountName
  summary: Name of the account.
  signature: 'accountName: str'
- uid: azure.mgmt.databox.types.AccountCredentialDetails.dataAccountType
  name: dataAccountType
  summary: '"StorageAccount" and "ManagedDisk".'
  signature: 'dataAccountType: str | DataAccountType'
- uid: azure.mgmt.databox.types.AccountCredentialDetails.shareCredentialDetails
  name: shareCredentialDetails
  summary: Per share level unencrypted access credentials.
  signature: 'shareCredentialDetails: list[azure.mgmt.databox.types.ShareCredentialDetails]'
