### YamlMime:PythonClass
uid: azure.mgmt.databox.types.DataTransferDetailsValidationRequest
name: DataTransferDetailsValidationRequest
fullName: azure.mgmt.databox.types.DataTransferDetailsValidationRequest
module: azure.mgmt.databox.types
summary: Request to validate export and import data details.
constructor:
  syntax: DataTransferDetailsValidationRequest()
variables:
- description: List of DataTransfer details to be used to export data from azure.
  name: data_export_details
  types:
  - <xref:list>[<xref:"DataExportDetails">]
- description: List of DataTransfer details to be used to import data to azure.
  name: data_import_details
  types:
  - <xref:list>[<xref:"DataImportDetails">]
- description: 'Device type. Required. Known values are: "DataBox", "DataBoxDisk",

    "DataBoxHeavy", and "DataBoxCustomerDisk".'
  name: device_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SkuName">]
- description: 'Type of the transfer. Required. Known values are: "ImportToAzure"
    and

    "ExportFromAzure".'
  name: transfer_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TransferType">]
- description: 'The customer friendly name of the combination of version and capacity
    of the

    device. This field is necessary only at the time of ordering the newer generation
    device i.e.

    AzureDataBox120 and AzureDataBox525 as of Feb/2025. Known values are: "DataBox",
    "DataBoxDisk",

    "DataBoxHeavy", "DataBoxCustomerDisk", "AzureDataBox120", and "AzureDataBox525".'
  name: model
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ModelName">]
- description: 'Identifies the type of validation request. Required. Identify request

    and response of data transfer details validation.'
  name: validation_type
  types:
  - <xref:typing.Literal>[ValidationInputDiscriminator.VALIDATE_DATA_TRANSFER_DETAILS]
attributes:
- uid: azure.mgmt.databox.types.DataTransferDetailsValidationRequest.dataExportDetails
  name: dataExportDetails
  summary: List of DataTransfer details to be used to export data from azure.
  signature: 'dataExportDetails: list[''DataExportDetails'']'
- uid: azure.mgmt.databox.types.DataTransferDetailsValidationRequest.dataImportDetails
  name: dataImportDetails
  summary: List of DataTransfer details to be used to import data to azure.
  signature: 'dataImportDetails: list[''DataImportDetails'']'
- uid: azure.mgmt.databox.types.DataTransferDetailsValidationRequest.deviceType
  name: deviceType
  summary: '"DataBox", "DataBoxDisk", "DataBoxHeavy", and

    "DataBoxCustomerDisk".'
  signature: 'deviceType: Required[str | SkuName]'
- uid: azure.mgmt.databox.types.DataTransferDetailsValidationRequest.model
  name: model
  summary: 'The customer friendly name of the combination of version and capacity
    of the device. This field

    is necessary only at the time of ordering the newer generation device i.e. AzureDataBox120
    and

    AzureDataBox525 as of Feb/2025. Known values are: "DataBox", "DataBoxDisk",

    "DataBoxHeavy", "DataBoxCustomerDisk", "AzureDataBox120", and "AzureDataBox525".'
  signature: 'model: str | ModelName'
- uid: azure.mgmt.databox.types.DataTransferDetailsValidationRequest.transferType
  name: transferType
  summary: '"ImportToAzure" and "ExportFromAzure".'
  signature: 'transferType: Required[str | TransferType]'
- uid: azure.mgmt.databox.types.DataTransferDetailsValidationRequest.validationType
  name: validationType
  summary: 'Identifies the type of validation request. Required. Identify request
    and response of data

    transfer details validation.'
  signature: 'validationType: VALIDATE_DATA_TRANSFER_DETAILS: ''ValidateDataTransferDetails''>]]'
