  name: copyLogDetailsType
  summary: Indicates the type of job details. Required. Data Box orders.
  signature: 'copyLogDetailsType: DATA_BOX: ''DataBox''>]'
- uid: azure.mgmt.databox.types.DataBoxAccountCopyLogDetails.copyLogLink
  name: copyLogLink
  summary: Link for copy logs.
  signature: 'copyLogLink: str'
- uid: azure.mgmt.databox.types.DataBoxAccountCopyLogDetails.copyVerboseLogLink
