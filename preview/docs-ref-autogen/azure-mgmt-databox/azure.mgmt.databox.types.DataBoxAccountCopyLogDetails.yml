name: DataBoxAccountCopyLogDetails
fullName: azure.mgmt.databox.types.DataBoxAccountCopyLogDetails
module: azure.mgmt.databox.types
summary: Copy log details for a storage account of a DataBox job.
constructor:
  syntax: DataBoxAccountCopyLogDetails()
variables:
