### YamlMime:PythonClass
uid: azure.mgmt.databox.models.ValidateAddress
name: ValidateAddress
fullName: azure.mgmt.databox.models.ValidateAddress
module: azure.mgmt.databox.models
summary: The requirements to validate customer address where the device needs to be
  shipped.
constructor:
  syntax: 'ValidateAddress(*args: Any, **kwargs: Any)'
variables:
- description: Shipping address of the customer. Required.
  name: shipping_address
  types:
  - <xref:azure.mgmt.databox.models.ShippingAddress>
- description: 'Device type to be used for the job. Required. Known values are: "DataBox",

    "DataBoxDisk", "DataBoxHeavy", and "DataBoxCustomerDisk".'
  name: device_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.databox.models.SkuName>
- description: Preferences related to the shipment logistics of the sku.
  name: transport_preferences
  types:
  - <xref:azure.mgmt.databox.models.TransportPreferences>
- description: 'The customer friendly name of the combination of version and capacity
    of the

    device. This field is necessary only at the time of ordering the newer generation
    device i.e.

    AzureDataBox120 and AzureDataBox525 as of Feb/2025. Known values are: "DataBox",
    "DataBoxDisk",

    "DataBoxHeavy", "DataBoxCustomerDisk", "AzureDataBox120", and "AzureDataBox525".'
  name: model
  types:
  - <xref:str>
  - <xref:azure.mgmt.databox.models.ModelName>
- description: 'Identifies the type of validation request. Required. Identify request

    and response of address validation.'
  name: validation_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.databox.models.VALIDATE_ADDRESS>
attributes:
- uid: azure.mgmt.databox.models.ValidateAddress.device_type
  name: device_type
  summary: '"DataBox", "DataBoxDisk",

    "DataBoxHeavy", and "DataBoxCustomerDisk".'
  signature: 'device_type: str | _models.SkuName'
- uid: azure.mgmt.databox.models.ValidateAddress.model
  name: model
  summary: 'The customer friendly name of the combination of version and capacity
    of the device. This field

    is necessary only at the time of ordering the newer generation device i.e. AzureDataBox120
    and

    AzureDataBox525 as of Feb/2025. Known values are: "DataBox", "DataBoxDisk",

    "DataBoxHeavy", "DataBoxCustomerDisk", "AzureDataBox120", and "AzureDataBox525".'
  signature: 'model: str | _models.ModelName | None'
- uid: azure.mgmt.databox.models.ValidateAddress.shipping_address
  name: shipping_address
  summary: Shipping address of the customer. Required.
  signature: 'shipping_address: _models.ShippingAddress'
- uid: azure.mgmt.databox.models.ValidateAddress.transport_preferences
  name: transport_preferences
  summary: Preferences related to the shipment logistics of the sku.
  signature: 'transport_preferences: _models.TransportPreferences | None'
- uid: azure.mgmt.databox.models.ValidateAddress.validation_type
  name: validation_type
  summary: 'Identifies the type of validation request. Required. Identify request
    and response of address

    validation.'
  signature: 'validation_type: VALIDATE_ADDRESS: ''ValidateAddress''>]'
