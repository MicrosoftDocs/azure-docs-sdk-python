### YamlMime:PythonClass
uid: azure.mgmt.databox.types.DataBoxDiskGranularCopyProgress
name: DataBoxDiskGranularCopyProgress
fullName: azure.mgmt.databox.types.DataBoxDiskGranularCopyProgress
module: azure.mgmt.databox.types
summary: DataBox Disk Granular Copy Progress.
constructor:
  syntax: DataBoxDiskGranularCopyProgress()
variables:
- description: 'Name of the storage account. This will be empty for data account

    types other than storage account.'
  name: storage_account_name
  types:
  - <xref:str>
- description: 'Transfer type of data. Known values are: "ImportToAzure" and

    "ExportFromAzure".'
  name: transfer_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TransferType">]
- description: 'Data Account Type. Known values are: "StorageAccount" and

    "ManagedDisk".'
  name: data_account_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataAccountType">]
- description: Id of the account where the data needs to be uploaded.
  name: account_id
  types:
  - <xref:str>
- description: To indicate bytes transferred.
  name: bytes_processed
  types:
  - <xref:int>
- description: Total amount of data to be processed by the job.
  name: total_bytes_to_process
  types:
  - <xref:int>
- description: Number of files processed.
  name: files_processed
  types:
  - <xref:int>
- description: Total files to process.
  name: total_files_to_process
  types:
  - <xref:int>
- description: 'Number of files not adhering to azure naming conventions which

    were processed by automatic renaming.'
  name: invalid_files_processed
  types:
  - <xref:int>
- description: 'Total amount of data not adhering to azure naming

    conventions which were processed by automatic renaming.'
  name: invalid_file_bytes_uploaded
  types:
  - <xref:int>
- description: 'Number of folders not adhering to azure naming conventions which

    were processed by automatic renaming.'
  name: renamed_container_count
  types:
  - <xref:int>
- description: Number of files which could not be copied.
  name: files_errored_out
  types:
  - <xref:int>
- description: To indicate directories errored out in the job.
  name: directories_errored_out
  types:
  - <xref:int>
- description: To indicate directories renamed.
  name: invalid_directories_processed
  types:
  - <xref:int>
- description: 'To indicate if enumeration of data is in progress. Until this

    is true, the TotalBytesToProcess may not be valid.'
  name: is_enumeration_in_progress
  types:
  - <xref:bool>
- description: Error, if any, in the stage.
  name: error
  types:
  - <xref:<xref:"CloudError">>
- description: Available actions on the job.
  name: actions
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"CustomerResolutionCode">]]
- description: Disk Serial Number.
  name: serial_number
  types:
  - <xref:str>
- description: 'The Status of the copy. Known values are: "NotStarted", "InProgress",

    "Completed", "CompletedWithErrors", "Failed", "NotReturned", "HardwareError",

    "DeviceFormatted", "DeviceMetadataModified", "StorageAccountNotAccessible", "UnsupportedData",

    "DriveNotReceived", "UnsupportedDrive", "OtherServiceError", "OtherUserError",

    "DriveNotDetected", "DriveCorrupted", and "MetadataFilesModifiedOrRemoved".'
  name: copy_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CopyStatus">]
attributes:
