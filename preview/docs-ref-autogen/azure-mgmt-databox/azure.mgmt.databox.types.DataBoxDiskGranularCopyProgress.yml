    "DriveNotReceived", "UnsupportedDrive", "OtherServiceError", "OtherUserError",

    "DriveNotDetected", "DriveCorrupted", and "MetadataFilesModifiedOrRemoved".'
  signature: 'copyStatus: str | CopyStatus'
