  - <xref:str>
- description: Timestamp when the delay notification was resolved.
  name: resolution_time
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.databox.types.JobDelayDetails.description
  name: description
  summary: Description of the delay.
