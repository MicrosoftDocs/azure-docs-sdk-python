  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NotificationStageName">]
- description: Notification is required or not. Required.
  name: send_notification
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.databox.types.NotificationPreference.sendNotification
  name: sendNotification
  summary: Notification is required or not. Required.
