### YamlMime:PythonClass
uid: azure.mgmt.databox.models.ManagedDiskDetails
name: ManagedDiskDetails
fullName: azure.mgmt.databox.models.ManagedDiskDetails
module: azure.mgmt.databox.models
summary: Details of the managed disks.
constructor:
  syntax: 'ManagedDiskDetails(*args: Any, **kwargs: Any)'
variables:
- description: 'Password for all the shares to be created on the device. Should not
    be

    passed for TransferType:ExportFromAzure jobs. If this is not passed, the service
    will generate

    password itself. This will not be returned in Get Call. Password Requirements
    :  Password must

    be minimum of 12 and maximum of 64 characters. Password must have at least one
    uppercase

    alphabet, one number and one special character. Password cannot have the following
    characters :

    IilLoO0 Password can have only alphabets, numbers and these characters : @#-$%^!+=;:_()]+.'
  name: share_password
  types:
  - <xref:str>
- description: Resource Group Id of the compute disks. Required.
  name: resource_group_id
  types:
  - <xref:str>
- description: 'Resource Id of the storage account that can be used to copy

    the vhd for staging. Required.'
  name: staging_storage_account_id
  types:
  - <xref:str>
- description: 'Account Type of the data to be transferred. Required. Azure Managed

    disk storage.'
  name: data_account_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.databox.models.MANAGED_DISK>
attributes:
- uid: azure.mgmt.databox.models.ManagedDiskDetails.data_account_type
  name: data_account_type
  summary: Account Type of the data to be transferred. Required. Azure Managed disk
    storage.
  signature: 'data_account_type: MANAGED_DISK: ''ManagedDisk''>]'
- uid: azure.mgmt.databox.models.ManagedDiskDetails.resource_group_id
  name: resource_group_id
  summary: Resource Group Id of the compute disks. Required.
  signature: 'resource_group_id: str'
- uid: azure.mgmt.databox.models.ManagedDiskDetails.staging_storage_account_id
  name: staging_storage_account_id
  summary: Resource Id of the storage account that can be used to copy the vhd for
    staging. Required.
  signature: 'staging_storage_account_id: str'
