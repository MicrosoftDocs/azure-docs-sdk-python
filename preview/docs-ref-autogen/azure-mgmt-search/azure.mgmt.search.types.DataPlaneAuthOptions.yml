name: DataPlaneAuthOptions
fullName: azure.mgmt.search.types.DataPlaneAuthOptions
module: azure.mgmt.search.types
summary: 'Defines the options for how the search service authenticates a data plane
  request. This cannot

  be set if ''disableLocalAuth'' is set to true.'
