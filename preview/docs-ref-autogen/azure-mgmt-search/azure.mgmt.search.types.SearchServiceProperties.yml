### YamlMime:PythonClass
uid: azure.mgmt.search.types.SearchServiceProperties
name: SearchServiceProperties
fullName: azure.mgmt.search.types.SearchServiceProperties
module: azure.mgmt.search.types
summary: Properties of the search service.
constructor:
  syntax: SearchServiceProperties()
variables:
- description: 'The number of replicas in the dedicated search service. If specified,
    it

    must be a value between 1 and 12 inclusive for standard SKUs or between 1 and
    3 inclusive for

    basic SKU.'
  name: replicaCount
  types:
  - <xref:int>
- description: 'The number of partitions in the dedicated search service; if specified,

    it can be 1, 2, 3, 4, 6, or 12. Values greater than 1 are only valid for standard
    SKUs. For

    ''standard3'' services with hostingMode set to ''highDensity'', the allowed values
    are between 1

    and 3.'
  name: partitionCount
  types:
  - <xref:int>
- description: The endpoint of the Azure AI Search service.
  name: endpoint
  types:
  - <xref:str>
- description: 'Applicable only for the standard3 SKU. You can set this property to
    enable

    up to 3 high density partitions that allow up to 1000 indexes, which is much higher
    than the

    maximum indexes allowed for any other SKU. For the standard3 SKU, the value is
    either ''Default''

    or ''HighDensity''. For all other SKUs, this value must be ''Default''. Known
    values are: "Default"

    and "HighDensity".'
  name: hostingMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HostingMode">]
- description: 'Configure this property to support the search service using either
    the

    Default Compute or Azure Confidential Compute. Known values are: "Default" and
    "Confidential".'
  name: computeType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ComputeType">]
- description: 'This value can be set to ''Enabled'' to avoid breaking changes on

    existing customer resources and templates. If set to ''Disabled'', traffic over
    public interface

    is not allowed, and private endpoint connections would be the exclusive access
    method. Known

    values are: "Enabled", "Disabled", and "SecuredByPerimeter".'
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: 'The status of the search service. Possible values include: ''running'':
    The search

    service is running and no provisioning operations are underway. ''provisioning'':
    The search

    service is being provisioned or scaled up or down. ''deleting'': The search service
    is being

    deleted. ''degraded'': The search service is degraded. This can occur when the
    underlying search

    units are not healthy. The search service is most likely operational, but performance
    might be

    slow and some requests might be dropped. ''disabled'': The search service is disabled.
    In this

    state, the service will reject all API requests. ''error'': The search service
    is in an error

    state. ''stopped'': The search service is in a subscription that''s disabled.
    If your service is

    in the degraded, disabled, or error states, it means the Azure AI Search team
    is actively

    investigating the underlying issue. Dedicated services in these states are still
    chargeable

    based on the number of search units provisioned. Known values are: "running",
    "provisioning",

    "deleting", "degraded", "disabled", "error", and "stopped".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SearchServiceStatus">]
- description: The details of the search service status.
  name: statusDetails
  types:
  - <xref:str>
- description: 'The state of the last provisioning operation performed on the search

    service. Provisioning is an intermediate state that occurs while service capacity
    is being

    established. After capacity is set up, provisioningState changes to either ''Succeeded''
    or

    ''Failed''. Client applications can poll provisioning status (the recommended
    polling interval is

    from 30 seconds to one minute) by using the Get Search Service operation to see
    when an

    operation is completed. If you are using the free service, this value tends to
    come back as

    ''Succeeded'' directly in the call to Create search service. This is because the
    free service

    uses capacity that is already set up. Known values are: "succeeded", "provisioning",
    and

    "failed".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Network specific rules that determine how the Azure AI Search service
    may

    be reached.'
  name: networkRuleSet
  types:
  - <xref:<xref:"NetworkRuleSet">>
- description: 'A list of data exfiltration scenarios that are explicitly

    disallowed for the search service. Currently, the only supported value is ''All''
    to disable all

    possible data export scenarios with more fine grained controls planned for the
    future.'
  name: dataExfiltrationProtections
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"SearchDataExfiltrationProtection">]]
- description: 'Specifies any policy regarding encryption of resources (such as

    indexes) using customer manager keys within a search service.'
  name: encryptionWithCmk
  types:
  - <xref:<xref:"EncryptionWithCmk">>
- description: 'When set to true, calls to the search service will not be permitted
    to

    utilize API keys for authentication. This cannot be set to true if ''dataPlaneAuthOptions''
    are

    defined.'
  name: disableLocalAuth
  types:
  - <xref:bool>
- description: 'Defines the options for how the data plane API of a search service

    authenticates requests. This cannot be set if ''disableLocalAuth'' is set to true.'
  name: authOptions
  types:
  - <xref:<xref:"DataPlaneAuthOptions">>
- description: 'Specifies the availability and billing plan for semantic search on
    the

    Azure AI Search service. This configuration is only available for certain pricing
    tiers in

    certain regions. Known values are: "disabled", "free", and "standard".'
  name: semanticSearch
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SearchSemanticSearch">]
- description: 'Specifies the billing plan for agentic retrieval on the Azure AI

    Search service. This configuration is only available for certain pricing tiers
    in certain

    regions. Known values are: "free" and "standard".'
  name: knowledgeRetrieval
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KnowledgeRetrieval">]
- description: 'The list of private endpoint connections to the Azure AI

    Search service.'
  name: privateEndpointConnections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: 'Defines the level of reuse for the auto-generated

    domain name label for the search service (e.g. myservice-<uniqueId>.search.windows.net).
    If not

    specified, no auto-generated domain name label is created for the search service.
    Known values

    are: "TenantReuse", "SubscriptionReuse", and "NoReuse".'
  name: autoGeneratedDomainNameLabelScope
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoGeneratedDomainNameLabelScope">]
- description: 'The list of shared private link resources managed by the

    Azure AI Search service.'
  name: sharedPrivateLinkResources
  types:
  - <xref:list>[<xref:"SharedPrivateLinkResource">]
- description: 'A system generated property representing the service''s etag that
    can be for

    optimistic concurrency control during updates.'
  name: eTag
  types:
  - <xref:str>
- description: 'Indicates if the search service has an upgrade available. Known values

    are: "notAvailable" and "available".'
  name: upgradeAvailable
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UpgradeAvailable">]
- description: 'The date and time the search service was last upgraded. This field

    will be null until the service gets upgraded for the first time.'
  name: serviceUpgradedAt
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.search.types.SearchServiceProperties.authOptions
  name: authOptions
  summary: 'Defines the options for how the data plane API of a search service authenticates
    requests. This

    cannot be set if ''disableLocalAuth'' is set to true.'
  signature: 'authOptions: DataPlaneAuthOptions'
- uid: azure.mgmt.search.types.SearchServiceProperties.autoGeneratedDomainNameLabelScope
  name: autoGeneratedDomainNameLabelScope
  summary: 'Defines the level of reuse for the auto-generated domain name label for
    the search service

    (e.g. myservice-<uniqueId>.search.windows.net). If not specified, no auto-generated
    domain name

    label is created for the search service. Known values are: "TenantReuse",

    "SubscriptionReuse", and "NoReuse".'
  signature: 'autoGeneratedDomainNameLabelScope: str | AutoGeneratedDomainNameLabelScope
    | None'
- uid: azure.mgmt.search.types.SearchServiceProperties.computeType
  name: computeType
  summary: 'Configure this property to support the search service using either the
    Default Compute or Azure

    Confidential Compute. Known values are: "Default" and "Confidential".'
  signature: 'computeType: str | ComputeType'
- uid: azure.mgmt.search.types.SearchServiceProperties.dataExfiltrationProtections
  name: dataExfiltrationProtections
  summary: 'A list of data exfiltration scenarios that are explicitly disallowed for
    the search service.

    Currently, the only supported value is ''All'' to disable all possible data export
    scenarios with

    more fine grained controls planned for the future.'
  signature: 'dataExfiltrationProtections: list[typing.Union[str, ForwardRef(''SearchDataExfiltrationProtection'')]]'
- uid: azure.mgmt.search.types.SearchServiceProperties.disableLocalAuth
  name: disableLocalAuth
  summary: 'When set to true, calls to the search service will not be permitted to
    utilize API keys for

    authentication. This cannot be set to true if ''dataPlaneAuthOptions'' are defined.'
  signature: 'disableLocalAuth: bool | None'
- uid: azure.mgmt.search.types.SearchServiceProperties.eTag
  name: eTag
  summary: 'A system generated property representing the service''s etag that can
    be for optimistic

    concurrency control during updates.'
  signature: 'eTag: str'
- uid: azure.mgmt.search.types.SearchServiceProperties.encryptionWithCmk
  name: encryptionWithCmk
  summary: 'Specifies any policy regarding encryption of resources (such as indexes)
    using customer manager

    keys within a search service.'
  signature: 'encryptionWithCmk: EncryptionWithCmk'
- uid: azure.mgmt.search.types.SearchServiceProperties.endpoint
  name: endpoint
  summary: The endpoint of the Azure AI Search service.
  signature: 'endpoint: str'
- uid: azure.mgmt.search.types.SearchServiceProperties.hostingMode
  name: hostingMode
  summary: 'Applicable only for the standard3 SKU. You can set this property to enable
    up to 3 high density

    partitions that allow up to 1000 indexes, which is much higher than the maximum
    indexes allowed

    for any other SKU. For the standard3 SKU, the value is either ''Default'' or ''HighDensity''.
    For

    all other SKUs, this value must be ''Default''. Known values are: "Default" and

    "HighDensity".'
  signature: 'hostingMode: str | HostingMode'
- uid: azure.mgmt.search.types.SearchServiceProperties.knowledgeRetrieval
  name: knowledgeRetrieval
  summary: 'Specifies the billing plan for agentic retrieval on the Azure AI Search
    service. This

    configuration is only available for certain pricing tiers in certain regions.
    Known values are:

    "free" and "standard".'
  signature: 'knowledgeRetrieval: str | KnowledgeRetrieval | None'
- uid: azure.mgmt.search.types.SearchServiceProperties.networkRuleSet
  name: networkRuleSet
  summary: Network specific rules that determine how the Azure AI Search service may
    be reached.
  signature: 'networkRuleSet: NetworkRuleSet'
- uid: azure.mgmt.search.types.SearchServiceProperties.partitionCount
  name: partitionCount
  summary: 'The number of partitions in the dedicated search service; if specified,
    it can be 1, 2, 3, 4,

    6, or 12. Values greater than 1 are only valid for standard SKUs. For ''standard3''
    services with

    hostingMode set to ''highDensity'', the allowed values are between 1 and 3.'
  signature: 'partitionCount: int'
- uid: azure.mgmt.search.types.SearchServiceProperties.privateEndpointConnections
  name: privateEndpointConnections
  summary: The list of private endpoint connections to the Azure AI Search service.
  signature: 'privateEndpointConnections: list[''PrivateEndpointConnection'']'
- uid: azure.mgmt.search.types.SearchServiceProperties.provisioningState
  name: provisioningState
  summary: 'The state of the last provisioning operation performed on the search service.
    Provisioning is

    an intermediate state that occurs while service capacity is being established.
    After capacity

    is set up, provisioningState changes to either ''Succeeded'' or ''Failed''. Client
    applications can

    poll provisioning status (the recommended polling interval is from 30 seconds
    to one minute) by

    using the Get Search Service operation to see when an operation is completed.
    If you are using

    the free service, this value tends to come back as ''Succeeded'' directly in the
    call to Create

    search service. This is because the free service uses capacity that is already
    set up. Known

    values are: "succeeded", "provisioning", and "failed".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.search.types.SearchServiceProperties.publicNetworkAccess
  name: publicNetworkAccess
  summary: 'This value can be set to ''Enabled'' to avoid breaking changes on existing
    customer resources and

    templates. If set to ''Disabled'', traffic over public interface is not allowed,
    and private

    endpoint connections would be the exclusive access method. Known values are: "Enabled",

    "Disabled", and "SecuredByPerimeter".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.search.types.SearchServiceProperties.replicaCount
  name: replicaCount
  summary: 'The number of replicas in the dedicated search service. If specified,
    it must be a value

    between 1 and 12 inclusive for standard SKUs or between 1 and 3 inclusive for
    basic SKU.'
  signature: 'replicaCount: int'
- uid: azure.mgmt.search.types.SearchServiceProperties.semanticSearch
  name: semanticSearch
  summary: 'Specifies the availability and billing plan for semantic search on the
    Azure AI Search service.

    This configuration is only available for certain pricing tiers in certain regions.
    Known values

    are: "disabled", "free", and "standard".'
  signature: 'semanticSearch: str | SearchSemanticSearch | None'
- uid: azure.mgmt.search.types.SearchServiceProperties.serviceUpgradedAt
  name: serviceUpgradedAt
  summary: 'The date and time the search service was last upgraded. This field will
    be null until the

    service gets upgraded for the first time.'
  signature: 'serviceUpgradedAt: str'
- uid: azure.mgmt.search.types.SearchServiceProperties.sharedPrivateLinkResources
  name: sharedPrivateLinkResources
  summary: The list of shared private link resources managed by the Azure AI Search
    service.
  signature: 'sharedPrivateLinkResources: list[''SharedPrivateLinkResource'']'
- uid: azure.mgmt.search.types.SearchServiceProperties.status
  name: status
  summary: 'The search service is

    running and no provisioning operations are underway. ''provisioning'': The search
    service is

    being provisioned or scaled up or down. ''deleting'': The search service is being
    deleted.

    ''degraded'': The search service is degraded. This can occur when the underlying
    search units are

    not healthy. The search service is most likely operational, but performance might
    be slow and

    some requests might be dropped. ''disabled'': The search service is disabled.
    In this state, the

    service will reject all API requests. ''error'': The search service is in an error
    state.

    ''stopped'': The search service is in a subscription that''s disabled. If your
    service is in the

    degraded, disabled, or error states, it means the Azure AI Search team is actively

    investigating the underlying issue. Dedicated services in these states are still
    chargeable

    based on the number of search units provisioned. Known values are: "running",

    "provisioning", "deleting", "degraded", "disabled", "error", and "stopped".'
  signature: 'status: str | SearchServiceStatus'
- uid: azure.mgmt.search.types.SearchServiceProperties.statusDetails
  name: statusDetails
  summary: The details of the search service status.
  signature: 'statusDetails: str'
- uid: azure.mgmt.search.types.SearchServiceProperties.upgradeAvailable
  name: upgradeAvailable
  summary: '"notAvailable"

    and "available".'
  signature: 'upgradeAvailable: str | UpgradeAvailable'
