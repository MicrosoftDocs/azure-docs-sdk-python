uid: azure.mgmt.search.types.DataUserAssignedIdentity
name: DataUserAssignedIdentity
fullName: azure.mgmt.search.types.DataUserAssignedIdentity
module: azure.mgmt.search.types
summary: Specifies the user assigned identity to use.
constructor:
  syntax: DataUserAssignedIdentity()
variables:
- description: 'Required. Default value is

    "#Microsoft.Azure.Search.DataUserAssignedIdentity".'
  name: '@odata.type'
  types:
  - <xref:typing.Literal>["#Microsoft.Azure.Search.DataUserAssignedIdentity"]
- description: 'The fully qualified Azure resource Id of a user assigned managed

    identity typically in the form

    "/subscriptions/12345678-1234-1234-1234-1234567890ab/resourceGroups/rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myId"

    that should have been assigned to the search service. Required.'
  name: userAssignedIdentity
  types:
  - <xref:str>
- description: 'Optional for Multi-tenant User-Assigned Managed Identity CMK

    Support: The client id (as a UUID) of the multi-tenant App Registration that has
    been

    configured to federate with the userAssignedIdentity.'
  name: federatedIdentityClientId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.search.types.DataUserAssignedIdentity.federatedIdentityClientId
  name: federatedIdentityClientId
  signature: 'federatedIdentityClientId: str'
