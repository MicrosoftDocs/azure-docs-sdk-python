### YamlMime:PythonClass
uid: azure.mgmt.search.types.EncryptionWithCmk
name: EncryptionWithCmk
fullName: azure.mgmt.search.types.EncryptionWithCmk
module: azure.mgmt.search.types
summary: 'Describes a policy that determines how resources within the search service
  are to be encrypted

  with customer managed keys.'
constructor:
  syntax: EncryptionWithCmk()
variables:
- description: 'Describes how a search service should enforce compliance if it finds
    objects

    that aren''t encrypted with the customer-managed key. Known values are: "Disabled",
    "Enabled",

    and "Unspecified".'
  name: enforcement
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SearchEncryptionWithCmk">]
- description: 'Returns the status of search service compliance with respect

    to non-CMK-encrypted objects. If a service has more than one unencrypted object,
    and

    enforcement is enabled, the service is marked as noncompliant. Known values are:
    "Compliant"

    and "NonCompliant".'
  name: encryptionComplianceStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SearchEncryptionComplianceStatus">]
- description: 'Describes the customer-managed key configuration for

    encrypting the search service.'
  name: serviceLevelEncryptionKey
  types:
  - <xref:<xref:"SearchResourceEncryptionKey">>
attributes:
- uid: azure.mgmt.search.types.EncryptionWithCmk.encryptionComplianceStatus
  name: encryptionComplianceStatus
  summary: 'Returns the status of search service compliance with respect to non-CMK-encrypted
    objects. If a

    service has more than one unencrypted object, and enforcement is enabled, the
    service is marked

    as noncompliant. Known values are: "Compliant" and "NonCompliant".'
  signature: 'encryptionComplianceStatus: str | SearchEncryptionComplianceStatus'
- uid: azure.mgmt.search.types.EncryptionWithCmk.enforcement
  name: enforcement
  summary: 'Describes how a search service should enforce compliance if it finds objects
    that aren''t

    encrypted with the customer-managed key. Known values are: "Disabled", "Enabled",
    and

    "Unspecified".'
  signature: 'enforcement: str | SearchEncryptionWithCmk'
- uid: azure.mgmt.search.types.EncryptionWithCmk.serviceLevelEncryptionKey
  name: serviceLevelEncryptionKey
  summary: Describes the customer-managed key configuration for encrypting the search
    service.
  signature: 'serviceLevelEncryptionKey: SearchResourceEncryptionKey'
