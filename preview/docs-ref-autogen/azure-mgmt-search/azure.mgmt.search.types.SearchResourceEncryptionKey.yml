### YamlMime:PythonClass
uid: azure.mgmt.search.types.SearchResourceEncryptionKey
name: SearchResourceEncryptionKey
fullName: azure.mgmt.search.types.SearchResourceEncryptionKey
module: azure.mgmt.search.types
summary: 'A customer-managed encryption key in Azure Key Vault. Keys that you create
  and manage can be

  used to encrypt or decrypt data-at-rest, such as indexes and synonym maps.'
constructor:
  syntax: SearchResourceEncryptionKey()
variables:
- description: 'The name of your Azure Key Vault key to be used to encrypt your data
    at

    rest.'
  name: keyVaultKeyName
  types:
  - <xref:str>
- description: 'The version of your Azure Key Vault key to be used to encrypt your

    data at rest.'
  name: keyVaultKeyVersion
  types:
  - <xref:str>
- description: 'The URI of your Azure Key Vault, also referred to as DNS name, that
    contains

    the key to be used to encrypt your data at rest. An example URI might be

    `https://my-keyvault-name.vault.azure.net`.'
  name: keyVaultUri
  types:
  - <xref:str>
- description: 'An explicit managed identity to use for this encryption key. If not
    specified

    and the access credentials property is null, the system-assigned managed identity
    is used. On

    update to the resource, if the explicit identity is unspecified, it remains unchanged.
    If

    "none" is specified, the value of this property is cleared.'
  name: identity
  types:
  - <xref:<xref:"DataIdentity">>
- description: 'Optional Azure Active Directory credentials used for accessing your

    Azure Key Vault. Not required if using managed identity instead.'
  name: accessCredentials
  types:
  - <xref:<xref:"AzureActiveDirectoryApplicationCredentials">>
attributes:
- uid: azure.mgmt.search.types.SearchResourceEncryptionKey.accessCredentials
  name: accessCredentials
  summary: 'Optional Azure Active Directory credentials used for accessing your Azure
    Key Vault. Not

    required if using managed identity instead.'
  signature: 'accessCredentials: AzureActiveDirectoryApplicationCredentials'
- uid: azure.mgmt.search.types.SearchResourceEncryptionKey.identity
  name: identity
  summary: 'An explicit managed identity to use for this encryption key. If not specified
    and the access

    credentials property is null, the system-assigned managed identity is used. On
    update to the

    resource, if the explicit identity is unspecified, it remains unchanged. If "none"
    is

    specified, the value of this property is cleared.'
  signature: 'identity: DataNoneIdentity | DataUserAssignedIdentity | None'
- uid: azure.mgmt.search.types.SearchResourceEncryptionKey.keyVaultKeyName
  name: keyVaultKeyName
  summary: The name of your Azure Key Vault key to be used to encrypt your data at
    rest.
  signature: 'keyVaultKeyName: str'
- uid: azure.mgmt.search.types.SearchResourceEncryptionKey.keyVaultKeyVersion
  name: keyVaultKeyVersion
  summary: The version of your Azure Key Vault key to be used to encrypt your data
    at rest.
  signature: 'keyVaultKeyVersion: str'
- uid: azure.mgmt.search.types.SearchResourceEncryptionKey.keyVaultUri
  name: keyVaultUri
  summary: 'The URI of your Azure Key Vault, also referred to as DNS name, that contains
    the key to be used

    to encrypt your data at rest. An example URI might be

    `https://my-keyvault-name.vault.azure.net`.'
  signature: 'keyVaultUri: str'
