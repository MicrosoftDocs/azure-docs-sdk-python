### YamlMime:PythonClass
uid: azure.mgmt.containerservicepreparedimgspec.types.PreparedImageSpecificationProperties
name: PreparedImageSpecificationProperties
fullName: azure.mgmt.containerservicepreparedimgspec.types.PreparedImageSpecificationProperties
module: azure.mgmt.containerservicepreparedimgspec.types
summary: The properties of the Prepared Image Specification resource.
constructor:
  syntax: PreparedImageSpecificationProperties()
variables:
- description: 'The list of container images to cache on nodes. See

    [https://kubernetes.io/docs/concepts/containers/images/#image-names](https://kubernetes.io/docs/concepts/containers/images/#image-names).'
  name: container_images
  types:
  - <xref:list>[<xref:str>]
- description: 'The identity used to execute prepared image specification tasks during

    image build time and provisioning time. If not specified the default agentpool
    identity will be

    used. This does not affect provisioned nodes.'
  name: identity_profile
  types:
  - <xref:<xref:"PreparedImageSpecificationManagedIdentityProfile">>
- description: The client-provided version of the prepared image specification.
  name: version
  types:
  - <xref:str>
- description: 'The provisioning state of the prepared image specification. Known

    values are: "Succeeded", "Failed", "Canceled", "Provisioning", "Updating", "Deleting",
    and

    "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The scripts to customize the node before or after image capture.
  name: customization_scripts
  types:
  - <xref:list>[<xref:"PreparedImageSpecificationScript">]
attributes:
- uid: azure.mgmt.containerservicepreparedimgspec.types.PreparedImageSpecificationProperties.containerImages
  name: containerImages
  summary: 'The list of container images to cache on nodes. See

    [https://kubernetes.io/docs/concepts/containers/images/#image-names](https://kubernetes.io/docs/concepts/containers/images/#image-names).'
  signature: 'containerImages: list[str]'
- uid: azure.mgmt.containerservicepreparedimgspec.types.PreparedImageSpecificationProperties.customizationScripts
  name: customizationScripts
  summary: The scripts to customize the node before or after image capture.
  signature: 'customizationScripts: list[''PreparedImageSpecificationScript'']'
- uid: azure.mgmt.containerservicepreparedimgspec.types.PreparedImageSpecificationProperties.identityProfile
  name: identityProfile
  summary: 'The identity used to execute prepared image specification tasks during
    image build time and

    provisioning time. If not specified the default agentpool identity will be used.
    This does not

    affect provisioned nodes.'
  signature: 'identityProfile: PreparedImageSpecificationManagedIdentityProfile'
- uid: azure.mgmt.containerservicepreparedimgspec.types.PreparedImageSpecificationProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Provisioning", "Updating", "Deleting", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.containerservicepreparedimgspec.types.PreparedImageSpecificationProperties.version
  name: version
  summary: The client-provided version of the prepared image specification.
  signature: 'version: str'
