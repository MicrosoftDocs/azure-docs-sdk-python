### YamlMime:PythonClass
uid: azure.mgmt.containerservicepreparedimgspec.types.PreparedImageSpecificationScript
name: PreparedImageSpecificationScript
fullName: azure.mgmt.containerservicepreparedimgspec.types.PreparedImageSpecificationScript
module: azure.mgmt.containerservicepreparedimgspec.types
summary: Prepared image specification script.
constructor:
  syntax: PreparedImageSpecificationScript()
variables:
- description: 'The name for the customization script. Must be unique within the prepared
    image

    specification resource. Can only contain lowercase alphanumeric,''-'' or ''.''
    characters.

    Required.'
  name: name
  types:
  - <xref:str>
- description: 'The stage at which the script is executed. Specifying

    `NodeImageBuildTime` will ensure changes are persisted into the node image. Required.
    Known

    values are: "NodeImageBuildTime" and "NodeProvisionTime".'
  name: execution_point
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExecutionPoint">]
- description: 'The runtime environment for the script (e.g. Bash). Required. Known
    values

    are: "Bash" and "PowerShell".'
  name: script_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScriptType">]
- description: The script content to be executed in plain text. Do not include secrets.
  name: script
  types:
  - <xref:str>
- description: 'The action to take after successful script execution. Known values

    are: "None" and "RebootAfter".'
  name: post_script_action
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PostScriptAction">]
attributes:
