- uid: azure.ai.agentserver.invocations.InvocationAgentServerHost.ws_handler
  name: ws_handler
  summary: "Register an async function as the `/invocations_ws` handler.\n\nThe SDK\
    \ calls `await websocket.accept()` before invoking *fn* and\ncleanly closes the\
    \ connection on return (code 1000) or maps an\nuncaught exception to close code\
    \ 1011.\n\nUsage:\n\n<!-- literal_block {\"ids\": [], \"classes\": [], \"names\"\
    : [], \"dupnames\": [], \"backrefs\": [], \"xml:space\": \"preserve\", \"language\"\
    : \"default\", \"force\": false, \"linenos\": false} -->\n\n````default\n\n  \
    \ from starlette.websockets import WebSocket\n\n   @app.ws_handler\n   async def\
    \ handle(websocket: WebSocket) -> None:\n       async for msg in websocket.iter_text():\n\
    \           await websocket.send_text(msg)\n   ````"
  signature: 'ws_handler(fn: Callable[[WebSocket], Awaitable[None]]) -> Callable[[WebSocket],
    Awaitable[None]]'
  parameters:
  - name: fn
    description: 'An async function accepting a Starlette

      <xref:starlette.websockets.WebSocket> and returning `None`.'
    isRequired: true
    types:
    - <xref:typing.Callable>[[<xref:WebSocket>], <xref:typing.Awaitable>[<xref:None>]]
  return:
    description: The original function (unmodified).
    types:
    - <xref:typing.Callable>[[<xref:WebSocket>], <xref:typing.Awaitable>[<xref:None>]]
  exceptions:
  - type: TypeError
    description: 'If *fn* is not an `async def` function, or its

      signature cannot be invoked with a single positional argument

      (the WebSocket).'
