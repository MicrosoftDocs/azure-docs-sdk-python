uid: azure.ai.agentserver.invocations.InvocationAgentServerHost
name: InvocationAgentServerHost
fullName: azure.ai.agentserver.invocations.InvocationAgentServerHost
module: azure.ai.agentserver.invocations
summary: "Invocation protocol host for Azure AI Hosted Agents.\n\nA <xref:azure.ai.agentserver.core.AgentServerHost>\
  \ subclass that adds\nthe invocation protocol endpoints.  Use the decorator methods\
  \ to wire\nhandler functions to the endpoints.\n\nThe same host object also exposes\
  \ the `invocations_ws` (WebSocket)\ntransport at [/invocations_ws](/invocations_ws)\
  \ \u2014 register a handler with the\n<xref:azure.ai.agentserver.invocations.InvocationAgentServerHost.ws_handler>\
  \ decorator.  Multi-protocol agents share a single\nhost, session, and process.\n\
  \nFor multi-protocol agents, compose via cooperative inheritance:\n\n<!-- literal_block\
  \ {\"ids\": [], \"classes\": [], \"names\": [], \"dupnames\": [], \"backrefs\":\
  \ [], \"xml:space\": \"preserve\", \"language\": \"default\", \"force\": false,\
  \ \"linenos\": false} -->\n\n````default\n\n   class MyHost(InvocationAgentServerHost,\
  \ ResponsesAgentServerHost):\n       pass\n   ````\n\nUsage:\n\n<!-- literal_block\
  \ {\"ids\": [], \"classes\": [], \"names\": [], \"dupnames\": [], \"backrefs\":\
  \ [], \"xml:space\": \"preserve\", \"language\": \"default\", \"force\": false,\
  \ \"linenos\": false} -->\n\n````default\n\n   from azure.ai.agentserver.invocations\
  \ import InvocationAgentServerHost\n   from starlette.websockets import WebSocket\n\
  \n   app = InvocationAgentServerHost()\n\n   @app.invoke_handler               \
  \   # POST /invocations\n   async def handle(request):\n       return JSONResponse({\"\
  ok\": True})\n\n   @app.ws_handler                      # /invocations_ws\n   async\
  \ def ws(websocket: WebSocket) -> None:\n       async for message in websocket.iter_text():\n\
  \           await websocket.send_text(message)\n\n   app.run()\n   ````"
