### YamlMime:PythonClass
uid: azure.ai.agentserver.invocations.voice.TargetTurn
name: TargetTurn
fullName: azure.ai.agentserver.invocations.voice.TargetTurn
module: azure.ai.agentserver.invocations.voice
summary: '> [!NOTE]

  > This is an experimental class, and may change at any time. Please see [https://aka.ms/azure-ai-agentserver-experimental](https://aka.ms/azure-ai-agentserver-experimental)
  for more information.

  >


  Application-owned trace lifetime for one target-agent decision.'
constructor:
  syntax: TargetTurn()
methods:
- uid: azure.ai.agentserver.invocations.voice.TargetTurn.activate
  name: activate
  summary: 'Return the single lexical activation scope for this target turn.


    The application must await every task that creates target descendants

    before leaving this scope. The scope must exit in the task that entered it.'
  signature: activate() -> ContextManager[None]
  return:
    description: A synchronous context manager that makes this target turn current.
    types:
    - <xref:contextlib.AbstractContextManager>[<xref:None>]
- uid: azure.ai.agentserver.invocations.voice.TargetTurn.complete
  name: complete
  summary: "Complete the target turn with application-owned terminal facts.\n\nValidation\
    \ depends on `outcome`:\n\n* `TargetTurnOutcome.RESPONSE` requires `response_id`\
    \ and an\n\n     `output_item_count` of at least 1.\n\n* `TargetTurnOutcome.NONE`\
    \ requires no `response_id` and an\n\n     `output_item_count` equal to 0.\n\n\
    * Other outcomes allow both values to be omitted. If\n\n     `output_item_count`\
    \ is positive, `response_id` is required."
  signature: 'complete(*, outcome: TargetTurnOutcome | str, response_id: str | None
    = None, output_item_count: int | None = None) -> None'
  keywordOnlyParameters:
  - name: outcome
    description: First immutable terminal outcome.
    types:
    - <xref:azure.ai.agentserver.invocations.voice.TargetTurnOutcome>
    - <xref:str>
  - name: response_id
    description: Real response identifier subject to the outcome rules above.
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: output_item_count
    description: Completed output item count subject to the outcome rules above.
    defaultValue: None
    types:
    - <xref:int>
    - <xref:None>
attributes:
- uid: azure.ai.agentserver.invocations.voice.TargetTurn.is_completed
  name: is_completed
  summary: Whether the first valid completion has committed.
  return:
    description: Whether this target turn is complete.
    types:
    - <xref:bool>
