### YamlMime:PythonClass
uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig
name: ContentAnalyzerConfig
fullName: azure.ai.contentunderstanding.types.ContentAnalyzerConfig
module: azure.ai.contentunderstanding.types
summary: Configuration settings for an analyzer.
constructor:
  syntax: ContentAnalyzerConfig()
variables:
- description: Return all content details.
  name: return_details
  types:
  - <xref:bool>
- description: List of locale hints for speech transcription.
  name: locales
  types:
  - <xref:list>[<xref:str>]
- description: Enable optical character recognition (OCR).
  name: enable_ocr
  types:
  - <xref:bool>
- description: Enable layout analysis.
  name: enable_layout
  types:
  - <xref:bool>
- description: Enable generation of figure description.
  name: enable_figure_description
  types:
  - <xref:bool>
- description: Enable analysis of figures, such as charts and diagrams.
  name: enable_figure_analysis
  types:
  - <xref:bool>
- description: Enable mathematical formula detection.
  name: enable_formula
  types:
  - <xref:bool>
- description: 'Representation format of tables in analyze result markdown. Known
    values

    are: "html" and "markdown".'
  name: table_format
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TableFormat">]
- description: 'Representation format of charts in analyze result markdown. Known
    values

    are: "chartJs" and "markdown".'
  name: chart_format
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ChartFormat">]
- description: 'Representation format of annotations in analyze result markdown. Known

    values are: "none" and "markdown".'
  name: annotation_format
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AnnotationFormat">]
- description: 'Disable the default blurring of faces for privacy while processing

    the content.'
  name: disable_face_blurring
  types:
  - <xref:bool>
- description: Return field grounding source and confidence.
  name: estimate_field_source_and_confidence
  types:
  - <xref:bool>
- description: Map of categories to classify the input content(s) against.
  name: content_categories
  types:
  - <xref:dict>[<xref:str>, <xref:"ContentCategoryDefinition">]
- description: Enable segmentation of the input by contentCategories.
  name: enable_segment
  types:
  - <xref:bool>
- description: Force segmentation of document content by page.
  name: segment_per_page
  types:
  - <xref:bool>
- description: 'Omit the content for this analyzer from analyze result. Only return

    content(s) from additional analyzers specified in contentCategories, if any.'
  name: omit_content
  types:
  - <xref:bool>
- description: 'Workflow used for content analysis. Known values are: "default" and
    "agentic".'
  name: workflow
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ContentAnalyzerWorkflow">]
- description: 'When true, input that exceeds the service''s processable-unit

    limit is truncated to the limit and returned as a partial result with a warning,
    instead of

    failing. Field extraction and segmentation, where configured, run over the processed
    content

    and may be inaccurate. Defaults to false. Overridable per request by the allowInputTruncation

    query parameter.'
  name: allow_input_truncation
  types:
  - <xref:bool>
- description: 'Enable sub-page segmentation. When true, segments may cover a

    portion of a page instead of full pages.'
  name: allow_in_page_segments
  types:
  - <xref:bool>
- description: 'Strategy for chunking document content into smaller units for RAG

    scenarios. When omitted, chunking is disabled.'
  name: chunking_strategy
  types:
  - <xref:<xref:"ChunkingStrategy">>
methods:
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.allowInPageSegments
  name: allowInPageSegments
  summary: 'Enable sub-page segmentation. When true, segments may cover a portion
    of a page instead of full

    pages.'
  signature: 'allowInPageSegments: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.allowInputTruncation
  name: allowInputTruncation
  summary: 'When true, input that exceeds the service''s processable-unit limit is
    truncated to the limit

    and returned as a partial result with a warning, instead of failing. Field extraction
    and

    segmentation, where configured, run over the processed content and may be inaccurate.
    Defaults

    to false. Overridable per request by the allowInputTruncation query parameter.'
  signature: 'allowInputTruncation: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.annotationFormat
  name: annotationFormat
  summary: '"none" and

    "markdown".'
  signature: 'annotationFormat: str | AnnotationFormat'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.chartFormat
  name: chartFormat
  summary: '"chartJs" and

    "markdown".'
  signature: 'chartFormat: str | ChartFormat'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.chunkingStrategy
  name: chunkingStrategy
  summary: 'Strategy for chunking document content into smaller units for RAG scenarios.
    When omitted,

    chunking is disabled.'
  signature: 'chunkingStrategy: ChunkingStrategy'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.contentCategories
  name: contentCategories
  summary: Map of categories to classify the input content(s) against.
  signature: 'contentCategories: dict[str, ''ContentCategoryDefinition'']'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.disableFaceBlurring
  name: disableFaceBlurring
  summary: Disable the default blurring of faces for privacy while processing the
    content.
  signature: 'disableFaceBlurring: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.enableFigureAnalysis
  name: enableFigureAnalysis
  summary: Enable analysis of figures, such as charts and diagrams.
  signature: 'enableFigureAnalysis: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.enableFigureDescription
  name: enableFigureDescription
  summary: Enable generation of figure description.
  signature: 'enableFigureDescription: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.enableFormula
  name: enableFormula
  summary: Enable mathematical formula detection.
  signature: 'enableFormula: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.enableLayout
  name: enableLayout
  summary: Enable layout analysis.
  signature: 'enableLayout: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.enableOcr
  name: enableOcr
  summary: Enable optical character recognition (OCR).
  signature: 'enableOcr: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.enableSegment
  name: enableSegment
  summary: Enable segmentation of the input by contentCategories.
  signature: 'enableSegment: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.estimateFieldSourceAndConfidence
  name: estimateFieldSourceAndConfidence
  summary: Return field grounding source and confidence.
  signature: 'estimateFieldSourceAndConfidence: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.locales
  name: locales
  summary: List of locale hints for speech transcription.
  signature: 'locales: list[str]'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.omitContent
  name: omitContent
  summary: 'Omit the content for this analyzer from analyze result. Only return content(s)
    from additional

    analyzers specified in contentCategories, if any.'
  signature: 'omitContent: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.returnDetails
  name: returnDetails
  summary: Return all content details.
  signature: 'returnDetails: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.segmentPerPage
  name: segmentPerPage
  summary: Force segmentation of document content by page.
  signature: 'segmentPerPage: bool'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.tableFormat
  name: tableFormat
  summary: '"html" and

    "markdown".'
  signature: 'tableFormat: str | TableFormat'
- uid: azure.ai.contentunderstanding.types.ContentAnalyzerConfig.workflow
  name: workflow
  summary: '"default" and "agentic".'
  signature: 'workflow: str | ContentAnalyzerWorkflow'
