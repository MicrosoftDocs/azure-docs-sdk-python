- description: 'Indicates whether the result may contain additional fields outside

    of the defined schema.'
  name: dynamic_field_schema
  types:
  - <xref:bool>
- description: 'The location where the data may be processed.  Defaults to global.

    Known values are: "geography", "dataZone", and "global".'
  name: processing_location
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProcessingLocation">]
- description: Additional knowledge sources used to enhance the analyzer.
  name: knowledge_sources
  types:
  - <xref:list>[<xref:"KnowledgeSource">]
- description: 'Mapping of model roles to specific model names. Ex. { "completion":
