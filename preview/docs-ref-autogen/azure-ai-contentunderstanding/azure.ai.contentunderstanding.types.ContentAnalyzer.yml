  - <xref:str>
- description: Tags associated with the analyzer.
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'The status of the analyzer. Required. Known values are: "creating",
    "ready",

    "deleting", and "failed".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ContentAnalyzerStatus">]
- description: The date and time when the analyzer was created. Required.
  name: created_at
