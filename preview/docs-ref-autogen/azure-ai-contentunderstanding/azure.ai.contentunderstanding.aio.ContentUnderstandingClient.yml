### YamlMime:PythonClass
uid: azure.ai.contentunderstanding.aio.ContentUnderstandingClient
name: ContentUnderstandingClient
fullName: azure.ai.contentunderstanding.aio.ContentUnderstandingClient
module: azure.ai.contentunderstanding.aio
summary: 'Custom async ContentUnderstandingClient with static patches for analyze
  operations.


  This wrapper:

  - Hides the string_encoding parameter (always uses "codePoint" for Python)

  - Returns AnalyzeAsyncLROPoller with .operation_id property

  - Fixes content_type default for begin_analyze_binary

  - Defaults polling_interval to 3 seconds

  - Forwards allow_input_truncation on analyze APIs (JSON and binary; when omitted,
  the analyzer config applies)'
constructor:
  syntax: 'ContentUnderstandingClient(endpoint: str, credential: AzureKeyCredential
    | AsyncTokenCredential, **kwargs: Any)'
  parameters:
  - name: endpoint
    description: Content Understanding service endpoint. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: credential
    description: 'Credential used to authenticate requests to the service. Is either
      a key

      credential type or a token credential type. Required.'
    isRequired: true
    types:
    - <xref:azure.core.credentials.AzureKeyCredential>
    - <xref:azure.core.credentials_async.AsyncTokenCredential>
  keywordOnlyParameters:
  - name: api_version
    description: 'The API version to use for this operation. Known values are

      `2025-11-01` (GA) and `2026-06-01-preview`. Default value is

      `2026-06-01-preview`. Preview-only operations require the preview API version.'
    types:
    - <xref:str>
  - name: polling_interval
    description: 'Default waiting time between two polls for LRO operations if no

      Retry-After header is present. Default value is 3 seconds.'
    types:
    - <xref:int>
methods:
