### YamlMime:PythonClass
uid: azure.ai.contentunderstanding.types.ContentFieldDefinition
name: ContentFieldDefinition
fullName: azure.ai.contentunderstanding.types.ContentFieldDefinition
module: azure.ai.contentunderstanding.types
summary: Definition of the field using a JSON Schema like syntax.
constructor:
  syntax: ContentFieldDefinition()
variables:
- description: 'Generation method. Known values are: "generate", "extract", and "classify".'
  name: method
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GenerationMethod">]
- description: 'Semantic data type of the field value. Known values are: "string",
    "date", "time",

    "number", "integer", "boolean", "array", "object", and "json".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ContentFieldType">]
- description: Field description.
  name: description
  types:
  - <xref:str>
- description: Field type schema of each array element, if type is array.
  name: item_definition
  types:
  - <xref:<xref:"ContentFieldDefinition">>
- description: Named sub-fields, if type is object.
  name: properties
  types:
  - <xref:dict>[<xref:str>, <xref:"ContentFieldDefinition">]
- description: Examples of field values.
  name: examples
  types:
  - <xref:list>[<xref:str>]
- description: Enumeration of possible field values.
  name: enum
  types:
  - <xref:list>[<xref:str>]
- description: Descriptions for each enumeration value.
  name: enum_descriptions
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Reference to another field definition.
  name: ref
  types:
  - <xref:str>
- description: Return grounding source and confidence.
  name: estimate_source_and_confidence
  types:
  - <xref:bool>
methods:
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.description
  name: description
  signature: 'description: str'
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.enum
  name: enum
  signature: 'enum: list[str]'
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.enumDescriptions
  name: enumDescriptions
  signature: 'enumDescriptions: dict[str, str]'
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.estimateSourceAndConfidence
  name: estimateSourceAndConfidence
  signature: 'estimateSourceAndConfidence: bool'
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.examples
  name: examples
  signature: 'examples: list[str]'
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.method
  name: method
  signature: 'method: str | GenerationMethod'
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.properties
  name: properties
  signature: 'properties: dict[str, ''ContentFieldDefinition'']'
- uid: azure.ai.contentunderstanding.types.ContentFieldDefinition.type
  name: type
  signature: 'type: str | ContentFieldType'
