### YamlMime:PythonClass
uid: azure.ai.contentunderstanding.types.ContentFieldSchema
name: ContentFieldSchema
fullName: azure.ai.contentunderstanding.types.ContentFieldSchema
module: azure.ai.contentunderstanding.types
summary: Schema of fields to be extracted from documents.
constructor:
  syntax: ContentFieldSchema()
variables:
- description: The name of the field schema.
  name: name
  types:
  - <xref:str>
- description: A description of the field schema.
  name: description
  types:
  - <xref:str>
- description: The fields defined in the schema. Required.
  name: fields
  types:
  - <xref:dict>[<xref:str>, <xref:"ContentFieldDefinition">]
- description: Additional definitions referenced by the fields in the schema.
  name: definitions
  types:
  - <xref:dict>[<xref:str>, <xref:"ContentFieldDefinition">]
methods:
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.definitions
  name: definitions
  summary: Additional definitions referenced by the fields in the schema.
  signature: 'definitions: dict[str, azure.ai.contentunderstanding.types.ContentFieldDefinition]'
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.description
  name: description
  summary: A description of the field schema.
  signature: 'description: str'
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.fields
  name: fields
  summary: The fields defined in the schema. Required.
  signature: 'fields: dict[str, azure.ai.contentunderstanding.types.ContentFieldDefinition]'
- uid: azure.ai.contentunderstanding.types.ContentFieldSchema.name
  name: name
  summary: The name of the field schema.
  signature: 'name: str'
