### YamlMime:PythonClass
uid: azure.ai.contentunderstanding.types.AnalysisInput
name: AnalysisInput
fullName: azure.ai.contentunderstanding.types.AnalysisInput
module: azure.ai.contentunderstanding.types
summary: Additional input to analyze.
constructor:
  syntax: AnalysisInput()
variables:
- description: The URL of the input to analyze.  Only one of url or data should be
    specified.
  name: url
  types:
  - <xref:str>
- description: 'Raw image bytes. Provide bytes-like object; do not base64-encode.
    Only one of url

    or data should be specified.'
  name: data
  types:
  - <xref:str>
- description: Name of the input.
  name: name
  types:
  - <xref:str>
- description: The MIME type of the input content.  Ex. application/pdf, image/jpeg,
    etc.
  name: mime_type
  types:
  - <xref:str>
- description: 'Range of the input to analyze (ex. `1-3,5,9-`).  Document content
    uses

    1-based page numbers, while audio visual content uses integer milliseconds.'
  name: content_range
  types:
  - <xref:str>
methods:
- uid: azure.ai.contentunderstanding.types.AnalysisInput.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.ai.contentunderstanding.types.AnalysisInput.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.ai.contentunderstanding.types.AnalysisInput.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.ai.contentunderstanding.types.AnalysisInput.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.contentunderstanding.types.AnalysisInput.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.ai.contentunderstanding.types.AnalysisInput.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.ai.contentunderstanding.types.AnalysisInput.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.ai.contentunderstanding.types.AnalysisInput.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.ai.contentunderstanding.types.AnalysisInput.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.contentunderstanding.types.AnalysisInput.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.ai.contentunderstanding.types.AnalysisInput.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.ai.contentunderstanding.types.AnalysisInput.data
  name: data
  summary: 'Raw image bytes. Provide bytes-like object; do not base64-encode. Only
    one of url or data

    should be specified.'
  signature: 'data: str'
- uid: azure.ai.contentunderstanding.types.AnalysisInput.mimeType
  name: mimeType
  summary: The MIME type of the input content.  Ex. application/pdf, image/jpeg, etc.
  signature: 'mimeType: str'
- uid: azure.ai.contentunderstanding.types.AnalysisInput.name
  name: name
  summary: Name of the input.
  signature: 'name: str'
- uid: azure.ai.contentunderstanding.types.AnalysisInput.range
  name: range
  summary: 'Range of the input to analyze (ex. `1-3,5,9-`).  Document content uses
    1-based page numbers,

    while audio visual content uses integer milliseconds.'
  signature: 'range: str'
- uid: azure.ai.contentunderstanding.types.AnalysisInput.url
  name: url
  summary: The URL of the input to analyze.  Only one of url or data should be specified.
  signature: 'url: str'
