uid: azure.ai.contentsafety.models.AcsVerdict
name: AcsVerdict
fullName: azure.ai.contentsafety.models.AcsVerdict
module: azure.ai.contentsafety.models
summary: The complete Agent Control Specification policy verdict.
constructor:
  syntax: 'AcsVerdict(*args: Any, **kwargs: Any)'
variables:
- description: 'The canonical policy decision. Required. Known values are: "allow",
    "deny", and

    "transform".'
  name: decision
  types:
  - <xref:str>
  - <xref:azure.ai.contentsafety.models.AcsDecision>
- description: An optional machine-readable reason for the decision.
  name: reason
  types:
  - <xref:str>
- description: An optional human-readable message for the decision.
  name: message
  types:
  - <xref:str>
- description: Optional non-blocking warnings produced by policy evaluation.
  name: warnings
  types:
  - <xref:list>[<xref:str>]
- description: 'Optional approval metadata for a deny decision. Unified Moderate does
    not

    invoke an approval workflow, so the content remains blocked.'
  name: approval
  types:
  - <xref:azure.ai.contentsafety.models.AcsApproval>
- description: Canonical transform metadata. Required when the decision is transform.
  name: transform
  types:
  - <xref:azure.ai.contentsafety.models.AcsTransform>
- description: Optional policy evidence and verification pointers.
  name: evidence
  types:
  - <xref:list>[<xref:azure.ai.contentsafety.models.AcsEvidence>]
- description: 'Optional moderation results keyed by harm category. Category names
    come

    from the policy harm configuration and are not restricted to a predefined set.
    A policy deny

    that is unrelated to a configured harm can omit this property.'
  name: harm_results
  types:
  - <xref:dict>[<xref:str>, <xref:azure.ai.contentsafety.models.AcsHarmResult>]
