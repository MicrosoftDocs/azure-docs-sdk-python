### YamlMime:PythonClass
uid: azure.ai.contentsafety.models.UnifiedModerateOptions
name: UnifiedModerateOptions
fullName: azure.ai.contentsafety.models.UnifiedModerateOptions
module: azure.ai.contentsafety.models
summary: 'A request to evaluate and enforce an applicable policy for one workload
  event. The service uses

  the first policy it can resolve from policyId and then from the policy binding for

  targetResourceId, in that order. The request fails if neither selector resolves
  a policy.'
constructor:
  syntax: 'UnifiedModerateOptions(*args: Any, **kwargs: Any)'
variables:
- description: 'The identifier of a policy available to the Content Safety resource.
    When

    provided, the service attempts to resolve this policy before using the policy
    bound to

    targetResourceId.'
  name: policy_id
  types:
  - <xref:str>
- description: 'The Azure resource identifier whose policy binding is resolved if
    no

    policy is resolved from policyId. The target resource must already have a policy
    binding

    available to the Content Safety resource.'
  name: target_resource_id
  types:
  - <xref:str>
- description: 'The workload event source. The source selects the policy intervention
    point.

    Required. Known values are: "input", "output", "pre_tool_call", and "post_tool_call".'
  name: source
  types:
  - <xref:str>
  - <xref:azure.ai.contentsafety.models.UnifiedModerateSource>
- description: 'The content to evaluate. For input and output sources, provide nonempty
    plain

    text. For pre_tool_call, provide a string containing a JSON-encoded object with
    the proposed

    tool arguments. For post_tool_call, provide a string containing the JSON-encoded
    tool result.

    Required.'
  name: content
  types:
  - <xref:str>
- description: 'The tool name. Required and nonempty for tool-call sources and not
    allowed for

    input or output sources.'
  name: tool_name
  types:
  - <xref:str>
- description: 'An optional caller-provided tool-call identifier. The service generates
    one

    when omitted for a tool-call source.'
  name: tool_call_id
  types:
  - <xref:str>
- description: 'A string containing a JSON-encoded object with the original arguments
    for

    a completed tool call. This property applies only to post_tool_call. The service
    uses an empty

    object when omitted.'
  name: tool_arguments
  types:
  - <xref:str>
- description: 'Whether the completed tool call returned an error. This property

    applies only to post_tool_call.'
  name: tool_result_is_error
  types:
  - <xref:bool>
- description: 'The non-negative duration of the completed tool call, in milliseconds.

    This property applies only to post_tool_call.'
  name: tool_duration_ms
  types:
  - <xref:float>
- description: Optional agent, session, and request context supplied to policy evaluation.
  name: context
  types:
  - <xref:azure.ai.contentsafety.models.UnifiedModerateContext>
