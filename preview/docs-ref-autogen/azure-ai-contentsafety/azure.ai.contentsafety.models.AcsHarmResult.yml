variables:
- description: 'Whether this harm contributed to the overall ACS verdict blocking
    the content.

    Required.'
  name: blocked
  types:
  - <xref:bool>
- description: 'Whether this harm was detected, regardless of whether it caused the
    overall

    verdict to block. Required.'
  name: detected
  types:
  - <xref:bool>
- description: 'An optional harm-specific severity value. The value is defined by
    the

    moderation model or policy that produced the result.'
  name: severity
  types:
  - <xref:str>
- description: 'Optional blocklist results. Each item identifies one evaluated blocklist
    and

    whether it was detected.'
  name: details
  types:
  - <xref:list>[<xref:azure.ai.contentsafety.models.AcsHarmDetail>]
- description: An optional internet location associated with detected protected material.
  name: url
