name: AcsHarmResult
fullName: azure.ai.contentsafety.models.AcsHarmResult
module: azure.ai.contentsafety.models
summary: 'The moderation and policy-attribution result for one harm category. The
  category name is the

  key in the harmResults map and is not restricted to a predefined set.'
