### YamlMime:PythonClass
uid: azure.ai.contentsafety.types.AnalyzeTextOptions
name: AnalyzeTextOptions
fullName: azure.ai.contentsafety.types.AnalyzeTextOptions
module: azure.ai.contentsafety.types
summary: The text analysis request.
constructor:
  syntax: AnalyzeTextOptions()
variables:
- description: 'The text to be analyzed. We support a maximum of 10k Unicode characters
    (Unicode

    code points) in the text of one request. Required.'
  name: text
  types:
  - <xref:str>
- description: 'The categories will be analyzed. If they are not assigned, a default
    set of

    analysis results for the categories will be returned.'
  name: categories
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"TextCategory">]]
- description: The names of blocklists.
  name: blocklistNames
  types:
  - <xref:list>[<xref:str>]
- description: 'When set to true, further analyses of harmful content will not be

    performed in cases where blocklists are hit. When set to false, all analyses of
    harmful content

    will be performed, whether or not blocklists are hit.'
  name: haltOnBlocklistHit
  types:
  - <xref:bool>
- description: 'This refers to the type of text analysis output. If no value is assigned,
    the

    default value will be "FourSeverityLevels". Known values are: "FourSeverityLevels"
    and

    "EightSeverityLevels".'
  name: outputType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AnalyzeTextOutputType">]
methods:
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.blocklistNames
  name: blocklistNames
  summary: The names of blocklists.
  signature: 'blocklistNames: list[str]'
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.categories
  name: categories
  summary: 'The categories will be analyzed. If they are not assigned, a default set
    of analysis results

    for the categories will be returned.'
  signature: 'categories: list[typing.Union[str, ForwardRef(''TextCategory'')]]'
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.haltOnBlocklistHit
  name: haltOnBlocklistHit
  summary: 'When set to true, further analyses of harmful content will not be performed
    in cases where

    blocklists are hit. When set to false, all analyses of harmful content will be
    performed,

    whether or not blocklists are hit.'
  signature: 'haltOnBlocklistHit: bool'
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.outputType
  name: outputType
  summary: 'This refers to the type of text analysis output. If no value is assigned,
    the default value

    will be "FourSeverityLevels". Known values are: "FourSeverityLevels" and

    "EightSeverityLevels".'
  signature: 'outputType: str | AnalyzeTextOutputType'
- uid: azure.ai.contentsafety.types.AnalyzeTextOptions.text
  name: text
  summary: 'The text to be analyzed. We support a maximum of 10k Unicode characters
    (Unicode code points)

    in the text of one request. Required.'
  signature: 'text: Required[str]'
