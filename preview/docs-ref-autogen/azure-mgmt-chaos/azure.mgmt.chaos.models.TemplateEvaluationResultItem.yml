### YamlMime:PythonClass
uid: azure.mgmt.chaos.models.TemplateEvaluationResultItem
name: TemplateEvaluationResultItem
fullName: azure.mgmt.chaos.models.TemplateEvaluationResultItem
module: azure.mgmt.chaos.models
summary: Model that represents a single template evaluation result.
constructor:
  syntax: 'TemplateEvaluationResultItem(*args: Any, **kwargs: Any)'
variables:
- description: 'The template ID that was evaluated. Optional because the underlying
    BE field

    may be null for legacy evaluations created before template-centric persistence
    landed; the GW

    falls back to `scenarioName` in that case (`scenario.Id == templateId` by BE convention),

    so ARM responses are typically populated in practice.'
  name: template_id
  types:
  - <xref:str>
- description: 'The template name that was evaluated. Optional for the same reason
    as

    `templateId`.'
  name: template_name
  types:
  - <xref:str>
- description: 'The evaluation result for this template. Required. Known values are:

    "NotEvaluated", "Recommended", "NotApplicable", "Evaluating", "EvaluationFailed",
    and

    "EvaluationCancelled".'
  name: evaluation_result
  types:
  - <xref:str>
  - <xref:azure.mgmt.chaos.models.RecommendationStatus>
attributes:
- uid: azure.mgmt.chaos.models.TemplateEvaluationResultItem.evaluation_result
  name: evaluation_result
  summary: '"NotEvaluated",

    "Recommended", "NotApplicable", "Evaluating", "EvaluationFailed", and

    "EvaluationCancelled".'
  signature: 'evaluation_result: str | _models.RecommendationStatus'
- uid: azure.mgmt.chaos.models.TemplateEvaluationResultItem.template_id
  name: template_id
  summary: 'The template ID that was evaluated. Optional because the underlying BE
    field may be null for

    legacy evaluations created before template-centric persistence landed; the GW
    falls back to

    `scenarioName` in that case (`scenario.Id == templateId` by BE convention), so
    ARM

    responses are typically populated in practice.'
  signature: 'template_id: str | None'
- uid: azure.mgmt.chaos.models.TemplateEvaluationResultItem.template_name
  name: template_name
  summary: The template name that was evaluated. Optional for the same reason as `templateId`.
  signature: 'template_name: str | None'
