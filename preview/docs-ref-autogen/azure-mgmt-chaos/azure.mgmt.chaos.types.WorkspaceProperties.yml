### YamlMime:PythonClass
uid: azure.mgmt.chaos.types.WorkspaceProperties
name: WorkspaceProperties
fullName: azure.mgmt.chaos.types.WorkspaceProperties
module: azure.mgmt.chaos.types
summary: Model that represents the Workspace properties model.
constructor:
  syntax: WorkspaceProperties()
variables:
- description: 'Most recent provisioning state for the given Workspace resource.

    Known values are: "Succeeded", "Failed", "Canceled", "Creating", "Updating", "Deleting",
    and

    "Running".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The communication endpoint used to connect and communicate with

    the workspace for fault-injection orchestration.'
  name: communication_endpoint
  types:
  - <xref:str>
- description: 'The intended workspace-level resource scope to be used by child scenarios.

    Required.'
  name: scopes
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.chaos.types.WorkspaceProperties.communicationEndpoint
  name: communicationEndpoint
  summary: 'The communication endpoint used to connect and communicate with the workspace
    for

    fault-injection orchestration.'
  signature: 'communicationEndpoint: str'
- uid: azure.mgmt.chaos.types.WorkspaceProperties.provisioningState
  name: provisioningState
  summary: 'Most recent provisioning state for the given Workspace resource. Known
    values are:

    "Succeeded", "Failed", "Canceled", "Creating", "Updating", "Deleting", and

    "Running".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.chaos.types.WorkspaceProperties.scopes
  name: scopes
  summary: The intended workspace-level resource scope to be used by child scenarios.
    Required.
  signature: 'scopes: Required[list[str]]'
