### YamlMime:PythonClass
uid: azure.mgmt.chaos.models.ConnectionProperties
name: ConnectionProperties
fullName: azure.mgmt.chaos.models.ConnectionProperties
module: azure.mgmt.chaos.models
summary: 'Model that represents the properties of a connection.


  The schema is flat and discriminated by `kind`. Optional fields form the

  superset across all connection kinds; which fields are required is

  validated by the service per kind.'
constructor:
  syntax: 'ConnectionProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The kind of connection, indicating the actor type authorized to reach
    the Chaos

    Studio data plane for the workspace and target. Required. Known values are: "AksExtension",

    "ChaosAgent", and "Csfi".'
  name: kind
  types:
  - <xref:str>
  - <xref:azure.mgmt.chaos.models.ConnectionKind>
- description: 'The fully qualified Azure resource ID of the target resource this

    connection is established with. Required.'
  name: target_resource_id
  types:
  - <xref:str>
- description: 'The Microsoft Entra principal (object) ID of the identity used by
    the

    connection.'
  name: principal_id
  types:
  - <xref:str>
- description: The Microsoft Entra tenant ID that the connection identity belongs
    to.
  name: tenant_id
  types:
  - <xref:str>
- description: 'The subject name of the certificate used to authenticate the

    connection.'
  name: certificate_subject_name
  types:
  - <xref:str>
- description: The issuer of the certificate used to authenticate the connection.
  name: certificate_issuer
  types:
  - <xref:str>
- description: The dSTS principal name used to authenticate the connection.
  name: dsts_principal
  types:
  - <xref:str>
- description: 'The regional Chaos Studio data-plane endpoint assigned to this

    connection. Clients and agents use this endpoint to reach the Chaos Studio data
    plane for the

    connection.'
  name: data_plane_endpoint
  types:
  - <xref:str>
- description: 'The current status of the connection. Known values are: "Pending",
    "Connected",

    "Disconnected", and "Revoked".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.mgmt.chaos.models.ConnectionStatus>
- description: 'The most recent provisioning state for the connection resource. Known

    values are: "Succeeded", "Failed", "Canceled", "Creating", "Updating", "Deleting",
    and

    "Running".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.chaos.models.ProvisioningState>
attributes:
- uid: azure.mgmt.chaos.models.ConnectionProperties.certificate_issuer
  name: certificate_issuer
  summary: The issuer of the certificate used to authenticate the connection.
  signature: 'certificate_issuer: str | None'
- uid: azure.mgmt.chaos.models.ConnectionProperties.certificate_subject_name
  name: certificate_subject_name
  summary: The subject name of the certificate used to authenticate the connection.
  signature: 'certificate_subject_name: str | None'
- uid: azure.mgmt.chaos.models.ConnectionProperties.data_plane_endpoint
  name: data_plane_endpoint
  summary: 'The regional Chaos Studio data-plane endpoint assigned to this connection.
    Clients and agents

    use this endpoint to reach the Chaos Studio data plane for the connection.'
  signature: 'data_plane_endpoint: str | None'
- uid: azure.mgmt.chaos.models.ConnectionProperties.dsts_principal
  name: dsts_principal
  summary: The dSTS principal name used to authenticate the connection.
  signature: 'dsts_principal: str | None'
- uid: azure.mgmt.chaos.models.ConnectionProperties.kind
  name: kind
  summary: 'The kind of connection, indicating the actor type authorized to reach
    the Chaos Studio data

    plane for the workspace and target. Required. Known values are: "AksExtension",

    "ChaosAgent", and "Csfi".'
  signature: 'kind: str | _models.ConnectionKind'
- uid: azure.mgmt.chaos.models.ConnectionProperties.principal_id
  name: principal_id
  summary: The Microsoft Entra principal (object) ID of the identity used by the connection.
  signature: 'principal_id: str | None'
- uid: azure.mgmt.chaos.models.ConnectionProperties.provisioning_state
  name: provisioning_state
  summary: 'The most recent provisioning state for the connection resource. Known
    values are:

    "Succeeded", "Failed", "Canceled", "Creating", "Updating", "Deleting", and

    "Running".'
  signature: 'provisioning_state: str | _models.ProvisioningState | None'
- uid: azure.mgmt.chaos.models.ConnectionProperties.status
  name: status
  summary: '"Pending", "Connected",

    "Disconnected", and "Revoked".'
  signature: 'status: str | _models.ConnectionStatus | None'
- uid: azure.mgmt.chaos.models.ConnectionProperties.target_resource_id
  name: target_resource_id
  summary: 'The fully qualified Azure resource ID of the target resource this connection
    is established

    with. Required.'
  signature: 'target_resource_id: str'
- uid: azure.mgmt.chaos.models.ConnectionProperties.tenant_id
  name: tenant_id
  summary: The Microsoft Entra tenant ID that the connection identity belongs to.
  signature: 'tenant_id: str | None'
