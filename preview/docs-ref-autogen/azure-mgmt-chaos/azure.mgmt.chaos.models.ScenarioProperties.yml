uid: azure.mgmt.chaos.models.ScenarioProperties
name: ScenarioProperties
fullName: azure.mgmt.chaos.models.ScenarioProperties
module: azure.mgmt.chaos.models
summary: Model that represents the properties of the scenario.
constructor:
