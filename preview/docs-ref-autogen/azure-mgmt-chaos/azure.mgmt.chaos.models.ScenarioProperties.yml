variables:
- description: 'Most recent provisioning state for the given scenario resource. Known

    values are: "Succeeded", "Failed", "Canceled", "Creating", "Updating", "Deleting",
    and

    "Running".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.chaos.models.ProvisioningState>
- description: 'Resource ID of the template version this scenario was created from

    (optional).'
  name: created_from
  types:
  - <xref:str>
- description: Version of the scenario.
  name: version
  types:
  - <xref:str>
- description: Description of what this scenario does (optional).
  name: description
  types:
  - <xref:str>
- description: Parameter definitions for the scenario. Required.
  name: parameters
  types:
  - <xref:list>[<xref:azure.mgmt.chaos.models.ScenarioParameter>]
- description: Array of actions that define the scenario's orchestration. Required.
  name: actions
  types:
  - <xref:list>[<xref:azure.mgmt.chaos.models.ScenarioAction>]
- description: The recommendation information for this scenario.
  name: recommendation
  types:
  - <xref:azure.mgmt.chaos.models.Recommendation>
