### YamlMime:PythonClass
uid: azure.mgmt.chaos.models.ResourceTargetingCriteria
name: ResourceTargetingCriteria
fullName: azure.mgmt.chaos.models.ResourceTargetingCriteria
module: azure.mgmt.chaos.models
summary: "Model that represents a set of targeting criteria for resource selection.\n\
  Used on both the include and exclude sides of ResourceTargeting.\n\nAll dimensions\
  \ use unified null/empty semantics:\n\n* Null or omitted means \"no constraint\"\
  \ (this dimension is inactive). \n\n* Empty array is treated the same as null (no\
  \ constraint). \n\n* Non-empty array means the dimension is active."
constructor:
  syntax: 'ResourceTargetingCriteria(*args: Any, **kwargs: Any)'
variables:
- description: 'Array of Azure location strings (e.g., "eastus", "westeurope", "global").

    Case-insensitive, normalized form only (e.g., "eastus" not "East US").'
  name: locations
  types:
  - <xref:list>[<xref:str>]
- description: "Array of logical availability zone identifiers (e.g., \"1\", \"2\"\
    , \"3\",\n\"zone-redundant\").\n\nMutually exclusive with `physicalZones` \u2014\
    \ set one or the other, not both.\nWhen set, `locations` must also be set on the\
    \ same side (zone IDs are only meaningful within\na region)."
  name: zones
  types:
  - <xref:list>[<xref:str>]
- description: "Array of physical datacenter zone identifiers in `{region}-az{N}`\n\
    format\n(e.g., \"westus2-az1\"). Resolved to logical zones per-subscription at\
    \ execution time.\n\nMutually exclusive with `zones` \u2014 set one or the other,\
    \ not both."
  name: physical_zones
  types:
  - <xref:list>[<xref:str>]
- description: 'Array of Azure resource type strings (e.g., "Microsoft.Compute/virtualMachines").

    Case-insensitive equality. Supports trailing wildcard (e.g., "Microsoft.Compute/>>*<<").'
  name: types
  types:
  - <xref:list>[<xref:str>]
- description: 'Array of tag key-value pairs for filtering by Azure resource tags.
    Key and value

    are matched case-insensitively. Use "*" as value to match any value for a key.'
  name: tags
  types:
  - <xref:list>[<xref:azure.mgmt.chaos.models.KeyValuePair>]
- description: Array of fully qualified Azure resource IDs. Case-insensitive equality.
  name: resources
  types:
  - <xref:list>[<xref:str>]
