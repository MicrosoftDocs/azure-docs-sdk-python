  signature: 'physical_zones: list[str] | None'
- uid: azure.mgmt.chaos.models.ResourceTargetingCriteria.resources
  name: resources
  summary: Array of fully qualified Azure resource IDs. Case-insensitive equality.
  signature: 'resources: list[str] | None'
