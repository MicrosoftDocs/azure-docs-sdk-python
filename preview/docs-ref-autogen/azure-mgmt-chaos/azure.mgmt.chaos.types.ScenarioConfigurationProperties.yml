### YamlMime:PythonClass
uid: azure.mgmt.chaos.types.ScenarioConfigurationProperties
name: ScenarioConfigurationProperties
fullName: azure.mgmt.chaos.types.ScenarioConfigurationProperties
module: azure.mgmt.chaos.types
summary: Model that represents the properties of the scenario configuration.
constructor:
  syntax: ScenarioConfigurationProperties()
variables:
- description: Resource ID of the scenario this configuration applies to. Required.
  name: scenario_id
  types:
  - <xref:str>
- description: 'Runtime parameter values for the scenario. Keys must match parameter
    names

    defined in the scenario.'
  name: parameters
  types:
  - <xref:list>[<xref:"KeyValuePair">]
- description: 'Most recent provisioning state for the given scenario resource. Known

    values are: "Succeeded", "Failed", "Canceled", "Creating", "Updating", "Deleting",
    and

    "Running".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: "Unified resource targeting policy that controls which discovered\n\
    resources participate\nin fault injection. Replaces the separate `exclusions`\
    \ and `filters` properties with\nsymmetric include/exclude criteria.\n\nInclude\
    \ uses AND logic \u2014 a resource must match ALL active include dimensions.\n\
    Exclude uses OR logic \u2014 a resource is removed if it matches ANY exclude dimension.\n\
    When include and exclude conflict on the same resource, exclude wins.\n\nNull\
    \ or omitted means all discovered resources participate (no targeting constraints)."
  name: resource_targeting
  types:
  - <xref:<xref:"ResourceTargeting">>
attributes:
- uid: azure.mgmt.chaos.types.ScenarioConfigurationProperties.parameters
  name: parameters
  summary: 'Runtime parameter values for the scenario. Keys must match parameter names
    defined in the

    scenario.'
  signature: 'parameters: list[''KeyValuePair'']'
- uid: azure.mgmt.chaos.types.ScenarioConfigurationProperties.provisioningState
  name: provisioningState
  summary: 'Most recent provisioning state for the given scenario resource. Known
    values are:

    "Succeeded", "Failed", "Canceled", "Creating", "Updating", "Deleting", and

    "Running".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.chaos.types.ScenarioConfigurationProperties.resourceTargeting
  name: resourceTargeting
  summary: "Unified resource targeting policy that controls which discovered resources\
    \ participate\nin fault injection. Replaces the separate `exclusions` and `filters`\
    \ properties with\nsymmetric include/exclude criteria.\n\nInclude uses AND logic\
    \ \u2014 a resource must match ALL active include dimensions.\nExclude uses OR\
    \ logic \u2014 a resource is removed if it matches ANY exclude dimension.\nWhen\
    \ include and exclude conflict on the same resource, exclude wins.\n\nNull or\
    \ omitted means all discovered resources participate (no targeting constraints)."
  signature: 'resourceTargeting: ResourceTargeting'
- uid: azure.mgmt.chaos.types.ScenarioConfigurationProperties.scenarioId
  name: scenarioId
  summary: Resource ID of the scenario this configuration applies to. Required.
  signature: 'scenarioId: Required[str]'
