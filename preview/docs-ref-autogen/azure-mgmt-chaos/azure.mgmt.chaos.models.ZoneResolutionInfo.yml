### YamlMime:PythonClass
uid: azure.mgmt.chaos.models.ZoneResolutionInfo
name: ZoneResolutionInfo
fullName: azure.mgmt.chaos.models.ZoneResolutionInfo
module: azure.mgmt.chaos.models
summary: 'Information about how physical zones were resolved to logical zones for
  each subscription

  during scenario execution.'
constructor:
  syntax: 'ZoneResolutionInfo(*args: Any, **kwargs: Any)'
variables:
- description: "The zone targeting mode used for this run. `logical` \u2014 customer\
    \ specified logical\nzone identifiers directly. `physical` \u2014 customer specified\
    \ physical zone identifiers; the\nsystem resolved them to per-subscription logical\
    \ zones at execution time. Required. Known\nvalues are: \"logical\" and \"physical\"\
    ."
  name: mode
  types:
  - <xref:str>
  - <xref:azure.mgmt.chaos.models.ZoneResolutionMode>
- description: 'The physical zone identifiers requested by the customer in the

    scenario configuration (e.g., `["westus2-az1"]`). Empty array when `mode` is `logical`.

    Required.'
  name: requested_physical_zones
  types:
  - <xref:list>[<xref:str>]
- description: 'Per-subscription zone resolution results. Each entry maps a

    subscription to the logical zone resolved from the requested physical zone. Empty
    when `mode`

    is `logical`. Required.'
  name: subscription_zone_mappings
  types:
  - <xref:list>[<xref:azure.mgmt.chaos.models.ZoneResolutionMapping>]
attributes:
- uid: azure.mgmt.chaos.models.ZoneResolutionInfo.mode
  name: mode
  summary: "The zone targeting mode used for this run. `logical` \u2014 customer specified\
    \ logical zone\nidentifiers directly. `physical` \u2014 customer specified physical\
    \ zone identifiers; the system\nresolved them to per-subscription logical zones\
    \ at execution time. Required. Known values are:\n\"logical\" and \"physical\"\
    ."
  signature: 'mode: str | _models.ZoneResolutionMode'
- uid: azure.mgmt.chaos.models.ZoneResolutionInfo.requested_physical_zones
  name: requested_physical_zones
  summary: 'The physical zone identifiers requested by the customer in the scenario
    configuration (e.g.,

    `["westus2-az1"]`). Empty array when `mode` is `logical`. Required.'
  signature: 'requested_physical_zones: list[str]'
- uid: azure.mgmt.chaos.models.ZoneResolutionInfo.subscription_zone_mappings
  name: subscription_zone_mappings
  summary: 'Per-subscription zone resolution results. Each entry maps a subscription
    to the logical zone

    resolved from the requested physical zone. Empty when `mode` is `logical`. Required.'
  signature: 'subscription_zone_mappings: list[''_models.ZoneResolutionMapping'']'
