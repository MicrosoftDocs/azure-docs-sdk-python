### YamlMime:PythonClass
uid: azure.mgmt.chaos.types.ScenarioProperties
name: ScenarioProperties
fullName: azure.mgmt.chaos.types.ScenarioProperties
module: azure.mgmt.chaos.types
summary: Model that represents the properties of the scenario.
constructor:
  syntax: ScenarioProperties()
variables:
- description: 'Most recent provisioning state for the given scenario resource. Known

    values are: "Succeeded", "Failed", "Canceled", "Creating", "Updating", "Deleting",
    and

    "Running".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Resource ID of the template version this scenario was created from

    (optional).'
  name: created_from
  types:
  - <xref:str>
- description: Version of the scenario.
  name: version
  types:
  - <xref:str>
- description: Description of what this scenario does (optional).
  name: description
  types:
  - <xref:str>
- description: Parameter definitions for the scenario. Required.
  name: parameters
  types:
  - <xref:list>[<xref:"ScenarioParameter">]
- description: Array of actions that define the scenario's orchestration. Required.
  name: actions
  types:
  - <xref:list>[<xref:"ScenarioAction">]
- description: The recommendation information for this scenario.
  name: recommendation
  types:
  - <xref:<xref:"Recommendation">>
attributes:
- uid: azure.mgmt.chaos.types.ScenarioProperties.actions
  name: actions
  summary: Array of actions that define the scenario's orchestration. Required.
  signature: 'actions: Required[list[''ScenarioAction'']]'
- uid: azure.mgmt.chaos.types.ScenarioProperties.createdFrom
  name: createdFrom
  summary: Resource ID of the template version this scenario was created from (optional).
  signature: 'createdFrom: str'
- uid: azure.mgmt.chaos.types.ScenarioProperties.description
  name: description
  summary: Description of what this scenario does (optional).
  signature: 'description: str'
- uid: azure.mgmt.chaos.types.ScenarioProperties.parameters
  name: parameters
  summary: Parameter definitions for the scenario. Required.
  signature: 'parameters: Required[list[''ScenarioParameter'']]'
- uid: azure.mgmt.chaos.types.ScenarioProperties.provisioningState
  name: provisioningState
  summary: 'Most recent provisioning state for the given scenario resource. Known
    values are:

    "Succeeded", "Failed", "Canceled", "Creating", "Updating", "Deleting", and

    "Running".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.chaos.types.ScenarioProperties.recommendation
  name: recommendation
  summary: The recommendation information for this scenario.
  signature: 'recommendation: Recommendation'
- uid: azure.mgmt.chaos.types.ScenarioProperties.version
  name: version
  summary: Version of the scenario.
  signature: 'version: str'
