uid: azure.mgmt.chaos.types.Connection
name: Connection
fullName: azure.mgmt.chaos.types.Connection
module: azure.mgmt.chaos.types
summary: 'Model that represents a connection between a workspace and a target resource.
  A connection

  provisions and tracks the trust relationship that authorizes the actor to reach
  the Chaos

  Studio data plane for the workspace and target during fault injection.'
constructor:
  syntax: Connection()
variables:
- description: 'Fully qualified resource ID for the resource. Ex -

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}.'
  name: id
  types:
  - <xref:str>
- description: The name of the resource.
  name: name
  types:
  - <xref:str>
- description: 'The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
    or

    "Microsoft.Storage/storageAccounts".'
  name: type
  types:
  - <xref:str>
- description: 'Azure Resource Manager metadata containing createdBy and modifiedBy

    information.'
  name: system_data
  types:
  - <xref:<xref:"SystemData">>
- description: The properties of the connection.
  name: properties
  types:
  - <xref:<xref:"ConnectionProperties">>
attributes:
- uid: azure.mgmt.chaos.types.Connection.properties
