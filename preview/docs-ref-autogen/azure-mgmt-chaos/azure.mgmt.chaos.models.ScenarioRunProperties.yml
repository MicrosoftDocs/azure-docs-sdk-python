### YamlMime:PythonClass
uid: azure.mgmt.chaos.models.ScenarioRunProperties
name: ScenarioRunProperties
fullName: azure.mgmt.chaos.models.ScenarioRunProperties
module: azure.mgmt.chaos.models
summary: Model that represents the properties of the scenario run.
constructor:
  syntax: 'ScenarioRunProperties(*args: Any, **kwargs: Any)'
variables:
- description: The workspace name. Required.
  name: workspace_name
  types:
  - <xref:str>
- description: The scenario name. Required.
  name: scenario_name
  types:
  - <xref:str>
- description: The scenario configuration name. Required.
  name: scenario_configuration_name
  types:
  - <xref:str>
- description: 'The principal id for the managed identity used for the

    run. Required.'
  name: managed_identity_principal_id
  types:
  - <xref:str>
- description: 'The resource snapshot ID this run is pinned to. Resolved from the

    scenario''s pinned evaluation snapshot (template scenarios) or the latest discovery
    snapshot

    (custom scenarios) at run creation, ensuring the run executes against the same
    set of

    discovered resources that produced the recommendation.'
  name: resource_snapshot_id
  types:
  - <xref:str>
- description: 'The scenario run status. Required. Known values are: "Queued", "Resolving",

    "Generating", "Validating", "ValidationSucceeded", "Starting", "Preparing", "Running",

    "CleaningUp", "Canceling", "Canceled", "Succeeded", and "Failed".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.mgmt.chaos.models.ScenarioRunState>
- description: All resources discovered for the scenario run. Required.
  name: resources
  types:
  - <xref:list>[<xref:azure.mgmt.chaos.models.ScenarioRunResource>]
- description: 'Resources that matched the scenario''s target resource types but were

    excluded from fault injection by the configuration''s resource-targeting filters
    (for example

    zone, location, or explicit exclusions). These resources will not be impacted
    by the run.'
  name: excluded_resources
  types:
  - <xref:list>[<xref:azure.mgmt.chaos.models.ScenarioRunResource>]
- description: System or infrastructure errors encountered during the scenario run.
  name: errors
  types:
  - <xref:list>[<xref:azure.mgmt.chaos.models.OperationError>]
- description: "Business errors from fault injection \u2014 permission and resource\
    \ state\nissues."
  name: execution_errors
  types:
  - <xref:azure.mgmt.chaos.models.ScenarioErrors>
- description: The scenario run json.
  name: scenario_run_json
  types:
  - <xref:str>
- description: The scenario run summary.
  name: scenario_run_summary
  types:
  - <xref:list>[<xref:azure.mgmt.chaos.models.ScenarioRunSummaryAction>]
- description: When the scenario run was started. Required.
  name: start_time
  types:
  - <xref:datetime.datetime>
- description: When the scenario run was completed.
  name: end_time
  types:
  - <xref:datetime.datetime>
- description: 'Zone resolution information. Present when the scenario configuration

    used physical zone targeting (`physicalZones`). Contains the mode, requested physical
    zones,

    and per-subscription logical zone mappings.'
  name: zone_resolution
  types:
  - <xref:azure.mgmt.chaos.models.ZoneResolutionInfo>
attributes:
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.end_time
  name: end_time
  summary: When the scenario run was completed.
  signature: 'end_time: datetime | None'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.errors
  name: errors
  summary: System or infrastructure errors encountered during the scenario run.
  signature: 'errors: list[''_models.OperationError''] | None'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.excluded_resources
  name: excluded_resources
  summary: 'Resources that matched the scenario''s target resource types but were
    excluded from fault

    injection by the configuration''s resource-targeting filters (for example zone,
    location, or

    explicit exclusions). These resources will not be impacted by the run.'
  signature: 'excluded_resources: list[''_models.ScenarioRunResource''] | None'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.execution_errors
  name: execution_errors
  summary: "Business errors from fault injection \u2014 permission and resource state\
    \ issues."
  signature: 'execution_errors: _models.ScenarioErrors | None'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.managed_identity_principal_id
  name: managed_identity_principal_id
  summary: The principal id for the managed identity used for the run. Required.
  signature: 'managed_identity_principal_id: str'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.resource_snapshot_id
  name: resource_snapshot_id
  summary: 'The resource snapshot ID this run is pinned to. Resolved from the scenario''s
    pinned evaluation

    snapshot (template scenarios) or the latest discovery snapshot (custom scenarios)
    at run

    creation, ensuring the run executes against the same set of discovered resources
    that produced

    the recommendation.'
  signature: 'resource_snapshot_id: str | None'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.resources
  name: resources
  summary: All resources discovered for the scenario run. Required.
  signature: 'resources: list[''_models.ScenarioRunResource'']'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.scenario_configuration_name
  name: scenario_configuration_name
  summary: The scenario configuration name. Required.
  signature: 'scenario_configuration_name: str'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.scenario_name
  name: scenario_name
  summary: The scenario name. Required.
  signature: 'scenario_name: str'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.scenario_run_json
  name: scenario_run_json
  summary: The scenario run json.
  signature: 'scenario_run_json: str | None'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.scenario_run_summary
  name: scenario_run_summary
  summary: The scenario run summary.
  signature: 'scenario_run_summary: list[''_models.ScenarioRunSummaryAction''] | None'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.start_time
  name: start_time
  summary: When the scenario run was started. Required.
  signature: 'start_time: datetime'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.status
  name: status
  summary: '"Queued", "Resolving", "Generating",

    "Validating", "ValidationSucceeded", "Starting", "Preparing", "Running",

    "CleaningUp", "Canceling", "Canceled", "Succeeded", and "Failed".'
  signature: 'status: str | _models.ScenarioRunState'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.workspace_name
  name: workspace_name
  summary: The workspace name. Required.
  signature: 'workspace_name: str'
- uid: azure.mgmt.chaos.models.ScenarioRunProperties.zone_resolution
  name: zone_resolution
  summary: 'Zone resolution information. Present when the scenario configuration used
    physical zone

    targeting (`physicalZones`). Contains the mode, requested physical zones, and

    per-subscription logical zone mappings.'
  signature: 'zone_resolution: _models.ZoneResolutionInfo | None'
