### YamlMime:PythonClass
uid: azure.mgmt.chaos.types.Recommendation
name: Recommendation
fullName: azure.mgmt.chaos.types.Recommendation
module: azure.mgmt.chaos.types
summary: Model that represents a scenario recommendation.
constructor:
  syntax: Recommendation()
variables:
- description: 'The recommendation status. Required. Known values are:

    "NotEvaluated", "Recommended", "NotApplicable", "Evaluating", "EvaluationFailed",
    and

    "EvaluationCancelled".'
  name: recommendation_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecommendationStatus">]
- description: The UTC time when the recommendation was evaluated.
  name: evaluation_run_at
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.chaos.types.Recommendation.evaluationRunAt
  name: evaluationRunAt
  summary: The UTC time when the recommendation was evaluated.
  signature: 'evaluationRunAt: str'
- uid: azure.mgmt.chaos.types.Recommendation.recommendationStatus
  name: recommendationStatus
  summary: '"NotEvaluated", "Recommended",

    "NotApplicable", "Evaluating", "EvaluationFailed", and "EvaluationCancelled".'
  signature: 'recommendationStatus: Required[str | RecommendationStatus]'
