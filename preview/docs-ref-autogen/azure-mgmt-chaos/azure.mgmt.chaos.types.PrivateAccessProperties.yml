uid: azure.mgmt.chaos.types.PrivateAccessProperties
name: PrivateAccessProperties
fullName: azure.mgmt.chaos.types.PrivateAccessProperties
module: azure.mgmt.chaos.types
summary: The properties of a private access resource.
constructor:
  syntax: PrivateAccessProperties()
variables:
- description: 'Most recent provisioning state for the given privateAccess resource.

    Known values are: "Succeeded", "Failed", "Canceled", "Creating", "Updating", "Deleting",
    and

    "Running".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'A readonly collection of private endpoint connection.

    Currently only one endpoint connection is supported.'
  name: private_endpoint_connections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: 'Public Network Access Control for PrivateAccess resource. Known

    values are: "Enabled" and "Disabled".'
  name: public_network_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccessOption">]
