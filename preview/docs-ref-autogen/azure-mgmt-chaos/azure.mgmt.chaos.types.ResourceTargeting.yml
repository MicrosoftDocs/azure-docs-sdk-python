### YamlMime:PythonClass
uid: azure.mgmt.chaos.types.ResourceTargeting
name: ResourceTargeting
fullName: azure.mgmt.chaos.types.ResourceTargeting
module: azure.mgmt.chaos.types
summary: 'Model that represents unified resource targeting with symmetric include/exclude
  criteria. Both

  sides support the same set of dimensions.'
constructor:
  syntax: ResourceTargeting()
variables:
- description: 'Inclusion criteria. Resources must match ALL active dimensions to
    be candidates.

    Null or omitted means no inclusion filtering (all resources are candidates).'
  name: include
  types:
  - <xref:<xref:"ResourceTargetingCriteria">>
- description: 'Exclusion criteria. Resources matching ANY active dimension are removed.
    Null or

    omitted means no exclusions applied.'
  name: exclude
  types:
  - <xref:<xref:"ResourceTargetingCriteria">>
attributes:
- uid: azure.mgmt.chaos.types.ResourceTargeting.exclude
  name: exclude
  summary: 'Exclusion criteria. Resources matching ANY active dimension are removed.
    Null or omitted means

    no exclusions applied.'
  signature: 'exclude: ResourceTargetingCriteria'
- uid: azure.mgmt.chaos.types.ResourceTargeting.include
  name: include
  summary: 'Inclusion criteria. Resources must match ALL active dimensions to be candidates.
    Null or

    omitted means no inclusion filtering (all resources are candidates).'
  signature: 'include: ResourceTargetingCriteria'
