- uid: azure.mgmt.chaos.aio.operations.ScenarioRunsOperations.get
  name: get
  summary: 'Get a scenario run.


    This endpoint is also the polling target for ScenarioConfigurations.execute

    and ScenarioRuns.cancel (final-state-via: location). While the run is in

    progress the service returns 202 with a Location header pointing back to

    this URL; clients must keep polling until they receive 200, which carries

    the final ScenarioRun body.'
  signature: 'async get(resource_group_name: str, workspace_name: str, scenario_name:
    str, run_id: str, **kwargs: Any) -> ScenarioRun'
  parameters:
  - name: resource_group_name
    description: 'The name of the resource group. The name is case insensitive.

      Required.'
    isRequired: true
    types:
    - <xref:str>
  - name: workspace_name
    description: String that represents a Workspace resource name. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: scenario_name
    description: Name of the scenario. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: run_id
    description: The name of the ScenarioRun. Required.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: ScenarioRun. The ScenarioRun is compatible with MutableMapping
    types:
    - <xref:azure.mgmt.chaos.models.ScenarioRun>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
