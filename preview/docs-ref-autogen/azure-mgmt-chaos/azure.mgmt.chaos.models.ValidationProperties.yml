### YamlMime:PythonClass
uid: azure.mgmt.chaos.models.ValidationProperties
name: ValidationProperties
fullName: azure.mgmt.chaos.models.ValidationProperties
module: azure.mgmt.chaos.models
summary: Model that represents the properties of the scenario validation.
constructor:
  syntax: 'ValidationProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The scenario validation status. Required. Known values are: "Resolving",

    "Generating", "Validating", "Accepted", "NotStarted", "RequiresAttention",

    "NoResolvedResources", and "Succeeded".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.mgmt.chaos.models.ScenarioValidationState>
- description: The scenario validation UTC start time. Required.
  name: start_time
  types:
  - <xref:datetime.datetime>
- description: 'Execution plan created from validation. This plan will be executed

    as-is on next scenario execution.'
  name: execution_plan_json
  types:
  - <xref:str>
- description: The scenario validation UTC end time.
  name: end_time
  types:
  - <xref:datetime.datetime>
- description: 'Resources that matched the scenario''s target resource types and will
    be

    impacted by the run, resolved after applying the configuration''s resource-targeting
    filters.'
  name: resources
  types:
  - <xref:list>[<xref:azure.mgmt.chaos.models.ScenarioRunResource>]
- description: 'Resources that matched the scenario''s target resource types but were

    excluded from fault injection by the configuration''s resource-targeting filters
    (for example

    zone, location, or explicit exclusions). These resources will not be impacted.'
  name: excluded_resources
  types:
  - <xref:list>[<xref:azure.mgmt.chaos.models.ScenarioRunResource>]
- description: System or infrastructure errors encountered during validation.
  name: errors
  types:
  - <xref:list>[<xref:azure.mgmt.chaos.models.OperationError>]
- description: "Business errors from validation \u2014 permission and resource state\n\
    issues."
  name: validation_errors
  types:
  - <xref:azure.mgmt.chaos.models.ScenarioErrors>
attributes:
- uid: azure.mgmt.chaos.models.ValidationProperties.end_time
  name: end_time
  summary: The scenario validation UTC end time.
  signature: 'end_time: datetime | None'
- uid: azure.mgmt.chaos.models.ValidationProperties.errors
  name: errors
  summary: System or infrastructure errors encountered during validation.
  signature: 'errors: list[''_models.OperationError''] | None'
- uid: azure.mgmt.chaos.models.ValidationProperties.excluded_resources
  name: excluded_resources
  summary: 'Resources that matched the scenario''s target resource types but were
    excluded from fault

    injection by the configuration''s resource-targeting filters (for example zone,
    location, or

    explicit exclusions). These resources will not be impacted.'
  signature: 'excluded_resources: list[''_models.ScenarioRunResource''] | None'
- uid: azure.mgmt.chaos.models.ValidationProperties.execution_plan_json
  name: execution_plan_json
  summary: 'Execution plan created from validation. This plan will be executed as-is
    on next scenario

    execution.'
  signature: 'execution_plan_json: str | None'
- uid: azure.mgmt.chaos.models.ValidationProperties.resources
  name: resources
  summary: 'Resources that matched the scenario''s target resource types and will
    be impacted by the run,

    resolved after applying the configuration''s resource-targeting filters.'
  signature: 'resources: list[''_models.ScenarioRunResource''] | None'
- uid: azure.mgmt.chaos.models.ValidationProperties.start_time
  name: start_time
  summary: The scenario validation UTC start time. Required.
  signature: 'start_time: datetime'
- uid: azure.mgmt.chaos.models.ValidationProperties.status
  name: status
  summary: '"Resolving", "Generating",

    "Validating", "Accepted", "NotStarted", "RequiresAttention", "NoResolvedResources",

    and "Succeeded".'
  signature: 'status: str | _models.ScenarioValidationState'
- uid: azure.mgmt.chaos.models.ValidationProperties.validation_errors
  name: validation_errors
  summary: "Business errors from validation \u2014 permission and resource state issues."
  signature: 'validation_errors: _models.ScenarioErrors | None'
