### YamlMime:PythonClass
uid: azure.mgmt.chaos.types.ExperimentProperties
name: ExperimentProperties
fullName: azure.mgmt.chaos.types.ExperimentProperties
module: azure.mgmt.chaos.types
summary: Model that represents the Experiment properties model.
constructor:
  syntax: ExperimentProperties()
variables:
- description: 'Most recent provisioning state for the given experiment resource.

    Known values are: "Succeeded", "Failed", "Canceled", "Creating", "Updating", "Deleting",
    and

    "Running".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: List of steps. Required.
  name: steps
  types:
  - <xref:list>[<xref:"ChaosExperimentStep">]
- description: List of selectors. Required.
  name: selectors
  types:
  - <xref:list>[<xref:"ChaosTargetSelector">]
- description: 'Optional customer-managed Storage account where Experiment schema

    will be stored.'
  name: customer_data_storage
  types:
  - <xref:<xref:"CustomerDataStorageProperties">>
attributes:
- uid: azure.mgmt.chaos.types.ExperimentProperties.customerDataStorage
  name: customerDataStorage
  summary: Optional customer-managed Storage account where Experiment schema will
    be stored.
  signature: 'customerDataStorage: CustomerDataStorageProperties'
- uid: azure.mgmt.chaos.types.ExperimentProperties.provisioningState
  name: provisioningState
  summary: 'Most recent provisioning state for the given experiment resource. Known
    values are:

    "Succeeded", "Failed", "Canceled", "Creating", "Updating", "Deleting", and

    "Running".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.chaos.types.ExperimentProperties.selectors
  name: selectors
  summary: List of selectors. Required.
  signature: 'selectors: Required[list[''ChaosTargetSelector'']]'
- uid: azure.mgmt.chaos.types.ExperimentProperties.steps
  name: steps
  summary: List of steps. Required.
  signature: 'steps: Required[list[''ChaosExperimentStep'']]'
