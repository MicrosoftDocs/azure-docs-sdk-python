uid: azure.mgmt.chaos.types.ScenarioAction
name: ScenarioAction
fullName: azure.mgmt.chaos.types.ScenarioAction
module: azure.mgmt.chaos.types
summary: Model that represents a scenario action.
constructor:
  syntax: ScenarioAction()
variables:
- description: Unique name for the action. Required.
  name: name
  types:
  - <xref:str>
- description: 'Identifier of the action and version (e.g., "microsoft-compute-shutdown/1.0").

    Required.'
  name: action_id
  types:
  - <xref:str>
- description: Human-readable description of what this action does.
  name: description
  types:
  - <xref:str>
- description: 'ISO 8601 duration for how long the action runs (e.g., PT30M for 30
    minutes).

    Supports template macro syntax (%%{parameters.<name>}%%). Required.'
  name: duration
  types:
  - <xref:str>
- description: Action-specific parameter values.
  name: parameters
  types:
  - <xref:list>[<xref:"KeyValuePair">]
- description: Action dependencies that control when this action starts.
  name: run_after
  types:
  - <xref:<xref:"RunAfter">>
- description: 'ISO 8601 duration to wait before action starts (e.g., PT30S for 30
    seconds).

    Supports template macro syntax.'
  name: wait_before
  types:
  - <xref:str>
- description: 'ISO 8601 duration for maximum action execution time. Supports template
    macro

    syntax.'
  name: timeout
  types:
  - <xref:str>
- description: External resource reference for the action.
  name: external_resource
  types:
  - <xref:<xref:"ExternalResource">>
