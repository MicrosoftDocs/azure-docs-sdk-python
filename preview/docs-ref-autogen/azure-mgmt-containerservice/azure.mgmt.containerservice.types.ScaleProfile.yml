uid: azure.mgmt.containerservice.types.ScaleProfile
name: ScaleProfile
fullName: azure.mgmt.containerservice.types.ScaleProfile
module: azure.mgmt.containerservice.types
summary: Specifications on how to scale a VirtualMachines agent pool.
constructor:
  syntax: ScaleProfile()
variables:
- description: Specifications on how to scale the VirtualMachines agent pool to a
    fixed size.
  name: manual
  types:
  - <xref:list>[<xref:"ManualScaleProfile">]
- description: 'Specifications on how to auto-scale the VirtualMachines agent pool
    within a

    predefined size range. Each profile targets a specific VM SKU and is evaluated
    independently.

    Scaling decisions across profiles are governed by the cluster autoscaler expander,
    configurable

    via `ManagedCluster.properties.autoScalerProfile.expander`.'
  name: autoscale
  types:
  - <xref:list>[<xref:"AutoScaleProfile">]
attributes:
- uid: azure.mgmt.containerservice.types.ScaleProfile.autoscale
  name: autoscale
  summary: 'Specifications on how to auto-scale the VirtualMachines agent pool within
    a predefined size

    range. Each profile targets a specific VM SKU and is evaluated independently.
    Scaling decisions

    across profiles are governed by the cluster autoscaler expander, configurable
    via

    `ManagedCluster.properties.autoScalerProfile.expander`.'
  signature: 'autoscale: list[azure.mgmt.containerservice.types.AutoScaleProfile]'
- uid: azure.mgmt.containerservice.types.ScaleProfile.manual
  name: manual
  summary: Specifications on how to scale the VirtualMachines agent pool to a fixed
    size.
  signature: 'manual: list[azure.mgmt.containerservice.types.ManualScaleProfile]'
