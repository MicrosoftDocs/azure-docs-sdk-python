### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfileKubeProxyConfigIpvsConfig
name: ContainerServiceNetworkProfileKubeProxyConfigIpvsConfig
fullName: azure.mgmt.containerservice.types.ContainerServiceNetworkProfileKubeProxyConfigIpvsConfig
module: azure.mgmt.containerservice.types
summary: Holds configuration customizations for IPVS. May only be specified if 'mode'
  is set to 'IPVS'.
constructor:
  syntax: ContainerServiceNetworkProfileKubeProxyConfigIpvsConfig()
variables:
- description: 'IPVS scheduler, for more information please see

    [http://www.linuxvirtualserver.org/docs/scheduling.html](http://www.linuxvirtualserver.org/docs/scheduling.html).
    Known values are: "RoundRobin" and

    "LeastConnection".'
  name: scheduler
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IpvsScheduler">]
- description: 'The timeout value used for idle IPVS TCP sessions in seconds. Must

    be a positive integer value.'
  name: tcp_timeout_seconds
  types:
  - <xref:int>
- description: 'The timeout value used for IPVS TCP sessions after receiving a

    FIN in seconds. Must be a positive integer value.'
  name: tcp_fin_timeout_seconds
  types:
  - <xref:int>
- description: 'The timeout value used for IPVS UDP packets in seconds. Must be a

    positive integer value.'
  name: udp_timeout_seconds
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfileKubeProxyConfigIpvsConfig.scheduler
  name: scheduler
  summary: 'IPVS scheduler, for more information please see

    [http://www.linuxvirtualserver.org/docs/scheduling.html](http://www.linuxvirtualserver.org/docs/scheduling.html).
    Known values are: "RoundRobin"

    and "LeastConnection".'
  signature: 'scheduler: str | IpvsScheduler'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfileKubeProxyConfigIpvsConfig.tcpFinTimeoutSeconds
  name: tcpFinTimeoutSeconds
  summary: 'The timeout value used for IPVS TCP sessions after receiving a FIN in
    seconds. Must be a

    positive integer value.'
  signature: 'tcpFinTimeoutSeconds: int'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfileKubeProxyConfigIpvsConfig.tcpTimeoutSeconds
  name: tcpTimeoutSeconds
  summary: The timeout value used for idle IPVS TCP sessions in seconds. Must be a
    positive integer value.
  signature: 'tcpTimeoutSeconds: int'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfileKubeProxyConfigIpvsConfig.udpTimeoutSeconds
  name: udpTimeoutSeconds
  summary: The timeout value used for IPVS UDP packets in seconds. Must be a positive
    integer value.
  signature: 'udpTimeoutSeconds: int'
