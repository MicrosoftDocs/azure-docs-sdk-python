### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.BastionProfile
name: BastionProfile
fullName: azure.mgmt.containerservice.types.BastionProfile
module: azure.mgmt.containerservice.types
summary: 'Profile to enable managed Azure Bastion or reference to an existing Bastion
  for the managed

  cluster. See [https://aka.ms/aks/BastionConnect](https://aka.ms/aks/BastionConnect)
  for more

  details.'
constructor:
  syntax: BastionProfile()
variables:
- description: Indicates whether managed bastion is enabled.
  name: enabled
  types:
  - <xref:bool>
- description: The resource ID of the managed bastion associated with the managed
    cluster.
  name: bastion_id
  types:
  - <xref:str>
- description: 'The SKU of the managed bastion.


    Only Standard and Premium SKUs are supported.

    SKU downgrading is not allowed. To downgrade SKU, please disable then re-enable
    the managed

    bastion with new SKU.


    See [https://aka.ms/aks/BastionSKUs](https://aka.ms/aks/BastionSKUs) for more
    details. Known

    values are: "Standard" and "Premium".'
  name: sku
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BastionSku">]
- description: The scale units of the managed bastion. Default value is 2.
  name: scale_units
  types:
  - <xref:int>
- description: 'The resource ID of the public IP address associated with the

    managed bastion.


    When provided during creation, the managed bastion will reference this existing
    public IP

    address instead of creating a new one.

    The referenced public IP address must be in the same subscription and region as
    the managed

    cluster.


    When not provided during creation, AKS will automatically create a new public
    IP address.


    This field cannot be updated. To change IP address after creation, please disable
    and re-enable

    the managed bastion with the new public IP address.'
  name: public_ip_address_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerservice.types.BastionProfile.bastionId
  name: bastionId
  summary: The resource ID of the managed bastion associated with the managed cluster.
  signature: 'bastionId: str'
- uid: azure.mgmt.containerservice.types.BastionProfile.enabled
  name: enabled
  summary: Indicates whether managed bastion is enabled.
  signature: 'enabled: bool'
- uid: azure.mgmt.containerservice.types.BastionProfile.publicIpAddressId
  name: publicIpAddressId
  summary: 'The resource ID of the public IP address associated with the managed bastion.


    When provided during creation, the managed bastion will reference this existing
    public IP

    address instead of creating a new one.

    The referenced public IP address must be in the same subscription and region as
    the managed

    cluster.


    When not provided during creation, AKS will automatically create a new public
    IP address.


    This field cannot be updated. To change IP address after creation, please disable
    and re-enable

    the managed bastion with the new public IP address.'
  signature: 'publicIpAddressId: str'
- uid: azure.mgmt.containerservice.types.BastionProfile.scaleUnits
  name: scaleUnits
  summary: The scale units of the managed bastion. Default value is 2.
  signature: 'scaleUnits: int'
- uid: azure.mgmt.containerservice.types.BastionProfile.sku
  name: sku
  summary: 'The SKU of the managed bastion.


    Only Standard and Premium SKUs are supported.

    SKU downgrading is not allowed. To downgrade SKU, please disable then re-enable
    the managed

    bastion with new SKU.


    See [https://aka.ms/aks/BastionSKUs](https://aka.ms/aks/BastionSKUs) for more
    details. Known

    values are: "Standard" and "Premium".'
  signature: 'sku: str | BastionSku'
