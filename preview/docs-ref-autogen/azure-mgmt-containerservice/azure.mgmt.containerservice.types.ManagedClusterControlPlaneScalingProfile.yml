### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterControlPlaneScalingProfile
name: ManagedClusterControlPlaneScalingProfile
fullName: azure.mgmt.containerservice.types.ManagedClusterControlPlaneScalingProfile
module: azure.mgmt.containerservice.types
summary: 'Profile for providing scaled and performance guaranteed control plane capacity
  to deliver

  consistent performance under high workload. Requires Kubernetes version 1.33.0 or
  later.'
constructor:
  syntax: ManagedClusterControlPlaneScalingProfile()
variables:
- description: 'The scaling size of the control plane. Scaling sizes offer guaranteed

    capacity and predictable Kubernetes performance beyond standard tier defaults.
    Higher H sizes

    provide increased performance guarantees. See [https://aka.ms/aks/hyperscale](https://aka.ms/aks/hyperscale)
    for performance metrics details for each size. Required.

    Known values are: "H2", "H4", and "H8".'
  name: scaling_size
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ControlPlaneScalingSize">]
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterControlPlaneScalingProfile.scalingSize
  name: scalingSize
  summary: 'The scaling size of the control plane. Scaling sizes offer guaranteed
    capacity and predictable

    Kubernetes performance beyond standard tier defaults. Higher H sizes provide increased

    performance guarantees. See [https://aka.ms/aks/hyperscale](https://aka.ms/aks/hyperscale)

    for performance metrics details for each size. Required. Known values are: "H2",
    "H4", and

    "H8".'
  signature: 'scalingSize: Required[str | ControlPlaneScalingSize]'
