    for 16GiB, and 1024Mi (1Gi) for >=32GiB. Must also be greater than the effective

    hardEvictionThreshold.memoryAvailable.'
  signature: 'memory_available: str | None'
- uid: azure.mgmt.containerservice.models.SoftEvictionThreshold.node_fs_available
  name: node_fs_available
  summary: 'The threshold for available node filesystem space below which soft pod
