### YamlMime:PythonClass
uid: azure.mgmt.containerservice.models.SoftEvictionThreshold
name: SoftEvictionThreshold
fullName: azure.mgmt.containerservice.models.SoftEvictionThreshold
module: azure.mgmt.containerservice.models
summary: 'Soft eviction thresholds for kubelet. These thresholds trigger graceful
  pod eviction when node

  resources drop below the specified values for at least the corresponding grace period
  defined

  in softEvictionGracePeriod. Supported formats are Ki, Mi, Gi, or percentages using
  %.'
constructor:
  syntax: 'SoftEvictionThreshold(*args: Any, **kwargs: Any)'
variables:
- description: 'The threshold for available memory below which soft pod eviction is

    triggered. Accepts absolute values (e.g. ''500Mi'') or percentage values (e.g.
    ''5%''). Absolute

    minimum is 100Mi; percentage minimum is 2%. Default uses a capacity-based step
    ladder: 500Mi

    for nodes with <=8GiB, 750Mi for 16GiB, and 1024Mi (1Gi) for >=32GiB. Must also
    be greater than

    the effective hardEvictionThreshold.memoryAvailable.'
  name: memory_available
  types:
  - <xref:str>
- description: 'The threshold for available node filesystem space below which soft
    pod

    eviction is triggered. Accepts absolute values (e.g. ''1Gi'') or percentage values
    (e.g. ''10%'').

    Default is ''12%''. Must be greater than or equal to 10% and greater than the
    effective

    hardEvictionThreshold.nodeFsAvailable.'
  name: node_fs_available
  types:
  - <xref:str>
- description: 'The threshold for available inodes on the node filesystem below

    which soft pod eviction is triggered. Accepts absolute inode counts (e.g. ''100000'')
    or

    percentage values (e.g. ''5%''). Default is ''7%''. Percentage values must be
    greater than or equal

    to 5% and greater than the effective hardEvictionThreshold.nodeFsInodesFree.'
  name: node_fs_inodes_free
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerservice.models.SoftEvictionThreshold.memory_available
  name: memory_available
  summary: 'The threshold for available memory below which soft pod eviction is triggered.
    Accepts absolute

