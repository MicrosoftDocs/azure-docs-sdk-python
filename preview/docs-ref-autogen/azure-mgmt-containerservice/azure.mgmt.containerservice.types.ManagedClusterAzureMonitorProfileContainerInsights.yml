### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileContainerInsights
name: ManagedClusterAzureMonitorProfileContainerInsights
fullName: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileContainerInsights
module: azure.mgmt.containerservice.types
summary: 'Azure Monitor Container Insights profile. Represents the configuration for
  collecting

  Kubernetes events, inventory, and container stdout & stderr logs. See

  aka.ms/AzureMonitorContainerInsights for an overview.'
constructor:
  syntax: ManagedClusterAzureMonitorProfileContainerInsights()
variables:
- description: Indicates if Azure Monitor Container Insights Logs Addon is enabled
    or not.
  name: enabled
  types:
  - <xref:bool>
- description: 'Fully Qualified ARM Resource Id of Azure Log Analytics

    Workspace for storing Azure Monitor Container Insights Logs.'
  name: logAnalyticsWorkspaceResourceId
  types:
  - <xref:str>
- description: The syslog host port. If not specified, the default port is 28330.
  name: syslogPort
  types:
  - <xref:int>
- description: 'Indicates whether prometheus metrics scraping is

    disabled or not. If not specified the default is false i.e. the prometheus scraping
    is enabled.'
  name: disablePrometheusMetricsScraping
  types:
  - <xref:bool>
- description: 'Configures container network logs ingestion with Azure Monitor. The

    log types ingested are controlled by the associated CRD; if unspecified, defaults
    to

    `Disabled`. See [https://aka.ms/ContainerNetworkLogsDoc](https://aka.ms/ContainerNetworkLogsDoc)
    and [https://aka.ms/acns/howtoenablecnl](https://aka.ms/acns/howtoenablecnl) for
    details. Known values are: "Disabled" and "Enabled".'
  name: containerNetworkLogs
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ContainerNetworkLogs">]
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileContainerInsights.containerNetworkLogs
  name: containerNetworkLogs
  summary: 'Configures container network logs ingestion with Azure Monitor. The log
    types ingested are

    controlled by the associated CRD; if unspecified, defaults to `Disabled`. See

    [https://aka.ms/ContainerNetworkLogsDoc](https://aka.ms/ContainerNetworkLogsDoc)
    and

    [https://aka.ms/acns/howtoenablecnl](https://aka.ms/acns/howtoenablecnl) for details.
    Known

    values are: "Disabled" and "Enabled".'
  signature: 'containerNetworkLogs: str | ContainerNetworkLogs'
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileContainerInsights.disablePrometheusMetricsScraping
  name: disablePrometheusMetricsScraping
  summary: 'Indicates whether prometheus metrics scraping is disabled or not. If not
    specified the default

    is false i.e. the prometheus scraping is enabled.'
  signature: 'disablePrometheusMetricsScraping: bool'
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileContainerInsights.enabled
  name: enabled
  summary: Indicates if Azure Monitor Container Insights Logs Addon is enabled or
    not.
  signature: 'enabled: bool'
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileContainerInsights.logAnalyticsWorkspaceResourceId
  name: logAnalyticsWorkspaceResourceId
  summary: 'Fully Qualified ARM Resource Id of Azure Log Analytics Workspace for storing
    Azure Monitor

    Container Insights Logs.'
  signature: 'logAnalyticsWorkspaceResourceId: str'
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileContainerInsights.syslogPort
  name: syslogPort
  summary: The syslog host port. If not specified, the default port is 28330.
  signature: 'syslogPort: int'
