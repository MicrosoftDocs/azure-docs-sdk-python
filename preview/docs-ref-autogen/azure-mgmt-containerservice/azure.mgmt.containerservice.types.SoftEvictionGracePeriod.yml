### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.SoftEvictionGracePeriod
name: SoftEvictionGracePeriod
fullName: azure.mgmt.containerservice.types.SoftEvictionGracePeriod
module: azure.mgmt.containerservice.types
summary: 'Grace periods for kubelet soft eviction thresholds. Each field is a Go-style
  duration string

  (e.g. ''1m30s'') that specifies how long the corresponding soft eviction signal
  must be crossed

  before pod eviction is triggered. A grace period only applies when the matching
  soft eviction

  threshold is set.'
constructor:
  syntax: SoftEvictionGracePeriod()
variables:
- description: 'The grace period for the memoryAvailable soft eviction signal, expressed

    as a Go-style duration string (e.g. ''30s'', ''1m30s''). Supported units are ''ns'',
    ''us'', ''ms'', ''s'',

    ''m'', and ''h''. Must be greater than or equal to ''30s''. Default is ''30s''.'
  name: memoryAvailable
  types:
  - <xref:str>
- description: 'The grace period for the nodeFsAvailable soft eviction signal, expressed

    as a Go-style duration string (e.g. ''30s'', ''1m30s''). Supported units are ''ns'',
    ''us'', ''ms'', ''s'',

    ''m'', and ''h''. Must be greater than or equal to ''30s''. Default is ''2m''.'
  name: nodeFsAvailable
  types:
  - <xref:str>
- description: 'The grace period for the nodeFsInodesFree soft eviction signal,

    expressed as a Go-style duration string (e.g. ''30s'', ''1m30s''). Supported units
    are ''ns'', ''us'',

    ''ms'', ''s'', ''m'', and ''h''. Must be greater than or equal to ''30s''. Default
    is ''2m''.'
  name: nodeFsInodesFree
  types:
  - <xref:str>
attributes:
