### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileMetrics
name: ManagedClusterAzureMonitorProfileMetrics
fullName: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileMetrics
module: azure.mgmt.containerservice.types
summary: 'Metrics profile for the Azure Monitor managed service for Prometheus addon.
  Collect

  out-of-the-box Kubernetes infrastructure metrics to send to an Azure Monitor Workspace
  and

  configure additional scraping for custom targets. See aka.ms/AzureManagedPrometheus
  for an

  overview.'
constructor:
  syntax: ManagedClusterAzureMonitorProfileMetrics()
variables:
- description: 'Whether to enable or disable the Azure Managed Prometheus addon for
    Prometheus

    monitoring. See aka.ms/AzureManagedPrometheus-aks-enable for details on enabling
    and disabling.

    Required.'
  name: enabled
  types:
  - <xref:bool>
- description: 'Kube State Metrics profile for the Azure Managed Prometheus addon.

    These optional settings are for the kube-state-metrics pod that is deployed with
    the addon. See

    aka.ms/AzureManagedPrometheus-optional-parameters for details.'
  name: kube_state_metrics
  types:
  - <xref:<xref:"ManagedClusterAzureMonitorProfileKubeStateMetrics">>
- description: 'Control plane metrics collection profile for the Azure Managed Prometheus

    addon. Configures collection of operational runtime metrics from managed control
    plane

    components (kube-apiserver, etcd, etc). See aka.ms/aks/controlplane-metrics for
    an overview.'
  name: control_plane
  types:
  - <xref:<xref:"ManagedClusterAzureMonitorProfileMetricsControlPlane">>
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileMetrics.controlPlane
  name: controlPlane
  summary: 'Control plane metrics collection profile for the Azure Managed Prometheus
    addon. Configures

    collection of operational runtime metrics from managed control plane components

    (kube-apiserver, etcd, etc). See aka.ms/aks/controlplane-metrics for an overview.'
  signature: 'controlPlane: ManagedClusterAzureMonitorProfileMetricsControlPlane'
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileMetrics.enabled
  name: enabled
  summary: 'Whether to enable or disable the Azure Managed Prometheus addon for Prometheus
    monitoring. See

    aka.ms/AzureManagedPrometheus-aks-enable for details on enabling and disabling.
    Required.'
  signature: 'enabled: bool'
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileMetrics.kubeStateMetrics
  name: kubeStateMetrics
  summary: 'Kube State Metrics profile for the Azure Managed Prometheus addon. These
    optional settings are

    for the kube-state-metrics pod that is deployed with the addon. See

    aka.ms/AzureManagedPrometheus-optional-parameters for details.'
  signature: 'kubeStateMetrics: ManagedClusterAzureMonitorProfileKubeStateMetrics'
