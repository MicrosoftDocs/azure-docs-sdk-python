### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterHTTPProxyConfig
name: ManagedClusterHTTPProxyConfig
fullName: azure.mgmt.containerservice.types.ManagedClusterHTTPProxyConfig
module: azure.mgmt.containerservice.types
summary: Cluster HTTP proxy configuration.
constructor:
  syntax: ManagedClusterHTTPProxyConfig()
variables:
- description: The HTTP proxy server endpoint to use.
  name: http_proxy
  types:
  - <xref:str>
- description: The HTTPS proxy server endpoint to use.
  name: https_proxy
  types:
  - <xref:str>
- description: The endpoints that should not go through proxy.
  name: no_proxy
  types:
  - <xref:list>[<xref:str>]
- description: 'A read-only list of all endpoints for which traffic should not be

    sent to the proxy. This list is a superset of noProxy and values injected by AKS.'
  name: effective_no_proxy
  types:
  - <xref:list>[<xref:str>]
- description: Alternative CA cert to use for connecting to proxy servers.
  name: trusted_ca
  types:
  - <xref:str>
- description: 'Whether to enable HTTP proxy. If disabled, the specified proxy configuration

    will be not be set on pods and nodes. If not specified, the default is true.'
  name: enabled
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterHTTPProxyConfig.effectiveNoProxy
  name: effectiveNoProxy
  summary: 'A read-only list of all endpoints for which traffic should not be sent
    to the proxy. This list

    is a superset of noProxy and values injected by AKS.'
  signature: 'effectiveNoProxy: list[str]'
- uid: azure.mgmt.containerservice.types.ManagedClusterHTTPProxyConfig.enabled
  name: enabled
  summary: 'Whether to enable HTTP proxy. If disabled, the specified proxy configuration
    will be not be set

    on pods and nodes. If not specified, the default is true.'
  signature: 'enabled: bool'
- uid: azure.mgmt.containerservice.types.ManagedClusterHTTPProxyConfig.httpProxy
  name: httpProxy
  summary: The HTTP proxy server endpoint to use.
  signature: 'httpProxy: str'
- uid: azure.mgmt.containerservice.types.ManagedClusterHTTPProxyConfig.httpsProxy
  name: httpsProxy
  summary: The HTTPS proxy server endpoint to use.
  signature: 'httpsProxy: str'
- uid: azure.mgmt.containerservice.types.ManagedClusterHTTPProxyConfig.noProxy
  name: noProxy
  summary: The endpoints that should not go through proxy.
  signature: 'noProxy: list[str]'
- uid: azure.mgmt.containerservice.types.ManagedClusterHTTPProxyConfig.trustedCa
  name: trustedCa
  summary: Alternative CA cert to use for connecting to proxy servers.
  signature: 'trustedCa: str'
