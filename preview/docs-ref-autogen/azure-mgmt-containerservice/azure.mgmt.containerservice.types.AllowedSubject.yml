### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.AllowedSubject
name: AllowedSubject
fullName: azure.mgmt.containerservice.types.AllowedSubject
module: azure.mgmt.containerservice.types
summary: 'A subject authorized to use the identity binding for token exchange. The
  namespace selector is

  required and must be non-empty. The service account selector is optional; when omitted,
  all

  service accounts in matching namespaces are authorized. Selectors within a single

  AllowedSubject are AND''d; multiple AllowedSubjects on an IdentityBinding are OR''d.'
constructor:
  syntax: AllowedSubject()
variables:
- description: 'Label selector matching the namespaces in which this identity may
    be

    used. Must be non-empty: an empty selector would match every namespace and is
    rejected to

    prevent overly permissive bindings. Use the built-in `kubernetes.io/metadata.name`
    label to

    target specific namespaces by name. Required.'
  name: namespace_selector
  types:
  - <xref:<xref:"LabelSelector">>
- description: 'Optional label selector matching the service accounts (within

    the namespaces matched by `namespaceSelector`) that may use this identity. When
    omitted, all

    service accounts in matching namespaces are authorized. When provided, it must
    be non-empty.'
  name: service_account_selector
  types:
  - <xref:<xref:"LabelSelector">>
attributes:
- uid: azure.mgmt.containerservice.types.AllowedSubject.namespaceSelector
  name: namespaceSelector
  summary: 'Label selector matching the namespaces in which this identity may be used.
    Must be non-empty:

    an empty selector would match every namespace and is rejected to prevent overly
    permissive

    bindings. Use the built-in `kubernetes.io/metadata.name` label to target specific
    namespaces

    by name. Required.'
  signature: 'namespaceSelector: LabelSelector'
- uid: azure.mgmt.containerservice.types.AllowedSubject.serviceAccountSelector
  name: serviceAccountSelector
  summary: 'Optional label selector matching the service accounts (within the namespaces
    matched by

    `namespaceSelector`) that may use this identity. When omitted, all service accounts
    in

    matching namespaces are authorized. When provided, it must be non-empty.'
  signature: 'serviceAccountSelector: LabelSelector'
