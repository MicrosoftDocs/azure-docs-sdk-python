### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfile
name: ManagedClusterAzureMonitorProfile
fullName: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfile
module: azure.mgmt.containerservice.types
summary: Azure Monitor addon profiles for monitoring the managed cluster.
constructor:
  syntax: ManagedClusterAzureMonitorProfile()
variables:
- description: 'Metrics profile for the Azure Monitor managed service for Prometheus
    addon.

    Collect out-of-the-box Kubernetes infrastructure metrics to send to an Azure Monitor
    Workspace

    and configure additional scraping for custom targets. See aka.ms/AzureManagedPrometheus
    for an

    overview.'
  name: metrics
  types:
  - <xref:<xref:"ManagedClusterAzureMonitorProfileMetrics">>
- description: 'Azure Monitor Container Insights Profile for Kubernetes Events,

    Inventory and Container stdout & stderr logs etc. See aka.ms/AzureMonitorContainerInsights
    for

    an overview.'
  name: container_insights
  types:
  - <xref:<xref:"ManagedClusterAzureMonitorProfileContainerInsights">>
- description: 'Application Monitoring Profile for Kubernetes Application Container.

    Collects application logs, metrics and traces through auto-instrumentation of
    the application

    using Azure Monitor OpenTelemetry based SDKs. See aka.ms/AzureMonitorApplicationMonitoring
    for

    an overview.'
  name: app_monitoring
  types:
  - <xref:<xref:"ManagedClusterAzureMonitorProfileAppMonitoring">>
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfile.appMonitoring
  name: appMonitoring
  summary: 'Application Monitoring Profile for Kubernetes Application Container. Collects
    application logs,

    metrics and traces through auto-instrumentation of the application using Azure
    Monitor

    OpenTelemetry based SDKs. See aka.ms/AzureMonitorApplicationMonitoring for an
    overview.'
  signature: 'appMonitoring: ManagedClusterAzureMonitorProfileAppMonitoring'
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfile.containerInsights
  name: containerInsights
  summary: 'Azure Monitor Container Insights Profile for Kubernetes Events, Inventory
    and Container stdout

    & stderr logs etc. See aka.ms/AzureMonitorContainerInsights for an overview.'
  signature: 'containerInsights: ManagedClusterAzureMonitorProfileContainerInsights'
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfile.metrics
  name: metrics
  summary: 'Metrics profile for the Azure Monitor managed service for Prometheus addon.
    Collect

    out-of-the-box Kubernetes infrastructure metrics to send to an Azure Monitor Workspace
    and

    configure additional scraping for custom targets. See aka.ms/AzureManagedPrometheus
    for an

    overview.'
  signature: 'metrics: ManagedClusterAzureMonitorProfileMetrics'
