### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.MachineHardwareProfile
name: MachineHardwareProfile
fullName: azure.mgmt.containerservice.types.MachineHardwareProfile
module: azure.mgmt.containerservice.types
summary: The hardware and GPU settings of the machine.
constructor:
  syntax: MachineHardwareProfile()
variables:
- description: 'The size of the VM. VM size availability varies by region. If a node
    contains

    insufficient compute resources (memory, cpu, etc) pods might fail to run correctly.
    For more

    details on restricted VM sizes, see: [https://docs.microsoft.com/azure/aks/quotas-skus-regions](https://docs.microsoft.com/azure/aks/quotas-skus-regions).'
  name: vm_size
  types:
  - <xref:str>
- description: 'GPUInstanceProfile to be used to specify GPU MIG instance profile

    for supported GPU VM SKU. Known values are: "MIG1g", "MIG2g", "MIG3g", "MIG4g",
    and "MIG7g".'
  name: gpu_instance_profile
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GPUInstanceProfile">]
- description: The GPU settings of the machine.
  name: gpu_profile
  types:
  - <xref:<xref:"GPUProfile">>
- description: Whether to enable UltraSSD.
  name: ultra_ssd_enabled
  types:
  - <xref:bool>
attributes:
