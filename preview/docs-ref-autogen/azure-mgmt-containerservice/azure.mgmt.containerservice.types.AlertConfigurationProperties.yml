### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.AlertConfigurationProperties
name: AlertConfigurationProperties
fullName: azure.mgmt.containerservice.types.AlertConfigurationProperties
module: azure.mgmt.containerservice.types
summary: Properties of the alert configuration.
constructor:
  syntax: AlertConfigurationProperties()
variables:
- description: 'The mode of the alert configuration. Specifies how AKS manages the
    alerts.

    Required. Known values are: "Disabled" and "Managed".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AlertConfigurationMode">]
- description: Notification settings for the alert configuration. Required.
  name: notification
  types:
  - <xref:<xref:"AlertNotification">>
- description: 'The current provisioning state of the alert configuration. Known

    values are: "Succeeded", "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AlertConfigurationProvisioningState">]
attributes:
- uid: azure.mgmt.containerservice.types.AlertConfigurationProperties.mode
  name: mode
  summary: 'The mode of the alert configuration. Specifies how AKS manages the alerts.
    Required. Known

    values are: "Disabled" and "Managed".'
  signature: 'mode: Required[str | AlertConfigurationMode]'
- uid: azure.mgmt.containerservice.types.AlertConfigurationProperties.notification
  name: notification
  summary: Notification settings for the alert configuration. Required.
  signature: 'notification: Required[AlertNotification]'
- uid: azure.mgmt.containerservice.types.AlertConfigurationProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | AlertConfigurationProvisioningState'
