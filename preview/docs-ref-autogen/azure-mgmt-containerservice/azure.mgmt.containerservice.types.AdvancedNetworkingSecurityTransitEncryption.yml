### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.AdvancedNetworkingSecurityTransitEncryption
name: AdvancedNetworkingSecurityTransitEncryption
fullName: azure.mgmt.containerservice.types.AdvancedNetworkingSecurityTransitEncryption
module: azure.mgmt.containerservice.types
summary: 'Encryption configuration for Cilium-based clusters. Once enabled all traffic
  between Cilium

  managed pods will be encrypted when it leaves the node boundary.'
constructor:
  syntax: AdvancedNetworkingSecurityTransitEncryption()
variables:
- description: 'Configures pod-to-pod encryption. This can be enabled only on Cilium-based

    clusters. If not specified, the default value is None. Known values are: "WireGuard",
    "mTLS",

    and "None".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TransitEncryptionType">]
attributes:
- uid: azure.mgmt.containerservice.types.AdvancedNetworkingSecurityTransitEncryption.type
  name: type
  summary: 'Configures pod-to-pod encryption. This can be enabled only on Cilium-based
    clusters. If not

    specified, the default value is None. Known values are: "WireGuard", "mTLS", and
    "None".'
  signature: 'type: str | TransitEncryptionType'
