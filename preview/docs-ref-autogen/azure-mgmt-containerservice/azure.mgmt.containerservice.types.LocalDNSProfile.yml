### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.LocalDNSProfile
name: LocalDNSProfile
fullName: azure.mgmt.containerservice.types.LocalDNSProfile
module: azure.mgmt.containerservice.types
summary: 'Configures the per-node local DNS, with VnetDNS and KubeDNS overrides. LocalDNS
  helps improve

  performance and reliability of DNS resolution in an AKS cluster. For more details
  see

  aka.ms/aks/localdns.'
constructor:
  syntax: LocalDNSProfile()
variables:
- description: 'Mode of enablement for localDNS. Known values are: "Preferred", "Required",
    and

    "Disabled".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LocalDNSMode">]
- description: 'System-generated state of localDNS. Known values are: "Enabled" and
    "Disabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LocalDNSState">]
- description: 'VnetDNS overrides apply to DNS traffic from pods with

    dnsPolicy:default or kubelet (referred to as VnetDNS traffic).'
  name: vnet_dns_overrides
  types:
  - <xref:dict>[<xref:str>, <xref:"LocalDNSOverride">]
- description: 'KubeDNS overrides apply to DNS traffic from pods with

    dnsPolicy:ClusterFirst (referred to as KubeDNS traffic).'
  name: kube_dns_overrides
  types:
  - <xref:dict>[<xref:str>, <xref:"LocalDNSOverride">]
attributes:
- uid: azure.mgmt.containerservice.types.LocalDNSProfile.kubeDNSOverrides
  name: kubeDNSOverrides
  summary: 'ClusterFirst (referred to as

    KubeDNS traffic).'
  signature: 'kubeDNSOverrides: dict[str, ''LocalDNSOverride'']'
- uid: azure.mgmt.containerservice.types.LocalDNSProfile.mode
  name: mode
  summary: '"Preferred", "Required", and

    "Disabled".'
  signature: 'mode: str | LocalDNSMode'
- uid: azure.mgmt.containerservice.types.LocalDNSProfile.state
  name: state
  summary: '"Enabled" and "Disabled".'
  signature: 'state: str | LocalDNSState'
- uid: azure.mgmt.containerservice.types.LocalDNSProfile.vnetDNSOverrides
  name: vnetDNSOverrides
  summary: 'default or kubelet (referred to

    as VnetDNS traffic).'
  signature: 'vnetDNSOverrides: dict[str, ''LocalDNSOverride'']'
