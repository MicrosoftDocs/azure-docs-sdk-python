### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.MachineProperties
name: MachineProperties
fullName: azure.mgmt.containerservice.types.MachineProperties
module: azure.mgmt.containerservice.types
summary: The properties of the machine.
constructor:
  syntax: MachineProperties()
variables:
- description: network properties of the machine.
  name: network
  types:
  - <xref:<xref:"MachineNetworkProperties">>
- description: 'Azure resource id of the machine. It can be used to GET underlying
    VM

    Instance.'
  name: resource_id
  types:
  - <xref:str>
- description: The hardware and GPU settings of the machine.
  name: hardware
  types:
  - <xref:<xref:"MachineHardwareProfile">>
- description: The operating system and disk used by the machine.
  name: operating_system
  types:
  - <xref:<xref:"MachineOSProfile">>
- description: The Kubernetes configurations used by the machine.
  name: kubernetes
  types:
  - <xref:<xref:"MachineKubernetesProfile">>
- description: 'Machine only allows ''System'' and ''User'' mode. Known values are:
    "System", "User",

    "Gateway", "ManagedSystem", and "Machines".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AgentPoolMode">]
- description: The security settings of the machine.
  name: security
  types:
  - <xref:<xref:"MachineSecurityProfile">>
- description: 'The priority for the machine. If not specified, the default is ''Regular''.
    Known

    values are: "Spot" and "Regular".'
  name: priority
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScaleSetPriority">]
- description: 'The eviction policy for machine. This cannot be specified unless the

    priority is ''Spot''. If not specified, the default is ''Delete''. Known values
    are: "Delete" and

    "Deallocate".'
  name: eviction_policy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScaleSetEvictionPolicy">]
- description: The properties having to do with machine billing.
  name: billing
  types:
  - <xref:<xref:"MachineBillingProfile">>
- description: The version of node image.
  name: node_image_version
  types:
  - <xref:str>
- description: The current deployment or provisioning state.
  name: provisioning_state
  types:
  - <xref:str>
- description: The tags to be persisted on the machine.
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'Unique read-only string used to implement optimistic concurrency.
    The eTag value

    will change when the resource is updated. Specify an if-match or if-none-match
    header with the

    eTag value for a subsequent request to enable optimistic concurrency per the normal
    eTag

    convention.'
  name: e_tag
  types:
  - <xref:str>
- description: Contains read-only information about the machine.
  name: status
  types:
  - <xref:<xref:"MachineStatus">>
- description: 'Configures the per-node local DNS, with VnetDNS and KubeDNS overrides.

    LocalDNS helps improve performance and reliability of DNS resolution in an AKS
    cluster. For

    more details see aka.ms/aks/localdns.'
  name: local_dns_profile
  types:
  - <xref:<xref:"LocalDNSProfile">>
attributes:
- uid: azure.mgmt.containerservice.types.MachineProperties.billing
  name: billing
  summary: The properties having to do with machine billing.
  signature: 'billing: MachineBillingProfile'
- uid: azure.mgmt.containerservice.types.MachineProperties.eTag
  name: eTag
  summary: 'Unique read-only string used to implement optimistic concurrency. The
    eTag value will change

    when the resource is updated. Specify an if-match or if-none-match header with
    the eTag value

    for a subsequent request to enable optimistic concurrency per the normal eTag
    convention.'
  signature: 'eTag: str'
- uid: azure.mgmt.containerservice.types.MachineProperties.evictionPolicy
  name: evictionPolicy
  summary: 'The eviction policy for machine. This cannot be specified unless the priority
    is ''Spot''. If not

    specified, the default is ''Delete''. Known values are: "Delete" and "Deallocate".'
  signature: 'evictionPolicy: str | ScaleSetEvictionPolicy'
- uid: azure.mgmt.containerservice.types.MachineProperties.hardware
  name: hardware
  summary: The hardware and GPU settings of the machine.
  signature: 'hardware: MachineHardwareProfile'
- uid: azure.mgmt.containerservice.types.MachineProperties.kubernetes
  name: kubernetes
  summary: The Kubernetes configurations used by the machine.
  signature: 'kubernetes: MachineKubernetesProfile'
- uid: azure.mgmt.containerservice.types.MachineProperties.localDNSProfile
  name: localDNSProfile
  summary: 'Configures the per-node local DNS, with VnetDNS and KubeDNS overrides.
    LocalDNS helps improve

    performance and reliability of DNS resolution in an AKS cluster. For more details
    see

    aka.ms/aks/localdns.'
  signature: 'localDNSProfile: LocalDNSProfile'
- uid: azure.mgmt.containerservice.types.MachineProperties.mode
  name: mode
  summary: '"System", "User",

    "Gateway", "ManagedSystem", and "Machines".'
  signature: 'mode: str | AgentPoolMode'
- uid: azure.mgmt.containerservice.types.MachineProperties.network
  name: network
  summary: network properties of the machine.
  signature: 'network: MachineNetworkProperties'
- uid: azure.mgmt.containerservice.types.MachineProperties.nodeImageVersion
  name: nodeImageVersion
  summary: The version of node image.
  signature: 'nodeImageVersion: str'
- uid: azure.mgmt.containerservice.types.MachineProperties.operatingSystem
  name: operatingSystem
  summary: The operating system and disk used by the machine.
  signature: 'operatingSystem: MachineOSProfile'
- uid: azure.mgmt.containerservice.types.MachineProperties.priority
  name: priority
  summary: 'The priority for the machine. If not specified, the default is ''Regular''.
    Known values are:

    "Spot" and "Regular".'
  signature: 'priority: str | ScaleSetPriority'
- uid: azure.mgmt.containerservice.types.MachineProperties.provisioningState
  name: provisioningState
  summary: The current deployment or provisioning state.
  signature: 'provisioningState: str'
- uid: azure.mgmt.containerservice.types.MachineProperties.resourceId
  name: resourceId
  summary: Azure resource id of the machine. It can be used to GET underlying VM Instance.
  signature: 'resourceId: str'
- uid: azure.mgmt.containerservice.types.MachineProperties.security
  name: security
  summary: The security settings of the machine.
  signature: 'security: MachineSecurityProfile'
- uid: azure.mgmt.containerservice.types.MachineProperties.status
  name: status
  summary: Contains read-only information about the machine.
  signature: 'status: MachineStatus'
- uid: azure.mgmt.containerservice.types.MachineProperties.tags
  name: tags
  summary: The tags to be persisted on the machine.
  signature: 'tags: dict[str, str]'
