uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfileDefender
name: ManagedClusterSecurityProfileDefender
fullName: azure.mgmt.containerservice.types.ManagedClusterSecurityProfileDefender
module: azure.mgmt.containerservice.types
summary: Microsoft Defender settings for the security profile.
constructor:
  syntax: ManagedClusterSecurityProfileDefender()
variables:
- description: 'Resource ID of the Log Analytics workspace to be

    associated with Microsoft Defender. When Microsoft Defender is enabled, this field
    is required

    and must be a valid workspace resource ID. When Microsoft Defender is disabled,
    leave the field

    empty.'
  name: logAnalyticsWorkspaceResourceId
  types:
  - <xref:str>
- description: 'Microsoft Defender threat detection for Cloud settings for the

    security profile.'
  name: securityMonitoring
  types:
  - <xref:<xref:"ManagedClusterSecurityProfileDefenderSecurityMonitoring">>
- description: 'Microsoft Defender settings for security gating. This validates container

    images eligibility for deployment based on Defender for Containers security findings.
    Using

    Admission Controller, it either audits or prevents deployment of images that do
    not meet

    security standards. For more information, see [https://aka.ms/KubernetesDefenderAuditRule](https://aka.ms/KubernetesDefenderAuditRule).'
  name: securityGating
  types:
  - <xref:<xref:"ManagedClusterSecurityProfileDefenderSecurityGating">>
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfileDefender.logAnalyticsWorkspaceResourceId
  name: logAnalyticsWorkspaceResourceId
  summary: 'Resource ID of the Log Analytics workspace to be associated with Microsoft
    Defender. When

    Microsoft Defender is enabled, this field is required and must be a valid workspace
    resource

    ID. When Microsoft Defender is disabled, leave the field empty.'
  signature: 'logAnalyticsWorkspaceResourceId: str'
- uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfileDefender.securityGating
  name: securityGating
  summary: 'Microsoft Defender settings for security gating. This validates container
