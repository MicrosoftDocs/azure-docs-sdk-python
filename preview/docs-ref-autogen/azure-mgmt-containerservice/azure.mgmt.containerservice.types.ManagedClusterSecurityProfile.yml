### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfile
name: ManagedClusterSecurityProfile
fullName: azure.mgmt.containerservice.types.ManagedClusterSecurityProfile
module: azure.mgmt.containerservice.types
summary: Security profile for the container service cluster.
constructor:
  syntax: ManagedClusterSecurityProfile()
variables:
- description: Microsoft Defender settings for the security profile.
  name: defender
  types:
  - <xref:<xref:"ManagedClusterSecurityProfileDefender">>
- description: 'Azure Key Vault [key management service](https://kubernetes.io/docs/tasks/administer-cluster/kms-provider/)
    settings for the security

    profile.'
  name: azure_key_vault_kms
  types:
  - <xref:<xref:"AzureKeyVaultKms">>
- description: 'Encryption at rest of Kubernetes resource

    objects. More information on this can be found under

    [https://aka.ms/aks/kubernetesResourceObjectEncryption](https://aka.ms/aks/kubernetesResourceObjectEncryption).'
  name: kubernetes_resource_object_encryption_profile
  types:
  - <xref:<xref:"KubernetesResourceObjectEncryptionProfile">>
- description: 'Workload identity settings for the security profile. Workload identity

    enables Kubernetes applications to access Azure cloud resources securely with
    Azure AD. See

    [https://aka.ms/aks/wi](https://aka.ms/aks/wi) for more details.'
  name: workload_identity
  types:
  - <xref:<xref:"ManagedClusterSecurityProfileWorkloadIdentity">>
- description: Image Cleaner settings for the security profile.
  name: image_cleaner
  types:
  - <xref:<xref:"ManagedClusterSecurityProfileImageCleaner">>
- description: 'Image integrity is a feature that works with Azure Policy to verify

    image integrity by signature. This will not have any effect unless Azure Policy
    is applied to

    enforce image signatures. See [https://aka.ms/aks/image-integrity](https://aka.ms/aks/image-integrity)
    for how to use this feature via policy.'
  name: image_integrity
  types:
  - <xref:<xref:"ManagedClusterSecurityProfileImageIntegrity">>
- description: '[Node Restriction](https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/#noderestriction)

    settings for the security profile.'
  name: node_restriction
  types:
  - <xref:<xref:"ManagedClusterSecurityProfileNodeRestriction">>
- description: 'A list of up to 10 base64 encoded CAs that will be added to

    the trust store on all nodes in the cluster. For more information see [Custom
    CA Trust

    Certificates](https://learn.microsoft.com/en-us/azure/aks/custom-certificate-authority).'
  name: custom_ca_trust_certificates
  types:
  - <xref:list>[<xref:str>]
- description: Defines service account based image pull settings.
  name: service_account_image_pull_profile
  types:
  - <xref:<xref:"ServiceAccountImagePullProfile">>
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfile.azureKeyVaultKms
  name: azureKeyVaultKms
  summary: 'Azure Key Vault [key management service](https://kubernetes.io/docs/tasks/administer-cluster/kms-provider/)
    settings for the security

    profile.'
  signature: 'azureKeyVaultKms: AzureKeyVaultKms'
- uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfile.customCATrustCertificates
  name: customCATrustCertificates
  summary: 'A list of up to 10 base64 encoded CAs that will be added to the trust
    store on all nodes in the

    cluster. For more information see [Custom CA Trust Certificates](https://learn.microsoft.com/en-us/azure/aks/custom-certificate-authority).'
  signature: 'customCATrustCertificates: list[str]'
- uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfile.defender
  name: defender
  summary: Microsoft Defender settings for the security profile.
  signature: 'defender: ManagedClusterSecurityProfileDefender'
- uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfile.imageCleaner
  name: imageCleaner
  summary: Image Cleaner settings for the security profile.
  signature: 'imageCleaner: ManagedClusterSecurityProfileImageCleaner'
- uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfile.imageIntegrity
  name: imageIntegrity
  summary: 'Image integrity is a feature that works with Azure Policy to verify image
    integrity by

    signature. This will not have any effect unless Azure Policy is applied to enforce
    image

    signatures. See [https://aka.ms/aks/image-integrity](https://aka.ms/aks/image-integrity)
    for

    how to use this feature via policy.'
  signature: 'imageIntegrity: ManagedClusterSecurityProfileImageIntegrity'
- uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfile.kubernetesResourceObjectEncryptionProfile
  name: kubernetesResourceObjectEncryptionProfile
  summary: 'Encryption at rest of Kubernetes resource objects. More information on
    this can be found under

    [https://aka.ms/aks/kubernetesResourceObjectEncryption](https://aka.ms/aks/kubernetesResourceObjectEncryption).'
  signature: 'kubernetesResourceObjectEncryptionProfile: KubernetesResourceObjectEncryptionProfile'
- uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfile.nodeRestriction
  name: nodeRestriction
  summary: '[Node Restriction](https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/#noderestriction)

    settings for the security profile.'
  signature: 'nodeRestriction: ManagedClusterSecurityProfileNodeRestriction'
- uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfile.serviceAccountImagePullProfile
  name: serviceAccountImagePullProfile
  summary: Defines service account based image pull settings.
  signature: 'serviceAccountImagePullProfile: ServiceAccountImagePullProfile'
- uid: azure.mgmt.containerservice.types.ManagedClusterSecurityProfile.workloadIdentity
  name: workloadIdentity
  summary: 'Workload identity settings for the security profile. Workload identity
    enables Kubernetes

    applications to access Azure cloud resources securely with Azure AD. See [https://aka.ms/aks/wi](https://aka.ms/aks/wi)
    for more details.'
  signature: 'workloadIdentity: ManagedClusterSecurityProfileWorkloadIdentity'
