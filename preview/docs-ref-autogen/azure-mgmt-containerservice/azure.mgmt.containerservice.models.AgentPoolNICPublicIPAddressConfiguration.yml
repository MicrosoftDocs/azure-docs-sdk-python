### YamlMime:PythonClass
uid: azure.mgmt.containerservice.models.AgentPoolNICPublicIPAddressConfiguration
name: AgentPoolNICPublicIPAddressConfiguration
fullName: azure.mgmt.containerservice.models.AgentPoolNICPublicIPAddressConfiguration
module: azure.mgmt.containerservice.models
summary: 'Public IP configuration applied to a secondary NIC on an agent pool. `ipTags`
  and

  `publicIPPrefixID` are mutually exclusive, matching the primary NIC''s behavior.
  For more

  information, see [https://aka.ms/aks/multi-nic](https://aka.ms/aks/multi-nic).'
constructor:
  syntax: 'AgentPoolNICPublicIPAddressConfiguration(*args: Any, **kwargs: Any)'
variables:
- description: 'IP version of the public IP provisioned for this NIC.

    Required: its presence is what enables public IP provisioning, so an empty configuration

    allocates nothing. `IPv4` is the only accepted value. Required. "IPv4"'
  name: public_ip_address_version
  types:
  - <xref:str>
  - <xref:azure.mgmt.containerservice.models.AgentPoolNICPublicIPAddressVersion>
- description: 'IP tags to attach to the public IP allocated for this NIC. Each tag''s

    `ipTagType` must be `FirstPartyUsage`, `NetworkDomain`, or `RoutingPreference`.

    Mutually exclusive with `publicIPPrefixID`.'
  name: ip_tags
  types:
  - <xref:list>[<xref:azure.mgmt.containerservice.models.IPTag>]
- description: 'The resource ID of a public IP prefix to draw this NIC''s public IP

    from. Mutually exclusive with `ipTags`.'
  name: public_ip_prefix_id
  types:
  - <xref:str>
