### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterAppRoutingIstio
name: ManagedClusterAppRoutingIstio
fullName: azure.mgmt.containerservice.types.ManagedClusterAppRoutingIstio
module: azure.mgmt.containerservice.types
summary: 'Configuration for using a sidecar-less Istio control plane for managed ingress
  via the Gateway

  API with App Routing. See [https://aka.ms/gateway-on-istio](https://aka.ms/gateway-on-istio)

  for information on using Istio for ingress via the Gateway API.'
constructor:
  syntax: ManagedClusterAppRoutingIstio()
variables:
- description: 'Whether to enable Istio as a Gateway API implementation for managed
    ingress with

    App Routing. Known values are: "Enabled" and "Disabled".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GatewayAPIIstioEnabled">]
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterAppRoutingIstio.mode
  name: mode
  summary: 'Whether to enable Istio as a Gateway API implementation for managed ingress
    with App Routing.

    Known values are: "Enabled" and "Disabled".'
  signature: 'mode: str | GatewayAPIIstioEnabled'
