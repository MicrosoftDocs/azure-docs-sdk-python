### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.MeshMembershipProperties
name: MeshMembershipProperties
fullName: azure.mgmt.containerservice.types.MeshMembershipProperties
module: azure.mgmt.containerservice.types
summary: Mesh membership properties of a managed cluster.
constructor:
  syntax: MeshMembershipProperties()
variables:
- description: 'The current provisioning state of the Mesh Membership. Known values

    are: "Canceled", "Creating", "Deleting", "Failed", "Succeeded", and "Updating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MeshMembershipProvisioningState">]
- description: 'Profile for configuring private connectivity between the mesh

    control plane and member clusters. When configured, communication between the
    mesh control

    plane and this member cluster occurs over private network instead of public networks.
    Visit

    [https://aka.ms/applink](https://aka.ms/applink) for more information.'
  name: private_connect_profile
  types:
  - <xref:<xref:"MeshMembershipPrivateConnectProfile">>
- description: 'The ARM resource id for the managed mesh member. This is of the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.AppLink/applinks/{appLinkName}/appLinkMembers/{appLinkMemberName}''.

    Visit [https://aka.ms/applink](https://aka.ms/applink) for more information. Required.'
  name: managed_mesh_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerservice.types.MeshMembershipProperties.managedMeshID
  name: managedMeshID
  summary: 'The ARM resource id for the managed mesh member. This is of the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.AppLink/applinks/{appLinkName}/appLinkMembers/{appLinkMemberName}''.

    Visit [https://aka.ms/applink](https://aka.ms/applink) for more information. Required.'
  signature: 'managedMeshID: Required[str]'
- uid: azure.mgmt.containerservice.types.MeshMembershipProperties.privateConnectProfile
  name: privateConnectProfile
  summary: 'Profile for configuring private connectivity between the mesh control
    plane and member

    clusters. When configured, communication between the mesh control plane and this
    member cluster

    occurs over private network instead of public networks. Visit [https://aka.ms/applink](https://aka.ms/applink)
    for more information.'
  signature: 'privateConnectProfile: MeshMembershipPrivateConnectProfile'
- uid: azure.mgmt.containerservice.types.MeshMembershipProperties.provisioningState
  name: provisioningState
  summary: '"Canceled",

    "Creating", "Deleting", "Failed", "Succeeded", and "Updating".'
  signature: 'provisioningState: str | MeshMembershipProvisioningState'
