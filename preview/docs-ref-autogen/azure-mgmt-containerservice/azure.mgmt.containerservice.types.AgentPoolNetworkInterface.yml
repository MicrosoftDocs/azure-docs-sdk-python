### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.AgentPoolNetworkInterface
name: AgentPoolNetworkInterface
fullName: azure.mgmt.containerservice.types.AgentPoolNetworkInterface
module: azure.mgmt.containerservice.types
summary: 'Configuration of a secondary network interface provisioned on each VM instance
  in the agent

  pool. For more information, see [https://aka.ms/aks/multi-nic](https://aka.ms/aks/multi-nic).'
constructor:
  syntax: AgentPoolNetworkInterface()
variables:
- description: 'Type of NIC to be provisioned on the VM. Known values are: "Standard"
    and

    "Dynamic".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AgentPoolNetworkInterfaceType">]
- description: 'The resource ID of the subnet which will be attached to the secondary

    network interface. Required when `type` is `Standard`; must be an empty string
    (`""`) or

    omitted when `type` is `Dynamic`.'
  name: vnetSubnetId
  types:
  - <xref:str>
- description: 'Whether accelerated networking is enabled on this secondary

    NIC. If omitted, this defaults to true only when the agent pool VM SKU supports
    accelerated

    networking. Validation will fail if it is enabled on an unsupported SKU or NIC
    configuration.'
  name: enableAcceleratedNetworking
  types:
  - <xref:bool>
- description: 'Public IP configuration for this secondary NIC. Only valid

    when `type` is `Standard`. Set `publicIPAddressVersion` to provision a per-VM

    instance-level public IP for the NIC, then optionally shape it with `ipTags` or

    `publicIPPrefixID`. If omitted, no public IP is provisioned. Idle timeout is not

    configurable. For more information, see [https://aka.ms/aks/multi-nic](https://aka.ms/aks/multi-nic).'
  name: publicIPAddressConfiguration
  types:
  - <xref:<xref:"AgentPoolNICPublicIPAddressConfiguration">>
attributes:
- uid: azure.mgmt.containerservice.types.AgentPoolNetworkInterface.enableAcceleratedNetworking
  name: enableAcceleratedNetworking
  summary: 'Whether accelerated networking is enabled on this secondary NIC. If omitted,
    this defaults to

    true only when the agent pool VM SKU supports accelerated networking. Validation
    will fail if

    it is enabled on an unsupported SKU or NIC configuration.'
  signature: 'enableAcceleratedNetworking: bool'
- uid: azure.mgmt.containerservice.types.AgentPoolNetworkInterface.publicIPAddressConfiguration
  name: publicIPAddressConfiguration
  summary: 'Public IP configuration for this secondary NIC. Only valid when `type`
    is `Standard`. Set

    `publicIPAddressVersion` to provision a per-VM instance-level public IP for the
    NIC, then

    optionally shape it with `ipTags` or `publicIPPrefixID`. If omitted, no public
    IP is

    provisioned. Idle timeout is not configurable. For more information, see

    [https://aka.ms/aks/multi-nic](https://aka.ms/aks/multi-nic).'
  signature: 'publicIPAddressConfiguration: AgentPoolNICPublicIPAddressConfiguration'
- uid: azure.mgmt.containerservice.types.AgentPoolNetworkInterface.type
  name: type
  summary: '"Standard" and "Dynamic".'
  signature: 'type: str | AgentPoolNetworkInterfaceType'
- uid: azure.mgmt.containerservice.types.AgentPoolNetworkInterface.vnetSubnetId
  name: vnetSubnetId
  summary: 'The resource ID of the subnet which will be attached to the secondary
    network interface.

    Required when `type` is `Standard`; must be an empty string (`""`) or omitted
    when

    `type` is `Dynamic`.'
  signature: 'vnetSubnetId: str'
