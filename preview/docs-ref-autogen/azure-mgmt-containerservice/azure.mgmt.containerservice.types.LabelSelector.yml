### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.LabelSelector
name: LabelSelector
fullName: azure.mgmt.containerservice.types.LabelSelector
module: azure.mgmt.containerservice.types
summary: 'A label selector is a label query over a set of resources. The result of
  matchLabels and

  matchExpressions are ANDed. An empty label selector matches all objects. A null
  label selector

  matches no objects.'
constructor:
  syntax: LabelSelector()
variables:
- description: 'matchLabels is an array of {key=value} pairs. A single {key=value}
    in the

    matchLabels map is equivalent to an element of matchExpressions, whose key field
    is `key`,

    the operator is `In`, and the values array contains only `value`. The requirements
    are

    ANDed.'
  name: match_labels
  types:
  - <xref:list>[<xref:str>]
- description: 'matchExpressions is a list of label selector requirements. The

    requirements are ANDed.'
  name: match_expressions
  types:
  - <xref:list>[<xref:"LabelSelectorRequirement">]
attributes:
- uid: azure.mgmt.containerservice.types.LabelSelector.matchExpressions
  name: matchExpressions
  summary: matchExpressions is a list of label selector requirements. The requirements
    are ANDed.
  signature: 'matchExpressions: list[azure.mgmt.containerservice.types.LabelSelectorRequirement]'
- uid: azure.mgmt.containerservice.types.LabelSelector.matchLabels
  name: matchLabels
  summary: 'matchLabels is an array of {key=value} pairs. A single {key=value} in
    the matchLabels map is

    equivalent to an element of matchExpressions, whose key field is `key`, the operator
    is

    `In`, and the values array contains only `value`. The requirements are ANDed.'
  signature: 'matchLabels: list[str]'
