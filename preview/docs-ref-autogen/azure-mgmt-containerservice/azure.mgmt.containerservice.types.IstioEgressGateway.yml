### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.IstioEgressGateway
name: IstioEgressGateway
fullName: azure.mgmt.containerservice.types.IstioEgressGateway
module: azure.mgmt.containerservice.types
summary: Istio egress gateway configuration.
constructor:
  syntax: IstioEgressGateway()
variables:
- description: Whether to enable the egress gateway. Required.
  name: enabled
  types:
  - <xref:bool>
- description: Name of the Istio add-on egress gateway. Required.
  name: name
  types:
  - <xref:str>
- description: 'Namespace that the Istio add-on egress gateway should be deployed
    in. If

    unspecified, the default is aks-istio-egress.'
  name: namespace
  types:
  - <xref:str>
- description: 'Name of the gateway configuration custom resource for the Istio

    add-on egress gateway. Must be specified when enabling the Istio egress gateway.
    Must be

    deployed in the same namespace that the Istio egress gateway will be deployed
    in.'
  name: gatewayConfigurationName
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerservice.types.IstioEgressGateway.enabled
  name: enabled
  summary: Whether to enable the egress gateway. Required.
  signature: 'enabled: bool'
- uid: azure.mgmt.containerservice.types.IstioEgressGateway.gatewayConfigurationName
  name: gatewayConfigurationName
  summary: 'Name of the gateway configuration custom resource for the Istio add-on
    egress gateway. Must be

    specified when enabling the Istio egress gateway. Must be deployed in the same
    namespace that

    the Istio egress gateway will be deployed in.'
  signature: 'gatewayConfigurationName: str'
- uid: azure.mgmt.containerservice.types.IstioEgressGateway.name
  name: name
  summary: Name of the Istio add-on egress gateway. Required.
  signature: 'name: str'
- uid: azure.mgmt.containerservice.types.IstioEgressGateway.namespace
  name: namespace
  summary: 'Namespace that the Istio add-on egress gateway should be deployed in.
    If unspecified, the

    default is aks-istio-egress.'
  signature: 'namespace: str'
