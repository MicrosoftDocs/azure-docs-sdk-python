### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.MaintenanceConfigurationProperties
name: MaintenanceConfigurationProperties
fullName: azure.mgmt.containerservice.types.MaintenanceConfigurationProperties
module: azure.mgmt.containerservice.types
summary: Properties used to configure planned maintenance for a Managed Cluster.
constructor:
  syntax: MaintenanceConfigurationProperties()
variables:
- description: 'Time slots during the week when planned maintenance is allowed to
    proceed.

    If two array entries specify the same day of the week, the applied configuration
    is the union

    of times in both entries.'
  name: time_in_week
  types:
  - <xref:list>[<xref:"TimeInWeek">]
- description: Time slots on which upgrade is not allowed.
  name: not_allowed_time
  types:
  - <xref:list>[<xref:"TimeSpan">]
- description: "The fully qualified resource ID of the maintenance window that\nthis\
    \ maintenance configuration is linked to. When set, the schedule is derived read-only\
    \ from\nthe linked maintenance window \u2014 maintenanceWindow becomes a computed\
    \ field. When absent (the\ndefault), the schedule is defined inline via the maintenanceWindow\
    \ property. The caller must\nhave read access to the target maintenance window."
  name: maintenance_window_id
  types:
  - <xref:str>
- description: Maintenance window for the maintenance configuration.
  name: maintenance_window
  types:
  - <xref:<xref:"MaintenanceWindow">>
attributes:
- uid: azure.mgmt.containerservice.types.MaintenanceConfigurationProperties.maintenanceWindow
  name: maintenanceWindow
  summary: Maintenance window for the maintenance configuration.
  signature: 'maintenanceWindow: MaintenanceWindow'
- uid: azure.mgmt.containerservice.types.MaintenanceConfigurationProperties.maintenanceWindowId
  name: maintenanceWindowId
  summary: "The fully qualified resource ID of the maintenance window that this maintenance\
    \ configuration\nis linked to. When set, the schedule is derived read-only from\
    \ the linked maintenance window \u2014\nmaintenanceWindow becomes a computed field.\
    \ When absent (the default), the schedule is defined\ninline via the maintenanceWindow\
    \ property. The caller must have read access to the target\nmaintenance window."
  signature: 'maintenanceWindowId: str'
- uid: azure.mgmt.containerservice.types.MaintenanceConfigurationProperties.notAllowedTime
  name: notAllowedTime
  summary: Time slots on which upgrade is not allowed.
  signature: 'notAllowedTime: list[azure.mgmt.containerservice.types.TimeSpan]'
- uid: azure.mgmt.containerservice.types.MaintenanceConfigurationProperties.timeInWeek
  name: timeInWeek
  summary: 'Time slots during the week when planned maintenance is allowed to proceed.
    If two array entries

    specify the same day of the week, the applied configuration is the union of times
    in both

    entries.'
  signature: 'timeInWeek: list[azure.mgmt.containerservice.types.TimeInWeek]'
