### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.MaintenanceWindowResourceProperties
name: MaintenanceWindowResourceProperties
fullName: azure.mgmt.containerservice.types.MaintenanceWindowResourceProperties
module: azure.mgmt.containerservice.types
summary: 'Properties of a maintenance window. For more information, see

  [https://aka.ms/aks/maintenance-windows](https://aka.ms/aks/maintenance-windows).'
constructor:
  syntax: MaintenanceWindowResourceProperties()
variables:
- description: 'The provisioning state of the maintenance window. Known values are:

    "Succeeded", "Failed", and "Canceled".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceProvisioningState">]
- description: 'Recurrence schedule for the maintenance window. One and only one of
    the

    schedule types should be specified: ''daily'', ''weekly'', ''absoluteMonthly'',
    or ''relativeMonthly''.

    Required.'
  name: schedule
  types:
  - <xref:<xref:"Schedule">>
- description: 'The date the maintenance window activates. If the current date is
    before this

    date, the maintenance window is inactive and will not be used. If not specified,
    the

    maintenance window will be active right away.'
  name: start_date
  types:
  - <xref:str>
- description: 'The start time of the maintenance window. Accepted values are from
    ''00:00'' to

    ''23:59''. ''utcOffset'' applies to this field. For example: ''02:00'' with ''utcOffset:
    +02:00'' means

    UTC time ''00:00''. Required.'
  name: start_time
  types:
  - <xref:str>
- description: Length of the maintenance window in hours. Required.
  name: duration_hours
  types:
  - <xref:int>
- description: 'The UTC offset in format +/-HH:mm. For example, ''+05:30'' for IST
    and ''-07:00''

    for PST. If not specified, the default is ''+00:00''. Note: this is a static offset
    and does not

    adjust for Daylight Saving Time. Customers in DST-observing regions should pick
    the offset that

    matches their preferred wall-clock time year-round; the maintenance window will
    shift by one

    hour relative to local time when DST starts or ends.'
  name: utc_offset
  types:
  - <xref:str>
- description: 'Date ranges during which maintenance is not allowed. ''utcOffset''

    applies to these dates. For example, with ''utcOffset: +02:00'' and a date span
    of ''2026-12-23''

    to ''2027-01-03'', maintenance will be blocked from ''2026-12-22 22:00'' to ''2027-01-03
    22:00'' in

    UTC time.'
  name: not_allowed_dates
  types:
  - <xref:list>[<xref:"DateSpan">]
attributes:
- uid: azure.mgmt.containerservice.types.MaintenanceWindowResourceProperties.durationHours
  name: durationHours
  summary: Length of the maintenance window in hours. Required.
  signature: 'durationHours: Required[int]'
- uid: azure.mgmt.containerservice.types.MaintenanceWindowResourceProperties.notAllowedDates
  name: notAllowedDates
  summary: 'Date ranges during which maintenance is not allowed. ''utcOffset'' applies
    to these dates. For

    example, with ''utcOffset: +02:00'' and a date span of ''2026-12-23'' to ''2027-01-03'',
    maintenance

    will be blocked from ''2026-12-22 22:00'' to ''2027-01-03 22:00'' in UTC time.'
  signature: 'notAllowedDates: list[''DateSpan'']'
- uid: azure.mgmt.containerservice.types.MaintenanceWindowResourceProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    and "Canceled".'
  signature: 'provisioningState: str | ResourceProvisioningState'
- uid: azure.mgmt.containerservice.types.MaintenanceWindowResourceProperties.schedule
  name: schedule
  summary: 'Recurrence schedule for the maintenance window. One and only one of the
    schedule types should

    be specified: ''daily'', ''weekly'', ''absoluteMonthly'', or ''relativeMonthly''.
    Required.'
  signature: 'schedule: Required[Schedule]'
- uid: azure.mgmt.containerservice.types.MaintenanceWindowResourceProperties.startDate
  name: startDate
  summary: 'The date the maintenance window activates. If the current date is before
    this date, the

    maintenance window is inactive and will not be used. If not specified, the maintenance
    window

    will be active right away.'
  signature: 'startDate: str'
- uid: azure.mgmt.containerservice.types.MaintenanceWindowResourceProperties.startTime
  name: startTime
  summary: '59''.

    ''utcOffset'' applies to this field. For example: ''02:00'' with ''utcOffset:
    +02:00'' means UTC time

    ''00:00''. Required.'
  signature: 'startTime: Required[str]'
- uid: azure.mgmt.containerservice.types.MaintenanceWindowResourceProperties.utcOffset
  name: utcOffset
  summary: '30'' for IST and ''-07:00'' for PST. If not

    specified, the default is ''+00:00''. Note: this is a static offset and does not
    adjust for

    Daylight Saving Time. Customers in DST-observing regions should pick the offset
    that matches

    their preferred wall-clock time year-round; the maintenance window will shift
    by one hour

    relative to local time when DST starts or ends.'
  signature: 'utcOffset: str'
