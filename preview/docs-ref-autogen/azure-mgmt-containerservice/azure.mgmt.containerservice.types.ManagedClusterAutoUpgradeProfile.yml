### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterAutoUpgradeProfile
name: ManagedClusterAutoUpgradeProfile
fullName: azure.mgmt.containerservice.types.ManagedClusterAutoUpgradeProfile
module: azure.mgmt.containerservice.types
summary: Auto upgrade profile for a managed cluster.
constructor:
  syntax: ManagedClusterAutoUpgradeProfile()
variables:
- description: 'The upgrade channel for auto upgrade. The default is ''none''. For
    more

    information see [setting the AKS cluster auto-upgrade channel](https://docs.microsoft.com/azure/aks/upgrade-cluster#set-auto-upgrade-channel).
    Known values

    are: "rapid", "stable", "patch", "node-image", and "none".'
  name: upgradeChannel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UpgradeChannel">]
- description: 'Node OS Upgrade Channel. Manner in which the OS on your nodes is

    updated. The default is NodeImage. Known values are: "None", "Unmanaged", "NodeImage",
    and

    "SecurityPatch".'
  name: nodeOSUpgradeChannel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NodeOSUpgradeChannel">]
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterAutoUpgradeProfile.nodeOSUpgradeChannel
  name: nodeOSUpgradeChannel
  summary: 'Node OS Upgrade Channel. Manner in which the OS on your nodes is updated.
    The default is

    NodeImage. Known values are: "None", "Unmanaged", "NodeImage", and "SecurityPatch".'
  signature: 'nodeOSUpgradeChannel: str | NodeOSUpgradeChannel'
- uid: azure.mgmt.containerservice.types.ManagedClusterAutoUpgradeProfile.upgradeChannel
  name: upgradeChannel
  summary: 'The upgrade channel for auto upgrade. The default is ''none''. For more
    information see [setting

    the AKS cluster auto-upgrade channel](https://docs.microsoft.com/azure/aks/upgrade-cluster#set-auto-upgrade-channel).
    Known values

    are: "rapid", "stable", "patch", "node-image", and "none".'
  signature: 'upgradeChannel: str | UpgradeChannel'
