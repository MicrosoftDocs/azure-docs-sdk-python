### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.LoadBalancerProperties
name: LoadBalancerProperties
fullName: azure.mgmt.containerservice.types.LoadBalancerProperties
module: azure.mgmt.containerservice.types
summary: Properties for a load balancer resource.
constructor:
  syntax: LoadBalancerProperties()
variables:
- description: 'Required field. A string value that must specify the ID of an

    existing agent pool. All nodes in the given pool will always be added to this
    load balancer.

    This agent pool must have at least one node and minCount>=1 for autoscaling operations.
    An

    agent pool can only be the primary pool for a single load balancer. Required.'
  name: primaryAgentPoolName
  types:
  - <xref:str>
- description: 'Whether to automatically place services on the load balancer. If

    not supplied, the default value is true. If set to false manually, both of the
    external and the

    internal load balancer will not be selected for services unless they explicitly
    target it.'
  name: allowServicePlacement
  types:
  - <xref:bool>
- description: 'Only services that must match this selector can be placed on this

    load balancer.'
  name: serviceLabelSelector
  types:
  - <xref:<xref:"LabelSelector">>
- description: 'Services created in namespaces that match the selector can be

    placed on this load balancer.'
  name: serviceNamespaceSelector
  types:
  - <xref:<xref:"LabelSelector">>
- description: 'Nodes that match this selector will be possible members of this load

    balancer.'
  name: nodeSelector
  types:
  - <xref:<xref:"LabelSelector">>
- description: The current provisioning state.
  name: provisioningState
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerservice.types.LoadBalancerProperties.allowServicePlacement
  name: allowServicePlacement
  summary: 'Whether to automatically place services on the load balancer. If not supplied,
    the default

    value is true. If set to false manually, both of the external and the internal
    load balancer

    will not be selected for services unless they explicitly target it.'
  signature: 'allowServicePlacement: bool'
- uid: azure.mgmt.containerservice.types.LoadBalancerProperties.nodeSelector
  name: nodeSelector
  summary: Nodes that match this selector will be possible members of this load balancer.
  signature: 'nodeSelector: LabelSelector'
- uid: azure.mgmt.containerservice.types.LoadBalancerProperties.primaryAgentPoolName
  name: primaryAgentPoolName
  summary: 'Required field. A string value that must specify the ID of an existing
    agent pool. All nodes in

    the given pool will always be added to this load balancer. This agent pool must
    have at least

    one node and minCount>=1 for autoscaling operations. An agent pool can only be
    the primary pool

    for a single load balancer. Required.'
  signature: 'primaryAgentPoolName: str'
- uid: azure.mgmt.containerservice.types.LoadBalancerProperties.provisioningState
  name: provisioningState
  summary: The current provisioning state.
  signature: 'provisioningState: str'
- uid: azure.mgmt.containerservice.types.LoadBalancerProperties.serviceLabelSelector
  name: serviceLabelSelector
  summary: Only services that must match this selector can be placed on this load
    balancer.
  signature: 'serviceLabelSelector: LabelSelector'
- uid: azure.mgmt.containerservice.types.LoadBalancerProperties.serviceNamespaceSelector
  name: serviceNamespaceSelector
  summary: Services created in namespaces that match the selector can be placed on
    this load balancer.
  signature: 'serviceNamespaceSelector: LabelSelector'
