### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryMetrics
name: ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryMetrics
fullName: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryMetrics
module: azure.mgmt.containerservice.types
summary: 'Application Monitoring Open Telemetry Metrics Profile for AKS. Collects
  OpenTelemetry metrics

  of the application using Azure Monitor OpenTelemetry based SDKs. See

  [https://aka.ms/AKSAppMonitoringDocs](https://aka.ms/AKSAppMonitoringDocs) and

  [https://aka.ms/AzureMonitorApplicationMonitoring](https://aka.ms/AzureMonitorApplicationMonitoring)
  for an overview.'
constructor:
  syntax: ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryMetrics()
variables:
- description: Indicates if Application Monitoring Open Telemetry Metrics is enabled
    or not.
  name: enabled
  types:
  - <xref:bool>
- description: 'The host port for Open Telemetry HTTP/PROTOBUF metrics. If not specified,
    the

    default port is 28333.'
  name: http_port
  types:
  - <xref:int>
- description: 'The host port for Open Telemetry GRPC metrics. If not specified, the
    default

    port is 28334.'
  name: grpc_port
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryMetrics.enabled
  name: enabled
  summary: Indicates if Application Monitoring Open Telemetry Metrics is enabled or
    not.
  signature: 'enabled: bool'
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryMetrics.grpcPort
  name: grpcPort
  summary: The host port for Open Telemetry GRPC metrics. If not specified, the default
    port is 28334.
  signature: 'grpcPort: int'
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryMetrics.httpPort
  name: httpPort
  summary: 'The host port for Open Telemetry HTTP/PROTOBUF metrics. If not specified,
    the default port is

    28333.'
  signature: 'httpPort: int'
