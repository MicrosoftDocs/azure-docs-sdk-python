uid: azure.mgmt.containerservice.types.PortRange
name: PortRange
fullName: azure.mgmt.containerservice.types.PortRange
module: azure.mgmt.containerservice.types
summary: The port range.
constructor:
  syntax: PortRange()
variables:
- description: 'The minimum port that is included in the range. It should be ranged
    from 1 to

    65535, and be less than or equal to portEnd.'
  name: portStart
  types:
  - <xref:int>
- description: 'The maximum port that is included in the range. It should be ranged
    from 1 to

    65535, and be greater than or equal to portStart.'
  name: portEnd
  types:
  - <xref:int>
- description: 'The network protocol of the port. Known values are: "TCP" and "UDP".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Protocol">]
attributes:
- uid: azure.mgmt.containerservice.types.PortRange.portEnd
  name: portEnd
  summary: 'The maximum port that is included in the range. It should be ranged from
    1 to 65535, and be

    greater than or equal to portStart.'
  signature: 'portEnd: int'
- uid: azure.mgmt.containerservice.types.PortRange.portStart
  name: portStart
  summary: 'The minimum port that is included in the range. It should be ranged from
    1 to 65535, and be

    less than or equal to portEnd.'
  signature: 'portStart: int'
- uid: azure.mgmt.containerservice.types.PortRange.protocol
  name: protocol
  summary: '"TCP" and "UDP".'
  signature: 'protocol: str | Protocol'
