### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.TimeInWeek
name: TimeInWeek
fullName: azure.mgmt.containerservice.types.TimeInWeek
module: azure.mgmt.containerservice.types
summary: Time in a week.
constructor:
  syntax: TimeInWeek()
variables:
- description: 'The day of the week. Known values are: "Sunday", "Monday", "Tuesday",
    "Wednesday",

    "Thursday", "Friday", and "Saturday".'
  name: day
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WeekDay">]
- description: 'A list of hours in the day used to identify a time range. Each integer
    hour

    represents a time range beginning at 0m after the hour ending at the next hour
    (non-inclusive).

    0 corresponds to 00:00 UTC, 23 corresponds to 23:00 UTC. Specifying [0, 1] means
    the 00:00 -

    02:00 UTC time range.'
  name: hourSlots
  types:
  - <xref:list>[<xref:int>]
attributes:
- uid: azure.mgmt.containerservice.types.TimeInWeek.day
  name: day
  summary: '"Sunday", "Monday", "Tuesday", "Wednesday",

    "Thursday", "Friday", and "Saturday".'
  signature: 'day: str | WeekDay'
- uid: azure.mgmt.containerservice.types.TimeInWeek.hourSlots
  name: hourSlots
  summary: 'A list of hours in the day used to identify a time range. Each integer
    hour represents a time

    range beginning at 0m after the hour ending at the next hour (non-inclusive).
    0 corresponds to

    00:00 UTC, 23 corresponds to 23:00 UTC. Specifying [0, 1] means the 00:00 - 02:00
    UTC time

    range.'
  signature: 'hourSlots: list[int]'
