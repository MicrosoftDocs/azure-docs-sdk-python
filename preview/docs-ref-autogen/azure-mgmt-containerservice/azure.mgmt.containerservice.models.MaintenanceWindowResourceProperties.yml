    example, with ''utcOffset: +02:00'' and a date span of ''2026-12-23'' to ''2027-01-03'',
    maintenance

    will be blocked from ''2026-12-22 22:00'' to ''2027-01-03 22:00'' in UTC time.'
  signature: 'not_allowed_dates: list[''_models.DateSpan''] | None'
- uid: azure.mgmt.containerservice.models.MaintenanceWindowResourceProperties.provisioning_state
  name: provisioning_state
  summary: '"Succeeded", "Failed",

    and "Canceled".'
  signature: 'provisioning_state: str | _models.ResourceProvisioningState | None'
