### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.JWTAuthenticatorProperties
name: JWTAuthenticatorProperties
fullName: azure.mgmt.containerservice.types.JWTAuthenticatorProperties
module: azure.mgmt.containerservice.types
summary: 'The properties of JWTAuthenticator. For details on how to configure the
  properties of a JWT

  authenticator, please refer to the Kubernetes documentation:

  [https://kubernetes.io/docs/reference/access-authn-authz/authentication/#using-authentication-configuration](https://kubernetes.io/docs/reference/access-authn-authz/authentication/#using-authentication-configuration).

  Please note that not all fields available in the Kubernetes documentation are supported
  by AKS.

  For troubleshooting, please see [https://aka.ms/aks-external-issuers-docs](https://aka.ms/aks-external-issuers-docs).'
constructor:
  syntax: JWTAuthenticatorProperties()
variables:
- description: 'The current provisioning state of the JWT authenticator. Known values

    are: "Succeeded", "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"JWTAuthenticatorProvisioningState">]
- description: The JWT OIDC issuer details. Required.
  name: issuer
  types:
  - <xref:<xref:"JWTAuthenticatorIssuer">>
- description: 'The rules that are applied to validate token claims to authenticate

    users. All the expressions must evaluate to true for validation to succeed.'
  name: claimValidationRules
  types:
  - <xref:list>[<xref:"JWTAuthenticatorValidationRule">]
- description: 'The mappings that define how user attributes are extracted from the
    token

    claims. Required.'
  name: claimMappings
  types:
  - <xref:<xref:"JWTAuthenticatorClaimMappings">>
- description: 'The rules that are applied to the mapped user before completing

    authentication. All the expressions must evaluate to true for validation to succeed.'
  name: userValidationRules
  types:
  - <xref:list>[<xref:"JWTAuthenticatorValidationRule">]
- description: 'PEM-encoded CA certificate bundle used to validate the

    connection when fetching discovery information. Use this for issuer endpoints
    that use private

    certificate authorities

    or environments where TLS inspection is performed.


    The bundle must contain only CERTIFICATE PEM blocks, up to 10 CA certificates,
    and must be no

    larger than 20 KB in total. Include all CA certificates needed to validate

    the issuer endpoint''s TLS certificate. Certificate revocation checking is not
    supported.


    If provided, only these CAs are trusted instead of the well-known root CAs.

    If not provided and the managed cluster''s properties.securityProfile.customCATrustCertificates

    is set, those certificates will be used instead. Otherwise, only the well-known

    root CAs are trusted.'
  name: certificateAuthorityBundle
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerservice.types.JWTAuthenticatorProperties.certificateAuthorityBundle
  name: certificateAuthorityBundle
  summary: 'PEM-encoded CA certificate bundle used to validate the connection when
    fetching discovery

    information. Use this for issuer endpoints that use private certificate authorities

    or environments where TLS inspection is performed.


    The bundle must contain only CERTIFICATE PEM blocks, up to 10 CA certificates,
    and must be no

    larger than 20 KB in total. Include all CA certificates needed to validate

    the issuer endpoint''s TLS certificate. Certificate revocation checking is not
    supported.


    If provided, only these CAs are trusted instead of the well-known root CAs.

    If not provided and the managed cluster''s properties.securityProfile.customCATrustCertificates

    is set, those certificates will be used instead. Otherwise, only the well-known

    root CAs are trusted.'
  signature: 'certificateAuthorityBundle: str'
- uid: azure.mgmt.containerservice.types.JWTAuthenticatorProperties.claimMappings
  name: claimMappings
  summary: The mappings that define how user attributes are extracted from the token
    claims. Required.
  signature: 'claimMappings: Required[JWTAuthenticatorClaimMappings]'
- uid: azure.mgmt.containerservice.types.JWTAuthenticatorProperties.claimValidationRules
  name: claimValidationRules
  summary: 'The rules that are applied to validate token claims to authenticate users.
    All the expressions

    must evaluate to true for validation to succeed.'
  signature: 'claimValidationRules: list[''JWTAuthenticatorValidationRule'']'
- uid: azure.mgmt.containerservice.types.JWTAuthenticatorProperties.issuer
  name: issuer
  summary: The JWT OIDC issuer details. Required.
  signature: 'issuer: Required[JWTAuthenticatorIssuer]'
- uid: azure.mgmt.containerservice.types.JWTAuthenticatorProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | JWTAuthenticatorProvisioningState'
- uid: azure.mgmt.containerservice.types.JWTAuthenticatorProperties.userValidationRules
  name: userValidationRules
  summary: 'The rules that are applied to the mapped user before completing authentication.
    All the

    expressions must evaluate to true for validation to succeed.'
  signature: 'userValidationRules: list[''JWTAuthenticatorValidationRule'']'
