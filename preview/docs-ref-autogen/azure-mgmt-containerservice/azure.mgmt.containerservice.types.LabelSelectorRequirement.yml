### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.LabelSelectorRequirement
name: LabelSelectorRequirement
fullName: azure.mgmt.containerservice.types.LabelSelectorRequirement
module: azure.mgmt.containerservice.types
summary: 'A label selector requirement is a selector that contains values, a key,
  and an operator that

  relates the key and values.'
constructor:
  syntax: LabelSelectorRequirement()
variables:
- description: key is the label key that the selector applies to.
  name: key
  types:
  - <xref:str>
- description: 'operator represents a key''s relationship to a set of values. Valid
    operators

    are In and NotIn. Known values are: "In", "NotIn", "Exists", and "DoesNotExist".'
  name: operator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Operator">]
- description: values is an array of string values, the values array must be non-empty.
  name: values_property
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.containerservice.types.LabelSelectorRequirement.key
  name: key
  summary: key is the label key that the selector applies to.
  signature: 'key: str'
- uid: azure.mgmt.containerservice.types.LabelSelectorRequirement.operator
  name: operator
  summary: 'operator represents a key''s relationship to a set of values. Valid operators
    are In and NotIn.

    Known values are: "In", "NotIn", "Exists", and "DoesNotExist".'
  signature: 'operator: str | Operator'
