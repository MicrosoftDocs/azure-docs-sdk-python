### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.MachineNetworkProperties
name: MachineNetworkProperties
fullName: azure.mgmt.containerservice.types.MachineNetworkProperties
module: azure.mgmt.containerservice.types
summary: network properties of the machine.
constructor:
  syntax: MachineNetworkProperties()
variables:
- description: IPv4, IPv6 addresses of the machine.
  name: ip_addresses
  types:
  - <xref:list>[<xref:"MachineIpAddress">]
- description: 'The ID of the subnet which node and optionally pods will join on startup.

    If this is not specified, a VNET and subnet will be generated and used. If no
    podSubnetID is

    specified, this applies to nodes and pods, otherwise it applies to just nodes.
    This is of the

    form:

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/virtualNetworks/{virtualNetworkName}/subnets/{subnetName}.'
  name: vnet_subnet_id
  types:
  - <xref:str>
- description: 'The ID of the subnet which pods will join when launched. If omitted,
    pod

    IPs are statically assigned on the node subnet (see vnetSubnetID for more details).
    This is of

    the form:

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/virtualNetworks/{virtualNetworkName}/subnets/{subnetName}.'
  name: pod_subnet_id
  types:
  - <xref:str>
- description: 'Whether the machine is allocated its own public IP. Some scenarios

    may require the machine to receive their own dedicated public IP addresses. A
    common scenario

    is for gaming workloads, where a console needs to make a direct connection to
    a cloud virtual

    machine to minimize hops. The default is false.'
  name: enable_node_public_ip
  types:
  - <xref:bool>
- description: 'The public IP prefix ID which VM node should use IPs from. This

    is of the form:

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/publicIPPrefixes/{publicIPPrefixName}.'
  name: node_public_ip_prefix_id
  types:
  - <xref:str>
- description: IPTags of instance-level public IPs.
  name: node_public_ip_tags
  types:
  - <xref:list>[<xref:"IPTag">]
attributes:
- uid: azure.mgmt.containerservice.types.MachineNetworkProperties.enableNodePublicIP
  name: enableNodePublicIP
  summary: 'Whether the machine is allocated its own public IP. Some scenarios may
    require the machine to

    receive their own dedicated public IP addresses. A common scenario is for gaming
    workloads,

    where a console needs to make a direct connection to a cloud virtual machine to
    minimize hops.

    The default is false.'
  signature: 'enableNodePublicIP: bool'
- uid: azure.mgmt.containerservice.types.MachineNetworkProperties.ipAddresses
  name: ipAddresses
  summary: IPv4, IPv6 addresses of the machine.
  signature: 'ipAddresses: list[azure.mgmt.containerservice.types.MachineIpAddress]'
- uid: azure.mgmt.containerservice.types.MachineNetworkProperties.nodePublicIPPrefixID
  name: nodePublicIPPrefixID
  summary: 'The public IP prefix ID which VM node should use IPs from. This is of
    the form:

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/publicIPPrefixes/{publicIPPrefixName}.'
  signature: 'nodePublicIPPrefixID: str'
- uid: azure.mgmt.containerservice.types.MachineNetworkProperties.nodePublicIPTags
  name: nodePublicIPTags
  summary: IPTags of instance-level public IPs.
  signature: 'nodePublicIPTags: list[azure.mgmt.containerservice.types.IPTag]'
- uid: azure.mgmt.containerservice.types.MachineNetworkProperties.podSubnetID
  name: podSubnetID
  summary: 'The ID of the subnet which pods will join when launched. If omitted, pod
    IPs are statically

    assigned on the node subnet (see vnetSubnetID for more details). This is of the
    form:

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/virtualNetworks/{virtualNetworkName}/subnets/{subnetName}.'
  signature: 'podSubnetID: str'
- uid: azure.mgmt.containerservice.types.MachineNetworkProperties.vnetSubnetID
  name: vnetSubnetID
  summary: 'The ID of the subnet which node and optionally pods will join on startup.
    If this is not

    specified, a VNET and subnet will be generated and used. If no podSubnetID is
    specified, this

    applies to nodes and pods, otherwise it applies to just nodes. This is of the
    form:

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/virtualNetworks/{virtualNetworkName}/subnets/{subnetName}.'
  signature: 'vnetSubnetID: str'
