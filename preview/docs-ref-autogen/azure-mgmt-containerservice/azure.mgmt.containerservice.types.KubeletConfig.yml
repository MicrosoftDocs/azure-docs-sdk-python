### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.KubeletConfig
name: KubeletConfig
fullName: azure.mgmt.containerservice.types.KubeletConfig
module: azure.mgmt.containerservice.types
summary: Kubelet configurations of agent nodes. See [AKS custom node configuration](https://docs.microsoft.com/azure/aks/custom-node-configuration)
  for more details.
constructor:
  syntax: KubeletConfig()
variables:
- description: 'The CPU Manager policy to use. The default is ''none''. See [Kubernetes

    CPU management policies](https://kubernetes.io/docs/tasks/administer-cluster/cpu-management-policies/#cpu-management-policies)

    for more information. Allowed values are ''none'' and ''static''.'
  name: cpuManagerPolicy
  types:
  - <xref:str>
- description: 'If CPU CFS quota enforcement is enabled for containers that specify
    CPU

    limits. The default is true.'
  name: cpuCfsQuota
  types:
  - <xref:bool>
- description: 'The CPU CFS quota period value. The default is ''100ms.'' Valid values

    are a sequence of decimal numbers with an optional fraction and a unit suffix.
    For example:

    ''300ms'', ''2h45m''. Supported units are ''ns'', ''us'', ''ms'', ''s'', ''m'',
    and ''h''.'
  name: cpuCfsQuotaPeriod
  types:
  - <xref:str>
- description: 'The percent of disk usage after which image garbage collection is

    always run. To disable image garbage collection, set to 100. The default is 85%.'
  name: imageGcHighThreshold
  types:
  - <xref:int>
- description: 'The percent of disk usage before which image garbage collection is

    never run. This cannot be set higher than imageGcHighThreshold. The default is
    80%.'
  name: imageGcLowThreshold
  types:
  - <xref:int>
- description: 'The Topology Manager policy to use. For more information see

    [Kubernetes Topology Manager](https://kubernetes.io/docs/tasks/administer-cluster/topology-manager).
    The default is

    ''none''. Allowed values are ''none'', ''best-effort'', ''restricted'', and ''single-numa-node''.'
  name: topologyManagerPolicy
  types:
  - <xref:str>
- description: 'Allowed list of unsafe sysctls or unsafe sysctl patterns (ending in

    `*`).'
  name: allowedUnsafeSysctls
  types:
  - <xref:list>[<xref:str>]
- description: 'If set to true it will make the Kubelet fail to start if swap is enabled
    on

    the node.'
  name: failSwapOn
  types:
  - <xref:bool>
- description: 'The maximum size (e.g. 10Mi) of container log file before it is

    rotated.'
  name: containerLogMaxSizeMB
  types:
  - <xref:int>
- description: "The maximum number of container log files that can be present for\
    \ a\ncontainer. The number must be \u2265 2."
  name: containerLogMaxFiles
  types:
  - <xref:int>
- description: The maximum number of processes per pod.
  name: podMaxPids
  types:
  - <xref:int>
- description: 'Specifies the default seccomp profile applied to all workloads. If
    not

    specified, ''Unconfined'' will be used by default. Known values are: "Unconfined"
    and

    "RuntimeDefault".'
  name: seccompDefault
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SeccompDefault">]
- description: 'Kube-reserved values for kubelet. When a value is not set, the

    system-computed default based on VM size is used. See [AKS node resource reservations](https://aka.ms/aks/nodereservations)
    for details on computed defaults. Only applicable for

    Linux nodepools.'
  name: kubeReserved
  types:
  - <xref:<xref:"KubeReserved">>
- description: 'Hard eviction thresholds for kubelet. When a threshold is not set,

    the system default is used. See [AKS node resource reservations](https://aka.ms/aks/nodereservations)
    for details on computed defaults. Only applicable for

    Linux nodepools.'
  name: hardEvictionThreshold
  types:
  - <xref:<xref:"HardEvictionThreshold">>
- description: 'Soft eviction thresholds for kubelet. When crossed, pods are

    evicted after the paired softEvictionGracePeriod. System defaults apply when the
    cluster''s

    `enableNodeHardening` property is true; otherwise no soft eviction is configured.
    For each

    signal (memoryAvailable, nodeFsAvailable, nodeFsInodesFree), the entries in

    softEvictionThreshold and softEvictionGracePeriod must be in the same state: both
    omitted

    (default), both non-empty (override), or both empty strings (opt that signal out).
    Only

    applicable for Linux nodepools. See

    [https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#soft-eviction-thresholds](https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#soft-eviction-thresholds).'
  name: softEvictionThreshold
  types:
  - <xref:<xref:"SoftEvictionThreshold">>
- description: "Grace periods for soft eviction signals \u2014 how long a threshold\n\
    must be held before pod eviction. Same defaulting and pairing rules as softEvictionThreshold.\n\
    Values are Go-style duration strings (e.g. '1m30s'); supported units are 'ns',\
    \ 'us', 'ms', 's',\n'm', and 'h'. Only applicable for Linux nodepools."
  name: softEvictionGracePeriod
  types:
  - <xref:<xref:"SoftEvictionGracePeriod">>
- description: 'Maximum grace period, in seconds, for pods to

    terminate during a soft eviction; caps the pod''s terminationGracePeriodSeconds.
    Default is 60,

    applied when the cluster''s `enableNodeHardening` property is true. Only applicable
    for Linux

    nodepools.'
  name: evictionMaxPodGracePeriodInSeconds
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.containerservice.types.KubeletConfig.allowedUnsafeSysctls
  name: allowedUnsafeSysctls
  summary: Allowed list of unsafe sysctls or unsafe sysctl patterns (ending in `*`).
  signature: 'allowedUnsafeSysctls: list[str]'
- uid: azure.mgmt.containerservice.types.KubeletConfig.containerLogMaxFiles
  name: containerLogMaxFiles
  summary: "The maximum number of container log files that can be present for a container.\
    \ The number must\nbe \u2265 2."
  signature: 'containerLogMaxFiles: int'
- uid: azure.mgmt.containerservice.types.KubeletConfig.containerLogMaxSizeMB
  name: containerLogMaxSizeMB
  summary: The maximum size (e.g. 10Mi) of container log file before it is rotated.
  signature: 'containerLogMaxSizeMB: int'
- uid: azure.mgmt.containerservice.types.KubeletConfig.cpuCfsQuota
  name: cpuCfsQuota
  summary: 'If CPU CFS quota enforcement is enabled for containers that specify CPU
    limits. The default is

    true.'
  signature: 'cpuCfsQuota: bool'
- uid: azure.mgmt.containerservice.types.KubeletConfig.cpuCfsQuotaPeriod
  name: cpuCfsQuotaPeriod
  summary: 'The CPU CFS quota period value. The default is ''100ms.'' Valid values
    are a sequence of decimal

    numbers with an optional fraction and a unit suffix. For example: ''300ms'', ''2h45m''.
    Supported

    units are ''ns'', ''us'', ''ms'', ''s'', ''m'', and ''h''.'
  signature: 'cpuCfsQuotaPeriod: str'
- uid: azure.mgmt.containerservice.types.KubeletConfig.cpuManagerPolicy
  name: cpuManagerPolicy
  summary: 'The CPU Manager policy to use. The default is ''none''. See [Kubernetes
    CPU management policies](https://kubernetes.io/docs/tasks/administer-cluster/cpu-management-policies/#cpu-management-policies)

    for more information. Allowed values are ''none'' and ''static''.'
  signature: 'cpuManagerPolicy: str'
- uid: azure.mgmt.containerservice.types.KubeletConfig.evictionMaxPodGracePeriodInSeconds
  name: evictionMaxPodGracePeriodInSeconds
  summary: 'Maximum grace period, in seconds, for pods to terminate during a soft
    eviction; caps the pod''s

    terminationGracePeriodSeconds. Default is 60, applied when the cluster''s

    `enableNodeHardening` property is true. Only applicable for Linux nodepools.'
  signature: 'evictionMaxPodGracePeriodInSeconds: int'
- uid: azure.mgmt.containerservice.types.KubeletConfig.failSwapOn
  name: failSwapOn
  summary: If set to true it will make the Kubelet fail to start if swap is enabled
    on the node.
  signature: 'failSwapOn: bool'
- uid: azure.mgmt.containerservice.types.KubeletConfig.hardEvictionThreshold
  name: hardEvictionThreshold
  summary: 'Hard eviction thresholds for kubelet. When a threshold is not set, the
    system default is used.

    See [AKS node resource reservations](https://aka.ms/aks/nodereservations) for
    details on

    computed defaults. Only applicable for Linux nodepools.'
  signature: 'hardEvictionThreshold: HardEvictionThreshold'
- uid: azure.mgmt.containerservice.types.KubeletConfig.imageGcHighThreshold
  name: imageGcHighThreshold
  summary: 'The percent of disk usage after which image garbage collection is always
    run. To disable image

    garbage collection, set to 100. The default is 85%.'
  signature: 'imageGcHighThreshold: int'
- uid: azure.mgmt.containerservice.types.KubeletConfig.imageGcLowThreshold
  name: imageGcLowThreshold
  summary: 'The percent of disk usage before which image garbage collection is never
    run. This cannot be

    set higher than imageGcHighThreshold. The default is 80%.'
  signature: 'imageGcLowThreshold: int'
- uid: azure.mgmt.containerservice.types.KubeletConfig.kubeReserved
  name: kubeReserved
  summary: 'Kube-reserved values for kubelet. When a value is not set, the system-computed
    default based on

    VM size is used. See [AKS node resource reservations](https://aka.ms/aks/nodereservations)

    for details on computed defaults. Only applicable for Linux nodepools.'
  signature: 'kubeReserved: KubeReserved'
- uid: azure.mgmt.containerservice.types.KubeletConfig.podMaxPids
  name: podMaxPids
  summary: The maximum number of processes per pod.
  signature: 'podMaxPids: int'
- uid: azure.mgmt.containerservice.types.KubeletConfig.seccompDefault
  name: seccompDefault
  summary: 'Specifies the default seccomp profile applied to all workloads. If not
    specified, ''Unconfined''

    will be used by default. Known values are: "Unconfined" and "RuntimeDefault".'
  signature: 'seccompDefault: str | SeccompDefault'
- uid: azure.mgmt.containerservice.types.KubeletConfig.softEvictionGracePeriod
  name: softEvictionGracePeriod
  summary: "Grace periods for soft eviction signals \u2014 how long a threshold must\
    \ be held before pod\neviction. Same defaulting and pairing rules as softEvictionThreshold.\
    \ Values are Go-style\nduration strings (e.g. '1m30s'); supported units are 'ns',\
    \ 'us', 'ms', 's', 'm', and 'h'. Only\napplicable for Linux nodepools."
  signature: 'softEvictionGracePeriod: SoftEvictionGracePeriod'
- uid: azure.mgmt.containerservice.types.KubeletConfig.softEvictionThreshold
  name: softEvictionThreshold
  summary: 'Soft eviction thresholds for kubelet. When crossed, pods are evicted after
    the paired

    softEvictionGracePeriod. System defaults apply when the cluster''s `enableNodeHardening`

    property is true; otherwise no soft eviction is configured. For each signal (memoryAvailable,

    nodeFsAvailable, nodeFsInodesFree), the entries in softEvictionThreshold and

    softEvictionGracePeriod must be in the same state: both omitted (default), both
    non-empty

    (override), or both empty strings (opt that signal out). Only applicable for Linux
    nodepools.

    See

    [https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#soft-eviction-thresholds](https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/#soft-eviction-thresholds).'
  signature: 'softEvictionThreshold: SoftEvictionThreshold'
- uid: azure.mgmt.containerservice.types.KubeletConfig.topologyManagerPolicy
  name: topologyManagerPolicy
  summary: 'The Topology Manager policy to use. For more information see [Kubernetes
    Topology Manager](https://kubernetes.io/docs/tasks/administer-cluster/topology-manager).
    The default is

    ''none''. Allowed values are ''none'', ''best-effort'', ''restricted'', and ''single-numa-node''.'
  signature: 'topologyManagerPolicy: str'
