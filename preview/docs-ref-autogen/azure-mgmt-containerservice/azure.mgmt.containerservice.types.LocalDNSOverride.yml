### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.LocalDNSOverride
name: LocalDNSOverride
fullName: azure.mgmt.containerservice.types.LocalDNSOverride
module: azure.mgmt.containerservice.types
summary: Overrides for localDNS profile.
constructor:
  syntax: LocalDNSOverride()
variables:
- description: 'Log level for DNS queries in localDNS. Known values are: "Error" and
    "Log".'
  name: queryLogging
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LocalDNSQueryLogging">]
- description: 'Enforce TCP or prefer UDP protocol for connections from localDNS to
    upstream

    DNS server. Known values are: "PreferUDP" and "ForceTCP".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LocalDNSProtocol">]
- description: 'Destination server for DNS queries to be forwarded from localDNS.

    Known values are: "ClusterCoreDNS" and "VnetDNS".'
  name: forwardDestination
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LocalDNSForwardDestination">]
- description: 'Forward policy for selecting upstream DNS server. See [forward plugin](https://coredns.io/plugins/forward)
    for more information. Known values are: "Sequential",

    "RoundRobin", and "Random".'
  name: forwardPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LocalDNSForwardPolicy">]
- description: Maximum number of concurrent queries. See [forward plugin](https://coredns.io/plugins/forward)
    for more information.
  name: maxConcurrent
  types:
  - <xref:int>
- description: Cache max TTL in seconds. See [cache plugin](https://coredns.io/plugins/cache)
    for more information.
  name: cacheDurationInSeconds
  types:
  - <xref:int>
- description: Serve stale duration in seconds. See [cache plugin](https://coredns.io/plugins/cache)
    for more information.
  name: serveStaleDurationInSeconds
  types:
  - <xref:int>
- description: 'Policy for serving stale data. See [cache plugin](https://coredns.io/plugins/cache)
    for more information. Known values are: "Verify",

    "Immediate", and "Disable".'
  name: serveStale
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LocalDNSServeStale">]
attributes:
- uid: azure.mgmt.containerservice.types.LocalDNSOverride.cacheDurationInSeconds
  name: cacheDurationInSeconds
  summary: '//coredns.io/plugins/cache>`_ for more

    information.'
  signature: 'cacheDurationInSeconds: int'
- uid: azure.mgmt.containerservice.types.LocalDNSOverride.forwardDestination
  name: forwardDestination
  summary: 'Destination server for DNS queries to be forwarded from localDNS. Known
    values are:

    "ClusterCoreDNS" and "VnetDNS".'
  signature: 'forwardDestination: str | LocalDNSForwardDestination'
- uid: azure.mgmt.containerservice.types.LocalDNSOverride.forwardPolicy
  name: forwardPolicy
  summary: 'Forward policy for selecting upstream DNS server. See [forward plugin](https://coredns.io/plugins/forward)
    for more information. Known values are: "Sequential",

    "RoundRobin", and "Random".'
  signature: 'forwardPolicy: str | LocalDNSForwardPolicy'
- uid: azure.mgmt.containerservice.types.LocalDNSOverride.maxConcurrent
  name: maxConcurrent
  summary: Maximum number of concurrent queries. See [forward plugin](https://coredns.io/plugins/forward)
    for more information.
  signature: 'maxConcurrent: int'
- uid: azure.mgmt.containerservice.types.LocalDNSOverride.protocol
  name: protocol
  summary: 'Enforce TCP or prefer UDP protocol for connections from localDNS to upstream
    DNS server. Known

    values are: "PreferUDP" and "ForceTCP".'
  signature: 'protocol: str | LocalDNSProtocol'
- uid: azure.mgmt.containerservice.types.LocalDNSOverride.queryLogging
  name: queryLogging
  summary: '"Error" and "Log".'
  signature: 'queryLogging: str | LocalDNSQueryLogging'
- uid: azure.mgmt.containerservice.types.LocalDNSOverride.serveStale
  name: serveStale
  summary: '//coredns.io/plugins/cache>`_ for more

    information. Known values are: "Verify", "Immediate", and "Disable".'
  signature: 'serveStale: str | LocalDNSServeStale'
- uid: azure.mgmt.containerservice.types.LocalDNSOverride.serveStaleDurationInSeconds
  name: serveStaleDurationInSeconds
  summary: '//coredns.io/plugins/cache>`_ for

    more information.'
  signature: 'serveStaleDurationInSeconds: int'
