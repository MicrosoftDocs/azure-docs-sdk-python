### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.IdentityBindingProperties
name: IdentityBindingProperties
fullName: azure.mgmt.containerservice.types.IdentityBindingProperties
module: azure.mgmt.containerservice.types
summary: IdentityBinding properties.
constructor:
  syntax: IdentityBindingProperties()
variables:
- description: Managed identity profile for the identity binding. Required.
  name: managed_identity
  types:
  - <xref:<xref:"IdentityBindingManagedIdentityProfile">>
- description: The OIDC issuer URL of the IdentityBinding.
  name: oidc_issuer
  types:
  - <xref:<xref:"IdentityBindingOidcIssuerProfile">>
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IdentityBindingProvisioningState">]
- description: 'Optional list of subjects authorized to use this identity binding
    for

    token exchange. Each entry pairs a required namespace label selector with an optional
    service

    account label selector; selectors within an entry are AND''d, and multiple entries
    are OR''d.

    When omitted or empty, authorization falls back exclusively to ClusterRole/ClusterRoleBinding

    evaluation. Maximum 100 entries.'
  name: allowed_subjects
  types:
  - <xref:list>[<xref:"AllowedSubject">]
attributes:
- uid: azure.mgmt.containerservice.types.IdentityBindingProperties.allowedSubjects
  name: allowedSubjects
  summary: 'Optional list of subjects authorized to use this identity binding for
    token exchange. Each

    entry pairs a required namespace label selector with an optional service account
    label

    selector; selectors within an entry are AND''d, and multiple entries are OR''d.
    When omitted or

    empty, authorization falls back exclusively to ClusterRole/ClusterRoleBinding
    evaluation.

    Maximum 100 entries.'
  signature: 'allowedSubjects: list[''AllowedSubject'']'
- uid: azure.mgmt.containerservice.types.IdentityBindingProperties.managedIdentity
  name: managedIdentity
  summary: Managed identity profile for the identity binding. Required.
  signature: 'managedIdentity: Required[IdentityBindingManagedIdentityProfile]'
- uid: azure.mgmt.containerservice.types.IdentityBindingProperties.oidcIssuer
  name: oidcIssuer
  summary: The OIDC issuer URL of the IdentityBinding.
  signature: 'oidcIssuer: IdentityBindingOidcIssuerProfile'
- uid: azure.mgmt.containerservice.types.IdentityBindingProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | IdentityBindingProvisioningState'
