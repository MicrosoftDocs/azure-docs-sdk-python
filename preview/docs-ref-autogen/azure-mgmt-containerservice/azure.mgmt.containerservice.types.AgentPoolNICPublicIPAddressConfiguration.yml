### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.AgentPoolNICPublicIPAddressConfiguration
name: AgentPoolNICPublicIPAddressConfiguration
fullName: azure.mgmt.containerservice.types.AgentPoolNICPublicIPAddressConfiguration
module: azure.mgmt.containerservice.types
summary: 'Public IP configuration applied to a secondary NIC on an agent pool. `ipTags`
  and

  `publicIPPrefixID` are mutually exclusive, matching the primary NIC''s behavior.
  For more

  information, see [https://aka.ms/aks/multi-nic](https://aka.ms/aks/multi-nic).'
constructor:
  syntax: AgentPoolNICPublicIPAddressConfiguration()
variables:
- description: 'IP version of the public IP provisioned for this NIC. Required:

    its presence is what enables public IP provisioning, so an empty configuration
    allocates

    nothing. `IPv4` is the only accepted value. Required. "IPv4"'
  name: publicIPAddressVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AgentPoolNICPublicIPAddressVersion">]
- description: 'IP tags to attach to the public IP allocated for this NIC. Each tag''s

    `ipTagType` must be `FirstPartyUsage`, `NetworkDomain`, or `RoutingPreference`.

    Mutually exclusive with `publicIPPrefixID`.'
  name: ipTags
  types:
  - <xref:list>[<xref:"IPTag">]
- description: 'The resource ID of a public IP prefix to draw this NIC''s public IP

    from. Mutually exclusive with `ipTags`.'
  name: publicIPPrefixID
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerservice.types.AgentPoolNICPublicIPAddressConfiguration.ipTags
  name: ipTags
  summary: 'IP tags to attach to the public IP allocated for this NIC. Each tag''s
    `ipTagType` must be

    `FirstPartyUsage`, `NetworkDomain`, or `RoutingPreference`. Mutually exclusive
    with

    `publicIPPrefixID`.'
  signature: 'ipTags: list[''IPTag'']'
- uid: azure.mgmt.containerservice.types.AgentPoolNICPublicIPAddressConfiguration.publicIPAddressVersion
  name: publicIPAddressVersion
  summary: 'its presence is what enables

    public IP provisioning, so an empty configuration allocates nothing. `IPv4` is
    the only

    accepted value. Required. "IPv4"'
  signature: 'publicIPAddressVersion: Required[str | AgentPoolNICPublicIPAddressVersion]'
- uid: azure.mgmt.containerservice.types.AgentPoolNICPublicIPAddressConfiguration.publicIPPrefixID
  name: publicIPPrefixID
  summary: 'The resource ID of a public IP prefix to draw this NIC''s public IP from.
    Mutually exclusive

    with `ipTags`.'
  signature: 'publicIPPrefixID: str'
