### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.MachineSecurityProfile
name: MachineSecurityProfile
fullName: azure.mgmt.containerservice.types.MachineSecurityProfile
module: azure.mgmt.containerservice.types
summary: The security settings of the machine.
constructor:
  syntax: MachineSecurityProfile()
variables:
- description: 'vTPM is a Trusted Launch feature for configuring a dedicated secure
    vault

    for keys and measurements held locally on the node. For more details, see

    aka.ms/aks/trustedlaunch. If not specified, the default is false.'
  name: enable_vtpm
  types:
  - <xref:bool>
- description: 'Secure Boot is a feature of Trusted Launch which ensures that only

    signed operating systems and drivers can boot. For more details, see aka.ms/aks/trustedlaunch.

    If not specified, the default is false.'
  name: enable_secure_boot
  types:
  - <xref:bool>
- description: 'SSH access method of an agent pool. Known values are: "LocalUser",

    "Disabled", and "EntraId".'
  name: ssh_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AgentPoolSSHAccess">]
- description: 'Whether to enable host based OS and data drive encryption.

    This is only supported on certain VM sizes and in certain Azure regions. For more
    information,

    see: [https://docs.microsoft.com/azure/aks/enable-host-encryption](https://docs.microsoft.com/azure/aks/enable-host-encryption).'
  name: enable_encryption_at_host
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.containerservice.types.MachineSecurityProfile.enableEncryptionAtHost
  name: enableEncryptionAtHost
  summary: 'Whether to enable host based OS and data drive encryption. This is only
    supported on certain VM

    sizes and in certain Azure regions. For more information, see:

    [https://docs.microsoft.com/azure/aks/enable-host-encryption](https://docs.microsoft.com/azure/aks/enable-host-encryption).'
  signature: 'enableEncryptionAtHost: bool'
- uid: azure.mgmt.containerservice.types.MachineSecurityProfile.enableSecureBoot
  name: enableSecureBoot
  summary: 'Secure Boot is a feature of Trusted Launch which ensures that only signed
    operating systems and

    drivers can boot. For more details, see aka.ms/aks/trustedlaunch.  If not specified,
    the

    default is false.'
  signature: 'enableSecureBoot: bool'
- uid: azure.mgmt.containerservice.types.MachineSecurityProfile.enableVTPM
  name: enableVTPM
  summary: 'vTPM is a Trusted Launch feature for configuring a dedicated secure vault
    for keys and

    measurements held locally on the node. For more details, see aka.ms/aks/trustedlaunch.
    If not

    specified, the default is false.'
  signature: 'enableVTPM: bool'
- uid: azure.mgmt.containerservice.types.MachineSecurityProfile.sshAccess
  name: sshAccess
  summary: '"LocalUser", "Disabled", and

    "EntraId".'
  signature: 'sshAccess: str | AgentPoolSSHAccess'
