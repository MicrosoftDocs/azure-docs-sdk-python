### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.NvidiaGPUProfile
name: NvidiaGPUProfile
fullName: azure.mgmt.containerservice.types.NvidiaGPUProfile
module: azure.mgmt.containerservice.types
summary: NVIDIA-specific GPU settings.
constructor:
  syntax: NvidiaGPUProfile()
variables:
- description: 'The Managed GPU experience installs additional components, such as
    the

    Data Center GPU Manager (DCGM) metrics for monitoring, on top of the GPU driver
    for you. For

    more details of what is installed, check out aka.ms/aks/managed-gpu. Known values
    are:

    "Unmanaged" and "Managed".'
  name: managementMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ManagementMode">]
- description: 'NVIDIA GPU resource allocation mode. DevicePlugin installs the NVIDIA

    Kubernetes device plugin. DRA installs the NVIDIA DRA driver. Known values are:
    "DevicePlugin"

    and "DRA".'
  name: driverMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NvidiaDriverMode">]
- description: 'Sets the MIG (Multi-Instance GPU) strategy that will be used for managed
    MIG

    support. For more information about the different strategies, visit aka.ms/aks/managed-gpu.

    When not specified, the default is None. Known values are: "None", "Single", and
    "Mixed".'
  name: migStrategy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MigStrategy">]
attributes:
- uid: azure.mgmt.containerservice.types.NvidiaGPUProfile.driverMode
  name: driverMode
  summary: 'NVIDIA GPU resource allocation mode. DevicePlugin installs the NVIDIA
    Kubernetes device plugin.

    DRA installs the NVIDIA DRA driver. Known values are: "DevicePlugin" and "DRA".'
  signature: 'driverMode: str | NvidiaDriverMode'
- uid: azure.mgmt.containerservice.types.NvidiaGPUProfile.managementMode
  name: managementMode
  summary: 'The Managed GPU experience installs additional components, such as the
    Data Center GPU Manager

    (DCGM) metrics for monitoring, on top of the GPU driver for you. For more details
    of what is

    installed, check out aka.ms/aks/managed-gpu. Known values are: "Unmanaged" and
    "Managed".'
  signature: 'managementMode: str | ManagementMode'
- uid: azure.mgmt.containerservice.types.NvidiaGPUProfile.migStrategy
  name: migStrategy
  summary: 'Sets the MIG (Multi-Instance GPU) strategy that will be used for managed
    MIG support. For more

    information about the different strategies, visit aka.ms/aks/managed-gpu. When
    not specified,

    the default is None. Known values are: "None", "Single", and "Mixed".'
  signature: 'migStrategy: str | MigStrategy'
