### YamlMime:PythonClass
uid: azure.mgmt.devcenter.models.DevCenterSku
name: DevCenterSku
fullName: azure.mgmt.devcenter.models.DevCenterSku
module: azure.mgmt.devcenter.models
summary: The resource model definition representing SKU for DevCenter resources.
constructor:
  syntax: 'DevCenterSku(*args: Any, **kwargs: Any)'
variables:
- description: The name of the SKU. Ex - P3. It is typically a letter+number code.
    Required.
  name: name
  types:
  - <xref:str>
- description: 'This field is required to be implemented by the Resource Provider
    if the service

    has more than one tier, but is not required on a PUT. Known values are: "Free",
    "Basic",

    "Standard", and "Premium".'
  name: tier
  types:
  - <xref:str>
  - <xref:azure.mgmt.devcenter.models.SkuTier>
- description: 'The SKU size. When the name field is the combination of tier and some
    other value,

    this would be the standalone code.'
  name: size
  types:
  - <xref:str>
- description: 'If the service has different generations of hardware, for the same
    SKU, then that

    can be captured here.'
  name: family
  types:
  - <xref:str>
- description: 'If the SKU supports scale out/in then the capacity integer should
    be included.

    If scale out/in is not possible for the resource this may be omitted.'
  name: capacity
  types:
  - <xref:int>
- description: The name of the resource type.
  name: resource_type
  types:
  - <xref:str>
- description: SKU supported locations.
  name: locations
  types:
  - <xref:list>[<xref:str>]
- description: Collection of name/value pairs to describe the SKU capabilities.
  name: capabilities
  types:
  - <xref:list>[<xref:azure.mgmt.devcenter.models.Capability>]
attributes:
- uid: azure.mgmt.devcenter.models.DevCenterSku.capabilities
  name: capabilities
  summary: Collection of name/value pairs to describe the SKU capabilities.
  signature: 'capabilities: list[''_models.Capability''] | None'
- uid: azure.mgmt.devcenter.models.DevCenterSku.locations
  name: locations
  summary: SKU supported locations.
  signature: 'locations: list[str] | None'
- uid: azure.mgmt.devcenter.models.DevCenterSku.resource_type
  name: resource_type
  summary: The name of the resource type.
  signature: 'resource_type: str | None'
