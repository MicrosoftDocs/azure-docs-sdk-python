    are:

    "Disabled" and "Enabled".'
  signature: 'hibernateSupport: str | HibernateSupport'
- uid: azure.mgmt.devcenter.types.DevBoxDefinitionUpdateProperties.imageReference
  name: imageReference
  summary: Image reference information.
  signature: 'imageReference: ImageReference'
