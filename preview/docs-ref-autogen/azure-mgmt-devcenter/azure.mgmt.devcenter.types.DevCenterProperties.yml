### YamlMime:PythonClass
uid: azure.mgmt.devcenter.types.DevCenterProperties
name: DevCenterProperties
fullName: azure.mgmt.devcenter.types.DevCenterProperties
module: azure.mgmt.devcenter.types
summary: Properties of the devcenter.
constructor:
  syntax: DevCenterProperties()
variables:
- description: 'Encryption settings to be used for server-side encryption for proprietary

    content (such as catalogs, logs, customizations).'
  name: encryption
  types:
  - <xref:<xref:"Encryption">>
- description: The display name of the devcenter.
  name: display_name
  types:
  - <xref:str>
- description: 'Dev Center settings to be used when associating a project with

    a catalog.'
  name: project_catalog_settings
  types:
  - <xref:<xref:"DevCenterProjectCatalogSettings">>
- description: 'Network settings that will be enforced on network resources associated

    with the Dev Center.'
  name: network_settings
  types:
  - <xref:<xref:"DevCenterNetworkSettings">>
- description: 'Settings to be used in the provisioning of all Dev Boxes

    that belong to this dev center.'
  name: dev_box_provisioning_settings
  types:
  - <xref:<xref:"DevBoxProvisioningSettings">>
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The URI of the Dev Center.
  name: dev_center_uri
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.devcenter.types.DevCenterProperties.devCenterUri
  name: devCenterUri
  summary: The URI of the Dev Center.
  signature: 'devCenterUri: str'
- uid: azure.mgmt.devcenter.types.DevCenterProperties.provisioningState
  name: provisioningState
  summary: '"NotSpecified", "Accepted",

    "Running", "Creating", "Created", "Updating", "Updated", "Deleting", "Deleted",

    "Succeeded", "Failed", "Canceled", "MovingResources", "TransientFailure",

    "RolloutInProgress", and "StorageProvisioningFailed".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.devcenter.types.DevCenterProperties.devBoxProvisioningSettings
  name: devBoxProvisioningSettings
  signature: 'devBoxProvisioningSettings: DevBoxProvisioningSettings'
- uid: azure.mgmt.devcenter.types.DevCenterProperties.displayName
  name: displayName
  signature: 'displayName: str'
- uid: azure.mgmt.devcenter.types.DevCenterProperties.encryption
  name: encryption
  signature: 'encryption: Encryption'
- uid: azure.mgmt.devcenter.types.DevCenterProperties.networkSettings
  name: networkSettings
  signature: 'networkSettings: DevCenterNetworkSettings'
- uid: azure.mgmt.devcenter.types.DevCenterProperties.projectCatalogSettings
  name: projectCatalogSettings
  signature: 'projectCatalogSettings: DevCenterProjectCatalogSettings'
