name: DevCenterEncryptionSetUpdateProperties
fullName: azure.mgmt.devcenter.types.DevCenterEncryptionSetUpdateProperties
module: azure.mgmt.devcenter.types
summary: 'Properties of the devcenter encryption set. These properties can be updated
  after the resource

  has been created.'
constructor:
