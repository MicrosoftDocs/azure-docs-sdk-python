  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DevboxDisksEncryptionEnableStatus">]
- description: 'Key encryption key Url, versioned or non-versioned. Ex:

    [https://contosovault.vault.azure.net/keys/contosokek/562a4bb76b524a1493a6afe8e536ee78](https://contosovault.vault.azure.net/keys/contosokek/562a4bb76b524a1493a6afe8e536ee78)
    or

    [https://contosovault.vault.azure.net/keys/contosokek](https://contosovault.vault.azure.net/keys/contosokek).'
  name: key_encryption_key_url
  types:
  - <xref:str>
- description: 'The managed identity configuration used for key vault

    access.'
  name: key_encryption_key_identity
  types:
  - <xref:<xref:"KeyEncryptionKeyIdentityUpdate">>
