### YamlMime:PythonClass
uid: azure.mgmt.devcenter.models.NetworkProperties
name: NetworkProperties
fullName: azure.mgmt.devcenter.models.NetworkProperties
module: azure.mgmt.devcenter.models
summary: Network properties.
constructor:
  syntax: 'NetworkProperties(*args: Any, **kwargs: Any)'
variables:
- description: The subnet to attach Virtual Machines to.
  name: subnet_id
  types:
  - <xref:str>
- description: Active Directory domain name.
  name: domain_name
  types:
  - <xref:str>
- description: Active Directory domain Organization Unit (OU).
  name: organization_unit
  types:
  - <xref:str>
- description: 'The username of an Active Directory account (user or service account)

    that has permissions to create computer objects in Active Directory. Required
    format:

    <xref:mailto:admin@contoso.com>.'
  name: domain_username
  types:
  - <xref:str>
- description: The password for the account used to join domain.
  name: domain_password
  types:
  - <xref:str>
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.devcenter.models.ProvisioningState>
- description: 'Overall health status of the network connection. Health checks are

    run on creation, update, and periodically to validate the network connection.
    Known values are:

    "Unknown", "Pending", "Running", "Passed", "Warning", "Failed", and "Informational".'
  name: health_check_status
  types:
  - <xref:str>
  - <xref:azure.mgmt.devcenter.models.HealthCheckStatus>
- description: The name for resource group where NICs will be placed.
  name: networking_resource_group_name
  types:
  - <xref:str>
- description: 'AAD Join type. Required. Known values are: "HybridAzureADJoin",

    "AzureADJoin", and "None".'
  name: domain_join_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.devcenter.models.DomainJoinType>
attributes:
- uid: azure.mgmt.devcenter.models.NetworkProperties.domain_join_type
  name: domain_join_type
  summary: '"HybridAzureADJoin", "AzureADJoin", and

    "None".'
  signature: 'domain_join_type: str | _models.DomainJoinType'
- uid: azure.mgmt.devcenter.models.NetworkProperties.health_check_status
  name: health_check_status
  summary: 'Overall health status of the network connection. Health checks are run
    on creation, update, and

    periodically to validate the network connection. Known values are: "Unknown",
    "Pending",

    "Running", "Passed", "Warning", "Failed", and "Informational".'
  signature: 'health_check_status: str | _models.HealthCheckStatus | None'
- uid: azure.mgmt.devcenter.models.NetworkProperties.networking_resource_group_name
  name: networking_resource_group_name
  summary: The name for resource group where NICs will be placed.
  signature: 'networking_resource_group_name: str | None'
- uid: azure.mgmt.devcenter.models.NetworkProperties.provisioning_state
  name: provisioning_state
  summary: '"NotSpecified", "Accepted",

    "Running", "Creating", "Created", "Updating", "Updated", "Deleting", "Deleted",

    "Succeeded", "Failed", "Canceled", "MovingResources", "TransientFailure",

    "RolloutInProgress", and "StorageProvisioningFailed".'
  signature: 'provisioning_state: str | _models.ProvisioningState | None'
