uid: azure.mgmt.devcenter.types.ProjectUpdateProperties
name: ProjectUpdateProperties
fullName: azure.mgmt.devcenter.types.ProjectUpdateProperties
module: azure.mgmt.devcenter.types
summary: Properties of a project. These properties can be updated after the resource
  has been created.
constructor:
  syntax: ProjectUpdateProperties()
variables:
- description: Resource Id of an associated DevCenter.
  name: dev_center_id
  types:
  - <xref:str>
- description: Description of the project.
  name: description
  types:
  - <xref:str>
- description: 'When specified, limits the maximum number of Dev Boxes a single

    user can create across all pools in the project. This will have no effect on existing
    Dev Boxes

    when reduced.'
  name: max_dev_boxes_per_user
  types:
  - <xref:int>
- description: The display name of the project.
  name: display_name
  types:
  - <xref:str>
- description: Settings to be used when associating a project with a catalog.
  name: catalog_settings
  types:
  - <xref:<xref:"ProjectCatalogSettings">>
- description: Settings to be used for customizations.
  name: customization_settings
  types:
  - <xref:<xref:"ProjectCustomizationSettings">>
- description: Dev Box Schedule Delete settings.
  name: dev_box_schedule_delete_settings
  types:
  - <xref:<xref:"DevBoxScheduleDeleteSettings">>
- description: 'Indicates whether Azure AI services are enabled for a

    project.'
  name: azure_ai_services_settings
  types:
  - <xref:<xref:"AzureAiServicesSettings">>
- description: Settings to be used for serverless GPU.
  name: serverless_gpu_sessions_settings
  types:
  - <xref:<xref:"ServerlessGpuSessionsSettings">>
- description: Settings to be used for workspace storage.
  name: workspace_storage_settings
  types:
  - <xref:<xref:"WorkspaceStorageSettings">>
- description: List of Entra ID group assignments associated with this project.
  name: assigned_groups
  types:
  - <xref:list>[<xref:"AssignedGroup">]
