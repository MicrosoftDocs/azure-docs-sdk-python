### YamlMime:PythonClass
uid: azure.mgmt.devcenter.types.ProjectEnvironmentTypeProperties
name: ProjectEnvironmentTypeProperties
fullName: azure.mgmt.devcenter.types.ProjectEnvironmentTypeProperties
module: azure.mgmt.devcenter.types
summary: Properties of a project environment type.
constructor:
  syntax: ProjectEnvironmentTypeProperties()
variables:
- description: 'Id of a subscription that the environment type will be mapped to.

    The environment''s resources will be deployed into this subscription.'
  name: deployment_target_id
  types:
  - <xref:str>
- description: The display name of the project environment type.
  name: display_name
  types:
  - <xref:str>
- description: 'Defines whether this Environment Type can be used in this Project.
    Known values

    are: "Enabled" and "Disabled".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EnvironmentTypeEnableStatus">]
- description: 'The role definition assigned to the environment creator on

    backing resources.'
  name: creator_role_assignment
  types:
  - <xref:<xref:"ProjectEnvironmentTypeUpdatePropertiesCreatorRoleAssignment">>
- description: 'Role Assignments created on environment backing resources. This is

    a mapping from a user object ID to an object of role definition IDs.'
  name: user_role_assignments
  types:
  - <xref:dict>[<xref:str>, <xref:"UserRoleAssignmentValue">]
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The number of environments of this type.
  name: environment_count
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.devcenter.types.ProjectEnvironmentTypeProperties.environmentCount
  name: environmentCount
  summary: The number of environments of this type.
  signature: 'environmentCount: int'
- uid: azure.mgmt.devcenter.types.ProjectEnvironmentTypeProperties.provisioningState
  name: provisioningState
  summary: '"NotSpecified", "Accepted",

    "Running", "Creating", "Created", "Updating", "Updated", "Deleting", "Deleted",

    "Succeeded", "Failed", "Canceled", "MovingResources", "TransientFailure",

    "RolloutInProgress", and "StorageProvisioningFailed".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.devcenter.types.ProjectEnvironmentTypeProperties.creatorRoleAssignment
  name: creatorRoleAssignment
  signature: 'creatorRoleAssignment: ProjectEnvironmentTypeUpdatePropertiesCreatorRoleAssignment'
- uid: azure.mgmt.devcenter.types.ProjectEnvironmentTypeProperties.deploymentTargetId
  name: deploymentTargetId
  signature: 'deploymentTargetId: str'
- uid: azure.mgmt.devcenter.types.ProjectEnvironmentTypeProperties.displayName
  name: displayName
  signature: 'displayName: str'
- uid: azure.mgmt.devcenter.types.ProjectEnvironmentTypeProperties.status
  name: status
  signature: 'status: str | EnvironmentTypeEnableStatus'
- uid: azure.mgmt.devcenter.types.ProjectEnvironmentTypeProperties.userRoleAssignments
  name: userRoleAssignments
  signature: 'userRoleAssignments: dict[str, ''UserRoleAssignmentValue'']'
