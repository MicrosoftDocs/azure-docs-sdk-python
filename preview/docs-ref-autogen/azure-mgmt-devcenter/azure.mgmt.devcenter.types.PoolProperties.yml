### YamlMime:PythonClass
uid: azure.mgmt.devcenter.types.PoolProperties
name: PoolProperties
fullName: azure.mgmt.devcenter.types.PoolProperties
module: azure.mgmt.devcenter.types
summary: Properties of a Pool.
constructor:
  syntax: PoolProperties()
variables:
- description: 'Indicates if the pool is created from an existing Dev Box

    Definition or if one is provided directly. Known values are: "Reference" and "Value".'
  name: dev_box_definition_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PoolDevBoxDefinitionType">]
- description: 'Name of a Dev Box definition in parent Project of this Pool.

    Will be ignored if devBoxDefinitionType is Value.'
  name: dev_box_definition_name
  types:
  - <xref:str>
- description: 'A definition of the machines that are created from this Pool. Will
    be

    ignored if devBoxDefinitionType is Reference or not provided.'
  name: dev_box_definition
  types:
  - <xref:<xref:"PoolDevBoxDefinition">>
- description: Name of a Network Connection in parent Project of this Pool.
  name: network_connection_name
  types:
  - <xref:str>
- description: 'Specifies the license type indicating the caller has already acquired

    licenses for the Dev Boxes that will be created. "Windows_Client"'
  name: license_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LicenseType">]
- description: 'Indicates whether owners of Dev Boxes in this pool are added as

    local administrators on the Dev Box. Known values are: "Disabled" and "Enabled".'
  name: local_administrator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LocalAdminStatus">]
- description: 'Stop on disconnect configuration settings for Dev Boxes created in

    this pool.'
  name: stop_on_disconnect
  types:
  - <xref:<xref:"StopOnDisconnectConfiguration">>
- description: 'Stop on no connect configuration settings for Dev Boxes created in

    this pool.'
  name: stop_on_no_connect
  types:
  - <xref:<xref:"StopOnNoConnectConfiguration">>
- description: 'Indicates whether Dev Boxes in this pool are created with single

    sign on enabled. The also requires that single sign on be enabled on the tenant.
    Known values

    are: "Disabled" and "Enabled".'
  name: single_sign_on_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SingleSignOnStatus">]
- description: The display name of the pool.
  name: display_name
  types:
  - <xref:str>
- description: 'Indicates whether the pool uses a Virtual Network managed by

    Microsoft or a customer provided network. Known values are: "Managed" and "Unmanaged".'
  name: virtual_network_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualNetworkType">]
- description: 'The regions of the managed virtual network (required

    when managedNetworkType is Managed).'
  name: managed_virtual_network_regions
  types:
  - <xref:list>[<xref:str>]
- description: 'Active hours configuration settings for Dev Boxes created in

    this pool.'
  name: active_hours_configuration
  types:
  - <xref:<xref:"ActiveHoursConfiguration">>
- description: 'Indicates whether Dev Box Tunnel is enabled for a the pool.

    Known values are: "Disabled" and "Enabled".'
  name: dev_box_tunnel_enable_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DevBoxTunnelEnableStatus">]
- description: 'Overall health status of the Pool. Indicates whether or not the Pool
    is

    available to create Dev Boxes. Known values are: "Unknown", "Pending", "Healthy",
    "Warning",

    and "Unhealthy".'
  name: health_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthStatus">]
- description: 'Details on the Pool health status to help diagnose issues. This is

    only populated when the pool status indicates the pool is in a non-healthy state.'
  name: health_status_details
  types:
  - <xref:list>[<xref:"HealthStatusDetail">]
- description: Indicates the number of provisioned Dev Boxes in this pool.
  name: dev_box_count
  types:
  - <xref:int>
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.devcenter.types.PoolProperties.devBoxCount
  name: devBoxCount
  summary: Indicates the number of provisioned Dev Boxes in this pool.
  signature: 'devBoxCount: int'
- uid: azure.mgmt.devcenter.types.PoolProperties.healthStatus
  name: healthStatus
  summary: 'Overall health status of the Pool. Indicates whether or not the Pool is
    available to create Dev

    Boxes. Known values are: "Unknown", "Pending", "Healthy", "Warning", and "Unhealthy".'
  signature: 'healthStatus: str | HealthStatus'
- uid: azure.mgmt.devcenter.types.PoolProperties.healthStatusDetails
  name: healthStatusDetails
  summary: 'Details on the Pool health status to help diagnose issues. This is only
    populated when the pool

    status indicates the pool is in a non-healthy state.'
  signature: 'healthStatusDetails: list[''HealthStatusDetail'']'
- uid: azure.mgmt.devcenter.types.PoolProperties.provisioningState
  name: provisioningState
  summary: '"NotSpecified", "Accepted",

    "Running", "Creating", "Created", "Updating", "Updated", "Deleting", "Deleted",

    "Succeeded", "Failed", "Canceled", "MovingResources", "TransientFailure",

    "RolloutInProgress", and "StorageProvisioningFailed".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.devcenter.types.PoolProperties.activeHoursConfiguration
  name: activeHoursConfiguration
  signature: 'activeHoursConfiguration: ActiveHoursConfiguration'
- uid: azure.mgmt.devcenter.types.PoolProperties.devBoxDefinition
  name: devBoxDefinition
  signature: 'devBoxDefinition: PoolDevBoxDefinition'
- uid: azure.mgmt.devcenter.types.PoolProperties.devBoxDefinitionName
  name: devBoxDefinitionName
  signature: 'devBoxDefinitionName: str'
- uid: azure.mgmt.devcenter.types.PoolProperties.devBoxDefinitionType
  name: devBoxDefinitionType
  signature: 'devBoxDefinitionType: str | PoolDevBoxDefinitionType'
- uid: azure.mgmt.devcenter.types.PoolProperties.devBoxTunnelEnableStatus
  name: devBoxTunnelEnableStatus
  signature: 'devBoxTunnelEnableStatus: str | DevBoxTunnelEnableStatus'
- uid: azure.mgmt.devcenter.types.PoolProperties.displayName
  name: displayName
  signature: 'displayName: str'
- uid: azure.mgmt.devcenter.types.PoolProperties.licenseType
  name: licenseType
  signature: 'licenseType: str | LicenseType'
- uid: azure.mgmt.devcenter.types.PoolProperties.localAdministrator
  name: localAdministrator
  signature: 'localAdministrator: str | LocalAdminStatus'
- uid: azure.mgmt.devcenter.types.PoolProperties.managedVirtualNetworkRegions
  name: managedVirtualNetworkRegions
  signature: 'managedVirtualNetworkRegions: list[str]'
- uid: azure.mgmt.devcenter.types.PoolProperties.networkConnectionName
  name: networkConnectionName
  signature: 'networkConnectionName: str'
- uid: azure.mgmt.devcenter.types.PoolProperties.singleSignOnStatus
  name: singleSignOnStatus
  signature: 'singleSignOnStatus: str | SingleSignOnStatus'
- uid: azure.mgmt.devcenter.types.PoolProperties.stopOnDisconnect
  name: stopOnDisconnect
  signature: 'stopOnDisconnect: StopOnDisconnectConfiguration'
- uid: azure.mgmt.devcenter.types.PoolProperties.stopOnNoConnect
  name: stopOnNoConnect
  signature: 'stopOnNoConnect: StopOnNoConnectConfiguration'
- uid: azure.mgmt.devcenter.types.PoolProperties.virtualNetworkType
  name: virtualNetworkType
  signature: 'virtualNetworkType: str | VirtualNetworkType'
