### YamlMime:PythonClass
uid: azure.mgmt.devcenter.types.DevBoxDefinitionProperties
name: DevBoxDefinitionProperties
fullName: azure.mgmt.devcenter.types.DevBoxDefinitionProperties
module: azure.mgmt.devcenter.types
summary: Properties of a Dev Box definition.
constructor:
  syntax: DevBoxDefinitionProperties()
variables:
- description: Image reference information.
  name: image_reference
  types:
  - <xref:<xref:"ImageReference">>
- description: The SKU for Dev Boxes created using this definition.
  name: sku
  types:
  - <xref:<xref:"Sku">>
- description: 'The storage type used for the Operating System disk of Dev Boxes created

    using this definition.'
  name: os_storage_type
  types:
  - <xref:str>
- description: 'Indicates whether Dev Boxes created with this definition are capable

    of hibernation. Not all images are capable of supporting hibernation. To find
    out more see

    [https://aka.ms/devbox/hibernate](https://aka.ms/devbox/hibernate). Known values
    are:

    "Disabled" and "Enabled".'
  name: hibernate_support
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HibernateSupport">]
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Validation status of the configured image. Known values are:

    "Unknown", "Pending", "Succeeded", "Failed", and "TimedOut".'
  name: image_validation_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ImageValidationStatus">]
- description: 'Details for image validator error. Populated when the

    image validation is not successful.'
  name: image_validation_error_details
  types:
  - <xref:<xref:"ImageValidationErrorDetails">>
- description: 'Validation status for the Dev Box Definition. Known values are:

    "Unknown", "Pending", "Succeeded", and "Failed".'
  name: validation_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CatalogResourceValidationStatus">]
- description: 'Image reference information for the currently active image (only

    populated during updates).'
  name: active_image_reference
  types:
  - <xref:<xref:"ImageReference">>
attributes:
- uid: azure.mgmt.devcenter.types.DevBoxDefinitionProperties.activeImageReference
  name: activeImageReference
  summary: Image reference information for the currently active image (only populated
    during updates).
  signature: 'activeImageReference: ImageReference'
- uid: azure.mgmt.devcenter.types.DevBoxDefinitionProperties.imageValidationErrorDetails
  name: imageValidationErrorDetails
  summary: Details for image validator error. Populated when the image validation
    is not successful.
  signature: 'imageValidationErrorDetails: ImageValidationErrorDetails'
- uid: azure.mgmt.devcenter.types.DevBoxDefinitionProperties.imageValidationStatus
  name: imageValidationStatus
  summary: '"Unknown", "Pending",

    "Succeeded", "Failed", and "TimedOut".'
  signature: 'imageValidationStatus: str | ImageValidationStatus'
- uid: azure.mgmt.devcenter.types.DevBoxDefinitionProperties.provisioningState
  name: provisioningState
  summary: '"NotSpecified", "Accepted",

    "Running", "Creating", "Created", "Updating", "Updated", "Deleting", "Deleted",

    "Succeeded", "Failed", "Canceled", "MovingResources", "TransientFailure",

    "RolloutInProgress", and "StorageProvisioningFailed".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.devcenter.types.DevBoxDefinitionProperties.validationStatus
  name: validationStatus
  summary: '"Unknown", "Pending",

    "Succeeded", and "Failed".'
  signature: 'validationStatus: str | CatalogResourceValidationStatus'
- uid: azure.mgmt.devcenter.types.DevBoxDefinitionProperties.hibernateSupport
  name: hibernateSupport
  signature: 'hibernateSupport: str | HibernateSupport'
- uid: azure.mgmt.devcenter.types.DevBoxDefinitionProperties.imageReference
  name: imageReference
  signature: 'imageReference: ImageReference'
- uid: azure.mgmt.devcenter.types.DevBoxDefinitionProperties.osStorageType
  name: osStorageType
  signature: 'osStorageType: str'
- uid: azure.mgmt.devcenter.types.DevBoxDefinitionProperties.sku
  name: sku
  signature: 'sku: Sku'
