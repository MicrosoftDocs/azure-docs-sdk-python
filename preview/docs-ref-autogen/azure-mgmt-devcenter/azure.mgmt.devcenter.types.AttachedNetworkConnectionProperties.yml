### YamlMime:PythonClass
uid: azure.mgmt.devcenter.types.AttachedNetworkConnectionProperties
name: AttachedNetworkConnectionProperties
fullName: azure.mgmt.devcenter.types.AttachedNetworkConnectionProperties
module: azure.mgmt.devcenter.types
summary: Properties of an attached NetworkConnection.
constructor:
  syntax: AttachedNetworkConnectionProperties()
variables:
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The resource ID of the NetworkConnection you want to attach.
  name: network_connection_id
  types:
  - <xref:str>
- description: 'The geo-location where the NetworkConnection resource

    specified in ''networkConnectionResourceId'' property lives.'
  name: network_connection_location
  types:
  - <xref:str>
- description: 'Health check status values. Known values are: "Unknown", "Pending",

    "Running", "Passed", "Warning", "Failed", and "Informational".'
  name: health_check_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthCheckStatus">]
- description: 'AAD Join type of the network. This is populated based on the referenced

    Network Connection. Known values are: "HybridAzureADJoin", "AzureADJoin", and
    "None".'
  name: domain_join_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DomainJoinType">]
attributes:
- uid: azure.mgmt.devcenter.types.AttachedNetworkConnectionProperties.domainJoinType
  name: domainJoinType
  summary: 'AAD Join type of the network. This is populated based on the referenced
    Network Connection.

    Known values are: "HybridAzureADJoin", "AzureADJoin", and "None".'
  signature: 'domainJoinType: str | DomainJoinType'
- uid: azure.mgmt.devcenter.types.AttachedNetworkConnectionProperties.healthCheckStatus
  name: healthCheckStatus
  summary: '"Unknown", "Pending", "Running",

    "Passed", "Warning", "Failed", and "Informational".'
  signature: 'healthCheckStatus: str | HealthCheckStatus'
- uid: azure.mgmt.devcenter.types.AttachedNetworkConnectionProperties.networkConnectionId
  name: networkConnectionId
  summary: The resource ID of the NetworkConnection you want to attach.
  signature: 'networkConnectionId: str'
- uid: azure.mgmt.devcenter.types.AttachedNetworkConnectionProperties.networkConnectionLocation
  name: networkConnectionLocation
  summary: 'The geo-location where the NetworkConnection resource specified in

    ''networkConnectionResourceId'' property lives.'
  signature: 'networkConnectionLocation: str'
- uid: azure.mgmt.devcenter.types.AttachedNetworkConnectionProperties.provisioningState
  name: provisioningState
  summary: '"NotSpecified", "Accepted",

    "Running", "Creating", "Created", "Updating", "Updated", "Deleting", "Deleted",

    "Succeeded", "Failed", "Canceled", "MovingResources", "TransientFailure",

    "RolloutInProgress", and "StorageProvisioningFailed".'
  signature: 'provisioningState: str | ProvisioningState'
