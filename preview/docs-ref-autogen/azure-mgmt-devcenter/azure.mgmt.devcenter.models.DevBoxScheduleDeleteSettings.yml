name: DevBoxScheduleDeleteSettings
fullName: azure.mgmt.devcenter.models.DevBoxScheduleDeleteSettings
module: azure.mgmt.devcenter.models
summary: Settings controlling the auto deletion of inactive dev boxes.
constructor:
  syntax: 'DevBoxScheduleDeleteSettings(*args: Any, **kwargs: Any)'
variables:
- description: 'Indicates the delete mode for Dev Boxes within this project. Known
    values

    are: "Manual" and "Auto".'
  name: delete_mode
  types:
  - <xref:str>
  - <xref:azure.mgmt.devcenter.models.DevBoxDeleteMode>
- description: 'ISO8601 duration required for the dev box to not be inactive prior
    to

    it being scheduled for deletion.  ISO8601 format PT[n]H[n]M[n]S.'
  name: inactive_threshold
  types:
  - <xref:datetime.timedelta>
- description: 'ISO8601 duration required for the dev box to be marked for deletion
    prior

    to it being deleted. ISO8601 format PT[n]H[n]M[n]S.'
  name: grace_period
  types:
  - <xref:datetime.timedelta>
- description: 'Indicates whether scheduled deletion should be canceled

    when a user connects to the dev box. Known values are: "Enabled" and "Disabled".'
