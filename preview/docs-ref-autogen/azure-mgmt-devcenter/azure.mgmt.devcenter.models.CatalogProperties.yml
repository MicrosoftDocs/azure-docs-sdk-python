  name: connection_state
  summary: '"Connected" and "Disconnected".'
  signature: 'connection_state: str | _models.CatalogConnectionState | None'
- uid: azure.mgmt.devcenter.models.CatalogProperties.last_connection_time
  name: last_connection_time
  summary: When the catalog was last connected.
