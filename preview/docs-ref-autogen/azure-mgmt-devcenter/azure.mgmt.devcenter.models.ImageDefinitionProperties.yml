uid: azure.mgmt.devcenter.models.ImageDefinitionProperties
name: ImageDefinitionProperties
fullName: azure.mgmt.devcenter.models.ImageDefinitionProperties
module: azure.mgmt.devcenter.models
summary: Properties of an Image Definition.
constructor:
  syntax: 'ImageDefinitionProperties(*args: Any, **kwargs: Any)'
variables:
- description: Image reference information.
  name: image_reference
  types:
  - <xref:azure.mgmt.devcenter.models.ImageReference>
- description: The URL to the repository file containing the image definition.
  name: file_url
  types:
  - <xref:str>
- description: Details about the latest build.
  name: latest_build
  types:
  - <xref:azure.mgmt.devcenter.models.LatestImageBuild>
- description: 'Validation status of the configured image. Known values are:

    "Unknown", "Pending", "Succeeded", "Failed", and "TimedOut".'
  name: image_validation_status
  types:
  - <xref:str>
  - <xref:azure.mgmt.devcenter.models.ImageValidationStatus>
- description: 'Details for image validator error. Populated when the

    image validation is not successful.'
  name: image_validation_error_details
  types:
  - <xref:azure.mgmt.devcenter.models.ImageValidationErrorDetails>
- description: 'Validation status for the Image Definition. Known values are:

    "Unknown", "Pending", "Succeeded", and "Failed".'
  name: validation_status
  types:
  - <xref:str>
  - <xref:azure.mgmt.devcenter.models.CatalogResourceValidationStatus>
- description: 'Image reference information for the currently active image (only

    populated during updates).'
  name: active_image_reference
  types:
  - <xref:azure.mgmt.devcenter.models.ImageReference>
- description: 'Indicates if automatic image builds will be triggered for image

    definition updates. Known values are: "Disabled" and "Enabled".'
  name: auto_image_build
  types:
  - <xref:str>
  - <xref:azure.mgmt.devcenter.models.AutoImageBuildStatus>
- description: Tasks to run at Dev Box provisioning time.
  name: tasks
  types:
  - <xref:list>[<xref:azure.mgmt.devcenter.models.CustomizationTaskInstance>]
- description: Tasks to run when a user first logs into a Dev Box.
  name: user_tasks
  types:
  - <xref:list>[<xref:azure.mgmt.devcenter.models.CustomizationTaskInstance>]
- description: Another Image Definition that this one extends.
  name: extends
  types:
  - <xref:azure.mgmt.devcenter.models.ImageDefinitionReference>
