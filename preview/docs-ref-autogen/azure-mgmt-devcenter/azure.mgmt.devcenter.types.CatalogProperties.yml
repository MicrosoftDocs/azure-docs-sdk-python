### YamlMime:PythonClass
uid: azure.mgmt.devcenter.types.CatalogProperties
name: CatalogProperties
fullName: azure.mgmt.devcenter.types.CatalogProperties
module: azure.mgmt.devcenter.types
summary: Properties of a catalog.
constructor:
  syntax: CatalogProperties()
variables:
- description: Properties for a GitHub catalog type.
  name: git_hub
  types:
  - <xref:<xref:"GitCatalog">>
- description: Properties for an Azure DevOps catalog type.
  name: ado_git
  types:
  - <xref:<xref:"GitCatalog">>
- description: 'Indicates the type of sync that is configured for the catalog. Known
    values

    are: "Manual" and "Scheduled".'
  name: sync_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CatalogSyncType">]
- description: 'Indicates whether the catalog is configured to

    automatically build image definitions. Defaults to disabled for newly created
    catalogs. Known

    values are: "Disabled" and "Enabled".'
  name: auto_image_build_enable_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CatalogAutoImageBuildEnableStatus">]
- description: Resource tags.
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The synchronization state of the catalog. Known values are: "Succeeded",

    "InProgress", "Failed", and "Canceled".'
  name: sync_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CatalogSyncState">]
- description: Stats of the latest synchronization.
  name: last_sync_stats
  types:
  - <xref:<xref:"SyncStats">>
- description: 'The connection state of the catalog. Known values are: "Connected"
    and

    "Disconnected".'
  name: connection_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CatalogConnectionState">]
- description: When the catalog was last connected.
  name: last_connection_time
  types:
  - <xref:str>
- description: When the catalog was last synced.
  name: last_sync_time
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.devcenter.types.CatalogProperties.connectionState
  name: connectionState
  summary: '"Connected" and "Disconnected".'
  signature: 'connectionState: str | CatalogConnectionState'
- uid: azure.mgmt.devcenter.types.CatalogProperties.lastConnectionTime
  name: lastConnectionTime
  summary: When the catalog was last connected.
  signature: 'lastConnectionTime: str'
- uid: azure.mgmt.devcenter.types.CatalogProperties.lastSyncStats
  name: lastSyncStats
  summary: Stats of the latest synchronization.
  signature: 'lastSyncStats: SyncStats'
- uid: azure.mgmt.devcenter.types.CatalogProperties.lastSyncTime
  name: lastSyncTime
  summary: When the catalog was last synced.
  signature: 'lastSyncTime: str'
- uid: azure.mgmt.devcenter.types.CatalogProperties.provisioningState
  name: provisioningState
  summary: '"NotSpecified", "Accepted",

    "Running", "Creating", "Created", "Updating", "Updated", "Deleting", "Deleted",

    "Succeeded", "Failed", "Canceled", "MovingResources", "TransientFailure",

    "RolloutInProgress", and "StorageProvisioningFailed".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.devcenter.types.CatalogProperties.syncState
  name: syncState
  summary: '"Succeeded", "InProgress",

    "Failed", and "Canceled".'
  signature: 'syncState: str | CatalogSyncState'
- uid: azure.mgmt.devcenter.types.CatalogProperties.adoGit
  name: adoGit
  signature: 'adoGit: GitCatalog'
- uid: azure.mgmt.devcenter.types.CatalogProperties.autoImageBuildEnableStatus
  name: autoImageBuildEnableStatus
  signature: 'autoImageBuildEnableStatus: str | CatalogAutoImageBuildEnableStatus'
- uid: azure.mgmt.devcenter.types.CatalogProperties.gitHub
  name: gitHub
  signature: 'gitHub: GitCatalog'
- uid: azure.mgmt.devcenter.types.CatalogProperties.syncType
  name: syncType
  signature: 'syncType: str | CatalogSyncType'
- uid: azure.mgmt.devcenter.types.CatalogProperties.tags
  name: tags
  signature: 'tags: dict[str, str]'
