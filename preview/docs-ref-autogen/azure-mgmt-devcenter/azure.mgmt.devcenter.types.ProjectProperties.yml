### YamlMime:PythonClass
uid: azure.mgmt.devcenter.types.ProjectProperties
name: ProjectProperties
fullName: azure.mgmt.devcenter.types.ProjectProperties
module: azure.mgmt.devcenter.types
summary: Properties of a project.
constructor:
  syntax: ProjectProperties()
variables:
- description: Resource Id of an associated DevCenter.
  name: dev_center_id
  types:
  - <xref:str>
- description: Description of the project.
  name: description
  types:
  - <xref:str>
- description: 'When specified, limits the maximum number of Dev Boxes a single

    user can create across all pools in the project. This will have no effect on existing
    Dev Boxes

    when reduced.'
  name: max_dev_boxes_per_user
  types:
  - <xref:int>
- description: The display name of the project.
  name: display_name
  types:
  - <xref:str>
- description: Settings to be used when associating a project with a catalog.
  name: catalog_settings
  types:
  - <xref:<xref:"ProjectCatalogSettings">>
- description: Settings to be used for customizations.
  name: customization_settings
  types:
  - <xref:<xref:"ProjectCustomizationSettings">>
- description: Dev Box Schedule Delete settings.
  name: dev_box_schedule_delete_settings
  types:
  - <xref:<xref:"DevBoxScheduleDeleteSettings">>
- description: 'Indicates whether Azure AI services are enabled for a

    project.'
  name: azure_ai_services_settings
  types:
  - <xref:<xref:"AzureAiServicesSettings">>
- description: Settings to be used for serverless GPU.
  name: serverless_gpu_sessions_settings
  types:
  - <xref:<xref:"ServerlessGpuSessionsSettings">>
- description: Settings to be used for workspace storage.
  name: workspace_storage_settings
  types:
  - <xref:<xref:"WorkspaceStorageSettings">>
- description: List of Entra ID group assignments associated with this project.
  name: assigned_groups
  types:
  - <xref:list>[<xref:"AssignedGroup">]
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The URI of the Dev Center resource this project is associated with.
  name: dev_center_uri
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.devcenter.types.ProjectProperties.devCenterUri
  name: devCenterUri
  summary: The URI of the Dev Center resource this project is associated with.
  signature: 'devCenterUri: str'
- uid: azure.mgmt.devcenter.types.ProjectProperties.provisioningState
  name: provisioningState
  summary: '"NotSpecified", "Accepted",

    "Running", "Creating", "Created", "Updating", "Updated", "Deleting", "Deleted",

    "Succeeded", "Failed", "Canceled", "MovingResources", "TransientFailure",

    "RolloutInProgress", and "StorageProvisioningFailed".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.devcenter.types.ProjectProperties.assignedGroups
  name: assignedGroups
  signature: 'assignedGroups: list[''AssignedGroup'']'
- uid: azure.mgmt.devcenter.types.ProjectProperties.azureAiServicesSettings
  name: azureAiServicesSettings
  signature: 'azureAiServicesSettings: AzureAiServicesSettings'
- uid: azure.mgmt.devcenter.types.ProjectProperties.catalogSettings
  name: catalogSettings
  signature: 'catalogSettings: ProjectCatalogSettings'
- uid: azure.mgmt.devcenter.types.ProjectProperties.customizationSettings
  name: customizationSettings
  signature: 'customizationSettings: ProjectCustomizationSettings'
- uid: azure.mgmt.devcenter.types.ProjectProperties.description
  name: description
  signature: 'description: str'
- uid: azure.mgmt.devcenter.types.ProjectProperties.devBoxScheduleDeleteSettings
  name: devBoxScheduleDeleteSettings
  signature: 'devBoxScheduleDeleteSettings: DevBoxScheduleDeleteSettings'
- uid: azure.mgmt.devcenter.types.ProjectProperties.devCenterId
  name: devCenterId
  signature: 'devCenterId: str'
- uid: azure.mgmt.devcenter.types.ProjectProperties.displayName
  name: displayName
  signature: 'displayName: str'
- uid: azure.mgmt.devcenter.types.ProjectProperties.maxDevBoxesPerUser
  name: maxDevBoxesPerUser
  signature: 'maxDevBoxesPerUser: int'
- uid: azure.mgmt.devcenter.types.ProjectProperties.serverlessGpuSessionsSettings
  name: serverlessGpuSessionsSettings
  signature: 'serverlessGpuSessionsSettings: ServerlessGpuSessionsSettings'
- uid: azure.mgmt.devcenter.types.ProjectProperties.workspaceStorageSettings
  name: workspaceStorageSettings
  signature: 'workspaceStorageSettings: WorkspaceStorageSettings'
