### YamlMime:PythonClass
uid: azure.mgmt.devcenter.types.DevBoxScheduleDeleteSettings
name: DevBoxScheduleDeleteSettings
fullName: azure.mgmt.devcenter.types.DevBoxScheduleDeleteSettings
module: azure.mgmt.devcenter.types
summary: Settings controlling the auto deletion of inactive dev boxes.
constructor:
  syntax: DevBoxScheduleDeleteSettings()
variables:
- description: 'Indicates the delete mode for Dev Boxes within this project. Known
    values

    are: "Manual" and "Auto".'
  name: delete_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DevBoxDeleteMode">]
- description: 'ISO8601 duration required for the dev box to not be inactive prior
    to

    it being scheduled for deletion.  ISO8601 format PT[n]H[n]M[n]S.'
  name: inactive_threshold
  types:
  - <xref:str>
- description: 'ISO8601 duration required for the dev box to be marked for deletion
    prior

    to it being deleted. ISO8601 format PT[n]H[n]M[n]S.'
  name: grace_period
  types:
  - <xref:str>
- description: 'Indicates whether scheduled deletion should be canceled

    when a user connects to the dev box. Known values are: "Enabled" and "Disabled".'
  name: cancel_on_connect_enable_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CancelOnConnectEnableStatus">]
attributes:
- uid: azure.mgmt.devcenter.types.DevBoxScheduleDeleteSettings.cancelOnConnectEnableStatus
  name: cancelOnConnectEnableStatus
  summary: 'Indicates whether scheduled deletion should be canceled when a user connects
    to the dev box.

    Known values are: "Enabled" and "Disabled".'
  signature: 'cancelOnConnectEnableStatus: str | CancelOnConnectEnableStatus'
- uid: azure.mgmt.devcenter.types.DevBoxScheduleDeleteSettings.deleteMode
  name: deleteMode
  summary: '"Manual" and

    "Auto".'
  signature: 'deleteMode: str | DevBoxDeleteMode'
- uid: azure.mgmt.devcenter.types.DevBoxScheduleDeleteSettings.gracePeriod
  name: gracePeriod
  summary: 'ISO8601 duration required for the dev box to be marked for deletion prior
    to it being deleted.

    ISO8601 format PT[n]H[n]M[n]S.'
  signature: 'gracePeriod: str'
- uid: azure.mgmt.devcenter.types.DevBoxScheduleDeleteSettings.inactiveThreshold
  name: inactiveThreshold
  summary: 'ISO8601 duration required for the dev box to not be inactive prior to
    it being scheduled for

    deletion.  ISO8601 format PT[n]H[n]M[n]S.'
  signature: 'inactiveThreshold: str'
