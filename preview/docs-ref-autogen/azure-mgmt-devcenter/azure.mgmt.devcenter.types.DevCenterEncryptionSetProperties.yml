### YamlMime:PythonClass
uid: azure.mgmt.devcenter.types.DevCenterEncryptionSetProperties
name: DevCenterEncryptionSetProperties
fullName: azure.mgmt.devcenter.types.DevCenterEncryptionSetProperties
module: azure.mgmt.devcenter.types
summary: Properties of the devcenter encryption set.
constructor:
  syntax: DevCenterEncryptionSetProperties()
variables:
- description: 'Devbox disk encryption enable or disable status.

    Indicates if Devbox disks encryption using DevCenter CMK is enabled or not. Known
    values are:

    "Enabled" and "Disabled".'
  name: devbox_disks_encryption_enable_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DevboxDisksEncryptionEnableStatus">]
- description: 'Key encryption key Url, versioned or non-versioned. Ex:

    [https://contosovault.vault.azure.net/keys/contosokek/562a4bb76b524a1493a6afe8e536ee78](https://contosovault.vault.azure.net/keys/contosokek/562a4bb76b524a1493a6afe8e536ee78)
    or

    [https://contosovault.vault.azure.net/keys/contosokek](https://contosovault.vault.azure.net/keys/contosokek).'
  name: key_encryption_key_url
  types:
  - <xref:str>
- description: 'The managed identity configuration used for key vault

    access.'
  name: key_encryption_key_identity
  types:
  - <xref:<xref:"KeyEncryptionKeyIdentityUpdate">>
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.devcenter.types.DevCenterEncryptionSetProperties.provisioningState
  name: provisioningState
  summary: '"NotSpecified", "Accepted",

    "Running", "Creating", "Created", "Updating", "Updated", "Deleting", "Deleted",

    "Succeeded", "Failed", "Canceled", "MovingResources", "TransientFailure",

    "RolloutInProgress", and "StorageProvisioningFailed".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.devcenter.types.DevCenterEncryptionSetProperties.devboxDisksEncryptionEnableStatus
  name: devboxDisksEncryptionEnableStatus
  signature: 'devboxDisksEncryptionEnableStatus: str | DevboxDisksEncryptionEnableStatus'
- uid: azure.mgmt.devcenter.types.DevCenterEncryptionSetProperties.keyEncryptionKeyIdentity
  name: keyEncryptionKeyIdentity
  signature: 'keyEncryptionKeyIdentity: KeyEncryptionKeyIdentityUpdate'
- uid: azure.mgmt.devcenter.types.DevCenterEncryptionSetProperties.keyEncryptionKeyUrl
  name: keyEncryptionKeyUrl
  signature: 'keyEncryptionKeyUrl: str'
