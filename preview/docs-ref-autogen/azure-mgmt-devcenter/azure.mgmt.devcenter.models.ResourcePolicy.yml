uid: azure.mgmt.devcenter.models.ResourcePolicy
name: ResourcePolicy
fullName: azure.mgmt.devcenter.models.ResourcePolicy
module: azure.mgmt.devcenter.models
summary: A resource policy.
constructor:
  syntax: 'ResourcePolicy(*args: Any, **kwargs: Any)'
variables:
- description: Resources that are included and shared as a part of a project policy.
  name: resources
  types:
  - <xref:str>
- description: Optional. When specified, this expression is used to filter the resources.
  name: filter
  types:
  - <xref:str>
- description: 'Policy action to be taken on the resources. This is optional, and
    defaults to

    allow. Known values are: "Allow" and "Deny".'
  name: action
  types:
  - <xref:str>
  - <xref:azure.mgmt.devcenter.models.PolicyAction>
- description: 'Optional. The resource type being restricted or allowed by a project

    policy. Used with a given action to restrict or allow access to a resource type.
    Known values

    are: "Images", "AttachedNetworks", and "Skus".'
  name: resource_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.devcenter.models.DevCenterResourceType>
attributes:
