uid: azure.mgmt.devcenter.types.ActiveHoursConfiguration
name: ActiveHoursConfiguration
fullName: azure.mgmt.devcenter.types.ActiveHoursConfiguration
module: azure.mgmt.devcenter.types
summary: Active hours configuration.
constructor:
  syntax: ActiveHoursConfiguration()
variables:
- description: 'Enables or disables whether the Dev Box should be kept awake

    during active hours. Known values are: "Enabled" and "Disabled".'
  name: keep_awake_enable_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KeepAwakeEnableStatus">]
- description: 'Enables or disables whether the Dev Box should be automatically

    started at commencement of active hours. Known values are: "Enabled" and "Disabled".'
  name: auto_start_enable_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoStartEnableStatus">]
- description: The default IANA timezone id of the active hours.
  name: default_time_zone
  types:
  - <xref:str>
- description: The default start time of the active hours.
  name: default_start_time_hour
  types:
  - <xref:int>
- description: The default end time of the active hours.
  name: default_end_time_hour
  types:
  - <xref:int>
- description: 'The days of the week that active hours features will be enabled.

    This serves as a default that can be updated by each individual user.'
  name: default_days_of_week
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"DayOfWeek">]]
- description: 'The maximum amount of days per week that a user can enable active

    hours related features.'
  name: days_of_week_limit
  types:
  - <xref:int>
attributes:
