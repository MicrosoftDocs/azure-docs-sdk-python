  signature: 'defaultDaysOfWeek: list[typing.Union[str, ForwardRef(''DayOfWeek'')]]'
- uid: azure.mgmt.devcenter.types.ActiveHoursConfiguration.defaultEndTimeHour
  name: defaultEndTimeHour
  summary: The default end time of the active hours.
