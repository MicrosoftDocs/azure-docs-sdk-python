### YamlMime:PythonClass
uid: azure.mgmt.devcenter.types.ResourcePolicy
name: ResourcePolicy
fullName: azure.mgmt.devcenter.types.ResourcePolicy
module: azure.mgmt.devcenter.types
summary: A resource policy.
constructor:
  syntax: ResourcePolicy()
variables:
- description: Resources that are included and shared as a part of a project policy.
  name: resources
  types:
  - <xref:str>
- description: Optional. When specified, this expression is used to filter the resources.
  name: filter
  types:
  - <xref:str>
- description: 'Policy action to be taken on the resources. This is optional, and
    defaults to

    allow. Known values are: "Allow" and "Deny".'
  name: action
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PolicyAction">]
- description: 'Optional. The resource type being restricted or allowed by a project

    policy. Used with a given action to restrict or allow access to a resource type.
    Known values

    are: "Images", "AttachedNetworks", and "Skus".'
  name: resource_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DevCenterResourceType">]
attributes:
- uid: azure.mgmt.devcenter.types.ResourcePolicy.action
  name: action
  summary: 'Policy action to be taken on the resources. This is optional, and defaults
    to allow. Known

    values are: "Allow" and "Deny".'
  signature: 'action: str | PolicyAction'
- uid: azure.mgmt.devcenter.types.ResourcePolicy.filter
  name: filter
  summary: Optional. When specified, this expression is used to filter the resources.
  signature: 'filter: str'
- uid: azure.mgmt.devcenter.types.ResourcePolicy.resourceType
  name: resourceType
  summary: 'Optional. The resource type being restricted or allowed by a project policy.
    Used with a given

    action to restrict or allow access to a resource type. Known values are: "Images",

    "AttachedNetworks", and "Skus".'
  signature: 'resourceType: str | DevCenterResourceType'
- uid: azure.mgmt.devcenter.types.ResourcePolicy.resources
  name: resources
  summary: Resources that are included and shared as a part of a project policy.
  signature: 'resources: str'
