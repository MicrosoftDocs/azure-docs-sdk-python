### YamlMime:PythonClass
uid: azure.mgmt.devcenter.types.ProjectPolicyProperties
name: ProjectPolicyProperties
fullName: azure.mgmt.devcenter.types.ProjectPolicyProperties
module: azure.mgmt.devcenter.types
summary: Properties of an project policy.
constructor:
  syntax: ProjectPolicyProperties()
variables:
- description: Resource policies that are a part of this project policy.
  name: resource_policies
  types:
  - <xref:list>[<xref:"ResourcePolicy">]
- description: 'Resources that have access to the shared resources that are a part
    of this

    project policy.'
  name: scopes
  types:
  - <xref:list>[<xref:str>]
- description: Configuration Policies part of this project policy.
  name: configuration_policies
  types:
  - <xref:<xref:"ConfigurationPolicies">>
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.devcenter.types.ProjectPolicyProperties.provisioningState
  name: provisioningState
  summary: '"NotSpecified", "Accepted",

    "Running", "Creating", "Created", "Updating", "Updated", "Deleting", "Deleted",

    "Succeeded", "Failed", "Canceled", "MovingResources", "TransientFailure",

    "RolloutInProgress", and "StorageProvisioningFailed".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.devcenter.types.ProjectPolicyProperties.configurationPolicies
  name: configurationPolicies
  signature: 'configurationPolicies: ConfigurationPolicies'
- uid: azure.mgmt.devcenter.types.ProjectPolicyProperties.resourcePolicies
  name: resourcePolicies
  signature: 'resourcePolicies: list[''ResourcePolicy'']'
- uid: azure.mgmt.devcenter.types.ProjectPolicyProperties.scopes
  name: scopes
  signature: 'scopes: list[str]'
