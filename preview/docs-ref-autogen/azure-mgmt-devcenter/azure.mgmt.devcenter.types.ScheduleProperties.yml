uid: azure.mgmt.devcenter.types.ScheduleProperties
name: ScheduleProperties
fullName: azure.mgmt.devcenter.types.ScheduleProperties
module: azure.mgmt.devcenter.types
summary: The Schedule properties defining when and what to execute.
constructor:
  syntax: ScheduleProperties()
variables:
- description: Resource tags.
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: The geo-location where the resource lives.
  name: location
  types:
  - <xref:str>
- description: Supported type this scheduled task represents. "StopDevBox"
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScheduledType">]
- description: The frequency of this scheduled task. "Daily"
  name: frequency
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScheduledFrequency">]
- description: The target time to trigger the action. The format is HH:MM.
  name: time
  types:
  - <xref:str>
- description: The IANA timezone id at which the schedule should execute.
  name: time_zone
  types:
  - <xref:str>
- description: 'Indicates whether or not this scheduled task is enabled. Known values
    are:

    "Enabled" and "Disabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScheduleEnableStatus">]
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
