### YamlMime:PythonClass
uid: azure.mgmt.devcenter.models.ProjectProperties
name: ProjectProperties
fullName: azure.mgmt.devcenter.models.ProjectProperties
module: azure.mgmt.devcenter.models
summary: Properties of a project.
constructor:
  syntax: 'ProjectProperties(*args: Any, **kwargs: Any)'
variables:
- description: Resource Id of an associated DevCenter.
  name: dev_center_id
  types:
  - <xref:str>
- description: Description of the project.
  name: description
  types:
  - <xref:str>
- description: 'When specified, limits the maximum number of Dev Boxes a single

    user can create across all pools in the project. This will have no effect on existing
    Dev Boxes

    when reduced.'
  name: max_dev_boxes_per_user
  types:
  - <xref:int>
- description: The display name of the project.
  name: display_name
  types:
  - <xref:str>
- description: Settings to be used when associating a project with a catalog.
  name: catalog_settings
  types:
  - <xref:azure.mgmt.devcenter.models.ProjectCatalogSettings>
- description: Settings to be used for customizations.
  name: customization_settings
  types:
  - <xref:azure.mgmt.devcenter.models.ProjectCustomizationSettings>
- description: Dev Box Schedule Delete settings.
  name: dev_box_schedule_delete_settings
  types:
  - <xref:azure.mgmt.devcenter.models.DevBoxScheduleDeleteSettings>
- description: 'Indicates whether Azure AI services are enabled for a

    project.'
  name: azure_ai_services_settings
  types:
  - <xref:azure.mgmt.devcenter.models.AzureAiServicesSettings>
- description: Settings to be used for serverless GPU.
  name: serverless_gpu_sessions_settings
  types:
  - <xref:azure.mgmt.devcenter.models.ServerlessGpuSessionsSettings>
- description: Settings to be used for workspace storage.
  name: workspace_storage_settings
  types:
  - <xref:azure.mgmt.devcenter.models.WorkspaceStorageSettings>
- description: List of Entra ID group assignments associated with this project.
  name: assigned_groups
  types:
  - <xref:list>[<xref:azure.mgmt.devcenter.models.AssignedGroup>]
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.devcenter.models.ProvisioningState>
- description: The URI of the Dev Center resource this project is associated with.
  name: dev_center_uri
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.devcenter.models.ProjectProperties.dev_center_uri
  name: dev_center_uri
  summary: The URI of the Dev Center resource this project is associated with.
  signature: 'dev_center_uri: str | None'
- uid: azure.mgmt.devcenter.models.ProjectProperties.provisioning_state
  name: provisioning_state
  summary: '"NotSpecified", "Accepted",

    "Running", "Creating", "Created", "Updating", "Updated", "Deleting", "Deleted",

    "Succeeded", "Failed", "Canceled", "MovingResources", "TransientFailure",

    "RolloutInProgress", and "StorageProvisioningFailed".'
  signature: 'provisioning_state: str | _models.ProvisioningState | None'
