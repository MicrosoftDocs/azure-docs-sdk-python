### YamlMime:PythonClass
uid: azure.mgmt.devcenter.models.DevCenterProperties
name: DevCenterProperties
fullName: azure.mgmt.devcenter.models.DevCenterProperties
module: azure.mgmt.devcenter.models
summary: Properties of the devcenter.
constructor:
  syntax: 'DevCenterProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'Encryption settings to be used for server-side encryption for proprietary

    content (such as catalogs, logs, customizations).'
  name: encryption
  types:
  - <xref:azure.mgmt.devcenter.models.Encryption>
- description: The display name of the devcenter.
  name: display_name
  types:
  - <xref:str>
- description: 'Dev Center settings to be used when associating a project with

    a catalog.'
  name: project_catalog_settings
  types:
  - <xref:azure.mgmt.devcenter.models.DevCenterProjectCatalogSettings>
- description: 'Network settings that will be enforced on network resources associated

    with the Dev Center.'
  name: network_settings
  types:
  - <xref:azure.mgmt.devcenter.models.DevCenterNetworkSettings>
- description: 'Settings to be used in the provisioning of all Dev Boxes

    that belong to this dev center.'
  name: dev_box_provisioning_settings
  types:
  - <xref:azure.mgmt.devcenter.models.DevBoxProvisioningSettings>
- description: 'The provisioning state of the resource. Known values are:

    "NotSpecified", "Accepted", "Running", "Creating", "Created", "Updating", "Updated",

    "Deleting", "Deleted", "Succeeded", "Failed", "Canceled", "MovingResources",

    "TransientFailure", "RolloutInProgress", and "StorageProvisioningFailed".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.devcenter.models.ProvisioningState>
- description: The URI of the Dev Center.
  name: dev_center_uri
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.devcenter.models.DevCenterProperties.dev_center_uri
  name: dev_center_uri
  summary: The URI of the Dev Center.
  signature: 'dev_center_uri: str | None'
- uid: azure.mgmt.devcenter.models.DevCenterProperties.provisioning_state
  name: provisioning_state
  summary: '"NotSpecified", "Accepted",

    "Running", "Creating", "Created", "Updating", "Updated", "Deleting", "Deleted",

    "Succeeded", "Failed", "Canceled", "MovingResources", "TransientFailure",

    "RolloutInProgress", and "StorageProvisioningFailed".'
  signature: 'provisioning_state: str | _models.ProvisioningState | None'
