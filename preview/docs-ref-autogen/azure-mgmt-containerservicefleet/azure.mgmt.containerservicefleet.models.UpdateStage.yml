### YamlMime:PythonClass
uid: azure.mgmt.containerservicefleet.models.UpdateStage
name: UpdateStage
fullName: azure.mgmt.containerservicefleet.models.UpdateStage
module: azure.mgmt.containerservicefleet.models
summary: 'Defines a stage which contains the groups to update and the steps to take
  (e.g., wait for a

  time period) before starting the next stage.'
constructor:
  syntax: 'UpdateStage(*args: Any, **kwargs: Any)'
variables:
- description: The name of the stage. Must be unique within the UpdateRun. Required.
  name: name
  types:
  - <xref:str>
- description: 'Defines the groups to be executed in parallel in this stage. Duplicate
    groups are

    not allowed. Min size: 1.'
  name: groups
  types:
  - <xref:list>[<xref:azure.mgmt.containerservicefleet.models.UpdateGroup>]
- description: "Select the members of the stage.\n\n* If specified without UpdateGroup,\
    \ one implicit group containing the selected members will be created. \n\n* If\
    \ specified with UpdateGroup, members will be pre-filtered before group-level\
    \ selection logic is applied. \n\n* If not specified, group-level selection logic\
    \ will be used."
  name: member_selector
  types:
  - <xref:azure.mgmt.containerservicefleet.models.MemberSelector>
- description: 'The time in seconds to wait at the end of this stage before

    starting the next one. Defaults to 0 seconds if unspecified.'
  name: after_stage_wait_in_seconds
  types:
  - <xref:int>
- description: "Limits the number of member (cluster) upgrade failures tolerated\n\
    within this stage. Failures are evaluated over all members within all groups within\
    \ this stage.\nAccepts either: \u2022 A fixed count n, where n >= 0 \u2022 A percentage\
    \ p%, where 0 <= p <= 100\nPercentage resolves at stage start using: resolvedThreshold\
    \ = ceil(p * N), where p is the\npercentage as a decimal and N is the number of\
    \ members in this stage at scope start. Examples:\n\u2022 \"3\"   \u2013> up to\
    \ 3 member upgrade failures are tolerated within this stage. The 4th failure\n\
    would cause the entire stage to fail. \u2022 \"25%\" \u2013> up to 25% of the\
    \ members in this stage can\nfail their upgrade before the stage is considered\
    \ failed."
  name: max_allowed_failures
  types:
  - <xref:str>
- description: "The max number of upgrades that can run concurrently across all groups\n\
    in this stage. Acts as a ceiling (and not a quota) for the number of concurrent\
    \ upgrades within\nthe stage you want to tolerate at a time. Actual concurrency\
    \ may be lower depending on\ngroup-level concurrency limits or individual member\
    \ conditions. Stage maxConcurrency has a min\nvalue of \"1\". Accepts either:\
    \ \u2022 A fixed count, e.g., \"3\" \u2022 A percentage, e.g., \"25%\" (range\n\
    1\u2013100). Percentage is of the total number of clusters across all groups in\
    \ the stage.\nFractional results are rounded down. A minimum of 1 upgrade is enforced.\
    \ Examples: \u2022 \"3\"\n\u2013> up to 3 clusters from this stage upgrade at\
    \ once (across all groups). \u2022 \"100%\"  \u2013> \"all at\nonce\"; up to all\
    \ clusters in this stage upgrade at the same time. \u2022 \"25%\"   \u2013> up\
    \ to 25% of\nthe stage's total clusters upgrade at the same time."
  name: max_concurrency
  types:
  - <xref:str>
- description: A list of Gates that will be created before this Stage is executed.
  name: before_gates
  types:
  - <xref:list>[<xref:azure.mgmt.containerservicefleet.models.GateConfiguration>]
- description: A list of Gates that will be created after this Stage is executed.
  name: after_gates
  types:
  - <xref:list>[<xref:azure.mgmt.containerservicefleet.models.GateConfiguration>]
attributes:
- uid: azure.mgmt.containerservicefleet.models.UpdateStage.after_gates
  name: after_gates
  summary: A list of Gates that will be created after this Stage is executed.
  signature: 'after_gates: list[''_models.GateConfiguration''] | None'
- uid: azure.mgmt.containerservicefleet.models.UpdateStage.after_stage_wait_in_seconds
  name: after_stage_wait_in_seconds
  summary: 'The time in seconds to wait at the end of this stage before starting the
    next one. Defaults to

    0 seconds if unspecified.'
  signature: 'after_stage_wait_in_seconds: int | None'
- uid: azure.mgmt.containerservicefleet.models.UpdateStage.before_gates
  name: before_gates
  summary: A list of Gates that will be created before this Stage is executed.
  signature: 'before_gates: list[''_models.GateConfiguration''] | None'
- uid: azure.mgmt.containerservicefleet.models.UpdateStage.groups
  name: groups
  summary: 'Defines the groups to be executed in parallel in this stage. Duplicate
    groups are not allowed.

    Min size: 1.'
  signature: 'groups: list[''_models.UpdateGroup''] | None'
- uid: azure.mgmt.containerservicefleet.models.UpdateStage.max_allowed_failures
  name: max_allowed_failures
  summary: "Limits the number of member (cluster) upgrade failures tolerated within\
    \ this stage. Failures\nare evaluated over all members within all groups within\
    \ this stage. Accepts either: \u2022 A fixed\ncount n, where n >= 0 \u2022 A percentage\
    \ p%, where 0 <= p <= 100 Percentage resolves at stage start\nusing: resolvedThreshold\
    \ = ceil(p * N), where p is the percentage as a decimal and N is the\nnumber of\
    \ members in this stage at scope start. Examples: \u2022 \"3\"   \u2013> up to\
    \ 3 member upgrade\nfailures are tolerated within this stage. The 4th failure\
    \ would cause the entire stage to fail.\n\u2022 \"25%\" \u2013> up to 25% of the\
    \ members in this stage can fail their upgrade before the stage is\nconsidered\
    \ failed."
  signature: 'max_allowed_failures: str | None'
- uid: azure.mgmt.containerservicefleet.models.UpdateStage.max_concurrency
  name: max_concurrency
  summary: "The max number of upgrades that can run concurrently across all groups\
    \ in this stage. Acts as a\nceiling (and not a quota) for the number of concurrent\
    \ upgrades within the stage you want to\ntolerate at a time. Actual concurrency\
    \ may be lower depending on group-level concurrency limits\nor individual member\
    \ conditions. Stage maxConcurrency has a min value of \"1\". Accepts either:\n\
    \u2022 A fixed count, e.g., \"3\" \u2022 A percentage, e.g., \"25%\" (range 1\u2013\
    100). Percentage is of the\ntotal number of clusters across all groups in the\
    \ stage. Fractional results are rounded down. A\nminimum of 1 upgrade is enforced.\
    \ Examples: \u2022 \"3\"     \u2013> up to 3 clusters from this stage\nupgrade\
    \ at once (across all groups). \u2022 \"100%\"  \u2013> \"all at once\"; up to\
    \ all clusters in this\nstage upgrade at the same time. \u2022 \"25%\"   \u2013\
    > up to 25% of the stage's total clusters upgrade\nat the same time."
  signature: 'max_concurrency: str | None'
- uid: azure.mgmt.containerservicefleet.models.UpdateStage.member_selector
  name: member_selector
  summary: "Select the members of the stage.\n\n* If specified without UpdateGroup,\
    \ one implicit group containing the selected members will be created. \n\n* If\
    \ specified with UpdateGroup, members will be pre-filtered before group-level\
    \ selection logic is applied. \n\n* If not specified, group-level selection logic\
    \ will be used. "
  signature: 'member_selector: _models.MemberSelector | None'
- uid: azure.mgmt.containerservicefleet.models.UpdateStage.name
  name: name
  summary: The name of the stage. Must be unique within the UpdateRun. Required.
  signature: 'name: str'
