### YamlMime:PythonClass
uid: azure.mgmt.containerservicefleet.types.LabelSelectorRequirementPatch
name: LabelSelectorRequirementPatch
fullName: azure.mgmt.containerservicefleet.types.LabelSelectorRequirementPatch
module: azure.mgmt.containerservicefleet.types
summary: A label selector requirement that can be patched.
constructor:
  syntax: LabelSelectorRequirementPatch()
variables:
- description: key is the label key that the selector applies to.
  name: key
  types:
  - <xref:str>
- description: 'operator represents a key''s relationship to a set of values. Valid
    operators

    are In, NotIn, Exists and DoesNotExist. Known values are: "In", "NotIn", "Exists",
    and

    "DoesNotExist".'
  name: operator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LabelSelectorOperator">]
- description: 'values is an array of string values. If the operator is In or NotIn,
    the values

    array must be non-empty. If the operator is Exists or DoesNotExist, the values
    array must be

    empty. This array is replaced during a strategic merge patch.'
  name: values
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.containerservicefleet.types.LabelSelectorRequirementPatch.key
  name: key
  summary: key is the label key that the selector applies to.
  signature: 'key: str'
- uid: azure.mgmt.containerservicefleet.types.LabelSelectorRequirementPatch.operator
  name: operator
  summary: 'operator represents a key''s relationship to a set of values. Valid operators
    are In, NotIn,

    Exists and DoesNotExist. Known values are: "In", "NotIn", "Exists", and "DoesNotExist".'
  signature: 'operator: str | LabelSelectorOperator'
