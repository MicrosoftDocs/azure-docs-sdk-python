### YamlMime:PythonClass
uid: azure.mgmt.containerservicefleet.types.ClusterAffinity
name: ClusterAffinity
fullName: azure.mgmt.containerservicefleet.types.ClusterAffinity
module: azure.mgmt.containerservicefleet.types
summary: ClusterAffinity contains cluster affinity scheduling rules for the selected
  resources.
constructor:
  syntax: ClusterAffinity()
variables:
- description: 'If the affinity requirements specified by

    this field are not met at scheduling time, the resource will not be scheduled
    onto the cluster.

    If the affinity requirements specified by this field cease to be met at some point
    after the

    placement (e.g. due to an update), the system may or may not try to eventually
    remove the

    resource from the cluster.'
  name: requiredDuringSchedulingIgnoredDuringExecution
  types:
  - <xref:<xref:"ClusterSelector">>
attributes:
- uid: azure.mgmt.containerservicefleet.types.ClusterAffinity.requiredDuringSchedulingIgnoredDuringExecution
  name: requiredDuringSchedulingIgnoredDuringExecution
  summary: 'If the affinity requirements specified by this field are not met at scheduling
    time, the

    resource will not be scheduled onto the cluster. If the affinity requirements
    specified by this

    field cease to be met at some point after the placement (e.g. due to an update),
    the system may

    or may not try to eventually remove the resource from the cluster.'
  signature: 'requiredDuringSchedulingIgnoredDuringExecution: ClusterSelector'
