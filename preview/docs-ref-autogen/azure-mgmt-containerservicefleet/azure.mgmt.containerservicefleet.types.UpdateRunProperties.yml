### YamlMime:PythonClass
uid: azure.mgmt.containerservicefleet.types.UpdateRunProperties
name: UpdateRunProperties
fullName: azure.mgmt.containerservicefleet.types.UpdateRunProperties
module: azure.mgmt.containerservicefleet.types
summary: The properties of the UpdateRun.
constructor:
  syntax: UpdateRunProperties()
variables:
- description: 'The provisioning state of the UpdateRun resource. Known values are:

    "Succeeded", "Failed", and "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UpdateRunProvisioningState">]
- description: "The resource id of the FleetUpdateStrategy resource to reference.\n\
    \nWhen creating a new run, there are three ways to define a strategy for the run:\n\
    \n1. Define a new strategy in place: Set the \"strategy\" field. \n\n2. Use an\
    \ existing strategy: Set the \"updateStrategyId\" field. (since 2023-08-15-preview)\
    \ \n\n3. Use the default strategy to update all the members one by one: Leave\
    \ both \"updateStrategyId\"\nand \"strategy\" unset. (since 2023-08-15-preview)\n\
    \nSetting both \"updateStrategyId\" and \"strategy\" is invalid.\n\nUpdateRuns\
    \ created by \"updateStrategyId\" snapshot the referenced UpdateStrategy at the\
    \ time of\ncreation and store it in the \"strategy\" field.\nSubsequent changes\
    \ to the referenced FleetUpdateStrategy resource do not propagate.\nUpdateRunStrategy\
    \ changes can be made directly on the \"strategy\" field before launching the\n\
    UpdateRun."
  name: updateStrategyId
  types:
  - <xref:str>
- description: 'The strategy defines the order in which the clusters will be updated.
    If not

    set, all members will be updated sequentially. The UpdateRun status will show
    a single

    UpdateStage and a single UpdateGroup targeting all members. The strategy of the
    UpdateRun can

    be modified until the run is started.'
  name: strategy
  types:
  - <xref:<xref:"UpdateRunStrategy">>
- description: 'The update to be applied to all clusters in the UpdateRun. The

    managedClusterUpdate can be modified until the run is started. Required.'
  name: managedClusterUpdate
  types:
  - <xref:<xref:"ManagedClusterUpdate">>
- description: The status of the UpdateRun.
  name: status
  types:
  - <xref:<xref:"UpdateRunStatus">>
- description: AutoUpgradeProfileId is the id of an auto upgrade profile resource.
  name: autoUpgradeProfileId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerservicefleet.types.UpdateRunProperties.autoUpgradeProfileId
  name: autoUpgradeProfileId
  summary: AutoUpgradeProfileId is the id of an auto upgrade profile resource.
  signature: 'autoUpgradeProfileId: str'
- uid: azure.mgmt.containerservicefleet.types.UpdateRunProperties.managedClusterUpdate
  name: managedClusterUpdate
  summary: 'The update to be applied to all clusters in the UpdateRun. The managedClusterUpdate
    can be

    modified until the run is started. Required.'
  signature: 'managedClusterUpdate: Required[ManagedClusterUpdate]'
- uid: azure.mgmt.containerservicefleet.types.UpdateRunProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    and "Canceled".'
  signature: 'provisioningState: str | UpdateRunProvisioningState'
- uid: azure.mgmt.containerservicefleet.types.UpdateRunProperties.status
  name: status
  summary: The status of the UpdateRun.
  signature: 'status: UpdateRunStatus'
- uid: azure.mgmt.containerservicefleet.types.UpdateRunProperties.strategy
  name: strategy
  summary: 'The strategy defines the order in which the clusters will be updated.
    If not set, all members

    will be updated sequentially. The UpdateRun status will show a single UpdateStage
    and a single

    UpdateGroup targeting all members. The strategy of the UpdateRun can be modified
    until the run

    is started.'
  signature: 'strategy: UpdateRunStrategy'
- uid: azure.mgmt.containerservicefleet.types.UpdateRunProperties.updateStrategyId
  name: updateStrategyId
  summary: "The resource id of the FleetUpdateStrategy resource to reference.\n\n\
    When creating a new run, there are three ways to define a strategy for the run:\n\
    \n1. Define a new strategy in place: Set the \"strategy\" field. \n\n2. Use an\
    \ existing strategy: Set the \"updateStrategyId\" field. (since 2023-08-15-preview)\
    \ \n\n3. Use the default strategy to update all the members one by one: Leave\
    \ both\n\"updateStrategyId\" and \"strategy\" unset. (since 2023-08-15-preview)\n\
    \nSetting both \"updateStrategyId\" and \"strategy\" is invalid.\n\nUpdateRuns\
    \ created by \"updateStrategyId\" snapshot the referenced UpdateStrategy at the\
    \ time\nof creation and store it in the \"strategy\" field.\nSubsequent changes\
    \ to the referenced FleetUpdateStrategy resource do not propagate.\nUpdateRunStrategy\
    \ changes can be made directly on the \"strategy\" field before launching the\n\
    UpdateRun."
  signature: 'updateStrategyId: str'
