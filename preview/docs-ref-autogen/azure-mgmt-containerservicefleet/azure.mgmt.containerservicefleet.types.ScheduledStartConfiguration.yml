variables:
- description: 'The day of the week when the scheduled start occurs. Required. Known
    values

    are: "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", and "Sunday".'
  name: startDay
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DayOfWeek">]
