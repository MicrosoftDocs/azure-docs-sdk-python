### YamlMime:PythonClass
uid: azure.mgmt.containerservicefleet.types.UpdateRunStrategy
name: UpdateRunStrategy
fullName: azure.mgmt.containerservicefleet.types.UpdateRunStrategy
module: azure.mgmt.containerservicefleet.types
summary: 'Defines the update sequence of the clusters via stages and groups.


  Stages within a run are executed sequentially one after another.

  Groups within a stage are executed in parallel.

  Member clusters within a group are updated sequentially one after another.


  A valid strategy contains no duplicate groups within or across stages.'
constructor:
  syntax: UpdateRunStrategy()
variables:
- description: 'The list of stages that compose this update run. Min size: 1. Required.'
  name: stages
  types:
  - <xref:list>[<xref:"UpdateStage">]
attributes:
- uid: azure.mgmt.containerservicefleet.types.UpdateRunStrategy.stages
  name: stages
  summary: '1. Required. '
  signature: 'stages: list[azure.mgmt.containerservicefleet.types.UpdateStage]'
