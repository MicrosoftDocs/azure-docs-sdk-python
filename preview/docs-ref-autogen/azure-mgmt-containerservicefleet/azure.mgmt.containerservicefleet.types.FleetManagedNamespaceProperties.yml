- uid: azure.mgmt.containerservicefleet.types.FleetManagedNamespaceProperties.deletePolicy
  name: deletePolicy
  summary: 'Delete options of a fleet managed namespace. Default is Keep. Required.
    Known values are:

    "Keep" and "Delete".'
  signature: 'deletePolicy: Required[str | DeletePolicy]'
- uid: azure.mgmt.containerservicefleet.types.FleetManagedNamespaceProperties.managedNamespaceProperties
  name: managedNamespaceProperties
  summary: The namespace properties for the fleet managed namespace.
  signature: 'managedNamespaceProperties: ManagedNamespaceProperties'
