### YamlMime:PythonClass
uid: azure.mgmt.containerservicefleet.types.FleetManagedNamespaceProperties
name: FleetManagedNamespaceProperties
fullName: azure.mgmt.containerservicefleet.types.FleetManagedNamespaceProperties
module: azure.mgmt.containerservicefleet.types
summary: The properties of a fleet managed namespace.
constructor:
  syntax: FleetManagedNamespaceProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FleetManagedNamespaceProvisioningState">]
- description: The namespace properties for the fleet managed namespace.
  name: managedNamespaceProperties
  types:
  - <xref:<xref:"ManagedNamespaceProperties">>
- description: 'Action if the managed namespace with the same name already exists.

    Default is Never. Required. Known values are: "Never", "IfIdentical", and "Always".'
  name: adoptionPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AdoptionPolicy">]
- description: 'Delete options of a fleet managed namespace. Default is Keep. Required.

    Known values are: "Keep" and "Delete".'
  name: deletePolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeletePolicy">]
- description: The profile of the propagation to create the namespace.
  name: propagationPolicy
  types:
  - <xref:<xref:"PropagationPolicy">>
- description: Status information of the last operation for fleet managed namespace.
  name: status
  types:
  - <xref:<xref:"FleetManagedNamespaceStatus">>
- description: The Azure Portal FQDN of the Fleet hub.
  name: portalFqdn
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerservicefleet.types.FleetManagedNamespaceProperties.adoptionPolicy
  name: adoptionPolicy
  summary: 'Action if the managed namespace with the same name already exists. Default
