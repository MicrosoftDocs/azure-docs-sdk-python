    hierarchy only: a top-level category leaves this unset, and a sub-category sets
    this to its

    top-level parent''s category id. Sub-categories cannot themselves have sub-categories,
    and a

    category must not reference itself as its own parent.'
  name: parent_category_id
  types:
  - <xref:str>
- description: 'Owners of the validation test category, expressed as team or distribution
    list

    aliases. Individual user aliases and directory object identifiers are not published
    in this

    field. Only catalog publishers set this value through an internal publishing process;
    end users

    of the validation service consume catalog entries read-only through Get/List and
    cannot modify

    it.'
  name: owners
  types:
  - <xref:list>[<xref:str>]
