variables:
- description: Display name of the validation test category.
  name: display_name
  types:
  - <xref:str>
- description: Validation test category description.
  name: description
  types:
  - <xref:str>
- description: 'Audience visibility of this validation test category. Known values
    are:

    "Public" and "Internal".'
  name: audience
  types:
  - <xref:str>
  - <xref:azure.mgmt.platformvalidation.models.CatalogAudience>
- description: 'Provisioning state of the validation test category catalog resource.

    Known values are: "Succeeded", "Failed", and "Canceled".'
