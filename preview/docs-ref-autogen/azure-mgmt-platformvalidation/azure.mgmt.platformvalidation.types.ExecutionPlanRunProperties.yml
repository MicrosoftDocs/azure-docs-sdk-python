### YamlMime:PythonClass
uid: azure.mgmt.platformvalidation.types.ExecutionPlanRunProperties
name: ExecutionPlanRunProperties
fullName: azure.mgmt.platformvalidation.types.ExecutionPlanRunProperties
module: azure.mgmt.platformvalidation.types
summary: The properties of the execution plan run.
constructor:
  syntax: ExecutionPlanRunProperties()
variables:
- description: The description of the resource.
  name: description
  types:
  - <xref:str>
- description: 'The status of the execution plan run. Known values are: "Succeeded",
    "Queued",

    "Running", "Completed", "Failed", "TimedOut", and "Unknown".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExecutionPlanRunStatus">]
- description: Error details. Populated when status is Failed, TimedOut, or Unknown.
  name: error
  types:
  - <xref:<xref:"ErrorDetail">>
- description: The start time of the execution plan run.
  name: startedAt
  types:
  - <xref:str>
- description: The completion time of the execution plan run.
  name: completedAt
  types:
  - <xref:str>
- description: The time at which the execution result was reported.
  name: reportedAt
  types:
  - <xref:str>
- description: Summary of tests executed for this run.
  name: testRunSummary
  types:
  - <xref:<xref:"TestRunSummary">>
- description: 'Snapshot of the execution plan configuration captured at

    trigger time.'
  name: planConfigurationSnapshot
  types:
  - <xref:str>
- description: 'The ARM resource IDs of the validation test runs (ValidationTestRun

    resources) executed as part of this execution plan run.'
  name: testRunIds
  types:
  - <xref:list>[<xref:str>]
- description: 'The provisioning state of the execution plan run. Known values are:

    "Succeeded", "Failed", "Canceled", "Creating", "Running", "Waiting", and "Processing".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExecutionPlanRunProvisioningState">]
attributes:
- uid: azure.mgmt.platformvalidation.types.ExecutionPlanRunProperties.completedAt
  name: completedAt
  summary: The completion time of the execution plan run.
  signature: 'completedAt: str'
- uid: azure.mgmt.platformvalidation.types.ExecutionPlanRunProperties.description
  name: description
  summary: The description of the resource.
  signature: 'description: str'
- uid: azure.mgmt.platformvalidation.types.ExecutionPlanRunProperties.error
  name: error
  summary: Error details. Populated when status is Failed, TimedOut, or Unknown.
  signature: 'error: ErrorDetail'
- uid: azure.mgmt.platformvalidation.types.ExecutionPlanRunProperties.planConfigurationSnapshot
  name: planConfigurationSnapshot
  summary: Snapshot of the execution plan configuration captured at trigger time.
  signature: 'planConfigurationSnapshot: str'
- uid: azure.mgmt.platformvalidation.types.ExecutionPlanRunProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Creating", "Running", "Waiting", and "Processing".'
  signature: 'provisioningState: str | ExecutionPlanRunProvisioningState'
- uid: azure.mgmt.platformvalidation.types.ExecutionPlanRunProperties.reportedAt
  name: reportedAt
  summary: The time at which the execution result was reported.
  signature: 'reportedAt: str'
- uid: azure.mgmt.platformvalidation.types.ExecutionPlanRunProperties.startedAt
  name: startedAt
  summary: The start time of the execution plan run.
  signature: 'startedAt: str'
- uid: azure.mgmt.platformvalidation.types.ExecutionPlanRunProperties.status
  name: status
  summary: '"Succeeded", "Queued", "Running",

    "Completed", "Failed", "TimedOut", and "Unknown".'
  signature: 'status: str | ExecutionPlanRunStatus'
- uid: azure.mgmt.platformvalidation.types.ExecutionPlanRunProperties.testRunIds
  name: testRunIds
  summary: 'The ARM resource IDs of the validation test runs (ValidationTestRun resources)
    executed as part

    of this execution plan run.'
  signature: 'testRunIds: list[str]'
- uid: azure.mgmt.platformvalidation.types.ExecutionPlanRunProperties.testRunSummary
  name: testRunSummary
  summary: Summary of tests executed for this run.
  signature: 'testRunSummary: TestRunSummary'
