### YamlMime:PythonClass
uid: azure.mgmt.platformvalidation.models.ExecutionPlanRunProperties
name: ExecutionPlanRunProperties
fullName: azure.mgmt.platformvalidation.models.ExecutionPlanRunProperties
module: azure.mgmt.platformvalidation.models
summary: The properties of the execution plan run.
constructor:
  syntax: 'ExecutionPlanRunProperties(*args: Any, **kwargs: Any)'
variables:
- description: The description of the resource.
  name: description
  types:
  - <xref:str>
- description: 'The status of the execution plan run. Known values are: "Succeeded",
    "Queued",

    "Running", "Completed", "Failed", "TimedOut", and "Unknown".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.mgmt.platformvalidation.models.ExecutionPlanRunStatus>
- description: Error details. Populated when status is Failed, TimedOut, or Unknown.
  name: error
  types:
  - <xref:azure.mgmt.platformvalidation.models.ErrorDetail>
- description: The start time of the execution plan run.
  name: started_at
  types:
  - <xref:datetime.datetime>
- description: The completion time of the execution plan run.
  name: completed_at
  types:
  - <xref:datetime.datetime>
- description: The time at which the execution result was reported.
  name: reported_at
  types:
  - <xref:datetime.datetime>
- description: Summary of tests executed for this run.
  name: test_run_summary
  types:
  - <xref:azure.mgmt.platformvalidation.models.TestRunSummary>
- description: 'Snapshot of the execution plan configuration captured at

    trigger time.'
  name: plan_configuration_snapshot
  types:
  - <xref:str>
- description: 'The ARM resource IDs of the validation test runs (ValidationTestRun

    resources) executed as part of this execution plan run.'
  name: test_run_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The provisioning state of the execution plan run. Known values are:

    "Succeeded", "Failed", "Canceled", "Creating", "Running", "Waiting", and "Processing".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.platformvalidation.models.ExecutionPlanRunProvisioningState>
