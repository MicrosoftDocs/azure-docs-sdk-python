### YamlMime:PythonClass
uid: azure.mgmt.platformvalidation.types.TestRunSummary
name: TestRunSummary
fullName: azure.mgmt.platformvalidation.types.TestRunSummary
module: azure.mgmt.platformvalidation.types
summary: Execution summary details for a validation test run collection.
constructor:
  syntax: TestRunSummary()
variables:
- description: Total number of tests executed.
  name: totalTests
  types:
  - <xref:int>
- description: Number of passed tests.
  name: passedTests
  types:
  - <xref:int>
- description: Number of failed tests.
  name: failedTests
  types:
  - <xref:int>
- description: Number of skipped tests.
  name: skippedTests
  types:
  - <xref:int>
- description: 'Overall result for the execution plan run. Known values are: "Passed",

    "Failed", and "PartiallyPassed".'
  name: overallResult
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TestRunOverallResult">]
- description: Human-readable summary message.
  name: message
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.platformvalidation.types.TestRunSummary.failedTests
  name: failedTests
  summary: Number of failed tests.
  signature: 'failedTests: int'
- uid: azure.mgmt.platformvalidation.types.TestRunSummary.message
  name: message
  summary: Human-readable summary message.
  signature: 'message: str'
- uid: azure.mgmt.platformvalidation.types.TestRunSummary.overallResult
  name: overallResult
  summary: '"Passed", "Failed", and

    "PartiallyPassed".'
  signature: 'overallResult: str | TestRunOverallResult'
- uid: azure.mgmt.platformvalidation.types.TestRunSummary.passedTests
  name: passedTests
  summary: Number of passed tests.
  signature: 'passedTests: int'
- uid: azure.mgmt.platformvalidation.types.TestRunSummary.skippedTests
  name: skippedTests
  summary: Number of skipped tests.
  signature: 'skippedTests: int'
- uid: azure.mgmt.platformvalidation.types.TestRunSummary.totalTests
  name: totalTests
  summary: Total number of tests executed.
  signature: 'totalTests: int'
