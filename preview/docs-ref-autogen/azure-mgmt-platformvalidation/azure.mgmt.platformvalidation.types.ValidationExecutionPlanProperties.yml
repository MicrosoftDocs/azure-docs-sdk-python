- uid: azure.mgmt.platformvalidation.types.ValidationExecutionPlanProperties.planConfigurationJson
  name: planConfigurationJson
  summary: 'Entire execution plan configuration/manifest json. Either this property
    or

    `planConfigurationUri` is mandatory while creating; they are mutually exclusive.
    In get,

    always return the entire json configuration. This value is returned as-is in get
    responses, so

    it must not contain credentials or other secrets.'
  signature: 'planConfigurationJson: str'
- uid: azure.mgmt.platformvalidation.types.ValidationExecutionPlanProperties.planConfigurationUri
  name: planConfigurationUri
  summary: 'URI where the configuration of the execution plan is defined. Either this
    property or

    `planConfigurationJson` is mandatory while creating; they are mutually exclusive.
    This must

    be a plain, non-SAS reference (no embedded credentials, tokens, or query-string
