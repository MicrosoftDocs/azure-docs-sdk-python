### YamlMime:PythonClass
uid: azure.mgmt.platformvalidation.types.ValidationExecutionPlanProperties
name: ValidationExecutionPlanProperties
fullName: azure.mgmt.platformvalidation.types.ValidationExecutionPlanProperties
module: azure.mgmt.platformvalidation.types
summary: Validation Test Execution Plan properties.
constructor:
  syntax: ValidationExecutionPlanProperties()
variables:
- description: The description of the resource.
  name: description
  types:
  - <xref:str>
- description: 'URI where the configuration of the execution plan is defined.

    Either this property or `planConfigurationJson` is mandatory while creating; they
    are

    mutually exclusive. This must be a plain, non-SAS reference (no embedded credentials,
    tokens,

    or query-string secrets); the service reads the referenced content using its managed
    identity.

    This value is returned as-is in get responses, so it must not contain credentials
    or other

    secrets.'
  name: planConfigurationUri
  types:
  - <xref:str>
- description: 'Entire execution plan configuration/manifest json. Either this

    property or `planConfigurationUri` is mandatory while creating; they are mutually
    exclusive.

    In get, always return the entire json configuration. This value is returned as-is
    in get

    responses, so it must not contain credentials or other secrets.'
  name: planConfigurationJson
  types:
  - <xref:str>
- description: 'The provisioning state of the resource. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", and "Updating".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ValidationExecutionPlanProvisioningState">]
- description: Error details. Populated when provisioningState is Failed or Canceled.
  name: error
  types:
  - <xref:<xref:"ErrorDetail">>
attributes:
- uid: azure.mgmt.platformvalidation.types.ValidationExecutionPlanProperties.description
  name: description
