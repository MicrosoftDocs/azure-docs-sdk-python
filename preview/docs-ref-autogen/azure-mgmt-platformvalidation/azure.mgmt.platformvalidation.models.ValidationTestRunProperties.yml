### YamlMime:PythonClass
uid: azure.mgmt.platformvalidation.models.ValidationTestRunProperties
name: ValidationTestRunProperties
fullName: azure.mgmt.platformvalidation.models.ValidationTestRunProperties
module: azure.mgmt.platformvalidation.models
summary: Validation Test Run properties.
constructor:
  syntax: 'ValidationTestRunProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The overall status of the test run. Known values are: "NotRunning",
    "Scheduled",

    "Ready", "Running", "Completed", "Stopped", and "Error".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.mgmt.platformvalidation.models.ValidationTestRunStatus>
- description: Error details. Populated when status is Error.
  name: error
  types:
  - <xref:azure.mgmt.platformvalidation.models.ErrorDetail>
- description: 'The state of the test run. Known values are: "Succeeded", "Failed",

    "Canceled", and "Running".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.platformvalidation.models.ValidationTestRunProvisioningState>
- description: The start time of the test run.
  name: started_at
  types:
  - <xref:datetime.datetime>
- description: The completion time of the test run.
  name: completed_at
  types:
  - <xref:datetime.datetime>
- description: The time at which the test run result was reported.
  name: reported_at
  types:
  - <xref:datetime.datetime>
- description: The resource ID of the validation test in the validation test catalog.
  name: test_id
  types:
  - <xref:str>
- description: 'Validation test run inputs json, conforming to the input contract
    declared

    by `ValidationTestInput` on the corresponding validation test. This value is returned
    as-is

    in get responses, so it must not contain credentials or other secrets.'
  name: inputs_json
  types:
  - <xref:str>
- description: Detailed pass information when the test passes.
  name: pass_details
  types:
  - <xref:list>[<xref:azure.mgmt.platformvalidation.models.ValidationTestPassDetails>]
- description: Detailed failure information when the test fails.
  name: failure_details
  types:
  - <xref:list>[<xref:azure.mgmt.platformvalidation.models.ValidationTestFailureDetails>]
attributes:
- uid: azure.mgmt.platformvalidation.models.ValidationTestRunProperties.completed_at
  name: completed_at
  summary: The completion time of the test run.
  signature: 'completed_at: datetime | None'
- uid: azure.mgmt.platformvalidation.models.ValidationTestRunProperties.error
  name: error
  summary: Error details. Populated when status is Error.
  signature: 'error: _models.ErrorDetail | None'
- uid: azure.mgmt.platformvalidation.models.ValidationTestRunProperties.failure_details
  name: failure_details
  summary: Detailed failure information when the test fails.
  signature: 'failure_details: list[''_models.ValidationTestFailureDetails''] | None'
- uid: azure.mgmt.platformvalidation.models.ValidationTestRunProperties.inputs_json
  name: inputs_json
  summary: 'Validation test run inputs json, conforming to the input contract declared
