### YamlMime:PythonClass
uid: azure.keyvault.keys.crypto.SecureWrapResult
name: SecureWrapResult
fullName: azure.keyvault.keys.crypto.SecureWrapResult
module: azure.keyvault.keys.crypto
summary: 'The result of a secure wrap key operation.


  The secure wrap operation creates a new 256-bit AES key inside the trusted execution
  environment

  (TEE) and returns the wrapped key bytes encrypted with the key wrapping key.'
constructor:
  syntax: 'SecureWrapResult(key_id: str | None, algorithm: KeySecureWrapAlgorithm,
    encrypted_key: bytes)'
  parameters:
  - name: key_id
    description: The wrapping key's Key Vault identifier.
    isRequired: true
    types:
    - <xref:str>
  - name: algorithm
    description: The secure key wrap algorithm used.
    isRequired: true
    types:
    - <xref:azure.keyvault.keys.crypto.KeySecureWrapAlgorithm>
  - name: encrypted_key
    description: The wrapped key bytes generated inside the TEE.
    isRequired: true
    types:
    - <xref:bytes>
