### YamlMime:PythonClass
uid: azure.mgmt.datadog.types.LogRules
name: LogRules
fullName: azure.mgmt.datadog.types.LogRules
module: azure.mgmt.datadog.types
summary: Set of rules for sending logs for the Monitor resource.
constructor:
  syntax: LogRules()
variables:
- description: Flag specifying if AAD logs should be sent for the Monitor resource.
  name: send_aad_logs
  types:
  - <xref:bool>
- description: 'Flag specifying if Azure subscription logs should be sent for the

    Monitor resource.'
  name: send_subscription_logs
  types:
  - <xref:bool>
- description: 'Flag specifying if Azure resource logs should be sent for the Monitor

    resource.'
  name: send_resource_logs
  types:
  - <xref:bool>
- description: 'List of filtering tags to be used for capturing logs. This only takes

    effect if SendResourceLogs flag is enabled. If empty, all resources will be captured.
    If only

    Exclude action is specified, the rules will apply to the list of all available
    resources. If

    Include actions are specified, the rules will only include resources with the
    associated tags.'
  name: filtering_tags
  types:
  - <xref:list>[<xref:"FilteringTag">]
attributes:
- uid: azure.mgmt.datadog.types.LogRules.filteringTags
  name: filteringTags
  summary: 'List of filtering tags to be used for capturing logs. This only takes
    effect if

    SendResourceLogs flag is enabled. If empty, all resources will be captured. If
    only Exclude

    action is specified, the rules will apply to the list of all available resources.
    If Include

    actions are specified, the rules will only include resources with the associated
    tags.'
  signature: 'filteringTags: list[azure.mgmt.datadog.types.FilteringTag]'
- uid: azure.mgmt.datadog.types.LogRules.sendAadLogs
  name: sendAadLogs
  summary: Flag specifying if AAD logs should be sent for the Monitor resource.
  signature: 'sendAadLogs: bool'
- uid: azure.mgmt.datadog.types.LogRules.sendResourceLogs
  name: sendResourceLogs
  summary: Flag specifying if Azure resource logs should be sent for the Monitor resource.
  signature: 'sendResourceLogs: bool'
- uid: azure.mgmt.datadog.types.LogRules.sendSubscriptionLogs
  name: sendSubscriptionLogs
  summary: Flag specifying if Azure subscription logs should be sent for the Monitor
    resource.
  signature: 'sendSubscriptionLogs: bool'
