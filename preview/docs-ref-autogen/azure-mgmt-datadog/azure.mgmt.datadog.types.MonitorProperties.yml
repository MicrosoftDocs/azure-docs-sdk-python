### YamlMime:PythonClass
uid: azure.mgmt.datadog.types.MonitorProperties
name: MonitorProperties
fullName: azure.mgmt.datadog.types.MonitorProperties
module: azure.mgmt.datadog.types
summary: Properties specific to the monitor resource.
constructor:
  syntax: MonitorProperties()
variables:
- description: 'Known values are: "Accepted", "Creating", "Updating", "Deleting",

    "Succeeded", "Failed", "Canceled", "Deleted", and "NotSpecified".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Flag specifying if the resource monitoring is enabled or disabled.

    Known values are: "Enabled" and "Disabled".'
  name: monitoring_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MonitoringStatus">]
- description: 'Flag specifying the Marketplace Subscription Status of

    the resource. If payment is not made in time, the resource will go in Suspended
    state. Known

    values are: "Provisioning", "Active", "Suspended", and "Unsubscribed".'
  name: marketplace_subscription_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MarketplaceSubscriptionStatus">]
- description: 'Specify the Datadog organization name. In the case of

    linking to existing organizations, Id, ApiKey, and Applicationkey is required
    as well.'
  name: datadog_organization_properties
  types:
  - <xref:<xref:"DatadogOrganizationProperties">>
- description: 'Includes name, email and optionally, phone number. User Information
    can''t be

    null.'
  name: user_info
  types:
  - <xref:<xref:"UserInfo">>
- description: 'Known values are: "Unknown" and "MonitorLogs".'
  name: liftr_resource_category
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LiftrResourceCategories">]
- description: The priority of the resource.
  name: liftr_resource_preference
  types:
  - <xref:int>
- description: SaaS details.
  name: saa_s_data
  types:
  - <xref:<xref:"SaaSData">>
- description: 'SRE Agent configuration to connect to MCP server of Datadog for

    given organization.'
  name: sre_agent_configuration
  types:
  - <xref:list>[<xref:"SreAgentConfiguration">]
- description: 'Details about the marketplace offer associated with the

    resource. Required for API version 2025-11 and later. For earlier API versions,
    defaults to the

    legacy offer.'
  name: marketplace_offer_details
  types:
  - <xref:<xref:"MarketplaceOfferDetails">>
attributes:
- uid: azure.mgmt.datadog.types.MonitorProperties.datadogOrganizationProperties
  name: datadogOrganizationProperties
  summary: 'Specify the Datadog organization name. In the case of linking to existing
    organizations, Id,

    ApiKey, and Applicationkey is required as well.'
  signature: 'datadogOrganizationProperties: DatadogOrganizationProperties'
- uid: azure.mgmt.datadog.types.MonitorProperties.liftrResourceCategory
  name: liftrResourceCategory
  summary: '"Unknown" and "MonitorLogs".'
  signature: 'liftrResourceCategory: str | LiftrResourceCategories'
- uid: azure.mgmt.datadog.types.MonitorProperties.liftrResourcePreference
  name: liftrResourcePreference
  summary: The priority of the resource.
  signature: 'liftrResourcePreference: int'
- uid: azure.mgmt.datadog.types.MonitorProperties.marketplaceOfferDetails
  name: marketplaceOfferDetails
  summary: 'Details about the marketplace offer associated with the resource. Required
    for API version

    2025-11 and later. For earlier API versions, defaults to the legacy offer.'
  signature: 'marketplaceOfferDetails: MarketplaceOfferDetails'
- uid: azure.mgmt.datadog.types.MonitorProperties.marketplaceSubscriptionStatus
  name: marketplaceSubscriptionStatus
  summary: 'Flag specifying the Marketplace Subscription Status of the resource. If
    payment is not made in

    time, the resource will go in Suspended state. Known values are: "Provisioning",
    "Active",

    "Suspended", and "Unsubscribed".'
  signature: 'marketplaceSubscriptionStatus: str | MarketplaceSubscriptionStatus'
- uid: azure.mgmt.datadog.types.MonitorProperties.monitoringStatus
  name: monitoringStatus
  summary: 'Flag specifying if the resource monitoring is enabled or disabled. Known
    values are:

    "Enabled" and "Disabled".'
  signature: 'monitoringStatus: str | MonitoringStatus'
- uid: azure.mgmt.datadog.types.MonitorProperties.provisioningState
  name: provisioningState
  summary: '"Accepted", "Creating", "Updating", "Deleting", "Succeeded",

    "Failed", "Canceled", "Deleted", and "NotSpecified".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.datadog.types.MonitorProperties.saaSData
  name: saaSData
  summary: SaaS details.
  signature: 'saaSData: SaaSData'
- uid: azure.mgmt.datadog.types.MonitorProperties.sreAgentConfiguration
  name: sreAgentConfiguration
  summary: SRE Agent configuration to connect to MCP server of Datadog for given organization.
  signature: 'sreAgentConfiguration: list[''SreAgentConfiguration'']'
- uid: azure.mgmt.datadog.types.MonitorProperties.userInfo
  name: userInfo
  summary: Includes name, email and optionally, phone number. User Information can't
    be null.
  signature: 'userInfo: UserInfo'
