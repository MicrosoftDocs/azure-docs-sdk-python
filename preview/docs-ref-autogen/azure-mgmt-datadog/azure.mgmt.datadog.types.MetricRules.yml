### YamlMime:PythonClass
uid: azure.mgmt.datadog.types.MetricRules
name: MetricRules
fullName: azure.mgmt.datadog.types.MetricRules
module: azure.mgmt.datadog.types
summary: Set of rules for sending metrics for the Monitor resource.
constructor:
  syntax: MetricRules()
variables:
- description: 'List of filtering tags to be used for capturing metrics. If empty,
    all

    resources will be captured. If only Exclude action is specified, the rules will
    apply to the

    list of all available resources. If Include actions are specified, the rules will
    only include

    resources with the associated tags.'
  name: filtering_tags
  types:
  - <xref:list>[<xref:"FilteringTag">]
attributes:
- uid: azure.mgmt.datadog.types.MetricRules.filteringTags
  name: filteringTags
  summary: 'List of filtering tags to be used for capturing metrics. If empty, all
    resources will be

    captured. If only Exclude action is specified, the rules will apply to the list
    of all

    available resources. If Include actions are specified, the rules will only include
    resources

    with the associated tags.'
  signature: 'filteringTags: list[azure.mgmt.datadog.types.FilteringTag]'
