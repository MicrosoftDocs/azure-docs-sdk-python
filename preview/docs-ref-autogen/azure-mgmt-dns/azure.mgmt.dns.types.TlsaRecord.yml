### YamlMime:PythonClass
uid: azure.mgmt.dns.types.TlsaRecord
name: TlsaRecord
fullName: azure.mgmt.dns.types.TlsaRecord
module: azure.mgmt.dns.types
summary: 'A TLSA record. For more information about the TLSA record format, see RFC
  6698:

  [https://www.rfc-editor.org/rfc/rfc6698](https://www.rfc-editor.org/rfc/rfc6698).'
constructor:
  syntax: TlsaRecord()
variables:
- description: 'The usage specifies the provided association that will be used to
    match the

    certificate presented in the TLS handshake.'
  name: usage
  types:
  - <xref:int>
- description: 'The selector specifies which part of the TLS certificate presented
    by the

    server will be matched against the association data.'
  name: selector
  types:
  - <xref:int>
- description: The matching type specifies how the certificate association is presented.
  name: matching_type
  types:
  - <xref:int>
- description: This specifies the certificate association data to be matched.
  name: cert_association_data
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.dns.types.TlsaRecord.certAssociationData
  name: certAssociationData
  summary: This specifies the certificate association data to be matched.
  signature: 'certAssociationData: str'
- uid: azure.mgmt.dns.types.TlsaRecord.matchingType
  name: matchingType
  summary: The matching type specifies how the certificate association is presented.
  signature: 'matchingType: int'
- uid: azure.mgmt.dns.types.TlsaRecord.selector
  name: selector
  summary: 'The selector specifies which part of the TLS certificate presented by
    the server will be

    matched against the association data.'
  signature: 'selector: int'
- uid: azure.mgmt.dns.types.TlsaRecord.usage
  name: usage
  summary: 'The usage specifies the provided association that will be used to match
    the certificate

    presented in the TLS handshake.'
  signature: 'usage: int'
