### YamlMime:PythonClass
uid: azure.mgmt.dns.models.NaptrRecord
name: NaptrRecord
fullName: azure.mgmt.dns.models.NaptrRecord
module: azure.mgmt.dns.models
summary: 'A NAPTR record. For more information about the NAPTR record format, see
  RFC 3403:

  [https://www.rfc-editor.org/rfc/rfc3403](https://www.rfc-editor.org/rfc/rfc3403).'
constructor:
  syntax: 'NaptrRecord(*args: Any, **kwargs: Any)'
variables:
- description: 'The order in which the NAPTR records MUST be processed in order to
    accurately

    represent the ordered list of rules. The ordering is from lowest to highest. Valid
    values:

    0-65535.'
  name: order
  types:
  - <xref:int>
- description: 'The preference specifies the order in which NAPTR records with equal
    ''order''

    values should be processed, low numbers being processed before high numbers. Valid
    values:

    0-65535.'
  name: preference
  types:
  - <xref:int>
- description: 'The flags specific to DDDS applications. Values currently defined
    in RFC 3404 are

    uppercase and lowercase letters "A", "P", "S", and "U", and the empty string,
    "". Enclose Flags

    in quotation marks.'
  name: flags
  types:
  - <xref:str>
- description: 'The services specific to DDDS applications. Enclose Services in quotation

    marks.'
  name: services
  types:
  - <xref:str>
- description: 'The regular expression that the DDDS application uses to convert an
    input value

    into an output value. For example: an IP phone system might use a regular expression
    to convert

    a phone number that is entered by a user into a SIP URI. Enclose the regular expression
    in

    quotation marks. Specify either a value for ''regexp'' or a value for ''replacement''.'
  name: regexp
  types:
  - <xref:str>
- description: 'The replacement is a fully qualified domain name (FQDN) of the next
    domain

    name that you want the DDDS application to submit a DNS query for. The DDDS application

    replaces the input value with the value specified for replacement. Specify either
    a value for

    ''regexp'' or a value for ''replacement''. If you specify a value for ''regexp'',
    specify a dot (.)

    for ''replacement''.'
  name: replacement
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.dns.models.NaptrRecord.flags
  name: flags
  summary: 'The flags specific to DDDS applications. Values currently defined in RFC
    3404 are uppercase and

    lowercase letters "A", "P", "S", and "U", and the empty string, "". Enclose Flags
    in

    quotation marks.'
  signature: 'flags: str | None'
- uid: azure.mgmt.dns.models.NaptrRecord.order
  name: order
  summary: 'The order in which the NAPTR records MUST be processed in order to accurately
    represent the

    ordered list of rules. The ordering is from lowest to highest. Valid values: 0-65535.'
  signature: 'order: int | None'
- uid: azure.mgmt.dns.models.NaptrRecord.preference
  name: preference
  summary: 'The preference specifies the order in which NAPTR records with equal ''order''
    values should be

    processed, low numbers being processed before high numbers. Valid values: 0-65535.'
  signature: 'preference: int | None'
- uid: azure.mgmt.dns.models.NaptrRecord.regexp
  name: regexp
  summary: 'The regular expression that the DDDS application uses to convert an input
    value into an output

    value. For example: an IP phone system might use a regular expression to convert
    a phone number

    that is entered by a user into a SIP URI. Enclose the regular expression in quotation
    marks.

    Specify either a value for ''regexp'' or a value for ''replacement''.'
  signature: 'regexp: str | None'
- uid: azure.mgmt.dns.models.NaptrRecord.replacement
  name: replacement
  summary: 'The replacement is a fully qualified domain name (FQDN) of the next domain
    name that you want

    the DDDS application to submit a DNS query for. The DDDS application replaces
    the input value

    with the value specified for replacement. Specify either a value for ''regexp''
    or a value for

    ''replacement''. If you specify a value for ''regexp'', specify a dot (.) for
    ''replacement''.'
  signature: 'replacement: str | None'
- uid: azure.mgmt.dns.models.NaptrRecord.services
  name: services
  summary: The services specific to DDDS applications. Enclose Services in quotation
    marks.
  signature: 'services: str | None'
