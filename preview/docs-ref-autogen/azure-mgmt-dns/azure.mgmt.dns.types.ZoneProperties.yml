### YamlMime:PythonClass
uid: azure.mgmt.dns.types.ZoneProperties
name: ZoneProperties
fullName: azure.mgmt.dns.types.ZoneProperties
module: azure.mgmt.dns.types
summary: Represents the properties of the zone.
constructor:
  syntax: ZoneProperties()
variables:
- description: 'The maximum number of record sets that can be created in this

    DNS zone.  This is a read-only property and any attempt to set this value will
    be ignored.'
  name: max_number_of_record_sets
  types:
  - <xref:int>
- description: 'The maximum number of records per record set that

    can be created in this DNS zone.  This is a read-only property and any attempt
    to set this

    value will be ignored.'
  name: max_number_of_records_per_record_set
  types:
  - <xref:int>
- description: 'The current number of record sets in this DNS zone.  This is a

    read-only property and any attempt to set this value will be ignored.'
  name: number_of_record_sets
  types:
  - <xref:int>
- description: 'The name servers for this DNS zone. This is a read-only property and
    any

    attempt to set this value will be ignored.'
  name: name_servers
  types:
  - <xref:list>[<xref:str>]
- description: 'The type of this DNS zone (Public or Private). Known values are: "Public"
    and

    "Private".'
  name: zone_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ZoneType">]
- description: 'A list of references to virtual networks that register

    hostnames in this DNS zone. This is a only when ZoneType is Private.'
  name: registration_virtual_networks
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'A list of references to virtual networks that resolve

    records in this DNS zone. This is a only when ZoneType is Private.'
  name: resolution_virtual_networks
  types:
  - <xref:list>[<xref:"SubResource">]
- description: The list of signing keys.
  name: signing_keys
  types:
  - <xref:list>[<xref:"SigningKey">]
attributes:
- uid: azure.mgmt.dns.types.ZoneProperties.maxNumberOfRecordSets
  name: maxNumberOfRecordSets
  summary: 'The maximum number of record sets that can be created in this DNS zone.  This
    is a read-only

    property and any attempt to set this value will be ignored.'
  signature: 'maxNumberOfRecordSets: int'
- uid: azure.mgmt.dns.types.ZoneProperties.maxNumberOfRecordsPerRecordSet
  name: maxNumberOfRecordsPerRecordSet
  summary: 'The maximum number of records per record set that can be created in this
    DNS zone.  This is a

    read-only property and any attempt to set this value will be ignored.'
  signature: 'maxNumberOfRecordsPerRecordSet: int'
- uid: azure.mgmt.dns.types.ZoneProperties.nameServers
  name: nameServers
  summary: 'The name servers for this DNS zone. This is a read-only property and any
    attempt to set this

    value will be ignored.'
  signature: 'nameServers: list[str]'
- uid: azure.mgmt.dns.types.ZoneProperties.numberOfRecordSets
  name: numberOfRecordSets
  summary: 'The current number of record sets in this DNS zone.  This is a read-only
    property and any

    attempt to set this value will be ignored.'
  signature: 'numberOfRecordSets: int'
- uid: azure.mgmt.dns.types.ZoneProperties.registrationVirtualNetworks
  name: registrationVirtualNetworks
  summary: 'A list of references to virtual networks that register hostnames in this
    DNS zone. This is a

    only when ZoneType is Private.'
  signature: 'registrationVirtualNetworks: list[''SubResource'']'
- uid: azure.mgmt.dns.types.ZoneProperties.resolutionVirtualNetworks
  name: resolutionVirtualNetworks
  summary: 'A list of references to virtual networks that resolve records in this
    DNS zone. This is a only

    when ZoneType is Private.'
  signature: 'resolutionVirtualNetworks: list[''SubResource'']'
- uid: azure.mgmt.dns.types.ZoneProperties.signingKeys
  name: signingKeys
  summary: The list of signing keys.
  signature: 'signingKeys: list[''SigningKey'']'
- uid: azure.mgmt.dns.types.ZoneProperties.zoneType
  name: zoneType
  summary: '"Public" and "Private".'
  signature: 'zoneType: str | ZoneType'
