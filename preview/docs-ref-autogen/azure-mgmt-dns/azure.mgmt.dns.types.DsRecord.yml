### YamlMime:PythonClass
uid: azure.mgmt.dns.types.DsRecord
name: DsRecord
fullName: azure.mgmt.dns.types.DsRecord
module: azure.mgmt.dns.types
summary: 'A DS record. For more information about the DS record format, see RFC 4034:

  [https://www.rfc-editor.org/rfc/rfc4034](https://www.rfc-editor.org/rfc/rfc4034).'
constructor:
  syntax: DsRecord()
variables:
- description: 'The key tag value is used to determine which DNSKEY Resource Record
    is used for

    signature verification.'
  name: key_tag
  types:
  - <xref:int>
- description: 'The security algorithm type represents the standard security algorithm
    number

    of the DNSKEY Resource Record. See:

    [https://www.iana.org/assignments/dns-sec-alg-numbers/dns-sec-alg-numbers.xhtml](https://www.iana.org/assignments/dns-sec-alg-numbers/dns-sec-alg-numbers.xhtml).'
  name: algorithm
  types:
  - <xref:int>
- description: The digest entity.
  name: digest
  types:
  - <xref:<xref:"Digest">>
attributes:
- uid: azure.mgmt.dns.types.DsRecord.algorithm
  name: algorithm
  summary: 'The security algorithm type represents the standard security algorithm
    number of the DNSKEY

    Resource Record. See:

    [https://www.iana.org/assignments/dns-sec-alg-numbers/dns-sec-alg-numbers.xhtml](https://www.iana.org/assignments/dns-sec-alg-numbers/dns-sec-alg-numbers.xhtml).'
  signature: 'algorithm: int'
- uid: azure.mgmt.dns.types.DsRecord.digest
  name: digest
  summary: The digest entity.
  signature: 'digest: Digest'
- uid: azure.mgmt.dns.types.DsRecord.keyTag
  name: keyTag
  summary: 'The key tag value is used to determine which DNSKEY Resource Record is
    used for signature

    verification.'
  signature: 'keyTag: int'
