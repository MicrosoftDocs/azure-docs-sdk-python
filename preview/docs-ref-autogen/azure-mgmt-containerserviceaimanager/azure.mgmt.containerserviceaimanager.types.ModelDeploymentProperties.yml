### YamlMime:PythonClass
uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentProperties
name: ModelDeploymentProperties
fullName: azure.mgmt.containerserviceaimanager.types.ModelDeploymentProperties
module: azure.mgmt.containerserviceaimanager.types
summary: Model deployment properties.
constructor:
  syntax: ModelDeploymentProperties()
variables:
- description: 'The status of the last reconciliation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ModelDeploymentProvisioningState">]
- description: 'Full ARM resource id of the model to deploy. Phase 1 accepts an

    `AIModel` resource id only. Immutable after creation. Required.'
  name: modelResourceId
  types:
  - <xref:str>
- description: 'Full ARM resource id of a `ModelSource` to use when pulling

    artifacts for this deployment. Immutable after creation.'
  name: modelSourceResourceId
  types:
  - <xref:str>
- description: 'Runtime performance mode. Known values are: "Balanced", "Latency",
    and

    "Throughput".'
  name: performanceMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ModelDeploymentPerformanceMode">]
- description: 'Azure VM SKU used to host the deployment, e.g. "Standard_NC96ads_A100_v4".

    Immutable after creation. Required.'
  name: vmSize
  types:
  - <xref:str>
- description: 'Scaling configuration for the deployment. Provide either `manual`
    (fixed replica

    count) or `autoscale` (autoscaling between min/max replicas), but not both.'
  name: scale
  types:
  - <xref:<xref:"ScalingProfile">>
- description: User overrides layered on top of profile resolution.
  name: overrides
  types:
  - <xref:<xref:"ModelDeploymentOverrides">>
- description: Runtime status, populated once reconciliation begins.
  name: status
  types:
  - <xref:<xref:"ModelDeploymentStatus">>
attributes:
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentProperties.modelResourceId
  name: modelResourceId
  summary: 'Full ARM resource id of the model to deploy. Phase 1 accepts an `AIModel`
    resource id only.

    Immutable after creation. Required.'
  signature: 'modelResourceId: Required[str]'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentProperties.modelSourceResourceId
  name: modelSourceResourceId
  summary: 'Full ARM resource id of a `ModelSource` to use when pulling artifacts
    for this deployment.

    Immutable after creation.'
  signature: 'modelSourceResourceId: str'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentProperties.overrides
  name: overrides
  summary: User overrides layered on top of profile resolution.
  signature: 'overrides: ModelDeploymentOverrides'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentProperties.performanceMode
  name: performanceMode
  summary: '"Balanced", "Latency", and "Throughput".'
  signature: 'performanceMode: str | ModelDeploymentPerformanceMode'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ModelDeploymentProvisioningState'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentProperties.scale
  name: scale
  summary: 'Scaling configuration for the deployment. Provide either `manual` (fixed
    replica count) or

    `autoscale` (autoscaling between min/max replicas), but not both.'
  signature: 'scale: ScalingProfile'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentProperties.status
  name: status
  summary: Runtime status, populated once reconciliation begins.
  signature: 'status: ModelDeploymentStatus'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentProperties.vmSize
  name: vmSize
  summary: 'Azure VM SKU used to host the deployment, e.g. "Standard_NC96ads_A100_v4".
    Immutable after

    creation. Required.'
  signature: 'vmSize: Required[str]'
