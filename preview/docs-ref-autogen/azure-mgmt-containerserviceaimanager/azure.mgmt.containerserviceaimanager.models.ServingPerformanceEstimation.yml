### YamlMime:PythonClass
uid: azure.mgmt.containerserviceaimanager.models.ServingPerformanceEstimation
name: ServingPerformanceEstimation
fullName: azure.mgmt.containerserviceaimanager.models.ServingPerformanceEstimation
module: azure.mgmt.containerserviceaimanager.models
summary: 'Estimated relative inference performance of a single model replica on a
  given GPU SKU. Each

  metric is a scaling coefficient in the range `[0, 1]` relative to the best-performing
  SKU for

  this model, which scores `1`.'
constructor:
  syntax: 'ServingPerformanceEstimation(*args: Any, **kwargs: Any)'
variables:
- description: "Relative inference latency score in `[0, 1]`. Higher is better\n(`1`\
    \ matches the best-performing SKU's latency for this model). Note: this is a normalized\n\
    score, not a raw latency ratio \u2013 a larger value indicates lower latency.\
    \ Required."
  name: relative_latency_score
  types:
  - <xref:float>
- description: 'Relative inference throughput score in `[0, 1]`. Higher is

    better (`1` matches the best-performing SKU''s throughput for this model). Required.'
  name: relative_throughput_score
  types:
  - <xref:float>
attributes:
- uid: azure.mgmt.containerserviceaimanager.models.ServingPerformanceEstimation.relative_latency_score
  name: relative_latency_score
  summary: "Relative inference latency score in `[0, 1]`. Higher is better (`1` matches\
    \ the\nbest-performing SKU's latency for this model). Note: this is a normalized\
    \ score, not a raw\nlatency ratio \u2013 a larger value indicates lower latency.\
    \ Required."
  signature: 'relative_latency_score: float'
- uid: azure.mgmt.containerserviceaimanager.models.ServingPerformanceEstimation.relative_throughput_score
  name: relative_throughput_score
  summary: 'Relative inference throughput score in `[0, 1]`. Higher is better (`1`
    matches the

    best-performing SKU''s throughput for this model). Required.'
  signature: 'relative_throughput_score: float'
