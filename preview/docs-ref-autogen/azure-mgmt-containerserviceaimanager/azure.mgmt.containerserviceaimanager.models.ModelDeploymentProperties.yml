uid: azure.mgmt.containerserviceaimanager.models.ModelDeploymentProperties
name: ModelDeploymentProperties
fullName: azure.mgmt.containerserviceaimanager.models.ModelDeploymentProperties
module: azure.mgmt.containerserviceaimanager.models
summary: Model deployment properties.
constructor:
  syntax: 'ModelDeploymentProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The status of the last reconciliation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.containerserviceaimanager.models.ModelDeploymentProvisioningState>
- description: 'Full ARM resource id of the model to deploy. Phase 1 accepts an

    `AIModel` resource id only. Immutable after creation. Required.'
  name: model_resource_id
  types:
  - <xref:str>
- description: 'Full ARM resource id of a `ModelSource` to use when pulling

    artifacts for this deployment. Immutable after creation.'
  name: model_source_resource_id
  types:
  - <xref:str>
- description: 'Runtime performance mode. Known values are: "Balanced", "Latency",
    and

    "Throughput".'
  name: performance_mode
  types:
  - <xref:str>
  - <xref:azure.mgmt.containerserviceaimanager.models.ModelDeploymentPerformanceMode>
- description: 'Azure VM SKU used to host the deployment, e.g. "Standard_NC96ads_A100_v4".

    Immutable after creation. Required.'
  name: vm_size
  types:
  - <xref:str>
- description: 'Scaling configuration for the deployment. Provide either `manual`
    (fixed replica

    count) or `autoscale` (autoscaling between min/max replicas), but not both.'
  name: scale
  types:
  - <xref:azure.mgmt.containerserviceaimanager.models.ScalingProfile>
- description: User overrides layered on top of profile resolution.
  name: overrides
  types:
  - <xref:azure.mgmt.containerserviceaimanager.models.ModelDeploymentOverrides>
- description: Runtime status, populated once reconciliation begins.
  name: status
  types:
  - <xref:azure.mgmt.containerserviceaimanager.models.ModelDeploymentStatus>
