### YamlMime:PythonClass
uid: azure.mgmt.containerserviceaimanager.models.ModelDeploymentStatus
name: ModelDeploymentStatus
fullName: azure.mgmt.containerserviceaimanager.models.ModelDeploymentStatus
module: azure.mgmt.containerserviceaimanager.models
summary: 'The runtime status of a model deployment. All fields are read-only and populated
  once

  reconciliation has started.'
constructor:
  syntax: 'ModelDeploymentStatus(*args: Any, **kwargs: Any)'
variables:
- description: The inference endpoint URL exposed by the deployment, once ready.
  name: endpoint
  types:
  - <xref:str>
- description: The inference engine used to serve the model, e.g. "vllm".
  name: engine
  types:
  - <xref:str>
- description: The version of the inference engine, e.g. "0.17".
  name: engine_version
  types:
  - <xref:str>
- description: 'The maximum model context length, in tokens, configured for this

    deployment.'
  name: max_model_len
  types:
  - <xref:int>
- description: 'The quantization level applied to the model weights, e.g. "fp16",

    "awq-int4".'
  name: quantization
  types:
  - <xref:str>
- description: 'The desired replica count reported by the controller. Equals

    `properties.scale.manual.replicas` when manual scaling is used; current target
    replica count

    derived from autoscaler otherwise.'
  name: desired_replicas
  types:
  - <xref:int>
- description: The current number of ready replicas serving traffic.
  name: current_replicas
  types:
  - <xref:int>
- description: The peak tokens per minute measured by live stress test.
  name: peak_tokens_per_minute
  types:
  - <xref:int>
- description: 'Estimated total time, in seconds, for the deployment to

    become ready end-to-end (GPU vm provisioning, image/weight pull, engine warm-up).'
  name: estimated_provision_time_seconds
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.containerserviceaimanager.models.ModelDeploymentStatus.current_replicas
  name: current_replicas
  summary: The current number of ready replicas serving traffic.
  signature: 'current_replicas: int | None'
- uid: azure.mgmt.containerserviceaimanager.models.ModelDeploymentStatus.desired_replicas
  name: desired_replicas
  summary: 'The desired replica count reported by the controller. Equals

    `properties.scale.manual.replicas` when manual scaling is used; current target
    replica count

    derived from autoscaler otherwise.'
  signature: 'desired_replicas: int | None'
- uid: azure.mgmt.containerserviceaimanager.models.ModelDeploymentStatus.endpoint
  name: endpoint
  summary: The inference endpoint URL exposed by the deployment, once ready.
  signature: 'endpoint: str | None'
- uid: azure.mgmt.containerserviceaimanager.models.ModelDeploymentStatus.engine
  name: engine
  summary: The inference engine used to serve the model, e.g. "vllm".
  signature: 'engine: str | None'
- uid: azure.mgmt.containerserviceaimanager.models.ModelDeploymentStatus.engine_version
  name: engine_version
  summary: The version of the inference engine, e.g. "0.17".
  signature: 'engine_version: str | None'
- uid: azure.mgmt.containerserviceaimanager.models.ModelDeploymentStatus.estimated_provision_time_seconds
  name: estimated_provision_time_seconds
  summary: 'Estimated total time, in seconds, for the deployment to become ready end-to-end
    (GPU vm

    provisioning, image/weight pull, engine warm-up).'
  signature: 'estimated_provision_time_seconds: int | None'
- uid: azure.mgmt.containerserviceaimanager.models.ModelDeploymentStatus.max_model_len
  name: max_model_len
  summary: The maximum model context length, in tokens, configured for this deployment.
  signature: 'max_model_len: int | None'
- uid: azure.mgmt.containerserviceaimanager.models.ModelDeploymentStatus.peak_tokens_per_minute
  name: peak_tokens_per_minute
  summary: The peak tokens per minute measured by live stress test.
  signature: 'peak_tokens_per_minute: int | None'
- uid: azure.mgmt.containerserviceaimanager.models.ModelDeploymentStatus.quantization
  name: quantization
  summary: The quantization level applied to the model weights, e.g. "fp16", "awq-int4".
  signature: 'quantization: str | None'
