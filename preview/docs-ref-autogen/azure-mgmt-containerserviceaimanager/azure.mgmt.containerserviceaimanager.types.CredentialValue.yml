uid: azure.mgmt.containerserviceaimanager.types.CredentialValue
name: CredentialValue
fullName: azure.mgmt.containerserviceaimanager.types.CredentialValue
module: azure.mgmt.containerserviceaimanager.types
summary: A credential value used for accessing gated or private models.
constructor:
  syntax: CredentialValue()
variables:
- description: An inline credential containing a secret value supplied in the request
    payload.
  name: inline
  types:
  - <xref:<xref:"InlineCredential">>
- description: 'A user-assigned managed identity the platform authenticates as.

    Required for `MicrosoftFoundry` sources and the user must grant the `Foundry User`
    role

    (role definition id 53ca6127-db72-4b80-b1b0-d745d6d5456d) on the Foundry project.
    See

    [https://aka.ms/aks/aim-modelsource](https://aka.ms/aks/aim-modelsource) for more
    details.

    The platform federates this identity to an in-cluster puller ServiceAccount (Workload
    Identity)

    at deployment time.'
  name: managedIdentity
  types:
  - <xref:<xref:"ManagedIdentityCredential">>
attributes:
