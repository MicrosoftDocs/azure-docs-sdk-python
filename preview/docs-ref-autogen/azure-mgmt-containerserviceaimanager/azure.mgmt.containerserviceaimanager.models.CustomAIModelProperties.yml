### YamlMime:PythonClass
uid: azure.mgmt.containerserviceaimanager.models.CustomAIModelProperties
name: CustomAIModelProperties
fullName: azure.mgmt.containerserviceaimanager.models.CustomAIModelProperties
module: azure.mgmt.containerserviceaimanager.models
summary: Custom AI model properties.
constructor:
  syntax: 'CustomAIModelProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.containerserviceaimanager.models.CustomAIModelProvisioningState>
- description: 'The model identifier, interpreted per the referenced ModelSource type.
    For

    `HuggingFace` sources this is the upstream `<org>/<repo>` id, e.g.

    `meta-llama/Llama-2-7b-chat`. For `MicrosoftFoundry` sources this is `modelName/version`,

    e.g. `private-llama/1`. Immutable after creation. Required.'
  name: model_id
  types:
  - <xref:str>
- description: 'The base model this custom model was trained from (id + config.json).

    Immutable after creation. Required.'
  name: base_model
  types:
  - <xref:azure.mgmt.containerserviceaimanager.models.BaseModelReference>
- description: 'Azure resource id of the ModelSource to use when pulling

    artifacts. Used to determine model location and access. Immutable after creation.
    Required.'
  name: model_source_resource_id
  types:
  - <xref:str>
- description: Optional. Free-form description of the model. Mutable.
  name: description
  types:
  - <xref:str>
- description: Read-only. Platform-resolved specification of the model.
  name: spec
  types:
  - <xref:azure.mgmt.containerserviceaimanager.models.CustomAIModelSpec>
attributes:
- uid: azure.mgmt.containerserviceaimanager.models.CustomAIModelProperties.base_model
  name: base_model
  summary: 'The base model this custom model was trained from (id + config.json).
    Immutable after creation.

    Required.'
  signature: 'base_model: _models.BaseModelReference'
- uid: azure.mgmt.containerserviceaimanager.models.CustomAIModelProperties.description
  name: description
  summary: Optional. Free-form description of the model. Mutable.
  signature: 'description: str | None'
- uid: azure.mgmt.containerserviceaimanager.models.CustomAIModelProperties.model_id
  name: model_id
  summary: 'The model identifier, interpreted per the referenced ModelSource type.
    For `HuggingFace`

    sources this is the upstream `<org>/<repo>` id, e.g. `meta-llama/Llama-2-7b-chat`.
    For

    `MicrosoftFoundry` sources this is `modelName/version`, e.g. `private-llama/1`.
    Immutable

    after creation. Required.'
  signature: 'model_id: str'
- uid: azure.mgmt.containerserviceaimanager.models.CustomAIModelProperties.model_source_resource_id
  name: model_source_resource_id
  summary: 'Azure resource id of the ModelSource to use when pulling artifacts. Used
    to determine model

    location and access. Immutable after creation. Required.'
  signature: 'model_source_resource_id: str'
- uid: azure.mgmt.containerserviceaimanager.models.CustomAIModelProperties.provisioning_state
  name: provisioning_state
  summary: '"Succeeded", "Failed", "Canceled",

    "Creating", "Updating", and "Deleting".'
  signature: 'provisioning_state: str | _models.CustomAIModelProvisioningState | None'
- uid: azure.mgmt.containerserviceaimanager.models.CustomAIModelProperties.spec
  name: spec
  summary: Read-only. Platform-resolved specification of the model.
  signature: 'spec: _models.CustomAIModelSpec | None'
