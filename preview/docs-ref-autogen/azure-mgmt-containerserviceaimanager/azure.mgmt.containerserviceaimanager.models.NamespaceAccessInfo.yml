### YamlMime:PythonClass
uid: azure.mgmt.containerserviceaimanager.models.NamespaceAccessInfo
name: NamespaceAccessInfo
fullName: azure.mgmt.containerserviceaimanager.models.NamespaceAccessInfo
module: azure.mgmt.containerserviceaimanager.models
summary: 'Access information for an AI Manager namespace, including the OpenAI-compatible
  gateway

  endpoint and the API keys used to authenticate against it.'
constructor:
  syntax: 'NamespaceAccessInfo(*args: Any, **kwargs: Any)'
variables:
- description: 'OpenAI-compatible inference gateway base URL (for example,

    `https://team-alpha.<cluster>.<region>.aksapp.io/v1`). Required.'
  name: endpoint
  types:
  - <xref:str>
- description: 'Primary API key. Send as `Authorization: Bearer <key>` or `api-key:

    <key>`. Treat as secret; do not log or persist in plaintext. Required.'
  name: primary_key
  types:
  - <xref:str>
- description: 'Secondary API key, accepted by the gateway in the same headers as

    `primaryKey`. Generated independently when the namespace is created, then overwritten
    by the

    previous `primaryKey` on each `rotateKeys` call so clients can roll over without
    downtime.

    Treat as secret; do not log or persist in plaintext. Required.'
  name: secondary_key
  types:
  - <xref:str>
- description: 'UTC time the keys were last rotated by `rotateKeys`. Absent until
    the

    first rotation. Clients can use this to detect rotation and refresh cached credentials.'
  name: last_rotated_at
  types:
  - <xref:datetime.datetime>
attributes:
- uid: azure.mgmt.containerserviceaimanager.models.NamespaceAccessInfo.endpoint
  name: endpoint
  summary: 'OpenAI-compatible inference gateway base URL (for example,

    `https://team-alpha.<cluster>.<region>.aksapp.io/v1`). Required.'
  signature: 'endpoint: str'
- uid: azure.mgmt.containerserviceaimanager.models.NamespaceAccessInfo.last_rotated_at
  name: last_rotated_at
  summary: 'UTC time the keys were last rotated by `rotateKeys`. Absent until the
    first rotation. Clients

    can use this to detect rotation and refresh cached credentials.'
  signature: 'last_rotated_at: datetime | None'
- uid: azure.mgmt.containerserviceaimanager.models.NamespaceAccessInfo.primary_key
  name: primary_key
  summary: 'Primary API key. Send as `Authorization: Bearer <key>` or `api-key: <key>`.
    Treat as

    secret; do not log or persist in plaintext. Required.'
  signature: 'primary_key: str'
- uid: azure.mgmt.containerserviceaimanager.models.NamespaceAccessInfo.secondary_key
  name: secondary_key
  summary: 'Secondary API key, accepted by the gateway in the same headers as `primaryKey`.
    Generated

    independently when the namespace is created, then overwritten by the previous
    `primaryKey` on

    each `rotateKeys` call so clients can roll over without downtime. Treat as secret;
    do not log

    or persist in plaintext. Required.'
  signature: 'secondary_key: str'
