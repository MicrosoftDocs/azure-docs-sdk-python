### YamlMime:PythonClass
uid: azure.mgmt.containerserviceaimanager.types.AutoscaleProfile
name: AutoscaleProfile
fullName: azure.mgmt.containerserviceaimanager.types.AutoscaleProfile
module: azure.mgmt.containerserviceaimanager.types
summary: 'Autoscaling configuration: scale replica count between a minimum and maximum.'
constructor:
  syntax: AutoscaleProfile()
variables:
- description: 'The minimum number of replicas. Must be at least `1`; scale-to-zero
    is not

    supported in autoscale mode (see `ScalingProfile`). Required.'
  name: minReplicas
  types:
  - <xref:int>
- description: 'The maximum number of replicas. If not specified, the service derives
    a

    default from the subscription GPU quota.'
  name: maxReplicas
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.containerserviceaimanager.types.AutoscaleProfile.maxReplicas
  name: maxReplicas
  summary: 'The maximum number of replicas. If not specified, the service derives
    a default from the

    subscription GPU quota.'
  signature: 'maxReplicas: int'
- uid: azure.mgmt.containerserviceaimanager.types.AutoscaleProfile.minReplicas
  name: minReplicas
  summary: 'The minimum number of replicas. Must be at least `1`; scale-to-zero is
    not supported in

    autoscale mode (see `ScalingProfile`). Required.'
  signature: 'minReplicas: int'
