- uid: azure.mgmt.containerserviceaimanager.aio.operations.CustomAIModelsOperations.calculate_cost
  name: calculate_cost
  summary: 'Returns a ranked list of GPU SKU pricing plans for deploying this custom
    model in the target

    region, each annotated with feasibility and per-replica hourly cost. Feasibility
    is determined

    by region availability, GPU quota, and model architecture fit (verified at registration
    time).

    `servingPerformanceEstimation` is omitted for custom models. No Azure or Kubernetes
    resources

    are provisioned.'
