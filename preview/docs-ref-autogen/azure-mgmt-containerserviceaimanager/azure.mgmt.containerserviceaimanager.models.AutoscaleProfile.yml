name: AutoscaleProfile
fullName: azure.mgmt.containerserviceaimanager.models.AutoscaleProfile
module: azure.mgmt.containerserviceaimanager.models
summary: 'Autoscaling configuration: scale replica count between a minimum and maximum.'
constructor:
  syntax: 'AutoscaleProfile(*args: Any, **kwargs: Any)'
variables:
- description: 'The minimum number of replicas. Must be at least `1`; scale-to-zero
    is

    not supported in autoscale mode (see `ScalingProfile`). Required.'
  name: min_replicas
  types:
  - <xref:int>
- description: 'The maximum number of replicas. If not specified, the service derives
    a

    default from the subscription GPU quota.'
  name: max_replicas
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.containerserviceaimanager.models.AutoscaleProfile.max_replicas
  name: max_replicas
  summary: 'The maximum number of replicas. If not specified, the service derives
    a default from the

    subscription GPU quota.'
  signature: 'max_replicas: int | None'
- uid: azure.mgmt.containerserviceaimanager.models.AutoscaleProfile.min_replicas
  name: min_replicas
  summary: 'The minimum number of replicas. Must be at least `1`; scale-to-zero is
    not supported in

    autoscale mode (see `ScalingProfile`). Required.'
  signature: 'min_replicas: int'
