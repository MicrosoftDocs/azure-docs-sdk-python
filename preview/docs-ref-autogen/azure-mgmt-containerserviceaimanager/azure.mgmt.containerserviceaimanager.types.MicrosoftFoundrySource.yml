### YamlMime:PythonClass
uid: azure.mgmt.containerserviceaimanager.types.MicrosoftFoundrySource
name: MicrosoftFoundrySource
fullName: azure.mgmt.containerserviceaimanager.types.MicrosoftFoundrySource
module: azure.mgmt.containerserviceaimanager.types
summary: 'Reference to a Microsoft Foundry project that backs a `MicrosoftFoundry`

  ModelSource. Only the project Azure id is required; the Foundry account and its

  data-plane endpoint (`*.services.ai.azure.com`) are resolved by the platform

  from the project (the account is the project''s parent resource).


  Authentication uses the user-assigned managed identity referenced in the

  ModelSource `credential.managedIdentity`, which the user must grant the

  `Foundry User` role (role definition id 53ca6127-db72-4b80-b1b0-d745d6d5456d)

  on this project. See [https://aka.ms/aks/aim-modelsource](https://aka.ms/aks/aim-modelsource)

  for more details.'
constructor:
  syntax: MicrosoftFoundrySource()
variables:
- description: 'The ARM resource id of the Foundry project. The scope on which the

    referenced managed identity must hold the `Foundry User` role. The account and
    endpoint host

    are derived from this id. Required.'
  name: projectResourceId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerserviceaimanager.types.MicrosoftFoundrySource.projectResourceId
  name: projectResourceId
  summary: 'The ARM resource id of the Foundry project. The scope on which the referenced
    managed identity

    must hold the `Foundry User` role. The account and endpoint host are derived from
    this id.

    Required.'
  signature: 'projectResourceId: str'
