### YamlMime:PythonClass
uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentStatus
name: ModelDeploymentStatus
fullName: azure.mgmt.containerserviceaimanager.types.ModelDeploymentStatus
module: azure.mgmt.containerserviceaimanager.types
summary: 'The runtime status of a model deployment. All fields are read-only and populated
  once

  reconciliation has started.'
constructor:
  syntax: ModelDeploymentStatus()
variables:
- description: The inference endpoint URL exposed by the deployment, once ready.
  name: endpoint
  types:
  - <xref:str>
- description: The inference engine used to serve the model, e.g. "vllm".
  name: engine
  types:
  - <xref:str>
- description: The version of the inference engine, e.g. "0.17".
  name: engineVersion
  types:
  - <xref:str>
- description: The maximum model context length, in tokens, configured for this deployment.
  name: maxModelLen
  types:
  - <xref:int>
- description: 'The quantization level applied to the model weights, e.g. "fp16",

    "awq-int4".'
  name: quantization
  types:
  - <xref:str>
- description: 'The desired replica count reported by the controller. Equals

    `properties.scale.manual.replicas` when manual scaling is used; current target
    replica count

    derived from autoscaler otherwise.'
  name: desiredReplicas
  types:
  - <xref:int>
- description: The current number of ready replicas serving traffic.
  name: currentReplicas
  types:
  - <xref:int>
- description: The peak tokens per minute measured by live stress test.
  name: peakTokensPerMinute
  types:
  - <xref:int>
- description: 'Estimated total time, in seconds, for the deployment to

    become ready end-to-end (GPU vm provisioning, image/weight pull, engine warm-up).'
  name: estimatedProvisionTimeSeconds
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentStatus.currentReplicas
  name: currentReplicas
  summary: The current number of ready replicas serving traffic.
  signature: 'currentReplicas: int'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentStatus.desiredReplicas
  name: desiredReplicas
  summary: 'The desired replica count reported by the controller. Equals

    `properties.scale.manual.replicas` when manual scaling is used; current target
    replica count

    derived from autoscaler otherwise.'
  signature: 'desiredReplicas: int'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentStatus.endpoint
  name: endpoint
  summary: The inference endpoint URL exposed by the deployment, once ready.
  signature: 'endpoint: str'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentStatus.engine
  name: engine
  summary: The inference engine used to serve the model, e.g. "vllm".
  signature: 'engine: str'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentStatus.engineVersion
  name: engineVersion
  summary: The version of the inference engine, e.g. "0.17".
  signature: 'engineVersion: str'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentStatus.estimatedProvisionTimeSeconds
  name: estimatedProvisionTimeSeconds
  summary: 'Estimated total time, in seconds, for the deployment to become ready end-to-end
    (GPU vm

    provisioning, image/weight pull, engine warm-up).'
  signature: 'estimatedProvisionTimeSeconds: int'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentStatus.maxModelLen
  name: maxModelLen
  summary: The maximum model context length, in tokens, configured for this deployment.
  signature: 'maxModelLen: int'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentStatus.peakTokensPerMinute
  name: peakTokensPerMinute
  summary: The peak tokens per minute measured by live stress test.
  signature: 'peakTokensPerMinute: int'
- uid: azure.mgmt.containerserviceaimanager.types.ModelDeploymentStatus.quantization
  name: quantization
  summary: The quantization level applied to the model weights, e.g. "fp16", "awq-int4".
  signature: 'quantization: str'
