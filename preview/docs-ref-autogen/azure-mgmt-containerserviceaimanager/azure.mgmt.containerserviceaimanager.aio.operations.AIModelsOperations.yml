- uid: azure.mgmt.containerserviceaimanager.aio.operations.AIModelsOperations.calculate_cost
  name: calculate_cost
  summary: 'Returns a ranked list of GPU SKU pricing plans for deploying this model
    in the target region,

    each annotated with feasibility, per-replica hourly cost, and estimated relative
    performance.

    No Azure or Kubernetes resources are provisioned.'
  signature: 'async calculate_cost(location: str, ai_model_name: str, body: _models.CalculateCostRequest,
    *, content_type: str = ''application/json'', **kwargs: Any) -> _models.CalculateCostResponse'
  parameters:
  - name: location
    description: The name of the Azure region. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: ai_model_name
    description: 'The name of the AI model resource. A stable, format-defined identifier

      derived from `modelId` as the lowercase hex of the first 8 bytes (16 characters)
      of

      `SHA-256(modelId)` (e.g. upstream `microsoft/Phi-4-mini-instruct` produces

      `9806f0c862fdd920`). Callers should treat the name as opaque and use the `modelId`
      property

      as the human-readable reference. The encoding is a permanent contract of this
      resource provider

      and does not depend on any upstream naming policy. Required.'
    isRequired: true
    types:
    - <xref:str>
  - name: body
    description: 'The content of the action request. Is either a CalculateCostRequest
      type or a

      IO[bytes] type. Required.'
    isRequired: true
    types:
    - <xref:azure.mgmt.containerserviceaimanager.models.CalculateCostRequest>
    - <xref:azure.mgmt.containerserviceaimanager.types.CalculateCostRequest>
    - <xref:typing.IO>[<xref:bytes>]
  return:
