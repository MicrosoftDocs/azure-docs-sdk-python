### YamlMime:PythonClass
uid: azure.mgmt.containerserviceaimanager.types.AIManagerProperties
name: AIManagerProperties
fullName: azure.mgmt.containerserviceaimanager.types.AIManagerProperties
module: azure.mgmt.containerserviceaimanager.types
summary: AI Manager properties.
constructor:
  syntax: AIManagerProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AIManagerProvisioningState">]
- description: 'Delete options of the AI Manager. Defaults to `Delete` if not specified.

    Known values are: "Keep" and "Delete".'
  name: deletePolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeletePolicy">]
- description: 'The name of the managed resource group created by the AI

    Manager to hold underlying infrastructure resources.'
  name: managedResourceGroupName
  types:
  - <xref:str>
- description: 'The Azure resource ID of an existing AKS cluster to attach

    (bring-your-own). When omitted, AI Manager provisions and manages its own underlying
    cluster.

    The referenced cluster must be in the same region as this AI Manager, but may
    reside in a

    different subscription within the same Microsoft Entra tenant. This property is
    immutable after

    creation.'
  name: clusterResourceId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerserviceaimanager.types.AIManagerProperties.clusterResourceId
  name: clusterResourceId
  summary: 'The Azure resource ID of an existing AKS cluster to attach (bring-your-own).
    When omitted, AI

    Manager provisions and manages its own underlying cluster. The referenced cluster
    must be in

    the same region as this AI Manager, but may reside in a different subscription
    within the same

    Microsoft Entra tenant. This property is immutable after creation.'
  signature: 'clusterResourceId: str'
- uid: azure.mgmt.containerserviceaimanager.types.AIManagerProperties.deletePolicy
  name: deletePolicy
  summary: 'Delete options of the AI Manager. Defaults to `Delete` if not specified.
    Known values are:

    "Keep" and "Delete".'
  signature: 'deletePolicy: str | DeletePolicy'
- uid: azure.mgmt.containerserviceaimanager.types.AIManagerProperties.managedResourceGroupName
  name: managedResourceGroupName
  summary: 'The name of the managed resource group created by the AI Manager to hold
    underlying

    infrastructure resources.'
  signature: 'managedResourceGroupName: str'
- uid: azure.mgmt.containerserviceaimanager.types.AIManagerProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | AIManagerProvisioningState'
