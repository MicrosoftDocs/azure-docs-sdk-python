### YamlMime:PythonClass
uid: azure.mgmt.containerserviceaimanager.models.CalculateCostPlan
name: CalculateCostPlan
fullName: azure.mgmt.containerserviceaimanager.models.CalculateCostPlan
module: azure.mgmt.containerserviceaimanager.models
summary: 'A GPU SKU pricing plan returned by the `calculateCost` action. Describes
  the cost of running

  a single model replica on the specified `vmSize`. To estimate the cost of running
  multiple

  replicas, scale `totalHourlyPrice` by the desired replica count, bounded by

  `maxAvailableReplicas`.'
constructor:
  syntax: 'CalculateCostPlan(*args: Any, **kwargs: Any)'
variables:
- description: 'Azure VM SKU, e.g. "Standard_ND96isr_H100_v5". Matches the value accepted
    by

    `ModelDeploymentProperties.vmSize`. Required.'
  name: vm_size
  types:
  - <xref:str>
- description: Resolved quantization on this SKU.
  name: quantization
  types:
  - <xref:str>
- description: Number of VMs required to host one replica on this SKU. Required.
  name: vms_per_replica
  types:
  - <xref:int>
- description: 'Maximum number of replicas the caller''s subscription can deploy

    on this SKU today, computed from the available GPU quota in the target region.
    Required.'
  name: max_available_replicas
  types:
  - <xref:int>
- description: 'Estimated relative inference performance of a single

    model replica on this SKU. Omitted when an estimate is unavailable.'
  name: serving_performance_estimation
  types:
  - <xref:azure.mgmt.containerserviceaimanager.models.ServingPerformanceEstimation>
- description: 'On-demand hourly price for a single VM of this SKU, in `currency`.

    Required.'
  name: vm_hourly_price
  types:
  - <xref:float>
- description: 'Projected hourly cost for one replica (`vmsPerReplica` VMs), in

    `currency`.'
  name: total_hourly_price
  types:
  - <xref:float>
- description: UTC timestamp of the price snapshot used for this plan.
  name: price_as_of
  types:
  - <xref:datetime.datetime>
- description: "Whether the caller can actually deploy this plan today (region availability,\n\
    GPU quota, model fit, etc.). This field gates the mutually exclusive properties\
    \ on this model:\n\n* When *feasible* is *true*: *totalHourlyPrice* is set and\
    \ *infeasibilityReason* is omitted. \n\n* When *feasible* is *false*: *infeasibilityReason*\
    \ is set and *totalHourlyPrice* is omitted. Required."
  name: feasible
  types:
  - <xref:bool>
- description: 'Reason explaining why the plan is not deployable. This is a

    per-plan annotation, not an ARM error envelope.'
  name: infeasibility_reason
  types:
  - <xref:azure.mgmt.containerserviceaimanager.models.InfeasibilityReason>
attributes:
- uid: azure.mgmt.containerserviceaimanager.models.CalculateCostPlan.feasible
  name: feasible
  summary: "Whether the caller can actually deploy this plan today (region availability,\
