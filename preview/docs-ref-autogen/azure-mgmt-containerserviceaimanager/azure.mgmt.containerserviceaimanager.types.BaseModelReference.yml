### YamlMime:PythonClass
uid: azure.mgmt.containerserviceaimanager.types.BaseModelReference
name: BaseModelReference
fullName: azure.mgmt.containerserviceaimanager.types.BaseModelReference
module: azure.mgmt.containerserviceaimanager.types
summary: 'The base model a custom model was trained from. A HuggingFace repository
  supplied by the user

  because the platform may lack access to private source repositories.'
constructor:
  syntax: BaseModelReference()
variables:
- description: 'The HuggingFace `<org>/<repo>` id of the base model, e.g.

    `meta-llama/Llama-2-7b-chat`. Immutable after creation. Required.'
  name: id
  types:
  - <xref:str>
- description: 'The total size of the model weights in bytes. eg `28000000000`.

    Required if the base model is not publicly accessible on HuggingFace.'
  name: totalWeightSizeBytes
  types:
  - <xref:int>
- description: 'The verbatim `config.json` of the base model, supplied by the user.
    Required if

    the base model is not publicly accessible on HuggingFace.  For more information
    on

    CustomAIModel configuration see [https://aka.ms/aks/aim-customaimodel](https://aka.ms/aks/aim-customaimodel).'
  name: config
  types:
  - <xref:dict>[<xref:str>, <xref:typing.Any>]
attributes:
- uid: azure.mgmt.containerserviceaimanager.types.BaseModelReference.config
  name: config
  summary: 'The verbatim `config.json` of the base model, supplied by the user. Required
    if the base

    model is not publicly accessible on HuggingFace.  For more information on CustomAIModel

    configuration see [https://aka.ms/aks/aim-customaimodel](https://aka.ms/aks/aim-customaimodel).'
  signature: 'config: dict[str, Any]'
- uid: azure.mgmt.containerserviceaimanager.types.BaseModelReference.id
  name: id
  summary: 'The HuggingFace `<org>/<repo>` id of the base model, e.g. `meta-llama/Llama-2-7b-chat`.

    Immutable after creation. Required.'
  signature: 'id: str'
- uid: azure.mgmt.containerserviceaimanager.types.BaseModelReference.totalWeightSizeBytes
  name: totalWeightSizeBytes
  summary: 'The total size of the model weights in bytes. eg `28000000000`. Required
    if the base model is

    not publicly accessible on HuggingFace.'
  signature: 'totalWeightSizeBytes: int'
