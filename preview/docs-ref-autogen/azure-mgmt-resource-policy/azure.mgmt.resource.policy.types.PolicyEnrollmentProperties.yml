  summary: 'The option whether to validate the enrollment is at or under the assignment
    scope. Known values

    are: "Default" and "DoNotValidate".'
  signature: 'assignmentScopeValidation: str | AssignmentScopeValidation'
- uid: azure.mgmt.resource.policy.types.PolicyEnrollmentProperties.description
  name: description
  summary: The description of the policy enrollment.
  signature: 'description: str'
- uid: azure.mgmt.resource.policy.types.PolicyEnrollmentProperties.displayName
  name: displayName
  summary: The display name of the policy enrollment.
  signature: 'displayName: str'
- uid: azure.mgmt.resource.policy.types.PolicyEnrollmentProperties.metadata
  name: metadata
  summary: 'The policy enrollment metadata. Metadata is an open ended object and is
    typically a collection

    of key value pairs.'
  signature: 'metadata: Any'
- uid: azure.mgmt.resource.policy.types.PolicyEnrollmentProperties.policyAssignmentId
  name: policyAssignmentId
  summary: The ID of the policy assignment that is being enrolled. Required.
  signature: 'policyAssignmentId: Required[str]'
