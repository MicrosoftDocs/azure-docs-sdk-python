uid: azure.mgmt.resource.policy.types.PolicyAssignmentProperties
name: PolicyAssignmentProperties
fullName: azure.mgmt.resource.policy.types.PolicyAssignmentProperties
module: azure.mgmt.resource.policy.types
summary: The policy assignment properties.
constructor:
  syntax: PolicyAssignmentProperties()
variables:
- description: The display name of the policy assignment.
  name: displayName
  types:
  - <xref:str>
- description: 'The ID of the policy definition or policy set definition being

    assigned.'
  name: policyDefinitionId
  types:
  - <xref:str>
- description: The version of the policy definition to use.
  name: definitionVersion
  types:
  - <xref:str>
- description: 'The latest version of the policy definition available. This is

    only present if requested via the $expand query parameter.'
  name: latestDefinitionVersion
  types:
  - <xref:str>
- description: 'The effective version of the policy definition in use. This

    is only present if requested via the $expand query parameter.'
  name: effectiveDefinitionVersion
  types:
  - <xref:str>
- description: The scope for the policy assignment.
  name: scope
  types:
  - <xref:str>
- description: The policy's excluded scopes.
  name: notScopes
  types:
  - <xref:list>[<xref:str>]
- description: 'The parameter values for the assigned policy rule. The keys are the
    parameter

    names.'
  name: parameters
  types:
  - <xref:dict>[<xref:str>, <xref:"ParameterValuesValue">]
- description: This message will be part of response in case of policy violation.
  name: description
  types:
  - <xref:str>
- description: 'The policy assignment metadata. Metadata is an open ended object and
    is

    typically a collection of key value pairs.'
  name: metadata
  types:
  - <xref:typing.Any>
- description: 'The policy assignment enforcement mode. Possible values are Default,

    DoNotEnforce, and Enroll. Known values are: "Default", "DoNotEnforce", and "Enroll".'
  name: enforcementMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EnforcementMode">]
- description: 'The messages that describe why a resource is non-compliant with

    the policy.'
  name: nonComplianceMessages
  types:
  - <xref:list>[<xref:"NonComplianceMessage">]
- description: The resource selector list to filter policies by resource properties.
  name: resourceSelectors
  types:
  - <xref:list>[<xref:"ResourceSelector">]
- description: The policy property value override.
  name: overrides
  types:
  - <xref:list>[<xref:"Override">]
- description: 'The type of policy assignment. Possible values are NotSpecified, System,

    SystemHidden, and Custom. Immutable. Known values are: "NotSpecified", "System",

    "SystemHidden", and "Custom".'
  name: assignmentType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AssignmentType">]
- description: 'The instance ID of the policy assignment. This ID only and always
    changes

    when the assignment is deleted and recreated.'
  name: instanceId
  types:
  - <xref:str>
- description: The self-serve exemption settings for the policy assignment.
  name: selfServeExemptionSettings
  types:
  - <xref:<xref:"SelfServeExemptionSettings">>
