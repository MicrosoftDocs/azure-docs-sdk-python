  - <xref:str>
- description: The description of the policy exemption.
  name: description
  types:
  - <xref:str>
- description: 'The policy exemption metadata. Metadata is an open ended object and
    is

    typically a collection of key value pairs.'
  name: metadata
  types:
  - <xref:typing.Any>
- description: The resource selector list to filter policies by resource properties.
  name: resourceSelectors
  types:
  - <xref:list>[<xref:"ResourceSelector">]
- description: 'The option whether validate the exemption is at or under the

