variables:
- description: The ID of the policy assignment that is being exempted. Required.
  name: policyAssignmentId
  types:
  - <xref:str>
- description: 'The policy definition reference ID list when the associated

    policy assignment is an assignment of a policy set definition.'
  name: policyDefinitionReferenceIds
  types:
  - <xref:list>[<xref:str>]
- description: 'The policy exemption category. Possible values are Waiver and

    Mitigated. Required. Known values are: "Waiver" and "Mitigated".'
  name: exemptionCategory
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExemptionCategory">]
- description: 'The expiration date and time (in UTC ISO 8601 format yyyy-MM-ddTHH:mm:ssZ)
    of

    the policy exemption.'
