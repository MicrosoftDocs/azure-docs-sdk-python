uid: azure.mgmt.resource.policy.types.ExternalEvaluationEnforcementSettings
name: ExternalEvaluationEnforcementSettings
fullName: azure.mgmt.resource.policy.types.ExternalEvaluationEnforcementSettings
module: azure.mgmt.resource.policy.types
summary: 'The details of the source of external evaluation results required by the
  policy during

  enforcement evaluation.'
constructor:
  syntax: ExternalEvaluationEnforcementSettings()
variables:
- description: 'What to do when evaluating an enforcement policy that requires an

    external evaluation and the token is missing. Possible values are Audit and Deny
    and language

    expressions are supported.'
  name: missingTokenAction
  types:
  - <xref:str>
- description: 'The lifespan of the endpoint invocation result after which it''s no
    longer

    valid. Value is expected to follow the ISO 8601 duration format and language expressions
    are

    supported.'
  name: resultLifespan
  types:
  - <xref:str>
- description: The settings of an external endpoint providing evaluation results.
  name: endpointSettings
  types:
  - <xref:<xref:"ExternalEvaluationEndpointSettings">>
- description: 'An array of the role definition Ids the assignment''s MSI will need
    in

    order to invoke the endpoint.'
  name: roleDefinitionIds
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.resource.policy.types.ExternalEvaluationEnforcementSettings.endpointSettings
  name: endpointSettings
  summary: The settings of an external endpoint providing evaluation results.
  signature: 'endpointSettings: ExternalEvaluationEndpointSettings'
- uid: azure.mgmt.resource.policy.types.ExternalEvaluationEnforcementSettings.missingTokenAction
  name: missingTokenAction
  summary: 'What to do when evaluating an enforcement policy that requires an external
