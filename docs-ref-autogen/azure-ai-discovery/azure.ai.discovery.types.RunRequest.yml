    , \"/inputs/abcdef-input-1/input.txt\", \"\u2013output\", \"/outputs/abcdef-output-1\"\
    ]\nThe container's entrypoint is not overridden. In Docker terminology, the above\
    \ argument list\nbecomes the CMD, not the ENTRYPOINT of the launched container.\
    \ Our parsing includes the\nfollowing limited interpretation of special characters:\n\
    \n* The only special characters are the double-quote, the single-quote, and the\
    \ backslash. \n\n* A backslash escapes the next character if that character is\
    \ a special character, preserving its literal value. \n\n* Double-quotes preserve\
    \ everything inside them literally, with the exception of the double-quote and\
    \ backslash characters, which must be escaped with a backslash. Unmatched quotes\
    \ will throw an error. \n\n* Single-quotes preserve everything inside them literally.\
    \ A single-quote cannot occur within single-quotes. Unmatched quotes will throw\
    \ an error. \n\nIf you wish to run a command that relies on shell features such\
    \ as globbing or\noutput redirection, you either need to:\n\n* use a container\
