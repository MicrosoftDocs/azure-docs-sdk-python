- uid: azure.ai.discovery.types.RunRequest.nodePoolIds
  name: nodePoolIds
  summary: IDs of NodePools to use for this run. Required.
  signature: 'nodePoolIds: list[str]'
- uid: azure.ai.discovery.types.RunRequest.outputData
  name: outputData
  summary: Output data references and mount paths.
  signature: 'outputData: list[azure.ai.discovery.types.OutputDataMount]'
- uid: azure.ai.discovery.types.RunRequest.toolId
  name: toolId
  summary: ID of the tool to execute. Required.
  signature: 'toolId: str'
