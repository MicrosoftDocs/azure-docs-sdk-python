### YamlMime:PythonClass
uid: azure.ai.discovery.types.RunRequest
name: RunRequest
fullName: azure.ai.discovery.types.RunRequest
module: azure.ai.discovery.types
summary: RunRequest.
constructor:
  syntax: RunRequest()
variables:
- description: ID of the tool to execute. Required.
  name: tool_id
  types:
  - <xref:str>
- description: "Command to pass to tool container entrypoint. If the tool has multiple\n\
    containers defined, this command is executed on all of them. If omitted, all containers\
    \ execute\ntheir raw entrypoints. This command is parsed into an argument list\
    \ which is passed to the\nunderlying container runtime. For example, if the command\
    \ is \"python /code/wrapper.py \u2013input\n/inputs/abcdef-input-1/input.txt \u2013\
    output /outputs/abcdef-output-1\", then the container runtime\nwill receive the\
    \ following argument list: [\"python\", \"/code/wrapper.py\", \"\u2013input\"\
    ,\n\"/inputs/abcdef-input-1/input.txt\", \"\u2013output\", \"/outputs/abcdef-output-1\"\
    ] The container's\nentrypoint is not overridden. In Docker terminology, the above\
    \ argument list becomes the CMD,\nnot the ENTRYPOINT of the launched container.\
    \ Our parsing includes the following limited\ninterpretation of special characters:\n\
    \n* The only special characters are the double-quote, the single-quote, and the\
    \ backslash. \n\n* A backslash escapes the next character if that character is\
    \ a special character, preserving its literal value. \n\n* Double-quotes preserve\
    \ everything inside them literally, with the exception of the double-quote and\
    \ backslash characters, which must be escaped with a backslash. Unmatched quotes\
    \ will throw an error. \n\n* Single-quotes preserve everything inside them literally.\
    \ A single-quote cannot occur within single-quotes. Unmatched quotes will throw\
    \ an error. \n\nIf you wish to run a command that relies on shell features such\
    \ as globbing or\noutput redirection, you either need to:\n\n* use a container\
    \ with an entrypoint that is a shell (for example, /bin/sh or /bin/bash) and pass\
    \ a command which is valid for that shell, for example -c 'python /code/wrapper.py\
    \ \u2013input /inputs/abcdef-input-1/* \u2013output /outputs/abcdef-output-1'\
    \ \n\n* use a container which has a shell installed, and include the shell in\
    \ the command, for example sh -c \"python /code/wrapper.py \u2013input /inputs/abcdef-input-1/*\
    \ \u2013output /outputs/abcdef-output-1\"."
  name: command
  types:
  - <xref:str>
- description: 'Encoded inline files to be mounted into the container, e.g. for generated

    code.'
  name: inline_files
  types:
  - <xref:list>[<xref:"InlineFile">]
- description: Input data references and mount paths.
  name: input_data
  types:
  - <xref:list>[<xref:"InputDataMount">]
- description: Output data references and mount paths.
  name: output_data
  types:
  - <xref:list>[<xref:"OutputDataMount">]
- description: IDs of NodePools to use for this run. Required.
  name: node_pool_ids
  types:
  - <xref:list>[<xref:str>]
- description: Override the infrastructure requirements in the tool definitions.
  name: infra_overrides
  types:
  - <xref:<xref:"InfraOverrides">>
- description: 'Optional environment variables to set in the tool container. This

    must not contain any secrets.'
  name: environment_variables
  types:
  - <xref:list>[<xref:"RunRequestEnvironmentVariable">]
methods:
- uid: azure.ai.discovery.types.RunRequest.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.ai.discovery.types.RunRequest.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.ai.discovery.types.RunRequest.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.ai.discovery.types.RunRequest.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.discovery.types.RunRequest.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.ai.discovery.types.RunRequest.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.ai.discovery.types.RunRequest.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.ai.discovery.types.RunRequest.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.ai.discovery.types.RunRequest.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.discovery.types.RunRequest.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.ai.discovery.types.RunRequest.values
  name: values
  signature: values() -> an object providing a view on D's values
