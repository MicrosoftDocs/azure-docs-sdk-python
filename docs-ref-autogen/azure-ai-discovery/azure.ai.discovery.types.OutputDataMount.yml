### YamlMime:PythonClass
uid: azure.ai.discovery.types.OutputDataMount
name: OutputDataMount
fullName: azure.ai.discovery.types.OutputDataMount
module: azure.ai.discovery.types
summary: Definition of a mount for collecting tool output data.
constructor:
  syntax: OutputDataMount()
variables:
- description: URI of location to persist output to. Required.
  name: storage_uri
  types:
  - <xref:str>
- description: 'Absolute path within the container from which to collect output data.

    Required.'
  name: mount_path
  types:
  - <xref:str>
- description: 'The protocol to use for mounting this storage. Overrides any value

    specified on the storage container. Known values are: "NFS" and "BlobfuseCaching".'
  name: mount_protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageMountProtocol">]
methods:
- uid: azure.ai.discovery.types.OutputDataMount.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.ai.discovery.types.OutputDataMount.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.ai.discovery.types.OutputDataMount.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.ai.discovery.types.OutputDataMount.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.discovery.types.OutputDataMount.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.ai.discovery.types.OutputDataMount.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.ai.discovery.types.OutputDataMount.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.ai.discovery.types.OutputDataMount.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.ai.discovery.types.OutputDataMount.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.discovery.types.OutputDataMount.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.ai.discovery.types.OutputDataMount.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.ai.discovery.types.OutputDataMount.mountPath
  name: mountPath
  summary: Absolute path within the container from which to collect output data. Required.
  signature: 'mountPath: Required[str]'
- uid: azure.ai.discovery.types.OutputDataMount.mountProtocol
  name: mountProtocol
  summary: 'The protocol to use for mounting this storage. Overrides any value specified
    on the storage

    container. Known values are: "NFS" and "BlobfuseCaching".'
  signature: 'mountProtocol: str | StorageMountProtocol'
- uid: azure.ai.discovery.types.OutputDataMount.storageUri
  name: storageUri
  summary: URI of location to persist output to. Required.
  signature: 'storageUri: Required[str]'
