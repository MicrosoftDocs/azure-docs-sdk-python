- uid: azure.ai.discovery.aio.operations.ToolsOperations.begin_run
  name: begin_run
  summary: Run the specified tool in the context of the specified project.
  signature: 'async begin_run(project_name: str, *, tool_id: str, node_pool_ids: List[str],
    content_type: str = ''application/json'', command: str | None = None, inline_files:
    List[_models.InlineFile] | None = None, input_data: List[_models.InputDataMount]
    | None = None, output_data: List[_models.OutputDataMount] | None = None, infra_overrides:
    _models.InfraOverrides | None = None, environment_variables: List[_models.RunRequestEnvironmentVariable]
    | None = None, **kwargs: Any) -> AsyncLROPoller[_models.RunResult]'
  parameters:
  - name: project_name
    description: Name of the associated Project. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: body
    description: 'Is one of the following types: JSON, RunRequest, IO[bytes] Required.'
    types:
    - <xref:JSON>
    - <xref:azure.ai.discovery.types.RunRequest>
    - <xref:typing.IO>[<xref:bytes>]
  keywordOnlyParameters:
  - name: tool_id
    description: ID of the tool to execute. Required.
    defaultValue: <object object at 0x000001BACED0E5C0>
    types:
    - <xref:str>
  - name: node_pool_ids
    description: IDs of NodePools to use for this run. Required.
    defaultValue: <object object at 0x000001BACED0E5C0>
    types:
    - <xref:list>[<xref:str>]
  - name: command
    description: "Command to pass to tool container entrypoint.\n\nIf the tool has\
      \ multiple containers defined, this command is executed on all of them.\n\n\
      If omitted, all containers execute their raw entrypoints.\n\nThis command is\
      \ parsed into an argument list which is passed to the underlying container\n\
      runtime.\nFor example, if the command is \"python /code/wrapper.py \u2013input\n\
      /inputs/abcdef-input-1/input.txt \u2013output /outputs/abcdef-output-1\",\n\
      then the container runtime will receive the following argument list:\n[\"python\"\
      , \"/code/wrapper.py\", \"\u2013input\", \"/inputs/abcdef-input-1/input.txt\"\
      , \"\u2013output\",\n\"/outputs/abcdef-output-1\"]\n\nThe container's entrypoint\
      \ is not overridden. In Docker terminology, the above argument list\nbecomes\n\
      the CMD, not the ENTRYPOINT of the launched container.\n\nOur parsing includes\
      \ the following limited interpretation of special characters:\n\n* The only\
      \ special characters are the double-quote, the single-quote, and the backslash.\
      \ \n\n* A backslash escapes the next character if that character is a special\
      \ character, preserving its literal value. \n\n* Double-quotes preserve everything\
      \ inside them literally, with the exception of the double-quote and backslash\
      \ characters, which must be escaped with a backslash. Unmatched quotes will\
      \ throw an error. \n\n* Single-quotes preserve everything inside them literally.\
      \ A single-quote cannot occur within single-quotes. Unmatched quotes will throw\
      \ an error. \n\nIf you wish to run a command that relies on shell features such\
      \ as globbing or\noutput redirection, you either need to:\n\n* use a container\
      \ with an entrypoint that is a shell (for example, /bin/sh or /bin/bash) and\
      \ pass a command which is valid for that shell, for example -c 'python /code/wrapper.py\
      \ \u2013input /inputs/abcdef-input-1/* \u2013output /outputs/abcdef-output-1'\
      \ \n\n* use a container which has a shell installed, and include the shell in\
      \ the command, for example sh -c \"python /code/wrapper.py \u2013input /inputs/abcdef-input-1/*\
      \ \u2013output /outputs/abcdef-output-1\". Default value is None."
    defaultValue: None
    types:
    - <xref:str>
  - name: inline_files
    description: 'Encoded inline files to be mounted into the container, e.g. for

      generated code. Default value is None.'
    defaultValue: None
    types:
    - <xref:list>[<xref:azure.ai.discovery.models.InlineFile>]
  - name: input_data
    description: Input data references and mount paths. Default value is None.
    defaultValue: None
    types:
    - <xref:list>[<xref:azure.ai.discovery.models.InputDataMount>]
  - name: output_data
    description: Output data references and mount paths. Default value is None.
    defaultValue: None
    types:
    - <xref:list>[<xref:azure.ai.discovery.models.OutputDataMount>]
  - name: infra_overrides
    description: 'Override the infrastructure requirements in the tool definitions.

      Default value is None.'
    defaultValue: None
    types:
    - <xref:azure.ai.discovery.models.InfraOverrides>
  - name: environment_variables
    description: 'Optional environment variables to set in the tool container.

      This must not contain any secrets. Default value is None.'
    defaultValue: None
    types:
    - <xref:list>[<xref:azure.ai.discovery.models.RunRequestEnvironmentVariable>]
  return:
    description: 'An instance of AsyncLROPoller that returns RunResult. The RunResult
      is compatible with

      MutableMapping'
    types:
    - <xref:azure.core.polling.AsyncLROPoller>[<xref:azure.ai.discovery.models.RunResult>]
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
