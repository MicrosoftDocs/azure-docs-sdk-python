uid: azure.ai.discovery.types.InfraOverrides
name: InfraOverrides
fullName: azure.ai.discovery.types.InfraOverrides
module: azure.ai.discovery.types
summary: Explicitly set tool run requirements - overrides the tool definition.
constructor:
  syntax: InfraOverrides()
variables:
- description: Override CPU requirements (e.g. 1, or 500m for 500 milli-CPUs).
  name: cpu
  types:
  - <xref:str>
- description: Override RAM requirements (e.g. 500Mi or 1Gi).
  name: ram
  types:
  - <xref:str>
- description: Override GPU count requirements.
  name: gpu
  types:
  - <xref:str>
- description: Override the number of replicas of the tool image to run.
  name: replica_count
  types:
  - <xref:int>
- description: Override the image to use for this tool run.
  name: image_uri
  types:
  - <xref:str>
- description: 'Override the maximum CPU allowed for the tool run (e.g. 1, or 500m
    for 500

    milli-CPUs).'
  name: max_cpu
  types:
  - <xref:str>
- description: Override the maximum RAM allowed for the tool run (e.g. 500Mi or 1Gi).
  name: max_ram
  types:
  - <xref:str>
- description: Override the maximum GPU count allowed for the tool run.
  name: max_gpu
  types:
  - <xref:str>
