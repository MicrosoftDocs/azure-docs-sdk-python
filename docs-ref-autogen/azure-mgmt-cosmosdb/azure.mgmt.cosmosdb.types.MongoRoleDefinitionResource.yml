### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.MongoRoleDefinitionResource
name: MongoRoleDefinitionResource
fullName: azure.mgmt.cosmosdb.types.MongoRoleDefinitionResource
module: azure.mgmt.cosmosdb.types
summary: Azure Cosmos DB Mongo Role Definition resource object.
constructor:
  syntax: MongoRoleDefinitionResource()
variables:
- description: 'A user-friendly name for the Role Definition. Must be unique for the
    database

    account.'
  name: role_name
  types:
  - <xref:str>
- description: 'Indicates whether the Role Definition was built-in or user created.
    Known values

    are: "BuiltInRole" and "CustomRole".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MongoRoleDefinitionType">]
- description: 'The database name for which access is being granted for this Role

    Definition.'
  name: database_name
  types:
  - <xref:str>
- description: 'A set of privileges contained by the Role Definition. This will allow

    application of this Role Definition on the entire database account or any underlying
    Database /

    Collection. Scopes higher than Database are not enforceable as privilege.'
  name: privileges
  types:
  - <xref:list>[<xref:"Privilege">]
- description: The set of roles inherited by this Role Definition.
  name: roles
  types:
  - <xref:list>[<xref:"Role">]
attributes:
- uid: azure.mgmt.cosmosdb.types.MongoRoleDefinitionResource.databaseName
  name: databaseName
  summary: The database name for which access is being granted for this Role Definition.
  signature: 'databaseName: str'
- uid: azure.mgmt.cosmosdb.types.MongoRoleDefinitionResource.privileges
  name: privileges
  summary: 'A set of privileges contained by the Role Definition. This will allow
    application of this Role

    Definition on the entire database account or any underlying Database / Collection.
    Scopes

    higher than Database are not enforceable as privilege.'
  signature: 'privileges: list[''Privilege'']'
- uid: azure.mgmt.cosmosdb.types.MongoRoleDefinitionResource.roleName
  name: roleName
  summary: A user-friendly name for the Role Definition. Must be unique for the database
    account.
  signature: 'roleName: str'
- uid: azure.mgmt.cosmosdb.types.MongoRoleDefinitionResource.roles
  name: roles
  summary: The set of roles inherited by this Role Definition.
  signature: 'roles: list[''Role'']'
- uid: azure.mgmt.cosmosdb.types.MongoRoleDefinitionResource.type
  name: type
  summary: 'Indicates whether the Role Definition was built-in or user created. Known
    values are:

    "BuiltInRole" and "CustomRole".'
  signature: 'type: str | MongoRoleDefinitionType'
