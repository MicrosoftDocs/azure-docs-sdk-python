### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.LocationProperties
name: LocationProperties
fullName: azure.mgmt.cosmosdb.types.LocationProperties
module: azure.mgmt.cosmosdb.types
summary: Cosmos DB location metadata.
constructor:
  syntax: LocationProperties()
variables:
- description: 'Flag indicating whether the location supports availability

    zones or not.'
  name: supports_availability_zone
  types:
  - <xref:bool>
- description: Flag indicating whether the location is residency sensitive.
  name: is_residency_restricted
  types:
  - <xref:bool>
- description: The properties of available backup storage redundancies.
  name: backup_storage_redundancies
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"BackupStorageRedundancy">]]
- description: 'Flag indicating whether the

    subscription have access in region for Non-Availability Zones.'
  name: is_subscription_region_access_allowed_for_regular
  types:
  - <xref:bool>
- description: 'Flag indicating whether the subscription

    have access in region for Availability Zones(Az).'
  name: is_subscription_region_access_allowed_for_az
  types:
  - <xref:bool>
- description: 'Enum to indicate current buildout status of the region. Known values
    are:

    "Uninitialized", "Initializing", "InternallyReady", "Online", "Deleting", "Succeeded",

    "Failed", "Canceled", "Updating", and "Creating".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Status">]
attributes:
- uid: azure.mgmt.cosmosdb.types.LocationProperties.backupStorageRedundancies
  name: backupStorageRedundancies
  summary: The properties of available backup storage redundancies.
  signature: 'backupStorageRedundancies: list[typing.Union[str, ForwardRef(''BackupStorageRedundancy'')]]'
- uid: azure.mgmt.cosmosdb.types.LocationProperties.isResidencyRestricted
  name: isResidencyRestricted
  summary: Flag indicating whether the location is residency sensitive.
  signature: 'isResidencyRestricted: bool'
- uid: azure.mgmt.cosmosdb.types.LocationProperties.isSubscriptionRegionAccessAllowedForAz
  name: isSubscriptionRegionAccessAllowedForAz
  summary: Flag indicating whether the subscription have access in region for Availability
    Zones(Az).
  signature: 'isSubscriptionRegionAccessAllowedForAz: bool'
- uid: azure.mgmt.cosmosdb.types.LocationProperties.isSubscriptionRegionAccessAllowedForRegular
  name: isSubscriptionRegionAccessAllowedForRegular
  summary: Flag indicating whether the subscription have access in region for Non-Availability
    Zones.
  signature: 'isSubscriptionRegionAccessAllowedForRegular: bool'
- uid: azure.mgmt.cosmosdb.types.LocationProperties.status
  name: status
  summary: '"Uninitialized",

    "Initializing", "InternallyReady", "Online", "Deleting", "Succeeded", "Failed",

    "Canceled", "Updating", and "Creating".'
  signature: 'status: str | Status'
- uid: azure.mgmt.cosmosdb.types.LocationProperties.supportsAvailabilityZone
  name: supportsAvailabilityZone
  summary: Flag indicating whether the location supports availability zones or not.
  signature: 'supportsAvailabilityZone: bool'
