### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.VectorEmbedding
name: VectorEmbedding
fullName: azure.mgmt.cosmosdb.types.VectorEmbedding
module: azure.mgmt.cosmosdb.types
summary: 'Represents a vector embedding. A vector embedding is used to define a vector
  field in the

  documents.'
constructor:
  syntax: VectorEmbedding()
variables:
- description: The path to the vector field in the document. Required.
  name: path
  types:
  - <xref:str>
- description: 'Indicates the data type of vector. Required. Known values are: "float32",

    "uint8", "int8", and "float16".'
  name: data_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VectorDataType">]
- description: 'The distance function to use for distance calculation in between

    vectors. Required. Known values are: "euclidean", "cosine", and "dotproduct".'
  name: distance_function
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DistanceFunction">]
- description: The number of dimensions in the vector. Required.
  name: dimensions
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.cosmosdb.types.VectorEmbedding.dataType
  name: dataType
  summary: '"float32", "uint8",

    "int8", and "float16".'
  signature: 'dataType: Required[str | VectorDataType]'
- uid: azure.mgmt.cosmosdb.types.VectorEmbedding.dimensions
  name: dimensions
  summary: The number of dimensions in the vector. Required.
  signature: 'dimensions: Required[int]'
- uid: azure.mgmt.cosmosdb.types.VectorEmbedding.distanceFunction
  name: distanceFunction
  summary: 'The distance function to use for distance calculation in between vectors.
    Required. Known

    values are: "euclidean", "cosine", and "dotproduct".'
  signature: 'distanceFunction: Required[str | DistanceFunction]'
- uid: azure.mgmt.cosmosdb.types.VectorEmbedding.path
  name: path
  summary: The path to the vector field in the document. Required.
  signature: 'path: Required[str]'
