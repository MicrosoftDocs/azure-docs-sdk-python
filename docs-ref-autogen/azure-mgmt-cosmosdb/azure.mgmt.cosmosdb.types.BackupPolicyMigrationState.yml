### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.BackupPolicyMigrationState
name: BackupPolicyMigrationState
fullName: azure.mgmt.cosmosdb.types.BackupPolicyMigrationState
module: azure.mgmt.cosmosdb.types
summary: The object representing the state of the migration between the backup policies.
constructor:
  syntax: BackupPolicyMigrationState()
variables:
- description: 'Describes the status of migration between backup policy types. Known
    values are:

    "Invalid", "InProgress", "Completed", and "Failed".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupPolicyMigrationStatus">]
- description: 'Describes the target backup policy type of the backup policy migration.

    Known values are: "Periodic" and "Continuous".'
  name: target_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupPolicyType">]
- description: Time at which the backup policy migration started (ISO-8601 format).
  name: start_time
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cosmosdb.types.BackupPolicyMigrationState.startTime
  name: startTime
  summary: Time at which the backup policy migration started (ISO-8601 format).
  signature: 'startTime: str'
- uid: azure.mgmt.cosmosdb.types.BackupPolicyMigrationState.status
  name: status
  summary: '"Invalid",

    "InProgress", "Completed", and "Failed".'
  signature: 'status: str | BackupPolicyMigrationStatus'
- uid: azure.mgmt.cosmosdb.types.BackupPolicyMigrationState.targetType
  name: targetType
  summary: 'Describes the target backup policy type of the backup policy migration.
    Known values are:

    "Periodic" and "Continuous".'
  signature: 'targetType: str | BackupPolicyType'
