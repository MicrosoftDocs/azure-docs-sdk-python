### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.CorsPolicy
name: CorsPolicy
fullName: azure.mgmt.cosmosdb.types.CorsPolicy
module: azure.mgmt.cosmosdb.types
summary: The CORS policy for the Cosmos DB database account.
constructor:
  syntax: CorsPolicy()
variables:
- description: 'The origin domains that are permitted to make a request against the

    service via CORS. Required.'
  name: allowed_origins
  types:
  - <xref:str>
- description: 'The methods (HTTP request verbs) that the origin domain may use for
    a

    CORS request.'
  name: allowed_methods
  types:
  - <xref:str>
- description: 'The request headers that the origin domain may specify on the CORS

    request.'
  name: allowed_headers
  types:
  - <xref:str>
- description: 'The response headers that may be sent in the response to the CORS

    request and exposed by the browser to the request issuer.'
  name: exposed_headers
  types:
  - <xref:str>
- description: 'The maximum amount time that a browser should cache the preflight

    OPTIONS request.'
  name: max_age_in_seconds
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.cosmosdb.types.CorsPolicy.allowedHeaders
  name: allowedHeaders
  summary: The request headers that the origin domain may specify on the CORS request.
  signature: 'allowedHeaders: str'
- uid: azure.mgmt.cosmosdb.types.CorsPolicy.allowedMethods
  name: allowedMethods
  summary: The methods (HTTP request verbs) that the origin domain may use for a CORS
    request.
  signature: 'allowedMethods: str'
- uid: azure.mgmt.cosmosdb.types.CorsPolicy.allowedOrigins
  name: allowedOrigins
  summary: The origin domains that are permitted to make a request against the service
    via CORS. Required.
  signature: 'allowedOrigins: str'
- uid: azure.mgmt.cosmosdb.types.CorsPolicy.exposedHeaders
  name: exposedHeaders
  summary: 'The response headers that may be sent in the response to the CORS request
    and exposed by the

    browser to the request issuer.'
  signature: 'exposedHeaders: str'
- uid: azure.mgmt.cosmosdb.types.CorsPolicy.maxAgeInSeconds
  name: maxAgeInSeconds
  summary: The maximum amount time that a browser should cache the preflight OPTIONS
    request.
  signature: 'maxAgeInSeconds: int'
