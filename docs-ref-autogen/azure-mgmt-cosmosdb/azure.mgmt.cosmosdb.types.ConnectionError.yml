uid: azure.mgmt.cosmosdb.types.ConnectionError
name: ConnectionError
fullName: azure.mgmt.cosmosdb.types.ConnectionError
module: azure.mgmt.cosmosdb.types
summary: ConnectionError.
constructor:
  syntax: ConnectionError()
variables:
- description: 'The kind of connection error that occurred. Known values are:

    "Unknown", "OK", "OperatorToDataCenterNetworkError", "DatacenterToDatacenterNetworkError",

    "InternalOperatorToDataCenterCertificateError", and "InternalError".'
  name: connection_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectionState">]
- description: The IP of host that originated the failed connection.
  name: i_p_from
  types:
  - <xref:str>
- description: The IP that the connection attempted to reach.
  name: i_p_to
  types:
  - <xref:str>
- description: The TCP port the connection was attempted on.
  name: port
  types:
  - <xref:int>
- description: Detailed error message about the failed connection.
  name: exception
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cosmosdb.types.ConnectionError.connectionState
  name: connectionState
  summary: '"Unknown", "OK",

    "OperatorToDataCenterNetworkError", "DatacenterToDatacenterNetworkError",

    "InternalOperatorToDataCenterCertificateError", and "InternalError".'
  signature: 'connectionState: str | ConnectionState'
- uid: azure.mgmt.cosmosdb.types.ConnectionError.exception
  name: exception
  summary: Detailed error message about the failed connection.
  signature: 'exception: str'
- uid: azure.mgmt.cosmosdb.types.ConnectionError.iPFrom
  name: iPFrom
  summary: The IP of host that originated the failed connection.
  signature: 'iPFrom: str'
- uid: azure.mgmt.cosmosdb.types.ConnectionError.iPTo
  name: iPTo
