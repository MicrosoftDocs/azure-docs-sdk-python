uid: azure.mgmt.cosmosdb.types.PartitionMetric
name: PartitionMetric
fullName: azure.mgmt.cosmosdb.types.PartitionMetric
module: azure.mgmt.cosmosdb.types
summary: The metric values for a single partition.
constructor:
  syntax: PartitionMetric()
variables:
- description: The start time for the metric (ISO-8601 format).
  name: start_time
  types:
  - <xref:str>
- description: The end time for the metric (ISO-8601 format).
  name: end_time
  types:
  - <xref:str>
- description: The time grain to be used to summarize the metric values.
  name: time_grain
  types:
  - <xref:str>
- description: 'The unit of the metric. Known values are: "Count", "Bytes", "Seconds",
    "Percent",

    "CountPerSecond", "BytesPerSecond", and "Milliseconds".'
  name: unit
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UnitType">]
- description: The name information for the metric.
  name: name
  types:
  - <xref:<xref:"MetricName">>
- description: The metric values for the specified time window and timestep.
  name: metric_values
  types:
  - <xref:list>[<xref:"MetricValue">]
- description: The partition id (GUID identifier) of the metric values.
  name: partition_id
  types:
  - <xref:str>
- description: 'The partition key range id (integer identifier) of the metric

    values.'
  name: partition_key_range_id
  types:
  - <xref:str>
