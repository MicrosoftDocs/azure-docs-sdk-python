### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.AuthenticationMethodLdapProperties
name: AuthenticationMethodLdapProperties
fullName: azure.mgmt.cosmosdb.types.AuthenticationMethodLdapProperties
module: azure.mgmt.cosmosdb.types
summary: Ldap authentication method properties. This feature is in preview.
constructor:
  syntax: AuthenticationMethodLdapProperties()
variables:
- description: Hostname of the LDAP server.
  name: server_hostname
  types:
  - <xref:str>
- description: Port of the LDAP server.
  name: server_port
  types:
  - <xref:int>
- description: 'Distinguished name of the look up user account, who can

    look up user details on authentication.'
  name: service_user_distinguished_name
  types:
  - <xref:str>
- description: Password of the look up user.
  name: service_user_password
  types:
  - <xref:str>
- description: 'Distinguished name of the object to start the recursive

    search of users from.'
  name: search_base_distinguished_name
  types:
  - <xref:str>
- description: 'Template to use for searching. Defaults to (cn=%s) where %s will

    be replaced by the username used to login.'
  name: search_filter_template
  types:
  - <xref:str>
- name: server_certificates
  types:
  - <xref:list>[<xref:"Certificate">]
- description: 'Timeout for connecting to the LDAP server in miliseconds. The

    default is 5000 ms.'
  name: connection_timeout_in_ms
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.cosmosdb.types.AuthenticationMethodLdapProperties.connectionTimeoutInMs
  name: connectionTimeoutInMs
  summary: Timeout for connecting to the LDAP server in miliseconds. The default is
    5000 ms.
  signature: 'connectionTimeoutInMs: int'
- uid: azure.mgmt.cosmosdb.types.AuthenticationMethodLdapProperties.searchBaseDistinguishedName
  name: searchBaseDistinguishedName
  summary: Distinguished name of the object to start the recursive search of users
    from.
  signature: 'searchBaseDistinguishedName: str'
- uid: azure.mgmt.cosmosdb.types.AuthenticationMethodLdapProperties.searchFilterTemplate
  name: searchFilterTemplate
  summary: 'Template to use for searching. Defaults to (cn=%s) where %s will be replaced
    by the username

    used to login.'
  signature: 'searchFilterTemplate: str'
- uid: azure.mgmt.cosmosdb.types.AuthenticationMethodLdapProperties.serverHostname
  name: serverHostname
  summary: Hostname of the LDAP server.
  signature: 'serverHostname: str'
- uid: azure.mgmt.cosmosdb.types.AuthenticationMethodLdapProperties.serverPort
  name: serverPort
  summary: Port of the LDAP server.
  signature: 'serverPort: int'
- uid: azure.mgmt.cosmosdb.types.AuthenticationMethodLdapProperties.serviceUserDistinguishedName
  name: serviceUserDistinguishedName
  summary: Distinguished name of the look up user account, who can look up user details
    on authentication.
  signature: 'serviceUserDistinguishedName: str'
- uid: azure.mgmt.cosmosdb.types.AuthenticationMethodLdapProperties.serviceUserPassword
  name: serviceUserPassword
  summary: Password of the look up user.
  signature: 'serviceUserPassword: str'
- uid: azure.mgmt.cosmosdb.types.AuthenticationMethodLdapProperties.serverCertificates
  name: serverCertificates
  signature: 'serverCertificates: list[azure.mgmt.cosmosdb.types.Certificate]'
