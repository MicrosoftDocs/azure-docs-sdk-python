### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.FleetspaceProperties
name: FleetspaceProperties
fullName: azure.mgmt.cosmosdb.types.FleetspaceProperties
module: azure.mgmt.cosmosdb.types
summary: Properties to update Azure Cosmos DB Fleetspace.
constructor:
  syntax: FleetspaceProperties()
variables:
- description: 'A provisioning state of the Fleetspace. Known values are:

    "Uninitialized", "Initializing", "InternallyReady", "Online", "Deleting", "Succeeded",

    "Failed", "Canceled", "Updating", and "Creating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Status">]
- description: 'The kind of API this fleetspace belongs to. Acceptable values:

    ''NoSQL''. "NoSQL"'
  name: fleetspace_api_kind
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FleetspacePropertiesFleetspaceApiKind">]
- description: 'Service Tier for the fleetspace. GeneralPurpose types refers to single

    write region accounts that can be added to this fleetspace, whereas BusinessCritical
    refers to

    multi write region. Known values are: "GeneralPurpose" and "BusinessCritical".'
  name: service_tier
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FleetspacePropertiesServiceTier">]
- description: List of data regions assigned to the fleetspace. Eg [westus2].
  name: data_regions
  types:
  - <xref:list>[<xref:str>]
- description: Configuration for throughput pool in the fleetspace.
  name: throughput_pool_configuration
  types:
  - <xref:<xref:"FleetspacePropertiesThroughputPoolConfiguration">>
attributes:
- uid: azure.mgmt.cosmosdb.types.FleetspaceProperties.dataRegions
  name: dataRegions
  summary: List of data regions assigned to the fleetspace. Eg [westus2].
  signature: 'dataRegions: list[str]'
- uid: azure.mgmt.cosmosdb.types.FleetspaceProperties.fleetspaceApiKind
  name: fleetspaceApiKind
  summary: '''NoSQL''. "NoSQL"'
  signature: 'fleetspaceApiKind: str | FleetspacePropertiesFleetspaceApiKind'
- uid: azure.mgmt.cosmosdb.types.FleetspaceProperties.provisioningState
  name: provisioningState
  summary: '"Uninitialized", "Initializing",

    "InternallyReady", "Online", "Deleting", "Succeeded", "Failed", "Canceled",

    "Updating", and "Creating".'
  signature: 'provisioningState: str | Status'
- uid: azure.mgmt.cosmosdb.types.FleetspaceProperties.serviceTier
  name: serviceTier
  summary: 'Service Tier for the fleetspace. GeneralPurpose types refers to single
    write region accounts

    that can be added to this fleetspace, whereas BusinessCritical refers to multi
    write region.

    Known values are: "GeneralPurpose" and "BusinessCritical".'
  signature: 'serviceTier: str | FleetspacePropertiesServiceTier'
- uid: azure.mgmt.cosmosdb.types.FleetspaceProperties.throughputPoolConfiguration
  name: throughputPoolConfiguration
  summary: Configuration for throughput pool in the fleetspace.
  signature: 'throughputPoolConfiguration: FleetspacePropertiesThroughputPoolConfiguration'
