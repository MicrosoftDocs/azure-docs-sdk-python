uid: azure.mgmt.cosmosdb.types.SqlContainerResource
name: SqlContainerResource
fullName: azure.mgmt.cosmosdb.types.SqlContainerResource
module: azure.mgmt.cosmosdb.types
summary: Cosmos DB SQL container resource object.
constructor:
  syntax: SqlContainerResource()
variables:
- description: Name of the Cosmos DB SQL container. Required.
  name: id
  types:
  - <xref:str>
- description: 'The configuration of the indexing policy. By default, the indexing
    is

    automatic for all document paths within the container.'
  name: indexing_policy
  types:
  - <xref:<xref:"IndexingPolicy">>
- description: 'The configuration of the partition key to be used for partitioning
    data

    into multiple partitions.'
  name: partition_key
  types:
  - <xref:<xref:"ContainerPartitionKey">>
- description: Default time to live.
  name: default_ttl
  types:
  - <xref:int>
- description: 'The unique key policy configuration for specifying uniqueness

    constraints on documents in the collection in the Azure Cosmos DB service.'
  name: unique_key_policy
  types:
  - <xref:<xref:"UniqueKeyPolicy">>
- description: The conflict resolution policy for the container.
  name: conflict_resolution_policy
  types:
  - <xref:<xref:"ConflictResolutionPolicy">>
- description: The client encryption policy for the container.
  name: client_encryption_policy
  types:
  - <xref:<xref:"ClientEncryptionPolicy">>
- description: Analytical TTL.
  name: analytical_storage_ttl
  types:
  - <xref:int>
- description: Parameters to indicate the information about the restore.
  name: restore_parameters
  types:
  - <xref:<xref:"ResourceRestoreParameters">>
- description: 'Enum to indicate the mode of account creation. Known values are: "Default"

    and "Restore".'
  name: create_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CreateMode">]
- description: List of computed properties.
  name: computed_properties
  types:
  - <xref:list>[<xref:"ComputedProperty">]
- description: The vector embedding policy for the container.
  name: vector_embedding_policy
  types:
  - <xref:<xref:"VectorEmbeddingPolicy">>
- description: The FullText policy for the container.
  name: full_text_policy
  types:
  - <xref:<xref:"FullTextPolicy">>
