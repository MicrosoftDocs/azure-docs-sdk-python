### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.RestorableDatabaseAccountProperties
name: RestorableDatabaseAccountProperties
fullName: azure.mgmt.cosmosdb.types.RestorableDatabaseAccountProperties
module: azure.mgmt.cosmosdb.types
summary: The properties of a restorable database account.
constructor:
  syntax: RestorableDatabaseAccountProperties()
variables:
- description: The name of the global database account.
  name: account_name
  types:
  - <xref:str>
- description: The creation time of the restorable database account (ISO-8601 format).
  name: creation_time
  types:
  - <xref:str>
- description: 'The least recent time at which the database account can be

    restored to (ISO-8601 format).'
  name: oldest_restorable_time
  types:
  - <xref:str>
- description: 'The time at which the restorable database account has been deleted

    (ISO-8601 format).'
  name: deletion_time
  types:
  - <xref:str>
- description: 'The API type of the restorable database account. Known values are:
    "MongoDB",

    "Gremlin", "Cassandra", "Table", "Sql", and "GremlinV2".'
  name: api_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApiType">]
- description: 'List of regions where the of the database account can be restored

    from.'
  name: restorable_locations
  types:
  - <xref:list>[<xref:"RestorableLocationResource">]
attributes:
- uid: azure.mgmt.cosmosdb.types.RestorableDatabaseAccountProperties.accountName
  name: accountName
  summary: The name of the global database account.
  signature: 'accountName: str'
- uid: azure.mgmt.cosmosdb.types.RestorableDatabaseAccountProperties.apiType
  name: apiType
  summary: '"MongoDB", "Gremlin",

    "Cassandra", "Table", "Sql", and "GremlinV2".'
  signature: 'apiType: str | ApiType'
- uid: azure.mgmt.cosmosdb.types.RestorableDatabaseAccountProperties.creationTime
  name: creationTime
  summary: The creation time of the restorable database account (ISO-8601 format).
  signature: 'creationTime: str'
- uid: azure.mgmt.cosmosdb.types.RestorableDatabaseAccountProperties.deletionTime
  name: deletionTime
  summary: The time at which the restorable database account has been deleted (ISO-8601
    format).
  signature: 'deletionTime: str'
- uid: azure.mgmt.cosmosdb.types.RestorableDatabaseAccountProperties.oldestRestorableTime
  name: oldestRestorableTime
  summary: The least recent time at which the database account can be restored to
    (ISO-8601 format).
  signature: 'oldestRestorableTime: str'
- uid: azure.mgmt.cosmosdb.types.RestorableDatabaseAccountProperties.restorableLocations
  name: restorableLocations
  summary: List of regions where the of the database account can be restored from.
