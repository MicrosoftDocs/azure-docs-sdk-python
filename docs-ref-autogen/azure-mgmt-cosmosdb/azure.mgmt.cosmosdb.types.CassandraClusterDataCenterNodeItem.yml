### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem
name: CassandraClusterDataCenterNodeItem
fullName: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem
module: azure.mgmt.cosmosdb.types
summary: CassandraClusterDataCenterNodeItem.
constructor:
  syntax: CassandraClusterDataCenterNodeItem()
variables:
- description: The node's IP address.
  name: address
  types:
  - <xref:str>
- description: 'The state of the node in Cassandra ring. Known values are: "Normal",
    "Leaving",

    "Joining", "Moving", and "Stopped".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NodeState">]
- name: status
  types:
  - <xref:str>
- description: Cassandra service status on this node.
  name: cassandra_process_status
  types:
  - <xref:str>
- description: 'The amount of file system data in the data directory (e.g., 47.66
    kB), excluding

    all content in the snapshots subdirectories. Because all SSTable data files are
    included, any

    data that is not cleaned up (such as TTL-expired cells or tombstones) is counted.'
  name: load
  types:
  - <xref:str>
- description: List of tokens this node covers.
  name: tokens
  types:
  - <xref:list>[<xref:str>]
- name: size
  types:
  - <xref:int>
- description: The network ID of the node.
  name: host_id
  types:
  - <xref:str>
- description: The rack this node is part of.
  name: rack
  types:
  - <xref:str>
- description: The timestamp when these statistics were captured.
  name: timestamp
  types:
  - <xref:str>
- description: The amount of disk used, in kB, of the directory /var/lib/cassandra.
  name: disk_used_kb
  types:
  - <xref:int>
- description: The amount of disk free, in kB, of the directory /var/lib/cassandra.
  name: disk_free_kb
  types:
  - <xref:int>
- description: Used memory (calculated as total - free - buffers - cache), in kB.
  name: memory_used_kb
  types:
  - <xref:int>
- description: 'Memory used by kernel buffers (Buffers in /proc/meminfo)

    and page cache and slabs (Cached and SReclaimable in /proc/meminfo), in kB.'
  name: memory_buffers_and_cached_kb
  types:
  - <xref:int>
- description: Unused memory (MemFree and SwapFree in /proc/meminfo), in kB.
  name: memory_free_kb
  types:
  - <xref:int>
- description: Total installed memory (MemTotal and SwapTotal in /proc/meminfo), in
    kB.
  name: memory_total_kb
  types:
  - <xref:int>
- description: A float representing the current system-wide CPU utilization as a percentage.
  name: cpu_usage
  types:
  - <xref:float>
- description: If node has been updated to latest model.
  name: is_latest_model
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.address
  name: address
  summary: The node's IP address.
  signature: 'address: str'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.cassandraProcessStatus
  name: cassandraProcessStatus
  summary: Cassandra service status on this node.
  signature: 'cassandraProcessStatus: str'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.cpuUsage
  name: cpuUsage
  summary: A float representing the current system-wide CPU utilization as a percentage.
  signature: 'cpuUsage: float'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.diskFreeKB
  name: diskFreeKB
  summary: The amount of disk free, in kB, of the directory /var/lib/cassandra.
  signature: 'diskFreeKB: int'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.diskUsedKB
  name: diskUsedKB
  summary: The amount of disk used, in kB, of the directory /var/lib/cassandra.
  signature: 'diskUsedKB: int'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.hostID
  name: hostID
  summary: The network ID of the node.
  signature: 'hostID: str'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.isLatestModel
  name: isLatestModel
  summary: If node has been updated to latest model.
  signature: 'isLatestModel: bool'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.load
  name: load
  summary: 'The amount of file system data in the data directory (e.g., 47.66 kB),
    excluding all content in

    the snapshots subdirectories. Because all SSTable data files are included, any
    data that is not

    cleaned up (such as TTL-expired cells or tombstones) is counted.'
  signature: 'load: str'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.memoryBuffersAndCachedKB
  name: memoryBuffersAndCachedKB
  summary: 'Memory used by kernel buffers (Buffers in /proc/meminfo) and page cache
    and slabs (Cached and

    SReclaimable in /proc/meminfo), in kB.'
  signature: 'memoryBuffersAndCachedKB: int'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.memoryFreeKB
  name: memoryFreeKB
  summary: Unused memory (MemFree and SwapFree in /proc/meminfo), in kB.
  signature: 'memoryFreeKB: int'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.memoryTotalKB
  name: memoryTotalKB
  summary: Total installed memory (MemTotal and SwapTotal in /proc/meminfo), in kB.
  signature: 'memoryTotalKB: int'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.memoryUsedKB
  name: memoryUsedKB
  summary: Used memory (calculated as total - free - buffers - cache), in kB.
  signature: 'memoryUsedKB: int'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.rack
  name: rack
  summary: The rack this node is part of.
  signature: 'rack: str'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.state
  name: state
  summary: '"Normal", "Leaving",

    "Joining", "Moving", and "Stopped".'
  signature: 'state: str | NodeState'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.timestamp
  name: timestamp
  summary: The timestamp when these statistics were captured.
  signature: 'timestamp: str'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.tokens
  name: tokens
  summary: List of tokens this node covers.
  signature: 'tokens: list[str]'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.size
  name: size
  signature: 'size: int'
- uid: azure.mgmt.cosmosdb.types.CassandraClusterDataCenterNodeItem.status
  name: status
  signature: 'status: str'
