### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.Location
name: Location
fullName: azure.mgmt.cosmosdb.types.Location
module: azure.mgmt.cosmosdb.types
summary: A region in which the Azure Cosmos DB database account is deployed.
constructor:
  syntax: Location()
variables:
- description: 'The unique identifier of the region within the database account. Example:

    &lt;accountName&gt;-&lt;locationName&gt;.'
  name: id
  types:
  - <xref:str>
- description: The name of the region.
  name: location_name
  types:
  - <xref:str>
- description: 'The connection endpoint for the specific region. Example:

    [https://&lt;accountName&gt;-&lt;locationName&gt;.documents.azure.com:443/](https://&lt;accountName&gt;-&lt;locationName&gt;.documents.azure.com:443/).'
  name: document_endpoint
  types:
  - <xref:str>
- description: The provisioning state of the resource.
  name: provisioning_state
  types:
  - <xref:str>
- description: 'The failover priority of the region. A failover priority of 0

    indicates a write region. The maximum value for a failover priority = (total number
    of regions

    - 1). Failover priority values must be unique for each of the regions in which
    the database

    account exists.'
  name: failover_priority
  types:
  - <xref:int>
- description: 'Flag to indicate whether or not this region is an AvailabilityZone

    region.'
  name: is_zone_redundant
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.cosmosdb.types.Location.documentEndpoint
  name: documentEndpoint
  summary: 'The connection endpoint for the specific region. Example:

    [https://&lt;accountName&gt;-&lt;locationName&gt;.documents.azure.com:443/](https://&lt;accountName&gt;-&lt;locationName&gt;.documents.azure.com:443/).'
  signature: 'documentEndpoint: str'
- uid: azure.mgmt.cosmosdb.types.Location.failoverPriority
  name: failoverPriority
  summary: 'The failover priority of the region. A failover priority of 0 indicates
    a write region. The

    maximum value for a failover priority = (total number of regions - 1). Failover
    priority values

    must be unique for each of the regions in which the database account exists.'
  signature: 'failoverPriority: int'
- uid: azure.mgmt.cosmosdb.types.Location.id
  name: id
  summary: 'The unique identifier of the region within the database account. Example:

    &lt;accountName&gt;-&lt;locationName&gt;.'
  signature: 'id: str'
- uid: azure.mgmt.cosmosdb.types.Location.isZoneRedundant
  name: isZoneRedundant
  summary: Flag to indicate whether or not this region is an AvailabilityZone region.
  signature: 'isZoneRedundant: bool'
- uid: azure.mgmt.cosmosdb.types.Location.locationName
  name: locationName
  summary: The name of the region.
  signature: 'locationName: str'
- uid: azure.mgmt.cosmosdb.types.Location.provisioningState
  name: provisioningState
  summary: The provisioning state of the resource.
  signature: 'provisioningState: str'
