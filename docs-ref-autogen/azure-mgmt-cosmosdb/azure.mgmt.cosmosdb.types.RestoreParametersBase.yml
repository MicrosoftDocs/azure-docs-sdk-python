### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.RestoreParametersBase
name: RestoreParametersBase
fullName: azure.mgmt.cosmosdb.types.RestoreParametersBase
module: azure.mgmt.cosmosdb.types
summary: Parameters to indicate the information about the restore.
constructor:
  syntax: RestoreParametersBase()
variables:
- description: 'The id of the restorable database account from which the restore has
    to

    be initiated. For example:

    /subscriptions/{subscriptionId}/providers/Microsoft.DocumentDB/locations/{location}/restorableDatabaseAccounts/{restorableDatabaseAccountName}.'
  name: restore_source
  types:
  - <xref:str>
- description: Time to which the account has to be restored (ISO-8601 format).
  name: restore_timestamp_in_utc
  types:
  - <xref:str>
- description: 'Specifies whether the restored account will have Time-To-Live

    disabled upon the successful restore.'
  name: restore_with_ttl_disabled
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.cosmosdb.types.RestoreParametersBase.restoreSource
  name: restoreSource
  summary: 'The id of the restorable database account from which the restore has to
    be initiated. For

    example:

    /subscriptions/{subscriptionId}/providers/Microsoft.DocumentDB/locations/{location}/restorableDatabaseAccounts/{restorableDatabaseAccountName}.'
  signature: 'restoreSource: str'
- uid: azure.mgmt.cosmosdb.types.RestoreParametersBase.restoreTimestampInUtc
  name: restoreTimestampInUtc
  summary: Time to which the account has to be restored (ISO-8601 format).
  signature: 'restoreTimestampInUtc: str'
- uid: azure.mgmt.cosmosdb.types.RestoreParametersBase.restoreWithTtlDisabled
  name: restoreWithTtlDisabled
  summary: 'Specifies whether the restored account will have Time-To-Live disabled
    upon the successful

    restore.'
  signature: 'restoreWithTtlDisabled: bool'
