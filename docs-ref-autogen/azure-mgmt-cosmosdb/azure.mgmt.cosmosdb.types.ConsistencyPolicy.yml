### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.ConsistencyPolicy
name: ConsistencyPolicy
fullName: azure.mgmt.cosmosdb.types.ConsistencyPolicy
module: azure.mgmt.cosmosdb.types
summary: The consistency policy for the Cosmos DB database account.
constructor:
  syntax: ConsistencyPolicy()
variables:
- description: 'The default consistency level and configuration settings of

    the Cosmos DB account. Required. Known values are: "Eventual", "Session", "BoundedStaleness",

    "Strong", and "ConsistentPrefix".'
  name: default_consistency_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DefaultConsistencyLevel">]
- description: "When used with the Bounded Staleness consistency level, this value\n\
    represents the number of stale requests tolerated. Accepted range for this value\
    \ is 1 \u2013\n2,147,483,647. Required when defaultConsistencyPolicy is set to\
    \ 'BoundedStaleness'."
  name: max_staleness_prefix
  types:
  - <xref:int>
- description: 'When used with the Bounded Staleness consistency level, this

    value represents the time amount of staleness (in seconds) tolerated. Accepted
    range for this

    value is 5 - 86400. Required when defaultConsistencyPolicy is set to ''BoundedStaleness''.'
  name: max_interval_in_seconds
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.cosmosdb.types.ConsistencyPolicy.defaultConsistencyLevel
  name: defaultConsistencyLevel
  summary: 'The default consistency level and configuration settings of the Cosmos
    DB account. Required.

    Known values are: "Eventual", "Session", "BoundedStaleness", "Strong", and

    "ConsistentPrefix".'
  signature: 'defaultConsistencyLevel: Required[str | DefaultConsistencyLevel]'
- uid: azure.mgmt.cosmosdb.types.ConsistencyPolicy.maxIntervalInSeconds
  name: maxIntervalInSeconds
  summary: 'When used with the Bounded Staleness consistency level, this value represents
    the time amount

    of staleness (in seconds) tolerated. Accepted range for this value is 5 - 86400.
    Required when

    defaultConsistencyPolicy is set to ''BoundedStaleness''.'
  signature: 'maxIntervalInSeconds: int'
- uid: azure.mgmt.cosmosdb.types.ConsistencyPolicy.maxStalenessPrefix
  name: maxStalenessPrefix
  summary: "When used with the Bounded Staleness consistency level, this value represents\
    \ the number of\nstale requests tolerated. Accepted range for this value is 1\
    \ \u2013 2,147,483,647. Required when\ndefaultConsistencyPolicy is set to 'BoundedStaleness'."
  signature: 'maxStalenessPrefix: int'
