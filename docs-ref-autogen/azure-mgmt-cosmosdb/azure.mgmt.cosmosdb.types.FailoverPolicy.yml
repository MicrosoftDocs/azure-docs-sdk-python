### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.FailoverPolicy
name: FailoverPolicy
fullName: azure.mgmt.cosmosdb.types.FailoverPolicy
module: azure.mgmt.cosmosdb.types
summary: The failover policy for a given region of a database account.
constructor:
  syntax: FailoverPolicy()
variables:
- description: 'The unique identifier of the region in which the database account
    replicates to.

    Example: &lt;accountName&gt;-&lt;locationName&gt;.'
  name: id
  types:
  - <xref:str>
- description: The name of the region in which the database account exists.
  name: location_name
  types:
  - <xref:str>
- description: 'The failover priority of the region. A failover priority of 0

    indicates a write region. The maximum value for a failover priority = (total number
    of regions

    - 1). Failover priority values must be unique for each of the regions in which
    the database

    account exists.'
  name: failover_priority
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.cosmosdb.types.FailoverPolicy.failoverPriority
  name: failoverPriority
  summary: 'The failover priority of the region. A failover priority of 0 indicates
    a write region. The

    maximum value for a failover priority = (total number of regions - 1). Failover
    priority values

    must be unique for each of the regions in which the database account exists.'
  signature: 'failoverPriority: int'
- uid: azure.mgmt.cosmosdb.types.FailoverPolicy.id
  name: id
  summary: 'The unique identifier of the region in which the database account replicates
    to. Example:

    &lt;accountName&gt;-&lt;locationName&gt;.'
  signature: 'id: str'
- uid: azure.mgmt.cosmosdb.types.FailoverPolicy.locationName
  name: locationName
  summary: The name of the region in which the database account exists.
  signature: 'locationName: str'
