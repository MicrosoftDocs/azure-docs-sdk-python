### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.RestoreParameters
name: RestoreParameters
fullName: azure.mgmt.cosmosdb.types.RestoreParameters
module: azure.mgmt.cosmosdb.types
summary: Parameters to indicate the information about the restore.
constructor:
  syntax: RestoreParameters()
variables:
- description: 'Specifies whether the restored account will have Time-To-Live

    disabled upon the successful restore.'
  name: restore_with_ttl_disabled
  types:
  - <xref:bool>
- description: Describes the mode of the restore. "PointInTime"
  name: restore_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RestoreMode">]
- description: 'The id of the restorable database account from which the restore has
    to

    be initiated. For example:

    /subscriptions/{subscriptionId}/providers/Microsoft.DocumentDB/locations/{location}/restorableDatabaseAccounts/{restorableDatabaseAccountName}.'
  name: restore_source
  types:
  - <xref:str>
- description: Time to which the account has to be restored (ISO-8601 format).
  name: restore_timestamp_in_utc
  types:
  - <xref:str>
- description: List of specific databases available for restore.
  name: databases_to_restore
  types:
  - <xref:list>[<xref:"DatabaseRestoreResource">]
- description: List of specific gremlin databases available for restore.
  name: gremlin_databases_to_restore
  types:
  - <xref:list>[<xref:"GremlinDatabaseRestoreResource">]
- description: List of specific tables available for restore.
  name: tables_to_restore
  types:
  - <xref:list>[<xref:str>]
- description: The source backup location for restore.
  name: source_backup_location
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cosmosdb.types.RestoreParameters.databasesToRestore
  name: databasesToRestore
  summary: List of specific databases available for restore.
  signature: 'databasesToRestore: list[''DatabaseRestoreResource'']'
- uid: azure.mgmt.cosmosdb.types.RestoreParameters.gremlinDatabasesToRestore
  name: gremlinDatabasesToRestore
  summary: List of specific gremlin databases available for restore.
  signature: 'gremlinDatabasesToRestore: list[''GremlinDatabaseRestoreResource'']'
- uid: azure.mgmt.cosmosdb.types.RestoreParameters.restoreMode
  name: restoreMode
  summary: Describes the mode of the restore. "PointInTime"
  signature: 'restoreMode: str | RestoreMode'
- uid: azure.mgmt.cosmosdb.types.RestoreParameters.sourceBackupLocation
  name: sourceBackupLocation
  summary: The source backup location for restore.
  signature: 'sourceBackupLocation: str'
- uid: azure.mgmt.cosmosdb.types.RestoreParameters.tablesToRestore
  name: tablesToRestore
  summary: List of specific tables available for restore.
  signature: 'tablesToRestore: list[str]'
- uid: azure.mgmt.cosmosdb.types.RestoreParameters.restoreSource
  name: restoreSource
  signature: 'restoreSource: str'
- uid: azure.mgmt.cosmosdb.types.RestoreParameters.restoreTimestampInUtc
  name: restoreTimestampInUtc
  signature: 'restoreTimestampInUtc: str'
- uid: azure.mgmt.cosmosdb.types.RestoreParameters.restoreWithTtlDisabled
  name: restoreWithTtlDisabled
  signature: 'restoreWithTtlDisabled: bool'
