    that can be validated from one or more of the public certificates in this property.'
  signature: 'clientCertificates: list[''Certificate'']'
- uid: azure.mgmt.cosmosdb.types.ClusterResourceProperties.clusterNameOverride
  name: clusterNameOverride
  summary: 'If you need to set the clusterName property in cassandra.yaml to something
