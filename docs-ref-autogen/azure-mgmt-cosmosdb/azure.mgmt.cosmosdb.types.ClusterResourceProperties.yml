    unless you are running a hybrid cluster where you are already doing your own repairs.'
  signature: 'repairEnabled: bool'
- uid: azure.mgmt.cosmosdb.types.ClusterResourceProperties.restoreFromBackupId
  name: restoreFromBackupId
  summary: 'To create an empty cluster, omit this field or set it to null. To restore
