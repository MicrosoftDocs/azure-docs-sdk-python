  signature: 'gossipCertificates: list[''Certificate'']'
- uid: azure.mgmt.cosmosdb.types.ClusterResourceProperties.hoursBetweenBackups
  name: hoursBetweenBackups
  summary: (Deprecated) Number of hours to wait between taking a backup of the cluster.
  signature: 'hoursBetweenBackups: int'
- uid: azure.mgmt.cosmosdb.types.ClusterResourceProperties.initialCassandraAdminPassword
  name: initialCassandraAdminPassword
  summary: 'Initial password for clients connecting as admin to the cluster. Should
