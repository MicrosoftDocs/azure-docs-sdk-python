    interface attached to. The subnet must be routable to all subnets that will be
    delegated to

    data centers. The resource id must be of the form ''/subscriptions/<subscription

    id>/resourceGroups/<resource group>/providers/Microsoft.Network/virtualNetworks/<virtual

    network>/subnets/<subnet>''.'
  signature: 'delegatedManagementSubnetId: str'
- uid: azure.mgmt.cosmosdb.types.ClusterResourceProperties.extensions
  name: extensions
  summary: Extensions to be added or updated on cluster.
  signature: 'extensions: list[str]'
- uid: azure.mgmt.cosmosdb.types.ClusterResourceProperties.externalDataCenters
  name: externalDataCenters
  summary: 'List of the data center names for unmanaged data centers in this cluster
    to be included in

    auto-replication.'
  signature: 'externalDataCenters: list[str]'
- uid: azure.mgmt.cosmosdb.types.ClusterResourceProperties.externalGossipCertificates
  name: externalGossipCertificates
  summary: 'List of TLS certificates used to authorize gossip from unmanaged data
    centers. The TLS

    certificates of all nodes in unmanaged data centers must be verifiable using one
    of the

    certificates provided in this property.'
  signature: 'externalGossipCertificates: list[''Certificate'']'
- uid: azure.mgmt.cosmosdb.types.ClusterResourceProperties.externalSeedNodes
  name: externalSeedNodes
  summary: 'List of IP addresses of seed nodes in unmanaged data centers. These will
