    "Creating", "Updating", "Deleting", "Succeeded", "Failed", and "Canceled".'
  signature: 'provisioningState: str | ManagedCassandraProvisioningState'
- uid: azure.mgmt.cosmosdb.types.ClusterResourceProperties.repairEnabled
  name: repairEnabled
  summary: 'Should automatic repairs run on this cluster? If omitted, this is true,
