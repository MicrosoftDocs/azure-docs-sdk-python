    name of the cluster, set the value to use on this property.'
  signature: 'clusterNameOverride: str'
- uid: azure.mgmt.cosmosdb.types.ClusterResourceProperties.deallocated
  name: deallocated
  summary: Whether the cluster and associated data centers has been deallocated.
  signature: 'deallocated: bool'
- uid: azure.mgmt.cosmosdb.types.ClusterResourceProperties.delegatedManagementSubnetId
  name: delegatedManagementSubnetId
  summary: 'Resource id of a subnet that this cluster''s management service should
