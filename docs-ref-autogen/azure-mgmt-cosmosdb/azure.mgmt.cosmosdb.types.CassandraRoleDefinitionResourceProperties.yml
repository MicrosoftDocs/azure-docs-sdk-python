### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.CassandraRoleDefinitionResourceProperties
name: CassandraRoleDefinitionResourceProperties
fullName: azure.mgmt.cosmosdb.types.CassandraRoleDefinitionResourceProperties
module: azure.mgmt.cosmosdb.types
summary: Azure Cosmos DB Cassandra Role Definition resource object.
constructor:
  syntax: CassandraRoleDefinitionResourceProperties()
variables:
- description: The path id for the Role Definition.
  name: id
  types:
  - <xref:str>
- description: 'A user-friendly name for the Role Definition. Must be unique for the
    database

    account.'
  name: role_name
  types:
  - <xref:str>
- description: 'Indicates whether the Role Definition was built-in or user created.
    Known values

    are: "BuiltInRole" and "CustomRole".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RoleDefinitionType">]
- description: 'A set of fully qualified Scopes at or below which Cassandra Role

    Assignments may be created using this Role Definition. This will allow application
    of this Role

    Definition on the entire database account or any underlying Database / Collection.
    Must have at

    least one element. Scopes higher than Database account are not enforceable as
    assignable

    Scopes. Note that resources referenced in assignable Scopes need not exist.'
  name: assignable_scopes
  types:
  - <xref:list>[<xref:str>]
- description: The set of operations allowed through this Role Definition.
  name: permissions
  types:
  - <xref:list>[<xref:"Permission">]
