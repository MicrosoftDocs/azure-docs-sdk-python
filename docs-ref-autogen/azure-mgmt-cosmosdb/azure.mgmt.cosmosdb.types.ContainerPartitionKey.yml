### YamlMime:PythonClass
uid: azure.mgmt.cosmosdb.types.ContainerPartitionKey
name: ContainerPartitionKey
fullName: azure.mgmt.cosmosdb.types.ContainerPartitionKey
module: azure.mgmt.cosmosdb.types
summary: 'The configuration of the partition key to be used for partitioning data
  into multiple

  partitions.'
constructor:
  syntax: ContainerPartitionKey()
variables:
- description: List of paths using which data within the container can be partitioned.
  name: paths
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates the kind of algorithm used for partitioning. For MultiHash,
    multiple

    partition keys (upto three maximum) are supported for container create. Known
    values are:

    "Hash", "Range", and "MultiHash".'
  name: kind
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PartitionKind">]
- description: Indicates the version of the partition key definition.
  name: version
  types:
  - <xref:int>
- description: Indicates if the container is using a system generated partition key.
  name: system_key
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.cosmosdb.types.ContainerPartitionKey.kind
  name: kind
  summary: 'Indicates the kind of algorithm used for partitioning. For MultiHash,
    multiple partition keys

    (upto three maximum) are supported for container create. Known values are: "Hash",
    "Range",

    and "MultiHash".'
  signature: 'kind: str | PartitionKind'
- uid: azure.mgmt.cosmosdb.types.ContainerPartitionKey.paths
  name: paths
  summary: List of paths using which data within the container can be partitioned.
  signature: 'paths: list[str]'
- uid: azure.mgmt.cosmosdb.types.ContainerPartitionKey.systemKey
  name: systemKey
  summary: Indicates if the container is using a system generated partition key.
  signature: 'systemKey: bool'
- uid: azure.mgmt.cosmosdb.types.ContainerPartitionKey.version
  name: version
  summary: Indicates the version of the partition key definition.
  signature: 'version: int'
