name: DeviceUpdateClient
fullName: azure.iot.deviceupdate.aio.DeviceUpdateClient
module: azure.iot.deviceupdate.aio
summary: 'Async client for the Azure Device Update for IoT Hub service.


  Device Update enables customers to publish updates to the cloud and deploy them
  to groups of

  IoT devices managed and provisioned in IoT Hub.


  This override preserves the constructor parameter order shipped in 1.0.0

  (`endpoint`, `instance_id`, `credential`). The TypeSpec-generated client

  orders the hoisted `instance_id` after `credential`; restoring the original

  order here avoids a breaking change for existing callers.'
