- uid: azure.iot.deviceupdate.operations.DeviceManagementOperations.delete_device_class
  name: delete_device_class
  summary: 'Deletes a device class. Device classes are created automatically when
    Device Update-enabled

    devices are connected to the hub but are not automatically cleaned up since they
    are referenced

    by DeviceClassSubgroups. If the user has deleted all DeviceClassSubgroups for
    a device class

    they can also delete the device class to remove the records from the system and
    to stop

    checking the compatibility of this device class with new updates. If a device
    is ever

    reconnected for this device class it will be re-created.'
  signature: 'delete_device_class(device_class_id: str, **kwargs: Any) -> None'
  parameters:
  - name: device_class_id
    description: Device class identifier. Required.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: None
    types:
    - <xref:None>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
- uid: azure.iot.deviceupdate.operations.DeviceManagementOperations.delete_device_class_subgroup
  name: delete_device_class_subgroup
  summary: 'Deletes a device class subgroup. This subgroup is automatically created
    when a Device

    Update-enabled device is connected to the hub and reports its properties. Groups,
    subgroups,

    and deployments are not automatically cleaned up but are retained for history
    purposes. Users

    can call this method to delete a subgroup if they do not need to retain any of
    the history of

    the subgroup and no longer need it. If a device is ever connected again for this
    subgroup after

    the subgroup was deleted it will be automatically re-created but there will be
    no history.'
  signature: 'delete_device_class_subgroup(group_id: str, device_class_id: str, **kwargs:
    Any) -> None'
  parameters:
  - name: group_id
    description: Group identifier. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: device_class_id
    description: Device class identifier. Required.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: None
    types:
    - <xref:None>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
- uid: azure.iot.deviceupdate.operations.DeviceManagementOperations.delete_group
  name: delete_group
  summary: 'Deletes a device group. This group is automatically created when a Device
    Update-enabled device

    is connected to the hub and reports its properties. Groups, subgroups, and deployments
    are not

    automatically cleaned up but are retained for history purposes. Users can call
    this method to

    delete a group if they do not need to retain any of the history of the group and
    no longer need

    it. If a device is ever connected again for this group after the group was deleted
    it will be

    automatically re-created but there will be no history.'
  signature: 'delete_group(group_id: str, **kwargs: Any) -> None'
  parameters:
  - name: group_id
    description: Group identifier. Required.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: None
    types:
    - <xref:None>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
