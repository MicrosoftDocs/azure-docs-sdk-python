name: AuthorizationConfig
fullName: azure.mgmt.iotoperations.types.AuthorizationConfig
module: azure.mgmt.iotoperations.types
summary: Broker AuthorizationConfig properties.
constructor:
  syntax: AuthorizationConfig()
variables:
- description: 'Enable caching of the authorization rules. Known values are: "Enabled"
    and

    "Disabled".'
  name: cache
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperationalMode">]
