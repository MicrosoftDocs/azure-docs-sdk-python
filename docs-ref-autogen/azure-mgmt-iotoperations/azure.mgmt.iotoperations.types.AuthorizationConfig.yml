    Resource

    is used that would mean DenyAll.'
  name: rules
  types:
  - <xref:list>[<xref:"AuthorizationRule">]
attributes:
- uid: azure.mgmt.iotoperations.types.AuthorizationConfig.cache
  name: cache
  summary: '"Enabled" and "Disabled".'
  signature: 'cache: str | OperationalMode'
- uid: azure.mgmt.iotoperations.types.AuthorizationConfig.rules
  name: rules
  summary: 'The authorization rules to follow. If no rule is set, but Authorization
    Resource is used that

    would mean DenyAll.'
  signature: 'rules: list[''AuthorizationRule'']'
