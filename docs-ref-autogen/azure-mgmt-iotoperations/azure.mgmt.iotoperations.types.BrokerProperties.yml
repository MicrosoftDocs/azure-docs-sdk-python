### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.BrokerProperties
name: BrokerProperties
fullName: azure.mgmt.iotoperations.types.BrokerProperties
module: azure.mgmt.iotoperations.types
summary: Broker Resource properties.
constructor:
  syntax: BrokerProperties()
variables:
- description: Advanced settings of Broker.
  name: advanced
  types:
  - <xref:<xref:"AdvancedSettings">>
- description: The cardinality details of the broker.
  name: cardinality
  types:
  - <xref:<xref:"Cardinality">>
- description: Spec defines the desired identities of Broker diagnostics settings.
  name: diagnostics
  types:
  - <xref:<xref:"BrokerDiagnostics">>
- description: Settings of Disk Backed Message Buffer.
  name: disk_backed_message_buffer
  types:
  - <xref:<xref:"DiskBackedMessageBuffer">>
- description: 'This setting controls whether Kubernetes CPU resource limits

    are requested. Increasing the number of replicas or workers proportionally increases
    the amount

    of CPU resources requested. If this setting is enabled and there are insufficient
    CPU

    resources, an error will be emitted.'
  name: generate_resource_limits
  types:
  - <xref:<xref:"GenerateResourceLimits">>
- description: "Handling of high-priority messages in the\nevent that regular-priority\
    \ messages are being backpressured.\n\n   When set to \"Accept\", the broker continues\
    \ to accept high-priority messages even while\n\nregular-priority messages are\
    \ rejected due to backpressure.\n\n   When set to \"Reject\", backpressure also\
    \ affects high-priority messages.\n\n   Defaults to \"Accept\". Known values are:\
    \ \"Accept\" and \"Reject\"."
  name: high_priority_messages_backpressure_handling
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HighPriorityMessagesBackpressureHandling">]
- description: 'Memory profile of Broker. Known values are: "Tiny", "Low", "Medium",
    and

    "High".'
  name: memory_profile
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BrokerMemoryProfile">]
- description: The persistence settings of the Broker.
  name: persistence
  types:
  - <xref:<xref:"BrokerPersistence">>
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Provisioning", "Updating", "Deleting", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The status for the broker.
  name: status
  types:
  - <xref:<xref:"BrokerStatus">>
- description: 'The health state of the resource. Known values are: "Available",

    "Degraded", "Unavailable", and "Unknown".'
  name: health_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceHealthState">]
attributes:
- uid: azure.mgmt.iotoperations.types.BrokerProperties.advanced
  name: advanced
  summary: Advanced settings of Broker.
  signature: 'advanced: AdvancedSettings'
- uid: azure.mgmt.iotoperations.types.BrokerProperties.cardinality
  name: cardinality
  summary: The cardinality details of the broker.
  signature: 'cardinality: Cardinality'
- uid: azure.mgmt.iotoperations.types.BrokerProperties.diagnostics
  name: diagnostics
  summary: Spec defines the desired identities of Broker diagnostics settings.
  signature: 'diagnostics: BrokerDiagnostics'
- uid: azure.mgmt.iotoperations.types.BrokerProperties.diskBackedMessageBuffer
  name: diskBackedMessageBuffer
  summary: Settings of Disk Backed Message Buffer.
  signature: 'diskBackedMessageBuffer: DiskBackedMessageBuffer'
- uid: azure.mgmt.iotoperations.types.BrokerProperties.generateResourceLimits
  name: generateResourceLimits
  summary: 'This setting controls whether Kubernetes CPU resource limits are requested.
    Increasing the

    number of replicas or workers proportionally increases the amount of CPU resources
    requested.

    If this setting is enabled and there are insufficient CPU resources, an error
    will be emitted.'
  signature: 'generateResourceLimits: GenerateResourceLimits'
- uid: azure.mgmt.iotoperations.types.BrokerProperties.healthState
  name: healthState
  summary: '"Available", "Degraded",

    "Unavailable", and "Unknown".'
  signature: 'healthState: str | ResourceHealthState'
- uid: azure.mgmt.iotoperations.types.BrokerProperties.highPriorityMessagesBackpressureHandling
  name: highPriorityMessagesBackpressureHandling
  summary: "Handling of high-priority messages in the event that regular-priority\
    \ messages are being\nbackpressured.\n\n   When set to \"Accept\", the broker\
    \ continues to accept high-priority messages even while\n\nregular-priority messages\
    \ are rejected due to backpressure.\n\n   When set to \"Reject\", backpressure\
    \ also affects high-priority messages.\n\n   Defaults to \"Accept\". Known values\
    \ are: \"Accept\" and \"Reject\"."
  signature: 'highPriorityMessagesBackpressureHandling: str | HighPriorityMessagesBackpressureHandling'
- uid: azure.mgmt.iotoperations.types.BrokerProperties.memoryProfile
  name: memoryProfile
  summary: '"Tiny", "Low", "Medium", and "High".'
  signature: 'memoryProfile: str | BrokerMemoryProfile'
- uid: azure.mgmt.iotoperations.types.BrokerProperties.persistence
  name: persistence
  summary: The persistence settings of the Broker.
  signature: 'persistence: BrokerPersistence'
- uid: azure.mgmt.iotoperations.types.BrokerProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Provisioning", "Updating", "Deleting", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.iotoperations.types.BrokerProperties.status
  name: status
  summary: The status for the broker.
  signature: 'status: BrokerStatus'
