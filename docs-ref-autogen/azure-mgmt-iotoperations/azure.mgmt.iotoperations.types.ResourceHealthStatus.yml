### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.ResourceHealthStatus
name: ResourceHealthStatus
fullName: azure.mgmt.iotoperations.types.ResourceHealthStatus
module: azure.mgmt.iotoperations.types
summary: Represents the health state of a resource.
constructor:
  syntax: ResourceHealthStatus()
variables:
- description: 'The high-level health status of the resource. Known values are: "Available",

    "Degraded", "Unavailable", and "Unknown".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceHealthState">]
- description: The timestamp (RFC3339) when the health status last changed.
  name: last_transition_time
  types:
  - <xref:str>
- description: 'The timestamp (RFC3339) when the health status was last updated, even

    if the status did not change.'
  name: last_update_time
  types:
  - <xref:str>
- description: A human-readable message describing the last transition.
  name: message
  types:
  - <xref:str>
- description: 'Unique, CamelCase reason code describing the cause of the last health
    state

    transition.'
  name: reason_code
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.iotoperations.types.ResourceHealthStatus.lastTransitionTime
  name: lastTransitionTime
  summary: The timestamp (RFC3339) when the health status last changed.
  signature: 'lastTransitionTime: str'
- uid: azure.mgmt.iotoperations.types.ResourceHealthStatus.lastUpdateTime
  name: lastUpdateTime
  summary: 'The timestamp (RFC3339) when the health status was last updated, even
    if the status did not

    change.'
  signature: 'lastUpdateTime: str'
- uid: azure.mgmt.iotoperations.types.ResourceHealthStatus.message
  name: message
  summary: A human-readable message describing the last transition.
  signature: 'message: str'
- uid: azure.mgmt.iotoperations.types.ResourceHealthStatus.reasonCode
  name: reasonCode
  summary: Unique, CamelCase reason code describing the cause of the last health state
    transition.
  signature: 'reasonCode: str'
- uid: azure.mgmt.iotoperations.types.ResourceHealthStatus.status
  name: status
  summary: '"Available", "Degraded",

    "Unavailable", and "Unknown".'
  signature: 'status: str | ResourceHealthState'
