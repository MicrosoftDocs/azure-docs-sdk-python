### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.BrokerListenerProperties
name: BrokerListenerProperties
fullName: azure.mgmt.iotoperations.types.BrokerListenerProperties
module: azure.mgmt.iotoperations.types
summary: 'Defines a Broker listener. A listener is a collection of ports on which
  the broker accepts

  connections from clients.'
constructor:
  syntax: BrokerListenerProperties()
variables:
- description: Kubernetes Service name of this listener.
  name: service_name
  types:
  - <xref:str>
- description: Ports on which this listener accepts client connections. Required.
  name: ports
  types:
  - <xref:list>[<xref:"ListenerPort">]
- description: 'Kubernetes Service type of this listener. Known values are: "ClusterIp",

    "LoadBalancer", and "NodePort".'
  name: service_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServiceType">]
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Provisioning", "Updating", "Deleting", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The health state of the resource. Known values are: "Available",

    "Degraded", "Unavailable", and "Unknown".'
  name: health_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceHealthState">]
attributes:
- uid: azure.mgmt.iotoperations.types.BrokerListenerProperties.healthState
  name: healthState
  summary: '"Available", "Degraded",

    "Unavailable", and "Unknown".'
  signature: 'healthState: str | ResourceHealthState'
- uid: azure.mgmt.iotoperations.types.BrokerListenerProperties.ports
  name: ports
  summary: Ports on which this listener accepts client connections. Required.
  signature: 'ports: Required[list[''ListenerPort'']]'
- uid: azure.mgmt.iotoperations.types.BrokerListenerProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Provisioning", "Updating", "Deleting", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.iotoperations.types.BrokerListenerProperties.serviceName
  name: serviceName
  summary: Kubernetes Service name of this listener.
  signature: 'serviceName: str'
- uid: azure.mgmt.iotoperations.types.BrokerListenerProperties.serviceType
  name: serviceType
  summary: '"ClusterIp", "LoadBalancer",

    and "NodePort".'
  signature: 'serviceType: str | ServiceType'
