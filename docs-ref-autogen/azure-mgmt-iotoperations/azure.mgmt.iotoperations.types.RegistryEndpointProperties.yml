uid: azure.mgmt.iotoperations.types.RegistryEndpointProperties
name: RegistryEndpointProperties
fullName: azure.mgmt.iotoperations.types.RegistryEndpointProperties
module: azure.mgmt.iotoperations.types
summary: RegistryEndpoint properties.
constructor:
  syntax: RegistryEndpointProperties()
variables:
- description: The Container Registry endpoint hostname. Required.
  name: host
  types:
  - <xref:str>
- description: The authentication settings for the Azure Container Registry. Required.
  name: authentication
  types:
  - <xref:<xref:"RegistryEndpointAuthentication">>
