    "Failed", "Canceled", "Provisioning", "Updating", "Deleting", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The health state of the resource. Known values are: "Available",

    "Degraded", "Unavailable", and "Unknown".'
  name: health_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceHealthState">]
- description: 'The signing certificate authorities used by artifacts in the registry

    endpoint.'
  name: code_signing_cas
  types:
  - <xref:list>[<xref:"RegistryEndpointTrustedSigningKey">]
attributes:
- uid: azure.mgmt.iotoperations.types.RegistryEndpointProperties.authentication
  name: authentication
  summary: The authentication settings for the Azure Container Registry. Required.
  signature: 'authentication: Required[RegistryEndpointAuthentication]'
- uid: azure.mgmt.iotoperations.types.RegistryEndpointProperties.codeSigningCas
  name: codeSigningCas
  summary: The signing certificate authorities used by artifacts in the registry endpoint.
  signature: 'codeSigningCas: list[''RegistryEndpointTrustedSigningKey'']'
- uid: azure.mgmt.iotoperations.types.RegistryEndpointProperties.healthState
  name: healthState
  summary: '"Available", "Degraded",

    "Unavailable", and "Unknown".'
  signature: 'healthState: str | ResourceHealthState'
- uid: azure.mgmt.iotoperations.types.RegistryEndpointProperties.host
  name: host
  summary: The Container Registry endpoint hostname. Required.
  signature: 'host: Required[str]'
- uid: azure.mgmt.iotoperations.types.RegistryEndpointProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Provisioning", "Updating", "Deleting", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
