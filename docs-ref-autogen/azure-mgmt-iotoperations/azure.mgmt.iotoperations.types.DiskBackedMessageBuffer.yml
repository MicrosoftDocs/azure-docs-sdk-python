### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.DiskBackedMessageBuffer
name: DiskBackedMessageBuffer
fullName: azure.mgmt.iotoperations.types.DiskBackedMessageBuffer
module: azure.mgmt.iotoperations.types
summary: DiskBackedMessageBuffer properties.
constructor:
  syntax: DiskBackedMessageBuffer()
variables:
- description: 'The max size of the message buffer on disk. If a PVC template is specified

    using one of ephemeralVolumeClaimSpec or persistentVolumeClaimSpec, then this
    size is used as

    the request and limit sizes of that template. If neither ephemeralVolumeClaimSpec
    nor

    persistentVolumeClaimSpec are specified, then an emptyDir volume is mounted with
    this size as

    its limit. See [https://kubernetes.io/docs/concepts/storage/volumes/#emptydir](https://kubernetes.io/docs/concepts/storage/volumes/#emptydir)
    for details. Required.'
  name: max_size
  types:
  - <xref:str>
- description: 'Use the specified persistent volume claim template to mount

    a "generic ephemeral volume" for the message buffer. See

    [https://kubernetes.io/docs/concepts/storage/ephemeral-volumes/#generic-ephemeral-volumes](https://kubernetes.io/docs/concepts/storage/ephemeral-volumes/#generic-ephemeral-volumes)

    for details.'
  name: ephemeral_volume_claim_spec
  types:
  - <xref:<xref:"VolumeClaimSpec">>
- description: 'Use the specified persistent volume claim template to mount

    a persistent volume for the message buffer.'
  name: persistent_volume_claim_spec
  types:
  - <xref:<xref:"VolumeClaimSpec">>
attributes:
- uid: azure.mgmt.iotoperations.types.DiskBackedMessageBuffer.ephemeralVolumeClaimSpec
  name: ephemeralVolumeClaimSpec
  summary: 'Use the specified persistent volume claim template to mount a "generic
    ephemeral volume" for

    the message buffer. See

    [https://kubernetes.io/docs/concepts/storage/ephemeral-volumes/#generic-ephemeral-volumes](https://kubernetes.io/docs/concepts/storage/ephemeral-volumes/#generic-ephemeral-volumes)

    for details.'
  signature: 'ephemeralVolumeClaimSpec: VolumeClaimSpec'
- uid: azure.mgmt.iotoperations.types.DiskBackedMessageBuffer.maxSize
  name: maxSize
  summary: 'The max size of the message buffer on disk. If a PVC template is specified
    using one of

    ephemeralVolumeClaimSpec or persistentVolumeClaimSpec, then this size is used
    as the request

    and limit sizes of that template. If neither ephemeralVolumeClaimSpec nor

    persistentVolumeClaimSpec are specified, then an emptyDir volume is mounted with
    this size as

    its limit. See [https://kubernetes.io/docs/concepts/storage/volumes/#emptydir](https://kubernetes.io/docs/concepts/storage/volumes/#emptydir)
    for details. Required.'
  signature: 'maxSize: str'
- uid: azure.mgmt.iotoperations.types.DiskBackedMessageBuffer.persistentVolumeClaimSpec
  name: persistentVolumeClaimSpec
  summary: 'Use the specified persistent volume claim template to mount a persistent
    volume for the message

    buffer.'
  signature: 'persistentVolumeClaimSpec: VolumeClaimSpec'
