uid: azure.mgmt.iotoperations.types.StateStoreResourceRule
name: StateStoreResourceRule
fullName: azure.mgmt.iotoperations.types.StateStoreResourceRule
module: azure.mgmt.iotoperations.types
summary: State Store Resource Rule properties.
constructor:
  syntax: StateStoreResourceRule()
variables:
- description: 'Allowed keyTypes pattern, string, binary. The key type used for matching,
    for

    example pattern tries to match the key to a glob-style pattern and string checks
    key is equal

    to value provided in keys. Required. Known values are: "Pattern", "String", and
    "Binary".'
  name: key_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StateStoreResourceKeyTypes">]
- description: 'Give access to state store keys for the corresponding principals defined.

    When key type is pattern set glob-style pattern (e.g., ''*'', ''clients/>>*<<'').
    Required.'
  name: keys_property
  types:
  - <xref:list>[<xref:str>]
- description: 'Give access for `Read`, `Write` and `ReadWrite` access level. Required.

    Known values are: "Read", "Write", and "ReadWrite".'
  name: method
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StateStoreResourceDefinitionMethods">]
attributes:
