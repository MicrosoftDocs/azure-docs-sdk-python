### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.CertManagerCertificateSpec
name: CertManagerCertificateSpec
fullName: azure.mgmt.iotoperations.types.CertManagerCertificateSpec
module: azure.mgmt.iotoperations.types
summary: Automatic TLS server certificate management with cert-manager.
constructor:
  syntax: CertManagerCertificateSpec()
variables:
- description: 'Lifetime of certificate. Must be specified using a Go time.Duration
    format

    (h|m|s). E.g. 240h for 240 hours and 45m for 45 minutes.'
  name: duration
  types:
  - <xref:str>
- description: 'Secret for storing server certificate. Any existing data will be

    overwritten. This is a reference to the secret through an identifying name, not
    the secret

    itself.'
  name: secret_name
  types:
  - <xref:str>
- description: 'When to begin renewing certificate. Must be specified using a Go

    time.Duration format (h|m|s). E.g. 240h for 240 hours and 45m for 45 minutes.'
  name: renew_before
  types:
  - <xref:str>
- description: cert-manager issuerRef. Required.
  name: issuer_ref
  types:
  - <xref:<xref:"CertManagerIssuerRef">>
- description: Type of certificate private key.
  name: private_key
  types:
  - <xref:<xref:"CertManagerPrivateKey">>
- description: Additional Subject Alternative Names (SANs) to include in the certificate.
  name: san
  types:
  - <xref:<xref:"SanForCert">>
attributes:
- uid: azure.mgmt.iotoperations.types.CertManagerCertificateSpec.duration
  name: duration
  summary: 'Lifetime of certificate. Must be specified using a Go time.Duration format
    (h|m|s). E.g. 240h

    for 240 hours and 45m for 45 minutes.'
  signature: 'duration: str'
- uid: azure.mgmt.iotoperations.types.CertManagerCertificateSpec.issuerRef
  name: issuerRef
  summary: cert-manager issuerRef. Required.
  signature: 'issuerRef: CertManagerIssuerRef'
- uid: azure.mgmt.iotoperations.types.CertManagerCertificateSpec.privateKey
  name: privateKey
  summary: Type of certificate private key.
  signature: 'privateKey: CertManagerPrivateKey'
- uid: azure.mgmt.iotoperations.types.CertManagerCertificateSpec.renewBefore
  name: renewBefore
  summary: 'When to begin renewing certificate. Must be specified using a Go time.Duration
    format (h|m|s).

    E.g. 240h for 240 hours and 45m for 45 minutes.'
  signature: 'renewBefore: str'
- uid: azure.mgmt.iotoperations.types.CertManagerCertificateSpec.san
  name: san
  summary: Additional Subject Alternative Names (SANs) to include in the certificate.
  signature: 'san: SanForCert'
- uid: azure.mgmt.iotoperations.types.CertManagerCertificateSpec.secretName
  name: secretName
  summary: 'Secret for storing server certificate. Any existing data will be overwritten.
    This is a

    reference to the secret through an identifying name, not the secret itself.'
  signature: 'secretName: str'
