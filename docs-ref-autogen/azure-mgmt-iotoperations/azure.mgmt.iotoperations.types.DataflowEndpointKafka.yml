### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.DataflowEndpointKafka
name: DataflowEndpointKafka
fullName: azure.mgmt.iotoperations.types.DataflowEndpointKafka
module: azure.mgmt.iotoperations.types
summary: Kafka endpoint properties.
constructor:
  syntax: DataflowEndpointKafka()
variables:
- description: 'Authentication configuration. NOTE - only authentication property
    is

    allowed per entry. Required.'
  name: authentication
  types:
  - <xref:<xref:"DataflowEndpointKafkaAuthentication">>
- description: Consumer group ID.
  name: consumer_group_id
  types:
  - <xref:str>
- description: Kafka endpoint host. Required.
  name: host
  types:
  - <xref:str>
- description: Batching configuration.
  name: batching
  types:
  - <xref:<xref:"DataflowEndpointKafkaBatching">>
- description: 'Copy Broker properties. No effect if the endpoint is used as a

    source or if the dataflow doesn''t have an Broker source. Known values are: "Enabled"
    and

    "Disabled".'
  name: copy_mqtt_properties
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperationalMode">]
- description: 'Compression. Can be none, gzip, lz4, or snappy. No effect if the endpoint
    is

    used as a source. Known values are: "None", "Gzip", "Snappy", and "Lz4".'
  name: compression
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataflowEndpointKafkaCompression">]
- description: 'Kafka acks. Can be all, one, or zero. No effect if the endpoint is
    used as a

    source. Known values are: "Zero", "One", and "All".'
  name: kafka_acks
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataflowEndpointKafkaAcks">]
- description: 'Partition handling strategy. Can be default or static. No effect if

    the endpoint is used as a source. Known values are: "Default", "Static", "Topic",
    and

    "Property".'
  name: partition_strategy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataflowEndpointKafkaPartitionStrategy">]
- description: TLS configuration.
  name: tls
  types:
  - <xref:<xref:"TlsProperties">>
- description: 'Cloud event mapping config. Known values are: "Propagate" and

    "CreateOrRemap".'
  name: cloud_event_attributes
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CloudEventAttributeType">]
