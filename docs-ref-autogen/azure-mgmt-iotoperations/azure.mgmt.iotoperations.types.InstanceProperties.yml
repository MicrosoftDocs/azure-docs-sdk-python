### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.InstanceProperties
name: InstanceProperties
fullName: azure.mgmt.iotoperations.types.InstanceProperties
module: azure.mgmt.iotoperations.types
summary: The properties of the Instance resource.
constructor:
  syntax: InstanceProperties()
variables:
- description: Detailed description of the Instance.
  name: description
  types:
  - <xref:str>
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Provisioning", "Updating", "Deleting", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The Azure IoT Operations version.
  name: version
  types:
  - <xref:str>
- description: 'The reference to the Schema Registry for this AIO Instance.

    Required.'
  name: schema_registry_ref
  types:
  - <xref:<xref:"SchemaRegistryRef">>
- description: The reference to the AIO Secret provider class.
  name: default_secret_provider_class_ref
  types:
  - <xref:<xref:"SecretProviderClassRef">>
- description: The features of the AIO Instance.
  name: features
  types:
  - <xref:dict>[<xref:str>, <xref:"InstanceFeature">]
- description: 'The Azure Device Registry Namespace used by Assets, Discovered Assets

    and devices.'
  name: adr_namespace_ref
  types:
  - <xref:<xref:"AzureDeviceRegistryNamespaceRef">>
- description: 'The health state of the resource. Known values are: "Available",

    "Degraded", "Unavailable", and "Unknown".'
  name: health_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceHealthState">]
attributes:
- uid: azure.mgmt.iotoperations.types.InstanceProperties.adrNamespaceRef
  name: adrNamespaceRef
  summary: The Azure Device Registry Namespace used by Assets, Discovered Assets and
    devices.
  signature: 'adrNamespaceRef: AzureDeviceRegistryNamespaceRef'
- uid: azure.mgmt.iotoperations.types.InstanceProperties.defaultSecretProviderClassRef
  name: defaultSecretProviderClassRef
  summary: The reference to the AIO Secret provider class.
  signature: 'defaultSecretProviderClassRef: SecretProviderClassRef'
- uid: azure.mgmt.iotoperations.types.InstanceProperties.description
  name: description
  summary: Detailed description of the Instance.
  signature: 'description: str'
- uid: azure.mgmt.iotoperations.types.InstanceProperties.features
  name: features
  summary: The features of the AIO Instance.
  signature: 'features: dict[str, ''InstanceFeature'']'
- uid: azure.mgmt.iotoperations.types.InstanceProperties.healthState
  name: healthState
  summary: '"Available", "Degraded",

    "Unavailable", and "Unknown".'
  signature: 'healthState: str | ResourceHealthState'
- uid: azure.mgmt.iotoperations.types.InstanceProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Provisioning", "Updating", "Deleting", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.iotoperations.types.InstanceProperties.schemaRegistryRef
  name: schemaRegistryRef
  summary: The reference to the Schema Registry for this AIO Instance. Required.
  signature: 'schemaRegistryRef: Required[SchemaRegistryRef]'
- uid: azure.mgmt.iotoperations.types.InstanceProperties.version
  name: version
  summary: The Azure IoT Operations version.
  signature: 'version: str'
