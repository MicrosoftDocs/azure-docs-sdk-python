### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.ListenerPort
name: ListenerPort
fullName: azure.mgmt.iotoperations.types.ListenerPort
module: azure.mgmt.iotoperations.types
summary: Defines a TCP port on which a `BrokerListener` listens.
constructor:
  syntax: ListenerPort()
variables:
- description: 'Reference to client authentication settings. Omit to disable

    authentication.'
  name: authentication_ref
  types:
  - <xref:str>
- description: 'Reference to client authorization settings. Omit to disable

    authorization.'
  name: authorization_ref
  types:
  - <xref:str>
- description: 'Kubernetes node port. Only relevant when this port is associated with
    a

    `NodePort` listener.'
  name: node_port
  types:
  - <xref:int>
- description: TCP port for accepting client connections. Required.
  name: port
  types:
  - <xref:int>
- description: 'Protocol to use for client connections. Known values are: "Mqtt" and

    "WebSockets".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BrokerProtocolType">]
- description: TLS server certificate settings for this port. Omit to disable TLS.
  name: tls
  types:
  - <xref:<xref:"TlsCertMethod">>
attributes:
- uid: azure.mgmt.iotoperations.types.ListenerPort.authenticationRef
  name: authenticationRef
  summary: Reference to client authentication settings. Omit to disable authentication.
  signature: 'authenticationRef: str'
- uid: azure.mgmt.iotoperations.types.ListenerPort.authorizationRef
  name: authorizationRef
  summary: Reference to client authorization settings. Omit to disable authorization.
  signature: 'authorizationRef: str'
- uid: azure.mgmt.iotoperations.types.ListenerPort.nodePort
  name: nodePort
  summary: Kubernetes node port. Only relevant when this port is associated with a
    `NodePort` listener.
  signature: 'nodePort: int'
- uid: azure.mgmt.iotoperations.types.ListenerPort.port
  name: port
  summary: TCP port for accepting client connections. Required.
  signature: 'port: Required[int]'
- uid: azure.mgmt.iotoperations.types.ListenerPort.protocol
  name: protocol
  summary: '"Mqtt" and "WebSockets".'
  signature: 'protocol: str | BrokerProtocolType'
- uid: azure.mgmt.iotoperations.types.ListenerPort.tls
  name: tls
  summary: TLS server certificate settings for this port. Omit to disable TLS.
  signature: 'tls: TlsCertMethod'
