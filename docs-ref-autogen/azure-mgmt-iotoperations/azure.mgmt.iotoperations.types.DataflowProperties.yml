uid: azure.mgmt.iotoperations.types.DataflowProperties
name: DataflowProperties
fullName: azure.mgmt.iotoperations.types.DataflowProperties
module: azure.mgmt.iotoperations.types
summary: Dataflow Resource properties.
constructor:
  syntax: DataflowProperties()
variables:
- description: 'Mode for Dataflow. Optional; defaults to Enabled. Known values are:
    "Enabled" and

    "Disabled".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperationalMode">]
- description: 'Disk persistence mode. Known values are: "Enabled" and

    "Disabled".'
