### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.AkriConnectorTemplateRuntimeImageConfigurationSettings
name: AkriConnectorTemplateRuntimeImageConfigurationSettings
fullName: azure.mgmt.iotoperations.types.AkriConnectorTemplateRuntimeImageConfigurationSettings
module: azure.mgmt.iotoperations.types
summary: AkriConnectorTemplateRuntimeImageConfiguration properties.
constructor:
  syntax: AkriConnectorTemplateRuntimeImageConfigurationSettings()
variables:
- description: The image name without any registry reference, tag or digest. Required.
  name: image_name
  types:
  - <xref:str>
- description: 'The pull policy of the image. Known values are: "Always",

    "IfNotPresent", and "Never".'
  name: image_pull_policy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AkriConnectorsImagePullPolicy">]
- description: 'Optional readiness probe for the connector container. When set, the

    operator injects this into the pod spec and uses the pod''s `Ready` condition
    for health

    reporting instead of crash-based detection.'
  name: readiness_probe
  types:
  - <xref:<xref:"AkriConnectorTemplateReadinessProbe">>
- description: The number of replicas to be set up.
  name: replicas
  types:
  - <xref:int>
- description: 'The registry settings for the image. You can omit this field if using

    the default docker hub repository or using a local image.'
  name: registry_settings
  types:
  - <xref:<xref:"AkriConnectorsRegistrySettings">>
- description: 'Optional image tag or digest. If not specified, the default tag is

    `latest`.'
  name: tag_digest_settings
  types:
  - <xref:<xref:"AkriConnectorsTagDigestSettings">>
attributes:
- uid: azure.mgmt.iotoperations.types.AkriConnectorTemplateRuntimeImageConfigurationSettings.imageName
  name: imageName
  summary: The image name without any registry reference, tag or digest. Required.
  signature: 'imageName: Required[str]'
- uid: azure.mgmt.iotoperations.types.AkriConnectorTemplateRuntimeImageConfigurationSettings.imagePullPolicy
  name: imagePullPolicy
  summary: '"Always", "IfNotPresent", and "Never".'
  signature: 'imagePullPolicy: str | AkriConnectorsImagePullPolicy'
- uid: azure.mgmt.iotoperations.types.AkriConnectorTemplateRuntimeImageConfigurationSettings.readinessProbe
  name: readinessProbe
  summary: 'Optional readiness probe for the connector container. When set, the operator
    injects this into

    the pod spec and uses the pod''s `Ready` condition for health reporting instead
    of crash-based

    detection.'
  signature: 'readinessProbe: AkriConnectorTemplateReadinessProbe'
- uid: azure.mgmt.iotoperations.types.AkriConnectorTemplateRuntimeImageConfigurationSettings.registrySettings
  name: registrySettings
  summary: 'The registry settings for the image. You can omit this field if using
    the default docker hub

    repository or using a local image.'
  signature: 'registrySettings: AkriConnectorsRegistrySettings'
- uid: azure.mgmt.iotoperations.types.AkriConnectorTemplateRuntimeImageConfigurationSettings.replicas
  name: replicas
  summary: The number of replicas to be set up.
  signature: 'replicas: int'
- uid: azure.mgmt.iotoperations.types.AkriConnectorTemplateRuntimeImageConfigurationSettings.tagDigestSettings
  name: tagDigestSettings
  summary: Optional image tag or digest. If not specified, the default tag is `latest`.
  signature: 'tagDigestSettings: AkriConnectorsTagDigestSettings'
