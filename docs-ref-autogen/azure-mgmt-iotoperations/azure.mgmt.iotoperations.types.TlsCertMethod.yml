### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.TlsCertMethod
name: TlsCertMethod
fullName: azure.mgmt.iotoperations.types.TlsCertMethod
module: azure.mgmt.iotoperations.types
summary: Collection of different TLS types, NOTE- Enum at a time only one of them
  needs to be supported.
constructor:
  syntax: TlsCertMethod()
variables:
- description: 'Mode of TLS server certificate management. Required. Known values
    are: "Automatic"

    and "Manual".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TlsCertMethodMode">]
- description: 'Option 1 - Automatic TLS server certificate management

    with cert-manager.'
  name: cert_manager_certificate_spec
  types:
  - <xref:<xref:"CertManagerCertificateSpec">>
- description: Option 2 - Manual TLS server certificate management through a defined
    secret.
  name: manual
  types:
  - <xref:<xref:"X509ManualCertificate">>
attributes:
- uid: azure.mgmt.iotoperations.types.TlsCertMethod.certManagerCertificateSpec
  name: certManagerCertificateSpec
  summary: Option 1 - Automatic TLS server certificate management with cert-manager.
  signature: 'certManagerCertificateSpec: CertManagerCertificateSpec'
- uid: azure.mgmt.iotoperations.types.TlsCertMethod.manual
  name: manual
  summary: Option 2 - Manual TLS server certificate management through a defined secret.
  signature: 'manual: X509ManualCertificate'
- uid: azure.mgmt.iotoperations.types.TlsCertMethod.mode
  name: mode
  summary: '"Automatic" and

    "Manual".'
  signature: 'mode: Required[str | TlsCertMethodMode]'
