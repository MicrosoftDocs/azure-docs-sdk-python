uid: azure.mgmt.iotoperations.types.BrokerAuthenticationProperties
name: BrokerAuthenticationProperties
fullName: azure.mgmt.iotoperations.types.BrokerAuthenticationProperties
module: azure.mgmt.iotoperations.types
summary: BrokerAuthentication Resource properties.
constructor:
  syntax: BrokerAuthenticationProperties()
variables:
- description: 'Defines a set of Broker authentication methods to be used on

    `BrokerListeners`. For each array element one authenticator type supported. Required.'
  name: authentication_methods
  types:
  - <xref:list>[<xref:"BrokerAuthenticatorMethods">]
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Provisioning", "Updating", "Deleting", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The health state of the resource. Known values are: "Available",

    "Degraded", "Unavailable", and "Unknown".'
  name: health_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceHealthState">]
attributes:
- uid: azure.mgmt.iotoperations.types.BrokerAuthenticationProperties.authenticationMethods
  name: authenticationMethods
  summary: 'Defines a set of Broker authentication methods to be used on `BrokerListeners`.
    For each

    array element one authenticator type supported. Required.'
  signature: 'authenticationMethods: Required[list[''BrokerAuthenticatorMethods'']]'
- uid: azure.mgmt.iotoperations.types.BrokerAuthenticationProperties.healthState
  name: healthState
  summary: '"Available", "Degraded",

    "Unavailable", and "Unknown".'
  signature: 'healthState: str | ResourceHealthState'
- uid: azure.mgmt.iotoperations.types.BrokerAuthenticationProperties.provisioningState
  name: provisioningState
