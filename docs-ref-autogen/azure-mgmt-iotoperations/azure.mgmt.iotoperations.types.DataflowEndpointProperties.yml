### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.DataflowEndpointProperties
name: DataflowEndpointProperties
fullName: azure.mgmt.iotoperations.types.DataflowEndpointProperties
module: azure.mgmt.iotoperations.types
summary: 'DataflowEndpoint Resource properties. NOTE - Only one type of endpoint is
  supported for one

  Resource.'
constructor:
  syntax: DataflowEndpointProperties()
variables:
- description: 'Endpoint Type. Required. Known values are: "DataExplorer",

    "DataLakeStorage", "FabricOneLake", "Kafka", "LocalStorage", "Mqtt", and "OpenTelemetry".'
  name: endpoint_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EndpointType">]
- description: 'The type of the Kafka host. E.g FabricRT, EventGrid. Known values
    are:

    "FabricRT", "EventGrid", "LocalBroker", "Eventhub", "CustomMqtt", and "CustomKafka".'
  name: host_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataflowEndpointHostType">]
- description: Azure Data Explorer endpoint.
  name: data_explorer_settings
  types:
  - <xref:<xref:"DataflowEndpointDataExplorer">>
- description: Azure Data Lake endpoint.
  name: data_lake_storage_settings
  types:
  - <xref:<xref:"DataflowEndpointDataLakeStorage">>
- description: Microsoft Fabric endpoint.
  name: fabric_one_lake_settings
  types:
  - <xref:<xref:"DataflowEndpointFabricOneLake">>
- description: Kafka endpoint.
  name: kafka_settings
  types:
  - <xref:<xref:"DataflowEndpointKafka">>
- description: Local persistent volume endpoint.
  name: local_storage_settings
  types:
  - <xref:<xref:"DataflowEndpointLocalStorage">>
- description: Broker endpoint.
  name: mqtt_settings
  types:
  - <xref:<xref:"DataflowEndpointMqtt">>
- description: OpenTelemetry endpoint.
  name: open_telemetry_settings
  types:
  - <xref:<xref:"DataflowEndpointOpenTelemetry">>
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Provisioning", "Updating", "Deleting", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The health state of the resource. Known values are: "Available",

    "Degraded", "Unavailable", and "Unknown".'
  name: health_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceHealthState">]
attributes:
- uid: azure.mgmt.iotoperations.types.DataflowEndpointProperties.dataExplorerSettings
  name: dataExplorerSettings
  summary: Azure Data Explorer endpoint.
  signature: 'dataExplorerSettings: DataflowEndpointDataExplorer'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointProperties.dataLakeStorageSettings
  name: dataLakeStorageSettings
  summary: Azure Data Lake endpoint.
  signature: 'dataLakeStorageSettings: DataflowEndpointDataLakeStorage'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointProperties.endpointType
  name: endpointType
  summary: '"DataExplorer", "DataLakeStorage",

    "FabricOneLake", "Kafka", "LocalStorage", "Mqtt", and "OpenTelemetry".'
  signature: 'endpointType: Required[str | EndpointType]'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointProperties.fabricOneLakeSettings
  name: fabricOneLakeSettings
  summary: Microsoft Fabric endpoint.
  signature: 'fabricOneLakeSettings: DataflowEndpointFabricOneLake'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointProperties.healthState
  name: healthState
  summary: '"Available", "Degraded",

    "Unavailable", and "Unknown".'
  signature: 'healthState: str | ResourceHealthState'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointProperties.hostType
  name: hostType
  summary: '"FabricRT",

    "EventGrid", "LocalBroker", "Eventhub", "CustomMqtt", and "CustomKafka".'
  signature: 'hostType: str | DataflowEndpointHostType'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointProperties.kafkaSettings
  name: kafkaSettings
  summary: Kafka endpoint.
  signature: 'kafkaSettings: DataflowEndpointKafka'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointProperties.localStorageSettings
  name: localStorageSettings
  summary: Local persistent volume endpoint.
  signature: 'localStorageSettings: DataflowEndpointLocalStorage'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointProperties.mqttSettings
  name: mqttSettings
  summary: Broker endpoint.
  signature: 'mqttSettings: DataflowEndpointMqtt'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointProperties.openTelemetrySettings
  name: openTelemetrySettings
  summary: OpenTelemetry endpoint.
  signature: 'openTelemetrySettings: DataflowEndpointOpenTelemetry'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Provisioning", "Updating", "Deleting", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
