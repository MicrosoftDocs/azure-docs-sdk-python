### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.DataflowEndpointMqttAuthentication
name: DataflowEndpointMqttAuthentication
fullName: azure.mgmt.iotoperations.types.DataflowEndpointMqttAuthentication
module: azure.mgmt.iotoperations.types
summary: 'Mqtt endpoint Authentication properties. NOTE - only authentication property
  is allowed per

  entry.'
constructor:
  syntax: DataflowEndpointMqttAuthentication()
variables:
- description: 'Mode of Authentication. Required. Known values are:

    "SystemAssignedManagedIdentity", "UserAssignedManagedIdentity", "ServiceAccountToken",

    "X509Certificate", and "Anonymous".'
  name: method
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MqttAuthMethod">]
- description: 'System-assigned managed identity

    authentication.'
  name: system_assigned_managed_identity_settings
  types:
  - <xref:<xref:"DataflowEndpointAuthenticationSystemAssignedManagedIdentity">>
- description: User-assigned managed identity authentication.
  name: user_assigned_managed_identity_settings
  types:
  - <xref:<xref:"DataflowEndpointAuthenticationUserAssignedManagedIdentity">>
- description: 'Kubernetes service account token authentication. Default

    audience if not set is aio-internal.'
  name: service_account_token_settings
  types:
  - <xref:<xref:"DataflowEndpointAuthenticationServiceAccountToken">>
- description: X.509 certificate authentication.
  name: x509_certificate_settings
  types:
  - <xref:<xref:"DataflowEndpointAuthenticationX509">>
attributes:
- uid: azure.mgmt.iotoperations.types.DataflowEndpointMqttAuthentication.method
  name: method
  summary: '"SystemAssignedManagedIdentity",

    "UserAssignedManagedIdentity", "ServiceAccountToken", "X509Certificate", and

    "Anonymous".'
  signature: 'method: Required[str | MqttAuthMethod]'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointMqttAuthentication.serviceAccountTokenSettings
  name: serviceAccountTokenSettings
  summary: Kubernetes service account token authentication. Default audience if not
    set is aio-internal.
  signature: 'serviceAccountTokenSettings: DataflowEndpointAuthenticationServiceAccountToken'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointMqttAuthentication.systemAssignedManagedIdentitySettings
  name: systemAssignedManagedIdentitySettings
  summary: System-assigned managed identity authentication.
  signature: 'systemAssignedManagedIdentitySettings: DataflowEndpointAuthenticationSystemAssignedManagedIdentity'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointMqttAuthentication.userAssignedManagedIdentitySettings
  name: userAssignedManagedIdentitySettings
  summary: User-assigned managed identity authentication.
  signature: 'userAssignedManagedIdentitySettings: DataflowEndpointAuthenticationUserAssignedManagedIdentity'
- uid: azure.mgmt.iotoperations.types.DataflowEndpointMqttAuthentication.x509CertificateSettings
  name: x509CertificateSettings
  summary: X.509 certificate authentication.
  signature: 'x509CertificateSettings: DataflowEndpointAuthenticationX509'
