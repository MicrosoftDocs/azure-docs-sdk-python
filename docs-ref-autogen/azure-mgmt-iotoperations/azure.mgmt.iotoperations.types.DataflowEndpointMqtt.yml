### YamlMime:PythonClass
uid: azure.mgmt.iotoperations.types.DataflowEndpointMqtt
name: DataflowEndpointMqtt
fullName: azure.mgmt.iotoperations.types.DataflowEndpointMqtt
module: azure.mgmt.iotoperations.types
summary: Broker endpoint properties.
constructor:
  syntax: DataflowEndpointMqtt()
variables:
- description: 'authentication properties. DEFAULT: kubernetes.audience=aio-internal.

    NOTE - Enum field only property is allowed. Required.'
  name: authentication
  types:
  - <xref:<xref:"DataflowEndpointMqttAuthentication">>
- description: 'Client ID prefix. Client ID generated by the dataflow is <prefix>-TBD.

    Optional; no prefix if omitted.'
  name: client_id_prefix
  types:
  - <xref:str>
- description: 'Host of the Broker in the form of <hostname>:<port>. Optional; connects
    to Broker

    if omitted.'
  name: host
  types:
  - <xref:str>
- description: 'Enable or disable websockets. Known values are: "Mqtt" and "WebSockets".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BrokerProtocolType">]
- description: Broker KeepAlive for connection in seconds.
  name: keep_alive_seconds
  types:
  - <xref:int>
- description: 'Whether or not to keep the retain setting. Known values are: "Keep"
    and "Never".'
  name: retain
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MqttRetainType">]
- description: 'The max number of messages to keep in flight. For subscribe, this

    is the receive maximum. For publish, this is the maximum number of messages to
    send before

    waiting for an ack.'
  name: max_inflight_messages
  types:
  - <xref:int>
- description: Qos for Broker connection.
  name: qos
  types:
  - <xref:int>
- description: Session expiry in seconds.
  name: session_expiry_seconds
  types:
  - <xref:int>
- description: TLS configuration.
  name: tls
  types:
  - <xref:<xref:"TlsProperties">>
- description: 'Cloud event mapping config. Known values are: "Propagate" and

    "CreateOrRemap".'
  name: cloud_event_attributes
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CloudEventAttributeType">]
attributes:
