  name: nginx_mapping
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.connectedcache.types.CacheNodeDriveConfiguration.cacheNumber
  name: cacheNumber
  summary: corresponding nginx cache number. Valid cache numbers are 1 - 20.
  signature: 'cacheNumber: int'
