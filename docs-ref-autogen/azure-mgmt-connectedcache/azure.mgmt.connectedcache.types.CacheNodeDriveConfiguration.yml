  name: nginxMapping
  summary: full binding for corresponding nginx cache drive.
  signature: 'nginxMapping: str'
- uid: azure.mgmt.connectedcache.types.CacheNodeDriveConfiguration.physicalPath
  name: physicalPath
  summary: physical path location of the folder used for caching content.
  signature: 'physicalPath: str'
- uid: azure.mgmt.connectedcache.types.CacheNodeDriveConfiguration.sizeInGb
  name: sizeInGb
