uid: azure.mgmt.connectedcache.types.CacheNodeDriveConfiguration
name: CacheNodeDriveConfiguration
fullName: azure.mgmt.connectedcache.types.CacheNodeDriveConfiguration
module: azure.mgmt.connectedcache.types
summary: Drive configuration for cache node.
constructor:
  syntax: CacheNodeDriveConfiguration()
variables:
- description: physical path location of the folder used for caching content.
  name: physical_path
  types:
  - <xref:str>
- description: physical size of the drive used for caching content.
  name: size_in_gb
