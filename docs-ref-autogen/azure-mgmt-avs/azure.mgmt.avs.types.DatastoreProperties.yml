### YamlMime:PythonClass
uid: azure.mgmt.avs.types.DatastoreProperties
name: DatastoreProperties
fullName: azure.mgmt.avs.types.DatastoreProperties
module: azure.mgmt.avs.types
summary: The properties of a datastore.
constructor:
  syntax: DatastoreProperties()
variables:
- description: 'The state of the datastore provisioning. Known values are:

    "Succeeded", "Failed", "Canceled", "Cancelled", "Pending", "Creating", "Updating",
    and

    "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DatastoreProvisioningState">]
- description: An Azure NetApp Files volume.
  name: netAppVolume
  types:
  - <xref:<xref:"NetAppVolume">>
- description: An iSCSI volume.
  name: diskPoolVolume
  types:
  - <xref:<xref:"DiskPoolVolume">>
- description: An Elastic SAN volume.
  name: elasticSanVolume
  types:
  - <xref:<xref:"ElasticSanVolume">>
- description: A Pure Storage volume.
  name: pureStorageVolume
  types:
  - <xref:<xref:"PureStorageVolume">>
- description: 'The operational status of the datastore. Known values are: "Unknown",

    "Accessible", "Inaccessible", "Attached", "Detached", "LostCommunication", and
    "DeadOrError".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DatastoreStatus">]
attributes:
- uid: azure.mgmt.avs.types.DatastoreProperties.diskPoolVolume
  name: diskPoolVolume
  summary: An iSCSI volume.
  signature: 'diskPoolVolume: DiskPoolVolume'
- uid: azure.mgmt.avs.types.DatastoreProperties.elasticSanVolume
  name: elasticSanVolume
  summary: An Elastic SAN volume.
  signature: 'elasticSanVolume: ElasticSanVolume'
- uid: azure.mgmt.avs.types.DatastoreProperties.netAppVolume
  name: netAppVolume
  summary: An Azure NetApp Files volume.
  signature: 'netAppVolume: NetAppVolume'
- uid: azure.mgmt.avs.types.DatastoreProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Cancelled", "Pending", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | DatastoreProvisioningState'
- uid: azure.mgmt.avs.types.DatastoreProperties.pureStorageVolume
  name: pureStorageVolume
  summary: A Pure Storage volume.
  signature: 'pureStorageVolume: PureStorageVolume'
- uid: azure.mgmt.avs.types.DatastoreProperties.status
  name: status
  summary: '"Unknown", "Accessible",

    "Inaccessible", "Attached", "Detached", "LostCommunication", and "DeadOrError".'
  signature: 'status: str | DatastoreStatus'
