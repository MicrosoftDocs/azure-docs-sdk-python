### YamlMime:PythonClass
uid: azure.mgmt.avs.types.DiskPoolVolume
name: DiskPoolVolume
fullName: azure.mgmt.avs.types.DiskPoolVolume
module: azure.mgmt.avs.types
summary: An iSCSI volume from Microsoft.StoragePool provider.
constructor:
  syntax: DiskPoolVolume()
variables:
- description: Azure resource ID of the iSCSI target. Required.
  name: targetId
  types:
  - <xref:str>
- description: Name of the LUN to be used for datastore. Required.
  name: lunName
  types:
  - <xref:str>
- description: 'Mode that describes whether the LUN has to be mounted as a datastore
    or

    attached as a LUN. Known values are: "MOUNT" and "ATTACH".'
  name: mountOption
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MountOptionEnum">]
- description: Device path.
  name: path
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.avs.types.DiskPoolVolume.lunName
  name: lunName
  summary: Name of the LUN to be used for datastore. Required.
  signature: 'lunName: Required[str]'
- uid: azure.mgmt.avs.types.DiskPoolVolume.mountOption
  name: mountOption
  summary: 'Mode that describes whether the LUN has to be mounted as a datastore or
    attached as a LUN.

    Known values are: "MOUNT" and "ATTACH".'
  signature: 'mountOption: str | MountOptionEnum'
- uid: azure.mgmt.avs.types.DiskPoolVolume.path
  name: path
  summary: Device path.
  signature: 'path: str'
- uid: azure.mgmt.avs.types.DiskPoolVolume.targetId
  name: targetId
  summary: Azure resource ID of the iSCSI target. Required.
  signature: 'targetId: Required[str]'
