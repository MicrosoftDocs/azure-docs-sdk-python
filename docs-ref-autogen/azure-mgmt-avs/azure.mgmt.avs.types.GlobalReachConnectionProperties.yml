uid: azure.mgmt.avs.types.GlobalReachConnectionProperties
name: GlobalReachConnectionProperties
fullName: azure.mgmt.avs.types.GlobalReachConnectionProperties
module: azure.mgmt.avs.types
summary: The properties of a global reach connection.
constructor:
  syntax: GlobalReachConnectionProperties()
variables:
- description: 'The state of the  ExpressRoute Circuit Authorization provisioning.

    Known values are: "Succeeded", "Failed", "Canceled", and "Updating".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GlobalReachConnectionProvisioningState">]
- description: 'The network used for global reach carved out from the original network

    block provided for the private cloud.'
  name: addressPrefix
  types:
  - <xref:str>
- description: 'Authorization key from the peer express route used for the global
    reach

    connection.'
  name: authorizationKey
  types:
  - <xref:str>
- description: 'The connection status of the global reach connection. Known

    values are: "Connected", "Connecting", and "Disconnected".'
  name: circuitConnectionStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GlobalReachConnectionStatus">]
- description: 'Identifier of the ExpressRoute Circuit to peer with in the

    global reach connection.'
  name: peerExpressRouteCircuit
  types:
  - <xref:str>
- description: 'The ID of the Private Cloud''s ExpressRoute Circuit that is participating

    in the global reach connection.'
  name: expressRouteId
  types:
  - <xref:str>
