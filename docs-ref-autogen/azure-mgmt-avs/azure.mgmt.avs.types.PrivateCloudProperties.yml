### YamlMime:PythonClass
uid: azure.mgmt.avs.types.PrivateCloudProperties
name: PrivateCloudProperties
fullName: azure.mgmt.avs.types.PrivateCloudProperties
module: azure.mgmt.avs.types
summary: The properties of a private cloud resource.
constructor:
  syntax: PrivateCloudProperties()
variables:
- description: The default cluster used for management. Required.
  name: managementCluster
  types:
  - <xref:<xref:"ManagementCluster">>
- description: 'Connectivity to internet is enabled or disabled. Known values are:
    "Enabled"

    and "Disabled".'
  name: internet
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"InternetEnum">]
- description: vCenter Single Sign On Identity Sources.
  name: identitySources
  types:
  - <xref:list>[<xref:"IdentitySource">]
- description: 'Properties describing how the cloud is distributed across availability

    zones.'
  name: availability
  types:
  - <xref:<xref:"AvailabilityProperties">>
- description: Customer managed key encryption, can be enabled or disabled.
  name: encryption
  types:
  - <xref:<xref:"Encryption">>
- description: 'Array of additional networks noncontiguous with networkBlock.

    Networks must be unique and non-overlapping across VNet in your subscription,
    on-premise, and

    this privateCloud networkBlock attribute. Make sure the CIDR format conforms to
    (A.B.C.D/X).'
  name: extendedNetworkBlocks
  types:
  - <xref:list>[<xref:str>]
- description: 'The provisioning state. Known values are: "Succeeded", "Failed",

    "Canceled", "Cancelled", "Pending", "Building", "Deleting", and "Updating".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PrivateCloudProvisioningState">]
- description: An ExpressRoute Circuit.
  name: circuit
  types:
  - <xref:<xref:"Circuit">>
- description: The endpoints.
  name: endpoints
  types:
  - <xref:<xref:"Endpoints">>
- description: 'The block of addresses should be unique across VNet in your subscription
    as

    well as on-premise. Make sure the CIDR format is conformed to (A.B.C.D/X) where
    A,B,C,D are

    between 0 and 255, and X is between 0 and 22. Required.'
  name: networkBlock
  types:
  - <xref:str>
- description: Network used to access vCenter Server and NSX-T Manager.
  name: managementNetwork
  types:
  - <xref:str>
- description: 'Used for virtual machine cold migration, cloning, and snapshot

    migration.'
  name: provisioningNetwork
  types:
  - <xref:str>
- description: Used for live migration of virtual machines.
  name: vmotionNetwork
  types:
  - <xref:str>
- description: 'Optionally, set the vCenter admin password when the private cloud
    is

    created.'
  name: vcenterPassword
  types:
  - <xref:str>
- description: 'Optionally, set the NSX-T Manager password when the private cloud
    is

    created.'
  name: nsxtPassword
  types:
  - <xref:str>
- description: Thumbprint of the vCenter Server SSL certificate.
  name: vcenterCertificateThumbprint
  types:
  - <xref:str>
- description: Thumbprint of the NSX-T Manager SSL certificate.
  name: nsxtCertificateThumbprint
  types:
  - <xref:str>
- description: Array of cloud link IDs from other clouds that connect to this one.
  name: externalCloudLinks
  types:
  - <xref:list>[<xref:str>]
- description: 'A secondary expressRoute circuit from a separate AZ. Only present
    in a

    stretched private cloud.'
  name: secondaryCircuit
  types:
  - <xref:<xref:"Circuit">>
- description: 'Flag to indicate whether the private cloud has the quota for

    provisioned NSX Public IP count raised from 64 to 1024. Known values are: "Enabled"
    and

    "Disabled".'
  name: nsxPublicIpQuotaRaised
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NsxPublicIpQuotaRaisedEnum">]
- description: Azure resource ID of the virtual network.
  name: virtualNetworkId
  types:
  - <xref:str>
- description: 'The type of DNS zone to use. Known values are: "Public" and "Private".'
  name: dnsZoneType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DnsZoneType">]
- description: The private cloud license.
  name: vcfLicense
  types:
  - <xref:<xref:"VcfLicense">>
attributes:
- uid: azure.mgmt.avs.types.PrivateCloudProperties.availability
  name: availability
  summary: Properties describing how the cloud is distributed across availability
    zones.
  signature: 'availability: AvailabilityProperties'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.circuit
  name: circuit
  summary: An ExpressRoute Circuit.
  signature: 'circuit: Circuit'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.dnsZoneType
  name: dnsZoneType
  summary: '"Public" and "Private".'
  signature: 'dnsZoneType: str | DnsZoneType'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.encryption
  name: encryption
  summary: Customer managed key encryption, can be enabled or disabled.
  signature: 'encryption: Encryption'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.endpoints
  name: endpoints
  summary: The endpoints.
  signature: 'endpoints: Endpoints'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.extendedNetworkBlocks
  name: extendedNetworkBlocks
  summary: 'Array of additional networks noncontiguous with networkBlock. Networks
    must be unique and

    non-overlapping across VNet in your subscription, on-premise, and this privateCloud

    networkBlock attribute. Make sure the CIDR format conforms to (A.B.C.D/X).'
  signature: 'extendedNetworkBlocks: list[str]'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.externalCloudLinks
  name: externalCloudLinks
  summary: Array of cloud link IDs from other clouds that connect to this one.
  signature: 'externalCloudLinks: list[str]'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.identitySources
  name: identitySources
  summary: vCenter Single Sign On Identity Sources.
  signature: 'identitySources: list[''IdentitySource'']'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.internet
  name: internet
  summary: '"Enabled" and

    "Disabled".'
  signature: 'internet: str | InternetEnum'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.managementCluster
  name: managementCluster
  summary: The default cluster used for management. Required.
  signature: 'managementCluster: Required[ManagementCluster]'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.managementNetwork
  name: managementNetwork
  summary: Network used to access vCenter Server and NSX-T Manager.
  signature: 'managementNetwork: str'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.networkBlock
  name: networkBlock
  summary: 'The block of addresses should be unique across VNet in your subscription
    as well as on-premise.

    Make sure the CIDR format is conformed to (A.B.C.D/X) where A,B,C,D are between
    0 and 255, and

    X is between 0 and 22. Required.'
  signature: 'networkBlock: Required[str]'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.nsxPublicIpQuotaRaised
  name: nsxPublicIpQuotaRaised
  summary: 'Flag to indicate whether the private cloud has the quota for provisioned
    NSX Public IP count

    raised from 64 to 1024. Known values are: "Enabled" and "Disabled".'
  signature: 'nsxPublicIpQuotaRaised: str | NsxPublicIpQuotaRaisedEnum'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.nsxtCertificateThumbprint
  name: nsxtCertificateThumbprint
  summary: Thumbprint of the NSX-T Manager SSL certificate.
  signature: 'nsxtCertificateThumbprint: str'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.nsxtPassword
  name: nsxtPassword
  summary: Optionally, set the NSX-T Manager password when the private cloud is created.
  signature: 'nsxtPassword: str'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.provisioningNetwork
  name: provisioningNetwork
  summary: Used for virtual machine cold migration, cloning, and snapshot migration.
  signature: 'provisioningNetwork: str'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Cancelled", "Pending", "Building", "Deleting", and "Updating".'
  signature: 'provisioningState: str | PrivateCloudProvisioningState'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.secondaryCircuit
  name: secondaryCircuit
  summary: A secondary expressRoute circuit from a separate AZ. Only present in a
    stretched private cloud.
  signature: 'secondaryCircuit: Circuit'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.vcenterCertificateThumbprint
  name: vcenterCertificateThumbprint
  summary: Thumbprint of the vCenter Server SSL certificate.
  signature: 'vcenterCertificateThumbprint: str'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.vcenterPassword
  name: vcenterPassword
  summary: Optionally, set the vCenter admin password when the private cloud is created.
  signature: 'vcenterPassword: str'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.vcfLicense
  name: vcfLicense
  summary: The private cloud license.
  signature: 'vcfLicense: VcfLicense'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.virtualNetworkId
  name: virtualNetworkId
  summary: Azure resource ID of the virtual network.
  signature: 'virtualNetworkId: str'
- uid: azure.mgmt.avs.types.PrivateCloudProperties.vmotionNetwork
  name: vmotionNetwork
  summary: Used for live migration of virtual machines.
  signature: 'vmotionNetwork: str'
