### YamlMime:PythonClass
uid: azure.mgmt.avs.types.ScriptExecutionProperties
name: ScriptExecutionProperties
fullName: azure.mgmt.avs.types.ScriptExecutionProperties
module: azure.mgmt.avs.types
summary: Properties of a user-invoked script.
constructor:
  syntax: ScriptExecutionProperties()
variables:
- description: 'A reference to the script cmdlet resource if user is running a AVS

    script.'
  name: scriptCmdletId
  types:
  - <xref:str>
- description: Parameters the script will accept.
  name: parameters
  types:
  - <xref:list>[<xref:"ScriptExecutionParameter">]
- description: 'Parameters that will be hidden/not visible to ARM, such as passwords

    and credentials.'
  name: hiddenParameters
  types:
  - <xref:list>[<xref:"ScriptExecutionParameter">]
- description: 'Error message if the script was able to run, but if the script itself
    had

    errors or powershell threw an exception.'
  name: failureReason
  types:
  - <xref:str>
- description: Time limit for execution. Required.
  name: timeout
  types:
  - <xref:str>
- description: Time to live for the resource. If not provided, will be available for
    60 days.
  name: retention
  types:
  - <xref:str>
- description: Time the script execution was submitted.
  name: submittedAt
  types:
  - <xref:str>
- description: Time the script execution was started.
  name: startedAt
  types:
  - <xref:str>
- description: Time the script execution was finished.
  name: finishedAt
  types:
  - <xref:str>
- description: 'The state of the script execution resource. Known values are:

    "Succeeded", "Failed", "Canceled", "Pending", "Running", "Cancelling", "Cancelled",
    and

    "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScriptExecutionProvisioningState">]
- description: Standard output stream from the powershell execution.
  name: output
  types:
  - <xref:list>[<xref:str>]
- description: User-defined dictionary.
  name: namedOutputs
  types:
  - <xref:dict>[<xref:str>, <xref:typing.Any>]
- description: Standard information out stream from the powershell execution.
  name: information
  types:
  - <xref:list>[<xref:str>]
- description: Standard warning out stream from the powershell execution.
  name: warnings
  types:
  - <xref:list>[<xref:str>]
- description: Standard error output stream from the powershell execution.
  name: errors
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.errors
  name: errors
  summary: Standard error output stream from the powershell execution.
  signature: 'errors: list[str]'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.failureReason
  name: failureReason
  summary: 'Error message if the script was able to run, but if the script itself
    had errors or powershell

    threw an exception.'
  signature: 'failureReason: str'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.finishedAt
  name: finishedAt
  summary: Time the script execution was finished.
  signature: 'finishedAt: str'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.hiddenParameters
  name: hiddenParameters
  summary: Parameters that will be hidden/not visible to ARM, such as passwords and
    credentials.
  signature: 'hiddenParameters: list[''ScriptExecutionParameter'']'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.information
  name: information
  summary: Standard information out stream from the powershell execution.
  signature: 'information: list[str]'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.namedOutputs
  name: namedOutputs
  summary: User-defined dictionary.
  signature: 'namedOutputs: dict[str, Any]'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.output
  name: output
  summary: Standard output stream from the powershell execution.
  signature: 'output: list[str]'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.parameters
  name: parameters
  summary: Parameters the script will accept.
  signature: 'parameters: list[''ScriptExecutionParameter'']'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Pending", "Running", "Cancelling", "Cancelled", and "Deleting".'
  signature: 'provisioningState: str | ScriptExecutionProvisioningState'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.retention
  name: retention
  summary: Time to live for the resource. If not provided, will be available for 60
    days.
  signature: 'retention: str'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.scriptCmdletId
  name: scriptCmdletId
  summary: A reference to the script cmdlet resource if user is running a AVS script.
  signature: 'scriptCmdletId: str'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.startedAt
  name: startedAt
  summary: Time the script execution was started.
  signature: 'startedAt: str'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.submittedAt
  name: submittedAt
  summary: Time the script execution was submitted.
  signature: 'submittedAt: str'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.timeout
  name: timeout
  summary: Time limit for execution. Required.
  signature: 'timeout: Required[str]'
- uid: azure.mgmt.avs.types.ScriptExecutionProperties.warnings
  name: warnings
  summary: Standard warning out stream from the powershell execution.
  signature: 'warnings: list[str]'
