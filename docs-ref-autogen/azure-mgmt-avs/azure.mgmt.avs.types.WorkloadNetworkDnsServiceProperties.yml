### YamlMime:PythonClass
uid: azure.mgmt.avs.types.WorkloadNetworkDnsServiceProperties
name: WorkloadNetworkDnsServiceProperties
fullName: azure.mgmt.avs.types.WorkloadNetworkDnsServiceProperties
module: azure.mgmt.avs.types
summary: NSX DNS Service Properties.
constructor:
  syntax: WorkloadNetworkDnsServiceProperties()
variables:
- description: Display name of the DNS Service.
  name: displayName
  types:
  - <xref:str>
- description: DNS service IP of the DNS Service.
  name: dnsServiceIp
  types:
  - <xref:str>
- description: Default DNS zone of the DNS Service.
  name: defaultDnsZone
  types:
  - <xref:str>
- description: FQDN zones of the DNS Service.
  name: fqdnZones
  types:
  - <xref:list>[<xref:str>]
- description: 'DNS Service log level. Known values are: "DEBUG", "INFO", "WARNING",
    "ERROR",

    and "FATAL".'
  name: logLevel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DnsServiceLogLevelEnum">]
- description: 'DNS Service status. Known values are: "SUCCESS" and "FAILURE".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DnsServiceStatusEnum">]
- description: 'The provisioning state. Known values are: "Succeeded", "Failed",

    "Canceled", "Building", "Deleting", and "Updating".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WorkloadNetworkDnsServiceProvisioningState">]
- description: NSX revision number.
  name: revision
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.avs.types.WorkloadNetworkDnsServiceProperties.defaultDnsZone
  name: defaultDnsZone
  summary: Default DNS zone of the DNS Service.
  signature: 'defaultDnsZone: str'
- uid: azure.mgmt.avs.types.WorkloadNetworkDnsServiceProperties.displayName
  name: displayName
  summary: Display name of the DNS Service.
  signature: 'displayName: str'
- uid: azure.mgmt.avs.types.WorkloadNetworkDnsServiceProperties.dnsServiceIp
  name: dnsServiceIp
  summary: DNS service IP of the DNS Service.
  signature: 'dnsServiceIp: str'
- uid: azure.mgmt.avs.types.WorkloadNetworkDnsServiceProperties.fqdnZones
  name: fqdnZones
  summary: FQDN zones of the DNS Service.
  signature: 'fqdnZones: list[str]'
- uid: azure.mgmt.avs.types.WorkloadNetworkDnsServiceProperties.logLevel
  name: logLevel
  summary: '"DEBUG", "INFO", "WARNING", "ERROR", and

    "FATAL".'
  signature: 'logLevel: str | DnsServiceLogLevelEnum'
- uid: azure.mgmt.avs.types.WorkloadNetworkDnsServiceProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Building", "Deleting", and "Updating".'
  signature: 'provisioningState: str | WorkloadNetworkDnsServiceProvisioningState'
