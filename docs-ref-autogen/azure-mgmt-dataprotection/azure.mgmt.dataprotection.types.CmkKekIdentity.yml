uid: azure.mgmt.dataprotection.types.CmkKekIdentity
name: CmkKekIdentity
fullName: azure.mgmt.dataprotection.types.CmkKekIdentity
module: azure.mgmt.dataprotection.types
summary: The details of the managed identity used for CMK.
constructor:
  syntax: CmkKekIdentity()
variables:
- description: 'The identity type. ''SystemAssigned'' and ''UserAssigned'' are mutually

    exclusive. ''SystemAssigned'' will use implicitly created managed identity. Known
    values are:

    "SystemAssigned" and "UserAssigned".'
  name: identityType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IdentityType">]
- description: 'The managed identity to be used which has access permissions to the
    Key

    Vault. Provide a value here in case identity types: ''UserAssigned'' only.'
  name: identityId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.dataprotection.types.CmkKekIdentity.identityId
  name: identityId
  summary: 'The managed identity to be used which has access permissions to the Key
    Vault. Provide a value

    here in case identity types: ''UserAssigned'' only.'
  signature: 'identityId: str'
- uid: azure.mgmt.dataprotection.types.CmkKekIdentity.identityType
  name: identityType
  summary: 'The identity type. ''SystemAssigned'' and ''UserAssigned'' are mutually
    exclusive. ''SystemAssigned''

    will use implicitly created managed identity. Known values are: "SystemAssigned"
    and

    "UserAssigned".'
  signature: 'identityType: str | IdentityType'
