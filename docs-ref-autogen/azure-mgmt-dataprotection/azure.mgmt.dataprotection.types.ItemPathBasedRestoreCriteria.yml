### YamlMime:PythonClass
uid: azure.mgmt.dataprotection.types.ItemPathBasedRestoreCriteria
name: ItemPathBasedRestoreCriteria
fullName: azure.mgmt.dataprotection.types.ItemPathBasedRestoreCriteria
module: azure.mgmt.dataprotection.types
summary: Prefix criteria to be used to during restore.
constructor:
  syntax: ItemPathBasedRestoreCriteria()
variables:
- description: 'The path of the item to be restored. It could be the full path of
    the item or

    the path relative to the backup item. Required.'
  name: item_path
  types:
  - <xref:str>
- description: 'Flag to specify if the path is relative to backup item

    or full path. Required.'
  name: is_path_relative_to_backup_item
  types:
  - <xref:bool>
- description: 'The list of prefix strings to be used as filter criteria during

    restore. These are relative to the item path specified.'
  name: sub_item_path_prefix
  types:
  - <xref:list>[<xref:str>]
- description: 'Rename the item to be restored. Restore will rename the itemPath to
    this new

    name if the value is specified otherwise the itemPath will be restored as same
    name.'
  name: rename_to
  types:
  - <xref:str>
- description: 'Type of the specific object - used for deserializing. Required. Default

    value is "ItemPathBasedRestoreCriteria".'
  name: object_type
  types:
  - <xref:typing.Literal>["ItemPathBasedRestoreCriteria"]
attributes:
- uid: azure.mgmt.dataprotection.types.ItemPathBasedRestoreCriteria.isPathRelativeToBackupItem
  name: isPathRelativeToBackupItem
  summary: Flag to specify if the path is relative to backup item or full path. Required.
  signature: 'isPathRelativeToBackupItem: bool'
- uid: azure.mgmt.dataprotection.types.ItemPathBasedRestoreCriteria.itemPath
  name: itemPath
  summary: 'The path of the item to be restored. It could be the full path of the
    item or the path relative

    to the backup item. Required.'
  signature: 'itemPath: str'
- uid: azure.mgmt.dataprotection.types.ItemPathBasedRestoreCriteria.objectType
  name: objectType
  summary: 'Type of the specific object - used for deserializing. Required. Default
    value is

    "ItemPathBasedRestoreCriteria".'
  signature: 'objectType: Literal[''ItemPathBasedRestoreCriteria'']'
- uid: azure.mgmt.dataprotection.types.ItemPathBasedRestoreCriteria.renameTo
  name: renameTo
  summary: 'Rename the item to be restored. Restore will rename the itemPath to this
    new name if the value

    is specified otherwise the itemPath will be restored as same name.'
  signature: 'renameTo: str'
- uid: azure.mgmt.dataprotection.types.ItemPathBasedRestoreCriteria.subItemPathPrefix
  name: subItemPathPrefix
  summary: 'The list of prefix strings to be used as filter criteria during restore.
    These are relative to

    the item path specified.'
  signature: 'subItemPathPrefix: list[str]'
