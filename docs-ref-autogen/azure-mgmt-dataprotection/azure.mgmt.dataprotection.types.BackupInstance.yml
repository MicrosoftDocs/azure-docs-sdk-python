    considered as System Assigned.'
  signature: 'identityDetails: IdentityDetails'
- uid: azure.mgmt.dataprotection.types.BackupInstance.objectType
  name: objectType
  summary: Required.
  signature: 'objectType: Required[str]'
- uid: azure.mgmt.dataprotection.types.BackupInstance.policyInfo
  name: policyInfo
  summary: Gets or sets the policy information. Required.
  signature: 'policyInfo: Required[PolicyInfo]'
