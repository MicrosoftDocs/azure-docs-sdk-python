  name: friendlyName
  summary: Gets or sets the Backup Instance friendly name.
  signature: 'friendlyName: str'
- uid: azure.mgmt.dataprotection.types.BackupInstance.identityDetails
  name: identityDetails
  summary: 'Contains information of the Identity Details for the BI. If it is null,
