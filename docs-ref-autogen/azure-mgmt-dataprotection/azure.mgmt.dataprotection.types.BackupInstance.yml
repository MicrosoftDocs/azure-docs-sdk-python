    "BackupSchedulesSuspended", "RetentionSchedulesSuspended", "ProtectionStopped",

    "ProtectionError", "ConfiguringProtectionFailed", "SoftDeleting", "SoftDeleted",
    and

    "UpdatingProtection".'
  signature: 'currentProtectionState: str | CurrentProtectionState'
