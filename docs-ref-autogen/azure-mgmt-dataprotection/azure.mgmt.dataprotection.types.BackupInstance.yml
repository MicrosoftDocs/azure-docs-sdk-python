  name: protectionErrorDetails
  summary: Specifies the protection error of the resource.
  signature: 'protectionErrorDetails: UserFacingError'
- uid: azure.mgmt.dataprotection.types.BackupInstance.protectionStatus
  name: protectionStatus
  summary: Specifies the protection status of the resource.
  signature: 'protectionStatus: ProtectionStatusDetails'
- uid: azure.mgmt.dataprotection.types.BackupInstance.provisioningState
  name: provisioningState
  summary: Specifies the provisioning state of the resource i.e. provisioning/updating/Succeeded/Failed.
  signature: 'provisioningState: str'
- uid: azure.mgmt.dataprotection.types.BackupInstance.resourceGuardOperationRequests
  name: resourceGuardOperationRequests
  summary: ResourceGuardOperationRequests on which LAC check will be performed.
  signature: 'resourceGuardOperationRequests: list[str]'
