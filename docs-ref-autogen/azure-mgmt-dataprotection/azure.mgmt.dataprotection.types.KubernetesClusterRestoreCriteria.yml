uid: azure.mgmt.dataprotection.types.KubernetesClusterRestoreCriteria
name: KubernetesClusterRestoreCriteria
fullName: azure.mgmt.dataprotection.types.KubernetesClusterRestoreCriteria
module: azure.mgmt.dataprotection.types
summary: kubernetes Cluster Backup target info for restore operation.
constructor:
  syntax: KubernetesClusterRestoreCriteria()
variables:
