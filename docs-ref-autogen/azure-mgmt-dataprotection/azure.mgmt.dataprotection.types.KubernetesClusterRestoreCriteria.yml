    This property if enabled will include cluster scope resources during restore.
    Required.'
  name: include_cluster_scope_resources
  types:
  - <xref:bool>
- description: 'Gets or sets the include namespaces property. This property sets the

    namespaces to be included during restore.'
  name: included_namespaces
  types:
  - <xref:list>[<xref:str>]
- description: 'Gets or sets the exclude namespaces property. This property sets the

    namespaces to be excluded during restore.'
