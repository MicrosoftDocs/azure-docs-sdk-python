  - <xref:list>[<xref:str>]
- description: 'Gets or sets the exclude namespaces property. This property sets the

    namespaces to be excluded during backup.'
  name: excluded_namespaces
  types:
  - <xref:list>[<xref:str>]
- description: 'Gets or sets the include resource types property. This property

    sets the resource types to be included during backup.'
