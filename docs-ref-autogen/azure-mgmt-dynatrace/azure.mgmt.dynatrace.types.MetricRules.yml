### YamlMime:PythonClass
uid: azure.mgmt.dynatrace.types.MetricRules
name: MetricRules
fullName: azure.mgmt.dynatrace.types.MetricRules
module: azure.mgmt.dynatrace.types
summary: Set of rules for sending metrics for the Monitor resource.
constructor:
  syntax: MetricRules()
variables:
- description: 'Flag specifying if metrics from Azure resources should be sent for
    the

    Monitor resource. Known values are: "Enabled" and "Disabled".'
  name: sending_metrics
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SendingMetricsStatus">]
- description: 'List of filtering tags to be used for capturing metrics. If empty,
    all

    resources will be captured. If only Exclude action is specified, the rules will
    apply to the

    list of all available resources. If Include actions are specified, the rules will
    only include

    resources with the associated tags.'
  name: filtering_tags
  types:
  - <xref:list>[<xref:"FilteringTag">]
attributes:
- uid: azure.mgmt.dynatrace.types.MetricRules.filteringTags
  name: filteringTags
  summary: 'List of filtering tags to be used for capturing metrics. If empty, all
    resources will be

    captured. If only Exclude action is specified, the rules will apply to the list
    of all

    available resources. If Include actions are specified, the rules will only include
    resources

    with the associated tags.'
  signature: 'filteringTags: list[''FilteringTag'']'
- uid: azure.mgmt.dynatrace.types.MetricRules.sendingMetrics
  name: sendingMetrics
  summary: 'Flag specifying if metrics from Azure resources should be sent for the
    Monitor resource. Known

    values are: "Enabled" and "Disabled".'
  signature: 'sendingMetrics: str | SendingMetricsStatus'
