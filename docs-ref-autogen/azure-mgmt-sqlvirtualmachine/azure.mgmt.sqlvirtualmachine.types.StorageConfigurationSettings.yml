  - <xref:bool>
attributes:
- uid: azure.mgmt.sqlvirtualmachine.types.StorageConfigurationSettings.diskConfigurationType
  name: diskConfigurationType
  summary: '"NEW", "EXTEND", and "ADD".'
  signature: 'diskConfigurationType: str | DiskConfigurationType'
- uid: azure.mgmt.sqlvirtualmachine.types.StorageConfigurationSettings.enableStorageConfigBlade
  name: enableStorageConfigBlade
  summary: Enable SQL IaaS Agent storage configuration blade in Azure Portal.
  signature: 'enableStorageConfigBlade: bool'
- uid: azure.mgmt.sqlvirtualmachine.types.StorageConfigurationSettings.sqlDataSettings
  name: sqlDataSettings
  summary: SQL Server Data Storage Settings.
  signature: 'sqlDataSettings: SQLStorageSettings'
- uid: azure.mgmt.sqlvirtualmachine.types.StorageConfigurationSettings.sqlLogSettings
  name: sqlLogSettings
  summary: SQL Server Log Storage Settings.
  signature: 'sqlLogSettings: SQLStorageSettings'
- uid: azure.mgmt.sqlvirtualmachine.types.StorageConfigurationSettings.sqlSystemDbOnDataDisk
  name: sqlSystemDbOnDataDisk
  summary: SQL Server SystemDb Storage on DataPool if true.
  signature: 'sqlSystemDbOnDataDisk: bool'
- uid: azure.mgmt.sqlvirtualmachine.types.StorageConfigurationSettings.sqlTempDbSettings
  name: sqlTempDbSettings
  summary: SQL Server TempDb Storage Settings.
  signature: 'sqlTempDbSettings: SQLTempDbSettings'
- uid: azure.mgmt.sqlvirtualmachine.types.StorageConfigurationSettings.storageWorkloadType
  name: storageWorkloadType
  summary: '"GENERAL", "OLTP", and "DW".'
