### YamlMime:PythonClass
uid: azure.mgmt.sqlvirtualmachine.types.StorageConfigurationSettings
name: StorageConfigurationSettings
fullName: azure.mgmt.sqlvirtualmachine.types.StorageConfigurationSettings
module: azure.mgmt.sqlvirtualmachine.types
summary: Storage Configurations for SQL Data, Log and TempDb.
constructor:
  syntax: StorageConfigurationSettings()
variables:
- description: SQL Server Data Storage Settings.
  name: sql_data_settings
  types:
  - <xref:<xref:"SQLStorageSettings">>
- description: SQL Server Log Storage Settings.
  name: sql_log_settings
  types:
  - <xref:<xref:"SQLStorageSettings">>
- description: SQL Server TempDb Storage Settings.
  name: sql_temp_db_settings
  types:
  - <xref:<xref:"SQLTempDbSettings">>
- description: SQL Server SystemDb Storage on DataPool if true.
  name: sql_system_db_on_data_disk
  types:
  - <xref:bool>
- description: 'Disk configuration to apply to SQL Server. Known values are:

    "NEW", "EXTEND", and "ADD".'
  name: disk_configuration_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskConfigurationType">]
- description: 'Storage workload type. Known values are: "GENERAL", "OLTP", and

    "DW".'
  name: storage_workload_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageWorkloadType">]
- description: 'Enable SQL IaaS Agent storage configuration blade in Azure

    Portal.'
  name: enable_storage_config_blade
