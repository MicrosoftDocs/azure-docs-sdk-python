### YamlMime:PythonClass
uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings
name: AutoBackupSettings
fullName: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings
module: azure.mgmt.sqlvirtualmachine.types
summary: Configure backups for databases in your SQL virtual machine.
constructor:
  syntax: AutoBackupSettings()
variables:
- description: Enable or disable autobackup on SQL virtual machine.
  name: enable
  types:
  - <xref:bool>
- description: Enable or disable encryption for backup on SQL virtual machine.
  name: enable_encryption
  types:
  - <xref:bool>
- description: 'Retention period of backup: 1-90 days.'
  name: retention_period
  types:
  - <xref:int>
- description: Storage account url where backup will be taken to.
  name: storage_account_url
  types:
  - <xref:str>
- description: Storage container name where backup will be taken to.
  name: storage_container_name
  types:
  - <xref:str>
- description: Storage account key where backup will be taken to.
  name: storage_access_key
  types:
  - <xref:str>
- description: Password for encryption on backup.
  name: password
  types:
  - <xref:str>
- description: Include or exclude system databases from auto backup.
  name: backup_system_dbs
  types:
  - <xref:bool>
- description: 'Backup schedule type. Known values are: "Manual" and "Automated".'
  name: backup_schedule_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupScheduleType">]
- description: 'Frequency of full backups. In both cases, full backups begin

    during the next scheduled time window. Known values are: "Daily" and "Weekly".'
  name: full_backup_frequency
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FullBackupFrequencyType">]
- description: Days of the week for the backups when FullBackupFrequency is set to
    Weekly.
  name: days_of_week
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"AutoBackupDaysOfWeek">]]
- description: 'Start time of a given day during which full backups can take

    place. 0-23 hours.'
  name: full_backup_start_time
  types:
  - <xref:int>
- description: 'Duration of the time window of a given day during which full

    backups can take place. 1-23 hours.'
  name: full_backup_window_hours
  types:
  - <xref:int>
- description: Frequency of log backups. 5-60 minutes.
  name: log_backup_frequency
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.backupScheduleType
  name: backupScheduleType
  summary: '"Manual" and "Automated".'
  signature: 'backupScheduleType: str | BackupScheduleType'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.backupSystemDbs
  name: backupSystemDbs
  summary: Include or exclude system databases from auto backup.
  signature: 'backupSystemDbs: bool'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.daysOfWeek
  name: daysOfWeek
  summary: Days of the week for the backups when FullBackupFrequency is set to Weekly.
  signature: 'daysOfWeek: list[typing.Union[str, ForwardRef(''AutoBackupDaysOfWeek'')]]'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.enable
  name: enable
  summary: Enable or disable autobackup on SQL virtual machine.
  signature: 'enable: bool'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.enableEncryption
  name: enableEncryption
  summary: Enable or disable encryption for backup on SQL virtual machine.
  signature: 'enableEncryption: bool'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.fullBackupFrequency
  name: fullBackupFrequency
  summary: 'Frequency of full backups. In both cases, full backups begin during the
    next scheduled time

    window. Known values are: "Daily" and "Weekly".'
  signature: 'fullBackupFrequency: str | FullBackupFrequencyType'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.fullBackupStartTime
  name: fullBackupStartTime
  summary: Start time of a given day during which full backups can take place. 0-23
    hours.
  signature: 'fullBackupStartTime: int'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.fullBackupWindowHours
  name: fullBackupWindowHours
  summary: 'Duration of the time window of a given day during which full backups can
    take place. 1-23

    hours.'
  signature: 'fullBackupWindowHours: int'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.logBackupFrequency
  name: logBackupFrequency
  summary: Frequency of log backups. 5-60 minutes.
  signature: 'logBackupFrequency: int'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.password
  name: password
  summary: Password for encryption on backup.
  signature: 'password: str'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.retentionPeriod
  name: retentionPeriod
  summary: 1-90 days.
  signature: 'retentionPeriod: int'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.storageAccessKey
  name: storageAccessKey
  summary: Storage account key where backup will be taken to.
  signature: 'storageAccessKey: str'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.storageAccountUrl
  name: storageAccountUrl
  summary: Storage account url where backup will be taken to.
  signature: 'storageAccountUrl: str'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoBackupSettings.storageContainerName
  name: storageContainerName
  summary: Storage container name where backup will be taken to.
  signature: 'storageContainerName: str'
