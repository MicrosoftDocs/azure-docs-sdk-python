  - <xref:azure.mgmt.sqlvirtualmachine.models.ServerConfigurationsManagementSettings>
- description: Storage Configuration Settings.
  name: storage_configuration_settings
  types:
  - <xref:azure.mgmt.sqlvirtualmachine.models.StorageConfigurationSettings>
- description: Troubleshooting status.
  name: troubleshooting_status
  types:
  - <xref:azure.mgmt.sqlvirtualmachine.models.TroubleshootingStatus>
- description: SQL best practices Assessment Settings.
  name: assessment_settings
  types:
  - <xref:azure.mgmt.sqlvirtualmachine.models.AssessmentSettings>
- description: Enable automatic upgrade of Sql IaaS extension Agent.
  name: enable_automatic_upgrade
  types:
  - <xref:bool>
- description: 'Additional VM Patching solution enabled on the Virtual Machine.

    Known values are: "WU", "WUMU", and "WSUS".'
  name: additional_vm_patch
  types:
  - <xref:str>
  - <xref:azure.mgmt.sqlvirtualmachine.models.AdditionalOsPatch>
- description: 'Virtual Machine Identity details used for Sql IaaS

    extension configurations.'
  name: virtual_machine_identity_settings
  types:
  - <xref:azure.mgmt.sqlvirtualmachine.models.VirtualMachineIdentity>
- description: 'Operating System of the current SQL Virtual Machine. Known values
    are: "Windows"

    and "Linux".'
  name: os_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.sqlvirtualmachine.models.OsType>
