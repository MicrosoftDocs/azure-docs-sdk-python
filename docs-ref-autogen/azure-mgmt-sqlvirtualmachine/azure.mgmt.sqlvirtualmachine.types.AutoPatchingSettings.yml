### YamlMime:PythonClass
uid: azure.mgmt.sqlvirtualmachine.types.AutoPatchingSettings
name: AutoPatchingSettings
fullName: azure.mgmt.sqlvirtualmachine.types.AutoPatchingSettings
module: azure.mgmt.sqlvirtualmachine.types
summary: Set a patching window during which Windows and SQL patches will be applied.
constructor:
  syntax: AutoPatchingSettings()
variables:
- description: Enable or disable autopatching on SQL virtual machine.
  name: enable
  types:
  - <xref:bool>
- description: 'Day of week to apply the patch on. Known values are: "Everyday", "Monday",

    "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", and "Sunday".'
  name: day_of_week
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DayOfWeek">]
- description: 'Hour of the day when patching is initiated. Local VM

    time.'
  name: maintenance_window_starting_hour
  types:
  - <xref:int>
- description: Duration of patching.
  name: maintenance_window_duration
  types:
  - <xref:int>
- description: 'Additional Patch to be enable or enabled on the SQL Virtual Machine.

    Known values are: "NotSet" and "MicrosoftUpdate".'
  name: additional_vm_patch
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AdditionalVmPatch">]
attributes:
- uid: azure.mgmt.sqlvirtualmachine.types.AutoPatchingSettings.additionalVmPatch
  name: additionalVmPatch
  summary: 'Additional Patch to be enable or enabled on the SQL Virtual Machine. Known
    values are:

    "NotSet" and "MicrosoftUpdate".'
  signature: 'additionalVmPatch: str | AdditionalVmPatch'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoPatchingSettings.dayOfWeek
  name: dayOfWeek
  summary: '"Everyday", "Monday", "Tuesday",

    "Wednesday", "Thursday", "Friday", "Saturday", and "Sunday".'
  signature: 'dayOfWeek: str | DayOfWeek'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoPatchingSettings.enable
  name: enable
  summary: Enable or disable autopatching on SQL virtual machine.
  signature: 'enable: bool'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoPatchingSettings.maintenanceWindowDuration
  name: maintenanceWindowDuration
  summary: Duration of patching.
  signature: 'maintenanceWindowDuration: int'
- uid: azure.mgmt.sqlvirtualmachine.types.AutoPatchingSettings.maintenanceWindowStartingHour
  name: maintenanceWindowStartingHour
  summary: Hour of the day when patching is initiated. Local VM time.
  signature: 'maintenanceWindowStartingHour: int'
