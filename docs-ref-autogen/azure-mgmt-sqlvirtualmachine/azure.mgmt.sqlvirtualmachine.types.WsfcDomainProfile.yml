### YamlMime:PythonClass
uid: azure.mgmt.sqlvirtualmachine.types.WsfcDomainProfile
name: WsfcDomainProfile
fullName: azure.mgmt.sqlvirtualmachine.types.WsfcDomainProfile
module: azure.mgmt.sqlvirtualmachine.types
summary: Active Directory account details to operate Windows Server Failover Cluster.
constructor:
  syntax: WsfcDomainProfile()
variables:
- description: Fully qualified name of the domain.
  name: domain_fqdn
  types:
  - <xref:str>
- description: Organizational Unit path in which the nodes and cluster will be present.
  name: ou_path
  types:
  - <xref:str>
- description: 'Account name used for creating cluster (at minimum needs

    permissions to ''Create Computer Objects'' in domain).'
  name: cluster_bootstrap_account
  types:
  - <xref:str>
- description: 'Account name used for operating cluster i.e. will be part of

    administrators group on all the participating virtual machines in the cluster.'
  name: cluster_operator_account
  types:
  - <xref:str>
- description: 'Account name under which SQL service will run on all participating

    SQL virtual machines in the cluster.'
  name: sql_service_account
  types:
  - <xref:str>
- description: The flag to check if SQL service account is GMSA.
  name: is_sql_service_account_gmsa
  types:
  - <xref:bool>
- description: Optional path for fileshare witness.
  name: file_share_witness_path
  types:
  - <xref:str>
- description: Fully qualified ARM resource id of the witness storage account.
  name: storage_account_url
  types:
  - <xref:str>
- description: Primary key of the witness storage account.
  name: storage_account_primary_key
  types:
  - <xref:str>
- description: 'Cluster subnet type. Known values are: "SingleSubnet" and

    "MultiSubnet".'
  name: cluster_subnet_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterSubnetType">]
attributes:
- uid: azure.mgmt.sqlvirtualmachine.types.WsfcDomainProfile.clusterBootstrapAccount
  name: clusterBootstrapAccount
  summary: 'Account name used for creating cluster (at minimum needs permissions to
    ''Create Computer

    Objects'' in domain).'
  signature: 'clusterBootstrapAccount: str'
- uid: azure.mgmt.sqlvirtualmachine.types.WsfcDomainProfile.clusterOperatorAccount
  name: clusterOperatorAccount
  summary: 'Account name used for operating cluster i.e. will be part of administrators
    group on all the

    participating virtual machines in the cluster.'
  signature: 'clusterOperatorAccount: str'
- uid: azure.mgmt.sqlvirtualmachine.types.WsfcDomainProfile.clusterSubnetType
  name: clusterSubnetType
  summary: '"SingleSubnet" and "MultiSubnet".'
  signature: 'clusterSubnetType: str | ClusterSubnetType'
- uid: azure.mgmt.sqlvirtualmachine.types.WsfcDomainProfile.domainFqdn
  name: domainFqdn
  summary: Fully qualified name of the domain.
  signature: 'domainFqdn: str'
- uid: azure.mgmt.sqlvirtualmachine.types.WsfcDomainProfile.fileShareWitnessPath
  name: fileShareWitnessPath
  summary: Optional path for fileshare witness.
  signature: 'fileShareWitnessPath: str'
- uid: azure.mgmt.sqlvirtualmachine.types.WsfcDomainProfile.isSqlServiceAccountGmsa
  name: isSqlServiceAccountGmsa
  summary: The flag to check if SQL service account is GMSA.
  signature: 'isSqlServiceAccountGmsa: bool'
- uid: azure.mgmt.sqlvirtualmachine.types.WsfcDomainProfile.ouPath
  name: ouPath
  summary: Organizational Unit path in which the nodes and cluster will be present.
  signature: 'ouPath: str'
- uid: azure.mgmt.sqlvirtualmachine.types.WsfcDomainProfile.sqlServiceAccount
  name: sqlServiceAccount
  summary: 'Account name under which SQL service will run on all participating SQL
    virtual machines in the

    cluster.'
  signature: 'sqlServiceAccount: str'
- uid: azure.mgmt.sqlvirtualmachine.types.WsfcDomainProfile.storageAccountPrimaryKey
  name: storageAccountPrimaryKey
  summary: Primary key of the witness storage account.
  signature: 'storageAccountPrimaryKey: str'
- uid: azure.mgmt.sqlvirtualmachine.types.WsfcDomainProfile.storageAccountUrl
  name: storageAccountUrl
  summary: Fully qualified ARM resource id of the witness storage account.
  signature: 'storageAccountUrl: str'
