### YamlMime:PythonClass
uid: azure.mgmt.sqlvirtualmachine.models.Schedule
name: Schedule
fullName: azure.mgmt.sqlvirtualmachine.models.Schedule
module: azure.mgmt.sqlvirtualmachine.models
summary: Set assessment schedule for SQL Server.
constructor:
  syntax: 'Schedule(*args: Any, **kwargs: Any)'
variables:
- description: Enable or disable assessment schedule on SQL virtual machine.
  name: enable
  types:
  - <xref:bool>
- description: 'Number of weeks to schedule between 2 assessment runs. Takes value
    from

    1-6.'
  name: weekly_interval
  types:
  - <xref:int>
- description: 'Occurrence of the DayOfWeek day within a month to schedule

    assessment. Takes values: 1,2,3,4 and -1. Use -1 for last DayOfWeek day of the
    month.'
  name: monthly_occurrence
  types:
  - <xref:int>
- description: 'Day of the week to run assessment. Known values are: "Monday", "Tuesday",

    "Wednesday", "Thursday", "Friday", "Saturday", and "Sunday".'
  name: day_of_week
  types:
  - <xref:str>
  - <xref:azure.mgmt.sqlvirtualmachine.models.AssessmentDayOfWeek>
- description: Time of the day in HH:mm format. Eg. 17:30.
  name: start_time
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.sqlvirtualmachine.models.Schedule.day_of_week
  name: day_of_week
  summary: '"Monday", "Tuesday", "Wednesday",

    "Thursday", "Friday", "Saturday", and "Sunday".'
  signature: 'day_of_week: str | _models.AssessmentDayOfWeek | None'
- uid: azure.mgmt.sqlvirtualmachine.models.Schedule.enable
  name: enable
  summary: Enable or disable assessment schedule on SQL virtual machine.
  signature: 'enable: bool | None'
- uid: azure.mgmt.sqlvirtualmachine.models.Schedule.monthly_occurrence
  name: monthly_occurrence
  summary: '1,2,3,4

    and -1. Use -1 for last DayOfWeek day of the month.'
  signature: 'monthly_occurrence: int | None'
- uid: azure.mgmt.sqlvirtualmachine.models.Schedule.start_time
  name: start_time
  signature: 'start_time: str | None'
- uid: azure.mgmt.sqlvirtualmachine.models.Schedule.weekly_interval
  name: weekly_interval
  summary: Number of weeks to schedule between 2 assessment runs. Takes value from
    1-6.
  signature: 'weekly_interval: int | None'
