### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer
name: AzureBackupServerContainer
fullName: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer
module: azure.mgmt.recoveryservicesbackup.types
summary: AzureBackupServer (DPMVenus) workload-specific protection container.
constructor:
  syntax: AzureBackupServerContainer()
variables:
- description: Friendly name of the container.
  name: friendlyName
  types:
  - <xref:str>
- description: 'Type of backup management for the container. Known values are:

    "Invalid", "AzureIaasVM", "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage",

    "AzureWorkload", and "DefaultBackup".'
  name: backupManagementType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupManagementType">]
- description: 'Status of registration of the container with the Recovery Services

    Vault.'
  name: registrationStatus
  types:
  - <xref:str>
- description: Status of health of the container.
  name: healthStatus
  types:
  - <xref:str>
- description: Type of the protectable object associated with this container.
  name: protectableObjectType
  types:
  - <xref:str>
- description: Source location of the container.
  name: sourceLocation
  types:
  - <xref:str>
- description: Specifies whether the container is re-registrable.
  name: canReRegister
  types:
  - <xref:bool>
- description: ID of container.
  name: containerId
  types:
  - <xref:str>
- description: Number of protected items in the BackupEngine.
  name: protectedItemCount
  types:
  - <xref:int>
- description: Backup engine Agent version.
  name: dpmAgentVersion
  types:
  - <xref:str>
- description: List of BackupEngines protecting the container.
  name: dpmServers
  types:
  - <xref:list>[<xref:str>]
- description: To check if upgrade available.
  name: upgradeAvailable
  types:
  - <xref:bool>
- description: Protection status of the container.
  name: protectionStatus
  types:
  - <xref:str>
- description: Extended Info of the container.
  name: extendedInfo
  types:
  - <xref:<xref:"DPMContainerExtendedInfo">>
- description: 'Type of the container. The value of this property for: 1. Compute
    Azure VM

    is Microsoft.Compute/virtualMachines 2. Classic Compute Azure VM is

    Microsoft.ClassicCompute/virtualMachines 3. Windows machines (like MAB, DPM etc)
    is Windows 4.

    Azure SQL instance is AzureSqlContainer. 5. Storage containers is StorageContainer.
    6. Azure

    workload Backup is VMAppContainer. Required. AZURE_BACKUP_SERVER_CONTAINER.'
  name: containerType
  types:
  - <xref:typing.Literal>[ProtectableContainerType.AZURE_BACKUP_SERVER_CONTAINER]
attributes:
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.backupManagementType
  name: backupManagementType
  summary: '"Invalid", "AzureIaasVM",

    "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage", "AzureWorkload",
    and

    "DefaultBackup".'
  signature: 'backupManagementType: str | BackupManagementType'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.canReRegister
  name: canReRegister
  summary: Specifies whether the container is re-registrable.
  signature: 'canReRegister: bool'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.containerId
  name: containerId
  summary: ID of container.
  signature: 'containerId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.containerType
  name: containerType
  summary: '1. Compute Azure VM is

    Microsoft.Compute/virtualMachines 2. Classic Compute Azure VM is

    Microsoft.ClassicCompute/virtualMachines 3. Windows machines (like MAB, DPM etc)
    is Windows 4.

    Azure SQL instance is AzureSqlContainer. 5. Storage containers is StorageContainer.
    6. Azure

    workload Backup is VMAppContainer. Required. AZURE_BACKUP_SERVER_CONTAINER.'
  signature: 'containerType: AZURE_BACKUP_SERVER_CONTAINER: ''AzureBackupServerContainer''>]]'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.dpmAgentVersion
  name: dpmAgentVersion
  summary: Backup engine Agent version.
  signature: 'dpmAgentVersion: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.dpmServers
  name: dpmServers
  summary: List of BackupEngines protecting the container.
  signature: 'dpmServers: list[str]'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.extendedInfo
  name: extendedInfo
  summary: Extended Info of the container.
  signature: 'extendedInfo: DPMContainerExtendedInfo'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.friendlyName
  name: friendlyName
  summary: Friendly name of the container.
  signature: 'friendlyName: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.healthStatus
  name: healthStatus
  summary: Status of health of the container.
  signature: 'healthStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.protectableObjectType
  name: protectableObjectType
  summary: Type of the protectable object associated with this container.
  signature: 'protectableObjectType: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.protectedItemCount
  name: protectedItemCount
  summary: Number of protected items in the BackupEngine.
  signature: 'protectedItemCount: int'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.protectionStatus
  name: protectionStatus
  summary: Protection status of the container.
  signature: 'protectionStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.registrationStatus
  name: registrationStatus
  summary: Status of registration of the container with the Recovery Services Vault.
  signature: 'registrationStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.sourceLocation
  name: sourceLocation
  summary: Source location of the container.
  signature: 'sourceLocation: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureBackupServerContainer.upgradeAvailable
  name: upgradeAvailable
  summary: To check if upgrade available.
  signature: 'upgradeAvailable: bool'
