### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.IaasVMRestoreWithRehydrationRequest
name: IaasVMRestoreWithRehydrationRequest
fullName: azure.mgmt.recoveryservicesbackup.types.IaasVMRestoreWithRehydrationRequest
module: azure.mgmt.recoveryservicesbackup.types
summary: IaaS VM workload-specific restore with integrated rehydration of recovery
  point.
constructor:
  syntax: IaasVMRestoreWithRehydrationRequest()
variables:
- description: 'ResourceGuardOperationRequests on which LAC check will be

    performed.'
  name: resourceGuardOperationRequests
  types:
  - <xref:list>[<xref:str>]
- description: ID of the backup copy to be recovered.
  name: recoveryPointId
  types:
  - <xref:str>
- description: 'Type of this recovery. Known values are: "Invalid", "OriginalLocation",

    "AlternateLocation", "RestoreDisks", and "Offline".'
  name: recoveryType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecoveryType">]
- description: Fully qualified ARM ID of the VM which is being recovered.
  name: sourceResourceId
  types:
  - <xref:str>
- description: 'This is the complete ARM Id of the VM that will be created. For

    e.g.

    /subscriptions/{subId}/resourcegroups/{rg}/provider/Microsoft.Compute/virtualmachines/{vm}.'
  name: targetVirtualMachineId
  types:
  - <xref:str>
- description: 'This is the ARM Id of the resource group that you want to create

    for this Virtual machine and other artifacts. For e.g.

    /subscriptions/{subId}/resourcegroups/{rg}.'
  name: targetResourceGroupId
  types:
  - <xref:str>
- description: 'Fully qualified ARM ID of the storage account to which the VM has
    to be

    restored.'
  name: storageAccountId
  types:
  - <xref:str>
- description: 'This is the virtual network Id of the vnet that will be attached to
    the

    virtual machine. User will be validated for join action permissions in the linked
    access.'
  name: virtualNetworkId
  types:
  - <xref:str>
- description: 'Subnet ID, is the subnet ID associated with the to be restored VM.
    For Classic

    VMs it would be {VnetID}/Subnet/{SubnetName} and, for the Azure Resource Manager
    VMs it would

    be ARM resource ID used to represent the subnet.'
  name: subnetId
  types:
  - <xref:str>
- description: 'Fully qualified ARM ID of the domain name to be associated to the
    VM

    being restored. This applies only to Classic Virtual Machines.'
  name: targetDomainNameId
  types:
  - <xref:str>
- description: Region in which the virtual machine is restored.
  name: region
  types:
  - <xref:str>
- description: 'Affinity group associated to VM to be restored. Used only for Classic

    Compute Virtual Machines.'
  name: affinityGroup
  types:
  - <xref:str>
- description: 'Should a new cloud service be created while restoring the VM. If

    this is false, VM will be restored to the same cloud service as it was at the
    time of backup.'
  name: createNewCloudService
  types:
  - <xref:bool>
- description: Original Storage Account Option.
  name: originalStorageAccountOption
  types:
  - <xref:bool>
- description: Details needed if the VM was encrypted at the time of backup.
  name: encryptionDetails
  types:
  - <xref:<xref:"EncryptionDetails">>
- description: List of Disk LUNs for partial restore.
  name: restoreDiskLunList
  types:
  - <xref:list>[<xref:int>]
- description: 'Flag to denote of an Unmanaged disk VM should be restored with

    Managed disks.'
  name: restoreWithManagedDisks
  types:
  - <xref:bool>
- description: 'DiskEncryptionSet''s ID - needed if the VM needs to be encrypted at

    rest during restore with customer managed key.'
  name: diskEncryptionSetId
  types:
  - <xref:str>
- description: Target zone where the VM and its disks should be restored.
  name: zones
  types:
  - <xref:list>[<xref:str>]
- description: Managed Identity information required to access customer storage account.
  name: identityInfo
  types:
  - <xref:<xref:"IdentityInfo">>
- description: 'IaaS VM workload specific restore details for restores using

    managed identity.'
  name: identityBasedRestoreDetails
  types:
  - <xref:<xref:"IdentityBasedRestoreDetails">>
- description: 'Target extended location where the VM should be restored, should be

    null if restore is to be done in public cloud.'
  name: extendedLocation
  types:
  - <xref:<xref:"ExtendedLocation">>
- description: Stores Secured VM Details.
  name: securedVMDetails
  types:
  - <xref:<xref:"SecuredVMDetails">>
- description: 'Specifies target network access settings for disks of VM

    to be restored,.'
  name: targetDiskNetworkAccessSettings
  types:
  - <xref:<xref:"TargetDiskNetworkAccessSettings">>
- description: 'This property will be used as the discriminator for deciding the specific

    types in the polymorphic chain of types. Required. Default value is

    "IaasVMRestoreWithRehydrationRequest".'
  name: objectType
  types:
  - <xref:typing.Literal>["IaasVMRestoreWithRehydrationRequest"]
- description: RP Rehydration Info.
  name: recoveryPointRehydrationInfo
  types:
  - <xref:<xref:"RecoveryPointRehydrationInfo">>
