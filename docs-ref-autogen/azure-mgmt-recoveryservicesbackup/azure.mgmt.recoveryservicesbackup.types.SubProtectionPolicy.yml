### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.SubProtectionPolicy
name: SubProtectionPolicy
fullName: azure.mgmt.recoveryservicesbackup.types.SubProtectionPolicy
module: azure.mgmt.recoveryservicesbackup.types
summary: Sub-protection policy which includes schedule and retention.
constructor:
  syntax: SubProtectionPolicy()
variables:
- description: 'Type of backup policy type. Known values are: "Invalid", "Full",

    "Differential", "Log", "CopyOnlyFull", "Incremental", "SnapshotFull", and

    "SnapshotCopyOnlyFull".'
  name: policyType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PolicyType">]
- description: Backup schedule specified as part of backup policy.
  name: schedulePolicy
  types:
  - <xref:<xref:"SchedulePolicy">>
- description: Retention policy with the details on backup copy retention ranges.
  name: retentionPolicy
  types:
  - <xref:<xref:"RetentionPolicy">>
- description: 'Tiering policy to automatically move RPs to another tier. Key is Target

    Tier, defined in RecoveryPointTierType enum. Tiering policy specifies the criteria
    to move RP

    to the target tier.'
  name: tieringPolicy
  types:
  - <xref:dict>[<xref:str>, <xref:"TieringPolicy">]
- description: 'Snapshot Backup related fields for WorkloadType

    SaPHanaSystem.'
  name: snapshotBackupAdditionalDetails
  types:
  - <xref:<xref:"SnapshotBackupAdditionalDetails">>
attributes:
- uid: azure.mgmt.recoveryservicesbackup.types.SubProtectionPolicy.policyType
  name: policyType
  summary: '"Invalid", "Full", "Differential", "Log",

    "CopyOnlyFull", "Incremental", "SnapshotFull", and "SnapshotCopyOnlyFull".'
  signature: 'policyType: str | PolicyType'
- uid: azure.mgmt.recoveryservicesbackup.types.SubProtectionPolicy.retentionPolicy
  name: retentionPolicy
  summary: Retention policy with the details on backup copy retention ranges.
  signature: 'retentionPolicy: RetentionPolicy'
- uid: azure.mgmt.recoveryservicesbackup.types.SubProtectionPolicy.schedulePolicy
  name: schedulePolicy
  summary: Backup schedule specified as part of backup policy.
  signature: 'schedulePolicy: SchedulePolicy'
- uid: azure.mgmt.recoveryservicesbackup.types.SubProtectionPolicy.snapshotBackupAdditionalDetails
  name: snapshotBackupAdditionalDetails
  summary: Snapshot Backup related fields for WorkloadType SaPHanaSystem.
  signature: 'snapshotBackupAdditionalDetails: SnapshotBackupAdditionalDetails'
- uid: azure.mgmt.recoveryservicesbackup.types.SubProtectionPolicy.tieringPolicy
  name: tieringPolicy
  summary: 'Tiering policy to automatically move RPs to another tier. Key is Target
    Tier, defined in

    RecoveryPointTierType enum. Tiering policy specifies the criteria to move RP to
    the target

    tier.'
  signature: 'tieringPolicy: dict[str, ''TieringPolicy'']'
