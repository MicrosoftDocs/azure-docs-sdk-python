- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.isScheduledForDeferredDelete
  name: isScheduledForDeferredDelete
  summary: Flag to identify whether the DS is scheduled for deferred delete.
  signature: 'isScheduledForDeferredDelete: bool'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.lastRecoveryPoint
  name: lastRecoveryPoint
  summary: Timestamp when the last (latest) backup copy was created for this backup
