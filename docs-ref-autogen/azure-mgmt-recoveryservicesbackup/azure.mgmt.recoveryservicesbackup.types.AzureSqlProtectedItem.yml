  signature: 'lastRecoveryPoint: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.policyId
  name: policyId
  summary: ID of the backup policy with which this item is backed up.
  signature: 'policyId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.policyName
  name: policyName
  summary: Name of the policy used for protection.
  signature: 'policyName: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.protectedItemDataId
  name: protectedItemDataId
  summary: Internal ID of a backup item. Used by Azure SQL Backup engine to contact
    Recovery Services.
  signature: 'protectedItemDataId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.protectedItemType
  name: protectedItemType
  summary: backup item type. Required. Default value is "Microsoft.Sql/servers/databases".
  signature: 'protectedItemType: Required[Literal[''Microsoft.Sql/servers/databases'']]'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.protectionState
  name: protectionState
  summary: '"Invalid", "IRPending",

    "Protected", "ProtectionError", "ProtectionStopped", "ProtectionPaused", and

    "BackupsSuspended".'
  signature: 'protectionState: str | ProtectedItemState'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.resourceGuardOperationRequests
  name: resourceGuardOperationRequests
  summary: ResourceGuardOperationRequests on which LAC check will be performed.
  signature: 'resourceGuardOperationRequests: list[str]'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.softDeleteRetentionPeriodInDays
  name: softDeleteRetentionPeriodInDays
  summary: Soft delete retention period in days.
  signature: 'softDeleteRetentionPeriodInDays: int'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.sourceLocation
  name: sourceLocation
  summary: Source location of the protected item datasource.
  signature: 'sourceLocation: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.sourceResourceId
  name: sourceResourceId
  summary: ARM ID of the resource to be backed up.
  signature: 'sourceResourceId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.sourceSideScanInfo
  name: sourceSideScanInfo
  summary: Source side threat information.
  signature: 'sourceSideScanInfo: SourceSideScanInfo'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.vaultId
  name: vaultId
  summary: ID of the vault which protects this item.
  signature: 'vaultId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureSqlProtectedItem.workloadType
  name: workloadType
  summary: '"Invalid", "VM", "FileFolder",

    "AzureSqlDb", "SQLDB", "Exchange", "Sharepoint", "VMwareVM", "SystemState",

    "Client", "GenericDataSource", "SQLDataBase", "AzureFileShare", "SAPHanaDatabase",

    "SAPAseDatabase", and "SAPHanaDBInstance".'
  signature: 'workloadType: str | DataSourceType'
