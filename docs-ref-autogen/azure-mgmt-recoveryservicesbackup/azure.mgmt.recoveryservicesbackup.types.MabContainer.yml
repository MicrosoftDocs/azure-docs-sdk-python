### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.MabContainer
name: MabContainer
fullName: azure.mgmt.recoveryservicesbackup.types.MabContainer
module: azure.mgmt.recoveryservicesbackup.types
summary: Container with items backed up using MAB backup engine.
constructor:
  syntax: MabContainer()
variables:
- description: Friendly name of the container.
  name: friendlyName
  types:
  - <xref:str>
- description: 'Type of backup management for the container. Known values are:

    "Invalid", "AzureIaasVM", "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage",

    "AzureWorkload", and "DefaultBackup".'
  name: backupManagementType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupManagementType">]
- description: 'Status of registration of the container with the Recovery Services

    Vault.'
  name: registrationStatus
  types:
  - <xref:str>
- description: Status of health of the container.
  name: healthStatus
  types:
  - <xref:str>
- description: Type of the protectable object associated with this container.
  name: protectableObjectType
  types:
  - <xref:str>
- description: Source location of the container.
  name: sourceLocation
  types:
  - <xref:str>
- description: Can the container be registered one more time.
  name: canReRegister
  types:
  - <xref:bool>
- description: ContainerID represents the container.
  name: containerId
  types:
  - <xref:int>
- description: Number of items backed up in this container.
  name: protectedItemCount
  types:
  - <xref:int>
- description: Agent version of this container.
  name: agentVersion
  types:
  - <xref:str>
- description: Additional information for this container.
  name: extendedInfo
  types:
  - <xref:<xref:"MabContainerExtendedInfo">>
- description: Health details on this mab container.
  name: mabContainerHealthDetails
  types:
  - <xref:list>[<xref:"MABContainerHealthDetails">]
- description: Health state of mab container.
  name: containerHealthState
  types:
  - <xref:str>
- description: 'Type of the container. The value of this property for: 1. Compute
    Azure VM

    is Microsoft.Compute/virtualMachines 2. Classic Compute Azure VM is

    Microsoft.ClassicCompute/virtualMachines 3. Windows machines (like MAB, DPM etc)
    is Windows 4.

    Azure SQL instance is AzureSqlContainer. 5. Storage containers is StorageContainer.
    6. Azure

    workload Backup is VMAppContainer. Required. WINDOWS.'
  name: containerType
  types:
  - <xref:typing.Literal>[ProtectableContainerType.WINDOWS]
attributes:
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.agentVersion
  name: agentVersion
  summary: Agent version of this container.
  signature: 'agentVersion: str'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.backupManagementType
  name: backupManagementType
  summary: '"Invalid", "AzureIaasVM",

    "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage", "AzureWorkload",
    and

    "DefaultBackup".'
  signature: 'backupManagementType: str | BackupManagementType'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.canReRegister
  name: canReRegister
  summary: Can the container be registered one more time.
  signature: 'canReRegister: bool'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.containerHealthState
  name: containerHealthState
  summary: Health state of mab container.
  signature: 'containerHealthState: str'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.containerId
  name: containerId
  summary: ContainerID represents the container.
  signature: 'containerId: int'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.containerType
  name: containerType
  summary: '1. Compute Azure VM is

    Microsoft.Compute/virtualMachines 2. Classic Compute Azure VM is

    Microsoft.ClassicCompute/virtualMachines 3. Windows machines (like MAB, DPM etc)
    is Windows 4.

    Azure SQL instance is AzureSqlContainer. 5. Storage containers is StorageContainer.
    6. Azure

    workload Backup is VMAppContainer. Required. WINDOWS.'
  signature: 'containerType: WINDOWS: ''Windows''>]]'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.extendedInfo
  name: extendedInfo
  summary: Additional information for this container.
  signature: 'extendedInfo: MabContainerExtendedInfo'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.friendlyName
  name: friendlyName
  summary: Friendly name of the container.
  signature: 'friendlyName: str'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.healthStatus
  name: healthStatus
  summary: Status of health of the container.
  signature: 'healthStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.mabContainerHealthDetails
  name: mabContainerHealthDetails
  summary: Health details on this mab container.
  signature: 'mabContainerHealthDetails: list[''MABContainerHealthDetails'']'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.protectableObjectType
  name: protectableObjectType
  summary: Type of the protectable object associated with this container.
  signature: 'protectableObjectType: str'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.protectedItemCount
  name: protectedItemCount
  summary: Number of items backed up in this container.
  signature: 'protectedItemCount: int'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.registrationStatus
  name: registrationStatus
  summary: Status of registration of the container with the Recovery Services Vault.
  signature: 'registrationStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainer.sourceLocation
  name: sourceLocation
  summary: Source location of the container.
  signature: 'sourceLocation: str'
