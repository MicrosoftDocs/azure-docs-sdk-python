### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer
name: AzureVMAppContainerProtectionContainer
fullName: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer
module: azure.mgmt.recoveryservicesbackup.types
summary: Container for SQL workloads under Azure Virtual Machines.
constructor:
  syntax: AzureVMAppContainerProtectionContainer()
variables:
- description: Friendly name of the container.
  name: friendlyName
  types:
  - <xref:str>
- description: 'Type of backup management for the container. Known values are:

    "Invalid", "AzureIaasVM", "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage",

    "AzureWorkload", and "DefaultBackup".'
  name: backupManagementType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupManagementType">]
- description: 'Status of registration of the container with the Recovery Services

    Vault.'
  name: registrationStatus
  types:
  - <xref:str>
- description: Status of health of the container.
  name: healthStatus
  types:
  - <xref:str>
- description: Type of the protectable object associated with this container.
  name: protectableObjectType
  types:
  - <xref:str>
- description: Source location of the container.
  name: sourceLocation
  types:
  - <xref:str>
- description: 'ARM ID of the virtual machine represented by this Azure Workload

    Container.'
  name: sourceResourceId
  types:
  - <xref:str>
- description: Time stamp when this container was updated.
  name: lastUpdatedTime
  types:
  - <xref:str>
- description: Additional details of a workload container.
  name: extendedInfo
  types:
  - <xref:<xref:"AzureWorkloadContainerExtendedInfo">>
- description: 'Workload type for which registration was sent. Known values are: "Invalid",

    "VM", "FileFolder", "AzureSqlDb", "SQLDB", "Exchange", "Sharepoint", "VMwareVM",
    "SystemState",

    "Client", "GenericDataSource", "SQLDataBase", "AzureFileShare", "SAPHanaDatabase",

    "SAPAseDatabase", and "SAPHanaDBInstance".'
  name: workloadType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WorkloadType">]
- description: 'Re-Do Operation. Known values are: "Invalid", "Register", "Reregister",

    and "Rehydrate".'
  name: operationType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperationType">]
- description: 'Type of the container. The value of this property for: 1. Compute
    Azure VM

    is Microsoft.Compute/virtualMachines 2. Classic Compute Azure VM is

    Microsoft.ClassicCompute/virtualMachines 3. Windows machines (like MAB, DPM etc)
    is Windows 4.

    Azure SQL instance is AzureSqlContainer. 5. Storage containers is StorageContainer.
    6. Azure

    workload Backup is VMAppContainer. Required. VM_APP_CONTAINER.'
  name: containerType
  types:
  - <xref:typing.Literal>[ProtectableContainerType.VM_APP_CONTAINER]
attributes:
- uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer.backupManagementType
  name: backupManagementType
  summary: '"Invalid", "AzureIaasVM",

    "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage", "AzureWorkload",
    and

    "DefaultBackup".'
  signature: 'backupManagementType: str | BackupManagementType'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer.containerType
  name: containerType
  summary: '1. Compute Azure VM is

    Microsoft.Compute/virtualMachines 2. Classic Compute Azure VM is

    Microsoft.ClassicCompute/virtualMachines 3. Windows machines (like MAB, DPM etc)
    is Windows 4.

    Azure SQL instance is AzureSqlContainer. 5. Storage containers is StorageContainer.
    6. Azure

    workload Backup is VMAppContainer. Required. VM_APP_CONTAINER.'
  signature: 'containerType: VM_APP_CONTAINER: ''VMAppContainer''>]]'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer.extendedInfo
  name: extendedInfo
  summary: Additional details of a workload container.
  signature: 'extendedInfo: AzureWorkloadContainerExtendedInfo'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer.friendlyName
  name: friendlyName
  summary: Friendly name of the container.
  signature: 'friendlyName: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer.healthStatus
  name: healthStatus
  summary: Status of health of the container.
  signature: 'healthStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer.lastUpdatedTime
  name: lastUpdatedTime
  summary: Time stamp when this container was updated.
  signature: 'lastUpdatedTime: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer.operationType
  name: operationType
  summary: '"Invalid", "Register", "Reregister", and

    "Rehydrate".'
  signature: 'operationType: str | OperationType'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer.protectableObjectType
  name: protectableObjectType
  summary: Type of the protectable object associated with this container.
  signature: 'protectableObjectType: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer.registrationStatus
  name: registrationStatus
  summary: Status of registration of the container with the Recovery Services Vault.
  signature: 'registrationStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer.sourceLocation
  name: sourceLocation
  summary: Source location of the container.
  signature: 'sourceLocation: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer.sourceResourceId
  name: sourceResourceId
  summary: ARM ID of the virtual machine represented by this Azure Workload Container.
  signature: 'sourceResourceId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureVMAppContainerProtectionContainer.workloadType
  name: workloadType
  summary: '"Invalid", "VM",

    "FileFolder", "AzureSqlDb", "SQLDB", "Exchange", "Sharepoint", "VMwareVM",

    "SystemState", "Client", "GenericDataSource", "SQLDataBase", "AzureFileShare",

    "SAPHanaDatabase", "SAPAseDatabase", and "SAPHanaDBInstance".'
  signature: 'workloadType: str | WorkloadType'
