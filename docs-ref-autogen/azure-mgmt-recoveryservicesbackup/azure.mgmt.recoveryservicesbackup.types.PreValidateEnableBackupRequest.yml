### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.PreValidateEnableBackupRequest
name: PreValidateEnableBackupRequest
fullName: azure.mgmt.recoveryservicesbackup.types.PreValidateEnableBackupRequest
module: azure.mgmt.recoveryservicesbackup.types
summary: "Contract to validate if backup can be enabled on the given resource in a\
  \ given vault and given\nconfiguration.\nIt will validate followings\n\n1. Vault\
  \ capacity \n\n2. VM is already protected \n\n3. Any VM related configuration passed\
  \ in properties."
constructor:
  syntax: PreValidateEnableBackupRequest()
variables:
- description: 'ProtectedItem Type- VM, SqlDataBase, AzureFileShare etc. Known values
    are:

    "Invalid", "VM", "FileFolder", "AzureSqlDb", "SQLDB", "Exchange", "Sharepoint",
    "VMwareVM",

    "SystemState", "Client", "GenericDataSource", "SQLDataBase", "AzureFileShare",

    "SAPHanaDatabase", "SAPAseDatabase", and "SAPHanaDBInstance".'
  name: resourceType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataSourceType">]
- description: ARM Virtual Machine Id.
  name: resourceId
  types:
  - <xref:str>
- description: ARM id of the Recovery Services Vault.
  name: vaultId
  types:
  - <xref:str>
- description: Configuration of VM if any needs to be validated like OS type etc.
  name: properties
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.recoveryservicesbackup.types.PreValidateEnableBackupRequest.properties
  name: properties
  summary: Configuration of VM if any needs to be validated like OS type etc.
  signature: 'properties: str'
- uid: azure.mgmt.recoveryservicesbackup.types.PreValidateEnableBackupRequest.resourceId
  name: resourceId
  summary: ARM Virtual Machine Id.
  signature: 'resourceId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.PreValidateEnableBackupRequest.resourceType
  name: resourceType
  summary: '"Invalid", "VM",

    "FileFolder", "AzureSqlDb", "SQLDB", "Exchange", "Sharepoint", "VMwareVM",

    "SystemState", "Client", "GenericDataSource", "SQLDataBase", "AzureFileShare",

    "SAPHanaDatabase", "SAPAseDatabase", and "SAPHanaDBInstance".'
  signature: 'resourceType: str | DataSourceType'
- uid: azure.mgmt.recoveryservicesbackup.types.PreValidateEnableBackupRequest.vaultId
  name: vaultId
  summary: ARM id of the Recovery Services Vault.
  signature: 'vaultId: str'
