uid: azure.mgmt.recoveryservicesbackup.types.DataDiskEncryptionSettings
name: DataDiskEncryptionSettings
fullName: azure.mgmt.recoveryservicesbackup.types.DataDiskEncryptionSettings
module: azure.mgmt.recoveryservicesbackup.types
summary: 'Data disk encryption settings for Secured VM. This will be used to provide
  Disk Encryption Set

  Id for each data disk.'
constructor:
  syntax: DataDiskEncryptionSettings()
variables:
- description: 'Per Disk Encryption Set Ids for Secured VM Data Disks. This will

    be used to provide Disk Encryption Set Id for each data disk.'
  name: perDiskEncryptionSetIds
  types:
  - <xref:list>[<xref:"PerDiskEncryptionSetId">]
- description: 'Disk Encryption Set Id for Secured VM Data Disk. This will be

    used for all data disks if perDiskEncryptionSetIds is not provided. If perDiskEncryptionSetIds

    is provided, this will be ignored.'
  name: dataDiskEncryptionSetId
  types:
  - <xref:str>
- description: 'Managed Identity resource Id used to encrypt the data disk

    during restore.'
  name: dataDiskEncryptionIdentity
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.recoveryservicesbackup.types.DataDiskEncryptionSettings.dataDiskEncryptionIdentity
  name: dataDiskEncryptionIdentity
  summary: Managed Identity resource Id used to encrypt the data disk during restore.
  signature: 'dataDiskEncryptionIdentity: str'
- uid: azure.mgmt.recoveryservicesbackup.types.DataDiskEncryptionSettings.dataDiskEncryptionSetId
  name: dataDiskEncryptionSetId
  summary: 'Disk Encryption Set Id for Secured VM Data Disk. This will be used for
    all data disks if

    perDiskEncryptionSetIds is not provided. If perDiskEncryptionSetIds is provided,
    this will be

    ignored.'
  signature: 'dataDiskEncryptionSetId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.DataDiskEncryptionSettings.perDiskEncryptionSetIds
  name: perDiskEncryptionSetIds
  summary: 'Per Disk Encryption Set Ids for Secured VM Data Disks. This will be used
    to provide Disk

