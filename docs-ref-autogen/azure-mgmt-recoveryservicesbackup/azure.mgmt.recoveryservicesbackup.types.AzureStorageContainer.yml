### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer
name: AzureStorageContainer
fullName: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer
module: azure.mgmt.recoveryservicesbackup.types
summary: Azure Storage Account workload-specific container.
constructor:
  syntax: AzureStorageContainer()
variables:
- description: Friendly name of the container.
  name: friendlyName
  types:
  - <xref:str>
- description: 'Type of backup management for the container. Known values are:

    "Invalid", "AzureIaasVM", "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage",

    "AzureWorkload", and "DefaultBackup".'
  name: backupManagementType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupManagementType">]
- description: 'Status of registration of the container with the Recovery Services

    Vault.'
  name: registrationStatus
  types:
  - <xref:str>
- description: Status of health of the container.
  name: healthStatus
  types:
  - <xref:str>
- description: Type of the protectable object associated with this container.
  name: protectableObjectType
  types:
  - <xref:str>
- description: Source location of the container.
  name: sourceLocation
  types:
  - <xref:str>
- description: Fully qualified ARM url.
  name: sourceResourceId
  types:
  - <xref:str>
- description: Storage account version.
  name: storageAccountVersion
  types:
  - <xref:str>
- description: Resource group name of Recovery Services Vault.
  name: resourceGroup
  types:
  - <xref:str>
- description: Number of items backed up in this container.
  name: protectedItemCount
  types:
  - <xref:int>
- description: 'Whether storage account lock is to be acquired for this

    container or not. Known values are: "Acquire" and "NotAcquire".'
  name: acquireStorageAccountLock
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AcquireStorageAccountLock">]
- description: 'Re-Do Operation. Known values are: "Invalid", "Register", "Reregister",

    and "Rehydrate".'
  name: operationType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperationType">]
- description: 'Whether access to the storage account is key-based or identity-based.
    When

    `IdentityBased`, `identityInfo` must be provided to identify the managed identity
    used to

    access the storage account. Known values are: "KeyBased" and "IdentityBased".'
  name: accessType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AccessType">]
- description: Managed identity information required to access the storage account.
  name: identityInfo
  types:
  - <xref:<xref:"IdentityInfo">>
- description: 'Type of the container. The value of this property for: 1. Compute
    Azure VM

    is Microsoft.Compute/virtualMachines 2. Classic Compute Azure VM is

    Microsoft.ClassicCompute/virtualMachines 3. Windows machines (like MAB, DPM etc)
    is Windows 4.

    Azure SQL instance is AzureSqlContainer. 5. Storage containers is StorageContainer.
    6. Azure

    workload Backup is VMAppContainer. Required. STORAGE_CONTAINER.'
  name: containerType
  types:
  - <xref:typing.Literal>[ProtectableContainerType.STORAGE_CONTAINER]
attributes:
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.accessType
  name: accessType
  summary: 'Whether access to the storage account is key-based or identity-based.
    When `IdentityBased`,

    `identityInfo` must be provided to identify the managed identity used to access
    the storage

    account. Known values are: "KeyBased" and "IdentityBased".'
  signature: 'accessType: str | AccessType'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.acquireStorageAccountLock
  name: acquireStorageAccountLock
  summary: 'Whether storage account lock is to be acquired for this container or not.
    Known values are:

    "Acquire" and "NotAcquire".'
  signature: 'acquireStorageAccountLock: str | AcquireStorageAccountLock'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.backupManagementType
  name: backupManagementType
  summary: '"Invalid", "AzureIaasVM",

    "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage", "AzureWorkload",
    and

    "DefaultBackup".'
  signature: 'backupManagementType: str | BackupManagementType'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.containerType
  name: containerType
  summary: '1. Compute Azure VM is

    Microsoft.Compute/virtualMachines 2. Classic Compute Azure VM is

    Microsoft.ClassicCompute/virtualMachines 3. Windows machines (like MAB, DPM etc)
    is Windows 4.

    Azure SQL instance is AzureSqlContainer. 5. Storage containers is StorageContainer.
    6. Azure

    workload Backup is VMAppContainer. Required. STORAGE_CONTAINER.'
  signature: 'containerType: STORAGE_CONTAINER: ''StorageContainer''>]]'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.friendlyName
  name: friendlyName
  summary: Friendly name of the container.
  signature: 'friendlyName: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.healthStatus
  name: healthStatus
  summary: Status of health of the container.
  signature: 'healthStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.identityInfo
  name: identityInfo
  summary: Managed identity information required to access the storage account.
  signature: 'identityInfo: IdentityInfo'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.operationType
  name: operationType
  summary: '"Invalid", "Register", "Reregister", and

    "Rehydrate".'
  signature: 'operationType: str | OperationType'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.protectableObjectType
  name: protectableObjectType
  summary: Type of the protectable object associated with this container.
  signature: 'protectableObjectType: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.protectedItemCount
  name: protectedItemCount
  summary: Number of items backed up in this container.
  signature: 'protectedItemCount: int'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.registrationStatus
  name: registrationStatus
  summary: Status of registration of the container with the Recovery Services Vault.
  signature: 'registrationStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.resourceGroup
  name: resourceGroup
  summary: Resource group name of Recovery Services Vault.
  signature: 'resourceGroup: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.sourceLocation
  name: sourceLocation
  summary: Source location of the container.
  signature: 'sourceLocation: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.sourceResourceId
  name: sourceResourceId
  summary: Fully qualified ARM url.
  signature: 'sourceResourceId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureStorageContainer.storageAccountVersion
  name: storageAccountVersion
  summary: Storage account version.
  signature: 'storageAccountVersion: str'
