### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.MabContainerExtendedInfo
name: MabContainerExtendedInfo
fullName: azure.mgmt.recoveryservicesbackup.types.MabContainerExtendedInfo
module: azure.mgmt.recoveryservicesbackup.types
summary: Additional information of the container.
constructor:
  syntax: MabContainerExtendedInfo()
variables:
- description: Time stamp when this container was refreshed.
  name: lastRefreshedAt
  types:
  - <xref:str>
- description: 'Type of backup items associated with this container. Known values
    are:

    "Invalid", "VM", "FileFolder", "AzureSqlDb", "SQLDB", "Exchange", "Sharepoint",
    "VMwareVM",

    "SystemState", "Client", "GenericDataSource", "SQLDataBase", "AzureFileShare",

    "SAPHanaDatabase", "SAPAseDatabase", and "SAPHanaDBInstance".'
  name: backupItemType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupItemType">]
- description: List of backup items associated with this container.
  name: backupItems
  types:
  - <xref:list>[<xref:str>]
- description: Backup policy associated with this container.
  name: policyName
  types:
  - <xref:str>
- description: Latest backup status of this container.
  name: lastBackupStatus
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainerExtendedInfo.backupItemType
  name: backupItemType
  summary: '"Invalid", "VM",

    "FileFolder", "AzureSqlDb", "SQLDB", "Exchange", "Sharepoint", "VMwareVM",

    "SystemState", "Client", "GenericDataSource", "SQLDataBase", "AzureFileShare",

    "SAPHanaDatabase", "SAPAseDatabase", and "SAPHanaDBInstance".'
  signature: 'backupItemType: str | BackupItemType'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainerExtendedInfo.backupItems
  name: backupItems
  summary: List of backup items associated with this container.
  signature: 'backupItems: list[str]'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainerExtendedInfo.lastBackupStatus
  name: lastBackupStatus
  summary: Latest backup status of this container.
  signature: 'lastBackupStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainerExtendedInfo.lastRefreshedAt
  name: lastRefreshedAt
  summary: Time stamp when this container was refreshed.
  signature: 'lastRefreshedAt: str'
- uid: azure.mgmt.recoveryservicesbackup.types.MabContainerExtendedInfo.policyName
  name: policyName
  summary: Backup policy associated with this container.
  signature: 'policyName: str'
