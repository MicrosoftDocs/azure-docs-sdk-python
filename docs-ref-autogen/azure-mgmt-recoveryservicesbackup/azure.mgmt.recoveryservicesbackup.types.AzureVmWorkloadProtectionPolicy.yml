uid: azure.mgmt.recoveryservicesbackup.types.AzureVmWorkloadProtectionPolicy
name: AzureVmWorkloadProtectionPolicy
fullName: azure.mgmt.recoveryservicesbackup.types.AzureVmWorkloadProtectionPolicy
module: azure.mgmt.recoveryservicesbackup.types
summary: Azure VM (Mercury) workload-specific backup policy.
constructor:
