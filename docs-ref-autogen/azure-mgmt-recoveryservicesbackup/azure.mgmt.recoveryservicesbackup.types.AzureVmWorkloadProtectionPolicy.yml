  name: settings
  types:
  - <xref:<xref:"Settings">>
- description: 'List of sub-protection policies which includes schedule and

    retention.'
  name: subProtectionPolicy
  types:
  - <xref:list>[<xref:"SubProtectionPolicy">]
- description: Fix the policy inconsistency.
  name: makePolicyConsistent
