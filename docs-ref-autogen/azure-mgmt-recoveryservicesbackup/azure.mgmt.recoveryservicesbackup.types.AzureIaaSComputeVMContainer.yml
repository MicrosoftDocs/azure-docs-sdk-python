### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.AzureIaaSComputeVMContainer
name: AzureIaaSComputeVMContainer
fullName: azure.mgmt.recoveryservicesbackup.types.AzureIaaSComputeVMContainer
module: azure.mgmt.recoveryservicesbackup.types
summary: IaaS VM workload-specific backup item representing an Azure Resource Manager
  virtual machine.
constructor:
  syntax: AzureIaaSComputeVMContainer()
variables:
- description: Friendly name of the container.
  name: friendlyName
  types:
  - <xref:str>
- description: 'Type of backup management for the container. Known values are:

    "Invalid", "AzureIaasVM", "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage",

    "AzureWorkload", and "DefaultBackup".'
  name: backupManagementType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupManagementType">]
- description: 'Status of registration of the container with the Recovery Services

    Vault.'
  name: registrationStatus
  types:
  - <xref:str>
- description: Status of health of the container.
  name: healthStatus
  types:
  - <xref:str>
- description: Type of the protectable object associated with this container.
  name: protectableObjectType
  types:
  - <xref:str>
- description: Source location of the container.
  name: sourceLocation
  types:
  - <xref:str>
- description: 'Fully qualified ARM url of the virtual machine represented by this

    Azure IaaS VM container.'
  name: virtualMachineId
  types:
  - <xref:str>
- description: 'Specifies whether the container represents a Classic or an Azure

    Resource Manager VM.'
  name: virtualMachineVersion
  types:
  - <xref:str>
- description: Resource group name of Recovery Services Vault.
  name: resourceGroup
  types:
  - <xref:str>
- description: 'Type of the container. The value of this property for: 1. Compute
    Azure VM

    is Microsoft.Compute/virtualMachines 2. Classic Compute Azure VM is

    Microsoft.ClassicCompute/virtualMachines 3. Windows machines (like MAB, DPM etc)
    is Windows 4.

    Azure SQL instance is AzureSqlContainer. 5. Storage containers is StorageContainer.
    6. Azure

    workload Backup is VMAppContainer. Required. MICROSOFT_COMPUTE_VIRTUAL_MACHINES.'
  name: containerType
  types:
  - <xref:typing.Literal>[ProtectableContainerType.MICROSOFT_COMPUTE_VIRTUAL_MACHINES]
attributes:
- uid: azure.mgmt.recoveryservicesbackup.types.AzureIaaSComputeVMContainer.backupManagementType
  name: backupManagementType
  summary: '"Invalid", "AzureIaasVM",

    "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage", "AzureWorkload",
    and

    "DefaultBackup".'
  signature: 'backupManagementType: str | BackupManagementType'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureIaaSComputeVMContainer.containerType
  name: containerType
  summary: '1. Compute Azure VM is

    Microsoft.Compute/virtualMachines 2. Classic Compute Azure VM is

    Microsoft.ClassicCompute/virtualMachines 3. Windows machines (like MAB, DPM etc)
    is Windows 4.

    Azure SQL instance is AzureSqlContainer. 5. Storage containers is StorageContainer.
    6. Azure

    workload Backup is VMAppContainer. Required. MICROSOFT_COMPUTE_VIRTUAL_MACHINES.'
  signature: 'containerType: Compute/virtualMachines''>]]'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureIaaSComputeVMContainer.friendlyName
  name: friendlyName
  summary: Friendly name of the container.
  signature: 'friendlyName: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureIaaSComputeVMContainer.healthStatus
  name: healthStatus
  summary: Status of health of the container.
  signature: 'healthStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureIaaSComputeVMContainer.protectableObjectType
  name: protectableObjectType
  summary: Type of the protectable object associated with this container.
  signature: 'protectableObjectType: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureIaaSComputeVMContainer.registrationStatus
  name: registrationStatus
  summary: Status of registration of the container with the Recovery Services Vault.
  signature: 'registrationStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureIaaSComputeVMContainer.resourceGroup
  name: resourceGroup
  summary: Resource group name of Recovery Services Vault.
  signature: 'resourceGroup: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureIaaSComputeVMContainer.sourceLocation
  name: sourceLocation
  summary: Source location of the container.
  signature: 'sourceLocation: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureIaaSComputeVMContainer.virtualMachineId
  name: virtualMachineId
  summary: Fully qualified ARM url of the virtual machine represented by this Azure
    IaaS VM container.
  signature: 'virtualMachineId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureIaaSComputeVMContainer.virtualMachineVersion
  name: virtualMachineVersion
  summary: Specifies whether the container represents a Classic or an Azure Resource
    Manager VM.
  signature: 'virtualMachineVersion: str'
