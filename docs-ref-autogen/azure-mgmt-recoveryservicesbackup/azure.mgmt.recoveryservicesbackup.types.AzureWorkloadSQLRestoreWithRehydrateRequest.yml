fullName: azure.mgmt.recoveryservicesbackup.types.AzureWorkloadSQLRestoreWithRehydrateRequest
module: azure.mgmt.recoveryservicesbackup.types
summary: AzureWorkload SQL-specific restore with integrated rehydration of recovery
  point.
constructor:
  syntax: AzureWorkloadSQLRestoreWithRehydrateRequest()
variables:
- description: 'ResourceGuardOperationRequests on which LAC check will be

    performed.'
  name: resourceGuardOperationRequests
  types:
  - <xref:list>[<xref:str>]
- description: 'Type of this recovery. Known values are: "Invalid", "OriginalLocation",

    "AlternateLocation", "RestoreDisks", and "Offline".'
