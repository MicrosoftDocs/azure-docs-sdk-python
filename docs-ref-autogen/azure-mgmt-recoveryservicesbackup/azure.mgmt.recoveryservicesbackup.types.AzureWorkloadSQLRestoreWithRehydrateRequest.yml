  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecoveryType">]
- description: 'Fully qualified ARM ID of the VM on which workload that was running
    is

    being recovered.'
  name: sourceResourceId
  types:
  - <xref:str>
- description: Workload specific property bag.
  name: propertyBag
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Details of target database.
  name: targetInfo
  types:
  - <xref:<xref:"TargetRestoreInfo">>
- description: 'Defines whether the current recovery mode is file restore or database

    restore. Known values are: "Invalid", "FileRecovery", "WorkloadRecovery", "SnapshotAttach",

    "RecoveryUsingSnapshot", and "SnapshotAttachAndRecover".'
  name: recoveryMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecoveryMode">]
- description: Defines the Resource group of the Target VM.
  name: targetResourceGroupName
  types:
  - <xref:str>
- description: 'User Assigned managed identity details Currently used

    for snapshot.'
  name: userAssignedManagedIdentityDetails
  types:
  - <xref:<xref:"UserAssignedManagedIdentityDetails">>
- description: 'Additional details for snapshot recovery Currently used for

    snapshot for SAP Hana.'
  name: snapshotRestoreParameters
  types:
  - <xref:<xref:"SnapshotRestoreParameters">>
- description: 'This is the complete ARM Id of the target VM For e.g.

    /subscriptions/{subId}/resourcegroups/{rg}/provider/Microsoft.Compute/virtualmachines/{vm}.'
  name: targetVirtualMachineId
  types:
  - <xref:str>
- description: 'Default option set to true. If this is set to false,

    alternate data directory must be provided.'
  name: shouldUseAlternateTargetLocation
  types:
  - <xref:bool>
- description: 'SQL specific property where user can chose to set no-recovery when

    restore operation is tried.'
  name: isNonRecoverable
  types:
  - <xref:bool>
- description: Data directory details.
  name: alternateDirectoryPaths
  types:
  - <xref:list>[<xref:"SQLDataDirectoryMapping">]
