### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.AzureIaaSClassicComputeVMProtectedItem
name: AzureIaaSClassicComputeVMProtectedItem
fullName: azure.mgmt.recoveryservicesbackup.types.AzureIaaSClassicComputeVMProtectedItem
module: azure.mgmt.recoveryservicesbackup.types
summary: IaaS VM workload-specific backup item representing the Classic Compute VM.
constructor:
  syntax: AzureIaaSClassicComputeVMProtectedItem()
variables:
- description: 'Type of backup management for the backed up item. Known values are:

    "Invalid", "AzureIaasVM", "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage",

    "AzureWorkload", and "DefaultBackup".'
  name: backupManagementType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupManagementType">]
- description: 'Type of workload this item represents. Known values are: "Invalid",
    "VM",

    "FileFolder", "AzureSqlDb", "SQLDB", "Exchange", "Sharepoint", "VMwareVM", "SystemState",

    "Client", "GenericDataSource", "SQLDataBase", "AzureFileShare", "SAPHanaDatabase",

    "SAPAseDatabase", and "SAPHanaDBInstance".'
  name: workloadType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataSourceType">]
- description: Unique name of container.
  name: containerName
  types:
  - <xref:str>
- description: ARM ID of the resource to be backed up.
  name: sourceResourceId
  types:
  - <xref:str>
- description: ID of the backup policy with which this item is backed up.
  name: policyId
  types:
  - <xref:str>
- description: 'Timestamp when the last (latest) backup copy was created for this

    backup item.'
  name: lastRecoveryPoint
  types:
  - <xref:str>
- description: Name of the backup set the backup item belongs to.
  name: backupSetName
  types:
  - <xref:str>
- description: 'Create mode to indicate recovery of existing soft deleted data source
    or

    creation of new data source. Known values are: "Invalid", "Default", and "Recover".'
  name: createMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CreateMode">]
- description: Time for deferred deletion in UTC.
  name: deferredDeleteTimeInUTC
  types:
  - <xref:str>
- description: 'Flag to identify whether the DS is scheduled for deferred

    delete.'
  name: isScheduledForDeferredDelete
  types:
  - <xref:bool>
- description: 'Time remaining before the DS marked for deferred delete is

    permanently deleted.'
  name: deferredDeleteTimeRemaining
  types:
  - <xref:str>
- description: 'Flag to identify whether the deferred deleted DS is to

    be purged soon.'
  name: isDeferredDeleteScheduleUpcoming
  types:
  - <xref:bool>
- description: Flag to identify that deferred deleted DS is to be moved into Pause
    state.
  name: isRehydrate
  types:
  - <xref:bool>
- description: 'ResourceGuardOperationRequests on which LAC check will be

    performed.'
  name: resourceGuardOperationRequests
  types:
  - <xref:list>[<xref:str>]
- description: Flag to identify whether datasource is protected in archive.
  name: isArchiveEnabled
  types:
  - <xref:bool>
- description: Name of the policy used for protection.
  name: policyName
  types:
  - <xref:str>
- description: Soft delete retention period in days.
  name: softDeleteRetentionPeriodInDays
  types:
  - <xref:int>
- description: Source location of the protected item datasource.
  name: sourceLocation
  types:
  - <xref:str>
- description: ID of the vault which protects this item.
  name: vaultId
  types:
  - <xref:str>
- description: Source side threat information.
  name: sourceSideScanInfo
  types:
  - <xref:<xref:"SourceSideScanInfo">>
- description: Friendly name of the VM represented by this backup item.
  name: friendlyName
  types:
  - <xref:str>
- description: Fully qualified ARM ID of the virtual machine represented by this item.
  name: virtualMachineId
  types:
  - <xref:str>
- description: Backup status of this backup item.
  name: protectionStatus
  types:
  - <xref:str>
- description: 'Backup state of this backup item. Known values are: "Invalid",

    "IRPending", "Protected", "ProtectionError", "ProtectionStopped", "ProtectionPaused",
    and

    "BackupsSuspended".'
  name: protectionState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProtectionState">]
- description: 'Health status of protected item. Known values are: "Passed",

    "ActionRequired", "ActionSuggested", and "Invalid".'
  name: healthStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthStatus">]
- description: Health details on this backup item.
  name: healthDetails
  types:
  - <xref:list>[<xref:"AzureIaaSVMHealthDetails">]
- description: Health details of different KPIs.
  name: kpisHealths
  types:
  - <xref:dict>[<xref:str>, <xref:"KPIResourceHealthDetails">]
- description: Last backup operation status.
  name: lastBackupStatus
  types:
  - <xref:str>
- description: Timestamp of the last backup operation on this backup item.
  name: lastBackupTime
  types:
  - <xref:str>
- description: Data ID of the protected item.
  name: protectedItemDataId
  types:
  - <xref:str>
- description: Additional information for this backup item.
  name: extendedInfo
  types:
  - <xref:<xref:"AzureIaaSVMProtectedItemExtendedInfo">>
- description: Extended Properties for Azure IaasVM Backup.
  name: extendedProperties
  types:
  - <xref:<xref:"ExtendedProperties">>
- description: Type of the policy used for protection.
  name: policyType
  types:
  - <xref:str>
- description: 'backup item type. Required. Default value is

    "Microsoft.ClassicCompute/virtualMachines".'
  name: protectedItemType
  types:
  - <xref:typing.Literal>["Microsoft.ClassicCompute/virtualMachines"]
