### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.GenericContainer
name: GenericContainer
fullName: azure.mgmt.recoveryservicesbackup.types.GenericContainer
module: azure.mgmt.recoveryservicesbackup.types
summary: Base class for generic container of backup items.
constructor:
  syntax: GenericContainer()
variables:
- description: Friendly name of the container.
  name: friendlyName
  types:
  - <xref:str>
- description: 'Type of backup management for the container. Known values are:

    "Invalid", "AzureIaasVM", "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage",

    "AzureWorkload", and "DefaultBackup".'
  name: backupManagementType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupManagementType">]
- description: 'Status of registration of the container with the Recovery Services

    Vault.'
  name: registrationStatus
  types:
  - <xref:str>
- description: Status of health of the container.
  name: healthStatus
  types:
  - <xref:str>
- description: Type of the protectable object associated with this container.
  name: protectableObjectType
  types:
  - <xref:str>
- description: Source location of the container.
  name: sourceLocation
  types:
  - <xref:str>
- description: Name of the container's fabric.
  name: fabricName
  types:
  - <xref:str>
- description: Extended information (not returned in List container API calls).
  name: extendedInformation
  types:
  - <xref:<xref:"GenericContainerExtendedInfo">>
- description: 'Type of the container. The value of this property for: 1. Compute
    Azure VM

    is Microsoft.Compute/virtualMachines 2. Classic Compute Azure VM is

    Microsoft.ClassicCompute/virtualMachines 3. Windows machines (like MAB, DPM etc)
    is Windows 4.

    Azure SQL instance is AzureSqlContainer. 5. Storage containers is StorageContainer.
    6. Azure

    workload Backup is VMAppContainer. Required. GENERIC_CONTAINER.'
  name: containerType
  types:
  - <xref:typing.Literal>[ProtectableContainerType.GENERIC_CONTAINER]
attributes:
- uid: azure.mgmt.recoveryservicesbackup.types.GenericContainer.backupManagementType
  name: backupManagementType
  summary: '"Invalid", "AzureIaasVM",

    "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage", "AzureWorkload",
    and

    "DefaultBackup".'
  signature: 'backupManagementType: str | BackupManagementType'
- uid: azure.mgmt.recoveryservicesbackup.types.GenericContainer.containerType
  name: containerType
  summary: '1. Compute Azure VM is

    Microsoft.Compute/virtualMachines 2. Classic Compute Azure VM is

    Microsoft.ClassicCompute/virtualMachines 3. Windows machines (like MAB, DPM etc)
    is Windows 4.

    Azure SQL instance is AzureSqlContainer. 5. Storage containers is StorageContainer.
    6. Azure

    workload Backup is VMAppContainer. Required. GENERIC_CONTAINER.'
  signature: 'containerType: GENERIC_CONTAINER: ''GenericContainer''>]]'
- uid: azure.mgmt.recoveryservicesbackup.types.GenericContainer.extendedInformation
  name: extendedInformation
  summary: Extended information (not returned in List container API calls).
  signature: 'extendedInformation: GenericContainerExtendedInfo'
- uid: azure.mgmt.recoveryservicesbackup.types.GenericContainer.fabricName
  name: fabricName
  summary: Name of the container's fabric.
  signature: 'fabricName: str'
- uid: azure.mgmt.recoveryservicesbackup.types.GenericContainer.friendlyName
  name: friendlyName
  summary: Friendly name of the container.
  signature: 'friendlyName: str'
- uid: azure.mgmt.recoveryservicesbackup.types.GenericContainer.healthStatus
  name: healthStatus
  summary: Status of health of the container.
  signature: 'healthStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.GenericContainer.protectableObjectType
  name: protectableObjectType
  summary: Type of the protectable object associated with this container.
  signature: 'protectableObjectType: str'
- uid: azure.mgmt.recoveryservicesbackup.types.GenericContainer.registrationStatus
  name: registrationStatus
  summary: Status of registration of the container with the Recovery Services Vault.
  signature: 'registrationStatus: str'
- uid: azure.mgmt.recoveryservicesbackup.types.GenericContainer.sourceLocation
  name: sourceLocation
  summary: Source location of the container.
  signature: 'sourceLocation: str'
