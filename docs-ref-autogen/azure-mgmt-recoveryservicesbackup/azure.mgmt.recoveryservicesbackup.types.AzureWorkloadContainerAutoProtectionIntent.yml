### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.AzureWorkloadContainerAutoProtectionIntent
name: AzureWorkloadContainerAutoProtectionIntent
fullName: azure.mgmt.recoveryservicesbackup.types.AzureWorkloadContainerAutoProtectionIntent
module: azure.mgmt.recoveryservicesbackup.types
summary: Azure workload specific protection intent item.
constructor:
  syntax: AzureWorkloadContainerAutoProtectionIntent()
variables:
- description: 'Type of backup management for the backed up item. Known values are:

    "Invalid", "AzureIaasVM", "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage",

    "AzureWorkload", and "DefaultBackup".'
  name: backupManagementType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupManagementType">]
- description: ARM ID of the resource to be backed up.
  name: sourceResourceId
  types:
  - <xref:str>
- description: 'ID of the item which is getting protected, In case of Azure Vm , it
    is

    ProtectedItemId.'
  name: itemId
  types:
  - <xref:str>
- description: ID of the backup policy with which this item is backed up.
  name: policyId
  types:
  - <xref:str>
- description: 'Backup state of this backup item. Known values are: "Invalid",

    "NotProtected", "Protecting", "Protected", and "ProtectionFailed".'
  name: protectionState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProtectionStatus">]
- description: 'backup protectionIntent type. Required.

    AZURE_WORKLOAD_CONTAINER_AUTO_PROTECTION_INTENT.'
  name: protectionIntentItemType
  types:
  - <xref:typing.Literal>[ProtectionIntentItemType.AZURE_WORKLOAD_CONTAINER_AUTO_PROTECTION_INTENT]
attributes:
- uid: azure.mgmt.recoveryservicesbackup.types.AzureWorkloadContainerAutoProtectionIntent.backupManagementType
  name: backupManagementType
  summary: '"Invalid",

    "AzureIaasVM", "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage",

    "AzureWorkload", and "DefaultBackup".'
  signature: 'backupManagementType: str | BackupManagementType'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureWorkloadContainerAutoProtectionIntent.itemId
  name: itemId
  summary: ID of the item which is getting protected, In case of Azure Vm , it is
    ProtectedItemId.
  signature: 'itemId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureWorkloadContainerAutoProtectionIntent.policyId
  name: policyId
  summary: ID of the backup policy with which this item is backed up.
  signature: 'policyId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureWorkloadContainerAutoProtectionIntent.protectionIntentItemType
  name: protectionIntentItemType
  summary: backup protectionIntent type. Required. AZURE_WORKLOAD_CONTAINER_AUTO_PROTECTION_INTENT.
  signature: 'protectionIntentItemType: AZURE_WORKLOAD_CONTAINER_AUTO_PROTECTION_INTENT:
    ''AzureWorkloadContainerAutoProtectionIntent''>]]'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureWorkloadContainerAutoProtectionIntent.protectionState
  name: protectionState
  summary: '"Invalid", "NotProtected",

    "Protecting", "Protected", and "ProtectionFailed".'
  signature: 'protectionState: str | ProtectionStatus'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureWorkloadContainerAutoProtectionIntent.sourceResourceId
  name: sourceResourceId
  summary: ARM ID of the resource to be backed up.
  signature: 'sourceResourceId: str'
