### YamlMime:PythonClass
uid: azure.mgmt.recoveryservicesbackup.types.AzureResourceProtectionIntent
name: AzureResourceProtectionIntent
fullName: azure.mgmt.recoveryservicesbackup.types.AzureResourceProtectionIntent
module: azure.mgmt.recoveryservicesbackup.types
summary: IaaS VM specific backup protection intent item.
constructor:
  syntax: AzureResourceProtectionIntent()
variables:
- description: 'Type of backup management for the backed up item. Known values are:

    "Invalid", "AzureIaasVM", "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage",

    "AzureWorkload", and "DefaultBackup".'
  name: backupManagementType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupManagementType">]
- description: ARM ID of the resource to be backed up.
  name: sourceResourceId
  types:
  - <xref:str>
- description: 'ID of the item which is getting protected, In case of Azure Vm , it
    is

    ProtectedItemId.'
  name: itemId
  types:
  - <xref:str>
- description: ID of the backup policy with which this item is backed up.
  name: policyId
  types:
  - <xref:str>
- description: 'Backup state of this backup item. Known values are: "Invalid",

    "NotProtected", "Protecting", "Protected", and "ProtectionFailed".'
  name: protectionState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProtectionStatus">]
- description: Friendly name of the VM represented by this backup item.
  name: friendlyName
  types:
  - <xref:str>
- description: backup protectionIntent type. Required. AZURE_RESOURCE_ITEM.
  name: protectionIntentItemType
  types:
  - <xref:typing.Literal>[ProtectionIntentItemType.AZURE_RESOURCE_ITEM]
attributes:
- uid: azure.mgmt.recoveryservicesbackup.types.AzureResourceProtectionIntent.backupManagementType
  name: backupManagementType
  summary: '"Invalid",

    "AzureIaasVM", "MAB", "DPM", "AzureBackupServer", "AzureSql", "AzureStorage",

    "AzureWorkload", and "DefaultBackup".'
  signature: 'backupManagementType: str | BackupManagementType'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureResourceProtectionIntent.friendlyName
  name: friendlyName
  summary: Friendly name of the VM represented by this backup item.
  signature: 'friendlyName: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureResourceProtectionIntent.itemId
  name: itemId
  summary: ID of the item which is getting protected, In case of Azure Vm , it is
    ProtectedItemId.
  signature: 'itemId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureResourceProtectionIntent.policyId
  name: policyId
  summary: ID of the backup policy with which this item is backed up.
  signature: 'policyId: str'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureResourceProtectionIntent.protectionIntentItemType
  name: protectionIntentItemType
  summary: backup protectionIntent type. Required. AZURE_RESOURCE_ITEM.
  signature: 'protectionIntentItemType: AZURE_RESOURCE_ITEM: ''AzureResourceItem''>]]'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureResourceProtectionIntent.protectionState
  name: protectionState
  summary: '"Invalid", "NotProtected",

    "Protecting", "Protected", and "ProtectionFailed".'
  signature: 'protectionState: str | ProtectionStatus'
- uid: azure.mgmt.recoveryservicesbackup.types.AzureResourceProtectionIntent.sourceResourceId
  name: sourceResourceId
  summary: ARM ID of the resource to be backed up.
  signature: 'sourceResourceId: str'
