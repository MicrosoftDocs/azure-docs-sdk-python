### YamlMime:PythonClass
uid: azure.ai.agentserver.invocations.voice.Session
name: Session
fullName: azure.ai.agentserver.invocations.voice.Session
module: azure.ai.agentserver.invocations.voice
summary: '> [!NOTE]

  > This is an experimental class, and may change at any time. Please see [https://aka.ms/azure-ai-agentserver-experimental](https://aka.ms/azure-ai-agentserver-experimental)
  for more information.

  >


  Send-only context for one accepted Voice WebSocket connection.


  `Session` retains only transport write serialization and a terminal write

  gate. Agent code owns response IDs, pending work, generation tasks,

  terminal-event correlation, cancellation, history, and reconnect

  restoration.


  Instances are created by <xref:azure.ai.agentserver.invocations.voice.VoiceAgentServerHost>
  and supplied to

  registered callbacks.'
constructor:
  syntax: Session()
methods:
- uid: azure.ai.agentserver.invocations.voice.Session.send
  name: send
  summary: 'Encode and send one explicit agent-to-Bridge event.


    Concurrent calls are serialized at the WebSocket write boundary. The

    method does not retry, infer commitment, or update protocol state.'
  signature: 'async send(message: SessionReady | SessionRejected | ResponseCreated
    | ResponseNone | ResponseOutputTextDelta | ResponseOutputTextDone | ResponseDone
    | ResponseCancel | EndCall | AgentError) -> None'
  parameters:
  - name: message
    description: One immutable selected outbound message.
    isRequired: true
    types:
    - <xref:OutboundVoiceMessage>
