### YamlMime:PythonClass
uid: azure.ai.agentserver.invocations.voice.VoiceAgentServerHost
name: VoiceAgentServerHost
fullName: azure.ai.agentserver.invocations.voice.VoiceAgentServerHost
module: azure.ai.agentserver.invocations.voice
summary: '> [!NOTE]

  > This is an experimental class, and may change at any time. Please see [https://aka.ms/azure-ai-agentserver-experimental](https://aka.ms/azure-ai-agentserver-experimental)
  for more information.

  >


  Invocations host with typed Voice event decorators.


  The host performs only per-frame decoding and static callback dispatch.

  Agent code owns IDs, application tasks, response lifecycle, terminal-event

  correlation, cancellation, history, and reconnect restoration.'
