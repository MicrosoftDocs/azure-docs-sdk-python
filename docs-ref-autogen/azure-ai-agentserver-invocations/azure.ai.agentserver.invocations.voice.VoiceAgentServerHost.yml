  name: on_connection_terminating
  summary: 'Register a synchronous signal that the connection handler is exiting.


    The host invokes the callback once whenever the connection handler

    unwinds in process. The callback must return promptly, be idempotent,

    and must not send frames. Applications can use it to synchronously

    cancel their connection-owned tasks or set their own stop signals. The

    SDK does not wait for those tasks to finish.'
  signature: 'on_connection_terminating(callback: Callable[[Session], None]) -> Callable[[Session],
    None]'
  parameters:
  - name: callback
    description: Synchronous callback receiving the thin Session.
    isRequired: true
    types:
    - <xref:ConnectionTerminatingCallback>
  return:
    description: The callback, unchanged.
    types:
    - <xref:ConnectionTerminatingCallback>
  exceptions:
  - type: TypeError
    description: If the callback is async or cannot accept Session.
  - type: RuntimeError
    description: If a callback is already registered.
