### YamlMime:PythonClass
uid: azure.mgmt.storagecache.types.PrimingJob
name: PrimingJob
fullName: azure.mgmt.storagecache.types.PrimingJob
module: azure.mgmt.storagecache.types
summary: A priming job instance.
constructor:
  syntax: PrimingJob()
variables:
- description: The priming job name. Required.
  name: priming_job_name
  types:
  - <xref:str>
- description: 'The URL for the priming manifest file to download. This file must

    be readable from the HPC Cache. When the file is in Azure blob storage the URL
    should include a

    Shared Access Signature (SAS) granting read permissions on the blob. Required.'
  name: priming_manifest_url
  types:
  - <xref:str>
- description: The unique identifier of the priming job.
  name: priming_job_id
  types:
  - <xref:str>
- description: 'The state of the priming operation. Known values are: "Queued",

    "Running", "Paused", and "Complete".'
  name: priming_job_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PrimingJobState">]
- description: The status code of the priming job.
  name: priming_job_status
  types:
  - <xref:str>
- description: The job details or error information if any.
  name: priming_job_details
  types:
  - <xref:str>
- description: The current progress of the priming job, as a percentage.
  name: priming_job_percent_complete
  types:
  - <xref:float>
attributes:
- uid: azure.mgmt.storagecache.types.PrimingJob.primingJobDetails
  name: primingJobDetails
  summary: The job details or error information if any.
  signature: 'primingJobDetails: str'
- uid: azure.mgmt.storagecache.types.PrimingJob.primingJobId
  name: primingJobId
  summary: The unique identifier of the priming job.
  signature: 'primingJobId: str'
- uid: azure.mgmt.storagecache.types.PrimingJob.primingJobName
  name: primingJobName
  summary: The priming job name. Required.
  signature: 'primingJobName: Required[str]'
- uid: azure.mgmt.storagecache.types.PrimingJob.primingJobPercentComplete
  name: primingJobPercentComplete
  summary: The current progress of the priming job, as a percentage.
  signature: 'primingJobPercentComplete: float'
- uid: azure.mgmt.storagecache.types.PrimingJob.primingJobState
  name: primingJobState
  summary: '"Queued", "Running", "Paused", and

    "Complete".'
  signature: 'primingJobState: str | PrimingJobState'
- uid: azure.mgmt.storagecache.types.PrimingJob.primingJobStatus
  name: primingJobStatus
  summary: The status code of the priming job.
  signature: 'primingJobStatus: str'
- uid: azure.mgmt.storagecache.types.PrimingJob.primingManifestUrl
  name: primingManifestUrl
  summary: 'The URL for the priming manifest file to download. This file must be readable
    from the HPC

    Cache. When the file is in Azure blob storage the URL should include a Shared
    Access Signature

    (SAS) granting read permissions on the blob. Required.'
  signature: 'primingManifestUrl: Required[str]'
