### YamlMime:PythonClass
uid: azure.mgmt.storagecache.types.AmlFilesystemHealth
name: AmlFilesystemHealth
fullName: azure.mgmt.storagecache.types.AmlFilesystemHealth
module: azure.mgmt.storagecache.types
summary: 'An indication of AML file system health. Gives more information about health
  than just that

  related to provisioning.'
constructor:
  syntax: AmlFilesystemHealth()
variables:
- description: 'List of AML file system health states. Known values are: "Unavailable",

    "Available", "Degraded", "Transitioning", "Maintenance", and "Expanding".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AmlFilesystemHealthStateType">]
- description: Server-defined error code for the AML file system health.
  name: status_code
  types:
  - <xref:str>
- description: Describes the health state.
  name: status_description
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storagecache.types.AmlFilesystemHealth.state
  name: state
  summary: '"Unavailable", "Available",

    "Degraded", "Transitioning", "Maintenance", and "Expanding".'
  signature: 'state: str | AmlFilesystemHealthStateType'
- uid: azure.mgmt.storagecache.types.AmlFilesystemHealth.statusCode
  name: statusCode
  summary: Server-defined error code for the AML file system health.
  signature: 'statusCode: str'
- uid: azure.mgmt.storagecache.types.AmlFilesystemHealth.statusDescription
  name: statusDescription
  summary: Describes the health state.
  signature: 'statusDescription: str'
