### YamlMime:PythonClass
uid: azure.mgmt.storagecache.types.AutoExportJobProperties
name: AutoExportJobProperties
fullName: azure.mgmt.storagecache.types.AutoExportJobProperties
module: azure.mgmt.storagecache.types
summary: Properties of the auto export job.
constructor:
  syntax: AutoExportJobProperties()
variables:
- description: 'ARM provisioning state. Known values are: "Succeeded", "Failed",

    "Creating", "Deleting", "Updating", and "Canceled".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoExportJobProvisioningStateType">]
- description: 'The administrative status of the auto export job. Possible values:

    ''Enable'', ''Disable''. Passing in a value of ''Disable'' will disable the current
    active auto

    export job. By default it is set to ''Enable''. Known values are: "Enable" and
    "Disable".'
  name: admin_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoExportJobAdminStatus">]
- description: 'An array of blob paths/prefixes that get auto exported to the

    cluster namespace. It has ''/'' as the default value. Number of maximum allowed
    paths for now is

    1.'
  name: auto_export_prefixes
  types:
  - <xref:list>[<xref:str>]
- description: The status of the auto export.
  name: status
  types:
  - <xref:<xref:"AutoExportJobPropertiesStatus">>
attributes:
- uid: azure.mgmt.storagecache.types.AutoExportJobProperties.adminStatus
  name: adminStatus
  summary: '''Enable'', ''Disable''. Passing

    in a value of ''Disable'' will disable the current active auto export job. By
    default it is set

    to ''Enable''. Known values are: "Enable" and "Disable".'
  signature: 'adminStatus: str | AutoExportJobAdminStatus'
- uid: azure.mgmt.storagecache.types.AutoExportJobProperties.autoExportPrefixes
  name: autoExportPrefixes
  summary: 'An array of blob paths/prefixes that get auto exported to the cluster
    namespace. It has ''/'' as

    the default value. Number of maximum allowed paths for now is 1.'
  signature: 'autoExportPrefixes: list[str]'
- uid: azure.mgmt.storagecache.types.AutoExportJobProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Creating",

    "Deleting", "Updating", and "Canceled".'
  signature: 'provisioningState: str | AutoExportJobProvisioningStateType'
- uid: azure.mgmt.storagecache.types.AutoExportJobProperties.status
  name: status
  summary: The status of the auto export.
  signature: 'status: AutoExportJobPropertiesStatus'
