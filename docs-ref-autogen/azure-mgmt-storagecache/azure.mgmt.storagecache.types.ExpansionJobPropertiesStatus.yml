### YamlMime:PythonClass
uid: azure.mgmt.storagecache.types.ExpansionJobPropertiesStatus
name: ExpansionJobPropertiesStatus
fullName: azure.mgmt.storagecache.types.ExpansionJobPropertiesStatus
module: azure.mgmt.storagecache.types
summary: The status of the expansion job.
constructor:
  syntax: ExpansionJobPropertiesStatus()
variables:
- description: 'The operational state of the expansion job. InProgress indicates the
    expansion is

    still running. Completed indicates expansion finished successfully. Failed means
    the expansion

    was unable to complete due to a fatal error. Deleting indicates the expansion
    is being rolled

    back. Known values are: "InProgress", "Completed", "Failed", "Deleting", and "RollingBack".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExpansionJobStatusType">]
- description: Server-defined status code for expansion job.
  name: status_code
  types:
  - <xref:str>
- description: Server-defined status message for expansion job.
  name: status_message
  types:
  - <xref:str>
- description: The percentage of expansion job completion.
  name: percent_complete
  types:
  - <xref:float>
- description: The time (in UTC) the expansion job started.
  name: start_time_utc
  types:
  - <xref:str>
- description: 'The time (in UTC) when the expansion job completed. Only populated

    when job reaches a terminal state.'
  name: completion_time_utc
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storagecache.types.ExpansionJobPropertiesStatus.completionTimeUTC
  name: completionTimeUTC
  summary: 'The time (in UTC) when the expansion job completed. Only populated when
    job reaches a terminal

    state.'
  signature: 'completionTimeUTC: str'
- uid: azure.mgmt.storagecache.types.ExpansionJobPropertiesStatus.percentComplete
  name: percentComplete
  summary: The percentage of expansion job completion.
  signature: 'percentComplete: float'
- uid: azure.mgmt.storagecache.types.ExpansionJobPropertiesStatus.startTimeUTC
  name: startTimeUTC
  summary: The time (in UTC) the expansion job started.
  signature: 'startTimeUTC: str'
- uid: azure.mgmt.storagecache.types.ExpansionJobPropertiesStatus.state
  name: state
  summary: 'The operational state of the expansion job. InProgress indicates the expansion
    is still

    running. Completed indicates expansion finished successfully. Failed means the
    expansion was

    unable to complete due to a fatal error. Deleting indicates the expansion is being
    rolled back.

    Known values are: "InProgress", "Completed", "Failed", "Deleting", and "RollingBack".'
  signature: 'state: str | ExpansionJobStatusType'
- uid: azure.mgmt.storagecache.types.ExpansionJobPropertiesStatus.statusCode
  name: statusCode
  summary: Server-defined status code for expansion job.
  signature: 'statusCode: str'
- uid: azure.mgmt.storagecache.types.ExpansionJobPropertiesStatus.statusMessage
  name: statusMessage
  summary: Server-defined status message for expansion job.
  signature: 'statusMessage: str'
