### YamlMime:PythonClass
uid: azure.mgmt.storagecache.types.AmlFilesystemProperties
name: AmlFilesystemProperties
fullName: azure.mgmt.storagecache.types.AmlFilesystemProperties
module: azure.mgmt.storagecache.types
summary: Properties of the AML file system.
constructor:
  syntax: AmlFilesystemProperties()
variables:
- description: 'The size of the AML file system, in TiB. This might be rounded up.

    Required.'
  name: storage_capacity_ti_b
  types:
  - <xref:float>
- description: 'The current storage capacity of the AML file system, in

    TiB. This reflects the actual capacity including any expansions.'
  name: current_storage_capacity_ti_b
  types:
  - <xref:float>
- description: The unique identifier of the AML file system cluster.
  name: cluster_uuid
  types:
  - <xref:str>
- description: Health of the AML file system.
  name: health
  types:
  - <xref:<xref:"AmlFilesystemHealth">>
- description: 'ARM provisioning state. Known values are: "Succeeded", "Failed",

    "Creating", "Deleting", "Updating", and "Canceled".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AmlFilesystemProvisioningStateType">]
- description: 'Subnet used for managing the AML file system and for client-facing

    operations. This subnet should have at least a /24 subnet mask within the VNET''s
    address space.

    Required.'
  name: filesystem_subnet
  types:
  - <xref:str>
- description: Client information for the AML file system.
  name: client_info
  types:
  - <xref:<xref:"AmlFilesystemClientInfo">>
- description: 'Throughput provisioned in MB per sec, calculated as

    storageCapacityTiB * per-unit storage throughput.'
  name: throughput_provisioned_m_bps
  types:
  - <xref:int>
- description: Specifies encryption settings of the AML file system.
  name: encryption_settings
  types:
  - <xref:<xref:"AmlFilesystemEncryptionSettings">>
- description: Start time of a 30-minute weekly maintenance window. Required.
  name: maintenance_window
  types:
  - <xref:<xref:"AmlFilesystemPropertiesMaintenanceWindow">>
- description: Hydration and archive settings and status.
  name: hsm
  types:
  - <xref:<xref:"AmlFilesystemPropertiesHsm">>
- description: Specifies root squash settings of the AML file system.
  name: root_squash_settings
  types:
  - <xref:<xref:"AmlFilesystemRootSquashSettings">>
attributes:
- uid: azure.mgmt.storagecache.types.AmlFilesystemProperties.clientInfo
  name: clientInfo
  summary: Client information for the AML file system.
  signature: 'clientInfo: AmlFilesystemClientInfo'
- uid: azure.mgmt.storagecache.types.AmlFilesystemProperties.clusterUuid
  name: clusterUuid
  summary: The unique identifier of the AML file system cluster.
  signature: 'clusterUuid: str'
- uid: azure.mgmt.storagecache.types.AmlFilesystemProperties.currentStorageCapacityTiB
  name: currentStorageCapacityTiB
  summary: 'The current storage capacity of the AML file system, in TiB. This reflects
    the actual capacity

    including any expansions.'
  signature: 'currentStorageCapacityTiB: float'
- uid: azure.mgmt.storagecache.types.AmlFilesystemProperties.encryptionSettings
  name: encryptionSettings
  summary: Specifies encryption settings of the AML file system.
  signature: 'encryptionSettings: AmlFilesystemEncryptionSettings'
- uid: azure.mgmt.storagecache.types.AmlFilesystemProperties.filesystemSubnet
  name: filesystemSubnet
  summary: 'Subnet used for managing the AML file system and for client-facing operations.
    This subnet

    should have at least a /24 subnet mask within the VNET''s address space. Required.'
  signature: 'filesystemSubnet: Required[str]'
- uid: azure.mgmt.storagecache.types.AmlFilesystemProperties.health
  name: health
  summary: Health of the AML file system.
  signature: 'health: AmlFilesystemHealth'
- uid: azure.mgmt.storagecache.types.AmlFilesystemProperties.hsm
  name: hsm
  summary: Hydration and archive settings and status.
  signature: 'hsm: AmlFilesystemPropertiesHsm'
- uid: azure.mgmt.storagecache.types.AmlFilesystemProperties.maintenanceWindow
  name: maintenanceWindow
  summary: Start time of a 30-minute weekly maintenance window. Required.
  signature: 'maintenanceWindow: Required[AmlFilesystemPropertiesMaintenanceWindow]'
- uid: azure.mgmt.storagecache.types.AmlFilesystemProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Creating",

    "Deleting", "Updating", and "Canceled".'
  signature: 'provisioningState: str | AmlFilesystemProvisioningStateType'
- uid: azure.mgmt.storagecache.types.AmlFilesystemProperties.rootSquashSettings
  name: rootSquashSettings
  summary: Specifies root squash settings of the AML file system.
  signature: 'rootSquashSettings: AmlFilesystemRootSquashSettings'
- uid: azure.mgmt.storagecache.types.AmlFilesystemProperties.storageCapacityTiB
  name: storageCapacityTiB
  summary: The size of the AML file system, in TiB. This might be rounded up. Required.
  signature: 'storageCapacityTiB: Required[float]'
- uid: azure.mgmt.storagecache.types.AmlFilesystemProperties.throughputProvisionedMBps
  name: throughputProvisionedMBps
  summary: 'Throughput provisioned in MB per sec, calculated as storageCapacityTiB
    * per-unit storage

    throughput.'
  signature: 'throughputProvisionedMBps: int'
