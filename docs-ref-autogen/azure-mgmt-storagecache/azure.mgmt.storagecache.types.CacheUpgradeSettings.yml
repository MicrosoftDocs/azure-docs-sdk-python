summary: Cache Upgrade Settings.
constructor:
  syntax: CacheUpgradeSettings()
variables:
- description: 'True if the user chooses to select an installation time between

    now and firmwareUpdateDeadline. Else the firmware will automatically be installed
    after

    firmwareUpdateDeadline if not triggered earlier via the upgrade operation.'
  name: upgrade_schedule_enabled
  types:
  - <xref:bool>
- description: 'When upgradeScheduleEnabled is true, this field holds the user-chosen

    upgrade time. At the user-chosen time, the firmware update will automatically
    be installed on

    the cache.'
  name: scheduled_time
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storagecache.types.CacheUpgradeSettings.scheduledTime
  name: scheduledTime
  summary: 'When upgradeScheduleEnabled is true, this field holds the user-chosen
    upgrade time. At the

    user-chosen time, the firmware update will automatically be installed on the cache.'
  signature: 'scheduledTime: str'
- uid: azure.mgmt.storagecache.types.CacheUpgradeSettings.upgradeScheduleEnabled
  name: upgradeScheduleEnabled
  summary: 'True if the user chooses to select an installation time between now and
    firmwareUpdateDeadline.

    Else the firmware will automatically be installed after firmwareUpdateDeadline
    if not triggered

    earlier via the upgrade operation.'
  signature: 'upgradeScheduleEnabled: bool'
