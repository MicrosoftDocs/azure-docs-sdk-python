    found.'
  signature: 'currentIterationFilesDiscovered: int'
- uid: azure.mgmt.storagecache.types.AutoExportJobPropertiesStatus.currentIterationFilesExported
  name: currentIterationFilesExported
  summary: Files that have been exported in current iteration.
  signature: 'currentIterationFilesExported: int'
- uid: azure.mgmt.storagecache.types.AutoExportJobPropertiesStatus.currentIterationFilesFailed
  name: currentIterationFilesFailed
  summary: Files failed to export in current iteration.
  signature: 'currentIterationFilesFailed: int'
- uid: azure.mgmt.storagecache.types.AutoExportJobPropertiesStatus.currentIterationMiBDiscovered
  name: currentIterationMiBDiscovered
  summary: 'Data (in MiB) discovered for export in current iteration. It may increase
