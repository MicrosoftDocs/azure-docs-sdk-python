    for details.'
  signature: 'lastSuccessfulIterationCompletionTimeUTC: str'
- uid: azure.mgmt.storagecache.types.AutoExportJobPropertiesStatus.state
  name: state
  summary: 'The operational state of auto export. InProgress indicates the export
    is running.  Disabling

    indicates the user has requested to disable the export but the disabling is still
    in progress.

    Disabled indicates auto export has been disabled.  DisableFailed indicates the
    disabling has

    failed.  Failed means the export was unable to continue, due to a fatal error.
    Known values

    are: "InProgress", "Disabling", "Disabled", "DisableFailed", and "Failed".'
  signature: 'state: str | AutoExportStatusType'
- uid: azure.mgmt.storagecache.types.AutoExportJobPropertiesStatus.statusCode
  name: statusCode
  summary: Server-defined status code for auto export job.
  signature: 'statusCode: str'
