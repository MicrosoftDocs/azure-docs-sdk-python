  name: totalFilesExported
  summary: 'Total files exported since the start of the export. This is accumulative,
    some files may be

    counted repeatedly.'
  signature: 'totalFilesExported: int'
- uid: azure.mgmt.storagecache.types.AutoExportJobPropertiesStatus.totalFilesFailed
  name: totalFilesFailed
  summary: 'Total files failed to be export since the last successfully completed
