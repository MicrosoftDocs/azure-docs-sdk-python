    accumulative, some files may be counted repeatedly.'
  signature: 'totalFilesFailed: int'
- uid: azure.mgmt.storagecache.types.AutoExportJobPropertiesStatus.totalMiBExported
  name: totalMiBExported
  summary: 'Total data (in MiB) exported since the start of the export. This is accumulative,
    some files

    may be counted repeatedly.'
  signature: 'totalMiBExported: int'
