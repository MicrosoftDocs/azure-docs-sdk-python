    items are found.'
  signature: 'currentIterationMiBDiscovered: int'
- uid: azure.mgmt.storagecache.types.AutoExportJobPropertiesStatus.currentIterationMiBExported
  name: currentIterationMiBExported
  summary: Data (in MiB) that have been exported in current iteration.
  signature: 'currentIterationMiBExported: int'
- uid: azure.mgmt.storagecache.types.AutoExportJobPropertiesStatus.exportIterationCount
  name: exportIterationCount
  summary: Number of iterations completed since the start of the export.
  signature: 'exportIterationCount: int'
- uid: azure.mgmt.storagecache.types.AutoExportJobPropertiesStatus.lastCompletionTimeUTC
  name: lastCompletionTimeUTC
  summary: The time (in UTC) of the last completed auto export job.
  signature: 'lastCompletionTimeUTC: str'
- uid: azure.mgmt.storagecache.types.AutoExportJobPropertiesStatus.lastStartedTimeUTC
  name: lastStartedTimeUTC
  summary: The time (in UTC) the latest auto export job started.
  signature: 'lastStartedTimeUTC: str'
- uid: azure.mgmt.storagecache.types.AutoExportJobPropertiesStatus.lastSuccessfulIterationCompletionTimeUTC
  name: lastSuccessfulIterationCompletionTimeUTC
  summary: 'Time (in UTC) of the last successfully completed export iteration. Look
