### YamlMime:PythonClass
uid: azure.mgmt.storagecache.types.CacheUpgradeStatus
name: CacheUpgradeStatus
fullName: azure.mgmt.storagecache.types.CacheUpgradeStatus
module: azure.mgmt.storagecache.types
summary: Properties describing the software upgrade state of the cache.
constructor:
  syntax: CacheUpgradeStatus()
variables:
- description: 'Version string of the firmware currently installed on this

    cache.'
  name: current_firmware_version
  types:
  - <xref:str>
- description: 'True if there is a firmware update ready to install on this

    cache. The firmware will automatically be installed after firmwareUpdateDeadline
    if not

    triggered earlier via the upgrade operation. Known values are: "available" and
    "unavailable".'
  name: firmware_update_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FirmwareStatusType">]
- description: 'Time at which the pending firmware update will automatically be

    installed on the cache.'
  name: firmware_update_deadline
  types:
  - <xref:str>
- description: Time of the last successful firmware update.
  name: last_firmware_update
  types:
  - <xref:str>
- description: 'When firmwareUpdateAvailable is true, this field holds the

    version string for the update.'
  name: pending_firmware_version
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storagecache.types.CacheUpgradeStatus.currentFirmwareVersion
  name: currentFirmwareVersion
  summary: Version string of the firmware currently installed on this cache.
  signature: 'currentFirmwareVersion: str'
- uid: azure.mgmt.storagecache.types.CacheUpgradeStatus.firmwareUpdateDeadline
  name: firmwareUpdateDeadline
  summary: Time at which the pending firmware update will automatically be installed
    on the cache.
  signature: 'firmwareUpdateDeadline: str'
- uid: azure.mgmt.storagecache.types.CacheUpgradeStatus.firmwareUpdateStatus
  name: firmwareUpdateStatus
  summary: 'True if there is a firmware update ready to install on this cache. The
    firmware will

    automatically be installed after firmwareUpdateDeadline if not triggered earlier
    via the

    upgrade operation. Known values are: "available" and "unavailable".'
  signature: 'firmwareUpdateStatus: str | FirmwareStatusType'
- uid: azure.mgmt.storagecache.types.CacheUpgradeStatus.lastFirmwareUpdate
  name: lastFirmwareUpdate
  summary: Time of the last successful firmware update.
  signature: 'lastFirmwareUpdate: str'
- uid: azure.mgmt.storagecache.types.CacheUpgradeStatus.pendingFirmwareVersion
  name: pendingFirmwareVersion
  summary: When firmwareUpdateAvailable is true, this field holds the version string
    for the update.
  signature: 'pendingFirmwareVersion: str'
