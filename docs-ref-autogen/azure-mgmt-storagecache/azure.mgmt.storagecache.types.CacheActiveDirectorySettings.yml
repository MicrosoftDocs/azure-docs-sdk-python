### YamlMime:PythonClass
uid: azure.mgmt.storagecache.types.CacheActiveDirectorySettings
name: CacheActiveDirectorySettings
fullName: azure.mgmt.storagecache.types.CacheActiveDirectorySettings
module: azure.mgmt.storagecache.types
summary: Active Directory settings used to join a cache to a domain.
constructor:
  syntax: CacheActiveDirectorySettings()
variables:
- description: 'Primary DNS IP address used to resolve the Active Directory

    domain controller''s fully qualified domain name. Required.'
  name: primary_dns_ip_address
  types:
  - <xref:str>
- description: 'Secondary DNS IP address used to resolve the Active Directory

    domain controller''s fully qualified domain name.'
  name: secondary_dns_ip_address
  types:
  - <xref:str>
- description: 'The fully qualified domain name of the Active Directory domain controller.

    Required.'
  name: domain_name
  types:
  - <xref:str>
- description: The Active Directory domain's NetBIOS name. Required.
  name: domain_net_bios_name
  types:
  - <xref:str>
- description: 'The NetBIOS name to assign to the HPC Cache when it joins the Active

    Directory domain as a server. Length must 1-15 characters from the class [-0-9a-zA-Z].

    Required.'
  name: cache_net_bios_name
  types:
  - <xref:str>
- description: 'True if the HPC Cache is joined to the Active Directory domain. Known

    values are: "Yes", "No", and "Error".'
  name: domain_joined
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DomainJoinedType">]
- description: Active Directory admin credentials used to join the HPC Cache to a
    domain.
  name: credentials
  types:
  - <xref:<xref:"CacheActiveDirectorySettingsCredentials">>
attributes:
- uid: azure.mgmt.storagecache.types.CacheActiveDirectorySettings.cacheNetBiosName
  name: cacheNetBiosName
  summary: 'The NetBIOS name to assign to the HPC Cache when it joins the Active Directory
    domain as a

    server. Length must 1-15 characters from the class [-0-9a-zA-Z]. Required.'
  signature: 'cacheNetBiosName: Required[str]'
- uid: azure.mgmt.storagecache.types.CacheActiveDirectorySettings.credentials
  name: credentials
  summary: Active Directory admin credentials used to join the HPC Cache to a domain.
  signature: 'credentials: CacheActiveDirectorySettingsCredentials'
- uid: azure.mgmt.storagecache.types.CacheActiveDirectorySettings.domainJoined
  name: domainJoined
  summary: '"Yes",

    "No", and "Error".'
  signature: 'domainJoined: str | DomainJoinedType'
- uid: azure.mgmt.storagecache.types.CacheActiveDirectorySettings.domainName
  name: domainName
  summary: The fully qualified domain name of the Active Directory domain controller.
    Required.
  signature: 'domainName: Required[str]'
- uid: azure.mgmt.storagecache.types.CacheActiveDirectorySettings.domainNetBiosName
  name: domainNetBiosName
  summary: The Active Directory domain's NetBIOS name. Required.
  signature: 'domainNetBiosName: Required[str]'
- uid: azure.mgmt.storagecache.types.CacheActiveDirectorySettings.primaryDnsIpAddress
  name: primaryDnsIpAddress
  summary: 'Primary DNS IP address used to resolve the Active Directory domain controller''s
    fully qualified

    domain name. Required.'
  signature: 'primaryDnsIpAddress: Required[str]'
- uid: azure.mgmt.storagecache.types.CacheActiveDirectorySettings.secondaryDnsIpAddress
  name: secondaryDnsIpAddress
  summary: 'Secondary DNS IP address used to resolve the Active Directory domain controller''s
    fully

    qualified domain name.'
  signature: 'secondaryDnsIpAddress: str'
