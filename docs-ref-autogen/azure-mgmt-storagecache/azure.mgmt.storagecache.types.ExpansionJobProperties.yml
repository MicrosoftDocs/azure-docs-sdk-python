### YamlMime:PythonClass
uid: azure.mgmt.storagecache.types.ExpansionJobProperties
name: ExpansionJobProperties
fullName: azure.mgmt.storagecache.types.ExpansionJobProperties
module: azure.mgmt.storagecache.types
summary: Properties of the expansion job.
constructor:
  syntax: ExpansionJobProperties()
variables:
- description: 'ARM provisioning state, see

    [https://github.com/Azure/azure-resource-manager-rpc/blob/master/v1.0/Addendum.md#provisioningstate-property](https://github.com/Azure/azure-resource-manager-rpc/blob/master/v1.0/Addendum.md#provisioningstate-property).

    Known values are: "Succeeded", "Failed", "Creating", "Deleting", "Updating", and
    "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExpansionJobPropertiesProvisioningState">]
- description: 'The new storage capacity in TiB for the AML file system after

    expansion. This must be a multiple of the Sku step size, and greater than the
    current storage

    capacity of the AML file system.'
  name: newStorageCapacityTiB
  types:
  - <xref:float>
- description: The status of the expansion job.
  name: status
  types:
  - <xref:<xref:"ExpansionJobPropertiesStatus">>
- description: 'When true, expansion creates a RebalanceJob after completing. Optional,

    defaults to true.'
  name: runRebalanceJob
  types:
  - <xref:bool>
- description: 'Fully qualified ARM resource ID of the child rebalance job created
    by

    this expansion. Populated after RebalanceJob is created.'
  name: rebalanceJobId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storagecache.types.ExpansionJobProperties.newStorageCapacityTiB
  name: newStorageCapacityTiB
  summary: 'The new storage capacity in TiB for the AML file system after expansion.
    This must be a

    multiple of the Sku step size, and greater than the current storage capacity of
    the AML file

    system.'
  signature: 'newStorageCapacityTiB: float'
- uid: azure.mgmt.storagecache.types.ExpansionJobProperties.provisioningState
  name: provisioningState
  summary: 'ARM provisioning state, see

    [https://github.com/Azure/azure-resource-manager-rpc/blob/master/v1.0/Addendum.md#provisioningstate-property](https://github.com/Azure/azure-resource-manager-rpc/blob/master/v1.0/Addendum.md#provisioningstate-property).

    Known values are: "Succeeded", "Failed", "Creating", "Deleting", "Updating", and

    "Canceled".'
  signature: 'provisioningState: str | ExpansionJobPropertiesProvisioningState'
- uid: azure.mgmt.storagecache.types.ExpansionJobProperties.rebalanceJobId
  name: rebalanceJobId
  summary: 'Fully qualified ARM resource ID of the child rebalance job created by
    this expansion. Populated

    after RebalanceJob is created.'
  signature: 'rebalanceJobId: str'
- uid: azure.mgmt.storagecache.types.ExpansionJobProperties.runRebalanceJob
  name: runRebalanceJob
  summary: When true, expansion creates a RebalanceJob after completing. Optional,
    defaults to true.
  signature: 'runRebalanceJob: bool'
- uid: azure.mgmt.storagecache.types.ExpansionJobProperties.status
  name: status
  summary: The status of the expansion job.
  signature: 'status: ExpansionJobPropertiesStatus'
