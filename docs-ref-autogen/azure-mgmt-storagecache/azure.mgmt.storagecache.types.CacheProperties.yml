  name: encryptionSettings
  summary: Specifies encryption settings of the cache.
  signature: 'encryptionSettings: CacheEncryptionSettings'
- uid: azure.mgmt.storagecache.types.CacheProperties.health
  name: health
  summary: Health of the cache.
  signature: 'health: CacheHealth'
