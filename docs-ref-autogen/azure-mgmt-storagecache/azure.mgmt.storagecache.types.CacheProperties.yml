  name: upgradeSettings
  summary: Upgrade settings of the cache.
  signature: 'upgradeSettings: CacheUpgradeSettings'
- uid: azure.mgmt.storagecache.types.CacheProperties.upgradeStatus
  name: upgradeStatus
  summary: Upgrade status of the cache.
  signature: 'upgradeStatus: CacheUpgradeStatus'
