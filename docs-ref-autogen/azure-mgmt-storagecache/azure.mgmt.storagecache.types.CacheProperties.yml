  name: cacheSizeGB
  summary: The size of this Cache, in GB.
  signature: 'cacheSizeGB: int'
- uid: azure.mgmt.storagecache.types.CacheProperties.directoryServicesSettings
  name: directoryServicesSettings
  summary: Specifies Directory Services settings of the cache.
  signature: 'directoryServicesSettings: CacheDirectorySettings'
