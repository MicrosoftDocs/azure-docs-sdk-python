  name: mountAddresses
  summary: Array of IPv4 addresses that can be used by clients mounting this cache.
  signature: 'mountAddresses: list[str]'
- uid: azure.mgmt.storagecache.types.CacheProperties.networkSettings
  name: networkSettings
  summary: Specifies network settings of the cache.
  signature: 'networkSettings: CacheNetworkSettings'
