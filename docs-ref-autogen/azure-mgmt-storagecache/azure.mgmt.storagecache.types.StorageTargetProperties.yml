### YamlMime:PythonClass
uid: azure.mgmt.storagecache.types.StorageTargetProperties
name: StorageTargetProperties
fullName: azure.mgmt.storagecache.types.StorageTargetProperties
module: azure.mgmt.storagecache.types
summary: Properties of the Storage Target.
constructor:
  syntax: StorageTargetProperties()
variables:
- description: List of cache namespace junctions to target for namespace associations.
  name: junctions
  types:
  - <xref:list>[<xref:"NamespaceJunction">]
- description: 'Type of the Storage Target. Required. Known values are: "nfs3", "clfs",

    "unknown", and "blobNfs".'
  name: target_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageTargetType">]
- description: 'ARM provisioning state, see

    [https://github.com/Azure/azure-resource-manager-rpc/blob/master/v1.0/Addendum.md#provisioningstate-property](https://github.com/Azure/azure-resource-manager-rpc/blob/master/v1.0/Addendum.md#provisioningstate-property).

    Known values are: "Succeeded", "Failed", "Canceled", "Creating", "Deleting", and
    "Updating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningStateType">]
- description: 'Storage target operational state. Known values are: "Ready", "Busy",
    "Suspended",

    and "Flushing".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperationalStateType">]
- description: Properties when targetType is nfs3.
  name: nfs3
  types:
  - <xref:<xref:"Nfs3Target">>
- description: Properties when targetType is clfs.
  name: clfs
  types:
  - <xref:<xref:"ClfsTarget">>
- description: Properties when targetType is unknown.
  name: unknown
  types:
  - <xref:<xref:"UnknownTarget">>
- description: Properties when targetType is blobNfs.
  name: blob_nfs
  types:
  - <xref:<xref:"BlobNfsTarget">>
- description: The percentage of cache space allocated for this storage target.
  name: allocation_percentage
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.storagecache.types.StorageTargetProperties.allocationPercentage
  name: allocationPercentage
  summary: The percentage of cache space allocated for this storage target.
  signature: 'allocationPercentage: int'
- uid: azure.mgmt.storagecache.types.StorageTargetProperties.blobNfs
  name: blobNfs
  summary: Properties when targetType is blobNfs.
  signature: 'blobNfs: BlobNfsTarget'
- uid: azure.mgmt.storagecache.types.StorageTargetProperties.clfs
  name: clfs
  summary: Properties when targetType is clfs.
  signature: 'clfs: ClfsTarget'
- uid: azure.mgmt.storagecache.types.StorageTargetProperties.junctions
  name: junctions
  summary: List of cache namespace junctions to target for namespace associations.
  signature: 'junctions: list[''NamespaceJunction'']'
- uid: azure.mgmt.storagecache.types.StorageTargetProperties.nfs3
  name: nfs3
  summary: Properties when targetType is nfs3.
  signature: 'nfs3: Nfs3Target'
- uid: azure.mgmt.storagecache.types.StorageTargetProperties.provisioningState
  name: provisioningState
  summary: 'ARM provisioning state, see

    [https://github.com/Azure/azure-resource-manager-rpc/blob/master/v1.0/Addendum.md#provisioningstate-property](https://github.com/Azure/azure-resource-manager-rpc/blob/master/v1.0/Addendum.md#provisioningstate-property).

    Known values are: "Succeeded", "Failed", "Canceled", "Creating", "Deleting", and

    "Updating".'
  signature: 'provisioningState: str | ProvisioningStateType'
- uid: azure.mgmt.storagecache.types.StorageTargetProperties.state
  name: state
  summary: '"Ready", "Busy", "Suspended", and

    "Flushing".'
  signature: 'state: str | OperationalStateType'
- uid: azure.mgmt.storagecache.types.StorageTargetProperties.targetType
  name: targetType
  summary: '"nfs3", "clfs", "unknown", and

    "blobNfs".'
  signature: 'targetType: Required[str | StorageTargetType]'
- uid: azure.mgmt.storagecache.types.StorageTargetProperties.unknown
  name: unknown
  summary: Properties when targetType is unknown.
  signature: 'unknown: UnknownTarget'
