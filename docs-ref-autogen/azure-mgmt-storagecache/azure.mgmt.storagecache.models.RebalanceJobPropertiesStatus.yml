### YamlMime:PythonClass
uid: azure.mgmt.storagecache.models.RebalanceJobPropertiesStatus
name: RebalanceJobPropertiesStatus
fullName: azure.mgmt.storagecache.models.RebalanceJobPropertiesStatus
module: azure.mgmt.storagecache.models
summary: The status of the rebalance job.
constructor:
  syntax: 'RebalanceJobPropertiesStatus(*args: Any, **kwargs: Any)'
variables:
- description: 'The operational state of the rebalance job. InProgress indicates the
    rebalance is

    running on the cluster. Cancelling indicates a cancel has been requested. Canceled
    indicates

    the rebalance was cancelled. Completed indicates the rebalance finished successfully.
    Failed

    indicates the rebalance was unable to complete due to a fatal error. Deleting
    indicates the job

    is being cleaned up during deletion. RollingBack indicates the orchestrator is
    rolling back

    provisioned resources after a failure. Known values are: "InProgress", "Cancelling",

    "Canceled", "Completed", "Failed", "Deleting", and "RollingBack".'
  name: state
  types:
  - <xref:str>
  - <xref:azure.mgmt.storagecache.models.RebalanceJobStatusType>
- description: Server-defined status code for rebalance job.
  name: status_code
  types:
  - <xref:str>
- description: Server-defined status message for rebalance job.
  name: status_message
  types:
  - <xref:str>
- description: The percentage of rebalance job completion.
  name: percent_complete
  types:
  - <xref:float>
- description: 'The balance percentage (0-100). Represents cumulative progress since
    the

    rebalance started. Reported in periodic rebalance status updates. Resets to 0
    if the rebalancer

    node restarts.'
  name: balance_percent
  types:
  - <xref:float>
- description: 'Estimated remaining time in seconds. Omitted during initial

    assessment before the rebalancer has enough data to estimate.'
  name: estimated_remaining_seconds
  types:
  - <xref:int>
- description: 'Total number of files migrated since the rebalance started. Counts

    OST-phase (data) work items. Reported in periodic rebalance status updates. Resets
    to 0 if the

    rebalancer node restarts.'
  name: files_migrated
  types:
  - <xref:int>
- description: 'Total number of directories migrated since the rebalance started.
    Counts

    MDT-phase (metadata) work items, reported separately from filesMigrated (OST-phase
    data

    migrations). Reported in periodic rebalance status updates. Resets to 0 if the
    rebalancer node

    restarts.'
  name: dirs_migrated
  types:
  - <xref:int>
- description: 'Total number of bytes moved since the rebalance started. Reported
    in

    periodic rebalance status updates. Resets to 0 if the rebalancer node restarts.'
  name: bytes_moved
  types:
  - <xref:int>
- description: 'Average files moved per second over the most recent reporting

    interval.'
  name: files_moved_per_second
  types:
  - <xref:float>
- description: 'Average throughput in mebibytes per second (1024x1024 bytes per

    second) over the most recent reporting interval.'
  name: throughput_mi_bps
  types:
  - <xref:float>
- description: 'Total cumulative non-skip errors since the rebalance started. Reported
    in

    periodic rebalance status updates. Resets to 0 if the rebalancer node restarts.'
  name: total_errors
  types:
  - <xref:int>
- description: 'Total cumulative benign skips since the rebalance started: files

    intentionally not migrated (for example, a lost migration lease or a stale layout),
    as distinct

    from the hard failures counted in totalErrors. Reported in periodic rebalance
    status updates.

    Resets to 0 if the rebalancer node restarts.'
  name: total_skipped
  types:
  - <xref:int>
- description: The time (in UTC) the rebalance job started.
  name: start_time_utc
  types:
  - <xref:datetime.datetime>
- description: 'The time (in UTC) when the rebalance job completed. Only populated

    when the job reaches a terminal state (Completed, Failed, or Canceled).'
  name: completion_time_utc
  types:
  - <xref:datetime.datetime>
