### YamlMime:PythonEnum
uid: azure.mgmt.storagecache.models.RebalanceJobStatusType
name: RebalanceJobStatusType
fullName: azure.mgmt.storagecache.models.RebalanceJobStatusType
summary: 'The operational state of the rebalance job. InProgress indicates the rebalance
  is running on

  the cluster. Cancelling indicates a cancel has been requested. Canceled indicates
  the rebalance

  was cancelled. Completed indicates the rebalance finished successfully (imbalance
  below low

  watermark). Failed indicates the rebalance was unable to complete due to a fatal
  error.

  Deleting indicates the job is being cleaned up during deletion. RollingBack indicates
  the

  orchestrator is rolling back provisioned resources after a failure.'
module: azure.mgmt.storagecache.models
