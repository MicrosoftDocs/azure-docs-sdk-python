### YamlMime:PythonClass
uid: azure.mgmt.resource.resources.models.ExportTemplateRequest
name: ExportTemplateRequest
fullName: azure.mgmt.resource.resources.models.ExportTemplateRequest
module: azure.mgmt.resource.resources.models
summary: Export resource group template request parameters.
constructor:
  syntax: 'ExportTemplateRequest(*args: Any, **kwargs: Any)'
variables:
- description: 'The IDs of the resources to filter the export by. To export all resources,

    supply an array with single entry ''*''.'
  name: resources
  types:
  - <xref:list>[<xref:str>]
- description: 'The export template options. A CSV-formatted list containing zero
    or more of the

    following: ''IncludeParameterDefaultValue'', ''IncludeComments'',

    ''SkipResourceNameParameterization'', ''SkipAllParameterization''.'
  name: options
  types:
  - <xref:str>
- description: 'The output format for the exported resources. Known values are: "Json"
    and

    "Bicep".'
  name: output_format
  types:
  - <xref:str>
  - <xref:azure.mgmt.resource.resources.models.ExportTemplateOutputFormat>
attributes:
- uid: azure.mgmt.resource.resources.models.ExportTemplateRequest.options
  name: options
  summary: 'The export template options. A CSV-formatted list containing zero or more
    of the following:

    ''IncludeParameterDefaultValue'', ''IncludeComments'', ''SkipResourceNameParameterization'',

    ''SkipAllParameterization''.'
  signature: 'options: str | None'
- uid: azure.mgmt.resource.resources.models.ExportTemplateRequest.output_format
  name: output_format
  summary: '"Json" and "Bicep".'
  signature: 'output_format: str | _models.ExportTemplateOutputFormat | None'
- uid: azure.mgmt.resource.resources.models.ExportTemplateRequest.resources
  name: resources
  summary: 'The IDs of the resources to filter the export by. To export all resources,
