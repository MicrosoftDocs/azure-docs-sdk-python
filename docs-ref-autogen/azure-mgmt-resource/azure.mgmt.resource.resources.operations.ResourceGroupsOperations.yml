- uid: azure.mgmt.resource.resources.operations.ResourceGroupsOperations.begin_delete
  name: begin_delete
  summary: 'Deletes a resource group.


    When you delete a resource group, all of its resources are also deleted. Deleting
    a resource

    group deletes all of its template deployments and currently stored operations.'
  signature: 'begin_delete(resource_group_name: str, *, force_deletion_types: str
    | None = None, **kwargs: Any) -> LROPoller[None]'
  parameters:
  - name: resource_group_name
    description: 'The name of the resource group to get. The name is case

      insensitive. Required.'
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: force_deletion_types
    description: 'The resource types you want to force delete. Currently, only the

      following is supported:

      forceDeletionTypes=Microsoft.Compute/virtualMachines,Microsoft.Compute/virtualMachineScaleSets.

      Default value is None.'
    defaultValue: None
    types:
    - <xref:str>
  return:
    description: An instance of LROPoller that returns None
    types:
    - <xref:azure.core.polling.LROPoller>[<xref:None>]
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
