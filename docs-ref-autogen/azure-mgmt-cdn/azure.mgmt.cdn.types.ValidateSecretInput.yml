### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.ValidateSecretInput
name: ValidateSecretInput
fullName: azure.mgmt.cdn.types.ValidateSecretInput
module: azure.mgmt.cdn.types
summary: Input of the secret to be validated.
constructor:
  syntax: ValidateSecretInput()
variables:
- description: 'The secret type. Required. Known values are: "UrlSigningKey",

    "CustomerCertificate", "ManagedCertificate", and "AzureFirstPartyManagedCertificate".'
  name: secret_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecretType">]
- description: 'Resource reference to the Azure Key Vault secret. Expected to be in
    format

    of

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}/secrets/{secretName}.

    Required.'
  name: secret_source
  types:
  - <xref:<xref:"ResourceReference">>
- description: Secret version, if customer is using a specific version.
  name: secret_version
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cdn.types.ValidateSecretInput.secretSource
  name: secretSource
  summary: 'Resource reference to the Azure Key Vault secret. Expected to be in format
    of

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}/secrets/{secretName}.

    Required.'
  signature: 'secretSource: ResourceReference'
- uid: azure.mgmt.cdn.types.ValidateSecretInput.secretType
  name: secretType
  summary: '"UrlSigningKey", "CustomerCertificate",

    "ManagedCertificate", and "AzureFirstPartyManagedCertificate".'
  signature: 'secretType: str | SecretType'
- uid: azure.mgmt.cdn.types.ValidateSecretInput.secretVersion
  name: secretVersion
  summary: Secret version, if customer is using a specific version.
  signature: 'secretVersion: str'
