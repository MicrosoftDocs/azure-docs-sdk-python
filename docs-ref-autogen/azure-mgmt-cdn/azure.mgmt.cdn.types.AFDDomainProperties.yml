### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.AFDDomainProperties
name: AFDDomainProperties
fullName: azure.mgmt.cdn.types.AFDDomainProperties
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties of the domain to create.
constructor:
  syntax: AFDDomainProperties()
variables:
- description: The name of the profile which holds the domain.
  name: profile_name
  types:
  - <xref:str>
- description: 'The configuration specifying how to enable HTTPS for the domain -
    using

    AzureFrontDoor managed certificate or user''s own certificate. If not specified,
    enabling ssl

    uses AzureFrontDoor managed certificate by default.'
  name: tls_settings
  types:
  - <xref:<xref:"AFDDomainHttpsParameters">>
- description: Resource reference to the Azure DNS zone.
  name: azure_dns_zone
  types:
  - <xref:<xref:"ResourceReference">>
- description: 'Resource reference to the Azure resource where

    custom domain ownership was prevalidated.'
  name: pre_validated_custom_domain_resource_id
  types:
  - <xref:<xref:"ResourceReference">>
- description: 'Provisioning status. Known values are: "Succeeded", "Failed",

    "Updating", "Deleting", and "Creating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AfdProvisioningState">]
- description: 'Known values are: "NotStarted", "InProgress", "Succeeded", and

    "Failed".'
  name: deployment_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentStatus">]
- description: 'Provisioning substate shows the progress of custom HTTPS

    enabling/disabling process step by step. DCV stands for DomainControlValidation.
    Known values

    are: "Unknown", "Submitting", "Pending", "Rejected", "TimedOut", "PendingRevalidation",

    "Approved", "RefreshingValidationToken", and "InternalError".'
  name: domain_validation_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DomainValidationState">]
- description: The host name of the domain. Must be a domain name. Required.
  name: host_name
  types:
  - <xref:str>
- description: Key-Value pair representing migration properties for domains.
  name: extended_properties
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Values the customer needs to validate domain ownership.
  name: validation_properties
  types:
  - <xref:<xref:"DomainValidationProperties">>
attributes:
- uid: azure.mgmt.cdn.types.AFDDomainProperties.azureDnsZone
  name: azureDnsZone
  summary: Resource reference to the Azure DNS zone.
  signature: 'azureDnsZone: ResourceReference'
- uid: azure.mgmt.cdn.types.AFDDomainProperties.deploymentStatus
  name: deploymentStatus
  summary: '"NotStarted", "InProgress", "Succeeded", and "Failed".'
  signature: 'deploymentStatus: str | DeploymentStatus'
- uid: azure.mgmt.cdn.types.AFDDomainProperties.domainValidationState
  name: domainValidationState
  summary: 'Provisioning substate shows the progress of custom HTTPS enabling/disabling
    process step by

    step. DCV stands for DomainControlValidation. Known values are: "Unknown", "Submitting",

    "Pending", "Rejected", "TimedOut", "PendingRevalidation", "Approved",

    "RefreshingValidationToken", and "InternalError".'
  signature: 'domainValidationState: str | DomainValidationState'
- uid: azure.mgmt.cdn.types.AFDDomainProperties.extendedProperties
  name: extendedProperties
  summary: Key-Value pair representing migration properties for domains.
  signature: 'extendedProperties: dict[str, str]'
- uid: azure.mgmt.cdn.types.AFDDomainProperties.hostName
  name: hostName
  summary: The host name of the domain. Must be a domain name. Required.
  signature: 'hostName: Required[str]'
- uid: azure.mgmt.cdn.types.AFDDomainProperties.preValidatedCustomDomainResourceId
  name: preValidatedCustomDomainResourceId
  summary: Resource reference to the Azure resource where custom domain ownership
    was prevalidated.
  signature: 'preValidatedCustomDomainResourceId: ResourceReference'
- uid: azure.mgmt.cdn.types.AFDDomainProperties.profileName
  name: profileName
  summary: The name of the profile which holds the domain.
  signature: 'profileName: str'
- uid: azure.mgmt.cdn.types.AFDDomainProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Updating", "Deleting",

    and "Creating".'
  signature: 'provisioningState: str | AfdProvisioningState'
- uid: azure.mgmt.cdn.types.AFDDomainProperties.tlsSettings
  name: tlsSettings
  summary: 'The configuration specifying how to enable HTTPS for the domain - using
    AzureFrontDoor managed

    certificate or user''s own certificate. If not specified, enabling ssl uses AzureFrontDoor

    managed certificate by default.'
  signature: 'tlsSettings: AFDDomainHttpsParameters'
- uid: azure.mgmt.cdn.types.AFDDomainProperties.validationProperties
  name: validationProperties
  summary: Values the customer needs to validate domain ownership.
  signature: 'validationProperties: DomainValidationProperties'
