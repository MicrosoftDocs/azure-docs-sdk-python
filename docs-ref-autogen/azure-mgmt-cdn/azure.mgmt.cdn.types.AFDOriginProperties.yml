### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.AFDOriginProperties
name: AFDOriginProperties
fullName: azure.mgmt.cdn.types.AFDOriginProperties
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties of the origin.
constructor:
  syntax: AFDOriginProperties()
variables:
- description: The name of the origin group which contains this origin.
  name: origin_group_name
  types:
  - <xref:str>
- description: Resource reference to the Azure origin resource.
  name: azure_origin
  types:
  - <xref:<xref:"ResourceReference">>
- description: 'The address of the origin. Domain names, IPv4 addresses, and IPv6
    addresses

    are supported.This should be unique across all origins in an endpoint.'
  name: host_name
  types:
  - <xref:str>
- description: The value of the HTTP port. Must be between 1 and 65535.
  name: http_port
  types:
  - <xref:int>
- description: The value of the HTTPS port. Must be between 1 and 65535.
  name: https_port
  types:
  - <xref:int>
- description: 'The host header value sent to the origin with each request. If you

    leave this blank, the request hostname determines this value. Azure Front Door
    origins, such as

    Web Apps, Blob Storage, and Cloud Services require this host header value to match
    the origin

    hostname by default. This overrides the host header defined at Endpoint.'
  name: origin_host_header
  types:
  - <xref:str>
- description: 'Priority of origin in given origin group for load balancing. Higher
    priorities

    will not be used for load balancing if any lower priority origin is healthy.Must
    be between 1

    and 5.'
  name: priority
  types:
  - <xref:int>
- description: 'Weight of the origin in given origin group for load balancing. Must
    be between 1

    and 1000.'
  name: weight
  types:
  - <xref:int>
- description: 'The properties of the private link resource for private

    origin.'
  name: shared_private_link_resource
  types:
  - <xref:<xref:"SharedPrivateLinkResourceProperties">>
- description: 'Whether to enable health probes to be made against backends defined
    under

    backendPools. Health probes can only be disabled if there is a single enabled
    backend in single

    enabled backend pool. Known values are: "Enabled" and "Disabled".'
  name: enabled_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EnabledState">]
- description: Whether to enable certificate name check at origin level.
  name: enforce_certificate_name_check
  types:
  - <xref:bool>
- description: 'Provisioning status. Known values are: "Succeeded", "Failed",

    "Updating", "Deleting", and "Creating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AfdProvisioningState">]
- description: 'Known values are: "NotStarted", "InProgress", "Succeeded", and

    "Failed".'
  name: deployment_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentStatus">]
attributes:
- uid: azure.mgmt.cdn.types.AFDOriginProperties.azureOrigin
  name: azureOrigin
  summary: Resource reference to the Azure origin resource.
  signature: 'azureOrigin: ResourceReference'
- uid: azure.mgmt.cdn.types.AFDOriginProperties.deploymentStatus
  name: deploymentStatus
  summary: '"NotStarted", "InProgress", "Succeeded", and "Failed".'
  signature: 'deploymentStatus: str | DeploymentStatus'
- uid: azure.mgmt.cdn.types.AFDOriginProperties.enabledState
  name: enabledState
  summary: 'Whether to enable health probes to be made against backends defined under
    backendPools. Health

    probes can only be disabled if there is a single enabled backend in single enabled
    backend

    pool. Known values are: "Enabled" and "Disabled".'
  signature: 'enabledState: str | EnabledState'
- uid: azure.mgmt.cdn.types.AFDOriginProperties.enforceCertificateNameCheck
  name: enforceCertificateNameCheck
  summary: Whether to enable certificate name check at origin level.
  signature: 'enforceCertificateNameCheck: bool'
- uid: azure.mgmt.cdn.types.AFDOriginProperties.hostName
  name: hostName
  summary: 'The address of the origin. Domain names, IPv4 addresses, and IPv6 addresses
    are supported.This

    should be unique across all origins in an endpoint.'
  signature: 'hostName: str'
- uid: azure.mgmt.cdn.types.AFDOriginProperties.httpPort
  name: httpPort
  summary: The value of the HTTP port. Must be between 1 and 65535.
  signature: 'httpPort: int'
- uid: azure.mgmt.cdn.types.AFDOriginProperties.httpsPort
  name: httpsPort
  summary: The value of the HTTPS port. Must be between 1 and 65535.
  signature: 'httpsPort: int'
- uid: azure.mgmt.cdn.types.AFDOriginProperties.originGroupName
  name: originGroupName
  summary: The name of the origin group which contains this origin.
  signature: 'originGroupName: str'
- uid: azure.mgmt.cdn.types.AFDOriginProperties.originHostHeader
  name: originHostHeader
  summary: 'The host header value sent to the origin with each request. If you leave
    this blank, the

    request hostname determines this value. Azure Front Door origins, such as Web
    Apps, Blob

    Storage, and Cloud Services require this host header value to match the origin
    hostname by

    default. This overrides the host header defined at Endpoint.'
  signature: 'originHostHeader: str'
- uid: azure.mgmt.cdn.types.AFDOriginProperties.priority
  name: priority
  summary: 'Priority of origin in given origin group for load balancing. Higher priorities
    will not be used

    for load balancing if any lower priority origin is healthy.Must be between 1 and
    5.'
  signature: 'priority: int'
- uid: azure.mgmt.cdn.types.AFDOriginProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Updating", "Deleting",

    and "Creating".'
  signature: 'provisioningState: str | AfdProvisioningState'
- uid: azure.mgmt.cdn.types.AFDOriginProperties.sharedPrivateLinkResource
  name: sharedPrivateLinkResource
  summary: The properties of the private link resource for private origin.
  signature: 'sharedPrivateLinkResource: SharedPrivateLinkResourceProperties'
- uid: azure.mgmt.cdn.types.AFDOriginProperties.weight
  name: weight
  summary: Weight of the origin in given origin group for load balancing. Must be
    between 1 and 1000.
  signature: 'weight: int'
