### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.HealthProbeParameters
name: HealthProbeParameters
fullName: azure.mgmt.cdn.types.HealthProbeParameters
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties to send health probes to origin.
constructor:
  syntax: HealthProbeParameters()
variables:
- description: 'The path relative to the origin that is used to determine the health
    of the

    origin.'
  name: probe_path
  types:
  - <xref:str>
- description: 'The type of health probe request that is made. Known values are:

    "NotSet", "GET", and "HEAD".'
  name: probe_request_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthProbeRequestType">]
- description: 'Protocol to use for health probe. Known values are: "NotSet", "Http",
    and

    "Https".'
  name: probe_protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProbeProtocol">]
- description: The number of seconds between health probes.Default is 240sec.
  name: probe_interval_in_seconds
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.cdn.types.HealthProbeParameters.probeIntervalInSeconds
  name: probeIntervalInSeconds
  summary: The number of seconds between health probes.Default is 240sec.
  signature: 'probeIntervalInSeconds: int'
- uid: azure.mgmt.cdn.types.HealthProbeParameters.probePath
  name: probePath
  summary: The path relative to the origin that is used to determine the health of
    the origin.
  signature: 'probePath: str'
- uid: azure.mgmt.cdn.types.HealthProbeParameters.probeProtocol
  name: probeProtocol
  summary: '"NotSet", "Http", and "Https".'
  signature: 'probeProtocol: str | ProbeProtocol'
- uid: azure.mgmt.cdn.types.HealthProbeParameters.probeRequestType
  name: probeRequestType
  summary: '"NotSet", "GET", and

    "HEAD".'
  signature: 'probeRequestType: str | HealthProbeRequestType'
