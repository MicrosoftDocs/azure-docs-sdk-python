### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.AFDEndpointProperties
name: AFDEndpointProperties
fullName: azure.mgmt.cdn.types.AFDEndpointProperties
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties required to create an endpoint.
constructor:
  syntax: AFDEndpointProperties()
variables:
- description: The name of the profile which holds the endpoint.
  name: profile_name
  types:
  - <xref:str>
- description: 'Whether to enable use of this rule. Permitted values are ''Enabled''
    or

    ''Disabled''. Known values are: "Enabled" and "Disabled".'
  name: enabled_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EnabledState">]
- description: 'Provisioning status. Known values are: "Succeeded", "Failed",

    "Updating", "Deleting", and "Creating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AfdProvisioningState">]
- description: 'Known values are: "NotStarted", "InProgress", "Succeeded", and

    "Failed".'
  name: deployment_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentStatus">]
- description: 'The host name of the endpoint structured as {endpointName}.{DNSZone},
    e.g.

    contoso.azureedge.net.'
  name: host_name
  types:
  - <xref:str>
- description: 'Indicates the endpoint name reuse scope. The

    default value is TenantReuse. Known values are: "TenantReuse", "SubscriptionReuse",

    "ResourceGroupReuse", and "NoReuse".'
  name: auto_generated_domain_name_label_scope
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoGeneratedDomainNameLabelScope">]
attributes:
- uid: azure.mgmt.cdn.types.AFDEndpointProperties.autoGeneratedDomainNameLabelScope
  name: autoGeneratedDomainNameLabelScope
  summary: 'Indicates the endpoint name reuse scope. The default value is TenantReuse.
    Known values are:

    "TenantReuse", "SubscriptionReuse", "ResourceGroupReuse", and "NoReuse".'
  signature: 'autoGeneratedDomainNameLabelScope: str | AutoGeneratedDomainNameLabelScope'
- uid: azure.mgmt.cdn.types.AFDEndpointProperties.deploymentStatus
  name: deploymentStatus
  summary: '"NotStarted", "InProgress", "Succeeded", and "Failed".'
  signature: 'deploymentStatus: str | DeploymentStatus'
- uid: azure.mgmt.cdn.types.AFDEndpointProperties.enabledState
  name: enabledState
  summary: 'Whether to enable use of this rule. Permitted values are ''Enabled'' or
    ''Disabled''. Known values

    are: "Enabled" and "Disabled".'
  signature: 'enabledState: str | EnabledState'
- uid: azure.mgmt.cdn.types.AFDEndpointProperties.hostName
  name: hostName
  summary: 'The host name of the endpoint structured as {endpointName}.{DNSZone},
    e.g.

    contoso.azureedge.net.'
  signature: 'hostName: str'
- uid: azure.mgmt.cdn.types.AFDEndpointProperties.profileName
  name: profileName
  summary: The name of the profile which holds the endpoint.
  signature: 'profileName: str'
- uid: azure.mgmt.cdn.types.AFDEndpointProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Updating", "Deleting",

    and "Creating".'
  signature: 'provisioningState: str | AfdProvisioningState'
