uid: azure.mgmt.cdn.types.SecretProperties
name: SecretProperties
fullName: azure.mgmt.cdn.types.SecretProperties
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties of the Secret to create.
constructor:
  syntax: SecretProperties()
variables:
- description: 'Provisioning status. Known values are: "Succeeded", "Failed",

    "Updating", "Deleting", and "Creating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AfdProvisioningState">]
- description: 'Known values are: "NotStarted", "InProgress", "Succeeded", and

    "Failed".'
  name: deployment_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentStatus">]
- description: The name of the profile which holds the secret.
  name: profile_name
  types:
  - <xref:str>
- description: object which contains secret parameters.
  name: parameters
  types:
  - <xref:<xref:"SecretParameters">>
attributes:
- uid: azure.mgmt.cdn.types.SecretProperties.parameters
  name: parameters
  summary: object which contains secret parameters.
  signature: 'parameters: SecretParameters'
- uid: azure.mgmt.cdn.types.SecretProperties.profileName
  name: profileName
  summary: The name of the profile which holds the secret.
  signature: 'profileName: str'
- uid: azure.mgmt.cdn.types.SecretProperties.deploymentStatus
  name: deploymentStatus
  signature: 'deploymentStatus: str | DeploymentStatus'
- uid: azure.mgmt.cdn.types.SecretProperties.provisioningState
  name: provisioningState
  signature: 'provisioningState: str | AfdProvisioningState'
