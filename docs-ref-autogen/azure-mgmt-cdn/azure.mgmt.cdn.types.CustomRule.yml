### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.CustomRule
name: CustomRule
fullName: azure.mgmt.cdn.types.CustomRule
module: azure.mgmt.cdn.types
summary: Defines the common attributes for a custom rule that can be included in a
  waf policy.
constructor:
  syntax: CustomRule()
variables:
- description: Defines the name of the custom rule. Required.
  name: name
  types:
  - <xref:str>
- description: 'Describes if the custom rule is in enabled or disabled state. Defaults
    to

    Enabled if not specified. Known values are: "Disabled" and "Enabled".'
  name: enabled_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CustomRuleEnabledState">]
- description: 'Defines in what order this rule be evaluated in the overall list of
    custom

    rules. Required.'
  name: priority
  types:
  - <xref:int>
- description: List of match conditions. Required.
  name: match_conditions
  types:
  - <xref:list>[<xref:"MatchCondition">]
- description: 'Describes what action to be applied when rule matches. Required. Known
    values

    are: "Allow", "Block", "Log", and "Redirect".'
  name: action
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActionType">]
attributes:
- uid: azure.mgmt.cdn.types.CustomRule.action
  name: action
  summary: '"Allow",

    "Block", "Log", and "Redirect".'
  signature: 'action: Required[str | ActionType]'
- uid: azure.mgmt.cdn.types.CustomRule.enabledState
  name: enabledState
  summary: 'Describes if the custom rule is in enabled or disabled state. Defaults
    to Enabled if not

    specified. Known values are: "Disabled" and "Enabled".'
  signature: 'enabledState: str | CustomRuleEnabledState'
- uid: azure.mgmt.cdn.types.CustomRule.matchConditions
  name: matchConditions
  summary: List of match conditions. Required.
  signature: 'matchConditions: Required[list[''MatchCondition'']]'
- uid: azure.mgmt.cdn.types.CustomRule.name
  name: name
  summary: Defines the name of the custom rule. Required.
  signature: 'name: Required[str]'
- uid: azure.mgmt.cdn.types.CustomRule.priority
  name: priority
  summary: Defines in what order this rule be evaluated in the overall list of custom
    rules. Required.
  signature: 'priority: Required[int]'
