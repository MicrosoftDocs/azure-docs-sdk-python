### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.EndpointProperties
name: EndpointProperties
fullName: azure.mgmt.cdn.types.EndpointProperties
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties required to create an endpoint.
constructor:
  syntax: EndpointProperties()
variables:
- description: 'A directory path on the origin that CDN can use to retrieve content
    from,

    e.g. contoso.cloudapp.net/originpath.'
  name: origin_path
  types:
  - <xref:str>
- description: 'List of content types on which compression applies. The value

    should be a valid MIME type.'
  name: content_types_to_compress
  types:
  - <xref:list>[<xref:str>]
- description: 'The host header value sent to the origin with each request. This

    property at Endpoint is only allowed when endpoint uses single origin and can
    be overridden by

    the same property specified at origin.If you leave this blank, the request hostname
    determines

    this value. Azure CDN origins, such as Web Apps, Blob Storage, and Cloud Services
    require this

    host header value to match the origin hostname by default.'
  name: origin_host_header
  types:
  - <xref:str>
- description: 'Indicates whether content compression is enabled on CDN. Default

    value is false. If compression is enabled, content will be served as compressed
    if user

    requests for a compressed version. Content won''t be compressed on CDN when requested
    content is

    smaller than 1 byte or larger than 1 MB.'
  name: is_compression_enabled
  types:
  - <xref:bool>
- description: 'Indicates whether HTTP traffic is allowed on the endpoint. Default
    value

    is true. At least one protocol (HTTP or HTTPS) must be allowed.'
  name: is_http_allowed
  types:
  - <xref:bool>
- description: 'Indicates whether HTTPS traffic is allowed on the endpoint. Default

    value is true. At least one protocol (HTTP or HTTPS) must be allowed.'
  name: is_https_allowed
  types:
  - <xref:bool>
- description: 'Defines how CDN caches requests that include query

    strings. You can ignore any query strings when caching, bypass caching to prevent
    requests that

    contain query strings from being cached, or cache every request with a unique
    URL. Known values

    are: "IgnoreQueryString", "BypassCaching", "UseQueryString", and "NotSet".'
  name: query_string_caching_behavior
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"QueryStringCachingBehavior">]
- description: 'Specifies what scenario the customer wants this CDN endpoint to

    optimize for, e.g. Download, Media services. With this information, CDN can apply
    scenario

    driven optimization. Known values are: "GeneralWebDelivery", "GeneralMediaStreaming",

    "VideoOnDemandMediaStreaming", "LargeFileDownload", and "DynamicSiteAcceleration".'
  name: optimization_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OptimizationType">]
- description: 'Path to a file hosted on the origin which helps accelerate delivery
    of the

    dynamic content and calculate the most optimal routes for the CDN. This is relative
    to the

    origin path. This property is only relevant when using a single origin.'
  name: probe_path
  types:
  - <xref:str>
- description: 'List of rules defining the user''s geo access within a CDN endpoint.
    Each geo

    filter defines an access rule to a specified path or content, e.g. block APAC
    for path

    /pictures/.'
  name: geo_filters
  types:
  - <xref:list>[<xref:"GeoFilter">]
- description: A reference to the origin group.
  name: default_origin_group
  types:
  - <xref:<xref:"ResourceReference">>
- description: List of keys used to validate the signed URL hashes.
  name: url_signing_keys
  types:
  - <xref:list>[<xref:"UrlSigningKey">]
- description: A policy that specifies the delivery rules to be used for an endpoint.
  name: delivery_policy
  types:
  - <xref:<xref:"EndpointPropertiesUpdateParametersDeliveryPolicy">>
- description: 'Defines the Web Application Firewall policy for the

    endpoint (if applicable).'
  name: web_application_firewall_policy_link
  types:
  - <xref:<xref:"EndpointPropertiesUpdateParametersWebApplicationFirewallPolicyLink">>
- description: 'The host name of the endpoint structured as {endpointName}.{DNSZone},
    e.g.

    contoso.azureedge.net.'
  name: host_name
  types:
  - <xref:str>
- description: The source of the content being delivered via CDN. Required.
  name: origins
  types:
  - <xref:list>[<xref:"DeepCreatedOrigin">]
- description: 'The origin groups comprising of origins that are used for load balancing

    the traffic based on availability.'
  name: origin_groups
  types:
  - <xref:list>[<xref:"DeepCreatedOriginGroup">]
- description: The custom domains under the endpoint.
  name: custom_domains
  types:
  - <xref:list>[<xref:"DeepCreatedCustomDomain">]
- description: 'Resource status of the endpoint. Known values are: "Creating",

    "Deleting", "Running", "Starting", "Stopped", and "Stopping".'
  name: resource_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EndpointResourceState">]
- description: 'Provisioning status of the endpoint. Known values are: "Succeeded",

    "Failed", "Updating", "Deleting", and "Creating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EndpointProvisioningState">]
attributes:
- uid: azure.mgmt.cdn.types.EndpointProperties.customDomains
  name: customDomains
  summary: The custom domains under the endpoint.
  signature: 'customDomains: list[''DeepCreatedCustomDomain'']'
- uid: azure.mgmt.cdn.types.EndpointProperties.hostName
  name: hostName
  summary: 'The host name of the endpoint structured as {endpointName}.{DNSZone},
    e.g.

    contoso.azureedge.net.'
  signature: 'hostName: str'
- uid: azure.mgmt.cdn.types.EndpointProperties.originGroups
  name: originGroups
  summary: 'The origin groups comprising of origins that are used for load balancing
    the traffic based on

    availability.'
  signature: 'originGroups: list[''DeepCreatedOriginGroup'']'
- uid: azure.mgmt.cdn.types.EndpointProperties.origins
  name: origins
  summary: The source of the content being delivered via CDN. Required.
  signature: 'origins: Required[list[''DeepCreatedOrigin'']]'
- uid: azure.mgmt.cdn.types.EndpointProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Updating",

    "Deleting", and "Creating".'
  signature: 'provisioningState: str | EndpointProvisioningState'
- uid: azure.mgmt.cdn.types.EndpointProperties.resourceState
  name: resourceState
  summary: '"Creating", "Deleting", "Running",

    "Starting", "Stopped", and "Stopping".'
  signature: 'resourceState: str | EndpointResourceState'
- uid: azure.mgmt.cdn.types.EndpointProperties.contentTypesToCompress
  name: contentTypesToCompress
  signature: 'contentTypesToCompress: list[str]'
- uid: azure.mgmt.cdn.types.EndpointProperties.defaultOriginGroup
  name: defaultOriginGroup
  signature: 'defaultOriginGroup: ResourceReference'
- uid: azure.mgmt.cdn.types.EndpointProperties.deliveryPolicy
  name: deliveryPolicy
  signature: 'deliveryPolicy: EndpointPropertiesUpdateParametersDeliveryPolicy'
- uid: azure.mgmt.cdn.types.EndpointProperties.geoFilters
  name: geoFilters
  signature: 'geoFilters: list[''GeoFilter'']'
- uid: azure.mgmt.cdn.types.EndpointProperties.isCompressionEnabled
  name: isCompressionEnabled
  signature: 'isCompressionEnabled: bool'
- uid: azure.mgmt.cdn.types.EndpointProperties.isHttpAllowed
  name: isHttpAllowed
  signature: 'isHttpAllowed: bool'
- uid: azure.mgmt.cdn.types.EndpointProperties.isHttpsAllowed
  name: isHttpsAllowed
  signature: 'isHttpsAllowed: bool'
- uid: azure.mgmt.cdn.types.EndpointProperties.optimizationType
  name: optimizationType
  signature: 'optimizationType: str | OptimizationType'
- uid: azure.mgmt.cdn.types.EndpointProperties.originHostHeader
  name: originHostHeader
  signature: 'originHostHeader: str'
- uid: azure.mgmt.cdn.types.EndpointProperties.originPath
  name: originPath
  signature: 'originPath: str'
- uid: azure.mgmt.cdn.types.EndpointProperties.probePath
  name: probePath
  signature: 'probePath: str'
- uid: azure.mgmt.cdn.types.EndpointProperties.queryStringCachingBehavior
  name: queryStringCachingBehavior
  signature: 'queryStringCachingBehavior: str | QueryStringCachingBehavior'
- uid: azure.mgmt.cdn.types.EndpointProperties.urlSigningKeys
  name: urlSigningKeys
  signature: 'urlSigningKeys: list[''UrlSigningKey'']'
- uid: azure.mgmt.cdn.types.EndpointProperties.webApplicationFirewallPolicyLink
  name: webApplicationFirewallPolicyLink
  signature: 'webApplicationFirewallPolicyLink: EndpointPropertiesUpdateParametersWebApplicationFirewallPolicyLink'
