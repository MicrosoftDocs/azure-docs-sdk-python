### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.CompressionSettings
name: CompressionSettings
fullName: azure.mgmt.cdn.types.CompressionSettings
module: azure.mgmt.cdn.types
summary: settings for compression.
constructor:
  syntax: CompressionSettings()
variables:
- description: 'List of content types on which compression applies. The value

    should be a valid MIME type.'
  name: content_types_to_compress
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates whether content compression is enabled on

    AzureFrontDoor. Default value is false. If compression is enabled, content will
    be served as

    compressed if user requests for a compressed version. Content won''t be compressed
    on

    AzureFrontDoor when requested content is smaller than 1 byte or larger than 1
    MB.'
  name: is_compression_enabled
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.cdn.types.CompressionSettings.contentTypesToCompress
  name: contentTypesToCompress
  summary: List of content types on which compression applies. The value should be
    a valid MIME type.
  signature: 'contentTypesToCompress: list[str]'
- uid: azure.mgmt.cdn.types.CompressionSettings.isCompressionEnabled
  name: isCompressionEnabled
  summary: 'Indicates whether content compression is enabled on AzureFrontDoor. Default
    value is false. If

    compression is enabled, content will be served as compressed if user requests
    for a compressed

    version. Content won''t be compressed on AzureFrontDoor when requested content
    is smaller than 1

    byte or larger than 1 MB.'
  signature: 'isCompressionEnabled: bool'
