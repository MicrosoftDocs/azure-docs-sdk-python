### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.OriginAuthenticationProperties
name: OriginAuthenticationProperties
fullName: azure.mgmt.cdn.types.OriginAuthenticationProperties
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties of the origin authentication
  settings.
constructor:
  syntax: OriginAuthenticationProperties()
variables:
- description: 'The type of the authentication for the origin. Known values are:

    "SystemAssignedIdentity" and "UserAssignedIdentity".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OriginAuthenticationType">]
- description: 'The user assigned managed identity to use for the origin

    authentication if type is UserAssignedIdentity.'
  name: user_assigned_identity
  types:
  - <xref:<xref:"ResourceReference">>
- description: 'The scope used when requesting token from Microsoft Entra. For example,
    for Azure

    Blob Storage, scope could be "[https://storage.azure.com/.default](https://storage.azure.com/.default)".'
  name: scope
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cdn.types.OriginAuthenticationProperties.scope
  name: scope
  summary: 'The scope used when requesting token from Microsoft Entra. For example,
    for Azure Blob Storage,

    scope could be "[https://storage.azure.com/.default](https://storage.azure.com/.default)".'
  signature: 'scope: str'
- uid: azure.mgmt.cdn.types.OriginAuthenticationProperties.type
  name: type
  summary: '"SystemAssignedIdentity" and

    "UserAssignedIdentity".'
  signature: 'type: str | OriginAuthenticationType'
- uid: azure.mgmt.cdn.types.OriginAuthenticationProperties.userAssignedIdentity
  name: userAssignedIdentity
  summary: 'The user assigned managed identity to use for the origin authentication
    if type is

    UserAssignedIdentity.'
  signature: 'userAssignedIdentity: ResourceReference'
