### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.AFDDomainHttpsParameters
name: AFDDomainHttpsParameters
fullName: azure.mgmt.cdn.types.AFDDomainHttpsParameters
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties to secure a domain.
constructor:
  syntax: AFDDomainHttpsParameters()
variables:
- description: 'Defines the source of the SSL certificate. Required. Known values
    are:

    "CustomerCertificate", "ManagedCertificate", and "AzureFirstPartyManagedCertificate".'
  name: certificate_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AfdCertificateType">]
- description: 'cipher suite set type that will be used for Https. Known values

    are: "Customized", "TLS10_2019", "TLS12_2022", and "TLS12_2023".'
  name: cipher_suite_set_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AfdCipherSuiteSetType">]
- description: 'TLS protocol version that will be used for Https when

    cipherSuiteSetType is Customized. Known values are: "TLS10", "TLS12", and "TLS13".'
  name: minimum_tls_version
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AfdMinimumTlsVersion">]
- description: 'Customized cipher suites object that will be used for Https

    when cipherSuiteSetType is Customized.'
  name: customized_cipher_suite_set
  types:
  - <xref:<xref:"AFDDomainHttpsCustomizedCipherSuiteSet">>
- description: Resource reference to the secret. ie. subs/rg/profile/secret.
  name: secret
  types:
  - <xref:<xref:"ResourceReference">>
attributes:
- uid: azure.mgmt.cdn.types.AFDDomainHttpsParameters.certificateType
  name: certificateType
  summary: '"CustomerCertificate",

    "ManagedCertificate", and "AzureFirstPartyManagedCertificate".'
  signature: 'certificateType: Required[str | AfdCertificateType]'
- uid: azure.mgmt.cdn.types.AFDDomainHttpsParameters.cipherSuiteSetType
  name: cipherSuiteSetType
  summary: '"Customized",

    "TLS10_2019", "TLS12_2022", and "TLS12_2023".'
  signature: 'cipherSuiteSetType: str | AfdCipherSuiteSetType'
- uid: azure.mgmt.cdn.types.AFDDomainHttpsParameters.customizedCipherSuiteSet
  name: customizedCipherSuiteSet
  summary: 'Customized cipher suites object that will be used for Https when cipherSuiteSetType
    is

    Customized.'
  signature: 'customizedCipherSuiteSet: AFDDomainHttpsCustomizedCipherSuiteSet'
- uid: azure.mgmt.cdn.types.AFDDomainHttpsParameters.minimumTlsVersion
  name: minimumTlsVersion
  summary: 'TLS protocol version that will be used for Https when cipherSuiteSetType
    is Customized. Known

    values are: "TLS10", "TLS12", and "TLS13".'
  signature: 'minimumTlsVersion: str | AfdMinimumTlsVersion'
- uid: azure.mgmt.cdn.types.AFDDomainHttpsParameters.secret
  name: secret
  summary: Resource reference to the secret. ie. subs/rg/profile/secret.
  signature: 'secret: ResourceReference'
