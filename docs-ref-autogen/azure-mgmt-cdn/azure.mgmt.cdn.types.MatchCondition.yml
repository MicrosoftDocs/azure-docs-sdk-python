### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.MatchCondition
name: MatchCondition
fullName: azure.mgmt.cdn.types.MatchCondition
module: azure.mgmt.cdn.types
summary: Define match conditions.
constructor:
  syntax: MatchCondition()
variables:
- description: 'Match variable to compare against. Required. Known values are:

    "RemoteAddr", "SocketAddr", "RequestMethod", "RequestHeader", "RequestUri", "QueryString",

    "RequestBody", "Cookies", and "PostArgs".'
  name: match_variable
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WafMatchVariable">]
- description: 'Selector can used to match a specific key for QueryString, Cookies,

    RequestHeader or PostArgs.'
  name: selector
  types:
  - <xref:str>
- description: 'Describes operator to be matched. Required. Known values are: "Any",
    "IPMatch",

    "GeoMatch", "Equal", "Contains", "LessThan", "GreaterThan", "LessThanOrEqual",

    "GreaterThanOrEqual", "BeginsWith", "EndsWith", and "RegEx".'
  name: operator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Operator">]
- description: Describes if the result of this condition should be negated.
  name: negate_condition
  types:
  - <xref:bool>
- description: List of possible match values. Required.
  name: match_value
  types:
  - <xref:list>[<xref:str>]
- description: List of transforms.
  name: transforms
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"TransformType">]]
attributes:
- uid: azure.mgmt.cdn.types.MatchCondition.matchValue
  name: matchValue
  summary: List of possible match values. Required.
  signature: 'matchValue: Required[list[str]]'
- uid: azure.mgmt.cdn.types.MatchCondition.matchVariable
  name: matchVariable
  summary: '"RemoteAddr", "SocketAddr",

    "RequestMethod", "RequestHeader", "RequestUri", "QueryString", "RequestBody",

    "Cookies", and "PostArgs".'
  signature: 'matchVariable: Required[str | WafMatchVariable]'
- uid: azure.mgmt.cdn.types.MatchCondition.negateCondition
  name: negateCondition
  summary: Describes if the result of this condition should be negated.
  signature: 'negateCondition: bool'
- uid: azure.mgmt.cdn.types.MatchCondition.operator
  name: operator
  summary: '"Any", "IPMatch",

    "GeoMatch", "Equal", "Contains", "LessThan", "GreaterThan", "LessThanOrEqual",

    "GreaterThanOrEqual", "BeginsWith", "EndsWith", and "RegEx".'
  signature: 'operator: Required[str | Operator]'
- uid: azure.mgmt.cdn.types.MatchCondition.selector
  name: selector
  summary: Selector can used to match a specific key for QueryString, Cookies, RequestHeader
    or PostArgs.
  signature: 'selector: str'
- uid: azure.mgmt.cdn.types.MatchCondition.transforms
  name: transforms
  summary: List of transforms.
  signature: 'transforms: list[typing.Union[str, ForwardRef(''TransformType'')]]'
