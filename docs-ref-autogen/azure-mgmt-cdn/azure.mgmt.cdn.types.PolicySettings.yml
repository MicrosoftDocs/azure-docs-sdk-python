### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.PolicySettings
name: PolicySettings
fullName: azure.mgmt.cdn.types.PolicySettings
module: azure.mgmt.cdn.types
summary: Defines contents of a web application firewall global configuration.
constructor:
  syntax: PolicySettings()
variables:
- description: 'describes if the policy is in enabled state or disabled state. Known

    values are: "Disabled" and "Enabled".'
  name: enabled_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PolicyEnabledState">]
- description: 'Describes if it is in detection mode or prevention mode at policy
    level. Known

    values are: "Prevention" and "Detection".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PolicyMode">]
- description: 'If action type is redirect, this field represents the default

    redirect URL for the client.'
  name: default_redirect_url
  types:
  - <xref:str>
- description: 'If the action type is block, this field

    defines the default customer overridable http response status code. Known values
    are: 200, 403,

    405, 406, and 429.'
  name: default_custom_block_response_status_code
  types:
  - <xref:typing.Union>[<xref:int>, <xref:"PolicySettingsDefaultCustomBlockResponseStatusCode">]
- description: 'If the action type is block, customer can override

    the response body. The body must be specified in base64 encoding.'
  name: default_custom_block_response_body
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cdn.types.PolicySettings.defaultCustomBlockResponseBody
  name: defaultCustomBlockResponseBody
  summary: 'If the action type is block, customer can override the response body.
    The body must be

    specified in base64 encoding.'
  signature: 'defaultCustomBlockResponseBody: str'
- uid: azure.mgmt.cdn.types.PolicySettings.defaultCustomBlockResponseStatusCode
  name: defaultCustomBlockResponseStatusCode
  summary: 'If the action type is block, this field defines the default customer overridable
    http response

    status code. Known values are: 200, 403, 405, 406, and 429.'
  signature: 'defaultCustomBlockResponseStatusCode: int | PolicySettingsDefaultCustomBlockResponseStatusCode'
- uid: azure.mgmt.cdn.types.PolicySettings.defaultRedirectUrl
  name: defaultRedirectUrl
  summary: If action type is redirect, this field represents the default redirect
    URL for the client.
  signature: 'defaultRedirectUrl: str'
- uid: azure.mgmt.cdn.types.PolicySettings.enabledState
  name: enabledState
  summary: '"Disabled"

    and "Enabled".'
  signature: 'enabledState: str | PolicyEnabledState'
- uid: azure.mgmt.cdn.types.PolicySettings.mode
  name: mode
  summary: 'Describes if it is in detection mode or prevention mode at policy level.
    Known values are:

    "Prevention" and "Detection".'
  signature: 'mode: str | PolicyMode'
