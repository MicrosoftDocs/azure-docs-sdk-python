### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.CdnManagedHttpsParameters
name: CdnManagedHttpsParameters
fullName: azure.mgmt.cdn.types.CdnManagedHttpsParameters
module: azure.mgmt.cdn.types
summary: Defines the certificate source parameters using CDN managed certificate for
  enabling SSL.
constructor:
  syntax: CdnManagedHttpsParameters()
variables:
- description: 'Defines the TLS extension protocol that is used for secure delivery.

    Required. Known values are: "ServerNameIndication" and "IPBased".'
  name: protocol_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProtocolType">]
- description: 'TLS protocol version that will be used for Https. Known values are:

    "None", "TLS10", and "TLS12".'
  name: minimum_tls_version
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MinimumTlsVersion">]
- description: 'Defines the certificate source parameters using CDN

    managed certificate for enabling SSL. Required.'
  name: certificate_source_parameters
  types:
  - <xref:<xref:"CdnCertificateSourceParameters">>
- description: Defines the source of the SSL certificate. Required. CDN.
  name: certificate_source
  types:
  - <xref:typing.Literal>[CertificateSource.CDN]
attributes:
- uid: azure.mgmt.cdn.types.CdnManagedHttpsParameters.certificateSource
  name: certificateSource
  summary: Defines the source of the SSL certificate. Required. CDN.
  signature: 'certificateSource: CDN: ''Cdn''>]]'
- uid: azure.mgmt.cdn.types.CdnManagedHttpsParameters.certificateSourceParameters
  name: certificateSourceParameters
  summary: 'Defines the certificate source parameters using CDN managed certificate
    for enabling SSL.

    Required.'
  signature: 'certificateSourceParameters: Required[CdnCertificateSourceParameters]'
- uid: azure.mgmt.cdn.types.CdnManagedHttpsParameters.minimumTlsVersion
  name: minimumTlsVersion
  summary: '"None", "TLS10", and

    "TLS12".'
  signature: 'minimumTlsVersion: str | MinimumTlsVersion'
- uid: azure.mgmt.cdn.types.CdnManagedHttpsParameters.protocolType
  name: protocolType
  summary: 'Defines the TLS extension protocol that is used for secure delivery. Required.
    Known values

    are: "ServerNameIndication" and "IPBased".'
  signature: 'protocolType: Required[str | ProtocolType]'
