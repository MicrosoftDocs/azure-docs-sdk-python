### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.RuleUpdatePropertiesParameters
name: RuleUpdatePropertiesParameters
fullName: azure.mgmt.cdn.types.RuleUpdatePropertiesParameters
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties of the rule to update.
constructor:
  syntax: RuleUpdatePropertiesParameters()
variables:
- description: The name of the rule set containing the rule.
  name: rule_set_name
  types:
  - <xref:str>
- description: 'The order in which the rules are applied for the endpoint. Possible
    values

    {0,1,2,3,.........}. A rule with a lesser order will be applied before a rule
    with a greater order.

    Rule with order 0 is a special rule. It does not require any condition and actions
    listed in it

    will always be applied.'
  name: order
  types:
  - <xref:int>
- description: A list of conditions that must be matched for the actions to be executed.
  name: conditions
  types:
  - <xref:list>[<xref:"DeliveryRuleCondition">]
- description: 'A list of actions that are executed when all the conditions of a rule
    are

    satisfied.'
  name: actions
  types:
  - <xref:list>[<xref:"DeliveryRuleAction">]
- description: 'If this rule is a match should the rules engine continue

    running the remaining rules or stop. If not present, defaults to Continue. Known
    values are:

    "Continue" and "Stop".'
  name: match_processing_behavior
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MatchProcessingBehavior">]
attributes:
- uid: azure.mgmt.cdn.types.RuleUpdatePropertiesParameters.actions
  name: actions
  summary: A list of actions that are executed when all the conditions of a rule are
    satisfied.
  signature: 'actions: list[''DeliveryRuleAction'']'
- uid: azure.mgmt.cdn.types.RuleUpdatePropertiesParameters.conditions
  name: conditions
  summary: A list of conditions that must be matched for the actions to be executed.
  signature: 'conditions: list[''DeliveryRuleCondition'']'
- uid: azure.mgmt.cdn.types.RuleUpdatePropertiesParameters.matchProcessingBehavior
  name: matchProcessingBehavior
  summary: 'If this rule is a match should the rules engine continue running the remaining
    rules or stop.

    If not present, defaults to Continue. Known values are: "Continue" and "Stop".'
  signature: 'matchProcessingBehavior: str | MatchProcessingBehavior'
- uid: azure.mgmt.cdn.types.RuleUpdatePropertiesParameters.order
  name: order
  summary: 'The order in which the rules are applied for the endpoint. Possible values
    {0,1,2,3,.........}. A

    rule with a lesser order will be applied before a rule with a greater order. Rule
    with order 0

    is a special rule. It does not require any condition and actions listed in it
    will always be

    applied.'
  signature: 'order: int'
- uid: azure.mgmt.cdn.types.RuleUpdatePropertiesParameters.ruleSetName
  name: ruleSetName
  summary: The name of the rule set containing the rule.
  signature: 'ruleSetName: str'
