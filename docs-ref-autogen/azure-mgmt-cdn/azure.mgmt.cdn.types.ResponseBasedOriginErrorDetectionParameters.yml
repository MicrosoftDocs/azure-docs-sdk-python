### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.ResponseBasedOriginErrorDetectionParameters
name: ResponseBasedOriginErrorDetectionParameters
fullName: azure.mgmt.cdn.types.ResponseBasedOriginErrorDetectionParameters
module: azure.mgmt.cdn.types
summary: 'The JSON object that contains the properties to determine origin health
  using real

  requests/responses.'
constructor:
  syntax: ResponseBasedOriginErrorDetectionParameters()
variables:
- description: 'Type of response errors for real user requests for

    which origin will be deemed unhealthy. Known values are: "None", "TcpErrorsOnly",
    and

    "TcpAndHttpErrors".'
  name: response_based_detected_error_types
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResponseBasedDetectedErrorTypes">]
- description: 'The percentage of failed requests in the

    sample where failover should trigger.'
  name: response_based_failover_threshold_percentage
  types:
  - <xref:int>
- description: 'The list of Http status code ranges that are considered as server

    errors for origin and it is marked as unhealthy.'
  name: http_error_ranges
  types:
  - <xref:list>[<xref:"HttpErrorRangeParameters">]
attributes:
- uid: azure.mgmt.cdn.types.ResponseBasedOriginErrorDetectionParameters.httpErrorRanges
  name: httpErrorRanges
  summary: 'The list of Http status code ranges that are considered as server errors
    for origin and it is

    marked as unhealthy.'
  signature: 'httpErrorRanges: list[''HttpErrorRangeParameters'']'
- uid: azure.mgmt.cdn.types.ResponseBasedOriginErrorDetectionParameters.responseBasedDetectedErrorTypes
  name: responseBasedDetectedErrorTypes
  summary: 'Type of response errors for real user requests for which origin will be
    deemed unhealthy. Known

    values are: "None", "TcpErrorsOnly", and "TcpAndHttpErrors".'
  signature: 'responseBasedDetectedErrorTypes: str | ResponseBasedDetectedErrorTypes'
- uid: azure.mgmt.cdn.types.ResponseBasedOriginErrorDetectionParameters.responseBasedFailoverThresholdPercentage
  name: responseBasedFailoverThresholdPercentage
  summary: The percentage of failed requests in the sample where failover should trigger.
  signature: 'responseBasedFailoverThresholdPercentage: int'
