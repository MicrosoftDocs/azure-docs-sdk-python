### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.AFDDomainUpdatePropertiesParameters
name: AFDDomainUpdatePropertiesParameters
fullName: azure.mgmt.cdn.types.AFDDomainUpdatePropertiesParameters
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties of the domain to create.
constructor:
  syntax: AFDDomainUpdatePropertiesParameters()
variables:
- description: The name of the profile which holds the domain.
  name: profile_name
  types:
  - <xref:str>
- description: 'The configuration specifying how to enable HTTPS for the domain -
    using

    AzureFrontDoor managed certificate or user''s own certificate. If not specified,
    enabling ssl

    uses AzureFrontDoor managed certificate by default.'
  name: tls_settings
  types:
  - <xref:<xref:"AFDDomainHttpsParameters">>
- description: Resource reference to the Azure DNS zone.
  name: azure_dns_zone
  types:
  - <xref:<xref:"ResourceReference">>
- description: 'Resource reference to the Azure resource where

    custom domain ownership was prevalidated.'
  name: pre_validated_custom_domain_resource_id
  types:
  - <xref:<xref:"ResourceReference">>
attributes:
- uid: azure.mgmt.cdn.types.AFDDomainUpdatePropertiesParameters.azureDnsZone
  name: azureDnsZone
  summary: Resource reference to the Azure DNS zone.
  signature: 'azureDnsZone: ResourceReference'
- uid: azure.mgmt.cdn.types.AFDDomainUpdatePropertiesParameters.preValidatedCustomDomainResourceId
  name: preValidatedCustomDomainResourceId
  summary: Resource reference to the Azure resource where custom domain ownership
    was prevalidated.
  signature: 'preValidatedCustomDomainResourceId: ResourceReference'
- uid: azure.mgmt.cdn.types.AFDDomainUpdatePropertiesParameters.profileName
  name: profileName
  summary: The name of the profile which holds the domain.
  signature: 'profileName: str'
- uid: azure.mgmt.cdn.types.AFDDomainUpdatePropertiesParameters.tlsSettings
  name: tlsSettings
  summary: 'The configuration specifying how to enable HTTPS for the domain - using
    AzureFrontDoor managed

    certificate or user''s own certificate. If not specified, enabling ssl uses AzureFrontDoor

    managed certificate by default.'
  signature: 'tlsSettings: AFDDomainHttpsParameters'
