### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters
name: EndpointPropertiesUpdateParameters
fullName: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters
module: azure.mgmt.cdn.types
summary: The JSON object containing endpoint update parameters.
constructor:
  syntax: EndpointPropertiesUpdateParameters()
variables:
- description: 'A directory path on the origin that CDN can use to retrieve content
    from,

    e.g. contoso.cloudapp.net/originpath.'
  name: origin_path
  types:
  - <xref:str>
- description: 'List of content types on which compression applies. The value

    should be a valid MIME type.'
  name: content_types_to_compress
  types:
  - <xref:list>[<xref:str>]
- description: 'The host header value sent to the origin with each request. This

    property at Endpoint is only allowed when endpoint uses single origin and can
    be overridden by

    the same property specified at origin.If you leave this blank, the request hostname
    determines

    this value. Azure CDN origins, such as Web Apps, Blob Storage, and Cloud Services
    require this

    host header value to match the origin hostname by default.'
  name: origin_host_header
  types:
  - <xref:str>
- description: 'Indicates whether content compression is enabled on CDN. Default

    value is false. If compression is enabled, content will be served as compressed
    if user

    requests for a compressed version. Content won''t be compressed on CDN when requested
    content is

    smaller than 1 byte or larger than 1 MB.'
  name: is_compression_enabled
  types:
  - <xref:bool>
- description: 'Indicates whether HTTP traffic is allowed on the endpoint. Default
    value

    is true. At least one protocol (HTTP or HTTPS) must be allowed.'
  name: is_http_allowed
  types:
  - <xref:bool>
- description: 'Indicates whether HTTPS traffic is allowed on the endpoint. Default

    value is true. At least one protocol (HTTP or HTTPS) must be allowed.'
  name: is_https_allowed
  types:
  - <xref:bool>
- description: 'Defines how CDN caches requests that include query

    strings. You can ignore any query strings when caching, bypass caching to prevent
    requests that

    contain query strings from being cached, or cache every request with a unique
    URL. Known values

    are: "IgnoreQueryString", "BypassCaching", "UseQueryString", and "NotSet".'
  name: query_string_caching_behavior
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"QueryStringCachingBehavior">]
- description: 'Specifies what scenario the customer wants this CDN endpoint to

    optimize for, e.g. Download, Media services. With this information, CDN can apply
    scenario

    driven optimization. Known values are: "GeneralWebDelivery", "GeneralMediaStreaming",

    "VideoOnDemandMediaStreaming", "LargeFileDownload", and "DynamicSiteAcceleration".'
  name: optimization_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OptimizationType">]
- description: 'Path to a file hosted on the origin which helps accelerate delivery
    of the

    dynamic content and calculate the most optimal routes for the CDN. This is relative
    to the

    origin path. This property is only relevant when using a single origin.'
  name: probe_path
  types:
  - <xref:str>
- description: 'List of rules defining the user''s geo access within a CDN endpoint.
    Each geo

    filter defines an access rule to a specified path or content, e.g. block APAC
    for path

    /pictures/.'
  name: geo_filters
  types:
  - <xref:list>[<xref:"GeoFilter">]
- description: A reference to the origin group.
  name: default_origin_group
  types:
  - <xref:<xref:"ResourceReference">>
- description: List of keys used to validate the signed URL hashes.
  name: url_signing_keys
  types:
  - <xref:list>[<xref:"UrlSigningKey">]
- description: A policy that specifies the delivery rules to be used for an endpoint.
  name: delivery_policy
  types:
  - <xref:<xref:"EndpointPropertiesUpdateParametersDeliveryPolicy">>
- description: 'Defines the Web Application Firewall policy for the

    endpoint (if applicable).'
  name: web_application_firewall_policy_link
  types:
  - <xref:<xref:"EndpointPropertiesUpdateParametersWebApplicationFirewallPolicyLink">>
attributes:
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.contentTypesToCompress
  name: contentTypesToCompress
  summary: List of content types on which compression applies. The value should be
    a valid MIME type.
  signature: 'contentTypesToCompress: list[str]'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.defaultOriginGroup
  name: defaultOriginGroup
  summary: A reference to the origin group.
  signature: 'defaultOriginGroup: ResourceReference'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.deliveryPolicy
  name: deliveryPolicy
  summary: A policy that specifies the delivery rules to be used for an endpoint.
  signature: 'deliveryPolicy: EndpointPropertiesUpdateParametersDeliveryPolicy'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.geoFilters
  name: geoFilters
  summary: 'List of rules defining the user''s geo access within a CDN endpoint. Each
    geo filter defines an

    access rule to a specified path or content, e.g. block APAC for path /pictures/.'
  signature: 'geoFilters: list[''GeoFilter'']'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.isCompressionEnabled
  name: isCompressionEnabled
  summary: 'Indicates whether content compression is enabled on CDN. Default value
    is false. If compression

    is enabled, content will be served as compressed if user requests for a compressed
    version.

    Content won''t be compressed on CDN when requested content is smaller than 1 byte
    or larger than

    1 MB.'
  signature: 'isCompressionEnabled: bool'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.isHttpAllowed
  name: isHttpAllowed
  summary: 'Indicates whether HTTP traffic is allowed on the endpoint. Default value
    is true. At least one

    protocol (HTTP or HTTPS) must be allowed.'
  signature: 'isHttpAllowed: bool'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.isHttpsAllowed
  name: isHttpsAllowed
  summary: 'Indicates whether HTTPS traffic is allowed on the endpoint. Default value
    is true. At least one

    protocol (HTTP or HTTPS) must be allowed.'
  signature: 'isHttpsAllowed: bool'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.optimizationType
  name: optimizationType
  summary: 'Specifies what scenario the customer wants this CDN endpoint to optimize
    for, e.g. Download,

    Media services. With this information, CDN can apply scenario driven optimization.
    Known values

    are: "GeneralWebDelivery", "GeneralMediaStreaming", "VideoOnDemandMediaStreaming",

    "LargeFileDownload", and "DynamicSiteAcceleration".'
  signature: 'optimizationType: str | OptimizationType'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.originHostHeader
  name: originHostHeader
  summary: 'The host header value sent to the origin with each request. This property
    at Endpoint is only

    allowed when endpoint uses single origin and can be overridden by the same property
    specified

    at origin.If you leave this blank, the request hostname determines this value.
    Azure CDN

    origins, such as Web Apps, Blob Storage, and Cloud Services require this host
    header value to

    match the origin hostname by default.'
  signature: 'originHostHeader: str'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.originPath
  name: originPath
  summary: 'A directory path on the origin that CDN can use to retrieve content from,
    e.g.

    contoso.cloudapp.net/originpath.'
  signature: 'originPath: str'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.probePath
  name: probePath
  summary: 'Path to a file hosted on the origin which helps accelerate delivery of
    the dynamic content and

    calculate the most optimal routes for the CDN. This is relative to the origin
    path. This

    property is only relevant when using a single origin.'
  signature: 'probePath: str'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.queryStringCachingBehavior
  name: queryStringCachingBehavior
  summary: 'Defines how CDN caches requests that include query strings. You can ignore
    any query strings

    when caching, bypass caching to prevent requests that contain query strings from
    being cached,

    or cache every request with a unique URL. Known values are: "IgnoreQueryString",

    "BypassCaching", "UseQueryString", and "NotSet".'
  signature: 'queryStringCachingBehavior: str | QueryStringCachingBehavior'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.urlSigningKeys
  name: urlSigningKeys
  summary: List of keys used to validate the signed URL hashes.
  signature: 'urlSigningKeys: list[''UrlSigningKey'']'
- uid: azure.mgmt.cdn.types.EndpointPropertiesUpdateParameters.webApplicationFirewallPolicyLink
  name: webApplicationFirewallPolicyLink
  summary: Defines the Web Application Firewall policy for the endpoint (if applicable).
  signature: 'webApplicationFirewallPolicyLink: EndpointPropertiesUpdateParametersWebApplicationFirewallPolicyLink'
