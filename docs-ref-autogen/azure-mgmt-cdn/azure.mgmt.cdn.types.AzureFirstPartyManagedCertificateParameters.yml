  name: subject
  summary: Subject name in the certificate.
  signature: 'subject: str'
- uid: azure.mgmt.cdn.types.AzureFirstPartyManagedCertificateParameters.subjectAlternativeNames
  name: subjectAlternativeNames
  summary: The list of SANs.
  signature: 'subjectAlternativeNames: list[str]'
- uid: azure.mgmt.cdn.types.AzureFirstPartyManagedCertificateParameters.thumbprint
  name: thumbprint
  summary: Certificate thumbprint.
