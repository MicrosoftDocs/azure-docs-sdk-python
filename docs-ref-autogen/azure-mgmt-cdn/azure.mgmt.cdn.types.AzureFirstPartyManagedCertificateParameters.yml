uid: azure.mgmt.cdn.types.AzureFirstPartyManagedCertificateParameters
name: AzureFirstPartyManagedCertificateParameters
fullName: azure.mgmt.cdn.types.AzureFirstPartyManagedCertificateParameters
module: azure.mgmt.cdn.types
summary: 'Azure FirstParty Managed Certificate provided by other first party resource
  providers to enable

  HTTPS.'
constructor:
  syntax: AzureFirstPartyManagedCertificateParameters()
variables:
- description: 'Resource reference to the Azure Key Vault certificate. Expected to
    be in

    format of

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}/secrets/{certificateName}.'
  name: secret_source
  types:
  - <xref:<xref:"ResourceReference">>
- description: Subject name in the certificate.
  name: subject
  types:
  - <xref:str>
- description: Certificate expiration date.
  name: expiration_date
  types:
  - <xref:str>
- description: Certificate issuing authority.
  name: certificate_authority
  types:
  - <xref:str>
- description: The list of SANs.
  name: subject_alternative_names
  types:
  - <xref:list>[<xref:str>]
- description: Certificate thumbprint.
  name: thumbprint
  types:
  - <xref:str>
- description: The type of the secret resource. Required. AZURE_FIRST_PARTY_MANAGED_CERTIFICATE.
  name: type
  types:
  - <xref:typing.Literal>[SecretType.AZURE_FIRST_PARTY_MANAGED_CERTIFICATE]
attributes:
- uid: azure.mgmt.cdn.types.AzureFirstPartyManagedCertificateParameters.certificateAuthority
  name: certificateAuthority
  summary: Certificate issuing authority.
  signature: 'certificateAuthority: str'
- uid: azure.mgmt.cdn.types.AzureFirstPartyManagedCertificateParameters.expirationDate
  name: expirationDate
  summary: Certificate expiration date.
  signature: 'expirationDate: str'
- uid: azure.mgmt.cdn.types.AzureFirstPartyManagedCertificateParameters.secretSource
  name: secretSource
  summary: 'Resource reference to the Azure Key Vault certificate. Expected to be
    in format of

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName}/secrets/{certificateName}.'
