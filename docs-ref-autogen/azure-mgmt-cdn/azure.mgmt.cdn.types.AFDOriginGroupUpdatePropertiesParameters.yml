### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.AFDOriginGroupUpdatePropertiesParameters
name: AFDOriginGroupUpdatePropertiesParameters
fullName: azure.mgmt.cdn.types.AFDOriginGroupUpdatePropertiesParameters
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties of the origin group.
constructor:
  syntax: AFDOriginGroupUpdatePropertiesParameters()
variables:
- description: The name of the profile which holds the origin group.
  name: profile_name
  types:
  - <xref:str>
- description: Load balancing settings for a backend pool.
  name: load_balancing_settings
  types:
  - <xref:<xref:"LoadBalancingSettingsParameters">>
- description: 'Health probe settings to the origin that is used to determine the

    health of the origin.'
  name: health_probe_settings
  types:
  - <xref:<xref:"HealthProbeParameters">>
- description: 'Time in minutes to shift

    the traffic to the endpoint gradually when an unhealthy endpoint comes healthy
    or a new

    endpoint is added. Default is 10 mins. This property is currently not supported.'
  name: traffic_restoration_time_to_healed_or_new_endpoints_in_minutes
  types:
  - <xref:int>
- description: 'Whether to allow session affinity on this host. Valid options are

    ''Enabled'' or ''Disabled''. Known values are: "Enabled" and "Disabled".'
  name: session_affinity_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EnabledState">]
- description: Authentication settings for origin in origin group.
  name: authentication
  types:
  - <xref:<xref:"OriginAuthenticationProperties">>
attributes:
- uid: azure.mgmt.cdn.types.AFDOriginGroupUpdatePropertiesParameters.authentication
  name: authentication
  summary: Authentication settings for origin in origin group.
  signature: 'authentication: OriginAuthenticationProperties'
- uid: azure.mgmt.cdn.types.AFDOriginGroupUpdatePropertiesParameters.healthProbeSettings
  name: healthProbeSettings
  summary: Health probe settings to the origin that is used to determine the health
    of the origin.
  signature: 'healthProbeSettings: HealthProbeParameters'
- uid: azure.mgmt.cdn.types.AFDOriginGroupUpdatePropertiesParameters.loadBalancingSettings
  name: loadBalancingSettings
  summary: Load balancing settings for a backend pool.
  signature: 'loadBalancingSettings: LoadBalancingSettingsParameters'
- uid: azure.mgmt.cdn.types.AFDOriginGroupUpdatePropertiesParameters.profileName
  name: profileName
  summary: The name of the profile which holds the origin group.
  signature: 'profileName: str'
- uid: azure.mgmt.cdn.types.AFDOriginGroupUpdatePropertiesParameters.sessionAffinityState
  name: sessionAffinityState
  summary: 'Whether to allow session affinity on this host. Valid options are ''Enabled''
    or ''Disabled''.

    Known values are: "Enabled" and "Disabled".'
  signature: 'sessionAffinityState: str | EnabledState'
- uid: azure.mgmt.cdn.types.AFDOriginGroupUpdatePropertiesParameters.trafficRestorationTimeToHealedOrNewEndpointsInMinutes
  name: trafficRestorationTimeToHealedOrNewEndpointsInMinutes
  summary: 'Time in minutes to shift the traffic to the endpoint gradually when an
    unhealthy endpoint comes

    healthy or a new endpoint is added. Default is 10 mins. This property is currently
    not

    supported.'
  signature: 'trafficRestorationTimeToHealedOrNewEndpointsInMinutes: int'
