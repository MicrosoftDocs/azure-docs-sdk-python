### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.ProfileScrubbingRules
name: ProfileScrubbingRules
fullName: azure.mgmt.cdn.types.ProfileScrubbingRules
module: azure.mgmt.cdn.types
summary: Defines the contents of the log scrubbing rules.
constructor:
  syntax: ProfileScrubbingRules()
variables:
- description: 'The variable to be scrubbed from the logs. Required. Known values
    are:

    "RequestIPAddress", "RequestUri", and "QueryStringArgNames".'
  name: match_variable
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScrubbingRuleEntryMatchVariable">]
- description: 'When matchVariable is a collection, operate on the selector to

    specify which elements in the collection this rule applies to. Required. "EqualsAny"'
  name: selector_match_operator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScrubbingRuleEntryMatchOperator">]
- description: 'When matchVariable is a collection, operator used to specify which
    elements in

    the collection this rule applies to.'
  name: selector
  types:
  - <xref:str>
- description: 'Defines the state of a log scrubbing rule. Default value is enabled.
    Known values

    are: "Enabled" and "Disabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScrubbingRuleEntryState">]
attributes:
- uid: azure.mgmt.cdn.types.ProfileScrubbingRules.matchVariable
  name: matchVariable
  summary: '"RequestIPAddress",

    "RequestUri", and "QueryStringArgNames".'
  signature: 'matchVariable: Required[str | ScrubbingRuleEntryMatchVariable]'
- uid: azure.mgmt.cdn.types.ProfileScrubbingRules.selector
  name: selector
  summary: 'When matchVariable is a collection, operator used to specify which elements
    in the collection

    this rule applies to.'
  signature: 'selector: str'
- uid: azure.mgmt.cdn.types.ProfileScrubbingRules.selectorMatchOperator
  name: selectorMatchOperator
  summary: 'When matchVariable is a collection, operate on the selector to specify
    which elements in the

    collection this rule applies to. Required. "EqualsAny"'
  signature: 'selectorMatchOperator: Required[str | ScrubbingRuleEntryMatchOperator]'
- uid: azure.mgmt.cdn.types.ProfileScrubbingRules.state
  name: state
  summary: 'Defines the state of a log scrubbing rule. Default value is enabled. Known
    values are:

    "Enabled" and "Disabled".'
  signature: 'state: str | ScrubbingRuleEntryState'
