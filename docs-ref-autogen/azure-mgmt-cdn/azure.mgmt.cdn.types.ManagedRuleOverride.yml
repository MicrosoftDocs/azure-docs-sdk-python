### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.ManagedRuleOverride
name: ManagedRuleOverride
fullName: azure.mgmt.cdn.types.ManagedRuleOverride
module: azure.mgmt.cdn.types
summary: Defines a managed rule group override setting.
constructor:
  syntax: ManagedRuleOverride()
variables:
- description: Identifier for the managed rule. Required.
  name: rule_id
  types:
  - <xref:str>
- description: 'Describes if the managed rule is in enabled or disabled state. Defaults
    to

    Disabled if not specified. Known values are: "Disabled" and "Enabled".'
  name: enabled_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ManagedRuleEnabledState">]
- description: 'Describes the override action to be applied when rule matches. Known
    values are:

    "Allow", "Block", "Log", and "Redirect".'
  name: action
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActionType">]
attributes:
- uid: azure.mgmt.cdn.types.ManagedRuleOverride.action
  name: action
  summary: '"Allow",

    "Block", "Log", and "Redirect".'
  signature: 'action: str | ActionType'
- uid: azure.mgmt.cdn.types.ManagedRuleOverride.enabledState
  name: enabledState
  summary: 'Describes if the managed rule is in enabled or disabled state. Defaults
    to Disabled if not

    specified. Known values are: "Disabled" and "Enabled".'
  signature: 'enabledState: str | ManagedRuleEnabledState'
- uid: azure.mgmt.cdn.types.ManagedRuleOverride.ruleId
  name: ruleId
  summary: Identifier for the managed rule. Required.
  signature: 'ruleId: Required[str]'
