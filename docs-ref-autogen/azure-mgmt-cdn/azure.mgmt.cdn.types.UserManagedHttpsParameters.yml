### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.UserManagedHttpsParameters
name: UserManagedHttpsParameters
fullName: azure.mgmt.cdn.types.UserManagedHttpsParameters
module: azure.mgmt.cdn.types
summary: Defines the certificate source parameters using user's keyvault certificate
  for enabling SSL.
constructor:
  syntax: UserManagedHttpsParameters()
variables:
- description: 'Defines the TLS extension protocol that is used for secure delivery.

    Required. Known values are: "ServerNameIndication" and "IPBased".'
  name: protocol_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProtocolType">]
- description: 'TLS protocol version that will be used for Https. Known values are:

    "None", "TLS10", and "TLS12".'
  name: minimum_tls_version
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MinimumTlsVersion">]
- description: 'Defines the certificate source parameters using user''s

    keyvault certificate for enabling SSL. Required.'
  name: certificate_source_parameters
  types:
  - <xref:<xref:"KeyVaultCertificateSourceParameters">>
- description: Defines the source of the SSL certificate. Required. AZURE_KEY_VAULT.
  name: certificate_source
  types:
  - <xref:typing.Literal>[CertificateSource.AZURE_KEY_VAULT]
attributes:
- uid: azure.mgmt.cdn.types.UserManagedHttpsParameters.certificateSource
  name: certificateSource
  summary: Defines the source of the SSL certificate. Required. AZURE_KEY_VAULT.
  signature: 'certificateSource: AZURE_KEY_VAULT: ''AzureKeyVault''>]]'
- uid: azure.mgmt.cdn.types.UserManagedHttpsParameters.certificateSourceParameters
  name: certificateSourceParameters
  summary: 'Defines the certificate source parameters using user''s keyvault certificate
    for enabling SSL.

    Required.'
  signature: 'certificateSourceParameters: Required[KeyVaultCertificateSourceParameters]'
- uid: azure.mgmt.cdn.types.UserManagedHttpsParameters.minimumTlsVersion
  name: minimumTlsVersion
  summary: '"None", "TLS10", and

    "TLS12".'
  signature: 'minimumTlsVersion: str | MinimumTlsVersion'
- uid: azure.mgmt.cdn.types.UserManagedHttpsParameters.protocolType
  name: protocolType
  summary: 'Defines the TLS extension protocol that is used for secure delivery. Required.
    Known values

    are: "ServerNameIndication" and "IPBased".'
  signature: 'protocolType: Required[str | ProtocolType]'
