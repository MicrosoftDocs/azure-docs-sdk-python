### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.RateLimitRule
name: RateLimitRule
fullName: azure.mgmt.cdn.types.RateLimitRule
module: azure.mgmt.cdn.types
summary: Defines a rate limiting rule that can be included in a waf policy.
constructor:
  syntax: RateLimitRule()
variables:
- description: Defines the name of the custom rule. Required.
  name: name
  types:
  - <xref:str>
- description: 'Describes if the custom rule is in enabled or disabled state. Defaults
    to

    Enabled if not specified. Known values are: "Disabled" and "Enabled".'
  name: enabled_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CustomRuleEnabledState">]
- description: 'Defines in what order this rule be evaluated in the overall list of
    custom

    rules. Required.'
  name: priority
  types:
  - <xref:int>
- description: List of match conditions. Required.
  name: match_conditions
  types:
  - <xref:list>[<xref:"MatchCondition">]
- description: 'Describes what action to be applied when rule matches. Required. Known
    values

    are: "Allow", "Block", "Log", and "Redirect".'
  name: action
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActionType">]
- description: Defines rate limit threshold. Required.
  name: rate_limit_threshold
  types:
  - <xref:int>
- description: 'Defines rate limit duration. Default is 1 minute.

    Required.'
  name: rate_limit_duration_in_minutes
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.cdn.types.RateLimitRule.rateLimitDurationInMinutes
  name: rateLimitDurationInMinutes
  summary: Defines rate limit duration. Default is 1 minute. Required.
  signature: 'rateLimitDurationInMinutes: Required[int]'
- uid: azure.mgmt.cdn.types.RateLimitRule.rateLimitThreshold
  name: rateLimitThreshold
  summary: Defines rate limit threshold. Required.
  signature: 'rateLimitThreshold: Required[int]'
- uid: azure.mgmt.cdn.types.RateLimitRule.action
  name: action
  signature: 'action: Required[str | ActionType]'
- uid: azure.mgmt.cdn.types.RateLimitRule.enabledState
  name: enabledState
  signature: 'enabledState: str | CustomRuleEnabledState'
- uid: azure.mgmt.cdn.types.RateLimitRule.matchConditions
  name: matchConditions
  signature: 'matchConditions: Required[list[''MatchCondition'']]'
- uid: azure.mgmt.cdn.types.RateLimitRule.name
  name: name
  signature: 'name: Required[str]'
- uid: azure.mgmt.cdn.types.RateLimitRule.priority
  name: priority
  signature: 'priority: Required[int]'
