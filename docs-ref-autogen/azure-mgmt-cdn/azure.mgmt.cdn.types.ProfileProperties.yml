### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.ProfileProperties
name: ProfileProperties
fullName: azure.mgmt.cdn.types.ProfileProperties
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties required to create a profile.
constructor:
  syntax: ProfileProperties()
variables:
- description: 'Resource status of the profile. Known values are: "Creating", "Active",

    "Deleting", "Disabled", "Migrating", "Migrated", "PendingMigrationCommit",

    "CommittingMigration", and "AbortingMigration".'
  name: resource_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProfileResourceState">]
- description: 'Provisioning status of the profile. Known values are: "Succeeded",

    "Failed", "Updating", "Deleting", and "Creating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProfileProvisioningState">]
- description: Key-Value pair representing additional properties for profiles.
  name: extended_properties
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: The Id of the frontdoor.
  name: front_door_id
  types:
  - <xref:str>
- description: 'Send and receive timeout on forwarding request to the

    origin. When timeout is reached, the request fails and returns.'
  name: origin_response_timeout_seconds
  types:
  - <xref:int>
- description: 'Defines rules that scrub sensitive fields in the Azure Front Door
    profile

    logs.'
  name: log_scrubbing
  types:
  - <xref:<xref:"ProfileLogScrubbing">>
attributes:
- uid: azure.mgmt.cdn.types.ProfileProperties.extendedProperties
  name: extendedProperties
  summary: Key-Value pair representing additional properties for profiles.
  signature: 'extendedProperties: dict[str, str]'
- uid: azure.mgmt.cdn.types.ProfileProperties.frontDoorId
  name: frontDoorId
  summary: The Id of the frontdoor.
  signature: 'frontDoorId: str'
- uid: azure.mgmt.cdn.types.ProfileProperties.logScrubbing
  name: logScrubbing
  summary: Defines rules that scrub sensitive fields in the Azure Front Door profile
    logs.
  signature: 'logScrubbing: ProfileLogScrubbing'
- uid: azure.mgmt.cdn.types.ProfileProperties.originResponseTimeoutSeconds
  name: originResponseTimeoutSeconds
  summary: 'Send and receive timeout on forwarding request to the origin. When timeout
    is reached, the

    request fails and returns.'
  signature: 'originResponseTimeoutSeconds: int'
- uid: azure.mgmt.cdn.types.ProfileProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Updating",

    "Deleting", and "Creating".'
  signature: 'provisioningState: str | ProfileProvisioningState'
- uid: azure.mgmt.cdn.types.ProfileProperties.resourceState
  name: resourceState
  summary: '"Creating", "Active", "Deleting",

    "Disabled", "Migrating", "Migrated", "PendingMigrationCommit", "CommittingMigration",

    and "AbortingMigration".'
  signature: 'resourceState: str | ProfileResourceState'
