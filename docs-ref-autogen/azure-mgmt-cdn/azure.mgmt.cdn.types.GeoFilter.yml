### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.GeoFilter
name: GeoFilter
fullName: azure.mgmt.cdn.types.GeoFilter
module: azure.mgmt.cdn.types
summary: Rules defining user's geo access within a CDN endpoint.
constructor:
  syntax: GeoFilter()
variables:
- description: 'Relative path applicable to geo filter. (e.g. ''/mypictures'',

    ''/mypicture/kitty.jpg'', and etc.). Required.'
  name: relative_path
  types:
  - <xref:str>
- description: 'Action of the geo filter, i.e. allow or block access. Required. Known
    values are:

    "Block" and "Allow".'
  name: action
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GeoFilterActions">]
- description: 'Two letter country or region codes defining user country or region
    access

    in a geo filter, e.g. AU, MX, US. Required.'
  name: country_codes
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.cdn.types.GeoFilter.action
  name: action
  summary: '"Block" and

    "Allow".'
  signature: 'action: Required[str | GeoFilterActions]'
- uid: azure.mgmt.cdn.types.GeoFilter.countryCodes
  name: countryCodes
  summary: 'Two letter country or region codes defining user country or region access
    in a geo filter, e.g.

    AU, MX, US. Required.'
  signature: 'countryCodes: Required[list[str]]'
- uid: azure.mgmt.cdn.types.GeoFilter.relativePath
  name: relativePath
  summary: 'Relative path applicable to geo filter. (e.g. ''/mypictures'', ''/mypicture/kitty.jpg'',
    and etc.).

    Required.'
  signature: 'relativePath: Required[str]'
