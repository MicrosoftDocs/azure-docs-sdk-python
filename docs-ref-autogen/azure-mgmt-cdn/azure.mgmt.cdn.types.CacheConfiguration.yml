### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.CacheConfiguration
name: CacheConfiguration
fullName: azure.mgmt.cdn.types.CacheConfiguration
module: azure.mgmt.cdn.types
summary: 'Caching settings for a caching-type route. To disable caching, do not provide
  a

  cacheConfiguration object.'
constructor:
  syntax: CacheConfiguration()
variables:
- description: 'Defines how Frontdoor caches requests that include query

    strings. You can ignore any query strings when caching, ignore specific query
    strings, cache

    every request with a unique URL, or cache specific query strings. Known values
    are:

    "IgnoreQueryString", "UseQueryString", "IgnoreSpecifiedQueryStrings", and

    "IncludeSpecifiedQueryStrings".'
  name: query_string_caching_behavior
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RuleQueryStringCachingBehavior">]
- description: query parameters to include or exclude (comma separated).
  name: query_parameters
  types:
  - <xref:str>
- description: 'Indicates whether content compression is enabled. If compression

    is enabled, content will be served as compressed if user requests for a compressed
    version.

    Content won''t be compressed on AzureFrontDoor when requested content is smaller
    than 1 byte or

    larger than 1 MB. Known values are: "Enabled" and "Disabled".'
  name: is_compression_enabled
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RuleIsCompressionEnabled">]
- description: 'Caching behavior for the requests. Known values are: "HonorOrigin",

    "OverrideAlways", and "OverrideIfOriginMissing".'
  name: cache_behavior
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RuleCacheBehavior">]
- description: 'The duration for which the content needs to be cached. Allowed format
    is

    [d.]hh:mm:ss.'
  name: cache_duration
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.cdn.types.CacheConfiguration.cacheBehavior
  name: cacheBehavior
  summary: '"HonorOrigin", "OverrideAlways", and

    "OverrideIfOriginMissing".'
  signature: 'cacheBehavior: str | RuleCacheBehavior'
- uid: azure.mgmt.cdn.types.CacheConfiguration.cacheDuration
  name: cacheDuration
  summary: ss.
  signature: 'cacheDuration: str'
- uid: azure.mgmt.cdn.types.CacheConfiguration.isCompressionEnabled
  name: isCompressionEnabled
  summary: 'Indicates whether content compression is enabled. If compression is enabled,
    content will be

    served as compressed if user requests for a compressed version. Content won''t
    be compressed on

    AzureFrontDoor when requested content is smaller than 1 byte or larger than 1
    MB. Known values

    are: "Enabled" and "Disabled".'
  signature: 'isCompressionEnabled: str | RuleIsCompressionEnabled'
- uid: azure.mgmt.cdn.types.CacheConfiguration.queryParameters
  name: queryParameters
  summary: query parameters to include or exclude (comma separated).
  signature: 'queryParameters: str'
- uid: azure.mgmt.cdn.types.CacheConfiguration.queryStringCachingBehavior
  name: queryStringCachingBehavior
  summary: 'Defines how Frontdoor caches requests that include query strings. You
    can ignore any query

    strings when caching, ignore specific query strings, cache every request with
    a unique URL, or

    cache specific query strings. Known values are: "IgnoreQueryString", "UseQueryString",

    "IgnoreSpecifiedQueryStrings", and "IncludeSpecifiedQueryStrings".'
  signature: 'queryStringCachingBehavior: str | RuleQueryStringCachingBehavior'
