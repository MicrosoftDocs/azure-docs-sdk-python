    azure.mgmt.cdn.types.DeliveryRuleHttpVersionCondition, azure.mgmt.cdn.types.DeliveryRuleIsDeviceCondition,
    azure.mgmt.cdn.types.DeliveryRulePostArgsCondition, azure.mgmt.cdn.types.DeliveryRuleQueryStringCondition,
    azure.mgmt.cdn.types.DeliveryRuleRemoteAddressCondition, azure.mgmt.cdn.types.DeliveryRuleRequestBodyCondition,
    azure.mgmt.cdn.types.DeliveryRuleRequestHeaderCondition, azure.mgmt.cdn.types.DeliveryRuleRequestMethodCondition,
    azure.mgmt.cdn.types.DeliveryRuleRequestSchemeCondition, azure.mgmt.cdn.types.DeliveryRuleRequestUriCondition,
