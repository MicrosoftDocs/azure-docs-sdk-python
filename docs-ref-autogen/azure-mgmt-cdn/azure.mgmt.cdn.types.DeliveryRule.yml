### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.DeliveryRule
name: DeliveryRule
fullName: azure.mgmt.cdn.types.DeliveryRule
module: azure.mgmt.cdn.types
summary: A rule that specifies a set of actions and conditions.
constructor:
  syntax: DeliveryRule()
variables:
- description: Name of the rule.
  name: name
  types:
  - <xref:str>
- description: 'The order in which the rules are applied for the endpoint. Possible
    values

    {0,1,2,3,.........}. A rule with a lesser order will be applied before a rule
    with a greater order.

    Rule with order 0 is a special rule. It does not require any condition and actions
    listed in it

    will always be applied. Required.'
  name: order
  types:
  - <xref:int>
- description: A list of conditions that must be matched for the actions to be executed.
  name: conditions
  types:
  - <xref:list>[<xref:"DeliveryRuleCondition">]
- description: 'A list of actions that are executed when all the conditions of a rule
    are

    satisfied. Required.'
  name: actions
  types:
  - <xref:list>[<xref:"DeliveryRuleAction">]
attributes:
- uid: azure.mgmt.cdn.types.DeliveryRule.actions
  name: actions
  summary: A list of actions that are executed when all the conditions of a rule are
    satisfied. Required.
  signature: 'actions: list[Union[azure.mgmt.cdn.types.DeliveryRuleCacheExpirationAction,
    azure.mgmt.cdn.types.DeliveryRuleCacheKeyQueryStringAction, azure.mgmt.cdn.types.DeliveryRuleRequestHeaderAction,
    azure.mgmt.cdn.types.DeliveryRuleResponseHeaderAction, azure.mgmt.cdn.types.OriginGroupOverrideAction,
    azure.mgmt.cdn.types.DeliveryRuleRouteConfigurationOverrideAction, azure.mgmt.cdn.types.UrlRedirectAction,
    azure.mgmt.cdn.types.UrlRewriteAction, azure.mgmt.cdn.types.UrlSigningAction]]'
- uid: azure.mgmt.cdn.types.DeliveryRule.conditions
