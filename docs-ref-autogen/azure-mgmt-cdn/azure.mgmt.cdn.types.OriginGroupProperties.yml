### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.OriginGroupProperties
name: OriginGroupProperties
fullName: azure.mgmt.cdn.types.OriginGroupProperties
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties of the origin group.
constructor:
  syntax: OriginGroupProperties()
variables:
- description: 'Health probe settings to the origin that is used to determine the

    health of the origin.'
  name: health_probe_settings
  types:
  - <xref:<xref:"HealthProbeParameters">>
- description: The source of the content being delivered via CDN within given origin
    group.
  name: origins
  types:
  - <xref:list>[<xref:"ResourceReference">]
- description: 'Time in minutes to shift

    the traffic to the endpoint gradually when an unhealthy endpoint comes healthy
    or a new

    endpoint is added. Default is 10 mins. This property is currently not supported.'
  name: traffic_restoration_time_to_healed_or_new_endpoints_in_minutes
  types:
  - <xref:int>
- description: 'The JSON object that contains the

    properties to determine origin health using real requests/responses. This property
    is currently

    not supported.'
  name: response_based_origin_error_detection_settings
  types:
  - <xref:<xref:"ResponseBasedOriginErrorDetectionParameters">>
- description: 'Resource status of the origin group. Known values are: "Creating",

    "Active", and "Deleting".'
  name: resource_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OriginGroupResourceState">]
- description: 'Provisioning status of the origin group. Known values are:

    "Succeeded", "Failed", "Updating", "Deleting", and "Creating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OriginGroupProvisioningState">]
attributes:
- uid: azure.mgmt.cdn.types.OriginGroupProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Updating", "Deleting", and "Creating".'
  signature: 'provisioningState: str | OriginGroupProvisioningState'
- uid: azure.mgmt.cdn.types.OriginGroupProperties.resourceState
  name: resourceState
  summary: '"Creating", "Active", and

    "Deleting".'
  signature: 'resourceState: str | OriginGroupResourceState'
- uid: azure.mgmt.cdn.types.OriginGroupProperties.healthProbeSettings
  name: healthProbeSettings
  signature: 'healthProbeSettings: HealthProbeParameters'
- uid: azure.mgmt.cdn.types.OriginGroupProperties.origins
  name: origins
  signature: 'origins: list[''ResourceReference'']'
- uid: azure.mgmt.cdn.types.OriginGroupProperties.responseBasedOriginErrorDetectionSettings
  name: responseBasedOriginErrorDetectionSettings
  signature: 'responseBasedOriginErrorDetectionSettings: ResponseBasedOriginErrorDetectionParameters'
- uid: azure.mgmt.cdn.types.OriginGroupProperties.trafficRestorationTimeToHealedOrNewEndpointsInMinutes
  name: trafficRestorationTimeToHealedOrNewEndpointsInMinutes
  signature: 'trafficRestorationTimeToHealedOrNewEndpointsInMinutes: int'
