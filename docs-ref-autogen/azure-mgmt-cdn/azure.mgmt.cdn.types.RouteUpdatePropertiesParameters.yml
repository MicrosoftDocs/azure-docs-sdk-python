### YamlMime:PythonClass
uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters
name: RouteUpdatePropertiesParameters
fullName: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters
module: azure.mgmt.cdn.types
summary: The JSON object that contains the properties of the domain to create.
constructor:
  syntax: RouteUpdatePropertiesParameters()
variables:
- description: The name of the endpoint which holds the route.
  name: endpoint_name
  types:
  - <xref:str>
- description: Domains referenced by this endpoint.
  name: custom_domains
  types:
  - <xref:list>[<xref:"ActivatedResourceReference">]
- description: A reference to the origin group.
  name: origin_group
  types:
  - <xref:<xref:"ResourceReference">>
- description: 'A directory path on the origin that AzureFrontDoor can use to retrieve

    content from, e.g. contoso.cloudapp.net/originpath.'
  name: origin_path
  types:
  - <xref:str>
- description: rule sets referenced by this endpoint.
  name: rule_sets
  types:
  - <xref:list>[<xref:"ResourceReference">]
- description: List of supported protocols for this route.
  name: supported_protocols
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"AFDEndpointProtocols">]]
- description: The route patterns of the rule.
  name: patterns_to_match
  types:
  - <xref:list>[<xref:str>]
- description: 'The caching configuration for this route. To disable caching, do not

    provide a cacheConfiguration object.'
  name: cache_configuration
  types:
  - <xref:<xref:"AfdRouteCacheConfiguration">>
- description: 'Protocol this rule will use when forwarding traffic to backends.

    Known values are: "HttpOnly", "HttpsOnly", and "MatchRequest".'
  name: forwarding_protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ForwardingProtocol">]
- description: 'whether this route will be linked to the default endpoint domain.

    Known values are: "Enabled" and "Disabled".'
  name: link_to_default_domain
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LinkToDefaultDomain">]
- description: 'Whether to automatically redirect HTTP traffic to HTTPS traffic. Note

    that this is a easy way to set up this rule and it will be the first rule that
    gets executed.

    Known values are: "Enabled" and "Disabled".'
  name: https_redirect
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HttpsRedirect">]
- description: 'Whether to enable use of this rule. Permitted values are ''Enabled''
    or

    ''Disabled''. Known values are: "Enabled" and "Disabled".'
  name: enabled_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EnabledState">]
attributes:
- uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters.cacheConfiguration
  name: cacheConfiguration
  summary: 'The caching configuration for this route. To disable caching, do not provide
    a

    cacheConfiguration object.'
  signature: 'cacheConfiguration: AfdRouteCacheConfiguration'
- uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters.customDomains
  name: customDomains
  summary: Domains referenced by this endpoint.
  signature: 'customDomains: list[''ActivatedResourceReference'']'
- uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters.enabledState
  name: enabledState
  summary: 'Whether to enable use of this rule. Permitted values are ''Enabled'' or
    ''Disabled''. Known values

    are: "Enabled" and "Disabled".'
  signature: 'enabledState: str | EnabledState'
- uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters.endpointName
  name: endpointName
  summary: The name of the endpoint which holds the route.
  signature: 'endpointName: str'
- uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters.forwardingProtocol
  name: forwardingProtocol
  summary: 'Protocol this rule will use when forwarding traffic to backends. Known
    values are:

    "HttpOnly", "HttpsOnly", and "MatchRequest".'
  signature: 'forwardingProtocol: str | ForwardingProtocol'
- uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters.httpsRedirect
  name: httpsRedirect
  summary: 'Whether to automatically redirect HTTP traffic to HTTPS traffic. Note
    that this is a easy way

    to set up this rule and it will be the first rule that gets executed. Known values
    are:

    "Enabled" and "Disabled".'
  signature: 'httpsRedirect: str | HttpsRedirect'
- uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters.linkToDefaultDomain
  name: linkToDefaultDomain
  summary: '"Enabled"

    and "Disabled".'
  signature: 'linkToDefaultDomain: str | LinkToDefaultDomain'
- uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters.originGroup
  name: originGroup
  summary: A reference to the origin group.
  signature: 'originGroup: ResourceReference'
- uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters.originPath
  name: originPath
  summary: 'A directory path on the origin that AzureFrontDoor can use to retrieve
    content from, e.g.

    contoso.cloudapp.net/originpath.'
  signature: 'originPath: str'
- uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters.patternsToMatch
  name: patternsToMatch
  summary: The route patterns of the rule.
  signature: 'patternsToMatch: list[str]'
- uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters.ruleSets
  name: ruleSets
  summary: rule sets referenced by this endpoint.
  signature: 'ruleSets: list[''ResourceReference'']'
- uid: azure.mgmt.cdn.types.RouteUpdatePropertiesParameters.supportedProtocols
  name: supportedProtocols
  summary: List of supported protocols for this route.
  signature: 'supportedProtocols: list[typing.Union[str, ForwardRef(''AFDEndpointProtocols'')]]'
