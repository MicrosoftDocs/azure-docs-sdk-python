### YamlMime:PythonClass
uid: azure.mgmt.resource.deployments.types.TemplateLink
name: TemplateLink
fullName: azure.mgmt.resource.deployments.types.TemplateLink
module: azure.mgmt.resource.deployments.types
summary: Entity representing the reference to the template.
constructor:
  syntax: TemplateLink()
variables:
- description: The URI of the template to deploy. Use either the uri or id property,
    but not both.
  name: uri
  types:
  - <xref:str>
- description: The resource id of a Template Spec. Use either the id or uri property,
    but not both.
  name: id
  types:
  - <xref:str>
- description: 'The relativePath property can be used to deploy a linked template
    at a

    location relative to the parent. If the parent template was linked with a TemplateSpec,
    this

    will reference an artifact in the TemplateSpec.  If the parent was linked with
    a URI, the child

    deployment will be a combination of the parent and relativePath URIs.'
  name: relative_path
  types:
  - <xref:str>
- description: If included, must match the ContentVersion in the template.
  name: content_version
  types:
  - <xref:str>
- description: 'The query string (for example, a SAS token) to be used with the

    templateLink URI.'
  name: query_string
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.resource.deployments.types.TemplateLink.contentVersion
  name: contentVersion
  summary: If included, must match the ContentVersion in the template.
  signature: 'contentVersion: str'
- uid: azure.mgmt.resource.deployments.types.TemplateLink.id
  name: id
  summary: The resource id of a Template Spec. Use either the id or uri property,
    but not both.
  signature: 'id: str'
- uid: azure.mgmt.resource.deployments.types.TemplateLink.queryString
  name: queryString
  summary: The query string (for example, a SAS token) to be used with the templateLink
    URI.
  signature: 'queryString: str'
- uid: azure.mgmt.resource.deployments.types.TemplateLink.relativePath
  name: relativePath
  summary: 'The relativePath property can be used to deploy a linked template at a
    location relative to the

    parent. If the parent template was linked with a TemplateSpec, this will reference
    an artifact

    in the TemplateSpec.  If the parent was linked with a URI, the child deployment
    will be a

    combination of the parent and relativePath URIs.'
  signature: 'relativePath: str'
- uid: azure.mgmt.resource.deployments.types.TemplateLink.uri
  name: uri
  summary: The URI of the template to deploy. Use either the uri or id property, but
    not both.
  signature: 'uri: str'
