summary: "> [!NOTE]\n> This is an experimental class, and may change at any time.\
  \ Please see [https://aka.ms/azure-ai-agentserver-experimental](https://aka.ms/azure-ai-agentserver-experimental)\
  \ for more information.\n>\n\nRaised when a resilient task function raises an unhandled\
  \ exception.\n\n: only `error` is carried. `task_id` is no longer\n   on the exception\
  \ (caller has it from the run handle).\n\n   keyword error:\n      Structured error\
  \ details (matches one of TaskErrorDict\n      or TaskExhaustedRetriesErrorDict).\n\
  \n   paramtype error:\n      dict[str, Any]"
