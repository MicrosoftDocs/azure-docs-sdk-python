### YamlMime:PythonClass
uid: azure.ai.agentserver.core.streaming.EventStream
name: EventStream
fullName: azure.ai.agentserver.core.streaming.EventStream
module: azure.ai.agentserver.core.streaming
summary: 'A multi-cast event stream.


  Four data-flow methods: <xref:azure.ai.agentserver.core.streaming.EventStream.emit>,
  <xref:azure.ai.agentserver.core.streaming.EventStream.close>,

  <xref:azure.ai.agentserver.core.streaming.EventStream.subscribe>, <xref:azure.ai.agentserver.core.streaming.EventStream.last_cursor>.
  Lifecycle (create /

  lookup / destroy) is the registry''s job (`streams`); the

  Protocol intentionally does NOT include a destructive method.


  See `docs/streaming-guide.md` for the developer guide.'
constructor:
  syntax: EventStream(*args, **kwargs)
methods:
- uid: azure.ai.agentserver.core.streaming.EventStream.close
  name: close
  summary: 'Transition the stream from active to closed. Idempotent.


    On an already-closed or destroyed stream, this is a no-op

    (never raises). Subscribers attached at close time drain any

    remaining queued items, then their iterators terminate

    cleanly with `StopAsyncIteration`.'
  signature: async close() -> None
- uid: azure.ai.agentserver.core.streaming.EventStream.emit
  name: emit
  summary: Emit a payload to all currently-attached subscribers.
  signature: 'async emit(payload: Any, *, close: bool = False) -> None'
  parameters:
  - name: payload
    description: 'Opaque value. The framework never inspects,

      validates, or rewrites it.'
    isRequired: true
    types:
    - <xref:typing.Any>
  keywordOnlyParameters:
  - name: close
    description: 'If `True`, the emit and the close-of-stream

      are observably atomic: every subscriber attached before

      this call returns sees BOTH the payload AND the

      end-of-stream signal; subscribers attached after see

      neither.'
    defaultValue: 'False'
    types:
    - <xref:bool>
  exceptions:
  - type: azure.ai.agentserver.core.streaming.EventStreamClosedError
    description: 'If the stream has already

      been closed.'
  - type: azure.ai.agentserver.core.streaming.EventStreamNotFoundError
    description: 'If the stream has been

      destroyed.'
- uid: azure.ai.agentserver.core.streaming.EventStream.last_cursor
  name: last_cursor
  summary: "Return the highest cursor seen so far, or `None`.\n\nSemantics:\n\n* While\
    \ the stream is active: the highest cursor value persisted so far, or `None` if\
    \ zero emits OR the active backing has no cursor support. \n\n* After the stream\
    \ is closed: the last cursor the backing ever saw, even if those events have since\
    \ been evicted by per-event TTL. `last_cursor()` is a read-only watermark query\
    \ and does not itself fire the close \u2192 destroy auto-transition. This is load-bearing\
    \ for the file-backed replay rehydration path (handler reads `last_cursor()` on\
    \ entry to pick the next cursor). \n\n* After the stream is destroyed (auto-transition\
    \ has fired): raises <xref:azure.ai.agentserver.core.streaming.EventStreamNotFoundError>.\
    \ \n\n`last_cursor()` is the **emitter's** recovery primitive.\nIt is NOT a workflow-recovery\
    \ primitive \u2014 workflow\nwatermarks (what work is done) belong in `ctx.metadata`,\n\
    batched per side-effecting operation. See\n`docs/streaming-guide.md` for the metadata-vs-cursor\n\
    antipattern note."
  signature: async last_cursor() -> int | None
- uid: azure.ai.agentserver.core.streaming.EventStream.subscribe
  name: subscribe
  summary: 'Return an async iterator over emitted payloads.


    NOT a coroutine: call without `await` and immediately use

    with `async for` / `aiter()` / `anext()`.'
  signature: 'subscribe(*, after: int | None = None) -> AsyncIterator[Any]'
  keywordOnlyParameters:
  - name: after
    description: 'If supplied and the active backing supports

      cursored replay, yield only payloads whose cursor value

      is strictly greater than `after`. Backings without

      cursor support silently ignore non-`None` values.'
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:int>]
  exceptions:
  - type: azure.ai.agentserver.core.streaming.EventStreamNotFoundError
    description: 'Raised synchronously at the

      call site (before the iterator is returned) if the

      stream has been destroyed.'
