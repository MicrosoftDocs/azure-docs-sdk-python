- uid: azure.ai.agentserver.core.tasks.TaskContext.pending_input_count
  name: pending_input_count
  summary: 'live count of queued steering inputs.


    Reflects the current backlog including inputs queued mid-handler.

    Reads as `0` for non-steerable tasks (where the provider

    returns 0). Replaces the legacy `ctx.pending_inputs: Sequence[Any]`

    snapshot.'
  return:
    description: Number of queued steering inputs.
    types:
    - <xref:int>
