uid: azure.ai.agentserver.core.streaming.EventStreamClosedError
name: EventStreamClosedError
fullName: azure.ai.agentserver.core.streaming.EventStreamClosedError
module: azure.ai.agentserver.core.streaming
summary: 'Raised when `emit()` is called on an already-closed stream.


  The stream still exists; the caller cannot add more events. This

  is a server-side bug (the producer kept emitting after closing)

  and should be wire-mapped to 5xx, not 4xx.'
