### YamlMime:PythonClass
uid: azure.mgmt.servicenetworking.types.SecurityPolicyProperties
name: SecurityPolicyProperties
fullName: azure.mgmt.servicenetworking.types.SecurityPolicyProperties
module: azure.mgmt.servicenetworking.types
summary: SecurityPolicy Properties.
constructor:
  syntax: SecurityPolicyProperties()
variables:
- description: 'Type of the Traffic Controller Security Policy. Known values are:
    "waf" and

    "ipAccessRules".'
  name: policyType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PolicyType">]
- description: 'Web Application Firewall Policy of the Traffic Controller Security
    Policy.

    Single Security Policy can have only one policy type set.'
  name: wafPolicy
  types:
  - <xref:<xref:"WafPolicy">>
- description: 'Ip Access Policy of the Traffic Controller Security Policy. Single

    Security Policy can have only one policy type set.'
  name: ipAccessRulesPolicy
  types:
  - <xref:<xref:"IpAccessRulesPolicy">>
- description: 'Provisioning State of Traffic Controller SecurityPolicy Resource.

    Known values are: "Provisioning", "Updating", "Deleting", "Accepted", "Succeeded",
    "Failed",

    and "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.servicenetworking.types.SecurityPolicyProperties.ipAccessRulesPolicy
  name: ipAccessRulesPolicy
  summary: 'Ip Access Policy of the Traffic Controller Security Policy. Single Security
    Policy can have

    only one policy type set.'
  signature: 'ipAccessRulesPolicy: IpAccessRulesPolicy'
- uid: azure.mgmt.servicenetworking.types.SecurityPolicyProperties.policyType
  name: policyType
  summary: '"waf" and

    "ipAccessRules".'
  signature: 'policyType: str | PolicyType'
- uid: azure.mgmt.servicenetworking.types.SecurityPolicyProperties.provisioningState
  name: provisioningState
  summary: 'Provisioning State of Traffic Controller SecurityPolicy Resource. Known
    values are:

    "Provisioning", "Updating", "Deleting", "Accepted", "Succeeded", "Failed", and

    "Canceled".'
  signature: 'provisioningState: str | ProvisioningState'
