### YamlMime:PythonClass
uid: azure.mgmt.servicenetworking.types.FrontendProperties
name: FrontendProperties
fullName: azure.mgmt.servicenetworking.types.FrontendProperties
module: azure.mgmt.servicenetworking.types
summary: Frontend Properties.
constructor:
  syntax: FrontendProperties()
variables:
- description: 'The Fully Qualified Domain Name of the DNS record associated to a
    Traffic

    Controller frontend.'
  name: fqdn
  types:
  - <xref:str>
- description: 'Whether public network access is allowed for the frontend. Enabled

    indicates a public frontend; Disabled indicates a private frontend. Known values
    are: "Enabled"

    and "Disabled".'
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: 'Reference to an Association resource that contains the subnet where
    the

    private frontend should be deployed.'
  name: association
  types:
  - <xref:<xref:"FrontendAssociation">>
- description: Frontend Security Policy Configuration.
  name: securityPolicyConfigurations
  types:
  - <xref:<xref:"SecurityPolicyConfigurations">>
- description: 'Provisioning State of Traffic Controller Frontend Resource. Known

    values are: "Provisioning", "Updating", "Deleting", "Accepted", "Succeeded", "Failed",
    and

    "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.servicenetworking.types.FrontendProperties.association
  name: association
  summary: 'Reference to an Association resource that contains the subnet where the
    private frontend should

    be deployed.'
  signature: 'association: FrontendAssociation'
- uid: azure.mgmt.servicenetworking.types.FrontendProperties.fqdn
  name: fqdn
  summary: The Fully Qualified Domain Name of the DNS record associated to a Traffic
    Controller frontend.
  signature: 'fqdn: str'
- uid: azure.mgmt.servicenetworking.types.FrontendProperties.provisioningState
  name: provisioningState
  summary: '"Provisioning",

    "Updating", "Deleting", "Accepted", "Succeeded", "Failed", and "Canceled".'
  signature: 'provisioningState: str | ProvisioningState'
