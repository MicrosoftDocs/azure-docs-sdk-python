    Disabled indicates a private frontend. Known values are: "Enabled" and "Disabled".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.servicenetworking.types.FrontendProperties.securityPolicyConfigurations
  name: securityPolicyConfigurations
  summary: Frontend Security Policy Configuration.
  signature: 'securityPolicyConfigurations: SecurityPolicyConfigurations'
