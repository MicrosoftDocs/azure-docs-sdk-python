  summary: Get a property by id.
  signature: 'get_property(property_id: PropertyId) -> str'
  parameters:
  - name: property_id
    description: The id of the property to be retrieved.
    isRequired: true
  return:
    description: The value of the property.
- uid: azure.cognitiveservices.speech.EmbeddedSpeechConfig.get_property_by_name
  name: get_property_by_name
  summary: Get a property by name.
  signature: 'get_property_by_name(property_name: str) -> str'
  parameters:
  - name: property_name
    description: The name of the property to be retrieved.
    isRequired: true
  return:
    description: The value of the property.
- uid: azure.cognitiveservices.speech.EmbeddedSpeechConfig.get_speech_recognition_models
  name: get_speech_recognition_models
  summary: Gets a list of available speech recognition models.
  signature: get_speech_recognition_models() -> List[SpeechRecognitionModelInfo]
  return:
    description: The list of speech recognition models.
- uid: azure.cognitiveservices.speech.EmbeddedSpeechConfig.get_speech_translation_models
  name: get_speech_translation_models
  summary: Gets a list of available speech translation models.
  signature: get_speech_translation_models() -> List[SpeechTranslationModelInfo]
  return:
    description: The list of speech translation models.
- uid: azure.cognitiveservices.speech.EmbeddedSpeechConfig.set_keyword_recognition_model
  name: set_keyword_recognition_model
  summary: 'Sets the model for keyword recognition. This is for customer specific
    models that are

    tailored for detecting wake words and direct commands.'
  signature: 'set_keyword_recognition_model(name: str, license: str)'
  parameters:
  - name: name
    description: The model name.
    isRequired: true
  - name: license
    description: The license text.
    isRequired: true
- uid: azure.cognitiveservices.speech.EmbeddedSpeechConfig.set_profanity
  name: set_profanity
  summary: Sets the profanity option. This can be used to remove profane words or
