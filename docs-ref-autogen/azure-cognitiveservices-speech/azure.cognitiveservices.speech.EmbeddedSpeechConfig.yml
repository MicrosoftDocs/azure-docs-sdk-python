### YamlMime:PythonClass
uid: azure.cognitiveservices.speech.EmbeddedSpeechConfig
name: EmbeddedSpeechConfig
fullName: azure.cognitiveservices.speech.EmbeddedSpeechConfig
module: azure.cognitiveservices.speech
summary: Class that defines embedded (offline) speech configuration.
constructor:
  syntax: 'EmbeddedSpeechConfig(path: str | None = None, paths: List[str] | None =
    None)'
  parameters:
  - name: path
    description: 'The folder path to search for offline models. This can be a root
      path under which

      several models are located in subfolders, or a direct path to a specific model
      folder.'
    defaultValue: None
  - name: paths
    description: 'A list of folder paths to search for offline models. These can be
      root paths under

      which several models are located in subfolders, or direct paths to specific
      model folders.'
    defaultValue: None
methods:
- uid: azure.cognitiveservices.speech.EmbeddedSpeechConfig.from_path
  name: from_path
  summary: Creates an instance of the embedded speech config with a specified offline
    model path.
  signature: 'from_path(path: str) -> EmbeddedSpeechConfig'
  parameters:
  - name: path
    description: 'The folder path to search for offline models. This can be a root
      path under

      which several models are located in subfolders, or a direct path to a specific
      model folder.'
    isRequired: true
  return:
    description: An EmbeddedSpeechConfig instance.
- uid: azure.cognitiveservices.speech.EmbeddedSpeechConfig.from_paths
  name: from_paths
  summary: Creates an instance of the embedded speech config with specified offline
    model paths.
  signature: 'from_paths(paths: List[str]) -> EmbeddedSpeechConfig'
  parameters:
  - name: paths
    description: 'The folder paths to search for offline models. These can be root
      paths under

      which several models are located in subfolders, or direct paths to specific
      model folders.'
    isRequired: true
  return:
    description: An EmbeddedSpeechConfig instance.
