    isRequired: true
- uid: azure.cognitiveservices.speech.EmbeddedSpeechConfig.set_speech_synthesis_voice
  name: set_speech_synthesis_voice
  summary: Sets the voice for embedded speech synthesis.
  signature: 'set_speech_synthesis_voice(name: str, license: str)'
  parameters:
  - name: name
    description: The voice name of the embedded speech synthesis.
