### YamlMime:PythonClass
uid: azure.ai.translation.document.types.DocumentBatch
name: DocumentBatch
fullName: azure.ai.translation.document.types.DocumentBatch
module: azure.ai.translation.document.types
summary: Definition for the input batch translation request.
constructor:
  syntax: DocumentBatch()
variables:
- description: Source of the input documents. Required.
  name: source
  types:
  - <xref:<xref:"SourceInput">>
- description: Location of the destination for the output. Required.
  name: targets
  types:
  - <xref:list>[<xref:"TranslationTarget">]
- description: 'Storage type of the input documents source string. Known values are:

    "Folder" and "File".'
  name: storage_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageInputType">]
methods:
- uid: azure.ai.translation.document.types.DocumentBatch.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.ai.translation.document.types.DocumentBatch.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.ai.translation.document.types.DocumentBatch.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.ai.translation.document.types.DocumentBatch.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.translation.document.types.DocumentBatch.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.ai.translation.document.types.DocumentBatch.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.ai.translation.document.types.DocumentBatch.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.ai.translation.document.types.DocumentBatch.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.ai.translation.document.types.DocumentBatch.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.translation.document.types.DocumentBatch.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.ai.translation.document.types.DocumentBatch.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.ai.translation.document.types.DocumentBatch.source
  name: source
  summary: Source of the input documents. Required.
  signature: 'source: Required[SourceInput]'
- uid: azure.ai.translation.document.types.DocumentBatch.storageType
  name: storageType
  summary: '"Folder" and "File".'
  signature: 'storageType: str | StorageInputType'
- uid: azure.ai.translation.document.types.DocumentBatch.targets
  name: targets
  summary: Location of the destination for the output. Required.
  signature: 'targets: Required[list[''TranslationTarget'']]'
