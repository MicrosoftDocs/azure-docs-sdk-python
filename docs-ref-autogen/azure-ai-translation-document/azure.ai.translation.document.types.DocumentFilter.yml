### YamlMime:PythonClass
uid: azure.ai.translation.document.types.DocumentFilter
name: DocumentFilter
fullName: azure.ai.translation.document.types.DocumentFilter
module: azure.ai.translation.document.types
summary: Document filter.
constructor:
  syntax: DocumentFilter()
variables:
- description: 'A case-sensitive prefix string to filter documents in the source path
    for

    translation. For example, when using a Azure storage blob Uri, use the prefix
    to restrict sub

    folders for translation.'
  name: prefix
  types:
  - <xref:str>
- description: 'A case-sensitive suffix string to filter documents in the source path
    for

    translation. This is most often use for file extensions.'
  name: suffix
  types:
  - <xref:str>
methods:
- uid: azure.ai.translation.document.types.DocumentFilter.clear
  name: clear
  signature: clear() -> None.  Remove all items from D.
- uid: azure.ai.translation.document.types.DocumentFilter.copy
  name: copy
  signature: copy() -> a shallow copy of D
- uid: azure.ai.translation.document.types.DocumentFilter.fromkeys
  name: fromkeys
  summary: Create a new dictionary with keys from iterable and values set to value.
  signature: fromkeys(value=None, /)
  positionalOnlyParameters:
  - name: iterable
    isRequired: true
  - name: value
    defaultValue: None
- uid: azure.ai.translation.document.types.DocumentFilter.get
  name: get
  summary: Return the value for key if key is in the dictionary, else default.
  signature: get(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.translation.document.types.DocumentFilter.items
  name: items
  signature: items() -> a set-like object providing a view on D's items
- uid: azure.ai.translation.document.types.DocumentFilter.keys
  name: keys
  signature: keys() -> a set-like object providing a view on D's keys
- uid: azure.ai.translation.document.types.DocumentFilter.pop
  name: pop
  summary: 'If the key is not found, return the default if given; otherwise,

    raise a KeyError.'
  signature: pop(k, [d]) -> v, remove specified key and return the corresponding value.
- uid: azure.ai.translation.document.types.DocumentFilter.popitem
  name: popitem
  summary: 'Remove and return a (key, value) pair as a 2-tuple.


    Pairs are returned in LIFO (last-in, first-out) order.

    Raises KeyError if the dict is empty.'
  signature: popitem()
- uid: azure.ai.translation.document.types.DocumentFilter.setdefault
  name: setdefault
  summary: 'Insert key with a value of default if key is not in the dictionary.


    Return the value for key if key is in the dictionary, else default.'
  signature: setdefault(key, default=None, /)
  positionalOnlyParameters:
  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.translation.document.types.DocumentFilter.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.ai.translation.document.types.DocumentFilter.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.ai.translation.document.types.DocumentFilter.prefix
  name: prefix
  summary: 'A case-sensitive prefix string to filter documents in the source path
    for translation. For

    example, when using a Azure storage blob Uri, use the prefix to restrict sub folders
    for

    translation.'
  signature: 'prefix: str'
- uid: azure.ai.translation.document.types.DocumentFilter.suffix
  name: suffix
  summary: 'A case-sensitive suffix string to filter documents in the source path
    for translation. This is

    most often use for file extensions.'
  signature: 'suffix: str'
