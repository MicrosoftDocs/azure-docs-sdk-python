uid: azure.mgmt.providerhub.types.WriteLockConfiguration
name: WriteLockConfiguration
fullName: azure.mgmt.providerhub.types.WriteLockConfiguration
module: azure.mgmt.providerhub.types
summary: The write lock configuration.
constructor:
  syntax: WriteLockConfiguration()
variables:
- description: 'The state of write lock feature. The feature will ensure a deterministic
    sequence

    of write-operation within and across the verbs. Also the feature will ensure that
    the semantics

    of synchronous and long-running operations are honored. Known values are: "Disabled"
    and

    "Enabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WriteLockState">]
