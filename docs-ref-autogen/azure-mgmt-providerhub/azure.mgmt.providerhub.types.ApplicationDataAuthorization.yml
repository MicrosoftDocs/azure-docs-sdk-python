### YamlMime:PythonClass
uid: azure.mgmt.providerhub.types.ApplicationDataAuthorization
name: ApplicationDataAuthorization
fullName: azure.mgmt.providerhub.types.ApplicationDataAuthorization
module: azure.mgmt.providerhub.types
summary: ApplicationDataAuthorization.
constructor:
  syntax: ApplicationDataAuthorization()
variables:
- description: 'The ownership role the application has on the resource types. The
    service owner

    role gives the application owner permissions. The limited owner role gives elevated
    permissions

    but does not allow all the permissions of a service owner, such as read/write
    on internal

    metadata. Required. Known values are: "ServiceOwner" and "LimitedOwner".'
  name: role
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Role">]
- description: 'The resource types from the defined resource types in the provider

    namespace that the application can access. If no resource types are specified
    and the role is

    service owner, the default is * which is all resource types.'
  name: resourceTypes
  types:
  - <xref:list>[<xref:str>]
- description: 'Exclude application id from ''providerAuthorizations''

    section of manifest?.'
  name: excludeApplicationIdFromManifest
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.providerhub.types.ApplicationDataAuthorization.excludeApplicationIdFromManifest
  name: excludeApplicationIdFromManifest
  summary: Exclude application id from 'providerAuthorizations' section of manifest?.
  signature: 'excludeApplicationIdFromManifest: bool'
- uid: azure.mgmt.providerhub.types.ApplicationDataAuthorization.resourceTypes
  name: resourceTypes
  summary: 'The resource types from the defined resource types in the provider namespace
    that the

    application can access. If no resource types are specified and the role is service
    owner, the

    default is * which is all resource types.'
  signature: 'resourceTypes: list[str]'
- uid: azure.mgmt.providerhub.types.ApplicationDataAuthorization.role
  name: role
  summary: 'The ownership role the application has on the resource types. The service
    owner role gives the

    application owner permissions. The limited owner role gives elevated permissions
    but does not

    allow all the permissions of a service owner, such as read/write on internal metadata.

    Required. Known values are: "ServiceOwner" and "LimitedOwner".'
  signature: 'role: Required[str | Role]'
