uid: azure.mgmt.providerhub.types.RequestHeaderOptions
name: RequestHeaderOptions
fullName: azure.mgmt.providerhub.types.RequestHeaderOptions
module: azure.mgmt.providerhub.types
summary: RequestHeaderOptions.
constructor:
  syntax: RequestHeaderOptions()
variables:
- description: 'The opt in headers. Known values are: "NotSpecified", "SignedUserToken",

    "ClientGroupMembership", "SignedAuxiliaryTokens", "UnboundedClientGroupMembership",

    "PrivateLinkId", "PrivateLinkResourceId", "ManagementGroupAncestorsEncoded",

    "PrivateLinkVnetTrafficTag", "ResourceGroupLocation", "ClientPrincipalNameEncoded",
    and

    "MSIResourceIdEncoded".'
  name: opt_in_headers
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OptInHeaderType">]
- description: 'The opt out headers. Known values are: "NotSpecified" and

    "SystemDataCreatedByLastModifiedBy".'
  name: opt_out_headers
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OptOutHeaderType">]
attributes:
