### YamlMime:PythonClass
uid: azure.mgmt.containerservicefleet.types.PropertySelectorRequirement
name: PropertySelectorRequirement
fullName: azure.mgmt.containerservicefleet.types.PropertySelectorRequirement
module: azure.mgmt.containerservicefleet.types
summary: 'PropertySelectorRequirement is a specific property requirement when picking
  clusters for

  resource placement.'
constructor:
  syntax: PropertySelectorRequirement()
variables:
- description: Name is the name of the property; it should be a Kubernetes label name.
    Required.
  name: name
  types:
  - <xref:str>
- description: 'Operator specifies the relationship between a cluster''s observed
    value of the

    specified property and the values given in the requirement. Required. Known values
    are: "Gt",

    "Ge", "Eq", "Ne", "Lt", and "Le".'
  name: operator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PropertySelectorOperator">]
- description: 'Values are a list of values of the specified property which Fleet
    will compare

    against the observed values of individual member clusters in accordance with the
    given

    operator. At this moment, each value should be a Kubernetes quantity. For more
    information, see

    [https://pkg.go.dev/k8s.io/apimachinery/pkg/api/resource#Quantity](https://pkg.go.dev/k8s.io/apimachinery/pkg/api/resource#Quantity).
    If the operator is Gt

    (greater than), Ge (greater than or equal to), Lt (less than), or `Le` (less than
    or equal

    to), Eq (equal to), or Ne (ne), exactly one value must be specified in the list.
    Required.'
  name: values
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.containerservicefleet.types.PropertySelectorRequirement.name
  name: name
  summary: Name is the name of the property; it should be a Kubernetes label name.
    Required.
  signature: 'name: Required[str]'
- uid: azure.mgmt.containerservicefleet.types.PropertySelectorRequirement.operator
  name: operator
  summary: 'Operator specifies the relationship between a cluster''s observed value
    of the specified

    property and the values given in the requirement. Required. Known values are:
    "Gt", "Ge",

    "Eq", "Ne", "Lt", and "Le".'
  signature: 'operator: Required[str | PropertySelectorOperator]'
