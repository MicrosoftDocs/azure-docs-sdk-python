### YamlMime:PythonClass
uid: azure.mgmt.containerservicefleet.types.FleetMemberProperties
name: FleetMemberProperties
fullName: azure.mgmt.containerservicefleet.types.FleetMemberProperties
module: azure.mgmt.containerservicefleet.types
summary: A member of the Fleet. It contains a reference to an existing Kubernetes
  cluster on Azure.
constructor:
  syntax: FleetMemberProperties()
variables:
- description: 'The ARM resource id of the cluster that joins the Fleet. Must be a

    valid Azure resource id. e.g.:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ContainerService/managedClusters/{clusterName}''.

    Required.'
  name: clusterResourceId
  types:
  - <xref:str>
- description: The group this member belongs to for multi-cluster update management.
  name: group
  types:
  - <xref:str>
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Joining", "Leaving", and "Updating".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FleetMemberProvisioningState">]
- description: The labels for the fleet member.
  name: labels
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Status information of the last operation for fleet member.
  name: status
  types:
  - <xref:<xref:"FleetMemberStatus">>
attributes:
- uid: azure.mgmt.containerservicefleet.types.FleetMemberProperties.clusterResourceId
  name: clusterResourceId
  summary: 'The ARM resource id of the cluster that joins the Fleet. Must be a valid
    Azure resource id.

    e.g.:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ContainerService/managedClusters/{clusterName}''.

    Required.'
  signature: 'clusterResourceId: Required[str]'
- uid: azure.mgmt.containerservicefleet.types.FleetMemberProperties.group
  name: group
  summary: The group this member belongs to for multi-cluster update management.
  signature: 'group: str'
- uid: azure.mgmt.containerservicefleet.types.FleetMemberProperties.labels
  name: labels
  summary: The labels for the fleet member.
  signature: 'labels: dict[str, str]'
- uid: azure.mgmt.containerservicefleet.types.FleetMemberProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Joining", "Leaving", and "Updating".'
  signature: 'provisioningState: str | FleetMemberProvisioningState'
- uid: azure.mgmt.containerservicefleet.types.FleetMemberProperties.status
  name: status
  summary: Status information of the last operation for fleet member.
  signature: 'status: FleetMemberStatus'
