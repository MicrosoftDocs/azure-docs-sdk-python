### YamlMime:PythonClass
uid: azure.mgmt.containerservicefleet.types.LabelSelector
name: LabelSelector
fullName: azure.mgmt.containerservicefleet.types.LabelSelector
module: azure.mgmt.containerservicefleet.types
summary: 'A label selector is a label query over a set of resources. The result of
  matchLabels and

  matchExpressions are ANDed. An empty label selector matches all objects. A null
  label selector

  matches no objects.'
constructor:
  syntax: LabelSelector()
variables:
- description: 'matchLabels is a map of {key,value} pairs. A single {key,value} in
    the

    matchLabels map is equivalent to an element of matchExpressions, whose key field
    is "key", the

    operator is "In", and the values array contains only "value". The requirements
    are ANDed.'
  name: matchLabels
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'matchExpressions is a list of label selector requirements. The

    requirements are ANDed.'
  name: matchExpressions
  types:
  - <xref:list>[<xref:"LabelSelectorRequirement">]
attributes:
- uid: azure.mgmt.containerservicefleet.types.LabelSelector.matchExpressions
  name: matchExpressions
  summary: matchExpressions is a list of label selector requirements. The requirements
    are ANDed.
  signature: 'matchExpressions: list[azure.mgmt.containerservicefleet.types.LabelSelectorRequirement]'
- uid: azure.mgmt.containerservicefleet.types.LabelSelector.matchLabels
  name: matchLabels
  summary: 'matchLabels is a map of {key,value} pairs. A single {key,value} in the
    matchLabels map is

    equivalent to an element of matchExpressions, whose key field is "key", the operator
    is

    "In", and the values array contains only "value". The requirements are ANDed.'
  signature: 'matchLabels: dict[str, str]'
