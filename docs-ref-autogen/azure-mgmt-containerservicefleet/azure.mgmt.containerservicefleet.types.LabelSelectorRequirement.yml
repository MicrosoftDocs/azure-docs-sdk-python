### YamlMime:PythonClass
uid: azure.mgmt.containerservicefleet.types.LabelSelectorRequirement
name: LabelSelectorRequirement
fullName: azure.mgmt.containerservicefleet.types.LabelSelectorRequirement
module: azure.mgmt.containerservicefleet.types
summary: 'A label selector requirement is a selector that contains values, a key,
  and an operator that

  relates the key and values.'
constructor:
  syntax: LabelSelectorRequirement()
variables:
- description: key is the label key that the selector applies to. Required.
  name: key
  types:
  - <xref:str>
- description: 'operator represents a key''s relationship to a set of values. Valid
    operators

    are In, NotIn, Exists and DoesNotExist. Required. Known values are: "In", "NotIn",
    "Exists",

    and "DoesNotExist".'
  name: operator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LabelSelectorOperator">]
- description: 'values is an array of string values. If the operator is In or NotIn,
    the values

    array must be non-empty. If the operator is Exists or DoesNotExist, the values
    array must be

    empty. This array is replaced during a strategic merge patch.'
  name: values
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.containerservicefleet.types.LabelSelectorRequirement.key
  name: key
  summary: key is the label key that the selector applies to. Required.
  signature: 'key: Required[str]'
- uid: azure.mgmt.containerservicefleet.types.LabelSelectorRequirement.operator
  name: operator
  summary: 'operator represents a key''s relationship to a set of values. Valid operators
    are In, NotIn,

    Exists and DoesNotExist. Required. Known values are: "In", "NotIn", "Exists",
    and

    "DoesNotExist".'
  signature: 'operator: Required[str | LabelSelectorOperator]'
