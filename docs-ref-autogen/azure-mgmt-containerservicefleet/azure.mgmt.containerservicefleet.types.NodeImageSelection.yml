### YamlMime:PythonClass
uid: azure.mgmt.containerservicefleet.types.NodeImageSelection
name: NodeImageSelection
fullName: azure.mgmt.containerservicefleet.types.NodeImageSelection
module: azure.mgmt.containerservicefleet.types
summary: The node image upgrade to be applied to the target nodes in update run.
constructor:
  syntax: NodeImageSelection()
variables:
- description: 'The node image upgrade type. Required. Known values are: "Latest",
    "Consistent",

    and "Custom".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NodeImageSelectionType">]
- description: 'Custom node image versions to upgrade the nodes to. This field

    is required if node image selection type is Custom. Otherwise, it must be empty.
    For each node

    image family (e.g., ''AKSUbuntu-1804gen2containerd''), this field can contain
    at most one version

    (e.g., only one of ''AKSUbuntu-1804gen2containerd-2023.01.12'' or

    ''AKSUbuntu-1804gen2containerd-2023.02.12'', not both). If the nodes belong to
    a family without a

    matching image version in this field, they are not upgraded.'
  name: customNodeImageVersions
  types:
  - <xref:list>[<xref:"NodeImageVersion">]
attributes:
- uid: azure.mgmt.containerservicefleet.types.NodeImageSelection.customNodeImageVersions
  name: customNodeImageVersions
  summary: 'Custom node image versions to upgrade the nodes to. This field is required
    if node image

    selection type is Custom. Otherwise, it must be empty. For each node image family
    (e.g.,

    ''AKSUbuntu-1804gen2containerd''), this field can contain at most one version
    (e.g., only one of

    ''AKSUbuntu-1804gen2containerd-2023.01.12'' or ''AKSUbuntu-1804gen2containerd-2023.02.12'',
    not

    both). If the nodes belong to a family without a matching image version in this
    field, they are

    not upgraded.'
  signature: 'customNodeImageVersions: list[''NodeImageVersion'']'
- uid: azure.mgmt.containerservicefleet.types.NodeImageSelection.type
  name: type
  summary: '"Latest", "Consistent", and

    "Custom".'
  signature: 'type: Required[str | NodeImageSelectionType]'
