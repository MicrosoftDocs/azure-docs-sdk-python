### YamlMime:PythonClass
uid: azure.mgmt.containerservicefleet.types.AutoUpgradeProfileProperties
name: AutoUpgradeProfileProperties
fullName: azure.mgmt.containerservicefleet.types.AutoUpgradeProfileProperties
module: azure.mgmt.containerservicefleet.types
summary: The properties of the AutoUpgradeProfile.
constructor:
  syntax: AutoUpgradeProfileProperties()
variables:
- description: 'The provisioning state of the AutoUpgradeProfile resource. Known

    values are: "Succeeded", "Failed", and "Canceled".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoUpgradeProfileProvisioningState">]
- description: 'The resource id of the UpdateStrategy resource to reference. If not

    specified, the auto upgrade will run on all clusters which are members of the
    fleet.'
  name: updateStrategyId
  types:
  - <xref:str>
- description: 'Configures how auto-upgrade will be run. Required. Known values are:
    "Stable",

    "Rapid", "NodeImage", and "TargetKubernetesVersion".'
  name: channel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UpgradeChannel">]
- description: 'The node image upgrade to be applied to the target clusters in auto

    upgrade.'
  name: nodeImageSelection
  types:
  - <xref:<xref:"AutoUpgradeNodeImageSelection">>
- description: 'If set to False: the auto upgrade has effect - target managed clusters
    will be

    upgraded on schedule. If set to True: the auto upgrade has no effect - no upgrade
    will be run

    on the target managed clusters. This is a boolean and not an enum because enabled/disabled
    are

    all available states of the auto upgrade profile. By default, this is set to False.'
  name: disabled
  types:
  - <xref:bool>
- description: The status of the auto upgrade profile.
  name: autoUpgradeProfileStatus
  types:
  - <xref:<xref:"AutoUpgradeProfileStatus">>
- description: 'This is the target Kubernetes version for auto-upgrade. The

    format must be `{major version}.{minor version}`. For example, "1.30". By default,
    this is

    empty. If upgrade channel is set to TargetKubernetesVersion, this field must not
    be empty. If

    upgrade channel is Rapid, Stable or NodeImage, this field must be empty.'
  name: targetKubernetesVersion
  types:
  - <xref:str>
- description: 'If upgrade channel is not TargetKubernetesVersion, this field must
    be

    False. If set to True: Fleet auto upgrade will continue generate update runs for
    patches of

    minor versions earlier than N-2 (where N is the latest supported minor version)
    if those minor

    versions support Long-Term Support (LTS). By default, this is set to False. For
    more

    information on AKS LTS, please see

    [https://learn.microsoft.com/en-us/azure/aks/long-term-support](https://learn.microsoft.com/en-us/azure/aks/long-term-support).'
  name: longTermSupport
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.containerservicefleet.types.AutoUpgradeProfileProperties.autoUpgradeProfileStatus
  name: autoUpgradeProfileStatus
  summary: The status of the auto upgrade profile.
  signature: 'autoUpgradeProfileStatus: AutoUpgradeProfileStatus'
- uid: azure.mgmt.containerservicefleet.types.AutoUpgradeProfileProperties.channel
  name: channel
  summary: '"Stable", "Rapid",

    "NodeImage", and "TargetKubernetesVersion".'
  signature: 'channel: Required[str | UpgradeChannel]'
- uid: azure.mgmt.containerservicefleet.types.AutoUpgradeProfileProperties.disabled
  name: disabled
  summary: 'the auto upgrade has effect - target managed clusters will be upgraded
    on

    schedule. If set to True: the auto upgrade has no effect - no upgrade will be
    run on the target

    managed clusters. This is a boolean and not an enum because enabled/disabled are
    all available

    states of the auto upgrade profile. By default, this is set to False.'
  signature: 'disabled: bool'
- uid: azure.mgmt.containerservicefleet.types.AutoUpgradeProfileProperties.longTermSupport
  name: longTermSupport
  summary: 'If upgrade channel is not TargetKubernetesVersion, this field must be
    False. If set to True:

    Fleet auto upgrade will continue generate update runs for patches of minor versions
    earlier

    than N-2 (where N is the latest supported minor version) if those minor versions
    support

    Long-Term Support (LTS). By default, this is set to False. For more information
    on AKS LTS,

    please see [https://learn.microsoft.com/en-us/azure/aks/long-term-support](https://learn.microsoft.com/en-us/azure/aks/long-term-support).'
  signature: 'longTermSupport: bool'
- uid: azure.mgmt.containerservicefleet.types.AutoUpgradeProfileProperties.nodeImageSelection
  name: nodeImageSelection
  summary: The node image upgrade to be applied to the target clusters in auto upgrade.
  signature: 'nodeImageSelection: AutoUpgradeNodeImageSelection'
- uid: azure.mgmt.containerservicefleet.types.AutoUpgradeProfileProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", and "Canceled".'
  signature: 'provisioningState: str | AutoUpgradeProfileProvisioningState'
- uid: azure.mgmt.containerservicefleet.types.AutoUpgradeProfileProperties.targetKubernetesVersion
  name: targetKubernetesVersion
  summary: 'This is the target Kubernetes version for auto-upgrade. The format must
    be `{major

    version}.{minor version}`. For example, "1.30". By default, this is empty. If
    upgrade

    channel is set to TargetKubernetesVersion, this field must not be empty. If upgrade
    channel is

    Rapid, Stable or NodeImage, this field must be empty.'
  signature: 'targetKubernetesVersion: str'
- uid: azure.mgmt.containerservicefleet.types.AutoUpgradeProfileProperties.updateStrategyId
  name: updateStrategyId
  summary: 'The resource id of the UpdateStrategy resource to reference. If not specified,
    the auto upgrade

    will run on all clusters which are members of the fleet.'
  signature: 'updateStrategyId: str'
