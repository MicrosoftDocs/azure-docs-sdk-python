### YamlMime:PythonClass
uid: azure.mgmt.storage.types.StorageDataShareProperties
name: StorageDataShareProperties
fullName: azure.mgmt.storage.types.StorageDataShareProperties
module: azure.mgmt.storage.types
summary: The storage datashare properties.
constructor:
  syntax: StorageDataShareProperties()
variables:
- description: 'System-generated GUID identifier for the Storage DataShare. Not a

    valid input parameter when creating.'
  name: dataShareIdentifier
  types:
  - <xref:str>
- description: Arbitrary description of this Data Share. Max 250 characters.
  name: description
  types:
  - <xref:str>
- description: 'The DataShare URI to be shared with the consumer. URI Format -

    ''azds://<location>:<dataShareName>:<dataShareIdentifier>''.'
  name: dataShareUri
  types:
  - <xref:str>
- description: 'List of access policies that specify the permission allowed to a managed

    identity. For Create - This property is required and cannot be null. If no access
    policies are

    provided at creation time, specify an empty array. For Update - This property
    is optional. If

    set to null or not passed, the existing access policies are left unchanged. If
    provided with a

    non-null value, the existing access policies are replaced with the specified list.
    Required.'
  name: accessPolicies
  types:
  - <xref:list>[<xref:"StorageDataShareAccessPolicy">]
- description: 'List of assets that specify the properties of the shared resources.
    For Create -

    This property is required and cannot be null. If no assets are provided at creation
    time,

    specify an empty array. For Update - This property is optional. If set to null
    or not passed,

    the existing assets are left unchanged. If provided with a non-null value, the
    existing assets

    are replaced with the specified list. Required.'
  name: assets
  types:
  - <xref:list>[<xref:"StorageDataShareAsset">]
- description: 'Represents the provisioning state of the storage datashare. Known

    values are: "Accepted", "Creating", "Succeeded", "Deleting", "Canceled", and "Failed".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NativeDataSharingProvisioningState">]
