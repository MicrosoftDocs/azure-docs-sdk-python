### YamlMime:PythonClass
uid: azure.mgmt.storage.models.SkuInformation
name: SkuInformation
fullName: azure.mgmt.storage.models.SkuInformation
module: azure.mgmt.storage.models
summary: Storage SKU and its properties.
constructor:
  syntax: 'SkuInformation(*args: Any, **kwargs: Any)'
variables:
- description: 'The SKU name. Required for account creation; optional for update.
    Note that in

    older versions, SKU name was called accountType. Required. Known values are: "Standard_LRS",

    "Standard_GRS", "Standard_RAGRS", "Standard_ZRS", "Premium_LRS", "Premium_ZRS",

    "Standard_GZRS", "Standard_RAGZRS", "StandardV2_LRS", "StandardV2_GRS", "StandardV2_ZRS",

    "StandardV2_GZRS", "PremiumV2_LRS", and "PremiumV2_ZRS".'
  name: name
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.SkuName>
- description: 'The SKU tier. This is based on the SKU name. Known values are: "Standard"
    and

    "Premium".'
  name: tier
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.SkuTier>
- description: The type of the resource, usually it is 'storageAccounts'.
  name: resource_type
  types:
  - <xref:str>
- description: 'Indicates the type of storage account. Known values are: "Storage",
    "StorageV2",

    "BlobStorage", "FileStorage", and "BlockBlobStorage".'
  name: kind
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.Kind>
- description: 'The set of locations that the SKU is available. This will be supported
    and

    registered Azure Geo Regions (e.g. West US, East US, Southeast Asia, etc.).'
  name: locations
  types:
  - <xref:list>[<xref:str>]
- name: location_info
  types:
  - <xref:list>[<xref:azure.mgmt.storage.models.SkuInformationLocationInfoItem>]
- description: 'The capability information in the specified SKU, including file encryption,

    network ACLs, change notification, etc.'
  name: capabilities
  types:
  - <xref:list>[<xref:azure.mgmt.storage.models.SKUCapability>]
- description: 'The restrictions because of which SKU cannot be used. This is empty
    if

    there are no restrictions.'
  name: restrictions
  types:
  - <xref:list>[<xref:azure.mgmt.storage.models.Restriction>]
attributes:
- uid: azure.mgmt.storage.models.SkuInformation.capabilities
  name: capabilities
  summary: 'The capability information in the specified SKU, including file encryption,
    network ACLs,

    change notification, etc.'
  signature: 'capabilities: list[''_models.SKUCapability''] | None'
- uid: azure.mgmt.storage.models.SkuInformation.kind
  name: kind
  summary: '"Storage", "StorageV2",

    "BlobStorage", "FileStorage", and "BlockBlobStorage".'
  signature: 'kind: str | _models.Kind | None'
- uid: azure.mgmt.storage.models.SkuInformation.location_info
  name: location_info
  signature: 'location_info: list[''_models.SkuInformationLocationInfoItem''] | None'
- uid: azure.mgmt.storage.models.SkuInformation.locations
  name: locations
  summary: 'The set of locations that the SKU is available. This will be supported
    and registered Azure Geo

    Regions (e.g. West US, East US, Southeast Asia, etc.).'
  signature: 'locations: list[str] | None'
- uid: azure.mgmt.storage.models.SkuInformation.name
  name: name
  summary: 'The SKU name. Required for account creation; optional for update. Note
    that in older versions,

    SKU name was called accountType. Required. Known values are: "Standard_LRS",

    "Standard_GRS", "Standard_RAGRS", "Standard_ZRS", "Premium_LRS", "Premium_ZRS",

    "Standard_GZRS", "Standard_RAGZRS", "StandardV2_LRS", "StandardV2_GRS",

    "StandardV2_ZRS", "StandardV2_GZRS", "PremiumV2_LRS", and "PremiumV2_ZRS".'
  signature: 'name: str | _models.SkuName'
- uid: azure.mgmt.storage.models.SkuInformation.resource_type
  name: resource_type
  summary: The type of the resource, usually it is 'storageAccounts'.
  signature: 'resource_type: str | None'
- uid: azure.mgmt.storage.models.SkuInformation.restrictions
  name: restrictions
  summary: 'The restrictions because of which SKU cannot be used. This is empty if
    there are no

    restrictions.'
  signature: 'restrictions: list[''_models.Restriction''] | None'
- uid: azure.mgmt.storage.models.SkuInformation.tier
  name: tier
  summary: '"Standard" and "Premium".'
  signature: 'tier: str | _models.SkuTier | None'
