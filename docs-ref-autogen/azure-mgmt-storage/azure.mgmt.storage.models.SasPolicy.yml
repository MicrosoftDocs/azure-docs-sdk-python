### YamlMime:PythonClass
uid: azure.mgmt.storage.models.SasPolicy
name: SasPolicy
fullName: azure.mgmt.storage.models.SasPolicy
module: azure.mgmt.storage.models
summary: SasPolicy assigned to the storage account.
constructor:
  syntax: 'SasPolicy(*args: Any, **kwargs: Any)'
variables:
- description: The SAS expiration period, DD.HH:MM:SS. Required.
  name: sas_expiration_period
  types:
  - <xref:str>
- description: 'The SAS Expiration Action defines the action to be performed when

    sasPolicy.sasExpirationPeriod is violated. The ''Log'' action can be used for
    audit purposes and

    the ''Block'' action can be used to block and deny the usage of SAS tokens that
    do not adhere to

    the sas policy expiration period. Required. Known values are: "Log" and "Block".'
  name: expiration_action
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.ExpirationAction>
- description: 'Indicates whether user delegation SAS (shared

    access signature) tokens are required to be bound to a specific user. The default

    interpretation is false for this property.'
  name: require_user_bound_user_delegation_sas
  types:
  - <xref:bool>
- description: 'The action to perform when a user

    delegation SAS (shared access signature) token is not bound to a user as required
    by

    requireUserBoundUserDelegationSas. Known values are: "None", "Log", and "Block".'
  name: require_user_bound_user_delegation_sas_action
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.PolicyViolationAction>
attributes:
- uid: azure.mgmt.storage.models.SasPolicy.expiration_action
  name: expiration_action
  summary: 'The SAS Expiration Action defines the action to be performed when sasPolicy.sasExpirationPeriod

    is violated. The ''Log'' action can be used for audit purposes and the ''Block''
    action can be used

    to block and deny the usage of SAS tokens that do not adhere to the sas policy
    expiration

    period. Required. Known values are: "Log" and "Block".'
  signature: 'expiration_action: str | _models.ExpirationAction'
- uid: azure.mgmt.storage.models.SasPolicy.require_user_bound_user_delegation_sas
  name: require_user_bound_user_delegation_sas
  summary: 'Indicates whether user delegation SAS (shared access signature) tokens
    are required to be bound

    to a specific user. The default interpretation is false for this property.'
  signature: 'require_user_bound_user_delegation_sas: bool | None'
- uid: azure.mgmt.storage.models.SasPolicy.require_user_bound_user_delegation_sas_action
  name: require_user_bound_user_delegation_sas_action
  summary: 'The action to perform when a user delegation SAS (shared access signature)
    token is not bound

    to a user as required by requireUserBoundUserDelegationSas. Known values are:
    "None",

    "Log", and "Block".'
  signature: 'require_user_bound_user_delegation_sas_action: str | _models.PolicyViolationAction
    | None'
- uid: azure.mgmt.storage.models.SasPolicy.sas_expiration_period
  name: sas_expiration_period
  summary: SS. Required.
  signature: 'sas_expiration_period: str'
