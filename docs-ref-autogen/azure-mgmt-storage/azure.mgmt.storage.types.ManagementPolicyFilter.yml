### YamlMime:PythonClass
uid: azure.mgmt.storage.types.ManagementPolicyFilter
name: ManagementPolicyFilter
fullName: azure.mgmt.storage.types.ManagementPolicyFilter
module: azure.mgmt.storage.types
summary: 'Filters limit rule actions to a subset of blobs within the storage account.
  If multiple filters

  are defined, a logical AND is performed on all filters.'
constructor:
  syntax: ManagementPolicyFilter()
variables:
- description: An array of strings for prefixes to be match.
  name: prefixMatch
  types:
  - <xref:list>[<xref:str>]
- description: 'An array of predefined enum values. Currently blockBlob supports all
    tiering

    and delete actions. Only delete actions are supported for appendBlob. Required.'
  name: blobTypes
  types:
  - <xref:list>[<xref:str>]
- description: 'An array of blob index tag based filters, there can be at most 10
    tag

    filters.'
  name: blobIndexMatch
  types:
  - <xref:list>[<xref:"TagFilter">]
attributes:
- uid: azure.mgmt.storage.types.ManagementPolicyFilter.blobIndexMatch
  name: blobIndexMatch
  summary: An array of blob index tag based filters, there can be at most 10 tag filters.
  signature: 'blobIndexMatch: list[azure.mgmt.storage.types.TagFilter]'
- uid: azure.mgmt.storage.types.ManagementPolicyFilter.blobTypes
  name: blobTypes
  summary: 'An array of predefined enum values. Currently blockBlob supports all tiering
    and delete

    actions. Only delete actions are supported for appendBlob. Required.'
  signature: 'blobTypes: list[str]'
- uid: azure.mgmt.storage.types.ManagementPolicyFilter.prefixMatch
  name: prefixMatch
  summary: An array of strings for prefixes to be match.
  signature: 'prefixMatch: list[str]'
