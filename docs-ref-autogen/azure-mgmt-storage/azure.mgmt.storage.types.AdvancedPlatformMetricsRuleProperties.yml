### YamlMime:PythonClass
uid: azure.mgmt.storage.types.AdvancedPlatformMetricsRuleProperties
name: AdvancedPlatformMetricsRuleProperties
fullName: azure.mgmt.storage.types.AdvancedPlatformMetricsRuleProperties
module: azure.mgmt.storage.types
summary: An object that defines the advanced platform metrics rule.
constructor:
  syntax: AdvancedPlatformMetricsRuleProperties()
variables:
- description: 'Indicates the type of the advanced platform metrics rule. Possible
    values

    include: ContainerLevelCapacityMetrics. "ContainerLevelCapacityMetrics"'
  name: ruleType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AdvancedPlatformMetricsRuleType">]
- description: A boolean flag which enables the advanced platform metrics rule. Required.
  name: enabled
  types:
  - <xref:bool>
- description: 'Gets the last modification date and time of the advanced platform

    metrics rule in UTC.'
  name: lastModifiedTime
  types:
  - <xref:str>
- description: 'The metrics emitted by the rule. Metrics are mapped according to the
    rule

    type from RuleTypeProperty. Rule type to metrics mapping: ContainerLevelCapacityMetrics
    =>

    {ContainerUsedSize, ContainerBlobCount}.'
  name: metricsEmitted
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"MetricsEmitted">]]
- description: Configuration for the advanced platform metrics rule. Required.
  name: ruleConfig
  types:
  - <xref:<xref:"AdvancedPlatformMetricsRuleConfig">>
attributes:
- uid: azure.mgmt.storage.types.AdvancedPlatformMetricsRuleProperties.enabled
  name: enabled
  summary: A boolean flag which enables the advanced platform metrics rule. Required.
  signature: 'enabled: Required[bool]'
- uid: azure.mgmt.storage.types.AdvancedPlatformMetricsRuleProperties.lastModifiedTime
  name: lastModifiedTime
  summary: Gets the last modification date and time of the advanced platform metrics
    rule in UTC.
  signature: 'lastModifiedTime: str'
- uid: azure.mgmt.storage.types.AdvancedPlatformMetricsRuleProperties.metricsEmitted
  name: metricsEmitted
  summary: 'The metrics emitted by the rule. Metrics are mapped according to the rule
    type from

    RuleTypeProperty. Rule type to metrics mapping: ContainerLevelCapacityMetrics
    =>

    {ContainerUsedSize, ContainerBlobCount}.'
  signature: 'metricsEmitted: list[typing.Union[str, ForwardRef(''MetricsEmitted'')]]'
- uid: azure.mgmt.storage.types.AdvancedPlatformMetricsRuleProperties.ruleConfig
  name: ruleConfig
  summary: Configuration for the advanced platform metrics rule. Required.
  signature: 'ruleConfig: Required[AdvancedPlatformMetricsRuleConfig]'
- uid: azure.mgmt.storage.types.AdvancedPlatformMetricsRuleProperties.ruleType
  name: ruleType
  summary: 'Indicates the type of the advanced platform metrics rule. Possible values
    include:

    ContainerLevelCapacityMetrics. "ContainerLevelCapacityMetrics"'
  signature: 'ruleType: str | AdvancedPlatformMetricsRuleType'
