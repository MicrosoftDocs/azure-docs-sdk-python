uid: azure.mgmt.storage.models.StaticWebsite
name: StaticWebsite
fullName: azure.mgmt.storage.models.StaticWebsite
module: azure.mgmt.storage.models
summary: The static website properties for blob storage.
constructor:
  syntax: 'StaticWebsite(*args: Any, **kwargs: Any)'
variables:
- description: 'Indicates whether static website support is enabled for the specified
    account.

    Required.'
  name: enabled
  types:
  - <xref:bool>
- description: 'The webpage that Azure Storage serves for requests to the root of
    a

    website or any subfolder (for example, index.html). The value is case-sensitive.'
  name: index_document
  types:
  - <xref:str>
- description: 'The absolute path where the default index file is present.

    This absolute path is mutually exclusive to "indexDocument" and it is case-sensitive.'
  name: default_index_document_path
  types:
  - <xref:str>
- description: 'The absolute path to a webpage that Azure Storage serves for

    requests that don''t correspond to an existing file. The contents of the page
    are returned with

    HTTP 404 Not Found. Only a single custom 404 page is supported in each static
    website.'
  name: error_document404_path
  types:
  - <xref:str>
