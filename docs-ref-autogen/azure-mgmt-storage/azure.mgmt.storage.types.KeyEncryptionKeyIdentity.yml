### YamlMime:PythonClass
uid: azure.mgmt.storage.types.KeyEncryptionKeyIdentity
name: KeyEncryptionKeyIdentity
fullName: azure.mgmt.storage.types.KeyEncryptionKeyIdentity
module: azure.mgmt.storage.types
summary: 'All identity configuration for Customer-managed key settings defining which
  identity should be

  used to auth to Key Vault.'
constructor:
  syntax: KeyEncryptionKeyIdentity()
variables:
- description: 'The type of identity to use. Values can be systemAssignedIdentity,

    userAssignedIdentity, or delegatedResourceIdentity. Known values are: "systemAssignedIdentity",

    "userAssignedIdentity", and "delegatedResourceIdentity".'
  name: identityType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KeyEncryptionKeyIdentityType">]
- description: 'User assigned identity to use for accessing key

    encryption key Url. Ex:

    /subscriptions/fa5fc227-a624-475e-b696-cdd604c735bc/resourceGroups/<resource

    group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myId. Mutually
    exclusive with

    identityType systemAssignedIdentity.'
  name: userAssignedIdentityResourceId
  types:
  - <xref:str>
- description: 'application client identity to use for accessing key encryption key

    Url in a different tenant. Ex: f83c6b1b-4d34-47e4-bb34-9d83df58b540.'
  name: federatedClientId
  types:
  - <xref:str>
- description: 'delegated identity to use for accessing key encryption key

    Url. Ex: /subscriptions/fa5fc227-a624-475e-b696-cdd604c735bc/resourceGroups/<resource

    group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myId. Mutually
    exclusive with

    identityType systemAssignedIdentity and userAssignedIdentity - internal use only.'
  name: delegatedIdentityClientId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storage.types.KeyEncryptionKeyIdentity.delegatedIdentityClientId
  name: delegatedIdentityClientId
  summary: 'delegated identity to use for accessing key encryption key Url. Ex:

    /subscriptions/fa5fc227-a624-475e-b696-cdd604c735bc/resourceGroups/<resource

    group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myId. Mutually
    exclusive with

    identityType systemAssignedIdentity and userAssignedIdentity - internal use only.'
  signature: 'delegatedIdentityClientId: str'
- uid: azure.mgmt.storage.types.KeyEncryptionKeyIdentity.federatedClientId
  name: federatedClientId
  summary: 'application client identity to use for accessing key encryption key Url
    in a different tenant.

    Ex: f83c6b1b-4d34-47e4-bb34-9d83df58b540.'
  signature: 'federatedClientId: str'
- uid: azure.mgmt.storage.types.KeyEncryptionKeyIdentity.identityType
  name: identityType
  summary: 'The type of identity to use. Values can be systemAssignedIdentity, userAssignedIdentity,
    or

    delegatedResourceIdentity. Known values are: "systemAssignedIdentity",

    "userAssignedIdentity", and "delegatedResourceIdentity".'
  signature: 'identityType: str | KeyEncryptionKeyIdentityType'
- uid: azure.mgmt.storage.types.KeyEncryptionKeyIdentity.userAssignedIdentityResourceId
  name: userAssignedIdentityResourceId
  summary: 'User assigned identity to use for accessing key encryption key Url. Ex:

    /subscriptions/fa5fc227-a624-475e-b696-cdd604c735bc/resourceGroups/<resource

    group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myId. Mutually
    exclusive with

    identityType systemAssignedIdentity.'
  signature: 'userAssignedIdentityResourceId: str'
