### YamlMime:PythonClass
uid: azure.mgmt.storage.types.StaticWebsite
name: StaticWebsite
fullName: azure.mgmt.storage.types.StaticWebsite
module: azure.mgmt.storage.types
summary: The static website properties for blob storage.
constructor:
  syntax: StaticWebsite()
variables:
- description: 'Indicates whether static website support is enabled for the specified
    account.

    Required.'
  name: enabled
  types:
  - <xref:bool>
- description: 'The webpage that Azure Storage serves for requests to the root of
    a

    website or any subfolder (for example, index.html). The value is case-sensitive.'
  name: indexDocument
  types:
  - <xref:str>
- description: 'The absolute path where the default index file is present. This

    absolute path is mutually exclusive to "indexDocument" and it is case-sensitive.'
  name: defaultIndexDocumentPath
  types:
  - <xref:str>
- description: 'The absolute path to a webpage that Azure Storage serves for

    requests that don''t correspond to an existing file. The contents of the page
    are returned with

    HTTP 404 Not Found. Only a single custom 404 page is supported in each static
    website.'
  name: errorDocument404Path
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storage.types.StaticWebsite.defaultIndexDocumentPath
  name: defaultIndexDocumentPath
  summary: 'The absolute path where the default index file is present. This absolute
    path is mutually

    exclusive to "indexDocument" and it is case-sensitive.'
  signature: 'defaultIndexDocumentPath: str'
- uid: azure.mgmt.storage.types.StaticWebsite.enabled
  name: enabled
  summary: Indicates whether static website support is enabled for the specified account.
    Required.
  signature: 'enabled: bool'
- uid: azure.mgmt.storage.types.StaticWebsite.errorDocument404Path
  name: errorDocument404Path
  summary: 'The absolute path to a webpage that Azure Storage serves for requests
    that don''t correspond to

    an existing file. The contents of the page are returned with HTTP 404 Not Found.
    Only a single

    custom 404 page is supported in each static website.'
  signature: 'errorDocument404Path: str'
- uid: azure.mgmt.storage.types.StaticWebsite.indexDocument
  name: indexDocument
  summary: 'The webpage that Azure Storage serves for requests to the root of a website
    or any subfolder

    (for example, index.html). The value is case-sensitive.'
  signature: 'indexDocument: str'
