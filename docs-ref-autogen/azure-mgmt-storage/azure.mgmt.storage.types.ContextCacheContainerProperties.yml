### YamlMime:PythonClass
uid: azure.mgmt.storage.types.ContextCacheContainerProperties
name: ContextCacheContainerProperties
fullName: azure.mgmt.storage.types.ContextCacheContainerProperties
module: azure.mgmt.storage.types
summary: Details of a container within a Context Cache.
constructor:
  syntax: ContextCacheContainerProperties()
variables:
- description: Container description.
  name: description
  types:
  - <xref:str>
- description: 'The model name associated with this container (e.g., gpt-4, claude-3).

    Required.'
  name: modelName
  types:
  - <xref:str>
- description: The AI provider associated with this container. Required. "OpenAI"
  name: provider
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AiProvider">]
- description: "The Time to Live (TTL) in days (1\u201330) for this container. Blobs\
    \ in the\ncontainer that have not been accessed within this number of days will\
    \ be automatically deleted.\nIf not specified at creation time, it defaults to\
    \ 1 day."
  name: timeToLive
  types:
  - <xref:int>
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", "Updating", "Deleting", and "Accepted".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ContextCacheProvisioningState">]
attributes:
- uid: azure.mgmt.storage.types.ContextCacheContainerProperties.description
  name: description
  summary: Container description.
  signature: 'description: str'
- uid: azure.mgmt.storage.types.ContextCacheContainerProperties.modelName
  name: modelName
  summary: The model name associated with this container (e.g., gpt-4, claude-3).
    Required.
  signature: 'modelName: Required[str]'
- uid: azure.mgmt.storage.types.ContextCacheContainerProperties.provider
  name: provider
  summary: The AI provider associated with this container. Required. "OpenAI"
  signature: 'provider: Required[str | AiProvider]'
- uid: azure.mgmt.storage.types.ContextCacheContainerProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Creating", "Updating", "Deleting", and "Accepted".'
  signature: 'provisioningState: str | ContextCacheProvisioningState'
- uid: azure.mgmt.storage.types.ContextCacheContainerProperties.timeToLive
  name: timeToLive
  summary: "The Time to Live (TTL) in days (1\u201330) for this container. Blobs in\
    \ the container that have not\nbeen accessed within this number of days will be\
    \ automatically deleted. If not specified at\ncreation time, it defaults to 1\
    \ day."
  signature: 'timeToLive: int'
