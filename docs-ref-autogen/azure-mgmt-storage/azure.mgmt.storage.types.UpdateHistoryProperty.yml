### YamlMime:PythonClass
uid: azure.mgmt.storage.types.UpdateHistoryProperty
name: UpdateHistoryProperty
fullName: azure.mgmt.storage.types.UpdateHistoryProperty
module: azure.mgmt.storage.types
summary: An update history of the ImmutabilityPolicy of a blob container.
constructor:
  syntax: UpdateHistoryProperty()
variables:
- description: 'The ImmutabilityPolicy update type of a blob container, possible values
    include:

    put, lock and extend. Known values are: "put", "lock", and "extend".'
  name: update
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ImmutabilityPolicyUpdateType">]
- description: 'The immutability period for the blobs in the

    container since the policy creation, in days.'
  name: immutabilityPeriodSinceCreationInDays
  types:
  - <xref:int>
- description: Returns the date and time the ImmutabilityPolicy was updated.
  name: timestamp
  types:
  - <xref:str>
- description: Returns the Object ID of the user who updated the ImmutabilityPolicy.
  name: objectIdentifier
  types:
  - <xref:str>
- description: 'Returns the Tenant ID that issued the token for the user who updated
    the

    ImmutabilityPolicy.'
  name: tenantId
  types:
  - <xref:str>
- description: Returns the User Principal Name of the user who updated the ImmutabilityPolicy.
  name: upn
  types:
  - <xref:str>
- description: 'This property can only be changed for unlocked time-based

    retention policies. When enabled, new blocks can be written to an append blob
    while maintaining

    immutability protection and compliance. Only new blocks can be added and any existing
    blocks

    cannot be modified or deleted. This property cannot be changed with ExtendImmutabilityPolicy

    API.'
  name: allowProtectedAppendWrites
  types:
  - <xref:bool>
- description: 'This property can only be changed for unlocked time-based

    retention policies. When enabled, new blocks can be written to both ''Append and
    Bock Blobs''

    while maintaining immutability protection and compliance. Only new blocks can
    be added and any

    existing blocks cannot be modified or deleted. This property cannot be changed
    with

    ExtendImmutabilityPolicy API. The ''allowProtectedAppendWrites'' and

    ''allowProtectedAppendWritesAll'' properties are mutually exclusive.'
  name: allowProtectedAppendWritesAll
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.storage.types.UpdateHistoryProperty.allowProtectedAppendWrites
  name: allowProtectedAppendWrites
  summary: 'This property can only be changed for unlocked time-based retention policies.
    When enabled, new

    blocks can be written to an append blob while maintaining immutability protection
    and

    compliance. Only new blocks can be added and any existing blocks cannot be modified
    or deleted.

    This property cannot be changed with ExtendImmutabilityPolicy API.'
  signature: 'allowProtectedAppendWrites: bool'
- uid: azure.mgmt.storage.types.UpdateHistoryProperty.allowProtectedAppendWritesAll
  name: allowProtectedAppendWritesAll
  summary: 'This property can only be changed for unlocked time-based retention policies.
    When enabled, new

    blocks can be written to both ''Append and Bock Blobs'' while maintaining immutability
    protection

    and compliance. Only new blocks can be added and any existing blocks cannot be
    modified or

    deleted. This property cannot be changed with ExtendImmutabilityPolicy API. The

    ''allowProtectedAppendWrites'' and ''allowProtectedAppendWritesAll'' properties
    are mutually

    exclusive.'
  signature: 'allowProtectedAppendWritesAll: bool'
- uid: azure.mgmt.storage.types.UpdateHistoryProperty.immutabilityPeriodSinceCreationInDays
  name: immutabilityPeriodSinceCreationInDays
  summary: The immutability period for the blobs in the container since the policy
    creation, in days.
  signature: 'immutabilityPeriodSinceCreationInDays: int'
- uid: azure.mgmt.storage.types.UpdateHistoryProperty.objectIdentifier
  name: objectIdentifier
  summary: Returns the Object ID of the user who updated the ImmutabilityPolicy.
  signature: 'objectIdentifier: str'
- uid: azure.mgmt.storage.types.UpdateHistoryProperty.tenantId
  name: tenantId
  summary: Returns the Tenant ID that issued the token for the user who updated the
    ImmutabilityPolicy.
  signature: 'tenantId: str'
- uid: azure.mgmt.storage.types.UpdateHistoryProperty.timestamp
  name: timestamp
  summary: Returns the date and time the ImmutabilityPolicy was updated.
  signature: 'timestamp: str'
- uid: azure.mgmt.storage.types.UpdateHistoryProperty.upn
  name: upn
  summary: Returns the User Principal Name of the user who updated the ImmutabilityPolicy.
  signature: 'upn: str'
