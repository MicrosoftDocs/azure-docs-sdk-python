uid: azure.mgmt.storage.types.ContextCacheProperties
name: ContextCacheProperties
fullName: azure.mgmt.storage.types.ContextCacheProperties
module: azure.mgmt.storage.types
summary: Details of the Context Cache.
constructor:
  syntax: ContextCacheProperties()
variables:
- description: 'The kind of account determining storage topology. Required. Known
    values

    are: "Regional", "DataZone", and "Global".'
  name: accountKind
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ContextCacheAccountKind">]
- description: Account description.
  name: description
  types:
  - <xref:str>
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Creating", "Updating", "Deleting", and "Accepted".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ContextCacheProvisioningState">]
- description: Encryption settings for the account.
  name: encryption
  types:
  - <xref:<xref:"StorageAccountEncryption">>
attributes:
- uid: azure.mgmt.storage.types.ContextCacheProperties.accountKind
  name: accountKind
  summary: '"Regional",

    "DataZone", and "Global".'
  signature: 'accountKind: Required[str | ContextCacheAccountKind]'
- uid: azure.mgmt.storage.types.ContextCacheProperties.description
  name: description
  summary: Account description.
  signature: 'description: str'
- uid: azure.mgmt.storage.types.ContextCacheProperties.encryption
  name: encryption
  summary: Encryption settings for the account.
  signature: 'encryption: StorageAccountEncryption'
- uid: azure.mgmt.storage.types.ContextCacheProperties.provisioningState
  name: provisioningState
