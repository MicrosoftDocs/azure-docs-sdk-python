### YamlMime:PythonClass
uid: azure.mgmt.storage.types.ServiceSasParameters
name: ServiceSasParameters
fullName: azure.mgmt.storage.types.ServiceSasParameters
module: azure.mgmt.storage.types
summary: The parameters to list service SAS credentials of a specific resource.
constructor:
  syntax: ServiceSasParameters()
variables:
- description: The canonical path to the signed resource. Required.
  name: canonicalizedResource
  types:
  - <xref:str>
- description: 'The signed services accessible with the service SAS. Possible values

    include: Blob (b), Container (c), File (f), Share (s). Known values are: "b",
    "c", "f", and

    "s".'
  name: signedResource
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SignedResource">]
- description: 'The signed permissions for the service SAS. Possible values include:

    Read (r), Write (w), Delete (d), List (l), Add (a), Create (c), Update (u) and
    Process (p).

    Known values are: "r", "d", "w", "l", "a", "c", "u", and "p".'
  name: signedPermission
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Permissions">]
- description: An IP address or a range of IP addresses from which to accept requests.
  name: signedIp
  types:
  - <xref:str>
- description: 'The protocol permitted for a request made with the account SAS. Known

    values are: "https,http" and "https".'
  name: signedProtocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HttpProtocol">]
- description: The time at which the SAS becomes valid.
  name: signedStart
  types:
  - <xref:str>
- description: The time at which the shared access signature becomes invalid.
  name: signedExpiry
  types:
  - <xref:str>
- description: 'A unique value up to 64 characters in length that correlates to an

    access policy specified for the container, queue, or table.'
  name: signedIdentifier
  types:
  - <xref:str>
- description: The start of partition key.
  name: startPk
  types:
  - <xref:str>
- description: The end of partition key.
  name: endPk
  types:
  - <xref:str>
- description: The start of row key.
  name: startRk
  types:
  - <xref:str>
- description: The end of row key.
  name: endRk
  types:
  - <xref:str>
- description: The key to sign the account SAS token with.
  name: keyToSign
  types:
  - <xref:str>
- description: The response header override for cache control.
  name: rscc
  types:
  - <xref:str>
- description: The response header override for content disposition.
  name: rscd
  types:
  - <xref:str>
- description: The response header override for content encoding.
  name: rsce
  types:
  - <xref:str>
- description: The response header override for content language.
  name: rscl
  types:
  - <xref:str>
- description: The response header override for content type.
  name: rsct
  types:
  - <xref:str>
