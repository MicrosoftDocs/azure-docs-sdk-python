### YamlMime:PythonClass
uid: azure.mgmt.storage.types.EncryptionScopeProperties
name: EncryptionScopeProperties
fullName: azure.mgmt.storage.types.EncryptionScopeProperties
module: azure.mgmt.storage.types
summary: Properties of the encryption scope.
constructor:
  syntax: EncryptionScopeProperties()
variables:
- description: 'The provider for the encryption scope. Possible values (case-insensitive):

    Microsoft.Storage, Microsoft.KeyVault. Known values are: "Microsoft.Storage" and

    "Microsoft.KeyVault".'
  name: source
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EncryptionScopeSource">]
- description: 'The state of the encryption scope. Possible values (case-insensitive):  Enabled,

    Disabled. Known values are: "Enabled" and "Disabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EncryptionScopeState">]
- description: Gets the creation date and time of the encryption scope in UTC.
  name: creationTime
  types:
  - <xref:str>
- description: 'Gets the last modification date and time of the encryption scope in

    UTC.'
  name: lastModifiedTime
  types:
  - <xref:str>
- description: 'The key vault properties for the encryption scope. This is a required

    field if encryption scope ''source'' attribute is set to ''Microsoft.KeyVault''.'
  name: keyVaultProperties
  types:
  - <xref:<xref:"EncryptionScopeKeyVaultProperties">>
- description: 'A boolean indicating whether or not the service applies

    a secondary layer of encryption with platform managed keys for data at rest.'
  name: requireInfrastructureEncryption
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.storage.types.EncryptionScopeProperties.creationTime
  name: creationTime
  summary: Gets the creation date and time of the encryption scope in UTC.
  signature: 'creationTime: str'
- uid: azure.mgmt.storage.types.EncryptionScopeProperties.keyVaultProperties
  name: keyVaultProperties
  summary: 'The key vault properties for the encryption scope. This is a required
    field if encryption scope

    ''source'' attribute is set to ''Microsoft.KeyVault''.'
  signature: 'keyVaultProperties: EncryptionScopeKeyVaultProperties'
- uid: azure.mgmt.storage.types.EncryptionScopeProperties.lastModifiedTime
  name: lastModifiedTime
  summary: Gets the last modification date and time of the encryption scope in UTC.
  signature: 'lastModifiedTime: str'
- uid: azure.mgmt.storage.types.EncryptionScopeProperties.requireInfrastructureEncryption
  name: requireInfrastructureEncryption
  summary: 'A boolean indicating whether or not the service applies a secondary layer
    of encryption with

    platform managed keys for data at rest.'
  signature: 'requireInfrastructureEncryption: bool'
- uid: azure.mgmt.storage.types.EncryptionScopeProperties.source
  name: source
  summary: 'Microsoft.Storage,

    Microsoft.KeyVault. Known values are: "Microsoft.Storage" and "Microsoft.KeyVault".'
  signature: 'source: str | EncryptionScopeSource'
- uid: azure.mgmt.storage.types.EncryptionScopeProperties.state
  name: state
  summary: 'Enabled, Disabled.

    Known values are: "Enabled" and "Disabled".'
  signature: 'state: str | EncryptionScopeState'
