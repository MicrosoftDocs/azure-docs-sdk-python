### YamlMime:PythonClass
uid: azure.mgmt.storage.models.EncryptionService
name: EncryptionService
fullName: azure.mgmt.storage.models.EncryptionService
module: azure.mgmt.storage.models
summary: A service that allows server-side encryption to be used.
constructor:
  syntax: 'EncryptionService(*args: Any, **kwargs: Any)'
variables:
- description: 'A boolean indicating whether or not the service encrypts the data
    as it is

    stored. Encryption at rest is enabled by default today and cannot be disabled.'
  name: enabled
  types:
  - <xref:bool>
- description: 'Gets a rough estimate of the date/time when the encryption was last

    enabled by the user. Data is encrypted at rest by default today and cannot be
    disabled.'
  name: last_enabled_time
  types:
  - <xref:datetime.datetime>
- description: 'Encryption key type to be used for the encryption service. ''Account''
    key type

    implies that an account-scoped encryption key will be used. ''Service'' key type
    implies that a

    default service key is used. Known values are: "Service" and "Account".'
  name: key_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.KeyType>
attributes:
- uid: azure.mgmt.storage.models.EncryptionService.enabled
  name: enabled
  summary: 'A boolean indicating whether or not the service encrypts the data as it
    is stored. Encryption

    at rest is enabled by default today and cannot be disabled.'
  signature: 'enabled: bool | None'
- uid: azure.mgmt.storage.models.EncryptionService.key_type
  name: key_type
  summary: 'Encryption key type to be used for the encryption service. ''Account''
    key type implies that an

    account-scoped encryption key will be used. ''Service'' key type implies that
    a default service

    key is used. Known values are: "Service" and "Account".'
  signature: 'key_type: str | _models.KeyType | None'
- uid: azure.mgmt.storage.models.EncryptionService.last_enabled_time
  name: last_enabled_time
  summary: 'Gets a rough estimate of the date/time when the encryption was last enabled
    by the user. Data

    is encrypted at rest by default today and cannot be disabled.'
  signature: 'last_enabled_time: datetime | None'
