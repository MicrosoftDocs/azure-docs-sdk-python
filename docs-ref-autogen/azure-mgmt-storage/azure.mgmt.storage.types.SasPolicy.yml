### YamlMime:PythonClass
uid: azure.mgmt.storage.types.SasPolicy
name: SasPolicy
fullName: azure.mgmt.storage.types.SasPolicy
module: azure.mgmt.storage.types
summary: SasPolicy assigned to the storage account.
constructor:
  syntax: SasPolicy()
variables:
- description: The SAS expiration period, DD.HH:MM:SS. Required.
  name: sasExpirationPeriod
  types:
  - <xref:str>
- description: 'The SAS Expiration Action defines the action to be performed when

    sasPolicy.sasExpirationPeriod is violated. The ''Log'' action can be used for
    audit purposes and

    the ''Block'' action can be used to block and deny the usage of SAS tokens that
    do not adhere to

    the sas policy expiration period. Required. Known values are: "Log" and "Block".'
  name: expirationAction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExpirationAction">]
- description: 'Indicates whether user delegation SAS (shared access

    signature) tokens are required to be bound to a specific user. The default interpretation
    is

    false for this property.'
  name: requireUserBoundUserDelegationSas
  types:
  - <xref:bool>
- description: 'The action to perform when a user delegation SAS

    (shared access signature) token is not bound to a user as required by

    requireUserBoundUserDelegationSas. Known values are: "None", "Log", and "Block".'
  name: requireUserBoundUserDelegationSasAction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PolicyViolationAction">]
attributes:
- uid: azure.mgmt.storage.types.SasPolicy.expirationAction
  name: expirationAction
  summary: 'The SAS Expiration Action defines the action to be performed when sasPolicy.sasExpirationPeriod

    is violated. The ''Log'' action can be used for audit purposes and the ''Block''
    action can be used

    to block and deny the usage of SAS tokens that do not adhere to the sas policy
    expiration

    period. Required. Known values are: "Log" and "Block".'
  signature: 'expirationAction: Required[str | ExpirationAction]'
- uid: azure.mgmt.storage.types.SasPolicy.requireUserBoundUserDelegationSas
  name: requireUserBoundUserDelegationSas
  summary: 'Indicates whether user delegation SAS (shared access signature) tokens
    are required to be bound

    to a specific user. The default interpretation is false for this property.'
  signature: 'requireUserBoundUserDelegationSas: bool'
- uid: azure.mgmt.storage.types.SasPolicy.requireUserBoundUserDelegationSasAction
  name: requireUserBoundUserDelegationSasAction
  summary: 'The action to perform when a user delegation SAS (shared access signature)
    token is not bound

    to a user as required by requireUserBoundUserDelegationSas. Known values are:
    "None",

    "Log", and "Block".'
  signature: 'requireUserBoundUserDelegationSasAction: str | PolicyViolationAction'
- uid: azure.mgmt.storage.types.SasPolicy.sasExpirationPeriod
  name: sasExpirationPeriod
  summary: SS. Required.
  signature: 'sasExpirationPeriod: Required[str]'
