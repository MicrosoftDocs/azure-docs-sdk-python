uid: azure.mgmt.storage.types.EncryptionScopeKeyVaultProperties
name: EncryptionScopeKeyVaultProperties
fullName: azure.mgmt.storage.types.EncryptionScopeKeyVaultProperties
module: azure.mgmt.storage.types
summary: 'The key vault properties for the encryption scope. This is a required field
  if encryption scope

  ''source'' attribute is set to ''Microsoft.KeyVault''.'
constructor:
  syntax: EncryptionScopeKeyVaultProperties()
variables:
- description: 'The object identifier for a key vault key object. When applied, the
    encryption

    scope will use the key referenced by the identifier to enable customer-managed
    key support on

    this encryption scope.'
  name: keyUri
  types:
  - <xref:str>
- description: 'The object identifier of the current versioned Key Vault

    Key in use.'
  name: currentVersionedKeyIdentifier
  types:
  - <xref:str>
- description: Timestamp of last rotation of the Key Vault Key.
  name: lastKeyRotationTimestamp
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storage.types.EncryptionScopeKeyVaultProperties.currentVersionedKeyIdentifier
  name: currentVersionedKeyIdentifier
  summary: The object identifier of the current versioned Key Vault Key in use.
  signature: 'currentVersionedKeyIdentifier: str'
- uid: azure.mgmt.storage.types.EncryptionScopeKeyVaultProperties.keyUri
  name: keyUri
  summary: 'The object identifier for a key vault key object. When applied, the encryption
    scope will use

    the key referenced by the identifier to enable customer-managed key support on
    this encryption

    scope.'
  signature: 'keyUri: str'
- uid: azure.mgmt.storage.types.EncryptionScopeKeyVaultProperties.lastKeyRotationTimestamp
