### YamlMime:PythonClass
uid: azure.mgmt.storage.types.AzureFilesIdentityBasedAuthentication
name: AzureFilesIdentityBasedAuthentication
fullName: azure.mgmt.storage.types.AzureFilesIdentityBasedAuthentication
module: azure.mgmt.storage.types
summary: Settings for Azure Files identity based authentication.
constructor:
  syntax: AzureFilesIdentityBasedAuthentication()
variables:
- description: 'Indicates the directory service used. Note that this enum may be

    extended in the future. Required. Known values are: "None", "AADDS", "AD", and
    "AADKERB".'
  name: directoryServiceOptions
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DirectoryServiceOptions">]
- description: 'Additional information about the directory service. Required

    if directoryServiceOptions is AD (AD DS authentication). Optional for directoryServiceOptions

    AADDS (Entra DS authentication) and AADKERB (Entra authentication).'
  name: activeDirectoryProperties
  types:
  - <xref:<xref:"ActiveDirectoryProperties">>
- description: 'Default share permission for users using Kerberos authentication

    if RBAC role is not assigned. Known values are: "None", "StorageFileDataSmbShareReader",

    "StorageFileDataSmbShareContributor", and "StorageFileDataSmbShareElevatedContributor".'
  name: defaultSharePermission
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DefaultSharePermission">]
- description: Required for Managed Identities access using OAuth over SMB.
  name: smbOAuthSettings
  types:
  - <xref:<xref:"SmbOAuthSettings">>
attributes:
- uid: azure.mgmt.storage.types.AzureFilesIdentityBasedAuthentication.activeDirectoryProperties
  name: activeDirectoryProperties
  summary: 'Additional information about the directory service. Required if directoryServiceOptions
    is AD

    (AD DS authentication). Optional for directoryServiceOptions AADDS (Entra DS authentication)

    and AADKERB (Entra authentication).'
  signature: 'activeDirectoryProperties: ActiveDirectoryProperties'
- uid: azure.mgmt.storage.types.AzureFilesIdentityBasedAuthentication.defaultSharePermission
  name: defaultSharePermission
  summary: 'Default share permission for users using Kerberos authentication if RBAC
    role is not assigned.

    Known values are: "None", "StorageFileDataSmbShareReader",

    "StorageFileDataSmbShareContributor", and "StorageFileDataSmbShareElevatedContributor".'
  signature: 'defaultSharePermission: str | DefaultSharePermission'
- uid: azure.mgmt.storage.types.AzureFilesIdentityBasedAuthentication.directoryServiceOptions
  name: directoryServiceOptions
  summary: 'Indicates the directory service used. Note that this enum may be extended
    in the future.

    Required. Known values are: "None", "AADDS", "AD", and "AADKERB".'
  signature: 'directoryServiceOptions: Required[str | DirectoryServiceOptions]'
- uid: azure.mgmt.storage.types.AzureFilesIdentityBasedAuthentication.smbOAuthSettings
  name: smbOAuthSettings
  summary: Required for Managed Identities access using OAuth over SMB.
  signature: 'smbOAuthSettings: SmbOAuthSettings'
