### YamlMime:PythonClass
uid: azure.mgmt.storage.types.DateAfterModification
name: DateAfterModification
fullName: azure.mgmt.storage.types.DateAfterModification
module: azure.mgmt.storage.types
summary: 'Object to define the base blob action conditions. Properties daysAfterModificationGreaterThan,

  daysAfterLastAccessTimeGreaterThan and daysAfterCreationGreaterThan are mutually
  exclusive. The

  daysAfterLastTierChangeGreaterThan property is only applicable for tierToArchive
  actions which

  requires daysAfterModificationGreaterThan to be set, also it cannot be used in conjunction
  with

  daysAfterLastAccessTimeGreaterThan or daysAfterCreationGreaterThan.'
constructor:
  syntax: DateAfterModification()
variables:
- description: 'Value indicating the age in days after last

    modification.'
  name: daysAfterModificationGreaterThan
  types:
  - <xref:float>
- description: 'Value indicating the age in days after last blob

    access. This property can only be used in conjunction with last access time tracking
    policy.'
  name: daysAfterLastAccessTimeGreaterThan
  types:
  - <xref:float>
- description: 'Value indicating the age in days after last blob tier

    change time. This property is only applicable for tierToArchive actions and requires

    daysAfterModificationGreaterThan to be set for baseBlobs based actions. The blob
    will be

    archived if both the conditions are satisfied.'
  name: daysAfterLastTierChangeGreaterThan
  types:
  - <xref:float>
- description: Value indicating the age in days after blob creation.
  name: daysAfterCreationGreaterThan
  types:
  - <xref:float>
attributes:
- uid: azure.mgmt.storage.types.DateAfterModification.daysAfterCreationGreaterThan
  name: daysAfterCreationGreaterThan
  summary: Value indicating the age in days after blob creation.
  signature: 'daysAfterCreationGreaterThan: float'
- uid: azure.mgmt.storage.types.DateAfterModification.daysAfterLastAccessTimeGreaterThan
  name: daysAfterLastAccessTimeGreaterThan
  summary: 'Value indicating the age in days after last blob access. This property
    can only be used in

    conjunction with last access time tracking policy.'
  signature: 'daysAfterLastAccessTimeGreaterThan: float'
- uid: azure.mgmt.storage.types.DateAfterModification.daysAfterLastTierChangeGreaterThan
  name: daysAfterLastTierChangeGreaterThan
  summary: 'Value indicating the age in days after last blob tier change time. This
    property is only

    applicable for tierToArchive actions and requires daysAfterModificationGreaterThan
    to be set

    for baseBlobs based actions. The blob will be archived if both the conditions
    are satisfied.'
  signature: 'daysAfterLastTierChangeGreaterThan: float'
- uid: azure.mgmt.storage.types.DateAfterModification.daysAfterModificationGreaterThan
  name: daysAfterModificationGreaterThan
  summary: Value indicating the age in days after last modification.
  signature: 'daysAfterModificationGreaterThan: float'
