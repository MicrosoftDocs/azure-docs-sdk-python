### YamlMime:PythonClass
uid: azure.mgmt.storage.types.AccountImmutabilityPolicyProperties
name: AccountImmutabilityPolicyProperties
fullName: azure.mgmt.storage.types.AccountImmutabilityPolicyProperties
module: azure.mgmt.storage.types
summary: This defines account-level immutability policy properties.
constructor:
  syntax: AccountImmutabilityPolicyProperties()
variables:
- description: 'The immutability period for the blobs in the

    container since the policy creation, in days.'
  name: immutabilityPeriodSinceCreationInDays
  types:
  - <xref:int>
- description: 'The ImmutabilityPolicy state defines the mode of the policy. Disabled
    state

    disables the policy, Unlocked state allows increase and decrease of immutability
    retention time

    and also allows toggling allowProtectedAppendWrites property, Locked state only
    allows the

    increase of the immutability retention time. A policy can only be created in a
    Disabled or

    Unlocked state and can be toggled between the two states. Only a policy in an
    Unlocked state

    can transition to a Locked state which cannot be reverted. Known values are: "Unlocked",

    "Locked", and "Disabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AccountImmutabilityPolicyState">]
- description: 'This property can only be changed for disabled and unlocked

    time-based retention policies. When enabled, new blocks can be written to an append
    blob while

    maintaining immutability protection and compliance. Only new blocks can be added
    and any

    existing blocks cannot be modified or deleted.'
  name: allowProtectedAppendWrites
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.storage.types.AccountImmutabilityPolicyProperties.allowProtectedAppendWrites
  name: allowProtectedAppendWrites
  summary: 'This property can only be changed for disabled and unlocked time-based
    retention policies. When

    enabled, new blocks can be written to an append blob while maintaining immutability
    protection

    and compliance. Only new blocks can be added and any existing blocks cannot be
    modified or

    deleted.'
  signature: 'allowProtectedAppendWrites: bool'
- uid: azure.mgmt.storage.types.AccountImmutabilityPolicyProperties.immutabilityPeriodSinceCreationInDays
  name: immutabilityPeriodSinceCreationInDays
  summary: The immutability period for the blobs in the container since the policy
    creation, in days.
  signature: 'immutabilityPeriodSinceCreationInDays: int'
- uid: azure.mgmt.storage.types.AccountImmutabilityPolicyProperties.state
  name: state
  summary: 'The ImmutabilityPolicy state defines the mode of the policy. Disabled
    state disables the

    policy, Unlocked state allows increase and decrease of immutability retention
    time and also

    allows toggling allowProtectedAppendWrites property, Locked state only allows
    the increase of

    the immutability retention time. A policy can only be created in a Disabled or
    Unlocked state

    and can be toggled between the two states. Only a policy in an Unlocked state
    can transition to

    a Locked state which cannot be reverted. Known values are: "Unlocked", "Locked",
    and

    "Disabled".'
  signature: 'state: str | AccountImmutabilityPolicyState'
