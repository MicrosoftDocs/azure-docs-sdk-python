### YamlMime:PythonClass
uid: azure.mgmt.storage.types.Sku
name: Sku
fullName: azure.mgmt.storage.types.Sku
module: azure.mgmt.storage.types
summary: The SKU of the storage account.
constructor:
  syntax: Sku()
variables:
- description: 'The SKU name. Required for account creation; optional for update.
    Note that in

    older versions, SKU name was called accountType. Required. Known values are: "Standard_LRS",

    "Standard_GRS", "Standard_RAGRS", "Standard_ZRS", "Premium_LRS", "Premium_ZRS",

    "Standard_GZRS", "Standard_RAGZRS", "StandardV2_LRS", "StandardV2_GRS", "StandardV2_ZRS",

    "StandardV2_GZRS", "PremiumV2_LRS", and "PremiumV2_ZRS".'
  name: name
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SkuName">]
- description: 'The SKU tier. This is based on the SKU name. Known values are: "Standard"
    and

    "Premium".'
  name: tier
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SkuTier">]
attributes:
- uid: azure.mgmt.storage.types.Sku.name
  name: name
  summary: 'The SKU name. Required for account creation; optional for update. Note
    that in older versions,

    SKU name was called accountType. Required. Known values are: "Standard_LRS",

    "Standard_GRS", "Standard_RAGRS", "Standard_ZRS", "Premium_LRS", "Premium_ZRS",

    "Standard_GZRS", "Standard_RAGZRS", "StandardV2_LRS", "StandardV2_GRS",

    "StandardV2_ZRS", "StandardV2_GZRS", "PremiumV2_LRS", and "PremiumV2_ZRS".'
  signature: 'name: Required[str | SkuName]'
- uid: azure.mgmt.storage.types.Sku.tier
  name: tier
  summary: '"Standard" and "Premium".'
  signature: 'tier: str | SkuTier'
