### YamlMime:PythonClass
uid: azure.mgmt.storage.types.ImmutableStorageAccount
name: ImmutableStorageAccount
fullName: azure.mgmt.storage.types.ImmutableStorageAccount
module: azure.mgmt.storage.types
summary: 'This property enables and defines account-level immutability. Enabling the
  feature auto-enables

  Blob Versioning.'
constructor:
  syntax: ImmutableStorageAccount()
variables:
- description: 'A boolean flag which enables account-level immutability. All the containers

    under such an account have object-level immutability enabled by default.'
  name: enabled
  types:
  - <xref:bool>
- description: 'Specifies the default account-level immutability policy which is

    inherited and applied to objects that do not possess an explicit immutability
    policy at the

    object level. The object-level immutability policy has higher precedence than
    the

    container-level immutability policy, which has a higher precedence than the account-level

    immutability policy.'
  name: immutabilityPolicy
  types:
  - <xref:<xref:"AccountImmutabilityPolicyProperties">>
attributes:
- uid: azure.mgmt.storage.types.ImmutableStorageAccount.enabled
  name: enabled
  summary: 'A boolean flag which enables account-level immutability. All the containers
    under such an

    account have object-level immutability enabled by default.'
  signature: 'enabled: bool'
- uid: azure.mgmt.storage.types.ImmutableStorageAccount.immutabilityPolicy
  name: immutabilityPolicy
  summary: 'Specifies the default account-level immutability policy which is inherited
    and applied to

    objects that do not possess an explicit immutability policy at the object level.
    The

    object-level immutability policy has higher precedence than the container-level
    immutability

    policy, which has a higher precedence than the account-level immutability policy.'
  signature: 'immutabilityPolicy: AccountImmutabilityPolicyProperties'
