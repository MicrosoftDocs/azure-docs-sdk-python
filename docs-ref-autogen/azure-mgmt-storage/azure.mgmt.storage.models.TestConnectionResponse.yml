### YamlMime:PythonClass
uid: azure.mgmt.storage.models.TestConnectionResponse
name: TestConnectionResponse
fullName: azure.mgmt.storage.models.TestConnectionResponse
module: azure.mgmt.storage.models
summary: Test connection response properties.
constructor:
  syntax: 'TestConnectionResponse(*args: Any, **kwargs: Any)'
variables:
- description: 'Indicates the method used to validate the connection to

    the backing data store. Valid values are `GetBlob` and `ListBlobs` for failure,
    and

    `TestExistingConnection` for success. Required.'
  name: storage_connector_method_name
  types:
  - <xref:str>
- description: 'A string representing the error received from the

    backing data store. Format will vary depending on the data store type and will
    be capped at 1

    MB in size. The error message will be empty if the connection was successful.'
  name: storage_connector_error_message
  types:
  - <xref:str>
- description: 'The request Id associated with the request sent to the

    backing data store for validation. Required.'
  name: storage_connector_request_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storage.models.TestConnectionResponse.storage_connector_error_message
  name: storage_connector_error_message
  summary: 'A string representing the error received from the backing data store.
    Format will vary

    depending on the data store type and will be capped at 1 MB in size. The error
    message will be

    empty if the connection was successful.'
  signature: 'storage_connector_error_message: str | None'
- uid: azure.mgmt.storage.models.TestConnectionResponse.storage_connector_method_name
  name: storage_connector_method_name
  summary: 'Indicates the method used to validate the connection to the backing data
    store. Valid values

    are `GetBlob` and `ListBlobs` for failure, and `TestExistingConnection` for success.

    Required.'
  signature: 'storage_connector_method_name: str'
- uid: azure.mgmt.storage.models.TestConnectionResponse.storage_connector_request_id
  name: storage_connector_request_id
  summary: 'The request Id associated with the request sent to the backing data store
    for validation.

    Required.'
  signature: 'storage_connector_request_id: str'
