### YamlMime:PythonClass
uid: azure.mgmt.storage.types.AdvancedPlatformMetricsRuleConfig
name: AdvancedPlatformMetricsRuleConfig
fullName: azure.mgmt.storage.types.AdvancedPlatformMetricsRuleConfig
module: azure.mgmt.storage.types
summary: Configuration for the advanced platform metrics rule.
constructor:
  syntax: AdvancedPlatformMetricsRuleConfig()
variables:
- description: 'The type of filter applied to the rule. Possible values include:

    AllContainersFilter, ContainerPrefixFilter, ContainerListFilter. Known values
    are:

    "AllContainersFilter", "ContainerPrefixFilter", and "ContainerListFilter".'
  name: filterType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AdvancedPlatformMetricsFilterType">]
- description: 'The values for the filter applied to the rule. If filter type is

    AllContainersFilter, filter values should be empty. If filter type is ContainerPrefixFilter,

    filter values should contain a list of container prefixes. If filter type is

    ContainerListFilter, filter values should contain a list of container names.'
  name: filterValues
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.storage.types.AdvancedPlatformMetricsRuleConfig.filterType
  name: filterType
  summary: 'AllContainersFilter,

    ContainerPrefixFilter, ContainerListFilter. Known values are: "AllContainersFilter",

    "ContainerPrefixFilter", and "ContainerListFilter".'
  signature: 'filterType: str | AdvancedPlatformMetricsFilterType'
- uid: azure.mgmt.storage.types.AdvancedPlatformMetricsRuleConfig.filterValues
  name: filterValues
  summary: 'The values for the filter applied to the rule. If filter type is AllContainersFilter,
    filter

    values should be empty. If filter type is ContainerPrefixFilter, filter values
    should contain a

    list of container prefixes. If filter type is ContainerListFilter, filter values
    should contain

    a list of container names.'
  signature: 'filterValues: list[str]'
