### YamlMime:PythonClass
uid: azure.mgmt.storage.models.ObjectReplicationPolicyFilter
name: ObjectReplicationPolicyFilter
fullName: azure.mgmt.storage.models.ObjectReplicationPolicyFilter
module: azure.mgmt.storage.models
summary: 'Filters limit replication to a subset of blobs within the storage account.
  A logical OR is

  performed on values in the filter. If multiple filters are defined, a logical AND
  is performed

  on all filters.'
constructor:
  syntax: 'ObjectReplicationPolicyFilter(*args: Any, **kwargs: Any)'
variables:
- description: 'Optional. Filters the results to replicate only blobs whose names
    begin

    with the specified prefix.'
  name: prefix_match
  types:
  - <xref:list>[<xref:str>]
- description: 'Blobs created after the time will be replicated to the destination.
    It

    must be in datetime format ''yyyy-MM-ddTHH:mm:ssZ''. Example: 2020-02-19T16:05:00Z.'
  name: min_creation_time
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storage.models.ObjectReplicationPolicyFilter.min_creation_time
  name: min_creation_time
  summary: 'Blobs created after the time will be replicated to the destination. It
    must be in datetime

    format ''yyyy-MM-ddTHH:mm:ssZ''. Example: 2020-02-19T16:05:00Z.'
  signature: 'min_creation_time: str | None'
- uid: azure.mgmt.storage.models.ObjectReplicationPolicyFilter.prefix_match
  name: prefix_match
  summary: 'Optional. Filters the results to replicate only blobs whose names begin
    with the specified

    prefix.'
  signature: 'prefix_match: list[str] | None'
