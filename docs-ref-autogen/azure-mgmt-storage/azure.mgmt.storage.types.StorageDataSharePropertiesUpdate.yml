- description: 'List of access policies that specify the permission allowed to a managed

    identity. For Create - This property is required and cannot be null. If no access
    policies are

    provided at creation time, specify an empty array. For Update - This property
    is optional. If

    set to null or not passed, the existing access policies are left unchanged. If
    provided with a

    non-null value, the existing access policies are replaced with the specified list.'
  name: accessPolicies
  types:
  - <xref:list>[<xref:"StorageDataShareAccessPolicy">]
- description: 'List of assets that specify the properties of the shared resources.
