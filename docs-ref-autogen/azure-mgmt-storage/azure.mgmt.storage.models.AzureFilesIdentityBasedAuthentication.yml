### YamlMime:PythonClass
uid: azure.mgmt.storage.models.AzureFilesIdentityBasedAuthentication
name: AzureFilesIdentityBasedAuthentication
fullName: azure.mgmt.storage.models.AzureFilesIdentityBasedAuthentication
module: azure.mgmt.storage.models
summary: Settings for Azure Files identity based authentication.
constructor:
  syntax: 'AzureFilesIdentityBasedAuthentication(*args: Any, **kwargs: Any)'
variables:
- description: 'Indicates the directory service used. Note that this enum may

    be extended in the future. Required. Known values are: "None", "AADDS", "AD",
    and "AADKERB".'
  name: directory_service_options
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.DirectoryServiceOptions>
- description: 'Additional information about the directory service. Required

    if directoryServiceOptions is AD (AD DS authentication). Optional for directoryServiceOptions

    AADDS (Entra DS authentication) and AADKERB (Entra authentication).'
  name: active_directory_properties
  types:
  - <xref:azure.mgmt.storage.models.ActiveDirectoryProperties>
- description: 'Default share permission for users using Kerberos

    authentication if RBAC role is not assigned. Known values are: "None",

    "StorageFileDataSmbShareReader", "StorageFileDataSmbShareContributor", and

    "StorageFileDataSmbShareElevatedContributor".'
  name: default_share_permission
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.DefaultSharePermission>
- description: Required for Managed Identities access using OAuth over SMB.
  name: smb_o_auth_settings
  types:
  - <xref:azure.mgmt.storage.models.SmbOAuthSettings>
attributes:
- uid: azure.mgmt.storage.models.AzureFilesIdentityBasedAuthentication.active_directory_properties
  name: active_directory_properties
  summary: 'Additional information about the directory service. Required if directoryServiceOptions
    is AD

    (AD DS authentication). Optional for directoryServiceOptions AADDS (Entra DS authentication)

    and AADKERB (Entra authentication).'
  signature: 'active_directory_properties: _models.ActiveDirectoryProperties | None'
- uid: azure.mgmt.storage.models.AzureFilesIdentityBasedAuthentication.default_share_permission
  name: default_share_permission
  summary: 'Default share permission for users using Kerberos authentication if RBAC
    role is not assigned.

    Known values are: "None", "StorageFileDataSmbShareReader",

    "StorageFileDataSmbShareContributor", and "StorageFileDataSmbShareElevatedContributor".'
  signature: 'default_share_permission: str | _models.DefaultSharePermission | None'
- uid: azure.mgmt.storage.models.AzureFilesIdentityBasedAuthentication.directory_service_options
  name: directory_service_options
  summary: 'Indicates the directory service used. Note that this enum may be extended
    in the future.

    Required. Known values are: "None", "AADDS", "AD", and "AADKERB".'
  signature: 'directory_service_options: str | _models.DirectoryServiceOptions'
- uid: azure.mgmt.storage.models.AzureFilesIdentityBasedAuthentication.smb_o_auth_settings
  name: smb_o_auth_settings
  summary: Required for Managed Identities access using OAuth over SMB.
  signature: 'smb_o_auth_settings: _models.SmbOAuthSettings | None'
