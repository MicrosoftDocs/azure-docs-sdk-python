### YamlMime:PythonClass
uid: azure.mgmt.storage.models.GeoReplicationStats
name: GeoReplicationStats
fullName: azure.mgmt.storage.models.GeoReplicationStats
module: azure.mgmt.storage.models
summary: 'Statistics related to replication for storage account''s Blob, Table, Queue
  and File services.

  It is only available when geo-redundant replication is enabled for the storage account.'
constructor:
  syntax: 'GeoReplicationStats(*args: Any, **kwargs: Any)'
variables:
- description: 'The status of the secondary location. Possible values are: - Live:
    Indicates that

    the secondary location is active and operational. - Bootstrap: Indicates initial

    synchronization from the primary location to the secondary location is in progress.This

    typically occurs when replication is first enabled. - Unavailable: Indicates that
    the secondary

    location is temporarily unavailable. Known values are: "Live", "Bootstrap", and
    "Unavailable".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.GeoReplicationStatus>
- description: 'All primary writes preceding this UTC date/time value are guaranteed
    to

    be available for read operations. Primary writes following this point in time
    may or may not be

    available for reads. Element may be default value if value of LastSyncTime is
    not available,

    this can happen if secondary is offline or we are in bootstrap.'
  name: last_sync_time
  types:
  - <xref:datetime.datetime>
- description: 'A boolean flag which indicates whether or not account failover is
    supported

    for the account.'
  name: can_failover
  types:
  - <xref:bool>
- description: 'A boolean flag which indicates whether or not planned account

    failover is supported for the account.'
  name: can_planned_failover
  types:
  - <xref:bool>
- description: 'The redundancy type of the account after an account failover is

    performed. Known values are: "Standard_LRS" and "Standard_ZRS".'
  name: post_failover_redundancy
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.PostFailoverRedundancy>
- description: 'The redundancy type of the account after a planned

    account failover is performed. Known values are: "Standard_GRS", "Standard_GZRS",

    "Standard_RAGRS", and "Standard_RAGZRS".'
  name: post_planned_failover_redundancy
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.PostPlannedFailoverRedundancy>
attributes:
- uid: azure.mgmt.storage.models.GeoReplicationStats.can_failover
  name: can_failover
  summary: A boolean flag which indicates whether or not account failover is supported
    for the account.
  signature: 'can_failover: bool | None'
- uid: azure.mgmt.storage.models.GeoReplicationStats.can_planned_failover
  name: can_planned_failover
  summary: 'A boolean flag which indicates whether or not planned account failover
    is supported for the

    account.'
  signature: 'can_planned_failover: bool | None'
- uid: azure.mgmt.storage.models.GeoReplicationStats.last_sync_time
  name: last_sync_time
  summary: 'All primary writes preceding this UTC date/time value are guaranteed to
    be available for read

    operations. Primary writes following this point in time may or may not be available
    for reads.

    Element may be default value if value of LastSyncTime is not available, this can
    happen if

    secondary is offline or we are in bootstrap.'
  signature: 'last_sync_time: datetime | None'
- uid: azure.mgmt.storage.models.GeoReplicationStats.post_failover_redundancy
  name: post_failover_redundancy
  summary: 'The redundancy type of the account after an account failover is performed.
    Known values are:

    "Standard_LRS" and "Standard_ZRS".'
  signature: 'post_failover_redundancy: str | _models.PostFailoverRedundancy | None'
- uid: azure.mgmt.storage.models.GeoReplicationStats.post_planned_failover_redundancy
  name: post_planned_failover_redundancy
  summary: 'The redundancy type of the account after a planned account failover is
    performed. Known values

    are: "Standard_GRS", "Standard_GZRS", "Standard_RAGRS", and "Standard_RAGZRS".'
  signature: 'post_planned_failover_redundancy: str | _models.PostPlannedFailoverRedundancy
    | None'
- uid: azure.mgmt.storage.models.GeoReplicationStats.status
  name: status
  summary: 'Indicates that the secondary

    location is active and operational. - Bootstrap: Indicates initial synchronization
    from the

    primary location to the secondary location is in progress.This typically occurs
    when

    replication is first enabled. - Unavailable: Indicates that the secondary location
    is

    temporarily unavailable. Known values are: "Live", "Bootstrap", and "Unavailable".'
  signature: 'status: str | _models.GeoReplicationStatus | None'
