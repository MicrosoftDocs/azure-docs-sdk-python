fullName: azure.mgmt.storage.types.FileSharePropertiesFileSharePaidBursting
module: azure.mgmt.storage.types
summary: File Share Paid Bursting properties.
constructor:
  syntax: FileSharePropertiesFileSharePaidBursting()
variables:
- description: 'Indicates whether paid bursting is enabled for the share. This

    property is only for file shares created under Files Provisioned v1 SSD account
    type.'
  name: paidBurstingEnabled
  types:
  - <xref:bool>
- description: 'The maximum paid bursting IOPS for the share. This property is only

    for file shares created under Files Provisioned v1 SSD account type. The maximum
    allowed value

    is 102400 which is the maximum allowed IOPS for a share.'
  name: paidBurstingMaxIops
  types:
  - <xref:int>
- description: 'The maximum paid bursting bandwidth for the share, in

    mebibytes per second. This property is only for file shares created under Files
    Provisioned v1

    SSD account type. The maximum allowed value is 10340 which is the maximum allowed
    bandwidth for

    a share.'
  name: paidBurstingMaxBandwidthMibps
  types:
  - <xref:int>
