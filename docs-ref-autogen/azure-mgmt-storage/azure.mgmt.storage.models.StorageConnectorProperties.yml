    date-time format (YYYY-MM-DDTHH:mm:ssZ). Not a valid input parameter during creating.'
  name: creation_time
  types:
  - <xref:str>
- description: Arbitrary description of this Storage Connector. Max 250 characters.
  name: description
  types:
  - <xref:str>
- description: 'Test connection to backing data source before creating the storage

    connector.'
  name: test_connection
  types:
  - <xref:bool>
- description: 'The type of backing data source for this Storage Connector. Required.

    "Azure_DataShare"'
  name: data_source_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.StorageConnectorDataSourceType>
- description: 'Information about how to communicate with and authenticate to the
    backing data

    store. Required.'
  name: source
  types:
  - <xref:azure.mgmt.storage.models.StorageConnectorSource>
- description: 'Represents the provisioning state of the storage connector. Known

    values are: "Accepted", "Creating", "Succeeded", "Deleting", "Canceled", and "Failed".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.NativeDataSharingProvisioningState>
