    valid input

    parameter when creating.'
  name: unique_id
  types:
  - <xref:str>
- description: 'State - Active or Inactive. Whether or not the Storage Connector should
    start as

    active (default: Active) (While set to false on the Storage Connector, all data
    plane requests

    using this Storage Connector fail, and this Storage Connector is not billed if
    it would be

    otherwise. Known values are: "Active" and "Inactive".'
  name: state
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.StorageConnectorState>
