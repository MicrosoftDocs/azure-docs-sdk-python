variables:
- description: 'Gets or sets the SKU name. Note that the SKU name cannot be updated
    to Standard_ZRS,

    Premium_LRS or Premium_ZRS, nor can accounts of those SKU names be updated to
    any other value.'
  name: sku
  types:
  - <xref:<xref:"Sku">>
