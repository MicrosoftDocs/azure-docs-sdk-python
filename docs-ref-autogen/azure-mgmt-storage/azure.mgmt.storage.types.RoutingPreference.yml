### YamlMime:PythonClass
uid: azure.mgmt.storage.types.RoutingPreference
name: RoutingPreference
fullName: azure.mgmt.storage.types.RoutingPreference
module: azure.mgmt.storage.types
summary: 'Routing preference defines the type of network, either microsoft or internet
  routing to be used

  to deliver the user data, the default option is microsoft routing.'
constructor:
  syntax: RoutingPreference()
variables:
- description: 'Routing Choice defines the kind of network routing opted by the user.

    Known values are: "MicrosoftRouting" and "InternetRouting".'
  name: routingChoice
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RoutingChoice">]
- description: 'A boolean flag which indicates whether microsoft routing

    storage endpoints are to be published.'
  name: publishMicrosoftEndpoints
  types:
  - <xref:bool>
- description: 'A boolean flag which indicates whether internet routing storage

    endpoints are to be published.'
  name: publishInternetEndpoints
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.storage.types.RoutingPreference.publishInternetEndpoints
  name: publishInternetEndpoints
  summary: A boolean flag which indicates whether internet routing storage endpoints
    are to be published.
  signature: 'publishInternetEndpoints: bool'
- uid: azure.mgmt.storage.types.RoutingPreference.publishMicrosoftEndpoints
  name: publishMicrosoftEndpoints
  summary: A boolean flag which indicates whether microsoft routing storage endpoints
    are to be published.
  signature: 'publishMicrosoftEndpoints: bool'
- uid: azure.mgmt.storage.types.RoutingPreference.routingChoice
  name: routingChoice
  summary: 'Routing Choice defines the kind of network routing opted by the user.
    Known values are:

    "MicrosoftRouting" and "InternetRouting".'
  signature: 'routingChoice: str | RoutingChoice'
