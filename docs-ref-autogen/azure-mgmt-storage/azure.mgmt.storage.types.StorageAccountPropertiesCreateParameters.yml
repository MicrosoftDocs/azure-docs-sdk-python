### YamlMime:PythonClass
uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters
name: StorageAccountPropertiesCreateParameters
fullName: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters
module: azure.mgmt.storage.types
summary: The parameters used to create the storage account.
constructor:
  syntax: StorageAccountPropertiesCreateParameters()
variables:
- description: 'Restrict copy to and from Storage Accounts within an AAD tenant or
    with

    Private Links to the same VNet. Known values are: "PrivateLink", "AAD", and "All".'
  name: allowedCopyScope
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AllowedCopyScope">]
- description: 'Allow, disallow, or let Network Security Perimeter configuration to

    evaluate public network access to Storage Account. Value is optional but if passed
    in, must be

    ''Enabled'', ''Disabled'' or ''SecuredByPerimeter''. Known values are: "Enabled",
    "Disabled", and

    "SecuredByPerimeter".'
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: SasPolicy assigned to the storage account.
  name: sasPolicy
  types:
  - <xref:<xref:"SasPolicy">>
- description: KeyPolicy assigned to the storage account.
  name: keyPolicy
  types:
  - <xref:<xref:"KeyPolicy">>
- description: 'User domain assigned to the storage account. Name is the CNAME source.
    Only

    one custom domain is supported per storage account at this time. To clear the
    existing custom

    domain, use an empty string for the custom domain name property.'
  name: customDomain
  types:
  - <xref:<xref:"CustomDomain">>
- description: 'Encryption settings to be used for server-side encryption for the
    storage

    account.'
  name: encryption
  types:
  - <xref:<xref:"Encryption">>
- description: Network rule set.
  name: networkAcls
  types:
  - <xref:<xref:"NetworkRuleSet">>
- description: 'Required for storage accounts where kind = BlobStorage. The access
    tier is

    used for billing. The ''Premium'' access tier is the default value for premium
    block blobs

    storage account type and it cannot be changed for the premium block blobs storage
    account type.

    Known values are: "Hot", "Cool", "Premium", "Cold", and "Smart".'
  name: accessTier
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AccessTier">]
- description: 'Provides the identity based authentication

    settings for Azure Files.'
  name: azureFilesIdentityBasedAuthentication
  types:
  - <xref:<xref:"AzureFilesIdentityBasedAuthentication">>
- description: 'Allows https traffic only to storage service if sets to true.

    The default value is true since API version 2019-04-01.'
  name: supportsHttpsTrafficOnly
  types:
  - <xref:bool>
- description: Enables Secure File Transfer Protocol, if set to true.
  name: isSftpEnabled
  types:
  - <xref:bool>
- description: Enables local users feature, if set to true.
  name: isLocalUserEnabled
  types:
  - <xref:bool>
- description: 'Enables extended group support with local users feature, if set to

    true.'
  name: enableExtendedGroups
  types:
  - <xref:bool>
- description: Account HierarchicalNamespace enabled if sets to true.
  name: isHnsEnabled
  types:
  - <xref:bool>
- description: 'Allow large file shares if sets to Enabled. It cannot be disabled

    once it is enabled. Known values are: "Disabled" and "Enabled".'
  name: largeFileSharesState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LargeFileSharesState">]
- description: 'Maintains information about the network routing choice opted by the

    user for data transfer.'
  name: routingPreference
  types:
  - <xref:<xref:"RoutingPreference">>
- description: 'Maintains information about the Internet protocol opted by

    the user.'
  name: dualStackEndpointPreference
  types:
  - <xref:<xref:"DualStackEndpointPreference">>
- description: 'Allow or disallow public access to all blobs or containers in the

    storage account. The default interpretation is false for this property.'
  name: allowBlobPublicAccess
  types:
  - <xref:bool>
- description: 'Set the minimum TLS version to be permitted on requests to storage.

    The default interpretation is TLS 1.0 for this property. Minimum TLS version 1.3
    version is not

    supported. Known values are: "TLS1_0", "TLS1_1", "TLS1_2", and "TLS1_3".'
  name: minimumTlsVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MinimumTlsVersion">]
- description: 'Indicates whether the storage account permits requests to be

    authorized with the account access key via Shared Key. If false, then all requests,
    including

    shared access signatures, must be authorized with Azure Active Directory (Azure
    AD). The

    default value is null, which is equivalent to true.'
  name: allowSharedKeyAccess
  types:
  - <xref:bool>
- description: NFS 3.0 protocol support enabled if set to true.
  name: isNfsV3Enabled
  types:
  - <xref:bool>
- description: 'Allow or disallow cross AAD tenant object replication. Set

    this property to true for new or existing accounts only if object replication
    policies will

    involve storage accounts in different AAD tenants. The default interpretation
    is false for new

    accounts to follow best security practices by default.'
  name: allowCrossTenantReplication
  types:
  - <xref:bool>
- description: 'A boolean flag which indicates whether the default

    authentication is OAuth or not. The default interpretation is false for this property.'
  name: defaultToOAuthAuthentication
  types:
  - <xref:bool>
- description: 'The property is immutable and can only be set to true at

    the account creation time. When set to true, it enables object level immutability
    for all the

    new containers in the account by default.'
  name: immutableStorageWithVersioning
  types:
  - <xref:<xref:"ImmutableStorageAccount">>
- description: 'Allows you to specify the type of endpoint. Set this to AzureDNSZone
    to

    create a large number of accounts in a single subscription, which creates accounts
    in an Azure

    DNS Zone and the endpoint URL will have an alphanumeric DNS Zone identifier. Known
    values are:

    "Standard" and "AzureDnsZone".'
  name: dnsEndpointType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DnsEndpointType">]
- description: 'Status indicating whether Geo Priority Replication is

    enabled for the account.'
  name: geoPriorityReplicationStatus
  types:
  - <xref:<xref:"GeoPriorityReplicationStatus">>
- description: Indicate shared key access properties at service level.
  name: allowSharedKeyAccessForServices
  types:
  - <xref:<xref:"StorageAccountSharedKeyAccessProperties">>
- description: Data Collaboration policy for the storage account.
  name: dataCollaborationPolicyProperties
  types:
  - <xref:<xref:"StorageDataCollaborationPolicyProperties">>
- description: 'Allow or disallow cross AAD tenant user delegation SAS

    (shared access signature). The default interpretation is false for this property.'
  name: allowCrossTenantDelegationSas
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.accessTier
  name: accessTier
  summary: 'Required for storage accounts where kind = BlobStorage. The access tier
    is used for billing.

    The ''Premium'' access tier is the default value for premium block blobs storage
    account type and

    it cannot be changed for the premium block blobs storage account type. Known values
    are:

    "Hot", "Cool", "Premium", "Cold", and "Smart".'
  signature: 'accessTier: str | AccessTier'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.allowBlobPublicAccess
  name: allowBlobPublicAccess
  summary: 'Allow or disallow public access to all blobs or containers in the storage
    account. The default

    interpretation is false for this property.'
  signature: 'allowBlobPublicAccess: bool'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.allowCrossTenantDelegationSas
  name: allowCrossTenantDelegationSas
  summary: 'Allow or disallow cross AAD tenant user delegation SAS (shared access
    signature). The default

    interpretation is false for this property.'
  signature: 'allowCrossTenantDelegationSas: bool'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.allowCrossTenantReplication
  name: allowCrossTenantReplication
  summary: 'Allow or disallow cross AAD tenant object replication. Set this property
    to true for new or

    existing accounts only if object replication policies will involve storage accounts
    in

    different AAD tenants. The default interpretation is false for new accounts to
    follow best

    security practices by default.'
  signature: 'allowCrossTenantReplication: bool'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.allowSharedKeyAccess
  name: allowSharedKeyAccess
  summary: 'Indicates whether the storage account permits requests to be authorized
    with the account access

    key via Shared Key. If false, then all requests, including shared access signatures,
    must be

    authorized with Azure Active Directory (Azure AD). The default value is null,
    which is

    equivalent to true.'
  signature: 'allowSharedKeyAccess: bool'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.allowSharedKeyAccessForServices
  name: allowSharedKeyAccessForServices
  summary: Indicate shared key access properties at service level.
  signature: 'allowSharedKeyAccessForServices: StorageAccountSharedKeyAccessProperties'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.allowedCopyScope
  name: allowedCopyScope
  summary: 'Restrict copy to and from Storage Accounts within an AAD tenant or with
    Private Links to the

    same VNet. Known values are: "PrivateLink", "AAD", and "All".'
  signature: 'allowedCopyScope: str | AllowedCopyScope'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.azureFilesIdentityBasedAuthentication
  name: azureFilesIdentityBasedAuthentication
  summary: Provides the identity based authentication settings for Azure Files.
  signature: 'azureFilesIdentityBasedAuthentication: AzureFilesIdentityBasedAuthentication'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.customDomain
  name: customDomain
  summary: 'User domain assigned to the storage account. Name is the CNAME source.
    Only one custom domain

    is supported per storage account at this time. To clear the existing custom domain,
    use an

    empty string for the custom domain name property.'
  signature: 'customDomain: CustomDomain'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.dataCollaborationPolicyProperties
  name: dataCollaborationPolicyProperties
  summary: Data Collaboration policy for the storage account.
  signature: 'dataCollaborationPolicyProperties: StorageDataCollaborationPolicyProperties'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.defaultToOAuthAuthentication
  name: defaultToOAuthAuthentication
  summary: 'A boolean flag which indicates whether the default authentication is OAuth
    or not. The default

    interpretation is false for this property.'
  signature: 'defaultToOAuthAuthentication: bool'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.dnsEndpointType
  name: dnsEndpointType
  summary: 'Allows you to specify the type of endpoint. Set this to AzureDNSZone to
    create a large number

    of accounts in a single subscription, which creates accounts in an Azure DNS Zone
    and the

    endpoint URL will have an alphanumeric DNS Zone identifier. Known values are:
    "Standard" and

    "AzureDnsZone".'
  signature: 'dnsEndpointType: str | DnsEndpointType'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.dualStackEndpointPreference
  name: dualStackEndpointPreference
  summary: Maintains information about the Internet protocol opted by the user.
  signature: 'dualStackEndpointPreference: DualStackEndpointPreference'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.enableExtendedGroups
  name: enableExtendedGroups
  summary: Enables extended group support with local users feature, if set to true.
  signature: 'enableExtendedGroups: bool'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.encryption
  name: encryption
  summary: Encryption settings to be used for server-side encryption for the storage
    account.
  signature: 'encryption: Encryption'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.geoPriorityReplicationStatus
  name: geoPriorityReplicationStatus
  summary: Status indicating whether Geo Priority Replication is enabled for the account.
  signature: 'geoPriorityReplicationStatus: GeoPriorityReplicationStatus'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.immutableStorageWithVersioning
  name: immutableStorageWithVersioning
  summary: 'The property is immutable and can only be set to true at the account creation
    time. When set to

    true, it enables object level immutability for all the new containers in the account
    by

    default.'
  signature: 'immutableStorageWithVersioning: ImmutableStorageAccount'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.isHnsEnabled
  name: isHnsEnabled
  summary: Account HierarchicalNamespace enabled if sets to true.
  signature: 'isHnsEnabled: bool'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.isLocalUserEnabled
  name: isLocalUserEnabled
  summary: Enables local users feature, if set to true.
  signature: 'isLocalUserEnabled: bool'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.isNfsV3Enabled
  name: isNfsV3Enabled
  summary: NFS 3.0 protocol support enabled if set to true.
  signature: 'isNfsV3Enabled: bool'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.isSftpEnabled
  name: isSftpEnabled
  summary: Enables Secure File Transfer Protocol, if set to true.
  signature: 'isSftpEnabled: bool'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.keyPolicy
  name: keyPolicy
  summary: KeyPolicy assigned to the storage account.
  signature: 'keyPolicy: KeyPolicy'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.largeFileSharesState
  name: largeFileSharesState
  summary: 'Allow large file shares if sets to Enabled. It cannot be disabled once
    it is enabled. Known

    values are: "Disabled" and "Enabled".'
  signature: 'largeFileSharesState: str | LargeFileSharesState'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.minimumTlsVersion
  name: minimumTlsVersion
  summary: 'Set the minimum TLS version to be permitted on requests to storage. The
    default interpretation

    is TLS 1.0 for this property. Minimum TLS version 1.3 version is not supported.
    Known values

    are: "TLS1_0", "TLS1_1", "TLS1_2", and "TLS1_3".'
  signature: 'minimumTlsVersion: str | MinimumTlsVersion'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.networkAcls
  name: networkAcls
  summary: Network rule set.
  signature: 'networkAcls: NetworkRuleSet'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.publicNetworkAccess
  name: publicNetworkAccess
  summary: 'Allow, disallow, or let Network Security Perimeter configuration to evaluate
    public network

    access to Storage Account. Value is optional but if passed in, must be ''Enabled'',
    ''Disabled'' or

    ''SecuredByPerimeter''. Known values are: "Enabled", "Disabled", and "SecuredByPerimeter".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.routingPreference
  name: routingPreference
  summary: Maintains information about the network routing choice opted by the user
    for data transfer.
  signature: 'routingPreference: RoutingPreference'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.sasPolicy
  name: sasPolicy
  summary: SasPolicy assigned to the storage account.
  signature: 'sasPolicy: SasPolicy'
- uid: azure.mgmt.storage.types.StorageAccountPropertiesCreateParameters.supportsHttpsTrafficOnly
  name: supportsHttpsTrafficOnly
  summary: 'Allows https traffic only to storage service if sets to true. The default
    value is true since

    API version 2019-04-01.'
  signature: 'supportsHttpsTrafficOnly: bool'
