### YamlMime:PythonClass
uid: azure.mgmt.storage.types.NetworkRuleSet
name: NetworkRuleSet
fullName: azure.mgmt.storage.types.NetworkRuleSet
module: azure.mgmt.storage.types
summary: Network rule set.
constructor:
  syntax: NetworkRuleSet()
variables:
- description: 'Specifies whether traffic is bypassed for Logging/Metrics/AzureServices.
    Possible

    values are any combination of Logging|Metrics|AzureServices (For example, "Logging,
    Metrics"),

    or None to bypass none of those traffics. Known values are: "None", "Logging",
    "Metrics", and

    "AzureServices".'
  name: bypass
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Bypass">]
- description: Sets the resource access rules.
  name: resourceAccessRules
  types:
  - <xref:list>[<xref:"ResourceAccessRule">]
- description: Sets the virtual network rules.
  name: virtualNetworkRules
  types:
  - <xref:list>[<xref:"VirtualNetworkRule">]
- description: Sets the IP ACL rules.
  name: ipRules
  types:
  - <xref:list>[<xref:"IPRule">]
- description: Sets the IPv6 ACL rules.
  name: ipv6Rules
  types:
  - <xref:list>[<xref:"IPRule">]
- description: 'Specifies the default action of allow or deny when no other rules
    match.

    Required. Known values are: "Allow" and "Deny".'
  name: defaultAction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DefaultAction">]
attributes:
- uid: azure.mgmt.storage.types.NetworkRuleSet.bypass
  name: bypass
  summary: 'Specifies whether traffic is bypassed for Logging/Metrics/AzureServices.
    Possible values are

    any combination of Logging|Metrics|AzureServices (For example, "Logging, Metrics"),
    or None

    to bypass none of those traffics. Known values are: "None", "Logging", "Metrics",
    and

    "AzureServices".'
  signature: 'bypass: str | Bypass'
- uid: azure.mgmt.storage.types.NetworkRuleSet.defaultAction
  name: defaultAction
  summary: 'Specifies the default action of allow or deny when no other rules match.
    Required. Known values

    are: "Allow" and "Deny".'
  signature: 'defaultAction: Required[str | DefaultAction]'
- uid: azure.mgmt.storage.types.NetworkRuleSet.ipRules
  name: ipRules
  summary: Sets the IP ACL rules.
  signature: 'ipRules: list[''IPRule'']'
- uid: azure.mgmt.storage.types.NetworkRuleSet.ipv6Rules
  name: ipv6Rules
  summary: Sets the IPv6 ACL rules.
  signature: 'ipv6Rules: list[''IPRule'']'
- uid: azure.mgmt.storage.types.NetworkRuleSet.resourceAccessRules
  name: resourceAccessRules
  summary: Sets the resource access rules.
  signature: 'resourceAccessRules: list[''ResourceAccessRule'']'
- uid: azure.mgmt.storage.types.NetworkRuleSet.virtualNetworkRules
  name: virtualNetworkRules
  summary: Sets the virtual network rules.
  signature: 'virtualNetworkRules: list[''VirtualNetworkRule'']'
