  name: ip_address_or_range
  summary: An IP address or a range of IP addresses from which to accept requests.
  signature: 'ip_address_or_range: str | None'
- uid: azure.mgmt.storage.models.AccountSasParameters.key_to_sign
  name: key_to_sign
  summary: The key to sign the account SAS token with.
  signature: 'key_to_sign: str | None'
- uid: azure.mgmt.storage.models.AccountSasParameters.permissions
  name: permissions
  summary: 'Read (r), Write (w),

    Delete (d), List (l), Add (a), Create (c), Update (u) and Process (p). Required.
    Known values

    are: "r", "d", "w", "l", "a", "c", "u", and "p".'
  signature: 'permissions: str | _models.Permissions'
- uid: azure.mgmt.storage.models.AccountSasParameters.protocols
  name: protocols
  summary: 'The protocol permitted for a request made with the account SAS. Known
    values are:

    "https,http" and "https".'
  signature: 'protocols: str | _models.HttpProtocol | None'
- uid: azure.mgmt.storage.models.AccountSasParameters.resource_types
  name: resource_types
  summary: 'Access to

    service-level APIs; Container (c): Access to container-level APIs; Object (o):
    Access to

    object-level APIs for blobs, queue messages, table entities, and files. Required.
    Known values

    are: "s", "c", and "o".'
  signature: 'resource_types: str | _models.SignedResourceTypes'
- uid: azure.mgmt.storage.models.AccountSasParameters.services
  name: services
  summary: 'Blob (b), Queue

    (q), Table (t), File (f). Required. Known values are: "b", "q", "t", and "f".'
  signature: 'services: str | _models.Services'
- uid: azure.mgmt.storage.models.AccountSasParameters.shared_access_expiry_time
  name: shared_access_expiry_time
  summary: The time at which the shared access signature becomes invalid. Required.
