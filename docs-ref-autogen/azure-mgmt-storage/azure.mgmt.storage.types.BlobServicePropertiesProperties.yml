### YamlMime:PythonClass
uid: azure.mgmt.storage.types.BlobServicePropertiesProperties
name: BlobServicePropertiesProperties
fullName: azure.mgmt.storage.types.BlobServicePropertiesProperties
module: azure.mgmt.storage.types
summary: The properties of a storage account's Blob service.
constructor:
  syntax: BlobServicePropertiesProperties()
variables:
- description: 'Specifies CORS rules for the Blob service. You can include up to five
    CorsRule

    elements in the request. If no CorsRule elements are included in the request body,
    all CORS

    rules will be deleted, and CORS will be disabled for the Blob service.'
  name: cors
  types:
  - <xref:<xref:"CorsRules">>
- description: 'DefaultServiceVersion indicates the default version to use for

    requests to the Blob service if an incoming request''s version is not specified.
    Possible values

    include version 2008-10-27 and all more recent versions.'
  name: defaultServiceVersion
  types:
  - <xref:str>
- description: The blob service properties for blob soft delete.
  name: deleteRetentionPolicy
  types:
  - <xref:<xref:"DeleteRetentionPolicy">>
- description: The static website properties for blob storage.
  name: staticWebsite
  types:
  - <xref:<xref:"StaticWebsite">>
- description: Versioning is enabled if set to true.
  name: isVersioningEnabled
  types:
  - <xref:bool>
- description: Deprecated in favor of isVersioningEnabled property.
  name: automaticSnapshotPolicyEnabled
  types:
  - <xref:bool>
- description: The blob service properties for change feed events.
  name: changeFeed
  types:
  - <xref:<xref:"ChangeFeed">>
- description: The blob service properties for blob restore policy.
  name: restorePolicy
  types:
  - <xref:<xref:"RestorePolicyProperties">>
- description: The blob service properties for container soft delete.
  name: containerDeleteRetentionPolicy
  types:
  - <xref:<xref:"DeleteRetentionPolicy">>
- description: 'The blob service property to configure last access time

    based tracking policy.'
  name: lastAccessTimeTrackingPolicy
  types:
  - <xref:<xref:"LastAccessTimeTrackingPolicy">>
attributes:
- uid: azure.mgmt.storage.types.BlobServicePropertiesProperties.automaticSnapshotPolicyEnabled
  name: automaticSnapshotPolicyEnabled
  summary: Deprecated in favor of isVersioningEnabled property.
  signature: 'automaticSnapshotPolicyEnabled: bool'
- uid: azure.mgmt.storage.types.BlobServicePropertiesProperties.changeFeed
  name: changeFeed
  summary: The blob service properties for change feed events.
  signature: 'changeFeed: ChangeFeed'
- uid: azure.mgmt.storage.types.BlobServicePropertiesProperties.containerDeleteRetentionPolicy
  name: containerDeleteRetentionPolicy
  summary: The blob service properties for container soft delete.
  signature: 'containerDeleteRetentionPolicy: DeleteRetentionPolicy'
- uid: azure.mgmt.storage.types.BlobServicePropertiesProperties.cors
  name: cors
  summary: 'Specifies CORS rules for the Blob service. You can include up to five
    CorsRule elements in the

    request. If no CorsRule elements are included in the request body, all CORS rules
    will be

    deleted, and CORS will be disabled for the Blob service.'
  signature: 'cors: CorsRules'
- uid: azure.mgmt.storage.types.BlobServicePropertiesProperties.defaultServiceVersion
  name: defaultServiceVersion
  summary: 'DefaultServiceVersion indicates the default version to use for requests
    to the Blob service if

    an incoming request''s version is not specified. Possible values include version
    2008-10-27 and

    all more recent versions.'
  signature: 'defaultServiceVersion: str'
- uid: azure.mgmt.storage.types.BlobServicePropertiesProperties.deleteRetentionPolicy
  name: deleteRetentionPolicy
  summary: The blob service properties for blob soft delete.
  signature: 'deleteRetentionPolicy: DeleteRetentionPolicy'
- uid: azure.mgmt.storage.types.BlobServicePropertiesProperties.isVersioningEnabled
  name: isVersioningEnabled
  summary: Versioning is enabled if set to true.
  signature: 'isVersioningEnabled: bool'
- uid: azure.mgmt.storage.types.BlobServicePropertiesProperties.lastAccessTimeTrackingPolicy
  name: lastAccessTimeTrackingPolicy
  summary: The blob service property to configure last access time based tracking
    policy.
  signature: 'lastAccessTimeTrackingPolicy: LastAccessTimeTrackingPolicy'
- uid: azure.mgmt.storage.types.BlobServicePropertiesProperties.restorePolicy
  name: restorePolicy
  summary: The blob service properties for blob restore policy.
  signature: 'restorePolicy: RestorePolicyProperties'
- uid: azure.mgmt.storage.types.BlobServicePropertiesProperties.staticWebsite
  name: staticWebsite
  summary: The static website properties for blob storage.
  signature: 'staticWebsite: StaticWebsite'
