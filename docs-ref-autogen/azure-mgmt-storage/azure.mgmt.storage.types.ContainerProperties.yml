### YamlMime:PythonClass
uid: azure.mgmt.storage.types.ContainerProperties
name: ContainerProperties
fullName: azure.mgmt.storage.types.ContainerProperties
module: azure.mgmt.storage.types
summary: The properties of a container.
constructor:
  syntax: ContainerProperties()
variables:
- description: The version of the deleted blob container.
  name: version
  types:
  - <xref:str>
- description: Indicates whether the blob container was deleted.
  name: deleted
  types:
  - <xref:bool>
- description: Blob container deletion time.
  name: deletedTime
  types:
  - <xref:str>
- description: Remaining retention days for soft deleted blob container.
  name: remainingRetentionDays
  types:
  - <xref:int>
- description: 'Default the container to use specified encryption scope for all

    writes.'
  name: defaultEncryptionScope
  types:
  - <xref:str>
- description: 'Block override of encryption scope from the container

    default.'
  name: denyEncryptionScopeOverride
  types:
  - <xref:bool>
- description: 'Specifies whether data in the container may be accessed publicly and
    the

    level of access. Known values are: "Container", "Blob", and "None".'
  name: publicAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicAccess">]
- description: Returns the date and time the container was last modified.
  name: lastModifiedTime
  types:
  - <xref:str>
- description: 'The lease status of the container. Known values are: "Locked" and

    "Unlocked".'
  name: leaseStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LeaseStatus">]
- description: 'Lease state of the container. Known values are: "Available", "Leased",

    "Expired", "Breaking", and "Broken".'
  name: leaseState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LeaseState">]
- description: 'Specifies whether the lease on a container is of infinite or fixed

    duration, only when the container is leased. Known values are: "Infinite" and
    "Fixed".'
  name: leaseDuration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LeaseDuration">]
- description: A name-value pair to associate with the container as metadata.
  name: metadata
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: The ImmutabilityPolicy property of the container.
  name: immutabilityPolicy
  types:
  - <xref:<xref:"ImmutabilityPolicyProperties">>
- description: The LegalHold property of the container.
  name: legalHold
  types:
  - <xref:<xref:"LegalHoldProperties">>
- description: 'The hasLegalHold public property is set to true by SRP if there are
    at

    least one existing tag. The hasLegalHold public property is set to false by SRP
    if all existing

    legal hold tags are cleared out. There can be a maximum of 1000 blob containers
    with

    hasLegalHold=true for a given account.'
  name: hasLegalHold
  types:
  - <xref:bool>
- description: 'The hasImmutabilityPolicy public property is set to true by SRP if

    ImmutabilityPolicy has been created for this container. The hasImmutabilityPolicy
    public

    property is set to false by SRP if ImmutabilityPolicy has not been created for
    this container.'
  name: hasImmutabilityPolicy
  types:
  - <xref:bool>
- description: 'The object level immutability property of the container.

    The property is immutable and can only be set to true at the container creation
    time. Existing

    containers must undergo a migration process.'
  name: immutableStorageWithVersioning
  types:
  - <xref:<xref:"ImmutableStorageWithVersioning">>
- description: Enable NFSv3 root squash on blob container.
  name: enableNfsV3RootSquash
  types:
  - <xref:bool>
- description: Enable NFSv3 all squash on blob container.
  name: enableNfsV3AllSquash
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.storage.types.ContainerProperties.defaultEncryptionScope
  name: defaultEncryptionScope
  summary: Default the container to use specified encryption scope for all writes.
  signature: 'defaultEncryptionScope: str'
- uid: azure.mgmt.storage.types.ContainerProperties.deleted
  name: deleted
  summary: Indicates whether the blob container was deleted.
  signature: 'deleted: bool'
- uid: azure.mgmt.storage.types.ContainerProperties.deletedTime
  name: deletedTime
  summary: Blob container deletion time.
  signature: 'deletedTime: str'
- uid: azure.mgmt.storage.types.ContainerProperties.denyEncryptionScopeOverride
  name: denyEncryptionScopeOverride
  summary: Block override of encryption scope from the container default.
  signature: 'denyEncryptionScopeOverride: bool'
- uid: azure.mgmt.storage.types.ContainerProperties.enableNfsV3AllSquash
  name: enableNfsV3AllSquash
  summary: Enable NFSv3 all squash on blob container.
  signature: 'enableNfsV3AllSquash: bool'
- uid: azure.mgmt.storage.types.ContainerProperties.enableNfsV3RootSquash
  name: enableNfsV3RootSquash
  summary: Enable NFSv3 root squash on blob container.
  signature: 'enableNfsV3RootSquash: bool'
- uid: azure.mgmt.storage.types.ContainerProperties.hasImmutabilityPolicy
  name: hasImmutabilityPolicy
  summary: 'The hasImmutabilityPolicy public property is set to true by SRP if ImmutabilityPolicy
    has been

    created for this container. The hasImmutabilityPolicy public property is set to
    false by SRP if

    ImmutabilityPolicy has not been created for this container.'
  signature: 'hasImmutabilityPolicy: bool'
- uid: azure.mgmt.storage.types.ContainerProperties.hasLegalHold
  name: hasLegalHold
  summary: 'The hasLegalHold public property is set to true by SRP if there are at
    least one existing tag.

    The hasLegalHold public property is set to false by SRP if all existing legal
    hold tags are

    cleared out. There can be a maximum of 1000 blob containers with hasLegalHold=true
    for a given

    account.'
  signature: 'hasLegalHold: bool'
- uid: azure.mgmt.storage.types.ContainerProperties.immutabilityPolicy
  name: immutabilityPolicy
  summary: The ImmutabilityPolicy property of the container.
  signature: 'immutabilityPolicy: ImmutabilityPolicyProperties'
- uid: azure.mgmt.storage.types.ContainerProperties.immutableStorageWithVersioning
  name: immutableStorageWithVersioning
  summary: 'The object level immutability property of the container. The property
    is immutable and can only

    be set to true at the container creation time. Existing containers must undergo
    a migration

    process.'
  signature: 'immutableStorageWithVersioning: ImmutableStorageWithVersioning'
- uid: azure.mgmt.storage.types.ContainerProperties.lastModifiedTime
  name: lastModifiedTime
  summary: Returns the date and time the container was last modified.
  signature: 'lastModifiedTime: str'
- uid: azure.mgmt.storage.types.ContainerProperties.leaseDuration
  name: leaseDuration
  summary: 'Specifies whether the lease on a container is of infinite or fixed duration,
    only when the

    container is leased. Known values are: "Infinite" and "Fixed".'
  signature: 'leaseDuration: str | LeaseDuration'
- uid: azure.mgmt.storage.types.ContainerProperties.leaseState
  name: leaseState
  summary: '"Available", "Leased", "Expired",

    "Breaking", and "Broken".'
  signature: 'leaseState: str | LeaseState'
- uid: azure.mgmt.storage.types.ContainerProperties.leaseStatus
  name: leaseStatus
  summary: '"Locked" and "Unlocked".'
  signature: 'leaseStatus: str | LeaseStatus'
- uid: azure.mgmt.storage.types.ContainerProperties.legalHold
  name: legalHold
  summary: The LegalHold property of the container.
  signature: 'legalHold: LegalHoldProperties'
- uid: azure.mgmt.storage.types.ContainerProperties.metadata
  name: metadata
  summary: A name-value pair to associate with the container as metadata.
  signature: 'metadata: dict[str, str]'
- uid: azure.mgmt.storage.types.ContainerProperties.publicAccess
  name: publicAccess
  summary: 'Specifies whether data in the container may be accessed publicly and the
    level of access. Known

    values are: "Container", "Blob", and "None".'
  signature: 'publicAccess: str | PublicAccess'
- uid: azure.mgmt.storage.types.ContainerProperties.remainingRetentionDays
  name: remainingRetentionDays
  summary: Remaining retention days for soft deleted blob container.
  signature: 'remainingRetentionDays: int'
- uid: azure.mgmt.storage.types.ContainerProperties.version
  name: version
  summary: The version of the deleted blob container.
  signature: 'version: str'
