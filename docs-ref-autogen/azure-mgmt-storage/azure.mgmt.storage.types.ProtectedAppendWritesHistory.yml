uid: azure.mgmt.storage.types.ProtectedAppendWritesHistory
name: ProtectedAppendWritesHistory
fullName: azure.mgmt.storage.types.ProtectedAppendWritesHistory
module: azure.mgmt.storage.types
summary: Protected append writes history setting for the blob container with Legal
  holds.
constructor:
  syntax: ProtectedAppendWritesHistory()
variables:
- description: 'When enabled, new blocks can be written to both ''Append

    and Bock Blobs'' while maintaining legal hold protection and compliance. Only
    new blocks can be

    added and any existing blocks cannot be modified or deleted.'
  name: allowProtectedAppendWritesAll
  types:
  - <xref:bool>
- description: Returns the date and time the tag was added.
  name: timestamp
  types:
  - <xref:str>
