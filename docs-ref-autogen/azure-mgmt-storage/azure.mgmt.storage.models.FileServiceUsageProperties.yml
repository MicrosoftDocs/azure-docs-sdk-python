    storage account.'
  signature: 'file_share_limits: _models.FileShareLimits | None'
- uid: azure.mgmt.storage.models.FileServiceUsageProperties.file_share_recommendations
  name: file_share_recommendations
  summary: 'Constants used for calculating recommended provisioned IOPS and bandwidth
    for a file share in

    the storage account.'
  signature: 'file_share_recommendations: _models.FileShareRecommendations | None'
- uid: azure.mgmt.storage.models.FileServiceUsageProperties.storage_account_limits
  name: storage_account_limits
  summary: 'Maximum provisioned storage, IOPS, bandwidth and number of file shares
