    set to AD (AD DS authentication), this property is optional. If provided, samAccountName
    should

    also be provided. For directoryServiceOptions AADDS (Entra DS authentication)
    or AADKERB (Entra

    authentication), this property can be omitted. Known values are: "User" and "Computer".'
  signature: 'accountType: str | AccountType'
- uid: azure.mgmt.storage.types.ActiveDirectoryProperties.azureStorageSid
  name: azureStorageSid
  summary: 'Specifies the security identifier (SID) for Azure Storage. If directoryServiceOptions
    is set to

    AD (AD DS authentication), this property is required. Otherwise, it can be omitted.'
  signature: 'azureStorageSid: str'
