  signature: 'domainGuid: str'
- uid: azure.mgmt.storage.types.ActiveDirectoryProperties.domainName
  name: domainName
  summary: 'Specifies the primary domain that the AD DNS server is authoritative for.
    This property is

    required if directoryServiceOptions is set to AD (AD DS authentication). If

