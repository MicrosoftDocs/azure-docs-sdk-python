  signature: 'domainSid: str'
- uid: azure.mgmt.storage.types.ActiveDirectoryProperties.forestName
  name: forestName
  summary: 'Specifies the Active Directory forest to get. If directoryServiceOptions
    is set to AD (AD DS

    authentication), this property is required. Otherwise, it can be omitted.'
  signature: 'forestName: str'
