### YamlMime:PythonClass
uid: azure.mgmt.storage.types.ObjectReplicationPolicyFilter
name: ObjectReplicationPolicyFilter
fullName: azure.mgmt.storage.types.ObjectReplicationPolicyFilter
module: azure.mgmt.storage.types
summary: 'Filters limit replication to a subset of blobs within the storage account.
  A logical OR is

  performed on values in the filter. If multiple filters are defined, a logical AND
  is performed

  on all filters.'
constructor:
  syntax: ObjectReplicationPolicyFilter()
variables:
- description: 'Optional. Filters the results to replicate only blobs whose names
    begin with

    the specified prefix.'
  name: prefixMatch
  types:
  - <xref:list>[<xref:str>]
- description: 'Blobs created after the time will be replicated to the destination.
    It

    must be in datetime format ''yyyy-MM-ddTHH:mm:ssZ''. Example: 2020-02-19T16:05:00Z.'
  name: minCreationTime
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storage.types.ObjectReplicationPolicyFilter.minCreationTime
  name: minCreationTime
  summary: 'Blobs created after the time will be replicated to the destination. It
    must be in datetime

    format ''yyyy-MM-ddTHH:mm:ssZ''. Example: 2020-02-19T16:05:00Z.'
  signature: 'minCreationTime: str'
- uid: azure.mgmt.storage.types.ObjectReplicationPolicyFilter.prefixMatch
  name: prefixMatch
  summary: 'Optional. Filters the results to replicate only blobs whose names begin
    with the specified

    prefix.'
  signature: 'prefixMatch: list[str]'
