  summary: Create or update the object replication policy of the storage account.
  signature: 'async create_or_update(resource_group_name: str, account_name: str,
    object_replication_policy_id: str, properties: _models.ObjectReplicationPolicy,
    *, content_type: str = ''application/json'', **kwargs: Any) -> _models.ObjectReplicationPolicy'
  parameters:
  - name: resource_group_name
    description: 'The name of the resource group. The name is case insensitive.

      Required.'
    isRequired: true
    types:
    - <xref:str>
  - name: account_name
    description: 'The name of the storage account within the specified resource group.

      Storage account names must be between 3 and 24 characters in length and use
      numbers and

      lower-case letters only. Required.'
    isRequired: true
    types:
    - <xref:str>
  - name: object_replication_policy_id
    description: 'For the destination account, provide the value ''default''.

      Configure the policy on the destination account first. For the source account,
      provide the

      value of the policy ID that is returned when you download the policy that was
      defined on the

      destination account. The policy is downloaded as a JSON file. Required.'
    isRequired: true
    types:
    - <xref:str>
  - name: properties
    description: 'The object replication policy set to a storage account. A unique
      policy ID

      will be created if absent. Is one of the following types: ObjectReplicationPolicy,
      JSON,

      IO[bytes] Required.'
    isRequired: true
