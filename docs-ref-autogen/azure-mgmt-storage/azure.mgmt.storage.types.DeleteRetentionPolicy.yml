  name: days
  summary: 'Indicates the number of days that the deleted item should be retained.
    The minimum specified

    value can be 1 and the maximum value can be 365.'
  signature: 'days: int'
- uid: azure.mgmt.storage.types.DeleteRetentionPolicy.enabled
  name: enabled
  summary: Indicates whether DeleteRetentionPolicy is enabled.
