uid: azure.mgmt.storage.types.DeleteRetentionPolicy
name: DeleteRetentionPolicy
fullName: azure.mgmt.storage.types.DeleteRetentionPolicy
module: azure.mgmt.storage.types
summary: The service properties for soft delete.
constructor:
  syntax: DeleteRetentionPolicy()
variables:
- description: Indicates whether DeleteRetentionPolicy is enabled.
  name: enabled
  types:
  - <xref:bool>
- description: 'Indicates the number of days that the deleted item should be retained.
    The minimum

    specified value can be 1 and the maximum value can be 365.'
  name: days
  types:
  - <xref:int>
