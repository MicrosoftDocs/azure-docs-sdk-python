### YamlMime:PythonClass
uid: azure.mgmt.storage.types.StorageConnectorProperties
name: StorageConnectorProperties
fullName: azure.mgmt.storage.types.StorageConnectorProperties
module: azure.mgmt.storage.types
summary: The storage connector properties.
constructor:
  syntax: StorageConnectorProperties()
variables:
- description: 'System-generated GUID identifier for the Storage Connector. Not a
    valid input

    parameter when creating.'
  name: uniqueId
  types:
  - <xref:str>
- description: 'State - Active or Inactive. Whether or not the Storage Connector should
    start as

    active (default: Active) (While set to false on the Storage Connector, all data
    plane requests

    using this Storage Connector fail, and this Storage Connector is not billed if
    it would be

    otherwise. Known values are: "Active" and "Inactive".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageConnectorState">]
- description: 'System-generated creation time of the Storage Connector in ISO 8601

    date-time format (YYYY-MM-DDTHH:mm:ssZ). Not a valid input parameter during creating.'
  name: creationTime
  types:
  - <xref:str>
- description: Arbitrary description of this Storage Connector. Max 250 characters.
  name: description
  types:
  - <xref:str>
- description: 'Test connection to backing data source before creating the storage

    connector.'
  name: testConnection
  types:
  - <xref:bool>
- description: 'The type of backing data source for this Storage Connector. Required.

    "Azure_DataShare"'
  name: dataSourceType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageConnectorDataSourceType">]
- description: 'Information about how to communicate with and authenticate to the
    backing data

    store. Required.'
  name: source
  types:
  - <xref:<xref:"StorageConnectorSource">>
- description: 'Represents the provisioning state of the storage connector. Known

    values are: "Accepted", "Creating", "Succeeded", "Deleting", "Canceled", and "Failed".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NativeDataSharingProvisioningState">]
attributes:
- uid: azure.mgmt.storage.types.StorageConnectorProperties.creationTime
  name: creationTime
  summary: 'System-generated creation time of the Storage Connector in ISO 8601 date-time
    format

    (YYYY-MM-DDTHH:mm:ssZ). Not a valid input parameter during creating.'
  signature: 'creationTime: str'
- uid: azure.mgmt.storage.types.StorageConnectorProperties.dataSourceType
  name: dataSourceType
  summary: The type of backing data source for this Storage Connector. Required. "Azure_DataShare"
  signature: 'dataSourceType: Required[str | StorageConnectorDataSourceType]'
- uid: azure.mgmt.storage.types.StorageConnectorProperties.description
  name: description
  summary: Arbitrary description of this Storage Connector. Max 250 characters.
  signature: 'description: str'
- uid: azure.mgmt.storage.types.StorageConnectorProperties.provisioningState
  name: provisioningState
  summary: '"Accepted",

    "Creating", "Succeeded", "Deleting", "Canceled", and "Failed".'
  signature: 'provisioningState: str | NativeDataSharingProvisioningState'
- uid: azure.mgmt.storage.types.StorageConnectorProperties.source
  name: source
  summary: Information about how to communicate with and authenticate to the backing
    data store. Required.
  signature: 'source: Required[StorageConnectorSource]'
- uid: azure.mgmt.storage.types.StorageConnectorProperties.state
  name: state
  summary: 'State - Active or Inactive. Whether or not the Storage Connector should
    start as active

    (default: Active) (While set to false on the Storage Connector, all data plane
    requests using

    this Storage Connector fail, and this Storage Connector is not billed if it would
    be otherwise.

    Known values are: "Active" and "Inactive".'
  signature: 'state: str | StorageConnectorState'
- uid: azure.mgmt.storage.types.StorageConnectorProperties.testConnection
  name: testConnection
  summary: Test connection to backing data source before creating the storage connector.
  signature: 'testConnection: bool'
- uid: azure.mgmt.storage.types.StorageConnectorProperties.uniqueId
  name: uniqueId
  summary: 'System-generated GUID identifier for the Storage Connector. Not a valid
    input parameter when

    creating.'
  signature: 'uniqueId: str'
