### YamlMime:PythonClass
uid: azure.mgmt.storage.types.StorageTaskReportProperties
name: StorageTaskReportProperties
fullName: azure.mgmt.storage.types.StorageTaskReportProperties
module: azure.mgmt.storage.types
summary: Storage task execution report for a run instance.
constructor:
  syntax: StorageTaskReportProperties()
variables:
- description: 'Represents the Storage Task Assignment Id associated with the storage

    task that provided an execution context.'
  name: taskAssignmentId
  types:
  - <xref:str>
- description: 'Represents the Storage Account Id where the storage task definition
    was

    applied and executed.'
  name: storageAccountId
  types:
  - <xref:str>
- description: 'Start time of the run instance. Filter options such as startTime gt

    ''2023-06-26T20:51:24.4494016Z'' and other comparison operators can be used as
    described for

    DateTime properties in

    [https://learn.microsoft.com/rest/api/storageservices/querying-tables-and-entities#supported-comparison-operators](https://learn.microsoft.com/rest/api/storageservices/querying-tables-and-entities#supported-comparison-operators).'
  name: startTime
  types:
  - <xref:str>
- description: 'End time of the run instance. Filter options such as startTime gt

    ''2023-06-26T20:51:24.4494016Z'' and other comparison operators can be used as
    described for

    DateTime properties in

    [https://learn.microsoft.com/rest/api/storageservices/querying-tables-and-entities#supported-comparison-operators](https://learn.microsoft.com/rest/api/storageservices/querying-tables-and-entities#supported-comparison-operators).'
  name: finishTime
  types:
  - <xref:str>
- description: 'Total number of objects that meet the condition as defined in the

    storage task assignment execution context. Filter options such as objectsTargetedCount
    gt 50

    and other comparison operators can be used as described for Numerical properties
    in

    [https://learn.microsoft.com/rest/api/storageservices/querying-tables-and-entities#supported-comparison-operators](https://learn.microsoft.com/rest/api/storageservices/querying-tables-and-entities#supported-comparison-operators).'
  name: objectsTargetedCount
  types:
  - <xref:str>
- description: 'Total number of objects that meet the storage tasks condition and

    were operated upon. Filter options such as objectsOperatedOnCount ge 100 and other
    comparison

    operators can be used as described for Numerical properties in

    [https://learn.microsoft.com/rest/api/storageservices/querying-tables-and-entities#supported-comparison-operators](https://learn.microsoft.com/rest/api/storageservices/querying-tables-and-entities#supported-comparison-operators).'
  name: objectsOperatedOnCount
  types:
  - <xref:str>
- description: 'Total number of objects where task operation failed when was

    attempted. Filter options such as objectFailedCount eq 0 and other comparison
    operators can be

    used as described for Numerical properties in

    [https://learn.microsoft.com/rest/api/storageservices/querying-tables-and-entities#supported-comparison-operators](https://learn.microsoft.com/rest/api/storageservices/querying-tables-and-entities#supported-comparison-operators).'
  name: objectFailedCount
  types:
  - <xref:str>
- description: 'Total number of objects where task operation succeeded when was

    attempted.Filter options such as objectsSucceededCount gt 150 and other comparison
    operators

    can be used as described for Numerical properties in

    [https://learn.microsoft.com/rest/api/storageservices/querying-tables-and-entities#supported-comparison-operators](https://learn.microsoft.com/rest/api/storageservices/querying-tables-and-entities#supported-comparison-operators).'
  name: objectsSucceededCount
  types:
  - <xref:str>
- description: 'Well known Azure Storage error code that represents the error encountered

    during execution of the run instance.'
  name: runStatusError
  types:
  - <xref:str>
- description: 'Represents the status of the execution. Known values are: "InProgress"
    and

    "Finished".'
  name: runStatusEnum
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RunStatusEnum">]
- description: 'Full path to the verbose report stored in the reporting container
    as

    specified in the assignment execution context for the storage account.'
  name: summaryReportPath
  types:
  - <xref:str>
- description: Storage Task Arm Id.
  name: taskId
  types:
  - <xref:str>
- description: Storage Task Version.
  name: taskVersion
  types:
  - <xref:str>
- description: 'Represents the overall result of the execution for the run instance.
    Known

    values are: "Succeeded" and "Failed".'
  name: runResult
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RunResult">]
