### YamlMime:PythonClass
uid: azure.mgmt.storage.models.UpdateHistoryProperty
name: UpdateHistoryProperty
fullName: azure.mgmt.storage.models.UpdateHistoryProperty
module: azure.mgmt.storage.models
summary: An update history of the ImmutabilityPolicy of a blob container.
constructor:
  syntax: 'UpdateHistoryProperty(*args: Any, **kwargs: Any)'
variables:
- description: 'The ImmutabilityPolicy update type of a blob container, possible values

    include: put, lock and extend. Known values are: "put", "lock", and "extend".'
  name: update_property
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.ImmutabilityPolicyUpdateType>
- description: 'The immutability period for the blobs in the

    container since the policy creation, in days.'
  name: immutability_period_since_creation_in_days
  types:
  - <xref:int>
- description: Returns the date and time the ImmutabilityPolicy was updated.
  name: timestamp
  types:
  - <xref:datetime.datetime>
- description: Returns the Object ID of the user who updated the ImmutabilityPolicy.
  name: object_identifier
  types:
  - <xref:str>
- description: 'Returns the Tenant ID that issued the token for the user who updated
    the

    ImmutabilityPolicy.'
  name: tenant_id
  types:
  - <xref:str>
- description: Returns the User Principal Name of the user who updated the ImmutabilityPolicy.
  name: upn
  types:
  - <xref:str>
- description: 'This property can only be changed for unlocked time-based

    retention policies. When enabled, new blocks can be written to an append blob
    while maintaining

    immutability protection and compliance. Only new blocks can be added and any existing
    blocks

    cannot be modified or deleted. This property cannot be changed with ExtendImmutabilityPolicy

    API.'
  name: allow_protected_append_writes
  types:
  - <xref:bool>
- description: 'This property can only be changed for unlocked

    time-based retention policies. When enabled, new blocks can be written to both
    ''Append and Bock

    Blobs'' while maintaining immutability protection and compliance. Only new blocks
    can be added

    and any existing blocks cannot be modified or deleted. This property cannot be
    changed with

    ExtendImmutabilityPolicy API. The ''allowProtectedAppendWrites'' and

    ''allowProtectedAppendWritesAll'' properties are mutually exclusive.'
  name: allow_protected_append_writes_all
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.storage.models.UpdateHistoryProperty.allow_protected_append_writes
  name: allow_protected_append_writes
  summary: 'This property can only be changed for unlocked time-based retention policies.
    When enabled, new

    blocks can be written to an append blob while maintaining immutability protection
    and

    compliance. Only new blocks can be added and any existing blocks cannot be modified
    or deleted.

    This property cannot be changed with ExtendImmutabilityPolicy API.'
  signature: 'allow_protected_append_writes: bool | None'
- uid: azure.mgmt.storage.models.UpdateHistoryProperty.allow_protected_append_writes_all
  name: allow_protected_append_writes_all
  summary: 'This property can only be changed for unlocked time-based retention policies.
    When enabled, new

    blocks can be written to both ''Append and Bock Blobs'' while maintaining immutability
    protection

    and compliance. Only new blocks can be added and any existing blocks cannot be
    modified or

    deleted. This property cannot be changed with ExtendImmutabilityPolicy API. The

    ''allowProtectedAppendWrites'' and ''allowProtectedAppendWritesAll'' properties
    are mutually

    exclusive.'
  signature: 'allow_protected_append_writes_all: bool | None'
- uid: azure.mgmt.storage.models.UpdateHistoryProperty.immutability_period_since_creation_in_days
  name: immutability_period_since_creation_in_days
  summary: The immutability period for the blobs in the container since the policy
    creation, in days.
  signature: 'immutability_period_since_creation_in_days: int | None'
- uid: azure.mgmt.storage.models.UpdateHistoryProperty.object_identifier
  name: object_identifier
  summary: Returns the Object ID of the user who updated the ImmutabilityPolicy.
  signature: 'object_identifier: str | None'
- uid: azure.mgmt.storage.models.UpdateHistoryProperty.tenant_id
  name: tenant_id
  summary: Returns the Tenant ID that issued the token for the user who updated the
    ImmutabilityPolicy.
  signature: 'tenant_id: str | None'
- uid: azure.mgmt.storage.models.UpdateHistoryProperty.timestamp
  name: timestamp
  summary: Returns the date and time the ImmutabilityPolicy was updated.
  signature: 'timestamp: datetime | None'
- uid: azure.mgmt.storage.models.UpdateHistoryProperty.update_property
  name: update_property
  summary: 'put, lock and

    extend. Known values are: "put", "lock", and "extend".'
  signature: 'update_property: str | _models.ImmutabilityPolicyUpdateType | None'
- uid: azure.mgmt.storage.models.UpdateHistoryProperty.upn
  name: upn
  summary: Returns the User Principal Name of the user who updated the ImmutabilityPolicy.
  signature: 'upn: str | None'
