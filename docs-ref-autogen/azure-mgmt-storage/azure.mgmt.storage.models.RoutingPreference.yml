uid: azure.mgmt.storage.models.RoutingPreference
name: RoutingPreference
fullName: azure.mgmt.storage.models.RoutingPreference
module: azure.mgmt.storage.models
summary: 'Routing preference defines the type of network, either microsoft or internet
  routing to be used

  to deliver the user data, the default option is microsoft routing.'
constructor:
  syntax: 'RoutingPreference(*args: Any, **kwargs: Any)'
variables:
- description: 'Routing Choice defines the kind of network routing opted by the user.

    Known values are: "MicrosoftRouting" and "InternetRouting".'
  name: routing_choice
  types:
  - <xref:str>
  - <xref:azure.mgmt.storage.models.RoutingChoice>
- description: 'A boolean flag which indicates whether microsoft routing

    storage endpoints are to be published.'
  name: publish_microsoft_endpoints
  types:
  - <xref:bool>
- description: 'A boolean flag which indicates whether internet routing

    storage endpoints are to be published.'
  name: publish_internet_endpoints
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.storage.models.RoutingPreference.publish_internet_endpoints
  name: publish_internet_endpoints
  summary: A boolean flag which indicates whether internet routing storage endpoints
    are to be published.
  signature: 'publish_internet_endpoints: bool | None'
- uid: azure.mgmt.storage.models.RoutingPreference.publish_microsoft_endpoints
  name: publish_microsoft_endpoints
  summary: A boolean flag which indicates whether microsoft routing storage endpoints
    are to be published.
  signature: 'publish_microsoft_endpoints: bool | None'
- uid: azure.mgmt.storage.models.RoutingPreference.routing_choice
  name: routing_choice
  summary: 'Routing Choice defines the kind of network routing opted by the user.
    Known values are:

    "MicrosoftRouting" and "InternetRouting".'
  signature: 'routing_choice: str | _models.RoutingChoice | None'
