### YamlMime:PythonClass
uid: azure.mgmt.storage.models.BlobInventoryPolicyFilter
name: BlobInventoryPolicyFilter
fullName: azure.mgmt.storage.models.BlobInventoryPolicyFilter
module: azure.mgmt.storage.models
summary: 'An object that defines the blob inventory rule filter conditions. For ''Blob''

  definition.objectType all filter properties are applicable, ''blobTypes'' is required
  and others

  are optional. For ''Container'' definition.objectType only prefixMatch is applicable
  and is

  optional.'
constructor:
  syntax: 'BlobInventoryPolicyFilter(*args: Any, **kwargs: Any)'
variables:
- description: 'An array of strings with maximum 10 blob prefixes to be included in
    the

    inventory.'
  name: prefix_match
  types:
  - <xref:list>[<xref:str>]
- description: 'An array of strings with maximum 10 blob prefixes to be excluded from
    the

    inventory.'
  name: exclude_prefix
  types:
  - <xref:list>[<xref:str>]
- description: 'An array of predefined enum values. Valid values include blockBlob,

    appendBlob, pageBlob. Hns accounts does not support pageBlobs. This field is required
    when

    definition.objectType property is set to ''Blob''.'
  name: blob_types
  types:
  - <xref:list>[<xref:str>]
- description: 'Includes blob versions in blob inventory when value is set to

    true. The definition.schemaFields values ''VersionId and IsCurrentVersion'' are
    required if this

    property is set to true, else they must be excluded.'
  name: include_blob_versions
  types:
  - <xref:bool>
- description: 'Includes blob snapshots in blob inventory when value is set to true.

    The definition.schemaFields value ''Snapshot'' is required if this property is
    set to true, else

    it must be excluded.'
  name: include_snapshots
  types:
  - <xref:bool>
- description: 'For ''Container'' definition.objectType the definition.schemaFields
    must

    include ''Deleted, Version, DeletedTime and RemainingRetentionDays''. For ''Blob''

    definition.objectType and HNS enabled storage accounts the definition.schemaFields
    must include

    ''DeletionId, Deleted, DeletedTime and RemainingRetentionDays'' and for Hns disabled
    accounts the

    definition.schemaFields must include ''Deleted and RemainingRetentionDays'', else
    it must be

    excluded.'
  name: include_deleted
  types:
  - <xref:bool>
- description: This property is used to filter objects based on the object creation
    time.
  name: creation_time
  types:
  - <xref:azure.mgmt.storage.models.BlobInventoryCreationTime>
attributes:
- uid: azure.mgmt.storage.models.BlobInventoryPolicyFilter.blob_types
  name: blob_types
  summary: 'An array of predefined enum values. Valid values include blockBlob, appendBlob,
    pageBlob. Hns

    accounts does not support pageBlobs. This field is required when definition.objectType
    property

    is set to ''Blob''.'
  signature: 'blob_types: list[str] | None'
- uid: azure.mgmt.storage.models.BlobInventoryPolicyFilter.creation_time
  name: creation_time
  summary: This property is used to filter objects based on the object creation time.
  signature: 'creation_time: _models.BlobInventoryCreationTime | None'
- uid: azure.mgmt.storage.models.BlobInventoryPolicyFilter.exclude_prefix
  name: exclude_prefix
  summary: An array of strings with maximum 10 blob prefixes to be excluded from the
    inventory.
  signature: 'exclude_prefix: list[str] | None'
- uid: azure.mgmt.storage.models.BlobInventoryPolicyFilter.include_blob_versions
  name: include_blob_versions
  summary: 'Includes blob versions in blob inventory when value is set to true. The
    definition.schemaFields

    values ''VersionId and IsCurrentVersion'' are required if this property is set
    to true, else they

    must be excluded.'
  signature: 'include_blob_versions: bool | None'
- uid: azure.mgmt.storage.models.BlobInventoryPolicyFilter.include_deleted
  name: include_deleted
  summary: 'For ''Container'' definition.objectType the definition.schemaFields must
    include ''Deleted,

    Version, DeletedTime and RemainingRetentionDays''. For ''Blob'' definition.objectType
    and HNS

    enabled storage accounts the definition.schemaFields must include ''DeletionId,
    Deleted,

    DeletedTime and RemainingRetentionDays'' and for Hns disabled accounts the

    definition.schemaFields must include ''Deleted and RemainingRetentionDays'', else
    it must be

    excluded.'
  signature: 'include_deleted: bool | None'
- uid: azure.mgmt.storage.models.BlobInventoryPolicyFilter.include_snapshots
  name: include_snapshots
  summary: 'Includes blob snapshots in blob inventory when value is set to true. The

    definition.schemaFields value ''Snapshot'' is required if this property is set
    to true, else it

    must be excluded.'
  signature: 'include_snapshots: bool | None'
- uid: azure.mgmt.storage.models.BlobInventoryPolicyFilter.prefix_match
  name: prefix_match
  summary: An array of strings with maximum 10 blob prefixes to be included in the
    inventory.
  signature: 'prefix_match: list[str] | None'
