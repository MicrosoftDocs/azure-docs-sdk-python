- uid: azure.mgmt.storage.aio.operations.ConnectorsOperations.begin_test_existing_connection
  name: begin_test_existing_connection
  summary: 'This method is used to verify that the connection to the backing data
    store works. This API is

    designed to be used for monitoring and debugging purposes. From the caller''s
    perspective, this

    method does the following: Calls List on the backing data store, attempting to
    list up to one

    blob/object/etc. If the above succeeds, and if a blob/object/etc is found, calls
    Get on that

    object, attempting to download one byte.'
  signature: 'async begin_test_existing_connection(resource_group_name: str, account_name:
    str, connector_name: str, body: _models.TestExistingConnectionRequest, *, content_type:
    str = ''application/json'', **kwargs: Any) -> AsyncLROPoller[_models.TestConnectionResponse]'
  parameters:
  - name: resource_group_name
    description: 'The name of the resource group. The name is case insensitive.

      Required.'
    isRequired: true
    types:
    - <xref:str>
  - name: account_name
    description: 'The name of the storage account within the specified resource group.

      Storage account names must be between 3 and 24 characters in length and use
      numbers and

      lower-case letters only. Required.'
    isRequired: true
    types:
    - <xref:str>
  - name: connector_name
    description: The name of the Storage Connector. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: body
    description: 'This method is used to verify that the connection to the backing
      data store works.

      This API is designed to be used for monitoring and debugging purposes. From
      the caller''s

      perspective, this method does the following: Calls List on the backing data
      store, attempting

      to list up to one blob/object/etc. If the above succeeds, and if a blob/object/etc
      is found,

      calls Get on that object, attempting to download one byte. Is one of the following
      types:

      TestExistingConnectionRequest, JSON, IO[bytes] Required.'
    isRequired: true
    types:
    - <xref:azure.mgmt.storage.models.TestExistingConnectionRequest>
    - <xref:JSON>
    - <xref:typing.IO>[<xref:bytes>]
  return:
    description: 'An instance of AsyncLROPoller that returns TestConnectionResponse.
      The

      TestConnectionResponse is compatible with MutableMapping'
    types:
    - <xref:azure.core.polling.AsyncLROPoller>[<xref:azure.mgmt.storage.models.TestConnectionResponse>]
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
