- uid: azure.mgmt.storage.types.SmbSetting.channelEncryption
  name: channelEncryption
  summary: 'SMB channel encryption supported by server. Valid values are AES-128-CCM,
    AES-128-GCM,

    AES-256-GCM. Should be passed as a string with delimiter '';''.'
  signature: 'channelEncryption: str'
- uid: azure.mgmt.storage.types.SmbSetting.encryptionInTransit
  name: encryptionInTransit
  summary: Encryption in transit setting.
  signature: 'encryptionInTransit: EncryptionInTransit'
- uid: azure.mgmt.storage.types.SmbSetting.kerberosTicketEncryption
  name: kerberosTicketEncryption
  summary: 'Kerberos ticket encryption supported by server. Valid values are RC4-HMAC,
    AES-256. Should be

    passed as a string with delimiter '';''.'
  signature: 'kerberosTicketEncryption: str'
- uid: azure.mgmt.storage.types.SmbSetting.multichannel
  name: multichannel
  summary: Multichannel setting. Applies to Premium FileStorage only.
