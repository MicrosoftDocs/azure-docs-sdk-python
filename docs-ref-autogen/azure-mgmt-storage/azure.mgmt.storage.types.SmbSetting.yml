### YamlMime:PythonClass
uid: azure.mgmt.storage.types.SmbSetting
name: SmbSetting
fullName: azure.mgmt.storage.types.SmbSetting
module: azure.mgmt.storage.types
summary: Setting for SMB protocol.
constructor:
  syntax: SmbSetting()
variables:
- description: Multichannel setting. Applies to Premium FileStorage only.
  name: multichannel
  types:
  - <xref:<xref:"Multichannel">>
- description: 'SMB protocol versions supported by server. Valid values are SMB2.1,
    SMB3.0,

    SMB3.1.1. Should be passed as a string with delimiter '';''.'
  name: versions
  types:
  - <xref:str>
- description: 'SMB authentication methods supported by server. Valid values are

    NTLMv2, Kerberos. Should be passed as a string with delimiter '';''.'
  name: authenticationMethods
  types:
  - <xref:str>
- description: 'Kerberos ticket encryption supported by server. Valid values

    are RC4-HMAC, AES-256. Should be passed as a string with delimiter '';''.'
  name: kerberosTicketEncryption
  types:
  - <xref:str>
- description: 'SMB channel encryption supported by server. Valid values are

    AES-128-CCM, AES-128-GCM, AES-256-GCM. Should be passed as a string with delimiter
    '';''.'
  name: channelEncryption
  types:
  - <xref:str>
- description: Encryption in transit setting.
  name: encryptionInTransit
  types:
  - <xref:<xref:"EncryptionInTransit">>
attributes:
- uid: azure.mgmt.storage.types.SmbSetting.authenticationMethods
  name: authenticationMethods
  summary: 'SMB authentication methods supported by server. Valid values are NTLMv2,
