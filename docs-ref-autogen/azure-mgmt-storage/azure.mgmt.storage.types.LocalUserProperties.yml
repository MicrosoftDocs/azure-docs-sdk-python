### YamlMime:PythonClass
uid: azure.mgmt.storage.types.LocalUserProperties
name: LocalUserProperties
fullName: azure.mgmt.storage.types.LocalUserProperties
module: azure.mgmt.storage.types
summary: The Storage Account Local User properties.
constructor:
  syntax: LocalUserProperties()
variables:
- description: The permission scopes of the local user.
  name: permissionScopes
  types:
  - <xref:list>[<xref:"PermissionScope">]
- description: Optional, local user home directory.
  name: homeDirectory
  types:
  - <xref:str>
- description: Optional, local user ssh authorized keys for SFTP.
  name: sshAuthorizedKeys
  types:
  - <xref:list>[<xref:"SshPublicKey">]
- description: A unique Security Identifier that is generated by the server.
  name: sid
  types:
  - <xref:str>
- description: 'Indicates whether shared key exists. Set it to false to remove existing

    shared key.'
  name: hasSharedKey
  types:
  - <xref:bool>
- description: Indicates whether ssh key exists. Set it to false to remove existing
    SSH key.
  name: hasSshKey
  types:
  - <xref:bool>
- description: 'Indicates whether ssh password exists. Set it to false to remove existing

    SSH password.'
  name: hasSshPassword
  types:
  - <xref:bool>
- description: A unique Identifier that is generated by the server.
  name: userId
  types:
  - <xref:int>
- description: An identifier for associating a group of users.
  name: groupId
  types:
  - <xref:int>
- description: 'Indicates whether ACL authorization is allowed for this user. Set

    it to false to disallow using ACL authorization.'
  name: allowAclAuthorization
  types:
  - <xref:bool>
- description: 'Supplementary group membership. Only applicable for local users enabled

    for NFSv3 access.'
  name: extendedGroups
  types:
  - <xref:list>[<xref:int>]
- description: Indicates if the local user is enabled for access with NFSv3 protocol.
  name: isNFSv3Enabled
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.storage.types.LocalUserProperties.allowAclAuthorization
  name: allowAclAuthorization
  summary: 'Indicates whether ACL authorization is allowed for this user. Set it to
    false to disallow using

    ACL authorization.'
  signature: 'allowAclAuthorization: bool'
- uid: azure.mgmt.storage.types.LocalUserProperties.extendedGroups
  name: extendedGroups
  summary: Supplementary group membership. Only applicable for local users enabled
    for NFSv3 access.
  signature: 'extendedGroups: list[int]'
- uid: azure.mgmt.storage.types.LocalUserProperties.groupId
  name: groupId
  summary: An identifier for associating a group of users.
  signature: 'groupId: int'
- uid: azure.mgmt.storage.types.LocalUserProperties.hasSharedKey
  name: hasSharedKey
  summary: Indicates whether shared key exists. Set it to false to remove existing
    shared key.
  signature: 'hasSharedKey: bool'
- uid: azure.mgmt.storage.types.LocalUserProperties.hasSshKey
  name: hasSshKey
  summary: Indicates whether ssh key exists. Set it to false to remove existing SSH
    key.
  signature: 'hasSshKey: bool'
- uid: azure.mgmt.storage.types.LocalUserProperties.hasSshPassword
  name: hasSshPassword
  summary: Indicates whether ssh password exists. Set it to false to remove existing
    SSH password.
  signature: 'hasSshPassword: bool'
- uid: azure.mgmt.storage.types.LocalUserProperties.homeDirectory
  name: homeDirectory
  summary: Optional, local user home directory.
  signature: 'homeDirectory: str'
- uid: azure.mgmt.storage.types.LocalUserProperties.isNFSv3Enabled
  name: isNFSv3Enabled
  summary: Indicates if the local user is enabled for access with NFSv3 protocol.
  signature: 'isNFSv3Enabled: bool'
- uid: azure.mgmt.storage.types.LocalUserProperties.permissionScopes
  name: permissionScopes
  summary: The permission scopes of the local user.
  signature: 'permissionScopes: list[azure.mgmt.storage.types.PermissionScope]'
- uid: azure.mgmt.storage.types.LocalUserProperties.sid
  name: sid
  summary: A unique Security Identifier that is generated by the server.
  signature: 'sid: str'
- uid: azure.mgmt.storage.types.LocalUserProperties.sshAuthorizedKeys
  name: sshAuthorizedKeys
  summary: Optional, local user ssh authorized keys for SFTP.
  signature: 'sshAuthorizedKeys: list[azure.mgmt.storage.types.SshPublicKey]'
- uid: azure.mgmt.storage.types.LocalUserProperties.userId
  name: userId
  summary: A unique Identifier that is generated by the server.
  signature: 'userId: int'
