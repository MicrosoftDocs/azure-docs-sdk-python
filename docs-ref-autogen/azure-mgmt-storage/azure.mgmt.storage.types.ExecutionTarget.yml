### YamlMime:PythonClass
uid: azure.mgmt.storage.types.ExecutionTarget
name: ExecutionTarget
fullName: azure.mgmt.storage.types.ExecutionTarget
module: azure.mgmt.storage.types
summary: 'Target helps provide filter parameters for the objects in the storage account
  and forms the

  execution context for the storage task.'
constructor:
  syntax: ExecutionTarget()
variables:
- description: Required list of object prefixes to be included for task execution.
  name: prefix
  types:
  - <xref:list>[<xref:str>]
- description: 'List of object prefixes to be excluded from task execution. If there
    is a

    conflict between include and exclude prefixes, the exclude prefix will be the
    determining

    factor.'
  name: excludePrefix
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.storage.types.ExecutionTarget.excludePrefix
  name: excludePrefix
  summary: 'List of object prefixes to be excluded from task execution. If there is
    a conflict between

    include and exclude prefixes, the exclude prefix will be the determining factor.'
  signature: 'excludePrefix: list[str]'
- uid: azure.mgmt.storage.types.ExecutionTarget.prefix
  name: prefix
  summary: Required list of object prefixes to be included for task execution.
  signature: 'prefix: list[str]'
