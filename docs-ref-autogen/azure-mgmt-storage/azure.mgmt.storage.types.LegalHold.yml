### YamlMime:PythonClass
uid: azure.mgmt.storage.types.LegalHold
name: LegalHold
fullName: azure.mgmt.storage.types.LegalHold
module: azure.mgmt.storage.types
summary: The LegalHold property of a blob container.
constructor:
  syntax: LegalHold()
variables:
- description: 'The hasLegalHold public property is set to true by SRP if there are
    at

    least one existing tag. The hasLegalHold public property is set to false by SRP
    if all existing

    legal hold tags are cleared out. There can be a maximum of 1000 blob containers
    with

    hasLegalHold=true for a given account.'
  name: hasLegalHold
  types:
  - <xref:bool>
- description: 'Each tag should be 3 to 23 alphanumeric characters and is normalized
    to lower case

    at SRP. Required.'
  name: tags
  types:
  - <xref:list>[<xref:str>]
- description: 'When enabled, new blocks can be written to both ''Append

    and Bock Blobs'' while maintaining legal hold protection and compliance. Only
    new blocks can be

    added and any existing blocks cannot be modified or deleted.'
  name: allowProtectedAppendWritesAll
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.storage.types.LegalHold.allowProtectedAppendWritesAll
  name: allowProtectedAppendWritesAll
  summary: 'When enabled, new blocks can be written to both ''Append and Bock Blobs''
    while maintaining legal

    hold protection and compliance. Only new blocks can be added and any existing
    blocks cannot be

    modified or deleted.'
  signature: 'allowProtectedAppendWritesAll: bool'
- uid: azure.mgmt.storage.types.LegalHold.hasLegalHold
  name: hasLegalHold
  summary: 'The hasLegalHold public property is set to true by SRP if there are at
    least one existing tag.

    The hasLegalHold public property is set to false by SRP if all existing legal
    hold tags are

    cleared out. There can be a maximum of 1000 blob containers with hasLegalHold=true
    for a given

    account.'
  signature: 'hasLegalHold: bool'
- uid: azure.mgmt.storage.types.LegalHold.tags
  name: tags
  summary: 'Each tag should be 3 to 23 alphanumeric characters and is normalized to
    lower case at SRP.

    Required.'
  signature: 'tags: list[str]'
