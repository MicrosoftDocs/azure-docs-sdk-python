### YamlMime:PythonClass
uid: azure.mgmt.storage.types.AccountSasParameters
name: AccountSasParameters
fullName: azure.mgmt.storage.types.AccountSasParameters
module: azure.mgmt.storage.types
summary: The parameters to list SAS credentials of a storage account.
constructor:
  syntax: AccountSasParameters()
variables:
- description: 'The signed services accessible with the account SAS. Possible values

    include: Blob (b), Queue (q), Table (t), File (f). Required. Known values are:
    "b", "q", "t",

    and "f".'
  name: signedServices
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Services">]
- description: 'The signed resource types that are accessible with the account SAS.

    Service (s): Access to service-level APIs; Container (c): Access to container-level
    APIs;

    Object (o): Access to object-level APIs for blobs, queue messages, table entities,
    and files.

    Required. Known values are: "s", "c", and "o".'
  name: signedResourceTypes
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SignedResourceTypes">]
- description: 'The signed permissions for the account SAS. Possible values include:

    Read (r), Write (w), Delete (d), List (l), Add (a), Create (c), Update (u) and
    Process (p).

    Required. Known values are: "r", "d", "w", "l", "a", "c", "u", and "p".'
  name: signedPermission
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Permissions">]
- description: An IP address or a range of IP addresses from which to accept requests.
  name: signedIp
  types:
  - <xref:str>
- description: 'The protocol permitted for a request made with the account SAS. Known

    values are: "https,http" and "https".'
  name: signedProtocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HttpProtocol">]
- description: The time at which the SAS becomes valid.
  name: signedStart
  types:
  - <xref:str>
- description: The time at which the shared access signature becomes invalid. Required.
  name: signedExpiry
  types:
  - <xref:str>
- description: The key to sign the account SAS token with.
  name: keyToSign
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storage.types.AccountSasParameters.keyToSign
  name: keyToSign
  summary: The key to sign the account SAS token with.
  signature: 'keyToSign: str'
- uid: azure.mgmt.storage.types.AccountSasParameters.signedExpiry
  name: signedExpiry
  summary: The time at which the shared access signature becomes invalid. Required.
  signature: 'signedExpiry: Required[str]'
- uid: azure.mgmt.storage.types.AccountSasParameters.signedIp
  name: signedIp
  summary: An IP address or a range of IP addresses from which to accept requests.
  signature: 'signedIp: str'
- uid: azure.mgmt.storage.types.AccountSasParameters.signedPermission
  name: signedPermission
  summary: 'Read (r), Write (w),

    Delete (d), List (l), Add (a), Create (c), Update (u) and Process (p). Required.
    Known values

    are: "r", "d", "w", "l", "a", "c", "u", and "p".'
  signature: 'signedPermission: Required[str | Permissions]'
- uid: azure.mgmt.storage.types.AccountSasParameters.signedProtocol
  name: signedProtocol
  summary: 'The protocol permitted for a request made with the account SAS. Known
    values are:

    "https,http" and "https".'
  signature: 'signedProtocol: str | HttpProtocol'
- uid: azure.mgmt.storage.types.AccountSasParameters.signedResourceTypes
  name: signedResourceTypes
  summary: 'Access to

    service-level APIs; Container (c): Access to container-level APIs; Object (o):
    Access to

    object-level APIs for blobs, queue messages, table entities, and files. Required.
    Known values

    are: "s", "c", and "o".'
  signature: 'signedResourceTypes: Required[str | SignedResourceTypes]'
- uid: azure.mgmt.storage.types.AccountSasParameters.signedServices
  name: signedServices
  summary: 'Blob (b), Queue

    (q), Table (t), File (f). Required. Known values are: "b", "q", "t", and "f".'
  signature: 'signedServices: Required[str | Services]'
- uid: azure.mgmt.storage.types.AccountSasParameters.signedStart
  name: signedStart
  summary: The time at which the SAS becomes valid.
  signature: 'signedStart: str'
