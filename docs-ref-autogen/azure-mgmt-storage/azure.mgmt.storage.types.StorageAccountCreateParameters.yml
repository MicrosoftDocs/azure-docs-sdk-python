### YamlMime:PythonClass
uid: azure.mgmt.storage.types.StorageAccountCreateParameters
name: StorageAccountCreateParameters
fullName: azure.mgmt.storage.types.StorageAccountCreateParameters
module: azure.mgmt.storage.types
summary: The parameters used when creating a storage account.
constructor:
  syntax: StorageAccountCreateParameters()
variables:
- description: Required. Gets or sets the SKU name. Required.
  name: sku
  types:
  - <xref:<xref:"Sku">>
- description: 'Required. Indicates the type of storage account. Required. Known values
    are:

    "Storage", "StorageV2", "BlobStorage", "FileStorage", and "BlockBlobStorage".'
  name: kind
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Kind">]
- description: 'Required. Gets or sets the location of the resource. This will be
    one of the

    supported and registered Azure Geo Regions (e.g. West US, East US, Southeast Asia,
    etc.). The

    geo region of a resource cannot be changed once it is created, but if an identical
    geo region

    is specified on update, the request will succeed. Required.'
  name: location
  types:
  - <xref:str>
- description: 'Optional. Set the extended location of the resource. If not set, the

    storage account will be created in Azure main region. Otherwise it will be created
    in the

    specified extended location.'
  name: extendedLocation
  types:
  - <xref:<xref:"ExtendedLocation">>
- description: 'Optional. Gets or sets the pinned logical availability zone for the
    storage

    account.'
  name: zones
  types:
  - <xref:list>[<xref:str>]
- description: Optional. Gets or sets the zonal placement details for the storage
    account.
  name: placement
  types:
  - <xref:<xref:"Placement">>
- description: 'Gets or sets a list of key value pairs that describe the resource.
    These tags can

    be used for viewing and grouping this resource (across resource groups). A maximum
    of 15 tags

    can be provided for a resource. Each tag must have a key with a length no greater
    than 128

    characters and a value with a length no greater than 256 characters.'
  name: tags
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: The identity of the resource.
  name: identity
  types:
  - <xref:<xref:"Identity">>
- description: The parameters used to create the storage account.
  name: properties
  types:
  - <xref:<xref:"StorageAccountPropertiesCreateParameters">>
