### YamlMime:PythonClass
uid: azure.mgmt.storage.types.StorageAccountMigrationProperties
name: StorageAccountMigrationProperties
fullName: azure.mgmt.storage.types.StorageAccountMigrationProperties
module: azure.mgmt.storage.types
summary: The properties of a storage account's ongoing or enqueued migration.
constructor:
  syntax: StorageAccountMigrationProperties()
variables:
- description: 'Target sku name for the account. Required. Known values are:

    "Standard_LRS", "Standard_GRS", "Standard_RAGRS", "Standard_ZRS", "Premium_LRS",
    "Premium_ZRS",

    "Standard_GZRS", "Standard_RAGZRS", "StandardV2_LRS", "StandardV2_GRS", "StandardV2_ZRS",

    "StandardV2_GZRS", "PremiumV2_LRS", and "PremiumV2_ZRS".'
  name: targetSkuName
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SkuName">]
- description: 'Current status of migration. Known values are: "Invalid",

    "SubmittedForConversion", "InProgress", "Complete", and "Failed".'
  name: migrationStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MigrationStatus">]
- description: Error code for migration failure.
  name: migrationFailedReason
  types:
  - <xref:str>
- description: Reason for migration failure.
  name: migrationFailedDetailedReason
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.storage.types.StorageAccountMigrationProperties.migrationFailedDetailedReason
  name: migrationFailedDetailedReason
  summary: Reason for migration failure.
  signature: 'migrationFailedDetailedReason: str'
- uid: azure.mgmt.storage.types.StorageAccountMigrationProperties.migrationFailedReason
  name: migrationFailedReason
  summary: Error code for migration failure.
  signature: 'migrationFailedReason: str'
- uid: azure.mgmt.storage.types.StorageAccountMigrationProperties.migrationStatus
  name: migrationStatus
  summary: '"Invalid", "SubmittedForConversion",

    "InProgress", "Complete", and "Failed".'
  signature: 'migrationStatus: str | MigrationStatus'
- uid: azure.mgmt.storage.types.StorageAccountMigrationProperties.targetSkuName
  name: targetSkuName
  summary: '"Standard_LRS",

    "Standard_GRS", "Standard_RAGRS", "Standard_ZRS", "Premium_LRS", "Premium_ZRS",

    "Standard_GZRS", "Standard_RAGZRS", "StandardV2_LRS", "StandardV2_GRS",

    "StandardV2_ZRS", "StandardV2_GZRS", "PremiumV2_LRS", and "PremiumV2_ZRS".'
  signature: 'targetSkuName: Required[str | SkuName]'
