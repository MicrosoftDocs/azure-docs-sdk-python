### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.RackDefinition
name: RackDefinition
fullName: azure.mgmt.networkcloud.types.RackDefinition
module: azure.mgmt.networkcloud.types
summary: RackDefinition represents details regarding the rack.
constructor:
  syntax: RackDefinition()
variables:
- description: 'The zone name used for this rack when created. Availability zones
    are

    used for workload placement.'
  name: availability_zone
  types:
  - <xref:str>
- description: 'The unordered list of bare metal machine

    configuration.'
  name: bare_metal_machine_configuration_data
  types:
  - <xref:list>[<xref:"BareMetalMachineConfigurationData">]
- description: 'The resource ID of the network rack that matches this rack definition.

    Required.'
  name: network_rack_id
  types:
  - <xref:str>
- description: The free-form description of the rack's location.
  name: rack_location
  types:
  - <xref:str>
- description: 'The unique identifier for the rack within Network Cloud cluster. An

    alternate unique alphanumeric value other than a serial number may be provided
    if desired.

    Required.'
  name: rack_serial_number
  types:
  - <xref:str>
- description: The resource ID of the sku for the rack being added. Required.
  name: rack_sku_id
  types:
  - <xref:str>
- description: 'The list of storage appliance configuration data

    for this rack.'
  name: storage_appliance_configuration_data
  types:
  - <xref:list>[<xref:"StorageApplianceConfigurationData">]
attributes:
- uid: azure.mgmt.networkcloud.types.RackDefinition.availabilityZone
  name: availabilityZone
  summary: 'The zone name used for this rack when created. Availability zones are
    used for workload

    placement.'
  signature: 'availabilityZone: str'
- uid: azure.mgmt.networkcloud.types.RackDefinition.bareMetalMachineConfigurationData
  name: bareMetalMachineConfigurationData
  summary: The unordered list of bare metal machine configuration.
  signature: 'bareMetalMachineConfigurationData: list[azure.mgmt.networkcloud.types.BareMetalMachineConfigurationData]'
- uid: azure.mgmt.networkcloud.types.RackDefinition.networkRackId
  name: networkRackId
  summary: The resource ID of the network rack that matches this rack definition.
    Required.
  signature: 'networkRackId: str'
- uid: azure.mgmt.networkcloud.types.RackDefinition.rackLocation
  name: rackLocation
  summary: The free-form description of the rack's location.
  signature: 'rackLocation: str'
- uid: azure.mgmt.networkcloud.types.RackDefinition.rackSerialNumber
  name: rackSerialNumber
  summary: 'The unique identifier for the rack within Network Cloud cluster. An alternate
    unique

    alphanumeric value other than a serial number may be provided if desired. Required.'
  signature: 'rackSerialNumber: str'
- uid: azure.mgmt.networkcloud.types.RackDefinition.rackSkuId
  name: rackSkuId
  summary: The resource ID of the sku for the rack being added. Required.
  signature: 'rackSkuId: str'
- uid: azure.mgmt.networkcloud.types.RackDefinition.storageApplianceConfigurationData
  name: storageApplianceConfigurationData
  summary: The list of storage appliance configuration data for this rack.
  signature: 'storageApplianceConfigurationData: list[azure.mgmt.networkcloud.types.StorageApplianceConfigurationData]'
