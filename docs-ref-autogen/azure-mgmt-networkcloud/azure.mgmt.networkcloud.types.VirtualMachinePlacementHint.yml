### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.VirtualMachinePlacementHint
name: VirtualMachinePlacementHint
fullName: azure.mgmt.networkcloud.types.VirtualMachinePlacementHint
module: azure.mgmt.networkcloud.types
summary: VirtualMachinePlacementHint represents a single scheduling hint of the virtual
  machine.
constructor:
  syntax: VirtualMachinePlacementHint()
variables:
- description: 'The specification of whether this hint supports affinity or anti-affinity
    with

    the referenced resources. Required. Known values are: "Affinity" and "AntiAffinity".'
  name: hint_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualMachinePlacementHintType">]
- description: 'The resource ID of the target object that the placement hints will
    be

    checked against, e.g., the bare metal node to host the virtual machine. Required.'
  name: resource_id
  types:
  - <xref:str>
- description: 'The indicator of whether the hint is a hard or soft requirement

    during scheduling. Required. Known values are: "Hard" and "Soft".'
  name: scheduling_execution
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualMachineSchedulingExecution">]
- description: 'The scope for the virtual machine affinity or anti-affinity placement
    hint. It

    should always be "Machine" in the case of node affinity. Required. Known values
    are: "Machine"

    and "Rack".'
  name: scope
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualMachinePlacementHintPodAffinityScope">]
attributes:
- uid: azure.mgmt.networkcloud.types.VirtualMachinePlacementHint.hintType
  name: hintType
  summary: 'The specification of whether this hint supports affinity or anti-affinity
    with the referenced

    resources. Required. Known values are: "Affinity" and "AntiAffinity".'
  signature: 'hintType: Required[str | VirtualMachinePlacementHintType]'
- uid: azure.mgmt.networkcloud.types.VirtualMachinePlacementHint.resourceId
  name: resourceId
  summary: 'The resource ID of the target object that the placement hints will be
    checked against, e.g.,

    the bare metal node to host the virtual machine. Required.'
  signature: 'resourceId: Required[str]'
- uid: azure.mgmt.networkcloud.types.VirtualMachinePlacementHint.schedulingExecution
  name: schedulingExecution
  summary: 'The indicator of whether the hint is a hard or soft requirement during
    scheduling. Required.

    Known values are: "Hard" and "Soft".'
  signature: 'schedulingExecution: Required[str | VirtualMachineSchedulingExecution]'
- uid: azure.mgmt.networkcloud.types.VirtualMachinePlacementHint.scope
  name: scope
  summary: 'The scope for the virtual machine affinity or anti-affinity placement
    hint. It should always be

    "Machine" in the case of node affinity. Required. Known values are: "Machine"
    and "Rack".'
  signature: 'scope: Required[str | VirtualMachinePlacementHintPodAffinityScope]'
