### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.RackProperties
name: RackProperties
fullName: azure.mgmt.networkcloud.types.RackProperties
module: azure.mgmt.networkcloud.types
summary: RackProperties represents the properties of the rack.
constructor:
  syntax: RackProperties()
variables:
- description: 'The value that will be used for machines in this rack to represent
    the

    availability zones that can be referenced by Hybrid AKS Clusters for node arrangement.

    Required.'
  name: availability_zone
  types:
  - <xref:str>
- description: 'The free-form description of the rack location. (e.g. "DTN Datacenter,

    Floor 3, Isle 9, Rack 2B"). Required.'
  name: rack_location
  types:
  - <xref:str>
- description: 'The unique identifier for the rack within Network Cloud cluster. An

    alternate unique alphanumeric value other than a serial number may be provided
    if desired.

    Required.'
  name: rack_serial_number
  types:
  - <xref:str>
- description: The SKU for the rack. Required.
  name: rack_sku_id
  types:
  - <xref:str>
- description: 'The resource ID of the cluster the rack is created for. This value
    is set

    when the rack is created by the cluster.'
  name: cluster_id
  types:
  - <xref:str>
- description: 'The more detailed status of the rack. Known values are: "Error",

    "Available", and "Provisioning".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RackDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: 'The provisioning state of the rack resource. Known values are:

    "Succeeded", "Failed", "Canceled", "Provisioning", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RackProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.RackProperties.availabilityZone
  name: availabilityZone
  summary: 'The value that will be used for machines in this rack to represent the
    availability zones that

    can be referenced by Hybrid AKS Clusters for node arrangement. Required.'
  signature: 'availabilityZone: Required[str]'
- uid: azure.mgmt.networkcloud.types.RackProperties.clusterId
  name: clusterId
  summary: 'The resource ID of the cluster the rack is created for. This value is
    set when the rack is

    created by the cluster.'
  signature: 'clusterId: str'
- uid: azure.mgmt.networkcloud.types.RackProperties.detailedStatus
  name: detailedStatus
  summary: '"Error", "Available", and

    "Provisioning".'
  signature: 'detailedStatus: str | RackDetailedStatus'
- uid: azure.mgmt.networkcloud.types.RackProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.RackProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Provisioning", and "Accepted".'
  signature: 'provisioningState: str | RackProvisioningState'
- uid: azure.mgmt.networkcloud.types.RackProperties.rackLocation
  name: rackLocation
  summary: 'The free-form description of the rack location. (e.g. "DTN Datacenter,
    Floor 3, Isle 9, Rack

    2B"). Required.'
  signature: 'rackLocation: Required[str]'
- uid: azure.mgmt.networkcloud.types.RackProperties.rackSerialNumber
  name: rackSerialNumber
  summary: 'The unique identifier for the rack within Network Cloud cluster. An alternate
    unique

    alphanumeric value other than a serial number may be provided if desired. Required.'
  signature: 'rackSerialNumber: Required[str]'
- uid: azure.mgmt.networkcloud.types.RackProperties.rackSkuId
  name: rackSkuId
  summary: The SKU for the rack. Required.
  signature: 'rackSkuId: Required[str]'
