### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.TrunkedNetworkProperties
name: TrunkedNetworkProperties
fullName: azure.mgmt.networkcloud.types.TrunkedNetworkProperties
module: azure.mgmt.networkcloud.types
summary: TrunkedNetworkProperties represents properties of the trunked network.
constructor:
  syntax: TrunkedNetworkProperties()
variables:
- description: 'Field Deprecated. The field was previously optional, now it will

    have no defined behavior and will be ignored. The network plugin type for Hybrid
    AKS. Known

    values are: "DPDK", "SRIOV", and "OSDevice".'
  name: hybrid_aks_plugin_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HybridAksPluginType">]
- description: 'The default interface name for this trunked network in the virtual

    machine. This name can be overridden by the name supplied in the network attachment

    configuration of that virtual machine.'
  name: interface_name
  types:
  - <xref:str>
- description: 'The list of resource IDs representing the Network Fabric isolation

    domains. It can be any combination of l2IsolationDomain and l3IsolationDomain
    resources.

    Required.'
  name: isolation_domain_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The list of vlans that are selected from the isolation domains for
    trunking.

    Required.'
  name: vlans
  types:
  - <xref:list>[<xref:int>]
- description: 'The list of resource IDs for the other Microsoft.NetworkCloud

    resources that have attached this network.'
  name: associated_resource_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The resource ID of the Network Cloud cluster this trunked network
    is

    associated with.'
  name: cluster_id
  types:
  - <xref:str>
- description: 'The more detailed status of the trunked network. Known values are:

    "Error", "Available", and "Provisioning".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TrunkedNetworkDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: 'Field Deprecated. These fields will be empty/omitted.

    The list of Hybrid AKS cluster resource IDs that are associated with this trunked
    network.'
  name: hybrid_aks_clusters_associated_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'Field Deprecated. These fields will be empty/omitted.

    The list of virtual machine resource IDs, excluding any Hybrid AKS virtual machines,
    that are

    currently using this trunked network.'
  name: virtual_machines_associated_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The provisioning state of the trunked network. Known values are:

    "Succeeded", "Failed", "Canceled", "Provisioning", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TrunkedNetworkProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkProperties.associatedResourceIds
  name: associatedResourceIds
  summary: 'The list of resource IDs for the other Microsoft.NetworkCloud resources
    that have attached this

    network.'
  signature: 'associatedResourceIds: list[str]'
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkProperties.clusterId
  name: clusterId
  summary: The resource ID of the Network Cloud cluster this trunked network is associated
    with.
  signature: 'clusterId: str'
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkProperties.detailedStatus
  name: detailedStatus
  summary: '"Error", "Available",

    and "Provisioning".'
  signature: 'detailedStatus: str | TrunkedNetworkDetailedStatus'
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkProperties.hybridAksClustersAssociatedIds
  name: hybridAksClustersAssociatedIds
  summary: 'Field Deprecated. These fields will be empty/omitted. The list of Hybrid
    AKS cluster resource

    IDs that are associated with this trunked network.'
  signature: 'hybridAksClustersAssociatedIds: list[str]'
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkProperties.hybridAksPluginType
  name: hybridAksPluginType
  summary: 'Field Deprecated. The field was previously optional, now it will have
    no defined behavior and

    will be ignored. The network plugin type for Hybrid AKS. Known values are: "DPDK",
    "SRIOV",

    and "OSDevice".'
  signature: 'hybridAksPluginType: str | HybridAksPluginType'
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkProperties.interfaceName
  name: interfaceName
  summary: 'The default interface name for this trunked network in the virtual machine.
    This name can be

    overridden by the name supplied in the network attachment configuration of that
    virtual

    machine.'
  signature: 'interfaceName: str'
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkProperties.isolationDomainIds
  name: isolationDomainIds
  summary: 'The list of resource IDs representing the Network Fabric isolation domains.
    It can be any

    combination of l2IsolationDomain and l3IsolationDomain resources. Required.'
  signature: 'isolationDomainIds: Required[list[str]]'
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Provisioning", and "Accepted".'
  signature: 'provisioningState: str | TrunkedNetworkProvisioningState'
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkProperties.virtualMachinesAssociatedIds
  name: virtualMachinesAssociatedIds
  summary: 'Field Deprecated. These fields will be empty/omitted. The list of virtual
    machine resource IDs,

    excluding any Hybrid AKS virtual machines, that are currently using this trunked
    network.'
  signature: 'virtualMachinesAssociatedIds: list[str]'
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkProperties.vlans
  name: vlans
  summary: The list of vlans that are selected from the isolation domains for trunking.
    Required.
  signature: 'vlans: Required[list[int]]'
