### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.OsDisk
name: OsDisk
fullName: azure.mgmt.networkcloud.types.OsDisk
module: azure.mgmt.networkcloud.types
summary: OsDisk represents configuration of the boot disk.
constructor:
  syntax: OsDisk()
variables:
- description: 'The strategy for creating the OS disk. Known values are: "Ephemeral"
    and

    "Persistent".'
  name: create_option
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OsDiskCreateOption">]
- description: The strategy for deleting the OS disk. "Delete"
  name: delete_option
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OsDiskDeleteOption">]
- description: 'The size of the disk. Required if the createOption is Ephemeral.

    Allocations are measured in gibibytes. Required.'
  name: disk_size_gb
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.networkcloud.types.OsDisk.createOption
  name: createOption
  summary: '"Ephemeral" and "Persistent".'
  signature: 'createOption: str | OsDiskCreateOption'
- uid: azure.mgmt.networkcloud.types.OsDisk.deleteOption
  name: deleteOption
  summary: The strategy for deleting the OS disk. "Delete"
  signature: 'deleteOption: str | OsDiskDeleteOption'
- uid: azure.mgmt.networkcloud.types.OsDisk.diskSizeGB
  name: diskSizeGB
  summary: 'The size of the disk. Required if the createOption is Ephemeral. Allocations
    are measured in

    gibibytes. Required.'
  signature: 'diskSizeGB: Required[int]'
