### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.BareMetalMachineConfigurationDataPatch
name: BareMetalMachineConfigurationDataPatch
fullName: azure.mgmt.networkcloud.types.BareMetalMachineConfigurationDataPatch
module: azure.mgmt.networkcloud.types
summary: 'BareMetalMachineConfigurationDataPatch represents configuration for the
  bare metal machine for

  patch operations.'
constructor:
  syntax: BareMetalMachineConfigurationDataPatch()
variables:
- description: 'The connection string for the baseboard management controller

    including IP address and protocol.'
  name: bmc_connection_string
  types:
  - <xref:str>
- description: 'The credentials of the baseboard management controller on this bare

    metal machine. The password field is expected to be an Azure Key Vault key URL.
    Until the

    cluster is converted to utilize managed identity by setting the secret archive
    settings, the

    actual password value should be provided instead.'
  name: bmc_credentials
  types:
  - <xref:<xref:"AdministrativeCredentialsPatch">>
- description: The MAC address of the BMC for this machine.
  name: bmc_mac_address
  types:
  - <xref:str>
- description: The MAC address associated with the PXE NIC card.
  name: boot_mac_address
  types:
  - <xref:str>
- description: 'The free-form additional information about the machine, e.g. an asset

    tag.'
  name: machine_details
  types:
  - <xref:str>
- description: 'The user-provided name for the bare metal machine created from this

    specification. If not provided, the machine name will be generated programmatically.'
  name: machine_name
  types:
  - <xref:str>
- description: The slot the physical machine is in the rack based on the BOM configuration.
  name: rack_slot
  types:
  - <xref:int>
- description: 'The serial number of the machine. Hardware suppliers may use an alternate

    value. For example, service tag.'
  name: serial_number
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.types.BareMetalMachineConfigurationDataPatch.bmcConnectionString
  name: bmcConnectionString
  summary: 'The connection string for the baseboard management controller including
    IP address and

    protocol.'
  signature: 'bmcConnectionString: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineConfigurationDataPatch.bmcCredentials
  name: bmcCredentials
  summary: 'The credentials of the baseboard management controller on this bare metal
    machine. The password

    field is expected to be an Azure Key Vault key URL. Until the cluster is converted
    to utilize

    managed identity by setting the secret archive settings, the actual password value
    should be

    provided instead.'
  signature: 'bmcCredentials: AdministrativeCredentialsPatch'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineConfigurationDataPatch.bmcMacAddress
  name: bmcMacAddress
  summary: The MAC address of the BMC for this machine.
  signature: 'bmcMacAddress: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineConfigurationDataPatch.bootMacAddress
  name: bootMacAddress
  summary: The MAC address associated with the PXE NIC card.
  signature: 'bootMacAddress: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineConfigurationDataPatch.machineDetails
  name: machineDetails
  summary: The free-form additional information about the machine, e.g. an asset tag.
  signature: 'machineDetails: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineConfigurationDataPatch.machineName
  name: machineName
  summary: 'The user-provided name for the bare metal machine created from this specification.
    If not

    provided, the machine name will be generated programmatically.'
  signature: 'machineName: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineConfigurationDataPatch.rackSlot
  name: rackSlot
  summary: The slot the physical machine is in the rack based on the BOM configuration.
  signature: 'rackSlot: int'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineConfigurationDataPatch.serialNumber
  name: serialNumber
  summary: 'The serial number of the machine. Hardware suppliers may use an alternate
    value. For example,

    service tag.'
  signature: 'serialNumber: str'
