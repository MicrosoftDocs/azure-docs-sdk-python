  signature: 'peerAsn: Required[int]'
- uid: azure.mgmt.networkcloud.types.ServiceLoadBalancerBgpPeer.peerPort
  name: peerPort
  summary: The port used to connect this BGP session.
  signature: 'peerPort: int'
