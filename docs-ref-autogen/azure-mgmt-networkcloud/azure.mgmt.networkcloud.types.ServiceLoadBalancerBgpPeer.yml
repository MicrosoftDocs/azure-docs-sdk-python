### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ServiceLoadBalancerBgpPeer
name: ServiceLoadBalancerBgpPeer
fullName: azure.mgmt.networkcloud.types.ServiceLoadBalancerBgpPeer
module: azure.mgmt.networkcloud.types
summary: 'ServiceLoadBalancerBgpPeer represents the configuration of the BGP service
  load balancer for

  the Kubernetes cluster.'
constructor:
  syntax: ServiceLoadBalancerBgpPeer()
variables:
- description: 'The indicator of BFD enablement for this BgpPeer. Known values are:
    "True"

    and "False".'
  name: bfd_enabled
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BfdEnabled">]
- description: 'The indicator to enable multi-hop peering support. Known values are:

    "True" and "False".'
  name: bgp_multi_hop
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BgpMultiHop">]
- description: 'Field Deprecated. The field was previously optional, now it will have
    no

    defined behavior and will be ignored. The requested BGP hold time value. This
    field uses ISO

    8601 duration format, for example P1H.'
  name: hold_time
  types:
  - <xref:str>
- description: 'Field Deprecated. The field was previously optional, now it will have
    no

    defined behavior and will be ignored. The requested BGP keepalive time value.
    This field uses

    ISO 8601 duration format, for example P1H.'
  name: keep_alive_time
  types:
  - <xref:str>
- description: The autonomous system number used for the local end of the BGP session.
  name: my_asn
  types:
  - <xref:int>
- description: 'The name used to identify this BGP peer for association with a BGP
    advertisement.

    Required.'
  name: name
  types:
  - <xref:str>
- description: 'The authentication password for routers enforcing TCP MD5 authenticated

    sessions.'
  name: password
  types:
  - <xref:str>
- description: The IPv4 or IPv6 address used to connect this BGP session. Required.
  name: peer_address
  types:
  - <xref:str>
- description: 'The autonomous system number expected from the remote end of the BGP
    session.

    Required.'
  name: peer_asn
  types:
  - <xref:int>
- description: The port used to connect this BGP session.
  name: peer_port
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.networkcloud.types.ServiceLoadBalancerBgpPeer.bfdEnabled
  name: bfdEnabled
  summary: '"True" and "False".'
  signature: 'bfdEnabled: str | BfdEnabled'
- uid: azure.mgmt.networkcloud.types.ServiceLoadBalancerBgpPeer.bgpMultiHop
  name: bgpMultiHop
  summary: '"True" and "False".'
  signature: 'bgpMultiHop: str | BgpMultiHop'
- uid: azure.mgmt.networkcloud.types.ServiceLoadBalancerBgpPeer.holdTime
  name: holdTime
  summary: 'Field Deprecated. The field was previously optional, now it will have
    no defined behavior and

    will be ignored. The requested BGP hold time value. This field uses ISO 8601 duration
    format,

    for example P1H.'
  signature: 'holdTime: str'
- uid: azure.mgmt.networkcloud.types.ServiceLoadBalancerBgpPeer.keepAliveTime
  name: keepAliveTime
  summary: 'Field Deprecated. The field was previously optional, now it will have
    no defined behavior and

    will be ignored. The requested BGP keepalive time value. This field uses ISO 8601
    duration

    format, for example P1H.'
  signature: 'keepAliveTime: str'
- uid: azure.mgmt.networkcloud.types.ServiceLoadBalancerBgpPeer.myAsn
  name: myAsn
  summary: The autonomous system number used for the local end of the BGP session.
  signature: 'myAsn: int'
- uid: azure.mgmt.networkcloud.types.ServiceLoadBalancerBgpPeer.name
  name: name
  summary: The name used to identify this BGP peer for association with a BGP advertisement.
    Required.
  signature: 'name: Required[str]'
- uid: azure.mgmt.networkcloud.types.ServiceLoadBalancerBgpPeer.password
  name: password
  summary: The authentication password for routers enforcing TCP MD5 authenticated
    sessions.
  signature: 'password: str'
