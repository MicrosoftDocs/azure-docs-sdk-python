### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ClusterUpdateStrategyPatch
name: ClusterUpdateStrategyPatch
fullName: azure.mgmt.networkcloud.types.ClusterUpdateStrategyPatch
module: azure.mgmt.networkcloud.types
summary: 'ClusterUpdateStrategyPatch represents the strategy for updating the cluster
  for patch

  operations.'
constructor:
  syntax: ClusterUpdateStrategyPatch()
variables:
- description: 'The maximum number of worker nodes that can be offline within the

    increment of update, e.g., rack-by-rack. Limited by the maximum number of machines
    in the

    increment. Defaults to the whole increment size.'
  name: max_unavailable
  types:
  - <xref:int>
- description: 'The mode of operation for runtime protection. Known values are: "Rack"
    and

    "PauseAfterRack".'
  name: strategy_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterUpdateStrategyType">]
- description: 'Selection of how the threshold should be evaluated. Known values are:

    "CountSuccess" and "PercentSuccess".'
  name: threshold_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ValidationThresholdType">]
- description: The numeric threshold value.
  name: threshold_value
  types:
  - <xref:int>
- description: 'The time to wait between the increments of update defined by the

    strategy.'
  name: wait_time_minutes
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.networkcloud.types.ClusterUpdateStrategyPatch.maxUnavailable
  name: maxUnavailable
  summary: 'The maximum number of worker nodes that can be offline within the increment
    of update, e.g.,

    rack-by-rack. Limited by the maximum number of machines in the increment. Defaults
    to the whole

    increment size.'
  signature: 'maxUnavailable: int'
- uid: azure.mgmt.networkcloud.types.ClusterUpdateStrategyPatch.strategyType
  name: strategyType
  summary: '"Rack" and

    "PauseAfterRack".'
  signature: 'strategyType: str | ClusterUpdateStrategyType'
- uid: azure.mgmt.networkcloud.types.ClusterUpdateStrategyPatch.thresholdType
  name: thresholdType
  summary: '"CountSuccess" and

    "PercentSuccess".'
  signature: 'thresholdType: str | ValidationThresholdType'
- uid: azure.mgmt.networkcloud.types.ClusterUpdateStrategyPatch.thresholdValue
  name: thresholdValue
  summary: The numeric threshold value.
  signature: 'thresholdValue: int'
- uid: azure.mgmt.networkcloud.types.ClusterUpdateStrategyPatch.waitTimeMinutes
  name: waitTimeMinutes
  summary: The time to wait between the increments of update defined by the strategy.
  signature: 'waitTimeMinutes: int'
