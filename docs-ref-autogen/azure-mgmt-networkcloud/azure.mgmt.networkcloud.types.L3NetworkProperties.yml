### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.L3NetworkProperties
name: L3NetworkProperties
fullName: azure.mgmt.networkcloud.types.L3NetworkProperties
module: azure.mgmt.networkcloud.types
summary: L3NetworkProperties represents properties of the L3 network.
constructor:
  syntax: L3NetworkProperties()
variables:
- description: 'Field Deprecated. The field was previously optional, now it will

    have no defined behavior and will be ignored. The indicator of whether or not
    to disable IPAM

    allocation on the network attachment definition injected into the Hybrid AKS Cluster.
    Known

    values are: "True" and "False".'
  name: hybrid_aks_ipam_enabled
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HybridAksIpamEnabled">]
- description: 'Field Deprecated. The field was previously optional, now it will

    have no defined behavior and will be ignored. The network plugin type for Hybrid
    AKS. Known

    values are: "DPDK", "SRIOV", and "OSDevice".'
  name: hybrid_aks_plugin_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HybridAksPluginType">]
- description: 'The default interface name for this L3 network in the virtual machine.

    This name can be overridden by the name supplied in the network attachment configuration
    of

    that virtual machine.'
  name: interface_name
  types:
  - <xref:str>
- description: 'The type of the IP address allocation, defaulted to "DualStack".

    Known values are: "IPV4", "IPV6", and "DualStack".'
  name: ip_allocation_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IpAllocationType">]
- description: 'The IPV4 prefix (CIDR) assigned to this L3 network. Required when

    the IP allocation type is IPV4 or DualStack.'
  name: ipv4_connected_prefix
  types:
  - <xref:str>
- description: 'The IPV6 prefix (CIDR) assigned to this L3 network. Required when

    the IP allocation type is IPV6 or DualStack.'
  name: ipv6_connected_prefix
  types:
  - <xref:str>
- description: 'The resource ID of the Network Fabric l3IsolationDomain.

    Required.'
  name: l3_isolation_domain_id
  types:
  - <xref:str>
- description: The VLAN from the l3IsolationDomain that is used for this network.
    Required.
  name: vlan
  types:
  - <xref:int>
- description: 'The list of resource IDs for the other Microsoft.NetworkCloud

    resources that have attached this network.'
  name: associated_resource_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The resource ID of the Network Cloud cluster this L3 network is associated

    with.'
  name: cluster_id
  types:
  - <xref:str>
- description: 'The more detailed status of the L3 network. Known values are: "Error",

    "Available", and "Provisioning".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"L3NetworkDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: 'Field Deprecated. These fields will be empty/omitted.

    The list of Hybrid AKS cluster resource IDs that are associated with this L3 network.'
  name: hybrid_aks_clusters_associated_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'Field Deprecated. These fields will be empty/omitted.

    The list of virtual machine resource IDs, excluding any Hybrid AKS virtual machines,
    that are

    currently using this L3 network.'
  name: virtual_machines_associated_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The provisioning state of the L3 network. Known values are:

    "Succeeded", "Failed", "Canceled", "Provisioning", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"L3NetworkProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.associatedResourceIds
  name: associatedResourceIds
  summary: 'The list of resource IDs for the other Microsoft.NetworkCloud resources
    that have attached this

    network.'
  signature: 'associatedResourceIds: list[str]'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.clusterId
  name: clusterId
  summary: The resource ID of the Network Cloud cluster this L3 network is associated
    with.
  signature: 'clusterId: str'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.detailedStatus
  name: detailedStatus
  summary: '"Error", "Available", and

    "Provisioning".'
  signature: 'detailedStatus: str | L3NetworkDetailedStatus'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.hybridAksClustersAssociatedIds
  name: hybridAksClustersAssociatedIds
  summary: 'Field Deprecated. These fields will be empty/omitted. The list of Hybrid
    AKS cluster resource

    IDs that are associated with this L3 network.'
  signature: 'hybridAksClustersAssociatedIds: list[str]'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.hybridAksIpamEnabled
  name: hybridAksIpamEnabled
  summary: 'Field Deprecated. The field was previously optional, now it will have
    no defined behavior and

    will be ignored. The indicator of whether or not to disable IPAM allocation on
    the network

    attachment definition injected into the Hybrid AKS Cluster. Known values are:
    "True" and

    "False".'
  signature: 'hybridAksIpamEnabled: str | HybridAksIpamEnabled'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.hybridAksPluginType
  name: hybridAksPluginType
  summary: 'Field Deprecated. The field was previously optional, now it will have
    no defined behavior and

    will be ignored. The network plugin type for Hybrid AKS. Known values are: "DPDK",
    "SRIOV",

    and "OSDevice".'
  signature: 'hybridAksPluginType: str | HybridAksPluginType'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.interfaceName
  name: interfaceName
  summary: 'The default interface name for this L3 network in the virtual machine.
    This name can be

    overridden by the name supplied in the network attachment configuration of that
    virtual

    machine.'
  signature: 'interfaceName: str'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.ipAllocationType
  name: ipAllocationType
  summary: '"IPV4",

    "IPV6", and "DualStack".'
  signature: 'ipAllocationType: str | IpAllocationType'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.ipv4ConnectedPrefix
  name: ipv4ConnectedPrefix
  summary: 'The IPV4 prefix (CIDR) assigned to this L3 network. Required when the
    IP allocation type is

    IPV4 or DualStack.'
  signature: 'ipv4ConnectedPrefix: str'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.ipv6ConnectedPrefix
  name: ipv6ConnectedPrefix
  summary: 'The IPV6 prefix (CIDR) assigned to this L3 network. Required when the
    IP allocation type is

    IPV6 or DualStack.'
  signature: 'ipv6ConnectedPrefix: str'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.l3IsolationDomainId
  name: l3IsolationDomainId
  summary: The resource ID of the Network Fabric l3IsolationDomain. Required.
  signature: 'l3IsolationDomainId: Required[str]'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Provisioning", and "Accepted".'
  signature: 'provisioningState: str | L3NetworkProvisioningState'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.virtualMachinesAssociatedIds
  name: virtualMachinesAssociatedIds
  summary: 'Field Deprecated. These fields will be empty/omitted. The list of virtual
    machine resource IDs,

    excluding any Hybrid AKS virtual machines, that are currently using this L3 network.'
  signature: 'virtualMachinesAssociatedIds: list[str]'
- uid: azure.mgmt.networkcloud.types.L3NetworkProperties.vlan
  name: vlan
  summary: The VLAN from the l3IsolationDomain that is used for this network. Required.
  signature: 'vlan: Required[int]'
