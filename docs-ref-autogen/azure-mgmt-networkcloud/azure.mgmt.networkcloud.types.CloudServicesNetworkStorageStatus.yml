### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.CloudServicesNetworkStorageStatus
name: CloudServicesNetworkStorageStatus
fullName: azure.mgmt.networkcloud.types.CloudServicesNetworkStorageStatus
module: azure.mgmt.networkcloud.types
summary: CloudServicesNetworkStorageStatus represents the storage status of the cloud
  services network.
constructor:
  syntax: CloudServicesNetworkStorageStatus()
variables:
- description: 'The indicator of if shared storage is enabled on the cloud services
    network. Known

    values are: "None" and "Standard".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CloudServicesNetworkStorageMode">]
- description: The size in Mebibytes of the storage allocation.
  name: size_mi_b
  types:
  - <xref:int>
- description: 'The status of the storage allocation for the cloud services network.
    Known values

    are: "Available", "ExpandingVolume", "ExpansionFailed", "Initializing", "None",
    and

    "Repairing".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CloudServicesNetworkStorageStatusStatus">]
- description: The description for the status of the shared storage.
  name: status_message
  types:
  - <xref:str>
- description: The resource ID of the volume created to host the shared storage.
  name: volume_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkStorageStatus.mode
  name: mode
  summary: 'The indicator of if shared storage is enabled on the cloud services network.
    Known values are:

    "None" and "Standard".'
  signature: 'mode: str | CloudServicesNetworkStorageMode'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkStorageStatus.sizeMiB
  name: sizeMiB
  summary: The size in Mebibytes of the storage allocation.
  signature: 'sizeMiB: int'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkStorageStatus.status
  name: status
  summary: 'The status of the storage allocation for the cloud services network. Known
    values are:

    "Available", "ExpandingVolume", "ExpansionFailed", "Initializing", "None", and

    "Repairing".'
  signature: 'status: str | CloudServicesNetworkStorageStatusStatus'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkStorageStatus.statusMessage
  name: statusMessage
  summary: The description for the status of the shared storage.
  signature: 'statusMessage: str'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkStorageStatus.volumeId
  name: volumeId
  summary: The resource ID of the volume created to host the shared storage.
  signature: 'volumeId: str'
