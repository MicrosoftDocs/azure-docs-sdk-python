### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.VolumeProperties
name: VolumeProperties
fullName: azure.mgmt.networkcloud.types.VolumeProperties
module: azure.mgmt.networkcloud.types
summary: VolumeProperties represents properties of the volume resource.
constructor:
  syntax: VolumeProperties()
variables:
- description: The requested storage allocation for the volume in Mebibytes. Required.
  name: size_mi_b
  types:
  - <xref:int>
- description: The resource ID of the storage appliance that hosts the volume.
  name: storage_appliance_id
  types:
  - <xref:str>
- description: The allocated size of the volume in Mebibytes.
  name: allocated_size_mi_b
  types:
  - <xref:int>
- description: 'The assigned resource ID of the storage appliance that

    hosts the volume.'
  name: assigned_storage_appliance_id
  types:
  - <xref:str>
- description: 'The list of resource IDs that attach the volume. It may include virtual

    machines and Hybrid AKS clusters.'
  name: attached_to
  types:
  - <xref:list>[<xref:str>]
- description: 'The more detailed status of the volume. Known values are: "Active",

    "Error", and "Provisioning".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VolumeDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: The unique identifier of the volume.
  name: serial_number
  types:
  - <xref:str>
- description: 'The provisioning state of the volume. Known values are: "Accepted",

    "Canceled", "Failed", "Provisioning", and "Succeeded".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VolumeProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.VolumeProperties.allocatedSizeMiB
  name: allocatedSizeMiB
  summary: The allocated size of the volume in Mebibytes.
  signature: 'allocatedSizeMiB: int'
- uid: azure.mgmt.networkcloud.types.VolumeProperties.assignedStorageApplianceId
  name: assignedStorageApplianceId
  summary: The assigned resource ID of the storage appliance that hosts the volume.
  signature: 'assignedStorageApplianceId: str'
- uid: azure.mgmt.networkcloud.types.VolumeProperties.attachedTo
  name: attachedTo
  summary: 'The list of resource IDs that attach the volume. It may include virtual
    machines and Hybrid AKS

    clusters.'
  signature: 'attachedTo: list[str]'
- uid: azure.mgmt.networkcloud.types.VolumeProperties.detailedStatus
  name: detailedStatus
  summary: '"Active", "Error", and

    "Provisioning".'
  signature: 'detailedStatus: str | VolumeDetailedStatus'
- uid: azure.mgmt.networkcloud.types.VolumeProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.VolumeProperties.provisioningState
  name: provisioningState
  summary: '"Accepted", "Canceled", "Failed",

    "Provisioning", and "Succeeded".'
  signature: 'provisioningState: str | VolumeProvisioningState'
- uid: azure.mgmt.networkcloud.types.VolumeProperties.serialNumber
  name: serialNumber
  summary: The unique identifier of the volume.
  signature: 'serialNumber: str'
- uid: azure.mgmt.networkcloud.types.VolumeProperties.sizeMiB
  name: sizeMiB
  summary: The requested storage allocation for the volume in Mebibytes. Required.
  signature: 'sizeMiB: Required[int]'
- uid: azure.mgmt.networkcloud.types.VolumeProperties.storageApplianceId
  name: storageApplianceId
  summary: The resource ID of the storage appliance that hosts the volume.
  signature: 'storageApplianceId: str'
