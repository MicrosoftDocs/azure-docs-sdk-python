### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ConsolePatchProperties
name: ConsolePatchProperties
fullName: azure.mgmt.networkcloud.types.ConsolePatchProperties
module: azure.mgmt.networkcloud.types
summary: 'ConsolePatchProperties represents the properties of the virtual machine
  console that can be

  patched.'
constructor:
  syntax: ConsolePatchProperties()
variables:
- description: 'The indicator of whether the console access is enabled. Known values
    are: "True"

    and "False".'
  name: enabled
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConsoleEnabled">]
- description: The date and time after which the key will be disallowed access.
  name: expiration
  types:
  - <xref:str>
- description: 'The SSH public key that will be provisioned for user access. The user
    is

    expected to have the corresponding SSH private key for logging in.'
  name: ssh_public_key
  types:
  - <xref:<xref:"SshPublicKeyPatch">>
attributes:
- uid: azure.mgmt.networkcloud.types.ConsolePatchProperties.enabled
  name: enabled
  summary: '"True" and

    "False".'
  signature: 'enabled: str | ConsoleEnabled'
- uid: azure.mgmt.networkcloud.types.ConsolePatchProperties.expiration
  name: expiration
  summary: The date and time after which the key will be disallowed access.
  signature: 'expiration: str'
- uid: azure.mgmt.networkcloud.types.ConsolePatchProperties.sshPublicKey
  name: sshPublicKey
  summary: 'The SSH public key that will be provisioned for user access. The user
    is expected to have the

    corresponding SSH private key for logging in.'
  signature: 'sshPublicKey: SshPublicKeyPatch'
