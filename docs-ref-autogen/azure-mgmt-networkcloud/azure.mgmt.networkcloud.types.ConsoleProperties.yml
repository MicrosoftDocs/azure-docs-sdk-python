### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ConsoleProperties
name: ConsoleProperties
fullName: azure.mgmt.networkcloud.types.ConsoleProperties
module: azure.mgmt.networkcloud.types
summary: ConsoleProperties represents the properties of the virtual machine console.
constructor:
  syntax: ConsoleProperties()
variables:
- description: 'The indicator of whether the console access is enabled. Required.
    Known values

    are: "True" and "False".'
  name: enabled
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConsoleEnabled">]
- description: The date and time after which the key will be disallowed access.
  name: expiration
  types:
  - <xref:str>
- description: 'The SSH public key that will be provisioned for user access. The user
    is

    expected to have the corresponding SSH private key for logging in. Required.'
  name: ssh_public_key
  types:
  - <xref:<xref:"SshPublicKey">>
- description: 'The more detailed status of the console. Known values are: "Ready"
    and

    "Error".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConsoleDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: 'The resource ID of the private link service that is used to

    provide virtual machine console access.'
  name: private_link_service_id
  types:
  - <xref:str>
- description: 'The unique identifier for the virtual machine that is used to

    access the console.'
  name: virtual_machine_access_id
  types:
  - <xref:str>
- description: 'The provisioning state of the virtual machine console. Known values

    are: "Succeeded", "Failed", "Canceled", "Accepted", and "Provisioning".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConsoleProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.ConsoleProperties.detailedStatus
  name: detailedStatus
  summary: '"Ready" and "Error".'
  signature: 'detailedStatus: str | ConsoleDetailedStatus'
- uid: azure.mgmt.networkcloud.types.ConsoleProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.ConsoleProperties.enabled
  name: enabled
  summary: '"True"

    and "False".'
  signature: 'enabled: Required[str | ConsoleEnabled]'
- uid: azure.mgmt.networkcloud.types.ConsoleProperties.expiration
  name: expiration
  summary: The date and time after which the key will be disallowed access.
  signature: 'expiration: str'
- uid: azure.mgmt.networkcloud.types.ConsoleProperties.privateLinkServiceId
  name: privateLinkServiceId
  summary: 'The resource ID of the private link service that is used to provide virtual
    machine console

    access.'
  signature: 'privateLinkServiceId: str'
- uid: azure.mgmt.networkcloud.types.ConsoleProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Accepted", and "Provisioning".'
  signature: 'provisioningState: str | ConsoleProvisioningState'
- uid: azure.mgmt.networkcloud.types.ConsoleProperties.sshPublicKey
  name: sshPublicKey
  summary: 'The SSH public key that will be provisioned for user access. The user
    is expected to have the

    corresponding SSH private key for logging in. Required.'
  signature: 'sshPublicKey: Required[SshPublicKey]'
- uid: azure.mgmt.networkcloud.types.ConsoleProperties.virtualMachineAccessId
  name: virtualMachineAccessId
  summary: The unique identifier for the virtual machine that is used to access the
    console.
  signature: 'virtualMachineAccessId: str'
