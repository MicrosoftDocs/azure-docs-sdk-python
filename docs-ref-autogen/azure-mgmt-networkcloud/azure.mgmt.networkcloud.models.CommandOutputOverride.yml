uid: azure.mgmt.networkcloud.models.CommandOutputOverride
name: CommandOutputOverride
fullName: azure.mgmt.networkcloud.models.CommandOutputOverride
module: azure.mgmt.networkcloud.models
summary: CommandOutputOverride represents an overridden value for the command output
  settings.
constructor:
  syntax: 'CommandOutputOverride(*args: Any, **kwargs: Any)'
variables:
- description: 'The selection of the managed identity to use with this storage

    account container. The identity type must be either system assigned or user assigned.'
  name: associated_identity
  types:
  - <xref:azure.mgmt.networkcloud.models.IdentitySelector>
- description: 'The type of command output for the override. Known values are:

    "BareMetalMachineRunCommand", "BareMetalMachineRunDataExtracts",

    "BareMetalMachineRunReadCommands", "ClusterSupportAdministrativeActions",

    "StorageRunReadCommands", and "BareMetalMachineRunDataExtractsRestricted".'
  name: command_output_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.networkcloud.models.CommandOutputType>
- description: 'The URL of the storage account container that is to be used by the

    specified identities.'
  name: container_url
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.models.CommandOutputOverride.associated_identity
  name: associated_identity
  summary: 'The selection of the managed identity to use with this storage account
    container. The identity

    type must be either system assigned or user assigned.'
  signature: 'associated_identity: _models.IdentitySelector | None'
- uid: azure.mgmt.networkcloud.models.CommandOutputOverride.command_output_type
  name: command_output_type
  summary: '"BareMetalMachineRunCommand",

    "BareMetalMachineRunDataExtracts", "BareMetalMachineRunReadCommands",

    "ClusterSupportAdministrativeActions", "StorageRunReadCommands", and

    "BareMetalMachineRunDataExtractsRestricted".'
  signature: 'command_output_type: str | _models.CommandOutputType | None'
- uid: azure.mgmt.networkcloud.models.CommandOutputOverride.container_url
