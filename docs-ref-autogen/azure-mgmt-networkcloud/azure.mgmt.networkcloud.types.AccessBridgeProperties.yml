### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.AccessBridgeProperties
name: AccessBridgeProperties
fullName: azure.mgmt.networkcloud.types.AccessBridgeProperties
module: azure.mgmt.networkcloud.types
summary: AccessBridgeProperties captures the input and status for an access bridge.
constructor:
  syntax: AccessBridgeProperties()
variables:
- description: 'The IPv4 subnet from which the access bridge allocates an address.

    This subnet must be part of the internal network specified by networkId.'
  name: ipv4_connected_prefix
  types:
  - <xref:str>
- description: 'The IPv6 subnet from which the access bridge allocates an address.

    This subnet must be part of the internal network specified by networkId.'
  name: ipv6_connected_prefix
  types:
  - <xref:str>
- description: 'The resource ID of the internal network in a layer 3 isolation domain

    containing the IP subnets to use. Required.'
  name: network_id
  types:
  - <xref:str>
- description: The list of security rules enforced by the access bridge.
  name: security_rules
  types:
  - <xref:list>[<xref:"AccessBridgeSecurityRule">]
- description: 'The detailed status reported by the access bridge. Known values are:

    "Running", "Degraded", and "Failed".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AccessBridgeDetailedStatus">]
- description: The descriptive message that accompanies the detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: The observed endpoints that clients should use to reach the access
    bridge.
  name: endpoints
  types:
  - <xref:list>[<xref:"AccessBridgeEndpoint">]
- description: 'The protocol advertised by the access bridge endpoints. Known values
    are: "TCP"

    and "UDP".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TransportProtocol">]
- description: 'The provisioning state of the access bridge. Known values are:

    "Accepted", "Canceled", "Failed", "Provisioning", and "Succeeded".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AccessBridgeProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.AccessBridgeProperties.detailedStatus
  name: detailedStatus
  summary: '"Running", "Degraded",

    and "Failed".'
  signature: 'detailedStatus: str | AccessBridgeDetailedStatus'
- uid: azure.mgmt.networkcloud.types.AccessBridgeProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message that accompanies the detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.AccessBridgeProperties.endpoints
  name: endpoints
  summary: The observed endpoints that clients should use to reach the access bridge.
  signature: 'endpoints: list[''AccessBridgeEndpoint'']'
- uid: azure.mgmt.networkcloud.types.AccessBridgeProperties.ipv4ConnectedPrefix
  name: ipv4ConnectedPrefix
  summary: 'The IPv4 subnet from which the access bridge allocates an address. This
    subnet must be part of

    the internal network specified by networkId.'
  signature: 'ipv4ConnectedPrefix: str'
- uid: azure.mgmt.networkcloud.types.AccessBridgeProperties.ipv6ConnectedPrefix
  name: ipv6ConnectedPrefix
  summary: 'The IPv6 subnet from which the access bridge allocates an address. This
    subnet must be part of

    the internal network specified by networkId.'
  signature: 'ipv6ConnectedPrefix: str'
- uid: azure.mgmt.networkcloud.types.AccessBridgeProperties.networkId
  name: networkId
  summary: 'The resource ID of the internal network in a layer 3 isolation domain
    containing the IP subnets

    to use. Required.'
  signature: 'networkId: Required[str]'
- uid: azure.mgmt.networkcloud.types.AccessBridgeProperties.protocol
  name: protocol
  summary: '"TCP" and "UDP".'
  signature: 'protocol: str | TransportProtocol'
- uid: azure.mgmt.networkcloud.types.AccessBridgeProperties.provisioningState
  name: provisioningState
  summary: '"Accepted", "Canceled",

    "Failed", "Provisioning", and "Succeeded".'
  signature: 'provisioningState: str | AccessBridgeProvisioningState'
- uid: azure.mgmt.networkcloud.types.AccessBridgeProperties.securityRules
  name: securityRules
  summary: The list of security rules enforced by the access bridge.
  signature: 'securityRules: list[''AccessBridgeSecurityRule'']'
