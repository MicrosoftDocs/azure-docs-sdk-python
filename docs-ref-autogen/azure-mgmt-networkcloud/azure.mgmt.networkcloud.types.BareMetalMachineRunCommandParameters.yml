### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.BareMetalMachineRunCommandParameters
name: BareMetalMachineRunCommandParameters
fullName: azure.mgmt.networkcloud.types.BareMetalMachineRunCommandParameters
module: azure.mgmt.networkcloud.types
summary: 'BareMetalMachineRunCommandParameters represents the body of the request
  to execute a script on

  the bare metal machine.'
constructor:
  syntax: BareMetalMachineRunCommandParameters()
variables:
- description: 'The list of string arguments that will be passed to the script in
    order as

    separate arguments.'
  name: arguments
  types:
  - <xref:list>[<xref:str>]
- description: 'The maximum time the script is allowed to run. If the execution time

    exceeds the maximum, the script will be stopped, any output produced until then
    will be

    captured, and the exit code matching a timeout will be returned (252). Required.'
  name: limit_time_seconds
  types:
  - <xref:int>
- description: The base64 encoded script to execute on the bare metal machine. Required.
  name: script
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.types.BareMetalMachineRunCommandParameters.arguments
  name: arguments
  summary: The list of string arguments that will be passed to the script in order
    as separate arguments.
  signature: 'arguments: list[str]'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineRunCommandParameters.limitTimeSeconds
  name: limitTimeSeconds
  summary: 'The maximum time the script is allowed to run. If the execution time exceeds
    the maximum, the

    script will be stopped, any output produced until then will be captured, and the
    exit code

    matching a timeout will be returned (252). Required.'
  signature: 'limitTimeSeconds: int'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineRunCommandParameters.script
  name: script
  summary: The base64 encoded script to execute on the bare metal machine. Required.
