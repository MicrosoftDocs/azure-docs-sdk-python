### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ClusterInspectParameters
name: ClusterInspectParameters
fullName: azure.mgmt.networkcloud.types.ClusterInspectParameters
module: azure.mgmt.networkcloud.types
summary: ClusterInspectParameters represents the body of the request to inspect the
  cluster.
constructor:
  syntax: ClusterInspectParameters()
variables:
- description: 'Additional actions supplement the default non-disruptive cluster

    inspection. Additional actions may be disallowed if the cluster is in a deployed
    and running

    state.'
  name: additional_actions
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"ClusterInspectAdditionalAction">]]
- description: 'Indicates which devices are included in the inspection. By default,
    all

    devices that can be targeted will be included in the inspection.'
  name: filter_devices
  types:
  - <xref:<xref:"FilterDevices">>
attributes:
- uid: azure.mgmt.networkcloud.types.ClusterInspectParameters.additionalActions
  name: additionalActions
  summary: 'Additional actions supplement the default non-disruptive cluster inspection.
    Additional actions

    may be disallowed if the cluster is in a deployed and running state.'
  signature: 'additionalActions: list[typing.Union[str, ForwardRef(''ClusterInspectAdditionalAction'')]]'
- uid: azure.mgmt.networkcloud.types.ClusterInspectParameters.filterDevices
  name: filterDevices
  summary: 'Indicates which devices are included in the inspection. By default, all
    devices that can be

    targeted will be included in the inspection.'
  signature: 'filterDevices: FilterDevices'
