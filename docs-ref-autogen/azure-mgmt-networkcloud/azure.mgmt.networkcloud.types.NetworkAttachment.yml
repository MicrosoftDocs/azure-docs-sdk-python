### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.NetworkAttachment
name: NetworkAttachment
fullName: azure.mgmt.networkcloud.types.NetworkAttachment
module: azure.mgmt.networkcloud.types
summary: NetworkAttachment represents the single network attachment.
constructor:
  syntax: NetworkAttachment()
variables:
- description: 'The resource ID of the associated network attached to the virtual

    machine. It can be one of cloudServicesNetwork, l3Network, l2Network or trunkedNetwork

    resources. Required.'
  name: attached_network_id
  types:
  - <xref:str>
- description: 'The indicator of whether this is the default gateway. Only one of
    the

    attached networks (including the CloudServicesNetwork attachment) for a single
    machine may be

    specified as True. Known values are: "True" and "False".'
  name: default_gateway
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DefaultGateway">]
- description: 'The IP allocation mechanism for the virtual machine. Dynamic and

    Static are only valid for l3Network which may also specify Disabled. Otherwise,
    Disabled is the

    only permitted value. Required. Known values are: "Dynamic", "Static", and "Disabled".'
  name: ip_allocation_method
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualMachineIPAllocationMethod">]
- description: 'The IPv4 address of the virtual machine.  This field is used only
    if the

    attached network has IPAllocationType of IPV4 or DualStack.  If IPAllocationMethod
    is: Static -

    this field must contain a user specified IPv4 address from within the subnet specified
    in the

    attached network. Dynamic - this field is read-only, but will be populated with
    an address from

    within the subnet specified in the attached network. Disabled - this field will
    be empty.'
  name: ipv4_address
  types:
  - <xref:str>
- description: 'The IPv6 address of the virtual machine.  This field is used only
    if the

    attached network has IPAllocationType of IPV6 or DualStack.  If IPAllocationMethod
    is: Static -

    this field must contain an IPv6 address range from within the range specified
    in the attached

    network. Dynamic - this field is read-only, but will be populated with an range
    from within the

    subnet specified in the attached network. Disabled - this field will be empty.'
  name: ipv6_address
  types:
  - <xref:str>
- description: 'The MAC address of the interface for the virtual machine that corresponds
    to

    this network attachment.'
  name: mac_address
  types:
  - <xref:str>
- description: 'The associated network''s interface name. If specified, the

    network attachment name has a maximum length of 15 characters and must be unique
    to this

    virtual machine. If the user doesn''t specify this value, the default interface
    name of the

    network resource will be used. For a CloudServicesNetwork resource, this name
    will be ignored.'
  name: network_attachment_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.types.NetworkAttachment.attachedNetworkId
  name: attachedNetworkId
  summary: 'The resource ID of the associated network attached to the virtual machine.
    It can be one of

    cloudServicesNetwork, l3Network, l2Network or trunkedNetwork resources. Required.'
  signature: 'attachedNetworkId: Required[str]'
- uid: azure.mgmt.networkcloud.types.NetworkAttachment.defaultGateway
  name: defaultGateway
  summary: 'The indicator of whether this is the default gateway. Only one of the
    attached networks

    (including the CloudServicesNetwork attachment) for a single machine may be specified
    as True.

    Known values are: "True" and "False".'
  signature: 'defaultGateway: str | DefaultGateway'
- uid: azure.mgmt.networkcloud.types.NetworkAttachment.ipAllocationMethod
  name: ipAllocationMethod
  summary: 'The IP allocation mechanism for the virtual machine. Dynamic and Static
    are only valid for

    l3Network which may also specify Disabled. Otherwise, Disabled is the only permitted
    value.

    Required. Known values are: "Dynamic", "Static", and "Disabled".'
  signature: 'ipAllocationMethod: Required[str | VirtualMachineIPAllocationMethod]'
- uid: azure.mgmt.networkcloud.types.NetworkAttachment.ipv4Address
  name: ipv4Address
  summary: 'The IPv4 address of the virtual machine.  This field is used only if the
    attached network has

    IPAllocationType of IPV4 or DualStack.  If IPAllocationMethod is: Static - this
    field must

    contain a user specified IPv4 address from within the subnet specified in the
    attached network.

    Dynamic - this field is read-only, but will be populated with an address from
    within the subnet

    specified in the attached network. Disabled - this field will be empty.'
  signature: 'ipv4Address: str'
- uid: azure.mgmt.networkcloud.types.NetworkAttachment.ipv6Address
  name: ipv6Address
  summary: 'The IPv6 address of the virtual machine.  This field is used only if the
    attached network has

    IPAllocationType of IPV6 or DualStack.  If IPAllocationMethod is: Static - this
    field must

    contain an IPv6 address range from within the range specified in the attached
    network. Dynamic

    - this field is read-only, but will be populated with an range from within the
    subnet specified

    in the attached network. Disabled - this field will be empty.'
  signature: 'ipv6Address: str'
- uid: azure.mgmt.networkcloud.types.NetworkAttachment.macAddress
  name: macAddress
  summary: 'The MAC address of the interface for the virtual machine that corresponds
    to this network

    attachment.'
  signature: 'macAddress: str'
- uid: azure.mgmt.networkcloud.types.NetworkAttachment.networkAttachmentName
  name: networkAttachmentName
  summary: 'The associated network''s interface name. If specified, the network attachment
    name has a

    maximum length of 15 characters and must be unique to this virtual machine. If
    the user doesn''t

    specify this value, the default interface name of the network resource will be
    used. For a

    CloudServicesNetwork resource, this name will be ignored.'
  signature: 'networkAttachmentName: str'
