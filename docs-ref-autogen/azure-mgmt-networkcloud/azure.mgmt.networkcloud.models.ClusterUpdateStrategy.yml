  name: max_unavailable
  summary: 'The maximum number of worker nodes that can be offline within the increment
    of update, e.g.,

    rack-by-rack. Limited by the maximum number of machines in the increment. Defaults
    to the whole

    increment size.'
  signature: 'max_unavailable: int | None'
- uid: azure.mgmt.networkcloud.models.ClusterUpdateStrategy.strategy_type
  name: strategy_type
  summary: '"Rack" and

    "PauseAfterRack".'
  signature: 'strategy_type: str | _models.ClusterUpdateStrategyType'
- uid: azure.mgmt.networkcloud.models.ClusterUpdateStrategy.threshold_type
  name: threshold_type
  summary: 'Selection of how the threshold should be evaluated. Required. Known values
    are:

    "CountSuccess" and "PercentSuccess".'
  signature: 'threshold_type: str | _models.ValidationThresholdType'
- uid: azure.mgmt.networkcloud.models.ClusterUpdateStrategy.threshold_value
  name: threshold_value
  summary: The numeric threshold value. Required.
  signature: 'threshold_value: int'
- uid: azure.mgmt.networkcloud.models.ClusterUpdateStrategy.wait_time_minutes
  name: wait_time_minutes
  summary: The time to wait between the increments of update defined by the strategy.
  signature: 'wait_time_minutes: int | None'
