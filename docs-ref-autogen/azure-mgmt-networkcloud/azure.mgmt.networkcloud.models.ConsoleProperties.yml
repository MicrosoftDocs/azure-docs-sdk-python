### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.models.ConsoleProperties
name: ConsoleProperties
fullName: azure.mgmt.networkcloud.models.ConsoleProperties
module: azure.mgmt.networkcloud.models
summary: ConsoleProperties represents the properties of the virtual machine console.
constructor:
  syntax: 'ConsoleProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The indicator of whether the console access is enabled. Required.
    Known values

    are: "True" and "False".'
  name: enabled
  types:
  - <xref:str>
  - <xref:azure.mgmt.networkcloud.models.ConsoleEnabled>
- description: The date and time after which the key will be disallowed access.
  name: expiration
  types:
  - <xref:datetime.datetime>
- description: 'The SSH public key that will be provisioned for user access. The user
    is

    expected to have the corresponding SSH private key for logging in. Required.'
  name: ssh_public_key
  types:
  - <xref:azure.mgmt.networkcloud.models.SshPublicKey>
- description: 'The more detailed status of the console. Known values are: "Ready"
    and

    "Error".'
  name: detailed_status
  types:
  - <xref:str>
  - <xref:azure.mgmt.networkcloud.models.ConsoleDetailedStatus>
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: 'The resource ID of the private link service that is used to

    provide virtual machine console access.'
  name: private_link_service_id
  types:
  - <xref:str>
- description: 'The unique identifier for the virtual machine that is used to

    access the console.'
  name: virtual_machine_access_id
  types:
  - <xref:str>
- description: 'The provisioning state of the virtual machine console. Known values

    are: "Succeeded", "Failed", "Canceled", "Accepted", and "Provisioning".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.networkcloud.models.ConsoleProvisioningState>
attributes:
- uid: azure.mgmt.networkcloud.models.ConsoleProperties.detailed_status
  name: detailed_status
  summary: '"Ready" and "Error".'
  signature: 'detailed_status: str | _models.ConsoleDetailedStatus | None'
- uid: azure.mgmt.networkcloud.models.ConsoleProperties.detailed_status_message
  name: detailed_status_message
  summary: The descriptive message about the current detailed status.
  signature: 'detailed_status_message: str | None'
- uid: azure.mgmt.networkcloud.models.ConsoleProperties.enabled
  name: enabled
  summary: '"True"

    and "False".'
  signature: 'enabled: str | _models.ConsoleEnabled'
- uid: azure.mgmt.networkcloud.models.ConsoleProperties.expiration
  name: expiration
  summary: The date and time after which the key will be disallowed access.
  signature: 'expiration: datetime | None'
- uid: azure.mgmt.networkcloud.models.ConsoleProperties.private_link_service_id
  name: private_link_service_id
  summary: 'The resource ID of the private link service that is used to provide virtual
    machine console

    access.'
  signature: 'private_link_service_id: str | None'
- uid: azure.mgmt.networkcloud.models.ConsoleProperties.provisioning_state
  name: provisioning_state
  summary: '"Succeeded",

    "Failed", "Canceled", "Accepted", and "Provisioning".'
  signature: 'provisioning_state: str | _models.ConsoleProvisioningState | None'
- uid: azure.mgmt.networkcloud.models.ConsoleProperties.ssh_public_key
  name: ssh_public_key
  summary: 'The SSH public key that will be provisioned for user access. The user
    is expected to have the

    corresponding SSH private key for logging in. Required.'
  signature: 'ssh_public_key: _models.SshPublicKey'
- uid: azure.mgmt.networkcloud.models.ConsoleProperties.virtual_machine_access_id
  name: virtual_machine_access_id
  summary: The unique identifier for the virtual machine that is used to access the
    console.
  signature: 'virtual_machine_access_id: str | None'
