### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.AnalyticsOutputSettings
name: AnalyticsOutputSettings
fullName: azure.mgmt.networkcloud.types.AnalyticsOutputSettings
module: azure.mgmt.networkcloud.types
summary: 'AnalyticsOutputSettings represents the settings for the log analytics workspace
  used for output

  of logs from this cluster.'
constructor:
  syntax: AnalyticsOutputSettings()
variables:
- description: 'The resource ID of the analytics workspace that is to be used by

    the specified identity.'
  name: analytics_workspace_id
  types:
  - <xref:str>
- description: 'The selection of the managed identity to use with this analytics

    workspace. The identity type must be either system assigned or user assigned.'
  name: associated_identity
  types:
  - <xref:<xref:"IdentitySelector">>
attributes:
- uid: azure.mgmt.networkcloud.types.AnalyticsOutputSettings.analyticsWorkspaceId
  name: analyticsWorkspaceId
  summary: The resource ID of the analytics workspace that is to be used by the specified
    identity.
  signature: 'analyticsWorkspaceId: str'
- uid: azure.mgmt.networkcloud.types.AnalyticsOutputSettings.associatedIdentity
  name: associatedIdentity
  summary: 'The selection of the managed identity to use with this analytics workspace.
    The identity type

    must be either system assigned or user assigned.'
  signature: 'associatedIdentity: IdentitySelector'
