### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties
name: CloudServicesNetworkProperties
fullName: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties
module: azure.mgmt.networkcloud.types
summary: CloudServicesNetworkProperties represents properties of the cloud services
  network.
constructor:
  syntax: CloudServicesNetworkProperties()
variables:
- description: 'The list of egress endpoints. This allows for connection

    from a Hybrid AKS cluster to the specified endpoint.'
  name: additional_egress_endpoints
  types:
  - <xref:list>[<xref:"EgressEndpoint">]
- description: 'The indicator of whether the platform default endpoints

    are allowed for the egress traffic. Known values are: "True" and "False".'
  name: enable_default_egress_endpoints
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CloudServicesNetworkEnableDefaultEgressEndpoints">]
- description: The storage options for the cloud services network.
  name: storage_options
  types:
  - <xref:<xref:"CloudServicesNetworkStorageOptions">>
- description: 'The list of resource IDs for the other Microsoft.NetworkCloud

    resources that have attached this network.'
  name: associated_resource_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The resource ID of the Network Cloud cluster this cloud services network
    is

    associated with.'
  name: cluster_id
  types:
  - <xref:str>
- description: 'The more detailed status of the cloud services network. Known values

    are: "Error", "Available", and "Provisioning".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CloudServicesNetworkDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: 'The full list of additional and default egress endpoints that

    are currently enabled.'
  name: enabled_egress_endpoints
  types:
  - <xref:list>[<xref:"EgressEndpoint">]
- description: 'Field Deprecated. These fields will be empty/omitted.

    The list of Hybrid AKS cluster resource IDs that are associated with this cloud
    services

    network.'
  name: hybrid_aks_clusters_associated_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The name of the interface that will be present in the virtual machine
    to

    represent this network.'
  name: interface_name
  types:
  - <xref:str>
- description: The storage status for the cloud services network.
  name: storage_status
  types:
  - <xref:<xref:"CloudServicesNetworkStorageStatus">>
- description: 'Field Deprecated. These fields will be empty/omitted.

    The list of virtual machine resource IDs, excluding any Hybrid AKS virtual machines,
    that are

    currently using this cloud services network.'
  name: virtual_machines_associated_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The provisioning state of the cloud services network. Known values

    are: "Succeeded", "Failed", "Canceled", "Provisioning", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CloudServicesNetworkProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.additionalEgressEndpoints
  name: additionalEgressEndpoints
  summary: 'The list of egress endpoints. This allows for connection from a Hybrid
    AKS cluster to the

    specified endpoint.'
  signature: 'additionalEgressEndpoints: list[''EgressEndpoint'']'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.associatedResourceIds
  name: associatedResourceIds
  summary: 'The list of resource IDs for the other Microsoft.NetworkCloud resources
    that have attached this

    network.'
  signature: 'associatedResourceIds: list[str]'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.clusterId
  name: clusterId
  summary: The resource ID of the Network Cloud cluster this cloud services network
    is associated with.
  signature: 'clusterId: str'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.detailedStatus
  name: detailedStatus
  summary: '"Error",

    "Available", and "Provisioning".'
  signature: 'detailedStatus: str | CloudServicesNetworkDetailedStatus'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.enableDefaultEgressEndpoints
  name: enableDefaultEgressEndpoints
  summary: 'The indicator of whether the platform default endpoints are allowed for
    the egress traffic.

    Known values are: "True" and "False".'
  signature: 'enableDefaultEgressEndpoints: str | CloudServicesNetworkEnableDefaultEgressEndpoints'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.enabledEgressEndpoints
  name: enabledEgressEndpoints
  summary: The full list of additional and default egress endpoints that are currently
    enabled.
  signature: 'enabledEgressEndpoints: list[''EgressEndpoint'']'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.hybridAksClustersAssociatedIds
  name: hybridAksClustersAssociatedIds
  summary: 'Field Deprecated. These fields will be empty/omitted. The list of Hybrid
    AKS cluster resource

    IDs that are associated with this cloud services network.'
  signature: 'hybridAksClustersAssociatedIds: list[str]'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.interfaceName
  name: interfaceName
  summary: 'The name of the interface that will be present in the virtual machine
    to represent this

    network.'
  signature: 'interfaceName: str'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Provisioning", and "Accepted".'
  signature: 'provisioningState: str | CloudServicesNetworkProvisioningState'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.storageOptions
  name: storageOptions
  summary: The storage options for the cloud services network.
  signature: 'storageOptions: CloudServicesNetworkStorageOptions'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.storageStatus
  name: storageStatus
  summary: The storage status for the cloud services network.
  signature: 'storageStatus: CloudServicesNetworkStorageStatus'
- uid: azure.mgmt.networkcloud.types.CloudServicesNetworkProperties.virtualMachinesAssociatedIds
  name: virtualMachinesAssociatedIds
  summary: 'Field Deprecated. These fields will be empty/omitted. The list of virtual
    machine resource IDs,

    excluding any Hybrid AKS virtual machines, that are currently using this cloud
    services

    network.'
  signature: 'virtualMachinesAssociatedIds: list[str]'
