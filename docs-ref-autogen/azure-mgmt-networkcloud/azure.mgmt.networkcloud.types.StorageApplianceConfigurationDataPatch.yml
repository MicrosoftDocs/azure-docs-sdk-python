### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.StorageApplianceConfigurationDataPatch
name: StorageApplianceConfigurationDataPatch
fullName: azure.mgmt.networkcloud.types.StorageApplianceConfigurationDataPatch
module: azure.mgmt.networkcloud.types
summary: 'StorageApplianceConfigurationDataPatch represents configuration for the
  storage application for

  patch operations.'
constructor:
  syntax: StorageApplianceConfigurationDataPatch()
variables:
- description: 'The credentials of the administrative interface on this storage

    appliance. The password field is expected to be an Azure Key Vault key URL. Until
    the cluster

    is converted to utilize managed identity by setting the secret archive settings,
    the actual

    password value should be provided instead.'
  name: admin_credentials
  types:
  - <xref:<xref:"AdministrativeCredentialsPatch">>
- description: The slot that storage appliance is in the rack based on the BOM configuration.
  name: rack_slot
  types:
  - <xref:int>
- description: The serial number of the appliance.
  name: serial_number
  types:
  - <xref:str>
- description: 'The user-provided name for the storage appliance that will be

    created from this specification.'
  name: storage_appliance_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.types.StorageApplianceConfigurationDataPatch.adminCredentials
  name: adminCredentials
  summary: 'The credentials of the administrative interface on this storage appliance.
    The password field

    is expected to be an Azure Key Vault key URL. Until the cluster is converted to
    utilize managed

    identity by setting the secret archive settings, the actual password value should
    be provided

    instead.'
  signature: 'adminCredentials: AdministrativeCredentialsPatch'
- uid: azure.mgmt.networkcloud.types.StorageApplianceConfigurationDataPatch.rackSlot
  name: rackSlot
  summary: The slot that storage appliance is in the rack based on the BOM configuration.
  signature: 'rackSlot: int'
- uid: azure.mgmt.networkcloud.types.StorageApplianceConfigurationDataPatch.serialNumber
  name: serialNumber
  summary: The serial number of the appliance.
  signature: 'serialNumber: str'
- uid: azure.mgmt.networkcloud.types.StorageApplianceConfigurationDataPatch.storageApplianceName
  name: storageApplianceName
  summary: The user-provided name for the storage appliance that will be created from
    this specification.
  signature: 'storageApplianceName: str'
