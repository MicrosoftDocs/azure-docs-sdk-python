### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.IdentitySelector
name: IdentitySelector
fullName: azure.mgmt.networkcloud.types.IdentitySelector
module: azure.mgmt.networkcloud.types
summary: IdentitySelector represents the selection of a managed identity for use.
constructor:
  syntax: IdentitySelector()
variables:
- description: 'The type of managed identity that is being selected. Known values
    are:

    "SystemAssignedIdentity" and "UserAssignedIdentity".'
  name: identity_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ManagedServiceIdentitySelectorType">]
- description: 'The user assigned managed identity resource ID to

    use. Mutually exclusive with a system assigned identity type.'
  name: user_assigned_identity_resource_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.types.IdentitySelector.identityType
  name: identityType
  summary: 'The type of managed identity that is being selected. Known values are:

    "SystemAssignedIdentity" and "UserAssignedIdentity".'
  signature: 'identityType: str | ManagedServiceIdentitySelectorType'
- uid: azure.mgmt.networkcloud.types.IdentitySelector.userAssignedIdentityResourceId
  name: userAssignedIdentityResourceId
  summary: 'The user assigned managed identity resource ID to use. Mutually exclusive
    with a system

    assigned identity type.'
  signature: 'userAssignedIdentityResourceId: str'
