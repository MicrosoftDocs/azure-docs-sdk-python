### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties
name: KubernetesClusterProperties
fullName: azure.mgmt.networkcloud.types.KubernetesClusterProperties
module: azure.mgmt.networkcloud.types
summary: KubernetesClusterProperties represents the properties of Kubernetes cluster
  resource.
constructor:
  syntax: KubernetesClusterProperties()
variables:
- description: The Azure Active Directory Integration properties.
  name: aad_configuration
  types:
  - <xref:<xref:"AadConfiguration">>
- description: 'The administrative credentials that will be applied to the

    control plane and agent pool nodes that do not specify their own values.'
  name: administrator_configuration
  types:
  - <xref:<xref:"AdministratorConfiguration">>
- description: 'The defining characteristics of the control plane for

    this Kubernetes Cluster. Required.'
  name: control_plane_node_configuration
  types:
  - <xref:<xref:"ControlPlaneNodeConfiguration">>
- description: 'The agent pools that are created with this Kubernetes

    cluster for running critical system services and workloads. This data in this
    field is only

    used during creation, and the field will be empty following the creation of the
    Kubernetes

    Cluster. After creation, the management of agent pools is done using the agentPools

    sub-resource. Required.'
  name: initial_agent_pool_configurations
  types:
  - <xref:list>[<xref:"InitialAgentPoolConfiguration">]
- description: The Kubernetes version for this cluster. Required.
  name: kubernetes_version
  types:
  - <xref:str>
- description: 'The configuration of the managed resource group

    associated with the resource.'
  name: managed_resource_group_configuration
  types:
  - <xref:<xref:"ManagedResourceGroupConfiguration">>
- description: 'The configuration of the Kubernetes cluster networking, including

    the attachment of networks that span the cluster. Required.'
  name: network_configuration
  types:
  - <xref:<xref:"NetworkConfiguration">>
- description: 'The full list of network resource IDs that are attached to this

    cluster, including those attached only to specific agent pools.'
  name: attached_network_ids
  types:
  - <xref:list>[<xref:str>]
- description: The list of versions that this Kubernetes cluster can be upgraded to.
  name: available_upgrades
  types:
  - <xref:list>[<xref:"AvailableUpgrade">]
- description: The resource ID of the Network Cloud cluster.
  name: cluster_id
  types:
  - <xref:str>
- description: 'The resource ID of the connected cluster set up when this

    Kubernetes cluster is created.'
  name: connected_cluster_id
  types:
  - <xref:str>
- description: 'The current running version of Kubernetes on the

    control plane.'
  name: control_plane_kubernetes_version
  types:
  - <xref:str>
- description: 'The current status of the Kubernetes cluster. Known values are:

    "Available", "Error", and "Provisioning".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KubernetesClusterDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: The current feature settings.
  name: feature_statuses
  types:
  - <xref:list>[<xref:"FeatureStatus">]
- description: The details of the nodes in this cluster.
  name: nodes
  types:
  - <xref:list>[<xref:"KubernetesClusterNode">]
- description: 'The provisioning state of the Kubernetes cluster resource. Known

    values are: "Succeeded", "Failed", "Canceled", "Accepted", "InProgress", "Created",
    "Updating",

    and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KubernetesClusterProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.aadConfiguration
  name: aadConfiguration
  summary: The Azure Active Directory Integration properties.
  signature: 'aadConfiguration: AadConfiguration'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.administratorConfiguration
  name: administratorConfiguration
  summary: 'The administrative credentials that will be applied to the control plane
    and agent pool nodes

    that do not specify their own values.'
  signature: 'administratorConfiguration: AdministratorConfiguration'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.attachedNetworkIds
  name: attachedNetworkIds
  summary: 'The full list of network resource IDs that are attached to this cluster,
    including those

    attached only to specific agent pools.'
  signature: 'attachedNetworkIds: list[str]'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.availableUpgrades
  name: availableUpgrades
  summary: The list of versions that this Kubernetes cluster can be upgraded to.
  signature: 'availableUpgrades: list[''AvailableUpgrade'']'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.clusterId
  name: clusterId
  summary: The resource ID of the Network Cloud cluster.
  signature: 'clusterId: str'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.connectedClusterId
  name: connectedClusterId
  summary: The resource ID of the connected cluster set up when this Kubernetes cluster
    is created.
  signature: 'connectedClusterId: str'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.controlPlaneKubernetesVersion
  name: controlPlaneKubernetesVersion
  summary: The current running version of Kubernetes on the control plane.
  signature: 'controlPlaneKubernetesVersion: str'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.controlPlaneNodeConfiguration
  name: controlPlaneNodeConfiguration
  summary: The defining characteristics of the control plane for this Kubernetes Cluster.
    Required.
  signature: 'controlPlaneNodeConfiguration: Required[ControlPlaneNodeConfiguration]'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.detailedStatus
  name: detailedStatus
  summary: '"Available", "Error", and

    "Provisioning".'
  signature: 'detailedStatus: str | KubernetesClusterDetailedStatus'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.featureStatuses
  name: featureStatuses
  summary: The current feature settings.
  signature: 'featureStatuses: list[''FeatureStatus'']'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.initialAgentPoolConfigurations
  name: initialAgentPoolConfigurations
  summary: 'The agent pools that are created with this Kubernetes cluster for running
    critical system

    services and workloads. This data in this field is only used during creation,
    and the field

    will be empty following the creation of the Kubernetes Cluster. After creation,
    the management

    of agent pools is done using the agentPools sub-resource. Required.'
  signature: 'initialAgentPoolConfigurations: Required[list[''InitialAgentPoolConfiguration'']]'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.kubernetesVersion
  name: kubernetesVersion
  summary: The Kubernetes version for this cluster. Required.
  signature: 'kubernetesVersion: Required[str]'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.managedResourceGroupConfiguration
  name: managedResourceGroupConfiguration
  summary: The configuration of the managed resource group associated with the resource.
  signature: 'managedResourceGroupConfiguration: ManagedResourceGroupConfiguration'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.networkConfiguration
  name: networkConfiguration
  summary: 'The configuration of the Kubernetes cluster networking, including the
    attachment of networks

    that span the cluster. Required.'
  signature: 'networkConfiguration: Required[NetworkConfiguration]'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.nodes
  name: nodes
  summary: The details of the nodes in this cluster.
  signature: 'nodes: list[''KubernetesClusterNode'']'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Accepted", "InProgress", "Created", "Updating", and

    "Deleting".'
  signature: 'provisioningState: str | KubernetesClusterProvisioningState'
