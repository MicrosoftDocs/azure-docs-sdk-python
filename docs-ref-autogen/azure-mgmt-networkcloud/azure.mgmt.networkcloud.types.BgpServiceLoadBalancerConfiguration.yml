### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.BgpServiceLoadBalancerConfiguration
name: BgpServiceLoadBalancerConfiguration
fullName: azure.mgmt.networkcloud.types.BgpServiceLoadBalancerConfiguration
module: azure.mgmt.networkcloud.types
summary: 'BgpServiceLoadBalancerConfiguration represents the configuration of a BGP
  service load

  balancer.'
constructor:
  syntax: BgpServiceLoadBalancerConfiguration()
variables:
- description: 'The association of IP address pools to the communities and peers,

    allowing for announcement of IPs.'
  name: bgp_advertisements
  types:
  - <xref:list>[<xref:"BgpAdvertisement">]
- description: 'The list of additional BgpPeer entities that the Kubernetes cluster
    will peer

    with. All peering must be explicitly defined.'
  name: bgp_peers
  types:
  - <xref:list>[<xref:"ServiceLoadBalancerBgpPeer">]
- description: 'The indicator to specify if the load balancer peers with the

    network fabric. Known values are: "True" and "False".'
  name: fabric_peering_enabled
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FabricPeeringEnabled">]
- description: 'The list of pools of IP addresses that can be allocated to load

    balancer services.'
  name: ip_address_pools
  types:
  - <xref:list>[<xref:"IpAddressPool">]
attributes:
- uid: azure.mgmt.networkcloud.types.BgpServiceLoadBalancerConfiguration.bgpAdvertisements
  name: bgpAdvertisements
  summary: 'The association of IP address pools to the communities and peers, allowing
    for announcement of

    IPs.'
  signature: 'bgpAdvertisements: list[''BgpAdvertisement'']'
- uid: azure.mgmt.networkcloud.types.BgpServiceLoadBalancerConfiguration.bgpPeers
  name: bgpPeers
  summary: 'The list of additional BgpPeer entities that the Kubernetes cluster will
    peer with. All peering

    must be explicitly defined.'
  signature: 'bgpPeers: list[''ServiceLoadBalancerBgpPeer'']'
- uid: azure.mgmt.networkcloud.types.BgpServiceLoadBalancerConfiguration.fabricPeeringEnabled
  name: fabricPeeringEnabled
  summary: 'The indicator to specify if the load balancer peers with the network fabric.
    Known values are:

    "True" and "False".'
  signature: 'fabricPeeringEnabled: str | FabricPeeringEnabled'
- uid: azure.mgmt.networkcloud.types.BgpServiceLoadBalancerConfiguration.ipAddressPools
  name: ipAddressPools
  summary: The list of pools of IP addresses that can be allocated to load balancer
    services.
  signature: 'ipAddressPools: list[''IpAddressPool'']'
