### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.BareMetalMachineReplaceParameters
name: BareMetalMachineReplaceParameters
fullName: azure.mgmt.networkcloud.types.BareMetalMachineReplaceParameters
module: azure.mgmt.networkcloud.types
summary: 'BareMetalMachineReplaceParameters represents the body of the request to
  physically swap a bare

  metal machine for another.'
constructor:
  syntax: BareMetalMachineReplaceParameters()
variables:
- description: 'The credentials of the baseboard management controller on this bare

    metal machine. The password field is expected to be an Azure Key Vault key URL.
    Until the

    cluster is converted to utilize managed identity by setting the secret archive
    settings, the

    actual password value should be provided instead.'
  name: bmc_credentials
  types:
  - <xref:<xref:"AdministrativeCredentials">>
- description: The MAC address of the BMC device.
  name: bmc_mac_address
  types:
  - <xref:str>
- description: The MAC address of a NIC connected to the PXE network.
  name: boot_mac_address
  types:
  - <xref:str>
- description: The OS-level hostname assigned to this machine.
  name: machine_name
  types:
  - <xref:str>
- description: 'The safeguard mode to use for the replace action, where None indicates
    to

    bypass safeguards and All indicates to utilize all safeguards. Known values are:
    "All" and

    "None".'
  name: safeguard_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BareMetalMachineReplaceSafeguardMode">]
- description: The serial number of the bare metal machine.
  name: serial_number
  types:
  - <xref:str>
- description: 'The indicator of whether to bypass clearing storage while replacing
    a

    bare metal machine. Known values are: "Preserve" and "DiscardAll".'
  name: storage_policy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BareMetalMachineReplaceStoragePolicy">]
attributes:
- uid: azure.mgmt.networkcloud.types.BareMetalMachineReplaceParameters.bmcCredentials
  name: bmcCredentials
  summary: 'The credentials of the baseboard management controller on this bare metal
    machine. The password

    field is expected to be an Azure Key Vault key URL. Until the cluster is converted
    to utilize

    managed identity by setting the secret archive settings, the actual password value
    should be

    provided instead.'
  signature: 'bmcCredentials: AdministrativeCredentials'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineReplaceParameters.bmcMacAddress
  name: bmcMacAddress
  summary: The MAC address of the BMC device.
  signature: 'bmcMacAddress: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineReplaceParameters.bootMacAddress
  name: bootMacAddress
  summary: The MAC address of a NIC connected to the PXE network.
  signature: 'bootMacAddress: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineReplaceParameters.machineName
  name: machineName
  summary: The OS-level hostname assigned to this machine.
  signature: 'machineName: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineReplaceParameters.safeguardMode
  name: safeguardMode
  summary: 'The safeguard mode to use for the replace action, where None indicates
    to bypass safeguards and

    All indicates to utilize all safeguards. Known values are: "All" and "None".'
  signature: 'safeguardMode: str | BareMetalMachineReplaceSafeguardMode'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineReplaceParameters.serialNumber
  name: serialNumber
  summary: The serial number of the bare metal machine.
  signature: 'serialNumber: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineReplaceParameters.storagePolicy
  name: storagePolicy
  summary: 'The indicator of whether to bypass clearing storage while replacing a
    bare metal machine. Known

    values are: "Preserve" and "DiscardAll".'
  signature: 'storagePolicy: str | BareMetalMachineReplaceStoragePolicy'
