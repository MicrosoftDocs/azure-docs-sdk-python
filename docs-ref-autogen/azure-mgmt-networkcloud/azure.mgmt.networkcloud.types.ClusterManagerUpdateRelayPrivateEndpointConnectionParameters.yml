uid: azure.mgmt.networkcloud.types.ClusterManagerUpdateRelayPrivateEndpointConnectionParameters
name: ClusterManagerUpdateRelayPrivateEndpointConnectionParameters
fullName: azure.mgmt.networkcloud.types.ClusterManagerUpdateRelayPrivateEndpointConnectionParameters
module: azure.mgmt.networkcloud.types
summary: 'ClusterManagerUpdateRelayPrivateEndpointConnectionParameters represents
