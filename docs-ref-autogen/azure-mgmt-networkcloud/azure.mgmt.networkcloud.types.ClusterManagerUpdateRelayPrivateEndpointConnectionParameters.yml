  name: connection_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RelayPrivateEndpointConnectionState">]
- description: The description to associate with the private endpoint connection.
  name: description
  types:
  - <xref:str>
- description: 'The resource ID of private endpoint to be permitted or

    denied connection to the relay namespace. Required.'
