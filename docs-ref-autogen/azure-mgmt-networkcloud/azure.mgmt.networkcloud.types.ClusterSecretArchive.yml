### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ClusterSecretArchive
name: ClusterSecretArchive
fullName: azure.mgmt.networkcloud.types.ClusterSecretArchive
module: azure.mgmt.networkcloud.types
summary: 'ClusterSecretArchive configures the key vault to archive the secrets of
  the cluster for later

  retrieval.'
constructor:
  syntax: ClusterSecretArchive()
variables:
- description: 'The resource ID of the key vault to archive the secrets of the cluster.

    Required.'
  name: key_vault_id
  types:
  - <xref:str>
- description: 'The indicator if the specified key vault should be used to archive
    the

    secrets of the cluster. Known values are: "True" and "False".'
  name: use_key_vault
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterSecretArchiveEnabled">]
attributes:
- uid: azure.mgmt.networkcloud.types.ClusterSecretArchive.keyVaultId
  name: keyVaultId
  summary: The resource ID of the key vault to archive the secrets of the cluster.
    Required.
  signature: 'keyVaultId: Required[str]'
- uid: azure.mgmt.networkcloud.types.ClusterSecretArchive.useKeyVault
  name: useKeyVault
  summary: 'The indicator if the specified key vault should be used to archive the
    secrets of the cluster.

    Known values are: "True" and "False".'
  signature: 'useKeyVault: str | ClusterSecretArchiveEnabled'
