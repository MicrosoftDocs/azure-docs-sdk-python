### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ControlPlaneNodeConfiguration
name: ControlPlaneNodeConfiguration
fullName: azure.mgmt.networkcloud.types.ControlPlaneNodeConfiguration
module: azure.mgmt.networkcloud.types
summary: 'ControlPlaneNodeConfiguration represents the selection of virtual machines
  and size of the

  control plane for a Kubernetes cluster.'
constructor:
  syntax: ControlPlaneNodeConfiguration()
variables:
- description: 'The administrator credentials to be used for the nodes in

    the control plane.'
  name: administrator_configuration
  types:
  - <xref:<xref:"AdministratorConfiguration">>
- description: 'The list of availability zones of the Network Cloud cluster to be

    used for the provisioning of nodes in the control plane. If not specified, all
    availability

    zones will be used.'
  name: availability_zones
  types:
  - <xref:list>[<xref:str>]
- description: The number of virtual machines that use this configuration. Required.
  name: count
  types:
  - <xref:int>
- description: The name of the VM SKU supplied during creation. Required.
  name: vm_sku_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.types.ControlPlaneNodeConfiguration.administratorConfiguration
  name: administratorConfiguration
  summary: The administrator credentials to be used for the nodes in the control plane.
  signature: 'administratorConfiguration: AdministratorConfiguration'
- uid: azure.mgmt.networkcloud.types.ControlPlaneNodeConfiguration.availabilityZones
  name: availabilityZones
  summary: 'The list of availability zones of the Network Cloud cluster to be used
    for the provisioning of

    nodes in the control plane. If not specified, all availability zones will be used.'
  signature: 'availabilityZones: list[str]'
- uid: azure.mgmt.networkcloud.types.ControlPlaneNodeConfiguration.count
  name: count
  summary: The number of virtual machines that use this configuration. Required.
  signature: 'count: int'
- uid: azure.mgmt.networkcloud.types.ControlPlaneNodeConfiguration.vmSkuName
  name: vmSkuName
  summary: The name of the VM SKU supplied during creation. Required.
  signature: 'vmSkuName: str'
