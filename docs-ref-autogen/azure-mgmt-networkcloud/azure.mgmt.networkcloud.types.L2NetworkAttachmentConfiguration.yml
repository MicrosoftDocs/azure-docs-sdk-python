### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.L2NetworkAttachmentConfiguration
name: L2NetworkAttachmentConfiguration
fullName: azure.mgmt.networkcloud.types.L2NetworkAttachmentConfiguration
module: azure.mgmt.networkcloud.types
summary: 'L2NetworkAttachmentConfiguration represents the configuration of the attachment
  of a Layer 2

  network.'
constructor:
  syntax: L2NetworkAttachmentConfiguration()
variables:
- description: 'The resource ID of the network that is being configured for attachment.

    Required.'
  name: network_id
  types:
  - <xref:str>
- description: 'The indicator of how this network will be utilized by the Kubernetes

    cluster. Known values are: "DPDK", "SRIOV", "OSDevice", "MACVLAN", and "IPVLAN".'
  name: plugin_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KubernetesPluginType">]
attributes:
- uid: azure.mgmt.networkcloud.types.L2NetworkAttachmentConfiguration.networkId
  name: networkId
  summary: The resource ID of the network that is being configured for attachment.
    Required.
  signature: 'networkId: Required[str]'
- uid: azure.mgmt.networkcloud.types.L2NetworkAttachmentConfiguration.pluginType
  name: pluginType
  summary: 'The indicator of how this network will be utilized by the Kubernetes cluster.
    Known values are:

    "DPDK", "SRIOV", "OSDevice", "MACVLAN", and "IPVLAN".'
  signature: 'pluginType: str | KubernetesPluginType'
