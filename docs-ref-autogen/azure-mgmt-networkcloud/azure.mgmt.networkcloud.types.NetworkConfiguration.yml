### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.NetworkConfiguration
name: NetworkConfiguration
fullName: azure.mgmt.networkcloud.types.NetworkConfiguration
module: azure.mgmt.networkcloud.types
summary: NetworkConfiguration specifies the Kubernetes cluster network related configuration.
constructor:
  syntax: NetworkConfiguration()
variables:
- description: 'The configuration of networks being attached to the

    cluster for use by the workloads that run on this Kubernetes cluster.'
  name: attached_network_configuration
  types:
  - <xref:<xref:"AttachedNetworkConfiguration">>
- description: 'The configuration of the BGP service load

    balancer for this Kubernetes cluster. A maximum of one service load balancer may
    be specified,

    either Layer 2 or BGP.'
  name: bgp_service_load_balancer_configuration
  types:
  - <xref:<xref:"BgpServiceLoadBalancerConfiguration">>
- description: 'The resource ID of the associated Cloud Services network.

    Required.'
  name: cloud_services_network_id
  types:
  - <xref:str>
- description: 'The resource ID of the Layer 3 network that is used for creation of
    the

    Container Networking Interface network. Required.'
  name: cni_network_id
  types:
  - <xref:str>
- description: 'The IP address assigned to the Kubernetes DNS service. It must be
    within

    the Kubernetes service address range specified in service CIDR.'
  name: dns_service_ip
  types:
  - <xref:str>
- description: 'The configuration of the Layer 2 service load

    balancer for this Kubernetes cluster. A maximum of one service load balancer may
    be specified,

    either Layer 2 or BGP.'
  name: l2_service_load_balancer_configuration
  types:
  - <xref:<xref:"L2ServiceLoadBalancerConfiguration">>
- description: 'The CIDR notation IP ranges from which to assign pod IPs. One IPv4
    CIDR is

    expected for single-stack networking. Two CIDRs, one for each IP family (IPv4/IPv6),
    is

    expected for dual-stack networking.'
  name: pod_cidrs
  types:
  - <xref:list>[<xref:str>]
- description: 'The CIDR notation IP ranges from which to assign service IPs. One
    IPv4

    CIDR is expected for single-stack networking. Two CIDRs, one for each IP family
    (IPv4/IPv6), is

    expected for dual-stack networking.'
  name: service_cidrs
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.networkcloud.types.NetworkConfiguration.attachedNetworkConfiguration
  name: attachedNetworkConfiguration
  summary: 'The configuration of networks being attached to the cluster for use by
    the workloads that run

    on this Kubernetes cluster.'
  signature: 'attachedNetworkConfiguration: AttachedNetworkConfiguration'
- uid: azure.mgmt.networkcloud.types.NetworkConfiguration.bgpServiceLoadBalancerConfiguration
  name: bgpServiceLoadBalancerConfiguration
  summary: 'The configuration of the BGP service load balancer for this Kubernetes
    cluster. A maximum of

    one service load balancer may be specified, either Layer 2 or BGP.'
  signature: 'bgpServiceLoadBalancerConfiguration: BgpServiceLoadBalancerConfiguration'
- uid: azure.mgmt.networkcloud.types.NetworkConfiguration.cloudServicesNetworkId
  name: cloudServicesNetworkId
  summary: The resource ID of the associated Cloud Services network. Required.
  signature: 'cloudServicesNetworkId: str'
- uid: azure.mgmt.networkcloud.types.NetworkConfiguration.cniNetworkId
  name: cniNetworkId
  summary: 'The resource ID of the Layer 3 network that is used for creation of the
    Container Networking

    Interface network. Required.'
  signature: 'cniNetworkId: str'
- uid: azure.mgmt.networkcloud.types.NetworkConfiguration.dnsServiceIp
  name: dnsServiceIp
  summary: 'The IP address assigned to the Kubernetes DNS service. It must be within
    the Kubernetes service

    address range specified in service CIDR.'
  signature: 'dnsServiceIp: str'
- uid: azure.mgmt.networkcloud.types.NetworkConfiguration.l2ServiceLoadBalancerConfiguration
  name: l2ServiceLoadBalancerConfiguration
  summary: 'The configuration of the Layer 2 service load balancer for this Kubernetes
    cluster. A maximum

    of one service load balancer may be specified, either Layer 2 or BGP.'
  signature: 'l2ServiceLoadBalancerConfiguration: L2ServiceLoadBalancerConfiguration'
- uid: azure.mgmt.networkcloud.types.NetworkConfiguration.podCidrs
  name: podCidrs
  summary: 'The CIDR notation IP ranges from which to assign pod IPs. One IPv4 CIDR
    is expected for

    single-stack networking. Two CIDRs, one for each IP family (IPv4/IPv6), is expected
    for

    dual-stack networking.'
  signature: 'podCidrs: list[str]'
- uid: azure.mgmt.networkcloud.types.NetworkConfiguration.serviceCidrs
  name: serviceCidrs
  summary: 'The CIDR notation IP ranges from which to assign service IPs. One IPv4
    CIDR is expected for

    single-stack networking. Two CIDRs, one for each IP family (IPv4/IPv6), is expected
    for

    dual-stack networking.'
  signature: 'serviceCidrs: list[str]'
