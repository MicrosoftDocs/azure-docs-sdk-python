### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.CommandOutputSettings
name: CommandOutputSettings
fullName: azure.mgmt.networkcloud.types.CommandOutputSettings
module: azure.mgmt.networkcloud.types
summary: 'CommandOutputSettings represents the settings for commands run within the
  cluster such as bare

  metal machine run read-only commands.'
constructor:
  syntax: CommandOutputSettings()
variables:
- description: 'The selection of the managed identity to use with this storage

    account container. The identity type must be either system assigned or user assigned.'
  name: associated_identity
  types:
  - <xref:<xref:"IdentitySelector">>
- description: 'The URL of the storage account container that is to be used by the

    specified identities.'
  name: container_url
  types:
  - <xref:str>
- description: 'The list of optional overrides allowing for association of storage
    containers

    and identities to specific types of command output. If a type is not overridden,
    the default

    identity and storage container will be utilized.'
  name: overrides
  types:
  - <xref:list>[<xref:"CommandOutputOverride">]
attributes:
- uid: azure.mgmt.networkcloud.types.CommandOutputSettings.associatedIdentity
  name: associatedIdentity
  summary: 'The selection of the managed identity to use with this storage account
    container. The identity

    type must be either system assigned or user assigned.'
  signature: 'associatedIdentity: IdentitySelector'
- uid: azure.mgmt.networkcloud.types.CommandOutputSettings.containerUrl
  name: containerUrl
  summary: The URL of the storage account container that is to be used by the specified
    identities.
  signature: 'containerUrl: str'
- uid: azure.mgmt.networkcloud.types.CommandOutputSettings.overrides
  name: overrides
  summary: 'The list of optional overrides allowing for association of storage containers
    and identities to

    specific types of command output. If a type is not overridden, the default identity
    and storage

    container will be utilized.'
  signature: 'overrides: list[azure.mgmt.networkcloud.types.CommandOutputOverride]'
