### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.VirtualMachineAssignRelayParameters
name: VirtualMachineAssignRelayParameters
fullName: azure.mgmt.networkcloud.types.VirtualMachineAssignRelayParameters
module: azure.mgmt.networkcloud.types
summary: 'VirtualMachineAssignRelayParameters represents the body of the request to
  update the relay used

  for a Microsoft.HybridCompute machine associated with the virtual machine.'
constructor:
  syntax: VirtualMachineAssignRelayParameters()
variables:
- description: 'The resourceId of the Microsoft.HybridCompute machine resource to
    assign

    relay usage. Required.'
  name: machine_id
  types:
  - <xref:str>
- description: 'The indicator of which relay type the machine should be assigned to
    use.

    Platform indicates the use of a platform-dedicated relay. Public indicates the
    use of the

    standard public relay for Arc services. Known values are: "Platform" and "Public".'
  name: relay_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RelayType">]
attributes:
- uid: azure.mgmt.networkcloud.types.VirtualMachineAssignRelayParameters.machineId
  name: machineId
  summary: The resourceId of the Microsoft.HybridCompute machine resource to assign
    relay usage. Required.
  signature: 'machineId: Required[str]'
- uid: azure.mgmt.networkcloud.types.VirtualMachineAssignRelayParameters.relayType
  name: relayType
  summary: 'The indicator of which relay type the machine should be assigned to use.
    Platform indicates the

    use of a platform-dedicated relay. Public indicates the use of the standard public
    relay for

    Arc services. Known values are: "Platform" and "Public".'
  signature: 'relayType: str | RelayType'
