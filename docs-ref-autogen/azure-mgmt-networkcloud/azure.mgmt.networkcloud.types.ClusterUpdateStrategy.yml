### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ClusterUpdateStrategy
name: ClusterUpdateStrategy
fullName: azure.mgmt.networkcloud.types.ClusterUpdateStrategy
module: azure.mgmt.networkcloud.types
summary: ClusterUpdateStrategy represents the strategy for updating the cluster.
constructor:
  syntax: ClusterUpdateStrategy()
variables:
- description: 'The maximum number of worker nodes that can be offline within the

    increment of update, e.g., rack-by-rack. Limited by the maximum number of machines
    in the

    increment. Defaults to the whole increment size.'
  name: max_unavailable
  types:
  - <xref:int>
- description: 'The mode of operation for runtime protection. Required. Known values
    are:

    "Rack" and "PauseAfterRack".'
  name: strategy_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterUpdateStrategyType">]
- description: 'Selection of how the threshold should be evaluated. Required. Known

    values are: "CountSuccess" and "PercentSuccess".'
  name: threshold_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ValidationThresholdType">]
- description: The numeric threshold value. Required.
  name: threshold_value
  types:
  - <xref:int>
- description: 'The time to wait between the increments of update defined by the

    strategy.'
  name: wait_time_minutes
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.networkcloud.types.ClusterUpdateStrategy.maxUnavailable
  name: maxUnavailable
  summary: 'The maximum number of worker nodes that can be offline within the increment
    of update, e.g.,

    rack-by-rack. Limited by the maximum number of machines in the increment. Defaults
    to the whole

    increment size.'
  signature: 'maxUnavailable: int'
- uid: azure.mgmt.networkcloud.types.ClusterUpdateStrategy.strategyType
  name: strategyType
  summary: '"Rack" and

    "PauseAfterRack".'
  signature: 'strategyType: Required[str | ClusterUpdateStrategyType]'
- uid: azure.mgmt.networkcloud.types.ClusterUpdateStrategy.thresholdType
  name: thresholdType
  summary: 'Selection of how the threshold should be evaluated. Required. Known values
    are:

    "CountSuccess" and "PercentSuccess".'
  signature: 'thresholdType: Required[str | ValidationThresholdType]'
- uid: azure.mgmt.networkcloud.types.ClusterUpdateStrategy.thresholdValue
  name: thresholdValue
  summary: The numeric threshold value. Required.
  signature: 'thresholdValue: Required[int]'
- uid: azure.mgmt.networkcloud.types.ClusterUpdateStrategy.waitTimeMinutes
  name: waitTimeMinutes
  summary: The time to wait between the increments of update defined by the strategy.
  signature: 'waitTimeMinutes: int'
