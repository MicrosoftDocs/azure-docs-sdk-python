    and "UpdateFailed".'
  signature: 'detailed_status: str | _models.ClusterManagerDetailedStatus | None'
- uid: azure.mgmt.networkcloud.models.ClusterManagerProperties.detailed_status_message
  name: detailed_status_message
  summary: The descriptive message about the current detailed status.
