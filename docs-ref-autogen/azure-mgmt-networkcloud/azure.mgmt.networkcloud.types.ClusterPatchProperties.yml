### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ClusterPatchProperties
name: ClusterPatchProperties
fullName: azure.mgmt.networkcloud.types.ClusterPatchProperties
module: azure.mgmt.networkcloud.types
summary: ClusterPatchProperties represents the properties of the cluster for patching.
constructor:
  syntax: ClusterPatchProperties()
variables:
- description: 'The rack definition that is intended to reflect

    only a single rack in a single rack cluster, or an aggregator rack in a multi-rack
    cluster.'
  name: aggregator_or_single_rack_definition
  types:
  - <xref:<xref:"RackDefinitionPatch">>
- description: 'The settings for the log analytics workspace used for output

    of logs from this cluster.'
  name: analytics_output_settings
  types:
  - <xref:<xref:"AnalyticsOutputSettings">>
- description: 'The customer-provided location information to identify where the

    cluster resides.'
  name: cluster_location
  types:
  - <xref:str>
- description: 'Field Deprecated: Use managed identity to provide cluster

    privileges. The service principal to be used by the cluster during Arc Appliance
    installation.'
  name: cluster_service_principal
  types:
  - <xref:<xref:"ServicePrincipalInformationPatch">>
- description: 'The settings for commands run in this cluster, such as bare

    metal machine run read only commands and data extracts.'
  name: command_output_settings
  types:
  - <xref:<xref:"CommandOutputSettings">>
- description: 'The validation threshold indicating the allowable failures

    of compute machines during environment validation and deployment.'
  name: compute_deployment_threshold
  types:
  - <xref:<xref:"ValidationThresholdPatch">>
- description: 'The list of rack definitions for the compute racks in a

    multi-rack cluster, or an empty list in a single-rack cluster.'
  name: compute_rack_definitions
  types:
  - <xref:list>[<xref:"RackDefinitionPatch">]
- description: The settings for cluster runtime protection.
  name: runtime_protection_configuration
  types:
  - <xref:<xref:"RuntimeProtectionConfigurationPatch">>
- description: 'The configuration for use of a key vault to store secrets for later

    retrieval by the operator.'
  name: secret_archive
  types:
  - <xref:<xref:"ClusterSecretArchivePatch">>
- description: 'The settings for the secret archive used to hold credentials for

    the cluster.'
  name: secret_archive_settings
  types:
  - <xref:<xref:"SecretArchiveSettings">>
- description: The strategy for updating the cluster.
  name: update_strategy
  types:
  - <xref:<xref:"ClusterUpdateStrategyPatch">>
- description: 'The settings for how security vulnerability scanning is

    applied to the cluster.'
  name: vulnerability_scanning_settings
  types:
  - <xref:<xref:"VulnerabilityScanningSettingsPatch">>
attributes:
- uid: azure.mgmt.networkcloud.types.ClusterPatchProperties.aggregatorOrSingleRackDefinition
  name: aggregatorOrSingleRackDefinition
  summary: 'The rack definition that is intended to reflect only a single rack in
    a single rack cluster, or

    an aggregator rack in a multi-rack cluster.'
  signature: 'aggregatorOrSingleRackDefinition: RackDefinitionPatch'
- uid: azure.mgmt.networkcloud.types.ClusterPatchProperties.analyticsOutputSettings
  name: analyticsOutputSettings
  summary: The settings for the log analytics workspace used for output of logs from
    this cluster.
  signature: 'analyticsOutputSettings: AnalyticsOutputSettings'
- uid: azure.mgmt.networkcloud.types.ClusterPatchProperties.clusterLocation
  name: clusterLocation
  summary: The customer-provided location information to identify where the cluster
    resides.
  signature: 'clusterLocation: str'
- uid: azure.mgmt.networkcloud.types.ClusterPatchProperties.clusterServicePrincipal
  name: clusterServicePrincipal
  summary: 'Use managed identity to provide cluster privileges. The service principal
    to

    be used by the cluster during Arc Appliance installation.'
  signature: 'clusterServicePrincipal: ServicePrincipalInformationPatch'
- uid: azure.mgmt.networkcloud.types.ClusterPatchProperties.commandOutputSettings
  name: commandOutputSettings
  summary: 'The settings for commands run in this cluster, such as bare metal machine
    run read only

    commands and data extracts.'
  signature: 'commandOutputSettings: CommandOutputSettings'
- uid: azure.mgmt.networkcloud.types.ClusterPatchProperties.computeDeploymentThreshold
  name: computeDeploymentThreshold
  summary: 'The validation threshold indicating the allowable failures of compute
    machines during

    environment validation and deployment.'
  signature: 'computeDeploymentThreshold: ValidationThresholdPatch'
- uid: azure.mgmt.networkcloud.types.ClusterPatchProperties.computeRackDefinitions
  name: computeRackDefinitions
  summary: 'The list of rack definitions for the compute racks in a multi-rack cluster,
    or an empty list in

    a single-rack cluster.'
  signature: 'computeRackDefinitions: list[azure.mgmt.networkcloud.types.RackDefinitionPatch]'
- uid: azure.mgmt.networkcloud.types.ClusterPatchProperties.runtimeProtectionConfiguration
  name: runtimeProtectionConfiguration
  summary: The settings for cluster runtime protection.
  signature: 'runtimeProtectionConfiguration: RuntimeProtectionConfigurationPatch'
- uid: azure.mgmt.networkcloud.types.ClusterPatchProperties.secretArchive
  name: secretArchive
  summary: The configuration for use of a key vault to store secrets for later retrieval
    by the operator.
  signature: 'secretArchive: ClusterSecretArchivePatch'
- uid: azure.mgmt.networkcloud.types.ClusterPatchProperties.secretArchiveSettings
  name: secretArchiveSettings
  summary: The settings for the secret archive used to hold credentials for the cluster.
  signature: 'secretArchiveSettings: SecretArchiveSettings'
- uid: azure.mgmt.networkcloud.types.ClusterPatchProperties.updateStrategy
  name: updateStrategy
  summary: The strategy for updating the cluster.
  signature: 'updateStrategy: ClusterUpdateStrategyPatch'
- uid: azure.mgmt.networkcloud.types.ClusterPatchProperties.vulnerabilityScanningSettings
  name: vulnerabilityScanningSettings
  summary: The settings for how security vulnerability scanning is applied to the
    cluster.
  signature: 'vulnerabilityScanningSettings: VulnerabilityScanningSettingsPatch'
