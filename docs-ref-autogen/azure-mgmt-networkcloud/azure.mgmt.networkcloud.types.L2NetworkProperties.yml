### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.L2NetworkProperties
name: L2NetworkProperties
fullName: azure.mgmt.networkcloud.types.L2NetworkProperties
module: azure.mgmt.networkcloud.types
summary: L2NetworkProperties represents properties of the L2 network.
constructor:
  syntax: L2NetworkProperties()
variables:
- description: 'Field Deprecated. The field was previously optional, now it will

    have no defined behavior and will be ignored. The network plugin type for Hybrid
    AKS. Known

    values are: "DPDK", "SRIOV", and "OSDevice".'
  name: hybrid_aks_plugin_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HybridAksPluginType">]
- description: 'The default interface name for this L2 network in the virtual machine.

    This name can be overridden by the name supplied in the network attachment configuration
    of

    that virtual machine.'
  name: interface_name
  types:
  - <xref:str>
- description: 'The resource ID of the Network Fabric l2IsolationDomain.

    Required.'
  name: l2_isolation_domain_id
  types:
  - <xref:str>
- description: 'The list of resource IDs for the other Microsoft.NetworkCloud

    resources that have attached this network.'
  name: associated_resource_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The resource ID of the Network Cloud cluster this L2 network is associated

    with.'
  name: cluster_id
  types:
  - <xref:str>
- description: 'The more detailed status of the L2 network. Known values are: "Error",

    "Available", and "Provisioning".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"L2NetworkDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: 'Field Deprecated. These fields will be empty/omitted.

    The list of Hybrid AKS cluster resource ID(s) that are associated with this L2
    network.'
  name: hybrid_aks_clusters_associated_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'Field Deprecated. These fields will be empty/omitted.

    The list of virtual machine resource ID(s), excluding any Hybrid AKS virtual machines,
    that are

    currently using this L2 network.'
  name: virtual_machines_associated_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The provisioning state of the L2 network. Known values are:

    "Succeeded", "Failed", "Canceled", "Provisioning", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"L2NetworkProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.L2NetworkProperties.associatedResourceIds
  name: associatedResourceIds
  summary: 'The list of resource IDs for the other Microsoft.NetworkCloud resources
    that have attached this

    network.'
  signature: 'associatedResourceIds: list[str]'
- uid: azure.mgmt.networkcloud.types.L2NetworkProperties.clusterId
  name: clusterId
  summary: The resource ID of the Network Cloud cluster this L2 network is associated
    with.
  signature: 'clusterId: str'
- uid: azure.mgmt.networkcloud.types.L2NetworkProperties.detailedStatus
  name: detailedStatus
  summary: '"Error", "Available", and

    "Provisioning".'
  signature: 'detailedStatus: str | L2NetworkDetailedStatus'
- uid: azure.mgmt.networkcloud.types.L2NetworkProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.L2NetworkProperties.hybridAksClustersAssociatedIds
  name: hybridAksClustersAssociatedIds
  summary: 'Field Deprecated. These fields will be empty/omitted. The list of Hybrid
    AKS cluster resource

    ID(s) that are associated with this L2 network.'
  signature: 'hybridAksClustersAssociatedIds: list[str]'
- uid: azure.mgmt.networkcloud.types.L2NetworkProperties.hybridAksPluginType
  name: hybridAksPluginType
  summary: 'Field Deprecated. The field was previously optional, now it will have
    no defined behavior and

    will be ignored. The network plugin type for Hybrid AKS. Known values are: "DPDK",
    "SRIOV",

    and "OSDevice".'
  signature: 'hybridAksPluginType: str | HybridAksPluginType'
- uid: azure.mgmt.networkcloud.types.L2NetworkProperties.interfaceName
  name: interfaceName
  summary: 'The default interface name for this L2 network in the virtual machine.
    This name can be

    overridden by the name supplied in the network attachment configuration of that
    virtual

    machine.'
  signature: 'interfaceName: str'
- uid: azure.mgmt.networkcloud.types.L2NetworkProperties.l2IsolationDomainId
  name: l2IsolationDomainId
  summary: The resource ID of the Network Fabric l2IsolationDomain. Required.
  signature: 'l2IsolationDomainId: Required[str]'
- uid: azure.mgmt.networkcloud.types.L2NetworkProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Provisioning", and "Accepted".'
  signature: 'provisioningState: str | L2NetworkProvisioningState'
- uid: azure.mgmt.networkcloud.types.L2NetworkProperties.virtualMachinesAssociatedIds
  name: virtualMachinesAssociatedIds
  summary: 'Field Deprecated. These fields will be empty/omitted. The list of virtual
    machine resource

    ID(s), excluding any Hybrid AKS virtual machines, that are currently using this
    L2 network.'
  signature: 'virtualMachinesAssociatedIds: list[str]'
