  name: availabilityZone
  summary: The availability zone this node is running within.
  signature: 'availabilityZone: str'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.bareMetalMachineId
  name: bareMetalMachineId
  summary: The resource ID of the bare metal machine that hosts this node.
  signature: 'bareMetalMachineId: str'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.cpuCores
  name: cpuCores
  summary: The number of CPU cores configured for this node, derived from the VM SKU
    specified.
  signature: 'cpuCores: int'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.detailedStatus
  name: detailedStatus
  summary: '"Available", "Error", "Provisioning",

    "Running", "Scheduling", "Stopped", "Terminating", and "Unknown".'
  signature: 'detailedStatus: str | KubernetesClusterNodeDetailedStatus'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.diskSizeGB
  name: diskSizeGB
  summary: The size of the disk configured for this node. Allocations are measured
    in gibibytes.
  signature: 'diskSizeGB: int'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.image
  name: image
  summary: The machine image used to deploy this node.
  signature: 'image: str'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.kubernetesVersion
  name: kubernetesVersion
  summary: The currently running version of Kubernetes and bundled features running
