  signature: 'labels: list[''KubernetesLabel'']'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.memorySizeGB
  name: memorySizeGB
  summary: 'The amount of memory configured for this node, derived from the vm SKU
    specified. Allocations

    are measured in gibibytes.'
  signature: 'memorySizeGB: int'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.mode
  name: mode
  summary: 'The mode of the agent pool containing this node. Not applicable for control
    plane nodes. Known

    values are: "System", "User", and "NotApplicable".'
  signature: 'mode: str | AgentPoolMode'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.name
  name: name
  summary: The name of this node, as realized in the Kubernetes cluster.
  signature: 'name: str'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.networkAttachments
  name: networkAttachments
  summary: The NetworkAttachments made to this node.
  signature: 'networkAttachments: list[''NetworkAttachment'']'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.powerState
  name: powerState
  summary: '"On", "Off", and "Unknown".'
  signature: 'powerState: str | KubernetesNodePowerState'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.role
  name: role
  summary: '"ControlPlane" and "Worker".'
  signature: 'role: str | KubernetesNodeRole'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.taints
  name: taints
  summary: The list of taints that have been assigned to the agent pool containing
    this node.
  signature: 'taints: list[''KubernetesLabel'']'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterNode.vmSkuName
  name: vmSkuName
  summary: The VM SKU name that was used to create this cluster node.
  signature: 'vmSkuName: str'
