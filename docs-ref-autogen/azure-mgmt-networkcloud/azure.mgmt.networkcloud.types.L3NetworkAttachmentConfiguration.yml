### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.L3NetworkAttachmentConfiguration
name: L3NetworkAttachmentConfiguration
fullName: azure.mgmt.networkcloud.types.L3NetworkAttachmentConfiguration
module: azure.mgmt.networkcloud.types
summary: 'L3NetworkAttachmentConfiguration represents the configuration of the attachment
  of a Layer 3

  network.'
constructor:
  syntax: L3NetworkAttachmentConfiguration()
variables:
- description: 'The indication of whether this network will or will not perform IP
    address

    management and allocate IP addresses when attached. Known values are: "True" and
    "False".'
  name: ipam_enabled
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"L3NetworkConfigurationIpamEnabled">]
- description: 'The resource ID of the network that is being configured for attachment.

    Required.'
  name: network_id
  types:
  - <xref:str>
- description: 'The indicator of how this network will be utilized by the Kubernetes

    cluster. Known values are: "DPDK", "SRIOV", "OSDevice", "MACVLAN", and "IPVLAN".'
  name: plugin_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KubernetesPluginType">]
attributes:
- uid: azure.mgmt.networkcloud.types.L3NetworkAttachmentConfiguration.ipamEnabled
  name: ipamEnabled
  summary: 'The indication of whether this network will or will not perform IP address
    management and

    allocate IP addresses when attached. Known values are: "True" and "False".'
  signature: 'ipamEnabled: str | L3NetworkConfigurationIpamEnabled'
- uid: azure.mgmt.networkcloud.types.L3NetworkAttachmentConfiguration.networkId
  name: networkId
  summary: The resource ID of the network that is being configured for attachment.
    Required.
  signature: 'networkId: Required[str]'
- uid: azure.mgmt.networkcloud.types.L3NetworkAttachmentConfiguration.pluginType
  name: pluginType
  summary: 'The indicator of how this network will be utilized by the Kubernetes cluster.
    Known values are:

    "DPDK", "SRIOV", "OSDevice", "MACVLAN", and "IPVLAN".'
  signature: 'pluginType: str | KubernetesPluginType'
