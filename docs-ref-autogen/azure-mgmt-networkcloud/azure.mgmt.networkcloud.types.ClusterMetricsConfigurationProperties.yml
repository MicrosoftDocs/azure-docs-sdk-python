### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ClusterMetricsConfigurationProperties
name: ClusterMetricsConfigurationProperties
fullName: azure.mgmt.networkcloud.types.ClusterMetricsConfigurationProperties
module: azure.mgmt.networkcloud.types
summary: 'ClusterMetricsConfigurationProperties represents the properties of metrics
  configuration for

  the cluster.'
constructor:
  syntax: ClusterMetricsConfigurationProperties()
variables:
- description: 'The list of metric names that have been chosen to be enabled in addition

    to the core set of enabled metrics.'
  name: enabled_metrics
  types:
  - <xref:list>[<xref:str>]
- description: 'The interval in minutes by which metrics will be collected.

    Required.'
  name: collection_interval
  types:
  - <xref:int>
- description: 'The more detailed status of the metrics configuration. Known values
    are:

    "Processing", "Applied", and "Error".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterMetricsConfigurationDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: 'The list of metrics that are available for the cluster but disabled
    at

    the moment.'
  name: disabled_metrics
  types:
  - <xref:list>[<xref:str>]
- description: 'The provisioning state of the metrics configuration. Known values

    are: "Succeeded", "Failed", "Canceled", "Accepted", and "Provisioning".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterMetricsConfigurationProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.ClusterMetricsConfigurationProperties.collectionInterval
  name: collectionInterval
  summary: The interval in minutes by which metrics will be collected. Required.
  signature: 'collectionInterval: Required[int]'
- uid: azure.mgmt.networkcloud.types.ClusterMetricsConfigurationProperties.detailedStatus
  name: detailedStatus
  summary: '"Processing",

    "Applied", and "Error".'
  signature: 'detailedStatus: str | ClusterMetricsConfigurationDetailedStatus'
- uid: azure.mgmt.networkcloud.types.ClusterMetricsConfigurationProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.ClusterMetricsConfigurationProperties.disabledMetrics
  name: disabledMetrics
  summary: The list of metrics that are available for the cluster but disabled at
    the moment.
  signature: 'disabledMetrics: list[str]'
- uid: azure.mgmt.networkcloud.types.ClusterMetricsConfigurationProperties.enabledMetrics
  name: enabledMetrics
  summary: 'The list of metric names that have been chosen to be enabled in addition
    to the core set of

    enabled metrics.'
  signature: 'enabledMetrics: list[str]'
- uid: azure.mgmt.networkcloud.types.ClusterMetricsConfigurationProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Accepted", and "Provisioning".'
  signature: 'provisioningState: str | ClusterMetricsConfigurationProvisioningState'
