### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.BgpAdvertisement
name: BgpAdvertisement
fullName: azure.mgmt.networkcloud.types.BgpAdvertisement
module: azure.mgmt.networkcloud.types
summary: BgpAdvertisement represents the association of IP address pools to the communities
  and peers.
constructor:
  syntax: BgpAdvertisement()
variables:
- description: 'The indicator of if this advertisement is also made to the network

    fabric associated with the Network Cloud Cluster. This field is ignored if fabricPeeringEnabled

    is set to False. Known values are: "True" and "False".'
  name: advertise_to_fabric
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AdvertiseToFabric">]
- description: 'The names of the BGP communities to be associated with the announcement,

    utilizing a BGP community string in 1234:1234 format.'
  name: communities
  types:
  - <xref:list>[<xref:str>]
- description: 'The names of the IP address pools associated with this announcement.

    Required.'
  name: ip_address_pools
  types:
  - <xref:list>[<xref:str>]
- description: 'The names of the BGP peers to limit this advertisement to. If no values
    are

    specified, all BGP peers will receive this advertisement.'
  name: peers
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.networkcloud.types.BgpAdvertisement.advertiseToFabric
  name: advertiseToFabric
  summary: 'The indicator of if this advertisement is also made to the network fabric
    associated with the

    Network Cloud Cluster. This field is ignored if fabricPeeringEnabled is set to
    False. Known

    values are: "True" and "False".'
  signature: 'advertiseToFabric: str | AdvertiseToFabric'
- uid: azure.mgmt.networkcloud.types.BgpAdvertisement.communities
  name: communities
  summary: 'The names of the BGP communities to be associated with the announcement,
    utilizing a BGP

    community string in 1234:1234 format.'
  signature: 'communities: list[str]'
- uid: azure.mgmt.networkcloud.types.BgpAdvertisement.ipAddressPools
  name: ipAddressPools
  summary: The names of the IP address pools associated with this announcement. Required.
  signature: 'ipAddressPools: Required[list[str]]'
- uid: azure.mgmt.networkcloud.types.BgpAdvertisement.peers
  name: peers
  summary: 'The names of the BGP peers to limit this advertisement to. If no values
    are specified, all BGP

    peers will receive this advertisement.'
  signature: 'peers: list[str]'
