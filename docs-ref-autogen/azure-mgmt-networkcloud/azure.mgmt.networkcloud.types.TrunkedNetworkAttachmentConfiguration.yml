### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.TrunkedNetworkAttachmentConfiguration
name: TrunkedNetworkAttachmentConfiguration
fullName: azure.mgmt.networkcloud.types.TrunkedNetworkAttachmentConfiguration
module: azure.mgmt.networkcloud.types
summary: 'TrunkedNetworkAttachmentConfiguration represents the configuration of the
  attachment of a

  trunked network.'
constructor:
  syntax: TrunkedNetworkAttachmentConfiguration()
variables:
- description: 'The resource ID of the network that is being configured for attachment.

    Required.'
  name: network_id
  types:
  - <xref:str>
- description: 'The indicator of how this network will be utilized by the Kubernetes

    cluster. Known values are: "DPDK", "SRIOV", "OSDevice", "MACVLAN", and "IPVLAN".'
  name: plugin_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KubernetesPluginType">]
attributes:
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkAttachmentConfiguration.networkId
  name: networkId
  summary: The resource ID of the network that is being configured for attachment.
    Required.
  signature: 'networkId: Required[str]'
- uid: azure.mgmt.networkcloud.types.TrunkedNetworkAttachmentConfiguration.pluginType
  name: pluginType
  summary: 'The indicator of how this network will be utilized by the Kubernetes cluster.
    Known values are:

    "DPDK", "SRIOV", "OSDevice", "MACVLAN", and "IPVLAN".'
  signature: 'pluginType: str | KubernetesPluginType'
