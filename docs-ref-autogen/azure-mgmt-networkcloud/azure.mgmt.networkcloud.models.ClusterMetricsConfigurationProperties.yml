- uid: azure.mgmt.networkcloud.models.ClusterMetricsConfigurationProperties.detailed_status
  name: detailed_status
  summary: '"Processing",

    "Applied", and "Error".'
  signature: 'detailed_status: str | _models.ClusterMetricsConfigurationDetailedStatus
    | None'
- uid: azure.mgmt.networkcloud.models.ClusterMetricsConfigurationProperties.detailed_status_message
  name: detailed_status_message
  summary: The descriptive message about the current detailed status.
  signature: 'detailed_status_message: str | None'
- uid: azure.mgmt.networkcloud.models.ClusterMetricsConfigurationProperties.disabled_metrics
  name: disabled_metrics
