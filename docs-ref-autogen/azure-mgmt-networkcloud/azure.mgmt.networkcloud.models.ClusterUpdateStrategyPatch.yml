variables:
- description: 'The maximum number of worker nodes that can be offline within the

    increment of update, e.g., rack-by-rack. Limited by the maximum number of machines
    in the

    increment. Defaults to the whole increment size.'
  name: max_unavailable
  types:
  - <xref:int>
- description: 'The mode of operation for runtime protection. Known values are: "Rack"
    and

    "PauseAfterRack".'
  name: strategy_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.networkcloud.models.ClusterUpdateStrategyType>
- description: 'Selection of how the threshold should be evaluated. Known values are:

    "CountSuccess" and "PercentSuccess".'
  name: threshold_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.networkcloud.models.ValidationThresholdType>
- description: The numeric threshold value.
  name: threshold_value
  types:
  - <xref:int>
- description: 'The time to wait between the increments of update defined by the

    strategy.'
  name: wait_time_minutes
  types:
  - <xref:int>
