### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.StepState
name: StepState
fullName: azure.mgmt.networkcloud.types.StepState
module: azure.mgmt.networkcloud.types
summary: StepState represents the state of a step in an action.
constructor:
  syntax: StepState()
variables:
- description: 'The timestamp for when processing of the step reached its terminal
    state, in

    ISO 8601 format.'
  name: end_time
  types:
  - <xref:str>
- description: 'The message providing additional context for the status value. May
    be empty, or

    contain diagnostic information in the case of a failure.'
  name: message
  types:
  - <xref:str>
- description: The timestamp for when processing of the step began, in ISO 8601 format.
  name: start_time
  types:
  - <xref:str>
- description: 'The status of the step. A value of Completed or Failed indicates a
    terminal state

    for the step. Known values are: "Completed", "InProgress", "Failed", and "NotStarted".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StepStateStatus">]
- description: The name for the step.
  name: step_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.types.StepState.endTime
  name: endTime
  summary: The timestamp for when processing of the step reached its terminal state,
    in ISO 8601 format.
  signature: 'endTime: str'
- uid: azure.mgmt.networkcloud.types.StepState.message
  name: message
  summary: 'The message providing additional context for the status value. May be
    empty, or contain

    diagnostic information in the case of a failure.'
  signature: 'message: str'
- uid: azure.mgmt.networkcloud.types.StepState.startTime
  name: startTime
  summary: The timestamp for when processing of the step began, in ISO 8601 format.
  signature: 'startTime: str'
- uid: azure.mgmt.networkcloud.types.StepState.status
  name: status
  summary: 'The status of the step. A value of Completed or Failed indicates a terminal
    state for the step.

    Known values are: "Completed", "InProgress", "Failed", and "NotStarted".'
  signature: 'status: str | StepStateStatus'
- uid: azure.mgmt.networkcloud.types.StepState.stepName
  name: stepName
  summary: The name for the step.
  signature: 'stepName: str'
