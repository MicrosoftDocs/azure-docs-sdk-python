uid: azure.mgmt.networkcloud.types.EgressEndpoint
name: EgressEndpoint
fullName: azure.mgmt.networkcloud.types.EgressEndpoint
module: azure.mgmt.networkcloud.types
summary: 'EgressEndpoint represents the connection from a cloud services network to
  the specified

  endpoint for a common purpose.'
constructor:
  syntax: EgressEndpoint()
variables:
- description: 'The descriptive category name of endpoints accessible by the AKS agent
    node.

    For example, azure-resource-management, API server, etc. The platform egress endpoints
    provided

    by default will use the category ''default''. Required.'
  name: category
  types:
  - <xref:str>
- description: The list of endpoint dependencies. Required.
  name: endpoints
  types:
  - <xref:list>[<xref:"EndpointDependency">]
attributes:
- uid: azure.mgmt.networkcloud.types.EgressEndpoint.category
  name: category
  summary: 'The descriptive category name of endpoints accessible by the AKS agent
    node. For example,

    azure-resource-management, API server, etc. The platform egress endpoints provided
    by default

    will use the category ''default''. Required.'
  signature: 'category: str'
- uid: azure.mgmt.networkcloud.types.EgressEndpoint.endpoints
  name: endpoints
  summary: The list of endpoint dependencies. Required.
  signature: 'endpoints: list[azure.mgmt.networkcloud.types.EndpointDependency]'
