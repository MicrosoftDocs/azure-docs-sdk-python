### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.RuntimeProtectionStatus
name: RuntimeProtectionStatus
fullName: azure.mgmt.networkcloud.types.RuntimeProtectionStatus
module: azure.mgmt.networkcloud.types
summary: RuntimeProtectionStatus represents the runtime protection status of the bare
  metal machine.
constructor:
  syntax: RuntimeProtectionStatus()
variables:
- description: 'The runtime protection agent health status. Known values are:

    "Healthy" and "Unhealthy".'
  name: agent_health_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RuntimeProtectionAgentHealthStatus">]
- description: 'The runtime protection agent health status issues, if

    present.'
  name: agent_health_status_issues
  types:
  - <xref:list>[<xref:str>]
- description: 'The runtime protection agent license status. Known values are:

    "Licensed" and "Unlicensed".'
  name: agent_license_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RuntimeProtectionAgentLicenseStatus">]
- description: 'The definition update mode for runtime protection. Known values

    are: "Automatic" and "None".'
  name: definition_update_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RuntimeProtectionDefinitionUpdateMode">]
- description: The timestamp when the malware definitions were last updated.
  name: definitions_last_updated
  types:
  - <xref:str>
- description: The version of the malware definitions.
  name: definitions_version
  types:
  - <xref:str>
- description: 'The enforcement level set for the runtime protection on the bare metal

    machine. Known values are: "Audit", "Disabled", "OnDemand", "Passive", and "RealTime".'
  name: enforcement_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RuntimeProtectionEnforcementLevel">]
- description: 'The timestamp of the most recently completed scan, or empty if there

    has never been a scan.'
  name: scan_completed_time
  types:
  - <xref:str>
- description: 'The timestamp of the most recently scheduled scan, or empty if no

    scan has been scheduled.'
  name: scan_scheduled_time
  types:
  - <xref:str>
- description: 'The timestamp of the most recently started scan, or empty if there
    has

    never been a scan.'
  name: scan_started_time
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.types.RuntimeProtectionStatus.agentHealthStatus
  name: agentHealthStatus
  summary: '"Healthy" and "Unhealthy".'
  signature: 'agentHealthStatus: str | RuntimeProtectionAgentHealthStatus'
- uid: azure.mgmt.networkcloud.types.RuntimeProtectionStatus.agentHealthStatusIssues
  name: agentHealthStatusIssues
  summary: The runtime protection agent health status issues, if present.
  signature: 'agentHealthStatusIssues: list[str]'
- uid: azure.mgmt.networkcloud.types.RuntimeProtectionStatus.agentLicenseStatus
  name: agentLicenseStatus
  summary: '"Licensed" and "Unlicensed".'
  signature: 'agentLicenseStatus: str | RuntimeProtectionAgentLicenseStatus'
- uid: azure.mgmt.networkcloud.types.RuntimeProtectionStatus.definitionUpdateMode
  name: definitionUpdateMode
  summary: '"Automatic" and

    "None".'
  signature: 'definitionUpdateMode: str | RuntimeProtectionDefinitionUpdateMode'
- uid: azure.mgmt.networkcloud.types.RuntimeProtectionStatus.definitionsLastUpdated
  name: definitionsLastUpdated
  summary: The timestamp when the malware definitions were last updated.
  signature: 'definitionsLastUpdated: str'
- uid: azure.mgmt.networkcloud.types.RuntimeProtectionStatus.definitionsVersion
  name: definitionsVersion
  summary: The version of the malware definitions.
  signature: 'definitionsVersion: str'
- uid: azure.mgmt.networkcloud.types.RuntimeProtectionStatus.enforcementLevel
  name: enforcementLevel
  summary: 'The enforcement level set for the runtime protection on the bare metal
    machine. Known values

    are: "Audit", "Disabled", "OnDemand", "Passive", and "RealTime".'
  signature: 'enforcementLevel: str | RuntimeProtectionEnforcementLevel'
- uid: azure.mgmt.networkcloud.types.RuntimeProtectionStatus.scanCompletedTime
  name: scanCompletedTime
  summary: The timestamp of the most recently completed scan, or empty if there has
    never been a scan.
  signature: 'scanCompletedTime: str'
- uid: azure.mgmt.networkcloud.types.RuntimeProtectionStatus.scanScheduledTime
  name: scanScheduledTime
  summary: The timestamp of the most recently scheduled scan, or empty if no scan
    has been scheduled.
  signature: 'scanScheduledTime: str'
- uid: azure.mgmt.networkcloud.types.RuntimeProtectionStatus.scanStartedTime
  name: scanStartedTime
  summary: The timestamp of the most recently started scan, or empty if there has
    never been a scan.
  signature: 'scanStartedTime: str'
