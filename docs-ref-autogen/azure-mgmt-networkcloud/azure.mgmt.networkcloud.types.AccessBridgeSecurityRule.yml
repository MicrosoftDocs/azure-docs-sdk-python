### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.AccessBridgeSecurityRule
name: AccessBridgeSecurityRule
fullName: azure.mgmt.networkcloud.types.AccessBridgeSecurityRule
module: azure.mgmt.networkcloud.types
summary: AccessBridgeSecurityRule captures an individual access rule enforced by the
  bridge.
constructor:
  syntax: AccessBridgeSecurityRule()
variables:
- description: The user provided value describing this rule.
  name: description
  types:
  - <xref:str>
- description: 'The direction of allowed network traffic based on the rule. Required.
    Known

    values are: "Inbound" and "Outbound".'
  name: direction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityRuleDirection">]
- description: 'The set of IPv4 addresses permitted as the source or destination of
    the

    security rule. For as single address, utilize a /32 (CIDR notation). One or both
    Ipv4Addresses

    and Ipv6Addresses must be specified. Example formats: 10.10.10.10-10.10.10.20
    or

    10.10.10.10/24.'
  name: ipv4_addresses
  types:
  - <xref:list>[<xref:str>]
- description: 'The set of IPv6 addresses permitted as the source or destination of
    the

    security rule. For as single address, utilize a /128 (CIDR notation). One or both
    Ipv4Addresses

    and Ipv6Addresses must be specified. Example formats: 2001:db8:abcd::1-2001:db8:abcd::ff
    or

    2001:db8:abcd::1/64.'
  name: ipv6_addresses
  types:
  - <xref:list>[<xref:str>]
- description: 'The source or destination port or port range. Example 24562 or 24562-24570.

    Required.'
  name: port
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.types.AccessBridgeSecurityRule.description
  name: description
  summary: The user provided value describing this rule.
  signature: 'description: str'
- uid: azure.mgmt.networkcloud.types.AccessBridgeSecurityRule.direction
  name: direction
  summary: 'The direction of allowed network traffic based on the rule. Required.
    Known values are:

    "Inbound" and "Outbound".'
  signature: 'direction: Required[str | SecurityRuleDirection]'
- uid: azure.mgmt.networkcloud.types.AccessBridgeSecurityRule.ipv4Addresses
  name: ipv4Addresses
  summary: 'The set of IPv4 addresses permitted as the source or destination of the
    security rule. For as

    single address, utilize a /32 (CIDR notation). One or both Ipv4Addresses and Ipv6Addresses
    must

    be specified. Example formats: 10.10.10.10-10.10.10.20 or 10.10.10.10/24.'
  signature: 'ipv4Addresses: list[str]'
- uid: azure.mgmt.networkcloud.types.AccessBridgeSecurityRule.ipv6Addresses
  name: ipv6Addresses
  summary: 'The set of IPv6 addresses permitted as the source or destination of the
    security rule. For as

    single address, utilize a /128 (CIDR notation). One or both Ipv4Addresses and
    Ipv6Addresses

    must be specified. Example formats: 2001:db8:abcd::1-2001:db8:abcd::ff or 2001:db8:abcd::1/64.'
  signature: 'ipv6Addresses: list[str]'
- uid: azure.mgmt.networkcloud.types.AccessBridgeSecurityRule.port
  name: port
  summary: The source or destination port or port range. Example 24562 or 24562-24570.
    Required.
  signature: 'port: Required[str]'
