### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ActionState
name: ActionState
fullName: azure.mgmt.networkcloud.types.ActionState
module: azure.mgmt.networkcloud.types
summary: 'ActionState represents the state of an action taken against a resource.
  This can be used to

  represent both explicitly and implicitly defined action types.'
constructor:
  syntax: ActionState()
variables:
- description: 'The representation of the action for which this is a status. Matches
    ARM

    resource action format when the action is an ARM-based action.'
  name: action_type
  types:
  - <xref:str>
- description: 'The correlation ID for the original action request. Omitted if there
    is

    no related correlation ID.'
  name: correlation_id
  types:
  - <xref:str>
- description: 'The timestamp of when the action reached its final, terminal state.
    Uses ISO

    8601 format.'
  name: end_time
  types:
  - <xref:str>
- description: 'The description providing additional context for the status value.
    May be empty

    or contain guidance in the case of a failure.'
  name: message
  types:
  - <xref:str>
- description: The timestamp of when the action began, in ISO 8601 format.
  name: start_time
  types:
  - <xref:str>
- description: 'The status of the action. Known values are: "Completed", "InProgress",
    and

    "Failed".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActionStateStatus">]
- description: The ordered list of the individual steps which make up the action.
  name: step_states
  types:
  - <xref:list>[<xref:"StepState">]
attributes:
- uid: azure.mgmt.networkcloud.types.ActionState.actionType
  name: actionType
  summary: 'The representation of the action for which this is a status. Matches ARM
    resource action format

    when the action is an ARM-based action.'
  signature: 'actionType: str'
- uid: azure.mgmt.networkcloud.types.ActionState.correlationId
  name: correlationId
  summary: 'The correlation ID for the original action request. Omitted if there is
    no related correlation

    ID.'
  signature: 'correlationId: str'
- uid: azure.mgmt.networkcloud.types.ActionState.endTime
  name: endTime
  summary: The timestamp of when the action reached its final, terminal state. Uses
    ISO 8601 format.
  signature: 'endTime: str'
- uid: azure.mgmt.networkcloud.types.ActionState.message
  name: message
  summary: 'The description providing additional context for the status value. May
    be empty or contain

    guidance in the case of a failure.'
  signature: 'message: str'
- uid: azure.mgmt.networkcloud.types.ActionState.startTime
  name: startTime
  summary: The timestamp of when the action began, in ISO 8601 format.
  signature: 'startTime: str'
- uid: azure.mgmt.networkcloud.types.ActionState.status
  name: status
  summary: '"Completed", "InProgress", and "Failed".'
  signature: 'status: str | ActionStateStatus'
- uid: azure.mgmt.networkcloud.types.ActionState.stepStates
  name: stepStates
  summary: The ordered list of the individual steps which make up the action.
  signature: 'stepStates: list[''StepState'']'
