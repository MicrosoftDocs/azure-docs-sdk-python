### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.BareMetalMachineRunDataExtractsParameters
name: BareMetalMachineRunDataExtractsParameters
fullName: azure.mgmt.networkcloud.types.BareMetalMachineRunDataExtractsParameters
module: azure.mgmt.networkcloud.types
summary: 'BareMetalMachineRunDataExtractsParameters represents the body of request
  containing list of

  curated data extraction commands to run on the bare metal machine.'
constructor:
  syntax: BareMetalMachineRunDataExtractsParameters()
variables:
- description: 'The list of curated data extraction commands to be executed directly
    against

    the target machine. Required.'
  name: commands
  types:
  - <xref:list>[<xref:"BareMetalMachineCommandSpecification">]
- description: 'The maximum time the commands are allowed to run. If the execution

    time exceeds the maximum, the script will be stopped, any output produced until
    then will be

    captured, and the exit code matching a timeout will be returned (252). Required.'
  name: limit_time_seconds
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.networkcloud.types.BareMetalMachineRunDataExtractsParameters.commands
  name: commands
  summary: 'The list of curated data extraction commands to be executed directly against
    the target

    machine. Required.'
  signature: 'commands: list[azure.mgmt.networkcloud.types.BareMetalMachineCommandSpecification]'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineRunDataExtractsParameters.limitTimeSeconds
  name: limitTimeSeconds
  summary: 'The maximum time the commands are allowed to run. If the execution time
    exceeds the maximum,

    the script will be stopped, any output produced until then will be captured, and
    the exit code

    matching a timeout will be returned (252). Required.'
  signature: 'limitTimeSeconds: int'
