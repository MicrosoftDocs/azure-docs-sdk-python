### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ClusterManagerProperties
name: ClusterManagerProperties
fullName: azure.mgmt.networkcloud.types.ClusterManagerProperties
module: azure.mgmt.networkcloud.types
summary: ClusterManagerProperties represents the properties of a cluster manager.
constructor:
  syntax: ClusterManagerProperties()
variables:
- description: 'The resource ID of the Log Analytics workspace that is used for

    the logs collection.'
  name: analytics_workspace_id
  types:
  - <xref:str>
- description: 'The Azure availability zones within the region that will be used to

    support the cluster manager resource.'
  name: availability_zones
  types:
  - <xref:list>[<xref:str>]
- description: 'The list of the cluster versions the manager supports. It is used
    as

    input in clusterVersion property of a cluster resource.'
  name: cluster_versions
  types:
  - <xref:list>[<xref:"ClusterAvailableVersion">]
- description: 'The detailed status that provides additional information about the

    cluster manager. Known values are: "Error", "Available", "Provisioning", "ProvisioningFailed",

    "Updating", and "UpdateFailed".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterManagerDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: 'The resource ID of the fabric controller that has one to one

    mapping with the cluster manager. Required.'
  name: fabric_controller_id
  types:
  - <xref:str>
- description: 'The configuration of the managed resource group

    associated with the resource.'
  name: managed_resource_group_configuration
  types:
  - <xref:<xref:"ManagedResourceGroupConfiguration">>
- description: 'The extended location (custom location) that represents the

    cluster manager''s control plane location. This extended location is used when
    creating cluster

    and rack manifest resources.'
  name: manager_extended_location
  types:
  - <xref:<xref:"ExtendedLocation">>
- description: 'The provisioning state of the cluster manager. Known values are:

    "Succeeded", "Failed", "Canceled", "Provisioning", "Accepted", and "Updating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterManagerProvisioningState">]
- description: The relay configuration for the cluster manager.
  name: relay_configuration
  types:
  - <xref:<xref:"ClusterManagerRelayConfiguration">>
- description: 'The size of the Azure virtual machines to use for hosting the cluster
    manager

    resource.'
  name: vm_size
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.types.ClusterManagerProperties.analyticsWorkspaceId
  name: analyticsWorkspaceId
  summary: The resource ID of the Log Analytics workspace that is used for the logs
    collection.
  signature: 'analyticsWorkspaceId: str'
- uid: azure.mgmt.networkcloud.types.ClusterManagerProperties.availabilityZones
  name: availabilityZones
  summary: 'The Azure availability zones within the region that will be used to support
    the cluster manager

    resource.'
  signature: 'availabilityZones: list[str]'
- uid: azure.mgmt.networkcloud.types.ClusterManagerProperties.clusterVersions
  name: clusterVersions
  summary: 'The list of the cluster versions the manager supports. It is used as input
    in clusterVersion

    property of a cluster resource.'
  signature: 'clusterVersions: list[''ClusterAvailableVersion'']'
- uid: azure.mgmt.networkcloud.types.ClusterManagerProperties.detailedStatus
  name: detailedStatus
  summary: 'The detailed status that provides additional information about the cluster
    manager. Known

    values are: "Error", "Available", "Provisioning", "ProvisioningFailed", "Updating",

    and "UpdateFailed".'
  signature: 'detailedStatus: str | ClusterManagerDetailedStatus'
- uid: azure.mgmt.networkcloud.types.ClusterManagerProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.ClusterManagerProperties.fabricControllerId
  name: fabricControllerId
  summary: 'The resource ID of the fabric controller that has one to one mapping with
    the cluster manager.

    Required.'
  signature: 'fabricControllerId: Required[str]'
- uid: azure.mgmt.networkcloud.types.ClusterManagerProperties.managedResourceGroupConfiguration
  name: managedResourceGroupConfiguration
  summary: The configuration of the managed resource group associated with the resource.
  signature: 'managedResourceGroupConfiguration: ManagedResourceGroupConfiguration'
- uid: azure.mgmt.networkcloud.types.ClusterManagerProperties.managerExtendedLocation
  name: managerExtendedLocation
  summary: 'The extended location (custom location) that represents the cluster manager''s
    control plane

    location. This extended location is used when creating cluster and rack manifest
    resources.'
  signature: 'managerExtendedLocation: ExtendedLocation'
- uid: azure.mgmt.networkcloud.types.ClusterManagerProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Provisioning", "Accepted", and "Updating".'
  signature: 'provisioningState: str | ClusterManagerProvisioningState'
- uid: azure.mgmt.networkcloud.types.ClusterManagerProperties.relayConfiguration
  name: relayConfiguration
  summary: The relay configuration for the cluster manager.
  signature: 'relayConfiguration: ClusterManagerRelayConfiguration'
- uid: azure.mgmt.networkcloud.types.ClusterManagerProperties.vmSize
  name: vmSize
  summary: The size of the Azure virtual machines to use for hosting the cluster manager
    resource.
  signature: 'vmSize: str'
