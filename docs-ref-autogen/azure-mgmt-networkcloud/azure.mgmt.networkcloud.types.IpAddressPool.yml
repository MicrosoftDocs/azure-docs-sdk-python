### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.IpAddressPool
name: IpAddressPool
fullName: azure.mgmt.networkcloud.types.IpAddressPool
module: azure.mgmt.networkcloud.types
summary: IpAddressPool represents a pool of IP addresses that can be allocated to
  a service.
constructor:
  syntax: IpAddressPool()
variables:
- description: 'The list of IP address ranges. Each range can be a either a subnet
    in CIDR

    format or an explicit start-end range of IP addresses. For a BGP service load
    balancer

    configuration, only CIDR format is supported and excludes /32 (IPv4) and /128
    (IPv6) prefixes.

    Required.'
  name: addresses
  types:
  - <xref:list>[<xref:str>]
- description: 'The indicator to determine if automatic allocation from the pool should

    occur. Known values are: "True" and "False".'
  name: auto_assign
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BfdEnabled">]
- description: 'The name used to identify this IP address pool for association with
    a BGP

    advertisement. Required.'
  name: name
  types:
  - <xref:str>
- description: 'The indicator to prevent the use of IP addresses ending with .0 and

    .255 for this pool. Enabling this option will only use IP addresses between .1
    and .254

    inclusive. Known values are: "True" and "False".'
  name: only_use_host_ips
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BfdEnabled">]
attributes:
- uid: azure.mgmt.networkcloud.types.IpAddressPool.addresses
  name: addresses
  summary: 'The list of IP address ranges. Each range can be a either a subnet in
    CIDR format or an

    explicit start-end range of IP addresses. For a BGP service load balancer configuration,
    only

    CIDR format is supported and excludes /32 (IPv4) and /128 (IPv6) prefixes. Required.'
  signature: 'addresses: Required[list[str]]'
- uid: azure.mgmt.networkcloud.types.IpAddressPool.autoAssign
  name: autoAssign
  summary: 'The indicator to determine if automatic allocation from the pool should
    occur. Known values

    are: "True" and "False".'
  signature: 'autoAssign: str | BfdEnabled'
- uid: azure.mgmt.networkcloud.types.IpAddressPool.name
  name: name
  summary: 'The name used to identify this IP address pool for association with a
    BGP advertisement.

    Required.'
  signature: 'name: Required[str]'
- uid: azure.mgmt.networkcloud.types.IpAddressPool.onlyUseHostIps
  name: onlyUseHostIps
  summary: 'The indicator to prevent the use of IP addresses ending with .0 and .255
    for this pool.

    Enabling this option will only use IP addresses between .1 and .254 inclusive.
    Known values

    are: "True" and "False".'
  signature: 'onlyUseHostIps: str | BfdEnabled'
