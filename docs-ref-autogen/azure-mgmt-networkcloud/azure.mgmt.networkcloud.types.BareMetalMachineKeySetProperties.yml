### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties
name: BareMetalMachineKeySetProperties
fullName: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties
module: azure.mgmt.networkcloud.types
summary: BareMetalMachineKeySetProperties represents the properties of bare metal
  machine key set.
constructor:
  syntax: BareMetalMachineKeySetProperties()
variables:
- description: 'The object ID of Azure Active Directory group that all users in the
    list

    must be in for access to be granted. Users that are not in the group will not
    have access.

    Required.'
  name: azure_group_id
  types:
  - <xref:str>
- description: 'The date and time after which the users in this key set will be removed
    from

    the bare metal machines. Required.'
  name: expiration
  types:
  - <xref:str>
- description: 'The list of IP addresses of jump hosts with management network access

    from which a login will be allowed for the users. Required.'
  name: jump_hosts_allowed
  types:
  - <xref:list>[<xref:str>]
- description: 'The name of the group that users will be assigned to on the operating

    system of the machines.'
  name: os_group_name
  types:
  - <xref:str>
- description: 'The access level allowed for the users in this key set. Required.
    Known

    values are: "Standard", "Superuser", and "Other".'
  name: privilege_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BareMetalMachineKeySetPrivilegeLevel">]
- description: 'The name of the access level to apply when the privilege level is

    set to Other.'
  name: privilege_level_name
  types:
  - <xref:str>
- description: The unique list of permitted users. Required.
  name: user_list
  types:
  - <xref:list>[<xref:"KeySetUser">]
- description: 'The more detailed status of the key set. Known values are: "AllActive",

    "SomeInvalid", "AllInvalid", and "Validating".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BareMetalMachineKeySetDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: The last time this key set was validated.
  name: last_validation
  types:
  - <xref:str>
- description: The status evaluation of each user.
  name: user_list_status
  types:
  - <xref:list>[<xref:"KeySetUserStatus">]
- description: 'The provisioning state of the bare metal machine key set. Known

    values are: "Succeeded", "Failed", "Canceled", "Accepted", and "Provisioning".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BareMetalMachineKeySetProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties.azureGroupId
  name: azureGroupId
  summary: 'The object ID of Azure Active Directory group that all users in the list
    must be in for access

    to be granted. Users that are not in the group will not have access. Required.'
  signature: 'azureGroupId: Required[str]'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties.detailedStatus
  name: detailedStatus
  summary: '"AllActive", "SomeInvalid",

    "AllInvalid", and "Validating".'
  signature: 'detailedStatus: str | BareMetalMachineKeySetDetailedStatus'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties.expiration
  name: expiration
  summary: 'The date and time after which the users in this key set will be removed
    from the bare metal

    machines. Required.'
  signature: 'expiration: Required[str]'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties.jumpHostsAllowed
  name: jumpHostsAllowed
  summary: 'The list of IP addresses of jump hosts with management network access
    from which a login will

    be allowed for the users. Required.'
  signature: 'jumpHostsAllowed: Required[list[str]]'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties.lastValidation
  name: lastValidation
  summary: The last time this key set was validated.
  signature: 'lastValidation: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties.osGroupName
  name: osGroupName
  summary: The name of the group that users will be assigned to on the operating system
    of the machines.
  signature: 'osGroupName: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties.privilegeLevel
  name: privilegeLevel
  summary: 'The access level allowed for the users in this key set. Required. Known
    values are:

    "Standard", "Superuser", and "Other".'
  signature: 'privilegeLevel: Required[str | BareMetalMachineKeySetPrivilegeLevel]'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties.privilegeLevelName
  name: privilegeLevelName
  summary: The name of the access level to apply when the privilege level is set to
    Other.
  signature: 'privilegeLevelName: str'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Accepted", and "Provisioning".'
  signature: 'provisioningState: str | BareMetalMachineKeySetProvisioningState'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties.userList
  name: userList
  summary: The unique list of permitted users. Required.
  signature: 'userList: Required[list[''KeySetUser'']]'
- uid: azure.mgmt.networkcloud.types.BareMetalMachineKeySetProperties.userListStatus
  name: userListStatus
  summary: The status evaluation of each user.
  signature: 'userListStatus: list[''KeySetUserStatus'']'
