### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.models.BareMetalMachineConfigurationDataPatch
name: BareMetalMachineConfigurationDataPatch
fullName: azure.mgmt.networkcloud.models.BareMetalMachineConfigurationDataPatch
module: azure.mgmt.networkcloud.models
summary: 'BareMetalMachineConfigurationDataPatch represents configuration for the
  bare metal machine for

  patch operations.'
constructor:
  syntax: 'BareMetalMachineConfigurationDataPatch(*args: Any, **kwargs: Any)'
variables:
- description: 'The connection string for the baseboard management controller

    including IP address and protocol.'
  name: bmc_connection_string
  types:
  - <xref:str>
- description: 'The credentials of the baseboard management controller on this bare

    metal machine. The password field is expected to be an Azure Key Vault key URL.
    Until the

    cluster is converted to utilize managed identity by setting the secret archive
    settings, the

    actual password value should be provided instead.'
  name: bmc_credentials
  types:
  - <xref:azure.mgmt.networkcloud.models.AdministrativeCredentialsPatch>
- description: The MAC address of the BMC for this machine.
  name: bmc_mac_address
  types:
  - <xref:str>
- description: The MAC address associated with the PXE NIC card.
  name: boot_mac_address
  types:
  - <xref:str>
- description: 'The free-form additional information about the machine, e.g. an asset

    tag.'
  name: machine_details
  types:
  - <xref:str>
- description: 'The user-provided name for the bare metal machine created from this

    specification. If not provided, the machine name will be generated programmatically.'
  name: machine_name
  types:
  - <xref:str>
- description: The slot the physical machine is in the rack based on the BOM configuration.
  name: rack_slot
  types:
  - <xref:int>
- description: 'The serial number of the machine. Hardware suppliers may use an alternate

    value. For example, service tag.'
  name: serial_number
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.models.BareMetalMachineConfigurationDataPatch.bmc_connection_string
  name: bmc_connection_string
  summary: 'The connection string for the baseboard management controller including
    IP address and

    protocol.'
  signature: 'bmc_connection_string: str | None'
- uid: azure.mgmt.networkcloud.models.BareMetalMachineConfigurationDataPatch.bmc_credentials
  name: bmc_credentials
  summary: 'The credentials of the baseboard management controller on this bare metal
    machine. The password

    field is expected to be an Azure Key Vault key URL. Until the cluster is converted
    to utilize

    managed identity by setting the secret archive settings, the actual password value
    should be

    provided instead.'
  signature: 'bmc_credentials: _models.AdministrativeCredentialsPatch | None'
- uid: azure.mgmt.networkcloud.models.BareMetalMachineConfigurationDataPatch.bmc_mac_address
  name: bmc_mac_address
  summary: The MAC address of the BMC for this machine.
  signature: 'bmc_mac_address: str | None'
- uid: azure.mgmt.networkcloud.models.BareMetalMachineConfigurationDataPatch.boot_mac_address
  name: boot_mac_address
  summary: The MAC address associated with the PXE NIC card.
  signature: 'boot_mac_address: str | None'
- uid: azure.mgmt.networkcloud.models.BareMetalMachineConfigurationDataPatch.machine_details
  name: machine_details
  summary: The free-form additional information about the machine, e.g. an asset tag.
  signature: 'machine_details: str | None'
- uid: azure.mgmt.networkcloud.models.BareMetalMachineConfigurationDataPatch.machine_name
  name: machine_name
  summary: 'The user-provided name for the bare metal machine created from this specification.
