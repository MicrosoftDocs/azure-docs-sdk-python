    provided, the machine name will be generated programmatically.'
  signature: 'machine_name: str | None'
- uid: azure.mgmt.networkcloud.models.BareMetalMachineConfigurationDataPatch.rack_slot
  name: rack_slot
  summary: The slot the physical machine is in the rack based on the BOM configuration.
  signature: 'rack_slot: int | None'
- uid: azure.mgmt.networkcloud.models.BareMetalMachineConfigurationDataPatch.serial_number
  name: serial_number
  summary: 'The serial number of the machine. Hardware suppliers may use an alternate
