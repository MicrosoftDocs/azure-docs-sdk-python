uid: azure.mgmt.networkcloud.types.ServicePrincipalInformation
name: ServicePrincipalInformation
fullName: azure.mgmt.networkcloud.types.ServicePrincipalInformation
module: azure.mgmt.networkcloud.types
summary: 'ServicePrincipalInformation represents the details of the service principal
  to be used by the

  cluster during Arc Appliance installation.'
constructor:
  syntax: ServicePrincipalInformation()
variables:
