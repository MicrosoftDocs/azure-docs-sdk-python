  - <xref:str>
- description: The password of the service principal. Required.
  name: password
  types:
  - <xref:str>
- description: 'The principal ID, also known as the object ID, of the service principal.

    Required.'
  name: principal_id
  types:
  - <xref:str>
- description: 'The tenant ID, also known as the directory ID, of the tenant in which
    the

    service principal is created. Required.'
  name: tenant_id
  types:
  - <xref:str>
