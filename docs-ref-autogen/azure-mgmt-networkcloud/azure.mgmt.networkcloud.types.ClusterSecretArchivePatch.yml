### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.ClusterSecretArchivePatch
name: ClusterSecretArchivePatch
fullName: azure.mgmt.networkcloud.types.ClusterSecretArchivePatch
module: azure.mgmt.networkcloud.types
summary: 'ClusterSecretArchivePatch configures the key vault to archive the secrets
  of the cluster for

  later retrieval for patch operations.'
constructor:
  syntax: ClusterSecretArchivePatch()
variables:
- description: The resource ID of the key vault to archive the secrets of the cluster.
  name: key_vault_id
  types:
  - <xref:str>
- description: 'The indicator if the specified key vault should be used to archive
    the

    secrets of the cluster. Known values are: "True" and "False".'
  name: use_key_vault
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterSecretArchiveEnabled">]
attributes:
- uid: azure.mgmt.networkcloud.types.ClusterSecretArchivePatch.keyVaultId
  name: keyVaultId
  summary: The resource ID of the key vault to archive the secrets of the cluster.
  signature: 'keyVaultId: str'
- uid: azure.mgmt.networkcloud.types.ClusterSecretArchivePatch.useKeyVault
  name: useKeyVault
  summary: 'The indicator if the specified key vault should be used to archive the
    secrets of the cluster.

    Known values are: "True" and "False".'
  signature: 'useKeyVault: str | ClusterSecretArchiveEnabled'
