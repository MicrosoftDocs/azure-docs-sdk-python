### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.BmcKeySetProperties
name: BmcKeySetProperties
fullName: azure.mgmt.networkcloud.types.BmcKeySetProperties
module: azure.mgmt.networkcloud.types
summary: BmcKeySetProperties represents the properties of baseboard management controller
  key set.
constructor:
  syntax: BmcKeySetProperties()
variables:
- description: 'The object ID of Azure Active Directory group that all users in the
    list

    must be in for access to be granted. Users that are not in the group will not
    have access.

    Required.'
  name: azure_group_id
  types:
  - <xref:str>
- description: 'The date and time after which the users in this key set will be removed
    from

    the baseboard management controllers. Required.'
  name: expiration
  types:
  - <xref:str>
- description: 'The access level allowed for the users in this key set. Required.
    Known

    values are: "ReadOnly" and "Administrator".'
  name: privilege_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BmcKeySetPrivilegeLevel">]
- description: The unique list of permitted users. Required.
  name: user_list
  types:
  - <xref:list>[<xref:"KeySetUser">]
- description: 'The more detailed status of the key set. Known values are: "AllActive",

    "SomeInvalid", "AllInvalid", and "Validating".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BmcKeySetDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: The last time this key set was validated.
  name: last_validation
  types:
  - <xref:str>
- description: The status evaluation of each user.
  name: user_list_status
  types:
  - <xref:list>[<xref:"KeySetUserStatus">]
- description: 'The provisioning state of the baseboard management controller key

    set. Known values are: "Succeeded", "Failed", "Canceled", "Accepted", and "Provisioning".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BmcKeySetProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.BmcKeySetProperties.azureGroupId
  name: azureGroupId
  summary: 'The object ID of Azure Active Directory group that all users in the list
    must be in for access

    to be granted. Users that are not in the group will not have access. Required.'
  signature: 'azureGroupId: Required[str]'
- uid: azure.mgmt.networkcloud.types.BmcKeySetProperties.detailedStatus
  name: detailedStatus
  summary: '"AllActive", "SomeInvalid",

    "AllInvalid", and "Validating".'
  signature: 'detailedStatus: str | BmcKeySetDetailedStatus'
- uid: azure.mgmt.networkcloud.types.BmcKeySetProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.BmcKeySetProperties.expiration
  name: expiration
  summary: 'The date and time after which the users in this key set will be removed
    from the baseboard

    management controllers. Required.'
  signature: 'expiration: Required[str]'
- uid: azure.mgmt.networkcloud.types.BmcKeySetProperties.lastValidation
  name: lastValidation
  summary: The last time this key set was validated.
  signature: 'lastValidation: str'
- uid: azure.mgmt.networkcloud.types.BmcKeySetProperties.privilegeLevel
  name: privilegeLevel
  summary: 'The access level allowed for the users in this key set. Required. Known
    values are:

    "ReadOnly" and "Administrator".'
  signature: 'privilegeLevel: Required[str | BmcKeySetPrivilegeLevel]'
- uid: azure.mgmt.networkcloud.types.BmcKeySetProperties.provisioningState
  name: provisioningState
  summary: 'The provisioning state of the baseboard management controller key set.
    Known values are:

    "Succeeded", "Failed", "Canceled", "Accepted", and "Provisioning".'
  signature: 'provisioningState: str | BmcKeySetProvisioningState'
- uid: azure.mgmt.networkcloud.types.BmcKeySetProperties.userList
  name: userList
  summary: The unique list of permitted users. Required.
  signature: 'userList: Required[list[''KeySetUser'']]'
- uid: azure.mgmt.networkcloud.types.BmcKeySetProperties.userListStatus
  name: userListStatus
  summary: The status evaluation of each user.
  signature: 'userListStatus: list[''KeySetUserStatus'']'
