### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.StorageApplianceProperties
name: StorageApplianceProperties
fullName: azure.mgmt.networkcloud.types.StorageApplianceProperties
module: azure.mgmt.networkcloud.types
summary: StorageApplianceProperties represents the properties of the storage appliance.
constructor:
  syntax: StorageApplianceProperties()
variables:
- description: The resource ID of the rack where this storage appliance resides. Required.
  name: rack_id
  types:
  - <xref:str>
- description: The SKU for the storage appliance. Required.
  name: storage_appliance_sku_id
  types:
  - <xref:str>
- description: 'The slot the storage appliance is in the rack based on the BOM configuration.

    Required.'
  name: rack_slot
  types:
  - <xref:int>
- description: The serial number for the storage appliance. Required.
  name: serial_number
  types:
  - <xref:str>
- description: 'The credentials of the administrative interface on this

    storage appliance. Required.'
  name: administrator_credentials
  types:
  - <xref:<xref:"AdministrativeCredentials">>
- description: 'The CA certificate information issued by the platform for connecting
    to

    TLS interfaces for the storage appliance. Callers add this certificate to their
    trusted CA

    store to allow secure communication with the storage appliance.'
  name: ca_certificate
  types:
  - <xref:<xref:"CertificateInfo">>
- description: The total capacity of the storage appliance. Measured in GiB.
  name: capacity
  types:
  - <xref:int>
- description: The amount of storage consumed. Measured in GiB.
  name: capacity_used
  types:
  - <xref:int>
- description: The resource ID of the cluster this storage appliance is associated
    with.
  name: cluster_id
  types:
  - <xref:str>
- description: 'The detailed status of the storage appliance. Known values are:

    "Available", "Degraded", "Error", and "Provisioning".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageApplianceDetailedStatus">]
- description: The descriptive message about the current detailed status.
  name: detailed_status_message
  types:
  - <xref:str>
- description: The list of expansion shelves connected to the storage appliance.
  name: expansion_shelves
  types:
  - <xref:list>[<xref:"StorageApplianceExpansionShelf">]
- description: 'The endpoint for the management interface of the storage

    appliance.'
  name: management_ipv4_address
  types:
  - <xref:str>
- description: The manufacturer of the storage appliance.
  name: manufacturer
  types:
  - <xref:str>
- description: The model of the storage appliance.
  name: model
  types:
  - <xref:str>
- description: 'The monitoring configuration status of the storage

    appliance.'
  name: monitoring_configuration_status
  types:
  - <xref:<xref:"StorageApplianceMonitoringConfigurationStatus">>
- description: 'The indicator of whether the storage appliance supports

    remote vendor management. Known values are: "Supported" and "Unsupported".'
  name: remote_vendor_management_feature
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RemoteVendorManagementFeature">]
- description: 'The indicator of whether the remote vendor management

    feature is enabled or disabled, or unsupported if it is an unsupported feature.
    Known values

    are: "Enabled", "Disabled", and "Unsupported".'
  name: remote_vendor_management_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RemoteVendorManagementStatus">]
- description: The list of statuses that represent secret rotation activity.
  name: secret_rotation_status
  types:
  - <xref:list>[<xref:"SecretRotationStatus">]
- description: The version of the storage appliance.
  name: version
  types:
  - <xref:str>
- description: 'The provisioning state of the storage appliance. Known values are:

    "Succeeded", "Failed", "Canceled", "Provisioning", and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageApplianceProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.administratorCredentials
  name: administratorCredentials
  summary: The credentials of the administrative interface on this storage appliance.
    Required.
  signature: 'administratorCredentials: Required[AdministrativeCredentials]'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.caCertificate
  name: caCertificate
  summary: 'The CA certificate information issued by the platform for connecting to
    TLS interfaces for the

    storage appliance. Callers add this certificate to their trusted CA store to allow
    secure

    communication with the storage appliance.'
  signature: 'caCertificate: CertificateInfo'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.capacity
  name: capacity
  summary: The total capacity of the storage appliance. Measured in GiB.
  signature: 'capacity: int'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.capacityUsed
  name: capacityUsed
  summary: The amount of storage consumed. Measured in GiB.
  signature: 'capacityUsed: int'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.clusterId
  name: clusterId
  summary: The resource ID of the cluster this storage appliance is associated with.
  signature: 'clusterId: str'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.detailedStatus
  name: detailedStatus
  summary: '"Available", "Degraded",

    "Error", and "Provisioning".'
  signature: 'detailedStatus: str | StorageApplianceDetailedStatus'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message about the current detailed status.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.expansionShelves
  name: expansionShelves
  summary: The list of expansion shelves connected to the storage appliance.
  signature: 'expansionShelves: list[''StorageApplianceExpansionShelf'']'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.managementIpv4Address
  name: managementIpv4Address
  summary: The endpoint for the management interface of the storage appliance.
  signature: 'managementIpv4Address: str'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.manufacturer
  name: manufacturer
  summary: The manufacturer of the storage appliance.
  signature: 'manufacturer: str'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.model
  name: model
  summary: The model of the storage appliance.
  signature: 'model: str'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.monitoringConfigurationStatus
  name: monitoringConfigurationStatus
  summary: The monitoring configuration status of the storage appliance.
  signature: 'monitoringConfigurationStatus: StorageApplianceMonitoringConfigurationStatus'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Provisioning", and "Accepted".'
  signature: 'provisioningState: str | StorageApplianceProvisioningState'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.rackId
  name: rackId
  summary: The resource ID of the rack where this storage appliance resides. Required.
  signature: 'rackId: Required[str]'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.rackSlot
  name: rackSlot
  summary: The slot the storage appliance is in the rack based on the BOM configuration.
    Required.
  signature: 'rackSlot: Required[int]'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.remoteVendorManagementFeature
  name: remoteVendorManagementFeature
  summary: 'The indicator of whether the storage appliance supports remote vendor
    management. Known values

    are: "Supported" and "Unsupported".'
  signature: 'remoteVendorManagementFeature: str | RemoteVendorManagementFeature'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.remoteVendorManagementStatus
  name: remoteVendorManagementStatus
  summary: 'The indicator of whether the remote vendor management feature is enabled
    or disabled, or

    unsupported if it is an unsupported feature. Known values are: "Enabled", "Disabled",
    and

    "Unsupported".'
  signature: 'remoteVendorManagementStatus: str | RemoteVendorManagementStatus'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.secretRotationStatus
  name: secretRotationStatus
  summary: The list of statuses that represent secret rotation activity.
  signature: 'secretRotationStatus: list[''SecretRotationStatus'']'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.serialNumber
  name: serialNumber
  summary: The serial number for the storage appliance. Required.
  signature: 'serialNumber: Required[str]'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.storageApplianceSkuId
  name: storageApplianceSkuId
  summary: The SKU for the storage appliance. Required.
  signature: 'storageApplianceSkuId: Required[str]'
- uid: azure.mgmt.networkcloud.types.StorageApplianceProperties.version
  name: version
  summary: The version of the storage appliance.
  signature: 'version: str'
