### YamlMime:PythonClass
uid: azure.mgmt.networkcloud.types.KubernetesClusterFeatureProperties
name: KubernetesClusterFeatureProperties
fullName: azure.mgmt.networkcloud.types.KubernetesClusterFeatureProperties
module: azure.mgmt.networkcloud.types
summary: KubernetesClusterFeatureProperties represents the properties of a Kubernetes
  cluster feature.
constructor:
  syntax: KubernetesClusterFeatureProperties()
variables:
- description: The configured options for the feature.
  name: options
  types:
  - <xref:list>[<xref:"StringKeyValuePair">]
- description: 'The lifecycle indicator of the feature. Known values are:

    "Preview" and "GenerallyAvailable".'
  name: availability_lifecycle
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KubernetesClusterFeatureAvailabilityLifecycle">]
- description: 'The detailed status of the feature. Known values are: "Error",

    "Provisioning", and "Installed".'
  name: detailed_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KubernetesClusterFeatureDetailedStatus">]
- description: The descriptive message for the detailed status of the feature.
  name: detailed_status_message
  types:
  - <xref:str>
- description: 'The indicator of if the feature is required or optional. Optional
    features may

    be deleted by the user, while required features are managed with the kubernetes
    cluster

    lifecycle. Known values are: "True" and "False".'
  name: required
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KubernetesClusterFeatureRequired">]
- description: The version of the feature.
  name: version
  types:
  - <xref:str>
- description: 'The provisioning state of the Kubernetes cluster feature. Known

    values are: "Accepted", "Canceled", "Deleting", "Failed", "Succeeded", and "Updating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KubernetesClusterFeatureProvisioningState">]
attributes:
- uid: azure.mgmt.networkcloud.types.KubernetesClusterFeatureProperties.availabilityLifecycle
  name: availabilityLifecycle
  summary: '"Preview" and

    "GenerallyAvailable".'
  signature: 'availabilityLifecycle: str | KubernetesClusterFeatureAvailabilityLifecycle'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterFeatureProperties.detailedStatus
  name: detailedStatus
  summary: '"Error", "Provisioning", and

    "Installed".'
  signature: 'detailedStatus: str | KubernetesClusterFeatureDetailedStatus'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterFeatureProperties.detailedStatusMessage
  name: detailedStatusMessage
  summary: The descriptive message for the detailed status of the feature.
  signature: 'detailedStatusMessage: str'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterFeatureProperties.options
  name: options
  summary: The configured options for the feature.
  signature: 'options: list[''StringKeyValuePair'']'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterFeatureProperties.provisioningState
  name: provisioningState
  summary: '"Accepted",

    "Canceled", "Deleting", "Failed", "Succeeded", and "Updating".'
  signature: 'provisioningState: str | KubernetesClusterFeatureProvisioningState'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterFeatureProperties.required
  name: required
  summary: 'The indicator of if the feature is required or optional. Optional features
    may be deleted by

    the user, while required features are managed with the kubernetes cluster lifecycle.
    Known

    values are: "True" and "False".'
  signature: 'required: str | KubernetesClusterFeatureRequired'
- uid: azure.mgmt.networkcloud.types.KubernetesClusterFeatureProperties.version
  name: version
  summary: The version of the feature.
  signature: 'version: str'
