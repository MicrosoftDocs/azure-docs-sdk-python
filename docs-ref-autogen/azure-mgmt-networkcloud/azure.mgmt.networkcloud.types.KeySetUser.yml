uid: azure.mgmt.networkcloud.types.KeySetUser
name: KeySetUser
fullName: azure.mgmt.networkcloud.types.KeySetUser
module: azure.mgmt.networkcloud.types
summary: KeySetUser represents the properties of the user in the key set.
constructor:
  syntax: KeySetUser()
variables:
- description: The user name that will be used for access. Required.
  name: azure_user_name
  types:
  - <xref:str>
- description: The free-form description for this user.
  name: description
  types:
  - <xref:str>
- description: 'The SSH public key that will be provisioned for user access. The user
    is

    expected to have the corresponding SSH private key for logging in. Required.'
  name: ssh_public_key
  types:
  - <xref:<xref:"SshPublicKey">>
- description: 'The user principal name (email format) used to validate this user''s

    group membership.'
  name: user_principal_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.networkcloud.types.KeySetUser.azureUserName
  name: azureUserName
  summary: The user name that will be used for access. Required.
  signature: 'azureUserName: str'
- uid: azure.mgmt.networkcloud.types.KeySetUser.description
  name: description
  summary: The free-form description for this user.
  signature: 'description: str'
- uid: azure.mgmt.networkcloud.types.KeySetUser.sshPublicKey
  name: sshPublicKey
  summary: 'The SSH public key that will be provisioned for user access. The user
    is expected to have the

    corresponding SSH private key for logging in. Required.'
  signature: 'sshPublicKey: SshPublicKey'
