    description: The name of the order item. Required.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: expand
    description: '$expand is supported on parent device details, device details, forward

      shipping details and reverse shipping details parameters. Each of these can
      be provided as a

