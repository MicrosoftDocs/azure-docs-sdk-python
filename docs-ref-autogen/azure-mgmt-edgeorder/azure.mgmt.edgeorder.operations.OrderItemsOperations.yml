- uid: azure.mgmt.edgeorder.operations.OrderItemsOperations.get
  name: get
  summary: Get an order item.
  signature: 'get(resource_group_name: str, order_item_name: str, *, expand: str |
    None = None, **kwargs: Any) -> OrderItemResource'
