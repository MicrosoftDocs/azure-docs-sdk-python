### YamlMime:PythonClass
uid: azure.mgmt.peering.types.DirectConnection
name: DirectConnection
fullName: azure.mgmt.peering.types.DirectConnection
module: azure.mgmt.peering.types
summary: The properties that define a direct connection.
constructor:
  syntax: DirectConnection()
variables:
- description: The bandwidth of the connection.
  name: bandwidth_in_mbps
  types:
  - <xref:int>
- description: The bandwidth that is actually provisioned.
  name: provisioned_bandwidth_in_mbps
  types:
  - <xref:int>
- description: 'The field indicating if Microsoft provides session ip

    addresses. Known values are: "Microsoft" and "Peer".'
  name: session_address_provider
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SessionAddressProvider">]
- description: 'The flag that indicates whether or not the connection is used

    for peering service.'
  name: use_for_peering_service
  types:
  - <xref:bool>
- description: 'The ID used within Microsoft''s peering provisioning system to

    track the connection.'
  name: microsoft_tracking_id
  types:
  - <xref:str>
- description: 'The PeeringDB.com ID of the facility at which the connection has

    to be set up.'
  name: peering_db_facility_id
  types:
  - <xref:int>
- description: 'The state of the connection. Known values are: "None",

    "PendingApproval", "Approved", "ProvisioningStarted", "ProvisioningFailed",

    "ProvisioningCompleted", "Validating", "Active", "TypeChangeRequested", "TypeChangeInProgress",

    and "ExternalBlocker".'
  name: connection_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectionState">]
- description: The BGP session associated with the connection.
  name: bgp_session
  types:
  - <xref:<xref:"BgpSession">>
- description: The unique identifier (GUID) for the connection.
  name: connection_identifier
  types:
  - <xref:str>
- description: The error message related to the connection state, if any.
  name: error_message
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.peering.types.DirectConnection.bandwidthInMbps
  name: bandwidthInMbps
  summary: The bandwidth of the connection.
  signature: 'bandwidthInMbps: int'
- uid: azure.mgmt.peering.types.DirectConnection.bgpSession
  name: bgpSession
  summary: The BGP session associated with the connection.
  signature: 'bgpSession: BgpSession'
- uid: azure.mgmt.peering.types.DirectConnection.connectionIdentifier
  name: connectionIdentifier
  summary: The unique identifier (GUID) for the connection.
  signature: 'connectionIdentifier: str'
- uid: azure.mgmt.peering.types.DirectConnection.connectionState
  name: connectionState
  summary: '"None", "PendingApproval", "Approved",

    "ProvisioningStarted", "ProvisioningFailed", "ProvisioningCompleted", "Validating",

    "Active", "TypeChangeRequested", "TypeChangeInProgress", and "ExternalBlocker".'
  signature: 'connectionState: str | ConnectionState'
- uid: azure.mgmt.peering.types.DirectConnection.errorMessage
  name: errorMessage
  summary: The error message related to the connection state, if any.
  signature: 'errorMessage: str'
- uid: azure.mgmt.peering.types.DirectConnection.microsoftTrackingId
  name: microsoftTrackingId
  summary: The ID used within Microsoft's peering provisioning system to track the
    connection.
  signature: 'microsoftTrackingId: str'
- uid: azure.mgmt.peering.types.DirectConnection.peeringDBFacilityId
  name: peeringDBFacilityId
  summary: The PeeringDB.com ID of the facility at which the connection has to be
    set up.
  signature: 'peeringDBFacilityId: int'
- uid: azure.mgmt.peering.types.DirectConnection.provisionedBandwidthInMbps
  name: provisionedBandwidthInMbps
  summary: The bandwidth that is actually provisioned.
  signature: 'provisionedBandwidthInMbps: int'
- uid: azure.mgmt.peering.types.DirectConnection.sessionAddressProvider
  name: sessionAddressProvider
  summary: 'The field indicating if Microsoft provides session ip addresses. Known
    values are:

    "Microsoft" and "Peer".'
  signature: 'sessionAddressProvider: str | SessionAddressProvider'
- uid: azure.mgmt.peering.types.DirectConnection.useForPeeringService
  name: useForPeeringService
  summary: The flag that indicates whether or not the connection is used for peering
    service.
  signature: 'useForPeeringService: bool'
