  name: microsoftSessionIPv4Address
  summary: The IPv4 session address on Microsoft's end.
  signature: 'microsoftSessionIPv4Address: str'
- uid: azure.mgmt.peering.types.BgpSession.microsoftSessionIPv6Address
  name: microsoftSessionIPv6Address
  summary: The IPv6 session address on Microsoft's end.
  signature: 'microsoftSessionIPv6Address: str'
