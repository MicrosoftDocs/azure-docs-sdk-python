### YamlMime:PythonClass
uid: azure.mgmt.peering.types.ExchangeConnection
name: ExchangeConnection
fullName: azure.mgmt.peering.types.ExchangeConnection
module: azure.mgmt.peering.types
summary: The properties that define an exchange connection.
constructor:
  syntax: ExchangeConnection()
variables:
- description: 'The PeeringDB.com ID of the facility at which the connection has

    to be set up.'
  name: peering_db_facility_id
  types:
  - <xref:int>
- description: 'The state of the connection. Known values are: "None",

    "PendingApproval", "Approved", "ProvisioningStarted", "ProvisioningFailed",

    "ProvisioningCompleted", "Validating", "Active", "TypeChangeRequested", "TypeChangeInProgress",

    and "ExternalBlocker".'
  name: connection_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectionState">]
- description: The BGP session associated with the connection.
  name: bgp_session
  types:
  - <xref:<xref:"BgpSession">>
- description: The unique identifier (GUID) for the connection.
  name: connection_identifier
  types:
  - <xref:str>
- description: The error message related to the connection state, if any.
  name: error_message
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.peering.types.ExchangeConnection.bgpSession
  name: bgpSession
  summary: The BGP session associated with the connection.
  signature: 'bgpSession: BgpSession'
- uid: azure.mgmt.peering.types.ExchangeConnection.connectionIdentifier
  name: connectionIdentifier
  summary: The unique identifier (GUID) for the connection.
  signature: 'connectionIdentifier: str'
- uid: azure.mgmt.peering.types.ExchangeConnection.connectionState
  name: connectionState
  summary: '"None", "PendingApproval", "Approved",

    "ProvisioningStarted", "ProvisioningFailed", "ProvisioningCompleted", "Validating",

    "Active", "TypeChangeRequested", "TypeChangeInProgress", and "ExternalBlocker".'
  signature: 'connectionState: str | ConnectionState'
- uid: azure.mgmt.peering.types.ExchangeConnection.errorMessage
  name: errorMessage
  summary: The error message related to the connection state, if any.
  signature: 'errorMessage: str'
- uid: azure.mgmt.peering.types.ExchangeConnection.peeringDBFacilityId
  name: peeringDBFacilityId
  summary: The PeeringDB.com ID of the facility at which the connection has to be
    set up.
  signature: 'peeringDBFacilityId: int'
