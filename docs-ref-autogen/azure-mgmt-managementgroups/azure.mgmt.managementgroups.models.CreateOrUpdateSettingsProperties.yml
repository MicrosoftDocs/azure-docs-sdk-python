### YamlMime:PythonClass
uid: azure.mgmt.managementgroups.models.CreateOrUpdateSettingsProperties
name: CreateOrUpdateSettingsProperties
fullName: azure.mgmt.managementgroups.models.CreateOrUpdateSettingsProperties
module: azure.mgmt.managementgroups.models
summary: The properties of the request to create or update Management Group settings.
constructor:
  syntax: 'CreateOrUpdateSettingsProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'Indicates whether RBAC access is required upon

    group creation under the root Management Group. If set to true, user will require

    Microsoft.Management/managementGroups/write action on the root Management Group
    scope in order

    to create new Groups directly under the root. This will prevent new users from
    creating new

    Management Groups, unless they are given access.'
  name: require_authorization_for_group_creation
  types:
  - <xref:bool>
- description: 'Settings that sets the default Management Group under which new

    subscriptions get added in this tenant. For example,

    /providers/Microsoft.Management/managementGroups/defaultGroup.'
  name: default_management_group
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.managementgroups.models.CreateOrUpdateSettingsProperties.default_management_group
  name: default_management_group
  summary: 'Settings that sets the default Management Group under which new subscriptions
    get added in this

    tenant. For example, /providers/Microsoft.Management/managementGroups/defaultGroup.'
  signature: 'default_management_group: str | None'
- uid: azure.mgmt.managementgroups.models.CreateOrUpdateSettingsProperties.require_authorization_for_group_creation
  name: require_authorization_for_group_creation
  summary: 'Indicates whether RBAC access is required upon group creation under the
    root Management Group.

    If set to true, user will require Microsoft.Management/managementGroups/write
    action on the

    root Management Group scope in order to create new Groups directly under the root.
    This will

    prevent new users from creating new Management Groups, unless they are given access.'
  signature: 'require_authorization_for_group_creation: bool | None'
