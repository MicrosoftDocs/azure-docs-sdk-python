  - name: key
    isRequired: true
  - name: default
    defaultValue: None
- uid: azure.ai.agentserver.responses.models.PromptCacheOptionsParam.update
  name: update
  summary: 'If E is present and has a .keys() method, then does:  for k in E.keys():
    D[k] = E[k]

    If E is present and lacks a .keys() method, then does:  for k, v in E: D[k] =
    v

    In either case, this is followed by: for k in F:  D[k] = F[k]'
  signature: update([E], **F) -> None.  Update D from mapping/iterable E and F.
- uid: azure.ai.agentserver.responses.models.PromptCacheOptionsParam.values
  name: values
  signature: values() -> an object providing a view on D's values
attributes:
- uid: azure.ai.agentserver.responses.models.PromptCacheOptionsParam.mode
  name: mode
  summary: 'Controls whether OpenAI automatically creates an implicit cache breakpoint.
    Defaults to

    `implicit`. With `implicit`, OpenAI creates one implicit breakpoint and writes
    up to the

    latest three explicit breakpoints in the request. With `explicit`, OpenAI does
    not create an

    implicit breakpoint and writes up to the latest four explicit breakpoints. If
    there are no

    explicit breakpoints, the request does not use prompt caching. Known values are:
    "implicit"

    and "explicit".'
  signature: 'mode: Literal[''implicit'', ''explicit'']'
- uid: azure.ai.agentserver.responses.models.PromptCacheOptionsParam.ttl
  name: ttl
  summary: 'The minimum lifetime applied to every implicit and explicit cache breakpoint
    written by the

    request. Defaults to `30m`, which is currently the only supported value. The backend
    may

    retain cache entries for longer. "30m"'
  signature: 'ttl: Literal[''30m'']'
