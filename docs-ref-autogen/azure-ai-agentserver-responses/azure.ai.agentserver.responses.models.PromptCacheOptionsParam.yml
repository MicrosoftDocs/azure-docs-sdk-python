### YamlMime:PythonClass
uid: azure.ai.agentserver.responses.models.PromptCacheOptionsParam
name: PromptCacheOptionsParam
fullName: azure.ai.agentserver.responses.models.PromptCacheOptionsParam
module: azure.ai.agentserver.responses.models
summary: Prompt cache options.
constructor:
  syntax: PromptCacheOptionsParam()
variables:
- description: 'The minimum lifetime applied to every implicit and explicit cache
    breakpoint written

    by the request. Defaults to `30m`, which is currently the only supported value.
    The backend

    may retain cache entries for longer. "30m"'
  name: ttl
  types:
  - <xref:PromptCacheTTLEnum>
- description: 'Controls whether OpenAI automatically creates an implicit cache breakpoint.

    Defaults to `implicit`. With `implicit`, OpenAI creates one implicit breakpoint
    and writes

    up to the latest three explicit breakpoints in the request. With `explicit`, OpenAI
    does not

    create an implicit breakpoint and writes up to the latest four explicit breakpoints.
    If there

    are no explicit breakpoints, the request does not use prompt caching. Known values
    are:

    "implicit" and "explicit".'
  name: mode
  types:
  - <xref:PromptCacheModeEnum>
