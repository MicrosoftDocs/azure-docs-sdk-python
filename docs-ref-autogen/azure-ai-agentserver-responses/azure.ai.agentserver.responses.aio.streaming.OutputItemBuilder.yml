### YamlMime:PythonClass
uid: azure.ai.agentserver.responses.aio.streaming.OutputItemBuilder
name: OutputItemBuilder
fullName: azure.ai.agentserver.responses.aio.streaming.OutputItemBuilder
module: azure.ai.agentserver.responses.aio.streaming
summary: 'Generic output-item builder for item types without dedicated scoped builders.


  Initialize a generic output-item builder.'
constructor:
  syntax: 'OutputItemBuilder(stream: ResponseEventStream, output_index: int, item_id:
    str, *, default_type: str | None = None)'
  parameters:
  - name: stream
    description: The parent event stream to emit events into.
    isRequired: true
    types:
    - <xref:azure.ai.agentserver.responses.aio.streaming.ResponseEventStream>
  - name: output_index
    description: The zero-based index of this output item.
    isRequired: true
    types:
    - <xref:int>
  - name: item_id
    description: Unique identifier for this output item.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: default_type
    description: Optional discriminator to apply when an item omits `type`.
    defaultValue: None
    types:
    - <xref:str> | <xref:None>
methods:
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemBuilder.emit_added
  name: emit_added
  summary: Emit an `output_item.added` event for a generic item.
  signature: 'emit_added(item: A2AToolCall | A2AToolCallOutput | OutputItemAdditionalTools
    | OutputItemApplyPatchToolCall | OutputItemApplyPatchToolCallOutput | AzureAISearchToolCall
    | AzureAISearchToolCallOutput | AzureFunctionToolCall | AzureFunctionToolCallOutput
    | BingCustomSearchToolCall | BingCustomSearchToolCallOutput | BingGroundingToolCall
    | BingGroundingToolCallOutput | BrowserAutomationToolCall | BrowserAutomationToolCallOutput
    | OutputItemCodeInterpreterToolCall | OutputItemCompactionBody | OutputItemComputerToolCall
    | OutputItemComputerToolCallOutput | CustomToolCallResource | CustomToolCallOutputResource
    | FabricDataAgentToolCall | FabricDataAgentToolCallOutput | OutputItemFileSearchToolCall
    | OutputItemFunctionToolCall | OutputItemFunctionToolCallOutput | OutputItemImageGenToolCall
    | OutputItemLocalShellToolCall | OutputItemLocalShellToolCallOutput | OutputItemMcpApprovalRequest
    | OutputItemMcpApprovalResponseResource | OutputItemMcpToolCall | OutputItemMcpListTools
    | MemorySearchToolCallItemResource | OutputItemMessage | OAuthConsentRequestOutputItem
    | OpenApiToolCall | OpenApiToolCallOutput | OutputItemOutputMessage | OutputItemReasoningItem
    | SharepointGroundingToolCall | SharepointGroundingToolCallOutput | OutputItemFunctionShellCall
    | OutputItemFunctionShellCallOutput | StructuredOutputsOutputItem | OutputItemToolSearchCall
    | OutputItemToolSearchOutput | OutputItemWebSearchToolCall | WorkflowActionOutputItem)
    -> ResponseOutputItemAddedEvent'
  parameters:
  - name: item
    description: The output item model instance.
    isRequired: true
    types:
    - <xref:OutputItem>
  return:
    description: The emitted event.
    types:
    - <xref:azure.ai.agentserver.responses.models.ResponseOutputItemAddedEvent>
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemBuilder.emit_done
  name: emit_done
  summary: Emit an `output_item.done` event for a generic item.
  signature: 'emit_done(item: A2AToolCall | A2AToolCallOutput | OutputItemAdditionalTools
    | OutputItemApplyPatchToolCall | OutputItemApplyPatchToolCallOutput | AzureAISearchToolCall
    | AzureAISearchToolCallOutput | AzureFunctionToolCall | AzureFunctionToolCallOutput
    | BingCustomSearchToolCall | BingCustomSearchToolCallOutput | BingGroundingToolCall
    | BingGroundingToolCallOutput | BrowserAutomationToolCall | BrowserAutomationToolCallOutput
    | OutputItemCodeInterpreterToolCall | OutputItemCompactionBody | OutputItemComputerToolCall
    | OutputItemComputerToolCallOutput | CustomToolCallResource | CustomToolCallOutputResource
    | FabricDataAgentToolCall | FabricDataAgentToolCallOutput | OutputItemFileSearchToolCall
    | OutputItemFunctionToolCall | OutputItemFunctionToolCallOutput | OutputItemImageGenToolCall
    | OutputItemLocalShellToolCall | OutputItemLocalShellToolCallOutput | OutputItemMcpApprovalRequest
    | OutputItemMcpApprovalResponseResource | OutputItemMcpToolCall | OutputItemMcpListTools
    | MemorySearchToolCallItemResource | OutputItemMessage | OAuthConsentRequestOutputItem
    | OpenApiToolCall | OpenApiToolCallOutput | OutputItemOutputMessage | OutputItemReasoningItem
    | SharepointGroundingToolCall | SharepointGroundingToolCallOutput | OutputItemFunctionShellCall
    | OutputItemFunctionShellCallOutput | StructuredOutputsOutputItem | OutputItemToolSearchCall
    | OutputItemToolSearchOutput | OutputItemWebSearchToolCall | WorkflowActionOutputItem)
    -> ResponseOutputItemDoneEvent'
  parameters:
  - name: item
    description: The completed output item model instance.
    isRequired: true
    types:
    - <xref:OutputItem>
  return:
    description: The emitted event.
    types:
    - <xref:azure.ai.agentserver.responses.models.ResponseOutputItemDoneEvent>
attributes:
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemBuilder.internal_metadata
  name: internal_metadata
  summary: 'Live, mutable framework-internal metadata for this output item.


    Read / write / delete in place (`message.internal_metadata["step"] = "n3"`).

    Whatever is set here is merged into the emitted `output_item.added` /

    `output_item.done` payloads under the item''s `internal_metadata` key

    (and thus onto `stream.response.output[i]`), and is stripped from every

    client-facing payload. Values may be any JSON-serialisable type.'
  return:
    types:
    - <xref:collections.abc.MutableMapping>[<xref:str>, <xref:typing.Any>]
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemBuilder.item_id
  name: item_id
  summary: Return the output item identifier.
  return:
    description: The item ID.
    types:
    - <xref:str>
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemBuilder.output_index
  name: output_index
  summary: Return the zero-based output index.
  return:
    description: The output index.
    types:
    - <xref:int>
