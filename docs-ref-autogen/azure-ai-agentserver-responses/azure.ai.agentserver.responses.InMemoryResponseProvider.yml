- uid: azure.ai.agentserver.responses.InMemoryResponseProvider.get_history_item_ids
  name: get_history_item_ids
  summary: 'Resolve item IDs from previous response and/or conversation scope.


    Collects history, input, and output item IDs from the previous

    response chain and/or all responses within the given conversation.

    When over *limit*, keeps the most recent N item IDs from the

    resolved chain, preserving chronological order in the returned slice.'
  signature: 'async get_history_item_ids(previous_response_id: str | None, conversation_id:
    str | None, limit: int, *, context: PlatformContext | None = None) -> list[str]'
  parameters:
  - name: previous_response_id
    description: Optional response ID to chain history from.
    isRequired: true
    types:
    - <xref:str> | <xref:None>
  - name: conversation_id
    description: Optional conversation ID to scope history lookup.
    isRequired: true
    types:
    - <xref:str> | <xref:None>
  - name: limit
    description: Maximum number of item IDs to return (most recent N).
    isRequired: true
    types:
    - <xref:int>
  keywordOnlyParameters:
  - name: context
    description: Platform context for multi-tenant partitioning.
    defaultValue: None
    types:
    - <xref:azure.ai.agentserver.responses.PlatformContext> | <xref:None>
  return:
    description: A list of item IDs from the resolved chain.
    types:
    - <xref:list>[<xref:str>]
