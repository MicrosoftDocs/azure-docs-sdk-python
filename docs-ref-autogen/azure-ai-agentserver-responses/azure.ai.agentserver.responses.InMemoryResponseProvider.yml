  signature: 'async delete_response(response_id: str, *, context: PlatformContext
    | None = None) -> None'
  parameters:
  - name: response_id
    description: The unique identifier of the response to delete.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: context
    description: Platform context for multi-tenant partitioning.
    defaultValue: None
    types:
    - <xref:azure.ai.agentserver.responses.PlatformContext> | <xref:None>
  return:
    types:
    - <xref:None>
  exceptions:
  - type: KeyError
    description: If the response does not exist or has already been deleted.
