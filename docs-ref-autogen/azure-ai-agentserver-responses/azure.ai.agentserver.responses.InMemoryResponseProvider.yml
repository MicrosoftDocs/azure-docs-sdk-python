### YamlMime:PythonClass
uid: azure.ai.agentserver.responses.InMemoryResponseProvider
name: InMemoryResponseProvider
fullName: azure.ai.agentserver.responses.InMemoryResponseProvider
module: azure.ai.agentserver.responses
summary: 'In-memory provider implementing `ResponseProviderProtocol`.


  Stream-event persistence and replay are handled separately by the

  process-wide `azure.ai.agentserver.core.streaming.streams` registry,

  configured at host startup; this provider stores only response

  envelopes, input items, and history pointers.


  Initialize in-memory state and an async mutation lock.'
constructor:
  syntax: InMemoryResponseProvider()
methods:
- uid: azure.ai.agentserver.responses.InMemoryResponseProvider.append_stream_event
  name: append_stream_event
  summary: Append one stream event to replay state for an existing execution.
  signature: 'async append_stream_event(response_id: str, event: StreamEventRecord,
    *, ttl_seconds: int | None = None) -> bool'
  parameters:
  - name: response_id
    description: The unique identifier of the response to append the event to.
    isRequired: true
    types:
    - <xref:str>
  - name: event
    description: The stream event record to append.
    isRequired: true
    types:
    - <xref:azure.ai.agentserver.responses.models.runtime.StreamEventRecord>
  keywordOnlyParameters:
  - name: ttl_seconds
    description: Optional time-to-live in seconds to refresh expiration.
    defaultValue: None
    types:
    - <xref:int>
    - <xref:None>
  return:
    description: '`True` if the entry was found and the event was appended, `False`
      otherwise.'
    types:
    - <xref:bool>
- uid: azure.ai.agentserver.responses.InMemoryResponseProvider.create_execution
  name: create_execution
  summary: Create a new execution and replay container for `execution.response_id`.
  signature: 'async create_execution(execution: ResponseExecution, *, ttl_seconds:
    int | None = None) -> None'
  parameters:
  - name: execution
    description: The execution state to store.
    isRequired: true
    types:
    - <xref:azure.ai.agentserver.responses.models.runtime.ResponseExecution>
  keywordOnlyParameters:
  - name: ttl_seconds
    description: Optional time-to-live in seconds for automatic expiration.
    defaultValue: None
    types:
    - <xref:int>
    - <xref:None>
  return:
    types:
    - <xref:None>
  exceptions:
  - type: ValueError
    description: If an entry with the same response ID already exists.
- uid: azure.ai.agentserver.responses.InMemoryResponseProvider.create_response
  name: create_response
  summary: 'Persist a new response envelope and optional input/history references.


    Stores a deep copy of the response, indexes input items by their IDs,

    and tracks conversation membership for history resolution.'
  signature: 'async create_response(response: ResponseObject, input_items: Iterable[A2AToolCall
    | A2AToolCallOutput | OutputItemAdditionalTools | OutputItemApplyPatchToolCall
    | OutputItemApplyPatchToolCallOutput | AzureAISearchToolCall | AzureAISearchToolCallOutput
    | AzureFunctionToolCall | AzureFunctionToolCallOutput | BingCustomSearchToolCall
    | BingCustomSearchToolCallOutput | BingGroundingToolCall | BingGroundingToolCallOutput
    | BrowserAutomationToolCall | BrowserAutomationToolCallOutput | OutputItemCodeInterpreterToolCall
    | OutputItemCompactionBody | OutputItemComputerToolCall | OutputItemComputerToolCallOutput
    | CustomToolCallResource | CustomToolCallOutputResource | FabricDataAgentToolCall
    | FabricDataAgentToolCallOutput | OutputItemFileSearchToolCall | OutputItemFunctionToolCall
    | OutputItemFunctionToolCallOutput | OutputItemImageGenToolCall | OutputItemLocalShellToolCall
    | OutputItemLocalShellToolCallOutput | OutputItemMcpApprovalRequest | OutputItemMcpApprovalResponseResource
    | OutputItemMcpToolCall | OutputItemMcpListTools | MemorySearchToolCallItemResource
    | OutputItemMessage | OAuthConsentRequestOutputItem | OpenApiToolCall | OpenApiToolCallOutput
    | OutputItemOutputMessage | OutputItemReasoningItem | SharepointGroundingToolCall
    | SharepointGroundingToolCallOutput | OutputItemFunctionShellCall | OutputItemFunctionShellCallOutput
    | StructuredOutputsOutputItem | OutputItemToolSearchCall | OutputItemToolSearchOutput
    | OutputItemWebSearchToolCall | WorkflowActionOutputItem] | None, history_item_ids:
    Iterable[str] | None, *, context: PlatformContext | None = None) -> None'
  parameters:
  - name: response
    description: The response envelope to persist.
    isRequired: true
    types:
    - <xref:azure.ai.agentserver.responses.models._generated.Response>
  - name: input_items
    description: Optional resolved output items to associate with the response.
    isRequired: true
    types:
    - <xref:typing.Iterable>[<xref:OutputItem>] | <xref:None>
  - name: history_item_ids
    description: Optional history item IDs to link to the response.
    isRequired: true
    types:
    - <xref:typing.Iterable>[<xref:str>] | <xref:None>
  keywordOnlyParameters:
  - name: context
    description: Platform context for multi-tenant partitioning.
    defaultValue: None
    types:
    - <xref:azure.ai.agentserver.responses.PlatformContext> | <xref:None>
  return:
    types:
    - <xref:None>
  exceptions:
  - type: azure.ai.agentserver.responses.store.ResponseAlreadyExistsError
    description: If a non-deleted response with the same ID already exists.
- uid: azure.ai.agentserver.responses.InMemoryResponseProvider.delete
  name: delete
  summary: 'Delete all state for a response ID if present.


    Removes the entry entirely from the store (unlike `delete_response`

    which soft-deletes).'
  signature: 'async delete(response_id: str) -> bool'
  parameters:
  - name: response_id
    description: The unique identifier of the response to remove.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: '`True` if an entry was found and removed, `False` otherwise.'
    types:
    - <xref:bool>
- uid: azure.ai.agentserver.responses.InMemoryResponseProvider.delete_response
  name: delete_response
  summary: 'Delete a stored response envelope by identifier.


