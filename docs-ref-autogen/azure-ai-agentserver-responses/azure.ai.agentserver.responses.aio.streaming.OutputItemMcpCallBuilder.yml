### YamlMime:PythonClass
uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder
name: OutputItemMcpCallBuilder
fullName: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder
module: azure.ai.agentserver.responses.aio.streaming
summary: 'Async scoped builder for MCP call argument deltas and lifecycle events.


  Initialize the MCP call builder.'
constructor:
  syntax: 'OutputItemMcpCallBuilder(stream: ResponseEventStream, output_index: int,
    item_id: str, server_label: str, name: str)'
  parameters:
  - name: stream
    description: The parent event stream.
    isRequired: true
    types:
    - <xref:azure.ai.agentserver.responses.aio.streaming.ResponseEventStream>
  - name: output_index
    description: Zero-based index of this output item.
    isRequired: true
    types:
    - <xref:int>
  - name: item_id
    description: Unique identifier for this output item.
    isRequired: true
    types:
    - <xref:str>
  - name: server_label
    description: Label identifying the MCP server.
    isRequired: true
    types:
    - <xref:str>
  - name: name
    description: Name of the MCP tool being called.
    isRequired: true
    types:
    - <xref:str>
methods:
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.arguments
  name: arguments
  summary: Yield MCP call argument delta and done events.
  signature: 'async arguments(args: str | AsyncIterable[str]) -> AsyncIterator[ResponseErrorEvent
    | ResponseAudioDeltaEvent | ResponseAudioDoneEvent | ResponseAudioTranscriptDeltaEvent
    | ResponseAudioTranscriptDoneEvent | ResponseCodeInterpreterCallCompletedEvent
    | ResponseCodeInterpreterCallInProgressEvent | ResponseCodeInterpreterCallInterpretingEvent
    | ResponseCodeInterpreterCallCodeDeltaEvent | ResponseCodeInterpreterCallCodeDoneEvent
    | ResponseCompletedEvent | ResponseContentPartAddedEvent | ResponseContentPartDoneEvent
    | ResponseCreatedEvent | ResponseCustomToolCallInputDeltaEvent | ResponseCustomToolCallInputDoneEvent
    | ResponseFailedEvent | ResponseFileSearchCallCompletedEvent | ResponseFileSearchCallInProgressEvent
    | ResponseFileSearchCallSearchingEvent | ResponseFunctionCallArgumentsDeltaEvent
    | ResponseFunctionCallArgumentsDoneEvent | ResponseImageGenCallCompletedEvent
    | ResponseImageGenCallGeneratingEvent | ResponseImageGenCallInProgressEvent |
    ResponseImageGenCallPartialImageEvent | ResponseInProgressEvent | ResponseIncompleteEvent
    | ResponseMCPCallCompletedEvent | ResponseMCPCallFailedEvent | ResponseMCPCallInProgressEvent
    | ResponseMCPCallArgumentsDeltaEvent | ResponseMCPCallArgumentsDoneEvent | ResponseMCPListToolsCompletedEvent
    | ResponseMCPListToolsFailedEvent | ResponseMCPListToolsInProgressEvent | ResponseOutputItemAddedEvent
    | ResponseOutputItemDoneEvent | ResponseOutputTextAnnotationAddedEvent | ResponseTextDeltaEvent
    | ResponseTextDoneEvent | ResponseQueuedEvent | ResponseReasoningSummaryPartAddedEvent
    | ResponseReasoningSummaryPartDoneEvent | ResponseReasoningSummaryTextDeltaEvent
    | ResponseReasoningSummaryTextDoneEvent | ResponseReasoningTextDeltaEvent | ResponseReasoningTextDoneEvent
    | ResponseRefusalDeltaEvent | ResponseRefusalDoneEvent | ResponseWebSearchCallCompletedEvent
    | ResponseWebSearchCallInProgressEvent | ResponseWebSearchCallSearchingEvent]'
  parameters:
  - name: args
    description: Complete arguments string or async iterable of chunks.
    isRequired: true
    types:
    - <xref:str> | <xref:typing.AsyncIterable>[<xref:str>]
  return:
    description: An async iterator of event dicts.
    types:
    - <xref:typing.AsyncIterator>[<xref:ResponseStreamEvent>]
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.emit_added
  name: emit_added
  summary: Emit an `output_item.added` event for an MCP call.
  signature: emit_added() -> ResponseOutputItemAddedEvent
  return:
    description: The emitted event dict.
    types:
    - <xref:azure.ai.agentserver.responses.models.ResponseOutputItemAddedEvent>
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.emit_arguments_delta
  name: emit_arguments_delta
  summary: Emit an MCP call arguments delta event.
  signature: 'emit_arguments_delta(delta: str) -> ResponseMCPCallArgumentsDeltaEvent'
  parameters:
  - name: delta
    description: The incremental arguments text fragment.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: The emitted event dict.
    types:
    - <xref:azure.ai.agentserver.responses.models.ResponseMCPCallArgumentsDeltaEvent>
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.emit_arguments_done
  name: emit_arguments_done
  summary: Emit an MCP call arguments done event.
  signature: 'emit_arguments_done(arguments: str) -> ResponseMCPCallArgumentsDoneEvent'
  parameters:
  - name: arguments
    description: The final, complete arguments string.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: The emitted event dict.
    types:
    - <xref:azure.ai.agentserver.responses.models.ResponseMCPCallArgumentsDoneEvent>
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.emit_completed
  name: emit_completed
  summary: Emit an MCP call completed state event.
  signature: emit_completed() -> ResponseMCPCallCompletedEvent
  return:
    description: The emitted event dict.
    types:
    - <xref:azure.ai.agentserver.responses.models.ResponseMCPCallCompletedEvent>
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.emit_done
  name: emit_done
  summary: 'Emit an `output_item.done` event for this MCP call.


    The `status` field reflects the most recent terminal state event

    (`emit_completed` or `emit_failed`). Defaults to `"completed"`

    if neither was called.'
  signature: 'emit_done(*, output: str | None = None, error: dict[str, Any] | None
    = None) -> ResponseOutputItemDoneEvent'
  keywordOnlyParameters:
  - name: output
    description: Optional MCP tool output payload.
    defaultValue: None
    types:
    - <xref:type>
  - name: output
    description: str | None
  - name: error
    description: Optional MCP tool error payload.
    defaultValue: None
    types:
    - <xref:type>
  - name: error
    description: dict[str, Any] | None
  return:
    description: The emitted event dict.
    types:
    - <xref:azure.ai.agentserver.responses.models.ResponseOutputItemDoneEvent>
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.emit_failed
  name: emit_failed
  summary: Emit an MCP call failed state event.
  signature: emit_failed() -> ResponseMCPCallFailedEvent
  return:
    description: The emitted event dict.
    types:
    - <xref:azure.ai.agentserver.responses.models.ResponseMCPCallFailedEvent>
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.emit_in_progress
  name: emit_in_progress
  summary: Emit an MCP call in-progress state event.
  signature: emit_in_progress() -> ResponseMCPCallInProgressEvent
  return:
    description: The emitted event dict.
    types:
    - <xref:azure.ai.agentserver.responses.models.ResponseMCPCallInProgressEvent>
attributes:
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.internal_metadata
  name: internal_metadata
  summary: 'Live, mutable framework-internal metadata for this output item.


    Read / write / delete in place (`message.internal_metadata["step"] = "n3"`).

    Whatever is set here is merged into the emitted `output_item.added` /

    `output_item.done` payloads under the item''s `internal_metadata` key

    (and thus onto `stream.response.output[i]`), and is stripped from every

    client-facing payload. Values may be any JSON-serialisable type.'
  return:
    types:
    - <xref:collections.abc.MutableMapping>[<xref:str>, <xref:typing.Any>]
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.item_id
  name: item_id
  summary: Return the output item identifier.
  return:
    description: The item ID.
    types:
    - <xref:str>
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.name
  name: name
  summary: Return the MCP tool name.
  return:
    description: The tool name.
    types:
    - <xref:str>
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.output_index
  name: output_index
  summary: Return the zero-based output index.
  return:
    description: The output index.
    types:
    - <xref:int>
- uid: azure.ai.agentserver.responses.aio.streaming.OutputItemMcpCallBuilder.server_label
  name: server_label
  summary: Return the MCP server label.
  return:
    description: The server label.
    types:
    - <xref:str>
