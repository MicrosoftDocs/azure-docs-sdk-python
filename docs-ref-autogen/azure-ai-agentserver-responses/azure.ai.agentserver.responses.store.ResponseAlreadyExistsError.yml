### YamlMime:PythonClass
uid: azure.ai.agentserver.responses.store.ResponseAlreadyExistsError
name: ResponseAlreadyExistsError
fullName: azure.ai.agentserver.responses.store.ResponseAlreadyExistsError
module: azure.ai.agentserver.responses.store
summary: 'Raised by a response-store provider when `create_response` is called for

  a `response_id` that already has a non-deleted entry.


  Callers should treat this as the idempotent-create signal: the response is

  already persisted from a prior attempt (typically a recovered handler

  re-emitting `response.created`), and there is no need to write again.

  Continue execution toward the terminal `update_response`.'
constructor:
  syntax: 'ResponseAlreadyExistsError(response_id: str)'
  parameters:
  - name: response_id
    description: The response identifier that already exists.
    isRequired: true
    types:
    - <xref:str>
