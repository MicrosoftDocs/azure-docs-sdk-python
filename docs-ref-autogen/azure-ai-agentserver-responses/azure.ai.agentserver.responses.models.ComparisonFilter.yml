uid: azure.ai.agentserver.responses.models.ComparisonFilter
name: ComparisonFilter
fullName: azure.ai.agentserver.responses.models.ComparisonFilter
module: azure.ai.agentserver.responses.models
summary: Comparison Filter.
constructor:
  syntax: ComparisonFilter()
variables:
- description: "Specifies the comparison operator: `eq`, `ne`, `gt`, `gte`, `lt`,\n\
    `lte`, `in`, `nin`.\n\n* *eq*: equals \n\n* *ne*: not equal \n\n* *gt*: greater\
    \ than \n\n* *gte*: greater than or equal \n\n* *lt*: less than \n\n* *lte*: less\
    \ than or equal \n\n* *in*: in \n\n* *nin*: not in. Required. Is one of the following\
    \ types: Literal[\"eq\"], Literal[\"ne\"], Literal[\"gt\"], Literal[\"gte\"],\
    \ Literal[\"lt\"], Literal[\"lte\"], Literal[\"in\"], Literal[\"nin\"]"
  name: type
  types:
  - <xref:typing.Literal>["eq", "ne", "gt", "gte", "lt", "lte", "in", "nin"]
- description: The key to compare against the value. Required.
  name: key
  types:
  - <xref:str>
- description: 'The value to compare against the attribute key; supports string, number,
    or

    boolean types. Required. Is one of the following types: str, float, bool, [Union[str,
    float]]'
  name: value
  types:
  - <xref:typing.Union>[<xref:str>, <xref:float>, <xref:bool>, <xref:list>[<xref:typing.Union>[<xref:str>,
    <xref:float>]]]
