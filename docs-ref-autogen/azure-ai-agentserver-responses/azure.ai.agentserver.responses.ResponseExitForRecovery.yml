### YamlMime:PythonClass
uid: azure.ai.agentserver.responses.ResponseExitForRecovery
name: ResponseExitForRecovery
fullName: azure.ai.agentserver.responses.ResponseExitForRecovery
module: azure.ai.agentserver.responses
summary: "Control-flow signal raised by <xref:azure.ai.agentserver.responses.ResponseContext.exit_for_recovery>.\n\
  \nSubclasses <xref:BaseException> (NOT <xref:Exception>) \u2014 like\n<xref:asyncio.CancelledError>\
  \ / <xref:GeneratorExit> \u2014 so a handler's\nbroad `except Exception` cannot\
  \ accidentally swallow the recovery signal.\n`try/finally` cleanup still runs. The\
  \ framework catches it at the resilient\ntask boundary and leaves the response `in_progress`\
  \ for the next-lifetime\nrecovery scanner.\n\nHandlers never construct or catch\
  \ this directly; they simply\n`await context.exit_for_recovery()` (which raises\
  \ it), in any handler\nshape \u2014 coroutine, async generator, or sync."
constructor:
  syntax: ResponseExitForRecovery()
