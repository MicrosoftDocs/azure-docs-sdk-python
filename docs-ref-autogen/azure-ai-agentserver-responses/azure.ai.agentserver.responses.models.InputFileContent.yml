uid: azure.ai.agentserver.responses.models.InputFileContent
name: InputFileContent
fullName: azure.ai.agentserver.responses.models.InputFileContent
module: azure.ai.agentserver.responses.models
summary: Input file.
constructor:
  syntax: InputFileContent()
variables:
- description: 'The type of the input item. Always `input_file`. Required. Default
    value is

    "input_file".'
  name: type
  types:
  - <xref:typing.Literal>["input_file"]
- name: file_id
  types:
  - <xref:str>
- description: The name of the file to be sent to the model.
  name: filename
  types:
  - <xref:str>
- description: The content of the file to be sent to the model.
  name: file_data
  types:
  - <xref:str>
- name: prompt_cache_breakpoint
  types:
  - <xref:<xref:"PromptCacheBreakpointConfig">>
- description: The URL of the file to be sent to the model.
  name: file_url
  types:
  - <xref:str>
- description: 'The detail level of the file to be sent to the model. Use `auto` to
    let the

    system select the detail level; for GPT-5.6 and later models, `auto` uses high-quality

    rendering, which may increase input token usage. Use `low` for lower-cost rendering,
    or

    `high` to render the file at higher quality. Defaults to `auto`. Known values
    are: "auto",

    "low", and "high".'
  name: detail
  types:
  - <xref:FileInputDetail>
