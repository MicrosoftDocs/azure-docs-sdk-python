    \ Literal[\"connector_outlookcalendar\"], Literal[\"connector_outlookemail\"],\
    \ Literal[\"connector_sharepoint\"] "
  signature: 'connector_id: Literal[''connector_dropbox'', ''connector_gmail'', ''connector_googlecalendar'',
