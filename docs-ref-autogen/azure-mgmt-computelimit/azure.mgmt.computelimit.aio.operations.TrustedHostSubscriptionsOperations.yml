- uid: azure.mgmt.computelimit.aio.operations.TrustedHostSubscriptionsOperations.create
  name: create
  summary: 'Adds a host subscription to the guest subscription''s list of trusted
    hosts. A guest

    subscription can trust multiple host subscriptions; this only establishes trust
    and does not

    check the guest in to the host. Guest-to-host association is determined at check-in
    time, where

    a subscription can be a guest of at most one host per region.'
  signature: 'async create(location: str, host_subscription_id: str, resource: _models.TrustedHostSubscription,
    *, content_type: str = ''application/json'', **kwargs: Any) -> _models.TrustedHostSubscription'
  parameters:
  - name: location
    description: The name of the Azure region. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: host_subscription_id
    description: The name of the TrustedHostSubscription. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: resource
    description: 'Resource create parameters. Is either a TrustedHostSubscription
      type or a

      IO[bytes] type. Required.'
    isRequired: true
    types:
    - <xref:azure.mgmt.computelimit.models.TrustedHostSubscription>
    - <xref:azure.mgmt.computelimit.types.TrustedHostSubscription>
    - <xref:typing.IO>[<xref:bytes>]
  return:
    description: TrustedHostSubscription. The TrustedHostSubscription is compatible
      with MutableMapping
    types:
    - <xref:azure.mgmt.computelimit.models.TrustedHostSubscription>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
