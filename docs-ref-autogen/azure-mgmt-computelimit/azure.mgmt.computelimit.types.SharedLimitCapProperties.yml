### YamlMime:PythonClass
uid: azure.mgmt.computelimit.types.SharedLimitCapProperties
name: SharedLimitCapProperties
fullName: azure.mgmt.computelimit.types.SharedLimitCapProperties
module: azure.mgmt.computelimit.types
summary: Properties of a shared limit cap resource.
constructor:
  syntax: SharedLimitCapProperties()
variables:
- description: 'The default member cap value (in count units). Set to a non-negative

    integer to apply a cap to all member subscriptions that do not have a per-member
    override. Omit

    the property to leave no default cap in effect.'
  name: default_member_cap
  types:
  - <xref:int>
- description: 'Controls whether the service validates the aggregate cap against the

    group limit for the VM family.


    SUM(caps) is the sum of all per-member overrides'' cap values plus

    `defaultMemberCap` multiplied by the number of member subscriptions without an
    override.


    When true, the service rejects any configuration where SUM(caps)

    exceeds the group limit. When false, SUM(caps) is permitted to exceed

    the group limit.


    Enabling this flag is rejected if the current configuration already breaches the
    group limit;

    reduce caps first, then enable. Required.'
  name: is_bounded_cap
  types:
  - <xref:bool>
- description: 'The provisioning state of the resource. Known values are:

    "Succeeded", "Failed", and "Canceled".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceProvisioningState">]
attributes:
- uid: azure.mgmt.computelimit.types.SharedLimitCapProperties.defaultMemberCap
  name: defaultMemberCap
  summary: 'The default member cap value (in count units). Set to a non-negative integer
    to apply a cap to

    all member subscriptions that do not have a per-member override. Omit the property
    to leave no

    default cap in effect.'
  signature: 'defaultMemberCap: int'
- uid: azure.mgmt.computelimit.types.SharedLimitCapProperties.isBoundedCap
  name: isBoundedCap
  summary: 'Controls whether the service validates the aggregate cap against the

    group limit for the VM family.


    SUM(caps) is the sum of all per-member overrides'' cap values plus

    `defaultMemberCap` multiplied by the number of member subscriptions without an
    override.


    When true, the service rejects any configuration where SUM(caps)

    exceeds the group limit. When false, SUM(caps) is permitted to exceed

    the group limit.


    Enabling this flag is rejected if the current configuration already breaches the
    group limit;

    reduce caps first, then enable. Required.'
  signature: 'isBoundedCap: Required[bool]'
- uid: azure.mgmt.computelimit.types.SharedLimitCapProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", and

    "Canceled".'
  signature: 'provisioningState: str | ResourceProvisioningState'
