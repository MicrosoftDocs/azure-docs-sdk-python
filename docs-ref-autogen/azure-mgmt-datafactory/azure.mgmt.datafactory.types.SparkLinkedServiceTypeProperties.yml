### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties
name: SparkLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Spark Server linked service properties.
constructor:
  syntax: SparkLinkedServiceTypeProperties()
variables:
- description: IP address or host name of the Spark server. Required.
  name: host
  types:
  - <xref:typing.Any>
- description: The TCP port that the Spark server uses to listen for client connections.
    Required.
  name: port
  types:
  - <xref:typing.Any>
- description: 'The type of Spark server. Known values are: "SharkServer", "SharkServer2",

    and "SparkThriftServer".'
  name: server_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SparkServerType">]
- description: 'The transport protocol to use in the Thrift layer. Known

    values are: "Binary", "SASL", and "HTTP ".'
  name: thrift_transport_protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SparkThriftTransportProtocol">]
- description: 'The authentication method used to access the Spark server. Required.

    Known values are: "Anonymous", "Username", "UsernameAndPassword", and

    "WindowsAzureHDInsightService".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SparkAuthenticationType">]
- description: The user name that you use to access Spark Server.
  name: username
  types:
  - <xref:typing.Any>
- description: 'The password corresponding to the user name that you provided in the
    Username

    field.'
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: The partial URL corresponding to the Spark server.
  name: http_path
  types:
  - <xref:typing.Any>
- description: 'Specifies whether the connections to the server are encrypted using
    SSL. The

    default value is false.'
  name: enable_ssl
  types:
  - <xref:typing.Any>
- description: 'Specifies whether the connections to the server

    will validate server certificate, the default value is True. Only used for Version
    2.0.'
  name: enable_server_certificate_validation
  types:
  - <xref:typing.Any>
- description: 'The full path of the .pem file containing trusted CA certificates
    for

    verifying the server when connecting over SSL. This property can only be set when
    using SSL on

    self-hosted IR. The default value is the cacerts.pem file installed with the IR.'
  name: trusted_cert_path
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to use a CA certificate from the system trust

    store or from a specified PEM file. The default value is false.'
  name: use_system_trust_store
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require a CA-issued SSL certificate

    name to match the host name of the server when connecting over SSL. The default
    value is false.'
  name: allow_host_name_cn_mismatch
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to allow self-signed certificates from

    the server. The default value is false.'
  name: allow_self_signed_server_cert
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.allowHostNameCNMismatch
  name: allowHostNameCNMismatch
  summary: 'Specifies whether to require a CA-issued SSL certificate name to match
    the host name of the

    server when connecting over SSL. The default value is false.'
  signature: 'allowHostNameCNMismatch: Any'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.allowSelfSignedServerCert
  name: allowSelfSignedServerCert
  summary: 'Specifies whether to allow self-signed certificates from the server. The
    default value is

    false.'
  signature: 'allowSelfSignedServerCert: Any'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: 'The authentication method used to access the Spark server. Required. Known
    values are:

    "Anonymous", "Username", "UsernameAndPassword", and "WindowsAzureHDInsightService".'
  signature: 'authenticationType: Required[str | SparkAuthenticationType]'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.enableServerCertificateValidation
  name: enableServerCertificateValidation
  summary: 'Specifies whether the connections to the server will validate server certificate,
    the default

    value is True. Only used for Version 2.0.'
  signature: 'enableServerCertificateValidation: Any'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.enableSsl
  name: enableSsl
  summary: 'Specifies whether the connections to the server are encrypted using SSL.
    The default value is

    false.'
  signature: 'enableSsl: Any'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.host
  name: host
  summary: IP address or host name of the Spark server. Required.
  signature: 'host: Required[Any]'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.httpPath
  name: httpPath
  summary: The partial URL corresponding to the Spark server.
  signature: 'httpPath: Any'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.password
  name: password
  summary: The password corresponding to the user name that you provided in the Username
    field.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.port
  name: port
  summary: The TCP port that the Spark server uses to listen for client connections.
    Required.
  signature: 'port: Required[Any]'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.serverType
  name: serverType
  summary: '"SharkServer", "SharkServer2", and

    "SparkThriftServer".'
  signature: 'serverType: str | SparkServerType'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.thriftTransportProtocol
  name: thriftTransportProtocol
  summary: '"Binary", "SASL", and

    "HTTP ".'
  signature: 'thriftTransportProtocol: str | SparkThriftTransportProtocol'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.trustedCertPath
  name: trustedCertPath
  summary: 'The full path of the .pem file containing trusted CA certificates for
    verifying the server when

    connecting over SSL. This property can only be set when using SSL on self-hosted
    IR. The

    default value is the cacerts.pem file installed with the IR.'
  signature: 'trustedCertPath: Any'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.useSystemTrustStore
  name: useSystemTrustStore
  summary: 'Specifies whether to use a CA certificate from the system trust store
    or from a specified PEM

    file. The default value is false.'
  signature: 'useSystemTrustStore: Any'
- uid: azure.mgmt.datafactory.types.SparkLinkedServiceTypeProperties.username
  name: username
  summary: The user name that you use to access Spark Server.
  signature: 'username: Any'
