### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.EloquaLinkedServiceTypeProperties
name: EloquaLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.EloquaLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Eloqua server linked service properties.
constructor:
  syntax: EloquaLinkedServiceTypeProperties()
variables:
- description: The endpoint of the Eloqua server. (i.e. eloqua.example.com). Required.
  name: endpoint
  types:
  - <xref:typing.Any>
- description: 'The site name and user name of your Eloqua account in the form:

    sitename/username. (i.e. Eloqua/Alice). Required.'
  name: username
  types:
  - <xref:typing.Any>
- description: The password corresponding to the user name.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specifies whether the data source endpoints are encrypted using

    HTTPS. The default value is true.'
  name: use_encrypted_endpoints
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require the host name in the server''s

    certificate to match the host name of the server when connecting over SSL. The
    default value is

    true.'
  name: use_host_verification
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to verify the identity of the server when

    connecting over SSL. The default value is true.'
  name: use_peer_verification
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.EloquaLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.EloquaLinkedServiceTypeProperties.endpoint
  name: endpoint
  summary: The endpoint of the Eloqua server. (i.e. eloqua.example.com). Required.
  signature: 'endpoint: Any'
- uid: azure.mgmt.datafactory.types.EloquaLinkedServiceTypeProperties.password
  name: password
  summary: The password corresponding to the user name.
  signature: 'password: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.EloquaLinkedServiceTypeProperties.useEncryptedEndpoints
  name: useEncryptedEndpoints
  summary: 'Specifies whether the data source endpoints are encrypted using HTTPS.
    The default value is

    true.'
  signature: 'useEncryptedEndpoints: Any'
- uid: azure.mgmt.datafactory.types.EloquaLinkedServiceTypeProperties.useHostVerification
  name: useHostVerification
  summary: 'Specifies whether to require the host name in the server''s certificate
    to match the host name

    of the server when connecting over SSL. The default value is true.'
  signature: 'useHostVerification: Any'
- uid: azure.mgmt.datafactory.types.EloquaLinkedServiceTypeProperties.usePeerVerification
  name: usePeerVerification
  summary: 'Specifies whether to verify the identity of the server when connecting
    over SSL. The default

    value is true.'
  signature: 'usePeerVerification: Any'
- uid: azure.mgmt.datafactory.types.EloquaLinkedServiceTypeProperties.username
  name: username
  summary: 'sitename/username. (i.e.

    Eloqua/Alice). Required.'
  signature: 'username: Any'
