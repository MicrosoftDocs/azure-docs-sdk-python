### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.MongoDbLinkedServiceTypeProperties
name: MongoDbLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.MongoDbLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: MongoDB linked service properties.
constructor:
  syntax: MongoDbLinkedServiceTypeProperties()
variables:
- description: 'The IP address or server name of the MongoDB server. Type: string
    (or Expression

    with resultType string). Required.'
  name: server
  types:
  - <xref:typing.Any>
- description: 'The authentication type to be used to connect to the MongoDB

    database. Known values are: "Basic" and "Anonymous".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MongoDbAuthenticationType">]
- description: 'The name of the MongoDB database that you want to access. Type: string
    (or

    Expression with resultType string). Required.'
  name: database_name
  types:
  - <xref:typing.Any>
- description: 'Username for authentication. Type: string (or Expression with resultType

    string).'
  name: username
  types:
  - <xref:typing.Any>
- description: Password for authentication.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Database to verify the username and password. Type: string (or Expression

    with resultType string).'
  name: auth_source
  types:
  - <xref:typing.Any>
- description: 'The TCP port number that the MongoDB server uses to listen for client
    connections.

    The default value is 27017. Type: integer (or Expression with resultType integer),
    minimum: 0.'
  name: port
  types:
  - <xref:typing.Any>
- description: 'Specifies whether the connections to the server are encrypted using
    SSL. The

    default value is false. Type: boolean (or Expression with resultType boolean).'
  name: enable_ssl
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to allow self-signed certificates from

    the server. The default value is false. Type: boolean (or Expression with resultType
    boolean).'
  name: allow_self_signed_server_cert
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.MongoDbLinkedServiceTypeProperties.allowSelfSignedServerCert
  name: allowSelfSignedServerCert
  summary: 'Specifies whether to allow self-signed certificates from the server. The
    default value is

    false. Type: boolean (or Expression with resultType boolean).'
  signature: 'allowSelfSignedServerCert: Any'
- uid: azure.mgmt.datafactory.types.MongoDbLinkedServiceTypeProperties.authSource
  name: authSource
  summary: 'string (or Expression with resultType

    string).'
  signature: 'authSource: Any'
- uid: azure.mgmt.datafactory.types.MongoDbLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: 'The authentication type to be used to connect to the MongoDB database.
    Known values are:

    "Basic" and "Anonymous".'
  signature: 'authenticationType: str | MongoDbAuthenticationType'
- uid: azure.mgmt.datafactory.types.MongoDbLinkedServiceTypeProperties.databaseName
  name: databaseName
  summary: 'string (or Expression with

    resultType string). Required.'
  signature: 'databaseName: Required[Any]'
- uid: azure.mgmt.datafactory.types.MongoDbLinkedServiceTypeProperties.enableSsl
  name: enableSsl
  summary: 'Specifies whether the connections to the server are encrypted using SSL.
    The default value is

    false. Type: boolean (or Expression with resultType boolean).'
  signature: 'enableSsl: Any'
- uid: azure.mgmt.datafactory.types.MongoDbLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.MongoDbLinkedServiceTypeProperties.password
  name: password
  summary: Password for authentication.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.MongoDbLinkedServiceTypeProperties.port
  name: port
  summary: 'The TCP port number that the MongoDB server uses to listen for client
    connections. The default

    value is 27017. Type: integer (or Expression with resultType integer), minimum:
    0.'
  signature: 'port: Any'
- uid: azure.mgmt.datafactory.types.MongoDbLinkedServiceTypeProperties.server
  name: server
  summary: 'string (or Expression with

    resultType string). Required.'
  signature: 'server: Required[Any]'
- uid: azure.mgmt.datafactory.types.MongoDbLinkedServiceTypeProperties.username
  name: username
  summary: string (or Expression with resultType string).
  signature: 'username: Any'
