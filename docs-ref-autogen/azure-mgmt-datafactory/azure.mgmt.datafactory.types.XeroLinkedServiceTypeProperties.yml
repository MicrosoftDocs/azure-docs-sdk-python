### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.XeroLinkedServiceTypeProperties
name: XeroLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.XeroLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Xero Service linked service properties.
constructor:
  syntax: XeroLinkedServiceTypeProperties()
variables:
- description: 'Properties used to connect to Xero. It is mutually exclusive with

    any other properties in the linked service. Type: object.'
  name: connection_properties
  types:
  - <xref:typing.Any>
- description: The endpoint of the Xero server. (i.e. api.xero.com).
  name: host
  types:
  - <xref:typing.Any>
- description: The consumer key associated with the Xero application.
  name: consumer_key
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The private key from the .pem file that was generated for your Xero
    private

    application. You must include all the text from the .pem file, including the Unix
    line endings(

    ).'
  name: private_key
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specifies whether the data source endpoints are encrypted using

    HTTPS. The default value is true.'
  name: use_encrypted_endpoints
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require the host name in the server''s

    certificate to match the host name of the server when connecting over SSL. The
    default value is

    true.'
  name: use_host_verification
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to verify the identity of the server when

    connecting over SSL. The default value is true.'
  name: use_peer_verification
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.XeroLinkedServiceTypeProperties.connectionProperties
  name: connectionProperties
  summary: 'Properties used to connect to Xero. It is mutually exclusive with any
    other properties in the

    linked service. Type: object.'
  signature: 'connectionProperties: Any'
- uid: azure.mgmt.datafactory.types.XeroLinkedServiceTypeProperties.consumerKey
  name: consumerKey
  summary: The consumer key associated with the Xero application.
  signature: 'consumerKey: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.XeroLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.XeroLinkedServiceTypeProperties.host
  name: host
  summary: The endpoint of the Xero server. (i.e. api.xero.com).
  signature: 'host: Any'
- uid: azure.mgmt.datafactory.types.XeroLinkedServiceTypeProperties.privateKey
  name: privateKey
  summary: 'The private key from the .pem file that was generated for your Xero private
    application. You

    must include all the text from the .pem file, including the Unix line endings(
    ).'
  signature: 'privateKey: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.XeroLinkedServiceTypeProperties.useEncryptedEndpoints
  name: useEncryptedEndpoints
  summary: 'Specifies whether the data source endpoints are encrypted using HTTPS.
    The default value is

    true.'
  signature: 'useEncryptedEndpoints: Any'
- uid: azure.mgmt.datafactory.types.XeroLinkedServiceTypeProperties.useHostVerification
  name: useHostVerification
  summary: 'Specifies whether to require the host name in the server''s certificate
    to match the host name

    of the server when connecting over SSL. The default value is true.'
  signature: 'useHostVerification: Any'
- uid: azure.mgmt.datafactory.types.XeroLinkedServiceTypeProperties.usePeerVerification
  name: usePeerVerification
  summary: 'Specifies whether to verify the identity of the server when connecting
    over SSL. The default

    value is true.'
  signature: 'usePeerVerification: Any'
