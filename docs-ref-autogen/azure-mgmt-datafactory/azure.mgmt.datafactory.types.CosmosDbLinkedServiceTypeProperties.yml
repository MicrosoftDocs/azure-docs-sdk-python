### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties
name: CosmosDbLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: CosmosDB linked service properties.
constructor:
  syntax: CosmosDbLinkedServiceTypeProperties()
variables:
- description: 'The connection string. Type: string, SecureString or

    AzureKeyVaultSecretReference.'
  name: connection_string
  types:
  - <xref:typing.Any>
- description: 'The endpoint of the Azure CosmosDB account. Type: string (or Expression

    with resultType string).'
  name: account_endpoint
  types:
  - <xref:typing.Any>
- description: 'The name of the database. Type: string (or Expression with resultType
    string).'
  name: database
  types:
  - <xref:typing.Any>
- description: 'The account key of the Azure CosmosDB account. Type: SecureString
    or

    AzureKeyVaultSecretReference.'
  name: account_key
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The client ID of the application in Azure Active Directory used for

    Server-To-Server authentication. Type: string (or Expression with resultType string).'
  name: service_principal_id
  types:
  - <xref:typing.Any>
- description: 'The service principal credential type to use in

    Server-To-Server authentication. ''ServicePrincipalKey'' for key/secret, ''ServicePrincipalCert''

    for certificate. Type: string.'
  name: service_principal_credential_type
  types:
  - <xref:typing.Any>
- description: 'The credential of the service principal object in Azure

    Active Directory. If servicePrincipalCredentialType is ''ServicePrincipalKey'',

    servicePrincipalCredential can be SecureString or AzureKeyVaultSecretReference.
    If

    servicePrincipalCredentialType is ''ServicePrincipalCert'', servicePrincipalCredential
    can only

    be AzureKeyVaultSecretReference.'
  name: service_principal_credential
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The name or ID of the tenant to which the service principal belongs.
    Type: string

    (or Expression with resultType string).'
  name: tenant
  types:
  - <xref:typing.Any>
- description: 'Indicates the azure cloud type of the service principle auth. Allowed

    values are AzurePublic, AzureChina, AzureUsGovernment, AzureGermany. Default value
    is the data

    factory regions'' cloud type. Type: string (or Expression with resultType string).'
  name: azure_cloud_type
  types:
  - <xref:typing.Any>
- description: 'The connection mode used to access CosmosDB account. Type: string.
    Known

    values are: "Gateway" and "Direct".'
  name: connection_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CosmosDbConnectionMode">]
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: The credential reference containing authentication information.
  name: credential
  types:
  - <xref:<xref:"CredentialReference">>
attributes:
- uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties.accountEndpoint
  name: accountEndpoint
  summary: 'string (or Expression with resultType

    string).'
  signature: 'accountEndpoint: Any'
- uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties.accountKey
  name: accountKey
  summary: 'SecureString or

    AzureKeyVaultSecretReference.'
  signature: 'accountKey: SecretBase'
- uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties.azureCloudType
  name: azureCloudType
  summary: 'Indicates the azure cloud type of the service principle auth. Allowed
    values are AzurePublic,

    AzureChina, AzureUsGovernment, AzureGermany. Default value is the data factory
    regions'' cloud

    type. Type: string (or Expression with resultType string).'
  signature: 'azureCloudType: Any'
- uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties.connectionMode
  name: connectionMode
  summary: 'string. Known values are:

    "Gateway" and "Direct".'
  signature: 'connectionMode: str | CosmosDbConnectionMode'
- uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties.connectionString
  name: connectionString
  summary: string, SecureString or AzureKeyVaultSecretReference.
  signature: 'connectionString: Any'
- uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties.credential
  name: credential
  summary: The credential reference containing authentication information.
  signature: 'credential: CredentialReference'
- uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties.database
  name: database
  summary: string (or Expression with resultType string).
  signature: 'database: Any'
- uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties.servicePrincipalCredential
  name: servicePrincipalCredential
  summary: 'The credential of the service principal object in Azure Active Directory.
    If

    servicePrincipalCredentialType is ''ServicePrincipalKey'', servicePrincipalCredential
    can be

    SecureString or AzureKeyVaultSecretReference. If servicePrincipalCredentialType
    is

    ''ServicePrincipalCert'', servicePrincipalCredential can only be AzureKeyVaultSecretReference.'
  signature: 'servicePrincipalCredential: SecretBase'
- uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties.servicePrincipalCredentialType
  name: servicePrincipalCredentialType
  summary: 'The service principal credential type to use in Server-To-Server authentication.

    ''ServicePrincipalKey'' for key/secret, ''ServicePrincipalCert'' for certificate.
    Type: string.'
  signature: 'servicePrincipalCredentialType: Any'
- uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties.servicePrincipalId
  name: servicePrincipalId
  summary: 'The client ID of the application in Azure Active Directory used for Server-To-Server

    authentication. Type: string (or Expression with resultType string).'
  signature: 'servicePrincipalId: Any'
- uid: azure.mgmt.datafactory.types.CosmosDbLinkedServiceTypeProperties.tenant
  name: tenant
  summary: 'string (or

    Expression with resultType string).'
  signature: 'tenant: Any'
