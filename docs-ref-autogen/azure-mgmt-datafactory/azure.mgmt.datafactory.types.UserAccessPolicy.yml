### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.UserAccessPolicy
name: UserAccessPolicy
fullName: azure.mgmt.datafactory.types.UserAccessPolicy
module: azure.mgmt.datafactory.types
summary: Get Data Plane read only token request definition.
constructor:
  syntax: UserAccessPolicy()
variables:
- description: 'The string with permissions for Data Plane access. Currently only
    ''r'' is

    supported which grants read only access.'
  name: permissions
  types:
  - <xref:str>
- description: 'The resource path to get access relative to factory. Currently only

    empty string is supported which corresponds to the factory resource.'
  name: access_resource_path
  types:
  - <xref:str>
- description: 'The name of the profile. Currently only the default is supported.
    The

    default value is DefaultProfile.'
  name: profile_name
  types:
  - <xref:str>
- description: Start time for the token. If not specified the current time will be
    used.
  name: start_time
  types:
  - <xref:str>
- description: 'Expiration time for the token. Maximum duration for the token is eight
    hours

    and by default the token will expire in eight hours.'
  name: expire_time
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.UserAccessPolicy.accessResourcePath
  name: accessResourcePath
  summary: 'The resource path to get access relative to factory. Currently only empty
    string is supported

    which corresponds to the factory resource.'
  signature: 'accessResourcePath: str'
- uid: azure.mgmt.datafactory.types.UserAccessPolicy.expireTime
  name: expireTime
  summary: 'Expiration time for the token. Maximum duration for the token is eight
    hours and by default the

    token will expire in eight hours.'
  signature: 'expireTime: str'
- uid: azure.mgmt.datafactory.types.UserAccessPolicy.permissions
  name: permissions
  summary: 'The string with permissions for Data Plane access. Currently only ''r''
    is supported which grants

    read only access.'
  signature: 'permissions: str'
- uid: azure.mgmt.datafactory.types.UserAccessPolicy.profileName
  name: profileName
  summary: 'The name of the profile. Currently only the default is supported. The
    default value is

    DefaultProfile.'
  signature: 'profileName: str'
- uid: azure.mgmt.datafactory.types.UserAccessPolicy.startTime
  name: startTime
  summary: Start time for the token. If not specified the current time will be used.
  signature: 'startTime: str'
