### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.DataFlow
name: DataFlow
fullName: azure.mgmt.datafactory.models.DataFlow
module: azure.mgmt.datafactory.models
summary: 'Azure Data Factory nested object which contains a flow with data movements
  and transformations.


  You probably want to use the sub-classes and not this class directly. Known sub-classes
  are:

  Flowlet, MappingDataFlow, WranglingDataFlow'
constructor:
  syntax: 'DataFlow(*args: Any, **kwargs: Any)'
variables:
- description: Type of data flow. Required. Default value is None.
  name: type
  types:
  - <xref:str>
- description: The description of the data flow.
  name: description
  types:
  - <xref:str>
- description: List of tags that can be used for describing the data flow.
  name: annotations
  types:
  - <xref:list>[<xref:any>]
- description: 'The folder that this data flow is in. If not specified, Data flow
    will appear at

    the root level.'
  name: folder
  types:
  - <xref:azure.mgmt.datafactory.models.DataFlowFolder>
attributes:
- uid: azure.mgmt.datafactory.models.DataFlow.annotations
  name: annotations
  summary: List of tags that can be used for describing the data flow.
  signature: 'annotations: list[Any] | None'
- uid: azure.mgmt.datafactory.models.DataFlow.description
  name: description
  summary: The description of the data flow.
  signature: 'description: str | None'
- uid: azure.mgmt.datafactory.models.DataFlow.folder
  name: folder
  summary: 'The folder that this data flow is in. If not specified, Data flow will
    appear at the root

    level.'
  signature: 'folder: _models.DataFlowFolder | None'
- uid: azure.mgmt.datafactory.models.DataFlow.type
  name: type
  summary: Type of data flow. Required. Default value is None.
