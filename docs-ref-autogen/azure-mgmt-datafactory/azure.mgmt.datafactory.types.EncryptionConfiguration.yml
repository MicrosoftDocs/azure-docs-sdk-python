    If not provided Managed

    Service Identity will be used.'
  signature: 'identity: CMKIdentityDefinition'
- uid: azure.mgmt.datafactory.types.EncryptionConfiguration.keyName
  name: keyName
  summary: The name of the key in Azure Key Vault to use as Customer Managed Key.
    Required.
