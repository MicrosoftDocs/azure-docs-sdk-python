### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties
name: PrestoLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Presto server linked service properties.
constructor:
  syntax: PrestoLinkedServiceTypeProperties()
variables:
- description: The IP address or host name of the Presto server. (i.e. 192.168.222.160).
    Required.
  name: host
  types:
  - <xref:typing.Any>
- description: 'The version of the Presto server. (i.e. 0.148-t) Only used for Version

    1.0.'
  name: server_version
  types:
  - <xref:typing.Any>
- description: The catalog context for all request against the server. Required.
  name: catalog
  types:
  - <xref:typing.Any>
- description: 'The TCP port that the Presto server uses to listen for client connections.
    The

    default value is 8080 when disable SSL, default value is 443 when enable SSL.'
  name: port
  types:
  - <xref:typing.Any>
- description: 'The authentication mechanism used to connect to the Presto server.

    Required. Known values are: "Anonymous" and "LDAP".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PrestoAuthenticationType">]
- description: The user name used to connect to the Presto server.
  name: username
  types:
  - <xref:typing.Any>
- description: The password corresponding to the user name.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specifies whether the connections to the server are encrypted using
    SSL. The

    default value for legacy version is False. The default value for version 2.0 is
    True.'
  name: enable_ssl
  types:
  - <xref:typing.Any>
- description: 'Specifies whether the connections to the server

    will validate server certificate, the default value is True. Only used for Version
    2.0.'
  name: enable_server_certificate_validation
  types:
  - <xref:typing.Any>
- description: 'The full path of the .pem file containing trusted CA certificates
    for

    verifying the server when connecting over SSL. This property can only be set when
    using SSL on

    self-hosted IR. The default value is the cacerts.pem file installed with the IR.
    Only used for

    Version 1.0.'
  name: trusted_cert_path
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to use a CA certificate from the system trust

    store or from a specified PEM file. The default value is false. Only used for
    Version 1.0.'
  name: use_system_trust_store
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require a CA-issued SSL certificate

    name to match the host name of the server when connecting over SSL. The default
    value is false.

    Only used for Version 1.0.'
  name: allow_host_name_cn_mismatch
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to allow self-signed certificates from

    the server. The default value is false. Only used for Version 1.0.'
  name: allow_self_signed_server_cert
  types:
  - <xref:typing.Any>
- description: 'The local time zone used by the connection. Valid values for this
    option

    are specified in the IANA Time Zone Database. The default value for Version 1.0
    is the client

    system time zone. The default value for Version 2.0 is server system timeZone.'
  name: time_zone_id
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.allowHostNameCNMismatch
  name: allowHostNameCNMismatch
  summary: 'Specifies whether to require a CA-issued SSL certificate name to match
    the host name of the

    server when connecting over SSL. The default value is false. Only used for Version
    1.0.'
  signature: 'allowHostNameCNMismatch: Any'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.allowSelfSignedServerCert
  name: allowSelfSignedServerCert
  summary: 'Specifies whether to allow self-signed certificates from the server. The
    default value is

    false. Only used for Version 1.0.'
  signature: 'allowSelfSignedServerCert: Any'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: 'The authentication mechanism used to connect to the Presto server. Required.
    Known values are:

    "Anonymous" and "LDAP".'
  signature: 'authenticationType: Required[str | PrestoAuthenticationType]'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.catalog
  name: catalog
  summary: The catalog context for all request against the server. Required.
  signature: 'catalog: Required[Any]'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.enableServerCertificateValidation
  name: enableServerCertificateValidation
  summary: 'Specifies whether the connections to the server will validate server certificate,
    the default

    value is True. Only used for Version 2.0.'
  signature: 'enableServerCertificateValidation: Any'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.enableSsl
  name: enableSsl
  summary: 'Specifies whether the connections to the server are encrypted using SSL.
    The default value for

    legacy version is False. The default value for version 2.0 is True.'
  signature: 'enableSsl: Any'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.host
  name: host
  summary: The IP address or host name of the Presto server. (i.e. 192.168.222.160).
    Required.
  signature: 'host: Required[Any]'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.password
  name: password
  summary: The password corresponding to the user name.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.port
  name: port
  summary: 'The TCP port that the Presto server uses to listen for client connections.
    The default value is

    8080 when disable SSL, default value is 443 when enable SSL.'
  signature: 'port: Any'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.serverVersion
  name: serverVersion
  summary: The version of the Presto server. (i.e. 0.148-t) Only used for Version
    1.0.
  signature: 'serverVersion: Any'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.timeZoneID
  name: timeZoneID
  summary: 'The local time zone used by the connection. Valid values for this option
    are specified in the

    IANA Time Zone Database. The default value for Version 1.0 is the client system
    time zone. The

    default value for Version 2.0 is server system timeZone.'
  signature: 'timeZoneID: Any'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.trustedCertPath
  name: trustedCertPath
  summary: 'The full path of the .pem file containing trusted CA certificates for
    verifying the server when

    connecting over SSL. This property can only be set when using SSL on self-hosted
    IR. The

    default value is the cacerts.pem file installed with the IR. Only used for Version
    1.0.'
  signature: 'trustedCertPath: Any'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.useSystemTrustStore
  name: useSystemTrustStore
  summary: 'Specifies whether to use a CA certificate from the system trust store
    or from a specified PEM

    file. The default value is false. Only used for Version 1.0.'
  signature: 'useSystemTrustStore: Any'
- uid: azure.mgmt.datafactory.types.PrestoLinkedServiceTypeProperties.username
  name: username
  summary: The user name used to connect to the Presto server.
  signature: 'username: Any'
