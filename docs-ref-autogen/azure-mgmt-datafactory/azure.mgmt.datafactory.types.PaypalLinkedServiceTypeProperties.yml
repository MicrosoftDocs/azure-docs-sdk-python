### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.PaypalLinkedServiceTypeProperties
name: PaypalLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.PaypalLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Paypal Service linked service properties.
constructor:
  syntax: PaypalLinkedServiceTypeProperties()
variables:
- description: The URL of the PayPal instance. (i.e. api.sandbox.paypal.com). Required.
  name: host
  types:
  - <xref:typing.Any>
- description: The client ID associated with your PayPal application. Required.
  name: client_id
  types:
  - <xref:typing.Any>
- description: The client secret associated with your PayPal application.
  name: client_secret
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specifies whether the data source endpoints are encrypted using

    HTTPS. The default value is true.'
  name: use_encrypted_endpoints
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require the host name in the server''s

    certificate to match the host name of the server when connecting over SSL. The
    default value is

    true.'
  name: use_host_verification
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to verify the identity of the server when

    connecting over SSL. The default value is true.'
  name: use_peer_verification
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.PaypalLinkedServiceTypeProperties.clientId
  name: clientId
  summary: The client ID associated with your PayPal application. Required.
  signature: 'clientId: Any'
- uid: azure.mgmt.datafactory.types.PaypalLinkedServiceTypeProperties.clientSecret
  name: clientSecret
  summary: The client secret associated with your PayPal application.
  signature: 'clientSecret: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.PaypalLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.PaypalLinkedServiceTypeProperties.host
  name: host
  summary: The URL of the PayPal instance. (i.e. api.sandbox.paypal.com). Required.
  signature: 'host: Any'
- uid: azure.mgmt.datafactory.types.PaypalLinkedServiceTypeProperties.useEncryptedEndpoints
  name: useEncryptedEndpoints
  summary: 'Specifies whether the data source endpoints are encrypted using HTTPS.
    The default value is

    true.'
  signature: 'useEncryptedEndpoints: Any'
- uid: azure.mgmt.datafactory.types.PaypalLinkedServiceTypeProperties.useHostVerification
  name: useHostVerification
  summary: 'Specifies whether to require the host name in the server''s certificate
    to match the host name

    of the server when connecting over SSL. The default value is true.'
  signature: 'useHostVerification: Any'
