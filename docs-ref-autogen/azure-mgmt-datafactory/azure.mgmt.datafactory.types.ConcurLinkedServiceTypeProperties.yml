### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.ConcurLinkedServiceTypeProperties
name: ConcurLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.ConcurLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Concur Service linked service properties.
constructor:
  syntax: ConcurLinkedServiceTypeProperties()
variables:
- description: 'Properties used to connect to Concur. It is mutually exclusive

    with any other properties in the linked service. Type: object.'
  name: connection_properties
  types:
  - <xref:typing.Any>
- description: Application client_id supplied by Concur App Management. Required.
  name: client_id
  types:
  - <xref:typing.Any>
- description: The user name that you use to access Concur Service. Required.
  name: username
  types:
  - <xref:typing.Any>
- description: 'The password corresponding to the user name that you provided in the
    username

    field.'
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specifies whether the data source endpoints are encrypted using

    HTTPS. The default value is true.'
  name: use_encrypted_endpoints
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require the host name in the server''s

    certificate to match the host name of the server when connecting over SSL. The
    default value is

    true.'
  name: use_host_verification
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to verify the identity of the server when

    connecting over SSL. The default value is true.'
  name: use_peer_verification
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.ConcurLinkedServiceTypeProperties.clientId
  name: clientId
  summary: Application client_id supplied by Concur App Management. Required.
  signature: 'clientId: Any'
- uid: azure.mgmt.datafactory.types.ConcurLinkedServiceTypeProperties.connectionProperties
  name: connectionProperties
  summary: 'Properties used to connect to Concur. It is mutually exclusive with any
    other properties in the

    linked service. Type: object.'
  signature: 'connectionProperties: Any'
- uid: azure.mgmt.datafactory.types.ConcurLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.ConcurLinkedServiceTypeProperties.password
  name: password
  summary: The password corresponding to the user name that you provided in the username
    field.
  signature: 'password: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.ConcurLinkedServiceTypeProperties.useEncryptedEndpoints
  name: useEncryptedEndpoints
  summary: 'Specifies whether the data source endpoints are encrypted using HTTPS.
    The default value is

    true.'
  signature: 'useEncryptedEndpoints: Any'
- uid: azure.mgmt.datafactory.types.ConcurLinkedServiceTypeProperties.useHostVerification
  name: useHostVerification
  summary: 'Specifies whether to require the host name in the server''s certificate
