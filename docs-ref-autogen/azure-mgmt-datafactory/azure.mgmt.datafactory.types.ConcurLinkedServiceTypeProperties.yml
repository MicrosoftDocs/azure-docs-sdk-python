    value is true.'
  signature: 'usePeerVerification: Any'
- uid: azure.mgmt.datafactory.types.ConcurLinkedServiceTypeProperties.username
  name: username
  summary: The user name that you use to access Concur Service. Required.
  signature: 'username: Any'
