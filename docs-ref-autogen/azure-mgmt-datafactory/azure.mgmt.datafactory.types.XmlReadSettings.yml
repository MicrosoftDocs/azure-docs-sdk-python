    \ Example:\n\"{\"[http://www.example.com/xml\u201D:\u201Dprefix\u201D}](http://www.example.com/xml\"\
    :\"prefix\"})\" Type:\nobject (or Expression with resultType object)."
  name: namespace_prefixes
