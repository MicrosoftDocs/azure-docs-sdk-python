### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties
name: OracleLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Oracle database linked service properties.
constructor:
  syntax: OracleLinkedServiceTypeProperties()
variables:
- description: 'The connection string. Type: string, SecureString or

    AzureKeyVaultSecretReference. Only used for Version 1.0.'
  name: connection_string
  types:
  - <xref:typing.Any>
- description: 'The location of Oracle database you want to connect to, the supported
    forms

    include connector descriptor, Easy Connect (Plus) Naming and Oracle Net Services
    Name (Only

    self-hosted IR). Type: string. Only used for Version 2.0.'
  name: server
  types:
  - <xref:typing.Any>
- description: 'Authentication type for connecting to the Oracle database. Only used

    for Version 2.0. "Basic"'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OracleAuthenticationType">]
- description: 'The Oracle database username. Type: string. Only used for Version
    2.0.'
  name: username
  types:
  - <xref:typing.Any>
- description: The Azure key vault secret reference of password in connection string.
  name: password
  types:
  - <xref:<xref:"AzureKeyVaultSecretReference">>
- description: 'Specifies the encryption client behavior. Supported values are

    accepted, rejected, requested or required, default value is required. Type: string.
    Only used

    for Version 2.0.'
  name: encryption_client
  types:
  - <xref:typing.Any>
- description: 'Specifies the encryption algorithms that client can use.

    Supported values are AES128, AES192, AES256, 3DES112, 3DES168, default value is
    (AES256). Type:

    string. Only used for Version 2.0.'
  name: encryption_types_client
  types:
  - <xref:typing.Any>
- description: 'Specifies the desired data integrity behavior when this client

    connects to a server. Supported values are accepted, rejected, requested or required,
    default

    value is required. Type: string. Only used for Version 2.0.'
  name: crypto_checksum_client
  types:
  - <xref:typing.Any>
- description: 'Specifies the crypto-checksum algorithms that client can

    use. Supported values are SHA1, SHA256, SHA384, SHA512, default value is (SHA512).
    Type:

    string. Only used for Version 2.0.'
  name: crypto_checksum_types_client
  types:
  - <xref:typing.Any>
- description: 'Specifies the amount that the source initially fetches for LOB

    columns, default value is 0. Type: integer. Only used for Version 2.0.'
  name: initial_lob_fetch_size
  types:
  - <xref:typing.Any>
- description: 'Specifies the number of bytes that the driver allocates to fetch the
    data in

    one database round-trip, default value is 10485760. Type: integer. Only used for
    Version 2.0.'
  name: fetch_size
  types:
  - <xref:typing.Any>
- description: 'Specifies the number of cursors or statements to be cached for each

    database connection, default value is 0. Type: integer. Only used for Version
    2.0.'
  name: statement_cache_size
  types:
  - <xref:typing.Any>
- description: 'Specifies a command that is issued immediately after connecting to

    the database to manage session settings. Type: string. Only used for Version 2.0.'
  name: initialization_string
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to use bulk copy or batch insert when loading data

    into the database, default value is true. Type: boolean. Only used for Version
    2.0.'
  name: enable_bulk_load
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to use the Version 1.0 data type mappings. Do

    not set this to true unless you want to keep backward compatibility with Version
    1.0''s data

    type mappings, default value is false. Type: boolean. Only used for Version 2.0.'
  name: support_v1_data_types
  types:
  - <xref:typing.Any>
- description: 'Specifies whether the driver returns column value with the

    TIMESTAMP WITH TIME ZONE data type as DateTime or string. This setting is ignored
    if

    supportV1DataTypes is not true, default value is true. Type: boolean. Only used
    for Version

    2.0.'
  name: fetch_tswtz_as_timestamp
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: Authentication type for connecting to the Oracle database. Only used for
    Version 2.0. "Basic"
  signature: 'authenticationType: str | OracleAuthenticationType'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.connectionString
  name: connectionString
  summary: 'string, SecureString or AzureKeyVaultSecretReference. Only used

    for Version 1.0.'
  signature: 'connectionString: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.cryptoChecksumClient
  name: cryptoChecksumClient
  summary: 'Specifies the desired data integrity behavior when this client connects
    to a server. Supported

    values are accepted, rejected, requested or required, default value is required.
    Type: string.

    Only used for Version 2.0.'
  signature: 'cryptoChecksumClient: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.cryptoChecksumTypesClient
  name: cryptoChecksumTypesClient
  summary: 'Specifies the crypto-checksum algorithms that client can use. Supported
    values are SHA1,

    SHA256, SHA384, SHA512, default value is (SHA512). Type: string. Only used for
    Version 2.0.'
  signature: 'cryptoChecksumTypesClient: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.enableBulkLoad
  name: enableBulkLoad
  summary: 'Specifies whether to use bulk copy or batch insert when loading data into
    the database, default

    value is true. Type: boolean. Only used for Version 2.0.'
  signature: 'enableBulkLoad: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.encryptionClient
  name: encryptionClient
  summary: 'Specifies the encryption client behavior. Supported values are accepted,
    rejected, requested or

    required, default value is required. Type: string. Only used for Version 2.0.'
  signature: 'encryptionClient: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.encryptionTypesClient
  name: encryptionTypesClient
  summary: 'Specifies the encryption algorithms that client can use. Supported values
    are AES128, AES192,

    AES256, 3DES112, 3DES168, default value is (AES256). Type: string. Only used for
    Version 2.0.'
  signature: 'encryptionTypesClient: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.fetchSize
  name: fetchSize
  summary: 'Specifies the number of bytes that the driver allocates to fetch the data
    in one database

    round-trip, default value is 10485760. Type: integer. Only used for Version 2.0.'
  signature: 'fetchSize: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.fetchTswtzAsTimestamp
  name: fetchTswtzAsTimestamp
  summary: 'Specifies whether the driver returns column value with the TIMESTAMP WITH
    TIME ZONE data type

    as DateTime or string. This setting is ignored if supportV1DataTypes is not true,
    default value

    is true. Type: boolean. Only used for Version 2.0.'
  signature: 'fetchTswtzAsTimestamp: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.initialLobFetchSize
  name: initialLobFetchSize
  summary: 'Specifies the amount that the source initially fetches for LOB columns,
    default value is 0.

    Type: integer. Only used for Version 2.0.'
  signature: 'initialLobFetchSize: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.initializationString
  name: initializationString
  summary: 'Specifies a command that is issued immediately after connecting to the
    database to manage

    session settings. Type: string. Only used for Version 2.0.'
  signature: 'initializationString: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.password
  name: password
  summary: The Azure key vault secret reference of password in connection string.
  signature: 'password: AzureKeyVaultSecretReference'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.server
  name: server
  summary: 'The location of Oracle database you want to connect to, the supported
    forms include connector

    descriptor, Easy Connect (Plus) Naming and Oracle Net Services Name (Only self-hosted
    IR).

    Type: string. Only used for Version 2.0.'
  signature: 'server: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.statementCacheSize
  name: statementCacheSize
  summary: 'Specifies the number of cursors or statements to be cached for each database
    connection,

    default value is 0. Type: integer. Only used for Version 2.0.'
  signature: 'statementCacheSize: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.supportV1DataTypes
  name: supportV1DataTypes
  summary: 'Specifies whether to use the Version 1.0 data type mappings. Do not set
    this to true unless you

    want to keep backward compatibility with Version 1.0''s data type mappings, default
    value is

    false. Type: boolean. Only used for Version 2.0.'
  signature: 'supportV1DataTypes: Any'
- uid: azure.mgmt.datafactory.types.OracleLinkedServiceTypeProperties.username
  name: username
  summary: string. Only used for Version 2.0.
  signature: 'username: Any'
