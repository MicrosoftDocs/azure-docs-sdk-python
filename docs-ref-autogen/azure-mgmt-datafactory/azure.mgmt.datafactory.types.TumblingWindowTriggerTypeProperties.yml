### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.TumblingWindowTriggerTypeProperties
name: TumblingWindowTriggerTypeProperties
fullName: azure.mgmt.datafactory.types.TumblingWindowTriggerTypeProperties
module: azure.mgmt.datafactory.types
summary: Tumbling Window Trigger properties.
constructor:
  syntax: TumblingWindowTriggerTypeProperties()
variables:
- description: 'The frequency of the time windows. Required. Known values are: "Minute",

    "Hour", and "Month".'
  name: frequency
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TumblingWindowFrequency">]
- description: 'The interval of the time windows. The minimum interval allowed is
    15 Minutes.

    Required.'
  name: interval
  types:
  - <xref:int>
- description: 'The start time for the time period for the trigger during which events
    are

    fired for windows that are ready. Only UTC time is currently supported. Required.'
  name: start_time
  types:
  - <xref:str>
- description: 'The end time for the time period for the trigger during which events
    are fired

    for windows that are ready. Only UTC time is currently supported.'
  name: end_time
  types:
  - <xref:str>
- description: 'Specifies how long the trigger waits past due time before triggering
    new run. It

    doesn''t alter window start and end time. The default is 0. Type: string (or Expression
    with

    resultType string), pattern: ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: delay
  types:
  - <xref:typing.Any>
- description: 'The max number of parallel time windows (ready for execution) for
    which

    a new run is triggered. Required.'
  name: max_concurrency
  types:
  - <xref:int>
- description: Retry policy that will be applied for failed pipeline runs.
  name: retry_policy
  types:
  - <xref:<xref:"RetryPolicy">>
- description: 'Triggers that this trigger depends on. Only tumbling window triggers
    are

    supported.'
  name: depends_on
  types:
  - <xref:list>[<xref:"DependencyReference">]
attributes:
- uid: azure.mgmt.datafactory.types.TumblingWindowTriggerTypeProperties.delay
  name: delay
  summary: 'Specifies how long the trigger waits past due time before triggering new
    run. It doesn''t alter

    window start and end time. The default is 0. Type: string (or Expression with
    resultType

    string), pattern: ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  signature: 'delay: Any'
- uid: azure.mgmt.datafactory.types.TumblingWindowTriggerTypeProperties.dependsOn
  name: dependsOn
  summary: Triggers that this trigger depends on. Only tumbling window triggers are
    supported.
  signature: 'dependsOn: list[''DependencyReference'']'
- uid: azure.mgmt.datafactory.types.TumblingWindowTriggerTypeProperties.endTime
  name: endTime
  summary: 'The end time for the time period for the trigger during which events are
    fired for windows that

    are ready. Only UTC time is currently supported.'
  signature: 'endTime: str'
- uid: azure.mgmt.datafactory.types.TumblingWindowTriggerTypeProperties.frequency
  name: frequency
  summary: '"Minute", "Hour", and

    "Month".'
  signature: 'frequency: Required[str | TumblingWindowFrequency]'
- uid: azure.mgmt.datafactory.types.TumblingWindowTriggerTypeProperties.interval
  name: interval
  summary: The interval of the time windows. The minimum interval allowed is 15 Minutes.
    Required.
  signature: 'interval: Required[int]'
- uid: azure.mgmt.datafactory.types.TumblingWindowTriggerTypeProperties.maxConcurrency
  name: maxConcurrency
  summary: 'The max number of parallel time windows (ready for execution) for which
    a new run is triggered.

    Required.'
  signature: 'maxConcurrency: Required[int]'
- uid: azure.mgmt.datafactory.types.TumblingWindowTriggerTypeProperties.retryPolicy
  name: retryPolicy
  summary: Retry policy that will be applied for failed pipeline runs.
  signature: 'retryPolicy: RetryPolicy'
- uid: azure.mgmt.datafactory.types.TumblingWindowTriggerTypeProperties.startTime
  name: startTime
  summary: 'The start time for the time period for the trigger during which events
    are fired for windows

    that are ready. Only UTC time is currently supported. Required.'
  signature: 'startTime: Required[str]'
