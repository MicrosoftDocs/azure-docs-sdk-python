### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.SalesforceServiceCloudV2LinkedServiceTypeProperties
name: SalesforceServiceCloudV2LinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.SalesforceServiceCloudV2LinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Salesforce Service Cloud V2 linked service properties.
constructor:
  syntax: SalesforceServiceCloudV2LinkedServiceTypeProperties()
variables:
- description: 'The URL of Salesforce Service Cloud instance. For example,

    ''[https://[domain].my.salesforce.com](https://[domain].my.salesforce.com)''.
    Type: string (or Expression with resultType string).'
  name: environment_url
  types:
  - <xref:typing.Any>
- description: 'The authentication type to be used to connect to the Salesforce.

    Currently, we only support OAuth2ClientCredentials, it is also the default value.'
  name: authentication_type
  types:
  - <xref:typing.Any>
- description: 'The client Id for OAuth 2.0 Client Credentials Flow authentication
    of the

    Salesforce instance. Type: string (or Expression with resultType string).'
  name: client_id
  types:
  - <xref:typing.Any>
- description: 'The client secret for OAuth 2.0 Client Credentials Flow authentication
    of

    the Salesforce instance.'
  name: client_secret
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The Salesforce API version used in ADF. The version must be larger
    than or

    equal to 47.0 which is required by Salesforce BULK API 2.0. Type: string (or Expression
    with

    resultType string).'
  name: api_version
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.SalesforceServiceCloudV2LinkedServiceTypeProperties.apiVersion
  name: apiVersion
  summary: 'The Salesforce API version used in ADF. The version must be larger than
    or equal to 47.0 which

    is required by Salesforce BULK API 2.0. Type: string (or Expression with resultType
    string).'
  signature: 'apiVersion: Any'
- uid: azure.mgmt.datafactory.types.SalesforceServiceCloudV2LinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: 'The authentication type to be used to connect to the Salesforce. Currently,
    we only support

    OAuth2ClientCredentials, it is also the default value.'
  signature: 'authenticationType: Any'
- uid: azure.mgmt.datafactory.types.SalesforceServiceCloudV2LinkedServiceTypeProperties.clientId
  name: clientId
  summary: 'The client Id for OAuth 2.0 Client Credentials Flow authentication of
    the Salesforce instance.

    Type: string (or Expression with resultType string).'
  signature: 'clientId: Any'
- uid: azure.mgmt.datafactory.types.SalesforceServiceCloudV2LinkedServiceTypeProperties.clientSecret
  name: clientSecret
  summary: 'The client secret for OAuth 2.0 Client Credentials Flow authentication
    of the Salesforce

    instance.'
  signature: 'clientSecret: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.SalesforceServiceCloudV2LinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.SalesforceServiceCloudV2LinkedServiceTypeProperties.environmentUrl
  name: environmentUrl
  summary: 'The URL of Salesforce Service Cloud instance. For example,

    ''[https://[domain].my.salesforce.com](https://[domain].my.salesforce.com)''.
    Type: string (or Expression with resultType string).'
  signature: 'environmentUrl: Any'
