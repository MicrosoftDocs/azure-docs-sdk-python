### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.PolybaseSettings
name: PolybaseSettings
fullName: azure.mgmt.datafactory.types.PolybaseSettings
module: azure.mgmt.datafactory.types
summary: PolyBase settings.
constructor:
  syntax: PolybaseSettings()
variables:
- description: 'Reject type. Known values are: "value" and "percentage".'
  name: reject_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PolybaseSettingsRejectType">]
- description: 'Specifies the value or the percentage of rows that can be rejected
    before

    the query fails. Type: number (or Expression with resultType number), minimum:
    0.'
  name: reject_value
  types:
  - <xref:typing.Any>
- description: 'Determines the number of rows to attempt to retrieve before the

    PolyBase recalculates the percentage of rejected rows. Type: integer (or Expression
    with

    resultType integer), minimum: 0.'
  name: reject_sample_value
  types:
  - <xref:typing.Any>
- description: 'Specifies how to handle missing values in delimited text files when

    PolyBase retrieves data from the text file. Type: boolean (or Expression with
    resultType

    boolean).'
  name: use_type_default
  types:
  - <xref:typing.Any>
attributes:
- uid: azure.mgmt.datafactory.types.PolybaseSettings.rejectSampleValue
  name: rejectSampleValue
  summary: 'Determines the number of rows to attempt to retrieve before the PolyBase
    recalculates the

    percentage of rejected rows. Type: integer (or Expression with resultType integer),
    minimum: 0.'
  signature: 'rejectSampleValue: Any'
- uid: azure.mgmt.datafactory.types.PolybaseSettings.rejectType
  name: rejectType
  summary: '"value" and "percentage".'
  signature: 'rejectType: str | PolybaseSettingsRejectType'
- uid: azure.mgmt.datafactory.types.PolybaseSettings.rejectValue
  name: rejectValue
  summary: 'Specifies the value or the percentage of rows that can be rejected before
    the query fails.

    Type: number (or Expression with resultType number), minimum: 0.'
  signature: 'rejectValue: Any'
- uid: azure.mgmt.datafactory.types.PolybaseSettings.useTypeDefault
  name: useTypeDefault
  summary: 'Specifies how to handle missing values in delimited text files when PolyBase
    retrieves data

    from the text file. Type: boolean (or Expression with resultType boolean).'
  signature: 'useTypeDefault: Any'
