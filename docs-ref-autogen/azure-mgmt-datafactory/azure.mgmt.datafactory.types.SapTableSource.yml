### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.SapTableSource
name: SapTableSource
fullName: azure.mgmt.datafactory.types.SapTableSource
module: azure.mgmt.datafactory.types
summary: A copy activity source for SAP Table source.
constructor:
  syntax: SapTableSource()
variables:
- description: 'Source retry count. Type: integer (or Expression with resultType

    integer).'
  name: source_retry_count
  types:
  - <xref:typing.Any>
- description: 'Source retry wait. Type: string (or Expression with resultType

    string), pattern: ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: source_retry_wait
  types:
  - <xref:typing.Any>
- description: 'The maximum concurrent connection count for the source data

    store. Type: integer (or Expression with resultType integer).'
  name: max_concurrent_connections
  types:
  - <xref:typing.Any>
- description: 'If true, disable data store metrics collection. Default is

    false. Type: boolean (or Expression with resultType boolean).'
  name: disable_metrics_collection
  types:
  - <xref:typing.Any>
- description: 'Query timeout. Type: string (or Expression with resultType string),

    pattern: ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: query_timeout
  types:
  - <xref:typing.Any>
- description: 'Specifies the additional columns to be added to source data. Type:

    array of objects(AdditionalColumns) (or Expression with resultType array of objects).'
  name: additional_columns
  types:
  - <xref:typing.Any>
- description: 'The number of rows to be retrieved. Type: integer(or Expression with

    resultType integer).'
  name: row_count
  types:
  - <xref:typing.Any>
- description: 'The number of rows that will be skipped. Type: integer (or Expression
    with

    resultType integer).'
  name: row_skips
  types:
  - <xref:typing.Any>
- description: 'The fields of the SAP table that will be retrieved. For example,

    column0, column1. Type: string (or Expression with resultType string).'
  name: rfc_table_fields
  types:
  - <xref:typing.Any>
- description: 'The options for the filtering of the SAP Table. For example, COLUMN0

    EQ SOME VALUE. Type: string (or Expression with resultType string).'
  name: rfc_table_options
  types:
  - <xref:typing.Any>
- description: 'Specifies the maximum number of rows that will be retrieved at a time
    when

    retrieving data from SAP Table. Type: integer (or Expression with resultType integer).'
  name: batch_size
  types:
  - <xref:typing.Any>
- description: 'Specifies the custom RFC function module that will

    be used to read data from SAP Table. Type: string (or Expression with resultType
    string).'
  name: custom_rfc_read_table_function_module
  types:
  - <xref:typing.Any>
- description: 'The single character that will be used as delimiter passed to

    SAP RFC as well as splitting the output data retrieved. Type: string (or Expression
    with

    resultType string).'
  name: sap_data_column_delimiter
  types:
  - <xref:typing.Any>
- description: 'The partition mechanism that will be used for SAP table read in

    parallel. Possible values include: "None", "PartitionOnInt", "PartitionOnCalendarYear",

    "PartitionOnCalendarMonth", "PartitionOnCalendarDate", "PartitionOnTime".'
  name: partition_option
  types:
  - <xref:typing.Any>
- description: 'The settings that will be leveraged for SAP table source

    partitioning.'
  name: partition_settings
  types:
  - <xref:<xref:"SapTablePartitionSettings">>
- description: Copy source type. Required. Default value is "SapTableSource".
  name: type
  types:
  - <xref:typing.Literal>["SapTableSource"]
attributes:
- uid: azure.mgmt.datafactory.types.SapTableSource.additionalColumns
  name: additionalColumns
  summary: 'array of

    objects(AdditionalColumns) (or Expression with resultType array of objects).'
  signature: 'additionalColumns: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.batchSize
  name: batchSize
  summary: 'Specifies the maximum number of rows that will be retrieved at a time
    when retrieving data from

    SAP Table. Type: integer (or Expression with resultType integer).'
  signature: 'batchSize: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.customRfcReadTableFunctionModule
  name: customRfcReadTableFunctionModule
  summary: 'Specifies the custom RFC function module that will be used to read data
    from SAP Table. Type:

    string (or Expression with resultType string).'
  signature: 'customRfcReadTableFunctionModule: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.disableMetricsCollection
  name: disableMetricsCollection
  summary: 'boolean (or Expression

    with resultType boolean).'
  signature: 'disableMetricsCollection: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.maxConcurrentConnections
  name: maxConcurrentConnections
  summary: 'integer (or Expression

    with resultType integer).'
  signature: 'maxConcurrentConnections: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.partitionOption
  name: partitionOption
  summary: 'The partition mechanism that will be used for SAP table read in parallel.
    Possible values

    include: "None", "PartitionOnInt", "PartitionOnCalendarYear",

    "PartitionOnCalendarMonth", "PartitionOnCalendarDate", "PartitionOnTime".'
  signature: 'partitionOption: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.partitionSettings
  name: partitionSettings
  summary: The settings that will be leveraged for SAP table source partitioning.
  signature: 'partitionSettings: SapTablePartitionSettings'
- uid: azure.mgmt.datafactory.types.SapTableSource.queryTimeout
  name: queryTimeout
  summary: 'string (or Expression with resultType string), pattern:

    ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  signature: 'queryTimeout: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.rfcTableFields
  name: rfcTableFields
  summary: 'string

    (or Expression with resultType string).'
  signature: 'rfcTableFields: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.rfcTableOptions
  name: rfcTableOptions
  summary: 'The options for the filtering of the SAP Table. For example, COLUMN0 EQ
    SOME VALUE. Type:

    string (or Expression with resultType string).'
  signature: 'rfcTableOptions: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.rowCount
  name: rowCount
  summary: integer(or Expression with resultType integer).
  signature: 'rowCount: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.rowSkips
  name: rowSkips
  summary: integer (or Expression with resultType integer).
  signature: 'rowSkips: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.sapDataColumnDelimiter
  name: sapDataColumnDelimiter
  summary: 'The single character that will be used as delimiter passed to SAP RFC
    as well as splitting the

    output data retrieved. Type: string (or Expression with resultType string).'
  signature: 'sapDataColumnDelimiter: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.sourceRetryCount
  name: sourceRetryCount
  summary: integer (or Expression with resultType integer).
  signature: 'sourceRetryCount: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.sourceRetryWait
  name: sourceRetryWait
  summary: 'string (or Expression with resultType string), pattern:

    ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  signature: 'sourceRetryWait: Any'
- uid: azure.mgmt.datafactory.types.SapTableSource.type
  name: type
  summary: Copy source type. Required. Default value is "SapTableSource".
  signature: 'type: Literal[''SapTableSource'']'
