  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.SquareLinkedServiceTypeProperties.host
  name: host
  summary: The URL of the Square instance. (i.e. mystore.mysquare.com).
  signature: 'host: Any'
