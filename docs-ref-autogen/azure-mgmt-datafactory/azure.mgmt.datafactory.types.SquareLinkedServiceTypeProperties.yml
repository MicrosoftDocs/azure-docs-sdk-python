uid: azure.mgmt.datafactory.types.SquareLinkedServiceTypeProperties
name: SquareLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.SquareLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Square Service linked service properties.
constructor:
  syntax: SquareLinkedServiceTypeProperties()
variables:
- description: 'Properties used to connect to Square. It is mutually exclusive

    with any other properties in the linked service. Type: object.'
  name: connection_properties
  types:
  - <xref:typing.Any>
- description: The URL of the Square instance. (i.e. mystore.mysquare.com).
  name: host
  types:
  - <xref:typing.Any>
- description: The client ID associated with your Square application.
  name: client_id
  types:
  - <xref:typing.Any>
- description: The client secret associated with your Square application.
  name: client_secret
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The redirect URL assigned in the Square application dashboard. (i.e.

    [http://localhost:2500](http://localhost:2500)).'
  name: redirect_uri
  types:
  - <xref:typing.Any>
- description: 'Specifies whether the data source endpoints are encrypted using

    HTTPS. The default value is true.'
  name: use_encrypted_endpoints
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require the host name in the server''s

    certificate to match the host name of the server when connecting over SSL. The
    default value is

    true.'
  name: use_host_verification
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to verify the identity of the server when

    connecting over SSL. The default value is true.'
  name: use_peer_verification
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.SquareLinkedServiceTypeProperties.clientId
  name: clientId
  summary: The client ID associated with your Square application.
  signature: 'clientId: Any'
- uid: azure.mgmt.datafactory.types.SquareLinkedServiceTypeProperties.clientSecret
  name: clientSecret
  summary: The client secret associated with your Square application.
  signature: 'clientSecret: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.SquareLinkedServiceTypeProperties.connectionProperties
  name: connectionProperties
  summary: 'Properties used to connect to Square. It is mutually exclusive with any
    other properties in the

    linked service. Type: object.'
  signature: 'connectionProperties: Any'
- uid: azure.mgmt.datafactory.types.SquareLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
