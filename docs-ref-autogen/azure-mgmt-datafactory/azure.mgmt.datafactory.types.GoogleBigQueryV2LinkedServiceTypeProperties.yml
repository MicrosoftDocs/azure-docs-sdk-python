### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.GoogleBigQueryV2LinkedServiceTypeProperties
name: GoogleBigQueryV2LinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.GoogleBigQueryV2LinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Google BigQuery service linked service properties.
constructor:
  syntax: GoogleBigQueryV2LinkedServiceTypeProperties()
variables:
- description: 'The default BigQuery project id to query against. Type: string (or
    Expression

    with resultType string). Required.'
  name: project_id
  types:
  - <xref:typing.Any>
- description: 'The OAuth 2.0 authentication mechanism used for authentication.

    Required. Known values are: "ServiceAuthentication" and "UserAuthentication".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GoogleBigQueryV2AuthenticationType">]
- description: 'The client id of the google application used to acquire the refresh
    token.

    Type: string (or Expression with resultType string).'
  name: client_id
  types:
  - <xref:typing.Any>
- description: 'The client secret of the google application used to acquire the refresh

    token.'
  name: client_secret
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The refresh token obtained from Google for authorizing access to BigQuery

    for UserAuthentication.'
  name: refresh_token
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The content of the .json key file that is used to authenticate the

    service account. Type: string (or Expression with resultType string).'
  name: key_file_content
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.GoogleBigQueryV2LinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: 'The OAuth 2.0 authentication mechanism used for authentication. Required.
    Known values are:

    "ServiceAuthentication" and "UserAuthentication".'
  signature: 'authenticationType: Required[str | GoogleBigQueryV2AuthenticationType]'
- uid: azure.mgmt.datafactory.types.GoogleBigQueryV2LinkedServiceTypeProperties.clientId
  name: clientId
  summary: 'string (or

    Expression with resultType string).'
  signature: 'clientId: Any'
- uid: azure.mgmt.datafactory.types.GoogleBigQueryV2LinkedServiceTypeProperties.clientSecret
  name: clientSecret
  summary: The client secret of the google application used to acquire the refresh
    token.
  signature: 'clientSecret: SecretBase'
- uid: azure.mgmt.datafactory.types.GoogleBigQueryV2LinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
