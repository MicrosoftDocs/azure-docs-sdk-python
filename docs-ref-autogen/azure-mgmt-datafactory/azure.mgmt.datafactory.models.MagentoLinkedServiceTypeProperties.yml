- uid: azure.mgmt.datafactory.models.MagentoLinkedServiceTypeProperties.access_token
  name: access_token
  summary: The access token from Magento.
  signature: 'access_token: _models.SecretBase | None'
- uid: azure.mgmt.datafactory.models.MagentoLinkedServiceTypeProperties.encrypted_credential
  name: encrypted_credential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encrypted_credential: str | None'
- uid: azure.mgmt.datafactory.models.MagentoLinkedServiceTypeProperties.host
  name: host
  summary: The URL of the Magento instance. (i.e. 192.168.222.110/magento3). Required.
  signature: 'host: Any'
