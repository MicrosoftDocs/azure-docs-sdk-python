### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.MapperAttributeMapping
name: MapperAttributeMapping
fullName: azure.mgmt.datafactory.types.MapperAttributeMapping
module: azure.mgmt.datafactory.types
summary: Source and target column mapping details.
constructor:
  syntax: MapperAttributeMapping()
variables:
- description: Name of the target column.
  name: name
  types:
  - <xref:str>
- description: 'Type of the CDC attribute mapping. Note: ''Advanced'' mapping type
    is also saved as

    ''Derived''. Known values are: "Direct", "Derived", and "Aggregate".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MappingType">]
- description: 'Name of the function used for ''Aggregate'' and ''Derived'' (except

    ''Advanced'') type mapping.'
  name: function_name
  types:
  - <xref:str>
- description: Expression used for 'Aggregate' and 'Derived' type mapping.
  name: expression
  types:
  - <xref:str>
- description: 'Reference of the source column used in the mapping. It is used for

    ''Direct'' mapping type only.'
  name: attribute_reference
  types:
  - <xref:<xref:"MapperAttributeReference">>
- description: 'List of references for source columns. It is used for ''Derived''
    and

    ''Aggregate'' type mappings only.'
  name: attribute_references
  types:
  - <xref:list>[<xref:"MapperAttributeReference">]
attributes:
- uid: azure.mgmt.datafactory.types.MapperAttributeMapping.attributeReference
  name: attributeReference
  summary: Reference of the source column used in the mapping. It is used for 'Direct'
    mapping type only.
  signature: 'attributeReference: MapperAttributeReference'
- uid: azure.mgmt.datafactory.types.MapperAttributeMapping.attributeReferences
  name: attributeReferences
  summary: 'List of references for source columns. It is used for ''Derived'' and
    ''Aggregate'' type mappings

    only.'
  signature: 'attributeReferences: list[''MapperAttributeReference'']'
- uid: azure.mgmt.datafactory.types.MapperAttributeMapping.expression
  name: expression
  summary: Expression used for 'Aggregate' and 'Derived' type mapping.
  signature: 'expression: str'
- uid: azure.mgmt.datafactory.types.MapperAttributeMapping.functionName
  name: functionName
  summary: Name of the function used for 'Aggregate' and 'Derived' (except 'Advanced')
    type mapping.
  signature: 'functionName: str'
- uid: azure.mgmt.datafactory.types.MapperAttributeMapping.name
  name: name
  summary: Name of the target column.
  signature: 'name: str'
- uid: azure.mgmt.datafactory.types.MapperAttributeMapping.type
  name: type
  summary: '''Advanced'' mapping type is also saved as ''Derived''.

    Known values are: "Direct", "Derived", and "Aggregate".'
  signature: 'type: str | MappingType'
