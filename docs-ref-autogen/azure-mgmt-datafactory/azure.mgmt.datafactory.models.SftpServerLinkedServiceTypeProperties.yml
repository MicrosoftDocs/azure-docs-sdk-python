### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties
name: SftpServerLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties
module: azure.mgmt.datafactory.models
summary: Properties specific to this linked service type.
constructor:
  syntax: 'SftpServerLinkedServiceTypeProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The SFTP server host name. Type: string (or Expression with resultType
    string).

    Required.'
  name: host
  types:
  - <xref:any>
- description: 'The TCP port number that the SFTP server uses to listen for client
    connections.

    Default value is 22. Type: integer (or Expression with resultType integer), minimum:
    0.'
  name: port
  types:
  - <xref:any>
- description: 'The authentication type to be used to connect to the FTP server.

    Known values are: "Basic", "SshPublicKey", and "MultiFactor".'
  name: authentication_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.SftpAuthenticationType>
- description: 'The username used to log on to the SFTP server. Type: string (or Expression

    with resultType string).'
  name: user_name
  types:
  - <xref:any>
- description: Password to logon the SFTP server for Basic authentication.
  name: password
  types:
  - <xref:azure.mgmt.datafactory.models.SecretBase>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: 'The SSH private key file path for SshPublicKey authentication. Only

    valid for on-premises copy. For on-premises copy with SshPublicKey authentication,
    either

    PrivateKeyPath or PrivateKeyContent should be specified. SSH private key should
    be OpenSSH

    format. Type: string (or Expression with resultType string).'
  name: private_key_path
  types:
  - <xref:any>
- description: 'Base64 encoded SSH private key content for SshPublicKey

    authentication. For on-premises copy with SshPublicKey authentication, either
    PrivateKeyPath or

    PrivateKeyContent should be specified. SSH private key should be OpenSSH format.'
  name: private_key_content
  types:
  - <xref:azure.mgmt.datafactory.models.SecretBase>
- description: 'The password to decrypt the SSH private key if the SSH private key
    is

    encrypted.'
  name: pass_phrase
  types:
  - <xref:azure.mgmt.datafactory.models.SecretBase>
- description: 'If true, skip the SSH host key validation. Default value is

    false. Type: boolean (or Expression with resultType boolean).'
  name: skip_host_key_validation
  types:
  - <xref:any>
- description: 'The host key finger-print of the SFTP server. When

    SkipHostKeyValidation is false, HostKeyFingerprint should be specified. Type:
    string (or

    Expression with resultType string).'
  name: host_key_fingerprint
  types:
  - <xref:any>
attributes:
- uid: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties.authentication_type
  name: authentication_type
  summary: '"Basic",

    "SshPublicKey", and "MultiFactor".'
  signature: 'authentication_type: str | _models.SftpAuthenticationType | None'
- uid: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties.encrypted_credential
  name: encrypted_credential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encrypted_credential: str | None'
- uid: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties.host
  name: host
  summary: string (or Expression with resultType string). Required.
  signature: 'host: Any'
- uid: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties.host_key_fingerprint
  name: host_key_fingerprint
  summary: 'The host key finger-print of the SFTP server. When SkipHostKeyValidation
    is false,

    HostKeyFingerprint should be specified. Type: string (or Expression with resultType
    string).'
  signature: 'host_key_fingerprint: Any | None'
- uid: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties.pass_phrase
  name: pass_phrase
  summary: The password to decrypt the SSH private key if the SSH private key is encrypted.
  signature: 'pass_phrase: _models.SecretBase | None'
- uid: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties.password
  name: password
  summary: Password to logon the SFTP server for Basic authentication.
  signature: 'password: _models.SecretBase | None'
- uid: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties.port
  name: port
  summary: 'The TCP port number that the SFTP server uses to listen for client connections.
    Default value

    is 22. Type: integer (or Expression with resultType integer), minimum: 0.'
  signature: 'port: Any | None'
- uid: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties.private_key_content
  name: private_key_content
  summary: 'Base64 encoded SSH private key content for SshPublicKey authentication.
    For on-premises copy

    with SshPublicKey authentication, either PrivateKeyPath or PrivateKeyContent should
    be

    specified. SSH private key should be OpenSSH format.'
  signature: 'private_key_content: _models.SecretBase | None'
- uid: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties.private_key_path
  name: private_key_path
  summary: 'The SSH private key file path for SshPublicKey authentication. Only valid
    for on-premises copy.

    For on-premises copy with SshPublicKey authentication, either PrivateKeyPath or

    PrivateKeyContent should be specified. SSH private key should be OpenSSH format.
    Type: string

    (or Expression with resultType string).'
  signature: 'private_key_path: Any | None'
- uid: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties.skip_host_key_validation
  name: skip_host_key_validation
  summary: 'boolean (or Expression

    with resultType boolean).'
  signature: 'skip_host_key_validation: Any | None'
- uid: azure.mgmt.datafactory.models.SftpServerLinkedServiceTypeProperties.user_name
  name: user_name
  summary: 'string (or Expression with resultType

    string).'
  signature: 'user_name: Any | None'
