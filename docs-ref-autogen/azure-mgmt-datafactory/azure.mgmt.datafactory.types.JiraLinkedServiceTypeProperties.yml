### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.JiraLinkedServiceTypeProperties
name: JiraLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.JiraLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Jira Service linked service properties.
constructor:
  syntax: JiraLinkedServiceTypeProperties()
variables:
- description: The IP address or host name of the Jira service. (e.g. jira.example.com).
    Required.
  name: host
  types:
  - <xref:typing.Any>
- description: 'The TCP port that the Jira server uses to listen for client connections.
    The

    default value is 443 if connecting through HTTPS, or 8080 if connecting through
    HTTP.'
  name: port
  types:
  - <xref:typing.Any>
- description: The user name that you use to access Jira Service. Required.
  name: username
  types:
  - <xref:typing.Any>
- description: 'The password corresponding to the user name that you provided in the
    username

    field.'
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specifies whether the data source endpoints are encrypted using

    HTTPS. The default value is true.'
  name: use_encrypted_endpoints
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require the host name in the server''s

    certificate to match the host name of the server when connecting over SSL. The
    default value is

    true.'
  name: use_host_verification
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to verify the identity of the server when

    connecting over SSL. The default value is true.'
  name: use_peer_verification
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.JiraLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.JiraLinkedServiceTypeProperties.host
  name: host
  summary: The IP address or host name of the Jira service. (e.g. jira.example.com).
    Required.
  signature: 'host: Any'
- uid: azure.mgmt.datafactory.types.JiraLinkedServiceTypeProperties.password
  name: password
  summary: The password corresponding to the user name that you provided in the username
    field.
  signature: 'password: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.JiraLinkedServiceTypeProperties.port
  name: port
  summary: 'The TCP port that the Jira server uses to listen for client connections.
    The default value is

    443 if connecting through HTTPS, or 8080 if connecting through HTTP.'
  signature: 'port: Any'
- uid: azure.mgmt.datafactory.types.JiraLinkedServiceTypeProperties.useEncryptedEndpoints
  name: useEncryptedEndpoints
  summary: 'Specifies whether the data source endpoints are encrypted using HTTPS.
    The default value is

    true.'
  signature: 'useEncryptedEndpoints: Any'
- uid: azure.mgmt.datafactory.types.JiraLinkedServiceTypeProperties.useHostVerification
  name: useHostVerification
  summary: 'Specifies whether to require the host name in the server''s certificate
    to match the host name

    of the server when connecting over SSL. The default value is true.'
  signature: 'useHostVerification: Any'
- uid: azure.mgmt.datafactory.types.JiraLinkedServiceTypeProperties.usePeerVerification
  name: usePeerVerification
  summary: 'Specifies whether to verify the identity of the server when connecting
    over SSL. The default

    value is true.'
  signature: 'usePeerVerification: Any'
- uid: azure.mgmt.datafactory.types.JiraLinkedServiceTypeProperties.username
  name: username
  summary: The user name that you use to access Jira Service. Required.
  signature: 'username: Any'
