  signature: 'authentication_type: str | _models.SparkAuthenticationType'
- uid: azure.mgmt.datafactory.models.SparkLinkedServiceTypeProperties.enable_server_certificate_validation
  name: enable_server_certificate_validation
  summary: 'Specifies whether the connections to the server will validate server certificate,
