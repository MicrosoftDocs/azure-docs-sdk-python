  name: host
  summary: IP address or host name of the Spark server. Required.
  signature: 'host: Any'
- uid: azure.mgmt.datafactory.models.SparkLinkedServiceTypeProperties.http_path
  name: http_path
  summary: The partial URL corresponding to the Spark server.
  signature: 'http_path: Any | None'
