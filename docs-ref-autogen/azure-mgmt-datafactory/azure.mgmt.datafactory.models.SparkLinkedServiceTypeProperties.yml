    value is True. Only used for Version 2.0.'
  signature: 'enable_server_certificate_validation: Any | None'
- uid: azure.mgmt.datafactory.models.SparkLinkedServiceTypeProperties.enable_ssl
  name: enable_ssl
  summary: 'Specifies whether the connections to the server are encrypted using SSL.
    The default value is

    false.'
  signature: 'enable_ssl: Any | None'
- uid: azure.mgmt.datafactory.models.SparkLinkedServiceTypeProperties.encrypted_credential
  name: encrypted_credential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encrypted_credential: str | None'
