uid: azure.mgmt.datafactory.types.FactoryProperties
name: FactoryProperties
fullName: azure.mgmt.datafactory.types.FactoryProperties
module: azure.mgmt.datafactory.types
summary: Factory resource properties.
constructor:
  syntax: FactoryProperties()
variables:
- description: Factory provisioning state, example Succeeded.
  name: provisioning_state
  types:
  - <xref:str>
- description: Time the factory was created in ISO8601 format.
  name: create_time
  types:
  - <xref:str>
- description: Version of the factory.
  name: version
  types:
  - <xref:str>
- description: Purview information of the factory.
  name: purview_configuration
  types:
  - <xref:<xref:"PurviewConfiguration">>
- description: Git repo information of the factory.
  name: repo_configuration
  types:
  - <xref:<xref:"FactoryRepoConfiguration">>
- description: List of parameters for factory.
  name: global_parameters
  types:
  - <xref:dict>[<xref:str>, <xref:"GlobalParameterSpecification">]
- description: Properties to enable Customer Managed Key for the factory.
  name: encryption
  types:
  - <xref:<xref:"EncryptionConfiguration">>
- description: 'Whether or not public network access is allowed for the data

    factory. Known values are: "Enabled" and "Disabled".'
  name: public_network_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
attributes:
- uid: azure.mgmt.datafactory.types.FactoryProperties.createTime
  name: createTime
  summary: Time the factory was created in ISO8601 format.
