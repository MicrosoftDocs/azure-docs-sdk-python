### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.MapperAttributeMapping
name: MapperAttributeMapping
fullName: azure.mgmt.datafactory.models.MapperAttributeMapping
module: azure.mgmt.datafactory.models
summary: Source and target column mapping details.
constructor:
  syntax: 'MapperAttributeMapping(*args: Any, **kwargs: Any)'
variables:
- description: Name of the target column.
  name: name
  types:
  - <xref:str>
- description: 'Type of the CDC attribute mapping. Note: ''Advanced'' mapping type
    is also saved as

    ''Derived''. Known values are: "Direct", "Derived", and "Aggregate".'
  name: type
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.MappingType>
- description: 'Name of the function used for ''Aggregate'' and ''Derived'' (except

    ''Advanced'') type mapping.'
  name: function_name
  types:
  - <xref:str>
- description: Expression used for 'Aggregate' and 'Derived' type mapping.
  name: expression
  types:
  - <xref:str>
- description: 'Reference of the source column used in the mapping. It is used for

    ''Direct'' mapping type only.'
  name: attribute_reference
  types:
  - <xref:azure.mgmt.datafactory.models.MapperAttributeReference>
- description: 'List of references for source columns. It is used for ''Derived''
    and

    ''Aggregate'' type mappings only.'
  name: attribute_references
  types:
  - <xref:list>[<xref:azure.mgmt.datafactory.models.MapperAttributeReference>]
attributes:
- uid: azure.mgmt.datafactory.models.MapperAttributeMapping.attribute_reference
  name: attribute_reference
  summary: Reference of the source column used in the mapping. It is used for 'Direct'
    mapping type only.
  signature: 'attribute_reference: _models.MapperAttributeReference | None'
- uid: azure.mgmt.datafactory.models.MapperAttributeMapping.attribute_references
  name: attribute_references
  summary: 'List of references for source columns. It is used for ''Derived'' and
    ''Aggregate'' type mappings

    only.'
  signature: 'attribute_references: list[''_models.MapperAttributeReference''] | None'
- uid: azure.mgmt.datafactory.models.MapperAttributeMapping.expression
  name: expression
  summary: Expression used for 'Aggregate' and 'Derived' type mapping.
  signature: 'expression: str | None'
- uid: azure.mgmt.datafactory.models.MapperAttributeMapping.function_name
  name: function_name
  summary: Name of the function used for 'Aggregate' and 'Derived' (except 'Advanced')
    type mapping.
  signature: 'function_name: str | None'
- uid: azure.mgmt.datafactory.models.MapperAttributeMapping.name
  name: name
  summary: Name of the target column.
  signature: 'name: str | None'
- uid: azure.mgmt.datafactory.models.MapperAttributeMapping.type
  name: type
  summary: '''Advanced'' mapping type is also saved as ''Derived''.

    Known values are: "Direct", "Derived", and "Aggregate".'
  signature: 'type: str | _models.MappingType | None'
