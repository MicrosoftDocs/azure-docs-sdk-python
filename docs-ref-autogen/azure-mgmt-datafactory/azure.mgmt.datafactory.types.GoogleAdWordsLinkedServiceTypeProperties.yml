    the server when connecting over SSL. This property can only be set when using
    SSL on

    self-hosted IR. The default value is the cacerts.pem file installed with the IR.
    Type: string

    (or Expression with resultType string).'
  signature: 'trustedCertPath: Any'
- uid: azure.mgmt.datafactory.types.GoogleAdWordsLinkedServiceTypeProperties.useSystemTrustStore
  name: useSystemTrustStore
  summary: '(Deprecated) Specifies whether to use a CA certificate from the system
