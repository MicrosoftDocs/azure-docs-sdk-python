    [https://developers.google.com/google-ads/api/docs/release-notes](https://developers.google.com/google-ads/api/docs/release-notes).
    Type: string (or

    Expression with resultType string).'
  signature: 'googleAdsApiVersion: Any'
- uid: azure.mgmt.datafactory.types.GoogleAdWordsLinkedServiceTypeProperties.keyFilePath
  name: keyFilePath
  summary: '(Deprecated) The full path to the .p12 key file that is used to authenticate
