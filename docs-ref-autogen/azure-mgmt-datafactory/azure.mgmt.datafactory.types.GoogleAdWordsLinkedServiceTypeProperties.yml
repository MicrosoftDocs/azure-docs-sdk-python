    resultType string).'
  signature: 'keyFilePath: Any'
- uid: azure.mgmt.datafactory.types.GoogleAdWordsLinkedServiceTypeProperties.loginCustomerID
  name: loginCustomerID
  summary: 'The customer ID of the Google Ads Manager account through which you want
    to fetch report data

    of specific Customer. Type: string (or Expression with resultType string).'
  signature: 'loginCustomerID: Any'
- uid: azure.mgmt.datafactory.types.GoogleAdWordsLinkedServiceTypeProperties.privateKey
  name: privateKey
  summary: 'The private key that is used to authenticate the service account email
    address and can only be

    used on self-hosted IR.'
  signature: 'privateKey: SecretBase'
- uid: azure.mgmt.datafactory.types.GoogleAdWordsLinkedServiceTypeProperties.refreshToken
  name: refreshToken
  summary: 'The refresh token obtained from Google for authorizing access to AdWords
    for

    UserAuthentication.'
  signature: 'refreshToken: SecretBase'
- uid: azure.mgmt.datafactory.types.GoogleAdWordsLinkedServiceTypeProperties.supportLegacyDataTypes
  name: supportLegacyDataTypes
  summary: 'Specifies whether to use the legacy data type mappings, which maps float,
    int32 and int64 from

    Google to string. Do not set this to true unless you want to keep backward compatibility
    with

    legacy driver''s data type mappings. Type: boolean (or Expression with resultType
    boolean).'
  signature: 'supportLegacyDataTypes: Any'
- uid: azure.mgmt.datafactory.types.GoogleAdWordsLinkedServiceTypeProperties.trustedCertPath
  name: trustedCertPath
  summary: '(Deprecated) The full path of the .pem file containing trusted CA certificates
