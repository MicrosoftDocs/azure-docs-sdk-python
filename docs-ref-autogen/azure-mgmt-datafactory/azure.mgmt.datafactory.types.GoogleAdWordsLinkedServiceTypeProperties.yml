  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.GoogleAdWordsLinkedServiceTypeProperties.googleAdsApiVersion
  name: googleAdsApiVersion
  summary: 'The Google Ads API major version such as v14. The supported major versions
