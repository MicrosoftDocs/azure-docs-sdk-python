  name: policyId
  summary: 'The policy id for limiting the ability to configure clusters based on
    a user defined set of

    rules. Type: string (or Expression with resultType string).'
  signature: 'policyId: Any'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.workspaceResourceId
  name: workspaceResourceId
  summary: 'string (or Expression with resultType

    string).'
  signature: 'workspaceResourceId: Any'
