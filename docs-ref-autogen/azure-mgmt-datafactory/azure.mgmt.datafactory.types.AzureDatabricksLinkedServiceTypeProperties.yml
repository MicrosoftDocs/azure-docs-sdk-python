### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties
name: AzureDatabricksLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Azure Databricks linked service properties.
constructor:
  syntax: AzureDatabricksLinkedServiceTypeProperties()
variables:
- description: '<REGION>.azuredatabricks.net, domain name of your Databricks deployment.
    Type:

    string (or Expression with resultType string). Required.'
  name: domain
  types:
  - <xref:typing.Any>
- description: 'Access token for databricks REST API. Refer to

    [https://docs.azuredatabricks.net/api/latest/authentication.html](https://docs.azuredatabricks.net/api/latest/authentication.html).
    Type: string (or

    Expression with resultType string).'
  name: access_token
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Required to specify MSI, if using Workspace resource id for databricks

    REST API. Type: string (or Expression with resultType string).'
  name: authentication
  types:
  - <xref:typing.Any>
- description: 'Workspace resource id for databricks REST API. Type: string (or

    Expression with resultType string).'
  name: workspace_resource_id
  types:
  - <xref:typing.Any>
- description: 'The id of an existing interactive cluster that will be used for all

    runs of this activity. Type: string (or Expression with resultType string).'
  name: existing_cluster_id
  types:
  - <xref:typing.Any>
- description: 'The id of an existing instance pool that will be used for all runs
    of

    this activity. Type: string (or Expression with resultType string).'
  name: instance_pool_id
  types:
  - <xref:typing.Any>
- description: 'If not using an existing interactive cluster, this specifies the

    Spark version of a new job cluster or instance pool nodes created for each run
    of this

    activity. Required if instancePoolId is specified. Type: string (or Expression
    with resultType

    string).'
  name: new_cluster_version
  types:
  - <xref:typing.Any>
- description: 'If not using an existing interactive cluster, this specifies

    the number of worker nodes to use for the new job cluster or instance pool. For
    new job

    clusters, this a string-formatted Int32, like ''1'' means numOfWorker is 1 or
    ''1:10'' means

    auto-scale from 1 (min) to 10 (max). For instance pools, this is a string-formatted
    Int32, and

    can only specify a fixed number of worker nodes, such as ''2''. Required if newClusterVersion
    is

    specified. Type: string (or Expression with resultType string).'
  name: new_cluster_num_of_worker
  types:
  - <xref:typing.Any>
- description: 'The node type of the new job cluster. This property is required if

    newClusterVersion is specified and instancePoolId is not specified. If instancePoolId
    is

    specified, this property is ignored. Type: string (or Expression with resultType
    string).'
  name: new_cluster_node_type
  types:
  - <xref:typing.Any>
- description: 'A set of optional, user-specified Spark configuration key-value

    pairs.'
  name: new_cluster_spark_conf
  types:
  - <xref:dict>[<xref:str>, <xref:typing.Any>]
- description: 'A set of optional, user-specified Spark environment variables

    key-value pairs.'
  name: new_cluster_spark_env_vars
  types:
  - <xref:dict>[<xref:str>, <xref:typing.Any>]
- description: 'Additional tags for cluster resources. This property is ignored

    in instance pool configurations.'
  name: new_cluster_custom_tags
  types:
  - <xref:dict>[<xref:str>, <xref:typing.Any>]
- description: 'Specify a location to deliver Spark driver, worker, and

    event logs. Type: string (or Expression with resultType string).'
  name: new_cluster_log_destination
  types:
  - <xref:typing.Any>
- description: 'The driver node type for the new job cluster. This property

    is ignored in instance pool configurations. Type: string (or Expression with resultType

    string).'
  name: new_cluster_driver_node_type
  types:
  - <xref:typing.Any>
- description: 'User-defined initialization scripts for the new cluster. Type:

    array of strings (or Expression with resultType array of strings).'
  name: new_cluster_init_scripts
  types:
  - <xref:typing.Any>
- description: 'Enable the elastic disk on the new cluster. This

    property is now ignored, and takes the default elastic disk behavior in Databricks
    (elastic

    disks are always enabled). Type: boolean (or Expression with resultType boolean).'
  name: new_cluster_enable_elastic_disk
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: 'The policy id for limiting the ability to configure clusters based
    on a user

    defined set of rules. Type: string (or Expression with resultType string).'
  name: policy_id
  types:
  - <xref:typing.Any>
- description: The credential reference containing authentication information.
  name: credential
  types:
  - <xref:<xref:"CredentialReference">>
- description: 'The data security mode for the Databricks Cluster. Type: string (or

    Expression with resultType string).'
  name: data_security_mode
  types:
  - <xref:typing.Any>
attributes:
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.accessToken
  name: accessToken
  summary: 'Access token for databricks REST API. Refer to

    [https://docs.azuredatabricks.net/api/latest/authentication.html](https://docs.azuredatabricks.net/api/latest/authentication.html).
    Type: string (or

    Expression with resultType string).'
  signature: 'accessToken: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.authentication
  name: authentication
  summary: 'string

    (or Expression with resultType string).'
  signature: 'authentication: Any'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.credential
  name: credential
  summary: The credential reference containing authentication information.
  signature: 'credential: CredentialReference'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.dataSecurityMode
  name: dataSecurityMode
  summary: 'string (or Expression with resultType

    string).'
  signature: 'dataSecurityMode: Any'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.domain
  name: domain
  summary: 'string (or

    Expression with resultType string). Required.'
  signature: 'domain: Any'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.existingClusterId
  name: existingClusterId
  summary: 'The id of an existing interactive cluster that will be used for all runs
    of this activity.

    Type: string (or Expression with resultType string).'
  signature: 'existingClusterId: Any'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.instancePoolId
  name: instancePoolId
  summary: 'The id of an existing instance pool that will be used for all runs of
    this activity. Type:

    string (or Expression with resultType string).'
  signature: 'instancePoolId: Any'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.newClusterCustomTags
  name: newClusterCustomTags
  summary: 'Additional tags for cluster resources. This property is ignored in instance
    pool

    configurations.'
  signature: 'newClusterCustomTags: dict[str, Any]'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.newClusterDriverNodeType
  name: newClusterDriverNodeType
  summary: 'The driver node type for the new job cluster. This property is ignored
    in instance pool

    configurations. Type: string (or Expression with resultType string).'
  signature: 'newClusterDriverNodeType: Any'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.newClusterEnableElasticDisk
  name: newClusterEnableElasticDisk
  summary: 'Enable the elastic disk on the new cluster. This property is now ignored,
    and takes the default

    elastic disk behavior in Databricks (elastic disks are always enabled). Type:
    boolean (or

    Expression with resultType boolean).'
  signature: 'newClusterEnableElasticDisk: Any'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.newClusterInitScripts
  name: newClusterInitScripts
  summary: 'array of strings (or Expression

    with resultType array of strings).'
  signature: 'newClusterInitScripts: Any'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.newClusterLogDestination
  name: newClusterLogDestination
  summary: 'string (or Expression

    with resultType string).'
  signature: 'newClusterLogDestination: Any'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.newClusterNodeType
  name: newClusterNodeType
  summary: 'The node type of the new job cluster. This property is required if newClusterVersion
    is

    specified and instancePoolId is not specified. If instancePoolId is specified,
    this property is

    ignored. Type: string (or Expression with resultType string).'
  signature: 'newClusterNodeType: Any'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.newClusterNumOfWorker
  name: newClusterNumOfWorker
  summary: 'If not using an existing interactive cluster, this specifies the number
    of worker nodes to use

    for the new job cluster or instance pool. For new job clusters, this a string-formatted
    Int32,

    like ''1'' means numOfWorker is 1 or ''1:10'' means auto-scale from 1 (min) to
    10 (max). For

    instance pools, this is a string-formatted Int32, and can only specify a fixed
    number of worker

    nodes, such as ''2''. Required if newClusterVersion is specified. Type: string
    (or Expression

    with resultType string).'
  signature: 'newClusterNumOfWorker: Any'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.newClusterSparkConf
  name: newClusterSparkConf
  summary: A set of optional, user-specified Spark configuration key-value pairs.
  signature: 'newClusterSparkConf: dict[str, Any]'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.newClusterSparkEnvVars
  name: newClusterSparkEnvVars
  summary: A set of optional, user-specified Spark environment variables key-value
    pairs.
  signature: 'newClusterSparkEnvVars: dict[str, Any]'
- uid: azure.mgmt.datafactory.types.AzureDatabricksLinkedServiceTypeProperties.newClusterVersion
  name: newClusterVersion
  summary: 'If not using an existing interactive cluster, this specifies the Spark
    version of a new job

    cluster or instance pool nodes created for each run of this activity. Required
    if

    instancePoolId is specified. Type: string (or Expression with resultType string).'
  signature: 'newClusterVersion: Any'
