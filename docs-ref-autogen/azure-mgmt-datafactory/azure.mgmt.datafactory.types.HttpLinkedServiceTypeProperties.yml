### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.HttpLinkedServiceTypeProperties
name: HttpLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.HttpLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Properties specific to this linked service type.
constructor:
  syntax: HttpLinkedServiceTypeProperties()
variables:
- description: 'The base URL of the HTTP endpoint, e.g. [https://www.microsoft.com](https://www.microsoft.com).
    Type: string (or Expression with resultType string). Required.'
  name: url
  types:
  - <xref:typing.Any>
- description: 'The authentication type to be used to connect to the HTTP server.

    Known values are: "Basic", "Anonymous", "Digest", "Windows", and "ClientCertificate".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HttpAuthenticationType">]
- description: 'User name for Basic, Digest, or Windows authentication. Type: string
    (or

    Expression with resultType string).'
  name: user_name
  types:
  - <xref:typing.Any>
- description: 'Password for Basic, Digest, Windows, or ClientCertificate with EmbeddedCertData

    authentication.'
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The additional HTTP headers in the request to RESTful API used for

    authorization. Type: key value pairs (value should be string type).'
  name: auth_headers
  types:
  - <xref:typing.Any>
- description: 'Base64 encoded certificate data for ClientCertificate authentication.

    For on-premises copy with ClientCertificate authentication, either CertThumbprint
    or

    EmbeddedCertData/Password should be specified. Type: string (or Expression with
    resultType

    string).'
  name: embedded_cert_data
  types:
  - <xref:typing.Any>
- description: 'Thumbprint of certificate for ClientCertificate authentication. Only

    valid for on-premises copy. For on-premises copy with ClientCertificate authentication,
    either

    CertThumbprint or EmbeddedCertData/Password should be specified. Type: string
    (or Expression

    with resultType string).'
  name: cert_thumbprint
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: 'If true, validate the HTTPS server SSL certificate.

    Default value is true. Type: boolean (or Expression with resultType boolean).'
  name: enable_server_certificate_validation
  types:
  - <xref:typing.Any>
attributes:
- uid: azure.mgmt.datafactory.types.HttpLinkedServiceTypeProperties.authHeaders
  name: authHeaders
  summary: 'key

    value pairs (value should be string type).'
  signature: 'authHeaders: Any'
- uid: azure.mgmt.datafactory.types.HttpLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: '"Basic",

    "Anonymous", "Digest", "Windows", and "ClientCertificate".'
  signature: 'authenticationType: str | HttpAuthenticationType'
- uid: azure.mgmt.datafactory.types.HttpLinkedServiceTypeProperties.certThumbprint
  name: certThumbprint
  summary: 'Thumbprint of certificate for ClientCertificate authentication. Only valid
    for on-premises

    copy. For on-premises copy with ClientCertificate authentication, either CertThumbprint
    or

    EmbeddedCertData/Password should be specified. Type: string (or Expression with
    resultType

    string).'
  signature: 'certThumbprint: Any'
- uid: azure.mgmt.datafactory.types.HttpLinkedServiceTypeProperties.embeddedCertData
  name: embeddedCertData
  summary: 'Base64 encoded certificate data for ClientCertificate authentication.
    For on-premises copy with

    ClientCertificate authentication, either CertThumbprint or EmbeddedCertData/Password
    should be

    specified. Type: string (or Expression with resultType string).'
  signature: 'embeddedCertData: Any'
- uid: azure.mgmt.datafactory.types.HttpLinkedServiceTypeProperties.enableServerCertificateValidation
  name: enableServerCertificateValidation
  summary: 'boolean (or

    Expression with resultType boolean).'
  signature: 'enableServerCertificateValidation: Any'
- uid: azure.mgmt.datafactory.types.HttpLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.HttpLinkedServiceTypeProperties.password
  name: password
  summary: Password for Basic, Digest, Windows, or ClientCertificate with EmbeddedCertData
    authentication.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.HttpLinkedServiceTypeProperties.url
  name: url
  summary: '//www.microsoft.com

    <[https://www.microsoft.com](https://www.microsoft.com)>`_. Type: string (or Expression
    with resultType string). Required.'
  signature: 'url: Required[Any]'
- uid: azure.mgmt.datafactory.types.HttpLinkedServiceTypeProperties.userName
  name: userName
  summary: 'string (or Expression with

    resultType string).'
  signature: 'userName: Any'
