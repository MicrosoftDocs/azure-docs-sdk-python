  name: additionalColumns
  summary: 'array of

    objects(AdditionalColumns) (or Expression with resultType array of objects).'
  signature: 'additionalColumns: Any'
- uid: azure.mgmt.datafactory.types.SalesforceV2Source.disableMetricsCollection
  name: disableMetricsCollection
  summary: 'boolean (or Expression

    with resultType boolean).'
  signature: 'disableMetricsCollection: Any'
- uid: azure.mgmt.datafactory.types.SalesforceV2Source.includeDeletedObjects
  name: includeDeletedObjects
  summary: 'This property control whether query result contains Deleted objects. Default
    is false. Type:

    boolean (or Expression with resultType boolean).'
  signature: 'includeDeletedObjects: Any'
- uid: azure.mgmt.datafactory.types.SalesforceV2Source.maxConcurrentConnections
  name: maxConcurrentConnections
  summary: 'integer (or Expression

    with resultType integer).'
  signature: 'maxConcurrentConnections: Any'
- uid: azure.mgmt.datafactory.types.SalesforceV2Source.pageSize
  name: pageSize
  summary: 'Page size for each http request, too large pageSize will caused timeout,
    default 300,000. Type:

    integer (or Expression with resultType integer).'
  signature: 'pageSize: Any'
- uid: azure.mgmt.datafactory.types.SalesforceV2Source.partitionOption
  name: partitionOption
  summary: 'Partition option for the SalesforceV2 connector in copy activity, AutoDetect
    or None. Type:

    string (or Expression with resultType string).'
  signature: 'partitionOption: Any'
- uid: azure.mgmt.datafactory.types.SalesforceV2Source.query
  name: query
  summary: 'You can only use Salesforce Object Query Language (SOQL) query with limitations.
    For SOQL

    limitations, see this article:

    [https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/queries.htm#SOQL%20Considerations](https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/queries.htm#SOQL%20Considerations).

    If query is not specified, all the data of the Salesforce object specified in

    ObjectApiName/reportId in dataset will be retrieved. Type: string (or Expression
    with

    resultType string).'
  signature: 'query: Any'
