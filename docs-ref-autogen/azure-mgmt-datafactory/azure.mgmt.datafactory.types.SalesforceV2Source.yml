  name: queryTimeout
  summary: 'string (or Expression with resultType string), pattern:

    ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  signature: 'queryTimeout: Any'
- uid: azure.mgmt.datafactory.types.SalesforceV2Source.sourceRetryCount
  name: sourceRetryCount
  summary: integer (or Expression with resultType integer).
  signature: 'sourceRetryCount: Any'
- uid: azure.mgmt.datafactory.types.SalesforceV2Source.sourceRetryWait
  name: sourceRetryWait
  summary: 'string (or Expression with resultType string), pattern:

    ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  signature: 'sourceRetryWait: Any'
- uid: azure.mgmt.datafactory.types.SalesforceV2Source.type
  name: type
  summary: Copy source type. Required. Default value is "SalesforceV2Source".
  signature: 'type: Literal[''SalesforceV2Source'']'
