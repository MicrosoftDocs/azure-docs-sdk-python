### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.SalesforceV2Source
name: SalesforceV2Source
fullName: azure.mgmt.datafactory.types.SalesforceV2Source
module: azure.mgmt.datafactory.types
summary: A copy activity Salesforce V2 source.
constructor:
  syntax: SalesforceV2Source()
variables:
- description: 'Source retry count. Type: integer (or Expression with resultType

    integer).'
  name: source_retry_count
  types:
  - <xref:typing.Any>
- description: 'Source retry wait. Type: string (or Expression with resultType

    string), pattern: ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: source_retry_wait
  types:
  - <xref:typing.Any>
- description: 'The maximum concurrent connection count for the source data

    store. Type: integer (or Expression with resultType integer).'
  name: max_concurrent_connections
  types:
  - <xref:typing.Any>
- description: 'If true, disable data store metrics collection. Default is

    false. Type: boolean (or Expression with resultType boolean).'
  name: disable_metrics_collection
  types:
  - <xref:typing.Any>
- description: 'Query timeout. Type: string (or Expression with resultType string),

    pattern: ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: query_timeout
  types:
  - <xref:typing.Any>
- description: 'Specifies the additional columns to be added to source data. Type:

    array of objects(AdditionalColumns) (or Expression with resultType array of objects).'
  name: additional_columns
  types:
  - <xref:typing.Any>
- description: 'Deprecating, please use ''query'' property instead. Type: string (or
    Expression

    with resultType string).'
  name: soql_query
  types:
  - <xref:typing.Any>
- description: 'You can only use Salesforce Object Query Language (SOQL) query with
    limitations.

    For SOQL limitations, see this article:

    [https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/queries.htm#SOQL%20Considerations](https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/queries.htm#SOQL%20Considerations).

    If query is not specified, all the data of the Salesforce object specified in

    ObjectApiName/reportId in dataset will be retrieved. Type: string (or Expression
    with

    resultType string).'
  name: query
  types:
  - <xref:typing.Any>
- description: 'This property control whether query result contains Deleted

    objects. Default is false. Type: boolean (or Expression with resultType boolean).'
  name: include_deleted_objects
  types:
  - <xref:typing.Any>
- description: 'Page size for each http request, too large pageSize will caused timeout,

    default 300,000. Type: integer (or Expression with resultType integer).'
  name: page_size
  types:
  - <xref:typing.Any>
- description: 'Partition option for the SalesforceV2 connector in copy activity,

    AutoDetect or None. Type: string (or Expression with resultType string).'
  name: partition_option
  types:
  - <xref:typing.Any>
- description: Copy source type. Required. Default value is "SalesforceV2Source".
  name: type
  types:
  - <xref:typing.Literal>["SalesforceV2Source"]
attributes:
