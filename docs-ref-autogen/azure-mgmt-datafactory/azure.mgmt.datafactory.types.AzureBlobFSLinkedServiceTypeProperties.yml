### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties
name: AzureBlobFSLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Azure Data Lake Storage Gen2 linked service properties.
constructor:
  syntax: AzureBlobFSLinkedServiceTypeProperties()
variables:
- description: 'Endpoint for the Azure Data Lake Storage Gen2 service. Type: string
    (or Expression

    with resultType string).'
  name: url
  types:
  - <xref:typing.Any>
- description: 'Account key for the Azure Data Lake Storage Gen2 service. Type: string
    (or

    Expression with resultType string).'
  name: account_key
  types:
  - <xref:typing.Any>
- description: 'The ID of the application used to authenticate against the Azure

    Data Lake Storage Gen2 account. Type: string (or Expression with resultType string).'
  name: service_principal_id
  types:
  - <xref:typing.Any>
- description: 'The Key of the application used to authenticate against the Azure

    Data Lake Storage Gen2 account.'
  name: service_principal_key
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The name or ID of the tenant to which the service principal belongs.
    Type: string

    (or Expression with resultType string).'
  name: tenant
  types:
  - <xref:typing.Any>
- description: 'Indicates the azure cloud type of the service principle auth. Allowed

    values are AzurePublic, AzureChina, AzureUsGovernment, AzureGermany. Default value
    is the data

    factory regions'' cloud type. Type: string (or Expression with resultType string).'
  name: azure_cloud_type
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: The credential reference containing authentication information.
  name: credential
  types:
  - <xref:<xref:"CredentialReference">>
- description: 'The service principal credential type to use in

    Server-To-Server authentication. ''ServicePrincipalKey'' for key/secret, ''ServicePrincipalCert''

    for certificate. Type: string (or Expression with resultType string).'
  name: service_principal_credential_type
  types:
  - <xref:typing.Any>
- description: 'The credential of the service principal object in Azure

    Active Directory. If servicePrincipalCredentialType is ''ServicePrincipalKey'',

    servicePrincipalCredential can be SecureString or AzureKeyVaultSecretReference.
    If

    servicePrincipalCredentialType is ''ServicePrincipalCert'', servicePrincipalCredential
    can only

    be AzureKeyVaultSecretReference.'
  name: service_principal_credential
  types:
  - <xref:<xref:"SecretBase">>
- description: 'SAS URI of the Azure Data Lake Storage Gen2 service. Type: string,
    SecureString

    or AzureKeyVaultSecretReference.'
  name: sas_uri
  types:
  - <xref:typing.Any>
- description: The Azure key vault secret reference of sasToken in sas uri.
  name: sas_token
  types:
  - <xref:<xref:"SecretBase">>
attributes:
- uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties.accountKey
  name: accountKey
  summary: 'string (or Expression with

    resultType string).'
  signature: 'accountKey: Any'
- uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties.azureCloudType
  name: azureCloudType
  summary: 'Indicates the azure cloud type of the service principle auth. Allowed
    values are AzurePublic,

    AzureChina, AzureUsGovernment, AzureGermany. Default value is the data factory
    regions'' cloud

    type. Type: string (or Expression with resultType string).'
  signature: 'azureCloudType: Any'
- uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties.credential
  name: credential
  summary: The credential reference containing authentication information.
  signature: 'credential: CredentialReference'
- uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties.sasToken
  name: sasToken
  summary: The Azure key vault secret reference of sasToken in sas uri.
  signature: 'sasToken: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties.sasUri
  name: sasUri
  summary: 'string, SecureString or

    AzureKeyVaultSecretReference.'
  signature: 'sasUri: Any'
- uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties.servicePrincipalCredential
  name: servicePrincipalCredential
  summary: 'The credential of the service principal object in Azure Active Directory.
    If

    servicePrincipalCredentialType is ''ServicePrincipalKey'', servicePrincipalCredential
    can be

    SecureString or AzureKeyVaultSecretReference. If servicePrincipalCredentialType
    is

    ''ServicePrincipalCert'', servicePrincipalCredential can only be AzureKeyVaultSecretReference.'
  signature: 'servicePrincipalCredential: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties.servicePrincipalCredentialType
  name: servicePrincipalCredentialType
  summary: 'The service principal credential type to use in Server-To-Server authentication.

    ''ServicePrincipalKey'' for key/secret, ''ServicePrincipalCert'' for certificate.
    Type: string (or

    Expression with resultType string).'
  signature: 'servicePrincipalCredentialType: Any'
- uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties.servicePrincipalId
  name: servicePrincipalId
  summary: 'The ID of the application used to authenticate against the Azure Data
    Lake Storage Gen2

    account. Type: string (or Expression with resultType string).'
  signature: 'servicePrincipalId: Any'
- uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties.servicePrincipalKey
  name: servicePrincipalKey
  summary: 'The Key of the application used to authenticate against the Azure Data
    Lake Storage Gen2

    account.'
  signature: 'servicePrincipalKey: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties.tenant
  name: tenant
  summary: 'string (or

    Expression with resultType string).'
  signature: 'tenant: Any'
- uid: azure.mgmt.datafactory.types.AzureBlobFSLinkedServiceTypeProperties.url
  name: url
  summary: 'string (or Expression with

    resultType string).'
  signature: 'url: Any'
