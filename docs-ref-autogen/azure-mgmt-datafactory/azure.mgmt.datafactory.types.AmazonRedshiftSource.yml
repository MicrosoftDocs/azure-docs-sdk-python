### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.AmazonRedshiftSource
name: AmazonRedshiftSource
fullName: azure.mgmt.datafactory.types.AmazonRedshiftSource
module: azure.mgmt.datafactory.types
summary: A copy activity source for Amazon Redshift Source.
constructor:
  syntax: AmazonRedshiftSource()
variables:
- description: 'Source retry count. Type: integer (or Expression with resultType

    integer).'
  name: source_retry_count
  types:
  - <xref:typing.Any>
- description: 'Source retry wait. Type: string (or Expression with resultType

    string), pattern: ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: source_retry_wait
  types:
  - <xref:typing.Any>
- description: 'The maximum concurrent connection count for the source data

    store. Type: integer (or Expression with resultType integer).'
  name: max_concurrent_connections
  types:
  - <xref:typing.Any>
- description: 'If true, disable data store metrics collection. Default is

    false. Type: boolean (or Expression with resultType boolean).'
  name: disable_metrics_collection
  types:
  - <xref:typing.Any>
- description: 'Query timeout. Type: string (or Expression with resultType string),

    pattern: ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: query_timeout
  types:
  - <xref:typing.Any>
- description: 'Specifies the additional columns to be added to source data. Type:

    array of objects(AdditionalColumns) (or Expression with resultType array of objects).'
  name: additional_columns
  types:
  - <xref:typing.Any>
- description: 'Database query. Type: string (or Expression with resultType string).'
  name: query
  types:
  - <xref:typing.Any>
- description: 'The Amazon S3 settings needed for the interim Amazon S3 when

    copying from Amazon Redshift with unload. With this, data from Amazon Redshift
    source will be

    unloaded into S3 first and then copied into the targeted sink from the interim
    S3.'
  name: redshift_unload_settings
  types:
  - <xref:<xref:"RedshiftUnloadSettings">>
- description: Copy source type. Required. Default value is "AmazonRedshiftSource".
  name: type
  types:
  - <xref:typing.Literal>["AmazonRedshiftSource"]
attributes:
- uid: azure.mgmt.datafactory.types.AmazonRedshiftSource.additionalColumns
  name: additionalColumns
  summary: 'array of

    objects(AdditionalColumns) (or Expression with resultType array of objects).'
  signature: 'additionalColumns: Any'
- uid: azure.mgmt.datafactory.types.AmazonRedshiftSource.disableMetricsCollection
  name: disableMetricsCollection
  summary: 'boolean (or Expression

    with resultType boolean).'
  signature: 'disableMetricsCollection: Any'
- uid: azure.mgmt.datafactory.types.AmazonRedshiftSource.maxConcurrentConnections
  name: maxConcurrentConnections
  summary: 'integer (or Expression

    with resultType integer).'
  signature: 'maxConcurrentConnections: Any'
- uid: azure.mgmt.datafactory.types.AmazonRedshiftSource.query
  name: query
  summary: string (or Expression with resultType string).
  signature: 'query: Any'
- uid: azure.mgmt.datafactory.types.AmazonRedshiftSource.queryTimeout
  name: queryTimeout
  summary: 'string (or Expression with resultType string), pattern:

    ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  signature: 'queryTimeout: Any'
- uid: azure.mgmt.datafactory.types.AmazonRedshiftSource.redshiftUnloadSettings
  name: redshiftUnloadSettings
  summary: 'The Amazon S3 settings needed for the interim Amazon S3 when copying from
