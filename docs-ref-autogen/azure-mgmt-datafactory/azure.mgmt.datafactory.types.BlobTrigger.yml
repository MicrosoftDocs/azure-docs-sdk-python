### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.BlobTrigger
name: BlobTrigger
fullName: azure.mgmt.datafactory.types.BlobTrigger
module: azure.mgmt.datafactory.types
summary: Trigger that runs every time the selected Blob container changes.
constructor:
  syntax: BlobTrigger()
variables:
- description: Trigger description.
  name: description
  types:
  - <xref:str>
- description: 'Indicates if trigger is running or not. Updated when Start/Stop APIs
    are

    called on the Trigger. Known values are: "Started", "Stopped", and "Disabled".'
  name: runtime_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TriggerRuntimeState">]
- description: List of tags that can be used for describing the trigger.
  name: annotations
  types:
  - <xref:list>[<xref:typing.Any>]
- description: Pipelines that need to be started.
  name: pipelines
  types:
  - <xref:list>[<xref:"TriggerPipelineReference">]
- description: Blob Trigger properties. Required.
  name: type_properties
  types:
  - <xref:<xref:"BlobTriggerTypeProperties">>
- description: Trigger type. Required. Default value is "BlobTrigger".
  name: type
  types:
  - <xref:typing.Literal>["BlobTrigger"]
attributes:
- uid: azure.mgmt.datafactory.types.BlobTrigger.annotations
  name: annotations
  summary: List of tags that can be used for describing the trigger.
  signature: 'annotations: list[Any]'
- uid: azure.mgmt.datafactory.types.BlobTrigger.description
  name: description
  summary: Trigger description.
  signature: 'description: str'
- uid: azure.mgmt.datafactory.types.BlobTrigger.pipelines
  name: pipelines
  summary: Pipelines that need to be started.
  signature: 'pipelines: list[''TriggerPipelineReference'']'
- uid: azure.mgmt.datafactory.types.BlobTrigger.runtimeState
  name: runtimeState
  summary: 'Indicates if trigger is running or not. Updated when Start/Stop APIs are
    called on the Trigger.

    Known values are: "Started", "Stopped", and "Disabled".'
  signature: 'runtimeState: str | TriggerRuntimeState'
- uid: azure.mgmt.datafactory.types.BlobTrigger.type
  name: type
  summary: Trigger type. Required. Default value is "BlobTrigger".
  signature: 'type: Required[Literal[''BlobTrigger'']]'
- uid: azure.mgmt.datafactory.types.BlobTrigger.typeProperties
  name: typeProperties
  summary: Blob Trigger properties. Required.
  signature: 'typeProperties: Required[BlobTriggerTypeProperties]'
