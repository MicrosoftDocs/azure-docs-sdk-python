### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.OdbcLinkedServiceTypeProperties
name: OdbcLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.OdbcLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: ODBC linked service properties.
constructor:
  syntax: OdbcLinkedServiceTypeProperties()
variables:
- description: 'The non-access credential portion of the connection string as well
    as

    an optional encrypted credential. Type: string, or SecureString, or

    AzureKeyVaultSecretReference, or Expression with resultType string. Required.'
  name: connection_string
  types:
  - <xref:typing.Any>
- description: 'Type of authentication used to connect to the ODBC data store.

    Possible values are: Anonymous and Basic. Type: string (or Expression with resultType
    string).'
  name: authentication_type
  types:
  - <xref:typing.Any>
- description: 'The access credential portion of the connection string specified in

    driver-specific property-value format.'
  name: credential
  types:
  - <xref:<xref:"SecretBase">>
- description: 'User name for Basic authentication. Type: string (or Expression with

    resultType string).'
  name: user_name
  types:
  - <xref:typing.Any>
- description: Password for Basic authentication.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.OdbcLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: 'Anonymous

    and Basic. Type: string (or Expression with resultType string).'
  signature: 'authenticationType: Any'
- uid: azure.mgmt.datafactory.types.OdbcLinkedServiceTypeProperties.connectionString
  name: connectionString
  summary: 'The non-access credential portion of the connection string as well as
    an optional encrypted

    credential. Type: string, or SecureString, or AzureKeyVaultSecretReference, or
    Expression with

    resultType string. Required.'
  signature: 'connectionString: Any'
- uid: azure.mgmt.datafactory.types.OdbcLinkedServiceTypeProperties.credential
  name: credential
  summary: 'The access credential portion of the connection string specified in driver-specific

    property-value format.'
  signature: 'credential: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.OdbcLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.OdbcLinkedServiceTypeProperties.password
  name: password
  summary: Password for Basic authentication.
  signature: 'password: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.OdbcLinkedServiceTypeProperties.userName
  name: userName
