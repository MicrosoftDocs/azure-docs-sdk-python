  signature: 'service_principal_key: _models.SecretBase | None'
- uid: azure.mgmt.datafactory.models.AzureSqlDatabaseLinkedServiceTypeProperties.tenant
  name: tenant
  summary: 'string (or

    Expression with resultType string).'
  signature: 'tenant: Any | None'
- uid: azure.mgmt.datafactory.models.AzureSqlDatabaseLinkedServiceTypeProperties.user_name
  name: user_name
  summary: 'string (or Expression with resultType

    string).'
  signature: 'user_name: Any | None'
