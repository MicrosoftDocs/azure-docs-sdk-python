    SecureString or AzureKeyVaultSecretReference. If servicePrincipalCredentialType
    is

    ''ServicePrincipalCert'', servicePrincipalCredential can only be AzureKeyVaultSecretReference.'
  signature: 'service_principal_credential: _models.SecretBase | None'
- uid: azure.mgmt.datafactory.models.AzureSqlDatabaseLinkedServiceTypeProperties.service_principal_credential_type
  name: service_principal_credential_type
  summary: 'The service principal credential type to use in Server-To-Server authentication.

    ''ServicePrincipalKey'' for key/secret, ''ServicePrincipalCert'' for certificate.
    Type: string (or

    Expression with resultType string).'
  signature: 'service_principal_credential_type: Any | None'
- uid: azure.mgmt.datafactory.models.AzureSqlDatabaseLinkedServiceTypeProperties.service_principal_id
  name: service_principal_id
  summary: 'string

    (or Expression with resultType string).'
  signature: 'service_principal_id: Any | None'
- uid: azure.mgmt.datafactory.models.AzureSqlDatabaseLinkedServiceTypeProperties.service_principal_key
  name: service_principal_key
  summary: The key of the service principal used to authenticate against Azure SQL
