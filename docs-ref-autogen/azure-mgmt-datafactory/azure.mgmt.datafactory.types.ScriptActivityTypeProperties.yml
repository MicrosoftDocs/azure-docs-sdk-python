uid: azure.mgmt.datafactory.types.ScriptActivityTypeProperties
name: ScriptActivityTypeProperties
fullName: azure.mgmt.datafactory.types.ScriptActivityTypeProperties
module: azure.mgmt.datafactory.types
summary: Script activity properties.
constructor:
  syntax: ScriptActivityTypeProperties()
variables:
- description: 'ScriptBlock execution timeout. Type: string (or

    Expression with resultType string), pattern:

    ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: script_block_execution_timeout
  types:
  - <xref:typing.Any>
- description: 'Array of script blocks. Type: array.'
  name: scripts
  types:
  - <xref:list>[<xref:"ScriptActivityScriptBlock">]
- description: Log settings of script activity.
  name: log_settings
  types:
  - <xref:<xref:"ScriptActivityTypePropertiesLogSettings">>
- description: 'Enable to retrieve result sets from multiple SQL statements

    and the number of rows affected by the DML statement. Supported connector: SnowflakeV2.
    Type:

    boolean (or Expression with resultType boolean).'
  name: return_multistatement_result
  types:
  - <xref:typing.Any>
- description: 'Indicates whether to treat decimal values as strings to avoid

    value overflow issue. This option is enabled for SnowflakeV2 connector only. Type:
    boolean (or

    Expression with resultType boolean).'
  name: treat_decimal_as_string
  types:
  - <xref:typing.Any>
