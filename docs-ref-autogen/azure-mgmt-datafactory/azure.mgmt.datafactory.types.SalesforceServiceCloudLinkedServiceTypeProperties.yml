### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.SalesforceServiceCloudLinkedServiceTypeProperties
name: SalesforceServiceCloudLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.SalesforceServiceCloudLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Salesforce Service Cloud linked service properties.
constructor:
  syntax: SalesforceServiceCloudLinkedServiceTypeProperties()
variables:
- description: 'The URL of Salesforce Service Cloud instance. Default is

    ''[https://login.salesforce.com](https://login.salesforce.com)''. To copy data
    from sandbox,

    specify ''[https://test.salesforce.com](https://test.salesforce.com)''. To copy
    data from

    custom domain, specify, for example, ''[https://[domain].my.salesforce.com](https://[domain].my.salesforce.com)''.
    Type: string (or

    Expression with resultType string).'
  name: environment_url
  types:
  - <xref:typing.Any>
- description: 'The username for Basic authentication of the Salesforce instance.
    Type: string

    (or Expression with resultType string).'
  name: username
  types:
  - <xref:typing.Any>
- description: The password for Basic authentication of the Salesforce instance.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: The security token is optional to remotely access Salesforce instance.
  name: security_token
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The Salesforce API version used in ADF. Type: string (or Expression
    with

    resultType string).'
  name: api_version
  types:
  - <xref:typing.Any>
- description: 'Extended properties appended to the connection string. Type: string

    (or Expression with resultType string).'
  name: extended_properties
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
