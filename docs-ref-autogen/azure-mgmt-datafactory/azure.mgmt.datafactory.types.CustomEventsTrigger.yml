### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.CustomEventsTrigger
name: CustomEventsTrigger
fullName: azure.mgmt.datafactory.types.CustomEventsTrigger
module: azure.mgmt.datafactory.types
summary: Trigger that runs every time a custom event is received.
constructor:
  syntax: CustomEventsTrigger()
variables:
- description: Trigger description.
  name: description
  types:
  - <xref:str>
- description: 'Indicates if trigger is running or not. Updated when Start/Stop APIs
    are

    called on the Trigger. Known values are: "Started", "Stopped", and "Disabled".'
  name: runtime_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TriggerRuntimeState">]
- description: List of tags that can be used for describing the trigger.
  name: annotations
  types:
  - <xref:list>[<xref:typing.Any>]
- description: Pipelines that need to be started.
  name: pipelines
  types:
  - <xref:list>[<xref:"TriggerPipelineReference">]
- description: Custom Events Trigger properties. Required.
  name: type_properties
  types:
  - <xref:<xref:"CustomEventsTriggerTypeProperties">>
- description: Trigger type. Required. Default value is "CustomEventsTrigger".
  name: type
  types:
  - <xref:typing.Literal>["CustomEventsTrigger"]
attributes:
- uid: azure.mgmt.datafactory.types.CustomEventsTrigger.annotations
  name: annotations
  summary: List of tags that can be used for describing the trigger.
  signature: 'annotations: list[Any]'
- uid: azure.mgmt.datafactory.types.CustomEventsTrigger.description
  name: description
  summary: Trigger description.
  signature: 'description: str'
- uid: azure.mgmt.datafactory.types.CustomEventsTrigger.pipelines
  name: pipelines
  summary: Pipelines that need to be started.
  signature: 'pipelines: list[''TriggerPipelineReference'']'
- uid: azure.mgmt.datafactory.types.CustomEventsTrigger.runtimeState
  name: runtimeState
  summary: 'Indicates if trigger is running or not. Updated when Start/Stop APIs are
    called on the Trigger.

    Known values are: "Started", "Stopped", and "Disabled".'
  signature: 'runtimeState: str | TriggerRuntimeState'
- uid: azure.mgmt.datafactory.types.CustomEventsTrigger.type
  name: type
  summary: Trigger type. Required. Default value is "CustomEventsTrigger".
  signature: 'type: Required[Literal[''CustomEventsTrigger'']]'
- uid: azure.mgmt.datafactory.types.CustomEventsTrigger.typeProperties
  name: typeProperties
  summary: Custom Events Trigger properties. Required.
  signature: 'typeProperties: Required[CustomEventsTriggerTypeProperties]'
