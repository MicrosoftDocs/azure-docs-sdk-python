### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.AmazonMWSLinkedServiceTypeProperties
name: AmazonMWSLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.AmazonMWSLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Amazon Marketplace Web Service linked service properties.
constructor:
  syntax: AmazonMWSLinkedServiceTypeProperties()
variables:
- description: The endpoint of the Amazon MWS server, (i.e. mws.amazonservices.com).
    Required.
  name: endpoint
  types:
  - <xref:typing.Any>
- description: 'The Amazon Marketplace ID you want to retrieve data from. To retrieve

    data from multiple Marketplace IDs, separate them with a comma (,). (i.e. A2EUQ1WTGCTBG2).

    Required.'
  name: marketplace_id
  types:
  - <xref:typing.Any>
- description: The Amazon seller ID. Required.
  name: seller_id
  types:
  - <xref:typing.Any>
- description: The Amazon MWS authentication token.
  name: mws_auth_token
  types:
  - <xref:<xref:"SecretBase">>
- description: The access key id used to access data. Required.
  name: access_key_id
  types:
  - <xref:typing.Any>
- description: The secret key used to access data.
  name: secret_key
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specifies whether the data source endpoints are encrypted using

    HTTPS. The default value is true.'
  name: use_encrypted_endpoints
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require the host name in the server''s

    certificate to match the host name of the server when connecting over SSL. The
    default value is

    true.'
  name: use_host_verification
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to verify the identity of the server when

    connecting over SSL. The default value is true.'
  name: use_peer_verification
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.AmazonMWSLinkedServiceTypeProperties.accessKeyId
  name: accessKeyId
  summary: The access key id used to access data. Required.
  signature: 'accessKeyId: Any'
- uid: azure.mgmt.datafactory.types.AmazonMWSLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.AmazonMWSLinkedServiceTypeProperties.endpoint
  name: endpoint
  summary: The endpoint of the Amazon MWS server, (i.e. mws.amazonservices.com). Required.
  signature: 'endpoint: Any'
- uid: azure.mgmt.datafactory.types.AmazonMWSLinkedServiceTypeProperties.marketplaceID
  name: marketplaceID
  summary: 'The Amazon Marketplace ID you want to retrieve data from. To retrieve
    data from multiple

    Marketplace IDs, separate them with a comma (,). (i.e. A2EUQ1WTGCTBG2). Required.'
  signature: 'marketplaceID: Any'
- uid: azure.mgmt.datafactory.types.AmazonMWSLinkedServiceTypeProperties.mwsAuthToken
  name: mwsAuthToken
  summary: The Amazon MWS authentication token.
  signature: 'mwsAuthToken: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.AmazonMWSLinkedServiceTypeProperties.secretKey
  name: secretKey
  summary: The secret key used to access data.
  signature: 'secretKey: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.AmazonMWSLinkedServiceTypeProperties.sellerID
  name: sellerID
  summary: The Amazon seller ID. Required.
  signature: 'sellerID: Any'
- uid: azure.mgmt.datafactory.types.AmazonMWSLinkedServiceTypeProperties.useEncryptedEndpoints
  name: useEncryptedEndpoints
  summary: 'Specifies whether the data source endpoints are encrypted using HTTPS.
    The default value is

    true.'
  signature: 'useEncryptedEndpoints: Any'
- uid: azure.mgmt.datafactory.types.AmazonMWSLinkedServiceTypeProperties.useHostVerification
  name: useHostVerification
  summary: 'Specifies whether to require the host name in the server''s certificate
    to match the host name

    of the server when connecting over SSL. The default value is true.'
  signature: 'useHostVerification: Any'
- uid: azure.mgmt.datafactory.types.AmazonMWSLinkedServiceTypeProperties.usePeerVerification
  name: usePeerVerification
  summary: 'Specifies whether to verify the identity of the server when connecting
    over SSL. The default

    value is true.'
  signature: 'usePeerVerification: Any'
