### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.Activity
name: Activity
fullName: azure.mgmt.datafactory.models.Activity
module: azure.mgmt.datafactory.models
summary: 'A pipeline activity.


  You probably want to use the sub-classes and not this class directly. Known sub-classes
  are:

  AppendVariableActivity, AzureDataExplorerCommandActivity, AzureFunctionActivity,

  AzureMLBatchExecutionActivity, AzureMLExecutePipelineActivity, AzureMLUpdateResourceActivity,

  ControlActivity, CopyActivity, CustomActivity, DataLakeAnalyticsUSQLActivity,

  DatabricksJobActivity, DatabricksNotebookActivity, DatabricksSparkJarActivity,

  DatabricksSparkPythonActivity, DeleteActivity, ExecuteDataFlowActivity,

  ExecutePipelineActivity, ExecuteSSISPackageActivity, ExecuteWranglingDataflowActivity,

  ExecutionActivity, FailActivity, FilterActivity, ForEachActivity, GetMetadataActivity,

  HDInsightHiveActivity, HDInsightMapReduceActivity, HDInsightPigActivity,

  HDInsightSparkActivity, HDInsightStreamingActivity, IfConditionActivity, LookupActivity,

  ScriptActivity, SetVariableActivity, SynapseSparkJobDefinitionActivity,

  SqlServerStoredProcedureActivity, SwitchActivity, SynapseNotebookActivity, UntilActivity,

  ValidationActivity, WaitActivity, WebActivity, WebHookActivity'
constructor:
  syntax: 'Activity(*args: Any, **kwargs: Any)'
variables:
- description: Activity name. Required.
  name: name
  types:
  - <xref:str>
- description: Type of activity. Required. Default value is None.
  name: type
  types:
  - <xref:str>
- description: Activity description.
  name: description
  types:
  - <xref:str>
- description: 'Activity state. This is an optional property and if not provided,
    the state will

    be Active by default. Known values are: "Active" and "Inactive".'
  name: state
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.ActivityState>
- description: 'Status result of the activity when the state is set to Inactive.

    This is an optional property and if not provided when the activity is inactive,
    the status will

    be Succeeded by default. Known values are: "Succeeded", "Failed", and "Skipped".'
  name: on_inactive_mark_as
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.ActivityOnInactiveMarkAs>
- description: Activity depends on condition.
  name: depends_on
  types:
  - <xref:list>[<xref:azure.mgmt.datafactory.models.ActivityDependency>]
- description: Activity user properties.
  name: user_properties
  types:
  - <xref:list>[<xref:azure.mgmt.datafactory.models.UserProperty>]
