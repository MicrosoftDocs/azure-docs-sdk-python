### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.RunQueryOrderBy
name: RunQueryOrderBy
fullName: azure.mgmt.datafactory.types.RunQueryOrderBy
module: azure.mgmt.datafactory.types
summary: An object to provide order by options for listing runs.
constructor:
  syntax: RunQueryOrderBy()
variables:
- description: 'Parameter name to be used for order by. The allowed parameters to
    order by for

    pipeline runs are PipelineName, RunStart, RunEnd and Status; for activity runs
    are

    ActivityName, ActivityRunStart, ActivityRunEnd and Status; for trigger runs are
    TriggerName,

    TriggerRunTimestamp and Status. Required. Known values are: "RunStart", "RunEnd",

    "PipelineName", "Status", "ActivityName", "ActivityRunStart", "ActivityRunEnd",
    "TriggerName",

    and "TriggerRunTimestamp".'
  name: order_by
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RunQueryOrderByField">]
- description: 'Sorting order of the parameter. Required. Known values are: "ASC"
    and "DESC".'
  name: order
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RunQueryOrder">]
attributes:
- uid: azure.mgmt.datafactory.types.RunQueryOrderBy.order
  name: order
  summary: '"ASC" and "DESC".'
  signature: 'order: Required[str | RunQueryOrder]'
- uid: azure.mgmt.datafactory.types.RunQueryOrderBy.orderBy
  name: orderBy
  summary: 'Parameter name to be used for order by. The allowed parameters to order
    by for pipeline runs

    are PipelineName, RunStart, RunEnd and Status; for activity runs are ActivityName,

    ActivityRunStart, ActivityRunEnd and Status; for trigger runs are TriggerName,

    TriggerRunTimestamp and Status. Required. Known values are: "RunStart", "RunEnd",

    "PipelineName", "Status", "ActivityName", "ActivityRunStart", "ActivityRunEnd",

    "TriggerName", and "TriggerRunTimestamp".'
  signature: 'orderBy: Required[str | RunQueryOrderByField]'
