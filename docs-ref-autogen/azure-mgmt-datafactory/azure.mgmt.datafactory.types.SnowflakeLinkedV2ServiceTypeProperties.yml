### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties
name: SnowflakeLinkedV2ServiceTypeProperties
fullName: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Snowflake linked service properties.
constructor:
  syntax: SnowflakeLinkedV2ServiceTypeProperties()
variables:
- description: 'The account identifier of your Snowflake account, e.g.

    xy12345.east-us-2.azure. Required.'
  name: account_identifier
  types:
  - <xref:typing.Any>
- description: The name of the Snowflake user.
  name: user
  types:
  - <xref:typing.Any>
- description: The Azure key vault secret reference of password in connection string.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: The name of the Snowflake database. Required.
  name: database
  types:
  - <xref:typing.Any>
- description: The name of the Snowflake warehouse. Required.
  name: warehouse
  types:
  - <xref:typing.Any>
- description: 'The type used for authentication. Type: string. Known values are:

    "Basic", "KeyPair", and "AADServicePrincipal".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SnowflakeAuthenticationType">]
- description: 'The client ID of the application registered in Azure Active Directory
    for

    AADServicePrincipal authentication.'
  name: client_id
  types:
  - <xref:typing.Any>
- description: 'The Azure key vault secret reference of client secret for

    AADServicePrincipal authentication.'
  name: client_secret
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The tenant ID of the application registered in Azure Active Directory
    for

    AADServicePrincipal authentication.'
  name: tenant_id
  types:
  - <xref:typing.Any>
- description: 'The scope of the application registered in Azure Active Directory
    for

    AADServicePrincipal authentication.'
  name: scope
  types:
  - <xref:typing.Any>
- description: The Azure key vault secret reference of privateKey for KeyPair auth.
  name: private_key
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The Azure key vault secret reference of private key password for

    KeyPair auth with encrypted private key.'
  name: private_key_passphrase
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The default access control role to use in the Snowflake session. Type:
    string (or

    Expression with resultType string).'
  name: role
  types:
  - <xref:typing.Any>
- description: 'The host name of the Snowflake account. Type: string (or Expression
    with resultType

    string).'
  name: host
  types:
  - <xref:typing.Any>
- description: 'Schema name for connection. Type: string (or Expression with resultType
    string).'
  name: schema
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: 'Indicates whether to use UTC timezone for timestamp data types. Type:

    boolean.'
  name: use_utc_timestamps
  types:
  - <xref:typing.Any>
attributes:
