  name: clientSecret
  summary: The Azure key vault secret reference of client secret for AADServicePrincipal
    authentication.
  signature: 'clientSecret: SecretBase'
- uid: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties.database
  name: database
  summary: The name of the Snowflake database. Required.
  signature: 'database: Required[Any]'
