  name: accountIdentifier
  summary: The account identifier of your Snowflake account, e.g. xy12345.east-us-2.azure.
    Required.
  signature: 'accountIdentifier: Required[Any]'
- uid: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties.authenticationType
  name: authenticationType
  summary: '"Basic", "KeyPair", and

    "AADServicePrincipal".'
  signature: 'authenticationType: str | SnowflakeAuthenticationType'
