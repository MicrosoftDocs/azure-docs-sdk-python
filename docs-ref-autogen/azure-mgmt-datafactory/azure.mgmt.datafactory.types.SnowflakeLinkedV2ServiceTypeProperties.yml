  name: password
  summary: The Azure key vault secret reference of password in connection string.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties.privateKey
  name: privateKey
  summary: The Azure key vault secret reference of privateKey for KeyPair auth.
  signature: 'privateKey: SecretBase'
- uid: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties.privateKeyPassphrase
  name: privateKeyPassphrase
  summary: 'The Azure key vault secret reference of private key password for KeyPair
    auth with encrypted

    private key.'
  signature: 'privateKeyPassphrase: SecretBase'
- uid: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties.role
  name: role
  summary: 'string (or Expression

    with resultType string).'
  signature: 'role: Any'
- uid: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties.schema
  name: schema
  summary: string (or Expression with resultType string).
  signature: 'schema: Any'
- uid: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties.scope
  name: scope
  summary: 'The scope of the application registered in Azure Active Directory for
    AADServicePrincipal

    authentication.'
  signature: 'scope: Any'
- uid: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties.tenantId
  name: tenantId
  summary: 'The tenant ID of the application registered in Azure Active Directory
    for AADServicePrincipal

    authentication.'
  signature: 'tenantId: Any'
- uid: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties.useUtcTimestamps
  name: useUtcTimestamps
  summary: boolean.
  signature: 'useUtcTimestamps: Any'
- uid: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties.user
  name: user
  summary: The name of the Snowflake user.
  signature: 'user: Any'
- uid: azure.mgmt.datafactory.types.SnowflakeLinkedV2ServiceTypeProperties.warehouse
  name: warehouse
  summary: The name of the Snowflake warehouse. Required.
  signature: 'warehouse: Required[Any]'
