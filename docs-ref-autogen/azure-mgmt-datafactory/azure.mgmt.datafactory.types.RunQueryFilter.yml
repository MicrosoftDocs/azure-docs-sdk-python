    runs are

    TriggerName, TriggerRunTimestamp and Status. Required. Known values are: "PipelineName",

    "Status", "RunStart", "RunEnd", "ActivityName", "ActivityRunStart",

    "ActivityRunEnd", "ActivityType", "TriggerName", "TriggerRunTimestamp", "RunGroupId",

    and "LatestOnly".'
  signature: 'operand: Required[str | RunQueryFilterOperand]'
- uid: azure.mgmt.datafactory.types.RunQueryFilter.operator
  name: operator
  summary: '"Equals", "NotEquals", "In",

    and "NotIn".'
  signature: 'operator: Required[str | RunQueryFilterOperator]'
