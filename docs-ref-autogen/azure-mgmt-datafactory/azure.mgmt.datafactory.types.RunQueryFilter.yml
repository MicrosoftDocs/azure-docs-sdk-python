### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.RunQueryFilter
name: RunQueryFilter
fullName: azure.mgmt.datafactory.types.RunQueryFilter
module: azure.mgmt.datafactory.types
summary: Query filter option for listing runs.
constructor:
  syntax: RunQueryFilter()
variables:
- description: 'Parameter name to be used for filter. The allowed operands to query
    pipeline

    runs are PipelineName, RunStart, RunEnd and Status; to query activity runs are
    ActivityName,

    ActivityRunStart, ActivityRunEnd, ActivityType and Status, and to query trigger
    runs are

    TriggerName, TriggerRunTimestamp and Status. Required. Known values are: "PipelineName",

    "Status", "RunStart", "RunEnd", "ActivityName", "ActivityRunStart", "ActivityRunEnd",

    "ActivityType", "TriggerName", "TriggerRunTimestamp", "RunGroupId", and "LatestOnly".'
  name: operand
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RunQueryFilterOperand">]
- description: 'Operator to be used for filter. Required. Known values are: "Equals",

    "NotEquals", "In", and "NotIn".'
  name: operator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RunQueryFilterOperator">]
- description: List of filter values. Required.
  name: values_property
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.datafactory.types.RunQueryFilter.operand
  name: operand
  summary: 'Parameter name to be used for filter. The allowed operands to query pipeline
    runs are

    PipelineName, RunStart, RunEnd and Status; to query activity runs are ActivityName,

