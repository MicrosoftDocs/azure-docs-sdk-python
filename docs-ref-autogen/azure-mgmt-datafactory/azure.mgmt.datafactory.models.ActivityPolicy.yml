### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.ActivityPolicy
name: ActivityPolicy
fullName: azure.mgmt.datafactory.models.ActivityPolicy
module: azure.mgmt.datafactory.models
summary: Execution policy for an activity.
constructor:
  syntax: 'ActivityPolicy(*args: Any, **kwargs: Any)'
variables:
- description: 'Specifies the timeout for the activity to run. The default timeout
    is 7 days.

    Type: string (or Expression with resultType string), pattern:

    ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: timeout
  types:
  - <xref:any>
- description: 'Maximum ordinary retry attempts. Default is 0. Type: integer (or Expression
    with

    resultType integer), minimum: 0.'
  name: retry
  types:
  - <xref:any>
- description: 'Interval between each retry attempt (in seconds). The default

    is 30 sec.'
  name: retry_interval_in_seconds
  types:
  - <xref:int>
- description: 'When set to true, Input from activity is considered as secure and
    will not

    be logged to monitoring.'
  name: secure_input
  types:
  - <xref:bool>
- description: 'When set to true, Output from activity is considered as secure and
    will

    not be logged to monitoring.'
  name: secure_output
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.datafactory.models.ActivityPolicy.retry
  name: retry
  summary: 'integer (or Expression with resultType

    integer), minimum: 0.'
  signature: 'retry: Any | None'
- uid: azure.mgmt.datafactory.models.ActivityPolicy.retry_interval_in_seconds
  name: retry_interval_in_seconds
  summary: Interval between each retry attempt (in seconds). The default is 30 sec.
  signature: 'retry_interval_in_seconds: int | None'
- uid: azure.mgmt.datafactory.models.ActivityPolicy.secure_input
  name: secure_input
  summary: 'When set to true, Input from activity is considered as secure and will
    not be logged to

    monitoring.'
  signature: 'secure_input: bool | None'
- uid: azure.mgmt.datafactory.models.ActivityPolicy.secure_output
  name: secure_output
  summary: 'When set to true, Output from activity is considered as secure and will
    not be logged to

    monitoring.'
  signature: 'secure_output: bool | None'
- uid: azure.mgmt.datafactory.models.ActivityPolicy.timeout
  name: timeout
  summary: 'string (or

    Expression with resultType string), pattern:

    ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  signature: 'timeout: Any | None'
