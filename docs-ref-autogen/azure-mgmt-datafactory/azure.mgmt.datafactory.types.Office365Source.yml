uid: azure.mgmt.datafactory.types.Office365Source
name: Office365Source
fullName: azure.mgmt.datafactory.types.Office365Source
module: azure.mgmt.datafactory.types
summary: A copy activity source for an Office 365 service.
constructor:
  syntax: Office365Source()
variables:
- description: 'Source retry count. Type: integer (or Expression with resultType

    integer).'
  name: source_retry_count
  types:
  - <xref:typing.Any>
- description: 'Source retry wait. Type: string (or Expression with resultType

    string), pattern: ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: source_retry_wait
  types:
  - <xref:typing.Any>
- description: 'The maximum concurrent connection count for the source data

    store. Type: integer (or Expression with resultType integer).'
  name: max_concurrent_connections
  types:
  - <xref:typing.Any>
- description: 'If true, disable data store metrics collection. Default is

    false. Type: boolean (or Expression with resultType boolean).'
  name: disable_metrics_collection
  types:
  - <xref:typing.Any>
- description: 'The groups containing all the users. Type: array of strings (or

    Expression with resultType array of strings).'
  name: allowed_groups
  types:
  - <xref:typing.Any>
- description: 'The user scope uri. Type: string (or Expression with resultType

    string).'
  name: user_scope_filter_uri
  types:
  - <xref:typing.Any>
- description: 'The Column to apply the <paramref name="StartTime"/> and <paramref

    name="EndTime"/>. Type: string (or Expression with resultType string).'
  name: date_filter_column
  types:
  - <xref:typing.Any>
- description: 'Start time of the requested range for this dataset. Type: string (or

    Expression with resultType string).'
  name: start_time
  types:
  - <xref:typing.Any>
- description: 'End time of the requested range for this dataset. Type: string (or
    Expression

    with resultType string).'
  name: end_time
  types:
  - <xref:typing.Any>
- description: 'The columns to be read out from the Office 365 table. Type: array
    of

    objects (or Expression with resultType array of objects). itemType: OutputColumn.
    Example: [ {

    "name": "Id" }, { "name": "CreatedDateTime" } ].'
  name: output_columns
  types:
  - <xref:typing.Any>
- description: Copy source type. Required. Default value is "Office365Source".
  name: type
  types:
  - <xref:typing.Literal>["Office365Source"]
