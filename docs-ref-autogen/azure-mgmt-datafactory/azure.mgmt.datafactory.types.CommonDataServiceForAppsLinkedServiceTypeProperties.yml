### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties
name: CommonDataServiceForAppsLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Common Data Service for Apps linked service properties.
constructor:
  syntax: CommonDataServiceForAppsLinkedServiceTypeProperties()
variables:
- description: 'The deployment type of the Common Data Service for Apps instance.

    ''Online'' for Common Data Service for Apps Online and ''OnPremisesWithIfd'' for
    Common Data

    Service for Apps on-premises with Ifd. Type: string (or Expression with resultType
    string).

    Required.'
  name: deployment_type
  types:
  - <xref:typing.Any>
- description: 'The host name of the on-premises Common Data Service for Apps server.
    The

    property is required for on-prem and not allowed for online. Type: string (or
    Expression with

    resultType string).'
  name: host_name
  types:
  - <xref:typing.Any>
- description: 'The port of on-premises Common Data Service for Apps server. The property
    is

    required for on-prem and not allowed for online. Default is 443. Type: integer
    (or Expression

    with resultType integer), minimum: 0.'
  name: port
  types:
  - <xref:typing.Any>
- description: 'The URL to the Microsoft Common Data Service for Apps server. The
    property

    is required for on-line and not allowed for on-prem. Type: string (or Expression
    with

    resultType string).'
  name: service_uri
  types:
  - <xref:typing.Any>
- description: 'The organization name of the Common Data Service for Apps instance.

    The property is required for on-prem and required for online when there are more
    than one

    Common Data Service for Apps instances associated with the user. Type: string
    (or Expression

    with resultType string).'
  name: organization_name
  types:
  - <xref:typing.Any>
- description: 'The authentication type to connect to Common Data Service for Apps

    server. ''Office365'' for online scenario, ''Ifd'' for on-premises with Ifd scenario.

    ''AADServicePrincipal'' for Server-To-Server authentication in online scenario,
    ''Active

    Directory'' for Dynamics on-premises with IFD. Type: string (or Expression with
    resultType

    string). Required.'
  name: authentication_type
  types:
  - <xref:typing.Any>
- description: 'The Active Directory domain that will verify user credentials. Type:
    string (or

    Expression with resultType string).'
  name: domain
  types:
  - <xref:typing.Any>
- description: 'User name to access the Common Data Service for Apps instance. Type:
    string (or

    Expression with resultType string).'
  name: username
  types:
  - <xref:typing.Any>
- description: Password to access the Common Data Service for Apps instance.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The client ID of the application in Azure Active Directory used for

    Server-To-Server authentication. Type: string (or Expression with resultType string).'
  name: service_principal_id
  types:
  - <xref:typing.Any>
- description: 'The service principal credential type to use in

    Server-To-Server authentication. ''ServicePrincipalKey'' for key/secret, ''ServicePrincipalCert''

    for certificate. Type: string (or Expression with resultType string).'
  name: service_principal_credential_type
  types:
  - <xref:typing.Any>
- description: 'The credential of the service principal object in Azure

    Active Directory. If servicePrincipalCredentialType is ''ServicePrincipalKey'',

    servicePrincipalCredential can be SecureString or AzureKeyVaultSecretReference.
    If

    servicePrincipalCredentialType is ''ServicePrincipalCert'', servicePrincipalCredential
    can only

    be AzureKeyVaultSecretReference.'
  name: service_principal_credential
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: 'The authentication type to connect to Common Data Service for Apps server.
    ''Office365'' for

    online scenario, ''Ifd'' for on-premises with Ifd scenario. ''AADServicePrincipal''
    for

    Server-To-Server authentication in online scenario, ''Active Directory'' for Dynamics
    on-premises

    with IFD. Type: string (or Expression with resultType string). Required.'
  signature: 'authenticationType: Any'
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.deploymentType
  name: deploymentType
  summary: 'The deployment type of the Common Data Service for Apps instance. ''Online''
    for Common Data

    Service for Apps Online and ''OnPremisesWithIfd'' for Common Data Service for
    Apps on-premises

    with Ifd. Type: string (or Expression with resultType string). Required.'
  signature: 'deploymentType: Any'
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.domain
  name: domain
  summary: 'string (or Expression with

    resultType string).'
  signature: 'domain: Any'
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.hostName
  name: hostName
  summary: 'The host name of the on-premises Common Data Service for Apps server.
    The property is required

    for on-prem and not allowed for online. Type: string (or Expression with resultType
    string).'
  signature: 'hostName: Any'
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.organizationName
  name: organizationName
  summary: 'The organization name of the Common Data Service for Apps instance. The
    property is required

    for on-prem and required for online when there are more than one Common Data Service
    for Apps

    instances associated with the user. Type: string (or Expression with resultType
    string).'
  signature: 'organizationName: Any'
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.password
  name: password
  summary: Password to access the Common Data Service for Apps instance.
  signature: 'password: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.port
  name: port
  summary: 'The port of on-premises Common Data Service for Apps server. The property
    is required for

    on-prem and not allowed for online. Default is 443. Type: integer (or Expression
    with

    resultType integer), minimum: 0.'
  signature: 'port: Any'
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.servicePrincipalCredential
  name: servicePrincipalCredential
  summary: 'The credential of the service principal object in Azure Active Directory.
    If

    servicePrincipalCredentialType is ''ServicePrincipalKey'', servicePrincipalCredential
    can be

    SecureString or AzureKeyVaultSecretReference. If servicePrincipalCredentialType
    is

    ''ServicePrincipalCert'', servicePrincipalCredential can only be AzureKeyVaultSecretReference.'
  signature: 'servicePrincipalCredential: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.servicePrincipalCredentialType
  name: servicePrincipalCredentialType
  summary: 'The service principal credential type to use in Server-To-Server authentication.

    ''ServicePrincipalKey'' for key/secret, ''ServicePrincipalCert'' for certificate.
    Type: string (or

    Expression with resultType string).'
  signature: 'servicePrincipalCredentialType: Any'
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.servicePrincipalId
  name: servicePrincipalId
  summary: 'The client ID of the application in Azure Active Directory used for Server-To-Server

    authentication. Type: string (or Expression with resultType string).'
  signature: 'servicePrincipalId: Any'
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.serviceUri
  name: serviceUri
  summary: 'The URL to the Microsoft Common Data Service for Apps server. The property
    is required for

    on-line and not allowed for on-prem. Type: string (or Expression with resultType
    string).'
  signature: 'serviceUri: Any'
- uid: azure.mgmt.datafactory.types.CommonDataServiceForAppsLinkedServiceTypeProperties.username
  name: username
  summary: 'string (or Expression with

    resultType string).'
  signature: 'username: Any'
