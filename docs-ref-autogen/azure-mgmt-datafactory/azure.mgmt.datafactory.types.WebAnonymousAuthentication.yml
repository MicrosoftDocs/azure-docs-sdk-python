uid: azure.mgmt.datafactory.types.WebAnonymousAuthentication
name: WebAnonymousAuthentication
fullName: azure.mgmt.datafactory.types.WebAnonymousAuthentication
module: azure.mgmt.datafactory.types
summary: A WebLinkedService that uses anonymous authentication to communicate with
  an HTTP endpoint.
constructor:
  syntax: WebAnonymousAuthentication()
variables:
- description: 'The URL of the web service endpoint, e.g. [https://www.microsoft.com](https://www.microsoft.com)
    . Type: string (or Expression with resultType string). Required.'
