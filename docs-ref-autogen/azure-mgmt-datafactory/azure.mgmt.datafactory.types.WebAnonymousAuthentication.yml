    Anonymous.
  signature: 'authenticationType: ANONYMOUS: ''Anonymous''>]'
- uid: azure.mgmt.datafactory.types.WebAnonymousAuthentication.url
  name: url
  summary: '//www.microsoft.com

    <[https://www.microsoft.com](https://www.microsoft.com)>`_ . Type: string (or
    Expression with resultType string). Required.'
  signature: 'url: Any'
