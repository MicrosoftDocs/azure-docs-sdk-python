### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.ChainingTrigger
name: ChainingTrigger
fullName: azure.mgmt.datafactory.types.ChainingTrigger
module: azure.mgmt.datafactory.types
summary: 'Trigger that allows the referenced pipeline to depend on other pipeline
  runs based on

  runDimension Name/Value pairs. Upstream pipelines should declare the same runDimension
  Name and

  their runs should have the values for those runDimensions. The referenced pipeline
  run would be

  triggered if the values for the runDimension match for all upstream pipeline runs.'
constructor:
  syntax: ChainingTrigger()
variables:
- description: Trigger description.
  name: description
  types:
  - <xref:str>
- description: 'Indicates if trigger is running or not. Updated when Start/Stop APIs
    are

    called on the Trigger. Known values are: "Started", "Stopped", and "Disabled".'
  name: runtime_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TriggerRuntimeState">]
- description: List of tags that can be used for describing the trigger.
  name: annotations
  types:
  - <xref:list>[<xref:typing.Any>]
- description: 'Pipeline for which runs are created when all upstream pipelines complete

    successfully. Required.'
  name: pipeline
  types:
  - <xref:<xref:"TriggerPipelineReference">>
- description: Chaining Trigger properties. Required.
  name: type_properties
  types:
  - <xref:<xref:"ChainingTriggerTypeProperties">>
- description: Trigger type. Required. Default value is "ChainingTrigger".
  name: type
  types:
  - <xref:typing.Literal>["ChainingTrigger"]
attributes:
- uid: azure.mgmt.datafactory.types.ChainingTrigger.annotations
  name: annotations
  summary: List of tags that can be used for describing the trigger.
  signature: 'annotations: list[Any]'
- uid: azure.mgmt.datafactory.types.ChainingTrigger.description
  name: description
  summary: Trigger description.
  signature: 'description: str'
- uid: azure.mgmt.datafactory.types.ChainingTrigger.pipeline
  name: pipeline
  summary: 'Pipeline for which runs are created when all upstream pipelines complete
    successfully.

    Required.'
  signature: 'pipeline: Required[TriggerPipelineReference]'
- uid: azure.mgmt.datafactory.types.ChainingTrigger.runtimeState
  name: runtimeState
  summary: 'Indicates if trigger is running or not. Updated when Start/Stop APIs are
    called on the Trigger.

    Known values are: "Started", "Stopped", and "Disabled".'
  signature: 'runtimeState: str | TriggerRuntimeState'
- uid: azure.mgmt.datafactory.types.ChainingTrigger.type
  name: type
  summary: Trigger type. Required. Default value is "ChainingTrigger".
  signature: 'type: Required[Literal[''ChainingTrigger'']]'
- uid: azure.mgmt.datafactory.types.ChainingTrigger.typeProperties
  name: typeProperties
  summary: Chaining Trigger properties. Required.
  signature: 'typeProperties: Required[ChainingTriggerTypeProperties]'
