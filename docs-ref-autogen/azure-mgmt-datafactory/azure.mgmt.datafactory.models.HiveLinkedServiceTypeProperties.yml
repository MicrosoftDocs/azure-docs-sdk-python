    file. The default value is false.'
  signature: 'use_system_trust_store: Any | None'
- uid: azure.mgmt.datafactory.models.HiveLinkedServiceTypeProperties.username
  name: username
  summary: The user name that you use to access Hive Server.
  signature: 'username: Any | None'
- uid: azure.mgmt.datafactory.models.HiveLinkedServiceTypeProperties.zoo_keeper_name_space
  name: zoo_keeper_name_space
  summary: The namespace on ZooKeeper under which Hive Server 2 nodes are added.
  signature: 'zoo_keeper_name_space: Any | None'
