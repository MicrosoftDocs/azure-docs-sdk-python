  signature: 'password: _models.SecretBase | None'
- uid: azure.mgmt.datafactory.models.HiveLinkedServiceTypeProperties.port
  name: port
  summary: The TCP port that the Hive server uses to listen for client connections.
  signature: 'port: Any | None'
- uid: azure.mgmt.datafactory.models.HiveLinkedServiceTypeProperties.server_type
  name: server_type
  summary: '"HiveServer1", "HiveServer2", and

    "HiveThriftServer".'
  signature: 'server_type: str | _models.HiveServerType | None'
- uid: azure.mgmt.datafactory.models.HiveLinkedServiceTypeProperties.service_discovery_mode
  name: service_discovery_mode
  summary: true to indicate using the ZooKeeper service, false not.
  signature: 'service_discovery_mode: Any | None'
- uid: azure.mgmt.datafactory.models.HiveLinkedServiceTypeProperties.thrift_transport_protocol
  name: thrift_transport_protocol
  summary: '"Binary", "SASL", and

