### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.HdfsLinkedServiceTypeProperties
name: HdfsLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.HdfsLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: HDFS linked service properties.
constructor:
  syntax: HdfsLinkedServiceTypeProperties()
variables:
- description: 'The URL of the HDFS service endpoint, e.g. [http://myhostname:50070/webhdfs/v1](http://myhostname:50070/webhdfs/v1)
    . Type: string (or Expression with resultType string).

    Required.'
  name: url
  types:
  - <xref:typing.Any>
- description: 'Type of authentication used to connect to the HDFS. Possible values

    are: Anonymous and Windows. Type: string (or Expression with resultType string).'
  name: authentication_type
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: 'User name for Windows authentication. Type: string (or Expression
    with

    resultType string).'
  name: user_name
  types:
  - <xref:typing.Any>
- description: Password for Windows authentication.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
attributes:
- uid: azure.mgmt.datafactory.types.HdfsLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: 'Anonymous and Windows.

    Type: string (or Expression with resultType string).'
  signature: 'authenticationType: Any'
- uid: azure.mgmt.datafactory.types.HdfsLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.HdfsLinkedServiceTypeProperties.password
  name: password
  summary: Password for Windows authentication.
  signature: 'password: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.HdfsLinkedServiceTypeProperties.url
  name: url
  summary: '50070/webhdfs/v1

    <[http://myhostname:50070/webhdfs/v1](http://myhostname:50070/webhdfs/v1)>`_ .
    Type: string (or Expression with resultType string).

    Required.'
  signature: 'url: Any'
- uid: azure.mgmt.datafactory.types.HdfsLinkedServiceTypeProperties.userName
  name: userName
  summary: string (or Expression with resultType string).
  signature: 'userName: Any'
