### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.QuickBooksLinkedServiceTypeProperties
name: QuickBooksLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.QuickBooksLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: QuickBooks server linked service properties.
constructor:
  syntax: QuickBooksLinkedServiceTypeProperties()
variables:
- description: 'Properties used to connect to QuickBooks. It is mutually exclusive

    with any other properties in the linked service. Type: object.'
  name: connection_properties
  types:
  - <xref:typing.Any>
- description: The endpoint of the QuickBooks server. (i.e. quickbooks.api.intuit.com).
  name: endpoint
  types:
  - <xref:typing.Any>
- description: The company ID of the QuickBooks company to authorize.
  name: company_id
  types:
  - <xref:typing.Any>
- description: The consumer key for OAuth 2.0 authentication.
  name: consumer_key
  types:
  - <xref:typing.Any>
- description: The consumer secret for OAuth 2.0 authentication.
  name: consumer_secret
  types:
  - <xref:<xref:"SecretBase">>
- description: The access token for OAuth 2.0 authentication.
  name: access_token
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The access token secret is deprecated for OAuth 1.0 authentication.

    Only used for version 1.0.'
  name: access_token_secret
  types:
  - <xref:<xref:"SecretBase">>
- description: The refresh token for OAuth 2.0 authentication.
  name: refresh_token
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specifies whether the data source endpoints are encrypted using

    HTTPS. The default value is true. Only used for version 1.0.'
  name: use_encrypted_endpoints
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.QuickBooksLinkedServiceTypeProperties.accessToken
  name: accessToken
  summary: The access token for OAuth 2.0 authentication.
  signature: 'accessToken: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.QuickBooksLinkedServiceTypeProperties.accessTokenSecret
  name: accessTokenSecret
  summary: The access token secret is deprecated for OAuth 1.0 authentication. Only
    used for version 1.0.
  signature: 'accessTokenSecret: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.QuickBooksLinkedServiceTypeProperties.companyId
  name: companyId
  summary: The company ID of the QuickBooks company to authorize.
  signature: 'companyId: Any'
- uid: azure.mgmt.datafactory.types.QuickBooksLinkedServiceTypeProperties.connectionProperties
  name: connectionProperties
  summary: 'Properties used to connect to QuickBooks. It is mutually exclusive with
    any other properties in

    the linked service. Type: object.'
  signature: 'connectionProperties: Any'
- uid: azure.mgmt.datafactory.types.QuickBooksLinkedServiceTypeProperties.consumerKey
  name: consumerKey
  summary: The consumer key for OAuth 2.0 authentication.
  signature: 'consumerKey: Any'
- uid: azure.mgmt.datafactory.types.QuickBooksLinkedServiceTypeProperties.consumerSecret
  name: consumerSecret
  summary: The consumer secret for OAuth 2.0 authentication.
  signature: 'consumerSecret: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.QuickBooksLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.QuickBooksLinkedServiceTypeProperties.endpoint
  name: endpoint
  summary: The endpoint of the QuickBooks server. (i.e. quickbooks.api.intuit.com).
  signature: 'endpoint: Any'
- uid: azure.mgmt.datafactory.types.QuickBooksLinkedServiceTypeProperties.refreshToken
  name: refreshToken
  summary: The refresh token for OAuth 2.0 authentication.
  signature: 'refreshToken: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.QuickBooksLinkedServiceTypeProperties.useEncryptedEndpoints
  name: useEncryptedEndpoints
  summary: 'Specifies whether the data source endpoints are encrypted using HTTPS.
    The default value is

    true. Only used for version 1.0.'
  signature: 'useEncryptedEndpoints: Any'
