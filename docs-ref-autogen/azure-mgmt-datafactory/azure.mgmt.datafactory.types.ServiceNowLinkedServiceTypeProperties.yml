### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.ServiceNowLinkedServiceTypeProperties
name: ServiceNowLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.ServiceNowLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: ServiceNow server linked service properties.
constructor:
  syntax: ServiceNowLinkedServiceTypeProperties()
variables:
- description: 'The endpoint of the ServiceNow server. (i.e. <instance>.service-now.com).

    Required.'
  name: endpoint
  types:
  - <xref:typing.Any>
- description: 'The authentication type to use. Required. Known values are: "Basic"

    and "OAuth2".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServiceNowAuthenticationType">]
- description: 'The user name used to connect to the ServiceNow server for Basic and
    OAuth2

    authentication.'
  name: username
  types:
  - <xref:typing.Any>
- description: 'The password corresponding to the user name for Basic and OAuth2

    authentication.'
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: The client id for OAuth2 authentication.
  name: client_id
  types:
  - <xref:typing.Any>
- description: The client secret for OAuth2 authentication.
  name: client_secret
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specifies whether the data source endpoints are encrypted using

    HTTPS. The default value is true.'
  name: use_encrypted_endpoints
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require the host name in the server''s

    certificate to match the host name of the server when connecting over SSL. The
    default value is

    true.'
  name: use_host_verification
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to verify the identity of the server when

    connecting over SSL. The default value is true.'
  name: use_peer_verification
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.ServiceNowLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: '"Basic" and "OAuth2".'
  signature: 'authenticationType: Required[str | ServiceNowAuthenticationType]'
- uid: azure.mgmt.datafactory.types.ServiceNowLinkedServiceTypeProperties.clientId
  name: clientId
  summary: The client id for OAuth2 authentication.
  signature: 'clientId: Any'
- uid: azure.mgmt.datafactory.types.ServiceNowLinkedServiceTypeProperties.clientSecret
  name: clientSecret
  summary: The client secret for OAuth2 authentication.
  signature: 'clientSecret: SecretBase'
- uid: azure.mgmt.datafactory.types.ServiceNowLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.ServiceNowLinkedServiceTypeProperties.endpoint
  name: endpoint
  summary: The endpoint of the ServiceNow server. (i.e. <instance>.service-now.com).
    Required.
  signature: 'endpoint: Required[Any]'
- uid: azure.mgmt.datafactory.types.ServiceNowLinkedServiceTypeProperties.password
  name: password
  summary: The password corresponding to the user name for Basic and OAuth2 authentication.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.ServiceNowLinkedServiceTypeProperties.useEncryptedEndpoints
  name: useEncryptedEndpoints
  summary: 'Specifies whether the data source endpoints are encrypted using HTTPS.
    The default value is

    true.'
  signature: 'useEncryptedEndpoints: Any'
- uid: azure.mgmt.datafactory.types.ServiceNowLinkedServiceTypeProperties.useHostVerification
  name: useHostVerification
  summary: 'Specifies whether to require the host name in the server''s certificate
    to match the host name

    of the server when connecting over SSL. The default value is true.'
  signature: 'useHostVerification: Any'
- uid: azure.mgmt.datafactory.types.ServiceNowLinkedServiceTypeProperties.usePeerVerification
  name: usePeerVerification
  summary: 'Specifies whether to verify the identity of the server when connecting
    over SSL. The default

    value is true.'
  signature: 'usePeerVerification: Any'
- uid: azure.mgmt.datafactory.types.ServiceNowLinkedServiceTypeProperties.username
  name: username
  summary: The user name used to connect to the ServiceNow server for Basic and OAuth2
    authentication.
  signature: 'username: Any'
