### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.ChainingTrigger
name: ChainingTrigger
fullName: azure.mgmt.datafactory.models.ChainingTrigger
module: azure.mgmt.datafactory.models
summary: 'Trigger that allows the referenced pipeline to depend on other pipeline
  runs based on

  runDimension Name/Value pairs. Upstream pipelines should declare the same runDimension
  Name and

  their runs should have the values for those runDimensions. The referenced pipeline
  run would be

  triggered if the values for the runDimension match for all upstream pipeline runs.'
constructor:
  syntax: 'ChainingTrigger(*args: Any, **kwargs: Any)'
variables:
- description: Trigger description.
  name: description
  types:
  - <xref:str>
- description: 'Indicates if trigger is running or not. Updated when Start/Stop APIs
    are

    called on the Trigger. Known values are: "Started", "Stopped", and "Disabled".'
  name: runtime_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.TriggerRuntimeState>
- description: List of tags that can be used for describing the trigger.
  name: annotations
  types:
  - <xref:list>[<xref:any>]
- description: 'Pipeline for which runs are created when all upstream pipelines complete

    successfully. Required.'
  name: pipeline
  types:
  - <xref:azure.mgmt.datafactory.models.TriggerPipelineReference>
- description: Chaining Trigger properties. Required.
  name: type_properties
  types:
  - <xref:azure.mgmt.datafactory.models.ChainingTriggerTypeProperties>
- description: Trigger type. Required. Default value is "ChainingTrigger".
  name: type
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.models.ChainingTrigger.pipeline
  name: pipeline
  summary: 'Pipeline for which runs are created when all upstream pipelines complete
    successfully.

    Required.'
  signature: 'pipeline: _models.TriggerPipelineReference'
- uid: azure.mgmt.datafactory.models.ChainingTrigger.type
  name: type
  summary: Trigger type. Required. Default value is "ChainingTrigger".
  signature: 'type: Literal[''ChainingTrigger'']'
- uid: azure.mgmt.datafactory.models.ChainingTrigger.type_properties
  name: type_properties
  summary: Chaining Trigger properties. Required.
  signature: 'type_properties: _models.ChainingTriggerTypeProperties'
