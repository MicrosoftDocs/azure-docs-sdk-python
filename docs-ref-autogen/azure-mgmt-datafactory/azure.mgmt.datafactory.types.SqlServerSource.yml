### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.SqlServerSource
name: SqlServerSource
fullName: azure.mgmt.datafactory.types.SqlServerSource
module: azure.mgmt.datafactory.types
summary: A copy activity SQL server source.
constructor:
  syntax: SqlServerSource()
variables:
- description: 'Source retry count. Type: integer (or Expression with resultType

    integer).'
  name: source_retry_count
  types:
  - <xref:typing.Any>
- description: 'Source retry wait. Type: string (or Expression with resultType

    string), pattern: ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: source_retry_wait
  types:
  - <xref:typing.Any>
- description: 'The maximum concurrent connection count for the source data

    store. Type: integer (or Expression with resultType integer).'
  name: max_concurrent_connections
  types:
  - <xref:typing.Any>
- description: 'If true, disable data store metrics collection. Default is

    false. Type: boolean (or Expression with resultType boolean).'
  name: disable_metrics_collection
  types:
  - <xref:typing.Any>
- description: 'Query timeout. Type: string (or Expression with resultType string),

    pattern: ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: query_timeout
  types:
  - <xref:typing.Any>
- description: 'Specifies the additional columns to be added to source data. Type:

    array of objects(AdditionalColumns) (or Expression with resultType array of objects).'
  name: additional_columns
  types:
  - <xref:typing.Any>
- description: 'SQL reader query. Type: string (or Expression with resultType string).'
  name: sql_reader_query
  types:
  - <xref:typing.Any>
- description: 'Name of the stored procedure for a SQL Database source.

    This cannot be used at the same time as SqlReaderQuery. Type: string (or Expression
    with

    resultType string).'
  name: sql_reader_stored_procedure_name
  types:
  - <xref:typing.Any>
- description: 'Value and type setting for stored procedure parameters.

    Example: "{Parameter1: {value: "1", type: "int"}}".'
  name: stored_procedure_parameters
  types:
  - <xref:typing.Any>
- description: 'Specifies the transaction locking behavior for the SQL source. Allowed

    values: ReadCommitted/ReadUncommitted/RepeatableRead/Serializable/Snapshot. The
    default value

    is ReadCommitted. Type: string (or Expression with resultType string).'
  name: isolation_level
  types:
  - <xref:typing.Any>
- description: Which additional types to produce.
  name: produce_additional_types
  types:
  - <xref:typing.Any>
- description: 'The partition mechanism that will be used for Sql read in parallel.

    Possible values include: "None", "PhysicalPartitionsOfTable", "DynamicRange".
    Type: string (or

    Expression with resultType string).'
  name: partition_option
  types:
  - <xref:typing.Any>
- description: The settings that will be leveraged for Sql source partitioning.
  name: partition_settings
  types:
  - <xref:<xref:"SqlPartitionSettings">>
- description: Copy source type. Required. Default value is "SqlServerSource".
  name: type
  types:
  - <xref:typing.Literal>["SqlServerSource"]
attributes:
- uid: azure.mgmt.datafactory.types.SqlServerSource.additionalColumns
  name: additionalColumns
  summary: 'array of

    objects(AdditionalColumns) (or Expression with resultType array of objects).'
  signature: 'additionalColumns: Any'
- uid: azure.mgmt.datafactory.types.SqlServerSource.disableMetricsCollection
  name: disableMetricsCollection
  summary: 'boolean (or Expression

    with resultType boolean).'
  signature: 'disableMetricsCollection: Any'
- uid: azure.mgmt.datafactory.types.SqlServerSource.isolationLevel
  name: isolationLevel
  summary: 'Specifies the transaction locking behavior for the SQL source. Allowed
    values:

    ReadCommitted/ReadUncommitted/RepeatableRead/Serializable/Snapshot. The default
    value is

    ReadCommitted. Type: string (or Expression with resultType string).'
  signature: 'isolationLevel: Any'
- uid: azure.mgmt.datafactory.types.SqlServerSource.maxConcurrentConnections
  name: maxConcurrentConnections
  summary: 'integer (or Expression

    with resultType integer).'
  signature: 'maxConcurrentConnections: Any'
- uid: azure.mgmt.datafactory.types.SqlServerSource.partitionOption
  name: partitionOption
  summary: 'The partition mechanism that will be used for Sql read in parallel. Possible
    values include:

    "None", "PhysicalPartitionsOfTable", "DynamicRange". Type: string (or Expression
    with

    resultType string).'
  signature: 'partitionOption: Any'
- uid: azure.mgmt.datafactory.types.SqlServerSource.partitionSettings
  name: partitionSettings
  summary: The settings that will be leveraged for Sql source partitioning.
  signature: 'partitionSettings: SqlPartitionSettings'
- uid: azure.mgmt.datafactory.types.SqlServerSource.produceAdditionalTypes
  name: produceAdditionalTypes
  summary: Which additional types to produce.
  signature: 'produceAdditionalTypes: Any'
- uid: azure.mgmt.datafactory.types.SqlServerSource.queryTimeout
  name: queryTimeout
  summary: 'string (or Expression with resultType string), pattern:

    ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  signature: 'queryTimeout: Any'
- uid: azure.mgmt.datafactory.types.SqlServerSource.sourceRetryCount
  name: sourceRetryCount
  summary: integer (or Expression with resultType integer).
  signature: 'sourceRetryCount: Any'
- uid: azure.mgmt.datafactory.types.SqlServerSource.sourceRetryWait
  name: sourceRetryWait
  summary: 'string (or Expression with resultType string), pattern:

    ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  signature: 'sourceRetryWait: Any'
- uid: azure.mgmt.datafactory.types.SqlServerSource.sqlReaderQuery
  name: sqlReaderQuery
  summary: string (or Expression with resultType string).
  signature: 'sqlReaderQuery: Any'
- uid: azure.mgmt.datafactory.types.SqlServerSource.sqlReaderStoredProcedureName
  name: sqlReaderStoredProcedureName
  summary: 'Name of the stored procedure for a SQL Database source. This cannot be
    used at the same time as

    SqlReaderQuery. Type: string (or Expression with resultType string).'
  signature: 'sqlReaderStoredProcedureName: Any'
- uid: azure.mgmt.datafactory.types.SqlServerSource.storedProcedureParameters
  name: storedProcedureParameters
  summary: '{value: "1",

    type: "int"}}".'
  signature: 'storedProcedureParameters: Any'
- uid: azure.mgmt.datafactory.types.SqlServerSource.type
  name: type
  summary: Copy source type. Required. Default value is "SqlServerSource".
  signature: 'type: Literal[''SqlServerSource'']'
