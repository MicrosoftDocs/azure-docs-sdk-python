  name: request_interval
  types:
  - <xref:any>
- description: 'Specifies the additional columns to be added to source data. Type:

    key value pairs (value should be string type).'
  name: additional_columns
  types:
  - <xref:any>
- description: Copy source type. Required. Default value is "RestSource".
  name: type
  types:
  - <xref:str>
