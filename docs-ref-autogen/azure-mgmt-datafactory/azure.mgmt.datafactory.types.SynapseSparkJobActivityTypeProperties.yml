  signature: 'scanFolder: Any'
- uid: azure.mgmt.datafactory.types.SynapseSparkJobActivityTypeProperties.sparkConfig
  name: sparkConfig
  summary: Spark configuration property.
  signature: 'sparkConfig: dict[str, Any]'
- uid: azure.mgmt.datafactory.types.SynapseSparkJobActivityTypeProperties.sparkJob
  name: sparkJob
  summary: Synapse spark job reference. Required.
