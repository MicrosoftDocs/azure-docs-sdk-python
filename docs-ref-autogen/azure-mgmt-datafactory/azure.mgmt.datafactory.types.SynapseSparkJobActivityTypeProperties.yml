  signature: 'pythonCodeReference: list[Any]'
- uid: azure.mgmt.datafactory.types.SynapseSparkJobActivityTypeProperties.scanFolder
  name: scanFolder
  summary: 'Scanning subfolders from the root folder of the main definition file,
    these files will be added

    as reference files. The folders named ''jars'', ''pyFiles'', ''files'' or ''archives''
    will be scanned,

    and the folders name are case sensitive. Type: boolean (or Expression with resultType
