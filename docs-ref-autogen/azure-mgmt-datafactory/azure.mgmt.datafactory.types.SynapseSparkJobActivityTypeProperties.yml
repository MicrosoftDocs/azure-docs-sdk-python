    provide.'
  signature: 'files: list[Any]'
- uid: azure.mgmt.datafactory.types.SynapseSparkJobActivityTypeProperties.filesV2
  name: filesV2
  summary: 'Additional files used for reference in the main definition file, which
    will override the ''jars''

    and ''files'' of the spark job definition you provide.'
  signature: 'filesV2: list[Any]'
- uid: azure.mgmt.datafactory.types.SynapseSparkJobActivityTypeProperties.numExecutors
  name: numExecutors
  summary: 'Number of executors to launch for this job, which will override the ''numExecutors''
