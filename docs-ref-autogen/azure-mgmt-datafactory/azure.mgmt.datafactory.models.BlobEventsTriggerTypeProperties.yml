  name: blob_path_begins_with
  summary: 'The blob path must begin with the pattern provided for trigger to fire.
    For example,

    ''/records/blobs/december/'' will only fire the trigger for blobs in the december
    folder under

    the records container. At least one of these must be provided: blobPathBeginsWith,

    blobPathEndsWith.'
  signature: 'blob_path_begins_with: str | None'
- uid: azure.mgmt.datafactory.models.BlobEventsTriggerTypeProperties.blob_path_ends_with
