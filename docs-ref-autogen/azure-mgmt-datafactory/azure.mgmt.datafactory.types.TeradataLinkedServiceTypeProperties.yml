### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties
name: TeradataLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Teradata linked service properties.
constructor:
  syntax: TeradataLinkedServiceTypeProperties()
variables:
- description: 'Teradata ODBC connection string. Type: string, SecureString or

    AzureKeyVaultSecretReference. Only applied for version 1.0.'
  name: connection_string
  types:
  - <xref:typing.Any>
- description: 'Server name for connection. Type: string (or Expression with resultType
    string).'
  name: server
  types:
  - <xref:typing.Any>
- description: 'AuthenticationType to be used for connection. Known values are:

    "Basic" and "Windows".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TeradataAuthenticationType">]
- description: 'Username for authentication. Type: string (or Expression with resultType

    string).'
  name: username
  types:
  - <xref:typing.Any>
- description: Password for authentication.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'SSL mode for connection. Valid values including: "Disable", "Allow",
    "Prefer",

    "Require", "Verify-CA", "Verify-Full". Default value is "Verify-Full". Type: string
    (or

    Expression with resultType string). Only applied for version 2.0.'
  name: ssl_mode
  types:
  - <xref:typing.Any>
- description: 'The port numbers when connecting to server through non HTTPS/TLS

    connections. Type: integer (or Expression with resultType integer). Only used
    for V2. Only

    applied for version 2.0.'
  name: port_number
  types:
  - <xref:typing.Any>
- description: 'The port numbers when connecting to server through HTTPS/TLS

    connections. Type: integer (or Expression with resultType integer). Only applied
    for version

    2.0.'
  name: https_port_number
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to encrypt all communication with the Teradata

    database. Allowed values are 0 or 1. This setting will be ignored for HTTPS/TLS
    connections.

    Type: integer (or Expression with resultType integer). Only applied for version
    2.0.'
  name: use_data_encryption
  types:
  - <xref:typing.Any>
- description: 'The character set to use for the connection. Type: string (or Expression

    with resultType string). Only applied for version 2.0.'
  name: character_set
  types:
  - <xref:typing.Any>
- description: 'The maximum size of the response buffer for SQL requests, in bytes.
    Type:

    integer. Only applied for version 2.0.'
  name: max_resp_size
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: '"Basic" and "Windows".'
  signature: 'authenticationType: str | TeradataAuthenticationType'
- uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties.characterSet
  name: characterSet
  summary: 'string (or Expression with resultType

    string). Only applied for version 2.0.'
  signature: 'characterSet: Any'
- uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties.connectionString
  name: connectionString
  summary: 'string, SecureString or AzureKeyVaultSecretReference.

    Only applied for version 1.0.'
  signature: 'connectionString: Any'
- uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties.httpsPortNumber
  name: httpsPortNumber
  summary: 'integer (or

    Expression with resultType integer). Only applied for version 2.0.'
  signature: 'httpsPortNumber: Any'
- uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties.maxRespSize
  name: maxRespSize
  summary: 'integer. Only applied

    for version 2.0.'
  signature: 'maxRespSize: Any'
- uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties.password
  name: password
  summary: Password for authentication.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties.portNumber
  name: portNumber
  summary: 'integer (or

    Expression with resultType integer). Only used for V2. Only applied for version
    2.0.'
  signature: 'portNumber: Any'
- uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties.server
  name: server
  summary: string (or Expression with resultType string).
  signature: 'server: Any'
- uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties.sslMode
  name: sslMode
  summary: '"Disable", "Allow", "Prefer", "Require",

    "Verify-CA", "Verify-Full". Default value is "Verify-Full". Type: string (or Expression
    with

    resultType string). Only applied for version 2.0.'
  signature: 'sslMode: Any'
- uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties.useDataEncryption
  name: useDataEncryption
  summary: 'Specifies whether to encrypt all communication with the Teradata database.
    Allowed values are 0

    or 1. This setting will be ignored for HTTPS/TLS connections. Type: integer (or
    Expression with

    resultType integer). Only applied for version 2.0.'
  signature: 'useDataEncryption: Any'
- uid: azure.mgmt.datafactory.types.TeradataLinkedServiceTypeProperties.username
  name: username
  summary: string (or Expression with resultType string).
  signature: 'username: Any'
