### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.AmazonS3LinkedServiceTypeProperties
name: AmazonS3LinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.AmazonS3LinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Amazon S3 linked service properties.
constructor:
  syntax: AmazonS3LinkedServiceTypeProperties()
variables:
- description: 'The authentication type of S3. Allowed value: AccessKey (default)
    or

    TemporarySecurityCredentials. Type: string (or Expression with resultType string).'
  name: authentication_type
  types:
  - <xref:typing.Any>
- description: 'The access key identifier of the Amazon S3 Identity and Access Management

    (IAM) user. Type: string (or Expression with resultType string).'
  name: access_key_id
  types:
  - <xref:typing.Any>
- description: 'The secret access key of the Amazon S3 Identity and Access Management

    (IAM) user.'
  name: secret_access_key
  types:
  - <xref:<xref:"SecretBase">>
- description: 'This value specifies the endpoint to access with the S3 Connector.
    This is

    an optional property; change it only if you want to try a different service endpoint
    or want to

    switch between https and http. Type: string (or Expression with resultType string).'
  name: service_url
  types:
  - <xref:typing.Any>
- description: The session token for the S3 temporary security credential.
  name: session_token
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.AmazonS3LinkedServiceTypeProperties.accessKeyId
  name: accessKeyId
  summary: 'The access key identifier of the Amazon S3 Identity and Access Management
    (IAM) user. Type:

    string (or Expression with resultType string).'
  signature: 'accessKeyId: Any'
- uid: azure.mgmt.datafactory.types.AmazonS3LinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: 'AccessKey (default) or

    TemporarySecurityCredentials. Type: string (or Expression with resultType string).'
  signature: 'authenticationType: Any'
- uid: azure.mgmt.datafactory.types.AmazonS3LinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.AmazonS3LinkedServiceTypeProperties.secretAccessKey
  name: secretAccessKey
  summary: The secret access key of the Amazon S3 Identity and Access Management (IAM)
    user.
  signature: 'secretAccessKey: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.AmazonS3LinkedServiceTypeProperties.serviceUrl
  name: serviceUrl
  summary: 'This value specifies the endpoint to access with the S3 Connector. This
    is an optional

    property; change it only if you want to try a different service endpoint or want
    to switch

    between https and http. Type: string (or Expression with resultType string).'
  signature: 'serviceUrl: Any'
- uid: azure.mgmt.datafactory.types.AmazonS3LinkedServiceTypeProperties.sessionToken
  name: sessionToken
  summary: The session token for the S3 temporary security credential.
  signature: 'sessionToken: AzureKeyVaultSecretReference | SecureString'
