### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.TumblingWindowTrigger
name: TumblingWindowTrigger
fullName: azure.mgmt.datafactory.types.TumblingWindowTrigger
module: azure.mgmt.datafactory.types
summary: 'Trigger that schedules pipeline runs for all fixed time interval windows
  from a start time

  without gaps and also supports backfill scenarios (when start time is in the past).'
constructor:
  syntax: TumblingWindowTrigger()
variables:
- description: Trigger description.
  name: description
  types:
  - <xref:str>
- description: 'Indicates if trigger is running or not. Updated when Start/Stop APIs
    are

    called on the Trigger. Known values are: "Started", "Stopped", and "Disabled".'
  name: runtime_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TriggerRuntimeState">]
- description: List of tags that can be used for describing the trigger.
  name: annotations
  types:
  - <xref:list>[<xref:typing.Any>]
- description: 'Pipeline for which runs are created when an event is fired for trigger
    window

    that is ready. Required.'
  name: pipeline
  types:
  - <xref:<xref:"TriggerPipelineReference">>
- description: Tumbling Window Trigger properties. Required.
  name: type_properties
  types:
  - <xref:<xref:"TumblingWindowTriggerTypeProperties">>
- description: Trigger type. Required. Default value is "TumblingWindowTrigger".
  name: type
  types:
  - <xref:typing.Literal>["TumblingWindowTrigger"]
attributes:
- uid: azure.mgmt.datafactory.types.TumblingWindowTrigger.annotations
  name: annotations
  summary: List of tags that can be used for describing the trigger.
  signature: 'annotations: list[Any]'
- uid: azure.mgmt.datafactory.types.TumblingWindowTrigger.description
  name: description
  summary: Trigger description.
  signature: 'description: str'
- uid: azure.mgmt.datafactory.types.TumblingWindowTrigger.pipeline
  name: pipeline
  summary: 'Pipeline for which runs are created when an event is fired for trigger
    window that is ready.

    Required.'
  signature: 'pipeline: Required[TriggerPipelineReference]'
- uid: azure.mgmt.datafactory.types.TumblingWindowTrigger.runtimeState
  name: runtimeState
  summary: 'Indicates if trigger is running or not. Updated when Start/Stop APIs are
    called on the Trigger.

    Known values are: "Started", "Stopped", and "Disabled".'
  signature: 'runtimeState: str | TriggerRuntimeState'
- uid: azure.mgmt.datafactory.types.TumblingWindowTrigger.type
  name: type
  summary: Trigger type. Required. Default value is "TumblingWindowTrigger".
  signature: 'type: Required[Literal[''TumblingWindowTrigger'']]'
- uid: azure.mgmt.datafactory.types.TumblingWindowTrigger.typeProperties
  name: typeProperties
  summary: Tumbling Window Trigger properties. Required.
  signature: 'typeProperties: Required[TumblingWindowTriggerTypeProperties]'
