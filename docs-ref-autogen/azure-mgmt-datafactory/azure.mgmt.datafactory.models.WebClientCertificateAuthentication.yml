### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.WebClientCertificateAuthentication
name: WebClientCertificateAuthentication
fullName: azure.mgmt.datafactory.models.WebClientCertificateAuthentication
module: azure.mgmt.datafactory.models
summary: 'A WebLinkedService that uses client certificate based authentication to
  communicate with an

  HTTP endpoint. This scheme follows mutual authentication; the server must also provide
  valid

  credentials to the client.'
constructor:
  syntax: 'WebClientCertificateAuthentication(*args: Any, **kwargs: Any)'
variables:
- description: 'The URL of the web service endpoint, e.g. [https://www.microsoft.com](https://www.microsoft.com)
    . Type: string (or Expression with resultType string). Required.'
  name: url
  types:
  - <xref:any>
- description: Base64-encoded contents of a PFX file. Required.
  name: pfx
  types:
  - <xref:azure.mgmt.datafactory.models.SecretBase>
- description: Password for the PFX file. Required.
  name: password
  types:
  - <xref:azure.mgmt.datafactory.models.SecretBase>
- description: 'Type of authentication used to connect to the web table source.

    Required. ClientCertificate.'
  name: authentication_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.CLIENT_CERTIFICATE>
attributes:
- uid: azure.mgmt.datafactory.models.WebClientCertificateAuthentication.authentication_type
  name: authentication_type
  summary: Type of authentication used to connect to the web table source. Required.
    ClientCertificate.
  signature: 'authentication_type: CLIENT_CERTIFICATE: ''ClientCertificate''>]'
- uid: azure.mgmt.datafactory.models.WebClientCertificateAuthentication.password
  name: password
  summary: Password for the PFX file. Required.
  signature: 'password: _models.SecretBase'
- uid: azure.mgmt.datafactory.models.WebClientCertificateAuthentication.pfx
  name: pfx
  summary: Base64-encoded contents of a PFX file. Required.
  signature: 'pfx: _models.SecretBase'
