### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.WebBasicAuthentication
name: WebBasicAuthentication
fullName: azure.mgmt.datafactory.types.WebBasicAuthentication
module: azure.mgmt.datafactory.types
summary: A WebLinkedService that uses basic authentication to communicate with an
  HTTP endpoint.
constructor:
  syntax: WebBasicAuthentication()
variables:
- description: 'The URL of the web service endpoint, e.g. [https://www.microsoft.com](https://www.microsoft.com)
    . Type: string (or Expression with resultType string). Required.'
  name: url
  types:
  - <xref:typing.Any>
- description: 'User name for Basic authentication. Type: string (or Expression with
    resultType

    string). Required.'
  name: username
  types:
  - <xref:typing.Any>
- description: The password for Basic authentication. Required.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Type of authentication used to connect to the web table source.

    Required. Basic.'
  name: authentication_type
  types:
  - <xref:typing.Literal>[WebAuthenticationType.BASIC]
attributes:
- uid: azure.mgmt.datafactory.types.WebBasicAuthentication.authenticationType
  name: authenticationType
  summary: Type of authentication used to connect to the web table source. Required.
    Basic.
  signature: 'authenticationType: BASIC: ''Basic''>]'
- uid: azure.mgmt.datafactory.types.WebBasicAuthentication.password
  name: password
  summary: The password for Basic authentication. Required.
  signature: 'password: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.WebBasicAuthentication.url
  name: url
  summary: '//www.microsoft.com

    <[https://www.microsoft.com](https://www.microsoft.com)>`_ . Type: string (or
    Expression with resultType string). Required.'
  signature: 'url: Any'
- uid: azure.mgmt.datafactory.types.WebBasicAuthentication.username
  name: username
  summary: 'string (or Expression with resultType string).

    Required.'
  signature: 'username: Any'
