### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.WebClientCertificateAuthentication
name: WebClientCertificateAuthentication
fullName: azure.mgmt.datafactory.types.WebClientCertificateAuthentication
module: azure.mgmt.datafactory.types
summary: 'A WebLinkedService that uses client certificate based authentication to
  communicate with an

  HTTP endpoint. This scheme follows mutual authentication; the server must also provide
  valid

  credentials to the client.'
constructor:
  syntax: WebClientCertificateAuthentication()
variables:
- description: 'The URL of the web service endpoint, e.g. [https://www.microsoft.com](https://www.microsoft.com)
    . Type: string (or Expression with resultType string). Required.'
  name: url
  types:
  - <xref:typing.Any>
- description: Base64-encoded contents of a PFX file. Required.
  name: pfx
  types:
  - <xref:<xref:"SecretBase">>
- description: Password for the PFX file. Required.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Type of authentication used to connect to the web table source.

    Required. ClientCertificate.'
  name: authentication_type
  types:
  - <xref:typing.Literal>[WebAuthenticationType.CLIENT_CERTIFICATE]
attributes:
- uid: azure.mgmt.datafactory.types.WebClientCertificateAuthentication.authenticationType
  name: authenticationType
  summary: Type of authentication used to connect to the web table source. Required.
    ClientCertificate.
  signature: 'authenticationType: CLIENT_CERTIFICATE: ''ClientCertificate''>]'
- uid: azure.mgmt.datafactory.types.WebClientCertificateAuthentication.password
  name: password
  summary: Password for the PFX file. Required.
  signature: 'password: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.WebClientCertificateAuthentication.pfx
  name: pfx
  summary: Base64-encoded contents of a PFX file. Required.
  signature: 'pfx: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.WebClientCertificateAuthentication.url
  name: url
  summary: '//www.microsoft.com

    <[https://www.microsoft.com](https://www.microsoft.com)>`_ . Type: string (or
    Expression with resultType string). Required.'
  signature: 'url: Any'
