### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.RedshiftUnloadSettings
name: RedshiftUnloadSettings
fullName: azure.mgmt.datafactory.types.RedshiftUnloadSettings
module: azure.mgmt.datafactory.types
summary: 'The Amazon S3 settings needed for the interim Amazon S3 when copying from
  Amazon Redshift with

  unload. With this, data from Amazon Redshift source will be unloaded into S3 first
  and then

  copied into the targeted sink from the interim S3.'
constructor:
  syntax: RedshiftUnloadSettings()
variables:
- description: 'The name of the Amazon S3 linked service which will be used for

    the unload operation when copying from the Amazon Redshift source. Required.'
  name: s3_linked_service_name
  types:
  - <xref:<xref:"LinkedServiceReference">>
- description: 'The bucket of the interim Amazon S3 which will be used to store the
    unloaded

    data from Amazon Redshift source. The bucket must be in the same region as the
    Amazon Redshift

    source. Type: string (or Expression with resultType string). Required.'
  name: bucket_name
  types:
  - <xref:typing.Any>
attributes:
- uid: azure.mgmt.datafactory.types.RedshiftUnloadSettings.bucketName
  name: bucketName
  summary: 'The bucket of the interim Amazon S3 which will be used to store the unloaded
    data from Amazon

    Redshift source. The bucket must be in the same region as the Amazon Redshift
    source. Type:

    string (or Expression with resultType string). Required.'
  signature: 'bucketName: Any'
- uid: azure.mgmt.datafactory.types.RedshiftUnloadSettings.s3LinkedServiceName
  name: s3LinkedServiceName
  summary: 'The name of the Amazon S3 linked service which will be used for the unload
    operation when

    copying from the Amazon Redshift source. Required.'
  signature: 's3LinkedServiceName: LinkedServiceReference'
