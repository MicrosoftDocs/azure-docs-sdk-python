  AzureBlobFSWriteSettings, AzureBlobStorageWriteSettings, AzureDataLakeStoreWriteSettings,

  AzureFileStorageWriteSettings, FileServerWriteSettings, LakeHouseWriteSettings,

  SftpWriteSettings'
