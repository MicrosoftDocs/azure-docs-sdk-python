### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.GreenplumLinkedServiceTypeProperties
name: GreenplumLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.GreenplumLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Greenplum Database linked service properties.
constructor:
  syntax: GreenplumLinkedServiceTypeProperties()
variables:
- description: 'An ODBC connection string. Type: string, SecureString or

    AzureKeyVaultSecretReference.'
  name: connection_string
  types:
  - <xref:typing.Any>
- description: The Azure key vault secret reference of password in connection string.
  name: pwd
  types:
  - <xref:<xref:"AzureKeyVaultSecretReference">>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: 'The authentication type to use. Type: string. Only used for V2.

    "Basic"'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GreenplumAuthenticationType">]
- description: 'Host name for connection. Type: string. Only used for V2.'
  name: host
  types:
  - <xref:typing.Any>
- description: 'The port for the connection. Type: integer. Only used for V2.'
  name: port
  types:
  - <xref:typing.Any>
- description: 'Username for authentication. Type: string. Only used for V2.'
  name: username
  types:
  - <xref:typing.Any>
- description: 'Database name for connection. Type: string. Only used for V2.'
  name: database
  types:
  - <xref:typing.Any>
- description: 'SSL mode for connection. Type: integer. 0: disable, 1:allow, 2: prefer,
    3:

    require, 4: verify-ca, 5: verify-full. Type: integer. Only used for V2.'
  name: ssl_mode
  types:
  - <xref:typing.Any>
- description: 'The time to wait (in seconds) while trying to establish a connection

    before terminating the attempt and generating an error. Type: integer. Only used
    for V2.'
  name: connection_timeout
  types:
  - <xref:typing.Any>
- description: 'The time to wait (in seconds) while trying to execute a command before

    terminating the attempt and generating an error. Set to zero for infinity. Type:
    integer. Only

    used for V2.'
  name: command_timeout
  types:
  - <xref:typing.Any>
attributes:
