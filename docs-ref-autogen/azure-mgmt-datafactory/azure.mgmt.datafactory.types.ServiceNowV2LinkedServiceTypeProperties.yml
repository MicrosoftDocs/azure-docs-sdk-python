### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.ServiceNowV2LinkedServiceTypeProperties
name: ServiceNowV2LinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.ServiceNowV2LinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: ServiceNowV2 server linked service properties.
constructor:
  syntax: ServiceNowV2LinkedServiceTypeProperties()
variables:
- description: 'The endpoint of the ServiceNowV2 server. (i.e. <instance>.service-now.com).

    Required.'
  name: endpoint
  types:
  - <xref:typing.Any>
- description: 'The authentication type to use. Required. Known values are: "Basic"

    and "OAuth2".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ServiceNowV2AuthenticationType">]
- description: 'The user name used to connect to the ServiceNowV2 server for Basic
    and OAuth2

    authentication.'
  name: username
  types:
  - <xref:typing.Any>
- description: 'The password corresponding to the user name for Basic and OAuth2

    authentication.'
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: The client id for OAuth2 authentication.
  name: client_id
  types:
  - <xref:typing.Any>
- description: The client secret for OAuth2 authentication.
  name: client_secret
  types:
  - <xref:<xref:"SecretBase">>
- description: GrantType for OAuth2 authentication. Default value is password.
  name: grant_type
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.ServiceNowV2LinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: '"Basic" and "OAuth2".'
  signature: 'authenticationType: Required[str | ServiceNowV2AuthenticationType]'
- uid: azure.mgmt.datafactory.types.ServiceNowV2LinkedServiceTypeProperties.clientId
  name: clientId
  summary: The client id for OAuth2 authentication.
  signature: 'clientId: Any'
- uid: azure.mgmt.datafactory.types.ServiceNowV2LinkedServiceTypeProperties.clientSecret
  name: clientSecret
  summary: The client secret for OAuth2 authentication.
  signature: 'clientSecret: SecretBase'
- uid: azure.mgmt.datafactory.types.ServiceNowV2LinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.ServiceNowV2LinkedServiceTypeProperties.endpoint
  name: endpoint
  summary: The endpoint of the ServiceNowV2 server. (i.e. <instance>.service-now.com).
    Required.
  signature: 'endpoint: Required[Any]'
- uid: azure.mgmt.datafactory.types.ServiceNowV2LinkedServiceTypeProperties.grantType
  name: grantType
  summary: GrantType for OAuth2 authentication. Default value is password.
  signature: 'grantType: Any'
- uid: azure.mgmt.datafactory.types.ServiceNowV2LinkedServiceTypeProperties.password
  name: password
  summary: The password corresponding to the user name for Basic and OAuth2 authentication.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.ServiceNowV2LinkedServiceTypeProperties.username
  name: username
  summary: The user name used to connect to the ServiceNowV2 server for Basic and
    OAuth2 authentication.
  signature: 'username: Any'
