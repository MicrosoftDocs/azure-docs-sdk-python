### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.UntilActivity
name: UntilActivity
fullName: azure.mgmt.datafactory.models.UntilActivity
module: azure.mgmt.datafactory.models
summary: 'This activity executes inner activities until the specified boolean expression
  results to true

  or timeout is reached, whichever is earlier.'
constructor:
  syntax: 'UntilActivity(*args: Any, **kwargs: Any)'
variables:
- description: Activity name. Required.
  name: name
  types:
  - <xref:str>
- description: Activity description.
  name: description
  types:
  - <xref:str>
- description: 'Activity state. This is an optional property and if not provided,
    the state will

    be Active by default. Known values are: "Active" and "Inactive".'
  name: state
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.ActivityState>
- description: 'Status result of the activity when the state is set to Inactive.

    This is an optional property and if not provided when the activity is inactive,
    the status will

    be Succeeded by default. Known values are: "Succeeded", "Failed", and "Skipped".'
  name: on_inactive_mark_as
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.ActivityOnInactiveMarkAs>
- description: Activity depends on condition.
  name: depends_on
  types:
  - <xref:list>[<xref:azure.mgmt.datafactory.models.ActivityDependency>]
- description: Activity user properties.
  name: user_properties
  types:
  - <xref:list>[<xref:azure.mgmt.datafactory.models.UserProperty>]
- description: Until activity properties. Required.
  name: type_properties
  types:
  - <xref:azure.mgmt.datafactory.models.UntilActivityTypeProperties>
- description: Type of activity. Required. Default value is "Until".
  name: type
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.models.UntilActivity.type
  name: type
  summary: Type of activity. Required. Default value is "Until".
  signature: 'type: Literal[''Until'']'
- uid: azure.mgmt.datafactory.models.UntilActivity.type_properties
  name: type_properties
  summary: Until activity properties. Required.
  signature: 'type_properties: _models.UntilActivityTypeProperties'
