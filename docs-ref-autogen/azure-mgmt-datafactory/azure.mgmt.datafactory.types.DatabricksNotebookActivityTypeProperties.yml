  name: baseParameters
  summary: 'Base parameters to be used for each run of this job.If the notebook takes
    a parameter that is

    not specified, the default value from the notebook will be used.'
  signature: 'baseParameters: dict[str, Any]'
- uid: azure.mgmt.datafactory.types.DatabricksNotebookActivityTypeProperties.libraries
  name: libraries
  summary: A list of libraries to be installed on the cluster that will execute the
    job.
  signature: 'libraries: list[dict[str, Any]]'
