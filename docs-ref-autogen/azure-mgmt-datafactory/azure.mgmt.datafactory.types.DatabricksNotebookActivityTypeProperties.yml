uid: azure.mgmt.datafactory.types.DatabricksNotebookActivityTypeProperties
name: DatabricksNotebookActivityTypeProperties
fullName: azure.mgmt.datafactory.types.DatabricksNotebookActivityTypeProperties
module: azure.mgmt.datafactory.types
summary: Databricks Notebook activity properties.
constructor:
  syntax: DatabricksNotebookActivityTypeProperties()
variables:
- description: 'The absolute path of the notebook to be run in the Databricks Workspace.

    This path must begin with a slash. Type: string (or Expression with resultType
    string).

    Required.'
  name: notebook_path
  types:
  - <xref:typing.Any>
- description: 'Base parameters to be used for each run of this job.If the notebook

    takes a parameter that is not specified, the default value from the notebook will
    be used.'
  name: base_parameters
  types:
  - <xref:dict>[<xref:str>, <xref:typing.Any>]
- description: A list of libraries to be installed on the cluster that will execute
    the job.
  name: libraries
  types:
  - <xref:list>[<xref:dict>[<xref:str>, <xref:typing.Any>]]
attributes:
