### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.MariaDBLinkedServiceTypeProperties
name: MariaDBLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.models.MariaDBLinkedServiceTypeProperties
module: azure.mgmt.datafactory.models
summary: MariaDB server linked service properties.
constructor:
  syntax: 'MariaDBLinkedServiceTypeProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The version of the MariaDB driver. Type: string. V1 or empty for legacy

    driver, V2 for new driver. V1 can support connection string and property bag,
    V2 can only

    support connection string. The legacy driver is scheduled for deprecation by October
    2024.'
  name: driver_version
  types:
  - <xref:any>
- description: 'An ODBC connection string. Type: string, SecureString or

    AzureKeyVaultSecretReference.'
  name: connection_string
  types:
  - <xref:any>
- description: 'Server name for connection. Type: string.'
  name: server
  types:
  - <xref:any>
- description: 'The port for the connection. Type: integer.'
  name: port
  types:
  - <xref:any>
- description: 'Username for authentication. Type: string.'
  name: username
  types:
  - <xref:any>
- description: 'Database name for connection. Type: string.'
  name: database
  types:
  - <xref:any>
- description: 'This option specifies whether the driver uses TLS encryption and verification

    when connecting to MariaDB. E.g., SSLMode=<0/1/2/3/4>. Options: DISABLED (0) /
    PREFERRED (1)

    (Default) / REQUIRED (2) / VERIFY_CA (3) / VERIFY_IDENTITY (4), REQUIRED (2) is
    recommended to

    only allow connections encrypted with SSL/TLS.'
  name: ssl_mode
  types:
  - <xref:any>
- description: 'This option specifies whether to use a CA certificate from the

    system trust store, or from a specified PEM file. E.g. UseSystemTrustStore=<0/1>;
    Options:

    Enabled (1) / Disabled (0) (Default).'
  name: use_system_trust_store
  types:
  - <xref:any>
- description: The Azure key vault secret reference of password in connection string.
  name: password
  types:
  - <xref:azure.mgmt.datafactory.models.AzureKeyVaultSecretReference>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
