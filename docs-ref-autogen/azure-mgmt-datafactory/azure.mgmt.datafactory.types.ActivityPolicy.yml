### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.ActivityPolicy
name: ActivityPolicy
fullName: azure.mgmt.datafactory.types.ActivityPolicy
module: azure.mgmt.datafactory.types
summary: Execution policy for an activity.
constructor:
  syntax: ActivityPolicy()
variables:
- description: 'Specifies the timeout for the activity to run. The default timeout
    is 7 days.

    Type: string (or Expression with resultType string), pattern:

    ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  name: timeout
  types:
  - <xref:typing.Any>
- description: 'Maximum ordinary retry attempts. Default is 0. Type: integer (or Expression
    with

    resultType integer), minimum: 0.'
  name: retry
  types:
  - <xref:typing.Any>
- description: 'Interval between each retry attempt (in seconds). The default

    is 30 sec.'
  name: retry_interval_in_seconds
  types:
  - <xref:int>
- description: 'When set to true, Input from activity is considered as secure and
    will not

    be logged to monitoring.'
  name: secure_input
  types:
  - <xref:bool>
- description: 'When set to true, Output from activity is considered as secure and
    will

    not be logged to monitoring.'
  name: secure_output
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.datafactory.types.ActivityPolicy.retry
  name: retry
  summary: 'integer (or Expression with resultType

    integer), minimum: 0.'
  signature: 'retry: Any'
- uid: azure.mgmt.datafactory.types.ActivityPolicy.retryIntervalInSeconds
  name: retryIntervalInSeconds
  summary: Interval between each retry attempt (in seconds). The default is 30 sec.
  signature: 'retryIntervalInSeconds: int'
- uid: azure.mgmt.datafactory.types.ActivityPolicy.secureInput
  name: secureInput
  summary: 'When set to true, Input from activity is considered as secure and will
    not be logged to

    monitoring.'
  signature: 'secureInput: bool'
- uid: azure.mgmt.datafactory.types.ActivityPolicy.secureOutput
  name: secureOutput
  summary: 'When set to true, Output from activity is considered as secure and will
    not be logged to

    monitoring.'
  signature: 'secureOutput: bool'
- uid: azure.mgmt.datafactory.types.ActivityPolicy.timeout
  name: timeout
  summary: 'string (or

    Expression with resultType string), pattern:

    ((d+).)?(dd):(60|([0-5][0-9])):(60|([0-5][0-9])).'
  signature: 'timeout: Any'
