### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties
name: MySqlLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: MySQL linked service properties.
constructor:
  syntax: MySqlLinkedServiceTypeProperties()
variables:
- description: 'The version of the MySQL driver. Type: string. V1 or empty for legacy

    driver, V2 for new driver. V1 can support connection string and property bag,
    V2 can only

    support connection string.'
  name: driver_version
  types:
  - <xref:typing.Any>
- description: 'The connection string. Type: string, SecureString or

    AzureKeyVaultSecretReference.'
  name: connection_string
  types:
  - <xref:typing.Any>
- description: 'Server name for connection. Type: string.'
  name: server
  types:
  - <xref:typing.Any>
- description: 'The port for the connection. Type: integer.'
  name: port
  types:
  - <xref:typing.Any>
- description: 'Username for authentication. Type: string.'
  name: username
  types:
  - <xref:typing.Any>
- description: 'Database name for connection. Type: string.'
  name: database
  types:
  - <xref:typing.Any>
- description: 'SSL mode for connection. Type: integer. 0: disable, 1: prefer, 2:
    require, 3:

    verify-ca, 4: verify-full.'
  name: ssl_mode
  types:
  - <xref:typing.Any>
- description: 'Use system trust store for connection. Type: integer. 0: enable,

    1: disable.'
  name: use_system_trust_store
  types:
  - <xref:typing.Any>
- description: The Azure key vault secret reference of password in connection string.
  name: password
  types:
  - <xref:<xref:"AzureKeyVaultSecretReference">>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: 'This allows the special "zero" date value 0000-00-00 to be

    retrieved from the database. Type: boolean.'
  name: allow_zero_date_time
  types:
  - <xref:typing.Any>
- description: 'The length of time (in seconds) to wait for a connection to the

    server before terminating the attempt and generating an error. Type: integer.'
  name: connection_timeout
  types:
  - <xref:typing.Any>
- description: 'True to return DateTime.MinValue for date or datetime columns

    that have disallowed values. Type: boolean.'
  name: convert_zero_date_time
  types:
  - <xref:typing.Any>
- description: 'Determines which column type (if any) should be read as a GUID. Type:

    string. None: No column types are automatically read as a Guid; Char36: All CHAR(36)
    columns

    are read/written as a Guid using lowercase hex with hyphens, which matches UUID.'
  name: guid_format
  types:
  - <xref:typing.Any>
- description: 'The path to the client''s SSL certificate file in PEM format. SslKey
    must also

    be specified. Type: string.'
  name: ssl_cert
  types:
  - <xref:typing.Any>
- description: 'The path to the client''s SSL private key in PEM format. SslCert must
    also be

    specified. Type: string.'
  name: ssl_key
  types:
  - <xref:typing.Any>
- description: 'When set to true, TINYINT(1) values are returned as booleans.

    Type: bool.'
  name: treat_tiny_as_boolean
  types:
  - <xref:typing.Any>
attributes:
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.allowZeroDateTime
  name: allowZeroDateTime
  summary: 'This allows the special "zero" date value 0000-00-00 to be retrieved from
    the database. Type:

    boolean.'
  signature: 'allowZeroDateTime: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.connectionString
  name: connectionString
  summary: string, SecureString or AzureKeyVaultSecretReference.
  signature: 'connectionString: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.connectionTimeout
  name: connectionTimeout
  summary: 'The length of time (in seconds) to wait for a connection to the server
    before terminating the

    attempt and generating an error. Type: integer.'
  signature: 'connectionTimeout: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.convertZeroDateTime
  name: convertZeroDateTime
  summary: 'True to return DateTime.MinValue for date or datetime columns that have
    disallowed values.

    Type: boolean.'
  signature: 'convertZeroDateTime: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.database
  name: database
  summary: string.
  signature: 'database: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.driverVersion
  name: driverVersion
  summary: 'string. V1 or empty for legacy driver, V2 for new

    driver. V1 can support connection string and property bag, V2 can only support
    connection

    string.'
  signature: 'driverVersion: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.guidFormat
  name: guidFormat
  summary: 'No column

    types are automatically read as a Guid; Char36: All CHAR(36) columns are read/written
    as a Guid

    using lowercase hex with hyphens, which matches UUID.'
  signature: 'guidFormat: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.password
  name: password
  summary: The Azure key vault secret reference of password in connection string.
  signature: 'password: AzureKeyVaultSecretReference'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.port
  name: port
  summary: integer.
  signature: 'port: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.server
  name: server
  summary: string.
  signature: 'server: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.sslCert
  name: sslCert
  summary: 'The path to the client''s SSL certificate file in PEM format. SslKey must
    also be specified.

    Type: string.'
  signature: 'sslCert: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.sslKey
  name: sslKey
  summary: 'The path to the client''s SSL private key in PEM format. SslCert must
    also be specified. Type:

    string.'
  signature: 'sslKey: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.sslMode
  name: sslMode
  summary: 'disable, 1: prefer, 2: require, 3: verify-ca, 4:

    verify-full.'
  signature: 'sslMode: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.treatTinyAsBoolean
  name: treatTinyAsBoolean
  summary: bool.
  signature: 'treatTinyAsBoolean: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.useSystemTrustStore
  name: useSystemTrustStore
  summary: 'enable, 1: disable.'
  signature: 'useSystemTrustStore: Any'
- uid: azure.mgmt.datafactory.types.MySqlLinkedServiceTypeProperties.username
  name: username
  summary: string.
  signature: 'username: Any'
