  name: servicePrincipalId
  summary: 'The ID of the service principal used to authenticate against the ARM-based

    updateResourceEndpoint of an Azure ML Studio web service. Type: string (or Expression
    with

    resultType string).'
  signature: 'servicePrincipalId: Any'
