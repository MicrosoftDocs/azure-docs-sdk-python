### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.AzureMLLinkedServiceTypeProperties
name: AzureMLLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.AzureMLLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Azure ML Studio Web Service linked service properties.
constructor:
  syntax: AzureMLLinkedServiceTypeProperties()
variables:
- description: 'The Batch Execution REST URL for an Azure ML Studio Web Service endpoint.

    Type: string (or Expression with resultType string). Required.'
  name: ml_endpoint
  types:
  - <xref:typing.Any>
- description: The API key for accessing the Azure ML model endpoint. Required.
  name: api_key
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The Update Resource REST URL for an Azure ML Studio Web Service

    endpoint. Type: string (or Expression with resultType string).'
  name: update_resource_endpoint
  types:
  - <xref:typing.Any>
- description: 'The ID of the service principal used to authenticate against the

    ARM-based updateResourceEndpoint of an Azure ML Studio web service. Type: string
    (or Expression

    with resultType string).'
  name: service_principal_id
  types:
  - <xref:typing.Any>
- description: 'The key of the service principal used to authenticate against the

    ARM-based updateResourceEndpoint of an Azure ML Studio web service.'
  name: service_principal_key
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The name or ID of the tenant to which the service principal belongs.
    Type: string

    (or Expression with resultType string).'
  name: tenant
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: 'Type of authentication (Required to specify MSI) used to connect to

    AzureML. Type: string (or Expression with resultType string).'
  name: authentication
  types:
  - <xref:typing.Any>
attributes:
- uid: azure.mgmt.datafactory.types.AzureMLLinkedServiceTypeProperties.apiKey
  name: apiKey
  summary: The API key for accessing the Azure ML model endpoint. Required.
  signature: 'apiKey: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.AzureMLLinkedServiceTypeProperties.authentication
  name: authentication
  summary: 'string (or

    Expression with resultType string).'
  signature: 'authentication: Any'
- uid: azure.mgmt.datafactory.types.AzureMLLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.AzureMLLinkedServiceTypeProperties.mlEndpoint
  name: mlEndpoint
  summary: 'string (or

    Expression with resultType string). Required.'
  signature: 'mlEndpoint: Any'
