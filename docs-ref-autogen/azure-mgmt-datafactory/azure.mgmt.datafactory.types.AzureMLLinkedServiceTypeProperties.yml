  name: tenant
  summary: 'string (or

    Expression with resultType string).'
  signature: 'tenant: Any'
- uid: azure.mgmt.datafactory.types.AzureMLLinkedServiceTypeProperties.updateResourceEndpoint
  name: updateResourceEndpoint
  summary: 'string (or

    Expression with resultType string).'
  signature: 'updateResourceEndpoint: Any'
