  name: servicePrincipalKey
  summary: 'The key of the service principal used to authenticate against the ARM-based

    updateResourceEndpoint of an Azure ML Studio web service.'
  signature: 'servicePrincipalKey: AzureKeyVaultSecretReference | SecureString'
