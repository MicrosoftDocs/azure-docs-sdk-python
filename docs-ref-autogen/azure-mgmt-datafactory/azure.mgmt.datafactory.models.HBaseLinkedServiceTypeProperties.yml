### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties
name: HBaseLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties
module: azure.mgmt.datafactory.models
summary: HBase server linked service properties.
constructor:
  syntax: 'HBaseLinkedServiceTypeProperties(*args: Any, **kwargs: Any)'
variables:
- description: The IP address or host name of the HBase server. (i.e. 192.168.222.160).
    Required.
  name: host
  types:
  - <xref:any>
- description: 'The TCP port that the HBase instance uses to listen for client connections.
    The

    default value is 9090.'
  name: port
  types:
  - <xref:any>
- description: 'The partial URL corresponding to the HBase server. (i.e.

    /gateway/sandbox/hbase/version).'
  name: http_path
  types:
  - <xref:any>
- description: 'The authentication mechanism to use to connect to the HBase server.

    Required. Known values are: "Anonymous" and "Basic".'
  name: authentication_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.HBaseAuthenticationType>
- description: The user name used to connect to the HBase instance.
  name: username
  types:
  - <xref:any>
- description: The password corresponding to the user name.
  name: password
  types:
  - <xref:azure.mgmt.datafactory.models.SecretBase>
- description: 'Specifies whether the connections to the server are encrypted using
    SSL. The

    default value is false.'
  name: enable_ssl
  types:
  - <xref:any>
- description: 'The full path of the .pem file containing trusted CA certificates
    for

    verifying the server when connecting over SSL. This property can only be set when
    using SSL on

    self-hosted IR. The default value is the cacerts.pem file installed with the IR.'
  name: trusted_cert_path
  types:
  - <xref:any>
- description: 'Specifies whether to require a CA-issued SSL certificate

    name to match the host name of the server when connecting over SSL. The default
    value is false.'
  name: allow_host_name_cn_mismatch
  types:
  - <xref:any>
- description: 'Specifies whether to allow self-signed certificates from

    the server. The default value is false.'
  name: allow_self_signed_server_cert
  types:
  - <xref:any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties.allow_host_name_cn_mismatch
  name: allow_host_name_cn_mismatch
  summary: 'Specifies whether to require a CA-issued SSL certificate name to match
    the host name of the

    server when connecting over SSL. The default value is false.'
  signature: 'allow_host_name_cn_mismatch: Any | None'
- uid: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties.allow_self_signed_server_cert
  name: allow_self_signed_server_cert
  summary: 'Specifies whether to allow self-signed certificates from the server. The
    default value is

    false.'
  signature: 'allow_self_signed_server_cert: Any | None'
- uid: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties.authentication_type
  name: authentication_type
  summary: 'The authentication mechanism to use to connect to the HBase server. Required.
    Known values are:

    "Anonymous" and "Basic".'
  signature: 'authentication_type: str | _models.HBaseAuthenticationType'
- uid: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties.enable_ssl
  name: enable_ssl
  summary: 'Specifies whether the connections to the server are encrypted using SSL.
    The default value is

    false.'
  signature: 'enable_ssl: Any | None'
- uid: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties.encrypted_credential
  name: encrypted_credential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encrypted_credential: str | None'
- uid: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties.host
  name: host
  summary: The IP address or host name of the HBase server. (i.e. 192.168.222.160).
    Required.
  signature: 'host: Any'
- uid: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties.http_path
  name: http_path
  summary: The partial URL corresponding to the HBase server. (i.e. /gateway/sandbox/hbase/version).
  signature: 'http_path: Any | None'
- uid: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties.password
  name: password
  summary: The password corresponding to the user name.
  signature: 'password: _models.SecretBase | None'
- uid: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties.port
  name: port
  summary: 'The TCP port that the HBase instance uses to listen for client connections.
    The default value

    is 9090.'
  signature: 'port: Any | None'
- uid: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties.trusted_cert_path
  name: trusted_cert_path
  summary: 'The full path of the .pem file containing trusted CA certificates for
    verifying the server when

    connecting over SSL. This property can only be set when using SSL on self-hosted
    IR. The

    default value is the cacerts.pem file installed with the IR.'
  signature: 'trusted_cert_path: Any | None'
- uid: azure.mgmt.datafactory.models.HBaseLinkedServiceTypeProperties.username
  name: username
  summary: The user name used to connect to the HBase instance.
  signature: 'username: Any | None'
