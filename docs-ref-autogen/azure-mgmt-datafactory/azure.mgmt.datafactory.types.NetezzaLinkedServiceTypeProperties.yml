    prefer unsecured, allow fallback to secured connection if required. OnlyUnSecured
    : strictly

    unsecured, no fallback. Known values are: "PreferredUnSecured" and "OnlyUnSecured".'
  signature: 'securityLevel: str | NetezzaSecurityLevelType'
