### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.NetezzaLinkedServiceTypeProperties
name: NetezzaLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.NetezzaLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Netezza linked service properties.
constructor:
  syntax: NetezzaLinkedServiceTypeProperties()
variables:
- description: 'An ODBC connection string. Type: string, SecureString or

    AzureKeyVaultSecretReference.'
  name: connection_string
  types:
  - <xref:typing.Any>
- description: 'Server name for connection. Type: string.'
  name: server
  types:
  - <xref:typing.Any>
- description: 'The port for the connection. Type: integer.'
  name: port
  types:
  - <xref:typing.Any>
- description: 'Username for authentication. Type: string.'
  name: uid
  types:
  - <xref:typing.Any>
- description: 'Database name for connection. Type: string.'
  name: database
  types:
  - <xref:typing.Any>
- description: 'Specifies the security level for the driver connection to the data
    store.

    PreferredUnSecured : prefer unsecured, allow fallback to secured connection if
    required.

    OnlyUnSecured : strictly unsecured, no fallback. Known values are: "PreferredUnSecured"
    and

    "OnlyUnSecured".'
  name: security_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetezzaSecurityLevelType">]
- description: The Azure key vault secret reference of password in connection string.
  name: pwd
  types:
  - <xref:<xref:"AzureKeyVaultSecretReference">>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.NetezzaLinkedServiceTypeProperties.connectionString
  name: connectionString
  summary: string, SecureString or AzureKeyVaultSecretReference.
  signature: 'connectionString: Any'
- uid: azure.mgmt.datafactory.types.NetezzaLinkedServiceTypeProperties.database
  name: database
  summary: string.
  signature: 'database: Any'
