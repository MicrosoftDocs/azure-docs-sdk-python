### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.IntegrationRuntimeDataFlowProperties
name: IntegrationRuntimeDataFlowProperties
fullName: azure.mgmt.datafactory.types.IntegrationRuntimeDataFlowProperties
module: azure.mgmt.datafactory.types
summary: Data flow properties for managed integration runtime.
constructor:
  syntax: IntegrationRuntimeDataFlowProperties()
variables:
- description: 'Compute type of the cluster which will execute data flow job. Known
    values

    are: "General", "MemoryOptimized", and "ComputeOptimized".'
  name: compute_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataFlowComputeType">]
- description: 'Core count of the cluster which will execute data flow job. Supported
    values

    are: 8, 16, 32, 48, 80, 144 and 272.'
  name: core_count
  types:
  - <xref:int>
- description: 'Time to live (in minutes) setting of the cluster which will execute
    data

    flow job.'
  name: time_to_live
  types:
  - <xref:int>
- description: 'Cluster will not be recycled and it will be used in next data flow
    activity run

    until TTL (time to live) is reached if this is set as false. Default is true.'
  name: cleanup
  types:
  - <xref:bool>
- description: Custom properties are used to tune the data flow runtime performance.
  name: custom_properties
  types:
  - <xref:list>[<xref:"IntegrationRuntimeDataFlowPropertiesCustomPropertiesItem">]
attributes:
- uid: azure.mgmt.datafactory.types.IntegrationRuntimeDataFlowProperties.cleanup
  name: cleanup
  summary: 'Cluster will not be recycled and it will be used in next data flow activity
    run until TTL (time

    to live) is reached if this is set as false. Default is true.'
  signature: 'cleanup: bool'
- uid: azure.mgmt.datafactory.types.IntegrationRuntimeDataFlowProperties.computeType
  name: computeType
  summary: '"General",

    "MemoryOptimized", and "ComputeOptimized".'
  signature: 'computeType: str | DataFlowComputeType'
- uid: azure.mgmt.datafactory.types.IntegrationRuntimeDataFlowProperties.coreCount
  name: coreCount
  summary: '8, 16, 32,

    48, 80, 144 and 272.'
  signature: 'coreCount: int'
- uid: azure.mgmt.datafactory.types.IntegrationRuntimeDataFlowProperties.customProperties
  name: customProperties
  summary: Custom properties are used to tune the data flow runtime performance.
  signature: 'customProperties: list[''IntegrationRuntimeDataFlowPropertiesCustomPropertiesItem'']'
- uid: azure.mgmt.datafactory.types.IntegrationRuntimeDataFlowProperties.timeToLive
  name: timeToLive
  summary: Time to live (in minutes) setting of the cluster which will execute data
    flow job.
  signature: 'timeToLive: int'
