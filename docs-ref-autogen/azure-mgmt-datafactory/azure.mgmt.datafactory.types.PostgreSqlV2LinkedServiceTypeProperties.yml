uid: azure.mgmt.datafactory.types.PostgreSqlV2LinkedServiceTypeProperties
name: PostgreSqlV2LinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.PostgreSqlV2LinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: PostgreSqlV2 linked service properties.
constructor:
  syntax: PostgreSqlV2LinkedServiceTypeProperties()
variables:
- description: 'Server name for connection. Type: string. Required.'
  name: server
  types:
  - <xref:typing.Any>
- description: 'The port for the connection. Type: integer.'
  name: port
  types:
  - <xref:typing.Any>
- description: 'Username for authentication. Type: string. Required.'
  name: username
  types:
  - <xref:typing.Any>
- description: 'Database name for connection. Type: string. Required.'
  name: database
  types:
  - <xref:typing.Any>
- description: 'The authentication type to use. Type: string. Required.'
  name: authentication_type
  types:
  - <xref:typing.Any>
- description: 'SSL mode for connection. Type: integer. 0: disable, 1:allow, 2: prefer,
    3:

    require, 4: verify-ca, 5: verify-full. Type: integer. Required.'
  name: ssl_mode
  types:
  - <xref:typing.Any>
- description: 'Sets the schema search path. Type: string.'
  name: schema
  types:
  - <xref:typing.Any>
- description: 'Whether connection pooling should be used. Type: boolean.'
  name: pooling
  types:
  - <xref:typing.Any>
- description: 'The time to wait (in seconds) while trying to establish a connection

    before terminating the attempt and generating an error. Type: integer.'
  name: connection_timeout
  types:
  - <xref:typing.Any>
- description: 'The time to wait (in seconds) while trying to execute a command before

    terminating the attempt and generating an error. Set to zero for infinity. Type:
    integer.'
  name: command_timeout
  types:
  - <xref:typing.Any>
- description: 'Whether to trust the server certificate without validating it.

    Type: boolean.'
  name: trust_server_certificate
  types:
  - <xref:typing.Any>
- description: 'Location of a client certificate to be sent to the server. Type: string.'
  name: ssl_certificate
  types:
  - <xref:typing.Any>
- description: 'Location of a client key for a client certificate to be sent to the
    server.

    Type: string.'
  name: ssl_key
  types:
  - <xref:typing.Any>
- description: 'Password for a key for a client certificate. Type: string.'
  name: ssl_password
  types:
  - <xref:typing.Any>
- description: 'Determines the size of the internal buffer uses when reading.

    Increasing may improve performance if transferring large values from the database.
    Type:

    integer.'
  name: read_buffer_size
  types:
  - <xref:typing.Any>
- description: 'When enabled, parameter values are logged when commands are executed.

    Type: boolean.'
  name: log_parameters
  types:
  - <xref:typing.Any>
- description: 'Gets or sets the session timezone. Type: string.'
  name: timezone
  types:
  - <xref:typing.Any>
- description: 'Gets or sets the .NET encoding that will be used to encode/decode
    PostgreSQL

    string data. Type: string.'
  name: encoding
  types:
  - <xref:typing.Any>
- description: 'The Azure key vault secret reference of password in connection string.
    Type:

    string.'
  name: password
  types:
  - <xref:<xref:"AzureKeyVaultSecretReference">>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
