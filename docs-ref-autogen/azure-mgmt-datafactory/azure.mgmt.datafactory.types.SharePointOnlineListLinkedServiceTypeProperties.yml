### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.SharePointOnlineListLinkedServiceTypeProperties
name: SharePointOnlineListLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.SharePointOnlineListLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: SharePoint Online List linked service properties.
constructor:
  syntax: SharePointOnlineListLinkedServiceTypeProperties()
variables:
- description: 'The URL of the SharePoint Online site. For example,

    [https://contoso.sharepoint.com/sites/siteName](https://contoso.sharepoint.com/sites/siteName).
    Type: string (or Expression with resultType

    string). Required.'
  name: site_url
  types:
  - <xref:typing.Any>
- description: 'The tenant ID under which your application resides. You can find it
    from Azure

    portal Active Directory overview page. Type: string (or Expression with resultType
    string).

    Required.'
  name: tenant_id
  types:
  - <xref:typing.Any>
- description: 'The application (client) ID of your application registered in Azure

    Active Directory. Make sure to grant SharePoint site permission to this application.
    Type:

    string (or Expression with resultType string). Required.'
  name: service_principal_id
  types:
  - <xref:typing.Any>
- description: 'The client secret of your application registered in Azure Active

    Directory. Type: string (or Expression with resultType string).'
  name: service_principal_key
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The service principal credential type to use in

    Server-To-Server authentication. ''ServicePrincipalKey'' for key/secret, ''ServicePrincipalCert''

    for certificate. Type: string (or Expression with resultType string).'
  name: service_principal_credential_type
  types:
  - <xref:typing.Any>
- description: 'Specify the base64 encoded certificate of your

    application registered in Azure Active Directory. Type: string (or Expression
    with resultType

    string).'
  name: service_principal_embedded_cert
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specify the password of your certificate if

    your certificate has a password and you are using AadServicePrincipal authentication.
    Type:

    string (or Expression with resultType string).'
  name: service_principal_embedded_cert_password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.SharePointOnlineListLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.SharePointOnlineListLinkedServiceTypeProperties.servicePrincipalCredentialType
  name: servicePrincipalCredentialType
  summary: 'The service principal credential type to use in Server-To-Server authentication.

    ''ServicePrincipalKey'' for key/secret, ''ServicePrincipalCert'' for certificate.
    Type: string (or

    Expression with resultType string).'
  signature: 'servicePrincipalCredentialType: Any'
- uid: azure.mgmt.datafactory.types.SharePointOnlineListLinkedServiceTypeProperties.servicePrincipalEmbeddedCert
  name: servicePrincipalEmbeddedCert
  summary: 'Specify the base64 encoded certificate of your application registered
    in Azure Active

    Directory. Type: string (or Expression with resultType string).'
  signature: 'servicePrincipalEmbeddedCert: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.SharePointOnlineListLinkedServiceTypeProperties.servicePrincipalEmbeddedCertPassword
  name: servicePrincipalEmbeddedCertPassword
  summary: 'Specify the password of your certificate if your certificate has a password
    and you are using

    AadServicePrincipal authentication. Type: string (or Expression with resultType
    string).'
  signature: 'servicePrincipalEmbeddedCertPassword: AzureKeyVaultSecretReference |
    SecureString'
- uid: azure.mgmt.datafactory.types.SharePointOnlineListLinkedServiceTypeProperties.servicePrincipalId
  name: servicePrincipalId
  summary: 'The application (client) ID of your application registered in Azure Active
    Directory. Make sure

    to grant SharePoint site permission to this application. Type: string (or Expression
    with

    resultType string). Required.'
  signature: 'servicePrincipalId: Any'
- uid: azure.mgmt.datafactory.types.SharePointOnlineListLinkedServiceTypeProperties.servicePrincipalKey
  name: servicePrincipalKey
  summary: 'string (or

    Expression with resultType string).'
  signature: 'servicePrincipalKey: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.SharePointOnlineListLinkedServiceTypeProperties.siteUrl
  name: siteUrl
  summary: 'The URL of the SharePoint Online site. For example,

    [https://contoso.sharepoint.com/sites/siteName](https://contoso.sharepoint.com/sites/siteName).
    Type: string (or Expression with resultType

    string). Required.'
  signature: 'siteUrl: Any'
- uid: azure.mgmt.datafactory.types.SharePointOnlineListLinkedServiceTypeProperties.tenantId
  name: tenantId
  summary: 'The tenant ID under which your application resides. You can find it from
    Azure portal Active

    Directory overview page. Type: string (or Expression with resultType string).
    Required.'
  signature: 'tenantId: Any'
