uid: azure.mgmt.datafactory.models.SetVariableActivity
name: SetVariableActivity
fullName: azure.mgmt.datafactory.models.SetVariableActivity
module: azure.mgmt.datafactory.models
summary: Set value for a Variable.
constructor:
  syntax: 'SetVariableActivity(*args: Any, **kwargs: Any)'
variables:
