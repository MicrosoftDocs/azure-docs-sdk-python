### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.LakeHouseLinkedServiceTypeProperties
name: LakeHouseLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.LakeHouseLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Microsoft Fabric Lakehouse linked service properties.
constructor:
  syntax: LakeHouseLinkedServiceTypeProperties()
variables:
- description: 'The ID of Microsoft Fabric workspace. Type: string (or Expression
    with

    resultType string).'
  name: workspace_id
  types:
  - <xref:typing.Any>
- description: 'The ID of Microsoft Fabric Lakehouse artifact. Type: string (or Expression

    with resultType string).'
  name: artifact_id
  types:
  - <xref:typing.Any>
- description: 'The authentication type to use. Known values are:

    "ServicePrincipal", "SystemAssignedManagedIdentity", and "UserAssignedManagedIdentity".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LakehouseAuthenticationType">]
- description: 'The ID of the application used to authenticate against Microsoft

    Fabric Lakehouse. Type: string (or Expression with resultType string).'
  name: service_principal_id
  types:
  - <xref:typing.Any>
- description: 'The Key of the application used to authenticate against Microsoft

    Fabric Lakehouse.'
  name: service_principal_key
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The name or ID of the tenant to which the service principal belongs.
    Type: string

    (or Expression with resultType string).'
  name: tenant
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: 'The service principal credential type to use in

    Server-To-Server authentication. ''ServicePrincipalKey'' for key/secret, ''ServicePrincipalCert''

    for certificate. Type: string (or Expression with resultType string).'
  name: service_principal_credential_type
  types:
  - <xref:typing.Any>
- description: 'The credential of the service principal object in Azure

    Active Directory. If servicePrincipalCredentialType is ''ServicePrincipalKey'',

    servicePrincipalCredential can be SecureString or AzureKeyVaultSecretReference.
    If

    servicePrincipalCredentialType is ''ServicePrincipalCert'', servicePrincipalCredential
    can only

    be AzureKeyVaultSecretReference.'
  name: service_principal_credential
  types:
  - <xref:<xref:"SecretBase">>
- description: The credential reference containing authentication information.
  name: credential
  types:
  - <xref:<xref:"CredentialReference">>
attributes:
- uid: azure.mgmt.datafactory.types.LakeHouseLinkedServiceTypeProperties.artifactId
  name: artifactId
  summary: 'string (or Expression with resultType

    string).'
  signature: 'artifactId: Any'
- uid: azure.mgmt.datafactory.types.LakeHouseLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: '"ServicePrincipal",

    "SystemAssignedManagedIdentity", and "UserAssignedManagedIdentity".'
  signature: 'authenticationType: str | LakehouseAuthenticationType'
- uid: azure.mgmt.datafactory.types.LakeHouseLinkedServiceTypeProperties.credential
  name: credential
  summary: The credential reference containing authentication information.
  signature: 'credential: CredentialReference'
- uid: azure.mgmt.datafactory.types.LakeHouseLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.LakeHouseLinkedServiceTypeProperties.servicePrincipalCredential
  name: servicePrincipalCredential
  summary: 'The credential of the service principal object in Azure Active Directory.
    If

    servicePrincipalCredentialType is ''ServicePrincipalKey'', servicePrincipalCredential
    can be

    SecureString or AzureKeyVaultSecretReference. If servicePrincipalCredentialType
    is

    ''ServicePrincipalCert'', servicePrincipalCredential can only be AzureKeyVaultSecretReference.'
  signature: 'servicePrincipalCredential: SecretBase'
- uid: azure.mgmt.datafactory.types.LakeHouseLinkedServiceTypeProperties.servicePrincipalCredentialType
  name: servicePrincipalCredentialType
  summary: 'The service principal credential type to use in Server-To-Server authentication.

    ''ServicePrincipalKey'' for key/secret, ''ServicePrincipalCert'' for certificate.
    Type: string (or

    Expression with resultType string).'
  signature: 'servicePrincipalCredentialType: Any'
- uid: azure.mgmt.datafactory.types.LakeHouseLinkedServiceTypeProperties.servicePrincipalId
  name: servicePrincipalId
  summary: 'string

    (or Expression with resultType string).'
  signature: 'servicePrincipalId: Any'
- uid: azure.mgmt.datafactory.types.LakeHouseLinkedServiceTypeProperties.servicePrincipalKey
  name: servicePrincipalKey
  summary: The Key of the application used to authenticate against Microsoft Fabric
    Lakehouse.
  signature: 'servicePrincipalKey: SecretBase'
- uid: azure.mgmt.datafactory.types.LakeHouseLinkedServiceTypeProperties.tenant
  name: tenant
  summary: 'string (or

    Expression with resultType string).'
  signature: 'tenant: Any'
- uid: azure.mgmt.datafactory.types.LakeHouseLinkedServiceTypeProperties.workspaceId
  name: workspaceId
  summary: string (or Expression with resultType string).
  signature: 'workspaceId: Any'
