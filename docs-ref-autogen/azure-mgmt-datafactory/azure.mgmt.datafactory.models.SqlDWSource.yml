  name: partition_option
  summary: 'The partition mechanism that will be used for Sql read in parallel. Possible
    values include:

    "None", "PhysicalPartitionsOfTable", "DynamicRange". Type: string (or Expression
    with

    resultType string).'
  signature: 'partition_option: Any | None'
- uid: azure.mgmt.datafactory.models.SqlDWSource.partition_settings
  name: partition_settings
  summary: The settings that will be leveraged for Sql source partitioning.
  signature: 'partition_settings: _models.SqlPartitionSettings | None'
- uid: azure.mgmt.datafactory.models.SqlDWSource.sql_reader_query
  name: sql_reader_query
  summary: string (or Expression with resultType string).
  signature: 'sql_reader_query: Any | None'
- uid: azure.mgmt.datafactory.models.SqlDWSource.sql_reader_stored_procedure_name
  name: sql_reader_stored_procedure_name
  summary: 'Name of the stored procedure for a SQL Data Warehouse source. This cannot
    be used at the same

    time as SqlReaderQuery. Type: string (or Expression with resultType string).'
  signature: 'sql_reader_stored_procedure_name: Any | None'
- uid: azure.mgmt.datafactory.models.SqlDWSource.stored_procedure_parameters
  name: stored_procedure_parameters
  summary: '{value: "1",

    type: "int"}}". Type: object (or Expression with resultType object), itemType:

    StoredProcedureParameter.'
  signature: 'stored_procedure_parameters: Any | None'
- uid: azure.mgmt.datafactory.models.SqlDWSource.type
  name: type
  summary: Copy source type. Required. Default value is "SqlDWSource".
  signature: 'type: Literal[''SqlDWSource'']'
