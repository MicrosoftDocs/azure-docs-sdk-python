### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties
name: HiveLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Hive Server linked service properties.
constructor:
  syntax: HiveLinkedServiceTypeProperties()
variables:
- description: 'IP address or host name of the Hive server, separated by '';'' for
    multiple hosts

    (only when serviceDiscoveryMode is enable). Required.'
  name: host
  types:
  - <xref:typing.Any>
- description: The TCP port that the Hive server uses to listen for client connections.
  name: port
  types:
  - <xref:typing.Any>
- description: 'The type of Hive server. Known values are: "HiveServer1", "HiveServer2",
    and

    "HiveThriftServer".'
  name: server_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HiveServerType">]
- description: 'The transport protocol to use in the Thrift layer. Known

    values are: "Binary", "SASL", and "HTTP ".'
  name: thrift_transport_protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HiveThriftTransportProtocol">]
- description: 'The authentication method used to access the Hive server. Required.

    Known values are: "Anonymous", "Username", "UsernameAndPassword", and

    "WindowsAzureHDInsightService".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HiveAuthenticationType">]
- description: true to indicate using the ZooKeeper service, false not.
  name: service_discovery_mode
  types:
  - <xref:typing.Any>
- description: 'The namespace on ZooKeeper under which Hive Server 2 nodes are

    added.'
  name: zoo_keeper_name_space
  types:
  - <xref:typing.Any>
- description: 'Specifies whether the driver uses native HiveQL queries,or converts

    them into an equivalent form in HiveQL.'
  name: use_native_query
  types:
  - <xref:typing.Any>
- description: The user name that you use to access Hive Server.
  name: username
  types:
  - <xref:typing.Any>
- description: 'The password corresponding to the user name that you provided in the
    Username

    field.'
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: The partial URL corresponding to the Hive server.
  name: http_path
  types:
  - <xref:typing.Any>
- description: 'Specifies whether the connections to the server are encrypted using
    SSL. The

    default value is false.'
  name: enable_ssl
  types:
  - <xref:typing.Any>
- description: 'Specifies whether the connections to the server

    will validate server certificate, the default value is True. Only used for Version
    2.0.'
  name: enable_server_certificate_validation
  types:
  - <xref:typing.Any>
- description: 'The full path of the .pem file containing trusted CA certificates
    for

    verifying the server when connecting over SSL. This property can only be set when
    using SSL on

    self-hosted IR. The default value is the cacerts.pem file installed with the IR.'
  name: trusted_cert_path
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to use a CA certificate from the system trust

    store or from a specified PEM file. The default value is false.'
  name: use_system_trust_store
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require a CA-issued SSL certificate

    name to match the host name of the server when connecting over SSL. The default
    value is false.'
  name: allow_host_name_cn_mismatch
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to allow self-signed certificates from

    the server. The default value is false.'
  name: allow_self_signed_server_cert
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.allowHostNameCNMismatch
  name: allowHostNameCNMismatch
  summary: 'Specifies whether to require a CA-issued SSL certificate name to match
    the host name of the

    server when connecting over SSL. The default value is false.'
  signature: 'allowHostNameCNMismatch: Any'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.allowSelfSignedServerCert
  name: allowSelfSignedServerCert
  summary: 'Specifies whether to allow self-signed certificates from the server. The
    default value is

    false.'
  signature: 'allowSelfSignedServerCert: Any'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: 'The authentication method used to access the Hive server. Required. Known
    values are:

    "Anonymous", "Username", "UsernameAndPassword", and "WindowsAzureHDInsightService".'
  signature: 'authenticationType: Required[str | HiveAuthenticationType]'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.enableServerCertificateValidation
  name: enableServerCertificateValidation
  summary: 'Specifies whether the connections to the server will validate server certificate,
    the default

    value is True. Only used for Version 2.0.'
  signature: 'enableServerCertificateValidation: Any'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.enableSsl
  name: enableSsl
  summary: 'Specifies whether the connections to the server are encrypted using SSL.
    The default value is

    false.'
  signature: 'enableSsl: Any'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.host
  name: host
  summary: 'IP address or host name of the Hive server, separated by '';'' for multiple
    hosts (only when

    serviceDiscoveryMode is enable). Required.'
  signature: 'host: Required[Any]'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.httpPath
  name: httpPath
  summary: The partial URL corresponding to the Hive server.
  signature: 'httpPath: Any'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.password
  name: password
  summary: The password corresponding to the user name that you provided in the Username
    field.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.port
  name: port
  summary: The TCP port that the Hive server uses to listen for client connections.
  signature: 'port: Any'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.serverType
  name: serverType
  summary: '"HiveServer1", "HiveServer2", and

    "HiveThriftServer".'
  signature: 'serverType: str | HiveServerType'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.serviceDiscoveryMode
  name: serviceDiscoveryMode
  summary: true to indicate using the ZooKeeper service, false not.
  signature: 'serviceDiscoveryMode: Any'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.thriftTransportProtocol
  name: thriftTransportProtocol
  summary: '"Binary", "SASL", and

    "HTTP ".'
  signature: 'thriftTransportProtocol: str | HiveThriftTransportProtocol'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.trustedCertPath
  name: trustedCertPath
  summary: 'The full path of the .pem file containing trusted CA certificates for
    verifying the server when

    connecting over SSL. This property can only be set when using SSL on self-hosted
    IR. The

    default value is the cacerts.pem file installed with the IR.'
  signature: 'trustedCertPath: Any'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.useNativeQuery
  name: useNativeQuery
  summary: 'Specifies whether the driver uses native HiveQL queries,or converts them
    into an equivalent

    form in HiveQL.'
  signature: 'useNativeQuery: Any'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.useSystemTrustStore
  name: useSystemTrustStore
  summary: 'Specifies whether to use a CA certificate from the system trust store
    or from a specified PEM

    file. The default value is false.'
  signature: 'useSystemTrustStore: Any'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.username
  name: username
  summary: The user name that you use to access Hive Server.
  signature: 'username: Any'
- uid: azure.mgmt.datafactory.types.HiveLinkedServiceTypeProperties.zooKeeperNameSpace
  name: zooKeeperNameSpace
  summary: The namespace on ZooKeeper under which Hive Server 2 nodes are added.
  signature: 'zooKeeperNameSpace: Any'
