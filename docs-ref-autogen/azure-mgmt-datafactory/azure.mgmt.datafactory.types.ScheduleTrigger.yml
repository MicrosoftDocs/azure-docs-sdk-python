uid: azure.mgmt.datafactory.types.ScheduleTrigger
name: ScheduleTrigger
fullName: azure.mgmt.datafactory.types.ScheduleTrigger
module: azure.mgmt.datafactory.types
summary: Trigger that creates pipeline runs periodically, on schedule.
constructor:
  syntax: ScheduleTrigger()
variables:
- description: Trigger description.
  name: description
  types:
  - <xref:str>
- description: 'Indicates if trigger is running or not. Updated when Start/Stop APIs
    are

    called on the Trigger. Known values are: "Started", "Stopped", and "Disabled".'
  name: runtime_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TriggerRuntimeState">]
- description: List of tags that can be used for describing the trigger.
  name: annotations
  types:
  - <xref:list>[<xref:typing.Any>]
- description: Pipelines that need to be started.
  name: pipelines
  types:
  - <xref:list>[<xref:"TriggerPipelineReference">]
- description: Schedule Trigger properties. Required.
  name: type_properties
  types:
  - <xref:<xref:"ScheduleTriggerTypeProperties">>
- description: Trigger type. Required. Default value is "ScheduleTrigger".
  name: type
  types:
  - <xref:typing.Literal>["ScheduleTrigger"]
attributes:
- uid: azure.mgmt.datafactory.types.ScheduleTrigger.annotations
  name: annotations
  summary: List of tags that can be used for describing the trigger.
  signature: 'annotations: list[Any]'
- uid: azure.mgmt.datafactory.types.ScheduleTrigger.description
  name: description
  summary: Trigger description.
  signature: 'description: str'
- uid: azure.mgmt.datafactory.types.ScheduleTrigger.pipelines
  name: pipelines
  summary: Pipelines that need to be started.
  signature: 'pipelines: list[''TriggerPipelineReference'']'
