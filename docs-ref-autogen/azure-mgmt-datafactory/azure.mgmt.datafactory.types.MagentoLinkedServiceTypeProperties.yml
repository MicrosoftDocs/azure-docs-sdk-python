### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.MagentoLinkedServiceTypeProperties
name: MagentoLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.MagentoLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Magento server linked service properties.
constructor:
  syntax: MagentoLinkedServiceTypeProperties()
variables:
- description: The URL of the Magento instance. (i.e. 192.168.222.110/magento3). Required.
  name: host
  types:
  - <xref:typing.Any>
- description: The access token from Magento.
  name: access_token
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specifies whether the data source endpoints are encrypted using

    HTTPS. The default value is true.'
  name: use_encrypted_endpoints
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require the host name in the server''s

    certificate to match the host name of the server when connecting over SSL. The
    default value is

    true.'
  name: use_host_verification
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to verify the identity of the server when

    connecting over SSL. The default value is true.'
  name: use_peer_verification
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.MagentoLinkedServiceTypeProperties.accessToken
  name: accessToken
  summary: The access token from Magento.
  signature: 'accessToken: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.MagentoLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.MagentoLinkedServiceTypeProperties.host
  name: host
  summary: The URL of the Magento instance. (i.e. 192.168.222.110/magento3). Required.
  signature: 'host: Any'
- uid: azure.mgmt.datafactory.types.MagentoLinkedServiceTypeProperties.useEncryptedEndpoints
  name: useEncryptedEndpoints
  summary: 'Specifies whether the data source endpoints are encrypted using HTTPS.
    The default value is

    true.'
  signature: 'useEncryptedEndpoints: Any'
- uid: azure.mgmt.datafactory.types.MagentoLinkedServiceTypeProperties.useHostVerification
  name: useHostVerification
  summary: 'Specifies whether to require the host name in the server''s certificate
    to match the host name

    of the server when connecting over SSL. The default value is true.'
  signature: 'useHostVerification: Any'
- uid: azure.mgmt.datafactory.types.MagentoLinkedServiceTypeProperties.usePeerVerification
  name: usePeerVerification
  summary: 'Specifies whether to verify the identity of the server when connecting
    over SSL. The default

    value is true.'
  signature: 'usePeerVerification: Any'
