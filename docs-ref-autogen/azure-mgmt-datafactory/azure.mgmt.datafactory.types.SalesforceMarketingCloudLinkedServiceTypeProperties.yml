### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.SalesforceMarketingCloudLinkedServiceTypeProperties
name: SalesforceMarketingCloudLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.SalesforceMarketingCloudLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Salesforce Marketing Cloud linked service properties.
constructor:
  syntax: SalesforceMarketingCloudLinkedServiceTypeProperties()
variables:
- description: 'Properties used to connect to Salesforce Marketing Cloud. It is

    mutually exclusive with any other properties in the linked service. Type: object.'
  name: connection_properties
  types:
  - <xref:typing.Any>
- description: 'The client ID associated with the Salesforce Marketing Cloud application.

    Type: string (or Expression with resultType string).'
  name: client_id
  types:
  - <xref:typing.Any>
- description: 'The client secret associated with the Salesforce Marketing Cloud

    application. Type: string (or Expression with resultType string).'
  name: client_secret
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specifies whether the data source endpoints are encrypted using

    HTTPS. The default value is true. Type: boolean (or Expression with resultType
    boolean).'
  name: use_encrypted_endpoints
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require the host name in the server''s

    certificate to match the host name of the server when connecting over SSL. The
    default value is

    true. Type: boolean (or Expression with resultType boolean).'
  name: use_host_verification
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to verify the identity of the server when

    connecting over SSL. The default value is true. Type: boolean (or Expression with
    resultType

    boolean).'
  name: use_peer_verification
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.SalesforceMarketingCloudLinkedServiceTypeProperties.clientId
  name: clientId
  summary: 'string (or

    Expression with resultType string).'
  signature: 'clientId: Any'
- uid: azure.mgmt.datafactory.types.SalesforceMarketingCloudLinkedServiceTypeProperties.clientSecret
  name: clientSecret
  summary: 'string (or

    Expression with resultType string).'
  signature: 'clientSecret: AzureKeyVaultSecretReference | SecureString'
- uid: azure.mgmt.datafactory.types.SalesforceMarketingCloudLinkedServiceTypeProperties.connectionProperties
  name: connectionProperties
  summary: 'Properties used to connect to Salesforce Marketing Cloud. It is mutually
    exclusive with any

    other properties in the linked service. Type: object.'
  signature: 'connectionProperties: Any'
- uid: azure.mgmt.datafactory.types.SalesforceMarketingCloudLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.SalesforceMarketingCloudLinkedServiceTypeProperties.useEncryptedEndpoints
  name: useEncryptedEndpoints
  summary: 'Specifies whether the data source endpoints are encrypted using HTTPS.
    The default value is

    true. Type: boolean (or Expression with resultType boolean).'
  signature: 'useEncryptedEndpoints: Any'
- uid: azure.mgmt.datafactory.types.SalesforceMarketingCloudLinkedServiceTypeProperties.useHostVerification
  name: useHostVerification
  summary: 'Specifies whether to require the host name in the server''s certificate
    to match the host name

    of the server when connecting over SSL. The default value is true. Type: boolean
    (or Expression

    with resultType boolean).'
  signature: 'useHostVerification: Any'
- uid: azure.mgmt.datafactory.types.SalesforceMarketingCloudLinkedServiceTypeProperties.usePeerVerification
  name: usePeerVerification
  summary: 'Specifies whether to verify the identity of the server when connecting
    over SSL. The default

    value is true. Type: boolean (or Expression with resultType boolean).'
  signature: 'usePeerVerification: Any'
