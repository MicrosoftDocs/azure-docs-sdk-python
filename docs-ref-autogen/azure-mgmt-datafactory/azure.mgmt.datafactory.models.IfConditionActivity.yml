uid: azure.mgmt.datafactory.models.IfConditionActivity
name: IfConditionActivity
fullName: azure.mgmt.datafactory.models.IfConditionActivity
module: azure.mgmt.datafactory.models
summary: 'This activity evaluates a boolean expression and executes either the activities
  under the

  ifTrueActivities property or the ifFalseActivities property depending on the result
  of the

  expression.'
constructor:
  syntax: 'IfConditionActivity(*args: Any, **kwargs: Any)'
variables:
- description: Activity name. Required.
  name: name
  types:
  - <xref:str>
- description: Activity description.
  name: description
  types:
  - <xref:str>
- description: 'Activity state. This is an optional property and if not provided,
    the state will

    be Active by default. Known values are: "Active" and "Inactive".'
  name: state
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.ActivityState>
- description: 'Status result of the activity when the state is set to Inactive.

    This is an optional property and if not provided when the activity is inactive,
    the status will

    be Succeeded by default. Known values are: "Succeeded", "Failed", and "Skipped".'
  name: on_inactive_mark_as
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.ActivityOnInactiveMarkAs>
- description: Activity depends on condition.
  name: depends_on
  types:
  - <xref:list>[<xref:azure.mgmt.datafactory.models.ActivityDependency>]
- description: Activity user properties.
  name: user_properties
  types:
  - <xref:list>[<xref:azure.mgmt.datafactory.models.UserProperty>]
- description: IfCondition activity properties. Required.
  name: type_properties
  types:
  - <xref:azure.mgmt.datafactory.models.IfConditionActivityTypeProperties>
- description: Type of activity. Required. Default value is "IfCondition".
  name: type
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.models.IfConditionActivity.type
  name: type
  summary: Type of activity. Required. Default value is "IfCondition".
  signature: 'type: Literal[''IfCondition'']'
- uid: azure.mgmt.datafactory.models.IfConditionActivity.type_properties
  name: type_properties
  summary: IfCondition activity properties. Required.
  signature: 'type_properties: _models.IfConditionActivityTypeProperties'
