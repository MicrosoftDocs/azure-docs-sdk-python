### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.ChangeDataCapture
name: ChangeDataCapture
fullName: azure.mgmt.datafactory.types.ChangeDataCapture
module: azure.mgmt.datafactory.types
summary: 'A Azure Data Factory object which automatically detects data changes at
  the source and then

  sends the updated data to the destination.'
constructor:
  syntax: ChangeDataCapture()
variables:
- description: 'The folder that this CDC is in. If not specified, CDC will appear
    at the root

    level.'
  name: folder
  types:
  - <xref:<xref:"ChangeDataCaptureFolder">>
- description: The description of the change data capture.
  name: description
  types:
  - <xref:str>
- description: 'List of sources connections that can be used as sources in the

    CDC. Required.'
  name: source_connections_info
  types:
  - <xref:list>[<xref:"MapperSourceConnectionsInfo">]
- description: 'List of target connections that can be used as sources in the

    CDC. Required.'
  name: target_connections_info
  types:
  - <xref:list>[<xref:"MapperTargetConnectionsInfo">]
- description: CDC policy. Required.
  name: policy
  types:
  - <xref:<xref:"MapperPolicy">>
- description: 'A boolean to determine if the vnet configuration needs to be

    overwritten.'
  name: allow_v_net_override
  types:
  - <xref:bool>
- description: Status of the CDC as to if it is running or stopped.
  name: status
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.ChangeDataCapture.allowVNetOverride
  name: allowVNetOverride
  summary: A boolean to determine if the vnet configuration needs to be overwritten.
  signature: 'allowVNetOverride: bool'
- uid: azure.mgmt.datafactory.types.ChangeDataCapture.description
  name: description
  summary: The description of the change data capture.
  signature: 'description: str'
- uid: azure.mgmt.datafactory.types.ChangeDataCapture.folder
  name: folder
  summary: The folder that this CDC is in. If not specified, CDC will appear at the
    root level.
  signature: 'folder: ChangeDataCaptureFolder'
- uid: azure.mgmt.datafactory.types.ChangeDataCapture.policy
  name: policy
  summary: CDC policy. Required.
  signature: 'policy: MapperPolicy'
- uid: azure.mgmt.datafactory.types.ChangeDataCapture.sourceConnectionsInfo
  name: sourceConnectionsInfo
  summary: List of sources connections that can be used as sources in the CDC. Required.
  signature: 'sourceConnectionsInfo: list[azure.mgmt.datafactory.types.MapperSourceConnectionsInfo]'
- uid: azure.mgmt.datafactory.types.ChangeDataCapture.status
  name: status
  summary: Status of the CDC as to if it is running or stopped.
  signature: 'status: str'
- uid: azure.mgmt.datafactory.types.ChangeDataCapture.targetConnectionsInfo
  name: targetConnectionsInfo
  summary: List of target connections that can be used as sources in the CDC. Required.
  signature: 'targetConnectionsInfo: list[azure.mgmt.datafactory.types.MapperTargetConnectionsInfo]'
