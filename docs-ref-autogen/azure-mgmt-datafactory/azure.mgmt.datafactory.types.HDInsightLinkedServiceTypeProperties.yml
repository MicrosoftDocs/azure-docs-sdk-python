### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.HDInsightLinkedServiceTypeProperties
name: HDInsightLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.HDInsightLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: HDInsight linked service properties.
constructor:
  syntax: HDInsightLinkedServiceTypeProperties()
variables:
- description: 'HDInsight cluster URI. Type: string (or Expression with resultType
    string).

    Required.'
  name: cluster_uri
  types:
  - <xref:typing.Any>
- description: 'HDInsight cluster authentication type. Known values are: "BasicAuth",

    "SystemAssignedManagedIdentity", and "UserAssignedManagedIdentity".'
  name: cluster_auth_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HDInsightClusterAuthenticationType">]
- description: 'HDInsight cluster user name. Type: string (or Expression with resultType

    string).'
  name: user_name
  types:
  - <xref:typing.Any>
- description: HDInsight cluster password.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: The Azure Storage linked service reference.
  name: linked_service_name
  types:
  - <xref:<xref:"LinkedServiceReference">>
- description: 'A reference to the Azure SQL linked service that points to

    the HCatalog database.'
  name: hcatalog_linked_service_name
  types:
  - <xref:<xref:"LinkedServiceReference">>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: 'Specify if the HDInsight is created with ESP (Enterprise Security

    Package). Type: Boolean.'
  name: is_esp_enabled
  types:
  - <xref:typing.Any>
- description: 'Specify the FileSystem if the main storage for the HDInsight is ADLS
    Gen2.

    Type: string (or Expression with resultType string).'
  name: file_system
  types:
  - <xref:typing.Any>
- description: 'The credential reference containing MI authentication information
    for the

    HDInsight cluster.'
  name: credential
  types:
  - <xref:<xref:"CredentialReference">>
attributes:
- uid: azure.mgmt.datafactory.types.HDInsightLinkedServiceTypeProperties.clusterAuthType
  name: clusterAuthType
  summary: '"BasicAuth",

    "SystemAssignedManagedIdentity", and "UserAssignedManagedIdentity".'
  signature: 'clusterAuthType: str | HDInsightClusterAuthenticationType'
- uid: azure.mgmt.datafactory.types.HDInsightLinkedServiceTypeProperties.clusterUri
  name: clusterUri
  summary: string (or Expression with resultType string). Required.
  signature: 'clusterUri: Required[Any]'
- uid: azure.mgmt.datafactory.types.HDInsightLinkedServiceTypeProperties.credential
  name: credential
  summary: The credential reference containing MI authentication information for the
    HDInsight cluster.
  signature: 'credential: CredentialReference'
- uid: azure.mgmt.datafactory.types.HDInsightLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.HDInsightLinkedServiceTypeProperties.fileSystem
  name: fileSystem
  summary: 'string (or

    Expression with resultType string).'
  signature: 'fileSystem: Any'
- uid: azure.mgmt.datafactory.types.HDInsightLinkedServiceTypeProperties.hcatalogLinkedServiceName
  name: hcatalogLinkedServiceName
  summary: A reference to the Azure SQL linked service that points to the HCatalog
    database.
  signature: 'hcatalogLinkedServiceName: LinkedServiceReference'
- uid: azure.mgmt.datafactory.types.HDInsightLinkedServiceTypeProperties.isEspEnabled
  name: isEspEnabled
  summary: Boolean.
  signature: 'isEspEnabled: Any'
- uid: azure.mgmt.datafactory.types.HDInsightLinkedServiceTypeProperties.linkedServiceName
  name: linkedServiceName
  summary: The Azure Storage linked service reference.
  signature: 'linkedServiceName: LinkedServiceReference'
- uid: azure.mgmt.datafactory.types.HDInsightLinkedServiceTypeProperties.password
  name: password
  summary: HDInsight cluster password.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.HDInsightLinkedServiceTypeProperties.userName
  name: userName
  summary: string (or Expression with resultType string).
  signature: 'userName: Any'
