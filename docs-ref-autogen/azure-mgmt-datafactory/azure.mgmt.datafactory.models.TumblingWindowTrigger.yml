### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.TumblingWindowTrigger
name: TumblingWindowTrigger
fullName: azure.mgmt.datafactory.models.TumblingWindowTrigger
module: azure.mgmt.datafactory.models
summary: 'Trigger that schedules pipeline runs for all fixed time interval windows
  from a start time

  without gaps and also supports backfill scenarios (when start time is in the past).'
constructor:
  syntax: 'TumblingWindowTrigger(*args: Any, **kwargs: Any)'
variables:
- description: Trigger description.
  name: description
  types:
  - <xref:str>
- description: 'Indicates if trigger is running or not. Updated when Start/Stop APIs
    are

    called on the Trigger. Known values are: "Started", "Stopped", and "Disabled".'
  name: runtime_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.TriggerRuntimeState>
- description: List of tags that can be used for describing the trigger.
  name: annotations
  types:
  - <xref:list>[<xref:any>]
- description: 'Pipeline for which runs are created when an event is fired for trigger
    window

    that is ready. Required.'
  name: pipeline
  types:
  - <xref:azure.mgmt.datafactory.models.TriggerPipelineReference>
- description: Tumbling Window Trigger properties. Required.
  name: type_properties
  types:
  - <xref:azure.mgmt.datafactory.models.TumblingWindowTriggerTypeProperties>
- description: Trigger type. Required. Default value is "TumblingWindowTrigger".
  name: type
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.models.TumblingWindowTrigger.pipeline
  name: pipeline
  summary: 'Pipeline for which runs are created when an event is fired for trigger
    window that is ready.

    Required.'
  signature: 'pipeline: _models.TriggerPipelineReference'
- uid: azure.mgmt.datafactory.models.TumblingWindowTrigger.type
  name: type
  summary: Trigger type. Required. Default value is "TumblingWindowTrigger".
  signature: 'type: Literal[''TumblingWindowTrigger'']'
- uid: azure.mgmt.datafactory.models.TumblingWindowTrigger.type_properties
  name: type_properties
  summary: Tumbling Window Trigger properties. Required.
  signature: 'type_properties: _models.TumblingWindowTriggerTypeProperties'
