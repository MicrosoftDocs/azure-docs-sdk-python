### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.FtpServerLinkedServiceTypeProperties
name: FtpServerLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.FtpServerLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Properties specific to this linked service type.
constructor:
  syntax: FtpServerLinkedServiceTypeProperties()
variables:
- description: 'Host name of the FTP server. Type: string (or Expression with resultType
    string).

    Required.'
  name: host
  types:
  - <xref:typing.Any>
- description: 'The TCP port number that the FTP server uses to listen for client
    connections.

    Default value is 21. Type: integer (or Expression with resultType integer), minimum:
    0.'
  name: port
  types:
  - <xref:typing.Any>
- description: 'The authentication type to be used to connect to the FTP server.

    Known values are: "Basic" and "Anonymous".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FtpAuthenticationType">]
- description: 'Username to logon the FTP server. Type: string (or Expression with
    resultType

    string).'
  name: user_name
  types:
  - <xref:typing.Any>
- description: Password to logon the FTP server.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
- description: 'If true, connect to the FTP server over SSL/TLS channel. Default value
    is

    true. Type: boolean (or Expression with resultType boolean).'
  name: enable_ssl
  types:
  - <xref:typing.Any>
- description: 'If true, validate the FTP server SSL certificate

    when connect over SSL/TLS channel. Default value is true. Type: boolean (or Expression
    with

    resultType boolean).'
  name: enable_server_certificate_validation
  types:
  - <xref:typing.Any>
attributes:
- uid: azure.mgmt.datafactory.types.FtpServerLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: '"Basic"

    and "Anonymous".'
  signature: 'authenticationType: str | FtpAuthenticationType'
- uid: azure.mgmt.datafactory.types.FtpServerLinkedServiceTypeProperties.enableServerCertificateValidation
  name: enableServerCertificateValidation
  summary: 'If true, validate the FTP server SSL certificate when connect over SSL/TLS
    channel. Default

    value is true. Type: boolean (or Expression with resultType boolean).'
  signature: 'enableServerCertificateValidation: Any'
- uid: azure.mgmt.datafactory.types.FtpServerLinkedServiceTypeProperties.enableSsl
  name: enableSsl
  summary: 'boolean

    (or Expression with resultType boolean).'
  signature: 'enableSsl: Any'
- uid: azure.mgmt.datafactory.types.FtpServerLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.FtpServerLinkedServiceTypeProperties.host
  name: host
  summary: string (or Expression with resultType string). Required.
  signature: 'host: Required[Any]'
- uid: azure.mgmt.datafactory.types.FtpServerLinkedServiceTypeProperties.password
  name: password
  summary: Password to logon the FTP server.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.FtpServerLinkedServiceTypeProperties.port
  name: port
  summary: 'The TCP port number that the FTP server uses to listen for client connections.
    Default value is

    21. Type: integer (or Expression with resultType integer), minimum: 0.'
  signature: 'port: Any'
- uid: azure.mgmt.datafactory.types.FtpServerLinkedServiceTypeProperties.userName
  name: userName
  summary: string (or Expression with resultType string).
  signature: 'userName: Any'
