### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties
name: GoogleBigQueryLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties
module: azure.mgmt.datafactory.models
summary: Google BigQuery service linked service properties.
constructor:
  syntax: 'GoogleBigQueryLinkedServiceTypeProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The default BigQuery project to query against. Type: string (or Expression
    with

    resultType string). Required.'
  name: project
  types:
  - <xref:any>
- description: 'A comma-separated list of public BigQuery projects to access. Type:

    string (or Expression with resultType string).'
  name: additional_projects
  types:
  - <xref:any>
- description: 'Whether to request access to Google Drive. Allowing Google

    Drive access enables support for federated tables that combine BigQuery data with
    data from

    Google Drive. The default value is false. Type: string (or Expression with resultType
    string).'
  name: request_google_drive_scope
  types:
  - <xref:any>
- description: 'The OAuth 2.0 authentication mechanism used for authentication.

    ServiceAuthentication can only be used on self-hosted IR. Required. Known values
    are:

    "ServiceAuthentication" and "UserAuthentication".'
  name: authentication_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.GoogleBigQueryAuthenticationType>
- description: 'The refresh token obtained from Google for authorizing access to BigQuery

    for UserAuthentication.'
  name: refresh_token
  types:
  - <xref:azure.mgmt.datafactory.models.SecretBase>
- description: 'The client id of the google application used to acquire the refresh
    token.

    Type: string (or Expression with resultType string).'
  name: client_id
  types:
  - <xref:any>
- description: 'The client secret of the google application used to acquire the refresh

    token.'
  name: client_secret
  types:
  - <xref:azure.mgmt.datafactory.models.SecretBase>
- description: 'The service account email ID that is used for ServiceAuthentication
    and can only

    be used on self-hosted IR. Type: string (or Expression with resultType string).'
  name: email
  types:
  - <xref:any>
- description: 'The full path to the .p12 key file that is used to authenticate the

    service account email address and can only be used on self-hosted IR. Type: string
    (or

    Expression with resultType string).'
  name: key_file_path
  types:
  - <xref:any>
- description: 'The full path of the .pem file containing trusted CA certificates
    for

    verifying the server when connecting over SSL. This property can only be set when
    using SSL on

    self-hosted IR. The default value is the cacerts.pem file installed with the IR.
    Type: string

    (or Expression with resultType string).'
  name: trusted_cert_path
  types:
  - <xref:any>
- description: 'Specifies whether to use a CA certificate from the system trust

    store or from a specified PEM file. The default value is false.Type: boolean (or
    Expression

    with resultType boolean).'
  name: use_system_trust_store
  types:
  - <xref:any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties.additional_projects
  name: additional_projects
  summary: 'string (or Expression with

    resultType string).'
  signature: 'additional_projects: Any | None'
- uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties.authentication_type
  name: authentication_type
  summary: 'The OAuth 2.0 authentication mechanism used for authentication. ServiceAuthentication
    can only

    be used on self-hosted IR. Required. Known values are: "ServiceAuthentication"
    and

    "UserAuthentication".'
  signature: 'authentication_type: str | _models.GoogleBigQueryAuthenticationType'
- uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties.client_id
  name: client_id
  summary: 'string (or

    Expression with resultType string).'
  signature: 'client_id: Any | None'
- uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties.client_secret
  name: client_secret
  summary: The client secret of the google application used to acquire the refresh
    token.
  signature: 'client_secret: _models.SecretBase | None'
- uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties.email
  name: email
  summary: 'The service account email ID that is used for ServiceAuthentication and
    can only be used on

    self-hosted IR. Type: string (or Expression with resultType string).'
  signature: 'email: Any | None'
- uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties.encrypted_credential
  name: encrypted_credential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encrypted_credential: str | None'
- uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties.key_file_path
  name: key_file_path
  summary: 'The full path to the .p12 key file that is used to authenticate the service
    account email

    address and can only be used on self-hosted IR. Type: string (or Expression with
    resultType

    string).'
  signature: 'key_file_path: Any | None'
- uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties.project
  name: project
  summary: 'string (or Expression with resultType

    string). Required.'
  signature: 'project: Any'
- uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties.refresh_token
  name: refresh_token
  summary: 'The refresh token obtained from Google for authorizing access to BigQuery
    for

    UserAuthentication.'
  signature: 'refresh_token: _models.SecretBase | None'
- uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties.request_google_drive_scope
  name: request_google_drive_scope
  summary: 'Whether to request access to Google Drive. Allowing Google Drive access
    enables support for

    federated tables that combine BigQuery data with data from Google Drive. The default
    value is

    false. Type: string (or Expression with resultType string).'
  signature: 'request_google_drive_scope: Any | None'
- uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties.trusted_cert_path
  name: trusted_cert_path
  summary: 'The full path of the .pem file containing trusted CA certificates for
    verifying the server when

    connecting over SSL. This property can only be set when using SSL on self-hosted
    IR. The

    default value is the cacerts.pem file installed with the IR. Type: string (or
    Expression with

    resultType string).'
  signature: 'trusted_cert_path: Any | None'
- uid: azure.mgmt.datafactory.models.GoogleBigQueryLinkedServiceTypeProperties.use_system_trust_store
  name: use_system_trust_store
  summary: 'Specifies whether to use a CA certificate from the system trust store
    or from a specified PEM

    file. The default value is false.Type: boolean (or Expression with resultType
    boolean).'
  signature: 'use_system_trust_store: Any | None'
