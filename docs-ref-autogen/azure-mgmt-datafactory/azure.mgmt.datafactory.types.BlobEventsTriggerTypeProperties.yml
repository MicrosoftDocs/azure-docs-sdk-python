### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.BlobEventsTriggerTypeProperties
name: BlobEventsTriggerTypeProperties
fullName: azure.mgmt.datafactory.types.BlobEventsTriggerTypeProperties
module: azure.mgmt.datafactory.types
summary: Blob Events Trigger properties.
constructor:
  syntax: BlobEventsTriggerTypeProperties()
variables:
- description: 'The blob path must begin with the pattern provided for trigger to

    fire. For example, ''/records/blobs/december/'' will only fire the trigger for
    blobs in the

    december folder under the records container. At least one of these must be provided:

    blobPathBeginsWith, blobPathEndsWith.'
  name: blob_path_begins_with
  types:
  - <xref:str>
- description: 'The blob path must end with the pattern provided for trigger to

    fire. For example, ''december/boxes.csv'' will only fire the trigger for blobs
    named boxes in a

    december folder. At least one of these must be provided: blobPathBeginsWith, blobPathEndsWith.'
  name: blob_path_ends_with
  types:
  - <xref:str>
- description: If set to true, blobs with zero bytes will be ignored.
  name: ignore_empty_blobs
  types:
  - <xref:bool>
- description: The type of events that cause this trigger to fire. Required.
  name: events
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"BlobEventTypes">]]
- description: The ARM resource ID of the Storage Account. Required.
  name: scope
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.BlobEventsTriggerTypeProperties.blobPathBeginsWith
  name: blobPathBeginsWith
  summary: 'The blob path must begin with the pattern provided for trigger to fire.
    For example,

    ''/records/blobs/december/'' will only fire the trigger for blobs in the december
    folder under

    the records container. At least one of these must be provided: blobPathBeginsWith,

    blobPathEndsWith.'
  signature: 'blobPathBeginsWith: str'
- uid: azure.mgmt.datafactory.types.BlobEventsTriggerTypeProperties.blobPathEndsWith
  name: blobPathEndsWith
  summary: 'The blob path must end with the pattern provided for trigger to fire.
    For example,

    ''december/boxes.csv'' will only fire the trigger for blobs named boxes in a december
    folder. At

    least one of these must be provided: blobPathBeginsWith, blobPathEndsWith.'
  signature: 'blobPathEndsWith: str'
- uid: azure.mgmt.datafactory.types.BlobEventsTriggerTypeProperties.events
  name: events
  summary: The type of events that cause this trigger to fire. Required.
  signature: 'events: Union[str, ForwardRef(''BlobEventTypes'')]]]'
- uid: azure.mgmt.datafactory.types.BlobEventsTriggerTypeProperties.ignoreEmptyBlobs
  name: ignoreEmptyBlobs
  summary: If set to true, blobs with zero bytes will be ignored.
  signature: 'ignoreEmptyBlobs: bool'
- uid: azure.mgmt.datafactory.types.BlobEventsTriggerTypeProperties.scope
  name: scope
  summary: The ARM resource ID of the Storage Account. Required.
  signature: 'scope: Required[str]'
