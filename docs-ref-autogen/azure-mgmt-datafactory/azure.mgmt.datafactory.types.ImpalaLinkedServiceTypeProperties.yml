### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties
name: ImpalaLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Impala server linked service properties.
constructor:
  syntax: ImpalaLinkedServiceTypeProperties()
variables:
- description: The IP address or host name of the Impala server. (i.e. 192.168.222.160).
    Required.
  name: host
  types:
  - <xref:typing.Any>
- description: 'The TCP port that the Impala server uses to listen for client connections.
    The

    default value is 21050.'
  name: port
  types:
  - <xref:typing.Any>
- description: 'The authentication type to use. Required. Known values are:

    "Anonymous", "SASLUsername", and "UsernameAndPassword".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ImpalaAuthenticationType">]
- description: 'The user name used to access the Impala server. The default value
    is anonymous

    when using SASLUsername.'
  name: username
  types:
  - <xref:typing.Any>
- description: The password corresponding to the user name when using UsernameAndPassword.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'The transport protocol to use in the Thrift layer (for V2

    only). Default value is Binary. Known values are: "Binary" and "HTTP".'
  name: thrift_transport_protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ImpalaThriftTransportProtocol">]
- description: 'Specifies whether the connections to the server are encrypted using
    SSL. The

    default value is false.'
  name: enable_ssl
  types:
  - <xref:typing.Any>
- description: 'Specify whether to enable server SSL certificate

    validation when you connect.Always use System Trust Store (for V2 only). The default
    value is

    true.'
  name: enable_server_certificate_validation
  types:
  - <xref:typing.Any>
- description: 'The full path of the .pem file containing trusted CA certificates
    for

    verifying the server when connecting over SSL. This property can only be set when
    using SSL on

    self-hosted IR. The default value is the cacerts.pem file installed with the IR.'
  name: trusted_cert_path
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to use a CA certificate from the system trust

    store or from a specified PEM file. The default value is false.'
  name: use_system_trust_store
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require a CA-issued SSL certificate

    name to match the host name of the server when connecting over SSL. The default
    value is false.'
  name: allow_host_name_cn_mismatch
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to allow self-signed certificates from

    the server. The default value is false.'
  name: allow_self_signed_server_cert
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.allowHostNameCNMismatch
  name: allowHostNameCNMismatch
  summary: 'Specifies whether to require a CA-issued SSL certificate name to match
    the host name of the

    server when connecting over SSL. The default value is false.'
  signature: 'allowHostNameCNMismatch: Any'
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.allowSelfSignedServerCert
  name: allowSelfSignedServerCert
  summary: 'Specifies whether to allow self-signed certificates from the server. The
    default value is

    false.'
  signature: 'allowSelfSignedServerCert: Any'
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: '"Anonymous", "SASLUsername",

    and "UsernameAndPassword".'
  signature: 'authenticationType: Required[str | ImpalaAuthenticationType]'
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.enableServerCertificateValidation
  name: enableServerCertificateValidation
  summary: 'Specify whether to enable server SSL certificate validation when you connect.Always
    use System

    Trust Store (for V2 only). The default value is true.'
  signature: 'enableServerCertificateValidation: Any'
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.enableSsl
  name: enableSsl
  summary: 'Specifies whether the connections to the server are encrypted using SSL.
    The default value is

    false.'
  signature: 'enableSsl: Any'
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.host
  name: host
  summary: The IP address or host name of the Impala server. (i.e. 192.168.222.160).
    Required.
  signature: 'host: Required[Any]'
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.password
  name: password
  summary: The password corresponding to the user name when using UsernameAndPassword.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.port
  name: port
  summary: 'The TCP port that the Impala server uses to listen for client connections.
    The default value is

    21050.'
  signature: 'port: Any'
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.thriftTransportProtocol
  name: thriftTransportProtocol
  summary: 'The transport protocol to use in the Thrift layer (for V2 only). Default
    value is Binary. Known

    values are: "Binary" and "HTTP".'
  signature: 'thriftTransportProtocol: str | ImpalaThriftTransportProtocol'
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.trustedCertPath
  name: trustedCertPath
  summary: 'The full path of the .pem file containing trusted CA certificates for
    verifying the server when

    connecting over SSL. This property can only be set when using SSL on self-hosted
    IR. The

    default value is the cacerts.pem file installed with the IR.'
  signature: 'trustedCertPath: Any'
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.useSystemTrustStore
  name: useSystemTrustStore
  summary: 'Specifies whether to use a CA certificate from the system trust store
    or from a specified PEM

    file. The default value is false.'
  signature: 'useSystemTrustStore: Any'
- uid: azure.mgmt.datafactory.types.ImpalaLinkedServiceTypeProperties.username
  name: username
  summary: 'The user name used to access the Impala server. The default value is anonymous
    when using

    SASLUsername.'
  signature: 'username: Any'
