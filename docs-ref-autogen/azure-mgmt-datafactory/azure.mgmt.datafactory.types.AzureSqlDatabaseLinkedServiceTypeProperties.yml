  signature: 'authenticationType: str | AzureSqlDatabaseAuthenticationType'
- uid: azure.mgmt.datafactory.types.AzureSqlDatabaseLinkedServiceTypeProperties.azureCloudType
  name: azureCloudType
  summary: 'Indicates the azure cloud type of the service principle auth. Allowed
    values are AzurePublic,

    AzureChina, AzureUsGovernment, AzureGermany. Default value is the data factory
    regions'' cloud

    type. Type: string (or Expression with resultType string).'
  signature: 'azureCloudType: Any'
- uid: azure.mgmt.datafactory.types.AzureSqlDatabaseLinkedServiceTypeProperties.connectionString
  name: connectionString
  summary: string, SecureString or AzureKeyVaultSecretReference.
  signature: 'connectionString: Any'
- uid: azure.mgmt.datafactory.types.AzureSqlDatabaseLinkedServiceTypeProperties.credential
  name: credential
  summary: The credential reference containing authentication information.
