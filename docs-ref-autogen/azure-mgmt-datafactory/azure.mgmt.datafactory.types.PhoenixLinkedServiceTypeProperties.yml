### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties
name: PhoenixLinkedServiceTypeProperties
fullName: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties
module: azure.mgmt.datafactory.types
summary: Phoenix server linked service properties.
constructor:
  syntax: PhoenixLinkedServiceTypeProperties()
variables:
- description: 'The IP address or host name of the Phoenix server. (i.e. 192.168.222.160).

    Required.'
  name: host
  types:
  - <xref:typing.Any>
- description: 'The TCP port that the Phoenix server uses to listen for client connections.
    The

    default value is 8765.'
  name: port
  types:
  - <xref:typing.Any>
- description: 'The partial URL corresponding to the Phoenix server. (i.e.

    /gateway/sandbox/phoenix/version). The default value is hbasephoenix if using

    WindowsAzureHDInsightService.'
  name: http_path
  types:
  - <xref:typing.Any>
- description: 'The authentication mechanism used to connect to the Phoenix server.

    Required. Known values are: "Anonymous", "UsernameAndPassword", and

    "WindowsAzureHDInsightService".'
  name: authentication_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PhoenixAuthenticationType">]
- description: The user name used to connect to the Phoenix server.
  name: username
  types:
  - <xref:typing.Any>
- description: The password corresponding to the user name.
  name: password
  types:
  - <xref:<xref:"SecretBase">>
- description: 'Specifies whether the connections to the server are encrypted using
    SSL. The

    default value is false.'
  name: enable_ssl
  types:
  - <xref:typing.Any>
- description: 'The full path of the .pem file containing trusted CA certificates
    for

    verifying the server when connecting over SSL. This property can only be set when
    using SSL on

    self-hosted IR. The default value is the cacerts.pem file installed with the IR.'
  name: trusted_cert_path
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to use a CA certificate from the system trust

    store or from a specified PEM file. The default value is false.'
  name: use_system_trust_store
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to require a CA-issued SSL certificate

    name to match the host name of the server when connecting over SSL. The default
    value is false.'
  name: allow_host_name_cn_mismatch
  types:
  - <xref:typing.Any>
- description: 'Specifies whether to allow self-signed certificates from

    the server. The default value is false.'
  name: allow_self_signed_server_cert
  types:
  - <xref:typing.Any>
- description: 'The encrypted credential used for authentication. Credentials are

    encrypted using the integration runtime credential manager. Type: string.'
  name: encrypted_credential
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties.allowHostNameCNMismatch
  name: allowHostNameCNMismatch
  summary: 'Specifies whether to require a CA-issued SSL certificate name to match
    the host name of the

    server when connecting over SSL. The default value is false.'
  signature: 'allowHostNameCNMismatch: Any'
- uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties.allowSelfSignedServerCert
  name: allowSelfSignedServerCert
  summary: 'Specifies whether to allow self-signed certificates from the server. The
    default value is

    false.'
  signature: 'allowSelfSignedServerCert: Any'
- uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties.authenticationType
  name: authenticationType
  summary: 'The authentication mechanism used to connect to the Phoenix server. Required.
    Known values are:

    "Anonymous", "UsernameAndPassword", and "WindowsAzureHDInsightService".'
  signature: 'authenticationType: Required[str | PhoenixAuthenticationType]'
- uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties.enableSsl
  name: enableSsl
  summary: 'Specifies whether the connections to the server are encrypted using SSL.
    The default value is

    false.'
  signature: 'enableSsl: Any'
- uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties.encryptedCredential
  name: encryptedCredential
  summary: 'The encrypted credential used for authentication. Credentials are encrypted
    using the

    integration runtime credential manager. Type: string.'
  signature: 'encryptedCredential: str'
- uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties.host
  name: host
  summary: The IP address or host name of the Phoenix server. (i.e. 192.168.222.160).
    Required.
  signature: 'host: Required[Any]'
- uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties.httpPath
  name: httpPath
  summary: 'The partial URL corresponding to the Phoenix server. (i.e. /gateway/sandbox/phoenix/version).

    The default value is hbasephoenix if using WindowsAzureHDInsightService.'
  signature: 'httpPath: Any'
- uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties.password
  name: password
  summary: The password corresponding to the user name.
  signature: 'password: SecretBase'
- uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties.port
  name: port
  summary: 'The TCP port that the Phoenix server uses to listen for client connections.
    The default value

    is 8765.'
  signature: 'port: Any'
- uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties.trustedCertPath
  name: trustedCertPath
  summary: 'The full path of the .pem file containing trusted CA certificates for
    verifying the server when

    connecting over SSL. This property can only be set when using SSL on self-hosted
    IR. The

    default value is the cacerts.pem file installed with the IR.'
  signature: 'trustedCertPath: Any'
- uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties.useSystemTrustStore
  name: useSystemTrustStore
  summary: 'Specifies whether to use a CA certificate from the system trust store
    or from a specified PEM

    file. The default value is false.'
  signature: 'useSystemTrustStore: Any'
- uid: azure.mgmt.datafactory.types.PhoenixLinkedServiceTypeProperties.username
  name: username
  summary: The user name used to connect to the Phoenix server.
  signature: 'username: Any'
