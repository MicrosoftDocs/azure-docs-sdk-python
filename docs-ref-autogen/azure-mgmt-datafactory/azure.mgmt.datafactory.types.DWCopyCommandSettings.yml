uid: azure.mgmt.datafactory.types.DWCopyCommandSettings
name: DWCopyCommandSettings
fullName: azure.mgmt.datafactory.types.DWCopyCommandSettings
module: azure.mgmt.datafactory.types
summary: DW Copy Command settings.
constructor:
  syntax: DWCopyCommandSettings()
variables:
- description: 'Specifies the default values for each target column in SQL DW. The

    default values in the property overwrite the DEFAULT constraint set in the DB,
    and identity

    column cannot have a default value. Type: array of objects (or Expression with
    resultType array

    of objects).'
  name: default_values
  types:
  - <xref:list>[<xref:"DWCopyCommandDefaultValue">]
- description: 'Additional options directly passed to SQL DW in Copy Command. Type:

    key value pairs (value should be string type) (or Expression with resultType object).
    Example:

    "additionalOptions": { "MAXERRORS": "1000", "DATEFORMAT": "''ymd''" }.'
  name: additional_options
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
attributes:
- uid: azure.mgmt.datafactory.types.DWCopyCommandSettings.additionalOptions
  name: additionalOptions
  summary: 'key value pairs (value

    should be string type) (or Expression with resultType object). Example: "additionalOptions":

    { "MAXERRORS": "1000", "DATEFORMAT": "''ymd''" }.'
  signature: 'additionalOptions: dict[str, str]'
- uid: azure.mgmt.datafactory.types.DWCopyCommandSettings.defaultValues
  name: defaultValues
  summary: 'Specifies the default values for each target column in SQL DW. The default
