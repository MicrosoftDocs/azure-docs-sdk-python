uid: azure.mgmt.datafactory.types.LookupActivityTypeProperties
name: LookupActivityTypeProperties
fullName: azure.mgmt.datafactory.types.LookupActivityTypeProperties
module: azure.mgmt.datafactory.types
summary: Lookup activity properties.
constructor:
  syntax: LookupActivityTypeProperties()
variables:
- description: Dataset-specific source properties, same as copy activity source. Required.
  name: source
  types:
  - <xref:<xref:"CopySource">>
- description: Lookup activity dataset reference. Required.
  name: dataset
  types:
  - <xref:<xref:"DatasetReference">>
- description: 'Whether to return first row or all rows. Default value is true. Type:

    boolean (or Expression with resultType boolean).'
  name: first_row_only
  types:
  - <xref:typing.Any>
- description: 'Indicates whether to treat decimal values as strings to avoid

    value overflow issue. This option is enabled for SnowflakeV2 connector only. Type:
    boolean (or

    Expression with resultType boolean).'
  name: treat_decimal_as_string
  types:
  - <xref:typing.Any>
