### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.UntilActivity
name: UntilActivity
fullName: azure.mgmt.datafactory.types.UntilActivity
module: azure.mgmt.datafactory.types
summary: 'This activity executes inner activities until the specified boolean expression
  results to true

  or timeout is reached, whichever is earlier.'
constructor:
  syntax: UntilActivity()
variables:
- description: Activity name. Required.
  name: name
  types:
  - <xref:str>
- description: Activity description.
  name: description
  types:
  - <xref:str>
- description: 'Activity state. This is an optional property and if not provided,
    the state will

    be Active by default. Known values are: "Active" and "Inactive".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActivityState">]
- description: 'Status result of the activity when the state is set to Inactive.

    This is an optional property and if not provided when the activity is inactive,
    the status will

    be Succeeded by default. Known values are: "Succeeded", "Failed", and "Skipped".'
  name: on_inactive_mark_as
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActivityOnInactiveMarkAs">]
- description: Activity depends on condition.
  name: depends_on
  types:
  - <xref:list>[<xref:"ActivityDependency">]
- description: Activity user properties.
  name: user_properties
  types:
  - <xref:list>[<xref:"UserProperty">]
- description: Until activity properties. Required.
  name: type_properties
  types:
  - <xref:<xref:"UntilActivityTypeProperties">>
- description: Type of activity. Required. Default value is "Until".
  name: type
  types:
  - <xref:typing.Literal>["Until"]
attributes:
- uid: azure.mgmt.datafactory.types.UntilActivity.dependsOn
  name: dependsOn
  summary: Activity depends on condition.
  signature: 'dependsOn: list[''ActivityDependency'']'
- uid: azure.mgmt.datafactory.types.UntilActivity.description
  name: description
  summary: Activity description.
  signature: 'description: str'
- uid: azure.mgmt.datafactory.types.UntilActivity.name
  name: name
  summary: Activity name. Required.
  signature: 'name: Required[str]'
- uid: azure.mgmt.datafactory.types.UntilActivity.onInactiveMarkAs
  name: onInactiveMarkAs
  summary: 'Status result of the activity when the state is set to Inactive. This
    is an optional property

    and if not provided when the activity is inactive, the status will be Succeeded
    by default.

    Known values are: "Succeeded", "Failed", and "Skipped".'
  signature: 'onInactiveMarkAs: str | ActivityOnInactiveMarkAs'
- uid: azure.mgmt.datafactory.types.UntilActivity.state
  name: state
  summary: 'Activity state. This is an optional property and if not provided, the
    state will be Active by

    default. Known values are: "Active" and "Inactive".'
  signature: 'state: str | ActivityState'
- uid: azure.mgmt.datafactory.types.UntilActivity.type
  name: type
  summary: Type of activity. Required. Default value is "Until".
  signature: 'type: Required[Literal[''Until'']]'
- uid: azure.mgmt.datafactory.types.UntilActivity.typeProperties
  name: typeProperties
  summary: Until activity properties. Required.
  signature: 'typeProperties: Required[UntilActivityTypeProperties]'
- uid: azure.mgmt.datafactory.types.UntilActivity.userProperties
  name: userProperties
  summary: Activity user properties.
  signature: 'userProperties: list[''UserProperty'']'
