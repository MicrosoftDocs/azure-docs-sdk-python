### YamlMime:PythonClass
uid: azure.mgmt.datafactory.models.Trigger
name: Trigger
fullName: azure.mgmt.datafactory.models.Trigger
module: azure.mgmt.datafactory.models
summary: 'Azure data factory nested object which contains information about creating
  pipeline run.


  You probably want to use the sub-classes and not this class directly. Known sub-classes
  are:

  BlobEventsTrigger, BlobTrigger, ChainingTrigger, CustomEventsTrigger, MultiplePipelineTrigger,

  RerunTumblingWindowTrigger, ScheduleTrigger, TumblingWindowTrigger'
constructor:
  syntax: 'Trigger(*args: Any, **kwargs: Any)'
variables:
- description: Trigger type. Required. Default value is None.
  name: type
  types:
  - <xref:str>
- description: Trigger description.
  name: description
  types:
  - <xref:str>
- description: 'Indicates if trigger is running or not. Updated when Start/Stop APIs
    are

    called on the Trigger. Known values are: "Started", "Stopped", and "Disabled".'
  name: runtime_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.datafactory.models.TriggerRuntimeState>
- description: List of tags that can be used for describing the trigger.
  name: annotations
  types:
  - <xref:list>[<xref:any>]
attributes:
- uid: azure.mgmt.datafactory.models.Trigger.annotations
  name: annotations
  summary: List of tags that can be used for describing the trigger.
  signature: 'annotations: list[Any] | None'
- uid: azure.mgmt.datafactory.models.Trigger.description
  name: description
  summary: Trigger description.
  signature: 'description: str | None'
- uid: azure.mgmt.datafactory.models.Trigger.runtime_state
  name: runtime_state
  summary: 'Indicates if trigger is running or not. Updated when Start/Stop APIs are
    called on the Trigger.

    Known values are: "Started", "Stopped", and "Disabled".'
  signature: 'runtime_state: str | _models.TriggerRuntimeState | None'
- uid: azure.mgmt.datafactory.models.Trigger.type
  name: type
  summary: Trigger type. Required. Default value is None.
  signature: 'type: str'
