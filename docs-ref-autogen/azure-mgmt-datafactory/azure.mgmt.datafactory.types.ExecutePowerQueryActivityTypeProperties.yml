### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.ExecutePowerQueryActivityTypeProperties
name: ExecutePowerQueryActivityTypeProperties
fullName: azure.mgmt.datafactory.types.ExecutePowerQueryActivityTypeProperties
module: azure.mgmt.datafactory.types
summary: Execute power query data flow activity properties.
constructor:
  syntax: ExecutePowerQueryActivityTypeProperties()
variables:
- description: Data flow reference. Required.
  name: data_flow
  types:
  - <xref:<xref:"DataFlowReference">>
- description: Staging info for execute data flow activity.
  name: staging
  types:
  - <xref:<xref:"DataFlowStagingInfo">>
- description: The integration runtime reference.
  name: integration_runtime
  types:
  - <xref:<xref:"IntegrationRuntimeReference">>
- description: Continuation settings for execute data flow activity.
  name: continuation_settings
  types:
  - <xref:<xref:"ContinuationSettingsReference">>
- description: Compute properties for data flow activity.
  name: compute
  types:
  - <xref:<xref:"ExecuteDataFlowActivityTypePropertiesCompute">>
- description: 'Trace level setting used for data flow monitoring output. Supported
    values

    are: ''coarse'', ''fine'', and ''none''. Type: string (or Expression with resultType
    string).'
  name: trace_level
  types:
  - <xref:typing.Any>
- description: 'Continue on error setting used for data flow execution. Enables

    processing to continue if a sink fails. Type: boolean (or Expression with resultType
    boolean).'
  name: continue_on_error
  types:
  - <xref:typing.Any>
- description: 'Concurrent run setting used for data flow execution. Allows sinks
    with

    the same save order to be processed concurrently. Type: boolean (or Expression
    with resultType

    boolean).'
  name: run_concurrently
  types:
  - <xref:typing.Any>
- description: 'Specify number of parallel staging for sources applicable to

    the sink. Type: integer (or Expression with resultType integer).'
  name: source_staging_concurrency
  types:
  - <xref:typing.Any>
- description: '(Deprecated. Please use Queries). List of Power Query activity sinks
    mapped to a

    queryName.'
  name: sinks
  types:
  - <xref:dict>[<xref:str>, <xref:"PowerQuerySink">]
- description: List of mapping for Power Query mashup query to sink dataset(s).
  name: queries
  types:
  - <xref:list>[<xref:"PowerQuerySinkMapping">]
attributes:
- uid: azure.mgmt.datafactory.types.ExecutePowerQueryActivityTypeProperties.queries
  name: queries
  summary: List of mapping for Power Query mashup query to sink dataset(s).
  signature: 'queries: list[azure.mgmt.datafactory.types.PowerQuerySinkMapping]'
- uid: azure.mgmt.datafactory.types.ExecutePowerQueryActivityTypeProperties.sinks
  name: sinks
  summary: (Deprecated. Please use Queries). List of Power Query activity sinks mapped
    to a queryName.
  signature: 'sinks: dict[str, azure.mgmt.datafactory.types.PowerQuerySink]'
