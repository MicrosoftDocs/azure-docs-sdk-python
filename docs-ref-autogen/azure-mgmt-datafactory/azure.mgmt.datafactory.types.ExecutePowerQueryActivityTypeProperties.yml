  name: sourceStagingConcurrency
  signature: 'sourceStagingConcurrency: Any'
- uid: azure.mgmt.datafactory.types.ExecutePowerQueryActivityTypeProperties.staging
  name: staging
  signature: 'staging: DataFlowStagingInfo'
- uid: azure.mgmt.datafactory.types.ExecutePowerQueryActivityTypeProperties.traceLevel
  name: traceLevel
  signature: 'traceLevel: Any'
