  name: continueOnError
  signature: 'continueOnError: Any'
- uid: azure.mgmt.datafactory.types.ExecutePowerQueryActivityTypeProperties.dataFlow
  name: dataFlow
  signature: 'dataFlow: DataFlowReference'
- uid: azure.mgmt.datafactory.types.ExecutePowerQueryActivityTypeProperties.integrationRuntime
  name: integrationRuntime
  signature: 'integrationRuntime: IntegrationRuntimeReference'
- uid: azure.mgmt.datafactory.types.ExecutePowerQueryActivityTypeProperties.runConcurrently
  name: runConcurrently
  signature: 'runConcurrently: Any'
