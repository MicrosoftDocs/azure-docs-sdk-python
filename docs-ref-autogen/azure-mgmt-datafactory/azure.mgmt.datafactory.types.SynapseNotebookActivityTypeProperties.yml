    notebook you provide. Type: integer (or Expression with resultType integer).'
  signature: 'numExecutors: Any'
- uid: azure.mgmt.datafactory.types.SynapseNotebookActivityTypeProperties.parameters
  name: parameters
  summary: Notebook parameters.
  signature: 'parameters: dict[str, ''NotebookParameter'']'
- uid: azure.mgmt.datafactory.types.SynapseNotebookActivityTypeProperties.sparkConfig
  name: sparkConfig
  summary: Spark configuration property.
  signature: 'sparkConfig: dict[str, Any]'
- uid: azure.mgmt.datafactory.types.SynapseNotebookActivityTypeProperties.sparkPool
  name: sparkPool
  summary: The name of the big data pool which will be used to execute the notebook.
  signature: 'sparkPool: BigDataPoolParametrizationReference'
- uid: azure.mgmt.datafactory.types.SynapseNotebookActivityTypeProperties.targetSparkConfiguration
  name: targetSparkConfiguration
  summary: The spark configuration of the spark job.
  signature: 'targetSparkConfiguration: SparkConfigurationParametrizationReference'
