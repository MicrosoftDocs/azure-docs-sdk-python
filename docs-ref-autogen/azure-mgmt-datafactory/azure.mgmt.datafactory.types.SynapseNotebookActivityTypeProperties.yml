### YamlMime:PythonClass
uid: azure.mgmt.datafactory.types.SynapseNotebookActivityTypeProperties
name: SynapseNotebookActivityTypeProperties
fullName: azure.mgmt.datafactory.types.SynapseNotebookActivityTypeProperties
module: azure.mgmt.datafactory.types
summary: Execute Synapse notebook activity properties.
constructor:
  syntax: SynapseNotebookActivityTypeProperties()
variables:
- description: Synapse notebook reference. Required.
  name: notebook
  types:
  - <xref:<xref:"SynapseNotebookReference">>
- description: The name of the big data pool which will be used to execute the notebook.
  name: spark_pool
  types:
  - <xref:<xref:"BigDataPoolParametrizationReference">>
- description: Notebook parameters.
  name: parameters
  types:
  - <xref:dict>[<xref:str>, <xref:"NotebookParameter">]
- description: 'Number of core and memory to be used for executors allocated in the

    specified Spark pool for the session, which will be used for overriding ''executorCores''
    and

    ''executorMemory'' of the notebook you provide. Type: string (or Expression with
    resultType

    string).'
  name: executor_size
  types:
  - <xref:typing.Any>
- description: 'Spark configuration properties, which will override the ''conf'' of
    the notebook you

    provide.'
  name: conf
  types:
  - <xref:typing.Any>
- description: 'Number of core and memory to be used for driver allocated in the specified

    Spark pool for the session, which will be used for overriding ''driverCores''
    and ''driverMemory''

    of the notebook you provide. Type: string (or Expression with resultType string).'
  name: driver_size
  types:
  - <xref:typing.Any>
- description: 'Number of executors to launch for this session, which will override
    the

    ''numExecutors'' of the notebook you provide. Type: integer (or Expression with
    resultType

    integer).'
  name: num_executors
  types:
  - <xref:typing.Any>
- description: 'The type of the spark config. Known values are: "Default",

    "Customized", and "Artifact".'
  name: configuration_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConfigurationType">]
- description: The spark configuration of the spark job.
  name: target_spark_configuration
  types:
  - <xref:<xref:"SparkConfigurationParametrizationReference">>
- description: Spark configuration property.
  name: spark_config
  types:
  - <xref:dict>[<xref:str>, <xref:typing.Any>]
attributes:
- uid: azure.mgmt.datafactory.types.SynapseNotebookActivityTypeProperties.conf
  name: conf
  summary: Spark configuration properties, which will override the 'conf' of the notebook
    you provide.
  signature: 'conf: Any'
- uid: azure.mgmt.datafactory.types.SynapseNotebookActivityTypeProperties.configurationType
  name: configurationType
  summary: '"Default", "Customized", and "Artifact".'
  signature: 'configurationType: str | ConfigurationType'
- uid: azure.mgmt.datafactory.types.SynapseNotebookActivityTypeProperties.driverSize
  name: driverSize
  summary: 'Number of core and memory to be used for driver allocated in the specified
    Spark pool for the

    session, which will be used for overriding ''driverCores'' and ''driverMemory''
    of the notebook you

    provide. Type: string (or Expression with resultType string).'
  signature: 'driverSize: Any'
- uid: azure.mgmt.datafactory.types.SynapseNotebookActivityTypeProperties.executorSize
  name: executorSize
  summary: 'Number of core and memory to be used for executors allocated in the specified
    Spark pool for

    the session, which will be used for overriding ''executorCores'' and ''executorMemory''
    of the

    notebook you provide. Type: string (or Expression with resultType string).'
  signature: 'executorSize: Any'
- uid: azure.mgmt.datafactory.types.SynapseNotebookActivityTypeProperties.notebook
  name: notebook
  summary: Synapse notebook reference. Required.
  signature: 'notebook: Required[SynapseNotebookReference]'
