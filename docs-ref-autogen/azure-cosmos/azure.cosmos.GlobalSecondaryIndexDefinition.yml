### YamlMime:PythonClass
uid: azure.cosmos.GlobalSecondaryIndexDefinition
name: GlobalSecondaryIndexDefinition
fullName: azure.cosmos.GlobalSecondaryIndexDefinition
module: azure.cosmos
summary: '**provisional** Definition for a Global Secondary Index (GSI) container.


  A GSI container is a derived container built from a source container

  using a SQL-like projection query. The GSI definition is immutable after creation.


  > [!NOTE]

  > A maximum of 5 GSI containers can be created per source container.

  >

  > All GSI containers must be deleted before deleting the source container.

  >'
constructor:
  syntax: 'GlobalSecondaryIndexDefinition(source_container_id: str, definition: str)'
  parameters:
  - name: source_container_id
    description: The ID of the source container the GSI is derived from. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: definition
    description: The SQL-like projection query that defines the GSI. Required.
    isRequired: true
    types:
    - <xref:str>
attributes:
- uid: azure.cosmos.GlobalSecondaryIndexDefinition.definition
  name: definition
  summary: The SQL-like projection query that defines the GSI.
  return:
    description: The projection query.
    types:
    - <xref:str>
- uid: azure.cosmos.GlobalSecondaryIndexDefinition.source_container_id
  name: source_container_id
  summary: The ID of the source container.
  return:
    description: The source container ID.
    types:
    - <xref:str>
- uid: azure.cosmos.GlobalSecondaryIndexDefinition.source_container_rid
  name: source_container_rid
  summary: The server-populated resource ID (_rid) of the source container. Read-only.
  return:
    description: The source container resource ID, or None if not yet populated.
    types:
    - <xref:str>
    - <xref:None>
- uid: azure.cosmos.GlobalSecondaryIndexDefinition.status
  name: status
  summary: 'The GSI build status. Read-only, server-populated.


    Possible values: "Initializing", "InitialBuildAfterCreate",

    "InitialBuildAfterRestore", "Active", "DeleteInProgress"'
  return:
    description: The GSI status, or None if not yet populated.
    types:
    - <xref:str>
    - <xref:None>
