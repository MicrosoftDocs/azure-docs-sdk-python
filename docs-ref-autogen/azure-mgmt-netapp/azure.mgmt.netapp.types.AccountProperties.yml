### YamlMime:PythonClass
uid: azure.mgmt.netapp.types.AccountProperties
name: AccountProperties
fullName: azure.mgmt.netapp.types.AccountProperties
module: azure.mgmt.netapp.types
summary: NetApp account properties.
constructor:
  syntax: AccountProperties()
variables:
- description: Azure lifecycle management.
  name: provisioning_state
  types:
  - <xref:str>
- description: Active Directories.
  name: active_directories
  types:
  - <xref:list>[<xref:"ActiveDirectory">]
- description: Encryption settings.
  name: encryption
  types:
  - <xref:<xref:"AccountEncryption">>
- description: 'Shows the status of disableShowmount for all volumes under the

    subscription, null equals false.'
  name: disable_showmount
  types:
  - <xref:bool>
- description: 'Domain for NFSv4 user ID mapping. This property will be set for all

    NetApp accounts in the subscription and region and only affect non ldap NFSv4
    volumes.'
  name: nfs_v4_id_domain
  types:
  - <xref:str>
- description: 'MultiAD Status for the account. Known values are: "Disabled" and

    "Enabled".'
  name: multi_ad_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MultiAdStatus">]
attributes:
- uid: azure.mgmt.netapp.types.AccountProperties.activeDirectories
  name: activeDirectories
  summary: Active Directories.
  signature: 'activeDirectories: list[''ActiveDirectory'']'
- uid: azure.mgmt.netapp.types.AccountProperties.disableShowmount
  name: disableShowmount
  summary: Shows the status of disableShowmount for all volumes under the subscription,
    null equals false.
  signature: 'disableShowmount: bool | None'
- uid: azure.mgmt.netapp.types.AccountProperties.encryption
  name: encryption
  summary: Encryption settings.
  signature: 'encryption: AccountEncryption'
- uid: azure.mgmt.netapp.types.AccountProperties.multiAdStatus
  name: multiAdStatus
  summary: '"Disabled" and "Enabled".'
  signature: 'multiAdStatus: str | MultiAdStatus'
- uid: azure.mgmt.netapp.types.AccountProperties.nfsV4IDDomain
  name: nfsV4IDDomain
  summary: 'Domain for NFSv4 user ID mapping. This property will be set for all NetApp
    accounts in the

    subscription and region and only affect non ldap NFSv4 volumes.'
  signature: 'nfsV4IDDomain: str | None'
- uid: azure.mgmt.netapp.types.AccountProperties.provisioningState
  name: provisioningState
  summary: Azure lifecycle management.
  signature: 'provisioningState: str'
