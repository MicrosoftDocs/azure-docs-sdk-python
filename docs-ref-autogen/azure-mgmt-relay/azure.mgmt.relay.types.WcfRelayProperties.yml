### YamlMime:PythonClass
uid: azure.mgmt.relay.types.WcfRelayProperties
name: WcfRelayProperties
fullName: azure.mgmt.relay.types.WcfRelayProperties
module: azure.mgmt.relay.types
summary: Properties of the WCF relay.
constructor:
  syntax: WcfRelayProperties()
variables:
- description: Returns true if the relay is dynamic; otherwise, false.
  name: is_dynamic
  types:
  - <xref:bool>
- description: The time the WCF relay was created.
  name: created_at
  types:
  - <xref:str>
- description: The time the namespace was updated.
  name: updated_at
  types:
  - <xref:str>
- description: 'The number of listeners for this relay. Note that min :1 and max:25
    are

    supported.'
  name: listener_count
  types:
  - <xref:int>
- description: 'WCF relay type. Known values are: "NetTcp" and "Http".'
  name: relay_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Relaytype">]
- description: 'Returns true if client authorization is needed for this

    relay; otherwise, false.'
  name: requires_client_authorization
  types:
  - <xref:bool>
- description: 'Returns true if transport security is needed for this relay;

    otherwise, false.'
  name: requires_transport_security
  types:
  - <xref:bool>
- description: 'The usermetadata is a placeholder to store user-defined string data
    for

    the WCF Relay endpoint. For example, it can be used to store descriptive data,
    such as list of

    teams and their contact information. Also, user-defined configuration settings
    can be stored.'
  name: user_metadata
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.relay.types.WcfRelayProperties.createdAt
  name: createdAt
  summary: The time the WCF relay was created.
  signature: 'createdAt: str'
- uid: azure.mgmt.relay.types.WcfRelayProperties.isDynamic
  name: isDynamic
  summary: Returns true if the relay is dynamic; otherwise, false.
  signature: 'isDynamic: bool'
- uid: azure.mgmt.relay.types.WcfRelayProperties.listenerCount
  name: listenerCount
  summary: 25 are supported.
  signature: 'listenerCount: int'
- uid: azure.mgmt.relay.types.WcfRelayProperties.relayType
  name: relayType
  summary: '"NetTcp" and "Http".'
  signature: 'relayType: str | Relaytype'
- uid: azure.mgmt.relay.types.WcfRelayProperties.requiresClientAuthorization
  name: requiresClientAuthorization
  summary: Returns true if client authorization is needed for this relay; otherwise,
    false.
  signature: 'requiresClientAuthorization: bool'
- uid: azure.mgmt.relay.types.WcfRelayProperties.requiresTransportSecurity
  name: requiresTransportSecurity
  summary: Returns true if transport security is needed for this relay; otherwise,
    false.
  signature: 'requiresTransportSecurity: bool'
- uid: azure.mgmt.relay.types.WcfRelayProperties.updatedAt
  name: updatedAt
  summary: The time the namespace was updated.
  signature: 'updatedAt: str'
- uid: azure.mgmt.relay.types.WcfRelayProperties.userMetadata
  name: userMetadata
  summary: 'The usermetadata is a placeholder to store user-defined string data for
    the WCF Relay endpoint.

    For example, it can be used to store descriptive data, such as list of teams and
    their contact

    information. Also, user-defined configuration settings can be stored.'
  signature: 'userMetadata: str'
