uid: azure.mgmt.guestconfig.types.GuestConfigurationNavigation
name: GuestConfigurationNavigation
fullName: azure.mgmt.guestconfig.types.GuestConfigurationNavigation
module: azure.mgmt.guestconfig.types
summary: 'Guest configuration is an artifact that encapsulates DSC configuration and
  its dependencies.

  The artifact is a zip file containing DSC configuration (as MOF) and dependent resources
  and

  other dependencies like modules.'
constructor:
  syntax: GuestConfigurationNavigation()
variables:
- description: Kind of the guest configuration. For example:DSC. "DSC"
  name: kind
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Kind">]
- description: Name of the guest configuration.
  name: name
  types:
  - <xref:str>
- description: Version of the guest configuration.
  name: version
  types:
  - <xref:str>
- description: Uri of the storage where guest configuration package is uploaded.
  name: content_uri
  types:
  - <xref:str>
- description: 'Combined hash of the guest configuration package and configuration

    parameters.'
  name: content_hash
  types:
  - <xref:str>
- description: 'Managed identity with storage access of the guest configuration

    package and configuration parameters.'
  name: content_managed_identity
  types:
  - <xref:str>
- description: 'Specifies the assignment type and execution of the configuration.

    Possible values are Audit, DeployAndAutoCorrect, ApplyAndAutoCorrect and ApplyAndMonitor.
    Known

    values are: "Audit", "DeployAndAutoCorrect", "ApplyAndAutoCorrect", and "ApplyAndMonitor".'
  name: assignment_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AssignmentType">]
- description: Specifies the origin of the configuration.
  name: assignment_source
  types:
  - <xref:str>
- description: 'Specifies the content type of the configuration. Possible values could
    be

    Builtin or Custom.'
  name: content_type
  types:
  - <xref:str>
- description: The configuration parameters for the guest configuration.
  name: configuration_parameter
