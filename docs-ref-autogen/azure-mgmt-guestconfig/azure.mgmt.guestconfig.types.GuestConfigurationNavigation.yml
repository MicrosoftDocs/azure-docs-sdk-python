  - <xref:list>[<xref:"ConfigurationParameter">]
- description: 'The protected configuration parameters for the guest

    configuration.'
  name: configuration_protected_parameter
  types:
  - <xref:list>[<xref:"ConfigurationParameter">]
- description: The configuration setting for the guest configuration.
  name: configuration_setting
  types:
  - <xref:<xref:"ConfigurationSetting">>
