### YamlMime:PythonClass
uid: azure.mgmt.discovery.types.SupercomputerIdentities
name: SupercomputerIdentities
fullName: azure.mgmt.discovery.types.SupercomputerIdentities
module: azure.mgmt.discovery.types
summary: Dictionary of identity properties for the Supercomputer.
constructor:
  syntax: SupercomputerIdentities()
variables:
- description: Cluster identity ID. Required.
  name: cluster_identity
  types:
  - <xref:<xref:"Identity">>
- description: 'Kubelet identity ID used by the supercomputer. This identity is used
    by

    the supercomputer at node level to access Azure resources. This identity must
    have

    ManagedIdentityOperator role on the clusterIdentity. Required.'
  name: kubelet_identity
  types:
  - <xref:<xref:"Identity">>
- description: 'User assigned identity IDs to be used by workloads as federated

    credentials running on supercomputer. The key value must be the resource ID of
    the identity

    resource.'
  name: workload_identities
  types:
  - <xref:dict>[<xref:str>, <xref:"UserAssignedIdentity">]
attributes:
- uid: azure.mgmt.discovery.types.SupercomputerIdentities.clusterIdentity
  name: clusterIdentity
  summary: Cluster identity ID. Required.
  signature: 'clusterIdentity: Identity'
- uid: azure.mgmt.discovery.types.SupercomputerIdentities.kubeletIdentity
  name: kubeletIdentity
  summary: 'Kubelet identity ID used by the supercomputer. This identity is used by
    the supercomputer at

    node level to access Azure resources. This identity must have ManagedIdentityOperator
    role on

    the clusterIdentity. Required.'
  signature: 'kubeletIdentity: Identity'
- uid: azure.mgmt.discovery.types.SupercomputerIdentities.workloadIdentities
  name: workloadIdentities
  summary: 'User assigned identity IDs to be used by workloads as federated credentials
    running on

    supercomputer. The key value must be the resource ID of the identity resource.'
  signature: 'workloadIdentities: dict[str, azure.mgmt.discovery.types.UserAssignedIdentity]'
