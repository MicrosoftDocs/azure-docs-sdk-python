### YamlMime:PythonClass
uid: azure.mgmt.discovery.types.ChatModelDeploymentProperties
name: ChatModelDeploymentProperties
fullName: azure.mgmt.discovery.types.ChatModelDeploymentProperties
module: azure.mgmt.discovery.types
summary: 'Defines a deployment binding a specific model family to a user-defined deployment
  name for chat

  inference.'
constructor:
  syntax: ChatModelDeploymentProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Accepted", "Provisioning", "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Model format as published by the provider. Verify supported formats
    per

    region using the Model Catalog API. Required.'
  name: model_format
  types:
  - <xref:str>
- description: 'Canonical provider model name available in the selected region. Verify

    supported values per region using the Model Catalog API. Required.'
  name: model_name
  types:
  - <xref:str>
- description: Provider-published version of the selected model.
  name: model_version
  types:
  - <xref:str>
- description: SKU tier used by this chat model deployment.
  name: sku_name
  types:
  - <xref:str>
- description: Provisioned SKU capacity units for this chat model deployment.
  name: capacity
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.discovery.types.ChatModelDeploymentProperties.capacity
  name: capacity
  summary: Provisioned SKU capacity units for this chat model deployment.
  signature: 'capacity: int'
- uid: azure.mgmt.discovery.types.ChatModelDeploymentProperties.modelFormat
  name: modelFormat
  summary: 'Model format as published by the provider. Verify supported formats per
    region using the Model

    Catalog API. Required.'
  signature: 'modelFormat: Required[str]'
- uid: azure.mgmt.discovery.types.ChatModelDeploymentProperties.modelName
  name: modelName
  summary: 'Canonical provider model name available in the selected region. Verify
    supported values per

    region using the Model Catalog API. Required.'
  signature: 'modelName: Required[str]'
- uid: azure.mgmt.discovery.types.ChatModelDeploymentProperties.modelVersion
  name: modelVersion
  summary: Provider-published version of the selected model.
  signature: 'modelVersion: str'
- uid: azure.mgmt.discovery.types.ChatModelDeploymentProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Accepted", "Provisioning", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.discovery.types.ChatModelDeploymentProperties.skuName
  name: skuName
  summary: SKU tier used by this chat model deployment.
  signature: 'skuName: str'
