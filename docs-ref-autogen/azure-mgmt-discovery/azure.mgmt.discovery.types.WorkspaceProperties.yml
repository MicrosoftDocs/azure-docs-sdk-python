### YamlMime:PythonClass
uid: azure.mgmt.discovery.types.WorkspaceProperties
name: WorkspaceProperties
fullName: azure.mgmt.discovery.types.WorkspaceProperties
module: azure.mgmt.discovery.types
summary: Workspace properties.
constructor:
  syntax: WorkspaceProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Accepted", "Provisioning", "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: List of linked SuperComputers.
  name: supercomputer_ids
  types:
  - <xref:list>[<xref:str>]
- description: workspace API endpoint Uri.
  name: workspace_api_uri
  types:
  - <xref:str>
- description: workspace User Interface Uri.
  name: workspace_ui_uri
  types:
  - <xref:str>
- description: Identity IDs used for leveraging Workspace resources. Required.
  name: workspace_identity
  types:
  - <xref:<xref:"Identity">>
- description: 'Whether or not to use a customer managed key when encrypting data

    at rest. Known values are: "Enabled" and "Disabled".'
  name: customer_managed_keys
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CustomerManagedKeys">]
- description: 'The key to use for encrypting data at rest when customer managed

    keys are enabled.'
  name: key_vault_properties
  types:
  - <xref:<xref:"KeyVaultProperties">>
- description: 'The Log Analytics Cluster to use for debug logs. This is

    required when Customer Managed Keys are enabled.'
  name: log_analytics_cluster_id
  types:
  - <xref:str>
- description: List of private endpoint connections.
  name: private_endpoint_connections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: 'Whether or not public network access is allowed for this resource.

    For security reasons, it is recommended to disable it whenever possible. Known
    values are:

    "Enabled" and "Disabled".'
  name: public_network_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: Agent Subnet ID for agent resources.
  name: agent_subnet_id
  types:
  - <xref:str>
- description: Private Endpoint Subnet ID for private endpoint connections.
  name: private_endpoint_subnet_id
  types:
  - <xref:str>
- description: Function Subnet ID for workspace resources.
  name: workspace_subnet_id
  types:
  - <xref:str>
- description: The resource group for resources managed on behalf of customer.
  name: managed_resource_group
  types:
  - <xref:str>
- description: 'Managed-On-Behalf-Of configuration properties. This

    configuration exists for the resources where a resource provider manages those
    resources on

    behalf of the resource owner.'
  name: managed_on_behalf_of_configuration
  types:
  - <xref:<xref:"WithMoboBrokerResources">>
attributes:
- uid: azure.mgmt.discovery.types.WorkspaceProperties.agentSubnetId
  name: agentSubnetId
  summary: Agent Subnet ID for agent resources.
  signature: 'agentSubnetId: str'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.customerManagedKeys
  name: customerManagedKeys
  summary: 'Whether or not to use a customer managed key when encrypting data at rest.
    Known values are:

    "Enabled" and "Disabled".'
  signature: 'customerManagedKeys: str | CustomerManagedKeys'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.keyVaultProperties
  name: keyVaultProperties
  summary: The key to use for encrypting data at rest when customer managed keys are
    enabled.
  signature: 'keyVaultProperties: KeyVaultProperties'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.logAnalyticsClusterId
  name: logAnalyticsClusterId
  summary: 'The Log Analytics Cluster to use for debug logs. This is required when
    Customer Managed Keys

    are enabled.'
  signature: 'logAnalyticsClusterId: str'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.managedOnBehalfOfConfiguration
  name: managedOnBehalfOfConfiguration
  summary: 'Managed-On-Behalf-Of configuration properties. This configuration exists
    for the resources

    where a resource provider manages those resources on behalf of the resource owner.'
  signature: 'managedOnBehalfOfConfiguration: WithMoboBrokerResources'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.managedResourceGroup
  name: managedResourceGroup
  summary: The resource group for resources managed on behalf of customer.
  signature: 'managedResourceGroup: str'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.privateEndpointConnections
  name: privateEndpointConnections
  summary: List of private endpoint connections.
  signature: 'privateEndpointConnections: list[''PrivateEndpointConnection'']'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.privateEndpointSubnetId
  name: privateEndpointSubnetId
  summary: Private Endpoint Subnet ID for private endpoint connections.
  signature: 'privateEndpointSubnetId: str'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Accepted", "Provisioning", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.publicNetworkAccess
  name: publicNetworkAccess
  summary: 'Whether or not public network access is allowed for this resource. For
    security reasons, it is

    recommended to disable it whenever possible. Known values are: "Enabled" and "Disabled".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.supercomputerIds
  name: supercomputerIds
  summary: List of linked SuperComputers.
  signature: 'supercomputerIds: list[str]'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.workspaceApiUri
  name: workspaceApiUri
  summary: workspace API endpoint Uri.
  signature: 'workspaceApiUri: str'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.workspaceIdentity
  name: workspaceIdentity
  summary: Identity IDs used for leveraging Workspace resources. Required.
  signature: 'workspaceIdentity: Required[Identity]'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.workspaceSubnetId
  name: workspaceSubnetId
  summary: Function Subnet ID for workspace resources.
  signature: 'workspaceSubnetId: str'
- uid: azure.mgmt.discovery.types.WorkspaceProperties.workspaceUiUri
  name: workspaceUiUri
  summary: workspace User Interface Uri.
  signature: 'workspaceUiUri: str'
