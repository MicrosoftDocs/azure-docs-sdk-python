### YamlMime:PythonClass
uid: azure.mgmt.discovery.types.NodePoolProperties
name: NodePoolProperties
fullName: azure.mgmt.discovery.types.NodePoolProperties
module: azure.mgmt.discovery.types
summary: NodePool properties.
constructor:
  syntax: NodePoolProperties()
variables:
- description: 'The status of the last operation. Known values are: "Succeeded",

    "Failed", "Canceled", "Accepted", "Provisioning", "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The node pool subnet. Required.
  name: subnet_id
  types:
  - <xref:str>
- description: 'The size of the underlying Azure VM. Required. Known values are:

    "Standard_NC24ads_A100_v4", "Standard_NC48ads_A100_v4", "Standard_NC96ads_A100_v4",

    "Standard_NC4as_T4_v3", "Standard_NC8as_T4_v3", "Standard_NC16as_T4_v3",

    "Standard_NC64as_T4_v3", "Standard_NV6ads_A10_v5", "Standard_NV12ads_A10_v5",

    "Standard_NV24ads_A10_v5", "Standard_NV36ads_A10_v5", "Standard_NV36adms_A10_v5",

    "Standard_NV72ads_A10_v5", and "Standard_ND40rs_v2".'
  name: vm_size
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VmSize">]
- description: The maximum number of nodes. Required.
  name: max_node_count
  types:
  - <xref:int>
- description: The minimum number of nodes.
  name: min_node_count
  types:
  - <xref:int>
- description: 'The Virtual Machine Scale Set priority. If not specified, the default

    is ''Regular''. Known values are: "Regular" and "Spot".'
  name: scale_set_priority
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScaleSetPriority">]
- description: The size of the OS disk in GB. If not specified, the default is 120
    GB.
  name: os_disk_size_gb
  types:
  - <xref:int>
- description: 'The percent of disk usage before which image garbage

    collection is never run. This cannot be set higher than imageCacheUpperThreshold.
    The default

    is 40%.'
  name: image_cache_lower_threshold
  types:
  - <xref:int>
- description: 'The percent of disk usage after which image garbage

    collection is guaranteed to run. The default is 60%.'
  name: image_cache_upper_threshold
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.discovery.types.NodePoolProperties.imageCacheLowerThreshold
  name: imageCacheLowerThreshold
  summary: 'The percent of disk usage before which image garbage collection is never
    run. This cannot be

    set higher than imageCacheUpperThreshold. The default is 40%.'
  signature: 'imageCacheLowerThreshold: int'
- uid: azure.mgmt.discovery.types.NodePoolProperties.imageCacheUpperThreshold
  name: imageCacheUpperThreshold
  summary: 'The percent of disk usage after which image garbage collection is guaranteed
    to run. The

    default is 60%.'
  signature: 'imageCacheUpperThreshold: int'
- uid: azure.mgmt.discovery.types.NodePoolProperties.maxNodeCount
  name: maxNodeCount
  summary: The maximum number of nodes. Required.
  signature: 'maxNodeCount: Required[int]'
- uid: azure.mgmt.discovery.types.NodePoolProperties.minNodeCount
  name: minNodeCount
  summary: The minimum number of nodes.
  signature: 'minNodeCount: int'
- uid: azure.mgmt.discovery.types.NodePoolProperties.osDiskSizeGb
  name: osDiskSizeGb
  summary: The size of the OS disk in GB. If not specified, the default is 120 GB.
  signature: 'osDiskSizeGb: int'
- uid: azure.mgmt.discovery.types.NodePoolProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    "Accepted", "Provisioning", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.discovery.types.NodePoolProperties.scaleSetPriority
  name: scaleSetPriority
  summary: 'The Virtual Machine Scale Set priority. If not specified, the default
    is ''Regular''. Known

    values are: "Regular" and "Spot".'
  signature: 'scaleSetPriority: str | ScaleSetPriority'
- uid: azure.mgmt.discovery.types.NodePoolProperties.subnetId
  name: subnetId
  summary: The node pool subnet. Required.
  signature: 'subnetId: Required[str]'
- uid: azure.mgmt.discovery.types.NodePoolProperties.vmSize
  name: vmSize
  summary: '"Standard_NC24ads_A100_v4",

    "Standard_NC48ads_A100_v4", "Standard_NC96ads_A100_v4", "Standard_NC4as_T4_v3",

    "Standard_NC8as_T4_v3", "Standard_NC16as_T4_v3", "Standard_NC64as_T4_v3",

    "Standard_NV6ads_A10_v5", "Standard_NV12ads_A10_v5", "Standard_NV24ads_A10_v5",

    "Standard_NV36ads_A10_v5", "Standard_NV36adms_A10_v5", "Standard_NV72ads_A10_v5",
    and

    "Standard_ND40rs_v2".'
  signature: 'vmSize: Required[str | VmSize]'
