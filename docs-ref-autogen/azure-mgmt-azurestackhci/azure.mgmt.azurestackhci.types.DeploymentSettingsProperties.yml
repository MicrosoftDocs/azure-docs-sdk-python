### YamlMime:PythonClass
uid: azure.mgmt.azurestackhci.types.DeploymentSettingsProperties
name: DeploymentSettingsProperties
fullName: azure.mgmt.azurestackhci.types.DeploymentSettingsProperties
module: azure.mgmt.azurestackhci.types
summary: DeploymentSetting properties.
constructor:
  syntax: DeploymentSettingsProperties()
variables:
- description: 'DeploymentSetting provisioning state. Known values are:

    "NotSpecified", "Error", "Succeeded", "Failed", "Canceled", "Connected", "Disconnected",

    "Deleted", "Creating", "Updating", "Deleting", "Moving", "PartiallySucceeded",

    "PartiallyConnected", "InProgress", "Accepted", "Provisioning", and "DisableInProgress".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Azure resource ids of Arc machines to be part of cluster.

    Required.'
  name: arc_node_resource_ids
  types:
  - <xref:list>[<xref:str>]
- description: 'The deployment mode for cluster deployment. Required. Known values
    are:

    "Validate" and "Deploy".'
  name: deployment_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentMode">]
- description: 'The intended operation for a cluster. Known values are:

    "ClusterProvisioning" and "ClusterUpgrade".'
  name: operation_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperationType">]
- description: Scale units will contains list of deployment data. Required.
  name: deployment_configuration
  types:
  - <xref:<xref:"DeploymentConfiguration">>
- description: Deployment Status reported from cluster.
  name: reported_properties
  types:
  - <xref:<xref:"EceReportedProperties">>
attributes:
- uid: azure.mgmt.azurestackhci.types.DeploymentSettingsProperties.arcNodeResourceIds
  name: arcNodeResourceIds
  summary: Azure resource ids of Arc machines to be part of cluster. Required.
  signature: 'arcNodeResourceIds: Required[list[str]]'
- uid: azure.mgmt.azurestackhci.types.DeploymentSettingsProperties.deploymentConfiguration
  name: deploymentConfiguration
  summary: Scale units will contains list of deployment data. Required.
  signature: 'deploymentConfiguration: Required[DeploymentConfiguration]'
- uid: azure.mgmt.azurestackhci.types.DeploymentSettingsProperties.deploymentMode
  name: deploymentMode
  summary: '"Validate" and

    "Deploy".'
  signature: 'deploymentMode: Required[str | DeploymentMode]'
- uid: azure.mgmt.azurestackhci.types.DeploymentSettingsProperties.operationType
  name: operationType
  summary: '"ClusterProvisioning" and

    "ClusterUpgrade".'
  signature: 'operationType: str | OperationType'
- uid: azure.mgmt.azurestackhci.types.DeploymentSettingsProperties.provisioningState
  name: provisioningState
  summary: '"NotSpecified", "Error",

    "Succeeded", "Failed", "Canceled", "Connected", "Disconnected", "Deleted",

    "Creating", "Updating", "Deleting", "Moving", "PartiallySucceeded",

    "PartiallyConnected", "InProgress", "Accepted", "Provisioning", and

    "DisableInProgress".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.azurestackhci.types.DeploymentSettingsProperties.reportedProperties
  name: reportedProperties
  summary: Deployment Status reported from cluster.
  signature: 'reportedProperties: EceReportedProperties'
