uid: azure.mgmt.azurestackhci.types.LogCollectionJobSession
name: LogCollectionJobSession
fullName: azure.mgmt.azurestackhci.types.LogCollectionJobSession
module: azure.mgmt.azurestackhci.types
summary: Represents a session for collecting logs from an edge device.
constructor:
  syntax: LogCollectionJobSession()
variables:
- description: The timestamp when log collection started, in ISO 8601 format.
  name: start_time
  types:
  - <xref:str>
- description: The timestamp when log collection ended, in ISO 8601 format.
  name: end_time
  types:
  - <xref:str>
- description: The total time logs were collected for, in ISO 8601 duration format.
  name: time_collected
  types:
  - <xref:str>
- description: The size of the collected logs in bytes.
  name: log_size
  types:
  - <xref:int>
- description: 'The status of the log collection session. Known values are: "NotStarted",

    "Running", "Failed", "Succeeded", and "Canceled".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeviceLogCollectionStatus">]
- description: 'A unique identifier for correlating this log collection session with

    other operations or sessions.'
  name: correlation_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.azurestackhci.types.LogCollectionJobSession.correlationId
  name: correlationId
  summary: 'A unique identifier for correlating this log collection session with other
    operations or

