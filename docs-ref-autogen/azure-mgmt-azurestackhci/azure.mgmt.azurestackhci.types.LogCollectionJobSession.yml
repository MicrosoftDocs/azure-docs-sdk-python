  signature: 'correlationId: str'
- uid: azure.mgmt.azurestackhci.types.LogCollectionJobSession.endTime
  name: endTime
  summary: The timestamp when log collection ended, in ISO 8601 format.
  signature: 'endTime: str'
- uid: azure.mgmt.azurestackhci.types.LogCollectionJobSession.logSize
  name: logSize
  summary: The size of the collected logs in bytes.
  signature: 'logSize: int'
