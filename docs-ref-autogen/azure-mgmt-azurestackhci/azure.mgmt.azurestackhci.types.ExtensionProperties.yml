### YamlMime:PythonClass
uid: azure.mgmt.azurestackhci.types.ExtensionProperties
name: ExtensionProperties
fullName: azure.mgmt.azurestackhci.types.ExtensionProperties
module: azure.mgmt.azurestackhci.types
summary: Status of Arc Extension for a particular node in HCI Cluster.
constructor:
  syntax: ExtensionProperties()
variables:
- description: 'Provisioning state of the Extension proxy resource. Indicates the

    current lifecycle status of the resource, such as whether it''s being created,
    updated, deleted,

    or has encountered an error. Known values are: "NotSpecified", "Error", "Succeeded",
    "Failed",

    "Canceled", "Connected", "Disconnected", "Deleted", "Creating", "Updating", "Deleting",

    "Moving", "PartiallySucceeded", "PartiallyConnected", "InProgress", "Accepted",
    "Provisioning",

    and "DisableInProgress".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: Parameters specific to this extension type.
  name: extension_parameters
  types:
  - <xref:<xref:"ExtensionParameters">>
- description: 'Aggregate state of Arc Extensions across the nodes in this HCI cluster.

    This reflects the overall status of the extension deployment and operation across
    all nodes.

    Known values are: "NotSpecified", "Error", "Succeeded", "Canceled", "Failed",
    "Connected",

    "Disconnected", "Deleted", "Creating", "Updating", "Deleting", "Moving", "PartiallySucceeded",

    "PartiallyConnected", "InProgress", "Accepted", "Provisioning", and

    "UpgradeFailedRollbackSucceeded".'
  name: aggregate_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExtensionAggregateState">]
- description: State of Arc Extension in each of the nodes.
  name: per_node_extension_details
  types:
  - <xref:list>[<xref:"PerNodeExtensionState">]
- description: 'Indicates if the extension is managed by Azure or the user. This determines

    who controls the deployment and lifecycle of the extension. Known values are:
    "User" and

    "Azure".'
  name: managed_by
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExtensionManagedBy">]
attributes:
- uid: azure.mgmt.azurestackhci.types.ExtensionProperties.aggregateState
  name: aggregateState
  summary: 'Aggregate state of Arc Extensions across the nodes in this HCI cluster.
    This reflects the

    overall status of the extension deployment and operation across all nodes. Known
    values are:

    "NotSpecified", "Error", "Succeeded", "Canceled", "Failed", "Connected",

    "Disconnected", "Deleted", "Creating", "Updating", "Deleting", "Moving",

    "PartiallySucceeded", "PartiallyConnected", "InProgress", "Accepted", "Provisioning",

    and "UpgradeFailedRollbackSucceeded".'
  signature: 'aggregateState: str | ExtensionAggregateState'
- uid: azure.mgmt.azurestackhci.types.ExtensionProperties.extensionParameters
  name: extensionParameters
  summary: Parameters specific to this extension type.
  signature: 'extensionParameters: ExtensionParameters'
- uid: azure.mgmt.azurestackhci.types.ExtensionProperties.managedBy
  name: managedBy
  summary: 'Indicates if the extension is managed by Azure or the user. This determines
    who controls the

    deployment and lifecycle of the extension. Known values are: "User" and "Azure".'
  signature: 'managedBy: str | ExtensionManagedBy'
- uid: azure.mgmt.azurestackhci.types.ExtensionProperties.perNodeExtensionDetails
  name: perNodeExtensionDetails
  summary: State of Arc Extension in each of the nodes.
  signature: 'perNodeExtensionDetails: list[''PerNodeExtensionState'']'
- uid: azure.mgmt.azurestackhci.types.ExtensionProperties.provisioningState
  name: provisioningState
  summary: 'Provisioning state of the Extension proxy resource. Indicates the current
    lifecycle status of

    the resource, such as whether it''s being created, updated, deleted, or has encountered
    an

    error. Known values are: "NotSpecified", "Error", "Succeeded", "Failed", "Canceled",

    "Connected", "Disconnected", "Deleted", "Creating", "Updating", "Deleting",

    "Moving", "PartiallySucceeded", "PartiallyConnected", "InProgress", "Accepted",

    "Provisioning", and "DisableInProgress".'
  signature: 'provisioningState: str | ProvisioningState'
