### YamlMime:PythonClass
uid: azure.mgmt.azurestackhci.types.Storage
name: Storage
fullName: azure.mgmt.azurestackhci.types.Storage
module: azure.mgmt.azurestackhci.types
summary: The Storage config of AzureStackHCI Cluster.
constructor:
  syntax: Storage()
variables:
- description: 'By default, this mode is set to Express and your storage is

    configured as per best practices based on the number of nodes in the cluster.
    Allowed values

    are ''Express'',''InfraOnly'', ''KeepStorage''.'
  name: configuration_mode
  types:
  - <xref:str>
- description: 'Storage type for the HCI Cluster. Allowed values are ''S2D'', ''SAN'',

    ''SANS2D''. Known values are: "S2D", "SAN", and "SANS2D".'
  name: storage_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageType">]
- description: 'S2D (Storage Spaces Direct) configuration. Applicable when StorageType
    is ''S2D'' or

    ''SANS2D''.'
  name: s2_d
  types:
  - <xref:<xref:"StorageS2dConfig">>
- description: 'SAN (Storage Area Network) configuration. Applicable when StorageType
    is ''SAN'' or

    ''SANS2D''.'
  name: san
  types:
  - <xref:<xref:"StorageSanConfig">>
attributes:
- uid: azure.mgmt.azurestackhci.types.Storage.configurationMode
  name: configurationMode
  summary: 'By default, this mode is set to Express and your storage is configured
    as per best practices

    based on the number of nodes in the cluster. Allowed values are ''Express'',''InfraOnly'',

    ''KeepStorage''.'
  signature: 'configurationMode: str'
- uid: azure.mgmt.azurestackhci.types.Storage.s2d
  name: s2d
  summary: S2D (Storage Spaces Direct) configuration. Applicable when StorageType
    is 'S2D' or 'SANS2D'.
  signature: 's2d: StorageS2dConfig'
- uid: azure.mgmt.azurestackhci.types.Storage.san
  name: san
  summary: SAN (Storage Area Network) configuration. Applicable when StorageType is
    'SAN' or 'SANS2D'.
  signature: 'san: StorageSanConfig'
- uid: azure.mgmt.azurestackhci.types.Storage.storageType
  name: storageType
  summary: 'Storage type for the HCI Cluster. Allowed values are ''S2D'', ''SAN'',
    ''SANS2D''. Known values are:

    "S2D", "SAN", and "SANS2D".'
  signature: 'storageType: str | StorageType'
