### YamlMime:PythonClass
uid: azure.mgmt.azurestackhci.types.DeploymentCluster
name: DeploymentCluster
fullName: azure.mgmt.azurestackhci.types.DeploymentCluster
module: azure.mgmt.azurestackhci.types
summary: AzureStackHCI Cluster deployment properties.
constructor:
  syntax: DeploymentCluster()
variables:
- description: The cluster name provided when preparing Active Directory.
  name: name
  types:
  - <xref:str>
- description: 'Use a cloud witness if you have internet access and if you use an
    Azure

    Storage account to provide a vote on cluster quorum. A cloud witness uses Azure
    Blob Storage to

    read or write a blob file and then uses it to arbitrate in split-brain resolution.
    Only allowed

    values are ''Cloud'', ''FileShare''.'
  name: witness_type
  types:
  - <xref:str>
- description: 'Specify the fileshare path for the local witness for your Azure Stack
    HCI

    cluster.'
  name: witness_path
  types:
  - <xref:str>
- description: 'Specify the Azure Storage account name for cloud witness for your

    Azure Stack HCI cluster.'
  name: cloud_account_name
  types:
  - <xref:str>
- description: 'For Azure blob service endpoint type, select either Default or

    Custom domain. If you selected >>**<<Custom domain, enter the domain for the blob
    service in this

    format core.windows.net.'
  name: azure_service_endpoint
  types:
  - <xref:str>
- description: 'Hardware class of the cluster. Known values are: "Small", "Medium",
    and

    "Large".'
  name: hardware_class
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HardwareClass">]
- description: 'Cluster Pattern supported. Known values are: "Standard" and "RackAware".'
  name: cluster_pattern
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterPattern">]
attributes:
- uid: azure.mgmt.azurestackhci.types.DeploymentCluster.azureServiceEndpoint
  name: azureServiceEndpoint
  summary: 'For Azure blob service endpoint type, select either Default or Custom
    domain. If you selected

    >>**<<Custom domain, enter the domain for the blob service in this format core.windows.net.'
  signature: 'azureServiceEndpoint: str'
- uid: azure.mgmt.azurestackhci.types.DeploymentCluster.cloudAccountName
  name: cloudAccountName
  summary: Specify the Azure Storage account name for cloud witness for your Azure
    Stack HCI cluster.
  signature: 'cloudAccountName: str'
- uid: azure.mgmt.azurestackhci.types.DeploymentCluster.clusterPattern
  name: clusterPattern
  summary: '"Standard" and "RackAware".'
  signature: 'clusterPattern: str | ClusterPattern'
- uid: azure.mgmt.azurestackhci.types.DeploymentCluster.hardwareClass
  name: hardwareClass
  summary: '"Small", "Medium", and "Large".'
  signature: 'hardwareClass: str | HardwareClass'
- uid: azure.mgmt.azurestackhci.types.DeploymentCluster.name
  name: name
  summary: The cluster name provided when preparing Active Directory.
  signature: 'name: str'
- uid: azure.mgmt.azurestackhci.types.DeploymentCluster.witnessPath
  name: witnessPath
  summary: Specify the fileshare path for the local witness for your Azure Stack HCI
    cluster.
  signature: 'witnessPath: str'
- uid: azure.mgmt.azurestackhci.types.DeploymentCluster.witnessType
  name: witnessType
  summary: 'Use a cloud witness if you have internet access and if you use an Azure
    Storage account to

    provide a vote on cluster quorum. A cloud witness uses Azure Blob Storage to read
    or write a

    blob file and then uses it to arbitrate in split-brain resolution. Only allowed
    values are

    ''Cloud'', ''FileShare''.'
  signature: 'witnessType: str'
