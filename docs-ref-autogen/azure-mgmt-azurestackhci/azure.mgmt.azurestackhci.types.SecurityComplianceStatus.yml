### YamlMime:PythonClass
uid: azure.mgmt.azurestackhci.types.SecurityComplianceStatus
name: SecurityComplianceStatus
fullName: azure.mgmt.azurestackhci.types.SecurityComplianceStatus
module: azure.mgmt.azurestackhci.types
summary: Security compliance properties of the resource.
constructor:
  syntax: SecurityComplianceStatus()
variables:
- description: 'Indicates whether HCI hosts meets secured-core server

    requirements. Known values are: "Compliant", "NonCompliant", and "Pending".'
  name: secured_core_compliance
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ComplianceStatus">]
- description: 'Indicates whether HCI hosts have enforced consistent Windows Defender

    Application Control. Known values are: "Compliant", "NonCompliant", and "Pending".'
  name: wdac_compliance
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ComplianceStatus">]
- description: 'Indicates whether data at-rest encryption is enabled on Azure

    Stack HCI clustered volumes. Known values are: "Compliant", "NonCompliant", and
    "Pending".'
  name: data_at_rest_encrypted
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ComplianceStatus">]
- description: 'Indicates whether HCI cluster has data in-transit protection.

    Known values are: "Compliant", "NonCompliant", and "Pending".'
  name: data_in_transit_protected
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ComplianceStatus">]
- description: Time in UTC when compliance status was last updated.
  name: last_updated
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.azurestackhci.types.SecurityComplianceStatus.dataAtRestEncrypted
  name: dataAtRestEncrypted
  summary: 'Indicates whether data at-rest encryption is enabled on Azure Stack HCI
    clustered volumes.

    Known values are: "Compliant", "NonCompliant", and "Pending".'
  signature: 'dataAtRestEncrypted: str | ComplianceStatus'
- uid: azure.mgmt.azurestackhci.types.SecurityComplianceStatus.dataInTransitProtected
  name: dataInTransitProtected
  summary: '"Compliant",

    "NonCompliant", and "Pending".'
  signature: 'dataInTransitProtected: str | ComplianceStatus'
- uid: azure.mgmt.azurestackhci.types.SecurityComplianceStatus.lastUpdated
  name: lastUpdated
  summary: Time in UTC when compliance status was last updated.
  signature: 'lastUpdated: str'
- uid: azure.mgmt.azurestackhci.types.SecurityComplianceStatus.securedCoreCompliance
  name: securedCoreCompliance
  summary: 'Indicates whether HCI hosts meets secured-core server requirements. Known
    values are:

    "Compliant", "NonCompliant", and "Pending".'
  signature: 'securedCoreCompliance: str | ComplianceStatus'
- uid: azure.mgmt.azurestackhci.types.SecurityComplianceStatus.wdacCompliance
  name: wdacCompliance
  summary: 'Indicates whether HCI hosts have enforced consistent Windows Defender
