uid: azure.mgmt.azurestackhci.types.PrecheckResult
name: PrecheckResult
fullName: azure.mgmt.azurestackhci.types.PrecheckResult
module: azure.mgmt.azurestackhci.types
summary: PrecheckResult.
constructor:
  syntax: PrecheckResult()
variables:
- description: 'Name of the individual test/rule/alert that was executed. Unique,
    not exposed to

    the customer.'
  name: name
  types:
  - <xref:str>
- description: The health check DisplayName localized of the individual test executed.
  name: display_name
  types:
  - <xref:str>
- description: Key-value pairs that allow grouping/filtering individual tests.
  name: tags
  types:
  - <xref:<xref:"PrecheckResultTags">>
- description: Key-value pairs that allow grouping/filtering individual tests.
  name: health_check_tags
  types:
  - <xref:typing.Any>
- description: User-facing name; one or more sentences indicating the direct issue.
  name: title
  types:
  - <xref:str>
- description: 'Represents the current status of the check being performed. Indicates
    whether the

    check has completed successfully, failed, or is still in progress. Known values
    are:

    "NotYetRegistered", "ConnectedRecently", "NotConnectedRecently", "Disconnected",
    "Error",

    "NotSpecified", "ValidationInProgress", "ValidationSuccess", "ValidationFailed",

    "DeploymentInProgress", "DeploymentFailed", and "DeploymentSuccess".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Status">]
- description: 'Indicates the importance or impact level of the result. Determines
    whether the

    result is informational, a warning, or a critical issue that may block updates.
    Known values

    are: "Critical", "Warning", "Informational", and "Hidden".'
  name: severity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Severity">]
- description: Detailed overview of the issue and what impact the issue has on the
    stamp.
  name: description
  types:
  - <xref:str>
- description: Set of steps that can be taken to resolve the issue found.
  name: remediation
  types:
  - <xref:str>
- description: 'The unique identifier for the affected resource (such as a node or

    drive).'
  name: target_resource_id
  types:
  - <xref:str>
- description: The name of the affected resource.
  name: target_resource_name
  types:
  - <xref:str>
- description: 'The type of resource being referred to (well-known set of nouns in

    infrastructure, aligning with Monitoring).'
  name: target_resource_type
  types:
  - <xref:str>
- description: The time in which the HealthCheck was called.
  name: timestamp
  types:
  - <xref:str>
- description: Property bag of key value pairs for additional information.
  name: additional_data
  types:
  - <xref:str>
- description: 'The name of the services called for the HealthCheck (I.E.

    Test-AzureStack, Test-Cluster).'
  name: health_check_source
  types:
  - <xref:str>
