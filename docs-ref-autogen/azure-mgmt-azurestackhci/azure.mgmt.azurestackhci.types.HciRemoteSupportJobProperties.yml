### YamlMime:PythonClass
uid: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties
name: HciRemoteSupportJobProperties
fullName: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties
module: azure.mgmt.azurestackhci.types
summary: Represents the properties of a remote support job for HCI.
constructor:
  syntax: HciRemoteSupportJobProperties()
variables:
- description: 'Deployment mode to trigger job. Known values are: "Validate" and

    "Deploy".'
  name: deployment_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentMode">]
- description: 'Job provisioning state. Known values are: "NotSpecified", "Error",

    "Succeeded", "Failed", "Canceled", "Connected", "Disconnected", "Deleted", "Creating",

    "Updating", "Deleting", "Moving", "PartiallySucceeded", "PartiallyConnected",
    "InProgress",

    "Accepted", "Provisioning", and "DisableInProgress".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: Unique, immutable job id.
  name: job_id
  types:
  - <xref:str>
- description: The UTC date and time at which the job started.
  name: start_time_utc
  types:
  - <xref:str>
- description: The UTC date and time at which the job completed.
  name: end_time_utc
  types:
  - <xref:str>
- description: 'Status of Edge device job. Known values are: "NotSpecified",

    "ValidationInProgress", "ValidationSuccess", "ValidationFailed", "DeploymentInProgress",

    "DeploymentFailed", "DeploymentSuccess", "Succeeded", "Failed", "Canceled", "Paused",
    and

    "Scheduled".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"JobStatus">]
- description: 'Remote support access level. Required. Known values are: "None",

    "Diagnostics", and "DiagnosticsAndRepair".'
  name: access_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RemoteSupportAccessLevel">]
- description: Remote support expiration timestamp. Required.
  name: expiration_timestamp
  types:
  - <xref:str>
- description: 'Remote support type. Required. Known values are: "Enable" and "Revoke".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RemoteSupportType">]
- description: log collection job reported properties.
  name: reported_properties
  types:
  - <xref:<xref:"RemoteSupportJobReportedProperties">>
- description: 'Job Type to support polymorphic resource. Required. Job to provide
    remote

    support to the device.'
  name: job_type
  types:
  - <xref:typing.Literal>[HciEdgeDeviceJobType.REMOTE_SUPPORT]
attributes:
- uid: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties.accessLevel
  name: accessLevel
  summary: '"None", "Diagnostics", and

    "DiagnosticsAndRepair".'
  signature: 'accessLevel: Required[str | RemoteSupportAccessLevel]'
- uid: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties.deploymentMode
  name: deploymentMode
  summary: '"Validate" and "Deploy".'
  signature: 'deploymentMode: str | DeploymentMode'
- uid: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties.endTimeUtc
  name: endTimeUtc
  summary: The UTC date and time at which the job completed.
  signature: 'endTimeUtc: str'
- uid: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties.expirationTimestamp
  name: expirationTimestamp
  summary: Remote support expiration timestamp. Required.
  signature: 'expirationTimestamp: Required[str]'
- uid: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties.jobId
  name: jobId
  summary: Unique, immutable job id.
  signature: 'jobId: str'
- uid: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties.jobType
  name: jobType
  summary: 'Job Type to support polymorphic resource. Required. Job to provide remote
    support to the

    device.'
  signature: 'jobType: REMOTE_SUPPORT: ''RemoteSupport''>]]'
- uid: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties.provisioningState
  name: provisioningState
  summary: '"NotSpecified", "Error", "Succeeded",

    "Failed", "Canceled", "Connected", "Disconnected", "Deleted", "Creating",

    "Updating", "Deleting", "Moving", "PartiallySucceeded", "PartiallyConnected",

    "InProgress", "Accepted", "Provisioning", and "DisableInProgress".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties.reportedProperties
  name: reportedProperties
  summary: log collection job reported properties.
  signature: 'reportedProperties: RemoteSupportJobReportedProperties'
- uid: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties.startTimeUtc
  name: startTimeUtc
  summary: The UTC date and time at which the job started.
  signature: 'startTimeUtc: str'
- uid: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties.status
  name: status
  summary: '"NotSpecified", "ValidationInProgress",

    "ValidationSuccess", "ValidationFailed", "DeploymentInProgress", "DeploymentFailed",

    "DeploymentSuccess", "Succeeded", "Failed", "Canceled", "Paused", and "Scheduled".'
  signature: 'status: str | JobStatus'
- uid: azure.mgmt.azurestackhci.types.HciRemoteSupportJobProperties.type
  name: type
  summary: '"Enable" and "Revoke".'
  signature: 'type: Required[str | RemoteSupportType]'
