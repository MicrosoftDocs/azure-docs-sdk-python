### YamlMime:PythonClass
uid: azure.mgmt.azurestackhci.types.ClusterReportedProperties
name: ClusterReportedProperties
fullName: azure.mgmt.azurestackhci.types.ClusterReportedProperties
module: azure.mgmt.azurestackhci.types
summary: Properties reported by cluster agent.
constructor:
  syntax: ClusterReportedProperties()
variables:
- description: Name of the on-prem cluster connected to this resource.
  name: cluster_name
  types:
  - <xref:str>
- description: Unique id generated by the on-prem cluster.
  name: cluster_id
  types:
  - <xref:str>
- description: Version of the cluster software.
  name: cluster_version
  types:
  - <xref:str>
- description: List of nodes reported by the cluster.
  name: nodes
  types:
  - <xref:list>[<xref:"ClusterNode">]
- description: Last time the cluster reported the data.
  name: last_updated
  types:
  - <xref:str>
- description: 'Specifies the expiration timestamp of the cluster''s Managed

    Service Identity (MSI). The value is expressed in Coordinated Universal Time (UTC).'
  name: msi_expiration_time_stamp
  types:
  - <xref:str>
- description: 'IMDS attestation status of the cluster. Known values are: "Disabled"

    and "Enabled".'
  name: imds_attestation
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ImdsAttestation">]
- description: 'Level of diagnostic data emitted by the cluster. Known values are:

    "Off", "Basic", and "Enhanced".'
  name: diagnostic_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiagnosticLevel">]
- description: Capabilities supported by the cluster.
  name: supported_capabilities
  types:
  - <xref:list>[<xref:str>]
- description: 'Specifies the type of hardware vendor for all nodes in the cluster.

    Indicates whether the nodes are provided by Microsoft or a third-party vendor.
    Known values

    are: "FirstParty" and "ThirdParty".'
  name: cluster_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClusterNodeType">]
- description: The manufacturer of all the nodes of the cluster.
  name: manufacturer
  types:
  - <xref:str>
- description: 'OEM activation status of the cluster. Known values are: "Disabled"
    and

    "Enabled".'
  name: oem_activation
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OemActivation">]
- description: 'Hardware class of the cluster. Known values are: "Small", "Medium",
    and

    "Large".'
  name: hardware_class
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HardwareClass">]
