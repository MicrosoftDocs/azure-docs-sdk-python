### YamlMime:PythonClass
uid: azure.mgmt.azurestackhci.types.Step
name: Step
fullName: azure.mgmt.azurestackhci.types.Step
module: azure.mgmt.azurestackhci.types
summary: Progress representation of the update run steps.
constructor:
  syntax: Step()
variables:
- description: Name of the step.
  name: name
  types:
  - <xref:str>
- description: More detailed description of the step.
  name: description
  types:
  - <xref:str>
- description: Error message, specified if the step is in a failed state.
  name: error_message
  types:
  - <xref:str>
- description: 'Status of the step, bubbled up from the ECE action plan for installation

    attempts. Values are: ''Success'', ''Error'', ''InProgress'', and ''Unknown status''.'
  name: status
  types:
  - <xref:str>
- description: When the step started, or empty if it has not started executing.
  name: start_time_utc
  types:
  - <xref:str>
- description: When the step reached a terminal state.
  name: end_time_utc
  types:
  - <xref:str>
- description: Completion time of this step or the last completed sub-step.
  name: last_updated_time_utc
  types:
  - <xref:str>
- description: 'Expected execution time of a given step. This is optionally

    authored in the update action plan and can be empty.'
  name: expected_execution_time
  types:
  - <xref:str>
- description: Recursive model for child steps of this step.
  name: steps
  types:
  - <xref:list>[<xref:"Step">]
attributes:
- uid: azure.mgmt.azurestackhci.types.Step.description
  name: description
  summary: More detailed description of the step.
  signature: 'description: str'
- uid: azure.mgmt.azurestackhci.types.Step.endTimeUtc
  name: endTimeUtc
  summary: When the step reached a terminal state.
  signature: 'endTimeUtc: str'
- uid: azure.mgmt.azurestackhci.types.Step.errorMessage
  name: errorMessage
  summary: Error message, specified if the step is in a failed state.
  signature: 'errorMessage: str'
- uid: azure.mgmt.azurestackhci.types.Step.expectedExecutionTime
  name: expectedExecutionTime
  summary: 'Expected execution time of a given step. This is optionally authored in
    the update action plan

    and can be empty.'
  signature: 'expectedExecutionTime: str'
- uid: azure.mgmt.azurestackhci.types.Step.lastUpdatedTimeUtc
  name: lastUpdatedTimeUtc
  summary: Completion time of this step or the last completed sub-step.
  signature: 'lastUpdatedTimeUtc: str'
- uid: azure.mgmt.azurestackhci.types.Step.name
  name: name
  summary: Name of the step.
  signature: 'name: str'
- uid: azure.mgmt.azurestackhci.types.Step.startTimeUtc
  name: startTimeUtc
  summary: When the step started, or empty if it has not started executing.
  signature: 'startTimeUtc: str'
- uid: azure.mgmt.azurestackhci.types.Step.status
  name: status
  summary: 'Status of the step, bubbled up from the ECE action plan for installation
    attempts. Values are:

    ''Success'', ''Error'', ''InProgress'', and ''Unknown status''.'
  signature: 'status: str'
- uid: azure.mgmt.azurestackhci.types.Step.steps
  name: steps
  summary: Recursive model for child steps of this step.
  signature: 'steps: list[azure.mgmt.azurestackhci.types.Step]'
