uid: azure.mgmt.azurestackhci.types.UpdateSummariesProperties
name: UpdateSummariesProperties
fullName: azure.mgmt.azurestackhci.types.UpdateSummariesProperties
module: azure.mgmt.azurestackhci.types
summary: Properties of Update summaries.
constructor:
  syntax: UpdateSummariesProperties()
variables:
- description: 'Provisioning state of the UpdateSummaries proxy resource. Indicates

    the current lifecycle status of the update summary operation, such as whether
    it has been

    accepted, is in progress, or has completed. Known values are: "NotSpecified",
    "Error",

    "Succeeded", "Failed", "Canceled", "Connected", "Disconnected", "Deleted", "Creating",

    "Updating", "Deleting", "Moving", "PartiallySucceeded", "PartiallyConnected",
    "InProgress",

    "Accepted", "Provisioning", and "DisableInProgress".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: OEM family name.
  name: oem_family
  types:
  - <xref:str>
- description: Current OEM Version.
  name: current_oem_version
  types:
  - <xref:str>
- description: Name of the hardware model.
  name: hardware_model
  types:
  - <xref:str>
- description: Current version of each updatable component.
  name: package_versions
  types:
  - <xref:list>[<xref:"PackageVersionInfo">]
- description: Current Solution Bundle version of the stamp.
  name: current_version
  types:
  - <xref:str>
- description: Current Sbe version of the stamp.
  name: current_sbe_version
  types:
  - <xref:str>
- description: Last time an update installation completed successfully.
  name: last_updated
  types:
  - <xref:str>
- description: Last time the update service successfully checked for updates.
  name: last_checked
  types:
  - <xref:str>
- description: 'Overall health state for update-specific health checks. Known values
    are:

    "Unknown", "Success", "Failure", "Warning", "Error", and "InProgress".'
  name: health_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HealthState">]
- description: An array of pre-check result objects.
  name: health_check_result
  types:
  - <xref:list>[<xref:"PrecheckResult">]
- description: Last time the package-specific checks were run.
  name: health_check_date
  types:
  - <xref:str>
- description: 'Overall update state of the stamp. Indicates the current status of
    update

    deployment across the stamp, including preparation, application, and any issues
    encountered.

    Known values are: "Unknown", "AppliedSuccessfully", "UpdateAvailable", "UpdateInProgress",

    "UpdateFailed", "NeedsAttention", "PreparationInProgress", and "PreparationFailed".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UpdateSummariesPropertiesState">]
