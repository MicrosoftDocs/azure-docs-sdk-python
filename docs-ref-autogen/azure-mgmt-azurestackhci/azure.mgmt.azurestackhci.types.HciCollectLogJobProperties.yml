  signature: 'jobType: COLLECT_LOG: ''CollectLog''>]]'
- uid: azure.mgmt.azurestackhci.types.HciCollectLogJobProperties.lastLogGenerated
  name: lastLogGenerated
  summary: To date for log collection.
  signature: 'lastLogGenerated: str'
