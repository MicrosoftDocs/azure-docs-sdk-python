  name: startTimeUtc
  summary: The UTC date and time at which the job started.
  signature: 'startTimeUtc: str'
- uid: azure.mgmt.azurestackhci.types.HciCollectLogJobProperties.status
  name: status
  summary: '"NotSpecified", "ValidationInProgress",

    "ValidationSuccess", "ValidationFailed", "DeploymentInProgress", "DeploymentFailed",

    "DeploymentSuccess", "Succeeded", "Failed", "Canceled", "Paused", and "Scheduled".'
  signature: 'status: str | JobStatus'
- uid: azure.mgmt.azurestackhci.types.HciCollectLogJobProperties.toDate
  name: toDate
  summary: To date for log collection. Required.
  signature: 'toDate: Required[str]'
