### YamlMime:PythonClass
uid: azure.mgmt.azurestackhci.types.InfrastructureNetwork
name: InfrastructureNetwork
fullName: azure.mgmt.azurestackhci.types.InfrastructureNetwork
module: azure.mgmt.azurestackhci.types
summary: The InfrastructureNetwork of a AzureStackHCI Cluster.
constructor:
  syntax: InfrastructureNetwork()
variables:
- description: Subnet mask that matches the provided IP address space.
  name: subnet_mask
  types:
  - <xref:str>
- description: Default gateway that should be used for the provided IP address space.
  name: gateway
  types:
  - <xref:str>
- description: 'Range of IP addresses from which addresses are allocated for nodes
    within a

    subnet.'
  name: ip_pools
  types:
  - <xref:list>[<xref:"IpPools">]
- description: 'Specifies how DNS servers are configured for the infrastructure

    network. Allowed values are ''UseDnsServer'' to use the provided DNS servers,
    and ''UseForwarder''

    to use DNS forwarders. Known values are: "UseDnsServer" and "UseForwarder".'
  name: dns_server_config
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DnsServerConfig">]
- description: Details of the DNS Zones to be configured.
  name: dns_zones
  types:
  - <xref:list>[<xref:"DnsZones">]
- description: IPv4 address of the DNS servers in your environment.
  name: dns_servers
  types:
  - <xref:list>[<xref:str>]
- description: 'Allows customers to use DHCP for Hosts and Cluster IPs. If not declared,
    the

    deployment will default to static IPs. When true, GW and DNS servers are not required.'
  name: use_dhcp
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.azurestackhci.types.InfrastructureNetwork.dnsServerConfig
  name: dnsServerConfig
  summary: 'Specifies how DNS servers are configured for the infrastructure network.
    Allowed values are

    ''UseDnsServer'' to use the provided DNS servers, and ''UseForwarder'' to use
    DNS forwarders. Known

    values are: "UseDnsServer" and "UseForwarder".'
  signature: 'dnsServerConfig: str | DnsServerConfig'
- uid: azure.mgmt.azurestackhci.types.InfrastructureNetwork.dnsServers
  name: dnsServers
  summary: IPv4 address of the DNS servers in your environment.
  signature: 'dnsServers: list[str]'
- uid: azure.mgmt.azurestackhci.types.InfrastructureNetwork.dnsZones
  name: dnsZones
  summary: Details of the DNS Zones to be configured.
  signature: 'dnsZones: list[''DnsZones'']'
- uid: azure.mgmt.azurestackhci.types.InfrastructureNetwork.gateway
  name: gateway
  summary: Default gateway that should be used for the provided IP address space.
  signature: 'gateway: str'
- uid: azure.mgmt.azurestackhci.types.InfrastructureNetwork.ipPools
  name: ipPools
  summary: Range of IP addresses from which addresses are allocated for nodes within
    a subnet.
  signature: 'ipPools: list[''IpPools'']'
- uid: azure.mgmt.azurestackhci.types.InfrastructureNetwork.subnetMask
  name: subnetMask
  summary: Subnet mask that matches the provided IP address space.
  signature: 'subnetMask: str'
- uid: azure.mgmt.azurestackhci.types.InfrastructureNetwork.useDhcp
  name: useDhcp
  summary: 'Allows customers to use DHCP for Hosts and Cluster IPs. If not declared,
    the deployment will

    default to static IPs. When true, GW and DNS servers are not required.'
  signature: 'useDhcp: bool'
