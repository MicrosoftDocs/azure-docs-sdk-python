### YamlMime:PythonClass
uid: azure.mgmt.azurestackhci.types.DeploymentSecuritySettings
name: DeploymentSecuritySettings
fullName: azure.mgmt.azurestackhci.types.DeploymentSecuritySettings
module: azure.mgmt.azurestackhci.types
summary: The SecuritySettings of AzureStackHCI Cluster.
constructor:
  syntax: DeploymentSecuritySettings()
variables:
- description: 'By default, Hypervisor-protected Code Integrity is enabled on your
    Azure

    HCI cluster.'
  name: hvci_protection
  types:
  - <xref:bool>
- description: 'By default, Secure Boot is enabled on your Azure HCI cluster. This

    setting is hardware dependent.'
  name: drtm_protection
  types:
  - <xref:bool>
- description: When set to true, the security baseline is re-applied regularly.
  name: drift_control_enforced
  types:
  - <xref:bool>
- description: When set to true, Credential Guard is enabled.
  name: credential_guard_enforced
  types:
  - <xref:bool>
- description: 'When set to true, the SMB default instance requires sign in for the

    client and server services.'
  name: smb_signing_enforced
  types:
  - <xref:bool>
- description: When set to true, cluster east-west traffic is encrypted.
  name: smb_cluster_encryption
  types:
  - <xref:bool>
- description: 'When set to true, all the side channel mitigations are

    enabled.'
  name: side_channel_mitigation_enforced
  types:
  - <xref:bool>
- description: 'When set to true, BitLocker XTS_AES 256-bit encryption is enabled

    for all data-at-rest on the OS volume of your Azure Stack HCI cluster. This setting
    is

    TPM-hardware dependent.'
  name: bitlocker_boot_volume
  types:
  - <xref:bool>
- description: 'When set to true, BitLocker XTS-AES 256-bit encryption is enabled

    for all data-at-rest on your Azure Stack HCI cluster shared volumes.'
  name: bitlocker_data_volumes
  types:
  - <xref:bool>
- description: 'WDAC is enabled by default and limits the applications and the code
    that

    you can run on your Azure Stack HCI cluster.'
  name: wdac_enforced
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.azurestackhci.types.DeploymentSecuritySettings.bitlockerBootVolume
  name: bitlockerBootVolume
  summary: 'When set to true, BitLocker XTS_AES 256-bit encryption is enabled for
    all data-at-rest on the

    OS volume of your Azure Stack HCI cluster. This setting is TPM-hardware dependent.'
  signature: 'bitlockerBootVolume: bool'
- uid: azure.mgmt.azurestackhci.types.DeploymentSecuritySettings.bitlockerDataVolumes
  name: bitlockerDataVolumes
  summary: 'When set to true, BitLocker XTS-AES 256-bit encryption is enabled for
    all data-at-rest on your

    Azure Stack HCI cluster shared volumes.'
  signature: 'bitlockerDataVolumes: bool'
- uid: azure.mgmt.azurestackhci.types.DeploymentSecuritySettings.credentialGuardEnforced
  name: credentialGuardEnforced
  summary: When set to true, Credential Guard is enabled.
  signature: 'credentialGuardEnforced: bool'
- uid: azure.mgmt.azurestackhci.types.DeploymentSecuritySettings.driftControlEnforced
  name: driftControlEnforced
  summary: When set to true, the security baseline is re-applied regularly.
  signature: 'driftControlEnforced: bool'
- uid: azure.mgmt.azurestackhci.types.DeploymentSecuritySettings.drtmProtection
  name: drtmProtection
  summary: 'By default, Secure Boot is enabled on your Azure HCI cluster. This setting
    is hardware

    dependent.'
  signature: 'drtmProtection: bool'
- uid: azure.mgmt.azurestackhci.types.DeploymentSecuritySettings.hvciProtection
  name: hvciProtection
  summary: By default, Hypervisor-protected Code Integrity is enabled on your Azure
    HCI cluster.
  signature: 'hvciProtection: bool'
- uid: azure.mgmt.azurestackhci.types.DeploymentSecuritySettings.sideChannelMitigationEnforced
  name: sideChannelMitigationEnforced
  summary: When set to true, all the side channel mitigations are enabled.
  signature: 'sideChannelMitigationEnforced: bool'
- uid: azure.mgmt.azurestackhci.types.DeploymentSecuritySettings.smbClusterEncryption
  name: smbClusterEncryption
  summary: When set to true, cluster east-west traffic is encrypted.
  signature: 'smbClusterEncryption: bool'
- uid: azure.mgmt.azurestackhci.types.DeploymentSecuritySettings.smbSigningEnforced
  name: smbSigningEnforced
  summary: When set to true, the SMB default instance requires sign in for the client
    and server services.
  signature: 'smbSigningEnforced: bool'
- uid: azure.mgmt.azurestackhci.types.DeploymentSecuritySettings.wdacEnforced
  name: wdacEnforced
  summary: 'WDAC is enabled by default and limits the applications and the code that
    you can run on your

    Azure Stack HCI cluster.'
  signature: 'wdacEnforced: bool'
