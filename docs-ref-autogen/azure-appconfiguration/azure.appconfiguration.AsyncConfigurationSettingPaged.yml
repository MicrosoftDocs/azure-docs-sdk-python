### YamlMime:PythonClass
uid: azure.appconfiguration.AsyncConfigurationSettingPaged
name: AsyncConfigurationSettingPaged
fullName: azure.appconfiguration.AsyncConfigurationSettingPaged
module: azure.appconfiguration
summary: "An async iterable of ConfigurationSettings that supports etag-based change\
  \ detection.\n\nThis class provides asynchronous iteration over configuration settings,\
  \ with optional support for\netag-based change detection. By supplying a list of\
  \ etags via the *match_conditions* parameter to\nthe *by_page* method, you can efficiently\
  \ detect and retrieve only those pages that have changed\nsince your last retrieval.\n\
  \nExample:\n\n<!-- literal_block {\"ids\": [], \"classes\": [], \"names\": [], \"\
  dupnames\": [], \"backrefs\": [], \"xml:space\": \"preserve\", \"force\": false,\
  \ \"language\": \"python\", \"highlight_args\": {}, \"linenos\": false} -->\n\n\
  ````python\n\n   async for setting in AsyncConfigurationSettingPaged(...):\n   \
  \    # Process each setting asynchronously\n       print(setting)\n\n   # To iterate\
  \ by page and use etag-based change detection:\n   etags = [\"etag1\", \"etag2\"\
  , \"etag3\"]\n   async for page in paged.by_page(match_conditions=etags):\n    \
  \   async for setting in page:\n           print(setting)\n   ````\n\nWhen *match_conditions*\
  \ is provided, each page is checked against the corresponding etag.\nIf the page\
  \ has not changed (HTTP 304), it is skipped. If the page has changed (HTTP 200),\n\
  the new page is returned. This allows efficient polling for changes without retrieving\n\
  unchanged data.\n\nReturn an async iterator of items.\n\nargs and kwargs will be\
  \ passed to the AsyncPageIterator constructor directly,\nexcept page_iterator_class"
constructor:
  syntax: 'AsyncConfigurationSettingPaged(*args: Any, **kwargs: Any)'
methods:
- uid: azure.appconfiguration.AsyncConfigurationSettingPaged.by_page
  name: by_page
  summary: Get an async iterator of pages of objects, instead of an iterator of objects.
  signature: 'by_page(continuation_token: str | None = None, *, match_conditions:
    List[str] | None = None) -> Any'
  parameters:
  - name: continuation_token
    description: 'An opaque continuation token. This value can be retrieved from the

      continuation_token field of a previous generator object. If specified,

      this generator will begin returning results from this point.'
    defaultValue: None
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: match_conditions
    description: 'A list of etags to check for changes. If provided, the iterator
      will

      check each page against the corresponding etag and only return pages that have
      changed.'
    defaultValue: None
    types:
    - <xref:list>[<xref:str>]
    - <xref:None>
  return:
    description: An async iterator of pages (themselves iterator of objects)
    types:
    - <xref:typing.AsyncIterator>[<xref:typing.AsyncIterator>[<xref:ReturnType>]]
