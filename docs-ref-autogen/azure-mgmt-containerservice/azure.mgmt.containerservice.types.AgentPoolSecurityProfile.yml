uid: azure.mgmt.containerservice.types.AgentPoolSecurityProfile
name: AgentPoolSecurityProfile
fullName: azure.mgmt.containerservice.types.AgentPoolSecurityProfile
module: azure.mgmt.containerservice.types
summary: The security settings of an agent pool.
constructor:
  syntax: AgentPoolSecurityProfile()
variables:
- description: 'vTPM is a Trusted Launch feature for configuring a dedicated secure
    vault

    for keys and measurements held locally on the node. For more details, see

    aka.ms/aks/trustedlaunch. If not specified, the default is false.'
  name: enable_vtpm
  types:
  - <xref:bool>
- description: 'Secure Boot is a feature of Trusted Launch which ensures that only

    signed operating systems and drivers can boot. For more details, see aka.ms/aks/trustedlaunch.

    If not specified, the default is false.'
  name: enable_secure_boot
  types:
  - <xref:bool>
- description: 'SSH access method of an agent pool. Known values are: "LocalUser"
    and

    "Disabled".'
  name: ssh_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AgentPoolSSHAccess">]
attributes:
- uid: azure.mgmt.containerservice.types.AgentPoolSecurityProfile.enableSecureBoot
  name: enableSecureBoot
  summary: 'Secure Boot is a feature of Trusted Launch which ensures that only signed
    operating systems and

    drivers can boot. For more details, see aka.ms/aks/trustedlaunch.  If not specified,
    the

    default is false.'
  signature: 'enableSecureBoot: bool'
- uid: azure.mgmt.containerservice.types.AgentPoolSecurityProfile.enableVTPM
  name: enableVTPM
  summary: 'vTPM is a Trusted Launch feature for configuring a dedicated secure vault
    for keys and

    measurements held locally on the node. For more details, see aka.ms/aks/trustedlaunch.
