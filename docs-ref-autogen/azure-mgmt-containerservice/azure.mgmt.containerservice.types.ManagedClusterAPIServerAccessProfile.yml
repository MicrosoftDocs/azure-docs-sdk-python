### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterAPIServerAccessProfile
name: ManagedClusterAPIServerAccessProfile
fullName: azure.mgmt.containerservice.types.ManagedClusterAPIServerAccessProfile
module: azure.mgmt.containerservice.types
summary: Access profile for managed cluster API server.
constructor:
  syntax: ManagedClusterAPIServerAccessProfile()
variables:
- description: 'The IP ranges authorized to access the Kubernetes API server. IP

    ranges are specified in CIDR format, e.g. 137.117.106.88/29. This feature is not
    compatible

    with clusters that use Public IP Per Node, or clusters that are using a Basic
    Load Balancer.

    For more information see [API server authorized IP ranges](https://docs.microsoft.com/azure/aks/api-server-authorized-ip-ranges).'
  name: authorizedIPRanges
  types:
  - <xref:list>[<xref:str>]
- description: 'Whether to create the cluster as a private cluster or not. For more

    details, see [Creating a private AKS cluster](https://docs.microsoft.com/azure/aks/private-clusters).'
  name: enablePrivateCluster
  types:
  - <xref:bool>
- description: 'The private DNS zone mode for the cluster. The default is System.
    For

    more details see [configure private DNS zone](https://docs.microsoft.com/azure/aks/private-clusters#configure-private-dns-zone).
    Allowed

    values are ''system'' and ''none''.'
  name: privateDNSZone
  types:
  - <xref:str>
- description: 'Whether to create additional public FQDN for private

    cluster or not.'
  name: enablePrivateClusterPublicFQDN
  types:
  - <xref:bool>
- description: Whether to disable run command for the cluster or not.
  name: disableRunCommand
  types:
  - <xref:bool>
- description: 'Whether to enable apiserver vnet integration for the cluster or

    not. See aka.ms/AksVnetIntegration for more details.'
  name: enableVnetIntegration
  types:
  - <xref:bool>
- description: 'The subnet to be used when apiserver vnet integration is enabled.
    It is

    required when creating a new cluster with BYO Vnet, or when updating an existing
    cluster to

    enable apiserver vnet integration.'
  name: subnetId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterAPIServerAccessProfile.authorizedIPRanges
  name: authorizedIPRanges
  summary: 'The IP ranges authorized to access the Kubernetes API server. IP ranges
    are specified in CIDR

    format, e.g. 137.117.106.88/29. This feature is not compatible with clusters that
    use Public IP

    Per Node, or clusters that are using a Basic Load Balancer. For more information
    see [API

    server authorized IP ranges](https://docs.microsoft.com/azure/aks/api-server-authorized-ip-ranges).'
  signature: 'authorizedIPRanges: list[str]'
- uid: azure.mgmt.containerservice.types.ManagedClusterAPIServerAccessProfile.disableRunCommand
  name: disableRunCommand
  summary: Whether to disable run command for the cluster or not.
  signature: 'disableRunCommand: bool'
- uid: azure.mgmt.containerservice.types.ManagedClusterAPIServerAccessProfile.enablePrivateCluster
  name: enablePrivateCluster
  summary: 'Whether to create the cluster as a private cluster or not. For more details,
    see [Creating a

    private AKS cluster](https://docs.microsoft.com/azure/aks/private-clusters).'
  signature: 'enablePrivateCluster: bool'
- uid: azure.mgmt.containerservice.types.ManagedClusterAPIServerAccessProfile.enablePrivateClusterPublicFQDN
  name: enablePrivateClusterPublicFQDN
  summary: Whether to create additional public FQDN for private cluster or not.
  signature: 'enablePrivateClusterPublicFQDN: bool'
- uid: azure.mgmt.containerservice.types.ManagedClusterAPIServerAccessProfile.enableVnetIntegration
  name: enableVnetIntegration
  summary: 'Whether to enable apiserver vnet integration for the cluster or not. See

    aka.ms/AksVnetIntegration for more details.'
  signature: 'enableVnetIntegration: bool'
- uid: azure.mgmt.containerservice.types.ManagedClusterAPIServerAccessProfile.privateDNSZone
  name: privateDNSZone
  summary: 'The private DNS zone mode for the cluster. The default is System. For
    more details see

    [configure private DNS zone](https://docs.microsoft.com/azure/aks/private-clusters#configure-private-dns-zone).
    Allowed

    values are ''system'' and ''none''.'
  signature: 'privateDNSZone: str'
- uid: azure.mgmt.containerservice.types.ManagedClusterAPIServerAccessProfile.subnetId
  name: subnetId
  summary: 'The subnet to be used when apiserver vnet integration is enabled. It is
    required when creating

    a new cluster with BYO Vnet, or when updating an existing cluster to enable apiserver
    vnet

    integration.'
  signature: 'subnetId: str'
