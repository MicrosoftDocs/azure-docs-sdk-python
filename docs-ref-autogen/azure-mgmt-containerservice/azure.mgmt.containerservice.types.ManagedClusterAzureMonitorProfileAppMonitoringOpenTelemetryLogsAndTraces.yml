### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryLogsAndTraces
name: ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryLogsAndTraces
fullName: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryLogsAndTraces
module: azure.mgmt.containerservice.types
summary: 'Application Monitoring OpenTelemetry logs and traces profile for AKS. Collects
  OpenTelemetry

  logs and traces of the application using Azure Monitor OpenTelemetry based SDKs.
  See

  [https://aka.ms/AKSAppMonitoringDocs](https://aka.ms/AKSAppMonitoringDocs) and

  [https://aka.ms/AzureMonitorApplicationMonitoring](https://aka.ms/AzureMonitorApplicationMonitoring)
  for an overview.'
constructor:
  syntax: ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryLogsAndTraces()
variables:
- description: 'Indicates if Application Monitoring OpenTelemetry Logs and traces
    is enabled or

    not.'
  name: enabled
  types:
  - <xref:bool>
- description: 'The host port for OpenTelemetry HTTP/PROTOBUF logs and traces. If
    not

    specified, the default port is 28331.'
  name: httpPort
  types:
  - <xref:int>
- description: 'The host port for OpenTelemetry GRPC logs and traces. If not specified,
    the

    default port is 28332.'
  name: grpcPort
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryLogsAndTraces.enabled
  name: enabled
  summary: Indicates if Application Monitoring OpenTelemetry Logs and traces is enabled
    or not.
  signature: 'enabled: bool'
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryLogsAndTraces.grpcPort
  name: grpcPort
  summary: 'The host port for OpenTelemetry GRPC logs and traces. If not specified,
    the default port is

    28332.'
  signature: 'grpcPort: int'
- uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryLogsAndTraces.httpPort
  name: httpPort
  summary: 'The host port for OpenTelemetry HTTP/PROTOBUF logs and traces. If not
