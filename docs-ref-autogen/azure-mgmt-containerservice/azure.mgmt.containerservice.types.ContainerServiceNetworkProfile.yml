### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile
name: ContainerServiceNetworkProfile
fullName: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile
module: azure.mgmt.containerservice.types
summary: Profile of network configuration.
constructor:
  syntax: ContainerServiceNetworkProfile()
variables:
- description: 'Network plugin used for building the Kubernetes network. Known values

    are: "azure", "kubenet", and "none".'
  name: network_plugin
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkPlugin">]
- description: The mode the network plugin should use. "overlay"
  name: network_plugin_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkPluginMode">]
- description: 'Network policy used for building the Kubernetes network. Known values

    are: "none", "calico", "azure", and "cilium".'
  name: network_policy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkPolicy">]
- description: 'The network mode Azure CNI is configured with. This cannot be specified
    if

    networkPlugin is anything other than ''azure''. Known values are: "transparent"
    and "bridge".'
  name: network_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkMode">]
- description: 'Network dataplane used in the Kubernetes cluster. Known values are:

    "azure" and "cilium".'
  name: network_dataplane
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkDataplane">]
- description: 'Advanced Networking profile for enabling observability and security

    feature suite on a cluster. For more information see aka.ms/aksadvancednetworking.'
  name: advanced_networking
  types:
  - <xref:<xref:"AdvancedNetworking">>
- description: A CIDR notation IP range from which to assign pod IPs when kubenet
    is used.
  name: pod_cidr
  types:
  - <xref:str>
- description: 'A CIDR notation IP range from which to assign service cluster IPs.
    It must

    not overlap with any Subnet IP ranges.'
  name: service_cidr
  types:
  - <xref:str>
- description: 'An IP address assigned to the Kubernetes DNS service. It must be within

    the Kubernetes service address range specified in serviceCidr.'
  name: dns_service_ip
  types:
  - <xref:str>
- description: 'The outbound (egress) routing method. This can only be set at cluster

    creation time and cannot be changed later. For more information see [egress outbound
    type](https://docs.microsoft.com/azure/aks/egress-outboundtype). Known values
    are: "loadBalancer",

    "userDefinedRouting", "managedNATGateway", "userAssignedNATGateway", and "none".'
  name: outbound_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OutboundType">]
- description: 'The load balancer sku for the managed cluster. The default is

    ''standard''. See [Azure Load Balancer SKUs](https://docs.microsoft.com/azure/load-balancer/skus)
    for more information about the

    differences between load balancer SKUs. Known values are: "standard" and "basic".'
  name: load_balancer_sku
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LoadBalancerSku">]
- description: Profile of the cluster load balancer.
  name: load_balancer_profile
  types:
  - <xref:<xref:"ManagedClusterLoadBalancerProfile">>
- description: Profile of the cluster NAT gateway.
  name: nat_gateway_profile
  types:
  - <xref:<xref:"ManagedClusterNATGatewayProfile">>
- description: 'The profile for Static Egress Gateway addon. For more

    details about Static Egress Gateway, see [https://aka.ms/aks/static-egress-gateway](https://aka.ms/aks/static-egress-gateway).'
  name: static_egress_gateway_profile
  types:
  - <xref:<xref:"ManagedClusterStaticEgressGatewayProfile">>
- description: 'The CIDR notation IP ranges from which to assign pod IPs. One IPv4
    CIDR is

    expected for single-stack networking. Two CIDRs, one for each IP family (IPv4/IPv6),
    is

    expected for dual-stack networking.'
  name: pod_cidrs
  types:
  - <xref:list>[<xref:str>]
- description: 'The CIDR notation IP ranges from which to assign service cluster IPs.
    One

    IPv4 CIDR is expected for single-stack networking. Two CIDRs, one for each IP
    family

    (IPv4/IPv6), is expected for dual-stack networking. They must not overlap with
    any Subnet IP

    ranges.'
  name: service_cidrs
  types:
  - <xref:list>[<xref:str>]
- description: 'The IP families used to specify IP versions available to the cluster.
    IP

    families are used to determine single-stack or dual-stack clusters. For single-stack,
    the

    expected value is IPv4. For dual-stack, the expected values are IPv4 and IPv6.'
  name: ip_families
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"IPFamily">]]
attributes:
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.advancedNetworking
  name: advancedNetworking
  summary: 'Advanced Networking profile for enabling observability and security feature
    suite on a cluster.

    For more information see aka.ms/aksadvancednetworking.'
  signature: 'advancedNetworking: AdvancedNetworking'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.dnsServiceIP
  name: dnsServiceIP
  summary: 'An IP address assigned to the Kubernetes DNS service. It must be within
    the Kubernetes service

    address range specified in serviceCidr.'
  signature: 'dnsServiceIP: str'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.ipFamilies
  name: ipFamilies
  summary: 'The IP families used to specify IP versions available to the cluster.
    IP families are used to

    determine single-stack or dual-stack clusters. For single-stack, the expected
    value is IPv4.

    For dual-stack, the expected values are IPv4 and IPv6.'
  signature: 'ipFamilies: list[typing.Union[str, ForwardRef(''IPFamily'')]]'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.loadBalancerProfile
  name: loadBalancerProfile
  summary: Profile of the cluster load balancer.
  signature: 'loadBalancerProfile: ManagedClusterLoadBalancerProfile'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.loadBalancerSku
  name: loadBalancerSku
  summary: 'The load balancer sku for the managed cluster. The default is ''standard''.
    See [Azure Load

    Balancer SKUs](https://docs.microsoft.com/azure/load-balancer/skus) for more information

    about the differences between load balancer SKUs. Known values are: "standard"
    and "basic".'
  signature: 'loadBalancerSku: str | LoadBalancerSku'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.natGatewayProfile
  name: natGatewayProfile
  summary: Profile of the cluster NAT gateway.
  signature: 'natGatewayProfile: ManagedClusterNATGatewayProfile'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.networkDataplane
  name: networkDataplane
  summary: '"azure" and "cilium".'
  signature: 'networkDataplane: str | NetworkDataplane'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.networkMode
  name: networkMode
  summary: 'The network mode Azure CNI is configured with. This cannot be specified
    if networkPlugin is

    anything other than ''azure''. Known values are: "transparent" and "bridge".'
  signature: 'networkMode: str | NetworkMode'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.networkPlugin
  name: networkPlugin
  summary: '"azure",

    "kubenet", and "none".'
  signature: 'networkPlugin: str | NetworkPlugin'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.networkPluginMode
  name: networkPluginMode
  summary: The mode the network plugin should use. "overlay"
  signature: 'networkPluginMode: str | NetworkPluginMode'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.networkPolicy
  name: networkPolicy
  summary: '"none",

    "calico", "azure", and "cilium".'
  signature: 'networkPolicy: str | NetworkPolicy'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.outboundType
  name: outboundType
  summary: 'The outbound (egress) routing method. This can only be set at cluster
    creation time and cannot

    be changed later. For more information see [egress outbound type](https://docs.microsoft.com/azure/aks/egress-outboundtype).
    Known values are:

    "loadBalancer", "userDefinedRouting", "managedNATGateway", "userAssignedNATGateway",

    and "none".'
  signature: 'outboundType: str | OutboundType'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.podCidr
  name: podCidr
  summary: A CIDR notation IP range from which to assign pod IPs when kubenet is used.
  signature: 'podCidr: str'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.podCidrs
  name: podCidrs
  summary: 'The CIDR notation IP ranges from which to assign pod IPs. One IPv4 CIDR
    is expected for

    single-stack networking. Two CIDRs, one for each IP family (IPv4/IPv6), is expected
    for

    dual-stack networking.'
  signature: 'podCidrs: list[str]'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.serviceCidr
  name: serviceCidr
  summary: 'A CIDR notation IP range from which to assign service cluster IPs. It
    must not overlap with any

    Subnet IP ranges.'
  signature: 'serviceCidr: str'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.serviceCidrs
  name: serviceCidrs
  summary: 'The CIDR notation IP ranges from which to assign service cluster IPs.
    One IPv4 CIDR is expected

    for single-stack networking. Two CIDRs, one for each IP family (IPv4/IPv6), is
    expected for

    dual-stack networking. They must not overlap with any Subnet IP ranges.'
  signature: 'serviceCidrs: list[str]'
- uid: azure.mgmt.containerservice.types.ContainerServiceNetworkProfile.staticEgressGatewayProfile
  name: staticEgressGatewayProfile
  summary: 'The profile for Static Egress Gateway addon. For more details about Static
    Egress Gateway, see

    [https://aka.ms/aks/static-egress-gateway](https://aka.ms/aks/static-egress-gateway).'
  signature: 'staticEgressGatewayProfile: ManagedClusterStaticEgressGatewayProfile'
