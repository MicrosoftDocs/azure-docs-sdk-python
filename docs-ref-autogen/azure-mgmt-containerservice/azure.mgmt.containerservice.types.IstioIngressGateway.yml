### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.IstioIngressGateway
name: IstioIngressGateway
fullName: azure.mgmt.containerservice.types.IstioIngressGateway
module: azure.mgmt.containerservice.types
summary: 'Istio ingress gateway configuration. For now, we support up to one external
  ingress gateway

  named `aks-istio-ingressgateway-external` and one internal ingress gateway named

  `aks-istio-ingressgateway-internal`.'
constructor:
  syntax: IstioIngressGateway()
variables:
- description: 'Mode of an ingress gateway. Required. Known values are: "External"
    and "Internal".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IstioIngressGatewayMode">]
- description: Whether to enable the ingress gateway. Required.
  name: enabled
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.containerservice.types.IstioIngressGateway.enabled
  name: enabled
  summary: Whether to enable the ingress gateway. Required.
  signature: 'enabled: Required[bool]'
- uid: azure.mgmt.containerservice.types.IstioIngressGateway.mode
  name: mode
  summary: '"External" and "Internal".'
  signature: 'mode: Required[str | IstioIngressGatewayMode]'
