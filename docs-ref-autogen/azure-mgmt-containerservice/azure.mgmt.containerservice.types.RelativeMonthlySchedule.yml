### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.RelativeMonthlySchedule
name: RelativeMonthlySchedule
fullName: azure.mgmt.containerservice.types.RelativeMonthlySchedule
module: azure.mgmt.containerservice.types
summary: 'For schedules like: ''recur every month on the first Monday'' or ''recur
  every 3 months on last

  Friday''.'
constructor:
  syntax: RelativeMonthlySchedule()
variables:
- description: Specifies the number of months between each set of occurrences. Required.
  name: intervalMonths
  types:
  - <xref:int>
- description: 'The week index. Specifies on which week of the month the dayOfWeek
    applies.

    Required. Known values are: "First", "Second", "Third", "Fourth", and "Last".'
  name: weekIndex
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Type">]
- description: 'Specifies on which day of the week the maintenance occurs. Required.
    Known

    values are: "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday",
    and "Saturday".'
  name: dayOfWeek
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WeekDay">]
attributes:
- uid: azure.mgmt.containerservice.types.RelativeMonthlySchedule.dayOfWeek
  name: dayOfWeek
  summary: 'Specifies on which day of the week the maintenance occurs. Required. Known
    values are:

    "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", and "Saturday".'
  signature: 'dayOfWeek: Required[str | WeekDay]'
- uid: azure.mgmt.containerservice.types.RelativeMonthlySchedule.intervalMonths
  name: intervalMonths
  summary: Specifies the number of months between each set of occurrences. Required.
  signature: 'intervalMonths: Required[int]'
- uid: azure.mgmt.containerservice.types.RelativeMonthlySchedule.weekIndex
  name: weekIndex
  summary: 'The week index. Specifies on which week of the month the dayOfWeek applies.
    Required. Known

    values are: "First", "Second", "Third", "Fourth", and "Last".'
  signature: 'weekIndex: Required[str | Type]'
