### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterProperties
name: ManagedClusterProperties
fullName: azure.mgmt.containerservice.types.ManagedClusterProperties
module: azure.mgmt.containerservice.types
summary: Properties of the managed cluster.
constructor:
  syntax: ManagedClusterProperties()
variables:
- description: The current provisioning state.
  name: provisioningState
  types:
  - <xref:str>
- description: The Power State of the cluster.
  name: powerState
  types:
  - <xref:<xref:"PowerState">>
- description: The max number of agent pools for the managed cluster.
  name: maxAgentPools
  types:
  - <xref:int>
- description: 'The version of Kubernetes specified by the user. Both patch version

    <major.minor.patch> (e.g. 1.20.13) and <major.minor> (e.g. 1.20) are supported.
    When

    <major.minor> is specified, the latest supported GA patch version is chosen automatically.

    Updating the cluster with the same <major.minor> once it has been created (e.g.
    1.14.x -> 1.14)

    will not trigger an upgrade, even if a newer patch version is available. When
    you upgrade a

    supported AKS cluster, Kubernetes minor versions cannot be skipped. All upgrades
    must be

    performed sequentially by major version number. For example, upgrades between
    1.14.x -> 1.15.x

    or 1.15.x -> 1.16.x are allowed, however 1.14.x -> 1.16.x is not allowed. See
    [upgrading an AKS

    cluster](https://docs.microsoft.com/azure/aks/upgrade-cluster) for more details.'
  name: kubernetesVersion
  types:
  - <xref:str>
- description: 'The version of Kubernetes the Managed Cluster is running. If

    kubernetesVersion was a fully specified version <major.minor.patch>, this field
    will be exactly

    equal to it. If kubernetesVersion was <major.minor>, this field will contain the
    full

    <major.minor.patch> version being used.'
  name: currentKubernetesVersion
  types:
  - <xref:str>
- description: 'The DNS prefix of the Managed Cluster. This cannot be updated once
    the Managed

    Cluster has been created.'
  name: dnsPrefix
  types:
  - <xref:str>
- description: 'The FQDN subdomain of the private cluster with custom private dns
    zone.

    This cannot be updated once the Managed Cluster has been created.'
  name: fqdnSubdomain
  types:
  - <xref:str>
- description: The FQDN of the master pool.
  name: fqdn
  types:
  - <xref:str>
- description: The FQDN of private cluster.
  name: privateFQDN
  types:
  - <xref:str>
- description: 'The special FQDN used by the Azure Portal to access the Managed Cluster.

    This FQDN is for use only by the Azure Portal and should not be used by other
    clients. The

    Azure Portal requires certain Cross-Origin Resource Sharing (CORS) headers to
    be sent in some

    responses, which Kubernetes APIServer doesn''t handle by default. This special
    FQDN supports

    CORS, allowing the Azure Portal to function properly.'
  name: azurePortalFQDN
  types:
  - <xref:str>
- description: The agent pool properties.
  name: agentPoolProfiles
  types:
  - <xref:list>[<xref:"ManagedClusterAgentPoolProfile">]
- description: The profile for Linux VMs in the Managed Cluster.
  name: linuxProfile
  types:
  - <xref:<xref:"ContainerServiceLinuxProfile">>
- description: The profile for Windows VMs in the Managed Cluster.
  name: windowsProfile
  types:
  - <xref:<xref:"ManagedClusterWindowsProfile">>
- description: 'Information about a service principal identity for the cluster

    to use for manipulating Azure APIs.'
  name: servicePrincipalProfile
  types:
  - <xref:<xref:"ManagedClusterServicePrincipalProfile">>
- description: The profile of managed cluster add-on.
  name: addonProfiles
  types:
  - <xref:dict>[<xref:str>, <xref:"ManagedClusterAddonProfile">]
- description: 'The pod identity profile of the Managed Cluster. See [use AAD pod

    identity](https://docs.microsoft.com/azure/aks/use-azure-ad-pod-identity) for
    more details on

    AAD pod identity integration.'
  name: podIdentityProfile
  types:
  - <xref:<xref:"ManagedClusterPodIdentityProfile">>
- description: The OIDC issuer profile of the Managed Cluster.
  name: oidcIssuerProfile
  types:
  - <xref:<xref:"ManagedClusterOIDCIssuerProfile">>
- description: The name of the resource group containing agent pool nodes.
  name: nodeResourceGroup
  types:
  - <xref:str>
- description: Profile of the node resource group configuration.
  name: nodeResourceGroupProfile
  types:
  - <xref:<xref:"ManagedClusterNodeResourceGroupProfile">>
- description: Whether to enable Kubernetes Role-Based Access Control.
  name: enableRBAC
  types:
  - <xref:bool>
- description: 'The support plan for the Managed Cluster. If unspecified, the default
    is

    ''KubernetesOfficial''. Known values are: "KubernetesOfficial" and "AKSLongTermSupport".'
  name: supportPlan
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KubernetesSupportPlan">]
- description: The network configuration profile.
  name: networkProfile
  types:
  - <xref:<xref:"ContainerServiceNetworkProfile">>
- description: The Azure Active Directory configuration.
  name: aadProfile
  types:
  - <xref:<xref:"ManagedClusterAADProfile">>
- description: The auto upgrade configuration.
  name: autoUpgradeProfile
  types:
  - <xref:<xref:"ManagedClusterAutoUpgradeProfile">>
- description: Settings for upgrading a cluster.
  name: upgradeSettings
  types:
  - <xref:<xref:"ClusterUpgradeSettings">>
- description: Parameters to be applied to the cluster-autoscaler when enabled.
  name: autoScalerProfile
  types:
  - <xref:<xref:"ManagedClusterPropertiesAutoScalerProfile">>
- description: The access profile for managed cluster API server.
  name: apiServerAccessProfile
  types:
  - <xref:<xref:"ManagedClusterAPIServerAccessProfile">>
- description: 'The Resource ID of the disk encryption set to use for enabling

    encryption at rest. This is of the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Compute/diskEncryptionSets/{encryptionSetName}''.'
  name: diskEncryptionSetID
  types:
  - <xref:str>
- description: 'The user identity associated with the managed cluster. This identity

    will be used by the kubelet. Only one user assigned identity is allowed. The only
    accepted key

    is "kubeletidentity", with value of "resourceId":

    "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}".'
  name: identityProfile
  types:
  - <xref:dict>[<xref:str>, <xref:"UserAssignedIdentity">]
- description: Private link resources associated with the cluster.
  name: privateLinkResources
  types:
  - <xref:list>[<xref:"PrivateLinkResource">]
- description: 'If local accounts should be disabled on the Managed Cluster. If set

    to true, getting static credentials will be disabled for this cluster. This must
    only be used

    on Managed Clusters that are AAD enabled. For more details see [disable local
    accounts](https://docs.microsoft.com/azure/aks/managed-aad#disable-local-accounts-preview).'
  name: disableLocalAccounts
  types:
  - <xref:bool>
- description: Configurations for provisioning the cluster with HTTP proxy servers.
  name: httpProxyConfig
  types:
  - <xref:<xref:"ManagedClusterHTTPProxyConfig">>
- description: Security profile for the managed cluster.
  name: securityProfile
  types:
  - <xref:<xref:"ManagedClusterSecurityProfile">>
- description: Storage profile for the managed cluster.
  name: storageProfile
  types:
  - <xref:<xref:"ManagedClusterStorageProfile">>
- description: Ingress profile for the managed cluster.
  name: ingressProfile
  types:
  - <xref:<xref:"ManagedClusterIngressProfile">>
- description: 'PublicNetworkAccess of the managedCluster. Allow or deny public

    network access for AKS. Known values are: "Enabled" and "Disabled".'
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: Workload Auto-scaler profile for the managed cluster.
  name: workloadAutoScalerProfile
  types:
  - <xref:<xref:"ManagedClusterWorkloadAutoScalerProfile">>
- description: Azure Monitor addon profiles for monitoring the managed cluster.
  name: azureMonitorProfile
  types:
  - <xref:<xref:"ManagedClusterAzureMonitorProfile">>
- description: Service mesh profile for a managed cluster.
  name: serviceMeshProfile
  types:
  - <xref:<xref:"ServiceMeshProfile">>
- description: 'The resourceUID uniquely identifies ManagedClusters that reuse ARM

    ResourceIds (i.e: create, delete, create sequence).'
  name: resourceUID
  types:
  - <xref:str>
- description: Optional cluster metrics configuration.
  name: metricsProfile
  types:
  - <xref:<xref:"ManagedClusterMetricsProfile">>
- description: Node provisioning settings that apply to the whole cluster.
  name: nodeProvisioningProfile
  types:
  - <xref:<xref:"ManagedClusterNodeProvisioningProfile">>
- description: Profile of the cluster bootstrap configuration.
  name: bootstrapProfile
  types:
  - <xref:<xref:"ManagedClusterBootstrapProfile">>
- description: 'AI toolchain operator settings that apply to the whole

    cluster.'
  name: aiToolchainOperatorProfile
  types:
  - <xref:<xref:"ManagedClusterAIToolchainOperatorProfile">>
- description: 'Profile with scheduler-related settings, like the configuration mode

    for each scheduler managed by AKS. See [https://aka.ms/aks/scheduler-profile](https://aka.ms/aks/scheduler-profile).'
  name: schedulerProfile
  types:
  - <xref:<xref:"SchedulerProfile">>
- description: 'Settings for hosted system addons. For more information, see

    [https://aka.ms/aks/automatic/systemcomponents](https://aka.ms/aks/automatic/systemcomponents).'
  name: hostedSystemProfile
  types:
  - <xref:<xref:"ManagedClusterHostedSystemProfile">>
- description: Contains read-only information about the Managed Cluster.
  name: status
  types:
  - <xref:<xref:"ManagedClusterStatus">>
