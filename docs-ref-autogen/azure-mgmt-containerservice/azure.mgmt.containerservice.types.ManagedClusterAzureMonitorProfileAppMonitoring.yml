uid: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileAppMonitoring
name: ManagedClusterAzureMonitorProfileAppMonitoring
fullName: azure.mgmt.containerservice.types.ManagedClusterAzureMonitorProfileAppMonitoring
module: azure.mgmt.containerservice.types
summary: Application Monitoring profile for AKS.
constructor:
  syntax: ManagedClusterAzureMonitorProfileAppMonitoring()
variables:
- description: 'Application Monitoring auto-instrumentation for AKS. Deploys a

    webhook that auto-instruments workloads with Microsoft OpenTelemetry Distros to
    collect

    OpenTelemetry metrics, logs, and traces. See [https://aka.ms/AKSAppMonitoringDocs](https://aka.ms/AKSAppMonitoringDocs)
    and [https://aka.ms/AzureMonitorApplicationMonitoring](https://aka.ms/AzureMonitorApplicationMonitoring)
    for an overview.'
  name: autoInstrumentation
  types:
  - <xref:<xref:"ManagedClusterAzureMonitorProfileAppMonitoringAutoInstrumentation">>
- description: 'Application Monitoring OpenTelemetry Metrics Profile for AKS.

    Collects OpenTelemetry metrics of the application using Azure Monitor OpenTelemetry
    based SDKs.

    See [https://aka.ms/AKSAppMonitoringDocs](https://aka.ms/AKSAppMonitoringDocs)
    and

    [https://aka.ms/AzureMonitorApplicationMonitoring](https://aka.ms/AzureMonitorApplicationMonitoring)
    for an overview.'
  name: openTelemetryMetrics
  types:
  - <xref:<xref:"ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryMetrics">>
- description: 'Application Monitoring OpenTelemetry logs and traces profile

    for AKS. Collects OpenTelemetry logs and traces of the application using Azure
