    OpenTelemetry based SDKs. See [https://aka.ms/AKSAppMonitoringDocs](https://aka.ms/AKSAppMonitoringDocs)
    and [https://aka.ms/AzureMonitorApplicationMonitoring](https://aka.ms/AzureMonitorApplicationMonitoring)
    for an overview.'
  name: openTelemetryLogsAndTraces
  types:
  - <xref:<xref:"ManagedClusterAzureMonitorProfileAppMonitoringOpenTelemetryLogsAndTraces">>
