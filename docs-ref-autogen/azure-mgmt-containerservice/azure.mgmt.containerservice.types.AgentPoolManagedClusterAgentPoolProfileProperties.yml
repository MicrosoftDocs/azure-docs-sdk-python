    Known values are: "MIG1g", "MIG2g", "MIG3g", "MIG4g", and "MIG7g".'
  signature: 'gpuInstanceProfile: str | GPUInstanceProfile'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.gpuProfile
  name: gpuProfile
