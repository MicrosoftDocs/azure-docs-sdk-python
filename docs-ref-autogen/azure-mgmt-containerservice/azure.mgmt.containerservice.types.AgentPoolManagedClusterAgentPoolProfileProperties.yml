  signature: 'eTag: str'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.enableAutoScaling
  name: enableAutoScaling
  summary: Whether to enable auto-scaler.
  signature: 'enableAutoScaling: bool'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.enableEncryptionAtHost
  name: enableEncryptionAtHost
  summary: 'Whether to enable host based OS and data drive encryption. This is only
