    pool to receive their own dedicated public IP addresses. A common scenario is
    for gaming

    workloads, where a console needs to make a direct connection to a cloud virtual
    machine to

    minimize hops. For more information see [assigning a public IP per node](https://docs.microsoft.com/azure/aks/use-multiple-node-pools#assign-a-public-ip-per-node-for-your-node-pools).

    The default is false.'
  signature: 'enableNodePublicIP: bool'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.enableUltraSSD
  name: enableUltraSSD
  summary: Whether to enable UltraSSD.
  signature: 'enableUltraSSD: bool'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.gatewayProfile
  name: gatewayProfile
  summary: 'Profile specific to a managed agent pool in Gateway mode. This field cannot
