  signature: 'hostGroupID: str'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.kubeletConfig
  name: kubeletConfig
  summary: The Kubelet configuration on the agent pool nodes.
