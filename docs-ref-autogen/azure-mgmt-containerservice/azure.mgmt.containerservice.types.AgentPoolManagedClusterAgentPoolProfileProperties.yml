  signature: 'nodeImageVersion: str'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.nodeLabels
  name: nodeLabels
  summary: The node labels to be persisted across all nodes in agent pool.
  signature: 'nodeLabels: dict[str, str]'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.nodePublicIPPrefixID
  name: nodePublicIPPrefixID
  summary: 'The public IP prefix ID which VM nodes should use IPs from. This is of
    the form:

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/publicIPPrefixes/{publicIPPrefixName}.'
  signature: 'nodePublicIPPrefixID: str'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.nodeTaints
  name: nodeTaints
  summary: 'The taints added to new nodes during node pool create and scale. For example,

    key=value:NoSchedule.'
  signature: 'nodeTaints: list[str]'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.orchestratorVersion
  name: orchestratorVersion
  summary: 'The version of Kubernetes specified by the user. Both patch version <major.minor.patch>
    (e.g.

    1.20.13) and <major.minor> (e.g. 1.20) are supported. When <major.minor> is specified,
    the

    latest supported GA patch version is chosen automatically. Updating the cluster
    with the same

    <major.minor> once it has been created (e.g. 1.14.x -> 1.14) will not trigger
    an upgrade, even

    if a newer patch version is available. As a best practice, you should upgrade
    all node pools in

    an AKS cluster to the same Kubernetes version. The node pool version must have
    the same major

    version as the control plane. The node pool minor version must be within two minor
    versions of

    the control plane version. The node pool version cannot be greater than the control
    plane

    version. For more information see [upgrading a node pool](https://docs.microsoft.com/azure/aks/use-multiple-node-pools#upgrade-a-node-pool).'
  signature: 'orchestratorVersion: str'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.osDiskSizeGB
  name: osDiskSizeGB
  summary: 'OS Disk Size in GB to be used to specify the disk size for every machine
    in the master/agent

    pool. If you specify 0, it will apply the default osDisk size according to the
    vmSize

    specified.'
  signature: 'osDiskSizeGB: int'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.osDiskType
  name: osDiskType
  summary: 'The OS disk type to be used for machines in the agent pool. The default
    is ''Ephemeral'' if the

    VM supports it and has a cache disk larger than the requested OSDiskSizeGB. Otherwise,
    defaults

    to ''Managed''. May not be changed after creation. For more information see [Ephemeral
    OS](https://docs.microsoft.com/azure/aks/cluster-configuration#ephemeral-os).
    Known values are:

    "Managed" and "Ephemeral".'
  signature: 'osDiskType: str | OSDiskType'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.osSKU
  name: osSKU
  summary: 'Specifies the OS SKU used by the agent pool. The default is Ubuntu if
    OSType is Linux. The

    default is Windows2019 when Kubernetes <= 1.24 or Windows2022 when Kubernetes
    >= 1.25 if OSType

    is Windows. Known values are: "Ubuntu", "AzureLinux", "AzureLinux3", "CBLMariner",

    "Windows2019", "Windows2022", "Ubuntu2204", "Windows2025", "Ubuntu2404", and

    "AzureContainerLinux".'
  signature: 'osSKU: str | OSSKU'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.osType
  name: osType
  summary: '"Linux" and "Windows".'
  signature: 'osType: str | OSType'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.podIPAllocationMode
  name: podIPAllocationMode
  summary: 'Pod IP Allocation Mode. The IP allocation mode for pods in the agent pool.
    Must be used with

    podSubnetId. The default is ''DynamicIndividual''. Known values are: "DynamicIndividual"
    and

    "StaticBlock".'
  signature: 'podIPAllocationMode: str | PodIPAllocationMode'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.podSubnetID
  name: podSubnetID
  summary: 'The ID of the subnet which pods will join when launched. If omitted, pod
    IPs are statically

    assigned on the node subnet (see vnetSubnetID for more details). This is of the
    form:

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/virtualNetworks/{virtualNetworkName}/subnets/{subnetName}.'
  signature: 'podSubnetID: str'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.powerState
  name: powerState
  summary: 'Whether the Agent Pool is running or stopped. When an Agent Pool is first
    created it is

    initially Running. The Agent Pool can be stopped by setting this field to Stopped.
    A stopped

    Agent Pool stops all of its VMs and does not accrue billing charges. An Agent
    Pool can only be

    stopped if it is Running and provisioning state is Succeeded.'
  signature: 'powerState: PowerState'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.provisioningState
  name: provisioningState
  summary: The current deployment or provisioning state.
  signature: 'provisioningState: str'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.proximityPlacementGroupID
  name: proximityPlacementGroupID
  summary: The ID for Proximity Placement Group.
  signature: 'proximityPlacementGroupID: str'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.scaleDownMode
  name: scaleDownMode
  summary: 'The scale down mode to use when scaling the Agent Pool. This also effects
    the cluster

    autoscaler behavior. If not specified, it defaults to Delete. Known values are:
    "Delete" and

    "Deallocate".'
  signature: 'scaleDownMode: str | ScaleDownMode'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.scaleSetEvictionPolicy
  name: scaleSetEvictionPolicy
  summary: 'The Virtual Machine Scale Set eviction policy. The eviction policy specifies
    what to do with

    the VM when it is evicted. The default is Delete. For more information about eviction
    see [spot

    VMs](https://docs.microsoft.com/azure/virtual-machines/spot-vms). Known values
    are:

    "Delete" and "Deallocate".'
  signature: 'scaleSetEvictionPolicy: str | ScaleSetEvictionPolicy'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.scaleSetPriority
  name: scaleSetPriority
  summary: '"Spot" and "Regular".'
  signature: 'scaleSetPriority: str | ScaleSetPriority'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.securityProfile
  name: securityProfile
  summary: The security settings of an agent pool.
  signature: 'securityProfile: AgentPoolSecurityProfile'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.spotMaxPrice
  name: spotMaxPrice
  summary: 'The max price (in US Dollars) you are willing to pay for spot instances.
    Possible values are

    any decimal value greater than zero or -1 which indicates default price to be
    up-to on-demand.

    Possible values are any decimal value greater than zero or -1 which indicates
    the willingness

    to pay any on-demand price. For more details on spot pricing, see [spot VMs pricing](https://docs.microsoft.com/azure/virtual-machines/spot-vms#pricing).'
  signature: 'spotMaxPrice: float'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.status
  name: status
  summary: Contains read-only information about the Agent Pool.
  signature: 'status: AgentPoolStatus'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.tags
  name: tags
  summary: The tags to be persisted on the agent pool virtual machine scale set.
  signature: 'tags: dict[str, str]'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.type
  name: type
  summary: '"VirtualMachineScaleSets", "AvailabilitySet", and

    "VirtualMachines".'
  signature: 'type: str | AgentPoolType'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.upgradeSettings
  name: upgradeSettings
  summary: Settings for upgrading the agentpool.
  signature: 'upgradeSettings: AgentPoolUpgradeSettings'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.virtualMachineNodesStatus
  name: virtualMachineNodesStatus
  summary: The status of nodes in a VirtualMachines agent pool.
  signature: 'virtualMachineNodesStatus: list[''VirtualMachineNodes'']'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.virtualMachinesProfile
  name: virtualMachinesProfile
  summary: Specifications on VirtualMachines agent pool.
  signature: 'virtualMachinesProfile: VirtualMachinesProfile'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.vmSize
  name: vmSize
  summary: 'The size of the agent pool VMs. VM size availability varies by region.
    If a node contains

    insufficient compute resources (memory, cpu, etc) pods might fail to run correctly.
    For more

    details on restricted VM sizes, see: [https://docs.microsoft.com/azure/aks/quotas-skus-regions](https://docs.microsoft.com/azure/aks/quotas-skus-regions).'
  signature: 'vmSize: str'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.vnetSubnetID
  name: vnetSubnetID
  summary: 'The ID of the subnet which agent pool nodes and optionally pods will join
    on startup. If this

    is not specified, a VNET and subnet will be generated and used. If no podSubnetID
