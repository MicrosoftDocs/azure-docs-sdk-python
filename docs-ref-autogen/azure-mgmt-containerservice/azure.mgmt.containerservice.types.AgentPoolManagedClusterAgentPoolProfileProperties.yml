  signature: 'messageOfTheDay: str'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.minCount
  name: minCount
  summary: The minimum number of nodes for auto-scaling.
  signature: 'minCount: int'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.mode
  name: mode
  summary: 'The mode of an agent pool. A cluster must have at least one ''System''
