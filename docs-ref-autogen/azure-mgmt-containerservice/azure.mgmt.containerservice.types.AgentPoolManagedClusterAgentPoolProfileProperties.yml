- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.linuxOSConfig
  name: linuxOSConfig
  summary: The OS configuration of Linux agent nodes.
  signature: 'linuxOSConfig: LinuxOSConfig'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.localDNSProfile
