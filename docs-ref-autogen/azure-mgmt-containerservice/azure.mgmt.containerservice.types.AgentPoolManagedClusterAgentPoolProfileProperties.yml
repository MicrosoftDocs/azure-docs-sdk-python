- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.currentOrchestratorVersion
  name: currentOrchestratorVersion
  summary: 'The version of Kubernetes the Agent Pool is running. If orchestratorVersion
