  signature: 'enableEncryptionAtHost: bool'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.enableFIPS
  name: enableFIPS
  summary: 'Whether to use a FIPS-enabled OS. See [Add a FIPS-enabled node pool](https://docs.microsoft.com/azure/aks/use-multiple-node-pools#add-a-fips-enabled-node-pool-preview)

    for more details.'
  signature: 'enableFIPS: bool'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.enableNodePublicIP
  name: enableNodePublicIP
  summary: 'Whether each node is allocated its own public IP. Some scenarios may require
