    Known values are: "System",

    "User", and "Gateway".'
  signature: 'mode: str | AgentPoolMode'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.networkProfile
  name: networkProfile
  summary: Network-related settings of an agent pool.
  signature: 'networkProfile: AgentPoolNetworkProfile'
- uid: azure.mgmt.containerservice.types.AgentPoolManagedClusterAgentPoolProfileProperties.nodeImageVersion
  name: nodeImageVersion
  summary: 'The version of the node image. Setting this value triggers an agentPool
