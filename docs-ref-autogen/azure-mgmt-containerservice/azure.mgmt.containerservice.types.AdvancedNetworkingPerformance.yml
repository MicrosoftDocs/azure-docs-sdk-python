### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.AdvancedNetworkingPerformance
name: AdvancedNetworkingPerformance
fullName: azure.mgmt.containerservice.types.AdvancedNetworkingPerformance
module: azure.mgmt.containerservice.types
summary: 'Profile to enable performance-enhancing features on clusters that use Azure
  CNI powered by

  Cilium.'
constructor:
  syntax: AdvancedNetworkingPerformance()
variables:
- description: 'Enable advanced network acceleration options. This allows users to

    configure acceleration using BPF host routing. This can be enabled only with Cilium
    dataplane.

    If not specified, the default value is None (no acceleration). The acceleration
    mode can be

    changed on a pre-existing cluster. See [https://aka.ms/acnsperformance](https://aka.ms/acnsperformance)
    for a detailed explanation. Known values are: "BpfVeth" and

    "None".'
  name: accelerationMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AccelerationMode">]
attributes:
- uid: azure.mgmt.containerservice.types.AdvancedNetworkingPerformance.accelerationMode
  name: accelerationMode
  summary: 'Enable advanced network acceleration options. This allows users to configure
    acceleration using

    BPF host routing. This can be enabled only with Cilium dataplane. If not specified,
    the default

    value is None (no acceleration). The acceleration mode can be changed on a pre-existing

    cluster. See [https://aka.ms/acnsperformance](https://aka.ms/acnsperformance)
    for a detailed

    explanation. Known values are: "BpfVeth" and "None".'
  signature: 'accelerationMode: str | AccelerationMode'
