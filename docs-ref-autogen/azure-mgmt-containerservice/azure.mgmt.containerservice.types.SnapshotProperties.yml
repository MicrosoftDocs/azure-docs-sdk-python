### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.SnapshotProperties
name: SnapshotProperties
fullName: azure.mgmt.containerservice.types.SnapshotProperties
module: azure.mgmt.containerservice.types
summary: Properties used to configure a node pool snapshot.
constructor:
  syntax: SnapshotProperties()
variables:
- description: 'CreationData to be used to specify the source agent pool resource
    ID to

    create this snapshot.'
  name: creationData
  types:
  - <xref:<xref:"CreationData">>
- description: The type of a snapshot. The default is NodePool. "NodePool"
  name: snapshotType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SnapshotType">]
- description: The version of Kubernetes.
  name: kubernetesVersion
  types:
  - <xref:str>
- description: The version of node image.
  name: nodeImageVersion
  types:
  - <xref:str>
- description: 'The operating system type. The default is Linux. Known values are:
    "Linux" and

    "Windows".'
  name: osType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OSType">]
- description: 'Specifies the OS SKU used by the agent pool. The default is Ubuntu
    if OSType is

    Linux. The default is Windows2019 when Kubernetes <= 1.24 or Windows2022 when
    Kubernetes >=

    1.25 if OSType is Windows. Known values are: "Ubuntu", "AzureLinux", "AzureLinux3",

    "CBLMariner", "Windows2019", "Windows2022", "Ubuntu2204", "Windows2025", "Ubuntu2404",
    and

    "AzureContainerLinux".'
  name: osSku
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OSSKU">]
- description: The size of the VM.
  name: vmSize
  types:
  - <xref:str>
- description: Whether to use a FIPS-enabled OS.
  name: enableFIPS
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.containerservice.types.SnapshotProperties.creationData
  name: creationData
  summary: CreationData to be used to specify the source agent pool resource ID to
    create this snapshot.
  signature: 'creationData: CreationData'
- uid: azure.mgmt.containerservice.types.SnapshotProperties.enableFIPS
  name: enableFIPS
  summary: Whether to use a FIPS-enabled OS.
  signature: 'enableFIPS: bool'
- uid: azure.mgmt.containerservice.types.SnapshotProperties.kubernetesVersion
  name: kubernetesVersion
  summary: The version of Kubernetes.
  signature: 'kubernetesVersion: str'
- uid: azure.mgmt.containerservice.types.SnapshotProperties.nodeImageVersion
  name: nodeImageVersion
  summary: The version of node image.
  signature: 'nodeImageVersion: str'
- uid: azure.mgmt.containerservice.types.SnapshotProperties.osSku
  name: osSku
  summary: 'Specifies the OS SKU used by the agent pool. The default is Ubuntu if
    OSType is Linux. The

    default is Windows2019 when Kubernetes <= 1.24 or Windows2022 when Kubernetes
    >= 1.25 if OSType

    is Windows. Known values are: "Ubuntu", "AzureLinux", "AzureLinux3", "CBLMariner",

    "Windows2019", "Windows2022", "Ubuntu2204", "Windows2025", "Ubuntu2404", and

    "AzureContainerLinux".'
  signature: 'osSku: str | OSSKU'
- uid: azure.mgmt.containerservice.types.SnapshotProperties.osType
  name: osType
  summary: '"Linux" and "Windows".'
  signature: 'osType: str | OSType'
- uid: azure.mgmt.containerservice.types.SnapshotProperties.snapshotType
  name: snapshotType
  summary: The type of a snapshot. The default is NodePool. "NodePool"
  signature: 'snapshotType: str | SnapshotType'
- uid: azure.mgmt.containerservice.types.SnapshotProperties.vmSize
  name: vmSize
  summary: The size of the VM.
  signature: 'vmSize: str'
