### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.Schedule
name: Schedule
fullName: azure.mgmt.containerservice.types.Schedule
module: azure.mgmt.containerservice.types
summary: 'One and only one of the schedule types should be specified. Choose either
  ''daily'', ''weekly'',

  ''absoluteMonthly'' or ''relativeMonthly'' for your maintenance schedule.'
constructor:
  syntax: Schedule()
variables:
- description: 'For schedules like: ''recur every day'' or ''recur every 3 days''.'
  name: daily
  types:
  - <xref:<xref:"DailySchedule">>
- description: 'For schedules like: ''recur every Monday'' or ''recur every 3 weeks
    on Wednesday''.'
  name: weekly
  types:
  - <xref:<xref:"WeeklySchedule">>
- description: 'For schedules like: ''recur every month on the 15th'' or ''recur every
    3

    months on the 20th''.'
  name: absolute_monthly
  types:
  - <xref:<xref:"AbsoluteMonthlySchedule">>
- description: 'For schedules like: ''recur every month on the first Monday'' or ''recur

    every 3 months on last Friday''.'
  name: relative_monthly
  types:
  - <xref:<xref:"RelativeMonthlySchedule">>
attributes:
- uid: azure.mgmt.containerservice.types.Schedule.absoluteMonthly
  name: absoluteMonthly
  summary: '''recur every month on the 15th'' or ''recur every 3 months on the 20th''.'
  signature: 'absoluteMonthly: AbsoluteMonthlySchedule'
- uid: azure.mgmt.containerservice.types.Schedule.daily
  name: daily
  summary: '''recur every day'' or ''recur every 3 days''.'
  signature: 'daily: DailySchedule'
- uid: azure.mgmt.containerservice.types.Schedule.relativeMonthly
  name: relativeMonthly
  summary: '''recur every month on the first Monday'' or ''recur every 3 months on
    last

    Friday''.'
  signature: 'relativeMonthly: RelativeMonthlySchedule'
- uid: azure.mgmt.containerservice.types.Schedule.weekly
  name: weekly
  summary: '''recur every Monday'' or ''recur every 3 weeks on Wednesday''.'
  signature: 'weekly: WeeklySchedule'
