### YamlMime:PythonClass
uid: azure.mgmt.containerservice.models.ManagedClusterSecurityProfileDefenderSecurityGating
name: ManagedClusterSecurityProfileDefenderSecurityGating
fullName: azure.mgmt.containerservice.models.ManagedClusterSecurityProfileDefenderSecurityGating
module: azure.mgmt.containerservice.models
summary: 'Microsoft Defender settings for security gating. This validates container
  image eligibility for

  deployment based on Defender for Containers security findings. Using Admission Controller,
  it

  either audits or prevents deployment of images that do not meet security standards.'
constructor:
  syntax: 'ManagedClusterSecurityProfileDefenderSecurityGating(*args: Any, **kwargs:
    Any)'
variables:
- description: 'Whether to enable Defender security gating. When enabled, the gating
    feature

    scans container images and audits or blocks deployment of images that do not meet
    security

    standards according to configured security rules. For more information, see

    [https://aka.ms/KubernetesDefenderAuditRule](https://aka.ms/KubernetesDefenderAuditRule).'
  name: enabled
  types:
  - <xref:bool>
- description: 'List of identities that the admission controller uses to pull security

    artifacts from registries. These are the same identities used by the cluster to
    pull container

    images. For more information on configuring this identity, see

    [https://learn.microsoft.com/en-us/azure/defender-for-cloud/gated-deployment-infrastructure-as-code](https://learn.microsoft.com/en-us/azure/defender-for-cloud/gated-deployment-infrastructure-as-code).'
  name: identities
  types:
  - <xref:list>[<xref:azure.mgmt.containerservice.models.ManagedClusterSecurityProfileDefenderSecurityGatingIdentity>]
- description: 'In use only while registry access is granted by secret rather than

    managed identity. Sets whether to grant the Defender gating agent access to cluster
    secrets for

    pulling images from registries. If secret access is denied and the registry requires
    pull

    secrets, the add-on will not perform image validation. Default value is false.'
  name: allow_secret_access
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.containerservice.models.ManagedClusterSecurityProfileDefenderSecurityGating.allow_secret_access
  name: allow_secret_access
  summary: 'In use only while registry access is granted by secret rather than managed
    identity. Sets

    whether to grant the Defender gating agent access to cluster secrets for pulling
    images from

    registries. If secret access is denied and the registry requires pull secrets,
    the add-on will

    not perform image validation. Default value is false.'
  signature: 'allow_secret_access: bool | None'
- uid: azure.mgmt.containerservice.models.ManagedClusterSecurityProfileDefenderSecurityGating.enabled
  name: enabled
  summary: 'Whether to enable Defender security gating. When enabled, the gating feature
    scans container

    images and audits or blocks deployment of images that do not meet security standards
    according

    to configured security rules. For more information, see

    [https://aka.ms/KubernetesDefenderAuditRule](https://aka.ms/KubernetesDefenderAuditRule).'
  signature: 'enabled: bool | None'
- uid: azure.mgmt.containerservice.models.ManagedClusterSecurityProfileDefenderSecurityGating.identities
  name: identities
  summary: 'List of identities that the admission controller uses to pull security
    artifacts from

    registries. These are the same identities used by the cluster to pull container
    images. For

    more information on configuring this identity, see

    [https://learn.microsoft.com/en-us/azure/defender-for-cloud/gated-deployment-infrastructure-as-code](https://learn.microsoft.com/en-us/azure/defender-for-cloud/gated-deployment-infrastructure-as-code).'
  signature: 'identities: list[''_models.ManagedClusterSecurityProfileDefenderSecurityGatingIdentity'']
    | None'
