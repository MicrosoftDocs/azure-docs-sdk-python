### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.TrustedAccessRoleBindingProperties
name: TrustedAccessRoleBindingProperties
fullName: azure.mgmt.containerservice.types.TrustedAccessRoleBindingProperties
module: azure.mgmt.containerservice.types
summary: Properties for trusted access role binding.
constructor:
  syntax: TrustedAccessRoleBindingProperties()
variables:
- description: 'The current provisioning state of trusted access role binding. Known

    values are: "Canceled", "Deleting", "Failed", "Succeeded", and "Updating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TrustedAccessRoleBindingProvisioningState">]
- description: 'The ARM resource ID of source resource that trusted access is

    configured for. Required.'
  name: source_resource_id
  types:
  - <xref:str>
- description: 'A list of roles to bind, each item is a resource type qualified role
    name. For

    example: ''Microsoft.MachineLearningServices/workspaces/reader''. Required.'
  name: roles
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.containerservice.types.TrustedAccessRoleBindingProperties.provisioningState
  name: provisioningState
  summary: '"Canceled",

    "Deleting", "Failed", "Succeeded", and "Updating".'
  signature: 'provisioningState: str | TrustedAccessRoleBindingProvisioningState'
- uid: azure.mgmt.containerservice.types.TrustedAccessRoleBindingProperties.roles
  name: roles
  summary: 'A list of roles to bind, each item is a resource type qualified role name.
    For example:

    ''Microsoft.MachineLearningServices/workspaces/reader''. Required.'
  signature: 'roles: Required[list[str]]'
- uid: azure.mgmt.containerservice.types.TrustedAccessRoleBindingProperties.sourceResourceId
  name: sourceResourceId
  summary: The ARM resource ID of source resource that trusted access is configured
    for. Required.
  signature: 'sourceResourceId: Required[str]'
