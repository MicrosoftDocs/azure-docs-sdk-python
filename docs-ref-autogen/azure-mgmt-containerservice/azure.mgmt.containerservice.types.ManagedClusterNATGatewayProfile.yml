### YamlMime:PythonClass
uid: azure.mgmt.containerservice.types.ManagedClusterNATGatewayProfile
name: ManagedClusterNATGatewayProfile
fullName: azure.mgmt.containerservice.types.ManagedClusterNATGatewayProfile
module: azure.mgmt.containerservice.types
summary: Profile of the managed cluster NAT gateway.
constructor:
  syntax: ManagedClusterNATGatewayProfile()
variables:
- description: 'The SKU of the managed cluster NAT Gateway. Defaults to ''StandardV2''
    where available

    in the region, otherwise ''Standard''. Known values are: "Standard" and "StandardV2".'
  name: sku
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ManagedClusterNATGatewaySku">]
- description: 'Profile of the managed outbound IP resources of the cluster NAT

    gateway.'
  name: managedOutboundIPProfile
  types:
  - <xref:<xref:"ManagedClusterManagedOutboundIPProfile">>
- description: The effective outbound IP resources of the cluster NAT gateway.
  name: effectiveOutboundIPs
  types:
  - <xref:list>[<xref:"ResourceReference">]
- description: 'Desired outbound IP Prefix resources for the managed NAT Gateway.

    Only compatible with NAT Gateway V2.'
  name: outboundIPPrefixes
  types:
  - <xref:<xref:"ManagedClusterNATGatewayProfileOutboundIpPrefixes">>
- description: Desired outbound IP resources for the managed NAT Gateway.
  name: outboundIPs
  types:
  - <xref:<xref:"ManagedClusterNATGatewayProfileOutboundIPs">>
- description: 'Desired outbound flow idle timeout in minutes. Allowed values are

    in the range of 4 to 120 (inclusive). The default value is 4 minutes.'
  name: idleTimeoutInMinutes
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.containerservice.types.ManagedClusterNATGatewayProfile.effectiveOutboundIPs
  name: effectiveOutboundIPs
  summary: The effective outbound IP resources of the cluster NAT gateway.
  signature: 'effectiveOutboundIPs: list[''ResourceReference'']'
- uid: azure.mgmt.containerservice.types.ManagedClusterNATGatewayProfile.idleTimeoutInMinutes
  name: idleTimeoutInMinutes
  summary: 'Desired outbound flow idle timeout in minutes. Allowed values are in the
    range of 4 to 120

    (inclusive). The default value is 4 minutes.'
  signature: 'idleTimeoutInMinutes: int'
- uid: azure.mgmt.containerservice.types.ManagedClusterNATGatewayProfile.managedOutboundIPProfile
  name: managedOutboundIPProfile
  summary: Profile of the managed outbound IP resources of the cluster NAT gateway.
  signature: 'managedOutboundIPProfile: ManagedClusterManagedOutboundIPProfile'
- uid: azure.mgmt.containerservice.types.ManagedClusterNATGatewayProfile.outboundIPPrefixes
  name: outboundIPPrefixes
  summary: 'Desired outbound IP Prefix resources for the managed NAT Gateway. Only
    compatible with NAT

    Gateway V2.'
  signature: 'outboundIPPrefixes: ManagedClusterNATGatewayProfileOutboundIpPrefixes'
- uid: azure.mgmt.containerservice.types.ManagedClusterNATGatewayProfile.outboundIPs
  name: outboundIPs
  summary: Desired outbound IP resources for the managed NAT Gateway.
  signature: 'outboundIPs: ManagedClusterNATGatewayProfileOutboundIPs'
- uid: azure.mgmt.containerservice.types.ManagedClusterNATGatewayProfile.sku
  name: sku
  summary: 'The SKU of the managed cluster NAT Gateway. Defaults to ''StandardV2''
    where available in the

    region, otherwise ''Standard''. Known values are: "Standard" and "StandardV2".'
  signature: 'sku: str | ManagedClusterNATGatewaySku'
