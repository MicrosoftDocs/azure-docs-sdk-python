### YamlMime:PythonClass
uid: azure.ai.ml.entities.BatchRetrySettings
name: BatchRetrySettings
fullName: azure.ai.ml.entities.BatchRetrySettings
module: azure.ai.ml.entities
summary: Retry settings for batch deployment.
constructor:
  syntax: 'BatchRetrySettings(*, max_retries: int | None = None, timeout: int | None
    = None)'
  keywordOnlyParameters:
  - name: max_retries
    description: Number of retries in failure, defaults to 3
    defaultValue: None
    types:
    - <xref:int>
  - name: timeout
    description: Timeout in seconds, defaults to 30
    defaultValue: None
    types:
    - <xref:int>
