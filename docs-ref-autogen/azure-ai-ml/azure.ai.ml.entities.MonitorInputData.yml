### YamlMime:PythonClass
uid: azure.ai.ml.entities.MonitorInputData
name: MonitorInputData
fullName: azure.ai.ml.entities.MonitorInputData
module: azure.ai.ml.entities
summary: Monitor input data.
constructor:
  syntax: 'MonitorInputData(*, type: MonitorInputDataType | None = None, data_context:
    MonitorDatasetContext | None = None, target_columns: Dict | None = None, job_type:
    str | None = None, uri: str | None = None)'
  keywordOnlyParameters:
  - name: type
    description: Specifies the type of monitoring input data.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:azure.ai.ml.constants.MonitorInputDataType>]
  - name: data_context
    description: 'The context of the input dataset. Accepted values are "model_inputs",

      "model_outputs", "training", "test", "validation", and "ground_truth".'
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:azure.ai.ml.constants.MonitorDatasetContext>]
  - name: target_columns
    description: The target columns in the given input dataset.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:typing.Dict>]
  - name: job_type
    description: The job type of the input data.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:str>]
  - name: uri
    description: The URI of the input data.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:str>]
