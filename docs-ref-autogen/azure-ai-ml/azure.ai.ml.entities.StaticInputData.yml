### YamlMime:PythonClass
uid: azure.ai.ml.entities.StaticInputData
name: StaticInputData
fullName: azure.ai.ml.entities.StaticInputData
module: azure.ai.ml.entities
summary: Static input data for monitoring.
constructor:
  syntax: 'StaticInputData(*, data_context: MonitorDatasetContext | None = None, target_columns:
    Dict | None = None, job_type: str | None = None, uri: str | None = None, pre_processing_component_id:
    str | None = None, window_start: str | None = None, window_end: str | None = None)'
  keywordOnlyParameters:
  - name: data_context
    description: The context of the input dataset. Defaults to None.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:azure.ai.ml.constants.MonitorDatasetContext>]
  - name: target_columns
    description: The target columns in the given input dataset. Defaults to None.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:typing.Dict>]
  - name: job_type
    description: The job type of the input data. Defaults to None.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:str>]
  - name: uri
    description: The URI of the input data. Defaults to None.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:str>]
  - name: pre_processing_component_id
    description: The ARM resource ID of the preprocessing component. Defaults to None.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:str>]
  - name: window_start
    description: The start of the static data window (YYYY-MM-DD). Defaults to None.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:str>]
  - name: window_end
    description: The end of the static data window (YYYY-MM-DD). Defaults to None.
    defaultValue: None
    types:
    - <xref:typing.Optional>[<xref:str>]
variables:
- description: Specifies the type of monitoring input data. Set automatically to "Static"
    for this class.
  name: type
  types:
  - <xref:MonitorInputDataType>
