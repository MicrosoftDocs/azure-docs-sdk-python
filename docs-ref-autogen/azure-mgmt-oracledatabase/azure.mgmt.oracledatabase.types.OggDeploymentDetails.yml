### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.OggDeploymentDetails
name: OggDeploymentDetails
fullName: azure.mgmt.oracledatabase.types.OggDeploymentDetails
module: azure.mgmt.oracledatabase.types
summary: OGG deployment details.
constructor:
  syntax: OggDeploymentDetails()
variables:
- description: 'The password associated with the GoldenGate deployment console username.

    The password must be 8 to 30 characters long and must contain at least 1 uppercase,
    1

    lowercase, 1 numeric, and 1 special character. Special characters such as ''$'',
    ''^'', or ''?'' are

    not allowed.'
  name: adminPassword
  types:
  - <xref:str>
- description: The GoldenGate deployment console username.
  name: adminUsername
  types:
  - <xref:str>
- description: The base64 encoded content of the PEM file containing the SSL certificate.
  name: certificate
  types:
  - <xref:str>
- description: 'The type of credential store for OGG. Known values are: "GoldenGate"
    and

    "IAM".'
  name: credentialStore
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CredentialType">]
- description: The name given to the GoldenGate service deployment. Required.
  name: deploymentName
  types:
  - <xref:str>
- description: Defines the IDP Groups to GoldenGate roles mapping.
  name: groupToRolesMapping
  types:
  - <xref:<xref:"GroupToRolesMappingDetails">>
- description: OGG version.
  name: oggVersion
  types:
  - <xref:str>
- description: The OCID of the Secret where the deployment password is stored.
  name: passwordSecretId
  types:
  - <xref:str>
