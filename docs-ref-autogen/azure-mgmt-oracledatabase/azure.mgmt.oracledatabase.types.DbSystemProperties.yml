### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.DbSystemProperties
name: DbSystemProperties
fullName: azure.mgmt.oracledatabase.types.DbSystemProperties
module: azure.mgmt.oracledatabase.types
summary: DbSystem resource model.
constructor:
  syntax: DbSystemProperties()
variables:
- description: 'dbSystem provisioning state. Known values are: "Succeeded", "Failed",

    "Canceled", and "Provisioning".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureResourceProvisioningState">]
- description: HTTPS link to OCI resources exposed to Azure Customer via Azure Interface.
  name: ociUrl
  types:
  - <xref:str>
- description: Azure Resource Anchor ID. Required.
  name: resourceAnchorId
  types:
  - <xref:str>
- description: Azure Network Anchor ID. Required.
  name: networkAnchorId
  types:
  - <xref:str>
- description: 'The cluster name for Exadata and 2-node RAC virtual machine DB systems.
    The

    cluster name must begin with an alphabetic character, and may contain hyphens
    (-). Underscores

    (_) are not permitted. The cluster name can be no longer than 11 characters and
    is not case

    sensitive.'
  name: clusterName
  types:
  - <xref:str>
- description: 'The user-friendly name for the DB system. The name does not have to
    be

    unique.'
  name: displayName
  types:
  - <xref:str>
- description: 'Size in GB of the initial data volume that will be created

    and attached to a virtual machine DB system. You can scale up storage after provisioning,
    as

    needed. Note that the total storage size attached will be more than the amount
    you specify to

    allow for REDO/RECO space and software volume.'
  name: initialDataStorageSizeInGb
  types:
  - <xref:int>
- description: 'The data storage size, in gigabytes, that is currently available to

    the DB system. Applies only for virtual machine DB systems.'
  name: dataStorageSizeInGbs
  types:
  - <xref:int>
- description: The DB system options.
  name: dbSystemOptions
  types:
  - <xref:<xref:"DbSystemOptions">>
- description: 'The type of redundancy configured for the DB system. NORMAL is 2-way

    redundancy. HIGH is 3-way redundancy. Known values are: "High" and "Normal".'
  name: diskRedundancy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskRedundancyType">]
- description: The domain name for the DB system.
  name: domain
  types:
  - <xref:str>
- description: 'The OCID of a grid infrastructure software image. This is a database

    software image of the type GRID_IMAGE.'
  name: gridImageOcid
  types:
  - <xref:str>
- description: The hostname for the DB system. Required.
  name: hostname
  types:
  - <xref:str>
- description: The OCID of the DB system.
  name: ocid
  types:
  - <xref:str>
- description: 'The Oracle license model that applies to all the databases on the
    DB

    system. The default is LicenseIncluded. Known values are: "LicenseIncluded" and

    "BringYourOwnLicense".'
  name: licenseModel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LicenseModel">]
- description: Additional information about the current lifecycle state.
  name: lifecycleDetails
  types:
  - <xref:str>
- description: 'The current state of the DB system. Known values are: "Provisioning",

    "Available", "Updating", "Terminating", "Terminated", "Failed", "Migrated",

    "MaintenanceInProgress", "NeedsAttention", and "Upgrading".'
  name: lifecycleState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DbSystemLifecycleState">]
- description: The port number configured for the listener on the DB system.
  name: listenerPort
  types:
  - <xref:int>
- description: Memory allocated to the DB system, in gigabytes.
  name: memorySizeInGbs
  types:
  - <xref:int>
- description: 'The number of nodes in the DB system. For RAC DB systems, the value
    is greater

    than 1.'
  name: nodeCount
  types:
  - <xref:int>
- description: 'The FQDN of the DNS record for the SCAN IP addresses that are associated

    with the DB system.'
  name: scanDnsName
  types:
  - <xref:str>
- description: 'The list of Single Client Access Name (SCAN) IP addresses associated
    with the DB

    system. SCAN IP addresses are typically used for load balancing and are not assigned
    to any

    interface. Oracle Clusterware directs the requests to the appropriate nodes in
    the cluster.

    Note: For a single-node DB system, this list is empty.'
  name: scanIps
  types:
  - <xref:list>[<xref:str>]
- description: 'The shape of the DB system. The shape determines resources to allocate
    to the DB

    system. For virtual machine shapes, the number of CPU cores and memory. For bare
    metal and

    Exadata shapes, the number of CPU cores, storage, and memory. Required.'
  name: shape
  types:
  - <xref:str>
- description: 'The public key portion of one or more key pairs used for SSH access
    to the

    DB system. Required.'
  name: sshPublicKeys
  types:
  - <xref:list>[<xref:str>]
- description: 'The block storage volume performance level. Valid values

    are Balanced and HighPerformance. See [Block Volume Performance](/Content/Block/Concepts/blockvolumeperformance.htm)
    for more information. Known values are:

    "Balanced" and "HighPerformance".'
  name: storageVolumePerformanceMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageVolumePerformanceMode">]
- description: The time zone of the DB system, e.g., UTC, to set the timeZone as UTC.
  name: timeZone
  types:
  - <xref:str>
- description: The Oracle Database version of the DB system.
  name: version
  types:
  - <xref:str>
- description: 'The compute model for Base Database Service. This is required if using
    the

    `computeCount` parameter. If using `cpuCoreCount` then it is an error to specify

    `computeModel` to a non-null value. The ECPU compute model is the recommended
    model, and the

    OCPU compute model is legacy. Known values are: "ECPU" and "OCPU".'
  name: computeModel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ComputeModel">]
- description: The number of compute servers for the DB system.
  name: computeCount
  types:
  - <xref:int>
- description: 'Indicates user preferences for the various diagnostic collection

    options for the Base DB.'
  name: dataCollectionOptions
  types:
  - <xref:<xref:"DataCollectionOptions">>
- description: The character set for the DB system. The default is AL32UTF8.
  name: characterSet
  types:
  - <xref:str>
- description: The national character set for the DB system. The default is AL16UTF16.
  name: ncharacterSet
  types:
  - <xref:str>
- description: 'The source of the database for creating a new database. Required.
    for creating a

    new database.'
  name: source
  types:
  - <xref:typing.Literal>[DbSystemSourceType.NONE]
- description: 'The Oracle Database Edition that applies to all the databases on the
    DB

    system. Exadata DB systems and 2-node RAC DB systems require

    EnterpriseEditionExtremePerformance. Required. Known values are: "StandardEdition",

    "EnterpriseEdition", "EnterpriseEditionHighPerformance", "EnterpriseEditionExtreme",
    and

    "EnterpriseEditionDeveloper".'
  name: databaseEdition
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DbSystemDatabaseEditionType">]
- description: 'A strong password for SYS, SYSTEM, and PDB Admin. The password must
    be at

    least nine characters and contain at least two uppercase, two lowercase, two numbers,
    and two

    special characters. The special characters must be _, #, or -.'
  name: adminPassword
  types:
  - <xref:str>
- description: 'A valid Oracle Database version. For a list of supported versions,
    use the

    ListDbVersions operation. Required.'
  name: dbVersion
  types:
  - <xref:str>
- description: 'The name of the pluggable database. The name must begin with an alphabetic

    character and can contain a maximum of thirty alphanumeric characters. Special
    characters are

    not permitted. Pluggable database should not be same as database name.'
  name: pdbName
  types:
  - <xref:str>
