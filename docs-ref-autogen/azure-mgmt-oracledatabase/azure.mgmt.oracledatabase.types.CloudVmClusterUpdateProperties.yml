  name: licenseModel
  summary: 'The Oracle license model that applies to the cloud VM cluster. The default
    is LICENSE_INCLUDED.

    Known values are: "LicenseIncluded" and "BringYourOwnLicense".'
  signature: 'licenseModel: str | LicenseModel'
- uid: azure.mgmt.oracledatabase.types.CloudVmClusterUpdateProperties.memorySizeInGbs
  name: memorySizeInGbs
  summary: The memory to be allocated in GBs.
  signature: 'memorySizeInGbs: int'
- uid: azure.mgmt.oracledatabase.types.CloudVmClusterUpdateProperties.ocpuCount
  name: ocpuCount
  summary: 'The number of OCPU cores to enable on the cloud VM cluster. Only 1 decimal
