### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.CloudVmClusterUpdateProperties
name: CloudVmClusterUpdateProperties
fullName: azure.mgmt.oracledatabase.types.CloudVmClusterUpdateProperties
module: azure.mgmt.oracledatabase.types
summary: The updatable properties of the CloudVmCluster.
constructor:
  syntax: CloudVmClusterUpdateProperties()
variables:
- description: The data disk group size to be allocated in GBs per VM.
  name: storageSizeInGbs
  types:
  - <xref:int>
- description: Array of mount path and size.
  name: fileSystemConfigurationDetails
  types:
  - <xref:list>[<xref:"FileSystemConfigurationDetails">]
- description: The data disk group size to be allocated in TBs.
  name: dataStorageSizeInTbs
  types:
  - <xref:float>
- description: The local node storage to be allocated in GBs.
  name: dbNodeStorageSizeInGbs
  types:
  - <xref:int>
- description: The memory to be allocated in GBs.
  name: memorySizeInGbs
  types:
  - <xref:int>
- description: The number of CPU cores enabled on the cloud VM cluster.
  name: cpuCoreCount
  types:
  - <xref:int>
- description: 'The number of OCPU cores to enable on the cloud VM cluster. Only 1
    decimal

    place is allowed for the fractional part.'
  name: ocpuCount
  types:
  - <xref:float>
- description: 'The public key portion of one or more key pairs used for SSH access
    to the

    cloud VM cluster.'
  name: sshPublicKeys
  types:
  - <xref:list>[<xref:str>]
- description: 'The Oracle license model that applies to the cloud VM cluster. The
    default

    is LICENSE_INCLUDED. Known values are: "LicenseIncluded" and "BringYourOwnLicense".'
  name: licenseModel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LicenseModel">]
- description: 'Indicates user preferences for the various diagnostic collection

    options for the VM cluster/Cloud VM cluster/VMBM DBCS.'
  name: dataCollectionOptions
  types:
  - <xref:<xref:"DataCollectionOptions">>
- description: Display Name.
  name: displayName
  types:
  - <xref:str>
- description: The list of compute servers to be added to the cloud VM cluster.
  name: computeNodes
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates if the Accelerated Networking feature is enabled

    or disabled for provisioning an Exadata VM cluster. The default value is: false.'
  name: isAcceleratedNetworkEnabled
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.oracledatabase.types.CloudVmClusterUpdateProperties.computeNodes
  name: computeNodes
  summary: The list of compute servers to be added to the cloud VM cluster.
  signature: 'computeNodes: list[str]'
- uid: azure.mgmt.oracledatabase.types.CloudVmClusterUpdateProperties.cpuCoreCount
  name: cpuCoreCount
  summary: The number of CPU cores enabled on the cloud VM cluster.
  signature: 'cpuCoreCount: int'
- uid: azure.mgmt.oracledatabase.types.CloudVmClusterUpdateProperties.dataCollectionOptions
  name: dataCollectionOptions
  summary: 'Indicates user preferences for the various diagnostic collection options
    for the VM

    cluster/Cloud VM cluster/VMBM DBCS.'
  signature: 'dataCollectionOptions: DataCollectionOptions'
- uid: azure.mgmt.oracledatabase.types.CloudVmClusterUpdateProperties.dataStorageSizeInTbs
  name: dataStorageSizeInTbs
  summary: The data disk group size to be allocated in TBs.
  signature: 'dataStorageSizeInTbs: float'
- uid: azure.mgmt.oracledatabase.types.CloudVmClusterUpdateProperties.dbNodeStorageSizeInGbs
  name: dbNodeStorageSizeInGbs
  summary: The local node storage to be allocated in GBs.
  signature: 'dbNodeStorageSizeInGbs: int'
- uid: azure.mgmt.oracledatabase.types.CloudVmClusterUpdateProperties.displayName
  name: displayName
  summary: Display Name.
  signature: 'displayName: str'
