  name: isAcceleratedNetworkEnabled
  summary: 'Indicates if the Accelerated Networking feature is enabled or disabled
    for provisioning an

    Exadata VM cluster. The default value is: false.'
  signature: 'isAcceleratedNetworkEnabled: bool'
