### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.AutonomousDatabaseStandbySummary
name: AutonomousDatabaseStandbySummary
fullName: azure.mgmt.oracledatabase.types.AutonomousDatabaseStandbySummary
module: azure.mgmt.oracledatabase.types
summary: Autonomous Disaster Recovery standby database details.
constructor:
  syntax: AutonomousDatabaseStandbySummary()
variables:
- description: 'The amount of time, in seconds, that the data of the standby database

    lags the data of the primary database. Can be used to determine the potential
    data loss in the

    event of a failover.'
  name: lagTimeInSeconds
  types:
  - <xref:int>
- description: 'The current state of the Autonomous Database. Known values are:

    "Provisioning", "Available", "Stopping", "Stopped", "Starting", "Terminating",
    "Terminated",

    "Unavailable", "RestoreInProgress", "RestoreFailed", "BackupInProgress", "ScaleInProgress",

    "AvailableNeedsAttention", "Updating", "MaintenanceInProgress", "Restarting",
    "Recreating",

    "RoleChangeInProgress", "Upgrading", "Inaccessible", and "Standby".'
  name: lifecycleState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutonomousDatabaseLifecycleState">]
- description: Additional information about the current lifecycle state.
  name: lifecycleDetails
  types:
  - <xref:str>
- description: 'The date and time the Autonomous Data Guard role was switched

    for the standby Autonomous Database.'
  name: timeDataGuardRoleChanged
  types:
  - <xref:str>
- description: 'The date and time the Disaster Recovery role was

    switched for the standby Autonomous Database.'
  name: timeDisasterRecoveryRoleChanged
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.oracledatabase.types.AutonomousDatabaseStandbySummary.lagTimeInSeconds
  name: lagTimeInSeconds
  summary: 'The amount of time, in seconds, that the data of the standby database
    lags the data of the

    primary database. Can be used to determine the potential data loss in the event
    of a failover.'
  signature: 'lagTimeInSeconds: int'
- uid: azure.mgmt.oracledatabase.types.AutonomousDatabaseStandbySummary.lifecycleDetails
  name: lifecycleDetails
  summary: Additional information about the current lifecycle state.
  signature: 'lifecycleDetails: str'
- uid: azure.mgmt.oracledatabase.types.AutonomousDatabaseStandbySummary.lifecycleState
  name: lifecycleState
  summary: '"Provisioning",

    "Available", "Stopping", "Stopped", "Starting", "Terminating", "Terminated",

    "Unavailable", "RestoreInProgress", "RestoreFailed", "BackupInProgress",

    "ScaleInProgress", "AvailableNeedsAttention", "Updating", "MaintenanceInProgress",

    "Restarting", "Recreating", "RoleChangeInProgress", "Upgrading", "Inaccessible",
    and

    "Standby".'
  signature: 'lifecycleState: str | AutonomousDatabaseLifecycleState'
- uid: azure.mgmt.oracledatabase.types.AutonomousDatabaseStandbySummary.timeDataGuardRoleChanged
  name: timeDataGuardRoleChanged
  summary: 'The date and time the Autonomous Data Guard role was switched for the
    standby Autonomous

    Database.'
  signature: 'timeDataGuardRoleChanged: str'
- uid: azure.mgmt.oracledatabase.types.AutonomousDatabaseStandbySummary.timeDisasterRecoveryRoleChanged
  name: timeDisasterRecoveryRoleChanged
  summary: The date and time the Disaster Recovery role was switched for the standby
    Autonomous Database.
  signature: 'timeDisasterRecoveryRoleChanged: str'
