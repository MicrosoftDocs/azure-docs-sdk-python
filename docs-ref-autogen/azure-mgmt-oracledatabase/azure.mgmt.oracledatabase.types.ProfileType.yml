### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.ProfileType
name: ProfileType
fullName: azure.mgmt.oracledatabase.types.ProfileType
module: azure.mgmt.oracledatabase.types
summary: 'The connection string profile to allow clients to group, filter and select
  connection string

  values based on structured metadata.'
constructor:
  syntax: ProfileType()
variables:
- description: 'Consumer group used by the connection. Known values are: "High", "Medium",

    "Low", "Tp", and "Tpurgent".'
  name: consumerGroup
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConsumerGroup">]
- description: A user-friendly name for the connection. Required.
  name: displayName
  types:
  - <xref:str>
- description: 'Host format used in connection string. Required. Known values are:
    "Fqdn" and

    "Ip".'
  name: hostFormat
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HostFormatType">]
- description: True for a regional connection string, applicable to cross-region DG
    only.
  name: isRegional
  types:
  - <xref:bool>
- description: 'Protocol used by the connection. Required. Known values are: "TCP"
    and "TCPS".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProtocolType">]
- description: 'Specifies whether the listener performs a direct hand-off of the session,
    or

    redirects the session. Required. Known values are: "Direct" and "Redirect".'
  name: sessionMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SessionModeType">]
- description: 'Specifies whether the connection string is using the long (LONG),
    Easy

    Connect (EZCONNECT), or Easy Connect Plus (EZCONNECTPLUS) format. Required. Known
    values are:

    "Long", "Ezconnect", and "Ezconnectplus".'
  name: syntaxFormat
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyntaxFormatType">]
- description: 'Specifies whether the TLS handshake is using one-way (SERVER) or

    mutual (MUTUAL) authentication. Known values are: "Server" and "Mutual".'
  name: tlsAuthentication
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TlsAuthenticationType">]
- description: Connection string value. Required.
  name: value
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.oracledatabase.types.ProfileType.consumerGroup
  name: consumerGroup
  summary: '"High", "Medium", "Low", "Tp",

    and "Tpurgent".'
  signature: 'consumerGroup: str | ConsumerGroup'
- uid: azure.mgmt.oracledatabase.types.ProfileType.displayName
  name: displayName
  summary: A user-friendly name for the connection. Required.
  signature: 'displayName: Required[str]'
- uid: azure.mgmt.oracledatabase.types.ProfileType.hostFormat
  name: hostFormat
  summary: '"Fqdn" and "Ip".'
  signature: 'hostFormat: Required[str | HostFormatType]'
- uid: azure.mgmt.oracledatabase.types.ProfileType.isRegional
  name: isRegional
  summary: True for a regional connection string, applicable to cross-region DG only.
  signature: 'isRegional: bool'
- uid: azure.mgmt.oracledatabase.types.ProfileType.protocol
  name: protocol
  summary: '"TCP" and "TCPS".'
  signature: 'protocol: Required[str | ProtocolType]'
- uid: azure.mgmt.oracledatabase.types.ProfileType.sessionMode
  name: sessionMode
  summary: 'Specifies whether the listener performs a direct hand-off of the session,
    or redirects the

    session. Required. Known values are: "Direct" and "Redirect".'
  signature: 'sessionMode: Required[str | SessionModeType]'
- uid: azure.mgmt.oracledatabase.types.ProfileType.syntaxFormat
  name: syntaxFormat
  summary: 'Specifies whether the connection string is using the long (LONG), Easy
    Connect (EZCONNECT), or

    Easy Connect Plus (EZCONNECTPLUS) format. Required. Known values are: "Long",
    "Ezconnect",

    and "Ezconnectplus".'
  signature: 'syntaxFormat: Required[str | SyntaxFormatType]'
- uid: azure.mgmt.oracledatabase.types.ProfileType.tlsAuthentication
  name: tlsAuthentication
  summary: 'Specifies whether the TLS handshake is using one-way (SERVER) or mutual
    (MUTUAL)

    authentication. Known values are: "Server" and "Mutual".'
  signature: 'tlsAuthentication: str | TlsAuthenticationType'
- uid: azure.mgmt.oracledatabase.types.ProfileType.value
  name: value
  summary: Connection string value. Required.
  signature: 'value: Required[str]'
