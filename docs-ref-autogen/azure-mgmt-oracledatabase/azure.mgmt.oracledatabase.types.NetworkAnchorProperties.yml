### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties
name: NetworkAnchorProperties
fullName: azure.mgmt.oracledatabase.types.NetworkAnchorProperties
module: azure.mgmt.oracledatabase.types
summary: Network Anchor properties.
constructor:
  syntax: NetworkAnchorProperties()
variables:
- description: Corresponding resource anchor Azure ID. Required.
  name: resourceAnchorId
  types:
  - <xref:str>
- description: 'NetworkAnchor provisioning state. Known values are: "Succeeded",

    "Failed", "Canceled", and "Provisioning".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureResourceProvisioningState">]
- description: VNET for network connectivity.
  name: vnetId
  types:
  - <xref:str>
- description: Client subnet. Required.
  name: subnetId
  types:
  - <xref:str>
- description: Delegated Azure subnet cidr block.
  name: cidrBlock
  types:
  - <xref:str>
- description: Oracle Cloud Infrastructure VCN OCID.
  name: ociVcnId
  types:
  - <xref:str>
- description: OCI DNS label. This is optional if DNS config is provided.
  name: ociVcnDnsLabel
  types:
  - <xref:str>
- description: Oracle Cloud Infrastructure subnet OCID.
  name: ociSubnetId
  types:
  - <xref:str>
- description: OCI backup subnet cidr block.
  name: ociBackupCidrBlock
  types:
  - <xref:str>
- description: 'Indicates whether DNS zone sync from OCI to Azure is

    enabled.'
  name: isOracleToAzureDnsZoneSyncEnabled
  types:
  - <xref:bool>
- description: 'Indicates whether the Oracle DNS listening endpoint

    is enabled.'
  name: isOracleDnsListeningEndpointEnabled
  types:
  - <xref:bool>
- description: 'Indicates whether the Oracle DNS forwarding

    endpoint is enabled.'
  name: isOracleDnsForwardingEndpointEnabled
  types:
  - <xref:bool>
- description: DNS forwarding rules.
  name: dnsForwardingRules
  types:
  - <xref:list>[<xref:"DnsForwardingRule">]
- description: 'Comma-separated list of CIDRs that are allowed to send

    requests to the DNS listening endpoint.'
  name: dnsListeningEndpointAllowedCidrs
  types:
  - <xref:str>
- description: DNS listening endpoint IP address.
  name: dnsListeningEndpointIpAddress
  types:
  - <xref:str>
- description: DNS forwarding endpoint IP address.
  name: dnsForwardingEndpointIpAddress
  types:
  - <xref:str>
- description: Deep link to OCI console DNS Forwarding rules page.
  name: dnsForwardingRulesUrl
  types:
  - <xref:str>
- description: 'Deep link to OCI console DNS Listening endpoint NSG

    rules.'
  name: dnsListeningEndpointNsgRulesUrl
  types:
  - <xref:str>
- description: 'Deep link to OCI console DNS Forwarding endpoint NSG

    rules.'
  name: dnsForwardingEndpointNsgRulesUrl
  types:
  - <xref:str>
- description: Proximity placement group settings.
  name: proximityPlacementGroup
  types:
  - <xref:<xref:"ProximityPlacementGroup">>
attributes:
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.cidrBlock
  name: cidrBlock
  summary: Delegated Azure subnet cidr block.
  signature: 'cidrBlock: str'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.dnsForwardingEndpointIpAddress
  name: dnsForwardingEndpointIpAddress
  summary: DNS forwarding endpoint IP address.
  signature: 'dnsForwardingEndpointIpAddress: str'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.dnsForwardingEndpointNsgRulesUrl
  name: dnsForwardingEndpointNsgRulesUrl
  summary: Deep link to OCI console DNS Forwarding endpoint NSG rules.
  signature: 'dnsForwardingEndpointNsgRulesUrl: str'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.dnsForwardingRules
  name: dnsForwardingRules
  summary: DNS forwarding rules.
  signature: 'dnsForwardingRules: list[''DnsForwardingRule'']'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.dnsForwardingRulesUrl
  name: dnsForwardingRulesUrl
  summary: Deep link to OCI console DNS Forwarding rules page.
  signature: 'dnsForwardingRulesUrl: str'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.dnsListeningEndpointAllowedCidrs
  name: dnsListeningEndpointAllowedCidrs
  summary: Comma-separated list of CIDRs that are allowed to send requests to the
    DNS listening endpoint.
  signature: 'dnsListeningEndpointAllowedCidrs: str'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.dnsListeningEndpointIpAddress
  name: dnsListeningEndpointIpAddress
  summary: DNS listening endpoint IP address.
  signature: 'dnsListeningEndpointIpAddress: str'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.dnsListeningEndpointNsgRulesUrl
  name: dnsListeningEndpointNsgRulesUrl
  summary: Deep link to OCI console DNS Listening endpoint NSG rules.
  signature: 'dnsListeningEndpointNsgRulesUrl: str'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.isOracleDnsForwardingEndpointEnabled
  name: isOracleDnsForwardingEndpointEnabled
  summary: Indicates whether the Oracle DNS forwarding endpoint is enabled.
  signature: 'isOracleDnsForwardingEndpointEnabled: bool'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.isOracleDnsListeningEndpointEnabled
  name: isOracleDnsListeningEndpointEnabled
  summary: Indicates whether the Oracle DNS listening endpoint is enabled.
  signature: 'isOracleDnsListeningEndpointEnabled: bool'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.isOracleToAzureDnsZoneSyncEnabled
  name: isOracleToAzureDnsZoneSyncEnabled
  summary: Indicates whether DNS zone sync from OCI to Azure is enabled.
  signature: 'isOracleToAzureDnsZoneSyncEnabled: bool'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.ociBackupCidrBlock
  name: ociBackupCidrBlock
  summary: OCI backup subnet cidr block.
  signature: 'ociBackupCidrBlock: str'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.ociSubnetId
  name: ociSubnetId
  summary: Oracle Cloud Infrastructure subnet OCID.
  signature: 'ociSubnetId: str'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.ociVcnDnsLabel
  name: ociVcnDnsLabel
  summary: OCI DNS label. This is optional if DNS config is provided.
  signature: 'ociVcnDnsLabel: str'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.ociVcnId
  name: ociVcnId
  summary: Oracle Cloud Infrastructure VCN OCID.
  signature: 'ociVcnId: str'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled",

    and "Provisioning".'
  signature: 'provisioningState: str | AzureResourceProvisioningState'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.proximityPlacementGroup
  name: proximityPlacementGroup
  summary: Proximity placement group settings.
  signature: 'proximityPlacementGroup: ProximityPlacementGroup'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.resourceAnchorId
  name: resourceAnchorId
  summary: Corresponding resource anchor Azure ID. Required.
  signature: 'resourceAnchorId: Required[str]'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.subnetId
  name: subnetId
  summary: Client subnet. Required.
  signature: 'subnetId: Required[str]'
- uid: azure.mgmt.oracledatabase.types.NetworkAnchorProperties.vnetId
  name: vnetId
  summary: VNET for network connectivity.
  signature: 'vnetId: str'
