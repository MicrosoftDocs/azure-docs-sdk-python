uid: azure.mgmt.oracledatabase.types.ExadataIormConfig
name: ExadataIormConfig
fullName: azure.mgmt.oracledatabase.types.ExadataIormConfig
module: azure.mgmt.oracledatabase.types
summary: ExadataIormConfig for cloud vm cluster.
constructor:
  syntax: ExadataIormConfig()
variables:
- description: An array of IORM settings for all the database in the Exadata DB system.
  name: dbPlans
  types:
  - <xref:list>[<xref:"DbIormConfig">]
- description: Additional information about the current lifecycleState.
  name: lifecycleDetails
  types:
  - <xref:str>
- description: 'The current state of IORM configuration for the Exadata DB system.
    Known

    values are: "BootStrapping", "Enabled", "Disabled", "Updating", and "Failed".'
  name: lifecycleState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IormLifecycleState">]
- description: 'The current value for the IORM objective. The default is AUTO. Known
    values

    are: "LowLatency", "HighThroughput", "Balanced", "Auto", and "Basic".'
  name: objective
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Objective">]
attributes:
- uid: azure.mgmt.oracledatabase.types.ExadataIormConfig.dbPlans
  name: dbPlans
  summary: An array of IORM settings for all the database in the Exadata DB system.
  signature: 'dbPlans: list[''DbIormConfig'']'
- uid: azure.mgmt.oracledatabase.types.ExadataIormConfig.lifecycleDetails
  name: lifecycleDetails
  summary: Additional information about the current lifecycleState.
  signature: 'lifecycleDetails: str'
- uid: azure.mgmt.oracledatabase.types.ExadataIormConfig.lifecycleState
  name: lifecycleState
  summary: 'The current state of IORM configuration for the Exadata DB system. Known
    values are:

    "BootStrapping", "Enabled", "Disabled", "Updating", and "Failed".'
  signature: 'lifecycleState: str | IormLifecycleState'
