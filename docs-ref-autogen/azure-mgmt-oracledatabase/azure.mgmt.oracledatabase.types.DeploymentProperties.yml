### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.DeploymentProperties
name: DeploymentProperties
fullName: azure.mgmt.oracledatabase.types.DeploymentProperties
module: azure.mgmt.oracledatabase.types
summary: GoldenGate Deployment resource model.
constructor:
  syntax: DeploymentProperties()
variables:
- description: Backup schedule.
  name: backupSchedule
  types:
  - <xref:<xref:"BackupScheduleType">>
- description: OCI compartment.
  name: compartment
  types:
  - <xref:str>
- description: The OCID of the deployment being referenced.
  name: ocid
  types:
  - <xref:str>
- description: The minimum number of OCPUs to be made available for this deployment.
  name: cpuCoreCount
  types:
  - <xref:int>
- description: Display name. Required.
  name: displayName
  types:
  - <xref:str>
- description: 'The deployment category. Known values are: "DataReplication",

    "StreamAnalytics", and "DataTransforms".'
  name: category
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CategoryType">]
- description: 'The type of deployment. Known values are: "Ogg", "DatabaseOracle",

    "BigData", "DatabaseMicrosoftSQLServer", "DatabaseMySQL", "DatabasePostGreSQL",

    "DatabaseDB2ZOS", "DATABASE_DB2I", "GGSA", and "DataTransforms".'
  name: deploymentType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentType">]
- description: HTTPS link to OCI resource exposed to Azure Customer via Azure Interface.
  name: deploymentUrl
  types:
  - <xref:str>
- description: 'Environment type. Known values are: "Production" and

    "DevelopmentOrTesting".'
  name: environmentType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SetupType">]
- description: 'Indicates if auto scaling is enabled for the deployment''s CPU core

    count.'
  name: isAutoScalingEnabled
  types:
  - <xref:bool>
- description: Connection IP address.
  name: ingressIps
  types:
  - <xref:list>[<xref:str>]
- description: True if this object is publicly available.
  name: isPublic
  types:
  - <xref:bool>
- description: 'The Oracle license model that applies to a Deployment. Known values
    are:

    "LicenseIncluded" and "BringYourOwnLicense".'
  name: licenseModel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LicenseModel">]
- description: Describes the object's current state in detail.
  name: lifecycleDetails
  types:
  - <xref:str>
- description: 'Possible lifecycle states. Known values are: "Creating", "Updating",

    "Active", "InActive", "Deleting", "Deleted", "Failed", "Needs Attention", "In
    Progress",

    "Canceling", "Canceled", "Succeeded", and "Waiting".'
  name: lifecycleState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeploymentLifecycleState">]
- description: The date time the resource was created in OCI.
  name: timeCreated
  types:
  - <xref:str>
- description: The date time the resource was last updated in OCI.
  name: timeUpdated
  types:
  - <xref:str>
- description: Maintenance configuration.
  name: maintenanceConfiguration
  types:
  - <xref:<xref:"MaintenanceConfigurationType">>
- description: Maintenance window.
  name: maintenanceWindow
  types:
  - <xref:<xref:"MaintenanceWindowType">>
- description: Azure network anchor ID. Required.
  name: networkAnchorId
  types:
  - <xref:str>
- description: Deployment data for creating an OGG deployment.
  name: oggData
  types:
  - <xref:<xref:"OggDeploymentDetails">>
- description: 'The private IP address of VCN representing the access point for the

    associated endpoint service in the GoldenGate service VCN.'
  name: privateIpAddress
  types:
  - <xref:str>
- description: 'Deployment provisioning state. Known values are: "Succeeded",

    "Failed", "Canceled", and "Provisioning".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureResourceProvisioningState">]
- description: Corresponding Azure resource anchor ID. Required.
  name: resourceAnchorId
  types:
  - <xref:str>
- description: Storage utilization in bytes.
  name: storageUtilizationInBytes
  types:
  - <xref:int>
- description: The time zone of the deployment, for example, UTC.
  name: timeZone
  types:
  - <xref:str>
- description: The current version.
  name: version
  types:
  - <xref:str>
