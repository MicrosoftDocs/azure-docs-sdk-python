### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.LongTermBackUpScheduleDetails
name: LongTermBackUpScheduleDetails
fullName: azure.mgmt.oracledatabase.types.LongTermBackUpScheduleDetails
module: azure.mgmt.oracledatabase.types
summary: Details for the long-term backup schedule.
constructor:
  syntax: LongTermBackUpScheduleDetails()
variables:
- description: 'The frequency of the long-term backup schedule. Known values are:

    "OneTime", "Weekly", "Monthly", and "Yearly".'
  name: repeatCadence
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RepeatCadenceType">]
- description: 'The timestamp for the long-term backup schedule. For a MONTHLY cadence,

    months having fewer days than the provided date will have the backup taken on
    the last day of

    that month.'
  name: timeOfBackup
  types:
  - <xref:str>
- description: Retention period, in days, for backups.
  name: retentionPeriodInDays
  types:
  - <xref:int>
- description: 'Indicates if the long-term backup schedule should be deleted. The
    default

    value is `FALSE`.'
  name: isDisabled
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.oracledatabase.types.LongTermBackUpScheduleDetails.isDisabled
  name: isDisabled
  summary: Indicates if the long-term backup schedule should be deleted. The default
    value is `FALSE`.
  signature: 'isDisabled: bool'
- uid: azure.mgmt.oracledatabase.types.LongTermBackUpScheduleDetails.repeatCadence
  name: repeatCadence
  summary: '"OneTime", "Weekly",

    "Monthly", and "Yearly".'
  signature: 'repeatCadence: str | RepeatCadenceType'
- uid: azure.mgmt.oracledatabase.types.LongTermBackUpScheduleDetails.retentionPeriodInDays
  name: retentionPeriodInDays
  summary: Retention period, in days, for backups.
  signature: 'retentionPeriodInDays: int'
- uid: azure.mgmt.oracledatabase.types.LongTermBackUpScheduleDetails.timeOfBackup
  name: timeOfBackup
  summary: 'The timestamp for the long-term backup schedule. For a MONTHLY cadence,
    months having fewer

    days than the provided date will have the backup taken on the last day of that
    month.'
  signature: 'timeOfBackup: str'
