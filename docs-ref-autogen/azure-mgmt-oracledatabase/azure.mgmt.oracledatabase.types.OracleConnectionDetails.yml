### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.OracleConnectionDetails
name: OracleConnectionDetails
fullName: azure.mgmt.oracledatabase.types.OracleConnectionDetails
module: azure.mgmt.oracledatabase.types
summary: The metadata of an Oracle Database Connection.
constructor:
  syntax: OracleConnectionDetails()
variables:
- description: The connection display name. Required.
  name: displayName
  types:
  - <xref:str>
- description: The corresponding resource anchor Azure ID. Required.
  name: resourceAnchorId
  types:
  - <xref:str>
- description: The corresponding network anchor Azure ID. Required.
  name: networkAnchorId
  types:
  - <xref:str>
- description: The OCID of the compartment being referenced.
  name: compartmentId
  types:
  - <xref:str>
- description: The OCID of the connection being referenced.
  name: ocid
  types:
  - <xref:str>
- description: 'Controls the network traffic direction to the target. Known values
    are:

    "SHARED_SERVICE_ENDPOINT", "SHARED_DEPLOYMENT_ENDPOINT", and "DEDICATED_ENDPOINT".'
  name: routingMethod
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RoutingMethod">]
- description: The customer's vault OCID.
  name: vaultId
  types:
  - <xref:str>
- description: The customer's master key OCID.
  name: keyId
  types:
  - <xref:str>
- description: Indicates whether secret OCIDs are used for credential fields.
  name: doesUseSecretIds
  types:
  - <xref:bool>
- description: 'Connection provisioning state. Known values are: "Succeeded",

    "Failed", "Canceled", and "Provisioning".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureResourceProvisioningState">]
- description: 'The connection lifecycle state. Known values are: "CREATING", "UPDATING",

    "ACTIVE", "DELETING", "DELETED", and "FAILED".'
  name: lifecycleState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectionLifecycleState">]
- description: The description of lifecycle state in detail.
  name: lifecycleDetails
  types:
  - <xref:str>
- description: The date time the resource was created in OCI.
  name: timeCreated
  types:
  - <xref:str>
- description: The date time the resource was last updated in OCI.
  name: timeUpdated
  types:
  - <xref:str>
- description: Required. An Oracle Database Connection.
  name: connectionType
  types:
  - <xref:typing.Literal>[ConnectionType.ORACLE]
- description: 'The Oracle technology type. Required. Known values are:

    "AMAZON_RDS_ORACLE", "OCI_AUTONOMOUS_DATABASE", "ORACLE_DATABASE", "ORACLE_EXADATA",

    "ORACLE_EXADATA_DATABASE_AT_AZURE", "ORACLE_EXADATA_DATABASE_AT_GOOGLE_CLOUD",

    "ORACLE_EXADATA_DATABASE_AT_AWS", "ORACLE_AUTONOMOUS_DATABASE_AT_AZURE",

    "ORACLE_AUTONOMOUS_DATABASE_AT_GOOGLE_CLOUD", and "ORACLE_AUTONOMOUS_DATABASE_AT_AWS".'
  name: technologyType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OracleConnectionTechnologyType">]
- description: 'The mode of the database connection session to be established by the
    data

    client. Known values are: "DIRECT" and "REDIRECT".'
  name: sessionMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SessionMode">]
- description: 'The username that is used to connect the associated system of the
    given

    technology. Required.'
  name: username
  types:
  - <xref:str>
- description: The connection string used to connect the associated database.
  name: connectionString
  types:
  - <xref:str>
- description: The authentication mode used to connect the associated database.
  name: authenticationMode
  types:
  - <xref:str>
- description: The OCID of the Secret where the password is stored.
  name: passwordSecretId
  types:
  - <xref:str>
- description: The OCID of the Secret where the wallet is stored.
  name: walletSecretId
  types:
  - <xref:str>
- description: The OCID of the associated database.
  name: databaseId
  types:
  - <xref:str>
- description: The private IP of the associated database endpoint.
  name: privateIp
  types:
  - <xref:str>
