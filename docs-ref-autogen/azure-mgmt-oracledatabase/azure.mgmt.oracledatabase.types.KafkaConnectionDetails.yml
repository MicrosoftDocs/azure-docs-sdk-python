### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.KafkaConnectionDetails
name: KafkaConnectionDetails
fullName: azure.mgmt.oracledatabase.types.KafkaConnectionDetails
module: azure.mgmt.oracledatabase.types
summary: The metadata of a Kafka Connection.
constructor:
  syntax: KafkaConnectionDetails()
variables:
- description: The connection display name. Required.
  name: displayName
  types:
  - <xref:str>
- description: The corresponding resource anchor Azure ID. Required.
  name: resourceAnchorId
  types:
  - <xref:str>
- description: The corresponding network anchor Azure ID. Required.
  name: networkAnchorId
  types:
  - <xref:str>
- description: The OCID of the compartment being referenced.
  name: compartmentId
  types:
  - <xref:str>
- description: The OCID of the connection being referenced.
  name: ocid
  types:
  - <xref:str>
- description: 'Controls the network traffic direction to the target. Known values
    are:

    "SHARED_SERVICE_ENDPOINT", "SHARED_DEPLOYMENT_ENDPOINT", and "DEDICATED_ENDPOINT".'
  name: routingMethod
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RoutingMethod">]
- description: The customer's vault OCID.
  name: vaultId
  types:
  - <xref:str>
- description: The customer's master key OCID.
  name: keyId
  types:
  - <xref:str>
- description: Indicates whether secret OCIDs are used for credential fields.
  name: doesUseSecretIds
  types:
  - <xref:bool>
- description: 'Connection provisioning state. Known values are: "Succeeded",

    "Failed", "Canceled", and "Provisioning".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureResourceProvisioningState">]
- description: 'The connection lifecycle state. Known values are: "CREATING", "UPDATING",

    "ACTIVE", "DELETING", "DELETED", and "FAILED".'
  name: lifecycleState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectionLifecycleState">]
- description: The description of lifecycle state in detail.
  name: lifecycleDetails
  types:
  - <xref:str>
- description: The date time the resource was created in OCI.
  name: timeCreated
  types:
  - <xref:str>
- description: The date time the resource was last updated in OCI.
  name: timeUpdated
  types:
  - <xref:str>
- description: Required. A Kafka Connection.
  name: connectionType
  types:
  - <xref:typing.Literal>[ConnectionType.KAFKA]
- description: 'The Kafka technology type. Required. Known values are: "APACHE_KAFKA",

    "AZURE_EVENT_HUBS", "CONFLUENT_KAFKA", and "OCI_STREAMING".'
  name: technologyType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KafkaConnectionTechnologyType">]
- description: The list of KafkaBootstrapServer objects specified by host/port.
  name: bootstrapServers
  types:
  - <xref:list>[<xref:"KafkaBootstrapServer">]
- description: The Kafka security protocol used to connect to the broker.
  name: securityProtocol
  types:
  - <xref:str>
- description: The username used to authenticate to Kafka.
  name: username
  types:
  - <xref:str>
- description: The OCID of the Secret where the password is stored.
  name: passwordSecretId
  types:
  - <xref:str>
- description: The OCID of the Secret where the truststore is stored.
  name: trustStoreSecretId
  types:
  - <xref:str>
- description: 'The OCID of the Secret where the truststore password is

    stored.'
  name: trustStorePasswordSecretId
  types:
  - <xref:str>
- description: The OCID of the Secret where the keystore is stored.
  name: keyStoreSecretId
  types:
  - <xref:str>
- description: The OCID of the Secret where the keystore password is stored.
  name: keyStorePasswordSecretId
  types:
  - <xref:str>
- description: The OCID of the Secret where the SSL key password is stored.
  name: sslKeyPasswordSecretId
  types:
  - <xref:str>
- description: The additional consumer properties in string format.
  name: consumerProperties
  types:
  - <xref:str>
- description: The additional producer properties in string format.
  name: producerProperties
  types:
  - <xref:str>
- description: The OCID of the stream pool being referenced.
  name: streamPoolId
  types:
  - <xref:str>
- description: The OCID of the Kafka cluster being referenced.
  name: clusterId
  types:
  - <xref:str>
- description: 'Indicates if resource principal should be used for

    authentication.'
  name: shouldUseResourcePrincipal
  types:
  - <xref:bool>
