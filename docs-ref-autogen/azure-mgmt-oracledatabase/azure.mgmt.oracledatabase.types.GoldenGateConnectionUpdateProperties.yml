### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.GoldenGateConnectionUpdateProperties
name: GoldenGateConnectionUpdateProperties
fullName: azure.mgmt.oracledatabase.types.GoldenGateConnectionUpdateProperties
module: azure.mgmt.oracledatabase.types
summary: The updatable properties of the GoldenGateConnection.
constructor:
  syntax: GoldenGateConnectionUpdateProperties()
variables:
- description: 'The connection type to be created. Known values are: "GOLDENGATE",

    "KAFKA", "KAFKA_SCHEMA_REGISTRY", "MYSQL", "JAVA_MESSAGE_SERVICE", "MICROSOFT_SQLSERVER",

    "OCI_OBJECT_STORAGE", "ORACLE", "AZURE_DATA_LAKE_STORAGE", "POSTGRESQL",

    "AZURE_SYNAPSE_ANALYTICS", "SNOWFLAKE", "AMAZON_S3", "HDFS", "ORACLE_NOSQL", "MONGODB",

    "AMAZON_KINESIS", "AMAZON_REDSHIFT", "DB2", "REDIS", "ELASTICSEARCH", "GENERIC",

    "GOOGLE_CLOUD_STORAGE", "GOOGLE_BIGQUERY", "DATABRICKS", "GOOGLE_PUBSUB", "MICROSOFT_FABRIC",

    and "ICEBERG".'
  name: connectionType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectionType">]
- description: The connection display name.
  name: displayName
  types:
  - <xref:str>
- description: 'Controls the network traffic direction to the target. Known values
    are:

    "SHARED_SERVICE_ENDPOINT", "SHARED_DEPLOYMENT_ENDPOINT", and "DEDICATED_ENDPOINT".'
  name: routingMethod
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RoutingMethod">]
- description: The customer's vault OCID.
  name: vaultId
  types:
  - <xref:str>
- description: The customer's master key OCID.
  name: keyId
  types:
  - <xref:str>
- description: Indicates whether secret OCIDs are used for credential fields.
  name: doesUseSecretIds
  types:
  - <xref:bool>
