### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.AutonomousDatabaseUpdateProperties
name: AutonomousDatabaseUpdateProperties
fullName: azure.mgmt.oracledatabase.types.AutonomousDatabaseUpdateProperties
module: azure.mgmt.oracledatabase.types
summary: The updatable properties of the AutonomousDatabase.
constructor:
  syntax: AutonomousDatabaseUpdateProperties()
variables:
- description: Admin password.
  name: adminPassword
  types:
  - <xref:str>
- description: 'The maintenance schedule type of the Autonomous

    Database Serverless. Known values are: "Early" and "Regular".'
  name: autonomousMaintenanceScheduleType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutonomousMaintenanceScheduleType">]
- description: The compute amount (CPUs) available to the database.
  name: computeCount
  types:
  - <xref:float>
- description: The number of CPU cores to be made available to the database.
  name: cpuCoreCount
  types:
  - <xref:int>
- description: Customer Contacts.
  name: customerContacts
  types:
  - <xref:list>[<xref:"CustomerContact">]
- description: The quantity of data in the database, in terabytes.
  name: dataStorageSizeInTbs
  types:
  - <xref:int>
- description: 'The size, in gigabytes, of the data volume that will be created and

    attached to the database.'
  name: dataStorageSizeInGbs
  types:
  - <xref:int>
- description: The user-friendly name for the Autonomous Database.
  name: displayName
  types:
  - <xref:str>
- description: 'Indicates if auto scaling is enabled for the Autonomous Database

    CPU core count.'
  name: isAutoScalingEnabled
  types:
  - <xref:bool>
- description: 'Indicates if auto scaling is enabled for the Autonomous

    Database storage.'
  name: isAutoScalingForStorageEnabled
  types:
  - <xref:bool>
- description: 'The Azure resource ID of the Disaster Recovery peer database, which
    is located

    in a different region from the current peer database.'
  name: peerDbId
  types:
  - <xref:str>
- description: 'Indicates whether the Autonomous Database has local or called

    in-region Data Guard enabled.'
  name: isLocalDataGuardEnabled
  types:
  - <xref:bool>
- description: Specifies if the Autonomous Database requires mTLS connections.
  name: isMtlsConnectionRequired
  types:
  - <xref:bool>
- description: 'The Oracle license model that applies to the Oracle Autonomous Database.

    The default is LICENSE_INCLUDED. Known values are: "LicenseIncluded" and "BringYourOwnLicense".'
  name: licenseModel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LicenseModel">]
- description: The list of scheduled operations.
  name: scheduledOperationsList
  types:
  - <xref:list>[<xref:"ScheduledOperationsTypeUpdate">]
- description: 'The Oracle Database Edition that applies to the Autonomous databases.

    Known values are: "StandardEdition" and "EnterpriseEdition".'
  name: databaseEdition
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DatabaseEditionType">]
- description: Details for the long-term backup schedule.
  name: longTermBackupSchedule
  types:
  - <xref:<xref:"LongTermBackUpScheduleDetails">>
- description: 'Parameter that allows users to select an acceptable

    maximum data loss limit in seconds, up to which Automatic Failover will be triggered
    when

    necessary for a Local Autonomous Data Guard.'
  name: localAdgAutoFailoverMaxDataLossLimit
  types:
  - <xref:int>
- description: 'Indicates the Autonomous Database mode. Known values are: "ReadOnly"
    and

    "ReadWrite".'
  name: openMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OpenModeType">]
- description: 'The Autonomous Database permission level. Known values are: "Restricted"

    and "Unrestricted".'
  name: permissionLevel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PermissionLevelType">]
- description: 'The Data Guard role of the Autonomous Container Database or Autonomous
    Database, if

    Autonomous Data Guard is enabled. Known values are: "Primary", "Standby", "DisabledStandby",

    "BackupCopy", and "SnapshotStandby".'
  name: role
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RoleType">]
- description: Retention period, in days, for long-term backups.
  name: backupRetentionPeriodInDays
  types:
  - <xref:int>
- description: 'The client IP access control list (ACL). This is an array of CIDR

    notations and/or IP addresses. Values should be separate strings, separated by
    commas. Example:

    [''1.1.1.1'',''1.1.1.0/24'',''1.1.2.25''].'
  name: whitelistedIps
  types:
  - <xref:list>[<xref:str>]
