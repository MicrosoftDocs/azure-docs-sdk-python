uid: azure.mgmt.oracledatabase.types.ConnectionStringType
name: ConnectionStringType
fullName: azure.mgmt.oracledatabase.types.ConnectionStringType
module: azure.mgmt.oracledatabase.types
summary: Connection strings to connect to an Oracle Autonomous Database.
constructor:
  syntax: ConnectionStringType()
variables:
- description: 'Returns all connection strings that can be used to connect to the

    Autonomous Database.'
  name: allConnectionStrings
  types:
  - <xref:<xref:"AllConnectionStringType">>
- description: 'The database service provides the least level of resources to each
    SQL

    statement, but supports the most number of concurrent SQL statements.'
  name: dedicated
  types:
  - <xref:str>
- description: 'The High database service provides the highest level of resources
    to each SQL

    statement resulting in the highest performance, but supports the fewest number
    of concurrent

    SQL statements.'
  name: high
  types:
  - <xref:str>
- description: 'The Low database service provides the least level of resources to
    each SQL

    statement, but supports the most number of concurrent SQL statements.'
  name: low
  types:
  - <xref:str>
- description: 'The Medium database service provides a lower level of resources to
    each SQL

    statement potentially resulting a lower level of performance, but supports more
    concurrent SQL

    statements.'
  name: medium
  types:
  - <xref:str>
- description: 'A list of connection string profiles to allow clients to group, filter
    and

    select connection string values based on structured metadata.'
  name: profiles
  types:
  - <xref:list>[<xref:"ProfileType">]
