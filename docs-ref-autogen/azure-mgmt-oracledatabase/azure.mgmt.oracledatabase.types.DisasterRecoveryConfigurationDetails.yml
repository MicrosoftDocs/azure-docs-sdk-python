### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.types.DisasterRecoveryConfigurationDetails
name: DisasterRecoveryConfigurationDetails
fullName: azure.mgmt.oracledatabase.types.DisasterRecoveryConfigurationDetails
module: azure.mgmt.oracledatabase.types
summary: Configurations of a Disaster Recovery Details.
constructor:
  syntax: DisasterRecoveryConfigurationDetails()
variables:
- description: 'Indicates the disaster recovery (DR) type of the Autonomous

    Database Serverless instance. Autonomous Data Guard (ADG) DR type provides business
    critical DR

    with a faster recovery time objective (RTO) during failover or switchover. Backup-based
    DR type

    provides lower cost DR with a slower RTO during failover or switchover. Known
    values are: "Adg"

    and "BackupBased".'
  name: disasterRecoveryType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DisasterRecoveryType">]
- description: 'Time and date stored as an RFC 3339 formatted timestamp

    string. For example, 2022-01-01T12:00:00.000Z would set a limit for the snapshot
    standby to be

    converted back to a cross-region standby database.'
  name: timeSnapshotStandbyEnabledTill
  types:
  - <xref:str>
- description: 'Indicates if user wants to convert to a snapshot standby. For example,

    true would set a standby database to snapshot standby database. False would set
    a snapshot

    standby database back to regular standby database.'
  name: isSnapshotStandby
  types:
  - <xref:bool>
- description: 'If true, 7 days worth of backups are replicated across

    regions for Cross-Region ADB or Backup-Based DR between Primary and Standby. If
    false, the

    backups taken on the Primary are not replicated to the Standby database.'
  name: isReplicateAutomaticBackups
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.oracledatabase.types.DisasterRecoveryConfigurationDetails.disasterRecoveryType
  name: disasterRecoveryType
  summary: 'Indicates the disaster recovery (DR) type of the Autonomous Database Serverless
    instance.

    Autonomous Data Guard (ADG) DR type provides business critical DR with a faster
    recovery time

    objective (RTO) during failover or switchover. Backup-based DR type provides lower
    cost DR with

    a slower RTO during failover or switchover. Known values are: "Adg" and "BackupBased".'
  signature: 'disasterRecoveryType: str | DisasterRecoveryType'
- uid: azure.mgmt.oracledatabase.types.DisasterRecoveryConfigurationDetails.isReplicateAutomaticBackups
  name: isReplicateAutomaticBackups
  summary: 'If true, 7 days worth of backups are replicated across regions for Cross-Region
    ADB or

    Backup-Based DR between Primary and Standby. If false, the backups taken on the
    Primary are not

    replicated to the Standby database.'
  signature: 'isReplicateAutomaticBackups: bool'
- uid: azure.mgmt.oracledatabase.types.DisasterRecoveryConfigurationDetails.isSnapshotStandby
  name: isSnapshotStandby
  summary: 'Indicates if user wants to convert to a snapshot standby. For example,
    true would set a standby

    database to snapshot standby database. False would set a snapshot standby database
    back to

    regular standby database.'
  signature: 'isSnapshotStandby: bool'
- uid: azure.mgmt.oracledatabase.types.DisasterRecoveryConfigurationDetails.timeSnapshotStandbyEnabledTill
  name: timeSnapshotStandbyEnabledTill
  summary: 'Time and date stored as an RFC 3339 formatted timestamp string. For example,

