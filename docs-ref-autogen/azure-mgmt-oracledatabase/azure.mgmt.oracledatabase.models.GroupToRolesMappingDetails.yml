### YamlMime:PythonClass
uid: azure.mgmt.oracledatabase.models.GroupToRolesMappingDetails
name: GroupToRolesMappingDetails
fullName: azure.mgmt.oracledatabase.models.GroupToRolesMappingDetails
module: azure.mgmt.oracledatabase.models
summary: Group-to-roles mapping properties.
constructor:
  syntax: 'GroupToRolesMappingDetails(*args: Any, **kwargs: Any)'
variables:
- description: 'The OCID of the IDP group which will be mapped to goldengate role

    administratorGroup.It grants full access to the user, including the ability to
    alter general,

    non-security related operational parameters and profiles of the server.'
  name: administrator_group_id
  types:
  - <xref:str>
- description: 'The OCID of the IDP group which will be mapped to goldengate role

    operatorGroup.It allows users to perform only operational actions, like starting
    and stopping

    resources. Operators cannot alter the operational parameters or profiles of the
    MA server.'
  name: operator_group_id
  types:
  - <xref:str>
- description: 'The OCID of the IDP group which will be mapped to goldengate role

    securityGroup.It grants administration of security related objects and invoke
    security related

    service requests. This role has full privileges.'
  name: security_group_id
  types:
  - <xref:str>
- description: 'The OCID of the IDP group which will be mapped to goldengate role

    userGroup. It allows information-only service requests, which do not alter or
    affect the

    operation of either the MA. Examples of query and read-only information include
    performance

    metric information and resource status and monitoring information.'
  name: user_group_id
  types:
  - <xref:str>
- description: The OCID of the Identity Domain when IAM credential store is used.
  name: identity_domain_id
  types:
  - <xref:str>
- description: The base64 encoded content of the PEM file containing the private key.
  name: key
  types:
  - <xref:str>
