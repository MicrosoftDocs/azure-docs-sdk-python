  types:
  - <xref:str>
  - <xref:azure.mgmt.oracledatabase.models.LicenseModel>
- description: Describes the object's current state in detail.
  name: lifecycle_details
  types:
  - <xref:str>
- description: 'Possible lifecycle states. Known values are: "Creating", "Updating",

    "Active", "InActive", "Deleting", "Deleted", "Failed", "Needs Attention", "In
    Progress",

    "Canceling", "Canceled", "Succeeded", and "Waiting".'
  name: lifecycle_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.oracledatabase.models.DeploymentLifecycleState>
