  name: time_created
  types:
  - <xref:str>
- description: The date time the resource was last updated in OCI.
  name: time_updated
  types:
  - <xref:str>
- description: Maintenance configuration.
  name: maintenance_configuration
  types:
  - <xref:azure.mgmt.oracledatabase.models.MaintenanceConfigurationType>
- description: Maintenance window.
  name: maintenance_window
  types:
  - <xref:azure.mgmt.oracledatabase.models.MaintenanceWindowType>
- description: Azure network anchor ID. Required.
  name: network_anchor_id
  types:
  - <xref:str>
- description: Deployment data for creating an OGG deployment.
  name: ogg_data
  types:
  - <xref:azure.mgmt.oracledatabase.models.OggDeploymentDetails>
- description: 'The private IP address of VCN representing the access point for the

    associated endpoint service in the GoldenGate service VCN.'
  name: private_ip_address
  types:
  - <xref:str>
- description: 'Deployment provisioning state. Known values are: "Succeeded",

    "Failed", "Canceled", and "Provisioning".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.oracledatabase.models.AzureResourceProvisioningState>
- description: Corresponding Azure resource anchor ID. Required.
  name: resource_anchor_id
  types:
  - <xref:str>
- description: Storage utilization in bytes.
  name: storage_utilization_in_bytes
  types:
  - <xref:int>
- description: The time zone of the deployment, for example, UTC.
  name: time_zone
  types:
  - <xref:str>
- description: The current version.
  name: version
  types:
  - <xref:str>
