### YamlMime:PythonClass
uid: azure.mgmt.hybridkubernetes.types.ArcAgentProfile
name: ArcAgentProfile
fullName: azure.mgmt.hybridkubernetes.types.ArcAgentProfile
module: azure.mgmt.hybridkubernetes.types
summary: Defines the Arc Agent properties for the clusters.
constructor:
  syntax: ArcAgentProfile()
variables:
- description: Version of the Arc agents to be installed on the cluster resource.
  name: desired_agent_version
  types:
  - <xref:str>
- description: 'Indicates whether the Arc agents on the be upgraded automatically
    to

    the latest version. Defaults to Enabled. Known values are: "Enabled" and "Disabled".'
  name: agent_auto_upgrade
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoUpgradeOptions">]
- description: List of system extensions that are installed on the cluster resource.
  name: system_components
  types:
  - <xref:list>[<xref:"SystemComponent">]
- description: List of arc agentry and system components errors on the cluster resource.
  name: agent_errors
  types:
  - <xref:list>[<xref:"AgentError">]
- description: 'Represents the current state of the Arc agentry and its dependent

    components.'
  name: agent_state
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.hybridkubernetes.types.ArcAgentProfile.agentAutoUpgrade
  name: agentAutoUpgrade
  summary: 'Indicates whether the Arc agents on the be upgraded automatically to the
    latest version.

    Defaults to Enabled. Known values are: "Enabled" and "Disabled".'
  signature: 'agentAutoUpgrade: str | AutoUpgradeOptions'
- uid: azure.mgmt.hybridkubernetes.types.ArcAgentProfile.agentErrors
  name: agentErrors
  summary: List of arc agentry and system components errors on the cluster resource.
  signature: 'agentErrors: list[''AgentError'']'
- uid: azure.mgmt.hybridkubernetes.types.ArcAgentProfile.agentState
  name: agentState
  summary: Represents the current state of the Arc agentry and its dependent components.
  signature: 'agentState: str'
- uid: azure.mgmt.hybridkubernetes.types.ArcAgentProfile.desiredAgentVersion
  name: desiredAgentVersion
  summary: Version of the Arc agents to be installed on the cluster resource.
  signature: 'desiredAgentVersion: str'
- uid: azure.mgmt.hybridkubernetes.types.ArcAgentProfile.systemComponents
  name: systemComponents
  summary: List of system extensions that are installed on the cluster resource.
  signature: 'systemComponents: list[''SystemComponent'']'
