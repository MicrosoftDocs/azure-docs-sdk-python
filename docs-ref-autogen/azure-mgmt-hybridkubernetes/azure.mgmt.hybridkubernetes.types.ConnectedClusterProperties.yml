    scope this connected cluster is assigned to, if any.'
  signature: 'privateLinkScopeResourceId: str'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.privateLinkState
  name: privateLinkState
  summary: 'Property which describes the state of private link on a connected cluster
    resource. Known

    values are: "Enabled" and "Disabled".'
  signature: 'privateLinkState: str | PrivateLinkState'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Provisioning", "Updating", "Deleting", and "Accepted".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.securityProfile
  name: securityProfile
  summary: Security profile for the connected cluster.
  signature: 'securityProfile: SecurityProfile'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.totalCoreCount
  name: totalCoreCount
  summary: Number of CPU cores present in the connected cluster resource.
  signature: 'totalCoreCount: int'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.totalNodeCount
  name: totalNodeCount
  summary: Number of nodes present in the connected cluster resource.
  signature: 'totalNodeCount: int'
