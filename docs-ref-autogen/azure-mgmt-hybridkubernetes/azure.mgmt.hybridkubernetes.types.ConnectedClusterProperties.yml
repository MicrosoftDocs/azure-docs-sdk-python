### YamlMime:PythonClass
uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties
name: ConnectedClusterProperties
fullName: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties
module: azure.mgmt.hybridkubernetes.types
summary: Properties of the connected cluster.
constructor:
  syntax: ConnectedClusterProperties()
variables:
- description: 'Base64 encoded public certificate used by the agent to do

    the initial handshake to the backend services in Azure. Required.'
  name: agent_public_key_certificate
  types:
  - <xref:str>
- description: The Kubernetes version of the connected cluster resource.
  name: kubernetes_version
  types:
  - <xref:str>
- description: Number of nodes present in the connected cluster resource.
  name: total_node_count
  types:
  - <xref:int>
- description: Number of CPU cores present in the connected cluster resource.
  name: total_core_count
  types:
  - <xref:int>
- description: Version of the agent running on the connected cluster resource.
  name: agent_version
  types:
  - <xref:str>
- description: 'Provisioning state of the connected cluster resource. Known values

    are: "Succeeded", "Failed", "Canceled", "Provisioning", "Updating", "Deleting",
    and "Accepted".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The Kubernetes distribution running on this connected cluster.
  name: distribution
  types:
  - <xref:str>
- description: The Kubernetes distribution version on this connected cluster.
  name: distribution_version
  types:
  - <xref:str>
- description: 'The infrastructure on which the Kubernetes cluster represented by
    this

    connected cluster is running on.'
  name: infrastructure
  types:
  - <xref:str>
- description: Connected cluster offering.
  name: offering
  types:
  - <xref:str>
- description: 'Expiration time of the managed identity

    certificate.'
  name: managed_identity_certificate_expiration_time
  types:
  - <xref:str>
- description: 'Time representing the last instance when heart beat was received

    from the cluster.'
  name: last_connectivity_time
  types:
  - <xref:str>
- description: 'Represents the connectivity status of the connected cluster. Known

    values are: "Connecting", "Connected", "Offline", "Expired", and "AgentNotInstalled".'
  name: connectivity_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectivityStatus">]
- description: 'Property which describes the state of private link on a connected

    cluster resource. Known values are: "Enabled" and "Disabled".'
  name: private_link_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PrivateLinkState">]
- description: 'This is populated only if privateLinkState is enabled.

    The resource id of the private link scope this connected cluster is assigned to,
    if any.'
  name: private_link_scope_resource_id
  types:
  - <xref:str>
- description: 'Indicates whether Azure Hybrid Benefit is opted in. Known values

    are: "True", "False", and "NotApplicable".'
  name: azure_hybrid_benefit
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureHybridBenefit">]
- description: AAD profile for the connected cluster.
  name: aad_profile
  types:
  - <xref:<xref:"AadProfile">>
- description: Arc agentry configuration for the provisioned cluster.
  name: arc_agent_profile
  types:
  - <xref:<xref:"ArcAgentProfile">>
- description: Security profile for the connected cluster.
  name: security_profile
  types:
  - <xref:<xref:"SecurityProfile">>
- description: Open ID Connect (OIDC) Issuer Profile for the connected cluster.
  name: oidc_issuer_profile
  types:
  - <xref:<xref:"OidcIssuerProfile">>
- description: Details of the gateway used by the Arc router for connectivity.
  name: gateway
  types:
  - <xref:<xref:"Gateway">>
- description: 'Configuration settings for customizing the behavior of the

    connected cluster.'
  name: arc_agentry_configurations
  types:
  - <xref:list>[<xref:"ArcAgentryConfigurations">]
- description: More properties related to the Connected Cluster.
  name: miscellaneous_properties
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
attributes:
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.aadProfile
  name: aadProfile
  summary: AAD profile for the connected cluster.
  signature: 'aadProfile: AadProfile'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.agentPublicKeyCertificate
  name: agentPublicKeyCertificate
  summary: 'Base64 encoded public certificate used by the agent to do the initial
    handshake to the backend

    services in Azure. Required.'
  signature: 'agentPublicKeyCertificate: Required[str]'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.agentVersion
  name: agentVersion
  summary: Version of the agent running on the connected cluster resource.
  signature: 'agentVersion: str'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.arcAgentProfile
  name: arcAgentProfile
  summary: Arc agentry configuration for the provisioned cluster.
  signature: 'arcAgentProfile: ArcAgentProfile'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.arcAgentryConfigurations
  name: arcAgentryConfigurations
  summary: Configuration settings for customizing the behavior of the connected cluster.
  signature: 'arcAgentryConfigurations: list[''ArcAgentryConfigurations''] | None'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.azureHybridBenefit
  name: azureHybridBenefit
  summary: '"True", "False", and

    "NotApplicable".'
  signature: 'azureHybridBenefit: str | AzureHybridBenefit'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.connectivityStatus
  name: connectivityStatus
  summary: '"Connecting",

    "Connected", "Offline", "Expired", and "AgentNotInstalled".'
  signature: 'connectivityStatus: str | ConnectivityStatus'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.distribution
  name: distribution
  summary: The Kubernetes distribution running on this connected cluster.
  signature: 'distribution: str'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.distributionVersion
  name: distributionVersion
  summary: The Kubernetes distribution version on this connected cluster.
  signature: 'distributionVersion: str'
