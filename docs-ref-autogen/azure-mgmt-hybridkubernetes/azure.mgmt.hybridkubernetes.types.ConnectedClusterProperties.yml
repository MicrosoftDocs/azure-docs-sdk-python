  name: gateway
  summary: Details of the gateway used by the Arc router for connectivity.
  signature: 'gateway: Gateway | None'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.infrastructure
  name: infrastructure
  summary: 'The infrastructure on which the Kubernetes cluster represented by this
    connected cluster is

    running on.'
  signature: 'infrastructure: str'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.kubernetesVersion
  name: kubernetesVersion
  summary: The Kubernetes version of the connected cluster resource.
  signature: 'kubernetesVersion: str'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.lastConnectivityTime
  name: lastConnectivityTime
  summary: Time representing the last instance when heart beat was received from the
