  signature: 'lastConnectivityTime: str'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.managedIdentityCertificateExpirationTime
  name: managedIdentityCertificateExpirationTime
  summary: Expiration time of the managed identity certificate.
  signature: 'managedIdentityCertificateExpirationTime: str'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.miscellaneousProperties
  name: miscellaneousProperties
  summary: More properties related to the Connected Cluster.
  signature: 'miscellaneousProperties: dict[str, str]'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.offering
  name: offering
  summary: Connected cluster offering.
  signature: 'offering: str'
- uid: azure.mgmt.hybridkubernetes.types.ConnectedClusterProperties.oidcIssuerProfile
  name: oidcIssuerProfile
  summary: Open ID Connect (OIDC) Issuer Profile for the connected cluster.
  signature: 'oidcIssuerProfile: OidcIssuerProfile'
