### YamlMime:PythonClass
uid: azure.mgmt.eventhub.types.ClusterProperties
name: ClusterProperties
fullName: azure.mgmt.eventhub.types.ClusterProperties
module: azure.mgmt.eventhub.types
summary: Event Hubs Cluster properties supplied in responses in List or Get operations.
constructor:
  syntax: ClusterProperties()
variables:
- description: The UTC time when the Event Hubs Cluster was created.
  name: created_at
  types:
  - <xref:str>
- description: 'Provisioning state of the Cluster. Known values are: "Unknown",

    "Creating", "Deleting", "Scaling", "Active", "Failed", "Succeeded", and "Canceled".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The UTC time when the Event Hubs Cluster was last updated.
  name: updated_at
  types:
  - <xref:str>
- description: 'The metric ID of the cluster resource. Provided by the service and
    not

    modifiable by the user.'
  name: metric_id
  types:
  - <xref:str>
- description: Status of the Cluster resource.
  name: status
  types:
  - <xref:str>
- description: A value that indicates whether Scaling is Supported.
  name: supports_scaling
  types:
  - <xref:bool>
- name: platform_capabilities
  types:
  - <xref:<xref:"PlatformCapabilities">>
- description: A value that indicates whether the cluster is zone redundant.
  name: zone_redundant
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.eventhub.types.ClusterProperties.createdAt
  name: createdAt
  summary: The UTC time when the Event Hubs Cluster was created.
  signature: 'createdAt: str'
- uid: azure.mgmt.eventhub.types.ClusterProperties.metricId
  name: metricId
  summary: The metric ID of the cluster resource. Provided by the service and not
    modifiable by the user.
  signature: 'metricId: str'
- uid: azure.mgmt.eventhub.types.ClusterProperties.provisioningState
  name: provisioningState
  summary: '"Unknown", "Creating", "Deleting",

    "Scaling", "Active", "Failed", "Succeeded", and "Canceled".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.eventhub.types.ClusterProperties.status
  name: status
  summary: Status of the Cluster resource.
  signature: 'status: str'
- uid: azure.mgmt.eventhub.types.ClusterProperties.supportsScaling
  name: supportsScaling
  summary: A value that indicates whether Scaling is Supported.
  signature: 'supportsScaling: bool'
- uid: azure.mgmt.eventhub.types.ClusterProperties.updatedAt
  name: updatedAt
  summary: The UTC time when the Event Hubs Cluster was last updated.
  signature: 'updatedAt: str'
- uid: azure.mgmt.eventhub.types.ClusterProperties.zoneRedundant
  name: zoneRedundant
  summary: A value that indicates whether the cluster is zone redundant.
