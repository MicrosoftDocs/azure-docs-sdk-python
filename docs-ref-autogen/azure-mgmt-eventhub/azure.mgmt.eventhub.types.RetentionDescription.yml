### YamlMime:PythonClass
uid: azure.mgmt.eventhub.types.RetentionDescription
name: RetentionDescription
fullName: azure.mgmt.eventhub.types.RetentionDescription
module: azure.mgmt.eventhub.types
summary: Properties to configure retention settings for the  eventhub.
constructor:
  syntax: RetentionDescription()
variables:
- description: 'Enumerates the possible values for cleanup policy. Known values are:

    "Delete", "Compact", and "DeleteOrCompact".'
  name: cleanup_policy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CleanupPolicyRetentionDescription">]
- description: 'Number of hours to retain the events for this Event Hub. This

    should be positive value upto namespace SKU max. -1 is a special case where retention
    time is

    infinite, but the size of an entity is restricted and its size depends on namespace
    SKU type.'
  name: retention_time_in_hours
  types:
  - <xref:int>
- description: 'The minimum time a message will remain ineligible for

    compaction in the log. This value is used when cleanupPolicy is Compact or DeleteOrCompact.'
  name: min_compaction_lag_time_in_minutes
  types:
  - <xref:int>
- description: 'Number of hours to retain the tombstone markers of a

    compacted Event Hub. This value is used when cleanupPolicy is Compact or DeleteOrCompact.

    Consumer must complete reading the tombstone marker within this specified amount
    of time if

    consumer begins from starting offset to ensure they get a valid snapshot for the
    specific key

    described by the tombstone marker within the compacted Event Hub.'
  name: tombstone_retention_time_in_hours
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.eventhub.types.RetentionDescription.cleanupPolicy
  name: cleanupPolicy
  summary: '"Delete", "Compact",

    and "DeleteOrCompact".'
  signature: 'cleanupPolicy: str | CleanupPolicyRetentionDescription'
- uid: azure.mgmt.eventhub.types.RetentionDescription.minCompactionLagTimeInMinutes
  name: minCompactionLagTimeInMinutes
  summary: 'The minimum time a message will remain ineligible for compaction in the
    log. This value is used

    when cleanupPolicy is Compact or DeleteOrCompact.'
  signature: 'minCompactionLagTimeInMinutes: int'
- uid: azure.mgmt.eventhub.types.RetentionDescription.retentionTimeInHours
  name: retentionTimeInHours
  summary: 'Number of hours to retain the events for this Event Hub. This should be
    positive value upto

    namespace SKU max. -1 is a special case where retention time is infinite, but
    the size of an

    entity is restricted and its size depends on namespace SKU type.'
  signature: 'retentionTimeInHours: int'
- uid: azure.mgmt.eventhub.types.RetentionDescription.tombstoneRetentionTimeInHours
  name: tombstoneRetentionTimeInHours
  summary: 'Number of hours to retain the tombstone markers of a compacted Event Hub.
    This value is used

    when cleanupPolicy is Compact or DeleteOrCompact. Consumer must complete reading
    the tombstone

    marker within this specified amount of time if consumer begins from starting offset
    to ensure

    they get a valid snapshot for the specific key described by the tombstone marker
    within the

    compacted Event Hub.'
  signature: 'tombstoneRetentionTimeInHours: int'
