uid: azure.mgmt.eventhub.types.ThrottlingPolicy
name: ThrottlingPolicy
fullName: azure.mgmt.eventhub.types.ThrottlingPolicy
module: azure.mgmt.eventhub.types
summary: Properties of the throttling policy.
constructor:
  syntax: ThrottlingPolicy()
variables:
- description: The Name of this policy. Required.
  name: name
  types:
  - <xref:str>
- description: 'The Threshold limit above which the application group will be

    throttled.Rate limit is always per second. Required.'
  name: rate_limit_threshold
  types:
  - <xref:int>
- description: 'Metric Id on which the throttle limit should be set, MetricId can
    be

    discovered by hovering over Metric in the Metrics section of Event Hub Namespace
    inside Azure

    Portal. Required. Known values are: "IncomingBytes", "OutgoingBytes", "IncomingMessages",
    and

    "OutgoingMessages".'
  name: metric_id
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MetricId">]
- description: Application Group Policy types. Required. THROTTLING_POLICY.
  name: type
  types:
  - <xref:typing.Literal>[ApplicationGroupPolicyType.THROTTLING_POLICY]
attributes:
