  name: metricId
  summary: 'Metric Id on which the throttle limit should be set, MetricId can be discovered
    by hovering

    over Metric in the Metrics section of Event Hub Namespace inside Azure Portal.
    Required. Known

    values are: "IncomingBytes", "OutgoingBytes", "IncomingMessages", and

    "OutgoingMessages".'
  signature: 'metricId: Required[str | MetricId]'
- uid: azure.mgmt.eventhub.types.ThrottlingPolicy.name
  name: name
  summary: The Name of this policy. Required.
  signature: 'name: Required[str]'
