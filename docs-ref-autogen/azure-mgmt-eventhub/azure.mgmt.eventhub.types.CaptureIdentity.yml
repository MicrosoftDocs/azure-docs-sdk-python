  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.eventhub.types.CaptureIdentity.type
  name: type
  summary: '"SystemAssigned" and

    "UserAssigned".'
  signature: 'type: str | CaptureIdentityType'
- uid: azure.mgmt.eventhub.types.CaptureIdentity.userAssignedIdentity
  name: userAssignedIdentity
  summary: 'ARM ID of Managed User Identity. This property is required is the type
