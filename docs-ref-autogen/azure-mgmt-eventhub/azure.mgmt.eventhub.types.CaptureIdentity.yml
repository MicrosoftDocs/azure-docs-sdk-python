constructor:
  syntax: CaptureIdentity()
variables:
- description: 'Type of Azure Active Directory Managed Identity. Known values are:
    "SystemAssigned"

    and "UserAssigned".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CaptureIdentityType">]
