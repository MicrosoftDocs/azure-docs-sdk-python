uid: azure.mgmt.eventhub.models.MessageTimestampDescription
name: MessageTimestampDescription
fullName: azure.mgmt.eventhub.models.MessageTimestampDescription
module: azure.mgmt.eventhub.models
summary: Properties of MessageTimestamp Description.
constructor:
  syntax: 'MessageTimestampDescription(*args: Any, **kwargs: Any)'
variables:
- description: 'Denotes the type of timestamp the message will hold.Two types of

    timestamp types - "AppendTime" and "CreateTime". AppendTime refers the time in
    which message

    got appended inside broker log. CreateTime refers to the time in which the message
    was

    generated on source side and producers can set this timestamp while sending the
    message.

    Default value is AppendTime. If you are using AMQP protocol, CreateTime equals
    AppendTime and

    its behavior remains the same. Known values are: "LogAppend" and "Create".'
  name: timestamp_type
  types:
  - <xref:str>
  - <xref:azure.mgmt.eventhub.models.TimestampType>
