    "AvroDeflate".'
  signature: 'encoding: str | _models.EncodingCaptureDescription | None'
- uid: azure.mgmt.eventhub.models.CaptureDescription.interval_in_seconds
  name: interval_in_seconds
  summary: 'The time window allows you to set the frequency with which the capture
