### YamlMime:PythonClass
uid: azure.mgmt.eventhub.types.DestinationProperties
name: DestinationProperties
fullName: azure.mgmt.eventhub.types.DestinationProperties
module: azure.mgmt.eventhub.types
summary: 'Properties describing the storage account, blob container and archive name
  format for capture

  destination.'
constructor:
  syntax: DestinationProperties()
variables:
- description: 'Resource id of the storage account to be used to create the

    blobs.'
  name: storage_account_resource_id
  types:
  - <xref:str>
- description: Blob container Name.
  name: blob_container
  types:
  - <xref:str>
- description: 'Blob naming convention for archive, e.g.

    {Namespace}/{EventHub}/{PartitionId}/{Year}/{Month}/{Day}/{Hour}/{Minute}/{Second}.
    Here all

    the parameters (Namespace,EventHub .. etc) are mandatory irrespective of order.'
  name: archive_name_format
  types:
  - <xref:str>
- description: Subscription Id of Azure Data Lake Store.
  name: data_lake_subscription_id
  types:
  - <xref:str>
- description: The Azure Data Lake Store name for the captured events.
  name: data_lake_account_name
  types:
  - <xref:str>
- description: The destination folder path for the captured events.
  name: data_lake_folder_path
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.eventhub.types.DestinationProperties.archiveNameFormat
  name: archiveNameFormat
  summary: 'Blob naming convention for archive, e.g.

    {Namespace}/{EventHub}/{PartitionId}/{Year}/{Month}/{Day}/{Hour}/{Minute}/{Second}.
    Here all

    the parameters (Namespace,EventHub .. etc) are mandatory irrespective of order.'
  signature: 'archiveNameFormat: str'
- uid: azure.mgmt.eventhub.types.DestinationProperties.blobContainer
  name: blobContainer
  summary: Blob container Name.
  signature: 'blobContainer: str'
- uid: azure.mgmt.eventhub.types.DestinationProperties.dataLakeAccountName
  name: dataLakeAccountName
  summary: The Azure Data Lake Store name for the captured events.
  signature: 'dataLakeAccountName: str'
- uid: azure.mgmt.eventhub.types.DestinationProperties.dataLakeFolderPath
  name: dataLakeFolderPath
  summary: The destination folder path for the captured events.
  signature: 'dataLakeFolderPath: str'
- uid: azure.mgmt.eventhub.types.DestinationProperties.dataLakeSubscriptionId
  name: dataLakeSubscriptionId
  summary: Subscription Id of Azure Data Lake Store.
  signature: 'dataLakeSubscriptionId: str'
- uid: azure.mgmt.eventhub.types.DestinationProperties.storageAccountResourceId
  name: storageAccountResourceId
  summary: Resource id of the storage account to be used to create the blobs.
  signature: 'storageAccountResourceId: str'
