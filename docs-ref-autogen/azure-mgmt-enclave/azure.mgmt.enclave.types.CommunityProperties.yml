- description: 'Community Monitoring Settings for diagnostic and virtual network flow

    logs.'
  name: monitoringSettings
  types:
  - <xref:<xref:"MonitoringSettingsModel">>
- description: Address spaces list.
  name: addressSpaces
  types:
  - <xref:list>[<xref:str>]
