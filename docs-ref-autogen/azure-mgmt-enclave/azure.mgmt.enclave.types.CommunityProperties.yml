  types:
  - <xref:typing.Union>[<xref:str>, <xref:"FirewallSKU">]
- description: 'Granular approval requirements for various actions on the community''s

    resources.'
  name: approvalSettings
  types:
  - <xref:<xref:"ApprovalSettings">>
- description: Maintenance Mode configuration.
  name: maintenanceModeConfiguration
