constructor:
  syntax: CommunityProperties()
variables:
- description: Address Space.
  name: addressSpace
  types:
  - <xref:str>
- description: DNS Servers.
  name: dnsServers
  types:
  - <xref:list>[<xref:str>]
- description: 'Provisioning State. Known values are: "Succeeded", "Failed",

    "Canceled", "Accepted", "Creating", "Deleting", "NotSpecified", "Running", and
    "Updating".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: List of resource ids created by communities.
  name: resourceCollection
  types:
  - <xref:list>[<xref:str>]
- description: Managed resource group name.
  name: managedResourceGroupName
  types:
  - <xref:str>
- description: Managed On Behalf Of Configuration.
  name: managedOnBehalfOfConfiguration
  types:
  - <xref:<xref:"ManagedOnBehalfOfConfiguration">>
- description: List of services governed by a community.
  name: governedServiceList
  types:
  - <xref:list>[<xref:"GovernedServiceItem">]
- description: 'Policy override setting for the community. Specifies whether to apply

    enclave-specific policies or disable policy enforcement. Is one of the following
    types:

    Literal["Enclave"], Literal["None"], str'
  name: policyOverride
  types:
  - <xref:typing.Union>[<xref:typing.Literal>["Enclave"], Literal["None"], str]
- description: Community role assignments.
  name: communityRoleAssignments
  types:
  - <xref:list>[<xref:"RoleAssignmentItem">]
- description: 'SKU of the community''s Azure Firewall (Basic, Standard, Premium).
    Standard

    is the default. Known values are: "Basic", "Standard", and "Premium".'
