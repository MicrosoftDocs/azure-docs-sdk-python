### YamlMime:PythonModule
uid: azure.communication.callautomation.recording_url_validator
name: recording_url_validator
fullName: azure.communication.callautomation.recording_url_validator
functions:
- uid: azure.communication.callautomation.recording_url_validator.validate_recording_url
  name: validate_recording_url
  summary: 'Validate that a recording URL points to Azure Communication Services

    endpoint before credentials are attached.

    This prevents credential exfiltration via SSRF attacks.'
  signature: 'validate_recording_url(recording_url: str, parameter_name: str) -> None'
  parameters:
  - name: recording_url
    description: The recording URL to validate.
    isRequired: true
    types:
    - <xref:str>
  - name: parameter_name
    description: The parameter name for exception messages.
    isRequired: true
    types:
    - <xref:str>
  exceptions:
  - type: TypeError
    description: If the recording URL is None or empty.
  - type: ValueError
    description: If the recording URL is not a valid absolute HTTPS URI or not from
      an allowed domain.
