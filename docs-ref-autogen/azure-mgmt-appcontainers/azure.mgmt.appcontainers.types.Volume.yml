### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.Volume
name: Volume
fullName: azure.mgmt.appcontainers.types.Volume
module: azure.mgmt.appcontainers.types
summary: Volume definitions for the Container App.
constructor:
  syntax: Volume()
variables:
- description: Volume name.
  name: name
  types:
  - <xref:str>
- description: 'Storage type for the volume. If not provided, use EmptyDir. Known
    values

    are: "AzureFile", "EmptyDir", "Secret", and "NfsAzureFile".'
  name: storage_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageType">]
- description: Name of storage resource. No need to provide for EmptyDir and Secret.
  name: storage_name
  types:
  - <xref:str>
- description: 'List of secrets to be added in volume. If no secrets are provided,
    all secrets

    in collection will be added to volume.'
  name: secrets
  types:
  - <xref:list>[<xref:"SecretVolumeItem">]
- description: 'Mount options used while mounting the Azure file share or NFS Azure
    file

    share. Must be a comma-separated string.'
  name: mount_options
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.appcontainers.types.Volume.mountOptions
  name: mountOptions
  summary: 'Mount options used while mounting the Azure file share or NFS Azure file
    share. Must be a

    comma-separated string.'
  signature: 'mountOptions: str'
- uid: azure.mgmt.appcontainers.types.Volume.name
  name: name
  summary: Volume name.
  signature: 'name: str'
- uid: azure.mgmt.appcontainers.types.Volume.secrets
  name: secrets
  summary: 'List of secrets to be added in volume. If no secrets are provided, all
    secrets in collection

    will be added to volume.'
  signature: 'secrets: list[''SecretVolumeItem'']'
- uid: azure.mgmt.appcontainers.types.Volume.storageName
  name: storageName
  summary: Name of storage resource. No need to provide for EmptyDir and Secret.
  signature: 'storageName: str'
- uid: azure.mgmt.appcontainers.types.Volume.storageType
  name: storageType
  summary: '"AzureFile",

    "EmptyDir", "Secret", and "NfsAzureFile".'
  signature: 'storageType: str | StorageType'
