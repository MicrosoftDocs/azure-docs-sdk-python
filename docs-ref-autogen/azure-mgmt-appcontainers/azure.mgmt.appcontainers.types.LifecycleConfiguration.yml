### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.LifecycleConfiguration
name: LifecycleConfiguration
fullName: azure.mgmt.appcontainers.types.LifecycleConfiguration
module: azure.mgmt.appcontainers.types
summary: The lifecycle configuration properties of a session in the dynamic session
  pool.
constructor:
  syntax: LifecycleConfiguration()
variables:
- description: 'The lifecycle type of the session pool. Known values are: "Timed"
    and

    "OnContainerExit".'
  name: lifecycle_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LifecycleType">]
- description: 'The cooldown period of a session in seconds when the

    lifecycle type is ''Timed''.'
  name: cooldown_period_in_seconds
  types:
  - <xref:int>
- description: 'The maximum alive period of a session in seconds when the

    lifecycle type is ''OnContainerExit''.'
  name: max_alive_period_in_seconds
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.appcontainers.types.LifecycleConfiguration.cooldownPeriodInSeconds
  name: cooldownPeriodInSeconds
  summary: The cooldown period of a session in seconds when the lifecycle type is
    'Timed'.
  signature: 'cooldownPeriodInSeconds: int'
- uid: azure.mgmt.appcontainers.types.LifecycleConfiguration.lifecycleType
  name: lifecycleType
  summary: '"Timed" and "OnContainerExit".'
  signature: 'lifecycleType: str | LifecycleType'
- uid: azure.mgmt.appcontainers.types.LifecycleConfiguration.maxAlivePeriodInSeconds
  name: maxAlivePeriodInSeconds
  summary: The maximum alive period of a session in seconds when the lifecycle type
    is 'OnContainerExit'.
  signature: 'maxAlivePeriodInSeconds: int'
