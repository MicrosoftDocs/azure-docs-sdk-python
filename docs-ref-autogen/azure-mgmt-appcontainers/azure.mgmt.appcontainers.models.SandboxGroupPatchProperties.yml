variables:
- description: 'The resource ID of the Azure Container Apps environment to link to
    the

    sandbox group. A sandbox group can be linked after creation, but the link cannot
    then be

    changed or removed. For subsequent create-or-update (PUT) requests, specify the
    same

    environment ID; omitting or changing it returns 409 Conflict. Omitting it from
    an update

    (PATCH) request leaves the existing link unchanged.'
  name: environment_id
  types:
  - <xref:str>
