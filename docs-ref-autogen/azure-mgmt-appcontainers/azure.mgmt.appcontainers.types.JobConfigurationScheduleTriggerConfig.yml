uid: azure.mgmt.appcontainers.types.JobConfigurationScheduleTriggerConfig
name: JobConfigurationScheduleTriggerConfig
fullName: azure.mgmt.appcontainers.types.JobConfigurationScheduleTriggerConfig
module: azure.mgmt.appcontainers.types
summary: 'Cron formatted repeating trigger schedule ("* * * * >>*<<") for cronjobs.
  Properties completions

  and parallelism would be set to 1 by default.'
constructor:
  syntax: JobConfigurationScheduleTriggerConfig()
variables:
- description: 'Minimum number of successful replica completions before overall

    job completion.'
  name: replica_completion_count
  types:
  - <xref:int>
- description: Cron formatted repeating schedule ("* * * * >>*<<") of a Cron Job.
    Required.
  name: cron_expression
  types:
  - <xref:str>
- description: Number of parallel replicas of a job that can run at a given time.
  name: parallelism
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.appcontainers.types.JobConfigurationScheduleTriggerConfig.cronExpression
  name: cronExpression
  summary: Cron formatted repeating schedule ("* * * * >>*<<") of a Cron Job. Required.
  signature: 'cronExpression: str'
- uid: azure.mgmt.appcontainers.types.JobConfigurationScheduleTriggerConfig.parallelism
  name: parallelism
  summary: Number of parallel replicas of a job that can run at a given time.
  signature: 'parallelism: int'
- uid: azure.mgmt.appcontainers.types.JobConfigurationScheduleTriggerConfig.replicaCompletionCount
  name: replicaCompletionCount
  summary: Minimum number of successful replica completions before overall job completion.
  signature: 'replicaCompletionCount: int'
