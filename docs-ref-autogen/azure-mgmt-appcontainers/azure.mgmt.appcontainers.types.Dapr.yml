### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.Dapr
name: Dapr
fullName: azure.mgmt.appcontainers.types.Dapr
module: azure.mgmt.appcontainers.types
summary: Container App Dapr configuration.
constructor:
  syntax: Dapr()
variables:
- description: Boolean indicating if the Dapr side car is enabled.
  name: enabled
  types:
  - <xref:bool>
- description: Dapr application identifier.
  name: app_id
  types:
  - <xref:str>
- description: 'Tells Dapr which protocol your application is using. Valid options
    are http

    and grpc. Default is http. Known values are: "http" and "grpc".'
  name: app_protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AppProtocol">]
- description: Tells Dapr which port your application is listening on.
  name: app_port
  types:
  - <xref:int>
- description: 'Dapr max size of http header read buffer in KB to handle when

    sending multi-KB headers. Default is 65KB.'
  name: http_read_buffer_size
  types:
  - <xref:int>
- description: 'Increasing max size of request body http and grpc servers

    parameter in MB to handle uploading of big files. Default is 4 MB.'
  name: http_max_request_size
  types:
  - <xref:int>
- description: 'Sets the log level for the Dapr sidecar. Allowed values are debug,
    info, warn,

    error. Default is info. Known values are: "info", "debug", "warn", and "error".'
  name: log_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LogLevel">]
- description: Enables API logging for the Dapr sidecar.
  name: enable_api_logging
  types:
  - <xref:bool>
- description: Dapr application health check configuration.
  name: app_health
  types:
  - <xref:<xref:"DaprAppHealth">>
- description: 'Maximum number of concurrent requests, events handled by the Dapr

    sidecar.'
  name: max_concurrency
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.appcontainers.types.Dapr.appHealth
  name: appHealth
  summary: Dapr application health check configuration.
  signature: 'appHealth: DaprAppHealth'
- uid: azure.mgmt.appcontainers.types.Dapr.appId
  name: appId
  summary: Dapr application identifier.
  signature: 'appId: str'
- uid: azure.mgmt.appcontainers.types.Dapr.appPort
  name: appPort
  summary: Tells Dapr which port your application is listening on.
  signature: 'appPort: int'
- uid: azure.mgmt.appcontainers.types.Dapr.appProtocol
  name: appProtocol
  summary: 'Tells Dapr which protocol your application is using. Valid options are
    http and grpc. Default

    is http. Known values are: "http" and "grpc".'
  signature: 'appProtocol: str | AppProtocol'
- uid: azure.mgmt.appcontainers.types.Dapr.enableApiLogging
  name: enableApiLogging
  summary: Enables API logging for the Dapr sidecar.
  signature: 'enableApiLogging: bool'
- uid: azure.mgmt.appcontainers.types.Dapr.enabled
  name: enabled
  summary: Boolean indicating if the Dapr side car is enabled.
  signature: 'enabled: bool'
- uid: azure.mgmt.appcontainers.types.Dapr.httpMaxRequestSize
  name: httpMaxRequestSize
  summary: 'Increasing max size of request body http and grpc servers parameter in
    MB to handle uploading

    of big files. Default is 4 MB.'
  signature: 'httpMaxRequestSize: int'
- uid: azure.mgmt.appcontainers.types.Dapr.httpReadBufferSize
  name: httpReadBufferSize
  summary: 'Dapr max size of http header read buffer in KB to handle when sending
    multi-KB headers. Default

    is 65KB.'
  signature: 'httpReadBufferSize: int'
- uid: azure.mgmt.appcontainers.types.Dapr.logLevel
  name: logLevel
  summary: 'Sets the log level for the Dapr sidecar. Allowed values are debug, info,
    warn, error. Default

    is info. Known values are: "info", "debug", "warn", and "error".'
  signature: 'logLevel: str | LogLevel'
- uid: azure.mgmt.appcontainers.types.Dapr.maxConcurrency
  name: maxConcurrency
  summary: Maximum number of concurrent requests, events handled by the Dapr sidecar.
  signature: 'maxConcurrency: int'
