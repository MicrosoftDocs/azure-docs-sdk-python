### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.SandboxGroupProperties
name: SandboxGroupProperties
fullName: azure.mgmt.appcontainers.types.SandboxGroupProperties
module: azure.mgmt.appcontainers.types
summary: SandboxGroup resource specific properties.
constructor:
  syntax: SandboxGroupProperties()
variables:
- description: 'The resource ID of the Azure Container Apps environment to link to
    the

    sandbox group. A sandbox group can be linked after creation, but the link cannot
    then be

    changed or removed. For subsequent create-or-update (PUT) requests, specify the
    same

    environment ID; omitting or changing it returns 409 Conflict. Omitting it from
    an update

    (PATCH) request leaves the existing link unchanged.'
  name: environmentId
  types:
  - <xref:str>
- description: 'The default domain of the linked Azure Container Apps environment.
    Sandbox

    endpoints use subdomains of this domain. This read-only property is populated
    by the service

    and is omitted when no environment is linked.'
  name: defaultDomain
  types:
  - <xref:str>
- description: 'Known values are: "Succeeded", "Failed", "Canceled", "InProgress",

    "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SandboxGroupProvisioningState">]
attributes:
- uid: azure.mgmt.appcontainers.types.SandboxGroupProperties.defaultDomain
  name: defaultDomain
  summary: 'The default domain of the linked Azure Container Apps environment. Sandbox
    endpoints use

    subdomains of this domain. This read-only property is populated by the service
    and is omitted

    when no environment is linked.'
  signature: 'defaultDomain: str'
- uid: azure.mgmt.appcontainers.types.SandboxGroupProperties.environmentId
  name: environmentId
  summary: 'The resource ID of the Azure Container Apps environment to link to the
    sandbox group. A sandbox

    group can be linked after creation, but the link cannot then be changed or removed.
    For

    subsequent create-or-update (PUT) requests, specify the same environment ID; omitting
    or

    changing it returns 409 Conflict. Omitting it from an update (PATCH) request leaves
    the

    existing link unchanged.'
  signature: 'environmentId: str'
- uid: azure.mgmt.appcontainers.types.SandboxGroupProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed", "Canceled", "InProgress", "Updating", and

    "Deleting".'
  signature: 'provisioningState: str | SandboxGroupProvisioningState'
