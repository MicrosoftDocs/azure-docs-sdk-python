### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.ScheduledEntry
name: ScheduledEntry
fullName: azure.mgmt.appcontainers.types.ScheduledEntry
module: azure.mgmt.appcontainers.types
summary: Maintenance schedule entry for a managed environment.
constructor:
  syntax: ScheduledEntry()
variables:
- description: 'Day of the week when a managed environment can be patched. Required.
    Known

    values are: "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday",
    and "Sunday".'
  name: week_day
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WeekDay">]
- description: 'Start hour after which managed environment maintenance can start from
    0

    to 23 hour. Required.'
  name: start_hour_utc
  types:
  - <xref:int>
- description: Length of maintenance window range from 8 to 24 hours. Required.
  name: duration_hours
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.appcontainers.types.ScheduledEntry.durationHours
  name: durationHours
  summary: Length of maintenance window range from 8 to 24 hours. Required.
  signature: 'durationHours: Required[int]'
- uid: azure.mgmt.appcontainers.types.ScheduledEntry.startHourUtc
  name: startHourUtc
  summary: Start hour after which managed environment maintenance can start from 0
    to 23 hour. Required.
  signature: 'startHourUtc: Required[int]'
- uid: azure.mgmt.appcontainers.types.ScheduledEntry.weekDay
  name: weekDay
  summary: 'Day of the week when a managed environment can be patched. Required. Known
    values are:

    "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", and "Sunday".'
  signature: 'weekDay: Required[str | WeekDay]'
