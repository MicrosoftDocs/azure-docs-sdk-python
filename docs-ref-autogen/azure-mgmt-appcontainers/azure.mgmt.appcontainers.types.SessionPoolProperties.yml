### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.SessionPoolProperties
name: SessionPoolProperties
fullName: azure.mgmt.appcontainers.types.SessionPoolProperties
module: azure.mgmt.appcontainers.types
summary: Container App session pool resource specific properties.
constructor:
  syntax: SessionPoolProperties()
variables:
- description: Resource ID of the session pool's environment.
  name: environment_id
  types:
  - <xref:str>
- description: 'The container type of the sessions. You can use your own container
    to

    build the session pool, or you can use a predefined container to run workload
    with specific

    language. Known values are: "CustomContainer" and "PythonLTS".'
  name: container_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ContainerType">]
- description: 'The pool management type of the session pool. Known values are:

    "Manual" and "Dynamic".'
  name: pool_management_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PoolManagementType">]
- description: The number of nodes the session pool is using.
  name: node_count
  types:
  - <xref:int>
- description: The scale configuration of the session pool.
  name: scale_configuration
  types:
  - <xref:<xref:"ScaleConfiguration">>
- description: The secrets of the session pool.
  name: secrets
  types:
  - <xref:list>[<xref:"SessionPoolSecret">]
- description: The pool configuration if the poolManagementType is dynamic.
  name: dynamic_pool_configuration
  types:
  - <xref:<xref:"DynamicPoolConfiguration">>
- description: 'The custom container configuration if the containerType is

    CustomContainer.'
  name: custom_container_template
  types:
  - <xref:<xref:"CustomContainerTemplate">>
- description: 'The network configuration of the sessions in the session

    pool.'
  name: session_network_configuration
  types:
  - <xref:<xref:"SessionNetworkConfiguration">>
- description: The endpoint to manage the pool.
  name: pool_management_endpoint
  types:
  - <xref:str>
- description: 'Provisioning state of the session pool. Known values are:

    "InProgress", "Succeeded", "Failed", "Canceled", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SessionPoolProvisioningState">]
- description: 'Optional settings for a Managed Identity that is assigned to

    the Session pool.'
  name: managed_identity_settings
  types:
  - <xref:list>[<xref:"ManagedIdentitySetting">]
attributes:
- uid: azure.mgmt.appcontainers.types.SessionPoolProperties.containerType
  name: containerType
  summary: 'The container type of the sessions. You can use your own container to
    build the session pool,

    or you can use a predefined container to run workload with specific language.
    Known values are:

    "CustomContainer" and "PythonLTS".'
  signature: 'containerType: str | ContainerType'
- uid: azure.mgmt.appcontainers.types.SessionPoolProperties.customContainerTemplate
  name: customContainerTemplate
  summary: The custom container configuration if the containerType is CustomContainer.
  signature: 'customContainerTemplate: CustomContainerTemplate'
- uid: azure.mgmt.appcontainers.types.SessionPoolProperties.dynamicPoolConfiguration
  name: dynamicPoolConfiguration
  summary: The pool configuration if the poolManagementType is dynamic.
  signature: 'dynamicPoolConfiguration: DynamicPoolConfiguration'
- uid: azure.mgmt.appcontainers.types.SessionPoolProperties.environmentId
  name: environmentId
  summary: Resource ID of the session pool's environment.
  signature: 'environmentId: str'
- uid: azure.mgmt.appcontainers.types.SessionPoolProperties.managedIdentitySettings
  name: managedIdentitySettings
  summary: Optional settings for a Managed Identity that is assigned to the Session
    pool.
  signature: 'managedIdentitySettings: list[''ManagedIdentitySetting'']'
- uid: azure.mgmt.appcontainers.types.SessionPoolProperties.nodeCount
  name: nodeCount
  summary: The number of nodes the session pool is using.
  signature: 'nodeCount: int'
- uid: azure.mgmt.appcontainers.types.SessionPoolProperties.poolManagementEndpoint
  name: poolManagementEndpoint
  summary: The endpoint to manage the pool.
  signature: 'poolManagementEndpoint: str'
- uid: azure.mgmt.appcontainers.types.SessionPoolProperties.poolManagementType
  name: poolManagementType
  summary: '"Manual" and "Dynamic".'
  signature: 'poolManagementType: str | PoolManagementType'
- uid: azure.mgmt.appcontainers.types.SessionPoolProperties.provisioningState
  name: provisioningState
  summary: '"InProgress", "Succeeded",

    "Failed", "Canceled", and "Deleting".'
  signature: 'provisioningState: str | SessionPoolProvisioningState'
- uid: azure.mgmt.appcontainers.types.SessionPoolProperties.scaleConfiguration
  name: scaleConfiguration
  summary: The scale configuration of the session pool.
  signature: 'scaleConfiguration: ScaleConfiguration'
- uid: azure.mgmt.appcontainers.types.SessionPoolProperties.secrets
  name: secrets
  summary: The secrets of the session pool.
  signature: 'secrets: list[''SessionPoolSecret'']'
- uid: azure.mgmt.appcontainers.types.SessionPoolProperties.sessionNetworkConfiguration
  name: sessionNetworkConfiguration
  summary: The network configuration of the sessions in the session pool.
  signature: 'sessionNetworkConfiguration: SessionNetworkConfiguration'
