### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.SourceControlProperties
name: SourceControlProperties
fullName: azure.mgmt.appcontainers.types.SourceControlProperties
module: azure.mgmt.appcontainers.types
summary: SourceControl resource specific properties.
constructor:
  syntax: SourceControlProperties()
variables:
- description: 'Current provisioning State of the operation. Known values are:

    "InProgress", "Succeeded", "Failed", and "Canceled".'
  name: operation_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SourceControlOperationState">]
- description: The repo url which will be integrated to ContainerApp.
  name: repo_url
  types:
  - <xref:str>
- description: The branch which will trigger the auto deployment.
  name: branch
  types:
  - <xref:str>
- description: 'Container App Revision Template with all possible settings

    and the defaults if user did not provide them. The defaults are populated as they
    were at the

    creation time.'
  name: github_action_configuration
  types:
  - <xref:<xref:"GithubActionConfiguration">>
attributes:
- uid: azure.mgmt.appcontainers.types.SourceControlProperties.branch
  name: branch
  summary: The branch which will trigger the auto deployment.
  signature: 'branch: str'
- uid: azure.mgmt.appcontainers.types.SourceControlProperties.githubActionConfiguration
  name: githubActionConfiguration
  summary: 'Container App Revision Template with all possible settings and the defaults
    if user did not

    provide them. The defaults are populated as they were at the creation time.'
  signature: 'githubActionConfiguration: GithubActionConfiguration'
- uid: azure.mgmt.appcontainers.types.SourceControlProperties.operationState
  name: operationState
  summary: '"InProgress", "Succeeded",

    "Failed", and "Canceled".'
  signature: 'operationState: str | SourceControlOperationState'
- uid: azure.mgmt.appcontainers.types.SourceControlProperties.repoUrl
  name: repoUrl
  summary: The repo url which will be integrated to ContainerApp.
  signature: 'repoUrl: str'
