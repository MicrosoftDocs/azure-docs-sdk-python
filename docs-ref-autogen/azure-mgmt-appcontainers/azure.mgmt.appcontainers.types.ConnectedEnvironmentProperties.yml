### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.ConnectedEnvironmentProperties
name: ConnectedEnvironmentProperties
fullName: azure.mgmt.appcontainers.types.ConnectedEnvironmentProperties
module: azure.mgmt.appcontainers.types
summary: ConnectedEnvironment resource specific properties.
constructor:
  syntax: ConnectedEnvironmentProperties()
variables:
- description: 'Provisioning state of the Kubernetes Environment. Known values are:

    "Succeeded", "Failed", "Canceled", "Waiting", "InitializationInProgress",

    "InfrastructureSetupInProgress", "InfrastructureSetupComplete", and "ScheduledForDelete".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectedEnvironmentProvisioningState">]
- description: Any errors that occurred during deployment or deployment validation.
  name: deployment_errors
  types:
  - <xref:str>
- description: Default Domain Name for the cluster.
  name: default_domain
  types:
  - <xref:str>
- description: Static IP of the connectedEnvironment.
  name: static_ip
  types:
  - <xref:str>
- description: 'Application Insights connection string used by Dapr to export

    Service to Service communication telemetry.'
  name: dapr_ai_connection_string
  types:
  - <xref:str>
- description: Custom domain configuration for the environment.
  name: custom_domain_configuration
  types:
  - <xref:<xref:"CustomDomainConfiguration">>
attributes:
- uid: azure.mgmt.appcontainers.types.ConnectedEnvironmentProperties.customDomainConfiguration
  name: customDomainConfiguration
  summary: Custom domain configuration for the environment.
  signature: 'customDomainConfiguration: CustomDomainConfiguration'
- uid: azure.mgmt.appcontainers.types.ConnectedEnvironmentProperties.daprAIConnectionString
  name: daprAIConnectionString
  summary: 'Application Insights connection string used by Dapr to export Service
    to Service communication

    telemetry.'
  signature: 'daprAIConnectionString: str'
- uid: azure.mgmt.appcontainers.types.ConnectedEnvironmentProperties.defaultDomain
  name: defaultDomain
  summary: Default Domain Name for the cluster.
  signature: 'defaultDomain: str'
- uid: azure.mgmt.appcontainers.types.ConnectedEnvironmentProperties.deploymentErrors
  name: deploymentErrors
  summary: Any errors that occurred during deployment or deployment validation.
  signature: 'deploymentErrors: str'
- uid: azure.mgmt.appcontainers.types.ConnectedEnvironmentProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Waiting", "InitializationInProgress", "InfrastructureSetupInProgress",

    "InfrastructureSetupComplete", and "ScheduledForDelete".'
  signature: 'provisioningState: str | ConnectedEnvironmentProvisioningState'
- uid: azure.mgmt.appcontainers.types.ConnectedEnvironmentProperties.staticIp
  name: staticIp
  summary: Static IP of the connectedEnvironment.
  signature: 'staticIp: str'
