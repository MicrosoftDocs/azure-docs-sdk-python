### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.HttpRouteConfigProperties
name: HttpRouteConfigProperties
fullName: azure.mgmt.appcontainers.types.HttpRouteConfigProperties
module: azure.mgmt.appcontainers.types
summary: Http Route Config properties.
constructor:
  syntax: HttpRouteConfigProperties()
variables:
- description: 'The provisioning state of the Http Route Config in cluster. Known

    values are: "Succeeded", "Failed", "Canceled", "Waiting", "Updating", "Deleting",
    and

    "Pending".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HttpRouteProvisioningState">]
- description: List of errors when trying to reconcile http routes.
  name: provisioning_errors
  types:
  - <xref:list>[<xref:"HttpRouteProvisioningErrors">]
- description: FQDN of the route resource.
  name: fqdn
  types:
  - <xref:str>
- description: Custom domain bindings for http Routes' hostnames.
  name: custom_domains
  types:
  - <xref:list>[<xref:"CustomDomain">]
- description: Routing Rules for http route resource.
  name: rules
  types:
  - <xref:list>[<xref:"HttpRouteRule">]
attributes:
- uid: azure.mgmt.appcontainers.types.HttpRouteConfigProperties.customDomains
  name: customDomains
  summary: Custom domain bindings for http Routes' hostnames.
  signature: 'customDomains: list[''CustomDomain'']'
- uid: azure.mgmt.appcontainers.types.HttpRouteConfigProperties.fqdn
  name: fqdn
  summary: FQDN of the route resource.
  signature: 'fqdn: str'
- uid: azure.mgmt.appcontainers.types.HttpRouteConfigProperties.provisioningErrors
  name: provisioningErrors
  summary: List of errors when trying to reconcile http routes.
  signature: 'provisioningErrors: list[''HttpRouteProvisioningErrors'']'
- uid: azure.mgmt.appcontainers.types.HttpRouteConfigProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Failed", "Canceled", "Waiting", "Updating", "Deleting", and "Pending".'
  signature: 'provisioningState: str | HttpRouteProvisioningState'
- uid: azure.mgmt.appcontainers.types.HttpRouteConfigProperties.rules
  name: rules
  summary: Routing Rules for http route resource.
  signature: 'rules: list[''HttpRouteRule'']'
