### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.TwitterRegistration
name: TwitterRegistration
fullName: azure.mgmt.appcontainers.types.TwitterRegistration
module: azure.mgmt.appcontainers.types
summary: The configuration settings of the app registration for the Twitter provider.
constructor:
  syntax: TwitterRegistration()
variables:
- description: 'The OAuth 1.0a consumer key of the Twitter application used for sign-in.

    This setting is required for enabling Twitter Sign-In. Twitter Sign-In documentation:

    [https://dev.twitter.com/web/sign-in](https://dev.twitter.com/web/sign-in).'
  name: consumer_key
  types:
  - <xref:str>
- description: 'The app setting name that contains the OAuth 1.0a consumer

    secret of the Twitter application used for sign-in.'
  name: consumer_secret_setting_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.appcontainers.types.TwitterRegistration.consumerKey
  name: consumerKey
  summary: 'The OAuth 1.0a consumer key of the Twitter application used for sign-in.
    This setting is

    required for enabling Twitter Sign-In. Twitter Sign-In documentation:

    [https://dev.twitter.com/web/sign-in](https://dev.twitter.com/web/sign-in).'
  signature: 'consumerKey: str'
- uid: azure.mgmt.appcontainers.types.TwitterRegistration.consumerSecretSettingName
  name: consumerSecretSettingName
  summary: 'The app setting name that contains the OAuth 1.0a consumer secret of the
    Twitter application

    used for sign-in.'
  signature: 'consumerSecretSettingName: str'
