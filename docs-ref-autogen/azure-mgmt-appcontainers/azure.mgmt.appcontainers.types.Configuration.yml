### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.Configuration
name: Configuration
fullName: azure.mgmt.appcontainers.types.Configuration
module: azure.mgmt.appcontainers.types
summary: 'Non versioned Container App configuration properties that define the mutable
  settings of a

  Container app.'
constructor:
  syntax: Configuration()
variables:
- description: Collection of secrets used by a Container app.
  name: secrets
  types:
  - <xref:list>[<xref:"Secret">]
- description: 'Controls how active revisions are handled for the Container app.

    Known values are: "Multiple" and "Single".'
  name: active_revisions_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActiveRevisionsMode">]
- description: Ingress configurations.
  name: ingress
  types:
  - <xref:<xref:"Ingress">>
- description: 'Collection of private container registry credentials for containers
    used by

    the Container app.'
  name: registries
  types:
  - <xref:list>[<xref:"RegistryCredentials">]
- description: Dapr configuration for the Container App.
  name: dapr
  types:
  - <xref:<xref:"Dapr">>
- description: App runtime configuration for the Container App.
  name: runtime
  types:
  - <xref:<xref:"Runtime">>
- description: Optional. Max inactive revisions a Container App can have.
  name: max_inactive_revisions
  types:
  - <xref:int>
- description: Container App to be a dev Container App Service.
  name: service
  types:
  - <xref:<xref:"Service">>
- description: 'Optional settings for Managed Identities that are assigned to the

    Container App. If a Managed Identity is not specified here, default settings will
    be used.'
  name: identity_settings
  types:
  - <xref:list>[<xref:"IdentitySettings">]
attributes:
- uid: azure.mgmt.appcontainers.types.Configuration.activeRevisionsMode
  name: activeRevisionsMode
  summary: '"Multiple"

    and "Single".'
  signature: 'activeRevisionsMode: str | ActiveRevisionsMode'
- uid: azure.mgmt.appcontainers.types.Configuration.dapr
  name: dapr
  summary: Dapr configuration for the Container App.
  signature: 'dapr: Dapr'
- uid: azure.mgmt.appcontainers.types.Configuration.identitySettings
  name: identitySettings
  summary: 'Optional settings for Managed Identities that are assigned to the Container
    App. If a Managed

    Identity is not specified here, default settings will be used.'
  signature: 'identitySettings: list[''IdentitySettings'']'
- uid: azure.mgmt.appcontainers.types.Configuration.ingress
  name: ingress
  summary: Ingress configurations.
  signature: 'ingress: Ingress'
- uid: azure.mgmt.appcontainers.types.Configuration.maxInactiveRevisions
  name: maxInactiveRevisions
  summary: Optional. Max inactive revisions a Container App can have.
  signature: 'maxInactiveRevisions: int'
- uid: azure.mgmt.appcontainers.types.Configuration.registries
  name: registries
  summary: Collection of private container registry credentials for containers used
    by the Container app.
  signature: 'registries: list[''RegistryCredentials'']'
- uid: azure.mgmt.appcontainers.types.Configuration.runtime
  name: runtime
  summary: App runtime configuration for the Container App.
  signature: 'runtime: Runtime'
- uid: azure.mgmt.appcontainers.types.Configuration.secrets
  name: secrets
  summary: Collection of secrets used by a Container app.
  signature: 'secrets: list[''Secret'']'
- uid: azure.mgmt.appcontainers.types.Configuration.service
  name: service
  summary: Container App to be a dev Container App Service.
  signature: 'service: Service'
