### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.CustomDomain
name: CustomDomain
fullName: azure.mgmt.appcontainers.types.CustomDomain
module: azure.mgmt.appcontainers.types
summary: Custom Domain of a Container App.
constructor:
  syntax: CustomDomain()
variables:
- description: Hostname. Required.
  name: name
  types:
  - <xref:str>
- description: 'Custom Domain binding type. Known values are: "Disabled", "SniEnabled",
    and

    "Auto".'
  name: binding_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BindingType">]
- description: 'Resource Id of the Certificate to be bound to this hostname. Must
    exist

    in the Managed Environment.'
  name: certificate_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.appcontainers.types.CustomDomain.bindingType
  name: bindingType
  summary: '"Disabled", "SniEnabled", and "Auto".'
  signature: 'bindingType: str | BindingType'
- uid: azure.mgmt.appcontainers.types.CustomDomain.certificateId
  name: certificateId
  summary: 'Resource Id of the Certificate to be bound to this hostname. Must exist
    in the Managed

    Environment.'
  signature: 'certificateId: str'
- uid: azure.mgmt.appcontainers.types.CustomDomain.name
  name: name
  summary: Hostname. Required.
  signature: 'name: Required[str]'
