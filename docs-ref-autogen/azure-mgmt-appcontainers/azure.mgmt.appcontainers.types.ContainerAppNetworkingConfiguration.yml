uid: azure.mgmt.appcontainers.types.ContainerAppNetworkingConfiguration
name: ContainerAppNetworkingConfiguration
fullName: azure.mgmt.appcontainers.types.ContainerAppNetworkingConfiguration
module: azure.mgmt.appcontainers.types
summary: 'Networking configuration for a Container App. Only supported for Container
  Apps deployed into

  an Express managed environment.'
constructor:
  syntax: ContainerAppNetworkingConfiguration()
variables:
- description: 'Resource ID of a subnet used for outbound (egress) traffic from

    this Container App. Only supported for Container Apps in an Express managed environment.

    Mutually exclusive with the environment-level VNet configuration and immutable
    after the

    Container App is created.'
  name: outboundVnetSubnetId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.appcontainers.types.ContainerAppNetworkingConfiguration.outboundVnetSubnetId
  name: outboundVnetSubnetId
  summary: 'Resource ID of a subnet used for outbound (egress) traffic from this Container
    App. Only

    supported for Container Apps in an Express managed environment. Mutually exclusive
    with the

    environment-level VNet configuration and immutable after the Container App is
    created.'
  signature: 'outboundVnetSubnetId: str'
