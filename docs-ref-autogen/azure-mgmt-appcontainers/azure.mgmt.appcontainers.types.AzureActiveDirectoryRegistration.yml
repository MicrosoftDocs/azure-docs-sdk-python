### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.AzureActiveDirectoryRegistration
name: AzureActiveDirectoryRegistration
fullName: azure.mgmt.appcontainers.types.AzureActiveDirectoryRegistration
module: azure.mgmt.appcontainers.types
summary: The configuration settings of the Azure Active Directory app registration.
constructor:
  syntax: AzureActiveDirectoryRegistration()
variables:
- description: 'The OpenID Connect Issuer URI that represents the entity which issues

    access tokens for this application. When using Azure Active Directory, this value
    is the URI of

    the directory tenant, e.g. [https://login.microsoftonline.com/v2.0/{tenant-guid}/](https://login.microsoftonline.com/v2.0/{tenant-guid}/).
    This URI is a case-sensitive

    identifier for the token issuer. More information on OpenID Connect Discovery:

    [http://openid.net/specs/openid-connect-discovery-1_0.html](http://openid.net/specs/openid-connect-discovery-1_0.html).'
  name: open_id_issuer
  types:
  - <xref:str>
- description: 'The Client ID of this relying party application, known as the client_id.
    This

    setting is required for enabling OpenID Connection authentication with Azure Active
    Directory

    or other 3rd party OpenID Connect providers. More information on OpenID Connect:

    [http://openid.net/specs/openid-connect-core-1_0.html](http://openid.net/specs/openid-connect-core-1_0.html).'
  name: client_id
  types:
  - <xref:str>
- description: 'The app setting name that contains the client secret of the

    relying party application.'
  name: client_secret_setting_name
  types:
  - <xref:str>
- description: 'An alternative to the client secret, that is the

    thumbprint of a certificate used for signing purposes. This property acts as a
    replacement for

    the Client Secret. It is also optional.'
  name: client_secret_certificate_thumbprint
  types:
  - <xref:str>
- description: 'An alternative to the client secret

    thumbprint, that is the subject alternative name of a certificate used for signing
    purposes.

    This property acts as a replacement for the Client Secret Certificate Thumbprint.
    It is also

    optional.'
  name: client_secret_certificate_subject_alternative_name
  types:
  - <xref:str>
- description: 'An alternative to the client secret thumbprint, that is

    the issuer of a certificate used for signing purposes. This property acts as a
    replacement for

    the Client Secret Certificate Thumbprint. It is also optional.'
  name: client_secret_certificate_issuer
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.appcontainers.types.AzureActiveDirectoryRegistration.clientId
  name: clientId
  summary: 'The Client ID of this relying party application, known as the client_id.
    This setting is

    required for enabling OpenID Connection authentication with Azure Active Directory
    or other 3rd

    party OpenID Connect providers. More information on OpenID Connect:

    [http://openid.net/specs/openid-connect-core-1_0.html](http://openid.net/specs/openid-connect-core-1_0.html).'
  signature: 'clientId: str'
- uid: azure.mgmt.appcontainers.types.AzureActiveDirectoryRegistration.clientSecretCertificateIssuer
  name: clientSecretCertificateIssuer
  summary: 'An alternative to the client secret thumbprint, that is the issuer of
    a certificate used for

    signing purposes. This property acts as a replacement for the Client Secret Certificate

    Thumbprint. It is also optional.'
  signature: 'clientSecretCertificateIssuer: str'
- uid: azure.mgmt.appcontainers.types.AzureActiveDirectoryRegistration.clientSecretCertificateSubjectAlternativeName
  name: clientSecretCertificateSubjectAlternativeName
  summary: 'An alternative to the client secret thumbprint, that is the subject alternative
    name of a

    certificate used for signing purposes. This property acts as a replacement for
    the Client

    Secret Certificate Thumbprint. It is also optional.'
  signature: 'clientSecretCertificateSubjectAlternativeName: str'
- uid: azure.mgmt.appcontainers.types.AzureActiveDirectoryRegistration.clientSecretCertificateThumbprint
  name: clientSecretCertificateThumbprint
  summary: 'An alternative to the client secret, that is the thumbprint of a certificate
    used for signing

    purposes. This property acts as a replacement for the Client Secret. It is also
    optional.'
  signature: 'clientSecretCertificateThumbprint: str'
- uid: azure.mgmt.appcontainers.types.AzureActiveDirectoryRegistration.clientSecretSettingName
  name: clientSecretSettingName
  summary: The app setting name that contains the client secret of the relying party
    application.
  signature: 'clientSecretSettingName: str'
- uid: azure.mgmt.appcontainers.types.AzureActiveDirectoryRegistration.openIdIssuer
  name: openIdIssuer
  summary: 'The OpenID Connect Issuer URI that represents the entity which issues
    access tokens for this

    application. When using Azure Active Directory, this value is the URI of the directory
    tenant,

    e.g. [https://login.microsoftonline.com/v2.0/{tenant-guid}/](https://login.microsoftonline.com/v2.0/{tenant-guid}/).
    This URI is a case-sensitive

    identifier for the token issuer. More information on OpenID Connect Discovery:

    [http://openid.net/specs/openid-connect-discovery-1_0.html](http://openid.net/specs/openid-connect-discovery-1_0.html).'
  signature: 'openIdIssuer: str'
