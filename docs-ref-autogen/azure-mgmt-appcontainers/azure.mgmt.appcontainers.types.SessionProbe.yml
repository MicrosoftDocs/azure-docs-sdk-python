### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.SessionProbe
name: SessionProbe
fullName: azure.mgmt.appcontainers.types.SessionProbe
module: azure.mgmt.appcontainers.types
summary: Session probe configuration.
constructor:
  syntax: SessionProbe()
variables:
- description: 'Denotes the type of probe. Can be Liveness or Startup, Readiness probe
    is not

    supported in sessions. Type must be unique for each probe within the context of
    a list of

    probes (SessionProbes). Known values are: "Liveness" and "Startup".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SessionProbeType">]
- description: HTTPGet specifies the http request to perform.
  name: httpGet
  types:
  - <xref:<xref:"SessionProbeHttpGet">>
- description: 'TCPSocket specifies an action involving a TCP port. TCP hooks not
    yet

    supported.'
  name: tcpSocket
  types:
  - <xref:<xref:"SessionProbeTcpSocket">>
- description: 'Minimum consecutive failures for the probe to be considered failed

    after having succeeded. Defaults to 3. Minimum value is 1. Maximum value is 10.'
  name: failureThreshold
  types:
  - <xref:int>
- description: 'Number of seconds after the container has started before liveness

    probes are initiated. Minimum value is 1. Maximum value is 60.'
  name: initialDelaySeconds
  types:
  - <xref:int>
- description: 'How often (in seconds) to perform the probe. Default to 10 seconds.

    Minimum value is 1. Maximum value is 240.'
  name: periodSeconds
  types:
  - <xref:int>
- description: 'Minimum consecutive successes for the probe to be considered successful

    after having failed. Defaults to 1. Must be 1 for liveness and startup. Minimum
    value is 1.

    Maximum value is 10.'
  name: successThreshold
  types:
  - <xref:int>
- description: 'Optional duration in seconds the pod needs to terminate

    gracefully upon probe failure. The grace period is the duration in seconds after
    the processes

    running in the pod are sent a termination signal and the time when the processes
    are forcibly

    halted with a kill signal. Set this value longer than the expected cleanup time
    for your

    process. If this value is nil, the pod''s terminationGracePeriodSeconds will be
    used. Otherwise,

    this value overrides the value provided by the pod spec. Value must be non-negative
    integer.

    The value zero indicates stop immediately via the kill signal (no opportunity
    to shut down).

    This is an alpha field and requires enabling ProbeTerminationGracePeriod feature
    gate. Maximum

    value is 3600 seconds (1 hour).'
  name: terminationGracePeriodSeconds
  types:
  - <xref:int>
- description: 'Number of seconds after which the probe times out. Defaults to 1 second.

    Minimum value is 1. Maximum value is 240.'
  name: timeoutSeconds
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.appcontainers.types.SessionProbe.failureThreshold
  name: failureThreshold
  summary: 'Minimum consecutive failures for the probe to be considered failed after
    having succeeded.

    Defaults to 3. Minimum value is 1. Maximum value is 10.'
  signature: 'failureThreshold: int'
- uid: azure.mgmt.appcontainers.types.SessionProbe.httpGet
  name: httpGet
  summary: HTTPGet specifies the http request to perform.
  signature: 'httpGet: SessionProbeHttpGet'
- uid: azure.mgmt.appcontainers.types.SessionProbe.initialDelaySeconds
  name: initialDelaySeconds
  summary: 'Number of seconds after the container has started before liveness probes
    are initiated. Minimum

    value is 1. Maximum value is 60.'
  signature: 'initialDelaySeconds: int'
- uid: azure.mgmt.appcontainers.types.SessionProbe.periodSeconds
  name: periodSeconds
  summary: 'How often (in seconds) to perform the probe. Default to 10 seconds. Minimum
    value is 1. Maximum

    value is 240.'
  signature: 'periodSeconds: int'
- uid: azure.mgmt.appcontainers.types.SessionProbe.successThreshold
  name: successThreshold
  summary: 'Minimum consecutive successes for the probe to be considered successful
    after having failed.

    Defaults to 1. Must be 1 for liveness and startup. Minimum value is 1. Maximum
    value is 10.'
  signature: 'successThreshold: int'
- uid: azure.mgmt.appcontainers.types.SessionProbe.tcpSocket
  name: tcpSocket
  summary: TCPSocket specifies an action involving a TCP port. TCP hooks not yet supported.
  signature: 'tcpSocket: SessionProbeTcpSocket'
- uid: azure.mgmt.appcontainers.types.SessionProbe.terminationGracePeriodSeconds
  name: terminationGracePeriodSeconds
  summary: 'Optional duration in seconds the pod needs to terminate gracefully upon
    probe failure. The

    grace period is the duration in seconds after the processes running in the pod
    are sent a

    termination signal and the time when the processes are forcibly halted with a
    kill signal. Set

    this value longer than the expected cleanup time for your process. If this value
    is nil, the

    pod''s terminationGracePeriodSeconds will be used. Otherwise, this value overrides
    the value

    provided by the pod spec. Value must be non-negative integer. The value zero indicates
    stop

    immediately via the kill signal (no opportunity to shut down). This is an alpha
    field and

    requires enabling ProbeTerminationGracePeriod feature gate. Maximum value is 3600
    seconds (1

    hour).'
  signature: 'terminationGracePeriodSeconds: int'
- uid: azure.mgmt.appcontainers.types.SessionProbe.timeoutSeconds
  name: timeoutSeconds
  summary: 'Number of seconds after which the probe times out. Defaults to 1 second.
    Minimum value is 1.

    Maximum value is 240.'
  signature: 'timeoutSeconds: int'
- uid: azure.mgmt.appcontainers.types.SessionProbe.type
  name: type
  summary: 'Denotes the type of probe. Can be Liveness or Startup, Readiness probe
    is not supported in

    sessions. Type must be unique for each probe within the context of a list of probes

    (SessionProbes). Known values are: "Liveness" and "Startup".'
  signature: 'type: str | SessionProbeType'
