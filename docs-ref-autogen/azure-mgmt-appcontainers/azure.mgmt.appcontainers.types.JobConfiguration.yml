### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.JobConfiguration
name: JobConfiguration
fullName: azure.mgmt.appcontainers.types.JobConfiguration
module: azure.mgmt.appcontainers.types
summary: Non versioned Container Apps Job configuration properties.
constructor:
  syntax: JobConfiguration()
variables:
- description: Collection of secrets used by a Container Apps Job.
  name: secrets
  types:
  - <xref:list>[<xref:"Secret">]
- description: 'Trigger type of the job. Required. Known values are: "Schedule", "Event",

    and "Manual".'
  name: trigger_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TriggerType">]
- description: Maximum number of seconds a replica is allowed to run. Required.
  name: replica_timeout
  types:
  - <xref:int>
- description: Maximum number of retries before failing the job.
  name: replica_retry_limit
  types:
  - <xref:int>
- description: 'Manual trigger configuration for a single execution job.

    Properties replicaCompletionCount and parallelism would be set to 1 by default.'
  name: manual_trigger_config
  types:
  - <xref:<xref:"JobConfigurationManualTriggerConfig">>
- description: 'Cron formatted repeating trigger schedule ("* * * * >>*<<") for

    cronjobs. Properties completions and parallelism would be set to 1 by default.'
  name: schedule_trigger_config
  types:
  - <xref:<xref:"JobConfigurationScheduleTriggerConfig">>
- description: Trigger configuration of an event driven job.
  name: event_trigger_config
  types:
  - <xref:<xref:"JobConfigurationEventTriggerConfig">>
- description: 'Collection of private container registry credentials used by a Container
    apps

    job.'
  name: registries
  types:
  - <xref:list>[<xref:"RegistryCredentials">]
- description: 'Optional settings for Managed Identities that are assigned to the

    Container App Job. If a Managed Identity is not specified here, default settings
    will be used.'
  name: identity_settings
  types:
  - <xref:list>[<xref:"IdentitySettings">]
attributes:
- uid: azure.mgmt.appcontainers.types.JobConfiguration.eventTriggerConfig
  name: eventTriggerConfig
  summary: Trigger configuration of an event driven job.
  signature: 'eventTriggerConfig: JobConfigurationEventTriggerConfig'
- uid: azure.mgmt.appcontainers.types.JobConfiguration.identitySettings
  name: identitySettings
  summary: 'Optional settings for Managed Identities that are assigned to the Container
    App Job. If a

    Managed Identity is not specified here, default settings will be used.'
  signature: 'identitySettings: list[''IdentitySettings'']'
- uid: azure.mgmt.appcontainers.types.JobConfiguration.manualTriggerConfig
  name: manualTriggerConfig
  summary: 'Manual trigger configuration for a single execution job. Properties replicaCompletionCount
    and

    parallelism would be set to 1 by default.'
  signature: 'manualTriggerConfig: JobConfigurationManualTriggerConfig'
- uid: azure.mgmt.appcontainers.types.JobConfiguration.registries
  name: registries
  summary: Collection of private container registry credentials used by a Container
    apps job.
  signature: 'registries: list[''RegistryCredentials'']'
- uid: azure.mgmt.appcontainers.types.JobConfiguration.replicaRetryLimit
  name: replicaRetryLimit
  summary: Maximum number of retries before failing the job.
  signature: 'replicaRetryLimit: int'
- uid: azure.mgmt.appcontainers.types.JobConfiguration.replicaTimeout
  name: replicaTimeout
  summary: Maximum number of seconds a replica is allowed to run. Required.
  signature: 'replicaTimeout: Required[int]'
- uid: azure.mgmt.appcontainers.types.JobConfiguration.scheduleTriggerConfig
  name: scheduleTriggerConfig
  summary: 'Cron formatted repeating trigger schedule ("* * * * >>*<<") for cronjobs.
    Properties completions

    and parallelism would be set to 1 by default.'
  signature: 'scheduleTriggerConfig: JobConfigurationScheduleTriggerConfig'
- uid: azure.mgmt.appcontainers.types.JobConfiguration.secrets
  name: secrets
  summary: Collection of secrets used by a Container Apps Job.
  signature: 'secrets: list[''Secret'']'
- uid: azure.mgmt.appcontainers.types.JobConfiguration.triggerType
  name: triggerType
  summary: '"Schedule", "Event", and "Manual".'
  signature: 'triggerType: Required[str | TriggerType]'
