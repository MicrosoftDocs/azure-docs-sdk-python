  name: clientCredential
  summary: The authentication credentials of the custom Open ID Connect provider.
  signature: 'clientCredential: OpenIdConnectClientCredential'
- uid: azure.mgmt.appcontainers.types.OpenIdConnectRegistration.clientId
  name: clientId
  summary: The client id of the custom Open ID Connect provider.
  signature: 'clientId: str'
- uid: azure.mgmt.appcontainers.types.OpenIdConnectRegistration.openIdConnectConfiguration
  name: openIdConnectConfiguration
  summary: The configuration settings of the endpoints used for the custom Open ID
