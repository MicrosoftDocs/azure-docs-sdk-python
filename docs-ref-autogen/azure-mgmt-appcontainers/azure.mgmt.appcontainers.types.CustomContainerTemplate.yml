uid: azure.mgmt.appcontainers.types.CustomContainerTemplate
name: CustomContainerTemplate
fullName: azure.mgmt.appcontainers.types.CustomContainerTemplate
module: azure.mgmt.appcontainers.types
summary: Custom container configuration.
constructor:
  syntax: CustomContainerTemplate()
variables:
- description: 'Private container registry credentials for containers used by the

    sessions of the session pool.'
  name: registry_credentials
  types:
  - <xref:<xref:"SessionRegistryCredentials">>
- description: List of container definitions for the sessions of the session pool.
  name: containers
  types:
  - <xref:list>[<xref:"SessionContainer">]
- description: Session pool ingress configuration.
  name: ingress
  types:
  - <xref:<xref:"SessionIngress">>
attributes:
- uid: azure.mgmt.appcontainers.types.CustomContainerTemplate.containers
  name: containers
  summary: List of container definitions for the sessions of the session pool.
  signature: 'containers: list[azure.mgmt.appcontainers.types.SessionContainer]'
- uid: azure.mgmt.appcontainers.types.CustomContainerTemplate.ingress
  name: ingress
  summary: Session pool ingress configuration.
  signature: 'ingress: SessionIngress'
- uid: azure.mgmt.appcontainers.types.CustomContainerTemplate.registryCredentials
  name: registryCredentials
  summary: Private container registry credentials for containers used by the sessions
    of the session pool.
  signature: 'registryCredentials: SessionRegistryCredentials'
