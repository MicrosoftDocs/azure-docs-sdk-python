### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.JobScale
name: JobScale
fullName: azure.mgmt.appcontainers.types.JobScale
module: azure.mgmt.appcontainers.types
summary: Scaling configurations for event driven jobs.
constructor:
  syntax: JobScale()
variables:
- description: Interval to check each event source in seconds. Defaults to 30s.
  name: polling_interval
  types:
  - <xref:int>
- description: 'Minimum number of job executions that are created for a trigger, default

    0.'
  name: min_executions
  types:
  - <xref:int>
- description: 'Maximum number of job executions that are created for a trigger, default

    100.'
  name: max_executions
  types:
  - <xref:int>
- description: Scaling rules.
  name: rules
  types:
  - <xref:list>[<xref:"JobScaleRule">]
attributes:
- uid: azure.mgmt.appcontainers.types.JobScale.maxExecutions
  name: maxExecutions
  summary: Maximum number of job executions that are created for a trigger, default
    100.
  signature: 'maxExecutions: int'
- uid: azure.mgmt.appcontainers.types.JobScale.minExecutions
  name: minExecutions
  summary: Minimum number of job executions that are created for a trigger, default
    0.
  signature: 'minExecutions: int'
- uid: azure.mgmt.appcontainers.types.JobScale.pollingInterval
  name: pollingInterval
  summary: Interval to check each event source in seconds. Defaults to 30s.
  signature: 'pollingInterval: int'
- uid: azure.mgmt.appcontainers.types.JobScale.rules
  name: rules
  summary: Scaling rules.
  signature: 'rules: list[azure.mgmt.appcontainers.types.JobScaleRule]'
