### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.ManagedCertificateProperties
name: ManagedCertificateProperties
fullName: azure.mgmt.appcontainers.types.ManagedCertificateProperties
module: azure.mgmt.appcontainers.types
summary: Certificate resource specific properties.
constructor:
  syntax: ManagedCertificateProperties()
variables:
- description: 'Provisioning state of the certificate. Known values are: "Succeeded",

    "Failed", "Canceled", "DeleteFailed", "Pending", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CertificateProvisioningState">]
- description: Subject name of the certificate.
  name: subject_name
  types:
  - <xref:str>
- description: Any error occurred during the certificate provision.
  name: error
  types:
  - <xref:str>
- description: 'Selected type of domain control validation for managed

    certificates. Known values are: "CNAME", "HTTP", and "TXT".'
  name: domain_control_validation
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ManagedCertificateDomainControlValidation">]
- description: 'A TXT token used for DNS TXT domain control validation when issuing

    this type of managed certificates.'
  name: validation_token
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.appcontainers.types.ManagedCertificateProperties.domainControlValidation
  name: domainControlValidation
  summary: 'Selected type of domain control validation for managed certificates. Known
    values are:

    "CNAME", "HTTP", and "TXT".'
  signature: 'domainControlValidation: str | ManagedCertificateDomainControlValidation'
- uid: azure.mgmt.appcontainers.types.ManagedCertificateProperties.error
  name: error
  summary: Any error occurred during the certificate provision.
  signature: 'error: str'
- uid: azure.mgmt.appcontainers.types.ManagedCertificateProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "DeleteFailed", "Pending", and "Deleting".'
  signature: 'provisioningState: str | CertificateProvisioningState'
- uid: azure.mgmt.appcontainers.types.ManagedCertificateProperties.subjectName
  name: subjectName
  summary: Subject name of the certificate.
  signature: 'subjectName: str'
- uid: azure.mgmt.appcontainers.types.ManagedCertificateProperties.validationToken
  name: validationToken
  summary: 'A TXT token used for DNS TXT domain control validation when issuing this
    type of managed

    certificates.'
  signature: 'validationToken: str'
