### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.JobTemplate
name: JobTemplate
fullName: azure.mgmt.appcontainers.types.JobTemplate
module: azure.mgmt.appcontainers.types
summary: 'Container Apps Job versioned application definition. Defines the desired
  state of an immutable

  revision. Any changes to this section Will result in a new revision being created.'
constructor:
  syntax: JobTemplate()
variables:
- description: List of specialized containers that run before app containers.
  name: init_containers
  types:
  - <xref:list>[<xref:"InitContainer">]
- description: List of container definitions for the Container App.
  name: containers
  types:
  - <xref:list>[<xref:"Container">]
- description: List of volume definitions for the Container App.
  name: volumes
  types:
  - <xref:list>[<xref:"Volume">]
attributes:
- uid: azure.mgmt.appcontainers.types.JobTemplate.containers
  name: containers
  summary: List of container definitions for the Container App.
  signature: 'containers: list[azure.mgmt.appcontainers.types.Container]'
- uid: azure.mgmt.appcontainers.types.JobTemplate.initContainers
  name: initContainers
  summary: List of specialized containers that run before app containers.
  signature: 'initContainers: list[azure.mgmt.appcontainers.types.InitContainer]'
- uid: azure.mgmt.appcontainers.types.JobTemplate.volumes
  name: volumes
  summary: List of volume definitions for the Container App.
  signature: 'volumes: list[azure.mgmt.appcontainers.types.Volume]'
