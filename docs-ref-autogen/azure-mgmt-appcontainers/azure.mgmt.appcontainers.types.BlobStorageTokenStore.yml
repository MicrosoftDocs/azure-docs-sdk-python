### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.BlobStorageTokenStore
name: BlobStorageTokenStore
fullName: azure.mgmt.appcontainers.types.BlobStorageTokenStore
module: azure.mgmt.appcontainers.types
summary: The configuration settings of the storage of the tokens if blob storage is
  used.
constructor:
  syntax: BlobStorageTokenStore()
variables:
- description: 'The name of the app secrets containing the SAS URL of the blob storage

    containing the tokens.'
  name: sasUrlSettingName
  types:
  - <xref:str>
- description: 'The URI of the blob storage containing the tokens. Should not be used

    along with sasUrlSettingName.'
  name: blobContainerUri
  types:
  - <xref:str>
- description: 'The Client ID of a User-Assigned Managed Identity. Should not be used
    along

    with managedIdentityResourceId.'
  name: clientId
  types:
  - <xref:str>
- description: 'The Resource ID of a User-Assigned Managed Identity. Should

    not be used along with clientId.'
  name: managedIdentityResourceId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.appcontainers.types.BlobStorageTokenStore.blobContainerUri
  name: blobContainerUri
  summary: 'The URI of the blob storage containing the tokens. Should not be used
    along with

    sasUrlSettingName.'
  signature: 'blobContainerUri: str'
- uid: azure.mgmt.appcontainers.types.BlobStorageTokenStore.clientId
  name: clientId
  summary: 'The Client ID of a User-Assigned Managed Identity. Should not be used
    along with

    managedIdentityResourceId.'
  signature: 'clientId: str'
- uid: azure.mgmt.appcontainers.types.BlobStorageTokenStore.managedIdentityResourceId
  name: managedIdentityResourceId
  summary: The Resource ID of a User-Assigned Managed Identity. Should not be used
    along with clientId.
  signature: 'managedIdentityResourceId: str'
- uid: azure.mgmt.appcontainers.types.BlobStorageTokenStore.sasUrlSettingName
  name: sasUrlSettingName
  summary: The name of the app secrets containing the SAS URL of the blob storage
    containing the tokens.
  signature: 'sasUrlSettingName: str'
