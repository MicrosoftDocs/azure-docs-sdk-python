uid: azure.mgmt.appcontainers.types.JobProperties
name: JobProperties
fullName: azure.mgmt.appcontainers.types.JobProperties
module: azure.mgmt.appcontainers.types
summary: Container Apps Job resource specific properties.
constructor:
  syntax: JobProperties()
variables:
- description: 'Provisioning state of the Container Apps Job. Known values are:

    "InProgress", "Succeeded", "Failed", "Canceled", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"JobProvisioningState">]
- description: 'Current running state of the job. Known values are: "Ready", "Progressing",

    and "Suspended".'
  name: runningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"JobRunningState">]
- description: Resource ID of environment.
  name: environmentId
  types:
  - <xref:str>
- description: Workload profile name to pin for container apps job execution.
  name: workloadProfileName
  types:
  - <xref:str>
- description: Container Apps Job configuration properties.
  name: configuration
  types:
  - <xref:<xref:"JobConfiguration">>
- description: Container Apps job definition.
  name: template
  types:
  - <xref:<xref:"JobTemplate">>
- description: Outbound IP Addresses of a container apps job.
  name: outboundIpAddresses
  types:
  - <xref:list>[<xref:str>]
- description: The endpoint of the eventstream of the container apps job.
  name: eventStreamEndpoint
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.appcontainers.types.JobProperties.configuration
  name: configuration
  summary: Container Apps Job configuration properties.
