### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.types.Ingress
name: Ingress
fullName: azure.mgmt.appcontainers.types.Ingress
module: azure.mgmt.appcontainers.types
summary: Container App Ingress configuration.
constructor:
  syntax: Ingress()
variables:
- description: Hostname.
  name: fqdn
  types:
  - <xref:str>
- description: Bool indicating if app exposes an external http endpoint.
  name: external
  types:
  - <xref:bool>
- description: Target Port in containers for traffic from ingress.
  name: target_port
  types:
  - <xref:int>
- description: Exposed Port in containers for TCP traffic from ingress.
  name: exposed_port
  types:
  - <xref:int>
- description: 'Ingress transport protocol. Known values are: "auto", "http", "http2",
    and

    "tcp".'
  name: transport
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IngressTransportMethod">]
- description: Traffic weights for app's revisions.
  name: traffic
  types:
  - <xref:list>[<xref:"TrafficWeight">]
- description: custom domain bindings for Container Apps' hostnames.
  name: custom_domains
  types:
  - <xref:list>[<xref:"CustomDomain">]
- description: 'Bool indicating if HTTP connections to is allowed. If set to false
    HTTP

    connections are automatically redirected to HTTPS connections.'
  name: allow_insecure
  types:
  - <xref:bool>
- description: Rules to restrict incoming IP address.
  name: ip_security_restrictions
  types:
  - <xref:list>[<xref:"IpSecurityRestrictionRule">]
- description: Sticky Sessions for Single Revision Mode.
  name: sticky_sessions
  types:
  - <xref:<xref:"IngressStickySessions">>
- description: 'Client certificate mode for mTLS authentication. Ignore

    indicates server drops client certificate on forwarding. Accept indicates server
    forwards

    client certificate but does not require a client certificate. Require indicates
    server requires

    a client certificate. Known values are: "ignore", "accept", and "require".'
  name: client_certificate_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IngressClientCertificateMode">]
- description: CORS policy for container app.
  name: cors_policy
  types:
  - <xref:<xref:"CorsPolicy">>
- description: Settings to expose additional ports on container app.
  name: additional_port_mappings
  types:
  - <xref:list>[<xref:"IngressPortMapping">]
attributes:
- uid: azure.mgmt.appcontainers.types.Ingress.additionalPortMappings
  name: additionalPortMappings
  summary: Settings to expose additional ports on container app.
  signature: 'additionalPortMappings: list[''IngressPortMapping'']'
- uid: azure.mgmt.appcontainers.types.Ingress.allowInsecure
  name: allowInsecure
  summary: 'Bool indicating if HTTP connections to is allowed. If set to false HTTP
    connections are

    automatically redirected to HTTPS connections.'
  signature: 'allowInsecure: bool'
- uid: azure.mgmt.appcontainers.types.Ingress.clientCertificateMode
  name: clientCertificateMode
  summary: 'Client certificate mode for mTLS authentication. Ignore indicates server
    drops client

    certificate on forwarding. Accept indicates server forwards client certificate
    but does not

    require a client certificate. Require indicates server requires a client certificate.
    Known

    values are: "ignore", "accept", and "require".'
  signature: 'clientCertificateMode: str | IngressClientCertificateMode'
- uid: azure.mgmt.appcontainers.types.Ingress.corsPolicy
  name: corsPolicy
  summary: CORS policy for container app.
  signature: 'corsPolicy: CorsPolicy'
- uid: azure.mgmt.appcontainers.types.Ingress.customDomains
  name: customDomains
  summary: custom domain bindings for Container Apps' hostnames.
  signature: 'customDomains: list[''CustomDomain'']'
- uid: azure.mgmt.appcontainers.types.Ingress.exposedPort
  name: exposedPort
  summary: Exposed Port in containers for TCP traffic from ingress.
  signature: 'exposedPort: int'
- uid: azure.mgmt.appcontainers.types.Ingress.external
  name: external
  summary: Bool indicating if app exposes an external http endpoint.
  signature: 'external: bool'
- uid: azure.mgmt.appcontainers.types.Ingress.fqdn
  name: fqdn
  summary: Hostname.
  signature: 'fqdn: str'
- uid: azure.mgmt.appcontainers.types.Ingress.ipSecurityRestrictions
  name: ipSecurityRestrictions
  summary: Rules to restrict incoming IP address.
  signature: 'ipSecurityRestrictions: list[''IpSecurityRestrictionRule'']'
- uid: azure.mgmt.appcontainers.types.Ingress.stickySessions
  name: stickySessions
  summary: Sticky Sessions for Single Revision Mode.
  signature: 'stickySessions: IngressStickySessions'
- uid: azure.mgmt.appcontainers.types.Ingress.targetPort
  name: targetPort
  summary: Target Port in containers for traffic from ingress.
  signature: 'targetPort: int'
- uid: azure.mgmt.appcontainers.types.Ingress.traffic
  name: traffic
  summary: Traffic weights for app's revisions.
  signature: 'traffic: list[''TrafficWeight'']'
- uid: azure.mgmt.appcontainers.types.Ingress.transport
  name: transport
  summary: '"auto", "http", "http2", and "tcp".'
  signature: 'transport: str | IngressTransportMethod'
