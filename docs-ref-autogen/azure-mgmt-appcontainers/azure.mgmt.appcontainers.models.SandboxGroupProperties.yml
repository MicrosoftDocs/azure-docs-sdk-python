### YamlMime:PythonClass
uid: azure.mgmt.appcontainers.models.SandboxGroupProperties
name: SandboxGroupProperties
fullName: azure.mgmt.appcontainers.models.SandboxGroupProperties
module: azure.mgmt.appcontainers.models
summary: SandboxGroup resource specific properties.
constructor:
  syntax: 'SandboxGroupProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The resource ID of the Azure Container Apps environment to link to
    the

    sandbox group. A sandbox group can be linked after creation, but the link cannot
    then be

    changed or removed. For subsequent create-or-update (PUT) requests, specify the
    same

    environment ID; omitting or changing it returns 409 Conflict. Omitting it from
    an update

    (PATCH) request leaves the existing link unchanged.'
  name: environment_id
  types:
  - <xref:str>
- description: 'The default domain of the linked Azure Container Apps environment.

    Sandbox endpoints use subdomains of this domain. This read-only property is populated
    by the

    service and is omitted when no environment is linked.'
  name: default_domain
  types:
  - <xref:str>
- description: 'Known values are: "Succeeded", "Failed", "Canceled", "InProgress",

    "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.appcontainers.models.SandboxGroupProvisioningState>
attributes:
