### YamlMime:PythonClass
uid: azure.mgmt.web.types.VnetRouteProperties
name: VnetRouteProperties
fullName: azure.mgmt.web.types.VnetRouteProperties
module: azure.mgmt.web.types
summary: VnetRoute resource specific properties.
constructor:
  syntax: VnetRouteProperties()
variables:
- description: 'The starting address for this route. This may also include a CIDR

    notation, in which case the end address must not be specified.'
  name: start_address
  types:
  - <xref:str>
- description: 'The ending address for this route. If the start address is specified
    in CIDR

    notation, this must be omitted.'
  name: end_address
  types:
  - <xref:str>
- description: 'The type of route this is:

    DEFAULT - By default, every app has routes to the local address ranges specified
    by RFC1918

    INHERITED - Routes inherited from the real Virtual Network routes

    STATIC - Static route set on the app only


    These values will be used for syncing an app''s routes with those from a Virtual
    Network. Known

    values are: "DEFAULT", "INHERITED", and "STATIC".'
  name: route_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RouteType">]
attributes:
- uid: azure.mgmt.web.types.VnetRouteProperties.endAddress
  name: endAddress
  summary: 'The ending address for this route. If the start address is specified in
    CIDR notation, this

    must be omitted.'
  signature: 'endAddress: str'
- uid: azure.mgmt.web.types.VnetRouteProperties.routeType
  name: routeType
  summary: 'The type of route this is:

    DEFAULT - By default, every app has routes to the local address ranges specified
    by RFC1918

    INHERITED - Routes inherited from the real Virtual Network routes

    STATIC - Static route set on the app only


    These values will be used for syncing an app''s routes with those from a Virtual
    Network. Known

    values are: "DEFAULT", "INHERITED", and "STATIC".'
  signature: 'routeType: str | RouteType'
- uid: azure.mgmt.web.types.VnetRouteProperties.startAddress
  name: startAddress
  summary: 'The starting address for this route. This may also include a CIDR notation,
    in which case the

    end address must not be specified.'
  signature: 'startAddress: str'
