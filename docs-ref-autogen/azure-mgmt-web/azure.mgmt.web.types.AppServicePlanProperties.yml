### YamlMime:PythonClass
uid: azure.mgmt.web.types.AppServicePlanProperties
name: AppServicePlanProperties
fullName: azure.mgmt.web.types.AppServicePlanProperties
module: azure.mgmt.web.types
summary: AppServicePlan resource specific properties.
constructor:
  syntax: AppServicePlanProperties()
variables:
- description: Target worker tier assigned to the App Service plan.
  name: worker_tier_name
  types:
  - <xref:str>
- description: 'App Service plan status. Known values are: "Ready", "Pending", and
    "Creating".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StatusOptions">]
- description: App Service plan subscription.
  name: subscription
  types:
  - <xref:str>
- description: 'Specification for the App Service Environment to use for the

    App Service plan.'
  name: hosting_environment_profile
  types:
  - <xref:<xref:"HostingEnvironmentProfile">>
- description: 'Maximum number of instances that can be assigned to this App

    Service plan.'
  name: maximum_number_of_workers
  types:
  - <xref:int>
- description: The number of instances that are assigned to this App Service plan.
  name: number_of_workers
  types:
  - <xref:int>
- description: Geographical location for the App Service plan.
  name: geo_region
  types:
  - <xref:str>
- description: 'If <code>true</code>, apps assigned to this App Service plan can be

    scaled independently. If <code>false</code>, apps assigned to this App Service
    plan will scale

    to all instances of the plan.'
  name: per_site_scaling
  types:
  - <xref:bool>
- description: 'ServerFarm supports ElasticScale. Apps in this plan will scale as

    if the ServerFarm was ElasticPremium sku.'
  name: elastic_scale_enabled
  types:
  - <xref:bool>
- description: 'Maximum number of total workers allowed for this

    ElasticScaleEnabled App Service Plan.'
  name: maximum_elastic_worker_count
  types:
  - <xref:int>
- description: Number of apps assigned to this App Service plan.
  name: number_of_sites
  types:
  - <xref:int>
- description: If <code>true</code>, this App Service Plan owns spot instances.
  name: is_spot
  types:
  - <xref:bool>
- description: 'The time when the server farm expires. Valid only if it is a spot

    server farm.'
  name: spot_expiration_time
  types:
  - <xref:str>
- description: The time when the server farm free offer expires.
  name: free_offer_expiration_time
  types:
  - <xref:str>
- description: Resource group of the App Service plan.
  name: resource_group
  types:
  - <xref:str>
- description: If Linux app service plan <code>true</code>, <code>false</code> otherwise.
  name: reserved
  types:
  - <xref:bool>
- description: 'Obsolete: If Hyper-V container app service plan <code>true</code>,

    <code>false</code> otherwise.'
  name: is_xenon
  types:
  - <xref:bool>
- description: 'If Hyper-V container app service plan <code>true</code>, <code>false</code>

    otherwise.'
  name: hyper_v
  types:
  - <xref:bool>
- description: Scaling worker count.
  name: target_worker_count
  types:
  - <xref:int>
- description: Scaling worker size ID.
  name: target_worker_size_id
  types:
  - <xref:int>
- description: 'Provisioning state of the App Service Plan. Known values are:

    "Succeeded", "Failed", "Canceled", "InProgress", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Specification for the Kubernetes Environment to use for the App

    Service plan.'
  name: kube_environment_profile
  types:
  - <xref:<xref:"KubeEnvironmentProfile">>
- description: 'If <code>true</code>, this App Service Plan will perform availability

    zone balancing. If <code>false</code>, this App Service Plan will not perform
    availability zone

    balancing.'
  name: zone_redundant
  types:
  - <xref:bool>
- description: 'If <code>true</code>, this App Service Plan will attempt to scale

    asynchronously if there are insufficient workers to scale synchronously. If <code>false</code>,

    this App Service Plan will only attempt sync scaling.'
  name: async_scaling_enabled
  types:
  - <xref:bool>
- description: 'Identity to use by platform for various features and integrations

    using managed identity.'
  name: plan_default_identity
  types:
  - <xref:<xref:"DefaultIdentity">>
- description: Whether this server farm is in custom mode.
  name: is_custom_mode
  types:
  - <xref:bool>
- description: Registry adapters associated with this App Service plan.
  name: registry_adapters
  types:
  - <xref:list>[<xref:"RegistryAdapter">]
- description: Install scripts associated with this App Service plan.
  name: install_scripts
  types:
  - <xref:list>[<xref:"InstallScript">]
- description: All network settings for the server farm.
  name: network
  types:
  - <xref:<xref:"ServerFarmNetworkSettings">>
- description: Storage mounts associated with this App Service plan.
  name: storage_mounts
  types:
  - <xref:list>[<xref:"StorageMount">]
- description: 'If <code>true</code>, RDP access is enabled for this App Service plan.
    Only

    applicable for IsCustomMode ASPs. If <code>false</code>, RDP access is disabled.'
  name: rdp_enabled
  types:
  - <xref:bool>
attributes:
