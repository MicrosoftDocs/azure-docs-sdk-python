### YamlMime:PythonClass
uid: azure.mgmt.web.types.HttpSettings
name: HttpSettings
fullName: azure.mgmt.web.types.HttpSettings
module: azure.mgmt.web.types
summary: 'The configuration settings of the HTTP requests for authentication and authorization
  requests

  made against App Service Authentication/Authorization.'
constructor:
  syntax: HttpSettings()
variables:
- description: '<code>false</code> if the authentication/authorization responses not

    having the HTTPS scheme are permissible; otherwise, <code>true</code>.'
  name: require_https
  types:
  - <xref:bool>
- description: The configuration settings of the paths HTTP requests.
  name: routes
  types:
  - <xref:<xref:"HttpSettingsRoutes">>
- description: The configuration settings of a forward proxy used to make the requests.
  name: forward_proxy
  types:
  - <xref:<xref:"ForwardProxy">>
attributes:
- uid: azure.mgmt.web.types.HttpSettings.forwardProxy
  name: forwardProxy
  summary: The configuration settings of a forward proxy used to make the requests.
  signature: 'forwardProxy: ForwardProxy'
- uid: azure.mgmt.web.types.HttpSettings.requireHttps
  name: requireHttps
  summary: '<code>false</code> if the authentication/authorization responses not having
    the HTTPS scheme

    are permissible; otherwise, <code>true</code>.'
  signature: 'requireHttps: bool'
- uid: azure.mgmt.web.types.HttpSettings.routes
  name: routes
  summary: The configuration settings of the paths HTTP requests.
  signature: 'routes: HttpSettingsRoutes'
