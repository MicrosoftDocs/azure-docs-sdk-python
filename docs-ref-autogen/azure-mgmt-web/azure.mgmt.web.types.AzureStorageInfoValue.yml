### YamlMime:PythonClass
uid: azure.mgmt.web.types.AzureStorageInfoValue
name: AzureStorageInfoValue
fullName: azure.mgmt.web.types.AzureStorageInfoValue
module: azure.mgmt.web.types
summary: Azure Files or Blob Storage access information value for dictionary storage.
constructor:
  syntax: AzureStorageInfoValue()
variables:
- description: 'Type of storage. Known values are: "AzureFiles" and "AzureBlob".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureStorageType">]
- description: Name of the storage account.
  name: account_name
  types:
  - <xref:str>
- description: Name of the file share (container name, for Blob storage).
  name: share_name
  types:
  - <xref:str>
- description: Access key for the storage account.
  name: access_key
  types:
  - <xref:str>
- description: Path to mount the storage within the site's runtime environment.
  name: mount_path
  types:
  - <xref:str>
- description: 'State of the storage account. Known values are: "Ok", "InvalidCredentials",

    "InvalidShare", and "NotValidated".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureStorageState">]
- description: 'Mounting protocol to use for the storage account. Known values are:
    "Smb",

    "Http", and "Nfs".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureStorageProtocol">]
attributes:
- uid: azure.mgmt.web.types.AzureStorageInfoValue.accessKey
  name: accessKey
  summary: Access key for the storage account.
  signature: 'accessKey: str'
- uid: azure.mgmt.web.types.AzureStorageInfoValue.accountName
  name: accountName
  summary: Name of the storage account.
  signature: 'accountName: str'
- uid: azure.mgmt.web.types.AzureStorageInfoValue.mountPath
  name: mountPath
  summary: Path to mount the storage within the site's runtime environment.
  signature: 'mountPath: str'
- uid: azure.mgmt.web.types.AzureStorageInfoValue.protocol
  name: protocol
  summary: '"Smb", "Http", and

    "Nfs".'
  signature: 'protocol: str | AzureStorageProtocol'
- uid: azure.mgmt.web.types.AzureStorageInfoValue.shareName
  name: shareName
  summary: Name of the file share (container name, for Blob storage).
  signature: 'shareName: str'
- uid: azure.mgmt.web.types.AzureStorageInfoValue.state
  name: state
  summary: '"Ok", "InvalidCredentials",

    "InvalidShare", and "NotValidated".'
  signature: 'state: str | AzureStorageState'
- uid: azure.mgmt.web.types.AzureStorageInfoValue.type
  name: type
  summary: '"AzureFiles" and "AzureBlob".'
  signature: 'type: str | AzureStorageType'
