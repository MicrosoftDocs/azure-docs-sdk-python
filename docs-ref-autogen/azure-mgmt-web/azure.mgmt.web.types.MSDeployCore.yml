### YamlMime:PythonClass
uid: azure.mgmt.web.types.MSDeployCore
name: MSDeployCore
fullName: azure.mgmt.web.types.MSDeployCore
module: azure.mgmt.web.types
summary: MSDeploy ARM PUT core information.
constructor:
  syntax: MSDeployCore()
variables:
- description: Package URI.
  name: package_uri
  types:
  - <xref:str>
- description: SQL Connection String.
  name: connection_string
  types:
  - <xref:str>
- description: Database Type.
  name: db_type
  types:
  - <xref:str>
- description: 'URI of MSDeploy Parameters file. Must not be set if

    SetParameters is used.'
  name: set_parameters_xml_file_uri
  types:
  - <xref:str>
- description: MSDeploy Parameters. Must not be set if SetParametersXmlFileUri is
    used.
  name: set_parameters
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'Controls whether the MSDeploy operation skips the App_Data directory.
    If

    set to <code>true</code>, the existing App_Data directory on the destination will
    not be

    deleted, and any App_Data directory in the source will be ignored. Setting is

    <code>false</code> by default.'
  name: skip_app_data
  types:
  - <xref:bool>
- description: 'Sets the AppOffline rule while the MSDeploy operation executes. Setting
    is

    <code>false</code> by default.'
  name: app_offline
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.web.types.MSDeployCore.appOffline
  name: appOffline
  summary: 'Sets the AppOffline rule while the MSDeploy operation executes. Setting
    is <code>false</code>

    by default.'
  signature: 'appOffline: bool'
- uid: azure.mgmt.web.types.MSDeployCore.connectionString
  name: connectionString
  summary: SQL Connection String.
  signature: 'connectionString: str'
- uid: azure.mgmt.web.types.MSDeployCore.dbType
  name: dbType
  summary: Database Type.
  signature: 'dbType: str'
- uid: azure.mgmt.web.types.MSDeployCore.packageUri
  name: packageUri
  summary: Package URI.
  signature: 'packageUri: str'
- uid: azure.mgmt.web.types.MSDeployCore.setParameters
  name: setParameters
  summary: MSDeploy Parameters. Must not be set if SetParametersXmlFileUri is used.
  signature: 'setParameters: dict[str, str]'
- uid: azure.mgmt.web.types.MSDeployCore.setParametersXmlFileUri
  name: setParametersXmlFileUri
  summary: URI of MSDeploy Parameters file. Must not be set if SetParameters is used.
  signature: 'setParametersXmlFileUri: str'
- uid: azure.mgmt.web.types.MSDeployCore.skipAppData
  name: skipAppData
  summary: 'Controls whether the MSDeploy operation skips the App_Data directory.
    If set to

    <code>true</code>, the existing App_Data directory on the destination will not
    be deleted, and

    any App_Data directory in the source will be ignored. Setting is <code>false</code>
    by default.'
  signature: 'skipAppData: bool'
