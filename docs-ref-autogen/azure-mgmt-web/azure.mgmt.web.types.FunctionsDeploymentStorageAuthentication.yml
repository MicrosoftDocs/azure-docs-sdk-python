### YamlMime:PythonClass
uid: azure.mgmt.web.types.FunctionsDeploymentStorageAuthentication
name: FunctionsDeploymentStorageAuthentication
fullName: azure.mgmt.web.types.FunctionsDeploymentStorageAuthentication
module: azure.mgmt.web.types
summary: Authentication method to access the storage account for deployment.
constructor:
  syntax: FunctionsDeploymentStorageAuthentication()
variables:
- description: 'Property to select authentication type to access the selected storage
    account.

    Available options: SystemAssignedIdentity, UserAssignedIdentity,

    StorageAccountConnectionString. Known values are: "SystemAssignedIdentity",

    "UserAssignedIdentity", and "StorageAccountConnectionString".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AuthenticationType">]
- description: 'Use this property for UserAssignedIdentity. Set the

    resource ID of the identity. Do not set a value for this property when using other

    authentication type.'
  name: user_assigned_identity_resource_id
  types:
  - <xref:str>
- description: 'Use this property for

    StorageAccountConnectionString. Set the name of the app setting that has the storage
    account

    connection string. Do not set a value for this property when using other authentication
    type.'
  name: storage_account_connection_string_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.web.types.FunctionsDeploymentStorageAuthentication.storageAccountConnectionStringName
  name: storageAccountConnectionStringName
  summary: 'Use this property for StorageAccountConnectionString. Set the name of
    the app setting that has

    the storage account connection string. Do not set a value for this property when
    using other

    authentication type.'
  signature: 'storageAccountConnectionStringName: str'
- uid: azure.mgmt.web.types.FunctionsDeploymentStorageAuthentication.type
  name: type
  summary: 'Property to select authentication type to access the selected storage
    account. Available

    options: SystemAssignedIdentity, UserAssignedIdentity, StorageAccountConnectionString.
    Known

    values are: "SystemAssignedIdentity", "UserAssignedIdentity", and

    "StorageAccountConnectionString".'
  signature: 'type: str | AuthenticationType'
- uid: azure.mgmt.web.types.FunctionsDeploymentStorageAuthentication.userAssignedIdentityResourceId
  name: userAssignedIdentityResourceId
  summary: 'Use this property for UserAssignedIdentity. Set the resource ID of the
    identity. Do not set a

    value for this property when using other authentication type.'
  signature: 'userAssignedIdentityResourceId: str'
