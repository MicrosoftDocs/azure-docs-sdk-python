### YamlMime:PythonClass
uid: azure.mgmt.web.types.KubeEnvironmentProperties
name: KubeEnvironmentProperties
fullName: azure.mgmt.web.types.KubeEnvironmentProperties
module: azure.mgmt.web.types
summary: KubeEnvironment resource specific properties.
constructor:
  syntax: KubeEnvironmentProperties()
variables:
- description: 'Provisioning state of the Kubernetes Environment. Known values are:

    "Succeeded", "Failed", "Canceled", "Waiting", "InitializationInProgress",

    "InfrastructureSetupInProgress", "InfrastructureSetupComplete", "ScheduledForDelete",

    "UpgradeRequested", and "UpgradeFailed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"KubeEnvironmentProvisioningState">]
- description: Any errors that occurred during deployment or deployment validation.
  name: deployment_errors
  types:
  - <xref:str>
- description: Only visible within Vnet/Subnet.
  name: internal_load_balancer_enabled
  types:
  - <xref:bool>
- description: Default Domain Name for the cluster.
  name: default_domain
  types:
  - <xref:str>
- description: Static IP of the KubeEnvironment.
  name: static_ip
  types:
  - <xref:str>
- description: 'Type of Kubernetes Environment. Only supported for Container App

    Environments with value as Managed.'
  name: environment_type
  types:
  - <xref:str>
- description: 'Cluster configuration which determines the ARC cluster components

    types. Eg: Choosing between BuildService kind, FrontEnd Service ArtifactsStorageType
    etc.'
  name: arc_configuration
  types:
  - <xref:<xref:"ArcConfiguration">>
- description: 'Cluster configuration which enables the log daemon to export app

    logs to a destination. Currently only "log-analytics" is supported.'
  name: app_logs_configuration
  types:
  - <xref:<xref:"AppLogsConfiguration">>
- description: 'Cluster configuration for Container Apps Environments to

    configure Dapr Instrumentation Key and VNET Configuration.'
  name: container_apps_configuration
  types:
  - <xref:<xref:"ContainerAppsConfiguration">>
- name: aks_resource_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.web.types.KubeEnvironmentProperties.appLogsConfiguration
  name: appLogsConfiguration
  summary: 'Cluster configuration which enables the log daemon to export app logs
    to a destination.

    Currently only "log-analytics" is supported.'
  signature: 'appLogsConfiguration: AppLogsConfiguration'
- uid: azure.mgmt.web.types.KubeEnvironmentProperties.arcConfiguration
  name: arcConfiguration
  summary: 'Choosing between

    BuildService kind, FrontEnd Service ArtifactsStorageType etc.'
  signature: 'arcConfiguration: ArcConfiguration'
- uid: azure.mgmt.web.types.KubeEnvironmentProperties.containerAppsConfiguration
  name: containerAppsConfiguration
  summary: 'Cluster configuration for Container Apps Environments to configure Dapr
    Instrumentation Key and

    VNET Configuration.'
  signature: 'containerAppsConfiguration: ContainerAppsConfiguration'
- uid: azure.mgmt.web.types.KubeEnvironmentProperties.defaultDomain
  name: defaultDomain
  summary: Default Domain Name for the cluster.
  signature: 'defaultDomain: str'
- uid: azure.mgmt.web.types.KubeEnvironmentProperties.deploymentErrors
  name: deploymentErrors
  summary: Any errors that occurred during deployment or deployment validation.
  signature: 'deploymentErrors: str'
- uid: azure.mgmt.web.types.KubeEnvironmentProperties.environmentType
  name: environmentType
  summary: 'Type of Kubernetes Environment. Only supported for Container App Environments
    with value as

    Managed.'
  signature: 'environmentType: str'
- uid: azure.mgmt.web.types.KubeEnvironmentProperties.internalLoadBalancerEnabled
  name: internalLoadBalancerEnabled
  summary: Only visible within Vnet/Subnet.
  signature: 'internalLoadBalancerEnabled: bool'
- uid: azure.mgmt.web.types.KubeEnvironmentProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "Waiting", "InitializationInProgress", "InfrastructureSetupInProgress",

    "InfrastructureSetupComplete", "ScheduledForDelete", "UpgradeRequested", and

    "UpgradeFailed".'
  signature: 'provisioningState: str | KubeEnvironmentProvisioningState'
- uid: azure.mgmt.web.types.KubeEnvironmentProperties.staticIp
  name: staticIp
  summary: Static IP of the KubeEnvironment.
  signature: 'staticIp: str'
- uid: azure.mgmt.web.types.KubeEnvironmentProperties.aksResourceID
  name: aksResourceID
  signature: 'aksResourceID: str'
