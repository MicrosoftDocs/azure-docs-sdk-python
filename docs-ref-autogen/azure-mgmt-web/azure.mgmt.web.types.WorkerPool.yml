uid: azure.mgmt.web.types.WorkerPool
name: WorkerPool
fullName: azure.mgmt.web.types.WorkerPool
module: azure.mgmt.web.types
summary: Worker pool of an App Service Environment.
constructor:
  syntax: WorkerPool()
variables:
- description: Worker size ID for referencing this worker pool.
  name: worker_size_id
  types:
  - <xref:int>
- description: 'Shared or dedicated app hosting. Known values are: "Shared", "Dedicated",

    and "Dynamic".'
  name: compute_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ComputeModeOptions">]
- description: VM size of the worker pool instances.
  name: worker_size
  types:
  - <xref:str>
- description: Number of instances in the worker pool.
  name: worker_count
  types:
  - <xref:int>
- description: Names of all instances in the worker pool (read only).
  name: instance_names
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.web.types.WorkerPool.computeMode
  name: computeMode
  summary: '"Shared", "Dedicated", and "Dynamic".'
  signature: 'computeMode: str | ComputeModeOptions'
- uid: azure.mgmt.web.types.WorkerPool.instanceNames
  name: instanceNames
  summary: Names of all instances in the worker pool (read only).
  signature: 'instanceNames: list[str]'
- uid: azure.mgmt.web.types.WorkerPool.workerCount
  name: workerCount
  summary: Number of instances in the worker pool.
  signature: 'workerCount: int'
- uid: azure.mgmt.web.types.WorkerPool.workerSize
  name: workerSize
  summary: VM size of the worker pool instances.
