uid: azure.mgmt.web.types.StaticSiteTemplateOptions
name: StaticSiteTemplateOptions
fullName: azure.mgmt.web.types.StaticSiteTemplateOptions
module: azure.mgmt.web.types
summary: Template Options for the static site.
constructor:
  syntax: StaticSiteTemplateOptions()
variables:
- description: 'URL of the template repository. The newly generated repository

    will be based on this one.'
  name: template_repository_url
  types:
  - <xref:str>
- description: Owner of the newly generated repository.
  name: owner
  types:
  - <xref:str>
- description: Name of the newly generated repository.
  name: repository_name
  types:
  - <xref:str>
- description: Description of the newly generated repository.
  name: description
  types:
  - <xref:str>
- description: 'Whether or not the newly generated repository is a private repository.

    Defaults to false (i.e. public).'
  name: is_private
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.web.types.StaticSiteTemplateOptions.description
  name: description
  summary: Description of the newly generated repository.
  signature: 'description: str'
- uid: azure.mgmt.web.types.StaticSiteTemplateOptions.isPrivate
  name: isPrivate
  summary: 'Whether or not the newly generated repository is a private repository.
    Defaults to false (i.e.

    public).'
  signature: 'isPrivate: bool'
- uid: azure.mgmt.web.types.StaticSiteTemplateOptions.owner
  name: owner
  summary: Owner of the newly generated repository.
  signature: 'owner: str'
- uid: azure.mgmt.web.types.StaticSiteTemplateOptions.repositoryName
  name: repositoryName
  summary: Name of the newly generated repository.
  signature: 'repositoryName: str'
- uid: azure.mgmt.web.types.StaticSiteTemplateOptions.templateRepositoryUrl
  name: templateRepositoryUrl
