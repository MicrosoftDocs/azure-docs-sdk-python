### YamlMime:PythonClass
uid: azure.mgmt.web.types.OutboundVnetRouting
name: OutboundVnetRouting
fullName: azure.mgmt.web.types.OutboundVnetRouting
module: azure.mgmt.web.types
summary: Outbound traffic options over virtual network.
constructor:
  syntax: OutboundVnetRouting()
variables:
- description: 'Enables all other routing options defined in OutboundVnetRouting if
    this

    setting is set to true.'
  name: all_traffic
  types:
  - <xref:bool>
- description: 'This causes all outbound traffic to have Virtual Network Security

    Groups and User Defined Routes applied. Previously called VnetRouteAllEnabled.'
  name: application_traffic
  types:
  - <xref:bool>
- description: 'Enables accessing content over virtual network. Previously called

    VnetContentShareEnabled.'
  name: content_share_traffic
  types:
  - <xref:bool>
- description: 'Enables pulling image over Virtual Network. Previously called

    VnetImagePullEnabled.'
  name: image_pull_traffic
  types:
  - <xref:bool>
- description: 'Enables Backup and Restore operations over virtual network.

    Previously called VnetBackupRestoreEnabled.'
  name: backup_restore_traffic
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.web.types.OutboundVnetRouting.allTraffic
  name: allTraffic
  summary: 'Enables all other routing options defined in OutboundVnetRouting if this
    setting is set to

    true.'
  signature: 'allTraffic: bool'
- uid: azure.mgmt.web.types.OutboundVnetRouting.applicationTraffic
  name: applicationTraffic
  summary: 'This causes all outbound traffic to have Virtual Network Security Groups
    and User Defined

    Routes applied. Previously called VnetRouteAllEnabled.'
  signature: 'applicationTraffic: bool'
- uid: azure.mgmt.web.types.OutboundVnetRouting.backupRestoreTraffic
  name: backupRestoreTraffic
  summary: 'Enables Backup and Restore operations over virtual network. Previously
    called

    VnetBackupRestoreEnabled.'
  signature: 'backupRestoreTraffic: bool'
- uid: azure.mgmt.web.types.OutboundVnetRouting.contentShareTraffic
  name: contentShareTraffic
  summary: Enables accessing content over virtual network. Previously called VnetContentShareEnabled.
  signature: 'contentShareTraffic: bool'
- uid: azure.mgmt.web.types.OutboundVnetRouting.imagePullTraffic
  name: imagePullTraffic
  summary: Enables pulling image over Virtual Network. Previously called VnetImagePullEnabled.
  signature: 'imagePullTraffic: bool'
