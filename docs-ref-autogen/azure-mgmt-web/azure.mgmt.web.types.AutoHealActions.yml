### YamlMime:PythonClass
uid: azure.mgmt.web.types.AutoHealActions
name: AutoHealActions
fullName: azure.mgmt.web.types.AutoHealActions
module: azure.mgmt.web.types
summary: Actions which to take by the auto-heal module when a rule is triggered.
constructor:
  syntax: AutoHealActions()
variables:
- description: 'Predefined action to be taken. Known values are: "Recycle", "LogEvent",
    and

    "CustomAction".'
  name: action_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoHealActionType">]
- description: Custom action to be taken.
  name: custom_action
  types:
  - <xref:<xref:"AutoHealCustomAction">>
- description: 'Minimum time the process must execute before taking the

    action.'
  name: min_process_execution_time
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.web.types.AutoHealActions.actionType
  name: actionType
  summary: '"Recycle", "LogEvent", and

    "CustomAction".'
  signature: 'actionType: str | AutoHealActionType'
- uid: azure.mgmt.web.types.AutoHealActions.customAction
  name: customAction
  summary: Custom action to be taken.
  signature: 'customAction: AutoHealCustomAction'
- uid: azure.mgmt.web.types.AutoHealActions.minProcessExecutionTime
  name: minProcessExecutionTime
  summary: Minimum time the process must execute before taking the action.
  signature: 'minProcessExecutionTime: str'
