### YamlMime:PythonClass
uid: azure.mgmt.web.types.DaprConfig
name: DaprConfig
fullName: azure.mgmt.web.types.DaprConfig
module: azure.mgmt.web.types
summary: App Dapr configuration.
constructor:
  syntax: DaprConfig()
variables:
- description: Boolean indicating if the Dapr side car is enabled.
  name: enabled
  types:
  - <xref:bool>
- description: Dapr application identifier.
  name: app_id
  types:
  - <xref:str>
- description: Tells Dapr which port your application is listening on.
  name: app_port
  types:
  - <xref:int>
- description: 'Dapr max size of http header read buffer in KB to handle when

    sending multi-KB headers. Default is 65KB.'
  name: http_read_buffer_size
  types:
  - <xref:int>
- description: 'Increasing max size of request body http servers parameter in MB

    to handle uploading of big files. Default is 4 MB.'
  name: http_max_request_size
  types:
  - <xref:int>
- description: 'Sets the log level for the Dapr sidecar. Allowed values are debug,
    info, warn,

    error. Default is info. Known values are: "info", "debug", "warn", and "error".'
  name: log_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DaprLogLevel">]
- description: Enables API logging for the Dapr sidecar.
  name: enable_api_logging
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.web.types.DaprConfig.appId
  name: appId
  summary: Dapr application identifier.
  signature: 'appId: str'
- uid: azure.mgmt.web.types.DaprConfig.appPort
  name: appPort
  summary: Tells Dapr which port your application is listening on.
  signature: 'appPort: int'
- uid: azure.mgmt.web.types.DaprConfig.enableApiLogging
  name: enableApiLogging
  summary: Enables API logging for the Dapr sidecar.
  signature: 'enableApiLogging: bool'
- uid: azure.mgmt.web.types.DaprConfig.enabled
  name: enabled
  summary: Boolean indicating if the Dapr side car is enabled.
  signature: 'enabled: bool'
- uid: azure.mgmt.web.types.DaprConfig.httpMaxRequestSize
  name: httpMaxRequestSize
  summary: 'Increasing max size of request body http servers parameter in MB to handle
    uploading of big

    files. Default is 4 MB.'
  signature: 'httpMaxRequestSize: int'
- uid: azure.mgmt.web.types.DaprConfig.httpReadBufferSize
  name: httpReadBufferSize
  summary: 'Dapr max size of http header read buffer in KB to handle when sending
    multi-KB headers. Default

    is 65KB.'
  signature: 'httpReadBufferSize: int'
- uid: azure.mgmt.web.types.DaprConfig.logLevel
  name: logLevel
  summary: 'Sets the log level for the Dapr sidecar. Allowed values are debug, info,
    warn, error. Default

    is info. Known values are: "info", "debug", "warn", and "error".'
  signature: 'logLevel: str | DaprLogLevel'
