uid: azure.mgmt.web.types.InstallScriptSource
name: InstallScriptSource
fullName: azure.mgmt.web.types.InstallScriptSource
module: azure.mgmt.web.types
summary: Object to hold install script reference.
constructor:
  syntax: InstallScriptSource()
variables:
