    "PlatformStorage".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"InstallScriptType">]
attributes:
- uid: azure.mgmt.web.types.InstallScriptSource.sourceUri
  name: sourceUri
  summary: Install script source URI where the install script file will be fetched
    from.
  signature: 'sourceUri: str'
- uid: azure.mgmt.web.types.InstallScriptSource.type
  name: type
  summary: '"RemoteAzureBlob" and "PlatformStorage".'
  signature: 'type: str | InstallScriptType'
