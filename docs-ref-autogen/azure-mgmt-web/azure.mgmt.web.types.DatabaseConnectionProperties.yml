### YamlMime:PythonClass
uid: azure.mgmt.web.types.DatabaseConnectionProperties
name: DatabaseConnectionProperties
fullName: azure.mgmt.web.types.DatabaseConnectionProperties
module: azure.mgmt.web.types
summary: DatabaseConnection resource specific properties.
constructor:
  syntax: DatabaseConnectionProperties()
variables:
- description: The resource id of the database. Required.
  name: resource_id
  types:
  - <xref:str>
- description: 'If present, the identity is used in conjunction with connection

    string to connect to the database. Use of the system-assigned managed identity
    is indicated

    with the string ''SystemAssigned'', while use of a user-assigned managed identity
    is indicated

    with the resource id of the managed identity resource.'
  name: connection_identity
  types:
  - <xref:str>
- description: The connection string to use to connect to the database.
  name: connection_string
  types:
  - <xref:str>
- description: The region of the database resource. Required.
  name: region
  types:
  - <xref:str>
- description: 'A list of configuration files associated with this database

    connection.'
  name: configuration_files
  types:
  - <xref:list>[<xref:"StaticSiteDatabaseConnectionConfigurationFileOverview">]
attributes:
- uid: azure.mgmt.web.types.DatabaseConnectionProperties.configurationFiles
  name: configurationFiles
  summary: A list of configuration files associated with this database connection.
  signature: 'configurationFiles: list[azure.mgmt.web.types.StaticSiteDatabaseConnectionConfigurationFileOverview]'
- uid: azure.mgmt.web.types.DatabaseConnectionProperties.connectionIdentity
  name: connectionIdentity
  summary: 'If present, the identity is used in conjunction with connection string
    to connect to the

    database. Use of the system-assigned managed identity is indicated with the string

    ''SystemAssigned'', while use of a user-assigned managed identity is indicated
    with the resource

    id of the managed identity resource.'
  signature: 'connectionIdentity: str'
- uid: azure.mgmt.web.types.DatabaseConnectionProperties.connectionString
  name: connectionString
  summary: The connection string to use to connect to the database.
  signature: 'connectionString: str'
- uid: azure.mgmt.web.types.DatabaseConnectionProperties.region
  name: region
  summary: The region of the database resource. Required.
  signature: 'region: str'
- uid: azure.mgmt.web.types.DatabaseConnectionProperties.resourceId
  name: resourceId
  summary: The resource id of the database. Required.
  signature: 'resourceId: str'
