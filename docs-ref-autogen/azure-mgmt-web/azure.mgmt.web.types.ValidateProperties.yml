  types:
  - <xref:bool>
- description: '<code>true</code> if App Service plan is for Spot instances; otherwise,

    <code>false</code>.'
  name: is_spot
  types:
  - <xref:bool>
- description: Target capacity of the App Service plan (number of VMs).
  name: capacity
  types:
  - <xref:int>
- description: 'Name of App Service Environment where app or App Service plan should

