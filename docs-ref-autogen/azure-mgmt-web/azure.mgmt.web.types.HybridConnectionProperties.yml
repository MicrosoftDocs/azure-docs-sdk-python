### YamlMime:PythonClass
uid: azure.mgmt.web.types.HybridConnectionProperties
name: HybridConnectionProperties
fullName: azure.mgmt.web.types.HybridConnectionProperties
module: azure.mgmt.web.types
summary: HybridConnection resource specific properties.
constructor:
  syntax: HybridConnectionProperties()
variables:
- description: The name of the Service Bus namespace.
  name: service_bus_namespace
  types:
  - <xref:str>
- description: The name of the Service Bus relay.
  name: relay_name
  types:
  - <xref:str>
- description: The ARM URI to the Service Bus relay.
  name: relay_arm_uri
  types:
  - <xref:str>
- description: The hostname of the endpoint.
  name: hostname
  types:
  - <xref:str>
- description: The port of the endpoint.
  name: port
  types:
  - <xref:int>
- description: 'The name of the Service Bus key which has Send permissions. This is
    used

    to authenticate to Service Bus.'
  name: send_key_name
  types:
  - <xref:str>
- description: 'The value of the Service Bus key. This is used to authenticate to
    Service

    Bus. In ARM this key will not be returned normally, use the POST /listKeys API
    instead.'
  name: send_key_value
  types:
  - <xref:str>
- description: 'The suffix for the service bus endpoint. By default this is

    .servicebus.windows.net.'
  name: service_bus_suffix
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.web.types.HybridConnectionProperties.hostname
  name: hostname
  summary: The hostname of the endpoint.
  signature: 'hostname: str'
- uid: azure.mgmt.web.types.HybridConnectionProperties.port
  name: port
  summary: The port of the endpoint.
  signature: 'port: int'
- uid: azure.mgmt.web.types.HybridConnectionProperties.relayArmUri
  name: relayArmUri
  summary: The ARM URI to the Service Bus relay.
  signature: 'relayArmUri: str'
- uid: azure.mgmt.web.types.HybridConnectionProperties.relayName
  name: relayName
  summary: The name of the Service Bus relay.
  signature: 'relayName: str'
- uid: azure.mgmt.web.types.HybridConnectionProperties.sendKeyName
  name: sendKeyName
  summary: 'The name of the Service Bus key which has Send permissions. This is used
    to authenticate to

    Service Bus.'
  signature: 'sendKeyName: str'
- uid: azure.mgmt.web.types.HybridConnectionProperties.sendKeyValue
  name: sendKeyValue
  summary: 'The value of the Service Bus key. This is used to authenticate to Service
    Bus. In ARM this key

    will not be returned normally, use the POST /listKeys API instead.'
  signature: 'sendKeyValue: str'
- uid: azure.mgmt.web.types.HybridConnectionProperties.serviceBusNamespace
  name: serviceBusNamespace
  summary: The name of the Service Bus namespace.
  signature: 'serviceBusNamespace: str'
- uid: azure.mgmt.web.types.HybridConnectionProperties.serviceBusSuffix
  name: serviceBusSuffix
  summary: The suffix for the service bus endpoint. By default this is .servicebus.windows.net.
  signature: 'serviceBusSuffix: str'
