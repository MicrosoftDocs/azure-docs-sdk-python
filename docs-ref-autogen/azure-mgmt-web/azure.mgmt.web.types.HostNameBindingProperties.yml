### YamlMime:PythonClass
uid: azure.mgmt.web.types.HostNameBindingProperties
name: HostNameBindingProperties
fullName: azure.mgmt.web.types.HostNameBindingProperties
module: azure.mgmt.web.types
summary: HostNameBinding resource specific properties.
constructor:
  syntax: HostNameBindingProperties()
variables:
- description: App Service app name.
  name: site_name
  types:
  - <xref:str>
- description: Fully qualified ARM domain resource URI.
  name: domain_id
  types:
  - <xref:str>
- description: Azure resource name.
  name: azure_resource_name
  types:
  - <xref:str>
- description: 'Azure resource type. Known values are: "Website" and

    "TrafficManager".'
  name: azure_resource_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureResourceType">]
- description: 'Custom DNS record type. Known values are: "CName" and

    "A".'
  name: custom_host_name_dns_record_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CustomHostNameDnsRecordType">]
- description: 'Hostname type. Known values are: "Verified" and "Managed".'
  name: host_name_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HostNameType">]
- description: 'SSL type. Known values are: "Disabled", "SniEnabled", and "IpBasedEnabled".'
  name: ssl_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SslState">]
- description: SSL certificate thumbprint.
  name: thumbprint
  types:
  - <xref:str>
- description: Virtual IP address assigned to the hostname if IP based SSL is enabled.
  name: virtual_ip
  types:
  - <xref:str>
