    <code>false</code> to enable continuous integration (which configures webhooks
    into online

    repos like GitHub).'
  name: is_manual_integration
  types:
  - <xref:bool>
- description: <code>true</code> if this is deployed via GitHub action.
  name: is_git_hub_action
  types:
  - <xref:bool>
- description: '<code>true</code> to enable deployment rollback; otherwise,

    <code>false</code>.'
  name: deployment_rollback_enabled
  types:
  - <xref:bool>
- description: '<code>true</code> for a Mercurial repository; <code>false</code> for
    a Git

    repository.'
  name: is_mercurial
  types:
  - <xref:bool>
- description: 'If GitHub Action is selected, than the associated

    configuration.'
