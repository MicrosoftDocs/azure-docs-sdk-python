### YamlMime:PythonClass
uid: azure.mgmt.web.types.AuthPlatform
name: AuthPlatform
fullName: azure.mgmt.web.types.AuthPlatform
module: azure.mgmt.web.types
summary: The configuration settings of the platform of App Service Authentication/Authorization.
constructor:
  syntax: AuthPlatform()
variables:
- description: '<code>true</code> if the Authentication / Authorization feature is
    enabled for

    the current app; otherwise, <code>false</code>.'
  name: enabled
  types:
  - <xref:bool>
- description: 'The RuntimeVersion of the Authentication / Authorization feature in
    use

    for the current app. The setting in this value can control the behavior of certain
    features in

    the Authentication / Authorization module.'
  name: runtime_version
  types:
  - <xref:str>
- description: 'The path of the config file containing auth settings if they come
    from

    a file. If the path is relative, base will the site''s root directory.'
  name: config_file_path
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.web.types.AuthPlatform.configFilePath
  name: configFilePath
  summary: 'The path of the config file containing auth settings if they come from
    a file. If the path is

    relative, base will the site''s root directory.'
  signature: 'configFilePath: str'
- uid: azure.mgmt.web.types.AuthPlatform.enabled
  name: enabled
  summary: '<code>true</code> if the Authentication / Authorization feature is enabled
    for the current app;

    otherwise, <code>false</code>.'
  signature: 'enabled: bool'
- uid: azure.mgmt.web.types.AuthPlatform.runtimeVersion
  name: runtimeVersion
  summary: 'The RuntimeVersion of the Authentication / Authorization feature in use
    for the current app.

    The setting in this value can control the behavior of certain features in the
    Authentication /

    Authorization module.'
  signature: 'runtimeVersion: str'
