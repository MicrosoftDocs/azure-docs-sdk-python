### YamlMime:PythonClass
uid: azure.mgmt.web.types.SiteProperties
name: SiteProperties
fullName: azure.mgmt.web.types.SiteProperties
module: azure.mgmt.web.types
summary: Site resource specific properties.
constructor:
  syntax: SiteProperties()
variables:
- description: Current state of the app.
  name: state
  types:
  - <xref:str>
- description: Hostnames associated with the app.
  name: host_names
  types:
  - <xref:list>[<xref:str>]
- description: Name of the repository site.
  name: repository_site_name
  types:
  - <xref:str>
- description: 'State indicating whether the app has exceeded its quota usage. Read-only.

    Known values are: "Normal" and "Exceeded".'
  name: usage_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UsageState">]
- description: '<code>true</code> if the app is enabled; otherwise, <code>false</code>.
    Setting

    this value to false disables the app (takes the app offline).'
  name: enabled
  types:
  - <xref:bool>
- description: 'Enabled hostnames for the app.Hostnames need to be assigned (see

    HostNames) AND enabled. Otherwise, the app is not served on those hostnames.'
  name: enabled_host_names
  types:
  - <xref:list>[<xref:str>]
- description: 'Management information availability state for the app. Known values

    are: "Normal", "Limited", and "DisasterRecoveryMode".'
  name: availability_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SiteAvailabilityState">]
- description: 'Hostname SSL states are used to manage the SSL bindings for app''s

    hostnames.'
  name: host_name_ssl_states
  types:
  - <xref:list>[<xref:"HostNameSslState">]
- description: 'Resource ID of the associated App Service plan, formatted as:

    "/subscriptions/{subscriptionID}/resourceGroups/{groupName}/providers/Microsoft.Web/serverfarms/{appServicePlanName}".'
  name: server_farm_id
  types:
  - <xref:str>
- description: <code>true</code> if reserved; otherwise, <code>false</code>.
  name: reserved
  types:
  - <xref:bool>
- description: 'Obsolete: Hyper-V sandbox.'
  name: is_xenon
  types:
  - <xref:bool>
- description: Hyper-V sandbox.
  name: hyper_v
  types:
  - <xref:bool>
- description: Last time the app was modified, in UTC. Read-only.
  name: last_modified_time_utc
  types:
  - <xref:str>
- description: Property to configure various DNS related settings for a site.
  name: dns_configuration
  types:
  - <xref:<xref:"SiteDnsConfig">>
- description: 'Property to configure various outbound traffic routing options

    over virtual network for a site.'
  name: outbound_vnet_routing
  types:
  - <xref:<xref:"OutboundVnetRouting">>
- description: 'Configuration of an App Service app. This property is not returned
    in

    response to normal create and read requests since it may contain sensitive information.'
  name: site_config
  types:
  - <xref:<xref:"SiteConfig">>
- description: Configuration specific of the Azure Function app.
  name: function_app_config
  types:
  - <xref:<xref:"FunctionAppConfig">>
- description: Dapr configuration of the app.
  name: dapr_config
  types:
  - <xref:<xref:"DaprConfig">>
- description: Workload profile name for function app to execute on.
  name: workload_profile_name
  types:
  - <xref:str>
- description: Function app resource requirements.
  name: resource_config
  types:
  - <xref:<xref:"ResourceConfig">>
- description: 'Azure Traffic Manager hostnames associated with the app.

    Read-only.'
  name: traffic_manager_host_names
  types:
  - <xref:list>[<xref:str>]
- description: '<code>true</code> to stop SCM (KUDU) site when the app is stopped;

    otherwise, <code>false</code>. The default is <code>false</code>.'
  name: scm_site_also_stopped
  types:
  - <xref:bool>
- description: Specifies which deployment slot this app will swap into. Read-only.
  name: target_swap_slot
  types:
  - <xref:str>
- description: App Service Environment to use for the app.
  name: hosting_environment_profile
  types:
  - <xref:<xref:"HostingEnvironmentProfile">>
- description: '<code>true</code> to enable client affinity; <code>false</code>

    to stop sending session affinity cookies, which route client requests in the same
    session to

    the same instance. Default is <code>true</code>.'
  name: client_affinity_enabled
  types:
  - <xref:bool>
- description: '<code>true</code> to enable client affinity

    partitioning using CHIPS cookies, this will add the <code>partitioned</code> property
    to the

    affinity cookies; <code>false</code> to stop sending partitioned affinity cookies.
    Default is

    <code>false</code>.'
  name: client_affinity_partitioning_enabled
  types:
  - <xref:bool>
- description: '<code>true</code> to override client affinity cookie

    domain with X-Forwarded-Host request header. <code>false</code> to use default
    domain. Default

    is <code>false</code>.'
  name: client_affinity_proxy_enabled
  types:
  - <xref:bool>
- description: '<code>true</code> to enable client certificate authentication (TLS

    mutual authentication); otherwise, <code>false</code>. Default is <code>false</code>.'
  name: client_cert_enabled
  types:
  - <xref:bool>
- description: "This composes with ClientCertEnabled setting.\n\n* ClientCertEnabled:\
    \ false means ClientCert is ignored. \n\n* ClientCertEnabled: true and ClientCertMode:\
    \ Required means ClientCert is required. \n\n* ClientCertEnabled: true and ClientCertMode:\
    \ Optional means ClientCert is optional or accepted. Known values are: \"Required\"\
    , \"Optional\", and \"OptionalInteractiveUser\"."
  name: client_cert_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ClientCertMode">]
- description: 'client certificate authentication comma-separated exclusion

    paths.'
  name: client_cert_exclusion_paths
  types:
  - <xref:str>
- description: 'Specifies the IP mode of the app. Known values are: "IPv4", "IPv6",
    and

    "IPv4AndIPv6".'
  name: ip_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IPMode">]
- description: 'Whether to use end to end encryption between the FrontEnd

    and the Worker.'
  name: end_to_end_encryption_enabled
  types:
  - <xref:bool>
- description: Whether to enable ssh access.
  name: ssh_enabled
  types:
  - <xref:bool>
- description: '<code>true</code> to disable the public hostnames of the app;

    otherwise, <code>false</code>. If <code>true</code>, the app is only accessible
    via API

    management process.'
  name: host_names_disabled
  types:
  - <xref:bool>
- description: 'Unique identifier that verifies the custom domains

    assigned to the app. Customer will add this id to a txt record for verification.'
  name: custom_domain_verification_id
  types:
  - <xref:str>
- description: 'List of IP addresses that the app uses for outbound connections

    (e.g. database access). Includes VIPs from tenants that site can be hosted with
    current

    settings. Read-only.'
  name: outbound_ip_addresses
  types:
  - <xref:str>
- description: 'List of IP addresses that the app uses for outbound

    connections (e.g. database access). Includes VIPs from all tenants except dataComponent.

    Read-only.'
  name: possible_outbound_ip_addresses
  types:
  - <xref:str>
- description: Size of the function container.
  name: container_size
  types:
  - <xref:int>
- description: 'Maximum allowed daily memory-time quota (applicable on dynamic

    apps only).'
  name: daily_memory_time_quota
  types:
  - <xref:int>
- description: App suspended till in case memory-time quota is exceeded.
  name: suspended_till
  types:
  - <xref:str>
- description: 'Maximum number of workers. This only applies to Functions

    container.'
  name: max_number_of_workers
  types:
  - <xref:int>
- description: If specified during app creation, the app is cloned from a source app.
  name: cloning_info
  types:
  - <xref:<xref:"CloningInfo">>
- description: Name of the resource group the app belongs to. Read-only.
  name: resource_group
  types:
  - <xref:str>
- description: '<code>true</code> if the app is a default container; otherwise,

    <code>false</code>.'
  name: is_default_container
  types:
  - <xref:bool>
- description: Default hostname of the app. Read-only.
  name: default_host_name
  types:
  - <xref:str>
- description: Status of the last deployment slot swap operation.
  name: slot_swap_status
  types:
  - <xref:<xref:"SlotSwapStatus">>
- description: 'HttpsOnly: configures a web site to accept only https requests. Issues

    redirect for http requests.'
  name: https_only
  types:
  - <xref:bool>
- description: 'Site redundancy mode. Known values are: "None", "Manual", "Failover",

    "ActiveActive", and "GeoRedundant".'
  name: redundancy_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RedundancyMode">]
- description: Specifies an operation id if this site has a pending operation.
  name: in_progress_operation_id
  types:
  - <xref:str>
- description: 'Property to allow or block all public traffic. Allowed Values:

    ''Enabled'', ''Disabled'' or an empty string.'
  name: public_network_access
  types:
  - <xref:str>
- description: Checks if Customer provided storage account is required.
  name: storage_account_required
  types:
  - <xref:bool>
- description: Identity to use for Key Vault Reference authentication.
  name: key_vault_reference_identity
  types:
  - <xref:str>
- description: 'Specifies the scope of uniqueness for the default

    hostname during resource creation. Known values are: "TenantReuse", "SubscriptionReuse",

    "ResourceGroupReuse", and "NoReuse".'
  name: auto_generated_domain_name_label_scope
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AutoGeneratedDomainNameLabelScope">]
- description: 'Azure Resource Manager ID of the Virtual network and subnet to

    be joined by Regional VNET Integration. This must be of the form

    /subscriptions/{subscriptionName}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/virtualNetworks/{vnetName}/subnets/{subnetName}.'
  name: virtual_network_subnet_id
  types:
  - <xref:str>
- description: 'Azure Resource Manager ID of the customer''s selected Managed

    Environment on which to host this app. This must be of the form

    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.App/managedEnvironments/{managedEnvironmentName}.'
  name: managed_environment_id
  types:
  - <xref:str>
- description: 'Current SKU of application based on associated App Service Plan. Some
    valid SKU

    values are Free, Shared, Basic, Dynamic, FlexConsumption, Standard, Premium, PremiumV2,

    PremiumV3, Isolated, IsolatedV2.'
  name: sku
  types:
  - <xref:str>
