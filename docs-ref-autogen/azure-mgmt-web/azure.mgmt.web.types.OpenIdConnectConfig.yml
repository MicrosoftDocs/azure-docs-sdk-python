### YamlMime:PythonClass
uid: azure.mgmt.web.types.OpenIdConnectConfig
name: OpenIdConnectConfig
fullName: azure.mgmt.web.types.OpenIdConnectConfig
module: azure.mgmt.web.types
summary: The configuration settings of the endpoints used for the custom Open ID Connect
  provider.
constructor:
  syntax: OpenIdConnectConfig()
variables:
- description: The endpoint to be used to make an authorization request.
  name: authorization_endpoint
  types:
  - <xref:str>
- description: The endpoint to be used to request a token.
  name: token_endpoint
  types:
  - <xref:str>
- description: The endpoint that issues the token.
  name: issuer
  types:
  - <xref:str>
- description: The endpoint that provides the keys necessary to validate the token.
  name: certification_uri
  types:
  - <xref:str>
- description: 'The endpoint that contains all the configuration

    endpoints for the provider.'
  name: well_known_open_id_configuration
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.web.types.OpenIdConnectConfig.authorizationEndpoint
  name: authorizationEndpoint
  summary: The endpoint to be used to make an authorization request.
  signature: 'authorizationEndpoint: str'
- uid: azure.mgmt.web.types.OpenIdConnectConfig.certificationUri
  name: certificationUri
  summary: The endpoint that provides the keys necessary to validate the token.
  signature: 'certificationUri: str'
- uid: azure.mgmt.web.types.OpenIdConnectConfig.issuer
  name: issuer
  summary: The endpoint that issues the token.
  signature: 'issuer: str'
- uid: azure.mgmt.web.types.OpenIdConnectConfig.tokenEndpoint
  name: tokenEndpoint
  summary: The endpoint to be used to request a token.
  signature: 'tokenEndpoint: str'
- uid: azure.mgmt.web.types.OpenIdConnectConfig.wellKnownOpenIdConfiguration
  name: wellKnownOpenIdConfiguration
  summary: The endpoint that contains all the configuration endpoints for the provider.
  signature: 'wellKnownOpenIdConfiguration: str'
