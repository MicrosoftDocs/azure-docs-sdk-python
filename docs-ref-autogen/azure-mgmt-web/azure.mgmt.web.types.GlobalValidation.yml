### YamlMime:PythonClass
uid: azure.mgmt.web.types.GlobalValidation
name: GlobalValidation
fullName: azure.mgmt.web.types.GlobalValidation
module: azure.mgmt.web.types
summary: 'The configuration settings that determines the validation flow of users
  using App Service

  Authentication/Authorization.'
constructor:
  syntax: GlobalValidation()
variables:
- description: '<code>true</code> if the authentication flow is required any

    request is made; otherwise, <code>false</code>.'
  name: require_authentication
  types:
  - <xref:bool>
- description: 'The action to take when an unauthenticated client attempts

    to access the app. Known values are: "RedirectToLoginPage", "AllowAnonymous",
    "Return401", and

    "Return403".'
  name: unauthenticated_client_action
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UnauthenticatedClientActionV2">]
- description: 'The default authentication provider to use when multiple providers

    are configured. This setting is only needed if multiple providers are configured
    and the

    unauthenticated client action is set to "RedirectToLoginPage".'
  name: redirect_to_provider
  types:
  - <xref:str>
- description: 'The paths for which unauthenticated flow would not be redirected to
    the

    login page.'
  name: excluded_paths
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.web.types.GlobalValidation.excludedPaths
  name: excludedPaths
  summary: The paths for which unauthenticated flow would not be redirected to the
    login page.
  signature: 'excludedPaths: list[str]'
- uid: azure.mgmt.web.types.GlobalValidation.redirectToProvider
  name: redirectToProvider
  summary: 'The default authentication provider to use when multiple providers are
    configured. This setting

    is only needed if multiple providers are configured and the unauthenticated client
    action is

    set to "RedirectToLoginPage".'
  signature: 'redirectToProvider: str'
- uid: azure.mgmt.web.types.GlobalValidation.requireAuthentication
  name: requireAuthentication
  summary: '<code>true</code> if the authentication flow is required any request is
    made; otherwise,

    <code>false</code>.'
  signature: 'requireAuthentication: bool'
- uid: azure.mgmt.web.types.GlobalValidation.unauthenticatedClientAction
  name: unauthenticatedClientAction
  summary: 'The action to take when an unauthenticated client attempts to access the
    app. Known values are:

    "RedirectToLoginPage", "AllowAnonymous", "Return401", and "Return403".'
  signature: 'unauthenticatedClientAction: str | UnauthenticatedClientActionV2'
