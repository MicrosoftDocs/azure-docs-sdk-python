uid: azure.mgmt.web.types.ForwardProxy
name: ForwardProxy
fullName: azure.mgmt.web.types.ForwardProxy
module: azure.mgmt.web.types
summary: The configuration settings of a forward proxy used to make the requests.
constructor:
  syntax: ForwardProxy()
variables:
- description: 'The convention used to determine the url of the request made. Known
    values

    are: "NoProxy", "Standard", and "Custom".'
  name: convention
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ForwardProxyConvention">]
- description: The name of the header containing the host of the request.
  name: custom_host_header_name
  types:
  - <xref:str>
- description: The name of the header containing the scheme of the request.
  name: custom_proto_header_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.web.types.ForwardProxy.convention
  name: convention
  summary: '"NoProxy",

    "Standard", and "Custom".'
  signature: 'convention: str | ForwardProxyConvention'
- uid: azure.mgmt.web.types.ForwardProxy.customHostHeaderName
  name: customHostHeaderName
  summary: The name of the header containing the host of the request.
  signature: 'customHostHeaderName: str'
- uid: azure.mgmt.web.types.ForwardProxy.customProtoHeaderName
  name: customProtoHeaderName
  summary: The name of the header containing the scheme of the request.
  signature: 'customProtoHeaderName: str'
