uid: azure.mgmt.web.types.HostNameSslState
name: HostNameSslState
fullName: azure.mgmt.web.types.HostNameSslState
module: azure.mgmt.web.types
summary: SSL-enabled hostname.
constructor:
  syntax: HostNameSslState()
variables:
- description: Hostname.
  name: name
  types:
  - <xref:str>
- description: 'SSL type. Known values are: "Disabled", "SniEnabled", and "IpBasedEnabled".'
  name: ssl_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SslState">]
- description: Virtual IP address assigned to the hostname if IP based SSL is enabled.
  name: virtual_ip
  types:
  - <xref:str>
- description: SSL certificate thumbprint.
  name: thumbprint
  types:
  - <xref:str>
- description: Set to <code>true</code> to update existing hostname.
  name: to_update
  types:
  - <xref:bool>
- description: 'Indicates whether the hostname is a standard or repository hostname.
    Known

    values are: "Standard" and "Repository".'
  name: host_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HostType">]
attributes:
- uid: azure.mgmt.web.types.HostNameSslState.hostType
  name: hostType
  summary: 'Indicates whether the hostname is a standard or repository hostname. Known
    values are:

    "Standard" and "Repository".'
  signature: 'hostType: str | HostType'
