### YamlMime:PythonClass
uid: azure.mgmt.web.types.SlotConfigNames
name: SlotConfigNames
fullName: azure.mgmt.web.types.SlotConfigNames
module: azure.mgmt.web.types
summary: 'Names for connection strings, application settings, and external Azure storage
  account

  configuration identifiers to be marked as sticky to the deployment slot and not
  moved during a

  swap operation. This is valid for all deployment slots in an app.'
constructor:
  syntax: SlotConfigNames()
variables:
- description: List of connection string names.
  name: connection_string_names
  types:
  - <xref:list>[<xref:str>]
- description: List of application settings names.
  name: app_setting_names
  types:
  - <xref:list>[<xref:str>]
- description: List of external Azure storage account identifiers.
  name: azure_storage_config_names
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.web.types.SlotConfigNames.appSettingNames
  name: appSettingNames
  summary: List of application settings names.
  signature: 'appSettingNames: list[str]'
- uid: azure.mgmt.web.types.SlotConfigNames.azureStorageConfigNames
  name: azureStorageConfigNames
  summary: List of external Azure storage account identifiers.
  signature: 'azureStorageConfigNames: list[str]'
- uid: azure.mgmt.web.types.SlotConfigNames.connectionStringNames
  name: connectionStringNames
  summary: List of connection string names.
  signature: 'connectionStringNames: list[str]'
