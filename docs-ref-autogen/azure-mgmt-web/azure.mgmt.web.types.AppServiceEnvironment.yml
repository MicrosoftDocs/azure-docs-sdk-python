### YamlMime:PythonClass
uid: azure.mgmt.web.types.AppServiceEnvironment
name: AppServiceEnvironment
fullName: azure.mgmt.web.types.AppServiceEnvironment
module: azure.mgmt.web.types
summary: Description of an App Service Environment.
constructor:
  syntax: AppServiceEnvironment()
variables:
- description: 'Provisioning state of the App Service Environment. Known values are:

    "Succeeded", "Failed", "Canceled", "InProgress", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Current status of the App Service Environment. Known values are: "Preparing",

    "Ready", "Scaling", and "Deleting".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HostingEnvironmentStatus">]
- description: Description of the Virtual Network. Required.
  name: virtual_network
  types:
  - <xref:<xref:"VirtualNetworkProfile">>
- description: 'Specifies which endpoints to serve internally in the

    Virtual Network for the App Service Environment. Known values are: "None", "Web",
    "Publishing",

    and "Web, Publishing".'
  name: internal_load_balancing_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LoadBalancingMode">]
- description: Front-end VM size, e.g. "Medium", "Large".
  name: multi_size
  types:
  - <xref:str>
- description: Number of front-end instances.
  name: multi_role_count
  types:
  - <xref:int>
- description: Number of IP SSL addresses reserved for the App Service Environment.
  name: ipssl_address_count
  types:
  - <xref:int>
- description: DNS suffix of the App Service Environment.
  name: dns_suffix
  types:
  - <xref:str>
- description: Maximum number of VMs in the App Service Environment.
  name: maximum_number_of_machines
  types:
  - <xref:int>
- description: Scale factor for front-ends.
  name: front_end_scale_factor
  types:
  - <xref:int>
- description: '<code>true</code> if the App Service Environment is suspended; otherwise,

    <code>false</code>. The environment can be suspended, e.g. when the management
    endpoint is no

    longer available (most likely because NSG blocked the incoming traffic).'
  name: suspended
  types:
  - <xref:bool>
- description: 'Custom settings for changing the behavior of the App Service

    Environment.'
  name: cluster_settings
  types:
  - <xref:list>[<xref:"NameValuePair">]
- description: User added ip ranges to whitelist on ASE db.
  name: user_whitelisted_ip_ranges
  types:
  - <xref:list>[<xref:str>]
- description: Flag that displays whether an ASE has linux workers or not.
  name: has_linux_workers
  types:
  - <xref:bool>
- description: 'Upgrade Preference. Known values are: "None", "Early", "Late", and

    "Manual".'
  name: upgrade_preference
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UpgradePreference">]
- description: Dedicated Host Count.
  name: dedicated_host_count
  types:
  - <xref:int>
- description: Whether or not this App Service Environment is zone-redundant.
  name: zone_redundant
  types:
  - <xref:bool>
- description: 'Full view of the custom domain suffix configuration for

    ASEv3.'
  name: custom_dns_suffix_configuration
  types:
  - <xref:<xref:"CustomDnsSuffixConfiguration">>
- description: Full view of networking configuration for an ASE.
  name: networking_configuration
  types:
  - <xref:<xref:"AseV3NetworkingConfiguration">>
- description: 'Whether an upgrade is available for this App Service Environment.

    Known values are: "None" and "Ready".'
  name: upgrade_availability
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UpgradeAvailability">]
attributes:
- uid: azure.mgmt.web.types.AppServiceEnvironment.clusterSettings
  name: clusterSettings
  summary: Custom settings for changing the behavior of the App Service Environment.
  signature: 'clusterSettings: list[''NameValuePair'']'
- uid: azure.mgmt.web.types.AppServiceEnvironment.customDnsSuffixConfiguration
  name: customDnsSuffixConfiguration
  summary: Full view of the custom domain suffix configuration for ASEv3.
  signature: 'customDnsSuffixConfiguration: CustomDnsSuffixConfiguration'
- uid: azure.mgmt.web.types.AppServiceEnvironment.dedicatedHostCount
  name: dedicatedHostCount
  summary: Dedicated Host Count.
  signature: 'dedicatedHostCount: int'
- uid: azure.mgmt.web.types.AppServiceEnvironment.dnsSuffix
  name: dnsSuffix
  summary: DNS suffix of the App Service Environment.
  signature: 'dnsSuffix: str'
- uid: azure.mgmt.web.types.AppServiceEnvironment.frontEndScaleFactor
  name: frontEndScaleFactor
  summary: Scale factor for front-ends.
  signature: 'frontEndScaleFactor: int'
- uid: azure.mgmt.web.types.AppServiceEnvironment.hasLinuxWorkers
  name: hasLinuxWorkers
  summary: Flag that displays whether an ASE has linux workers or not.
  signature: 'hasLinuxWorkers: bool'
- uid: azure.mgmt.web.types.AppServiceEnvironment.internalLoadBalancingMode
  name: internalLoadBalancingMode
  summary: 'Specifies which endpoints to serve internally in the Virtual Network for
    the App Service

    Environment. Known values are: "None", "Web", "Publishing", and "Web, Publishing".'
  signature: 'internalLoadBalancingMode: str | LoadBalancingMode'
- uid: azure.mgmt.web.types.AppServiceEnvironment.ipsslAddressCount
  name: ipsslAddressCount
  summary: Number of IP SSL addresses reserved for the App Service Environment.
  signature: 'ipsslAddressCount: int'
- uid: azure.mgmt.web.types.AppServiceEnvironment.maximumNumberOfMachines
  name: maximumNumberOfMachines
  summary: Maximum number of VMs in the App Service Environment.
  signature: 'maximumNumberOfMachines: int'
- uid: azure.mgmt.web.types.AppServiceEnvironment.multiRoleCount
  name: multiRoleCount
  summary: Number of front-end instances.
  signature: 'multiRoleCount: int'
- uid: azure.mgmt.web.types.AppServiceEnvironment.multiSize
  name: multiSize
  summary: Front-end VM size, e.g. "Medium", "Large".
  signature: 'multiSize: str'
- uid: azure.mgmt.web.types.AppServiceEnvironment.networkingConfiguration
  name: networkingConfiguration
  summary: Full view of networking configuration for an ASE.
  signature: 'networkingConfiguration: AseV3NetworkingConfiguration'
- uid: azure.mgmt.web.types.AppServiceEnvironment.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Failed",

    "Canceled", "InProgress", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.web.types.AppServiceEnvironment.status
  name: status
  summary: '"Preparing", "Ready",

    "Scaling", and "Deleting".'
  signature: 'status: str | HostingEnvironmentStatus'
- uid: azure.mgmt.web.types.AppServiceEnvironment.suspended
  name: suspended
  summary: '<code>true</code> if the App Service Environment is suspended; otherwise,
    <code>false</code>.

    The environment can be suspended, e.g. when the management endpoint is no longer
    available

    (most likely because NSG blocked the incoming traffic).'
  signature: 'suspended: bool'
- uid: azure.mgmt.web.types.AppServiceEnvironment.upgradeAvailability
  name: upgradeAvailability
  summary: '"None"

    and "Ready".'
  signature: 'upgradeAvailability: str | UpgradeAvailability'
- uid: azure.mgmt.web.types.AppServiceEnvironment.upgradePreference
  name: upgradePreference
  summary: '"None", "Early", "Late", and "Manual".'
  signature: 'upgradePreference: str | UpgradePreference'
- uid: azure.mgmt.web.types.AppServiceEnvironment.userWhitelistedIpRanges
  name: userWhitelistedIpRanges
  summary: User added ip ranges to whitelist on ASE db.
  signature: 'userWhitelistedIpRanges: list[str]'
- uid: azure.mgmt.web.types.AppServiceEnvironment.virtualNetwork
  name: virtualNetwork
  summary: Description of the Virtual Network. Required.
  signature: 'virtualNetwork: Required[VirtualNetworkProfile]'
- uid: azure.mgmt.web.types.AppServiceEnvironment.zoneRedundant
  name: zoneRedundant
  summary: Whether or not this App Service Environment is zone-redundant.
  signature: 'zoneRedundant: bool'
