  name: target_worker_size_id
  types:
  - <xref:int>
- description: 'Provisioning state of the App Service Plan. Known values are:

    "Succeeded", "Failed", "Canceled", "InProgress", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Specification for the Kubernetes Environment to use for the App

    Service plan.'
  name: kube_environment_profile
  types:
  - <xref:<xref:"KubeEnvironmentProfile">>
- description: 'If <code>true</code>, this App Service Plan will perform availability

    zone balancing. If <code>false</code>, this App Service Plan will not perform
    availability zone

    balancing.'
  name: zone_redundant
  types:
  - <xref:bool>
