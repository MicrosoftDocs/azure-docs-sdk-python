  - <xref:bool>
- description: 'Obsolete: If Hyper-V container app service plan <code>true</code>,

    <code>false</code> otherwise.'
  name: is_xenon
  types:
  - <xref:bool>
- description: 'If Hyper-V container app service plan <code>true</code>, <code>false</code>

    otherwise.'
  name: hyper_v
  types:
  - <xref:bool>
- description: Scaling worker count.
  name: target_worker_count
  types:
  - <xref:int>
