uid: azure.mgmt.web.types.TokenStore
name: TokenStore
fullName: azure.mgmt.web.types.TokenStore
module: azure.mgmt.web.types
summary: The configuration settings of the token store.
constructor:
  syntax: TokenStore()
variables:
- description: '<code>true</code> to durably store platform-specific security tokens
    that are

    obtained during login flows; otherwise, <code>false</code>. The default is <code>false</code>.'
  name: enabled
  types:
  - <xref:bool>
- description: 'The number of hours after session token expiration that a

    session token can be used to call the token refresh API. The default is 72 hours.'
  name: token_refresh_extension_hours
  types:
  - <xref:float>
- description: 'The configuration settings of the storage of the tokens if a file
    system is

    used.'
  name: file_system
  types:
  - <xref:<xref:"FileSystemTokenStore">>
- description: 'The configuration settings of the storage of the tokens if blob

    storage is used.'
  name: azure_blob_storage
  types:
  - <xref:<xref:"BlobStorageTokenStore">>
attributes:
- uid: azure.mgmt.web.types.TokenStore.azureBlobStorage
  name: azureBlobStorage
  summary: The configuration settings of the storage of the tokens if blob storage
    is used.
  signature: 'azureBlobStorage: BlobStorageTokenStore'
- uid: azure.mgmt.web.types.TokenStore.enabled
  name: enabled
  summary: '<code>true</code> to durably store platform-specific security tokens that
    are obtained during

    login flows; otherwise, <code>false</code>. The default is <code>false</code>.'
  signature: 'enabled: bool'
- uid: azure.mgmt.web.types.TokenStore.fileSystem
  name: fileSystem
  summary: The configuration settings of the storage of the tokens if a file system
