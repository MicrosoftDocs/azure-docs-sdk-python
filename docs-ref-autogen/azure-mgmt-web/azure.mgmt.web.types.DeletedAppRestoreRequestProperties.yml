### YamlMime:PythonClass
uid: azure.mgmt.web.types.DeletedAppRestoreRequestProperties
name: DeletedAppRestoreRequestProperties
fullName: azure.mgmt.web.types.DeletedAppRestoreRequestProperties
module: azure.mgmt.web.types
summary: DeletedAppRestoreRequest resource specific properties.
constructor:
  syntax: DeletedAppRestoreRequestProperties()
variables:
- description: 'ARM resource ID of the deleted app. Example:

    /subscriptions/{subId}/providers/Microsoft.Web/deletedSites/{deletedSiteId}.'
  name: deleted_site_id
  types:
  - <xref:str>
- description: 'If true, deleted site configuration, in addition to content, will

    be restored.'
  name: recover_configuration
  types:
  - <xref:bool>
- description: 'Point in time to restore the deleted app from, formatted as a DateTime

    string. If unspecified, default value is the time that the app was deleted.'
  name: snapshot_time
  types:
  - <xref:str>
- description: If true, the snapshot is retrieved from DRSecondary endpoint.
  name: use_dr_secondary
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.web.types.DeletedAppRestoreRequestProperties.deletedSiteId
  name: deletedSiteId
  summary: 'ARM resource ID of the deleted app. Example:

    /subscriptions/{subId}/providers/Microsoft.Web/deletedSites/{deletedSiteId}.'
  signature: 'deletedSiteId: str'
- uid: azure.mgmt.web.types.DeletedAppRestoreRequestProperties.recoverConfiguration
  name: recoverConfiguration
  summary: If true, deleted site configuration, in addition to content, will be restored.
  signature: 'recoverConfiguration: bool'
- uid: azure.mgmt.web.types.DeletedAppRestoreRequestProperties.snapshotTime
  name: snapshotTime
  summary: 'Point in time to restore the deleted app from, formatted as a DateTime
    string. If unspecified,

    default value is the time that the app was deleted.'
  signature: 'snapshotTime: str'
- uid: azure.mgmt.web.types.DeletedAppRestoreRequestProperties.useDRSecondary
  name: useDRSecondary
  summary: If true, the snapshot is retrieved from DRSecondary endpoint.
  signature: 'useDRSecondary: bool'
