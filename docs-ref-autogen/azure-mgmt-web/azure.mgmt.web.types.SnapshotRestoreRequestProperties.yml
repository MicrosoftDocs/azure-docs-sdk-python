### YamlMime:PythonClass
uid: azure.mgmt.web.types.SnapshotRestoreRequestProperties
name: SnapshotRestoreRequestProperties
fullName: azure.mgmt.web.types.SnapshotRestoreRequestProperties
module: azure.mgmt.web.types
summary: SnapshotRestoreRequest resource specific properties.
constructor:
  syntax: SnapshotRestoreRequestProperties()
variables:
- description: 'Point in time in which the app restore should be done, formatted as
    a

    DateTime string.'
  name: snapshot_time
  types:
  - <xref:str>
- description: 'Optional. Specifies the web app that snapshot contents will be retrieved

    from. If empty, the targeted web app will be used as the source.'
  name: recovery_source
  types:
  - <xref:<xref:"SnapshotRecoverySource">>
- description: 'If <code>true</code> the restore operation can overwrite source app;

    otherwise, <code>false</code>. Required.'
  name: overwrite
  types:
  - <xref:bool>
- description: 'If true, site configuration, in addition to content, will be

    reverted.'
  name: recover_configuration
  types:
  - <xref:bool>
- description: 'If true, custom hostname conflicts will be ignored when

    recovering to a target web app. This setting is only necessary when RecoverConfiguration
    is

    enabled.'
  name: ignore_conflicting_host_names
  types:
  - <xref:bool>
- description: If true, the snapshot is retrieved from DRSecondary endpoint.
  name: use_dr_secondary
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.web.types.SnapshotRestoreRequestProperties.ignoreConflictingHostNames
  name: ignoreConflictingHostNames
  summary: 'If true, custom hostname conflicts will be ignored when recovering to
    a target web app. This

    setting is only necessary when RecoverConfiguration is enabled.'
  signature: 'ignoreConflictingHostNames: bool'
- uid: azure.mgmt.web.types.SnapshotRestoreRequestProperties.overwrite
  name: overwrite
  summary: 'If <code>true</code> the restore operation can overwrite source app; otherwise,

    <code>false</code>. Required.'
  signature: 'overwrite: bool'
- uid: azure.mgmt.web.types.SnapshotRestoreRequestProperties.recoverConfiguration
  name: recoverConfiguration
  summary: If true, site configuration, in addition to content, will be reverted.
  signature: 'recoverConfiguration: bool'
- uid: azure.mgmt.web.types.SnapshotRestoreRequestProperties.recoverySource
  name: recoverySource
  summary: 'Optional. Specifies the web app that snapshot contents will be retrieved
    from. If empty, the

    targeted web app will be used as the source.'
  signature: 'recoverySource: SnapshotRecoverySource'
- uid: azure.mgmt.web.types.SnapshotRestoreRequestProperties.snapshotTime
  name: snapshotTime
  summary: Point in time in which the app restore should be done, formatted as a DateTime
    string.
  signature: 'snapshotTime: str'
- uid: azure.mgmt.web.types.SnapshotRestoreRequestProperties.useDRSecondary
  name: useDRSecondary
  summary: If true, the snapshot is retrieved from DRSecondary endpoint.
  signature: 'useDRSecondary: bool'
