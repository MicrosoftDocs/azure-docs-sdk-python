uid: azure.mgmt.web.types.DatabaseBackupSetting
name: DatabaseBackupSetting
fullName: azure.mgmt.web.types.DatabaseBackupSetting
module: azure.mgmt.web.types
summary: Database backup settings.
constructor:
  syntax: DatabaseBackupSetting()
variables:
- description: 'Database type (e.g. SqlAzure / MySql). Required. Known values are:

    "SqlAzure", "MySql", "LocalMySql", and "PostgreSql".'
  name: database_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DatabaseType">]
- name: name
  types:
  - <xref:str>
- description: 'Contains a connection string name that is linked to the

    SiteConfig.ConnectionStrings. This is used during restore with overwrite connection
    strings

    options.'
  name: connection_string_name
  types:
  - <xref:str>
- description: 'Contains a connection string to a database which is being backed up
    or

    restored. If the restore should happen to a new database, the database name inside
    is the new

    one.'
  name: connection_string
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.web.types.DatabaseBackupSetting.connectionString
  name: connectionString
  summary: 'Contains a connection string to a database which is being backed up or
    restored. If the restore

    should happen to a new database, the database name inside is the new one.'
  signature: 'connectionString: str'
- uid: azure.mgmt.web.types.DatabaseBackupSetting.connectionStringName
  name: connectionStringName
  summary: 'Contains a connection string name that is linked to the SiteConfig.ConnectionStrings.
    This is

    used during restore with overwrite connection strings options.'
  signature: 'connectionStringName: str'
