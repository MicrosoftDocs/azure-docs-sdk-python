uid: azure.mgmt.web.types.PushSettingsProperties
name: PushSettingsProperties
fullName: azure.mgmt.web.types.PushSettingsProperties
module: azure.mgmt.web.types
summary: PushSettings resource specific properties.
constructor:
  syntax: PushSettingsProperties()
variables:
- description: 'Gets or sets a flag indicating whether the Push endpoint is enabled.

    Required.'
  name: is_push_enabled
  types:
  - <xref:bool>
- description: 'Gets or sets a JSON string containing a list of tags that are

    whitelisted for use by the push registration endpoint.'
  name: tag_whitelist_json
  types:
  - <xref:str>
- description: 'Gets or sets a JSON string containing a list of tags that require

    user authentication to be used in the push registration endpoint. Tags can consist
    of

    alphanumeric characters and the following: ''_'', ''@'', ''#'', ''.'', '':'',
    ''-''. Validation should be

    performed at the PushRequestHandler.'
  name: tags_requiring_auth
  types:
  - <xref:str>
- description: 'Gets or sets a JSON string containing a list of dynamic tags that
    will

    be evaluated from user claims in the push registration endpoint.'
  name: dynamic_tags_json
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.web.types.PushSettingsProperties.dynamicTagsJson
  name: dynamicTagsJson
  summary: 'Gets or sets a JSON string containing a list of dynamic tags that will
    be evaluated from user

    claims in the push registration endpoint.'
  signature: 'dynamicTagsJson: str'
- uid: azure.mgmt.web.types.PushSettingsProperties.isPushEnabled
  name: isPushEnabled
  summary: Gets or sets a flag indicating whether the Push endpoint is enabled. Required.
  signature: 'isPushEnabled: bool'
- uid: azure.mgmt.web.types.PushSettingsProperties.tagWhitelistJson
  name: tagWhitelistJson
  summary: 'Gets or sets a JSON string containing a list of tags that are whitelisted
    for use by the push

    registration endpoint.'
  signature: 'tagWhitelistJson: str'
- uid: azure.mgmt.web.types.PushSettingsProperties.tagsRequiringAuth
  name: tagsRequiringAuth
  summary: 'Gets or sets a JSON string containing a list of tags that require user
    authentication to be

    used in the push registration endpoint. Tags can consist of alphanumeric characters
    and the

    following: ''_'', ''@'', ''#'', ''.'', '':'', ''-''. Validation should be performed
    at the

    PushRequestHandler.'
  signature: 'tagsRequiringAuth: str'
