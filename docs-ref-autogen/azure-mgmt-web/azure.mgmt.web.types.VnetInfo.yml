uid: azure.mgmt.web.types.VnetInfo
name: VnetInfo
fullName: azure.mgmt.web.types.VnetInfo
module: azure.mgmt.web.types
summary: Virtual Network information contract.
constructor:
  syntax: VnetInfo()
variables:
- description: The Virtual Network's resource ID.
  name: vnet_resource_id
  types:
  - <xref:str>
- description: The client certificate thumbprint.
  name: cert_thumbprint
  types:
  - <xref:str>
- description: 'A certificate file (.cer) blob containing the public key of the private
    key

    used to authenticate a nPoint-To-Site VPN connection.'
  name: cert_blob
  types:
  - <xref:str>
- description: The routes that this Virtual Network connection uses.
  name: routes
  types:
  - <xref:list>[<xref:"VnetRoute">]
- description: '<code>true</code> if a resync is required; otherwise,

    <code>false</code>.'
  name: resync_required
  types:
  - <xref:bool>
- description: 'DNS servers to be used by this Virtual Network. This should be a

    comma-separated list of IP addresses.'
  name: dns_servers
  types:
  - <xref:str>
- description: Flag that is used to denote if this is VNET injection.
  name: is_swift
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.web.types.VnetInfo.certBlob
  name: certBlob
  summary: "A certificate file (.cer) blob containing the public key of the private\
    \ key used to\n   authenticate a\n\nPoint-To-Site VPN connection."
  signature: 'certBlob: str'
- uid: azure.mgmt.web.types.VnetInfo.certThumbprint
  name: certThumbprint
  summary: The client certificate thumbprint.
  signature: 'certThumbprint: str'
- uid: azure.mgmt.web.types.VnetInfo.dnsServers
  name: dnsServers
  summary: 'DNS servers to be used by this Virtual Network. This should be a comma-separated
    list of IP

    addresses.'
  signature: 'dnsServers: str'
- uid: azure.mgmt.web.types.VnetInfo.isSwift
  name: isSwift
  summary: Flag that is used to denote if this is VNET injection.
  signature: 'isSwift: bool'
- uid: azure.mgmt.web.types.VnetInfo.resyncRequired
  name: resyncRequired
  summary: <code>true</code> if a resync is required; otherwise, <code>false</code>.
  signature: 'resyncRequired: bool'
- uid: azure.mgmt.web.types.VnetInfo.routes
  name: routes
  summary: The routes that this Virtual Network connection uses.
  signature: 'routes: list[azure.mgmt.web.types.VnetRoute]'
