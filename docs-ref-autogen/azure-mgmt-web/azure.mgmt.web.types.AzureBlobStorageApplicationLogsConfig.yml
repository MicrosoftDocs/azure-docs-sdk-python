uid: azure.mgmt.web.types.AzureBlobStorageApplicationLogsConfig
name: AzureBlobStorageApplicationLogsConfig
fullName: azure.mgmt.web.types.AzureBlobStorageApplicationLogsConfig
module: azure.mgmt.web.types
summary: Application logs azure blob storage configuration.
constructor:
  syntax: AzureBlobStorageApplicationLogsConfig()
variables:
- description: 'Log level. Known values are: "Off", "Verbose", "Information", "Warning",
    and

    "Error".'
  name: level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LogLevel">]
- description: SAS url to a azure blob container with read/write/list/delete permissions.
  name: sas_url
