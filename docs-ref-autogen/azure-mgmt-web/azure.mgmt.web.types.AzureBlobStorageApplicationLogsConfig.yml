  - <xref:str>
- description: 'Retention in days. Remove blobs older than X days. 0 or lower means
    no

    retention.'
  name: retention_in_days
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.web.types.AzureBlobStorageApplicationLogsConfig.level
  name: level
  summary: '"Off", "Verbose", "Information", "Warning", and "Error".'
  signature: 'level: str | LogLevel'
- uid: azure.mgmt.web.types.AzureBlobStorageApplicationLogsConfig.retentionInDays
  name: retentionInDays
  summary: Retention in days. Remove blobs older than X days. 0 or lower means no
    retention.
  signature: 'retentionInDays: int'
- uid: azure.mgmt.web.types.AzureBlobStorageApplicationLogsConfig.sasUrl
  name: sasUrl
