uid: azure.mgmt.web.types.SiteContainerProperties
name: SiteContainerProperties
fullName: azure.mgmt.web.types.SiteContainerProperties
module: azure.mgmt.web.types
summary: SiteContainer resource specific properties.
constructor:
  syntax: SiteContainerProperties()
variables:
- description: Image Name. Required.
  name: image
  types:
  - <xref:str>
- description: Target Port.
  name: target_port
  types:
  - <xref:str>
- description: '<code>true</code> if the container is the main site container;

    <code>false</code> otherwise. Required.'
  name: is_main
  types:
  - <xref:bool>
- description: StartUp Command.
  name: start_up_command
  types:
  - <xref:str>
- description: 'Auth Type. Known values are: "Anonymous", "UserCredentials", "SystemIdentity",

    and "UserAssigned".'
  name: auth_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AuthType">]
- description: User Name.
  name: user_name
