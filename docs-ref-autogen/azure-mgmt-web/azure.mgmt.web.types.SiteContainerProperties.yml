  - <xref:str>
- description: Password Secret.
  name: password_secret
  types:
  - <xref:str>
- description: UserManagedIdentity ClientId.
  name: user_managed_identity_client_id
  types:
  - <xref:str>
- description: Created Time.
  name: created_time
  types:
  - <xref:str>
- description: Last Modified Time.
  name: last_modified_time
  types:
  - <xref:str>
- description: List of volume mounts.
  name: volume_mounts
  types:
  - <xref:list>[<xref:"VolumeMount">]
- description: '<code>true</code> if all AppSettings and

    ConnectionStrings have to be passed to the container as environment variables;

    <code>false</code> otherwise.'
  name: inherit_app_settings_and_connection_strings
