### YamlMime:PythonClass
uid: azure.mgmt.databricks.types.VirtualNetworkPeeringPropertiesFormat
name: VirtualNetworkPeeringPropertiesFormat
fullName: azure.mgmt.databricks.types.VirtualNetworkPeeringPropertiesFormat
module: azure.mgmt.databricks.types
summary: Properties of the virtual network peering.
constructor:
  syntax: VirtualNetworkPeeringPropertiesFormat()
variables:
- description: 'Whether the VMs in the local virtual network space would be

    able to access the VMs in remote virtual network space.'
  name: allow_virtual_network_access
  types:
  - <xref:bool>
- description: 'Whether the forwarded traffic from the VMs in the local virtual

    network will be allowed/disallowed in remote virtual network.'
  name: allow_forwarded_traffic
  types:
  - <xref:bool>
- description: 'If gateway links can be used in remote virtual networking to link

    to this virtual network.'
  name: allow_gateway_transit
  types:
  - <xref:bool>
- description: 'If remote gateways can be used on this virtual network. If the flag

    is set to true, and allowGatewayTransit on remote peering is also true, virtual
    network will

    use gateways of remote virtual network for transit. Only one peering can have
    this flag set to

    true. This flag cannot be set if virtual network already has a gateway.'
  name: use_remote_gateways
  types:
  - <xref:bool>
- description: 'The remote virtual network should be in the same region. See

    here to learn more

    ([https://docs.microsoft.com/en-us/azure/databricks/administration-guide/cloud-configurations/azure/vnet-peering](https://docs.microsoft.com/en-us/azure/databricks/administration-guide/cloud-configurations/azure/vnet-peering)).'
  name: databricks_virtual_network
  types:
  - <xref:<xref:"VirtualNetworkPeeringPropertiesFormatDatabricksVirtualNetwork">>
- description: The reference to the databricks virtual network address space.
  name: databricks_address_space
  types:
  - <xref:<xref:"AddressSpace">>
- description: 'The remote virtual network should be in the same region. See here

    to learn more

    ([https://docs.microsoft.com/en-us/azure/databricks/administration-guide/cloud-configurations/azure/vnet-peering](https://docs.microsoft.com/en-us/azure/databricks/administration-guide/cloud-configurations/azure/vnet-peering)).

    Required.'
  name: remote_virtual_network
  types:
  - <xref:<xref:"VirtualNetworkPeeringPropertiesFormatRemoteVirtualNetwork">>
- description: The reference to the remote virtual network address space.
  name: remote_address_space
  types:
  - <xref:<xref:"AddressSpace">>
- description: 'The status of the virtual network peering. Known values are: "Initiated",

    "Connected", and "Disconnected".'
  name: peering_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PeeringState">]
- description: 'The provisioning state of the virtual network peering resource. Known

    values are: "Succeeded", "Updating", "Deleting", and "Failed".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PeeringProvisioningState">]
attributes:
- uid: azure.mgmt.databricks.types.VirtualNetworkPeeringPropertiesFormat.allowForwardedTraffic
  name: allowForwardedTraffic
  summary: 'Whether the forwarded traffic from the VMs in the local virtual network
    will be

    allowed/disallowed in remote virtual network.'
  signature: 'allowForwardedTraffic: bool'
- uid: azure.mgmt.databricks.types.VirtualNetworkPeeringPropertiesFormat.allowGatewayTransit
  name: allowGatewayTransit
  summary: If gateway links can be used in remote virtual networking to link to this
    virtual network.
  signature: 'allowGatewayTransit: bool'
- uid: azure.mgmt.databricks.types.VirtualNetworkPeeringPropertiesFormat.allowVirtualNetworkAccess
  name: allowVirtualNetworkAccess
  summary: 'Whether the VMs in the local virtual network space would be able to access
    the VMs in remote

    virtual network space.'
  signature: 'allowVirtualNetworkAccess: bool'
- uid: azure.mgmt.databricks.types.VirtualNetworkPeeringPropertiesFormat.databricksAddressSpace
  name: databricksAddressSpace
  summary: The reference to the databricks virtual network address space.
  signature: 'databricksAddressSpace: AddressSpace'
- uid: azure.mgmt.databricks.types.VirtualNetworkPeeringPropertiesFormat.databricksVirtualNetwork
  name: databricksVirtualNetwork
  summary: 'The remote virtual network should be in the same region. See here to learn
    more

    ([https://docs.microsoft.com/en-us/azure/databricks/administration-guide/cloud-configurations/azure/vnet-peering](https://docs.microsoft.com/en-us/azure/databricks/administration-guide/cloud-configurations/azure/vnet-peering)).'
  signature: 'databricksVirtualNetwork: VirtualNetworkPeeringPropertiesFormatDatabricksVirtualNetwork'
- uid: azure.mgmt.databricks.types.VirtualNetworkPeeringPropertiesFormat.peeringState
  name: peeringState
  summary: '"Initiated", "Connected", and

    "Disconnected".'
  signature: 'peeringState: str | PeeringState'
- uid: azure.mgmt.databricks.types.VirtualNetworkPeeringPropertiesFormat.provisioningState
  name: provisioningState
  summary: 'The provisioning state of the virtual network peering resource. Known
    values are:

    "Succeeded", "Updating", "Deleting", and "Failed".'
  signature: 'provisioningState: str | PeeringProvisioningState'
- uid: azure.mgmt.databricks.types.VirtualNetworkPeeringPropertiesFormat.remoteAddressSpace
  name: remoteAddressSpace
  summary: The reference to the remote virtual network address space.
  signature: 'remoteAddressSpace: AddressSpace'
- uid: azure.mgmt.databricks.types.VirtualNetworkPeeringPropertiesFormat.remoteVirtualNetwork
  name: remoteVirtualNetwork
  summary: 'The remote virtual network should be in the same region. See here to learn
    more

    ([https://docs.microsoft.com/en-us/azure/databricks/administration-guide/cloud-configurations/azure/vnet-peering](https://docs.microsoft.com/en-us/azure/databricks/administration-guide/cloud-configurations/azure/vnet-peering)).

    Required.'
  signature: 'remoteVirtualNetwork: Required[VirtualNetworkPeeringPropertiesFormatRemoteVirtualNetwork]'
