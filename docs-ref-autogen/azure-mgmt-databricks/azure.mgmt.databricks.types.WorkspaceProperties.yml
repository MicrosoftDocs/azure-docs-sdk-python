### YamlMime:PythonClass
uid: azure.mgmt.databricks.types.WorkspaceProperties
name: WorkspaceProperties
fullName: azure.mgmt.databricks.types.WorkspaceProperties
module: azure.mgmt.databricks.types
summary: The workspace properties.
constructor:
  syntax: WorkspaceProperties()
variables:
- description: 'The workspace compute mode. Required on create, cannot be changed.
    Possible

    values include: ''Serverless'', ''Hybrid''. Required. Known values are: "Serverless"
    and "Hybrid".'
  name: compute_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ComputeMode">]
- description: 'The managed resource group Id. Required in Hybrid ComputeMode

    workspace. Not allowed in Serverless ComputeMode workspace.'
  name: managed_resource_group_id
  types:
  - <xref:str>
- description: The workspace's custom parameters.
  name: parameters
  types:
  - <xref:<xref:"WorkspaceCustomParameters">>
- description: 'The workspace provisioning state. Known values are: "Accepted",

    "Running", "Ready", "Creating", "Created", "Deleting", "Deleted", "Canceled",
    "Failed",

    "Succeeded", and "Updating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The blob URI where the UI definition file is located.
  name: ui_definition_uri
  types:
  - <xref:str>
- description: The workspace provider authorizations.
  name: authorizations
  types:
  - <xref:list>[<xref:"WorkspaceProviderAuthorization">]
- description: 'Indicates the Object ID, PUID and Application ID of entity that created
    the

    workspace.'
  name: created_by
  types:
  - <xref:<xref:"CreatedBy">>
- description: 'Indicates the Object ID, PUID and Application ID of entity that last
    updated

    the workspace.'
  name: updated_by
  types:
  - <xref:<xref:"CreatedBy">>
- description: Specifies the date and time when the workspace is created.
  name: created_date_time
  types:
  - <xref:str>
- description: 'The unique identifier of the databricks workspace in databricks control

    plane.'
  name: workspace_id
  types:
  - <xref:str>
- description: 'The workspace URL which is of the format

    ''adb-{workspaceId}.{random}.azuredatabricks.net''.'
  name: workspace_url
  types:
  - <xref:str>
- description: 'The details of Managed Identity of Storage Account. Only

    returned in Hybrid ComputeMode workspace.'
  name: storage_account_identity
  types:
  - <xref:<xref:"ManagedIdentityConfiguration">>
- description: 'The details of Managed Identity of Disk Encryption Set used for

    Managed Disk Encryption. Only returned in Hybrid ComputeMode workspace.'
  name: managed_disk_identity
  types:
  - <xref:<xref:"ManagedIdentityConfiguration">>
- description: 'The resource Id of the managed disk encryption set. Not allowed

    in Serverless ComputeMode workspace.'
  name: disk_encryption_set_id
  types:
  - <xref:str>
- description: 'Encryption properties for databricks workspace. Supported in both
    Serverless

    and Hybrid ComputeMode workspace.'
  name: encryption
  types:
  - <xref:<xref:"WorkspacePropertiesEncryption">>
- description: 'Contains settings related to the Enhanced Security and

    Compliance Add-On. Supported in both Serverless and Hybrid ComputeMode workspace.'
  name: enhanced_security_compliance
  types:
  - <xref:<xref:"EnhancedSecurityComplianceDefinition">>
- description: 'Private endpoint connections created on the workspace.

    Supported in both Serverless and Hybrid ComputeMode workspace.'
  name: private_endpoint_connections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: 'The network access type for accessing workspace. Set value to

    disabled to access workspace only via private link. Used to configure front-end
    only private

    link for Serverless ComputeMode workspace. Known values are: "Enabled" and "Disabled".'
  name: public_network_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: 'Gets or sets a value indicating whether data plane (clusters) to

    control plane communication happen over private endpoint. Supported values are
    ''AllRules'' and

    ''NoAzureDatabricksRules''. ''NoAzureServiceRules'' value is for internal use
    only. Not allowed in

    Serverless ComputeMode workspace. Known values are: "AllRules", "NoAzureDatabricksRules",
    and

    "NoAzureServiceRules".'
  name: required_nsg_rules
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RequiredNsgRules">]
- description: 'Properties for Default Catalog configuration during workspace creation.

    Not allowed in Serverless ComputeMode workspace.'
  name: default_catalog
  types:
  - <xref:<xref:"DefaultCatalogProperties">>
- description: 'Indicates whether unity catalog enabled for the workspace or not.
    Set as

    true in Serverless ComputeMode workspace.'
  name: is_uc_enabled
  types:
  - <xref:bool>
- description: 'Access Connector Resource that is going to be associated with

    Databricks Workspace. Not allowed in Serverless ComputeMode workspace.'
  name: access_connector
  types:
  - <xref:<xref:"WorkspacePropertiesAccessConnector">>
- description: 'Gets or Sets Default Storage Firewall configuration

    information. Not allowed in Serverless ComputeMode workspace. Known values are:
    "Disabled" and

    "Enabled".'
  name: default_storage_firewall
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DefaultStorageFirewall">]
attributes:
- uid: azure.mgmt.databricks.types.WorkspaceProperties.accessConnector
  name: accessConnector
  summary: 'Access Connector Resource that is going to be associated with Databricks
    Workspace. Not allowed

    in Serverless ComputeMode workspace.'
  signature: 'accessConnector: WorkspacePropertiesAccessConnector'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.authorizations
  name: authorizations
  summary: The workspace provider authorizations.
  signature: 'authorizations: list[''WorkspaceProviderAuthorization'']'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.computeMode
  name: computeMode
  summary: 'The workspace compute mode. Required on create, cannot be changed. Possible
    values include:

    ''Serverless'', ''Hybrid''. Required. Known values are: "Serverless" and "Hybrid".'
  signature: 'computeMode: Required[str | ComputeMode]'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.createdBy
  name: createdBy
  summary: Indicates the Object ID, PUID and Application ID of entity that created
    the workspace.
  signature: 'createdBy: CreatedBy'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.createdDateTime
  name: createdDateTime
  summary: Specifies the date and time when the workspace is created.
  signature: 'createdDateTime: str'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.defaultCatalog
  name: defaultCatalog
  summary: 'Properties for Default Catalog configuration during workspace creation.
    Not allowed in

    Serverless ComputeMode workspace.'
  signature: 'defaultCatalog: DefaultCatalogProperties'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.defaultStorageFirewall
  name: defaultStorageFirewall
  summary: 'Gets or Sets Default Storage Firewall configuration information. Not allowed
    in Serverless

    ComputeMode workspace. Known values are: "Disabled" and "Enabled".'
  signature: 'defaultStorageFirewall: str | DefaultStorageFirewall'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.diskEncryptionSetId
  name: diskEncryptionSetId
  summary: 'The resource Id of the managed disk encryption set. Not allowed in Serverless
    ComputeMode

    workspace.'
  signature: 'diskEncryptionSetId: str'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.encryption
  name: encryption
  summary: 'Encryption properties for databricks workspace. Supported in both Serverless
    and Hybrid

    ComputeMode workspace.'
  signature: 'encryption: WorkspacePropertiesEncryption'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.enhancedSecurityCompliance
  name: enhancedSecurityCompliance
  summary: 'Contains settings related to the Enhanced Security and Compliance Add-On.
    Supported in both

    Serverless and Hybrid ComputeMode workspace.'
  signature: 'enhancedSecurityCompliance: EnhancedSecurityComplianceDefinition'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.isUcEnabled
  name: isUcEnabled
  summary: 'Indicates whether unity catalog enabled for the workspace or not. Set
    as true in Serverless

    ComputeMode workspace.'
  signature: 'isUcEnabled: bool'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.managedDiskIdentity
  name: managedDiskIdentity
  summary: 'The details of Managed Identity of Disk Encryption Set used for Managed
    Disk Encryption. Only

    returned in Hybrid ComputeMode workspace.'
  signature: 'managedDiskIdentity: ManagedIdentityConfiguration'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.managedResourceGroupId
  name: managedResourceGroupId
  summary: 'The managed resource group Id. Required in Hybrid ComputeMode workspace.
    Not allowed in

    Serverless ComputeMode workspace.'
  signature: 'managedResourceGroupId: str'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.parameters
  name: parameters
  summary: The workspace's custom parameters.
  signature: 'parameters: WorkspaceCustomParameters'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.privateEndpointConnections
  name: privateEndpointConnections
  summary: 'Private endpoint connections created on the workspace. Supported in both
    Serverless and Hybrid

    ComputeMode workspace.'
  signature: 'privateEndpointConnections: list[''PrivateEndpointConnection'']'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.provisioningState
  name: provisioningState
  summary: '"Accepted", "Running", "Ready",

    "Creating", "Created", "Deleting", "Deleted", "Canceled", "Failed", "Succeeded",

    and "Updating".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.publicNetworkAccess
  name: publicNetworkAccess
  summary: 'The network access type for accessing workspace. Set value to disabled
    to access workspace only

    via private link. Used to configure front-end only private link for Serverless
    ComputeMode

    workspace. Known values are: "Enabled" and "Disabled".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.requiredNsgRules
  name: requiredNsgRules
  summary: 'Gets or sets a value indicating whether data plane (clusters) to control
    plane communication

    happen over private endpoint. Supported values are ''AllRules'' and ''NoAzureDatabricksRules''.

    ''NoAzureServiceRules'' value is for internal use only. Not allowed in Serverless
    ComputeMode

    workspace. Known values are: "AllRules", "NoAzureDatabricksRules", and

    "NoAzureServiceRules".'
  signature: 'requiredNsgRules: str | RequiredNsgRules'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.storageAccountIdentity
  name: storageAccountIdentity
  summary: 'The details of Managed Identity of Storage Account. Only returned in Hybrid
    ComputeMode

    workspace.'
  signature: 'storageAccountIdentity: ManagedIdentityConfiguration'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.uiDefinitionUri
  name: uiDefinitionUri
  summary: The blob URI where the UI definition file is located.
  signature: 'uiDefinitionUri: str'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.updatedBy
  name: updatedBy
  summary: Indicates the Object ID, PUID and Application ID of entity that last updated
    the workspace.
  signature: 'updatedBy: CreatedBy'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.workspaceId
  name: workspaceId
  summary: The unique identifier of the databricks workspace in databricks control
    plane.
  signature: 'workspaceId: str'
- uid: azure.mgmt.databricks.types.WorkspaceProperties.workspaceUrl
  name: workspaceUrl
  summary: The workspace URL which is of the format 'adb-{workspaceId}.{random}.azuredatabricks.net'.
  signature: 'workspaceUrl: str'
