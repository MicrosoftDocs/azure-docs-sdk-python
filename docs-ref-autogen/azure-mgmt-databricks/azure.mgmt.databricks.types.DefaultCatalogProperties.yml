### YamlMime:PythonClass
uid: azure.mgmt.databricks.types.DefaultCatalogProperties
name: DefaultCatalogProperties
fullName: azure.mgmt.databricks.types.DefaultCatalogProperties
module: azure.mgmt.databricks.types
summary: 'These properties lets user specify default catalog properties during workspace
  creation. Not

  allowed in Serverless ComputeMode workspace.'
constructor:
  syntax: DefaultCatalogProperties()
variables:
- description: 'Defines the initial type of the default catalog. Possible values

    (case-insensitive):  HiveMetastore, UnityCatalog. Known values are: "HiveMetastore"
    and

    "UnityCatalog".'
  name: initial_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"InitialType">]
- description: 'Specifies the initial Name of default catalog. If not specified, the
    name

    of the workspace will be used.'
  name: initial_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.databricks.types.DefaultCatalogProperties.initialName
  name: initialName
  summary: 'Specifies the initial Name of default catalog. If not specified, the name
    of the workspace will

    be used.'
  signature: 'initialName: str'
- uid: azure.mgmt.databricks.types.DefaultCatalogProperties.initialType
  name: initialType
  summary: 'Defines the initial type of the default catalog. Possible values (case-insensitive):

    HiveMetastore, UnityCatalog. Known values are: "HiveMetastore" and "UnityCatalog".'
  signature: 'initialType: str | InitialType'
