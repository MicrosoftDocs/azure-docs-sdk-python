### YamlMime:PythonClass
uid: azure.mgmt.trafficmanager.types.EndpointProperties
name: EndpointProperties
fullName: azure.mgmt.trafficmanager.types.EndpointProperties
module: azure.mgmt.trafficmanager.types
summary: Class representing a Traffic Manager endpoint properties.
constructor:
  syntax: EndpointProperties()
variables:
- description: 'The Azure Resource URI of the of the endpoint. Not applicable to

    endpoints of type ''ExternalEndpoints''.'
  name: targetResourceId
  types:
  - <xref:str>
- description: 'The fully-qualified DNS name or IP address of the endpoint. Traffic
    Manager

    returns this value in DNS responses to direct traffic to this endpoint.'
  name: target
  types:
  - <xref:str>
- description: 'The status of the endpoint. If the endpoint is Enabled, it is probed
    for

    endpoint health and is included in the traffic routing method. Known values are:
    "Enabled" and

    "Disabled".'
  name: endpointStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EndpointStatus">]
- description: 'The weight of this endpoint when using the ''Weighted'' traffic routing
    method.

    Possible values are from 1 to 1000.'
  name: weight
  types:
  - <xref:int>
- description: 'The priority of this endpoint when using the ''Priority'' traffic
    routing method.

    Possible values are from 1 to 1000, lower values represent higher priority. This
    is an optional

    parameter.  If specified, it must be specified on all endpoints, and no two endpoints
    can share

    the same priority value.'
  name: priority
  types:
  - <xref:int>
- description: 'Specifies the location of the external or nested endpoints when using

    the ''Performance'' traffic routing method.'
  name: endpointLocation
  types:
  - <xref:str>
- description: 'The monitoring status of the endpoint. Known values are:

    "CheckingEndpoint", "Online", "Degraded", "Disabled", "Inactive", "Stopped", and
    "Unmonitored".'
  name: endpointMonitorStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EndpointMonitorStatus">]
- description: 'The minimum number of endpoints that must be available in the child

    profile in order for the parent profile to be considered available. Only applicable
    to endpoint

    of type ''NestedEndpoints''.'
  name: minChildEndpoints
  types:
  - <xref:int>
- description: 'The minimum number of IPv4 (DNS record type A) endpoints that must

    be available in the child profile in order for the parent profile to be considered
    available.

    Only applicable to endpoint of type ''NestedEndpoints''.'
  name: minChildEndpointsIPv4
  types:
  - <xref:int>
- description: 'The minimum number of IPv6 (DNS record type AAAA) endpoints that

    must be available in the child profile in order for the parent profile to be considered

    available. Only applicable to endpoint of type ''NestedEndpoints''.'
  name: minChildEndpointsIPv6
  types:
  - <xref:int>
- description: 'The list of countries/regions mapped to this endpoint when using the

    ''Geographic'' traffic routing method. Please consult Traffic Manager Geographic
    documentation

    for a full list of accepted values.'
  name: geoMapping
  types:
  - <xref:list>[<xref:str>]
- description: 'The list of subnets, IP addresses, and/or address ranges mapped to
    this endpoint

    when using the ''Subnet'' traffic routing method. An empty list will match all
    ranges not covered

    by other endpoints.'
  name: subnets
  types:
  - <xref:list>[<xref:"EndpointPropertiesSubnetsItem">]
- description: List of custom headers.
  name: customHeaders
  types:
  - <xref:list>[<xref:"EndpointPropertiesCustomHeadersItem">]
- description: 'If Always Serve is enabled, probing for endpoint health will be disabled
    and

    endpoints will be included in the traffic routing method. Known values are: "Enabled"
    and

    "Disabled".'
  name: alwaysServe
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AlwaysServe">]
attributes:
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.alwaysServe
  name: alwaysServe
  summary: 'If Always Serve is enabled, probing for endpoint health will be disabled
    and endpoints will be

    included in the traffic routing method. Known values are: "Enabled" and "Disabled".'
  signature: 'alwaysServe: str | AlwaysServe'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.customHeaders
  name: customHeaders
  summary: List of custom headers.
  signature: 'customHeaders: list[''EndpointPropertiesCustomHeadersItem'']'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.endpointLocation
  name: endpointLocation
  summary: 'Specifies the location of the external or nested endpoints when using
    the ''Performance'' traffic

    routing method.'
  signature: 'endpointLocation: str'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.endpointMonitorStatus
  name: endpointMonitorStatus
  summary: '"CheckingEndpoint", "Online",

    "Degraded", "Disabled", "Inactive", "Stopped", and "Unmonitored".'
  signature: 'endpointMonitorStatus: str | EndpointMonitorStatus'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.endpointStatus
  name: endpointStatus
  summary: 'The status of the endpoint. If the endpoint is Enabled, it is probed for
    endpoint health and is

    included in the traffic routing method. Known values are: "Enabled" and "Disabled".'
  signature: 'endpointStatus: str | EndpointStatus'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.geoMapping
  name: geoMapping
  summary: 'The list of countries/regions mapped to this endpoint when using the ''Geographic''
    traffic

    routing method. Please consult Traffic Manager Geographic documentation for a
    full list of

    accepted values.'
  signature: 'geoMapping: list[str]'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.minChildEndpoints
  name: minChildEndpoints
  summary: 'The minimum number of endpoints that must be available in the child profile
    in order for the

    parent profile to be considered available. Only applicable to endpoint of type

    ''NestedEndpoints''.'
  signature: 'minChildEndpoints: int'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.minChildEndpointsIPv4
  name: minChildEndpointsIPv4
  summary: 'The minimum number of IPv4 (DNS record type A) endpoints that must be
    available in the child

    profile in order for the parent profile to be considered available. Only applicable
    to endpoint

    of type ''NestedEndpoints''.'
  signature: 'minChildEndpointsIPv4: int'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.minChildEndpointsIPv6
  name: minChildEndpointsIPv6
  summary: 'The minimum number of IPv6 (DNS record type AAAA) endpoints that must
    be available in the child

    profile in order for the parent profile to be considered available. Only applicable
    to endpoint

    of type ''NestedEndpoints''.'
  signature: 'minChildEndpointsIPv6: int'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.priority
  name: priority
  summary: 'The priority of this endpoint when using the ''Priority'' traffic routing
    method. Possible values

    are from 1 to 1000, lower values represent higher priority. This is an optional
    parameter.  If

    specified, it must be specified on all endpoints, and no two endpoints can share
    the same

    priority value.'
  signature: 'priority: int'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.subnets
  name: subnets
  summary: 'The list of subnets, IP addresses, and/or address ranges mapped to this
    endpoint when using the

    ''Subnet'' traffic routing method. An empty list will match all ranges not covered
    by other

    endpoints.'
  signature: 'subnets: list[''EndpointPropertiesSubnetsItem'']'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.target
  name: target
  summary: 'The fully-qualified DNS name or IP address of the endpoint. Traffic Manager
    returns this value

    in DNS responses to direct traffic to this endpoint.'
  signature: 'target: str'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.targetResourceId
  name: targetResourceId
  summary: 'The Azure Resource URI of the of the endpoint. Not applicable to endpoints
    of type

    ''ExternalEndpoints''.'
  signature: 'targetResourceId: str'
- uid: azure.mgmt.trafficmanager.types.EndpointProperties.weight
  name: weight
  summary: 'The weight of this endpoint when using the ''Weighted'' traffic routing
    method. Possible values

    are from 1 to 1000.'
  signature: 'weight: int'
