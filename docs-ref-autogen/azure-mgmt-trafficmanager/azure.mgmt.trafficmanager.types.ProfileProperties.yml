### YamlMime:PythonClass
uid: azure.mgmt.trafficmanager.types.ProfileProperties
name: ProfileProperties
fullName: azure.mgmt.trafficmanager.types.ProfileProperties
module: azure.mgmt.trafficmanager.types
summary: Class representing the Traffic Manager profile properties.
constructor:
  syntax: ProfileProperties()
variables:
- description: 'The status of the Traffic Manager profile. Known values are: "Enabled"
    and

    "Disabled".'
  name: profileStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProfileStatus">]
- description: 'The traffic routing method of the Traffic Manager profile. Known

    values are: "Performance", "Priority", "Weighted", "Geographic", "MultiValue",
    and "Subnet".'
  name: trafficRoutingMethod
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TrafficRoutingMethod">]
- description: The DNS settings of the Traffic Manager profile.
  name: dnsConfig
  types:
  - <xref:<xref:"DnsConfig">>
- description: The endpoint monitoring settings of the Traffic Manager profile.
  name: monitorConfig
  types:
  - <xref:<xref:"MonitorConfig">>
- description: The list of endpoints in the Traffic Manager profile.
  name: endpoints
  types:
  - <xref:list>[<xref:"Endpoint">]
- description: 'Indicates whether Traffic View is ''Enabled'' or ''Disabled''

    for the Traffic Manager profile. Null, indicates ''Disabled''. Enabling this feature
    will

    increase the cost of the Traffic Manage profile. Known values are: "Enabled" and
    "Disabled".'
  name: trafficViewEnrollmentStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TrafficViewEnrollmentStatus">]
- description: The list of allowed endpoint record types.
  name: allowedEndpointRecordTypes
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"AllowedEndpointRecordType">]]
- description: Maximum number of endpoints to be returned for MultiValue routing type.
  name: maxReturn
  types:
  - <xref:int>
- description: 'When record type is set, a traffic manager profile will allow only
    endpoints

    that match this type. If it is not set, traffic manager profile will allow adding
    all types of

    endpoints. It is returned as null when this is not set. Known values are: "A",
    "AAAA", and

    "CNAME".'
  name: recordType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecordType">]
attributes:
- uid: azure.mgmt.trafficmanager.types.ProfileProperties.allowedEndpointRecordTypes
  name: allowedEndpointRecordTypes
  summary: The list of allowed endpoint record types.
  signature: 'allowedEndpointRecordTypes: list[typing.Union[str, ForwardRef(''AllowedEndpointRecordType'')]]'
- uid: azure.mgmt.trafficmanager.types.ProfileProperties.dnsConfig
  name: dnsConfig
  summary: The DNS settings of the Traffic Manager profile.
  signature: 'dnsConfig: DnsConfig'
- uid: azure.mgmt.trafficmanager.types.ProfileProperties.endpoints
  name: endpoints
  summary: The list of endpoints in the Traffic Manager profile.
  signature: 'endpoints: list[''Endpoint'']'
- uid: azure.mgmt.trafficmanager.types.ProfileProperties.maxReturn
  name: maxReturn
  summary: Maximum number of endpoints to be returned for MultiValue routing type.
  signature: 'maxReturn: int'
- uid: azure.mgmt.trafficmanager.types.ProfileProperties.monitorConfig
  name: monitorConfig
  summary: The endpoint monitoring settings of the Traffic Manager profile.
  signature: 'monitorConfig: MonitorConfig'
- uid: azure.mgmt.trafficmanager.types.ProfileProperties.profileStatus
  name: profileStatus
  summary: '"Enabled" and "Disabled".'
  signature: 'profileStatus: str | ProfileStatus'
- uid: azure.mgmt.trafficmanager.types.ProfileProperties.recordType
  name: recordType
  summary: 'When record type is set, a traffic manager profile will allow only endpoints
    that match this

    type. If it is not set, traffic manager profile will allow adding all types of
    endpoints. It is

    returned as null when this is not set. Known values are: "A", "AAAA", and "CNAME".'
  signature: 'recordType: str | RecordType'
- uid: azure.mgmt.trafficmanager.types.ProfileProperties.trafficRoutingMethod
  name: trafficRoutingMethod
  summary: '"Performance",

    "Priority", "Weighted", "Geographic", "MultiValue", and "Subnet".'
  signature: 'trafficRoutingMethod: str | TrafficRoutingMethod'
- uid: azure.mgmt.trafficmanager.types.ProfileProperties.trafficViewEnrollmentStatus
  name: trafficViewEnrollmentStatus
  summary: 'Indicates whether Traffic View is ''Enabled'' or ''Disabled'' for the
    Traffic Manager profile.

    Null, indicates ''Disabled''. Enabling this feature will increase the cost of
    the Traffic Manage

    profile. Known values are: "Enabled" and "Disabled".'
  signature: 'trafficViewEnrollmentStatus: str | TrafficViewEnrollmentStatus'
