### YamlMime:PythonClass
uid: azure.mgmt.trafficmanager.types.MonitorConfig
name: MonitorConfig
fullName: azure.mgmt.trafficmanager.types.MonitorConfig
module: azure.mgmt.trafficmanager.types
summary: Class containing endpoint monitoring settings in a Traffic Manager profile.
constructor:
  syntax: MonitorConfig()
variables:
- description: 'The profile-level monitoring status of the Traffic Manager profile.

    Known values are: "CheckingEndpoints", "Online", "Degraded", "Disabled", and "Inactive".'
  name: profileMonitorStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProfileMonitorStatus">]
- description: 'The protocol (HTTP, HTTPS or TCP) used to probe for endpoint health.
    Known

    values are: "HTTP", "HTTPS", and "TCP".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MonitorProtocol">]
- description: The TCP port used to probe for endpoint health.
  name: port
  types:
  - <xref:int>
- description: The path relative to the endpoint domain name used to probe for endpoint
    health.
  name: path
  types:
  - <xref:str>
- description: 'The monitor interval for endpoints in this profile. This is the

    interval at which Traffic Manager will check the health of each endpoint in this
    profile.'
  name: intervalInSeconds
  types:
  - <xref:int>
- description: 'The monitor timeout for endpoints in this profile. This is the time

    that Traffic Manager allows endpoints in this profile to response to the health
    check.'
  name: timeoutInSeconds
  types:
  - <xref:int>
- description: 'The number of consecutive failed health check that Traffic

    Manager tolerates before declaring an endpoint in this profile Degraded after
    the next failed

    health check.'
  name: toleratedNumberOfFailures
  types:
  - <xref:int>
- description: List of custom headers.
  name: customHeaders
  types:
  - <xref:list>[<xref:"MonitorConfigCustomHeadersItem">]
- description: List of expected status code ranges.
  name: expectedStatusCodeRanges
  types:
  - <xref:list>[<xref:"MonitorConfigExpectedStatusCodeRangesItem">]
attributes:
- uid: azure.mgmt.trafficmanager.types.MonitorConfig.customHeaders
  name: customHeaders
  summary: List of custom headers.
  signature: 'customHeaders: list[''MonitorConfigCustomHeadersItem'']'
- uid: azure.mgmt.trafficmanager.types.MonitorConfig.expectedStatusCodeRanges
  name: expectedStatusCodeRanges
  summary: List of expected status code ranges.
  signature: 'expectedStatusCodeRanges: list[''MonitorConfigExpectedStatusCodeRangesItem'']'
- uid: azure.mgmt.trafficmanager.types.MonitorConfig.intervalInSeconds
  name: intervalInSeconds
  summary: 'The monitor interval for endpoints in this profile. This is the interval
    at which Traffic

    Manager will check the health of each endpoint in this profile.'
  signature: 'intervalInSeconds: int'
- uid: azure.mgmt.trafficmanager.types.MonitorConfig.path
  name: path
  summary: The path relative to the endpoint domain name used to probe for endpoint
    health.
  signature: 'path: str'
- uid: azure.mgmt.trafficmanager.types.MonitorConfig.port
  name: port
  summary: The TCP port used to probe for endpoint health.
  signature: 'port: int'
- uid: azure.mgmt.trafficmanager.types.MonitorConfig.profileMonitorStatus
  name: profileMonitorStatus
  summary: 'The profile-level monitoring status of the Traffic Manager profile. Known
    values are:

    "CheckingEndpoints", "Online", "Degraded", "Disabled", and "Inactive".'
  signature: 'profileMonitorStatus: str | ProfileMonitorStatus'
- uid: azure.mgmt.trafficmanager.types.MonitorConfig.protocol
  name: protocol
  summary: 'The protocol (HTTP, HTTPS or TCP) used to probe for endpoint health. Known
    values are:

    "HTTP", "HTTPS", and "TCP".'
  signature: 'protocol: str | MonitorProtocol'
- uid: azure.mgmt.trafficmanager.types.MonitorConfig.timeoutInSeconds
  name: timeoutInSeconds
  summary: 'The monitor timeout for endpoints in this profile. This is the time that
    Traffic Manager allows

    endpoints in this profile to response to the health check.'
  signature: 'timeoutInSeconds: int'
- uid: azure.mgmt.trafficmanager.types.MonitorConfig.toleratedNumberOfFailures
  name: toleratedNumberOfFailures
  summary: 'The number of consecutive failed health check that Traffic Manager tolerates
    before declaring

    an endpoint in this profile Degraded after the next failed health check.'
  signature: 'toleratedNumberOfFailures: int'
