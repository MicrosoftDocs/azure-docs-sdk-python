### YamlMime:PythonClass
uid: azure.mgmt.redhatopenshift.types.NetworkProfile
name: NetworkProfile
fullName: azure.mgmt.redhatopenshift.types.NetworkProfile
module: azure.mgmt.redhatopenshift.types
summary: NetworkProfile represents a network profile.
constructor:
  syntax: NetworkProfile()
variables:
- description: The CIDR used for OpenShift/Kubernetes Pods.
  name: pod_cidr
  types:
  - <xref:str>
- description: The CIDR used for OpenShift/Kubernetes Services.
  name: service_cidr
  types:
  - <xref:str>
- description: 'The OutboundType used for egress traffic. Known values are: "Loadbalancer"

    and "UserDefinedRouting".'
  name: outbound_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OutboundType">]
- description: The cluster load balancer profile.
  name: load_balancer_profile
  types:
  - <xref:<xref:"LoadBalancerProfile">>
- description: 'Specifies whether subnets are pre-attached with an NSG. Known values

    are: "Disabled" and "Enabled".'
  name: preconfigured_nsg
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PreconfiguredNSG">]
attributes:
- uid: azure.mgmt.redhatopenshift.types.NetworkProfile.loadBalancerProfile
  name: loadBalancerProfile
  summary: The cluster load balancer profile.
  signature: 'loadBalancerProfile: LoadBalancerProfile'
- uid: azure.mgmt.redhatopenshift.types.NetworkProfile.outboundType
  name: outboundType
  summary: '"Loadbalancer" and

    "UserDefinedRouting".'
  signature: 'outboundType: str | OutboundType'
- uid: azure.mgmt.redhatopenshift.types.NetworkProfile.podCidr
  name: podCidr
  summary: The CIDR used for OpenShift/Kubernetes Pods.
  signature: 'podCidr: str'
- uid: azure.mgmt.redhatopenshift.types.NetworkProfile.preconfiguredNSG
  name: preconfiguredNSG
  summary: '"Disabled" and

    "Enabled".'
  signature: 'preconfiguredNSG: str | PreconfiguredNSG'
- uid: azure.mgmt.redhatopenshift.types.NetworkProfile.serviceCidr
  name: serviceCidr
  summary: The CIDR used for OpenShift/Kubernetes Services.
  signature: 'serviceCidr: str'
