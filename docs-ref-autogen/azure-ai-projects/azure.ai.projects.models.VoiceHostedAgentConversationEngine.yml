uid: azure.ai.projects.models.VoiceHostedAgentConversationEngine
name: VoiceHostedAgentConversationEngine
fullName: azure.ai.projects.models.VoiceHostedAgentConversationEngine
module: azure.ai.projects.models
summary: 'A closed reference to the hosted text agent that owns conversation handling
  for a voice agent.

  The hosted agent is resolved within the same project and must support the `invocations_ws`

  protocol, Voice Live compatibility, and Bridge Protocol 1.0.'
constructor:
  syntax: 'VoiceHostedAgentConversationEngine(*args: Any, **kwargs: Any)'
variables:
- description: 'Selects a hosted Foundry agent as the conversation engine. Required.
    Default value

    is "hosted_agent".'
  name: type
  types:
  - <xref:str>
- description: 'The non-empty DNS-like name of the target hosted text agent in the
    same project.

    Required.'
  name: name
  types:
  - <xref:str>
- description: 'The target agent version. Omit this property to select the latest
    version when

    the voice session starts. When supplied, use a positive integer or

    `draft-{positive-unix-timestamp}` whose numeric component fits in a signed 64-bit
    integer.'
  name: version
  types:
  - <xref:str>
