- uid: azure.ai.projects.aio.operations.BetaAgentsOperations.list_optimization_jobs
  name: list_optimization_jobs
  summary: 'List agent optimization jobs.


    Lists optimization jobs with cursor pagination and optional status or agent name
    filters.'
  signature: 'list_optimization_jobs(*, limit: int | None = None, order: str | PageOrder
    | None = None, before: str | None = None, status: str | JobStatus | None = None,
    agent_name: str | None = None, **kwargs: Any) -> AsyncItemPaged[OptimizationJobListItem]'
  keywordOnlyParameters:
  - name: limit
    description: 'A limit on the number of objects to be returned. Limit can range
      between 1 and

      100, and the

      default is 20. Default value is None.'
    defaultValue: None
    types:
    - <xref:int>
  - name: order
    description: 'Sort order by the `created_at` timestamp of the objects. `asc` for

      ascending order and``desc``

      for descending order. Known values are: "asc" and "desc". Default value is None.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:azure.ai.projects.models.PageOrder>
  - name: before
    description: 'A cursor for use in pagination. `before` is an object ID that defines
      your

      place in the list.

      For instance, if you make a list request and receive 100 objects, ending with
      obj_foo, your

      subsequent call can include before=obj_foo in order to fetch the previous page
      of the list.

      Default value is None.'
    defaultValue: None
    types:
    - <xref:str>
  - name: status
    description: 'Filter to jobs in this lifecycle state. Known values are: "queued",

      "in_progress", "succeeded", "failed", and "cancelled". Default value is None.'
