  name: cancel_optimization_job
  summary: 'Cancel an agent optimization job.


    Requests cancellation of a running or queued job and returns an error if the job
    is already in

    a terminal state.'
  signature: 'async cancel_optimization_job(job_id: str, **kwargs: Any) -> OptimizationJob'
  parameters:
  - name: job_id
    description: The ID of the job to cancel. Required.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: OptimizationJob. The OptimizationJob is compatible with MutableMapping
    types:
    - <xref:azure.ai.projects.models.OptimizationJob>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
- uid: azure.ai.projects.aio.operations.BetaAgentsOperations.delete_optimization_job
  name: delete_optimization_job
  summary: 'Delete an agent optimization job.


