- uid: azure.ai.projects.aio.operations.BetaAgentsOperations.begin_create_optimization_job
  name: begin_create_optimization_job
  summary: 'Create an agent optimization job.


    Creates an optimization job and returns the queued job. Honors `Operation-Id`
    for idempotent

    retry.'
  signature: 'async begin_create_optimization_job(job: _models.OptimizationJob, *,
    operation_id: str | None = None, content_type: str = ''application/json'', **kwargs:
    Any) -> AsyncLROPoller[_models.OptimizationJobResult]'
  parameters:
  - name: job
    description: 'The job to create. Is one of the following types: OptimizationJob,
      JSON, IO[bytes]

      Required.'
    isRequired: true
    types:
    - <xref:azure.ai.projects.models.OptimizationJob>
    - <xref:JSON>
    - <xref:typing.IO>[<xref:bytes>]
  keywordOnlyParameters:
  - name: operation_id
    description: 'Client-generated unique ID for idempotent retries. When absent,
      the

      server creates the job unconditionally. Default value is None.'
    defaultValue: None
    types:
    - <xref:str>
  return:
    description: 'An instance of AsyncLROPoller that returns OptimizationJobResult.
      The

      OptimizationJobResult is compatible with MutableMapping'
    types:
    - <xref:azure.core.polling.AsyncLROPoller>[<xref:azure.ai.projects.models.OptimizationJobResult>]
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
