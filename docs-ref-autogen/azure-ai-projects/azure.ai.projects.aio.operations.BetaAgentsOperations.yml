    types:
    - <xref:str>
    - <xref:azure.ai.projects.models.JobStatus>
  - name: agent_name
    description: Filter to jobs targeting this agent name. Default value is None.
    defaultValue: None
    types:
    - <xref:str>
  return:
    description: An iterator like instance of OptimizationJobListItem
    types:
    - <xref:azure.core.async_paging.AsyncItemPaged>[<xref:azure.ai.projects.models.OptimizationJobListItem>]
