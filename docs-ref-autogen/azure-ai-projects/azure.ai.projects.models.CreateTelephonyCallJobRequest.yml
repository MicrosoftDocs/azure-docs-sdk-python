    call. Agent-declared inputs are validated against their schemas; omitted optional
    inputs may

    use their Agent-defined default values, while omitted required inputs are rejected.
    Additional

    inputs remain available as dynamic template variables.'
  name: structured_inputs
  types:
  - <xref:dict>[<xref:str>, <xref:any>]
- description: The optional execution window.
  name: schedule
  types:
  - <xref:azure.ai.projects.models.TelephonyCallJobSchedule>
- description: 'The provider-attempt retry policy. Omit it for one attempt with no
    retry

    delay.'
  name: retry_policy
  types:
  - <xref:azure.ai.projects.models.TelephonyOutboundRetryPolicy>
