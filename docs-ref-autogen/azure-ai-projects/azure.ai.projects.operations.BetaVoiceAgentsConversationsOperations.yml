    description: The name of the agent. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: conversation_id
    description: The id of the conversation that contains the item. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: item_id
    description: 'The id of the conversation item whose generated audio metadata is
      retrieved.

      Required.'
    isRequired: true
    types:
    - <xref:str>
  return:
    description: VoiceGeneratedAudioItem. The VoiceGeneratedAudioItem is compatible
      with MutableMapping
    types:
    - <xref:azure.ai.projects.models.VoiceGeneratedAudioItem>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
- uid: azure.ai.projects.operations.BetaVoiceAgentsConversationsOperations.get_item
  name: get_item
  summary: 'Get a voice agent conversation item.


    Retrieves a single item from the specified conversation by its id, including its
    transcript. An

    `input_audio`/`output_audio` content part indicates that audio is available for
    the item;

    the canonical per-item audio metadata is the `/items/{item_id}/audio` resource,
    and the bytes

    are streamed by `/items/{item_id}/audio/content`. Returns `404` when the conversation
    or

    item was not persisted (`store = false`).'
  signature: 'get_item(agent_name: str, conversation_id: str, item_id: str, **kwargs:
    Any) -> RealtimeConversationItem'
  parameters:
  - name: agent_name
    description: The name of the agent. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: conversation_id
    description: The id of the conversation that contains the item. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: item_id
    description: The id of the conversation item to retrieve. Required.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: 'RealtimeConversationItem. The RealtimeConversationItem is compatible
      with

      MutableMapping'
    types:
    - <xref:azure.ai.projects.models.RealtimeConversationItem>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
