- uid: azure.ai.projects.operations.BetaVoiceAgentsConversationsOperations.list
  name: list
  summary: 'List voice agent conversations.


    Returns the conversations persisted for the specified voice agent endpoint. Conversations
    are

    present when the session''s effective `store` setting is `true`, whether inherited
    from the

    agent definition or enabled by the WebSocket session override.'
  signature: 'list(agent_name: str, *, limit: int | None = None, order: str | PageOrder
    | None = None, before: str | None = None, **kwargs: Any) -> ItemPaged[VoiceConversation]'
  parameters:
  - name: agent_name
    description: The name of the agent. Required.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: limit
    description: 'A limit on the number of objects to be returned. Limit can range
      between 1 and

      100, and the

      default is 20. Default value is None.'
    defaultValue: None
    types:
    - <xref:int>
  - name: order
    description: 'Sort order by the `created_at` timestamp of the objects. `asc` for

      ascending order and``desc``

      for descending order. Known values are: "asc" and "desc". Default value is None.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:azure.ai.projects.models.PageOrder>
  - name: before
    description: 'A cursor for use in pagination. `before` is an object ID that defines
      your

      place in the list.

      For instance, if you make a list request and receive 100 objects, ending with
      obj_foo, your

      subsequent call can include before=obj_foo in order to fetch the previous page
      of the list.

      Default value is None.'
    defaultValue: None
    types:
    - <xref:str>
  return:
    description: An iterator like instance of VoiceConversation
    types:
    - <xref:azure.core.paging.ItemPaged>[<xref:azure.ai.projects.models.VoiceConversation>]
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
