  - name: conversation_id
    description: The id of the conversation that contains the item. Required.
    isRequired: true
    types:
    - <xref:str>
  - name: item_id
    description: The id of the conversation item whose audio metadata is retrieved.
      Required.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: VoiceAudioItem. The VoiceAudioItem is compatible with MutableMapping
    types:
    - <xref:azure.ai.projects.models.VoiceAudioItem>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
- uid: azure.ai.projects.operations.BetaVoiceAgentsConversationsOperations.get_generated_audio_item
  name: get_generated_audio_item
  summary: 'Get a voice agent conversation item''s generated audio metadata.


    Returns metadata for a conversation item''s generated audio. This subordinate
    artifact is

    separate from the canonical heard-audio segment and exists only when playback
