    and the service rendered more audio than the listener heard, including when the
    response ends

    as cancelled. Returns `404` when the conversation or item was not persisted, or
    when no

    generated audio exists beyond the heard segment.'
  signature: 'get_generated_audio_item(agent_name: str, conversation_id: str, item_id:
