### YamlMime:PythonClass
uid: azure.ai.projects.models.VoiceAgentRealtimeResponse
name: VoiceAgentRealtimeResponse
fullName: azure.ai.projects.models.VoiceAgentRealtimeResponse
module: azure.ai.projects.models
summary: 'A live realtime response returned by the voice-agent service in both `response.created`
  and

  `response.done` events.'
constructor:
  syntax: 'VoiceAgentRealtimeResponse(*args: Any, **kwargs: Any)'
variables:
- description: The unique ID of the response, will look like `resp_1234`.
  name: id
  types:
  - <xref:str>
- description: 'The object type, must be `realtime.response`. Default value is

    "realtime.response".'
  name: object
  types:
  - <xref:str>
- description: 'The final status of the response (`completed`, `cancelled`, `failed`,
    or

    `incomplete`, `in_progress`). Is one of the following types: Literal["completed"],

    Literal["cancelled"], Literal["failed"], Literal["incomplete"], Literal["in_progress"]'
  name: status
  types:
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
- description: Additional details about the status.
  name: status_details
  types:
  - <xref:azure.ai.projects.models.RealtimeResponseStatusDetails>
- name: metadata
  types:
  - <xref:azure.ai.projects.models.Metadata>
- description: 'Usage statistics for the Response, this will correspond to billing.
    A Realtime API

    session will maintain a conversation context and append new Items to the Conversation,
    thus

    output from previous turns (text and audio tokens) will become the input for later
    turns.'
  name: usage
  types:
  - <xref:azure.ai.projects.models.RealtimeResponseUsage>
- description: 'Which conversation the response is added to, determined by the

    `conversation` field in the `response.create` event. If `auto`, the response will
    be

    added to the default conversation and the value of `conversation_id` will be an
    id like

    `conv_1234`. If `none`, the response will not be added to any conversation and
    the value of

    `conversation_id` will be `null`. If responses are being triggered automatically
    by VAD the

    response will be added to the default conversation.'
  name: conversation_id
  types:
  - <xref:str>
- description: 'The set of modalities the model used to respond, currently the only

    possible values are `[\"audio\"]`, `[\"text\"]`. Audio output always include a
    text

    transcript. Setting the output to mode `text` will disable audio output from the
    model.'
  name: output_modalities
  types:
  - <xref:list>[<xref:str>
  - <xref:str>]
- description: 'Maximum number of output tokens for a single assistant response,

    inclusive of tool calls, that was used in this response. Is either a int type
    or a

    Literal["inf"] type.'
  name: max_output_tokens
  types:
  - <xref:int>
  - <xref:str>
- description: 'The audio configuration used by the live response, including flat
    voice provider,

    locale, and format fields under `output`.'
  name: audio
  types:
  - <xref:azure.ai.projects.models.VoiceResponseAudio>
- description: The items produced by the live response.
  name: output
  types:
  - <xref:list>[<xref:azure.ai.projects.models.RealtimeConversationItem>]
