uid: azure.ai.projects.models.VoiceConversationStatus
name: VoiceConversationStatus
fullName: azure.ai.projects.models.VoiceConversationStatus
summary: "The lifecycle status of a persisted voice conversation:\n\n* *in_progress*:\
  \ the live session is active, or post-session persistence finalization is pending.\
  \ \n\n* *completed*: finalization succeeded after normal or client close, *end_conversation*,\
  \ a max-duration *1001* close, or a client or network disconnect that the service\
  \ can still finalize. \n\n* *failed*: a terminal service, bridge, storage, or unrecoverable\
  \ transport failure prevented finalization."
module: azure.ai.projects.models
fields:
- name: COMPLETED
  uid: azure.ai.projects.models.VoiceConversationStatus.COMPLETED
- name: FAILED
  uid: azure.ai.projects.models.VoiceConversationStatus.FAILED
- name: IN_PROGRESS
  uid: azure.ai.projects.models.VoiceConversationStatus.IN_PROGRESS
