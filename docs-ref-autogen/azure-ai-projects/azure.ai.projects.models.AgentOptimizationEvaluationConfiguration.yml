uid: azure.ai.projects.models.AgentOptimizationEvaluationConfiguration
name: AgentOptimizationEvaluationConfiguration
fullName: azure.ai.projects.models.AgentOptimizationEvaluationConfiguration
module: azure.ai.projects.models
summary: Reusable quality-measurement configuration.
constructor:
  syntax: 'AgentOptimizationEvaluationConfiguration(*args: Any, **kwargs: Any)'
variables:
- description: 'Evaluation set used to guide the optimization search. Inline data
    supports

    up to 2,000 test cases when a separate validation set is supplied; otherwise it
    is also used

    for validation and is limited to 500. Required.'
  name: training_set
  types:
  - <xref:azure.ai.projects.models.AgentOptimizationEvaluationSet>
- description: 'Held-out evaluation set used for full candidate evaluation, limited
    to

    500 inline test cases. The training set is reused and subject to the same 500-test-case

    validation limit when omitted.'
  name: validation_set
  types:
  - <xref:azure.ai.projects.models.AgentOptimizationEvaluationSet>
- description: Evaluator references used to score candidate quality. Required.
  name: evaluators
  types:
  - <xref:list>[<xref:azure.ai.projects.models.AgentOptimizationEvaluator>]
- description: 'Model configuration used by model-based evaluators and conversation

    simulation. Required.'
  name: evaluation_model
  types:
  - <xref:azure.ai.projects.models.EvaluationModelConfiguration>
- description: 'Maximum number of target-agent runs executed concurrently

    during each single-turn evaluation. If omitted, the service defaults to 1. Conversation

    evaluation supports only 1.'
  name: max_concurrent_agent_runs
  types:
  - <xref:int>
