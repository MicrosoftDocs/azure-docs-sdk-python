### YamlMime:PythonClass
uid: azure.ai.projects.models.VoiceRecording
name: VoiceRecording
fullName: azure.ai.projects.models.VoiceRecording
module: azure.ai.projects.models
summary: 'Metadata for the merged, whole-call stereo recording of a voice conversation
  (user audio on the

  left channel, agent audio on the right). Built once from the per-turn segments after
  the

  session ends and durably cached. The common metadata (format, sample rate, channels,
  channel

  layout, duration) is returned for both Foundry-managed and bring-your-own-storage
  (BYOS)

  recordings. For BYOS the response also includes `blob_uri`, the URI of the recording
  in the

  customer''s own storage (no SAS token), which the customer downloads using their
  own storage

  credentials. For Foundry-managed storage `blob_uri` is absent and the bytes are
  streamed via

  the `/audio/content` route instead.'
constructor:
  syntax: 'VoiceRecording(*args: Any, **kwargs: Any)'
variables:
- description: The id of the conversation this recording belongs to. Required.
  name: conversation_id
  types:
  - <xref:str>
- description: The container format of the recording. Required. "wav"
  name: format
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.VoiceAudioContainerFormat>
- description: The sample rate of the recording in Hz, e.g. 24000. Required.
  name: sample_rate
  types:
  - <xref:int>
- description: The number of audio channels. The merged recording is stereo (`2`).
    Required.
  name: channels
  types:
  - <xref:int>
- description: The role assigned to each stereo channel. Required.
  name: channel_layout
  types:
  - <xref:azure.ai.projects.models.VoiceRecordingChannelLayout>
- description: The total duration of the recording. Required.
  name: duration_ms
  types:
  - <xref:datetime.timedelta>
- description: 'For bring-your-own-storage (BYOS) recordings only: the URI of the
    recording in

    the customer''s own storage, without a SAS token. The customer downloads it using
    their own

    storage credentials. Absent for Foundry-managed storage, where the bytes are streamed
    via the

    `/audio/content` route instead.'
  name: blob_uri
  types:
  - <xref:str>
