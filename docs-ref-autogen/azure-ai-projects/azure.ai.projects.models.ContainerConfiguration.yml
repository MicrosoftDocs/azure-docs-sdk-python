uid: azure.ai.projects.models.ContainerConfiguration
name: ContainerConfiguration
fullName: azure.ai.projects.models.ContainerConfiguration
module: azure.ai.projects.models
summary: Container-based deployment configuration for a hosted agent.
constructor:
  syntax: 'ContainerConfiguration(*args: Any, **kwargs: Any)'
variables:
- description: The container image for the hosted agent. Required.
  name: image
  types:
  - <xref:str>
- description: "The id (or name) of the Foundry project connection that provides\n\
    the credentials used to authenticate to the private container registry hosting\
    \ `image`. The\nconnection abstracts the auth mechanism \u2014 for example a managed-identity-federated\
    \ token\nexchange, or a username/token secret \u2014 so registry credentials are\
    \ never part of the agent\ndefinition. Omit for public images or registries already\
    \ reachable by the platform's default\nidentity (for example, Azure Container\
    \ Registry)."
  name: registry_connection_id
  types:
  - <xref:str>
