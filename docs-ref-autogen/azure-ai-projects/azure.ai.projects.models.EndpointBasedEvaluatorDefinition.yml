- description: 'Required. Endpoint-based evaluator definition. References a customer-owned
    HTTP

    endpoint via a Project Connection.'
  name: type
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.ENDPOINT>
- description: 'Name of the Project Connection that stores the endpoint URL and

    credentials. The connection must exist on the project and have a non-empty target
    URL.

    Supported auth types: ApiKey (sends `api-key` header) and AAD/Entra ID (acquires
    a bearer

    token via the project''s Managed Identity). Required.'
  name: connection_name
  types:
  - <xref:str>
