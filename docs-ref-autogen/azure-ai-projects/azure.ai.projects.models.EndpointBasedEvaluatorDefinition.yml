uid: azure.ai.projects.models.EndpointBasedEvaluatorDefinition
name: EndpointBasedEvaluatorDefinition
fullName: azure.ai.projects.models.EndpointBasedEvaluatorDefinition
module: azure.ai.projects.models
summary: 'Endpoint-based evaluator definition. The customer owns and hosts an HTTP
  endpoint that

  implements the evaluation contract. The evaluator references a Project Connection
  by name; the

  connection stores the endpoint URL and credentials (API Key or Entra ID). At execution
  time,

  the service resolves the connection to obtain the endpoint URL and authentication
  details, then

  calls the endpoint for each evaluation row.'
constructor:
  syntax: 'EndpointBasedEvaluatorDefinition(*args: Any, **kwargs: Any)'
variables:
- description: 'The JSON schema (Draft 2020-12) for the evaluator''s input parameters.

    This includes parameters like type, properties, required.'
