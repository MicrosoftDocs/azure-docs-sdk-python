uid: azure.ai.projects.models.RealtimeServerEventConversationItemTruncated
name: RealtimeServerEventConversationItemTruncated
fullName: azure.ai.projects.models.RealtimeServerEventConversationItemTruncated
module: azure.ai.projects.models
summary: 'Returned when an earlier assistant audio message item is truncated by the
  client with a

  `conversation.item.truncate` event. This event is used to synchronize the server''s

  understanding of the audio with the client''s playback. This action will truncate
  the audio and

  remove the server-side text transcript to ensure there is no text in the context
  that hasn''t

  been heard by the user.'
constructor:
  syntax: 'RealtimeServerEventConversationItemTruncated(*args: Any, **kwargs: Any)'
variables:
- description: The unique ID of the server event. Required.
  name: event_id
  types:
  - <xref:str>
- description: 'The event type, must be `conversation.item.truncated`. Required.

    CONVERSATION_ITEM_TRUNCATED.'
  name: type
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.CONVERSATION_ITEM_TRUNCATED>
- description: The ID of the assistant message item that was truncated. Required.
  name: item_id
  types:
  - <xref:str>
- description: The index of the content part that was truncated. Required.
  name: content_index
  types:
  - <xref:int>
- description: 'The duration up to which the audio was truncated, in milliseconds.

    Required.'
  name: audio_end_ms
  types:
  - <xref:int>
- description: The assistant message after truncation, when the service returns the
    updated item.
  name: item
  types:
