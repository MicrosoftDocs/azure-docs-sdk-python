- uid: azure.ai.projects.operations.AgentsOperations.disable
  name: disable
  summary: "Disable an agent.\n\nDisables the specified agent, preventing it from\
    \ accepting new sessions or processing requests.\nExisting active sessions are\
    \ allowed to drain gracefully but no new sessions can be created.\nThis operation\
    \ is idempotent \u2014 disabling an already-disabled agent returns success with\
    \ no side\neffects."
  signature: 'disable(agent_name: str, **kwargs: Any) -> None'
  parameters:
  - name: agent_name
    description: The name of the agent to disable. Required.
    isRequired: true
    types:
    - <xref:str>
  return:
    description: None
    types:
    - <xref:None>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
- uid: azure.ai.projects.operations.AgentsOperations.download_code
  name: download_code
  summary: 'Download agent code.


    Downloads the code zip for a code-based hosted agent.

    Returns the previously-uploaded zip (`application/zip`).


    If `agent_version` is supplied, returns that version''s code zip; otherwise

    returns the latest version''s code zip.


    The SHA-256 digest of the returned bytes matches the `content_hash` on the

    resolved version''s `code_configuration`.'
  signature: 'download_code(agent_name: str, *, agent_version: str | None = None,
    **kwargs: Any) -> Iterator[bytes]'
  parameters:
  - name: agent_name
    description: The name of the agent. Required.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: agent_version
    description: 'The version of the agent whose code zip should be downloaded.

      If omitted, the latest version''s code zip is returned. Default value is None.'
    defaultValue: None
    types:
    - <xref:str>
  return:
    description: Iterator[bytes]
    types:
    - <xref:typing.Iterator>[<xref:bytes>]
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
