- uid: azure.ai.projects.operations.AgentsOperations.create_version_from_code
  name: create_version_from_code
  summary: 'Create an agent version from code.


    Creates a new agent version from code. Uploads the code zip and creates a new
    version for an

    existing agent. The SHA-256 hex digest of the zip is provided in the `x-ms-code-zip-sha256`

    header for integrity and dedup. The request body is multipart/form-data with a
    JSON metadata

    part and a binary code part (part order is irrelevant). Maximum upload size is
    250 MB.'
  signature: 'create_version_from_code(agent_name: str, *, definition: HostedAgentDefinition,
    code: IO[bytes], code_zip_sha256: str | None = None, description: str | None =
    None, metadata: dict[str, str] | None = None, **kwargs: Any) -> AgentVersionDetails'
  parameters:
  - name: agent_name
    description: "The unique name that identifies the agent. Name can be used to\n\
      retrieve/update/delete the agent.\n\n* Must start and end with alphanumeric\
      \ characters, \n\n* Can contain hyphens in the middle \n\n* Must not exceed\
      \ 63 characters. Required."
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: definition
    description: 'The hosted agent definition including code_configuration (runtime,

      entry_point), cpu, memory, and protocol_versions. Required.'
    types:
    - <xref:azure.ai.projects.models.HostedAgentDefinition>
  - name: code
    description: 'The code zip file stream (max 250 MB). Required. The stream must

      expose a `name` attribute (for example, a stream returned by

      <xref:pathlib.Path.open>) and that name must end with `.zip`.'
    types:
    - <xref:typing.IO>[<xref:bytes>]
  - name: code_zip_sha256
    description: 'SHA-256 hex digest of the uploaded code zip. Used for change

      detection (dedup) and integrity verification. If not provided, it will be calculated

      automatically from the code content. Default value is None.'
    defaultValue: None
    types:
    - <xref:str>
  - name: description
    description: A human-readable description of the agent. Default value is None.
    defaultValue: None
    types:
    - <xref:str>
  - name: metadata
    description: 'Set of 16 key-value pairs that can be attached to an object. This
      can be

      useful for storing additional information about the object in a structured

      format, and querying for objects via API or the dashboard.


      Keys are strings with a maximum length of 64 characters. Values are strings

      with a maximum length of 512 characters. Default value is None.'
    defaultValue: None
    types:
    - <xref:dict>[<xref:str>, <xref:str>]
  return:
    description: AgentVersionDetails. The AgentVersionDetails is compatible with MutableMapping
    types:
    - <xref:azure.ai.projects.models.AgentVersionDetails>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
