- uid: azure.ai.projects.operations.AgentsOperations.delete
  name: delete
  summary: 'Delete an agent.


    Deletes an agent. For hosted agents, if any version has active sessions, the request
    is

    rejected with HTTP 409 unless `force` is set to true. When force is true, all
    associated

    sessions are cascade-deleted along with the agent and its versions.'
  signature: 'delete(agent_name: str, *, force: bool | None = None, **kwargs: Any)
    -> DeleteAgentResponse'
  parameters:
  - name: agent_name
    description: The name of the agent to delete. Required.
    isRequired: true
    types:
    - <xref:str>
  keywordOnlyParameters:
  - name: force
    description: 'For Hosted Agents, if `true`, force-deletes the agent even if its
      versions

      have active sessions, cascading deletion to all associated sessions. The service
      defaults to

      `false` if a value is not specified by the caller. This value is not relevant
      for other Agent

      types. Default value is None.'
    defaultValue: None
    types:
    - <xref:bool>
  return:
    description: DeleteAgentResponse. The DeleteAgentResponse is compatible with MutableMapping
    types:
    - <xref:azure.ai.projects.models.DeleteAgentResponse>
  exceptions:
  - type: azure.core.exceptions.HttpResponseError
