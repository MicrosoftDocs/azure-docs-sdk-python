### YamlMime:PythonClass
uid: azure.ai.projects.models.TelephonyCallLifecycleEvent
name: TelephonyCallLifecycleEvent
fullName: azure.ai.projects.models.TelephonyCallLifecycleEvent
module: azure.ai.projects.models
summary: A bounded durable observation in the lifecycle of one telephony call.
constructor:
  syntax: 'TelephonyCallLifecycleEvent(*args: Any, **kwargs: Any)'
variables:
- description: The service-assigned order of the event within the call record. Required.
  name: sequence
  types:
  - <xref:int>
- description: 'The stable provider-neutral event name. Required. Known values are:

    "telephony.webhook.received", "telephony.webhook.validation", "telephony.binding.resolve",

    "telephony.provider.answer", "telephony.media.connect", "telephony.agent_session.connect",

    "telephony.media.first_caller_audio", "telephony.media.first_agent_audio",

    "telephony.call.transfer", "telephony.call.hangup", and "telephony.call.disconnect".'
  name: name
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.TelephonyCallLifecycleEventName>
- description: 'The component that supplied the observation. Required. Known values
    are:

    "gateway", "teams_phone_extension", "twilio", and "voice_agent".'
  name: source
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.TelephonyCallLifecycleEventSource>
- description: 'The outcome of the observed lifecycle operation. Required. Known values
    are:

    "observed", "started", "succeeded", "failed", "rejected", and "cancelled".'
  name: outcome
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.TelephonyCallLifecycleEventOutcome>
- description: 'The Unix timestamp (in seconds) for when the service observed the
    event.

    Required.'
  name: observed_at
  types:
  - <xref:datetime.datetime>
- description: 'The Unix timestamp (in seconds) for when the event occurred according
    to the

    provider.'
  name: occurred_at
  types:
  - <xref:datetime.datetime>
- description: 'The source of the event timestamp. Required. Known values are:

    "provider", "gateway", and "derived".'
  name: timestamp_source
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.TelephonyCallTimestampSource>
- description: 'A stable service-generated reason associated with this lifecycle event,
    not

    necessarily the final outcome of the call. Additional string codes may be returned.
    Known

    values are: "invalid_webhook_payload", "webhook_validation_failed", "binding_not_found",

    "binding_suspended", "admission_rejected", "admission_check_failed", "route_agent_mismatch",

    "invalid_binding_configuration", "credential_resolution_failed", "provider_resource_mismatch",

    "endpoint_resolution_failed", "ingress_setup_failed", "live_call_conflict",

    "live_call_persistence_failed", "answer_failed", "provider_disconnected", "provider_busy",

    "provider_no_answer", "provider_cancelled", "provider_failed", "provider_stream_error",

    "provider_stream_stopped", "agent_session_connect_failed", "media_stream_ended",

    "bridge_cancelled", "bridge_failed", "managed_hangup", "managed_transfer",

    "manage_hangup_failed", and "manage_transfer_failed".'
  name: reason
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.TelephonyCallLifecycleEventReason>
- description: The provider event identifier used for idempotency, when supplied.
  name: provider_event_id
  types:
  - <xref:str>
- description: The provider event sequence, when supplied.
  name: provider_sequence
  types:
  - <xref:int>
- description: The provider status code associated with the event.
  name: provider_status_code
  types:
  - <xref:int>
- description: The provider subcode associated with the event.
  name: provider_sub_code
  types:
  - <xref:int>
