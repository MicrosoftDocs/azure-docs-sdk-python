### YamlMime:PythonClass
uid: azure.ai.projects.operations.BetaRealtimeConnectionManager
name: BetaRealtimeConnectionManager
fullName: azure.ai.projects.operations.BetaRealtimeConnectionManager
module: azure.ai.projects.operations
summary: 'Context manager that opens a <xref:azure.ai.projects.operations.BetaRealtimeConnection>.


  Returned by <xref:azure.ai.projects.operations.BetaRealtime.connect>; you normally
  use it as

  `with client.beta.voice_agents.realtime.connect(...) as conn:`.'
constructor:
  syntax: 'BetaRealtimeConnectionManager(*, endpoint: str, credential: TokenCredential,
    credential_scopes: List[str], api_version: str, agent_name: str, agent_session_id:
    str | None = None, structured_inputs: Mapping[str, Any] | None = None, connection_url:
    str | None = None, extra_query: Mapping[str, str] | None = None, extra_headers:
    Mapping[str, str] | None = None, **kwargs: Any)'
  keywordOnlyParameters:
  - name: endpoint
    isRequired: true
  - name: credential
    isRequired: true
  - name: credential_scopes
    isRequired: true
  - name: api_version
    isRequired: true
  - name: agent_name
    isRequired: true
  - name: agent_session_id
    defaultValue: None
  - name: structured_inputs
    defaultValue: None
  - name: connection_url
    defaultValue: None
  - name: extra_query
    defaultValue: None
  - name: extra_headers
    defaultValue: None
methods:
- uid: azure.ai.projects.operations.BetaRealtimeConnectionManager.enter
  name: enter
  summary: Open the connection.
  signature: enter() -> BetaRealtimeConnection
  return:
    description: The live realtime connection.
    types:
    - <xref:azure.ai.projects.BetaRealtimeConnection>
  exceptions:
  - type: RuntimeError
    description: If `websockets` is not installed.
  - type: ValueError
    description: If the computed or supplied WebSocket URL does not use `wss://`
  - type: ConnectionError
    description: 'If the WebSocket upgrade handshake fails (for example, a

      network error, DNS failure, or a non-101 response from the service).'
