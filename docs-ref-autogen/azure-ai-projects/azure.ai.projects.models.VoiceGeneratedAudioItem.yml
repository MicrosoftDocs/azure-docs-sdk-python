### YamlMime:PythonClass
uid: azure.ai.projects.models.VoiceGeneratedAudioItem
name: VoiceGeneratedAudioItem
fullName: azure.ai.projects.models.VoiceGeneratedAudioItem
module: azure.ai.projects.models
summary: 'Metadata for a conversation item''s generated audio. For bring-your-own-storage
  (BYOS), the

  response includes `blob_uri`, a direct customer-storage URI without a SAS token,
  that the

  customer accesses with their own credentials. For Foundry-managed storage, `blob_uri`
  is

  absent and the bytes are streamed through the item''s `/audio/generated/content`
  route.'
constructor:
  syntax: 'VoiceGeneratedAudioItem(*args: Any, **kwargs: Any)'
variables:
- description: The id of the conversation the item belongs to. Required.
  name: conversation_id
  types:
  - <xref:str>
- description: The id of the item this audio belongs to. Required.
  name: item_id
  types:
  - <xref:str>
- description: 'The role the audio belongs to. Known values are: "user" and "agent".'
  name: role
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.VoiceAudioRole>
- description: The container format of the audio. "wav"
  name: format
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.VoiceAudioContainerFormat>
- description: 'The audio codec. Known values are: "pcm16", "pcmu", and "pcma".'
  name: codec
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.VoiceAudioCodec>
- description: The sample rate in Hz.
  name: sample_rate
  types:
  - <xref:int>
- description: The number of audio channels.
  name: channels
  types:
  - <xref:int>
- description: The offset from the session start at which this segment begins.
  name: start_offset_ms
  types:
  - <xref:datetime.timedelta>
- description: The duration of the audio segment.
  name: duration_ms
  types:
  - <xref:datetime.timedelta>
- description: 'For bring-your-own-storage (BYOS) recordings only: the URI of the
    generated

    audio in the customer''s own storage, without a SAS token. The customer downloads
    it using their

    own storage credentials. Absent for Foundry-managed storage, where the bytes are
    streamed via

    the item''s `/audio/generated/content` route instead.'
  name: blob_uri
  types:
  - <xref:str>
