### YamlMime:PythonClass
uid: azure.ai.projects.models.VoiceAgentResponseCreateParams
name: VoiceAgentResponseCreateParams
fullName: azure.ai.projects.models.VoiceAgentResponseCreateParams
module: azure.ai.projects.models
summary: Parameters accepted by a voice-agent `response.create` event.
constructor:
  syntax: 'VoiceAgentResponseCreateParams(*args: Any, **kwargs: Any)'
variables:
- description: 'The default system instructions (i.e. system message) prepended to
    model

    calls. This field allows the client to guide the model on desired responses. The
    model can be

    instructed on response content and format, (e.g. "be extremely succinct", "act
    friendly", "here

    are examples of good responses") and on audio behavior (e.g. "talk quickly", "inject
    emotion

    into your voice", "laugh frequently"). The instructions are not guaranteed to
    be followed by

    the model, but they provide guidance to the model on the desired behavior. Note
    that the server

    sets default instructions which will be used if this field is not set and are
    visible in the

    `session.created` event at the start of the session.'
  name: instructions
  types:
  - <xref:str>
- description: Tools available to the model.
  name: tools
  types:
  - <xref:list>[<xref:azure.ai.projects.models.RealtimeFunctionTool>
  - <xref:azure.ai.projects.models.MCPTool>]
- description: 'How the model chooses tools. Provide one of the string modes or force
    a

    specific function/MCP tool. Is one of the following types: Union[str,

    "_models.ToolChoiceOptions"], ToolChoiceFunction, ToolChoiceMCP'
  name: tool_choice
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.ToolChoiceOptions>
  - <xref:azure.ai.projects.models.ToolChoiceFunction>
  - <xref:azure.ai.projects.models.ToolChoiceMCP>
- description: 'Whether the model may call multiple tools in parallel. Only

    supported by reasoning Realtime models such as `gpt-realtime-2`.'
  name: parallel_tool_calls
  types:
  - <xref:bool>
- name: reasoning
  types:
  - <xref:azure.ai.projects.models.RealtimeReasoning>
- description: 'Maximum number of output tokens for a single assistant response,

    inclusive of tool calls. Provide an integer between 1 and 4096 to limit output
    tokens, or

    `inf` for the maximum available tokens for a given model. Defaults to `inf`. Is
    either a

    int type or a Literal["inf"] type.'
  name: max_output_tokens
  types:
  - <xref:int>
  - <xref:str>
- description: 'Controls which conversation the response is added to. Currently supports

    `auto` and `none`, with `auto` as the default value. The `auto` value means that
    the

    contents of the response will be added to the default conversation. Set this to
    `none` to

    create an out-of-band response which will not add items to default conversation.
    Is one of the

    following types: Literal["auto"], Literal["none"], str'
  name: conversation
  types:
  - <xref:str>
  - <xref:str>
  - <xref:str>
- name: metadata
  types:
  - <xref:azure.ai.projects.models.Metadata>
- description: Modalities that the response may return.
  name: output_modalities
  types:
  - <xref:list>[<xref:str>
  - <xref:azure.ai.projects.models.VoiceOutputModality>]
- description: Response-specific audio settings.
  name: audio
  types:
  - <xref:azure.ai.projects.models.PickPropertiesVoiceAgentAudioConfig>
- description: Conversation items used as inline response input.
  name: input
  types:
  - <xref:list>[<xref:azure.ai.projects.models.RealtimeConversationItem>]
- description: 'A pre-generated assistant message used to begin the

    response.'
  name: pre_generated_assistant_message
  types:
  - <xref:azure.ai.projects.models.RealtimeConversationItem>
- description: Interim-response settings for this response.
  name: interim_response
  types:
  - <xref:azure.ai.projects.models.VoiceAgentInterimResponseConfig>
