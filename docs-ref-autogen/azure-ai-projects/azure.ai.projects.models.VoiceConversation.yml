### YamlMime:PythonClass
uid: azure.ai.projects.models.VoiceConversation
name: VoiceConversation
fullName: azure.ai.projects.models.VoiceConversation
module: azure.ai.projects.models
summary: 'A persisted voice conversation. The Foundry envelope that owns a voice agent''s
  stored

  transcript, responses, per-turn metrics, and audio. It is the parent, retention,
  and delete

  boundary: deleting it cascades to its responses, items, metrics, and audio. When
  finalization

  fails, any partial persisted responses, items, and item audio remain readable.'
constructor:
  syntax: 'VoiceConversation(*args: Any, **kwargs: Any)'
variables:
- description: The unique id of the conversation. Required.
  name: id
  types:
  - <xref:str>
- description: 'The object type. Always `voice.conversation`. Required. Default value
    is

    "voice.conversation".'
  name: object
  types:
  - <xref:str>
- description: 'The lifecycle status of the conversation. Required. Known values are:

    "in_progress", "completed", and "failed".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.VoiceConversationStatus>
- description: 'The Unix timestamp (in seconds) for when the conversation was created.

    Required.'
  name: created_at
  types:
  - <xref:datetime.datetime>
- description: 'The Unix timestamp (in seconds) for when session and persistence

    finalization reached the terminal `completed` or `failed` status. Absent while
    `status`

    is `in_progress`.'
  name: completed_at
  types:
  - <xref:datetime.datetime>
- description: A set of key-value pairs attached to the conversation.
  name: metadata
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'Final aggregate token usage across all responses in this conversation.
    Absent

    while `status` is `in_progress` and populated after successful `completed` finalization;

    it may be absent when `status` is `failed`, and values are not guaranteed to be
    reported

    incrementally.'
  name: usage
  types:
  - <xref:azure.ai.projects.models.RealtimeResponseUsage>
- description: 'The terminal error that prevented persistence finalization. Present
    only when

    `status` is `failed`.'
  name: last_error
  types:
  - <xref:azure.ai.projects.models.ApiError>
