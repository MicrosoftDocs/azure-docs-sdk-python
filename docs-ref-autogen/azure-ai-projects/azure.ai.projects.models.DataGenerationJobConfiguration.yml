summary: 'Configuration for managing data generation jobs.


  You probably want to use the sub-classes and not this class directly. Known sub-classes
  are:

  SimpleQnADataGenerationJobConfiguration, SimulationSeedDataGenerationJobConfiguration,

  ToolUseFineTuningDataGenerationJobConfiguration, TracesDataGenerationJobConfiguration'
constructor:
  syntax: 'DataGenerationJobConfiguration(*args: Any, **kwargs: Any)'
variables:
- description: 'The data generation job type. Required. Known values are: "simple_qna",
    "traces",

    "tool_use", and "simulation_seed".'
  name: type
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.DataGenerationJobType>
- description: 'The proportion of the generated data to be used for training when
    the data

    is used for fine-tuning. The rest will be used for validation. Value should be
    between 0 and 1.'
  name: train_split
  types:
