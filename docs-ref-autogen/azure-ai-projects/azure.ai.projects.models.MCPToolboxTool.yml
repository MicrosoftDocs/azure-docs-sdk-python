- description: 'Per-tool configuration map. Keys are tool names or `*` (catch-all

    default). Resolution order: exact tool name match takes priority over `*`. Unknown
    tool names

    are silently ignored at runtime.'
  name: tool_configs
  types:
  - <xref:dict>[<xref:str>, <xref:azure.ai.projects.models.ToolConfig>]
- description: Required. MCP.
