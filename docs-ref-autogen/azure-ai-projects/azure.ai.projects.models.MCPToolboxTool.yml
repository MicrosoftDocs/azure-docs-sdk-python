  types:
  - <xref:str>
- description: "Identifier for service connectors, like those available in ChatGPT.\
    \ One of\n`server_url`, `connector_id`, or `tunnel_id` must be provided. Learn\
    \ more about service\nconnectors [here](/docs/guides/tools-remote-mcp#connectors).\
    \ Currently supported\n`connector_id` values are:\n\n* Dropbox: *connector_dropbox*\
    \ \n\n* Gmail: *connector_gmail* \n\n* Google Calendar: *connector_googlecalendar*\
    \ \n\n* Google Drive: *connector_googledrive* \n\n* Microsoft Teams: *connector_microsoftteams*\
    \ \n\n* Outlook Calendar: *connector_outlookcalendar* \n\n* Outlook Email: *connector_outlookemail*\
    \ \n\n* SharePoint: *connector_sharepoint*. Is one of the following types: Literal[\"\
    connector_dropbox\"], Literal[\"connector_gmail\"], Literal[\"connector_googlecalendar\"\
    ], Literal[\"connector_googledrive\"], Literal[\"connector_microsoftteams\"],\
    \ Literal[\"connector_outlookcalendar\"], Literal[\"connector_outlookemail\"],\
    \ Literal[\"connector_sharepoint\"]"
  name: connector_id
  types:
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
- description: 'The Secure MCP Tunnel ID to use instead of a direct server URL. One
    of

    `server_url`, `connector_id`, or `tunnel_id` must be provided.'
  name: tunnel_id
  types:
  - <xref:str>
- description: 'An OAuth access token that can be used with a remote MCP server, either

    with a custom MCP server URL or a service connector. Your application must handle
    the OAuth

    authorization flow and provide the token here.'
  name: authorization
  types:
  - <xref:str>
- description: Optional description of the MCP server, used to provide more context.
  name: server_description
  types:
  - <xref:str>
- name: headers
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Is either a [str] type or a MCPToolFilter type.
  name: allowed_tools
  types:
  - <xref:list>[<xref:str>]
  - <xref:azure.ai.projects.models.MCPToolFilter>
- name: allowed_callers
  types:
  - <xref:list>[<xref:str>
  - <xref:azure.ai.projects.models.CallableToolAllowedCaller>]
- description: 'Is one of the following types: MCPToolRequireApproval,

    Literal["always"], Literal["never"]'
  name: require_approval
  types:
  - <xref:azure.ai.projects.models.MCPToolRequireApproval>
  - <xref:str>
  - <xref:str>
- description: Whether this MCP tool is deferred and discovered via tool search.
  name: defer_loading
  types:
  - <xref:bool>
- description: 'The connection ID in the project for the MCP server. The

    connection stores authentication and other connection details needed to connect
    to the MCP

    server.'
  name: project_connection_id
  types:
  - <xref:str>
