### YamlMime:PythonClass
uid: azure.ai.projects.models.UserConversationSimulationConfiguration
name: UserConversationSimulationConfiguration
fullName: azure.ai.projects.models.UserConversationSimulationConfiguration
module: azure.ai.projects.models
summary: Configures the number, length, audio effects, and simulated user behavior
  of conversations.
constructor:
  syntax: 'UserConversationSimulationConfiguration(*args: Any, **kwargs: Any)'
variables:
- description: 'Hard limit on turns in each conversation. When omitted, the service

    defaults to 20.'
  name: max_num_turns
  types:
  - <xref:int>
- description: 'Number of independent conversation repetitions for each test

    case. Defaults to 1 when not specified at either the data-source or test-case
    level.'
  name: conversation_repetitions
  types:
  - <xref:int>
- description: 'Target number of turns in each conversation. The effective value

    cannot exceed the effective `max_num_turns`. When omitted, no target is set and
    the

    simulation model determines the conversation length dynamically from the scenario.'
  name: desired_num_turns
  types:
  - <xref:int>
- description: 'Audio effects applied to voice conversation simulations. This property
    is

    ignored for text-only simulations.'
  name: audio_effects
  types:
  - <xref:azure.ai.projects.models.UserConversationSimulationAudioEffectsConfiguration>
- description: Conversation behavior of the simulated user.
  name: user_behavior
  types:
  - <xref:azure.ai.projects.models.UserConversationSimulationUserBehaviorConfiguration>
