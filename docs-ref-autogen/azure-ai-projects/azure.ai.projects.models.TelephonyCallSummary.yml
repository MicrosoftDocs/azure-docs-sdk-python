### YamlMime:PythonClass
uid: azure.ai.projects.models.TelephonyCallSummary
name: TelephonyCallSummary
fullName: azure.ai.projects.models.TelephonyCallSummary
module: azure.ai.projects.models
summary: A summary of a durable inbound call to a voice agent.
constructor:
  syntax: 'TelephonyCallSummary(*args: Any, **kwargs: Any)'
variables:
- description: The service-generated call identifier. Required.
  name: id
  types:
  - <xref:str>
- description: 'The telephony provider. Required. Known values are: "teams_phone_extension"
    and

    "twilio".'
  name: provider
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.TelephonyProvider>
- description: The provider-assigned call identifier, when available.
  name: provider_call_id
  types:
  - <xref:str>
- description: The caller's phone number, when supplied by the provider.
  name: caller_number
  types:
  - <xref:str>
- description: The Teams Phone Extension or Twilio number that received the call.
  name: provider_number
  types:
  - <xref:str>
- description: 'The lifecycle status of the call. Required. Known values are: "in_progress",

    "success", and "failed".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.TelephonyCallStatus>
- description: 'The provider-neutral lifecycle phase reached by the call. Required.
    Known values

    are: "received", "validated", "admitted", "answering", "answered", "media_connected",

    "agent_session_ready", "bridging", "managing", "completed", "rejected", and "failed".'
  name: phase
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.TelephonyCallPhase>
- description: 'The Unix timestamp (in seconds) for when the inbound webhook was received.

    Required.'
  name: started_at
  types:
  - <xref:datetime.datetime>
- description: 'The Unix timestamp (in seconds) for when the provider reported the
    call as

    answered.'
  name: answered_at
  types:
  - <xref:datetime.datetime>
- description: 'The Unix timestamp (in seconds) for when the provider media channel

    connected.'
  name: media_connected_at
  types:
  - <xref:datetime.datetime>
- description: 'The Unix timestamp (in seconds) for when the voice-agent session

    became ready.'
  name: agent_session_ready_at
  types:
  - <xref:datetime.datetime>
- description: The Unix timestamp (in seconds) for when the call ended.
  name: ended_at
  types:
  - <xref:datetime.datetime>
- description: The call duration.
  name: duration_ms
  types:
  - <xref:datetime.timedelta>
- description: 'The service-generated reason that this single call ended, rather than
    the

    outcome of an overall outbound call job. Additional string codes may be returned.
    Known values

    are: "invalid_webhook_payload", "webhook_validation_failed", "binding_not_found",

    "binding_suspended", "admission_rejected", "admission_check_failed", "route_agent_mismatch",

    "invalid_binding_configuration", "credential_resolution_failed", "provider_resource_mismatch",

    "endpoint_resolution_failed", "ingress_setup_failed", "live_call_conflict",

    "live_call_persistence_failed", "answer_failed", "provider_disconnected", "provider_busy",

    "provider_no_answer", "provider_cancelled", "provider_failed", "provider_stream_error",

    "provider_stream_stopped", "agent_session_connect_failed", "media_stream_ended",

    "bridge_cancelled", "bridge_failed", "managed_hangup", "managed_transfer",

    "manage_hangup_failed", and "manage_transfer_failed".'
  name: end_reason
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.TelephonyCallEndReason>
- description: The provider status code associated with the terminal result.
  name: provider_status_code
  types:
  - <xref:int>
- description: The provider subcode associated with the terminal result.
  name: provider_sub_code
  types:
  - <xref:int>
- description: The provider message associated with the terminal result.
  name: provider_message
  types:
  - <xref:str>
