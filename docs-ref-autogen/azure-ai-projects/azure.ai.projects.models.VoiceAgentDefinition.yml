### YamlMime:PythonClass
uid: azure.ai.projects.models.VoiceAgentDefinition
name: VoiceAgentDefinition
fullName: azure.ai.projects.models.VoiceAgentDefinition
module: azure.ai.projects.models
summary: 'The voice agent definition. Its configuration (model, instructions, audio,
  tools, and optional

  avatar) drives a managed speech-to-speech experience. Establish realtime voice sessions
  through

  `GET /agents/{agent_name}/endpoint/protocols/voice`. Every create or update produces
  a new

  immutable version.'
constructor:
  syntax: 'VoiceAgentDefinition(*args: Any, **kwargs: Any)'
variables:
- description: Configuration for Responsible AI (RAI) content filtering and safety
    features.
  name: rai_config
  types:
  - <xref:azure.ai.projects.models.RaiConfig>
- description: 'The kind discriminator for a voice agent definition. Always `voice`.
    Required.

    VOICE.'
  name: kind
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.VOICE>
- description: 'How the model backing this voice agent is served. Required with `model`
    for

    a model-backed voice agent and omitted when `conversation_engine` is provided.
    This is

    independent of the architecture (realtime or cascaded), which the service derives
    from the

    selected model. Known values are: "managed" and "self_deployed".'
  name: model_type
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.VoiceModelType>
- description: 'The model to use for this agent. Required with `model_type` for a
    model-backed

    voice agent and omitted when `conversation_engine` is provided. The model must
    support

    realtime or cascaded voice.'
  name: model
  types:
  - <xref:str>
- description: 'The engine that owns conversation handling for this voice agent.

    Exactly one of this property and the model-backed configuration (`model_type`
    with `model`)

    must be provided. When this property is provided, `model_type`, `model`, `instructions`,

    `tools`, and `tool_choice` must be omitted, and `greeting.tool_choice` cannot
    be

    `required`, because the engine owns the conversation logic. The initial implementation

    supports a hosted-agent engine.'
  name: conversation_engine
  types:
  - <xref:azure.ai.projects.models.VoiceConversationEngine>
- description: 'A system (or developer) message inserted into the model''s context.
    Supports

    template substitution via `structured_inputs`, rendered per session before the
    live session

    starts.'
  name: instructions
  types:
  - <xref:str>
- description: 'Optional session-start greeting. Template mode speaks exact rendered
    text;

    LLM-generated mode asks the session model to author the opening response and may
    use configured

    tools.'
  name: greeting
  types:
  - <xref:azure.ai.projects.models.VoiceAgentGreetingConfig>
- description: 'The audio configuration, including input and output formats, voice,
    turn

    detection, noise reduction, and transcription. These values are session defaults;
    a client may

    override supported fields when connecting.'
  name: audio
  types:
  - <xref:azure.ai.projects.models.VoiceAgentAudioConfig>
- description: 'The output modalities the agent produces. Defaults to `["audio"]`.

    `animation` and `avatar` are available when an avatar is configured.'
  name: output_modalities
  types:
  - <xref:list>[<xref:str>
  - <xref:azure.ai.projects.models.VoiceOutputModality>]
- description: 'The maximum output-token count for one response. Is either a int type

    or a Literal["inf"] type.'
  name: max_output_tokens
  types:
  - <xref:int>
  - <xref:str>
- description: Additional fields to include in service outputs.
  name: include
  types:
  - <xref:list>[<xref:str>
  - <xref:azure.ai.projects.models.VoiceAgentSessionIncludeOption>]
- description: Interim-response settings for latency and tool execution.
  name: interim_response
  types:
  - <xref:azure.ai.projects.models.VoiceAgentInterimResponseConfig>
- description: 'Optional avatar configuration. These values are session defaults and
    may be

    overridden when connecting.'
  name: avatar
  types:
  - <xref:azure.ai.projects.models.VoiceAgentAvatarConfig>
- description: 'The tools the voice agent may use. Supported tool kinds are `function`
    (executed

    by the client), `mcp`, `system` (service-managed session controls), and `toolbox`.

    Server-side tools such as `web_search`, `azure_ai_search`, and `openapi` are provided

    through a toolbox rather than declared directly.'
  name: tools
  types:
  - <xref:list>[<xref:azure.ai.projects.models.VoiceAgentTool>]
- description: 'How the model chooses tools for generated responses. `none` prevents
    tool

    calls, `auto` lets the model decide, `required` requires at least one tool call,
    and a

    specific function or MCP tool can be selected with an object. Defaults to `auto`.
    Is one of

    the following types: Literal["none"], Literal["auto"], Literal["required"], ToolChoiceFunction,

    ToolChoiceMCP'
  name: tool_choice
  types:
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:azure.ai.projects.models.ToolChoiceFunction>
  - <xref:azure.ai.projects.models.ToolChoiceMCP>
- description: Whether the model may call multiple tools in parallel.
  name: parallel_tool_calls
  types:
  - <xref:bool>
- description: 'Set of structured inputs that participate in prompt template

    substitution, rendered per session before the live session starts.'
  name: structured_inputs
  types:
  - <xref:dict>[<xref:str>, <xref:azure.ai.projects.models.StructuredInputDefinition>]
- description: 'Optional configuration for sibling Foundry text agents that this voice

    agent may consult as background specialists.'
  name: subagent_config
  types:
  - <xref:azure.ai.projects.models.VoiceAgentSubagentConfig>
- description: "Whether conversations with this agent are persisted. A single, all-or-nothing\n\
    persistence switch that defaults to `false` (privacy-safe: off by default). When\
    \ `true`,\nFoundry persists the full conversation \u2014 the transcript/event\
    \ timeline and raw audio. When\n`false`, nothing is persisted and no conversation\
    \ is surfaced. There is no separate\naudio-logging control; audio is persisted\
    \ only as part of this switch. Latency/performance\ntelemetry (e.g. time-to-first-audio,\
    \ inter-token latency, interruption) is observability-only\n(customer trace /\
    \ App Insights) and is not part of the persisted conversation content."
  name: store
  types:
  - <xref:bool>
