### YamlMime:PythonClass
uid: azure.ai.projects.aio.operations.AsyncBetaRealtime
name: AsyncBetaRealtime
fullName: azure.ai.projects.aio.operations.AsyncBetaRealtime
module: azure.ai.projects.aio.operations
summary: "BetaRealtime streaming entry point, exposed as `client.beta.voice_agents.realtime`.\n\
  \nFollows the OpenAI Python realtime surface: obtain it from the HTTP client and\
  \ open a\nconnection with <xref:azure.ai.projects.aio.operations.AsyncBetaRealtime.connect>:\n\
  \n<!-- literal_block {\"ids\": [], \"classes\": [], \"names\": [], \"dupnames\"\
  : [], \"backrefs\": [], \"xml:space\": \"preserve\", \"language\": \"default\",\
  \ \"force\": false, \"linenos\": false} -->\n\n````default\n\n   from azure.ai.projects.aio\
  \ import AIProjectClient\n   from azure.identity.aio import DefaultAzureCredential\n\
  \n   client = AIProjectClient(endpoint, DefaultAzureCredential())\n   async with\
  \ client.beta.voice_agents.realtime.connect(agent_name=\"my-agent\") as conn:\n\
  \       await conn.input_audio_buffer.append(audio=chunk)\n       await conn.input_audio_buffer.commit()\n\
  \       await conn.response.create()\n       async for event in conn:\n        \
  \   if event.type == RealtimeServerEventType.RESPONSE_DONE:\n               break\n\
  \   ````"
constructor:
  syntax: 'AsyncBetaRealtime(*args: Any, **kwargs: Any)'
  parameters:
  - name: client
    description: "The object whose endpoint and credential are reused for the realtime\n\
      handshake \u2013 the `.beta.voice_agents` sub-client, which shares the same\
      \ underlying\nconfiguration as the top-level client."
    isRequired: true
    types:
    - <xref:azure.ai.projects.aio.operations.BetaVoiceAgentsOperations>
methods:
- uid: azure.ai.projects.aio.operations.AsyncBetaRealtime.connect
  name: connect
  summary: Open a realtime WebSocket connection to a voice agent.
  signature: 'connect(*, agent_name: str, agent_session_id: str | None = None, structured_inputs:
    Mapping[str, Any] | None = None, connection_url: str | None = None, api_version:
    str | None = None, credential_scopes: List[str] | None = None, extra_query: Mapping[str,
    str] | None = None, extra_headers: Mapping[str, str] | None = None, **kwargs:
    Any) -> AsyncBetaRealtimeConnectionManager'
  keywordOnlyParameters:
  - name: agent_name
    description: The name of the voice agent to connect to.
    types:
    - <xref:str>
  - name: agent_session_id
    description: 'An optional identifier used to correlate the voice session.

      Default value is None.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: structured_inputs
    description: 'A mapping of structured-input names to their values for this

      session (see <xref:azure.ai.projects.models.CreateTelephonyCallJobRequest.structured_inputs>

      for the analogous shape used elsewhere). Serialized to JSON on the wire. Default
      value is

      None.'
    defaultValue: None
    types:
    - <xref:typing.Mapping>[<xref:str>, <xref:typing.Any>]
    - <xref:None>
  - name: connection_url
    description: 'Full `wss://` URL that overrides the route computed

      from the client endpoint. Query parameters are still appended. Default value
      is None.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: api_version
    description: 'Overrides the client''s API version for the handshake. Default

      value is None.'
    defaultValue: None
    types:
    - <xref:str>
    - <xref:None>
  - name: credential_scopes
    description: 'Overrides the client''s token scopes for the handshake.

      Default value is None.'
    defaultValue: None
    types:
    - <xref:list>[<xref:str>]
    - <xref:None>
  - name: extra_query
    description: Additional query-string parameters for the handshake.
    defaultValue: None
    types:
    - <xref:typing.Mapping>[<xref:str>, <xref:str>]
    - <xref:None>
  - name: extra_headers
    description: 'Additional headers for the handshake. Pass

      `{"Foundry-Features": "..."}` here to override the `VoiceAgents=V1Preview` value

      this method always sends by default.'
    defaultValue: None
    types:
    - <xref:typing.Mapping>[<xref:str>, <xref:str>]
    - <xref:None>
  return:
    description: An async context manager yielding an <xref:azure.ai.projects.aio.operations.AsyncBetaRealtimeConnection>.
    types:
    - <xref:azure.ai.projects.aio.AsyncBetaRealtimeConnectionManager>
