### YamlMime:PythonClass
uid: azure.ai.projects.models.VoiceResponse
name: VoiceResponse
fullName: azure.ai.projects.models.VoiceResponse
module: azure.ai.projects.models
summary: 'A persisted voice response representing one model inference turn within
  a conversation. In list

  results the `output` projection may be omitted; retrieve the full response (`GET

  .../responses/{response_id}`) or the paged response-items route (`GET

  .../responses/{response_id}/items`) for its output items. `created_at`/`completed_at`
  are

  Foundry durable ordering extensions.'
constructor:
  syntax: 'VoiceResponse(*args: Any, **kwargs: Any)'
variables:
- description: 'The object type, must be `realtime.response`. Default value is

    "realtime.response".'
  name: object
  types:
  - <xref:str>
- description: 'The final status of the response (`completed`, `cancelled`, `failed`,
    or

    `incomplete`, `in_progress`). Is one of the following types: Literal["completed"],

    Literal["cancelled"], Literal["failed"], Literal["incomplete"], Literal["in_progress"]'
  name: status
  types:
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
- description: Additional details about the status.
  name: status_details
  types:
  - <xref:azure.ai.projects.models.RealtimeResponseStatusDetails>
- description: 'Usage statistics for the Response, this will correspond to billing.
    A Realtime API

    session will maintain a conversation context and append new Items to the Conversation,
    thus

    output from previous turns (text and audio tokens) will become the input for later
    turns.'
  name: usage
  types:
  - <xref:azure.ai.projects.models.RealtimeResponseUsage>
- description: 'The set of modalities the model used to respond, currently the only

    possible values are `[\"audio\"]`, `[\"text\"]`. Audio output always include a
    text

    transcript. Setting the output to mode `text` will disable audio output from the
    model.'
  name: output_modalities
  types:
  - <xref:list>[<xref:str>
  - <xref:str>]
- description: 'Maximum number of output tokens for a single assistant response,

    inclusive of tool calls, that was used in this response. Is either a int type
    or a

    Literal["inf"] type.'
  name: max_output_tokens
  types:
  - <xref:int>
  - <xref:str>
- description: The unique id of the response. Required.
  name: id
  types:
  - <xref:str>
- description: 'The output items produced by the response. May be omitted in list
    results;

    retrieve the full response (GET .../responses/{response_id}) or use the paged
    response-items

    route (GET .../responses/{response_id}/items) for its output items. Each item''s
    `response_id`

    also links it back to this response in the conversation-level items list.'
  name: output
  types:
  - <xref:list>[<xref:azure.ai.projects.models.RealtimeConversationItem>]
- description: The id of the conversation this response belongs to. Required.
  name: conversation_id
  types:
  - <xref:str>
- description: 'The audio configuration used for the response, including the voice
    and audio

    format used for output.'
  name: audio
  types:
  - <xref:azure.ai.projects.models.VoiceResponseAudio>
- description: A set of key-value pairs attached to the response.
  name: metadata
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: The sampling temperature used for the response.
  name: temperature
  types:
  - <xref:float>
- description: The Unix timestamp (in seconds) for when the response was created.
  name: created_at
  types:
  - <xref:datetime.datetime>
- description: The Unix timestamp (in seconds) for when the response completed.
  name: completed_at
  types:
  - <xref:datetime.datetime>
