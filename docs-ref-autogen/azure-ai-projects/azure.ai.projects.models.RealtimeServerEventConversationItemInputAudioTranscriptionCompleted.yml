### YamlMime:PythonClass
uid: azure.ai.projects.models.RealtimeServerEventConversationItemInputAudioTranscriptionCompleted
name: RealtimeServerEventConversationItemInputAudioTranscriptionCompleted
fullName: azure.ai.projects.models.RealtimeServerEventConversationItemInputAudioTranscriptionCompleted
module: azure.ai.projects.models
summary: 'This event is the output of audio transcription for user audio written to
  the user audio

  buffer. Transcription begins when the input audio buffer is committed by the client
  or server

  (when VAD is enabled). Transcription runs asynchronously with Response creation,
  so this event

  may come before or after the Response events. Realtime API models accept audio natively,
  and

  thus input transcription is a separate process run on a separate ASR (Automatic
  Speech

  Recognition) model. The transcript may diverge somewhat from the model''s interpretation,
  and

  should be treated as a rough guide.'
constructor:
  syntax: 'RealtimeServerEventConversationItemInputAudioTranscriptionCompleted(*args:
    Any, **kwargs: Any)'
variables:
- description: The unique ID of the server event. Required.
  name: event_id
  types:
  - <xref:str>
- description: 'The event type, must be `conversation.item.input_audio_transcription.completed`.

    Required. CONVERSATION_ITEM_INPUT_AUDIO_TRANSCRIPTION_COMPLETED.'
  name: type
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.CONVERSATION_ITEM_INPUT_AUDIO_TRANSCRIPTION_COMPLETED>
- description: The ID of the item containing the audio that is being transcribed.
    Required.
  name: item_id
  types:
  - <xref:str>
- description: The index of the content part containing the audio. Required.
  name: content_index
  types:
  - <xref:int>
- description: The transcribed text. Required.
  name: transcript
  types:
  - <xref:str>
- description: 'The languages detected in the audio. Returned by `gpt-transcribe`.
    An empty

    array indicates that no language could be reliably detected.'
  name: languages
  types:
  - <xref:list>[<xref:azure.ai.projects.models.TranscriptionLanguage>]
- name: logprobs
  types:
  - <xref:list>[<xref:azure.ai.projects.models.LogProbProperties>]
- description: 'Usage statistics for the transcription, this is billed according to
    the ASR

    model''s pricing rather than the realtime model''s pricing. Required. Is either
    a

    TranscriptTextUsageTokens type or a TranscriptTextUsageDuration type.'
  name: usage
  types:
  - <xref:azure.ai.projects.models.TranscriptTextUsageTokens>
  - <xref:azure.ai.projects.models.TranscriptTextUsageDuration>
- description: Phrase-level transcription timing and confidence details.
  name: phrases
  types:
  - <xref:list>[<xref:azure.ai.projects.models.VoiceAgentTranscriptionPhrase>]
