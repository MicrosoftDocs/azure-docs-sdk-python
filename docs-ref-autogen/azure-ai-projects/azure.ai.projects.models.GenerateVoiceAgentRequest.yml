### YamlMime:PythonClass
uid: azure.ai.projects.models.GenerateVoiceAgentRequest
name: GenerateVoiceAgentRequest
fullName: azure.ai.projects.models.GenerateVoiceAgentRequest
module: azure.ai.projects.models
summary: 'The inputs for generating a voice agent. Only `kind` and `name` are always
  required. The

  authoring service expands these inputs into a full, editable `VoiceAgentDefinition`,
  which is

  then created through `POST /agents`. The generated `instructions` and audio/voice
  settings

  are stored as separate fields on the resulting agent definition, so the caller can
  edit or

  override any of them afterward via standard agent versioning.'
constructor:
  syntax: 'GenerateVoiceAgentRequest(*args: Any, **kwargs: Any)'
variables:
- description: The agent kind. Always `voice`. Required. VOICE.
  name: kind
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.VOICE>
- description: 'The unique name for the agent to create. Must be a non-empty DNS-like
    agent name.

    Required.'
  name: name
  types:
  - <xref:str>
- description: 'Optional inference mode. When omitted, the authoring service uses

    `managed`. When supplied, use `managed` or `self_deployed`. Known values are:
    "managed"

    and "self_deployed".'
  name: model_type
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.VoiceModelType>
- description: 'Optional model identifier. Required when `model_type` is `self_deployed`;

    optional when `model_type` is `managed` or omitted. The service never invents
    a customer

    deployment name.'
  name: model
  types:
  - <xref:str>
- description: An optional authoring use case. An empty string is accepted.
  name: use_case
  types:
  - <xref:str>
- description: 'An optional natural-language description of what the agent should
    do. When

    supplied, it seeds the generated instructions.'
  name: goal
  types:
  - <xref:str>
- description: 'An optional agent description. The authoring service resolves its
    fallback

    when omitted.'
  name: description
  types:
  - <xref:str>
- description: 'Optional tools carried through verbatim onto the generated agent (see

    `VoiceAgentTool`).'
  name: tools
  types:
  - <xref:list>[<xref:azure.ai.projects.models.VoiceAgentTool>]
- description: "(Preview) When `true`, the generated voice agent is created as a draft\
    \ \u2014 an\neditable, unpublished version the caller can review and refine before\
    \ publishing it via the\nstandard create/version path. The service defaults to\
    \ `false` if a value is not specified by\nthe caller, in which case the agent\
    \ is created and published normally."
  name: draft
  types:
  - <xref:bool>
