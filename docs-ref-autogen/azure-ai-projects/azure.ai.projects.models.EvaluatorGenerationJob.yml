### YamlMime:PythonClass
uid: azure.ai.projects.models.EvaluatorGenerationJob
name: EvaluatorGenerationJob
fullName: azure.ai.projects.models.EvaluatorGenerationJob
module: azure.ai.projects.models
summary: "Evaluator Generation Job resource \u2014 a long-running job that generates\
  \ rubric-based evaluator\ndefinitions from source materials. On success, the result\
  \ is the persisted EvaluatorVersion."
constructor:
  syntax: 'EvaluatorGenerationJob(*args: Any, **kwargs: Any)'
variables:
- description: Server-assigned unique identifier. Required.
  name: id
  types:
  - <xref:str>
- description: Result produced on success.
  name: result
  types:
  - <xref:azure.ai.projects.models.EvaluatorVersion>
- description: 'Current lifecycle status. Required. Known values are: "queued", "in_progress",

    "succeeded", "failed", and "cancelled".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.JobStatus>
- description: "Error details \u2014 populated only on failure."
  name: error
  types:
  - <xref:azure.ai.projects.models.ApiError>
- description: "Source materials for generation \u2014 agent descriptions, prompts,\
    \ traces, or\ndatasets. Each entry is an `EvaluatorGenerationJobSource` variant\
    \ discriminated by `type`.\nRequired."
  name: sources
  types:
  - <xref:list>[<xref:azure.ai.projects.models.EvaluatorGenerationJobSource>]
- description: "The LLM model to use for rubric generation (e.g., 'gpt-4o'). Required\
    \ \u2014 users must\nprovide their own model rather than relying on service-owned\
    \ capacity. Required."
  name: model
  types:
  - <xref:str>
- description: 'The evaluator name (immutable identifier). 1-256 characters; allowed

    characters are ASCII letters, digits, underscore (`_`), period (`.`), tilde (`~`),
    and

    hyphen (`-`). The prefix `builtin.` is reserved for system-managed evaluators
    and is

    rejected by the service. If an evaluator with this name already exists in the
    project (and is

    rubric-subtype), the service creates a new version under the same name and uses
    the prior

    version''s `dimensions` as context for incremental improvement (foundation of
    the post-//build

    adaptive loop). Old versions remain queryable via `get_version(name, version)`.
    If the

    existing evaluator is not a rubric-subtype evaluator (built-in, prompt-based,
    code-based), the

    request is rejected with `400 Bad Request`. Required.'
  name: evaluator_name
  types:
  - <xref:str>
- description: 'Optional human-friendly display name for the resulting evaluator.

    Surfaced as `EvaluatorVersion.display_name` on the persisted evaluator. When omitted,
    the

    service uses `evaluator_name` as the display name. The `evaluator_` prefix disambiguates

    this from the immutable `evaluator_name` identifier.'
  name: evaluator_display_name
  types:
  - <xref:str>
- description: 'Optional human-friendly description for the resulting evaluator.

    Surfaced as `EvaluatorVersion.description` on the persisted evaluator. Typically
    collected

    from the UI alongside `evaluator_display_name`. The `evaluator_` prefix disambiguates
    this

    from any other description fields on related models.'
  name: evaluator_description
  types:
  - <xref:str>
- description: 'The timestamp when the job was created, represented in Unix time (seconds

    since January 1, 1970). Required.'
  name: created_at
  types:
  - <xref:datetime.datetime>
- description: 'The timestamp when the job finished, represented in Unix time (seconds
    since

    January 1, 1970).'
  name: finished_at
  types:
  - <xref:datetime.datetime>
- description: Token consumption summary. Populated when the job reaches a terminal
    state.
  name: usage
  types:
  - <xref:azure.ai.projects.models.EvaluatorGenerationTokenUsage>
- description: 'Non-fatal input-quality advisories produced by the generation

    pipeline. Read-only; service-generated; populated only on terminal jobs when advisories
    fired.

    Omitted when generation was clean. Cleared when a subsequent `PATCH` to the paired

    `EvaluatorVersion.definition` invalidates the advisories.'
  name: input_quality_warnings
  types:
  - <xref:list>[<xref:azure.ai.projects.models.RubricGenerationInputQualityWarning>]
