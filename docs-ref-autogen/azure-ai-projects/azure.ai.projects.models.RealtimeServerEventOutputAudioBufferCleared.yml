uid: azure.ai.projects.models.RealtimeServerEventOutputAudioBufferCleared
name: RealtimeServerEventOutputAudioBufferCleared
fullName: azure.ai.projects.models.RealtimeServerEventOutputAudioBufferCleared
module: azure.ai.projects.models
summary: '**WebRTC/SIP Only:** Emitted when the output audio buffer is cleared. This
  happens either in

  VAD mode when the user has interrupted (`input_audio_buffer.speech_started`), or
  when the

  client has emitted the `output_audio_buffer.clear` event to manually cut off the
  current

  audio response. [Learn more](/docs/guides/realtime-conversations#client-and-server-events-for-audio-in-webrtc).'
constructor:
  syntax: 'RealtimeServerEventOutputAudioBufferCleared(*args: Any, **kwargs: Any)'
variables:
