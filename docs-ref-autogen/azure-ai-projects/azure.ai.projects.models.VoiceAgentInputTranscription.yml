### YamlMime:PythonClass
uid: azure.ai.projects.models.VoiceAgentInputTranscription
name: VoiceAgentInputTranscription
fullName: azure.ai.projects.models.VoiceAgentInputTranscription
module: azure.ai.projects.models
summary: 'Asynchronous input-audio transcription configuration. Extends the OpenAI
  Realtime transcription

  options with the Azure and MAI transcription models, custom speech models, and phrase
  hints.'
constructor:
  syntax: 'VoiceAgentInputTranscription(*args: Any, **kwargs: Any)'
variables:
- description: 'The language of the input audio. Supplying the input language in [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes)
    (e.g. `en`) format will improve

    accuracy and latency.'
  name: language
  types:
  - <xref:str>
- description: 'Possible languages of the input audio, in [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes)
    format. Supported by

    `gpt-transcribe` and `gpt-live-transcribe`.'
  name: languages
  types:
  - <xref:list>[<xref:str>]
- description: 'Words or phrases to guide transcription of the input audio. Supported
    by

    `gpt-transcribe` and `gpt-live-transcribe`.'
  name: keywords
  types:
  - <xref:list>[<xref:str>]
- description: 'An optional text to guide the model''s style or continue a previous
    audio segment.

    For `whisper-1`, the [prompt is a list of keywords](/docs/guides/speech-to-text#prompting).

    For `gpt-4o-transcribe` models (excluding `gpt-4o-transcribe-diarize`), the prompt
    is a

    free text string, for example "expect words related to technology". Prompt is
    not supported

    with `gpt-realtime-whisper` in GA Realtime sessions.'
  name: prompt
  types:
  - <xref:str>
- description: 'Controls how long the model waits before emitting transcription text.
    Higher

    values can improve transcription accuracy at the cost of latency. Only supported
    with

    `gpt-realtime-whisper` in GA Realtime sessions. Is one of the following types:

    Literal["minimal"], Literal["low"], Literal["medium"], Literal["high"], Literal["xhigh"]'
  name: delay
  types:
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
- description: 'The transcription model identifier. Configure customer custom speech
    deployments

    in `custom_speech`. Required. Known values are: "whisper-1", "gpt-realtime-whisper",

    "gpt-4o-transcribe", "gpt-4o-mini-transcribe", "gpt-4o-transcribe-diarize", "gpt-transcribe",

    "gpt-live-transcribe", "mai-transcribe", and "azure-speech".'
  name: model
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.VoiceAgentInputTranscriptionModel>
- description: Optional customer custom speech deployment configuration, keyed by
    locale.
  name: custom_speech
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: Optional phrase hints that bias recognition toward domain terms.
  name: phrase_list
  types:
  - <xref:list>[<xref:str>]
