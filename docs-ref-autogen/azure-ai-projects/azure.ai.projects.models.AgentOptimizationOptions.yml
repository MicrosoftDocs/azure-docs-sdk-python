### YamlMime:PythonClass
uid: azure.ai.projects.models.AgentOptimizationOptions
name: AgentOptimizationOptions
fullName: azure.ai.projects.models.AgentOptimizationOptions
module: azure.ai.projects.models
summary: Tuning knobs and run-mode for an optimization job.
constructor:
  syntax: 'AgentOptimizationOptions(*args: Any, **kwargs: Any)'
variables:
- description: 'Maximum number of optimization candidates to generate. Must be >=
    1.

    Default: 5.'
  name: max_candidates
  types:
  - <xref:int>
- description: 'Per-target-attribute configuration overrides. Contains skills,

    tools, system_prompt for the agent, plus model space for model optimization.'
  name: optimization_config
  types:
  - <xref:dict>[<xref:str>, <xref:any>]
- description: 'Model deployment used for evaluation. Defaults to server config (typically

    ''gpt-4o'').'
  name: eval_model
  types:
  - <xref:str>
- description: 'Model deployment for optimization reasoning (must be gpt-5 family).

    Falls back to the default eval model when not set.'
  name: optimization_model
  types:
  - <xref:str>
- description: 'Evaluation granularity. Null/omitted means per-item single-turn. Set
    to

    ''conversation'' for per-conversation multi-turn simulation scoring. Known values
    are: "turn" and

    "conversation".'
  name: evaluation_level
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.EvaluationLevel>
- description: "Maximum number of consecutive reflective minibatch rejections before\
    \ stopping\nearly. A 'stall' occurs when the optimizer proposes a prompt change,\
    \ evaluates it on a small\nsubset, and the score does not improve \u2014 so no\
    \ full validation-set evaluation is triggered. The\ncounter resets whenever a\
    \ minibatch passes and its full-validation score beats the current\nbest. Only\
    \ a sustained plateau of `max_stalls` consecutive minibatch failures triggers\
    \ the\nstop. The service defaults to 5 if a value is not specified by the caller.\
    \ Must be >= 1 when\nset."
  name: max_stalls
  types:
  - <xref:int>
