- uid: azure.ai.projects.models.AgentOptimizationOptions.max_stalls
  name: max_stalls
  summary: "Maximum number of consecutive reflective minibatch rejections before stopping\
    \ early. A 'stall'\noccurs when the optimizer proposes a prompt change, evaluates\
    \ it on a small subset, and the\nscore does not improve \u2014 so no full validation-set\
    \ evaluation is triggered. The counter resets\nwhenever a minibatch passes and\
    \ its full-validation score beats the current best. Only a\nsustained plateau\
    \ of `max_stalls` consecutive minibatch failures triggers the stop. The\nservice\
    \ defaults to 5 if a value is not specified by the caller. Must be >= 1 when set."
  signature: 'max_stalls: int | None'
