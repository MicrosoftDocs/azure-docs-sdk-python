### YamlMime:PythonClass
uid: azure.ai.projects.models.TelephonyCallJob
name: TelephonyCallJob
fullName: azure.ai.projects.models.TelephonyCallJob
module: azure.ai.projects.models
summary: A durable direct or campaign-created outbound call intent.
constructor:
  syntax: 'TelephonyCallJob(*args: Any, **kwargs: Any)'
variables:
- description: The phone destination to call. Required.
  name: destination
  types:
  - <xref:azure.ai.projects.models.TelephonyOutboundDestination>
- description: 'The Foundry connection name in the current project used to originate
    the

    call. Its category selects Twilio or Azure Communication Services / Teams Phone
    Extension. No

    inbound telephony binding is required. Required.'
  name: connection_name
  types:
  - <xref:str>
- description: 'The caller identity used to originate the call. For a Twilio connection,
    provide

    an authorized E.164 phone number. For an Azure Communication Services / Teams
    Phone Extension

    connection, provide the Teams Resource Account object ID. The identity type is
    inferred from

    the connection category; originating does not change inbound routing. Required.'
  name: source
  types:
  - <xref:str>
- description: An optional customer-declared purpose for placing the call.
  name: purpose
  types:
  - <xref:str>
- description: 'Structured input values available to the agent and greeting for this

    call. Agent-declared inputs are validated against their schemas; omitted optional
    inputs may

    use their Agent-defined default values, while omitted required inputs are rejected.
    Additional

    inputs remain available as dynamic template variables.'
  name: structured_inputs
  types:
  - <xref:dict>[<xref:str>, <xref:any>]
- description: The optional execution window.
  name: schedule
  types:
  - <xref:azure.ai.projects.models.TelephonyCallJobSchedule>
- description: The service-generated call-job identifier. Required.
  name: id
  types:
  - <xref:str>
- description: 'The object type. Always `telephony.call_job`. Required. Default value
    is

    "telephony.call_job".'
  name: object
  types:
  - <xref:str>
- description: The name of the voice agent used at execution time. Required.
  name: agent_name
  types:
  - <xref:str>
- description: 'The current call-job lifecycle status. Required. Known values are:
    "accepted",

    "waiting_for_schedule", "queued", "dispatching", "in_progress", "waiting_for_retry",

    "cancellation_requested", "completed", "blocked", "expired", "failed", and "cancelled".'
  name: status
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.TelephonyCallJobStatus>
- description: The recorded cancellation request, when cancellation was requested.
  name: cancellation
  types:
  - <xref:azure.ai.projects.models.TelephonyCallJobCancellation>
- description: The frozen provider-attempt retry policy. Required.
  name: retry_policy
  types:
  - <xref:azure.ai.projects.models.TelephonyOutboundRetryPolicy>
- description: The number of provider attempts created so far. Required.
  name: attempt_count
  types:
  - <xref:int>
- description: The Unix timestamp in seconds at which the next retry becomes eligible.
  name: next_attempt_at
  types:
  - <xref:datetime.datetime>
- description: 'The stable service-generated reason for the overall outbound call
    job,

    which can span multiple provider attempts, when available. Interpret this with
    `status`: a

    queued job can retain a temporary dispatch-deferral reason. Additional string
    codes may be

    returned. Known values are: "no_answer", "no_answer_timeout", "answer_failed",

    "bridge_cancelled", "bridge_failed", "voice_session_configuration_invalid",

    "connection_project_mismatch", "outbound_connection_changed",

    "outbound_connection_unavailable", "telephony_binding_invalid", "telephony_binding_not_found",

    "telephony_binding_inactive", "telephony_binding_changed", "campaign_not_found",

    "campaign_cancelled", "campaign_completed", "campaign_failed",

    "origination_fence_not_recorded", "origination_reconciliation_timeout",

    "cancellation_reconciliation_timeout", and

    "provider_callback_timeout_cancellation_reconciliation_timeout".'
  name: terminal_reason
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.TelephonyCallJobTerminalReason>
- description: The monotonically increasing optimistic-concurrency revision. Required.
  name: revision
  types:
  - <xref:int>
- description: The Unix timestamp in seconds when the call job was created. Required.
  name: created_at
  types:
  - <xref:datetime.datetime>
- description: The Unix timestamp in seconds when the call job was last updated. Required.
  name: updated_at
  types:
  - <xref:datetime.datetime>
