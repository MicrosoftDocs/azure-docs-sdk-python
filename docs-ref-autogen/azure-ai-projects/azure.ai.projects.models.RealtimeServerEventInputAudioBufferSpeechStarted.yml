### YamlMime:PythonClass
uid: azure.ai.projects.models.RealtimeServerEventInputAudioBufferSpeechStarted
name: RealtimeServerEventInputAudioBufferSpeechStarted
fullName: azure.ai.projects.models.RealtimeServerEventInputAudioBufferSpeechStarted
module: azure.ai.projects.models
summary: 'Sent by the server when in `server_vad` mode to indicate that speech has
  been detected in the

  audio buffer. This can happen any time audio is added to the buffer (unless speech
  is already

  detected). The client may want to use this event to interrupt audio playback or
  provide visual

  feedback to the user. The client should expect to receive a

  `input_audio_buffer.speech_stopped` event when speech stops. The `item_id` property
  is the

  ID of the user message item that will be created when speech stops and will also
  be included in

  the `input_audio_buffer.speech_stopped` event (unless the client manually commits
  the audio

  buffer during VAD activation).'
constructor:
  syntax: 'RealtimeServerEventInputAudioBufferSpeechStarted(*args: Any, **kwargs:
    Any)'
variables:
- description: The unique ID of the server event. Required.
  name: event_id
  types:
  - <xref:str>
- description: 'The event type, must be `input_audio_buffer.speech_started`. Required.

    INPUT_AUDIO_BUFFER_SPEECH_STARTED.'
  name: type
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.INPUT_AUDIO_BUFFER_SPEECH_STARTED>
- description: 'Milliseconds from the start of all audio written to the buffer during
    the

    session when speech was first detected. This will correspond to the beginning
    of audio sent to

    the model, and thus includes the `prefix_padding_ms` configured in the Session.
    Required.'
  name: audio_start_ms
  types:
  - <xref:int>
- description: 'The ID of the user message item that will be created when speech stops.

    Required.'
  name: item_id
  types:
  - <xref:str>
