### YamlMime:PythonClass
uid: azure.ai.projects.models.RealtimeServerEventConversationItemAdded
name: RealtimeServerEventConversationItemAdded
fullName: azure.ai.projects.models.RealtimeServerEventConversationItemAdded
module: azure.ai.projects.models
summary: "Sent by the server when an Item is added to the default Conversation. This\
  \ can happen in\nseveral cases:\n\n* When the client sends a *conversation.item.create*\
  \ event. \n\n* When the input audio buffer is committed. In this case the item will\
  \ be a user message containing the audio from the buffer. \n\n* When the model is\
  \ generating a Response. In this case the *conversation.item.added* event will be\
  \ sent when the model starts generating a specific Item, and thus it will not yet\
  \ have any content (and *status* will be *in_progress*). The event will include\
  \ the full content of the Item (except when model is generating a Response) except\
  \ for audio data, which can be retrieved separately with a *conversation.item.retrieve*\
  \ event if necessary."
