### YamlMime:PythonClass
uid: azure.ai.projects.models.VoiceAgentAudioOutputConfig
name: VoiceAgentAudioOutputConfig
fullName: azure.ai.projects.models.VoiceAgentAudioOutputConfig
module: azure.ai.projects.models
summary: "Output audio configuration for a voice agent.\nProvider-specific fields\
  \ are selected by `voice_type`:\n\n* *openai*: *voice* and *speed*. \n\n* *azure-standard*:\
  \ *voice*, *voice_locale*, *speed*, *voice_temperature*, *custom_lexicon_url*, *custom_text_normalization_url*,\
  \ *prefer_locales*, *style*, *pitch*, and *volume*. \n\n* *azure-custom*: all *azure-standard*\
  \ fields except *style*, plus *custom_voice_endpoint_id*. \n\n* *azure-personal*:\
  \ all *azure-standard* fields except *style*, plus *personal_voice_model*. \n\n\
  * *avatar-voice-sync*: all *azure-standard* fields except *voice* and *style*, plus\
  \ *personal_voice_model*; the voice name is derived from the avatar. \n\n* *azure-realtime-native*:\
  \ *voice* and *speed*. *format* and *output_audio_timestamp_types* apply to every\
  \ voice type."
constructor:
  syntax: 'VoiceAgentAudioOutputConfig(*args: Any, **kwargs: Any)'
variables:
- description: 'The output audio format. Applies to every `voice_type` and defaults
    to 24 kHz

    PCM.'
  name: format
  types:
  - <xref:azure.ai.projects.models.RealtimeAudioFormats>
- description: 'The voice name or identifier. Applies to `openai`, `azure-standard`,

    `azure-custom`, `azure-personal`, and `azure-realtime-native`. It does not apply
    to

    `avatar-voice-sync`, which derives the voice name from the avatar.'
  name: voice
  types:
  - <xref:str>
- description: 'The voice implementation. Known values are: "openai", "azure-standard",

    "azure-custom", "azure-personal", "avatar-voice-sync", and "azure-realtime-native".'
  name: voice_type
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.VoiceType>
- description: 'The enforced BCP-47 output locale. Applies to `azure-standard`,

    `azure-custom`, `azure-personal`, and `avatar-voice-sync`.'
  name: voice_locale
  types:
  - <xref:str>
- description: 'The numeric output speed multiplier. Applies to all known `voice_type`
    values

    and defaults to 1.'
  name: speed
  types:
  - <xref:float>
- description: 'The voice variation temperature. Applies to `azure-standard`,

    `azure-custom`, `azure-personal`, and `avatar-voice-sync`.'
  name: voice_temperature
  types:
  - <xref:float>
- description: 'The URL of a custom pronunciation lexicon. Applies to

    `azure-standard`, `azure-custom`, `azure-personal`, and `avatar-voice-sync`.'
  name: custom_lexicon_url
  types:
  - <xref:str>
- description: 'The URL of a custom text-normalization configuration.

    Applies to `azure-standard`, `azure-custom`, `azure-personal`, and `avatar-voice-sync`.'
  name: custom_text_normalization_url
  types:
  - <xref:str>
- description: 'Preferred BCP-47 locales for multilingual synthesis. Applies to

    `azure-standard`, `azure-custom`, `azure-personal`, and `avatar-voice-sync`.'
  name: prefer_locales
  types:
  - <xref:list>[<xref:str>]
- description: The voice speaking style. Applies only when `voice_type` is `azure-standard`.
  name: style
  types:
  - <xref:str>
- description: 'The voice pitch adjustment. Applies to `azure-standard`, `azure-custom`,

    `azure-personal`, and `avatar-voice-sync`.'
  name: pitch
  types:
  - <xref:str>
- description: 'The voice volume adjustment. Applies to `azure-standard`, `azure-custom`,

    `azure-personal`, and `avatar-voice-sync`.'
  name: volume
  types:
  - <xref:str>
- description: 'The Azure custom-voice deployment endpoint identifier. Applies

    only when `voice_type` is `azure-custom`.'
  name: custom_voice_endpoint_id
  types:
  - <xref:str>
- description: 'The Azure personal or avatar voice model. Applies only when

    `voice_type` is `azure-personal` or `avatar-voice-sync`.'
  name: personal_voice_model
  types:
  - <xref:str>
- description: 'Timestamp kinds to include with output audio. Applies to

    every `voice_type`.'
  name: output_audio_timestamp_types
  types:
  - <xref:list>[<xref:str>
  - <xref:azure.ai.projects.models.VoiceAgentAudioTimestampType>]
