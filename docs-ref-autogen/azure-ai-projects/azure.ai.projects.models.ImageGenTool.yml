variables:
- description: 'The type of the image generation tool. Always `image_generation`.
    Required.

    IMAGE_GENERATION.'
  name: type
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.IMAGE_GENERATION>
- description: 'Is one of the following types: Literal["gpt-image-1"],

    Literal["gpt-image-1-mini"], Literal["gpt-image-1.5"], str'
  name: model
  types:
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
- description: 'The quality of the generated image. One of `low`, `medium`, `high`,
    or

    `auto`. Default: `auto`. Is one of the following types: Literal["low"], Literal["medium"],

    Literal["high"], Literal["auto"]'
  name: quality
  types:
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
- description: 'The size of the generated images. For `gpt-image-2` and

    `gpt-image-2-2026-04-21`, arbitrary resolutions are supported as `WIDTHxHEIGHT`
    strings,

    for example `1536x864`. Width and height must both be divisible by 16 and the
    requested

    aspect ratio must be between 1:3 and 3:1. Resolutions above `2560x1440` are experimental,
    and

    the maximum supported resolution is `3840x2160`. The requested size must also
    satisfy the

    model''s current pixel and edge limits. The standard sizes `1024x1024`, `1536x1024`,
    and

    `1024x1536` are supported by the GPT image models; `auto` is supported for models
    that

    allow automatic sizing. For `dall-e-2`, use one of `256x256`, `512x512`, or

    `1024x1024`. For `dall-e-3`, use one of `1024x1024`, `1792x1024`, or `1024x1792`.
    Is

    one of the following types: Literal["1024x1024"], Literal["1024x1536"], Literal["1536x1024"],

    Literal["auto"], str'
  name: size
  types:
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
  - <xref:str>
- description: 'The output format of the generated image. One of `png`, `webp`, or

    `jpeg`. Default: `png`. Is one of the following types: Literal["png"], Literal["webp"],

    Literal["jpeg"]'
  name: output_format
  types:
  - <xref:str>
  - <xref:str>
  - <xref:str>
- description: 'Compression level for the output image. Default: 100.'
  name: output_compression
  types:
  - <xref:int>
- description: 'Moderation level for the generated image. Default: `auto`. Is either
    a

    Literal["auto"] type or a Literal["low"] type.'
  name: moderation
  types:
  - <xref:str>
  - <xref:str>
- description: 'Background type for the generated image. One of `transparent`, `opaque`,

    or `auto`. Default: `auto`. Is one of the following types: Literal["transparent"],

    Literal["opaque"], Literal["auto"]'
  name: background
  types:
  - <xref:str>
  - <xref:str>
  - <xref:str>
- description: 'Known values are: "high" and "low".'
  name: input_fidelity
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.InputFidelity>
- description: 'Optional mask for inpainting. Contains `image_url` (string, optional)

    and `file_id` (string, optional).'
  name: input_image_mask
  types:
  - <xref:azure.ai.projects.models.ImageGenToolInputImageMask>
- description: 'Number of partial images to generate in streaming mode, from 0 (default

    value) to 3.'
  name: partial_images
  types:
  - <xref:int>
- description: 'Whether to generate a new image or edit an existing image. Default:
    `auto`.

    Known values are: "generate", "edit", and "auto".'
  name: action
  types:
