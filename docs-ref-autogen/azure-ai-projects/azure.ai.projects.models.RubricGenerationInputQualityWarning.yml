### YamlMime:PythonClass
uid: azure.ai.projects.models.RubricGenerationInputQualityWarning
name: RubricGenerationInputQualityWarning
fullName: azure.ai.projects.models.RubricGenerationInputQualityWarning
module: azure.ai.projects.models
summary: 'A non-fatal advisory produced during rubric evaluator generation when resolved
  inputs are

  technically valid but likely too weak to produce a high-quality rubric. Read-only;

  service-generated. Persisted with the terminal EvaluatorGenerationJob.'
constructor:
  syntax: 'RubricGenerationInputQualityWarning(*args: Any, **kwargs: Any)'
variables:
- description: 'Stable searchable machine-readable warning code. Required. Known values
    are:

    "empty_prompt", "short_prompt", "empty_agent_instructions", "short_agent_instructions",

    "empty_dataset_content", "short_dataset_content", "low_trace_count", and

    "insufficient_total_input".'
  name: code
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.RubricGenerationInputQualityWarningCode>
- description: 'Advisory severity. Initial values: `warning`. Required. "warning"'
  name: severity
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.RubricGenerationInputQualityWarningSeverity>
- description: 'Human-readable message suitable for direct SDK/CLI/UI display. Must
    not include

    raw prompt, instruction, dataset, or trace text. Required.'
  name: message
  types:
  - <xref:str>
- description: 'Which source category the warning applies to. `aggregate` is used
    only for

    cross-source warnings. Required. Known values are: "prompt", "agent", "dataset",
    and

    "aggregate".'
  name: source
  types:
  - <xref:str>
  - <xref:azure.ai.projects.models.RubricGenerationInputQualityWarningSource>
- description: 'Zero-based index into `EvaluatorGenerationJob.inputs.sources` when
    the

    warning applies to a specific source. Omitted for aggregate warnings and for warnings
    not tied

    to one source.'
  name: source_index
  types:
  - <xref:int>
