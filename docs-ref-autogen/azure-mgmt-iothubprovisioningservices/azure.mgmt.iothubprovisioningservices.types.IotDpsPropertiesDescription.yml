### YamlMime:PythonClass
uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription
name: IotDpsPropertiesDescription
fullName: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription
module: azure.mgmt.iothubprovisioningservices.types
summary: 'the service specific properties of a provisioning service, including keys,
  linked iot hubs,

  current state, and system generated properties such as hostname and idScope.'
constructor:
  syntax: IotDpsPropertiesDescription()
variables:
- description: 'Current state of the provisioning service. Known values are: "Activating",

    "Active", "Deleting", "Deleted", "ActivationFailed", "DeletionFailed", "Transitioning",

    "Suspending", "Suspended", "Resuming", "FailingOver", and "FailoverFailed".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"State">]
- description: 'Whether requests from Public Network are allowed. Known values are:

    "Enabled" and "Disabled".'
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: The IP filter rules.
  name: ipFilterRules
  types:
  - <xref:list>[<xref:"IpFilterRule">]
- description: Private endpoint connections created on this IotHub.
  name: privateEndpointConnections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: The ARM provisioning state of the provisioning service.
  name: provisioningState
  types:
  - <xref:str>
- description: List of IoT hubs associated with this provisioning service.
  name: iotHubs
  types:
  - <xref:list>[<xref:"IotHubDefinitionDescription">]
- description: 'Allocation policy to be used by this provisioning service. Known values

    are: "Hashed", "GeoLatency", and "Static".'
  name: allocationPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AllocationPolicy">]
- description: Service endpoint for provisioning service.
  name: serviceOperationsHostName
  types:
  - <xref:str>
- description: Device endpoint for this provisioning service.
  name: deviceProvisioningHostName
  types:
  - <xref:str>
- description: Unique identifier of this provisioning service.
  name: idScope
  types:
  - <xref:str>
- description: List of authorization keys for a provisioning service.
  name: authorizationPolicies
  types:
  - <xref:list>[<xref:"SharedAccessSignatureAuthorizationRuleAccessRightsDescription">]
- description: 'Optional. Indicates if the DPS instance has Data Residency enabled,

    removing the cross geo-pair disaster recovery.'
  name: enableDataResidency
  types:
  - <xref:bool>
- description: Portal endpoint to enable CORS for this provisioning service.
  name: portalOperationsHostName
  types:
  - <xref:str>
- description: Disables all authentication methods other than Azure RBAC.
  name: disableLocalAuth
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.allocationPolicy
  name: allocationPolicy
  summary: '"Hashed",

    "GeoLatency", and "Static".'
  signature: 'allocationPolicy: str | AllocationPolicy'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.authorizationPolicies
  name: authorizationPolicies
  summary: List of authorization keys for a provisioning service.
  signature: 'authorizationPolicies: list[''SharedAccessSignatureAuthorizationRuleAccessRightsDescription'']'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.deviceProvisioningHostName
  name: deviceProvisioningHostName
  summary: Device endpoint for this provisioning service.
  signature: 'deviceProvisioningHostName: str'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.disableLocalAuth
  name: disableLocalAuth
  summary: Disables all authentication methods other than Azure RBAC.
  signature: 'disableLocalAuth: bool'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.enableDataResidency
  name: enableDataResidency
  summary: 'Optional. Indicates if the DPS instance has Data Residency enabled, removing
    the cross geo-pair

    disaster recovery.'
  signature: 'enableDataResidency: bool'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.idScope
  name: idScope
  summary: Unique identifier of this provisioning service.
  signature: 'idScope: str'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.iotHubs
  name: iotHubs
  summary: List of IoT hubs associated with this provisioning service.
  signature: 'iotHubs: list[''IotHubDefinitionDescription'']'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.ipFilterRules
  name: ipFilterRules
  summary: The IP filter rules.
  signature: 'ipFilterRules: list[''IpFilterRule'']'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.portalOperationsHostName
  name: portalOperationsHostName
  summary: Portal endpoint to enable CORS for this provisioning service.
  signature: 'portalOperationsHostName: str'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.privateEndpointConnections
  name: privateEndpointConnections
  summary: Private endpoint connections created on this IotHub.
  signature: 'privateEndpointConnections: list[''PrivateEndpointConnection'']'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.provisioningState
  name: provisioningState
  summary: The ARM provisioning state of the provisioning service.
  signature: 'provisioningState: str'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.publicNetworkAccess
  name: publicNetworkAccess
  summary: '"Enabled" and

    "Disabled".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.serviceOperationsHostName
  name: serviceOperationsHostName
  summary: Service endpoint for provisioning service.
  signature: 'serviceOperationsHostName: str'
- uid: azure.mgmt.iothubprovisioningservices.types.IotDpsPropertiesDescription.state
  name: state
  summary: '"Activating", "Active",

    "Deleting", "Deleted", "ActivationFailed", "DeletionFailed", "Transitioning",

    "Suspending", "Suspended", "Resuming", "FailingOver", and "FailoverFailed".'
  signature: 'state: str | State'
