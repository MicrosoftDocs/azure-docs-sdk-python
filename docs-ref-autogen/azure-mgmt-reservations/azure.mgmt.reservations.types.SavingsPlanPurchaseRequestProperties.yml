    plan.
  signature: 'billingScopeId: str'
- uid: azure.mgmt.reservations.types.SavingsPlanPurchaseRequestProperties.commitment
  name: commitment
  summary: Commitment towards the benefit.
  signature: 'commitment: Commitment'
