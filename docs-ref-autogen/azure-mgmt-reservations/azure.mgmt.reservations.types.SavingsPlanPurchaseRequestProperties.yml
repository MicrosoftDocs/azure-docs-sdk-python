    provide tenantId and managementGroupId if AppliedScopeType is ManagementGroup.'
  signature: 'appliedScopeProperties: AppliedScopeProperties'
- uid: azure.mgmt.reservations.types.SavingsPlanPurchaseRequestProperties.appliedScopeType
  name: appliedScopeType
  summary: '"Single", "Shared", and "ManagementGroup".'
  signature: 'appliedScopeType: str | AppliedScopeType'
- uid: azure.mgmt.reservations.types.SavingsPlanPurchaseRequestProperties.billingPlan
  name: billingPlan
  summary: 'Represents the billing plan in ISO 8601 format. Required only for monthly
    billing plans.

    "P1M"'
  signature: 'billingPlan: str | BillingPlan'
- uid: azure.mgmt.reservations.types.SavingsPlanPurchaseRequestProperties.billingScopeId
  name: billingScopeId
