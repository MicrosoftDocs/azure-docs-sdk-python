uid: azure.mgmt.reservations.types.SavingsPlanPurchaseRequestProperties
name: SavingsPlanPurchaseRequestProperties
fullName: azure.mgmt.reservations.types.SavingsPlanPurchaseRequestProperties
module: azure.mgmt.reservations.types
summary: Properties of a savings plan purchase.
constructor:
  syntax: SavingsPlanPurchaseRequestProperties()
variables:
- description: Friendly name of the savings plan.
  name: display_name
  types:
  - <xref:str>
- description: 'Subscription that will be charged for purchasing reservation or savings

    plan.'
  name: billing_scope_id
  types:
  - <xref:str>
- description: 'Represent savings plan term in ISO 8601 format. Known values are:
    "P1Y" and "P3Y".'
  name: term
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SavingsPlanTerm">]
- description: 'Represents the billing plan in ISO 8601 format. Required only for
    monthly

    billing plans. "P1M"'
  name: billing_plan
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BillingPlan">]
- description: 'Type of the Applied Scope. Known values are: "Single", "Shared", and

    "ManagementGroup".'
  name: applied_scope_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AppliedScopeType">]
- description: 'Properties specific to applied scope type. Not required if not

    applicable. Required and need to provide tenantId and managementGroupId if AppliedScopeType
    is

    ManagementGroup.'
  name: applied_scope_properties
  types:
  - <xref:<xref:"AppliedScopeProperties">>
- description: Commitment towards the benefit.
  name: commitment
  types:
  - <xref:<xref:"Commitment">>
attributes:
- uid: azure.mgmt.reservations.types.SavingsPlanPurchaseRequestProperties.appliedScopeProperties
  name: appliedScopeProperties
  summary: 'Properties specific to applied scope type. Not required if not applicable.
