### YamlMime:PythonClass
uid: azure.mgmt.costmanagement.types.ViewProperties
name: ViewProperties
fullName: azure.mgmt.costmanagement.types.ViewProperties
module: azure.mgmt.costmanagement.types
summary: The properties of the view.
constructor:
  syntax: ViewProperties()
variables:
- description: User input name of the view. Required.
  name: display_name
  types:
  - <xref:str>
- description: 'Cost Management scope to save the view on. This includes

    ''subscriptions/{subscriptionId}'' for subscription scope,

    ''subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}'' for resourceGroup
    scope,

    ''providers/Microsoft.Billing/billingAccounts/{billingAccountId}'' for Billing
    Account scope,

    ''providers/Microsoft.Billing/billingAccounts/{billingAccountId}/departments/{departmentId}''
    for

    Department scope,

    ''providers/Microsoft.Billing/billingAccounts/{billingAccountId}/enrollmentAccounts/{enrollmentAccountId}''

    for EnrollmentAccount scope,

    ''providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingProfiles/{billingProfileId}''

    for BillingProfile scope,

    ''providers/Microsoft.Billing/billingAccounts/{billingAccountId}/invoiceSections/{invoiceSectionId}''

    for InvoiceSection scope, ''providers/Microsoft.Management/managementGroups/{managementGroupId}''

    for Management Group scope,

    ''/providers/Microsoft.CostManagement/externalBillingAccounts/{externalBillingAccountName}''
    for

    ExternalBillingAccount scope, and

    ''/providers/Microsoft.CostManagement/externalSubscriptions/{externalSubscriptionName}''
    for

    ExternalSubscription scope.'
  name: scope
  types:
  - <xref:str>
- description: Date the user created this view.
  name: created_on
  types:
  - <xref:str>
- description: Date when the user last modified this view.
  name: modified_on
  types:
  - <xref:str>
- description: Date range of the current view.
  name: date_range
  types:
  - <xref:str>
- description: Currency of the current view.
  name: currency
  types:
  - <xref:str>
- description: Query body configuration. Required.
  name: query
  types:
  - <xref:<xref:"ReportConfigDefinition">>
- description: 'Chart type of the main view in Cost Analysis. Required. Known values
    are: "Area",

    "Line", "StackedColumn", "GroupedColumn", and "Table".'
  name: chart
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ChartType">]
- description: 'Show costs accumulated over time. Known values are: "true" and "false".'
  name: accumulated
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AccumulatedType">]
- description: 'Metric to use when displaying costs. Known values are: "ActualCost",

    "AmortizedCost", and "AHUB".'
  name: metric
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MetricType">]
- description: List of KPIs to show in Cost Analysis UI.
  name: kpis
  types:
  - <xref:list>[<xref:"KpiProperties">]
- description: Configuration of 3 sub-views in the Cost Analysis UI.
  name: pivots
  types:
  - <xref:list>[<xref:"PivotProperties">]
attributes:
- uid: azure.mgmt.costmanagement.types.ViewProperties.accumulated
  name: accumulated
  summary: '"true" and "false".'
  signature: 'accumulated: str | AccumulatedType'
- uid: azure.mgmt.costmanagement.types.ViewProperties.chart
  name: chart
  summary: '"Area", "Line",

    "StackedColumn", "GroupedColumn", and "Table".'
  signature: 'chart: str | ChartType'
- uid: azure.mgmt.costmanagement.types.ViewProperties.createdOn
  name: createdOn
  summary: Date the user created this view.
  signature: 'createdOn: str'
- uid: azure.mgmt.costmanagement.types.ViewProperties.currency
  name: currency
  summary: Currency of the current view.
  signature: 'currency: str'
- uid: azure.mgmt.costmanagement.types.ViewProperties.dateRange
  name: dateRange
  summary: Date range of the current view.
  signature: 'dateRange: str'
- uid: azure.mgmt.costmanagement.types.ViewProperties.displayName
  name: displayName
  summary: User input name of the view. Required.
  signature: 'displayName: str'
- uid: azure.mgmt.costmanagement.types.ViewProperties.kpis
  name: kpis
  summary: List of KPIs to show in Cost Analysis UI.
  signature: 'kpis: list[''KpiProperties'']'
- uid: azure.mgmt.costmanagement.types.ViewProperties.metric
  name: metric
  summary: '"ActualCost", "AmortizedCost", and

    "AHUB".'
  signature: 'metric: str | MetricType'
- uid: azure.mgmt.costmanagement.types.ViewProperties.modifiedOn
  name: modifiedOn
  summary: Date when the user last modified this view.
  signature: 'modifiedOn: str'
- uid: azure.mgmt.costmanagement.types.ViewProperties.pivots
  name: pivots
  summary: Configuration of 3 sub-views in the Cost Analysis UI.
  signature: 'pivots: list[''PivotProperties'']'
- uid: azure.mgmt.costmanagement.types.ViewProperties.query
  name: query
  summary: Query body configuration. Required.
  signature: 'query: ReportConfigDefinition'
- uid: azure.mgmt.costmanagement.types.ViewProperties.scope
  name: scope
  summary: 'Cost Management scope to save the view on. This includes ''subscriptions/{subscriptionId}''
    for

    subscription scope, ''subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}''
    for

    resourceGroup scope, ''providers/Microsoft.Billing/billingAccounts/{billingAccountId}''
    for

    Billing Account scope,

    ''providers/Microsoft.Billing/billingAccounts/{billingAccountId}/departments/{departmentId}''
    for

    Department scope,

    ''providers/Microsoft.Billing/billingAccounts/{billingAccountId}/enrollmentAccounts/{enrollmentAccountId}''

    for EnrollmentAccount scope,

    ''providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingProfiles/{billingProfileId}''

    for BillingProfile scope,

    ''providers/Microsoft.Billing/billingAccounts/{billingAccountId}/invoiceSections/{invoiceSectionId}''

    for InvoiceSection scope, ''providers/Microsoft.Management/managementGroups/{managementGroupId}''

    for Management Group scope,

    ''/providers/Microsoft.CostManagement/externalBillingAccounts/{externalBillingAccountName}''
    for

    ExternalBillingAccount scope, and

    ''/providers/Microsoft.CostManagement/externalSubscriptions/{externalSubscriptionName}''
    for

    ExternalSubscription scope.'
  signature: 'scope: str'
