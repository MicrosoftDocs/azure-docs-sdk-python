### YamlMime:PythonClass
uid: azure.mgmt.costmanagement.types.AlertPropertiesDefinition
name: AlertPropertiesDefinition
fullName: azure.mgmt.costmanagement.types.AlertPropertiesDefinition
module: azure.mgmt.costmanagement.types
summary: defines the type of alert.
constructor:
  syntax: AlertPropertiesDefinition()
variables:
- description: 'type of alert. Known values are: "Budget", "Invoice", "Credit", "Quota",
    "General",

    "xCloud", and "BudgetForecast".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AlertType">]
- description: 'Alert category. Known values are: "Cost", "Usage", "Billing", and
    "System".'
  name: category
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AlertCategory">]
- description: 'Criteria that triggered alert. Known values are: "CostThresholdExceeded",

    "UsageThresholdExceeded", "CreditThresholdApproaching", "CreditThresholdReached",

    "QuotaThresholdApproaching", "QuotaThresholdReached", "MultiCurrency",

    "ForecastCostThresholdExceeded", "ForecastUsageThresholdExceeded", "InvoiceDueDateApproaching",

    "InvoiceDueDateReached", "CrossCloudNewDataAvailable", "CrossCloudCollectionError",
    and

    "GeneralThresholdError".'
  name: criteria
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AlertCriteria">]
attributes:
- uid: azure.mgmt.costmanagement.types.AlertPropertiesDefinition.category
  name: category
  summary: '"Cost", "Usage", "Billing", and "System".'
  signature: 'category: str | AlertCategory'
- uid: azure.mgmt.costmanagement.types.AlertPropertiesDefinition.criteria
  name: criteria
  summary: '"CostThresholdExceeded",

    "UsageThresholdExceeded", "CreditThresholdApproaching", "CreditThresholdReached",

    "QuotaThresholdApproaching", "QuotaThresholdReached", "MultiCurrency",

    "ForecastCostThresholdExceeded", "ForecastUsageThresholdExceeded",

    "InvoiceDueDateApproaching", "InvoiceDueDateReached", "CrossCloudNewDataAvailable",

    "CrossCloudCollectionError", and "GeneralThresholdError".'
  signature: 'criteria: str | AlertCriteria'
- uid: azure.mgmt.costmanagement.types.AlertPropertiesDefinition.type
  name: type
  summary: '"Budget", "Invoice", "Credit", "Quota", "General",

    "xCloud", and "BudgetForecast".'
  signature: 'type: str | AlertType'
