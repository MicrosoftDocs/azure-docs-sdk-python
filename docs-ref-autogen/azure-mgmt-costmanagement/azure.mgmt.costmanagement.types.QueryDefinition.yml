### YamlMime:PythonClass
uid: azure.mgmt.costmanagement.types.QueryDefinition
name: QueryDefinition
fullName: azure.mgmt.costmanagement.types.QueryDefinition
module: azure.mgmt.costmanagement.types
summary: The definition of a query.
constructor:
  syntax: QueryDefinition()
variables:
- description: 'The type of the query. Required. Known values are: "Usage", "ActualCost",

    "AmortizedCost", "FocusCost", "PriceSheet", "ReservationTransactions",

    "ReservationRecommendations", and "ReservationDetails".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExportType">]
- description: 'The time frame for pulling data for the query. If custom, then a specific
    time

    period must be provided. Required. Known values are: "MonthToDate", "BillingMonthToDate",

    "TheLastMonth", "TheLastBillingMonth", "WeekToDate", "Custom", and "TheCurrentMonth".'
  name: timeframe
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TimeframeType">]
- description: Has time period for pulling data for the query.
  name: time_period
  types:
  - <xref:<xref:"QueryTimePeriod">>
- description: Has definition for data in this query. Required.
  name: dataset
  types:
  - <xref:<xref:"QueryDataset">>
attributes:
- uid: azure.mgmt.costmanagement.types.QueryDefinition.dataset
  name: dataset
  summary: Has definition for data in this query. Required.
  signature: 'dataset: Required[QueryDataset]'
- uid: azure.mgmt.costmanagement.types.QueryDefinition.timePeriod
  name: timePeriod
  summary: Has time period for pulling data for the query.
  signature: 'timePeriod: QueryTimePeriod'
- uid: azure.mgmt.costmanagement.types.QueryDefinition.timeframe
  name: timeframe
  summary: 'The time frame for pulling data for the query. If custom, then a specific
    time period must be

    provided. Required. Known values are: "MonthToDate", "BillingMonthToDate",

    "TheLastMonth", "TheLastBillingMonth", "WeekToDate", "Custom", and "TheCurrentMonth".'
  signature: 'timeframe: Required[str | TimeframeType]'
- uid: azure.mgmt.costmanagement.types.QueryDefinition.type
  name: type
  summary: '"Usage", "ActualCost",

    "AmortizedCost", "FocusCost", "PriceSheet", "ReservationTransactions",

    "ReservationRecommendations", and "ReservationDetails".'
  signature: 'type: Required[str | ExportType]'
