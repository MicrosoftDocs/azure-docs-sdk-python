### YamlMime:PythonClass
uid: azure.mgmt.costmanagement.types.BudgetProperties
name: BudgetProperties
fullName: azure.mgmt.costmanagement.types.BudgetProperties
module: azure.mgmt.costmanagement.types
summary: The properties of the budget.
constructor:
  syntax: BudgetProperties()
variables:
- description: "The category of the budget.\n\n* 'Cost' defines a Budget. \n\n* 'ReservationUtilization'\
    \ defines a Reservation Utilization Alert Rule. Required. Known values are: \"\
    Cost\" and \"ReservationUtilization\"."
  name: category
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CategoryType">]
- description: 'The total amount of cost to track with the budget.


    Supported for CategoryType(s): Cost.


    Required for CategoryType(s): Cost.'
  name: amount
  types:
  - <xref:float>
- description: "The time covered by a budget. Tracking of the amount will be reset\
    \ based on\nthe time grain. Supported for CategoryType(s): Cost, ReservationUtilization.\
    \ Supported\ntimeGrainTypes for **CategoryType: Cost**\n\n* Monthly \n\n* Quarterly\
    \ \n\n* Annually \n\n* BillingMonth* \n\n* BillingQuarter* \n\n* BillingAnnual*\
    \ \n\n>>*<<only supported for Web Direct customers.\n\nSupported timeGrainTypes\
    \ for **CategoryType: ReservationUtilization**\n\n* Last7Days \n\n* Last30Days\
    \ \n\nRequired for CategoryType(s): Cost, ReservationUtilization. Required. Known\
    \ values are:\n\"Monthly\", \"Quarterly\", \"Annually\", \"BillingMonth\", \"\
    BillingQuarter\", \"BillingAnnual\",\n\"Last7Days\", and \"Last30Days\"."
  name: time_grain
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TimeGrainType">]
- description: 'The time period that defines the active period of the budget. The
    budget

    will evaluate data on or after the startDate and will expire on the endDate.


    Supported for CategoryType(s): Cost, ReservationUtilization.


    Required for CategoryType(s): Cost, ReservationUtilization. Required.'
  name: time_period
  types:
  - <xref:<xref:"BudgetTimePeriod">>
- description: 'May be used to filter budgets by user-specified dimensions and/or
    tags.


    Supported for CategoryType(s): Cost, ReservationUtilization.'
  name: filter
  types:
  - <xref:<xref:"BudgetFilter">>
- description: 'The current amount of cost which is being tracked for a budget.


    Supported for CategoryType(s): Cost.'
  name: current_spend
  types:
  - <xref:<xref:"CurrentSpend">>
- description: "Dictionary of notifications associated with the budget. Supported\
    \ for\nCategoryType(s): Cost, ReservationUtilization.\n\n* Constraints for **CategoryType:\
    \ Cost** - Budget can have up to 5 notifications with thresholdType: Actual and\
    \ 5 notifications with thresholdType: Forecasted. \n\n* Constraints for **CategoryType:\
    \ ReservationUtilization** - Only one notification allowed. thresholdType is not\
    \ applicable."
  name: notifications
  types:
  - <xref:dict>[<xref:str>, <xref:"Notification">]
- description: 'The forecasted cost which is being tracked for a budget.


    Supported for CategoryType(s): Cost.'
  name: forecast_spend
  types:
  - <xref:<xref:"ForecastSpend">>
attributes:
- uid: azure.mgmt.costmanagement.types.BudgetProperties.amount
  name: amount
  summary: 'The total amount of cost to track with the budget.


    Supported for CategoryType(s): Cost.


    Required for CategoryType(s): Cost.'
  signature: 'amount: float'
- uid: azure.mgmt.costmanagement.types.BudgetProperties.category
  name: category
  summary: "The category of the budget.\n\n* 'Cost' defines a Budget. \n\n* 'ReservationUtilization'\
    \ defines a Reservation Utilization Alert Rule. Required. Known values are: \"\
    Cost\" and \"ReservationUtilization\". "
  signature: 'category: Required[str | CategoryType]'
- uid: azure.mgmt.costmanagement.types.BudgetProperties.currentSpend
  name: currentSpend
  summary: 'The current amount of cost which is being tracked for a budget.


    Supported for CategoryType(s): Cost.'
  signature: 'currentSpend: CurrentSpend'
- uid: azure.mgmt.costmanagement.types.BudgetProperties.filter
  name: filter
  summary: 'May be used to filter budgets by user-specified dimensions and/or tags.


    Supported for CategoryType(s): Cost, ReservationUtilization.'
  signature: 'filter: BudgetFilter'
- uid: azure.mgmt.costmanagement.types.BudgetProperties.forecastSpend
  name: forecastSpend
  summary: 'The forecasted cost which is being tracked for a budget.


    Supported for CategoryType(s): Cost.'
  signature: 'forecastSpend: ForecastSpend'
- uid: azure.mgmt.costmanagement.types.BudgetProperties.notifications
  name: notifications
  summary: "Cost,\nReservationUtilization.\n\n* Constraints for **CategoryType: Cost**\
    \ - Budget can have up to 5 notifications with thresholdType: Actual and 5 notifications\
    \ with thresholdType: Forecasted. \n\n* Constraints for **CategoryType: ReservationUtilization**\
    \ - Only one notification allowed. thresholdType is not applicable. "
  signature: 'notifications: dict[str, ''Notification'']'
- uid: azure.mgmt.costmanagement.types.BudgetProperties.timeGrain
  name: timeGrain
  summary: "The time covered by a budget. Tracking of the amount will be reset based\
    \ on the time grain.\nSupported for CategoryType(s): Cost, ReservationUtilization.\
    \ Supported timeGrainTypes for\n**CategoryType: Cost**\n\n* Monthly \n\n* Quarterly\
    \ \n\n* Annually \n\n* BillingMonth* \n\n* BillingQuarter* \n\n* BillingAnnual*\
    \ \n\n>>*<<only supported for Web Direct customers.\n\nSupported timeGrainTypes\
    \ for **CategoryType: ReservationUtilization**\n\n* Last7Days \n\n* Last30Days\
    \ \n\nRequired for CategoryType(s): Cost, ReservationUtilization. Required. Known\
    \ values are:\n\"Monthly\", \"Quarterly\", \"Annually\", \"BillingMonth\", \"\
    BillingQuarter\",\n\"BillingAnnual\", \"Last7Days\", and \"Last30Days\"."
  signature: 'timeGrain: Required[str | TimeGrainType]'
- uid: azure.mgmt.costmanagement.types.BudgetProperties.timePeriod
  name: timePeriod
  summary: 'The time period that defines the active period of the budget. The budget
    will evaluate data on

    or after the startDate and will expire on the endDate.


    Supported for CategoryType(s): Cost, ReservationUtilization.


    Required for CategoryType(s): Cost, ReservationUtilization. Required.'
  signature: 'timePeriod: Required[BudgetTimePeriod]'
