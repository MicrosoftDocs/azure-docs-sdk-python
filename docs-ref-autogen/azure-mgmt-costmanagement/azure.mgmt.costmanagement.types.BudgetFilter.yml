uid: azure.mgmt.costmanagement.types.BudgetFilter
name: BudgetFilter
fullName: azure.mgmt.costmanagement.types.BudgetFilter
module: azure.mgmt.costmanagement.types
summary: 'May be used to filter budgets by user-specified dimensions and/or tags.


  Supported for CategoryType(s): Cost, ReservationUtilization.'
constructor:
  syntax: BudgetFilter()
variables:
- description: 'The logical "AND" expression. Must have at least 2 items.


    Supported for CategoryType(s): Cost.'
  name: and_property
  types:
  - <xref:list>[<xref:"BudgetFilterProperties">]
- description: "Has comparison expression for a dimension. Supported for CategoryType(s):\n\
    Cost, ReservationUtilization. Supported dimension names for **CategoryType:\n\
    ReservationUtilization**\n\n* ReservationId \n\n* ReservedResourceType."
  name: dimensions
  types:
  - <xref:<xref:"BudgetComparisonExpression">>
- description: 'Has comparison expression for a tag.


    Supported for CategoryType(s): Cost.'
  name: tags
  types:
  - <xref:<xref:"BudgetComparisonExpression">>
attributes:
- uid: azure.mgmt.costmanagement.types.BudgetFilter.and
  name: and
  signature: 'and: list[azure.mgmt.costmanagement.types.BudgetFilterProperties]'
- uid: azure.mgmt.costmanagement.types.BudgetFilter.dimensions
  name: dimensions
