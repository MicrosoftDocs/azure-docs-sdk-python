### YamlMime:PythonClass
uid: azure.mgmt.costmanagement.types.ExportSchedule
name: ExportSchedule
fullName: azure.mgmt.costmanagement.types.ExportSchedule
module: azure.mgmt.costmanagement.types
summary: The schedule associated with the export.
constructor:
  syntax: ExportSchedule()
variables:
- description: 'The status of the export''s schedule. If ''Inactive'', the export''s
    schedule is

    paused. To enable export set the status to be Active and then make a PUT request.
    Known values

    are: "Active" and "Inactive".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StatusType">]
- description: 'The schedule recurrence. Known values are: "Daily", "Weekly", "Monthly",
    and

    "Annually".'
  name: recurrence
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RecurrenceType">]
- description: 'Has start and end date of the recurrence. The start date must be in

    future. If present, the end date must be greater than start date.'
  name: recurrence_period
  types:
  - <xref:<xref:"ExportRecurrencePeriod">>
attributes:
- uid: azure.mgmt.costmanagement.types.ExportSchedule.recurrence
  name: recurrence
  summary: '"Daily", "Weekly", "Monthly", and

    "Annually".'
  signature: 'recurrence: str | RecurrenceType'
- uid: azure.mgmt.costmanagement.types.ExportSchedule.recurrencePeriod
  name: recurrencePeriod
  summary: 'Has start and end date of the recurrence. The start date must be in future.
    If present, the end

    date must be greater than start date.'
  signature: 'recurrencePeriod: ExportRecurrencePeriod'
- uid: azure.mgmt.costmanagement.types.ExportSchedule.status
  name: status
  summary: 'The status of the export''s schedule. If ''Inactive'', the export''s schedule
    is paused. To enable

    export set the status to be Active and then make a PUT request. Known values are:
    "Active"

    and "Inactive".'
  signature: 'status: str | StatusType'
