### YamlMime:PythonClass
uid: azure.mgmt.costmanagement.types.ExportRunProperties
name: ExportRunProperties
fullName: azure.mgmt.costmanagement.types.ExportRunProperties
module: azure.mgmt.costmanagement.types
summary: The properties of the export run.
constructor:
  syntax: ExportRunProperties()
variables:
- description: 'The type of the export run. Known values are: "OnDemand" and "Scheduled".'
  name: execution_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExecutionType">]
- description: 'The last known status of the export run. Known values are: "Queued",

    "InProgress", "Completed", "Failed", "Timeout", "NewDataNotAvailable", and "DataNotAvailable".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExecutionStatus">]
- description: 'The identifier for the entity that triggered the export. For on-demand
    runs

    it is the user email. For scheduled runs it is ''System''.'
  name: submitted_by
  types:
  - <xref:str>
- description: The time when export was queued to be run.
  name: submitted_time
  types:
  - <xref:str>
- description: The time when export was picked up to be run.
  name: processing_start_time
  types:
  - <xref:str>
- description: The time when the export run finished.
  name: processing_end_time
  types:
  - <xref:str>
- description: The start datetime for the export.
  name: start_date
  types:
  - <xref:str>
- description: The end datetime for the export.
  name: end_date
  types:
  - <xref:str>
- description: The name of the exported file.
  name: file_name
  types:
  - <xref:str>
- description: The manifest file location(URI location) for the exported files.
  name: manifest_file
  types:
  - <xref:str>
- description: The export settings that were in effect for this run.
  name: run_settings
  types:
  - <xref:<xref:"CommonExportProperties">>
- description: The details of any error.
  name: error
  types:
  - <xref:<xref:"ErrorDetails">>
attributes:
- uid: azure.mgmt.costmanagement.types.ExportRunProperties.endDate
  name: endDate
  summary: The end datetime for the export.
  signature: 'endDate: str'
- uid: azure.mgmt.costmanagement.types.ExportRunProperties.error
  name: error
  summary: The details of any error.
  signature: 'error: ErrorDetails'
- uid: azure.mgmt.costmanagement.types.ExportRunProperties.executionType
  name: executionType
  summary: '"OnDemand" and "Scheduled".'
  signature: 'executionType: str | ExecutionType'
- uid: azure.mgmt.costmanagement.types.ExportRunProperties.fileName
  name: fileName
  summary: The name of the exported file.
  signature: 'fileName: str'
- uid: azure.mgmt.costmanagement.types.ExportRunProperties.manifestFile
  name: manifestFile
  summary: The manifest file location(URI location) for the exported files.
  signature: 'manifestFile: str'
- uid: azure.mgmt.costmanagement.types.ExportRunProperties.processingEndTime
  name: processingEndTime
  summary: The time when the export run finished.
  signature: 'processingEndTime: str'
- uid: azure.mgmt.costmanagement.types.ExportRunProperties.processingStartTime
  name: processingStartTime
  summary: The time when export was picked up to be run.
  signature: 'processingStartTime: str'
- uid: azure.mgmt.costmanagement.types.ExportRunProperties.runSettings
  name: runSettings
  summary: The export settings that were in effect for this run.
  signature: 'runSettings: CommonExportProperties'
- uid: azure.mgmt.costmanagement.types.ExportRunProperties.startDate
  name: startDate
  summary: The start datetime for the export.
  signature: 'startDate: str'
- uid: azure.mgmt.costmanagement.types.ExportRunProperties.status
  name: status
  summary: '"Queued", "InProgress",

    "Completed", "Failed", "Timeout", "NewDataNotAvailable", and "DataNotAvailable".'
  signature: 'status: str | ExecutionStatus'
- uid: azure.mgmt.costmanagement.types.ExportRunProperties.submittedBy
  name: submittedBy
  summary: 'The identifier for the entity that triggered the export. For on-demand
    runs it is the user

    email. For scheduled runs it is ''System''.'
  signature: 'submittedBy: str'
- uid: azure.mgmt.costmanagement.types.ExportRunProperties.submittedTime
  name: submittedTime
  summary: The time when export was queued to be run.
  signature: 'submittedTime: str'
