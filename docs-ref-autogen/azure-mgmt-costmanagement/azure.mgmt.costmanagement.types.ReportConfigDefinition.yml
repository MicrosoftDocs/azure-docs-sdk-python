### YamlMime:PythonClass
uid: azure.mgmt.costmanagement.types.ReportConfigDefinition
name: ReportConfigDefinition
fullName: azure.mgmt.costmanagement.types.ReportConfigDefinition
module: azure.mgmt.costmanagement.types
summary: The definition of a report config.
constructor:
  syntax: ReportConfigDefinition()
variables:
- description: 'The type of the report. Usage represents actual usage, forecast represents

    forecasted data and UsageAndForecast represents both usage and forecasted data.
    Actual usage

    and forecasted data can be differentiated based on dates. Required. "Usage"'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReportType">]
- description: 'The time frame for pulling data for the report. If custom, then a
    specific

    time period must be provided. Required. Known values are: "WeekToDate", "MonthToDate",

    "YearToDate", and "Custom".'
  name: timeframe
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReportTimeframeType">]
- description: Has time period for pulling data for the report.
  name: time_period
  types:
  - <xref:<xref:"ReportConfigTimePeriod">>
- description: Has definition for data in this report config.
  name: data_set
  types:
  - <xref:<xref:"ReportConfigDataset">>
- description: If true, report includes monetary commitment.
  name: include_monetary_commitment
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.costmanagement.types.ReportConfigDefinition.dataSet
  name: dataSet
  summary: Has definition for data in this report config.
  signature: 'dataSet: ReportConfigDataset'
- uid: azure.mgmt.costmanagement.types.ReportConfigDefinition.includeMonetaryCommitment
  name: includeMonetaryCommitment
  summary: If true, report includes monetary commitment.
  signature: 'includeMonetaryCommitment: bool'
- uid: azure.mgmt.costmanagement.types.ReportConfigDefinition.timePeriod
  name: timePeriod
  summary: Has time period for pulling data for the report.
  signature: 'timePeriod: ReportConfigTimePeriod'
- uid: azure.mgmt.costmanagement.types.ReportConfigDefinition.timeframe
  name: timeframe
  summary: 'The time frame for pulling data for the report. If custom, then a specific
    time period must be

    provided. Required. Known values are: "WeekToDate", "MonthToDate", "YearToDate",
    and

    "Custom".'
  signature: 'timeframe: Required[str | ReportTimeframeType]'
- uid: azure.mgmt.costmanagement.types.ReportConfigDefinition.type
  name: type
  summary: 'The type of the report. Usage represents actual usage, forecast represents
    forecasted data and

    UsageAndForecast represents both usage and forecasted data. Actual usage and forecasted
    data

    can be differentiated based on dates. Required. "Usage"'
  signature: 'type: Required[str | ReportType]'
