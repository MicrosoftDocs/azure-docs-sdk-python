### YamlMime:PythonClass
uid: azure.mgmt.costmanagement.types.ForecastDataset
name: ForecastDataset
fullName: azure.mgmt.costmanagement.types.ForecastDataset
module: azure.mgmt.costmanagement.types
summary: The definition of data present in the forecast.
constructor:
  syntax: ForecastDataset()
variables:
- description: 'The granularity of rows in the forecast. Known values are: "Daily"
    and

    "Monthly".'
  name: granularity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GranularityType">]
- description: 'Has configuration information for the data in the export. The

    configuration will be ignored if aggregation and grouping are provided.'
  name: configuration
  types:
  - <xref:<xref:"ForecastDatasetConfiguration">>
- description: 'Dictionary of aggregation expression to use in the forecast. The key
    of each

    item in the dictionary is the alias for the aggregated column. forecast can have
    up to 2

    aggregation clauses. Required.'
  name: aggregation
  types:
  - <xref:dict>[<xref:str>, <xref:"ForecastAggregation">]
- description: Has filter expression to use in the forecast.
  name: filter
  types:
  - <xref:<xref:"ForecastFilter">>
attributes:
- uid: azure.mgmt.costmanagement.types.ForecastDataset.aggregation
  name: aggregation
  summary: 'Dictionary of aggregation expression to use in the forecast. The key of
    each item in the

    dictionary is the alias for the aggregated column. forecast can have up to 2 aggregation

    clauses. Required.'
  signature: 'aggregation: Required[dict[str, ''ForecastAggregation'']]'
- uid: azure.mgmt.costmanagement.types.ForecastDataset.configuration
  name: configuration
  summary: 'Has configuration information for the data in the export. The configuration
    will be ignored if

    aggregation and grouping are provided.'
  signature: 'configuration: ForecastDatasetConfiguration'
- uid: azure.mgmt.costmanagement.types.ForecastDataset.filter
  name: filter
  summary: Has filter expression to use in the forecast.
  signature: 'filter: ForecastFilter'
- uid: azure.mgmt.costmanagement.types.ForecastDataset.granularity
  name: granularity
  summary: '"Daily" and "Monthly".'
  signature: 'granularity: str | GranularityType'
