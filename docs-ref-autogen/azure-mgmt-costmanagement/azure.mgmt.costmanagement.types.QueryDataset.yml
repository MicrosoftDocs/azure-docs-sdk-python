### YamlMime:PythonClass
uid: azure.mgmt.costmanagement.types.QueryDataset
name: QueryDataset
fullName: azure.mgmt.costmanagement.types.QueryDataset
module: azure.mgmt.costmanagement.types
summary: The definition of data present in the query.
constructor:
  syntax: QueryDataset()
variables:
- description: 'The granularity of rows in the query. Known values are: "Daily" and

    "Monthly".'
  name: granularity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GranularityType">]
- description: 'Has configuration information for the data in the export. The

    configuration will be ignored if aggregation and grouping are provided.'
  name: configuration
  types:
  - <xref:<xref:"QueryDatasetConfiguration">>
- description: 'Dictionary of aggregation expression to use in the query. The key
    of each

    item in the dictionary is the alias for the aggregated column. Query can have
    up to 2

    aggregation clauses.'
  name: aggregation
  types:
  - <xref:dict>[<xref:str>, <xref:"QueryAggregation">]
- description: 'Array of group by expression to use in the query. Query can have up
    to 2 group

    by clauses.'
  name: grouping
  types:
  - <xref:list>[<xref:"QueryGrouping">]
- description: 'The filter expression to use in the query. Please reference our Query
    API REST

    documentation for how to properly format the filter.'
  name: filter
  types:
  - <xref:<xref:"QueryFilter">>
attributes:
- uid: azure.mgmt.costmanagement.types.QueryDataset.aggregation
  name: aggregation
  summary: 'Dictionary of aggregation expression to use in the query. The key of each
    item in the

    dictionary is the alias for the aggregated column. Query can have up to 2 aggregation
    clauses.'
  signature: 'aggregation: dict[str, ''QueryAggregation'']'
- uid: azure.mgmt.costmanagement.types.QueryDataset.configuration
  name: configuration
  summary: 'Has configuration information for the data in the export. The configuration
    will be ignored if

    aggregation and grouping are provided.'
  signature: 'configuration: QueryDatasetConfiguration'
- uid: azure.mgmt.costmanagement.types.QueryDataset.filter
  name: filter
  summary: 'The filter expression to use in the query. Please reference our Query
    API REST documentation

    for how to properly format the filter.'
  signature: 'filter: QueryFilter'
- uid: azure.mgmt.costmanagement.types.QueryDataset.granularity
  name: granularity
  summary: '"Daily" and "Monthly".'
  signature: 'granularity: str | GranularityType'
