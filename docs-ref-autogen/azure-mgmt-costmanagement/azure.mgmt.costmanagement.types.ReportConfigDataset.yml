### YamlMime:PythonClass
uid: azure.mgmt.costmanagement.types.ReportConfigDataset
name: ReportConfigDataset
fullName: azure.mgmt.costmanagement.types.ReportConfigDataset
module: azure.mgmt.costmanagement.types
summary: The definition of data present in the report.
constructor:
  syntax: ReportConfigDataset()
variables:
- description: 'The granularity of rows in the report. Known values are: "Daily" and

    "Monthly".'
  name: granularity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReportGranularityType">]
- description: 'Has configuration information for the data in the report. The

    configuration will be ignored if aggregation and grouping are provided.'
  name: configuration
  types:
  - <xref:<xref:"ReportConfigDatasetConfiguration">>
- description: 'Dictionary of aggregation expression to use in the report. The key
    of each

    item in the dictionary is the alias for the aggregated column. Report can have
    up to 2

    aggregation clauses.'
  name: aggregation
  types:
  - <xref:dict>[<xref:str>, <xref:"ReportConfigAggregation">]
- description: 'Array of group by expression to use in the report. Report can have
    up to 2

    group by clauses.'
  name: grouping
  types:
  - <xref:list>[<xref:"ReportConfigGrouping">]
- description: Array of order by expression to use in the report.
  name: sorting
  types:
  - <xref:list>[<xref:"ReportConfigSorting">]
- description: Has filter expression to use in the report.
  name: filter
  types:
  - <xref:<xref:"ReportConfigFilter">>
attributes:
- uid: azure.mgmt.costmanagement.types.ReportConfigDataset.aggregation
  name: aggregation
  summary: 'Dictionary of aggregation expression to use in the report. The key of
    each item in the

    dictionary is the alias for the aggregated column. Report can have up to 2 aggregation
    clauses.'
  signature: 'aggregation: dict[str, ''ReportConfigAggregation'']'
