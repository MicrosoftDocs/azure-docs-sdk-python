### YamlMime:PythonClass
uid: azure.mgmt.recoveryservices.types.IdentityData
name: IdentityData
fullName: azure.mgmt.recoveryservices.types.IdentityData
module: azure.mgmt.recoveryservices.types
summary: Identity for the resource.
constructor:
  syntax: IdentityData()
variables:
- description: The principal ID of resource identity.
  name: principalId
  types:
  - <xref:str>
- description: The tenant ID of resource.
  name: tenantId
  types:
  - <xref:str>
- description: 'The type of managed identity used. The type ''SystemAssigned, UserAssigned''
    includes

    both an implicitly created identity and a set of user-assigned identities. The
    type ''None'' will

    remove any identities. Required. Known values are: "SystemAssigned", "None", "UserAssigned",

    and "SystemAssigned, UserAssigned".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceIdentityType">]
- description: 'The list of user-assigned identities associated with the

    resource. The user-assigned identity dictionary keys will be ARM resource ids
    in the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}''.'
  name: userAssignedIdentities
  types:
  - <xref:dict>[<xref:str>, <xref:"UserIdentity">]
attributes:
- uid: azure.mgmt.recoveryservices.types.IdentityData.principalId
  name: principalId
  summary: The principal ID of resource identity.
  signature: 'principalId: str'
- uid: azure.mgmt.recoveryservices.types.IdentityData.tenantId
  name: tenantId
  summary: The tenant ID of resource.
  signature: 'tenantId: str'
- uid: azure.mgmt.recoveryservices.types.IdentityData.type
  name: type
  summary: 'The type of managed identity used. The type ''SystemAssigned, UserAssigned''
    includes both an

    implicitly created identity and a set of user-assigned identities. The type ''None''
    will remove

    any identities. Required. Known values are: "SystemAssigned", "None", "UserAssigned",
    and

    "SystemAssigned, UserAssigned".'
  signature: 'type: Required[str | ResourceIdentityType]'
- uid: azure.mgmt.recoveryservices.types.IdentityData.userAssignedIdentities
  name: userAssignedIdentities
  summary: 'The list of user-assigned identities associated with the resource. The
    user-assigned identity

    dictionary keys will be ARM resource ids in the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}''.'
  signature: 'userAssignedIdentities: dict[str, ''UserIdentity'']'
