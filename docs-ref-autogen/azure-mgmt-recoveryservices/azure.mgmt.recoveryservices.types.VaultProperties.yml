  name: privateEndpointStateForSiteRecovery
  summary: '"None" and "Enabled".'
  signature: 'privateEndpointStateForSiteRecovery: str | VaultPrivateEndpointState'
- uid: azure.mgmt.recoveryservices.types.VaultProperties.provisioningState
  name: provisioningState
  summary: Provisioning State.
  signature: 'provisioningState: str'
