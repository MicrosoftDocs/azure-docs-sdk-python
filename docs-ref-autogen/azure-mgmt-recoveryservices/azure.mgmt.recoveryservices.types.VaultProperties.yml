- uid: azure.mgmt.recoveryservices.types.VaultProperties.bcdrSecurityLevel
  name: bcdrSecurityLevel
  summary: 'Security levels of Recovery Services Vault for business continuity and
    disaster recovery. Known

    values are: "Poor", "Fair", "Good", and "Excellent".'
  signature: 'bcdrSecurityLevel: str | BCDRSecurityLevel'
- uid: azure.mgmt.recoveryservices.types.VaultProperties.costManagementSettings
  name: costManagementSettings
  summary: Cost Management Settings of the vault.
  signature: 'costManagementSettings: CostManagementSettings'
- uid: azure.mgmt.recoveryservices.types.VaultProperties.encryption
  name: encryption
  summary: Customer Managed Key details of the resource.
  signature: 'encryption: VaultPropertiesEncryption'
- uid: azure.mgmt.recoveryservices.types.VaultProperties.monitoringSettings
  name: monitoringSettings
  summary: Monitoring Settings of the vault.
  signature: 'monitoringSettings: MonitoringSettings'
- uid: azure.mgmt.recoveryservices.types.VaultProperties.moveDetails
  name: moveDetails
  summary: The details of the latest move operation performed on the Azure Resource.
  signature: 'moveDetails: VaultPropertiesMoveDetails'
- uid: azure.mgmt.recoveryservices.types.VaultProperties.moveState
  name: moveState
  summary: '"Unknown",

    "InProgress", "PrepareFailed", "CommitFailed", "PrepareTimedout", "CommitTimedout",

    "MoveSucceeded", "Failure", "CriticalFailure", and "PartialSuccess".'
  signature: 'moveState: str | ResourceMoveState'
