### YamlMime:PythonClass
uid: azure.mgmt.recoveryservices.types.VaultProperties
name: VaultProperties
fullName: azure.mgmt.recoveryservices.types.VaultProperties
module: azure.mgmt.recoveryservices.types
summary: Properties of the vault.
constructor:
  syntax: VaultProperties()
variables:
- description: Provisioning State.
  name: provisioning_state
  types:
  - <xref:str>
- description: Details for upgrading vault.
  name: upgrade_details
  types:
  - <xref:<xref:"UpgradeDetails">>
- description: List of private endpoint connection.
  name: private_endpoint_connections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnectionVaultProperties">]
- description: 'Private endpoint state for backup. Known values are:

    "None" and "Enabled".'
  name: private_endpoint_state_for_backup
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VaultPrivateEndpointState">]
- description: 'Private endpoint state for site recovery. Known

    values are: "None" and "Enabled".'
  name: private_endpoint_state_for_site_recovery
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VaultPrivateEndpointState">]
- description: Customer Managed Key details of the resource.
  name: encryption
  types:
  - <xref:<xref:"VaultPropertiesEncryption">>
- description: The details of the latest move operation performed on the Azure Resource.
  name: move_details
  types:
  - <xref:<xref:"VaultPropertiesMoveDetails">>
- description: 'The State of the Resource after the move operation. Known values are:

    "Unknown", "InProgress", "PrepareFailed", "CommitFailed", "PrepareTimedout", "CommitTimedout",

    "MoveSucceeded", "Failure", "CriticalFailure", and "PartialSuccess".'
  name: move_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceMoveState">]
- description: 'Backup storage version. Known values are: "V1", "V2", and

    "Unassigned".'
  name: backup_storage_version
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BackupStorageVersion">]
- description: 'property to enable or disable resource provider inbound network

    traffic from public clients. Known values are: "Enabled" and "Disabled".'
  name: public_network_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: Monitoring Settings of the vault.
  name: monitoring_settings
  types:
  - <xref:<xref:"MonitoringSettings">>
- description: Cost Management Settings of the vault.
  name: cost_management_settings
  types:
  - <xref:<xref:"CostManagementSettings">>
- description: Restore Settings of the vault.
  name: restore_settings
  types:
  - <xref:<xref:"RestoreSettings">>
- description: The redundancy Settings of a Vault.
  name: redundancy_settings
  types:
  - <xref:<xref:"VaultPropertiesRedundancySettings">>
- description: Security Settings of the vault.
  name: security_settings
  types:
  - <xref:<xref:"SecuritySettings">>
- description: 'Secure Score of Recovery Services Vault. Known values are: "None",

    "Minimum", "Adequate", and "Maximum".'
  name: secure_score
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecureScoreLevel">]
- description: 'Security levels of Recovery Services Vault for business continuity

    and disaster recovery. Known values are: "Poor", "Fair", "Good", and "Excellent".'
  name: bcdr_security_level
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"BCDRSecurityLevel">]
- description: 'ResourceGuardOperationRequests on which LAC check will

    be performed.'
  name: resource_guard_operation_requests
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.recoveryservices.types.VaultProperties.backupStorageVersion
  name: backupStorageVersion
  summary: '"V1", "V2", and "Unassigned".'
