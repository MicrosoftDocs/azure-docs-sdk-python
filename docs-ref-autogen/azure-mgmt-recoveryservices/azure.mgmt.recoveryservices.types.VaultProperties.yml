  name: restoreSettings
  summary: Restore Settings of the vault.
  signature: 'restoreSettings: RestoreSettings'
- uid: azure.mgmt.recoveryservices.types.VaultProperties.secureScore
  name: secureScore
  summary: '"None", "Minimum", "Adequate",

    and "Maximum".'
  signature: 'secureScore: str | SecureScoreLevel'
- uid: azure.mgmt.recoveryservices.types.VaultProperties.securitySettings
  name: securitySettings
  summary: Security Settings of the vault.
  signature: 'securitySettings: SecuritySettings'
- uid: azure.mgmt.recoveryservices.types.VaultProperties.upgradeDetails
  name: upgradeDetails
  summary: Details for upgrading vault.
  signature: 'upgradeDetails: UpgradeDetails'
