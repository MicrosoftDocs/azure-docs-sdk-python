    Known values are: "Enabled" and "Disabled".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.recoveryservices.types.VaultProperties.redundancySettings
  name: redundancySettings
  summary: The redundancy Settings of a Vault.
  signature: 'redundancySettings: VaultPropertiesRedundancySettings'
