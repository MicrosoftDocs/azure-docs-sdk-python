### YamlMime:PythonClass
uid: azure.mgmt.recoveryservices.types.UpgradeDetails
name: UpgradeDetails
fullName: azure.mgmt.recoveryservices.types.UpgradeDetails
module: azure.mgmt.recoveryservices.types
summary: Details for upgrading vault.
constructor:
  syntax: UpgradeDetails()
variables:
- description: ID of the vault upgrade operation.
  name: operation_id
  types:
  - <xref:str>
- description: UTC time at which the upgrade operation has started.
  name: start_time_utc
  types:
  - <xref:str>
- description: UTC time at which the upgrade operation status was last updated.
  name: last_updated_time_utc
  types:
  - <xref:str>
- description: UTC time at which the upgrade operation has ended.
  name: end_time_utc
  types:
  - <xref:str>
- description: 'Status of the vault upgrade operation. Known values are: "Unknown",
    "InProgress",

    "Upgraded", and "Failed".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VaultUpgradeState">]
- description: Message to the user containing information about the upgrade operation.
  name: message
  types:
  - <xref:str>
- description: 'The way the vault upgrade was triggered. Known values are: "UserTriggered"

    and "ForcedUpgrade".'
  name: trigger_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TriggerType">]
- description: Resource ID of the upgraded vault.
  name: upgraded_resource_id
  types:
  - <xref:str>
- description: Resource ID of the vault before the upgrade.
  name: previous_resource_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.recoveryservices.types.UpgradeDetails.endTimeUtc
  name: endTimeUtc
  summary: UTC time at which the upgrade operation has ended.
  signature: 'endTimeUtc: str'
- uid: azure.mgmt.recoveryservices.types.UpgradeDetails.lastUpdatedTimeUtc
  name: lastUpdatedTimeUtc
  summary: UTC time at which the upgrade operation status was last updated.
  signature: 'lastUpdatedTimeUtc: str'
- uid: azure.mgmt.recoveryservices.types.UpgradeDetails.message
  name: message
  summary: Message to the user containing information about the upgrade operation.
  signature: 'message: str'
- uid: azure.mgmt.recoveryservices.types.UpgradeDetails.operationId
  name: operationId
  summary: ID of the vault upgrade operation.
  signature: 'operationId: str'
- uid: azure.mgmt.recoveryservices.types.UpgradeDetails.previousResourceId
  name: previousResourceId
  summary: Resource ID of the vault before the upgrade.
  signature: 'previousResourceId: str'
- uid: azure.mgmt.recoveryservices.types.UpgradeDetails.startTimeUtc
  name: startTimeUtc
  summary: UTC time at which the upgrade operation has started.
  signature: 'startTimeUtc: str'
- uid: azure.mgmt.recoveryservices.types.UpgradeDetails.status
  name: status
  summary: '"Unknown", "InProgress",

    "Upgraded", and "Failed".'
  signature: 'status: str | VaultUpgradeState'
- uid: azure.mgmt.recoveryservices.types.UpgradeDetails.triggerType
  name: triggerType
  summary: '"UserTriggered" and

    "ForcedUpgrade".'
  signature: 'triggerType: str | TriggerType'
- uid: azure.mgmt.recoveryservices.types.UpgradeDetails.upgradedResourceId
  name: upgradedResourceId
  summary: Resource ID of the upgraded vault.
  signature: 'upgradedResourceId: str'
