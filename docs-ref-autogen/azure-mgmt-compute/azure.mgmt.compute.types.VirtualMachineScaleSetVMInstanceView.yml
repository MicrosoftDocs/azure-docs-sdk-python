    allocated through automatic placement, when the virtual machine is associated
    with a dedicated

    host group that has automatic placement enabled. Minimum api-version: 2020-06-01.'
  name: assigned_host
  types:
  - <xref:str>
- description: 'The placement group in which the VM is running. If the VM is

    deallocated it will not have a placementGroupId.'
  name: placement_group_id
  types:
  - <xref:str>
- description: 'Specifies the host OS name of the virtual machine. <br><br> This name

    cannot be updated after the VM is created. <br><br> **Max-length (Windows):**
    15 characters

    <br><br> **Max-length (Linux):** 64 characters. <br><br> For naming conventions
    and

    restrictions see [Azure infrastructure services implementation guidelines](https://learn.microsoft.com/previous-versions/azure/virtual-machines/linux/infrastructure-example?toc=%2Fazure%2Fvirtual-machines%2Flinux%2Ftoc.json#1-naming-conventions).'
  name: computer_name
  types:
  - <xref:str>
- description: The Operating System running on the hybrid machine.
  name: os_name
  types:
  - <xref:str>
- description: The version of Operating System running on the hybrid machine.
  name: os_version
  types:
  - <xref:str>
- description: 'The hypervisor generation of the Virtual Machine [V1, V2]. Known

    values are: "V1" and "V2".'
  name: hyper_v_generation
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HyperVGeneration">]
- description: 'The Interconnect runtime view of the Scale Set VM instance.

    Minimum api-version: 2026-03-01.'
  name: interconnect_instance_view
  types:
  - <xref:<xref:"InterconnectInstanceView">>
