module: azure.mgmt.compute.types
summary: The instance view of a virtual machine scale set VM.
constructor:
  syntax: VirtualMachineScaleSetVMInstanceView()
variables:
- description: The Update Domain count.
  name: platformUpdateDomain
  types:
  - <xref:int>
- description: The Fault Domain count.
  name: platformFaultDomain
  types:
  - <xref:int>
- description: The Remote desktop certificate thumbprint.
  name: rdpThumbPrint
  types:
  - <xref:str>
- description: The VM Agent running on the virtual machine.
  name: vmAgent
  types:
  - <xref:<xref:"VirtualMachineAgentInstanceView">>
- description: The Maintenance Operation status on the virtual machine.
  name: maintenanceRedeployStatus
  types:
  - <xref:<xref:"MaintenanceRedeployStatus">>
- description: The disks information.
  name: disks
  types:
  - <xref:list>[<xref:"DiskInstanceView">]
- description: The extensions information.
  name: extensions
  types:
  - <xref:list>[<xref:"VirtualMachineExtensionInstanceView">]
- description: The health status for the VM.
  name: vmHealth
  types:
  - <xref:<xref:"VirtualMachineHealthStatus">>
- description: 'Boot Diagnostics is a debugging feature which allows you to view Console

    Output and Screenshot to diagnose VM status. You can easily view the output of
    your console

    log. Azure also enables you to see a screenshot of the VM from the hypervisor.'
  name: bootDiagnostics
  types:
  - <xref:<xref:"BootDiagnosticsInstanceView">>
- description: The resource status information.
  name: statuses
  types:
  - <xref:list>[<xref:"InstanceViewStatus">]
- description: 'Resource id of the dedicated host, on which the virtual machine is

    allocated through automatic placement, when the virtual machine is associated
    with a dedicated

    host group that has automatic placement enabled. Minimum api-version: 2020-06-01.'
  name: assignedHost
  types:
  - <xref:str>
- description: 'The placement group in which the VM is running. If the VM is

    deallocated it will not have a placementGroupId.'
  name: placementGroupId
  types:
  - <xref:str>
- description: 'Specifies the host OS name of the virtual machine. <br><br> This name

    cannot be updated after the VM is created. <br><br> **Max-length (Windows):**
    15 characters

    <br><br> **Max-length (Linux):** 64 characters. <br><br> For naming conventions
    and

    restrictions see [Azure infrastructure services implementation guidelines](https://learn.microsoft.com/previous-versions/azure/virtual-machines/linux/infrastructure-example?toc=%2Fazure%2Fvirtual-machines%2Flinux%2Ftoc.json#1-naming-conventions).'
  name: computerName
  types:
  - <xref:str>
- description: The Operating System running on the hybrid machine.
  name: osName
  types:
  - <xref:str>
- description: The version of Operating System running on the hybrid machine.
  name: osVersion
  types:
  - <xref:str>
- description: 'The hypervisor generation of the Virtual Machine [V1, V2]. Known values

    are: "V1" and "V2".'
  name: hyperVGeneration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HyperVGeneration">]
- description: 'The Interconnect runtime view of the Scale Set VM instance.

    Minimum api-version: 2026-03-01.'
  name: interconnectInstanceView
  types:
  - <xref:<xref:"InterconnectInstanceView">>
- description: 'Specifies which type of capacity reservation the virtual machine

    scale set VM instance will consume capacity from if eligible or whether it is
    explicitly opted

    out from being associated and consuming capacity from any reserved capacity available
    in the

    subscription. Minimum api-version: 2026-04-01. Known values are: "NotEligible",
    "Targeted",

    "Open", "Disabled", and "Block".'
  name: capacityReservationType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CapacityReservationType">]
