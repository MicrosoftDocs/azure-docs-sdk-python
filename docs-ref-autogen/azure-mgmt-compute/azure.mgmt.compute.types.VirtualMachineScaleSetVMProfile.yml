### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile
name: VirtualMachineScaleSetVMProfile
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile
module: azure.mgmt.compute.types
summary: Describes a virtual machine scale set virtual machine profile.
constructor:
  syntax: VirtualMachineScaleSetVMProfile()
variables:
- description: 'Specifies the operating system settings for the virtual machines in
    the scale

    set.'
  name: osProfile
  types:
  - <xref:<xref:"VirtualMachineScaleSetOSProfile">>
- description: Specifies the storage settings for the virtual machine disks.
  name: storageProfile
  types:
  - <xref:<xref:"VirtualMachineScaleSetStorageProfile">>
- description: 'Specifies properties of the network interfaces of the virtual machines
    in

    the scale set.'
  name: networkProfile
  types:
  - <xref:<xref:"VirtualMachineScaleSetNetworkProfile">>
- description: 'Specifies the Security related profile settings for the virtual machines

    in the scale set.'
  name: securityProfile
  types:
  - <xref:<xref:"SecurityProfile">>
- description: 'Specifies the boot diagnostic settings state. Minimum api-version:

    2015-06-15.'
  name: diagnosticsProfile
  types:
  - <xref:<xref:"DiagnosticsProfile">>
- description: 'Specifies a collection of settings for extensions installed on virtual

    machines in the scale set.'
  name: extensionProfile
  types:
  - <xref:<xref:"VirtualMachineScaleSetExtensionProfile">>
- description: 'Specifies that the image or disk that is being used was licensed

    on-premises. <br><br> Possible values for Windows Server operating system are:
    <br><br>

    Windows_Client <br><br> Windows_Server <br><br> Possible values for Linux Server
    operating

    system are: <br><br> RHEL_BYOS (for RHEL) <br><br> SLES_BYOS (for SUSE) <br><br>
    For more

    information, see [Azure Hybrid Use Benefit for Windows Server](https://docs.microsoft.com/azure/virtual-machines/windows/hybrid-use-benefit-licensing)

    <br><br> [Azure Hybrid Use Benefit for Linux Server](https://docs.microsoft.com/azure/virtual-machines/linux/azure-hybrid-benefit-linux)
    <br><br>

    Minimum api-version: 2015-06-15.'
  name: licenseType
  types:
  - <xref:str>
- description: 'Specifies the priority for the virtual machines in the scale set.
    Minimum

    api-version: 2017-10-30-preview. Known values are: "Regular", "Low", "Spot", and
    "SpotPlus".'
  name: priority
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualMachinePriorityTypes">]
- description: 'Specifies the eviction policy for the Azure Spot virtual machine and

    Azure Spot scale set. For Azure Spot virtual machines, both ''Deallocate'' and
    ''Delete'' are

    supported and the minimum api-version is 2019-03-01. For Azure Spot scale sets,
    both

    ''Deallocate'' and ''Delete'' are supported and the minimum api-version is 2017-10-30-preview.

    Known values are: "Deallocate" and "Delete".'
  name: evictionPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualMachineEvictionPolicyTypes">]
- description: 'Specifies the billing related details of a Azure Spot VMSS. Minimum

    api-version: 2019-03-01.'
  name: billingProfile
  types:
  - <xref:<xref:"BillingProfile">>
- description: Specifies Scheduled Event related configurations.
  name: scheduledEventsProfile
  types:
  - <xref:<xref:"ScheduledEventsProfile">>
- description: 'UserData for the virtual machines in the scale set, which must be
    base-64

    encoded. Customer should not pass any secrets in here. Minimum api-version: 2021-03-01.'
  name: userData
  types:
  - <xref:str>
- description: 'Specifies the capacity reservation related details of a scale set.

    Minimum api-version: 2021-04-01.'
  name: capacityReservation
  types:
  - <xref:<xref:"CapacityReservationProfile">>
- description: 'Specifies the Interconnect Block related details of a Scale

    Set. Minimum api-version: 2026-03-01.'
  name: interconnectBlockProfile
  types:
  - <xref:<xref:"InterconnectBlockProfile">>
- description: 'Specifies the gallery applications that should be made available to

    the VM/VMSS.'
  name: applicationProfile
  types:
  - <xref:<xref:"ApplicationProfile">>
- description: 'Specifies the hardware profile related details of a scale set. Minimum

    api-version: 2021-11-01.'
  name: hardwareProfile
  types:
  - <xref:<xref:"VirtualMachineScaleSetHardwareProfile">>
- description: 'Specifies the service artifact reference id used to set same

    image version for all virtual machines in the scale set when using ''latest''
    image version.

    Minimum api-version: 2022-11-01.'
  name: serviceArtifactReference
  types:
  - <xref:<xref:"ServiceArtifactReference">>
- description: 'Specifies the security posture to be used in the scale set.

    Minimum api-version: 2023-03-01.'
  name: securityPostureReference
  types:
  - <xref:<xref:"SecurityPostureReference">>
- description: 'Specifies the time in which this VM profile for the Virtual Machine
    Scale

    Set was created. This value will be added to VMSS Flex VM tags when creating/updating
    the VMSS

    VM Profile. Minimum API version for this property is 2023-09-01.'
  name: timeCreated
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.applicationProfile
  name: applicationProfile
  summary: Specifies the gallery applications that should be made available to the
    VM/VMSS.
  signature: 'applicationProfile: ApplicationProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.billingProfile
  name: billingProfile
  summary: 2019-03-01.
  signature: 'billingProfile: BillingProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.capacityReservation
  name: capacityReservation
  summary: 'Specifies the capacity reservation related details of a scale set. Minimum
    api-version:

    2021-04-01.'
  signature: 'capacityReservation: CapacityReservationProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.diagnosticsProfile
  name: diagnosticsProfile
  summary: 2015-06-15.
  signature: 'diagnosticsProfile: DiagnosticsProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.evictionPolicy
  name: evictionPolicy
  summary: 'Specifies the eviction policy for the Azure Spot virtual machine and Azure
    Spot scale set. For

    Azure Spot virtual machines, both ''Deallocate'' and ''Delete'' are supported
    and the minimum

    api-version is 2019-03-01. For Azure Spot scale sets, both ''Deallocate'' and
    ''Delete'' are

    supported and the minimum api-version is 2017-10-30-preview. Known values are:
    "Deallocate"

    and "Delete".'
  signature: 'evictionPolicy: str | VirtualMachineEvictionPolicyTypes'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.extensionProfile
  name: extensionProfile
  summary: 'Specifies a collection of settings for extensions installed on virtual
    machines in the scale

    set.'
  signature: 'extensionProfile: VirtualMachineScaleSetExtensionProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.hardwareProfile
  name: hardwareProfile
  summary: 2021-11-01.
  signature: 'hardwareProfile: VirtualMachineScaleSetHardwareProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.interconnectBlockProfile
  name: interconnectBlockProfile
  summary: 'Specifies the Interconnect Block related details of a Scale Set. Minimum
    api-version:

    2026-03-01.'
  signature: 'interconnectBlockProfile: InterconnectBlockProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.licenseType
  name: licenseType
  summary: 'Specifies that the image or disk that is being used was licensed on-premises.
    <br><br> Possible

    values for Windows Server operating system are: <br><br> Windows_Client <br><br>
    Windows_Server

    <br><br> Possible values for Linux Server operating system are: <br><br> RHEL_BYOS
    (for RHEL)

    <br><br> SLES_BYOS (for SUSE) <br><br> For more information, see [Azure Hybrid
    Use Benefit for

    Windows Server](https://docs.microsoft.com/azure/virtual-machines/windows/hybrid-use-benefit-licensing)

    <br><br> [Azure Hybrid Use Benefit for Linux Server](https://docs.microsoft.com/azure/virtual-machines/linux/azure-hybrid-benefit-linux)
    <br><br>

    Minimum api-version: 2015-06-15.'
  signature: 'licenseType: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.networkProfile
  name: networkProfile
  summary: Specifies properties of the network interfaces of the virtual machines
    in the scale set.
  signature: 'networkProfile: VirtualMachineScaleSetNetworkProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.osProfile
  name: osProfile
  summary: Specifies the operating system settings for the virtual machines in the
    scale set.
  signature: 'osProfile: VirtualMachineScaleSetOSProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.priority
  name: priority
  summary: 'Specifies the priority for the virtual machines in the scale set. Minimum
    api-version:

    2017-10-30-preview. Known values are: "Regular", "Low", "Spot", and "SpotPlus".'
  signature: 'priority: str | VirtualMachinePriorityTypes'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.scheduledEventsProfile
  name: scheduledEventsProfile
  summary: Specifies Scheduled Event related configurations.
  signature: 'scheduledEventsProfile: ScheduledEventsProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.securityPostureReference
  name: securityPostureReference
  summary: 2023-03-01.
  signature: 'securityPostureReference: SecurityPostureReference'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.securityProfile
  name: securityProfile
  summary: Specifies the Security related profile settings for the virtual machines
    in the scale set.
  signature: 'securityProfile: SecurityProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.serviceArtifactReference
  name: serviceArtifactReference
  summary: 'Specifies the service artifact reference id used to set same image version
    for all virtual

    machines in the scale set when using ''latest'' image version. Minimum api-version:
    2022-11-01.'
  signature: 'serviceArtifactReference: ServiceArtifactReference'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.storageProfile
  name: storageProfile
  summary: Specifies the storage settings for the virtual machine disks.
  signature: 'storageProfile: VirtualMachineScaleSetStorageProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.timeCreated
  name: timeCreated
  summary: 'Specifies the time in which this VM profile for the Virtual Machine Scale
    Set was created. This

    value will be added to VMSS Flex VM tags when creating/updating the VMSS VM Profile.
    Minimum

    API version for this property is 2023-09-01.'
  signature: 'timeCreated: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProfile.userData
  name: userData
  summary: 'UserData for the virtual machines in the scale set, which must be base-64
