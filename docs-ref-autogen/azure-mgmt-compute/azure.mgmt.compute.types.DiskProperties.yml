  signature: 'shareInfo: list[''ShareInfoElement'']'
- uid: azure.mgmt.compute.types.DiskProperties.supportedCapabilities
  name: supportedCapabilities
  summary: List of supported capabilities for the image from which the OS disk was
    created.
  signature: 'supportedCapabilities: SupportedCapabilities'
- uid: azure.mgmt.compute.types.DiskProperties.supportsHibernation
  name: supportsHibernation
  summary: Indicates the OS on a disk supports hibernation.
