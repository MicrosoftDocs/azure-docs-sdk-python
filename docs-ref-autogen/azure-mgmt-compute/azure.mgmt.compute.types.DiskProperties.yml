    indicates a disk that can be mounted on multiple VMs at the same time.'
  signature: 'maxShares: int'
- uid: azure.mgmt.compute.types.DiskProperties.networkAccessPolicy
  name: networkAccessPolicy
  summary: '"AllowAll", "AllowPrivate",

