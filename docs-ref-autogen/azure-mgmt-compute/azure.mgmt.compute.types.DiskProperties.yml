    Does not apply to Ultra

    disks.'
  signature: 'tier: str'
- uid: azure.mgmt.compute.types.DiskProperties.timeCreated
  name: timeCreated
  summary: The time when the disk was created.
  signature: 'timeCreated: str'
- uid: azure.mgmt.compute.types.DiskProperties.uniqueId
  name: uniqueId
  summary: Unique Guid identifying the resource.
  signature: 'uniqueId: str'
