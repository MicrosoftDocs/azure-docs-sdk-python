### YamlMime:PythonClass
uid: azure.mgmt.compute.types.DiskProperties
name: DiskProperties
fullName: azure.mgmt.compute.types.DiskProperties
module: azure.mgmt.compute.types
summary: Disk resource properties.
constructor:
  syntax: DiskProperties()
variables:
- description: The time when the disk was created.
  name: timeCreated
  types:
  - <xref:str>
- description: 'The Operating System type. Known values are: "Windows" and "Linux".'
  name: osType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperatingSystemTypes">]
- description: 'The hypervisor generation of the Virtual Machine. Applicable to OS

    disks only. Known values are: "V1" and "V2".'
  name: hyperVGeneration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HyperVGeneration">]
- description: 'Purchase plan information for the the image from which the OS disk
    was

    created. E.g. - {name: 2019-Datacenter, publisher: MicrosoftWindowsServer, product:

    WindowsServer}.'
  name: purchasePlan
  types:
  - <xref:<xref:"DiskPurchasePlan">>
- description: 'List of supported capabilities for the image from which the OS

    disk was created.'
  name: supportedCapabilities
  types:
  - <xref:<xref:"SupportedCapabilities">>
- description: 'Disk source information. CreationData information cannot be changed
    after

    the disk has been created. Required.'
  name: creationData
  types:
  - <xref:<xref:"CreationData">>
- description: 'If creationData.createOption is Empty, this field is mandatory and
    it

    indicates the size of the disk to create. If this field is present for updates
    or creation with

    other options, it indicates a resize. Resizes are only allowed if the disk is
    not attached to a

    running VM, and can only increase the disk''s size.'
  name: diskSizeGB
  types:
  - <xref:int>
- description: The size of the disk in bytes. This field is read only.
  name: diskSizeBytes
  types:
  - <xref:int>
- description: Unique Guid identifying the resource.
  name: uniqueId
  types:
  - <xref:str>
- description: 'Encryption settings collection used for Azure Disk

    Encryption, can contain multiple encryption settings per disk or snapshot.'
  name: encryptionSettingsCollection
  types:
  - <xref:<xref:"EncryptionSettingsCollection">>
- description: The disk provisioning state.
  name: provisioningState
  types:
  - <xref:str>
- description: 'The number of IOPS allowed for this disk; only settable for UltraSSD

    disks. One operation can transfer between 4k and 256k bytes.'
  name: diskIOPSReadWrite
  types:
  - <xref:int>
- description: 'The bandwidth allowed for this disk; only settable for UltraSSD disks.

    MBps means millions of bytes per second - MB here uses the ISO notation, of powers
    of 10.'
  name: diskMBpsReadWrite
  types:
  - <xref:int>
- description: 'The total number of IOPS that will be allowed across all VMs mounting

    the shared disk as ReadOnly. One operation can transfer between 4k and 256k bytes.'
  name: diskIOPSReadOnly
  types:
  - <xref:int>
- description: 'The total throughput (MBps) that will be allowed across all VMs

    mounting the shared disk as ReadOnly. MBps means millions of bytes per second
    - MB here uses

    the ISO notation, of powers of 10.'
  name: diskMBpsReadOnly
  types:
  - <xref:int>
- description: 'The state of the disk. Known values are: "Unattached", "Attached",
    "Reserved",

    "Frozen", "ActiveSAS", "ActiveSASFrozen", "ReadyToUpload", and "ActiveUpload".'
  name: diskState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskState">]
- description: 'Encryption property can be used to encrypt data at rest with customer
    managed

    keys or platform managed keys.'
  name: encryption
  types:
  - <xref:<xref:"Encryption">>
- description: 'The maximum number of VMs that can attach to the disk at the same
    time. Value

    greater than one indicates a disk that can be mounted on multiple VMs at the same
    time.'
  name: maxShares
  types:
  - <xref:int>
- description: 'Details of the list of all VMs that have the disk attached. maxShares
    should

    be set to a value greater than one for disks to allow attaching them to multiple
    VMs.'
  name: shareInfo
  types:
  - <xref:list>[<xref:"ShareInfoElement">]
- description: 'Policy for accessing the disk via network. Known values are:

    "AllowAll", "AllowPrivate", and "DenyAll".'
  name: networkAccessPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkAccessPolicy">]
- description: ARM id of the DiskAccess resource for using private endpoints on disks.
  name: diskAccessId
  types:
  - <xref:str>
- description: Latest time when bursting was last enabled on a disk.
  name: burstingEnabledTime
  types:
  - <xref:str>
- description: 'Performance tier of the disk (e.g, P4, S10) as described here:

    [https://azure.microsoft.com/en-us/pricing/details/managed-disks/](https://azure.microsoft.com/en-us/pricing/details/managed-disks/).
    Does not apply to Ultra

    disks.'
  name: tier
  types:
  - <xref:str>
- description: 'Set to true to enable bursting beyond the provisioned performance
    target

    of the disk. Bursting is disabled by default. Does not apply to Ultra disks.'
  name: burstingEnabled
  types:
  - <xref:bool>
- description: Properties of the disk for which update is pending.
  name: propertyUpdatesInProgress
  types:
  - <xref:<xref:"PropertyUpdatesInProgress">>
- description: Indicates the OS on a disk supports hibernation.
  name: supportsHibernation
  types:
  - <xref:bool>
- description: Contains the security related information for the resource.
  name: securityProfile
  types:
  - <xref:<xref:"DiskSecurityProfile">>
- description: 'Percentage complete for the background copy when a resource is created

    via the CopyStart operation.'
  name: completionPercent
  types:
  - <xref:float>
- description: 'Policy for controlling export on the disk. Known values are:

    "Enabled" and "Disabled".'
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: 'Additional authentication requirements when exporting or uploading
    to

    a disk or snapshot. Known values are: "AzureActiveDirectory" and "None".'
  name: dataAccessAuthMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataAccessAuthMode">]
- description: 'Setting this property to true improves reliability and

    performance of data disks that are frequently (more than 5 times a day) by detached
    from one

    virtual machine and attached to another. This property should not be set for disks
    that are not

    detached and attached frequently as it causes the disks to not align with the
    fault domain of

    the virtual machine.'
  name: optimizedForFrequentAttach
  types:
  - <xref:bool>
- description: 'The UTC time when the ownership state of the disk was last

    changed i.e., the time the disk was last attached or detached from a VM or the
    time when the VM

    to which the disk was attached was deallocated or started.'
  name: LastOwnershipUpdateTime
  types:
  - <xref:str>
- description: Determines how platform treats disk failures.
  name: availabilityPolicy
  types:
  - <xref:<xref:"AvailabilityPolicy">>
attributes:
- uid: azure.mgmt.compute.types.DiskProperties.LastOwnershipUpdateTime
  name: LastOwnershipUpdateTime
  summary: 'The UTC time when the ownership state of the disk was last changed i.e.,
    the time the disk was

    last attached or detached from a VM or the time when the VM to which the disk
    was attached was

    deallocated or started.'
  signature: 'LastOwnershipUpdateTime: str'
- uid: azure.mgmt.compute.types.DiskProperties.availabilityPolicy
  name: availabilityPolicy
  summary: Determines how platform treats disk failures.
  signature: 'availabilityPolicy: AvailabilityPolicy'
- uid: azure.mgmt.compute.types.DiskProperties.burstingEnabled
  name: burstingEnabled
  summary: 'Set to true to enable bursting beyond the provisioned performance target
    of the disk. Bursting

    is disabled by default. Does not apply to Ultra disks.'
  signature: 'burstingEnabled: bool'
- uid: azure.mgmt.compute.types.DiskProperties.burstingEnabledTime
  name: burstingEnabledTime
  summary: Latest time when bursting was last enabled on a disk.
  signature: 'burstingEnabledTime: str'
- uid: azure.mgmt.compute.types.DiskProperties.completionPercent
  name: completionPercent
  summary: 'Percentage complete for the background copy when a resource is created
    via the CopyStart

    operation.'
  signature: 'completionPercent: float'
- uid: azure.mgmt.compute.types.DiskProperties.creationData
  name: creationData
  summary: 'Disk source information. CreationData information cannot be changed after
    the disk has been

    created. Required.'
  signature: 'creationData: Required[CreationData]'
- uid: azure.mgmt.compute.types.DiskProperties.dataAccessAuthMode
  name: dataAccessAuthMode
  summary: 'Additional authentication requirements when exporting or uploading to
    a disk or snapshot. Known

    values are: "AzureActiveDirectory" and "None".'
  signature: 'dataAccessAuthMode: str | DataAccessAuthMode'
- uid: azure.mgmt.compute.types.DiskProperties.diskAccessId
  name: diskAccessId
  summary: ARM id of the DiskAccess resource for using private endpoints on disks.
  signature: 'diskAccessId: str'
- uid: azure.mgmt.compute.types.DiskProperties.diskIOPSReadOnly
  name: diskIOPSReadOnly
  summary: 'The total number of IOPS that will be allowed across all VMs mounting
    the shared disk as

    ReadOnly. One operation can transfer between 4k and 256k bytes.'
  signature: 'diskIOPSReadOnly: int'
- uid: azure.mgmt.compute.types.DiskProperties.diskIOPSReadWrite
  name: diskIOPSReadWrite
  summary: 'The number of IOPS allowed for this disk; only settable for UltraSSD disks.
    One operation can

    transfer between 4k and 256k bytes.'
  signature: 'diskIOPSReadWrite: int'
- uid: azure.mgmt.compute.types.DiskProperties.diskMBpsReadOnly
  name: diskMBpsReadOnly
  summary: 'The total throughput (MBps) that will be allowed across all VMs mounting
    the shared disk as

    ReadOnly. MBps means millions of bytes per second - MB here uses the ISO notation,
    of powers of

    10.'
  signature: 'diskMBpsReadOnly: int'
- uid: azure.mgmt.compute.types.DiskProperties.diskMBpsReadWrite
  name: diskMBpsReadWrite
  summary: 'The bandwidth allowed for this disk; only settable for UltraSSD disks.
    MBps means millions of

    bytes per second - MB here uses the ISO notation, of powers of 10.'
  signature: 'diskMBpsReadWrite: int'
- uid: azure.mgmt.compute.types.DiskProperties.diskSizeBytes
  name: diskSizeBytes
  summary: The size of the disk in bytes. This field is read only.
  signature: 'diskSizeBytes: int'
- uid: azure.mgmt.compute.types.DiskProperties.diskSizeGB
  name: diskSizeGB
  summary: 'If creationData.createOption is Empty, this field is mandatory and it
    indicates the size of the

    disk to create. If this field is present for updates or creation with other options,
    it

    indicates a resize. Resizes are only allowed if the disk is not attached to a
    running VM, and

    can only increase the disk''s size.'
  signature: 'diskSizeGB: int'
- uid: azure.mgmt.compute.types.DiskProperties.diskState
  name: diskState
  summary: '"Unattached", "Attached", "Reserved",

    "Frozen", "ActiveSAS", "ActiveSASFrozen", "ReadyToUpload", and "ActiveUpload".'
  signature: 'diskState: str | DiskState'
- uid: azure.mgmt.compute.types.DiskProperties.encryption
  name: encryption
  summary: 'Encryption property can be used to encrypt data at rest with customer
    managed keys or platform

    managed keys.'
  signature: 'encryption: Encryption'
- uid: azure.mgmt.compute.types.DiskProperties.encryptionSettingsCollection
  name: encryptionSettingsCollection
  summary: 'Encryption settings collection used for Azure Disk Encryption, can contain
    multiple encryption

    settings per disk or snapshot.'
  signature: 'encryptionSettingsCollection: EncryptionSettingsCollection'
- uid: azure.mgmt.compute.types.DiskProperties.hyperVGeneration
  name: hyperVGeneration
  summary: 'The hypervisor generation of the Virtual Machine. Applicable to OS disks
    only. Known values

    are: "V1" and "V2".'
  signature: 'hyperVGeneration: str | HyperVGeneration'
