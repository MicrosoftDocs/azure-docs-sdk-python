### YamlMime:PythonClass
uid: azure.mgmt.compute.types.RestorePointSourceMetadata
name: RestorePointSourceMetadata
fullName: azure.mgmt.compute.types.RestorePointSourceMetadata
module: azure.mgmt.compute.types
summary: 'Describes the properties of the Virtual Machine for which the restore point
  was created. The

  properties provided are a subset and the snapshot of the overall Virtual Machine
  properties

  captured at the time of the restore point creation.'
constructor:
  syntax: RestorePointSourceMetadata()
variables:
- description: Gets the hardware profile.
  name: hardwareProfile
  types:
  - <xref:<xref:"HardwareProfile">>
- description: Gets the storage profile.
  name: storageProfile
  types:
  - <xref:<xref:"RestorePointSourceVMStorageProfile">>
- description: Gets the OS profile.
  name: osProfile
  types:
  - <xref:<xref:"OSProfile">>
- description: Gets the diagnostics profile.
  name: diagnosticsProfile
  types:
  - <xref:<xref:"DiagnosticsProfile">>
- description: Gets the license type, which is for bring your own license scenario.
  name: licenseType
  types:
  - <xref:str>
- description: Gets the virtual machine unique id.
  name: vmId
  types:
  - <xref:str>
- description: Gets the security profile.
  name: securityProfile
  types:
  - <xref:<xref:"SecurityProfile">>
- description: Location of the VM from which the restore point was created.
  name: location
  types:
  - <xref:str>
- description: 'UserData associated with the source VM for which restore point is
    captured,

    which is a base-64 encoded value.'
  name: userData
  types:
  - <xref:str>
- description: 'HyperVGeneration of the source VM for which restore point is captured.

    Known values are: "V1" and "V2".'
  name: hyperVGeneration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HyperVGenerationTypes">]
attributes:
- uid: azure.mgmt.compute.types.RestorePointSourceMetadata.diagnosticsProfile
  name: diagnosticsProfile
  summary: Gets the diagnostics profile.
  signature: 'diagnosticsProfile: DiagnosticsProfile'
- uid: azure.mgmt.compute.types.RestorePointSourceMetadata.hardwareProfile
  name: hardwareProfile
  summary: Gets the hardware profile.
  signature: 'hardwareProfile: HardwareProfile'
- uid: azure.mgmt.compute.types.RestorePointSourceMetadata.hyperVGeneration
  name: hyperVGeneration
  summary: '"V1"

    and "V2".'
  signature: 'hyperVGeneration: str | HyperVGenerationTypes'
- uid: azure.mgmt.compute.types.RestorePointSourceMetadata.licenseType
  name: licenseType
  summary: Gets the license type, which is for bring your own license scenario.
  signature: 'licenseType: str'
- uid: azure.mgmt.compute.types.RestorePointSourceMetadata.location
  name: location
  summary: Location of the VM from which the restore point was created.
  signature: 'location: str'
- uid: azure.mgmt.compute.types.RestorePointSourceMetadata.osProfile
  name: osProfile
  summary: Gets the OS profile.
  signature: 'osProfile: OSProfile'
- uid: azure.mgmt.compute.types.RestorePointSourceMetadata.securityProfile
  name: securityProfile
  summary: Gets the security profile.
  signature: 'securityProfile: SecurityProfile'
- uid: azure.mgmt.compute.types.RestorePointSourceMetadata.storageProfile
  name: storageProfile
  summary: Gets the storage profile.
  signature: 'storageProfile: RestorePointSourceVMStorageProfile'
- uid: azure.mgmt.compute.types.RestorePointSourceMetadata.userData
  name: userData
  summary: 'UserData associated with the source VM for which restore point is captured,
    which is a base-64

    encoded value.'
  signature: 'userData: str'
- uid: azure.mgmt.compute.types.RestorePointSourceMetadata.vmId
  name: vmId
  summary: Gets the virtual machine unique id.
  signature: 'vmId: str'
