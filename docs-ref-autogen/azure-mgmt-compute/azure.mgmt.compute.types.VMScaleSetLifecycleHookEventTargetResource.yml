uid: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventTargetResource
name: VMScaleSetLifecycleHookEventTargetResource
fullName: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventTargetResource
module: azure.mgmt.compute.types
summary: 'Define a single target ARM resource in a virtual machine scale set lifecycle
  hook event.

  Currently, this can be a virtual machine scale set resource or an individual virtual
  machine

  resource within a VMScaleSet.'
constructor:
  syntax: VMScaleSetLifecycleHookEventTargetResource()
variables:
- description: 'Specifies the target ARM resource. Currently, this can be a virtual
    machine

    scale set resource or an individual virtual machine resource within a VMScaleSet.'
  name: resource
  types:
  - <xref:<xref:"ApiEntityReference">>
- description: 'State of the lifecycle hook for the target resource. The customer
    can patch

    this property to move the lifecycle hook to a terminal state. Known values are:
    "Waiting",

    "Approved", and "Rejected".'
  name: actionState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LifecycleHookActionState">]
attributes:
- uid: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventTargetResource.actionState
  name: actionState
  summary: 'State of the lifecycle hook for the target resource. The customer can
    patch this property to

    move the lifecycle hook to a terminal state. Known values are: "Waiting", "Approved",
    and

    "Rejected".'
  signature: 'actionState: str | LifecycleHookActionState'
- uid: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventTargetResource.resource
  name: resource
  summary: 'Specifies the target ARM resource. Currently, this can be a virtual machine
    scale set resource

    or an individual virtual machine resource within a VMScaleSet.'
  signature: 'resource: ApiEntityReference'
