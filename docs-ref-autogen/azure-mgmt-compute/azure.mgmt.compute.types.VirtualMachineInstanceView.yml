    values are: "V1" and "V2".'
  name: hyperVGeneration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HyperVGenerationType">]
- description: The Remote desktop certificate thumbprint.
  name: rdpThumbPrint
  types:
  - <xref:str>
- description: The VM Agent running on the virtual machine.
  name: vmAgent
  types:
  - <xref:<xref:"VirtualMachineAgentInstanceView">>
