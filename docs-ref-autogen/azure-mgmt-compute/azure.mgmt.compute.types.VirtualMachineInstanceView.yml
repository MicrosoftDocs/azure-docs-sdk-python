uid: azure.mgmt.compute.types.VirtualMachineInstanceView
name: VirtualMachineInstanceView
fullName: azure.mgmt.compute.types.VirtualMachineInstanceView
module: azure.mgmt.compute.types
summary: The instance view of a virtual machine.
constructor:
  syntax: VirtualMachineInstanceView()
variables:
- description: Specifies the update domain of the virtual machine.
  name: platformUpdateDomain
  types:
  - <xref:int>
- description: Specifies the fault domain of the virtual machine.
  name: platformFaultDomain
  types:
  - <xref:int>
