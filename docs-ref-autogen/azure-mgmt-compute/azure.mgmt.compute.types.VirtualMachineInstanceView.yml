  name: disks
  types:
  - <xref:list>[<xref:"DiskInstanceView">]
- description: The extensions information.
  name: extensions
  types:
  - <xref:list>[<xref:"VirtualMachineExtensionInstanceView">]
- description: The health status for the VM.
  name: vmHealth
  types:
  - <xref:<xref:"VirtualMachineHealthStatus">>
- description: 'Boot Diagnostics is a debugging feature which allows you to view Console

    Output and Screenshot to diagnose VM status. You can easily view the output of
    your console

    log. Azure also enables you to see a screenshot of the VM from the hypervisor.'
  name: bootDiagnostics
  types:
  - <xref:<xref:"BootDiagnosticsInstanceView">>
- description: 'Resource id of the dedicated host, on which the virtual machine is

    allocated through automatic placement, when the virtual machine is associated
    with a dedicated

    host group that has automatic placement enabled. Minimum api-version: 2020-06-01.'
  name: assignedHost
  types:
  - <xref:str>
- description: The resource status information.
  name: statuses
  types:
  - <xref:list>[<xref:"InstanceViewStatus">]
- description: '[Preview Feature] The status of virtual machine patch operations.'
  name: patchStatus
  types:
  - <xref:<xref:"VirtualMachinePatchStatus">>
- description: '[Preview Feature] Specifies whether the VM is currently in or out
    of

    the Standby Pool.'
  name: isVMInStandbyPool
  types:
  - <xref:bool>
- description: 'The Interconnect runtime view of the Virtual Machine. Minimum

    api-version: 2026-03-01.'
  name: interconnectInstanceView
  types:
  - <xref:<xref:"InterconnectInstanceView">>
- description: 'Specifies which type of capacity reservation the virtual machine

    will consume capacity from if eligible or whether it is explicitly opted out from
    being

    associated and consuming capacity from any reserved capacity available in the
    subscription.

    Minimum api-version: 2026-04-01. Known values are: "NotEligible", "Targeted",
    "Open",

    "Disabled", and "Block".'
  name: capacityReservationType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CapacityReservationType">]
