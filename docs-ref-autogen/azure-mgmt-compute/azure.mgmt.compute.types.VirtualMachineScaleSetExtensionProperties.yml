### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties
name: VirtualMachineScaleSetExtensionProperties
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties
module: azure.mgmt.compute.types
summary: Describes the properties of a Virtual Machine Scale Set Extension.
constructor:
  syntax: VirtualMachineScaleSetExtensionProperties()
variables:
- description: 'If a value is provided and is different from the previous value, the

    extension handler will be forced to update even if the extension configuration
    has not changed.'
  name: forceUpdateTag
  types:
  - <xref:str>
- description: The name of the extension handler publisher.
  name: publisher
  types:
  - <xref:str>
- description: Specifies the type of the extension; an example is "CustomScriptExtension".
  name: type
  types:
  - <xref:str>
- description: 'Specifies the Major.Minor version of the script handler. Customer
    is

    able to specify only the Major.Minor version of an extension, Azure platform will
    deliver the

    latest Patch.Hotfix version in the Major.Minor series.'
  name: typeHandlerVersion
  types:
  - <xref:str>
- description: 'Indicates whether the extension should use a newer minor version

    if one is available at deployment time. Once deployed, however, the extension
    will not upgrade

    minor versions unless redeployed, even with this property set to true.'
  name: autoUpgradeMinorVersion
  types:
  - <xref:bool>
- description: 'Indicates whether the extension should be automatically upgraded

    by the platform if there is a newer version of the extension available.'
  name: enableAutomaticUpgrade
  types:
  - <xref:bool>
- description: Json formatted public settings for the extension.
  name: settings
  types:
  - <xref:typing.Any>
- description: 'The extension can contain either protectedSettings or

    protectedSettingsFromKeyVault or no protected settings at all.'
  name: protectedSettings
  types:
  - <xref:typing.Any>
- description: The provisioning state, which only appears in the response.
  name: provisioningState
  types:
  - <xref:str>
- description: 'Collection of extension names after which this extension needs

    to be provisioned.'
  name: provisionAfterExtensions
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates whether failures stemming from the extension will be

    suppressed (Operational failures such as not connecting to the VM will not be
    suppressed

    regardless of this value). The default is false.'
  name: suppressFailures
  types:
  - <xref:bool>
- description: 'The extensions protected settings that are passed by

    reference, and consumed from key vault.'
  name: protectedSettingsFromKeyVault
  types:
  - <xref:<xref:"KeyVaultSecretReference">>
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties.autoUpgradeMinorVersion
  name: autoUpgradeMinorVersion
  summary: 'Indicates whether the extension should use a newer minor version if one
    is available at

    deployment time. Once deployed, however, the extension will not upgrade minor
    versions unless

    redeployed, even with this property set to true.'
  signature: 'autoUpgradeMinorVersion: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties.enableAutomaticUpgrade
  name: enableAutomaticUpgrade
  summary: 'Indicates whether the extension should be automatically upgraded by the
    platform if there is a

    newer version of the extension available.'
  signature: 'enableAutomaticUpgrade: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties.forceUpdateTag
  name: forceUpdateTag
  summary: 'If a value is provided and is different from the previous value, the extension
    handler will be

    forced to update even if the extension configuration has not changed.'
  signature: 'forceUpdateTag: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties.protectedSettings
  name: protectedSettings
  summary: 'The extension can contain either protectedSettings or protectedSettingsFromKeyVault
    or no

    protected settings at all.'
  signature: 'protectedSettings: Any'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties.protectedSettingsFromKeyVault
  name: protectedSettingsFromKeyVault
  summary: The extensions protected settings that are passed by reference, and consumed
    from key vault.
  signature: 'protectedSettingsFromKeyVault: KeyVaultSecretReference'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties.provisionAfterExtensions
  name: provisionAfterExtensions
  summary: Collection of extension names after which this extension needs to be provisioned.
  signature: 'provisionAfterExtensions: list[str]'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties.provisioningState
  name: provisioningState
  summary: The provisioning state, which only appears in the response.
  signature: 'provisioningState: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties.publisher
  name: publisher
  summary: The name of the extension handler publisher.
  signature: 'publisher: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties.settings
  name: settings
  summary: Json formatted public settings for the extension.
  signature: 'settings: Any'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties.suppressFailures
  name: suppressFailures
  summary: 'Indicates whether failures stemming from the extension will be suppressed
    (Operational failures

    such as not connecting to the VM will not be suppressed regardless of this value).
    The default

    is false.'
  signature: 'suppressFailures: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties.type
  name: type
  summary: Specifies the type of the extension; an example is "CustomScriptExtension".
  signature: 'type: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetExtensionProperties.typeHandlerVersion
  name: typeHandlerVersion
  summary: 'Specifies the Major.Minor version of the script handler. Customer is able
    to specify only the

    Major.Minor version of an extension, Azure platform will deliver the latest Patch.Hotfix

    version in the Major.Minor series.'
  signature: 'typeHandlerVersion: str'
