### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VMSizeProperties
name: VMSizeProperties
fullName: azure.mgmt.compute.types.VMSizeProperties
module: azure.mgmt.compute.types
summary: Specifies VM Size Property settings on the virtual machine.
constructor:
  syntax: VMSizeProperties()
variables:
- description: 'Specifies the number of vCPUs available for the VM. When this property
    is

    not specified in the request body the default behavior is to set it to the value
    of vCPUs

    available for that VM size exposed in api response of [List all available virtual
    machine sizes

    in a region](https://docs.microsoft.com/en-us/rest/api/compute/resource-skus/list).'
  name: vCPUsAvailable
  types:
  - <xref:int>
- description: 'Specifies the vCPU to physical core ratio. When this property is not

    specified in the request body the default behavior is set to the value of vCPUsPerCore
    for the

    VM Size exposed in api response of [List all available virtual machine sizes in
    a region](https://docs.microsoft.com/en-us/rest/api/compute/resource-skus/list).
    **Setting this

    property to 1 also means that hyper-threading is disabled.**.'
  name: vCPUsPerCore
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.compute.types.VMSizeProperties.vCPUsAvailable
  name: vCPUsAvailable
  summary: 'Specifies the number of vCPUs available for the VM. When this property
    is not specified in the

    request body the default behavior is to set it to the value of vCPUs available
    for that VM size

    exposed in api response of [List all available virtual machine sizes in a region](https://docs.microsoft.com/en-us/rest/api/compute/resource-skus/list).'
  signature: 'vCPUsAvailable: int'
- uid: azure.mgmt.compute.types.VMSizeProperties.vCPUsPerCore
  name: vCPUsPerCore
  summary: 'Specifies the vCPU to physical core ratio. When this property is not specified
    in the request

    body the default behavior is set to the value of vCPUsPerCore for the VM Size
    exposed in api

    response of [List all available virtual machine sizes in a region](https://docs.microsoft.com/en-us/rest/api/compute/resource-skus/list).
    **Setting this

    property to 1 also means that hyper-threading is disabled.**.'
  signature: 'vCPUsPerCore: int'
