uid: azure.mgmt.compute.types.ImmutabilityPolicyLockData
name: ImmutabilityPolicyLockData
fullName: azure.mgmt.compute.types.ImmutabilityPolicyLockData
module: azure.mgmt.compute.types
summary: Data used for locking the immutability policy of a snapshot.
constructor:
  syntax: ImmutabilityPolicyLockData()
variables:
- description: 'The immutability duration for the snapshot, in number of

    days. Required.'
  name: immutability_duration_days
  types:
  - <xref:int>
- description: 'The type of the immutability policy. ''Unlocked'' allows the policy
    to be modified by

    privileged users; ''Locked'' prevents reduction of the immutability duration but
    allows extension

    of the lock period. Required. Known values are: "Unlocked" and "Locked".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ImmutabilityPolicyType">]
attributes:
- uid: azure.mgmt.compute.types.ImmutabilityPolicyLockData.immutabilityDurationDays
  name: immutabilityDurationDays
  summary: The immutability duration for the snapshot, in number of days. Required.
  signature: 'immutabilityDurationDays: Required[int]'
- uid: azure.mgmt.compute.types.ImmutabilityPolicyLockData.type
  name: type
  summary: 'The type of the immutability policy. ''Unlocked'' allows the policy to
    be modified by privileged

    users; ''Locked'' prevents reduction of the immutability duration but allows extension
    of the

    lock period. Required. Known values are: "Unlocked" and "Locked".'
  signature: 'type: Required[str | ImmutabilityPolicyType]'
