uid: azure.mgmt.compute.types.ImageStorageProfile
name: ImageStorageProfile
fullName: azure.mgmt.compute.types.ImageStorageProfile
module: azure.mgmt.compute.types
summary: Describes a storage profile.
constructor:
  syntax: ImageStorageProfile()
variables:
- description: 'Specifies information about the operating system disk used by the
    virtual

    machine. <br><br> For more information about disks, see [About disks and VHDs
    for Azure virtual

    machines](https://docs.microsoft.com/azure/virtual-machines/managed-disks-overview).'
  name: osDisk
  types:
  - <xref:<xref:"ImageOSDisk">>
- description: 'Specifies the parameters that are used to add a data disk to a virtual

    machine. <br><br> For more information about disks, see [About disks and VHDs
    for Azure virtual

    machines](https://docs.microsoft.com/azure/virtual-machines/managed-disks-overview).'
  name: dataDisks
  types:
  - <xref:list>[<xref:"ImageDataDisk">]
- description: 'Specifies whether an image is zone resilient or not. Default is false.

    Zone resilient images can be created only in regions that provide Zone Redundant
    Storage (ZRS).'
  name: zoneResilient
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.compute.types.ImageStorageProfile.dataDisks
  name: dataDisks
  summary: 'Specifies the parameters that are used to add a data disk to a virtual
    machine. <br><br> For

    more information about disks, see [About disks and VHDs for Azure virtual machines](https://docs.microsoft.com/azure/virtual-machines/managed-disks-overview).'
  signature: 'dataDisks: list[azure.mgmt.compute.types.ImageDataDisk]'
- uid: azure.mgmt.compute.types.ImageStorageProfile.osDisk
  name: osDisk
  summary: 'Specifies information about the operating system disk used by the virtual
    machine. <br><br> For

    more information about disks, see [About disks and VHDs for Azure virtual machines](https://docs.microsoft.com/azure/virtual-machines/managed-disks-overview).'
  signature: 'osDisk: ImageOSDisk'
- uid: azure.mgmt.compute.types.ImageStorageProfile.zoneResilient
  name: zoneResilient
