name: GalleryApplicationProperties
fullName: azure.mgmt.compute.types.GalleryApplicationProperties
module: azure.mgmt.compute.types
summary: Describes the properties of a gallery Application Definition.
constructor:
  syntax: GalleryApplicationProperties()
variables:
- description: 'The description of this gallery Application Definition resource. This

    property is updatable.'
  name: description
