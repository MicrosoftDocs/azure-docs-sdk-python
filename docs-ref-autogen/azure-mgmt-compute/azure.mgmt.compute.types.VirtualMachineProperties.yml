    \ This is applicable only if the\n'virtualMachineScaleSet' property of this Virtual\
    \ Machine is set. The Virtual Machine Scale Set\nthat is referenced, must have\
    \ 'platformFaultDomainCount' greater than 1. This property cannot\nbe updated\
    \ once the Virtual Machine is created. Fault domain assignment can be viewed in\
    \ the\nVirtual Machine Instance View. Minimum api\u2010version: 2020\u201012\u2010\
    01."
  signature: 'platformFaultDomain: int'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.priority
  name: priority
  summary: '2019-03-01. Known values

    are: "Regular", "Low", "Spot", and "SpotPlus".'
  signature: 'priority: str | VirtualMachinePriorityTypes'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.provisioningState
  name: provisioningState
  summary: The provisioning state, which only appears in the response.
  signature: 'provisioningState: str'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.proximityPlacementGroup
  name: proximityPlacementGroup
  summary: 'Specifies information about the proximity placement group that the virtual
    machine should be

    assigned to. Minimum api-version: 2018-04-01.'
  signature: 'proximityPlacementGroup: SubResource'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.resiliencyProfile
  name: resiliencyProfile
  summary: Resiliency profile for the virtual machine.
  signature: 'resiliencyProfile: ResiliencyProfile'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.scheduledEventsPolicy
  name: scheduledEventsPolicy
  summary: 'Specifies Redeploy, Reboot and ScheduledEventsAdditionalPublishingTargets
    Scheduled Event

    related configurations for the virtual machine.'
  signature: 'scheduledEventsPolicy: ScheduledEventsPolicy'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.scheduledEventsProfile
  name: scheduledEventsProfile
  summary: Specifies Scheduled Event related configurations.
  signature: 'scheduledEventsProfile: ScheduledEventsProfile'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.securityProfile
  name: securityProfile
  summary: Specifies the Security related profile settings for the virtual machine.
  signature: 'securityProfile: SecurityProfile'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.storageProfile
  name: storageProfile
  summary: Specifies the storage settings for the virtual machine disks.
  signature: 'storageProfile: StorageProfile'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.timeCreated
  name: timeCreated
  summary: 'Specifies the time at which the Virtual Machine resource was created.
    Minimum api-version:

    2021-11-01.'
  signature: 'timeCreated: str'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.userData
  name: userData
  summary: 'UserData for the VM, which must be base-64 encoded. Customer should not
    pass any secrets in

    here. Minimum api-version: 2021-03-01.'
  signature: 'userData: str'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.virtualMachineScaleSet
  name: virtualMachineScaleSet
  summary: "Specifies information about the virtual machine scale set that the virtual\
    \ machine should be\nassigned to. Virtual machines specified in the same virtual\
    \ machine scale set are allocated to\ndifferent nodes to maximize availability.\
    \ Currently, a VM can only be added to virtual machine\nscale set at creation\
    \ time. An existing VM cannot be added to a virtual machine scale set. This\n\
    property cannot exist along with a non-null properties.availabilitySet reference.\
    \ Minimum\napi\u2010version: 2019\u201003\u201001."
  signature: 'virtualMachineScaleSet: SubResource'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.vmId
  name: vmId
  summary: 'Specifies the VM unique ID which is a 128-bits identifier that is encoded
    and stored in all

    Azure IaaS VMs SMBIOS and can be read using platform BIOS commands.'
  signature: 'vmId: str'
