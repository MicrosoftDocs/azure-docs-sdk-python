### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineProperties
name: VirtualMachineProperties
fullName: azure.mgmt.compute.types.VirtualMachineProperties
module: azure.mgmt.compute.types
summary: Describes the properties of a Virtual Machine.
constructor:
  syntax: VirtualMachineProperties()
variables:
- description: Specifies the hardware settings for the virtual machine.
  name: hardwareProfile
  types:
  - <xref:<xref:"HardwareProfile">>
- description: 'Specifies Redeploy, Reboot and

    ScheduledEventsAdditionalPublishingTargets Scheduled Event related configurations
    for the

    virtual machine.'
  name: scheduledEventsPolicy
  types:
  - <xref:<xref:"ScheduledEventsPolicy">>
- description: Specifies the storage settings for the virtual machine disks.
  name: storageProfile
  types:
  - <xref:<xref:"StorageProfile">>
- description: 'Specifies additional capabilities enabled or disabled on the

    virtual machine.'
  name: additionalCapabilities
  types:
  - <xref:<xref:"AdditionalCapabilities">>
- description: 'Specifies the operating system settings used while creating the virtual

    machine. Some of the settings cannot be changed once VM is provisioned.'
  name: osProfile
  types:
  - <xref:<xref:"OSProfile">>
- description: Specifies the network interfaces of the virtual machine.
  name: networkProfile
  types:
  - <xref:<xref:"NetworkProfile">>
- description: Specifies the Security related profile settings for the virtual machine.
  name: securityProfile
  types:
  - <xref:<xref:"SecurityProfile">>
- description: 'Specifies the boot diagnostic settings state. Minimum api-version:

    2015-06-15.'
  name: diagnosticsProfile
  types:
  - <xref:<xref:"DiagnosticsProfile">>
- description: 'Specifies information about the availability set that the virtual

    machine should be assigned to. Virtual machines specified in the same availability
    set are

    allocated to different nodes to maximize availability. For more information about
    availability

    sets, see [Availability sets overview](https://docs.microsoft.com/azure/virtual-machines/availability-set-overview).
    For more

    information on Azure planned maintenance, see [Maintenance and updates for Virtual
    Machines in

    Azure](https://docs.microsoft.com/azure/virtual-machines/maintenance-and-updates).
    Currently,

    a VM can only be added to availability set at creation time. The availability
    set to which the

    VM is being added should be under the same resource group as the availability
    set resource. An

    existing VM cannot be added to an availability set. This property cannot exist
    along with a

    non-null properties.virtualMachineScaleSet reference.'
  name: availabilitySet
  types:
  - <xref:<xref:"SubResource">>
- description: "Specifies information about the virtual machine scale set that\nthe\
    \ virtual machine should be assigned to. Virtual machines specified in the same\
    \ virtual\nmachine scale set are allocated to different nodes to maximize availability.\
    \ Currently, a VM\ncan only be added to virtual machine scale set at creation\
    \ time. An existing VM cannot be added\nto a virtual machine scale set. This property\
    \ cannot exist along with a non-null\nproperties.availabilitySet reference. Minimum\
    \ api\u2010version: 2019\u201003\u201001."
  name: virtualMachineScaleSet
  types:
  - <xref:<xref:"SubResource">>
- description: 'Specifies information about the proximity placement group that

    the virtual machine should be assigned to. Minimum api-version: 2018-04-01.'
  name: proximityPlacementGroup
  types:
  - <xref:<xref:"SubResource">>
- description: 'Specifies the priority for the virtual machine. Minimum api-version:

    2019-03-01. Known values are: "Regular", "Low", "Spot", and "SpotPlus".'
  name: priority
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualMachinePriorityTypes">]
- description: 'Specifies the eviction policy for the Azure Spot virtual machine and

    Azure Spot scale set. For Azure Spot virtual machines, both ''Deallocate'' and
    ''Delete'' are

    supported and the minimum api-version is 2019-03-01. For Azure Spot scale sets,
    both

    ''Deallocate'' and ''Delete'' are supported and the minimum api-version is 2017-10-30-preview.

    Known values are: "Deallocate" and "Delete".'
  name: evictionPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualMachineEvictionPolicyTypes">]
- description: 'Specifies the billing related details of a Azure Spot virtual machine.

    Minimum api-version: 2019-03-01.'
  name: billingProfile
  types:
  - <xref:<xref:"BillingProfile">>
- description: 'Specifies information about the dedicated host that the virtual machine
    resides in.

    Minimum api-version: 2018-10-01.'
  name: host
  types:
  - <xref:<xref:"SubResource">>
- description: 'Specifies information about the dedicated host group that the virtual
    machine

    resides in. **Note:** User cannot specify both host and hostGroup properties.
    Minimum

    api-version: 2020-06-01.'
  name: hostGroup
  types:
  - <xref:<xref:"SubResource">>
- description: The provisioning state, which only appears in the response.
  name: provisioningState
  types:
  - <xref:str>
- description: The virtual machine instance view.
  name: instanceView
  types:
  - <xref:<xref:"VirtualMachineInstanceView">>
- description: 'Specifies that the image or disk that is being used was licensed

    on-premises. <br><br> Possible values for Windows Server operating system are:
    <br><br>

    Windows_Client <br><br> Windows_Server <br><br> Possible values for Linux Server
    operating

    system are: <br><br> RHEL_BYOS (for RHEL) <br><br> SLES_BYOS (for SUSE) <br><br>
    For more

    information, see [Azure Hybrid Use Benefit for Windows Server](https://docs.microsoft.com/azure/virtual-machines/windows/hybrid-use-benefit-licensing)

    <br><br> [Azure Hybrid Use Benefit for Linux Server](https://docs.microsoft.com/azure/virtual-machines/linux/azure-hybrid-benefit-linux)
    <br><br>

    Minimum api-version: 2015-06-15.'
  name: licenseType
  types:
  - <xref:str>
- description: 'Specifies the VM unique ID which is a 128-bits identifier that is
    encoded and

    stored in all Azure IaaS VMs SMBIOS and can be read using platform BIOS commands.'
  name: vmId
  types:
  - <xref:str>
- description: 'Specifies the time alloted for all extensions to start. The time

    duration should be between 15 minutes and 120 minutes (inclusive) and should be
    specified in

    ISO 8601 format. The default value is 90 minutes (PT1H30M). Minimum api-version:
    2020-06-01.'
  name: extensionsTimeBudget
  types:
  - <xref:str>
- description: "Specifies the scale set logical fault domain into which the Virtual\n\
    Machine will be created. By default, the Virtual Machine will by automatically\
    \ assigned to a\nfault domain that best maintains balance across available fault\
    \ domains. This is applicable\nonly if the 'virtualMachineScaleSet' property of\
    \ this Virtual Machine is set. The Virtual\nMachine Scale Set that is referenced,\
    \ must have 'platformFaultDomainCount' greater than 1. This\nproperty cannot be\
    \ updated once the Virtual Machine is created. Fault domain assignment can be\n\
    viewed in the Virtual Machine Instance View. Minimum api\u2010version: 2020\u2010\
    12\u201001."
  name: platformFaultDomain
  types:
  - <xref:int>
- description: Specifies Scheduled Event related configurations.
  name: scheduledEventsProfile
  types:
  - <xref:<xref:"ScheduledEventsProfile">>
- description: 'UserData for the VM, which must be base-64 encoded. Customer should
    not pass

    any secrets in here. Minimum api-version: 2021-03-01.'
  name: userData
  types:
  - <xref:str>
- description: 'Specifies information about the capacity reservation that is used
    to

    allocate virtual machine. Minimum api-version: 2021-04-01.'
  name: capacityReservation
  types:
  - <xref:<xref:"CapacityReservationProfile">>
- description: 'Specifies information about the Interconnect Block that is used

    to allocate the Virtual Machine. Minimum api-version: 2026-03-01.'
  name: interconnectBlockProfile
  types:
  - <xref:<xref:"InterconnectBlockProfile">>
- description: 'Specifies the gallery applications that should be made available to

    the VM/VMSS.'
  name: applicationProfile
  types:
  - <xref:<xref:"ApplicationProfile">>
- description: 'Specifies the time at which the Virtual Machine resource was created.

    Minimum api-version: 2021-11-01.'
  name: timeCreated
  types:
  - <xref:str>
- description: Resiliency profile for the virtual machine.
  name: resiliencyProfile
  types:
  - <xref:<xref:"ResiliencyProfile">>
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineProperties.additionalCapabilities
  name: additionalCapabilities
  summary: Specifies additional capabilities enabled or disabled on the virtual machine.
  signature: 'additionalCapabilities: AdditionalCapabilities'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.applicationProfile
  name: applicationProfile
  summary: Specifies the gallery applications that should be made available to the
    VM/VMSS.
  signature: 'applicationProfile: ApplicationProfile'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.availabilitySet
  name: availabilitySet
  summary: 'Specifies information about the availability set that the virtual machine
    should be assigned

    to. Virtual machines specified in the same availability set are allocated to different
    nodes to

    maximize availability. For more information about availability sets, see [Availability
    sets

    overview](https://docs.microsoft.com/azure/virtual-machines/availability-set-overview).
    For

    more information on Azure planned maintenance, see [Maintenance and updates for
    Virtual

    Machines in Azure](https://docs.microsoft.com/azure/virtual-machines/maintenance-and-updates).
    Currently, a VM

    can only be added to availability set at creation time. The availability set to
    which the VM is

    being added should be under the same resource group as the availability set resource.
    An

    existing VM cannot be added to an availability set. This property cannot exist
    along with a

    non-null properties.virtualMachineScaleSet reference.'
  signature: 'availabilitySet: SubResource'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.billingProfile
  name: billingProfile
  summary: 'Specifies the billing related details of a Azure Spot virtual machine.
    Minimum api-version:

    2019-03-01.'
  signature: 'billingProfile: BillingProfile'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.capacityReservation
  name: capacityReservation
  summary: 'Specifies information about the capacity reservation that is used to allocate
    virtual machine.

    Minimum api-version: 2021-04-01.'
  signature: 'capacityReservation: CapacityReservationProfile'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.diagnosticsProfile
  name: diagnosticsProfile
  summary: 2015-06-15.
  signature: 'diagnosticsProfile: DiagnosticsProfile'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.evictionPolicy
  name: evictionPolicy
  summary: 'Specifies the eviction policy for the Azure Spot virtual machine and Azure
    Spot scale set. For

    Azure Spot virtual machines, both ''Deallocate'' and ''Delete'' are supported
    and the minimum

    api-version is 2019-03-01. For Azure Spot scale sets, both ''Deallocate'' and
    ''Delete'' are

    supported and the minimum api-version is 2017-10-30-preview. Known values are:
    "Deallocate"

    and "Delete".'
  signature: 'evictionPolicy: str | VirtualMachineEvictionPolicyTypes'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.extensionsTimeBudget
  name: extensionsTimeBudget
  summary: 'Specifies the time alloted for all extensions to start. The time duration
    should be between 15

    minutes and 120 minutes (inclusive) and should be specified in ISO 8601 format.
    The default

    value is 90 minutes (PT1H30M). Minimum api-version: 2020-06-01.'
  signature: 'extensionsTimeBudget: str'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.hardwareProfile
  name: hardwareProfile
  summary: Specifies the hardware settings for the virtual machine.
  signature: 'hardwareProfile: HardwareProfile'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.host
  name: host
  summary: 'Specifies information about the dedicated host that the virtual machine
    resides in. Minimum

    api-version: 2018-10-01.'
  signature: 'host: SubResource'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.hostGroup
  name: hostGroup
  summary: 'Specifies information about the dedicated host group that the virtual
    machine resides in.

    **Note:** User cannot specify both host and hostGroup properties. Minimum api-version:

    2020-06-01.'
  signature: 'hostGroup: SubResource'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.instanceView
  name: instanceView
  summary: The virtual machine instance view.
  signature: 'instanceView: VirtualMachineInstanceView'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.interconnectBlockProfile
  name: interconnectBlockProfile
  summary: 'Specifies information about the Interconnect Block that is used to allocate
    the Virtual

    Machine. Minimum api-version: 2026-03-01.'
  signature: 'interconnectBlockProfile: InterconnectBlockProfile'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.licenseType
  name: licenseType
  summary: 'Specifies that the image or disk that is being used was licensed on-premises.
    <br><br> Possible

    values for Windows Server operating system are: <br><br> Windows_Client <br><br>
    Windows_Server

    <br><br> Possible values for Linux Server operating system are: <br><br> RHEL_BYOS
    (for RHEL)

    <br><br> SLES_BYOS (for SUSE) <br><br> For more information, see [Azure Hybrid
    Use Benefit for

    Windows Server](https://docs.microsoft.com/azure/virtual-machines/windows/hybrid-use-benefit-licensing)

    <br><br> [Azure Hybrid Use Benefit for Linux Server](https://docs.microsoft.com/azure/virtual-machines/linux/azure-hybrid-benefit-linux)
    <br><br>

    Minimum api-version: 2015-06-15.'
  signature: 'licenseType: str'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.networkProfile
  name: networkProfile
  summary: Specifies the network interfaces of the virtual machine.
  signature: 'networkProfile: NetworkProfile'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.osProfile
  name: osProfile
  summary: 'Specifies the operating system settings used while creating the virtual
    machine. Some of the

    settings cannot be changed once VM is provisioned.'
  signature: 'osProfile: OSProfile'
- uid: azure.mgmt.compute.types.VirtualMachineProperties.platformFaultDomain
  name: platformFaultDomain
  summary: "Specifies the scale set logical fault domain into which the Virtual Machine\
    \ will be created. By\ndefault, the Virtual Machine will by automatically assigned\
