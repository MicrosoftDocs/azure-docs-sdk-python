    Flex instance.'
  signature: 'priorityMixPolicy: PriorityMixPolicy'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetProperties.provisioningState
  name: provisioningState
  summary: The provisioning state, which only appears in the response.
  signature: 'provisioningState: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetProperties.proximityPlacementGroup
  name: proximityPlacementGroup
  summary: 'Specifies information about the proximity placement group that the virtual
