  name: automaticRepairsPolicy
  summary: Policy for automatic repairs.
  signature: 'automaticRepairsPolicy: AutomaticRepairsPolicy'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetProperties.constrainedMaximumCapacity
  name: constrainedMaximumCapacity
  summary: Optional property which must either be set to True or omitted.
  signature: 'constrainedMaximumCapacity: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetProperties.doNotRunExtensionsOnOverprovisionedVMs
  name: doNotRunExtensionsOnOverprovisionedVMs
  summary: 'When Overprovision is enabled, extensions are launched only on the requested
    number of VMs

    which are finally kept. This property will hence ensure that the extensions do
    not run on the

    extra overprovisioned VMs.'
  signature: 'doNotRunExtensionsOnOverprovisionedVMs: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetProperties.externalHealthPolicy
  name: externalHealthPolicy
  summary: Specifies the external health policy for the virtual machine scale set.
  signature: 'externalHealthPolicy: ExternalHealthPolicy'
