### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetProperties
name: VirtualMachineScaleSetProperties
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetProperties
module: azure.mgmt.compute.types
summary: Describes the properties of a Virtual Machine Scale Set.
constructor:
  syntax: VirtualMachineScaleSetProperties()
variables:
- description: The upgrade policy.
  name: upgradePolicy
  types:
  - <xref:<xref:"UpgradePolicy">>
- description: The ScheduledEventsPolicy.
  name: scheduledEventsPolicy
  types:
  - <xref:<xref:"ScheduledEventsPolicy">>
- description: Policy for automatic repairs.
  name: automaticRepairsPolicy
  types:
  - <xref:<xref:"AutomaticRepairsPolicy">>
- description: The virtual machine profile.
  name: virtualMachineProfile
  types:
  - <xref:<xref:"VirtualMachineScaleSetVMProfile">>
- description: The provisioning state, which only appears in the response.
  name: provisioningState
  types:
  - <xref:str>
- description: Specifies whether the Virtual Machine Scale Set should be overprovisioned.
  name: overprovision
  types:
  - <xref:bool>
- description: 'When Overprovision is enabled, extensions are

    launched only on the requested number of VMs which are finally kept. This property
    will hence

    ensure that the extensions do not run on the extra overprovisioned VMs.'
  name: doNotRunExtensionsOnOverprovisionedVMs
  types:
  - <xref:bool>
- description: Specifies the ID which uniquely identifies a Virtual Machine Scale
    Set.
  name: uniqueId
  types:
  - <xref:str>
- description: 'When true this limits the scale set to a single placement group, of

    max size 100 virtual machines. NOTE: If singlePlacementGroup is true, it may be
    modified to

    false. However, if singlePlacementGroup is false, it may not be modified to true.'
  name: singlePlacementGroup
  types:
  - <xref:bool>
- description: 'Whether to force strictly even Virtual Machine distribution cross
    x-zones in

    case there is zone outage. zoneBalance property can only be set if the zones property
    of the

    scale set contains more than one zone. If there are no zones or only one zone
    specified, then

    zoneBalance property should not be set.'
  name: zoneBalance
  types:
  - <xref:bool>
- description: Fault Domain count for each placement group.
  name: platformFaultDomainCount
  types:
  - <xref:int>
- description: 'Specifies information about the proximity placement group that

    the virtual machine scale set should be assigned to. Minimum api-version: 2018-04-01.'
  name: proximityPlacementGroup
  types:
  - <xref:<xref:"SubResource">>
- description: 'Specifies information about the dedicated host group that the virtual
    machine

    scale set resides in. Minimum api-version: 2020-06-01.'
  name: hostGroup
  types:
  - <xref:<xref:"SubResource">>
- description: 'Specifies additional capabilities enabled or disabled on the

    Virtual Machines in the Virtual Machine Scale Set. For instance: whether the Virtual
    Machines

    have the capability to support attaching managed data disks with UltraSSD_LRS
    storage account

    type.'
  name: additionalCapabilities
  types:
  - <xref:<xref:"AdditionalCapabilities">>
- description: 'Specifies the policies applied when scaling in Virtual Machines in
    the

    Virtual Machine Scale Set.'
  name: scaleInPolicy
  types:
  - <xref:<xref:"ScaleInPolicy">>
- description: 'Specifies the orchestration mode for the virtual machine scale set.

    Known values are: "Uniform" and "Flexible".'
  name: orchestrationMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OrchestrationMode">]
- description: 'Specifies the Spot Restore properties for the virtual machine scale

    set.'
  name: spotRestorePolicy
  types:
  - <xref:<xref:"SpotRestorePolicy">>
- description: 'Specifies the desired targets for mixing Spot and Regular priority
    VMs

    within the same VMSS Flex instance.'
  name: priorityMixPolicy
  types:
  - <xref:<xref:"PriorityMixPolicy">>
- description: 'Specifies the time at which the Virtual Machine Scale Set resource
    was

    created. Minimum api-version: 2021-11-01.'
  name: timeCreated
  types:
  - <xref:str>
- description: 'Optional property which must either be set to True or

    omitted.'
  name: constrainedMaximumCapacity
  types:
  - <xref:bool>
- description: Policy for Resiliency.
  name: resiliencyPolicy
  types:
  - <xref:<xref:"ResiliencyPolicy">>
- description: 'Specifies the align mode between Virtual Machine Scale

    Set compute and storage Fault Domain count. Known values are: "Aligned", "Unaligned",
    and

    "BestEffortAligned".'
  name: zonalPlatformFaultDomainAlignMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ZonalPlatformFaultDomainAlignMode">]
- description: Specifies the sku profile for the virtual machine scale set.
  name: skuProfile
  types:
  - <xref:<xref:"SkuProfile">>
- description: 'Specifies the high speed interconnect placement for the

    virtual machine scale set. Known values are: "None" and "Trunk".'
  name: highSpeedInterconnectPlacement
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HighSpeedInterconnectPlacement">]
- description: 'Specifies the lifecycle hooks profile for the virtual machine

    scale set.'
  name: lifecycleHooksProfile
  types:
  - <xref:<xref:"LifecycleHooksProfile">>
- description: 'Specifies the external health policy for the virtual machine scale

    set.'
  name: externalHealthPolicy
  types:
  - <xref:<xref:"ExternalHealthPolicy">>
attributes:
