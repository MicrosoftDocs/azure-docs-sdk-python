### YamlMime:PythonClass
uid: azure.mgmt.compute.types.AutomaticZoneRebalancingPolicy
name: AutomaticZoneRebalancingPolicy
fullName: azure.mgmt.compute.types.AutomaticZoneRebalancingPolicy
module: azure.mgmt.compute.types
summary: The configuration parameters used while performing automatic AZ balancing.
constructor:
  syntax: AutomaticZoneRebalancingPolicy()
variables:
- description: 'Specifies whether Automatic AZ Balancing should be enabled on the
    virtual

    machine scale set. The default value is false.'
  name: enabled
  types:
  - <xref:bool>
- description: 'Type of rebalance strategy that will be used for rebalancing virtual

    machines in the scale set across availability zones. Default and only supported
    value for now

    is Recreate. "Recreate"'
  name: rebalanceStrategy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RebalanceStrategy">]
- description: 'Type of rebalance behavior that will be used for recreating virtual

    machines in the scale set across availability zones. Default and only supported
    value for now

    is CreateBeforeDelete. "CreateBeforeDelete"'
  name: rebalanceBehavior
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RebalanceBehavior">]
attributes:
- uid: azure.mgmt.compute.types.AutomaticZoneRebalancingPolicy.enabled
  name: enabled
  summary: 'Specifies whether Automatic AZ Balancing should be enabled on the virtual
    machine scale set.

    The default value is false.'
  signature: 'enabled: bool'
- uid: azure.mgmt.compute.types.AutomaticZoneRebalancingPolicy.rebalanceBehavior
  name: rebalanceBehavior
  summary: 'Type of rebalance behavior that will be used for recreating virtual machines
    in the scale set

    across availability zones. Default and only supported value for now is CreateBeforeDelete.

    "CreateBeforeDelete"'
  signature: 'rebalanceBehavior: str | RebalanceBehavior'
- uid: azure.mgmt.compute.types.AutomaticZoneRebalancingPolicy.rebalanceStrategy
  name: rebalanceStrategy
  summary: 'Type of rebalance strategy that will be used for rebalancing virtual machines
    in the scale set

    across availability zones. Default and only supported value for now is Recreate.
    "Recreate"'
  signature: 'rebalanceStrategy: str | RebalanceStrategy'
