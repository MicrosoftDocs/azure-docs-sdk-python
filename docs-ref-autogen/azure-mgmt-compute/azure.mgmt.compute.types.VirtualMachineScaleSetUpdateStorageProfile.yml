uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateStorageProfile
name: VirtualMachineScaleSetUpdateStorageProfile
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateStorageProfile
module: azure.mgmt.compute.types
summary: Describes a virtual machine scale set storage profile.
constructor:
  syntax: VirtualMachineScaleSetUpdateStorageProfile()
variables:
- description: The image reference.
  name: image_reference
  types:
  - <xref:<xref:"ImageReference">>
- description: The OS disk.
  name: os_disk
  types:
  - <xref:<xref:"VirtualMachineScaleSetUpdateOSDisk">>
- description: The data disks.
  name: data_disks
  types:
  - <xref:list>[<xref:"VirtualMachineScaleSetDataDisk">]
- description: 'Specifies the disk controller type configured for the virtual

    machines in the scale set. **Note:** You need to deallocate the virtual machines
    in the scale

    set before updating its disk controller type based on the upgrade mode configured
    for the scale

    set. Minimum api-version: 2022-08-01. Known values are: "SCSI" and "NVMe".'
  name: disk_controller_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskControllerTypes">]
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateStorageProfile.dataDisks
  name: dataDisks
  summary: The data disks.
  signature: 'dataDisks: list[''VirtualMachineScaleSetDataDisk'']'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateStorageProfile.diskControllerType
  name: diskControllerType
  summary: 'Specifies the disk controller type configured for the virtual machines
    in the scale set.

    **Note:** You need to deallocate the virtual machines in the scale set before
    updating its disk

    controller type based on the upgrade mode configured for the scale set. Minimum
    api-version:

    2022-08-01. Known values are: "SCSI" and "NVMe".'
  signature: 'diskControllerType: str | DiskControllerTypes'
