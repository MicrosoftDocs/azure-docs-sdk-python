### YamlMime:PythonClass
uid: azure.mgmt.compute.types.SupportedCapabilities
name: SupportedCapabilities
fullName: azure.mgmt.compute.types.SupportedCapabilities
module: azure.mgmt.compute.types
summary: List of supported capabilities persisted on the disk resource for VM use.
constructor:
  syntax: SupportedCapabilities()
variables:
- description: 'The disk controllers that an OS disk supports. If set it can be SCSI

    or SCSI, NVME or NVME, SCSI.'
  name: diskControllerTypes
  types:
  - <xref:str>
- description: 'True if the image from which the OS disk is created supports

    accelerated networking.'
  name: acceleratedNetwork
  types:
  - <xref:bool>
- description: 'CPU architecture supported by an OS disk. Known values are: "x64"
    and

    "Arm64".'
  name: architecture
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Architecture">]
- description: 'Refers to the security capability of the disk supported to

    create a Trusted launch or Confidential VM. Known values are: "TrustedLaunchSupported"
    and

    "TrustedLaunchAndConfidentialVMSupported".'
  name: supportedSecurityOption
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SupportedSecurityOption">]
attributes:
- uid: azure.mgmt.compute.types.SupportedCapabilities.acceleratedNetwork
  name: acceleratedNetwork
  summary: True if the image from which the OS disk is created supports accelerated
    networking.
  signature: 'acceleratedNetwork: bool'
- uid: azure.mgmt.compute.types.SupportedCapabilities.architecture
  name: architecture
  summary: '"x64" and "Arm64".'
  signature: 'architecture: str | Architecture'
- uid: azure.mgmt.compute.types.SupportedCapabilities.diskControllerTypes
  name: diskControllerTypes
  summary: 'The disk controllers that an OS disk supports. If set it can be SCSI or
    SCSI, NVME or NVME,

    SCSI.'
  signature: 'diskControllerTypes: str'
- uid: azure.mgmt.compute.types.SupportedCapabilities.supportedSecurityOption
  name: supportedSecurityOption
  summary: 'Refers to the security capability of the disk supported to create a Trusted
    launch or

    Confidential VM. Known values are: "TrustedLaunchSupported" and

    "TrustedLaunchAndConfidentialVMSupported".'
  signature: 'supportedSecurityOption: str | SupportedSecurityOption'
