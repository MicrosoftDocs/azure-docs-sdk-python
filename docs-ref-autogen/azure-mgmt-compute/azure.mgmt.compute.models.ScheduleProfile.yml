### YamlMime:PythonClass
uid: azure.mgmt.compute.models.ScheduleProfile
name: ScheduleProfile
fullName: azure.mgmt.compute.models.ScheduleProfile
module: azure.mgmt.compute.models
summary: 'Defines the schedule for Block and Future capacity reservations. Specifies
  the schedule during

  which capacity reservation is active and VM or VMSS resource can be allocated using

  reservation. For Block capacity reservations, the scheduleProfile, start, and end
  fields are

  immutable after creation. Please refer to [https://aka.ms/blockcapacityreservation](https://aka.ms/blockcapacityreservation)
  for more details. Minimum API version for Block

  capacity reservations: 2025-04-01. Future capacity reservations must use this property
  with

  only a start time, which can be changed until the ''modifiableUntil'' time. Please
  refer to

  [https://aka.ms/futurecapacityreservation](https://aka.ms/futurecapacityreservation)
  for more

  details. Minimum API version for Future capacity reservations: 2026-04-01.'
constructor:
  syntax: 'ScheduleProfile(*args: Any, **kwargs: Any)'
variables:
- description: 'The required start date for Block or Future capacity reservations.
    Block capacity

    reservations: Must be today or within 56 days in the future. For same-day scheduling,
    requests

    must be submitted before 11:30 AM UTC. Future capacity reservations: Must be at
    least 7 days in

    the future, and maximum 6 months in the future. Minimum API version for Future
    capacity

    reservations: 2026-04-01. Example: 2025-06-27, applicable for both Block and Future
    capacity

    reservations.'
  name: start
  types:
  - <xref:str>
- description: "The required end date for Block capacity reservations. Must be after\
    \ the start date,\nwith a duration of either 1\u201314 whole days or 3\u201326\
    \ whole weeks. Example: 2025-06-28."
  name: end
  types:
  - <xref:str>
- description: 'The minimum number of days that must pass after the start date

    before a Future capacity reservation can be updated or deleted once it has been
    committed. Will

    be populated with a default value if not provided.'
  name: minimum_commitment_days
  types:
  - <xref:int>
- description: 'The date/time until which a Future capacity reservation can be updated

    or deleted. Read-only.'
  name: modifiable_until
  types:
  - <xref:datetime.datetime>
attributes:
- uid: azure.mgmt.compute.models.ScheduleProfile.end
  name: end
  summary: "The required end date for Block capacity reservations. Must be after the\
    \ start date, with a\nduration of either 1\u201314 whole days or 3\u201326 whole\
    \ weeks. Example: 2025-06-28."
  signature: 'end: str | None'
- uid: azure.mgmt.compute.models.ScheduleProfile.minimum_commitment_days
  name: minimum_commitment_days
  summary: 'The minimum number of days that must pass after the start date before
    a Future capacity

    reservation can be updated or deleted once it has been committed. Will be populated
    with a

    default value if not provided.'
  signature: 'minimum_commitment_days: int | None'
- uid: azure.mgmt.compute.models.ScheduleProfile.modifiable_until
  name: modifiable_until
  summary: The date/time until which a Future capacity reservation can be updated
    or deleted. Read-only.
  signature: 'modifiable_until: datetime | None'
- uid: azure.mgmt.compute.models.ScheduleProfile.start
  name: start
  summary: 'The required start date for Block or Future capacity reservations. Block
    capacity reservations:

    Must be today or within 56 days in the future. For same-day scheduling, requests
    must be

    submitted before 11:30 AM UTC. Future capacity reservations: Must be at least
    7 days in the

    future, and maximum 6 months in the future. Minimum API version for Future capacity

    reservations: 2026-04-01. Example: 2025-06-27, applicable for both Block and Future
    capacity

    reservations.'
  signature: 'start: str | None'
