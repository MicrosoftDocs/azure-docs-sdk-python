### YamlMime:PythonClass
uid: azure.mgmt.compute.types.GalleryIdentity
name: GalleryIdentity
fullName: azure.mgmt.compute.types.GalleryIdentity
module: azure.mgmt.compute.types
summary: Identity for the virtual machine.
constructor:
  syntax: GalleryIdentity()
variables:
- description: 'The principal id of the gallery identity. This property will only
    be

    provided for a system assigned identity.'
  name: principal_id
  types:
  - <xref:str>
- description: 'The AAD tenant id of the gallery identity. This property will only
    be provided

    for a system assigned identity.'
  name: tenant_id
  types:
  - <xref:str>
- description: 'The type of identity used for the gallery. The type ''SystemAssigned,
    UserAssigned''

    includes both an implicitly created identity and a set of user assigned identities.
    The type

    ''None'' will remove all identities from the gallery. Known values are: "SystemAssigned",

    "UserAssigned", "SystemAssigned, UserAssigned", and "None".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResourceIdentityType">]
- description: 'The list of user identities associated with the gallery. The

    user identity dictionary key references will be ARM resource ids in the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}''.'
  name: user_assigned_identities
  types:
  - <xref:dict>[<xref:str>, <xref:"UserAssignedIdentitiesValue">]
attributes:
- uid: azure.mgmt.compute.types.GalleryIdentity.principalId
  name: principalId
  summary: 'The principal id of the gallery identity. This property will only be provided
    for a system

    assigned identity.'
  signature: 'principalId: str'
- uid: azure.mgmt.compute.types.GalleryIdentity.tenantId
  name: tenantId
  summary: 'The AAD tenant id of the gallery identity. This property will only be
    provided for a system

    assigned identity.'
  signature: 'tenantId: str'
- uid: azure.mgmt.compute.types.GalleryIdentity.type
  name: type
  summary: 'The type of identity used for the gallery. The type ''SystemAssigned,
    UserAssigned'' includes

    both an implicitly created identity and a set of user assigned identities. The
    type ''None'' will

    remove all identities from the gallery. Known values are: "SystemAssigned", "UserAssigned",

    "SystemAssigned, UserAssigned", and "None".'
  signature: 'type: str | ResourceIdentityType'
- uid: azure.mgmt.compute.types.GalleryIdentity.userAssignedIdentities
  name: userAssignedIdentities
  summary: 'The list of user identities associated with the gallery. The user identity
    dictionary key

    references will be ARM resource ids in the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}''.'
  signature: 'userAssignedIdentities: dict[str, ''UserAssignedIdentitiesValue'']'
