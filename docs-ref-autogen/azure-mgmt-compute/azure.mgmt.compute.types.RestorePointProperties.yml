### YamlMime:PythonClass
uid: azure.mgmt.compute.types.RestorePointProperties
name: RestorePointProperties
fullName: azure.mgmt.compute.types.RestorePointProperties
module: azure.mgmt.compute.types
summary: The restore point properties.
constructor:
  syntax: RestorePointProperties()
variables:
- description: 'List of disk resource ids that the customer wishes to exclude from
    the

    restore point. If no disks are specified, all disks will be included.'
  name: exclude_disks
  types:
  - <xref:list>[<xref:"ApiEntityReference">]
- description: 'Gets the details of the VM captured at the time of the restore point

    creation.'
  name: source_metadata
  types:
  - <xref:<xref:"RestorePointSourceMetadata">>
- description: Gets the provisioning state of the restore point.
  name: provisioning_state
  types:
  - <xref:str>
- description: 'ConsistencyMode of the RestorePoint. Can be specified in the input

    while creating a restore point. For now, only CrashConsistent is accepted as a
    valid input.

    Please refer to [https://aka.ms/RestorePoints](https://aka.ms/RestorePoints) for
    more

    details. Known values are: "CrashConsistent", "FileSystemConsistent", and

    "ApplicationConsistent".'
  name: consistency_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConsistencyModeTypes">]
- description: Gets the creation time of the restore point.
  name: time_created
  types:
  - <xref:str>
- description: 'Resource Id of the source restore point from which a copy needs to

    be created.'
  name: source_restore_point
  types:
  - <xref:<xref:"ApiEntityReference">>
- description: The restore point instance view.
  name: instance_view
  types:
  - <xref:<xref:"RestorePointInstanceView">>
- description: 'This property determines the time in minutes the

    snapshot is retained as instant access for restoring Premium SSD v2 or Ultra disk
    with fast

    restore performance in this restore point.'
  name: instant_access_duration_minutes
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.compute.types.RestorePointProperties.consistencyMode
  name: consistencyMode
  summary: 'ConsistencyMode of the RestorePoint. Can be specified in the input while
    creating a restore

    point. For now, only CrashConsistent is accepted as a valid input. Please refer
    to

    [https://aka.ms/RestorePoints](https://aka.ms/RestorePoints) for more details.
    Known values

    are: "CrashConsistent", "FileSystemConsistent", and "ApplicationConsistent".'
  signature: 'consistencyMode: str | ConsistencyModeTypes'
- uid: azure.mgmt.compute.types.RestorePointProperties.excludeDisks
  name: excludeDisks
  summary: 'List of disk resource ids that the customer wishes to exclude from the
    restore point. If no

    disks are specified, all disks will be included.'
  signature: 'excludeDisks: list[''ApiEntityReference'']'
- uid: azure.mgmt.compute.types.RestorePointProperties.instanceView
  name: instanceView
  summary: The restore point instance view.
  signature: 'instanceView: RestorePointInstanceView'
- uid: azure.mgmt.compute.types.RestorePointProperties.instantAccessDurationMinutes
  name: instantAccessDurationMinutes
  summary: 'This property determines the time in minutes the snapshot is retained
    as instant access for

    restoring Premium SSD v2 or Ultra disk with fast restore performance in this restore
    point.'
  signature: 'instantAccessDurationMinutes: int'
- uid: azure.mgmt.compute.types.RestorePointProperties.provisioningState
  name: provisioningState
  summary: Gets the provisioning state of the restore point.
  signature: 'provisioningState: str'
- uid: azure.mgmt.compute.types.RestorePointProperties.sourceMetadata
  name: sourceMetadata
  summary: Gets the details of the VM captured at the time of the restore point creation.
  signature: 'sourceMetadata: RestorePointSourceMetadata'
- uid: azure.mgmt.compute.types.RestorePointProperties.sourceRestorePoint
  name: sourceRestorePoint
  summary: Resource Id of the source restore point from which a copy needs to be created.
  signature: 'sourceRestorePoint: ApiEntityReference'
- uid: azure.mgmt.compute.types.RestorePointProperties.timeCreated
  name: timeCreated
  summary: Gets the creation time of the restore point.
  signature: 'timeCreated: str'
