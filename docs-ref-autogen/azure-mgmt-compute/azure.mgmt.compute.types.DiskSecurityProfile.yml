### YamlMime:PythonClass
uid: azure.mgmt.compute.types.DiskSecurityProfile
name: DiskSecurityProfile
fullName: azure.mgmt.compute.types.DiskSecurityProfile
module: azure.mgmt.compute.types
summary: Contains the security related information for the resource.
constructor:
  syntax: DiskSecurityProfile()
variables:
- description: 'Specifies the SecurityType of the VM. Applicable for OS disks only.
    Known

    values are: "TrustedLaunch", "ConfidentialVM_VMGuestStateOnlyEncryptedWithPlatformKey",

    "ConfidentialVM_DiskEncryptedWithPlatformKey", "ConfidentialVM_DiskEncryptedWithCustomerKey",

    and "ConfidentialVM_NonPersistedTPM".'
  name: securityType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskSecurityTypes">]
- description: 'ResourceId of the disk encryption set associated to

    Confidential VM supported disk encrypted with customer managed key.'
  name: secureVMDiskEncryptionSetId
  types:
  - <xref:str>
- description: 'Indicates the version of Confidential VM for the resource. Known

    values are: "V1" and "V2".'
  name: confidentialVMVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConfidentialVMVersion">]
attributes:
- uid: azure.mgmt.compute.types.DiskSecurityProfile.confidentialVMVersion
  name: confidentialVMVersion
  summary: '"V1" and "V2".'
  signature: 'confidentialVMVersion: str | ConfidentialVMVersion'
- uid: azure.mgmt.compute.types.DiskSecurityProfile.secureVMDiskEncryptionSetId
  name: secureVMDiskEncryptionSetId
  summary: 'ResourceId of the disk encryption set associated to Confidential VM supported
    disk encrypted

    with customer managed key.'
  signature: 'secureVMDiskEncryptionSetId: str'
- uid: azure.mgmt.compute.types.DiskSecurityProfile.securityType
  name: securityType
  summary: 'Specifies the SecurityType of the VM. Applicable for OS disks only. Known
    values are:

    "TrustedLaunch", "ConfidentialVM_VMGuestStateOnlyEncryptedWithPlatformKey",

    "ConfidentialVM_DiskEncryptedWithPlatformKey",

    "ConfidentialVM_DiskEncryptedWithCustomerKey", and "ConfidentialVM_NonPersistedTPM".'
  signature: 'securityType: str | DiskSecurityTypes'
