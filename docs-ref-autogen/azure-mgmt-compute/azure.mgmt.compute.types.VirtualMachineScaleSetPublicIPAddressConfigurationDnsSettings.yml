### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetPublicIPAddressConfigurationDnsSettings
name: VirtualMachineScaleSetPublicIPAddressConfigurationDnsSettings
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetPublicIPAddressConfigurationDnsSettings
module: azure.mgmt.compute.types
summary: Describes a virtual machines scale sets network configuration's DNS settings.
constructor:
  syntax: VirtualMachineScaleSetPublicIPAddressConfigurationDnsSettings()
variables:
- description: 'The Domain name label.The concatenation of the domain name label and

    vm index will be the domain name labels of the PublicIPAddress resources that
    will be created.

    Required.'
  name: domain_name_label
  types:
  - <xref:str>
- description: 'The Domain name label scope.The concatenation of the hashed

    domain name label that generated according to the policy from domain name label
    scope and vm

    index will be the domain name labels of the PublicIPAddress resources that will
    be created.

    Known values are: "TenantReuse", "SubscriptionReuse", "ResourceGroupReuse", and
    "NoReuse".'
  name: domain_name_label_scope
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DomainNameLabelScopeTypes">]
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetPublicIPAddressConfigurationDnsSettings.domainNameLabel
  name: domainNameLabel
  summary: 'The Domain name label.The concatenation of the domain name label and vm
    index will be the

    domain name labels of the PublicIPAddress resources that will be created. Required.'
  signature: 'domainNameLabel: Required[str]'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetPublicIPAddressConfigurationDnsSettings.domainNameLabelScope
  name: domainNameLabelScope
  summary: 'The Domain name label scope.The concatenation of the hashed domain name
    label that generated

    according to the policy from domain name label scope and vm index will be the
    domain name

    labels of the PublicIPAddress resources that will be created. Known values are:

    "TenantReuse", "SubscriptionReuse", "ResourceGroupReuse", and "NoReuse".'
  signature: 'domainNameLabelScope: str | DomainNameLabelScopeTypes'
