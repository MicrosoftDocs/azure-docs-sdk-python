### YamlMime:PythonClass
uid: azure.mgmt.compute.types.DataDisksToAttach
name: DataDisksToAttach
fullName: azure.mgmt.compute.types.DataDisksToAttach
module: azure.mgmt.compute.types
summary: Describes the data disk to be attached.
constructor:
  syntax: DataDisksToAttach()
variables:
- description: ID of the managed data disk. Required.
  name: diskId
  types:
  - <xref:str>
- description: 'The logical unit number of the data disk. This value is used to identify
    data disks

    within the VM and therefore must be unique for each data disk attached to a VM.
    If not

    specified, lun would be auto assigned.'
  name: lun
  types:
  - <xref:int>
- description: 'Specifies the caching requirements. Possible values are: **None,**
    **ReadOnly,**

    **ReadWrite.** The defaulting behavior is: **None for Standard storage. ReadOnly
    for Premium

    storage.**. Known values are: "None", "ReadOnly", and "ReadWrite".'
  name: caching
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CachingTypes">]
- description: 'Specifies whether data disk should be deleted or detached upon VM
    deletion.

    Possible values are: **Delete.** If this value is used, the data disk is deleted
    when VM is

    deleted. **Detach.** If this value is used, the data disk is retained after VM
    is deleted. The

    default value is set to **Detach**. Known values are: "Delete" and "Detach".'
  name: deleteOption
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskDeleteOptionTypes">]
- description: 'Specifies the customer managed disk encryption set resource id for
    the

    managed disk.'
  name: diskEncryptionSet
  types:
  - <xref:<xref:"DiskEncryptionSetParameters">>
- description: 'Specifies whether writeAccelerator should be enabled or disabled

    on the disk.'
  name: writeAcceleratorEnabled
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.compute.types.DataDisksToAttach.caching
  name: caching
  summary: '**None,** **ReadOnly,** **ReadWrite.**

    The defaulting behavior is: **None for Standard storage. ReadOnly for Premium
    storage.**. Known

    values are: "None", "ReadOnly", and "ReadWrite".'
  signature: 'caching: str | CachingTypes'
- uid: azure.mgmt.compute.types.DataDisksToAttach.deleteOption
  name: deleteOption
  summary: 'Specifies whether data disk should be deleted or detached upon VM deletion.
    Possible values

    are: **Delete.** If this value is used, the data disk is deleted when VM is deleted.

    **Detach.** If this value is used, the data disk is retained after VM is deleted.
    The default

    value is set to **Detach**. Known values are: "Delete" and "Detach".'
  signature: 'deleteOption: str | DiskDeleteOptionTypes'
- uid: azure.mgmt.compute.types.DataDisksToAttach.diskEncryptionSet
  name: diskEncryptionSet
  summary: Specifies the customer managed disk encryption set resource id for the
    managed disk.
  signature: 'diskEncryptionSet: DiskEncryptionSetParameters'
- uid: azure.mgmt.compute.types.DataDisksToAttach.diskId
  name: diskId
  summary: ID of the managed data disk. Required.
  signature: 'diskId: Required[str]'
- uid: azure.mgmt.compute.types.DataDisksToAttach.lun
  name: lun
  summary: 'The logical unit number of the data disk. This value is used to identify
    data disks within the

    VM and therefore must be unique for each data disk attached to a VM. If not specified,
    lun

    would be auto assigned.'
  signature: 'lun: int'
- uid: azure.mgmt.compute.types.DataDisksToAttach.writeAcceleratorEnabled
  name: writeAcceleratorEnabled
  summary: Specifies whether writeAccelerator should be enabled or disabled on the
    disk.
  signature: 'writeAcceleratorEnabled: bool'
