### YamlMime:PythonClass
uid: azure.mgmt.compute.types.ZoneAllocationPolicy
name: ZoneAllocationPolicy
fullName: azure.mgmt.compute.types.ZoneAllocationPolicy
module: azure.mgmt.compute.types
summary: The configuration parameters for zone allocation of a virtual machine scale
  set.
constructor:
  syntax: ZoneAllocationPolicy()
variables:
- description: 'The maximum number of availability zones to use if the

    ZonePlacementPolicy is ''Auto''. If not specified, all availability zones will
    be used.'
  name: max_zone_count
  types:
  - <xref:int>
- description: 'The configuration parameters used to limit the

    number of virtual machines per availability zone in the virtual machine scale
    set.'
  name: max_instance_percent_per_zone_policy
  types:
  - <xref:<xref:"MaxInstancePercentPerZonePolicy">>
attributes:
- uid: azure.mgmt.compute.types.ZoneAllocationPolicy.maxInstancePercentPerZonePolicy
  name: maxInstancePercentPerZonePolicy
  summary: 'The configuration parameters used to limit the number of virtual machines
    per availability zone

    in the virtual machine scale set.'
  signature: 'maxInstancePercentPerZonePolicy: MaxInstancePercentPerZonePolicy'
- uid: azure.mgmt.compute.types.ZoneAllocationPolicy.maxZoneCount
  name: maxZoneCount
  summary: 'The maximum number of availability zones to use if the ZonePlacementPolicy
    is ''Auto''. If not

    specified, all availability zones will be used.'
  signature: 'maxZoneCount: int'
