### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineExtensionUpdateProperties
name: VirtualMachineExtensionUpdateProperties
fullName: azure.mgmt.compute.types.VirtualMachineExtensionUpdateProperties
module: azure.mgmt.compute.types
summary: Describes the properties of a Virtual Machine Extension.
constructor:
  syntax: VirtualMachineExtensionUpdateProperties()
variables:
- description: 'How the extension handler should be forced to update even if the

    extension configuration has not changed.'
  name: force_update_tag
  types:
  - <xref:str>
- description: The name of the extension handler publisher.
  name: publisher
  types:
  - <xref:str>
- description: Specifies the type of the extension; an example is "CustomScriptExtension".
  name: type
  types:
  - <xref:str>
- description: Specifies the version of the script handler.
  name: type_handler_version
  types:
  - <xref:str>
- description: 'Indicates whether the extension should use a newer minor

    version if one is available at deployment time. Once deployed, however, the extension
    will not

    upgrade minor versions unless redeployed, even with this property set to true.'
  name: auto_upgrade_minor_version
  types:
  - <xref:bool>
- description: 'Indicates whether the extension should be automatically

    upgraded by the platform if there is a newer version of the extension available.'
  name: enable_automatic_upgrade
  types:
  - <xref:bool>
- description: Json formatted public settings for the extension.
  name: settings
  types:
  - <xref:typing.Any>
- description: 'The extension can contain either protectedSettings or

    protectedSettingsFromKeyVault or no protected settings at all.'
  name: protected_settings
  types:
  - <xref:typing.Any>
- description: 'Indicates whether failures stemming from the extension will be

    suppressed (Operational failures such as not connecting to the VM will not be
    suppressed

    regardless of this value). The default is false.'
  name: suppress_failures
  types:
  - <xref:bool>
- description: 'The extensions protected settings that are passed by

    reference, and consumed from key vault.'
  name: protected_settings_from_key_vault
  types:
  - <xref:<xref:"KeyVaultSecretReference">>
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineExtensionUpdateProperties.autoUpgradeMinorVersion
  name: autoUpgradeMinorVersion
  summary: 'Indicates whether the extension should use a newer minor version if one
    is available at

    deployment time. Once deployed, however, the extension will not upgrade minor
    versions unless

    redeployed, even with this property set to true.'
  signature: 'autoUpgradeMinorVersion: bool'
- uid: azure.mgmt.compute.types.VirtualMachineExtensionUpdateProperties.enableAutomaticUpgrade
  name: enableAutomaticUpgrade
  summary: 'Indicates whether the extension should be automatically upgraded by the
    platform if there is a

    newer version of the extension available.'
  signature: 'enableAutomaticUpgrade: bool'
- uid: azure.mgmt.compute.types.VirtualMachineExtensionUpdateProperties.forceUpdateTag
  name: forceUpdateTag
  summary: 'How the extension handler should be forced to update even if the extension
    configuration has

    not changed.'
  signature: 'forceUpdateTag: str'
- uid: azure.mgmt.compute.types.VirtualMachineExtensionUpdateProperties.protectedSettings
  name: protectedSettings
  summary: 'The extension can contain either protectedSettings or protectedSettingsFromKeyVault
    or no

    protected settings at all.'
  signature: 'protectedSettings: Any'
- uid: azure.mgmt.compute.types.VirtualMachineExtensionUpdateProperties.protectedSettingsFromKeyVault
  name: protectedSettingsFromKeyVault
  summary: The extensions protected settings that are passed by reference, and consumed
    from key vault.
  signature: 'protectedSettingsFromKeyVault: KeyVaultSecretReference'
- uid: azure.mgmt.compute.types.VirtualMachineExtensionUpdateProperties.publisher
  name: publisher
  summary: The name of the extension handler publisher.
  signature: 'publisher: str'
- uid: azure.mgmt.compute.types.VirtualMachineExtensionUpdateProperties.settings
  name: settings
  summary: Json formatted public settings for the extension.
  signature: 'settings: Any'
- uid: azure.mgmt.compute.types.VirtualMachineExtensionUpdateProperties.suppressFailures
  name: suppressFailures
  summary: 'Indicates whether failures stemming from the extension will be suppressed
    (Operational failures

    such as not connecting to the VM will not be suppressed regardless of this value).
    The default

    is false.'
  signature: 'suppressFailures: bool'
- uid: azure.mgmt.compute.types.VirtualMachineExtensionUpdateProperties.type
  name: type
  summary: Specifies the type of the extension; an example is "CustomScriptExtension".
  signature: 'type: str'
- uid: azure.mgmt.compute.types.VirtualMachineExtensionUpdateProperties.typeHandlerVersion
  name: typeHandlerVersion
  summary: Specifies the version of the script handler.
  signature: 'typeHandlerVersion: str'
