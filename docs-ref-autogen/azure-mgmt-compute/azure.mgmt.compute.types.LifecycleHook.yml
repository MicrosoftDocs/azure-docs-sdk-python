### YamlMime:PythonClass
uid: azure.mgmt.compute.types.LifecycleHook
name: LifecycleHook
fullName: azure.mgmt.compute.types.LifecycleHook
module: azure.mgmt.compute.types
summary: Describes a lifecycle hook.
constructor:
  syntax: LifecycleHook()
variables:
- description: 'Specifies the type of the lifecycle hook. Known values are:

    "UpgradeAutoOSScheduling" and "UpgradeAutoOSRollingBatchStarting".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VMScaleSetLifecycleHookEventType">]
- description: 'Specifies the time duration a virtual machine scale set lifecycle
    hook

    event sent to the customer waits for a response from the customer. It should be
    in ISO 8601

    format.'
  name: waitDuration
  types:
  - <xref:str>
- description: 'Specifies the action that will be applied to a target resource in
    the

    virtual machine scale set lifecycle hook event if the platform does not receive
    a response from

    the customer for the target resource before waitUntil. Known values are: "Approve"
    and

    "Reject".'
  name: defaultAction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LifecycleHookAction">]
attributes:
- uid: azure.mgmt.compute.types.LifecycleHook.defaultAction
  name: defaultAction
  summary: 'Specifies the action that will be applied to a target resource in the
    virtual machine scale set

    lifecycle hook event if the platform does not receive a response from the customer
    for the

    target resource before waitUntil. Known values are: "Approve" and "Reject".'
  signature: 'defaultAction: str | LifecycleHookAction'
- uid: azure.mgmt.compute.types.LifecycleHook.type
  name: type
  summary: '"UpgradeAutoOSScheduling" and

    "UpgradeAutoOSRollingBatchStarting".'
  signature: 'type: str | VMScaleSetLifecycleHookEventType'
- uid: azure.mgmt.compute.types.LifecycleHook.waitDuration
  name: waitDuration
  summary: 'Specifies the time duration a virtual machine scale set lifecycle hook
    event sent to the

    customer waits for a response from the customer. It should be in ISO 8601 format.'
  signature: 'waitDuration: str'
