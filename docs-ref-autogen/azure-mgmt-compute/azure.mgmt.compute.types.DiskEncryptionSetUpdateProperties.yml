### YamlMime:PythonClass
uid: azure.mgmt.compute.types.DiskEncryptionSetUpdateProperties
name: DiskEncryptionSetUpdateProperties
fullName: azure.mgmt.compute.types.DiskEncryptionSetUpdateProperties
module: azure.mgmt.compute.types
summary: disk encryption set resource update properties.
constructor:
  syntax: DiskEncryptionSetUpdateProperties()
variables:
- description: 'The type of key used to encrypt the data of the disk. Known values
    are:

    "EncryptionAtRestWithCustomerKey", "EncryptionAtRestWithPlatformAndCustomerKeys",
    and

    "ConfidentialVmEncryptedWithCustomerKey".'
  name: encryptionType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskEncryptionSetType">]
- description: 'Key Vault Key Url to be used for server side encryption of Managed
    Disks and

    Snapshots.'
  name: activeKey
  types:
  - <xref:<xref:"KeyForDiskEncryptionSet">>
- description: 'Set this flag to true to enable auto-updating of this

    disk encryption set to the latest key version.'
  name: rotationToLatestKeyVersionEnabled
  types:
  - <xref:bool>
- description: 'Multi-tenant application client id to access key vault in a different

    tenant. Setting the value to ''None'' will clear the property.'
  name: federatedClientId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.compute.types.DiskEncryptionSetUpdateProperties.activeKey
  name: activeKey
  summary: Key Vault Key Url to be used for server side encryption of Managed Disks
    and Snapshots.
  signature: 'activeKey: KeyForDiskEncryptionSet'
- uid: azure.mgmt.compute.types.DiskEncryptionSetUpdateProperties.encryptionType
  name: encryptionType
  summary: 'The type of key used to encrypt the data of the disk. Known values are:

    "EncryptionAtRestWithCustomerKey", "EncryptionAtRestWithPlatformAndCustomerKeys",
    and

    "ConfidentialVmEncryptedWithCustomerKey".'
  signature: 'encryptionType: str | DiskEncryptionSetType'
- uid: azure.mgmt.compute.types.DiskEncryptionSetUpdateProperties.federatedClientId
  name: federatedClientId
  summary: 'Multi-tenant application client id to access key vault in a different
    tenant. Setting the value

    to ''None'' will clear the property.'
  signature: 'federatedClientId: str'
- uid: azure.mgmt.compute.types.DiskEncryptionSetUpdateProperties.rotationToLatestKeyVersionEnabled
  name: rotationToLatestKeyVersionEnabled
  summary: 'Set this flag to true to enable auto-updating of this disk encryption
    set to the latest key

    version.'
  signature: 'rotationToLatestKeyVersionEnabled: bool'
