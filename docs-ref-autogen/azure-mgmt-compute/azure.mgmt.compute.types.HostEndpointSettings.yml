### YamlMime:PythonClass
uid: azure.mgmt.compute.types.HostEndpointSettings
name: HostEndpointSettings
fullName: azure.mgmt.compute.types.HostEndpointSettings
module: azure.mgmt.compute.types
summary: Specifies particular host endpoint settings.
constructor:
  syntax: HostEndpointSettings()
variables:
- description: 'Specifies the execution mode. In Audit mode, the system acts as if
    it is enforcing

    the access control policy, including emitting access denial entries in the logs
    but it does not

    actually deny any requests to host endpoints. In Enforce mode, the system will
    enforce the

    access control and it is the recommended mode of operation. Known values are:
    "Audit",

    "Enforce", and "Disabled".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Modes">]
- description: 'Specifies the InVMAccessControlProfileVersion

    resource id in the format of

    /subscriptions/{SubscriptionId}/resourceGroups/{ResourceGroupName}/providers/Microsoft.Compute/galleries/{galleryName}/inVMAccessControlProfiles/{profile}/versions/{version}.'
  name: inVMAccessControlProfileReferenceId
  types:
  - <xref:str>
- description: 'When set to true, instructs the GuestProxyAgent inside the VM to load

    additional access control rules defined in a local file on the VM.'
  name: useLocalFileRules
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.compute.types.HostEndpointSettings.inVMAccessControlProfileReferenceId
  name: inVMAccessControlProfileReferenceId
  summary: 'Specifies the InVMAccessControlProfileVersion resource id in the format
    of

    /subscriptions/{SubscriptionId}/resourceGroups/{ResourceGroupName}/providers/Microsoft.Compute/galleries/{galleryName}/inVMAccessControlProfiles/{profile}/versions/{version}.'
  signature: 'inVMAccessControlProfileReferenceId: str'
- uid: azure.mgmt.compute.types.HostEndpointSettings.mode
  name: mode
  summary: 'Specifies the execution mode. In Audit mode, the system acts as if it
    is enforcing the access

    control policy, including emitting access denial entries in the logs but it does
    not actually

    deny any requests to host endpoints. In Enforce mode, the system will enforce
    the access

    control and it is the recommended mode of operation. Known values are: "Audit",
    "Enforce",

    and "Disabled".'
  signature: 'mode: str | Modes'
- uid: azure.mgmt.compute.types.HostEndpointSettings.useLocalFileRules
  name: useLocalFileRules
  summary: 'When set to true, instructs the GuestProxyAgent inside the VM to load
    additional access control

    rules defined in a local file on the VM.'
  signature: 'useLocalFileRules: bool'
