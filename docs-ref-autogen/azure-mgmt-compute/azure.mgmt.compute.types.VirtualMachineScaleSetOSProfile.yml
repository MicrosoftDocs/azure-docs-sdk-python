### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSProfile
name: VirtualMachineScaleSetOSProfile
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetOSProfile
module: azure.mgmt.compute.types
summary: Describes a virtual machine scale set OS profile.
constructor:
  syntax: VirtualMachineScaleSetOSProfile()
variables:
- description: 'Specifies the computer name prefix for all of the virtual machines
    in

    the scale set. Computer name prefixes must be 1 to 15 characters long.'
  name: computerNamePrefix
  types:
  - <xref:str>
- description: 'Specifies the name of the administrator account. <br><br> **Windows-only

    restriction:** Cannot end in "." <br><br> **Disallowed values:** "administrator",
    "admin",

    "user", "user1", "test", "user2", "test1", "user3", "admin1", "1", "123", "a",
    "actuser",

    "adm", "admin2", "aspnet", "backup", "console", "david", "guest", "john", "owner",
    "root",

    "server", "sql", "support", "support_388945a0", "sys", "test2", "test3", "user4",
    "user5".

    <br><br> **Minimum-length (Linux):** 1  character <br><br> **Max-length (Linux):**
    64

    characters <br><br> **Max-length (Windows):** 20 characters.'
  name: adminUsername
  types:
  - <xref:str>
- description: 'Specifies the password of the administrator account. <br><br>

    **Minimum-length (Windows):** 8 characters <br><br> **Minimum-length (Linux):**
    6 characters

    <br><br> **Max-length (Windows):** 123 characters <br><br> **Max-length (Linux):**
    72

    characters <br><br> **Complexity requirements:** 3 out of 4 conditions below need
    to be

    fulfilled <br> Has lower characters <br>Has upper characters <br> Has a digit
    <br> Has a

    special character (Regex match [W_]) <br><br> **Disallowed values:** "<xref:mailto:abc@123>",
    "<xref:mailto:P@$$w0rd>",

    "<xref:mailto:P@ssw0rd>", "<xref:mailto:P@ssword123>", "Pa$$word", "<xref:mailto:pass@word1>",
    "Password!", "Password1", "Password22",

    "iloveyou!" <br><br> For resetting the password, see [How to reset the Remote
    Desktop service

    or its login password in a Windows VM](https://docs.microsoft.com/troubleshoot/azure/virtual-machines/reset-rdp)
    <br><br> For

    resetting root password, see [Manage users, SSH, and check or repair disks on
    Azure Linux VMs

    using the VMAccess Extension](https://docs.microsoft.com/troubleshoot/azure/virtual-machines/troubleshoot-ssh-connection).'
  name: adminPassword
  types:
  - <xref:str>
- description: 'Specifies a base-64 encoded string of custom data. The base-64 encoded
    string

    is decoded to a binary array that is saved as a file on the Virtual Machine. The
    maximum length

    of the binary array is 65535 bytes. For using cloud-init for your VM, see [Using
    cloud-init to

    customize a Linux VM during creation](https://docs.microsoft.com/azure/virtual-machines/linux/using-cloud-init).'
  name: customData
  types:
  - <xref:str>
- description: Specifies Windows operating system settings on the virtual machine.
  name: windowsConfiguration
  types:
  - <xref:<xref:"WindowsConfiguration">>
- description: 'Specifies the Linux operating system settings on the virtual machine.

    For a list of supported Linux distributions, see [Linux on Azure-Endorsed Distributions](https://docs.microsoft.com/azure/virtual-machines/linux/endorsed-distros).'
  name: linuxConfiguration
  types:
  - <xref:<xref:"LinuxConfiguration">>
- description: 'Specifies set of certificates that should be installed onto the virtual
    machines

    in the scale set. To install certificates on a virtual machine it is recommended
    to use the

    [Azure Key Vault virtual machine extension for Linux](https://docs.microsoft.com/azure/virtual-machines/extensions/key-vault-linux)
    or the [Azure

    Key Vault virtual machine extension for Windows](https://docs.microsoft.com/azure/virtual-machines/extensions/key-vault-windows).'
  name: secrets
  types:
  - <xref:list>[<xref:"VaultSecretGroup">]
- description: 'Specifies whether extension operations should be allowed on the

    virtual machine scale set. This may only be set to False when no extensions are
    present on the

    virtual machine scale set.'
  name: allowExtensionOperations
  types:
  - <xref:bool>
- description: 'Optional property which must either be set to True or

    omitted.'
  name: requireGuestProvisionSignal
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSProfile.adminPassword
  name: adminPassword
  summary: '** 8

    characters <br><br> **Minimum-length (Linux):** 6 characters <br><br> **Max-length
    (Windows):**

    123 characters <br><br> **Max-length (Linux):** 72 characters <br><br> **Complexity

    requirements:** 3 out of 4 conditions below need to be fulfilled <br> Has lower
    characters

    <br>Has upper characters <br> Has a digit <br> Has a special character (Regex
    match [W_])

    <br><br> **Disallowed values:** "<xref:mailto:abc@123>", "<xref:mailto:P@$$w0rd>",
    "<xref:mailto:P@ssw0rd>", "<xref:mailto:P@ssword123>",

    "Pa$$word", "<xref:mailto:pass@word1>", "Password!", "Password1", "Password22",
    "iloveyou!"

    <br><br> For resetting the password, see [How to reset the Remote Desktop service
    or its login

    password in a Windows VM](https://docs.microsoft.com/troubleshoot/azure/virtual-machines/reset-rdp)
    <br><br> For

    resetting root password, see [Manage users, SSH, and check or repair disks on
    Azure Linux VMs

    using the VMAccess Extension](https://docs.microsoft.com/troubleshoot/azure/virtual-machines/troubleshoot-ssh-connection).'
  signature: 'adminPassword: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSProfile.adminUsername
  name: adminUsername
  summary: '** Cannot

    end in "." <br><br> **Disallowed values:** "administrator", "admin", "user", "user1",

    "test", "user2", "test1", "user3", "admin1", "1", "123", "a", "actuser",

    "adm", "admin2", "aspnet", "backup", "console", "david", "guest", "john",

    "owner", "root", "server", "sql", "support", "support_388945a0", "sys",

    "test2", "test3", "user4", "user5". <br><br> **Minimum-length (Linux):** 1  character

    <br><br> **Max-length (Linux):** 64 characters <br><br> **Max-length (Windows):**
    20

    characters.'
  signature: 'adminUsername: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSProfile.allowExtensionOperations
  name: allowExtensionOperations
  summary: 'Specifies whether extension operations should be allowed on the virtual
    machine scale set. This

    may only be set to False when no extensions are present on the virtual machine
    scale set.'
  signature: 'allowExtensionOperations: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSProfile.computerNamePrefix
  name: computerNamePrefix
  summary: 'Specifies the computer name prefix for all of the virtual machines in
    the scale set. Computer

    name prefixes must be 1 to 15 characters long.'
  signature: 'computerNamePrefix: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSProfile.customData
  name: customData
  summary: 'Specifies a base-64 encoded string of custom data. The base-64 encoded
    string is decoded to a

    binary array that is saved as a file on the Virtual Machine. The maximum length
    of the binary

    array is 65535 bytes. For using cloud-init for your VM, see [Using cloud-init
    to customize a

    Linux VM during creation](https://docs.microsoft.com/azure/virtual-machines/linux/using-cloud-init).'
  signature: 'customData: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSProfile.linuxConfiguration
  name: linuxConfiguration
  summary: 'Specifies the Linux operating system settings on the virtual machine.
    For a list of supported

    Linux distributions, see [Linux on Azure-Endorsed Distributions](https://docs.microsoft.com/azure/virtual-machines/linux/endorsed-distros).'
  signature: 'linuxConfiguration: LinuxConfiguration'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSProfile.requireGuestProvisionSignal
  name: requireGuestProvisionSignal
  summary: Optional property which must either be set to True or omitted.
  signature: 'requireGuestProvisionSignal: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSProfile.secrets
  name: secrets
  summary: 'Specifies set of certificates that should be installed onto the virtual
    machines in the scale

    set. To install certificates on a virtual machine it is recommended to use the
    [Azure Key Vault

    virtual machine extension for Linux](https://docs.microsoft.com/azure/virtual-machines/extensions/key-vault-linux)
    or the [Azure

    Key Vault virtual machine extension for Windows](https://docs.microsoft.com/azure/virtual-machines/extensions/key-vault-windows).'
  signature: 'secrets: list[azure.mgmt.compute.types.VaultSecretGroup]'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSProfile.windowsConfiguration
  name: windowsConfiguration
  summary: Specifies Windows operating system settings on the virtual machine.
  signature: 'windowsConfiguration: WindowsConfiguration'
