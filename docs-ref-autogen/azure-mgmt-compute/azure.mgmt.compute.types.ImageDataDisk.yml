  name: blobUri
  signature: 'blobUri: str'
- uid: azure.mgmt.compute.types.ImageDataDisk.caching
  name: caching
  signature: 'caching: str | CachingTypes'
- uid: azure.mgmt.compute.types.ImageDataDisk.diskEncryptionSet
  name: diskEncryptionSet
  signature: 'diskEncryptionSet: DiskEncryptionSetParameters'
- uid: azure.mgmt.compute.types.ImageDataDisk.diskSizeGB
  name: diskSizeGB
  signature: 'diskSizeGB: int'
- uid: azure.mgmt.compute.types.ImageDataDisk.managedDisk
  name: managedDisk
  signature: 'managedDisk: SubResource'
- uid: azure.mgmt.compute.types.ImageDataDisk.snapshot
  name: snapshot
  signature: 'snapshot: SubResource'
- uid: azure.mgmt.compute.types.ImageDataDisk.storageAccountType
  name: storageAccountType
  signature: 'storageAccountType: str | StorageAccountTypes'
