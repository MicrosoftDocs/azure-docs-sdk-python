### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMReimageParameters
name: VirtualMachineScaleSetVMReimageParameters
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetVMReimageParameters
module: azure.mgmt.compute.types
summary: Describes a Virtual Machine Scale Set VM Reimage Parameters.
constructor:
  syntax: VirtualMachineScaleSetVMReimageParameters()
variables:
- description: 'Specifies whether to reimage temp disk. Default value: false. Note:
    This temp

    disk reimage parameter is only supported for VM/VMSS with Ephemeral OS disk.'
  name: tempDisk
  types:
  - <xref:bool>
- description: 'Specifies in decimal number, the version the OS disk should be reimaged
    to.

    If exact version is not provided, the OS disk is reimaged to the existing version
    of OS Disk.'
  name: exactVersion
  types:
  - <xref:str>
- description: Specifies information required for reimaging the non-ephemeral OS disk.
  name: osProfile
  types:
  - <xref:<xref:"OSProfileProvisioningData">>
- description: 'Parameter to force update ephemeral OS disk for a virtual

    machine scale set VM.'
  name: forceUpdateOSDiskForEphemeral
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMReimageParameters.forceUpdateOSDiskForEphemeral
  name: forceUpdateOSDiskForEphemeral
  summary: Parameter to force update ephemeral OS disk for a virtual machine scale
    set VM.
  signature: 'forceUpdateOSDiskForEphemeral: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMReimageParameters.exactVersion
  name: exactVersion
  signature: 'exactVersion: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMReimageParameters.osProfile
  name: osProfile
  signature: 'osProfile: OSProfileProvisioningData'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMReimageParameters.tempDisk
  name: tempDisk
  signature: 'tempDisk: bool'
