### YamlMime:PythonClass
uid: azure.mgmt.compute.types.PatchSettings
name: PatchSettings
fullName: azure.mgmt.compute.types.PatchSettings
module: azure.mgmt.compute.types
summary: Specifies settings related to VM Guest Patching on Windows.
constructor:
  syntax: PatchSettings()
variables:
- description: 'Specifies the mode of VM Guest Patching to IaaS virtual machine or
    virtual

    machines associated to virtual machine scale set with OrchestrationMode as Flexible.<br
    /><br

    /> Possible values are:<br /><br /> **Manual** - You  control the application
    of patches to a

    virtual machine. You do this by applying patches manually inside the VM. In this
    mode,

    automatic updates are disabled; the property WindowsConfiguration.enableAutomaticUpdates
    must

    be false<br /><br /> **AutomaticByOS** - The virtual machine will automatically
    be updated by

    the OS. The property WindowsConfiguration.enableAutomaticUpdates must be true.
    <br /><br />

    **AutomaticByPlatform** - the virtual machine will automatically updated by the
    platform. The

    properties provisionVMAgent and WindowsConfiguration.enableAutomaticUpdates must
    be true. Known

    values are: "Manual", "AutomaticByOS", and "AutomaticByPlatform".'
  name: patchMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WindowsVMGuestPatchMode">]
- description: 'Enables customers to patch their Azure VMs without requiring a reboot.

    For enableHotpatching, the ''provisionVMAgent'' must be set to true and ''patchMode''
    must be set

    to ''AutomaticByPlatform''.'
  name: enableHotpatching
  types:
  - <xref:bool>
- description: 'Specifies the mode of VM Guest patch assessment for the IaaS virtual

    machine.<br /><br /> Possible values are:<br /><br /> **ImageDefault** - You control
    the timing

    of patch assessments on a virtual machine.<br /><br /> **AutomaticByPlatform**
    - The platform

    will trigger periodic patch assessments. The property provisionVMAgent must be
    true. Known

    values are: "ImageDefault" and "AutomaticByPlatform".'
  name: assessmentMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WindowsPatchAssessmentMode">]
- description: 'Specifies additional settings for patch mode

    AutomaticByPlatform in VM Guest Patching on Windows.'
  name: automaticByPlatformSettings
  types:
  - <xref:<xref:"WindowsVMGuestPatchAutomaticByPlatformSettings">>
attributes:
- uid: azure.mgmt.compute.types.PatchSettings.assessmentMode
  name: assessmentMode
  summary: 'Specifies the mode of VM Guest patch assessment for the IaaS virtual machine.<br
    /><br />

    Possible values are:<br /><br /> **ImageDefault** - You control the timing of
    patch assessments

    on a virtual machine.<br /><br /> **AutomaticByPlatform** - The platform will
    trigger periodic

    patch assessments. The property provisionVMAgent must be true. Known values are:

    "ImageDefault" and "AutomaticByPlatform".'
  signature: 'assessmentMode: str | WindowsPatchAssessmentMode'
- uid: azure.mgmt.compute.types.PatchSettings.automaticByPlatformSettings
  name: automaticByPlatformSettings
  summary: 'Specifies additional settings for patch mode AutomaticByPlatform in VM
    Guest Patching on

    Windows.'
  signature: 'automaticByPlatformSettings: WindowsVMGuestPatchAutomaticByPlatformSettings'
- uid: azure.mgmt.compute.types.PatchSettings.enableHotpatching
  name: enableHotpatching
  summary: 'Enables customers to patch their Azure VMs without requiring a reboot.
    For enableHotpatching,

    the ''provisionVMAgent'' must be set to true and ''patchMode'' must be set to

    ''AutomaticByPlatform''.'
  signature: 'enableHotpatching: bool'
- uid: azure.mgmt.compute.types.PatchSettings.patchMode
  name: patchMode
  summary: 'Specifies the mode of VM Guest Patching to IaaS virtual machine or virtual
    machines associated

    to virtual machine scale set with OrchestrationMode as Flexible.<br /><br /> Possible
    values

    are:<br /><br /> **Manual** - You  control the application of patches to a virtual
    machine. You

    do this by applying patches manually inside the VM. In this mode, automatic updates
    are

    disabled; the property WindowsConfiguration.enableAutomaticUpdates must be false<br
    /><br />

    **AutomaticByOS** - The virtual machine will automatically be updated by the OS.
    The property

    WindowsConfiguration.enableAutomaticUpdates must be true. <br /><br /> **AutomaticByPlatform**

    - the virtual machine will automatically updated by the platform. The properties

    provisionVMAgent and WindowsConfiguration.enableAutomaticUpdates must be true.
    Known values

    are: "Manual", "AutomaticByOS", and "AutomaticByPlatform".'
  signature: 'patchMode: str | WindowsVMGuestPatchMode'
