uid: azure.mgmt.compute.types.GalleryScriptProperties
name: GalleryScriptProperties
fullName: azure.mgmt.compute.types.GalleryScriptProperties
module: azure.mgmt.compute.types
summary: Describes the properties of a gallery script definition.
constructor:
  syntax: GalleryScriptProperties()
variables:
- description: 'The description of this gallery script definition resource. This property
    is

    updatable.'
  name: description
  types:
  - <xref:str>
- description: The Eula agreement (End User License Agreement) for the gallery Script
    Definition.
  name: eula
  types:
  - <xref:str>
