### YamlMime:PythonClass
uid: azure.mgmt.compute.types.KeyForDiskEncryptionSet
name: KeyForDiskEncryptionSet
fullName: azure.mgmt.compute.types.KeyForDiskEncryptionSet
module: azure.mgmt.compute.types
summary: Key Vault Key Url to be used for server side encryption of Managed Disks
  and Snapshots.
constructor:
  syntax: KeyForDiskEncryptionSet()
variables:
- description: 'Resource id of the KeyVault containing the key or secret. This property
    is

    optional and cannot be used if the KeyVault subscription is not the same as the
    Disk Encryption

    Set subscription.'
  name: sourceVault
  types:
  - <xref:<xref:"SourceVault">>
- description: 'Fully versioned Key Url pointing to a key in KeyVault. Version segment
    of the Url

    is required regardless of rotationToLatestKeyVersionEnabled value. Required.'
  name: keyUrl
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.compute.types.KeyForDiskEncryptionSet.keyUrl
  name: keyUrl
  summary: 'Fully versioned Key Url pointing to a key in KeyVault. Version segment
    of the Url is required

    regardless of rotationToLatestKeyVersionEnabled value. Required.'
  signature: 'keyUrl: str'
- uid: azure.mgmt.compute.types.KeyForDiskEncryptionSet.sourceVault
  name: sourceVault
  summary: 'Resource id of the KeyVault containing the key or secret. This property
    is optional and cannot

    be used if the KeyVault subscription is not the same as the Disk Encryption Set
    subscription.'
  signature: 'sourceVault: SourceVault'
