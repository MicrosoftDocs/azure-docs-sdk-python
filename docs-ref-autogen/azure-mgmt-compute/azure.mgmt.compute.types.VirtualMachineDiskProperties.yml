### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineDiskProperties
name: VirtualMachineDiskProperties
fullName: azure.mgmt.compute.types.VirtualMachineDiskProperties
module: azure.mgmt.compute.types
summary: 'Specifies the properties of a managed disk that can be set at the time of
  implicit creation of

  the disk.'
constructor:
  syntax: VirtualMachineDiskProperties()
variables:
- description: 'Performance tier of the disk (e.g., P4, S10) as described here:

    [https://azure.microsoft.com/en-us/pricing/details/managed-disks/](https://azure.microsoft.com/en-us/pricing/details/managed-disks/).
    Does not apply to Ultra

    disks.'
  name: tier
  types:
  - <xref:str>
- description: 'Set to true to enable bursting beyond the provisioned performance
    target

    of the disk. Bursting is disabled by default. Does not apply to Ultra disks.'
  name: burstingEnabled
  types:
  - <xref:bool>
- description: 'Set this flag to true to get a boost on the performance target of
    the

    disk deployed. This flag can only be set on disk creation time and cannot be disabled
    after

    enabled.'
  name: performancePlus
  types:
  - <xref:bool>
- description: 'Setting this property to true improves reliability and

    performance of data disks that are frequently (more than 5 times a day) detached
    from one

    virtual machine and attached to another. This property should not be set for disks
    that are not

    detached and attached frequently as it causes the disks to not align with the
    fault domain of

    the virtual machine.'
  name: optimizedForFrequentAttach
  types:
  - <xref:bool>
- description: 'In the case of an availability or connectivity issue with the disk,

    specify the behavior of your VM.'
  name: availabilityPolicy
  types:
  - <xref:<xref:"DiskAvailabilityPolicy">>
- description: 'The maximum number of VMs that can attach to the disk at the same
    time. Value

    greater than one indicates a disk that can be mounted on multiple VMs at the same
    time. Applies

    to data disks only.'
  name: maxShares
  types:
  - <xref:int>
- description: 'Policy for accessing the disk via network. Known values are:

    "AllowAll", "AllowPrivate", and "DenyAll".'
  name: networkAccessPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualMachineDiskNetworkAccessPolicy">]
- description: 'Azure resource Id of the DiskAccess resource for using private endpoints
    on

    disks.'
  name: diskAccessId
  types:
  - <xref:str>
- description: 'The total number of IOPS that will be allowed across all VMs mounting

    the shared disk as ReadOnly. One operation can transfer between 4k and 256k bytes.'
  name: diskIOPSReadOnly
  types:
  - <xref:int>
- description: 'The total throughput (MBps) that will be allowed across all VMs

    mounting the shared disk as ReadOnly. MBps means millions of bytes per second
    - MB here uses

    the ISO notation, of powers of 10.'
  name: diskMBpsReadOnly
  types:
  - <xref:int>
- description: 'Logical sector size in bytes for Ultra Disks. Supported values are
    512

    and 4096. 4096 is the default.'
  name: logicalSectorSize
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineDiskProperties.availabilityPolicy
  name: availabilityPolicy
  summary: 'In the case of an availability or connectivity issue with the disk, specify
    the behavior of

    your VM.'
  signature: 'availabilityPolicy: DiskAvailabilityPolicy'
- uid: azure.mgmt.compute.types.VirtualMachineDiskProperties.burstingEnabled
  name: burstingEnabled
  summary: 'Set to true to enable bursting beyond the provisioned performance target
    of the disk. Bursting

    is disabled by default. Does not apply to Ultra disks.'
  signature: 'burstingEnabled: bool'
- uid: azure.mgmt.compute.types.VirtualMachineDiskProperties.diskAccessId
  name: diskAccessId
  summary: Azure resource Id of the DiskAccess resource for using private endpoints
    on disks.
  signature: 'diskAccessId: str'
- uid: azure.mgmt.compute.types.VirtualMachineDiskProperties.diskIOPSReadOnly
  name: diskIOPSReadOnly
  summary: 'The total number of IOPS that will be allowed across all VMs mounting
    the shared disk as

    ReadOnly. One operation can transfer between 4k and 256k bytes.'
  signature: 'diskIOPSReadOnly: int'
- uid: azure.mgmt.compute.types.VirtualMachineDiskProperties.diskMBpsReadOnly
  name: diskMBpsReadOnly
  summary: 'The total throughput (MBps) that will be allowed across all VMs mounting
    the shared disk as

    ReadOnly. MBps means millions of bytes per second - MB here uses the ISO notation,
    of powers of

    10.'
  signature: 'diskMBpsReadOnly: int'
- uid: azure.mgmt.compute.types.VirtualMachineDiskProperties.logicalSectorSize
  name: logicalSectorSize
  summary: 'Logical sector size in bytes for Ultra Disks. Supported values are 512
    and 4096. 4096 is the

    default.'
  signature: 'logicalSectorSize: int'
- uid: azure.mgmt.compute.types.VirtualMachineDiskProperties.maxShares
  name: maxShares
  summary: 'The maximum number of VMs that can attach to the disk at the same time.
    Value greater than one

    indicates a disk that can be mounted on multiple VMs at the same time. Applies
    to data disks

    only.'
  signature: 'maxShares: int'
- uid: azure.mgmt.compute.types.VirtualMachineDiskProperties.networkAccessPolicy
  name: networkAccessPolicy
  summary: '"AllowAll", "AllowPrivate",

    and "DenyAll".'
  signature: 'networkAccessPolicy: str | VirtualMachineDiskNetworkAccessPolicy'
- uid: azure.mgmt.compute.types.VirtualMachineDiskProperties.optimizedForFrequentAttach
  name: optimizedForFrequentAttach
  summary: 'Setting this property to true improves reliability and performance of
    data disks that are

    frequently (more than 5 times a day) detached from one virtual machine and attached
    to another.

    This property should not be set for disks that are not detached and attached frequently
    as it

    causes the disks to not align with the fault domain of the virtual machine.'
  signature: 'optimizedForFrequentAttach: bool'
- uid: azure.mgmt.compute.types.VirtualMachineDiskProperties.performancePlus
  name: performancePlus
  summary: 'Set this flag to true to get a boost on the performance target of the
    disk deployed. This flag

    can only be set on disk creation time and cannot be disabled after enabled.'
  signature: 'performancePlus: bool'
- uid: azure.mgmt.compute.types.VirtualMachineDiskProperties.tier
  name: tier
  summary: 'Performance tier of the disk (e.g., P4, S10) as described here:

    [https://azure.microsoft.com/en-us/pricing/details/managed-disks/](https://azure.microsoft.com/en-us/pricing/details/managed-disks/).
    Does not apply to Ultra

    disks.'
  signature: 'tier: str'
