### YamlMime:PythonClass
uid: azure.mgmt.compute.types.SpotRestorePolicy
name: SpotRestorePolicy
fullName: azure.mgmt.compute.types.SpotRestorePolicy
module: azure.mgmt.compute.types
summary: 'Specifies the Spot-Try-Restore properties for the virtual machine scale
  set. With this property

  customer can enable or disable automatic restore of the evicted Spot VMSS VM instances

  opportunistically based on capacity availability and pricing constraint.'
constructor:
  syntax: SpotRestorePolicy()
variables:
- description: 'Enables the Spot-Try-Restore feature where evicted VMSS SPOT instances
    will be

    tried to be restored opportunistically based on capacity availability and pricing
    constraints.'
  name: enabled
  types:
  - <xref:bool>
- description: 'Timeout value expressed as an ISO 8601 time duration after which the

    platform will not try to restore the VMSS SPOT instances.'
  name: restoreTimeout
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.compute.types.SpotRestorePolicy.enabled
  name: enabled
  summary: 'Enables the Spot-Try-Restore feature where evicted VMSS SPOT instances
    will be tried to be

    restored opportunistically based on capacity availability and pricing constraints.'
  signature: 'enabled: bool'
- uid: azure.mgmt.compute.types.SpotRestorePolicy.restoreTimeout
  name: restoreTimeout
  summary: 'Timeout value expressed as an ISO 8601 time duration after which the platform
    will not try to

    restore the VMSS SPOT instances.'
  signature: 'restoreTimeout: str'
