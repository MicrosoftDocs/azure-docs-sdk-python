### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties
name: VirtualMachineScaleSetVMProperties
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties
module: azure.mgmt.compute.types
summary: Describes the properties of a virtual machine scale set virtual machine.
constructor:
  syntax: VirtualMachineScaleSetVMProperties()
variables:
- description: 'Specifies whether the latest model has been applied to the virtual

    machine.'
  name: latest_model_applied
  types:
  - <xref:bool>
- description: Azure VM unique ID.
  name: vm_id
  types:
  - <xref:str>
- description: The virtual machine instance view.
  name: instance_view
  types:
  - <xref:<xref:"VirtualMachineScaleSetVMInstanceView">>
- description: Specifies the hardware settings for the virtual machine.
  name: hardware_profile
  types:
  - <xref:<xref:"HardwareProfile">>
- description: 'Specifies the resilient VM deletion status for the virtual

    machine. Known values are: "Enabled", "Disabled", "InProgress", and "Failed".'
  name: resilient_vm_deletion_status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResilientVMDeletionStatus">]
- description: Specifies the storage settings for the virtual machine disks.
  name: storage_profile
  types:
  - <xref:<xref:"StorageProfile">>
- description: 'Specifies additional capabilities enabled or disabled on the

    virtual machine in the scale set. For instance: whether the virtual machine has
    the capability

    to support attaching managed data disks with UltraSSD_LRS storage account type.'
  name: additional_capabilities
  types:
  - <xref:<xref:"AdditionalCapabilities">>
- description: Specifies the operating system settings for the virtual machine.
  name: os_profile
  types:
  - <xref:<xref:"OSProfile">>
- description: 'Specifies the Security related profile settings for the virtual

    machine.'
  name: security_profile
  types:
  - <xref:<xref:"SecurityProfile">>
- description: Specifies the network interfaces of the virtual machine.
  name: network_profile
  types:
  - <xref:<xref:"NetworkProfile">>
- description: 'Specifies the network profile configuration of the virtual

    machine.'
  name: network_profile_configuration
  types:
  - <xref:<xref:"VirtualMachineScaleSetVMNetworkProfileConfiguration">>
- description: 'Specifies the boot diagnostic settings state. Minimum api-version:

    2015-06-15.'
  name: diagnostics_profile
  types:
  - <xref:<xref:"DiagnosticsProfile">>
- description: 'Specifies information about the availability set that the virtual

    machine should be assigned to. Virtual machines specified in the same availability
    set are

    allocated to different nodes to maximize availability. For more information about
    availability

    sets, see [Availability sets overview](https://docs.microsoft.com/azure/virtual-machines/availability-set-overview).
    For more

    information on Azure planned maintenance, see [Maintenance and updates for Virtual
    Machines in

    Azure](https://docs.microsoft.com/azure/virtual-machines/maintenance-and-updates).
    Currently,

    a VM can only be added to availability set at creation time. An existing VM cannot
    be added to

    an availability set.'
  name: availability_set
  types:
  - <xref:<xref:"SubResource">>
- description: The provisioning state, which only appears in the response.
  name: provisioning_state
  types:
  - <xref:str>
- description: 'Specifies that the image or disk that is being used was licensed

    on-premises. <br><br> Possible values for Windows Server operating system are:
    <br><br>

    Windows_Client <br><br> Windows_Server <br><br> Possible values for Linux Server
    operating

    system are: <br><br> RHEL_BYOS (for RHEL) <br><br> SLES_BYOS (for SUSE) <br><br>
    For more

    information, see [Azure Hybrid Use Benefit for Windows Server](https://docs.microsoft.com/azure/virtual-machines/windows/hybrid-use-benefit-licensing)

    <br><br> [Azure Hybrid Use Benefit for Linux Server](https://docs.microsoft.com/azure/virtual-machines/linux/azure-hybrid-benefit-linux)
    <br><br>

    Minimum api-version: 2015-06-15.'
  name: license_type
  types:
  - <xref:str>
- description: 'Specifies whether the model applied to the virtual machine is

    the model of the virtual machine scale set or the customized model for the virtual
    machine.'
  name: model_definition_applied
  types:
  - <xref:str>
- description: Specifies the protection policy of the virtual machine.
  name: protection_policy
  types:
  - <xref:<xref:"VirtualMachineScaleSetVMProtectionPolicy">>
- description: 'UserData for the VM, which must be base-64 encoded. Customer should
    not pass

    any secrets in here. Minimum api-version: 2021-03-01.'
  name: user_data
  types:
  - <xref:str>
- description: 'Specifies the time at which the Virtual Machine resource was created.

    Minimum api-version: 2021-11-01.'
  name: time_created
  types:
  - <xref:str>
- description: 'Specifies the ARM resource ID of the standalone virtual

    machine associated with this VMSS VM. This property is only applicable to Virtual
    Machine Scale

    Sets with Flexible orchestration mode. Minimum api-version: 2025-11-01.'
  name: virtual_machine_resource_id
  types:
  - <xref:str>
- description: 'Specifies the Interconnect Block related details of a Scale

    Set VM instance. Minimum api-version: 2026-03-01.'
  name: interconnect_block_profile
  types:
  - <xref:<xref:"InterconnectBlockProfile">>
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.additionalCapabilities
  name: additionalCapabilities
  summary: 'Specifies additional capabilities enabled or disabled on the virtual machine
    in the scale set.

    For instance: whether the virtual machine has the capability to support attaching
    managed data

    disks with UltraSSD_LRS storage account type.'
  signature: 'additionalCapabilities: AdditionalCapabilities'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.availabilitySet
  name: availabilitySet
  summary: 'Specifies information about the availability set that the virtual machine
    should be assigned

    to. Virtual machines specified in the same availability set are allocated to different
    nodes to

    maximize availability. For more information about availability sets, see [Availability
    sets

    overview](https://docs.microsoft.com/azure/virtual-machines/availability-set-overview).
    For

    more information on Azure planned maintenance, see [Maintenance and updates for
    Virtual

    Machines in Azure](https://docs.microsoft.com/azure/virtual-machines/maintenance-and-updates).
    Currently, a VM

    can only be added to availability set at creation time. An existing VM cannot
    be added to an

    availability set.'
  signature: 'availabilitySet: SubResource'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.diagnosticsProfile
  name: diagnosticsProfile
  summary: 2015-06-15.
  signature: 'diagnosticsProfile: DiagnosticsProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.hardwareProfile
  name: hardwareProfile
  summary: Specifies the hardware settings for the virtual machine.
  signature: 'hardwareProfile: HardwareProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.instanceView
  name: instanceView
  summary: The virtual machine instance view.
  signature: 'instanceView: VirtualMachineScaleSetVMInstanceView'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.interconnectBlockProfile
  name: interconnectBlockProfile
  summary: 'Specifies the Interconnect Block related details of a Scale Set VM instance.
    Minimum

    api-version: 2026-03-01.'
  signature: 'interconnectBlockProfile: InterconnectBlockProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.latestModelApplied
  name: latestModelApplied
  summary: Specifies whether the latest model has been applied to the virtual machine.
  signature: 'latestModelApplied: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.licenseType
  name: licenseType
  summary: 'Specifies that the image or disk that is being used was licensed on-premises.
    <br><br> Possible

    values for Windows Server operating system are: <br><br> Windows_Client <br><br>
    Windows_Server

    <br><br> Possible values for Linux Server operating system are: <br><br> RHEL_BYOS
    (for RHEL)

    <br><br> SLES_BYOS (for SUSE) <br><br> For more information, see [Azure Hybrid
    Use Benefit for

    Windows Server](https://docs.microsoft.com/azure/virtual-machines/windows/hybrid-use-benefit-licensing)

    <br><br> [Azure Hybrid Use Benefit for Linux Server](https://docs.microsoft.com/azure/virtual-machines/linux/azure-hybrid-benefit-linux)
    <br><br>

    Minimum api-version: 2015-06-15.'
  signature: 'licenseType: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.modelDefinitionApplied
  name: modelDefinitionApplied
  summary: 'Specifies whether the model applied to the virtual machine is the model
    of the virtual machine

    scale set or the customized model for the virtual machine.'
  signature: 'modelDefinitionApplied: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.networkProfile
  name: networkProfile
  summary: Specifies the network interfaces of the virtual machine.
  signature: 'networkProfile: NetworkProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.networkProfileConfiguration
  name: networkProfileConfiguration
  summary: Specifies the network profile configuration of the virtual machine.
  signature: 'networkProfileConfiguration: VirtualMachineScaleSetVMNetworkProfileConfiguration'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.osProfile
  name: osProfile
  summary: Specifies the operating system settings for the virtual machine.
  signature: 'osProfile: OSProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.protectionPolicy
  name: protectionPolicy
  summary: Specifies the protection policy of the virtual machine.
  signature: 'protectionPolicy: VirtualMachineScaleSetVMProtectionPolicy'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.provisioningState
  name: provisioningState
  summary: The provisioning state, which only appears in the response.
  signature: 'provisioningState: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.resilientVMDeletionStatus
  name: resilientVMDeletionStatus
  summary: 'Specifies the resilient VM deletion status for the virtual machine. Known
    values are:

    "Enabled", "Disabled", "InProgress", and "Failed".'
  signature: 'resilientVMDeletionStatus: str | ResilientVMDeletionStatus'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.securityProfile
  name: securityProfile
  summary: Specifies the Security related profile settings for the virtual machine.
  signature: 'securityProfile: SecurityProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.storageProfile
  name: storageProfile
  summary: Specifies the storage settings for the virtual machine disks.
  signature: 'storageProfile: StorageProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.timeCreated
  name: timeCreated
  summary: 'Specifies the time at which the Virtual Machine resource was created.
    Minimum api-version:

    2021-11-01.'
  signature: 'timeCreated: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.userData
  name: userData
  summary: 'UserData for the VM, which must be base-64 encoded. Customer should not
    pass any secrets in

    here. Minimum api-version: 2021-03-01.'
  signature: 'userData: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.virtualMachineResourceId
  name: virtualMachineResourceId
  summary: 'Specifies the ARM resource ID of the standalone virtual machine associated
    with this VMSS VM.

    This property is only applicable to Virtual Machine Scale Sets with Flexible orchestration

    mode. Minimum api-version: 2025-11-01.'
  signature: 'virtualMachineResourceId: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetVMProperties.vmId
  name: vmId
  summary: Azure VM unique ID.
  signature: 'vmId: str'
