uid: azure.mgmt.compute.types.WindowsVMGuestPatchAutomaticByPlatformSettings
name: WindowsVMGuestPatchAutomaticByPlatformSettings
fullName: azure.mgmt.compute.types.WindowsVMGuestPatchAutomaticByPlatformSettings
module: azure.mgmt.compute.types
summary: 'Specifies additional settings to be applied when patch mode AutomaticByPlatform
