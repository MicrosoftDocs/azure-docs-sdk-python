### YamlMime:PythonClass
uid: azure.mgmt.compute.types.DedicatedHostGroupPropertiesAdditionalCapabilities
name: DedicatedHostGroupPropertiesAdditionalCapabilities
fullName: azure.mgmt.compute.types.DedicatedHostGroupPropertiesAdditionalCapabilities
module: azure.mgmt.compute.types
summary: 'Enables or disables a capability on the dedicated host group. Minimum api-version:
  2022-03-01.'
constructor:
  syntax: DedicatedHostGroupPropertiesAdditionalCapabilities()
variables:
- description: 'The flag that enables or disables a capability to have UltraSSD Enabled

    Virtual Machines on Dedicated Hosts of the Dedicated Host Group. For the Virtual
    Machines to be

    UltraSSD Enabled, UltraSSDEnabled flag for the resource needs to be set true as
    well. The value

    is defaulted to ''false'' when not provided. Please refer to

    [https://docs.microsoft.com/en-us/azure/virtual-machines/disks-enable-ultra-ssd](https://docs.microsoft.com/en-us/azure/virtual-machines/disks-enable-ultra-ssd)
    for more

    details on Ultra SSD feature. **Note:** The ultraSSDEnabled setting can only be
    enabled for

    Host Groups that are created as zonal. Minimum api-version: 2022-03-01.'
  name: ultraSSDEnabled
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.compute.types.DedicatedHostGroupPropertiesAdditionalCapabilities.ultraSSDEnabled
  name: ultraSSDEnabled
  summary: 'The flag that enables or disables a capability to have UltraSSD Enabled
    Virtual Machines on

    Dedicated Hosts of the Dedicated Host Group. For the Virtual Machines to be UltraSSD
    Enabled,

    UltraSSDEnabled flag for the resource needs to be set true as well. The value
    is defaulted to

    ''false'' when not provided. Please refer to

    [https://docs.microsoft.com/en-us/azure/virtual-machines/disks-enable-ultra-ssd](https://docs.microsoft.com/en-us/azure/virtual-machines/disks-enable-ultra-ssd)
    for more

    details on Ultra SSD feature. **Note:** The ultraSSDEnabled setting can only be
    enabled for

    Host Groups that are created as zonal. Minimum api-version: 2022-03-01.'
  signature: 'ultraSSDEnabled: bool'
