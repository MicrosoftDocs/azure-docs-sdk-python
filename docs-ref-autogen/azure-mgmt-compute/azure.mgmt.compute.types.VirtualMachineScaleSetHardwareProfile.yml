### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetHardwareProfile
name: VirtualMachineScaleSetHardwareProfile
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetHardwareProfile
module: azure.mgmt.compute.types
summary: Specifies the hardware settings for the virtual machine scale set.
constructor:
  syntax: VirtualMachineScaleSetHardwareProfile()
variables:
- description: 'Specifies the properties for customizing the size of the virtual

    machine. Minimum api-version: 2021-11-01. Please follow the instructions in [VM
    Customization](https://aka.ms/vmcustomization) for more details.'
  name: vmSizeProperties
  types:
  - <xref:<xref:"VMSizeProperties">>
- description: 'Specifies the processor mode for the virtual machine scale set. Optional;

    if omitted, the platform default applies (currently Deterministic). This property
    can be

    updated on a running VMSS without deallocation or reboot. Minimum api-version:
    2026-04-01.

    Known values are: "Deterministic" and "Opportunistic".'
  name: processorMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProcessorMode">]
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetHardwareProfile.processorMode
  name: processorMode
  summary: 'Specifies the processor mode for the virtual machine scale set. Optional;
    if omitted, the

    platform default applies (currently Deterministic). This property can be updated
    on a running

    VMSS without deallocation or reboot. Minimum api-version: 2026-04-01. Known values
    are:

    "Deterministic" and "Opportunistic".'
  signature: 'processorMode: str | ProcessorMode'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetHardwareProfile.vmSizeProperties
  name: vmSizeProperties
  summary: 'Specifies the properties for customizing the size of the virtual machine.
    Minimum api-version:

    2021-11-01. Please follow the instructions in [VM Customization](https://aka.ms/vmcustomization)
    for more details.'
  signature: 'vmSizeProperties: VMSizeProperties'
