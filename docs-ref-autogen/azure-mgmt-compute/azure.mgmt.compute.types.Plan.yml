### YamlMime:PythonClass
uid: azure.mgmt.compute.types.Plan
name: Plan
fullName: azure.mgmt.compute.types.Plan
module: azure.mgmt.compute.types
summary: 'Specifies information about the marketplace image used to create the virtual
  machine. This

  element is only used for marketplace images. Before you can use a marketplace image
  from an

  API, you must enable the image for programmatic use.  In the Azure portal, find
  the marketplace

  image that you want to use and then click **Want to deploy programmatically, Get
  Started ->**.

  Enter any required information and then click **Save**.'
constructor:
  syntax: Plan()
variables:
- description: The plan ID.
  name: name
  types:
  - <xref:str>
- description: The publisher ID.
  name: publisher
  types:
  - <xref:str>
- description: 'Specifies the product of the image from the marketplace. This is the
    same value

    as Offer under the imageReference element.'
  name: product
  types:
  - <xref:str>
- description: The promotion code.
  name: promotionCode
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.compute.types.Plan.name
  name: name
  summary: The plan ID.
  signature: 'name: str'
- uid: azure.mgmt.compute.types.Plan.product
  name: product
  summary: 'Specifies the product of the image from the marketplace. This is the same
    value as Offer under

    the imageReference element.'
  signature: 'product: str'
- uid: azure.mgmt.compute.types.Plan.promotionCode
  name: promotionCode
  summary: The promotion code.
  signature: 'promotionCode: str'
- uid: azure.mgmt.compute.types.Plan.publisher
  name: publisher
  summary: The publisher ID.
  signature: 'publisher: str'
