### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetManagedDiskParameters
name: VirtualMachineScaleSetManagedDiskParameters
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetManagedDiskParameters
module: azure.mgmt.compute.types
summary: Describes the parameters of a ScaleSet managed disk.
constructor:
  syntax: VirtualMachineScaleSetManagedDiskParameters()
variables:
- description: 'Specifies the storage account type for the managed disk. NOTE:

    UltraSSD_LRS can only be used with data disks, it cannot be used with OS Disk.
    Known values

    are: "Standard_LRS", "Premium_LRS", "StandardSSD_LRS", "UltraSSD_LRS", "Premium_ZRS",

    "StandardSSD_ZRS", and "PremiumV2_LRS".'
  name: storage_account_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageAccountTypes">]
- description: 'Specifies the customer managed disk encryption set resource id for

    the managed disk.'
  name: disk_encryption_set
  types:
  - <xref:<xref:"DiskEncryptionSetParameters">>
- description: Specifies the security profile for the managed disk.
  name: security_profile
  types:
  - <xref:<xref:"VMDiskSecurityProfile">>
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetManagedDiskParameters.diskEncryptionSet
  name: diskEncryptionSet
  summary: Specifies the customer managed disk encryption set resource id for the
    managed disk.
  signature: 'diskEncryptionSet: DiskEncryptionSetParameters'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetManagedDiskParameters.securityProfile
  name: securityProfile
  summary: Specifies the security profile for the managed disk.
  signature: 'securityProfile: VMDiskSecurityProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetManagedDiskParameters.storageAccountType
  name: storageAccountType
  summary: 'UltraSSD_LRS can only be used

    with data disks, it cannot be used with OS Disk. Known values are: "Standard_LRS",

    "Premium_LRS", "StandardSSD_LRS", "UltraSSD_LRS", "Premium_ZRS", "StandardSSD_ZRS",

    and "PremiumV2_LRS".'
  signature: 'storageAccountType: str | StorageAccountTypes'
