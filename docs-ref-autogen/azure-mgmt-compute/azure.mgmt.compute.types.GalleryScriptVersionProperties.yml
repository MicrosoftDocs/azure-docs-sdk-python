uid: azure.mgmt.compute.types.GalleryScriptVersionProperties
name: GalleryScriptVersionProperties
fullName: azure.mgmt.compute.types.GalleryScriptVersionProperties
module: azure.mgmt.compute.types
summary: Describes the properties of a gallery script version.
constructor:
  syntax: GalleryScriptVersionProperties()
variables:
