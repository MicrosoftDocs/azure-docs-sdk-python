variables:
- description: 'Specifies the capacity reservation group resource id that

    should be used for allocating the virtual machine or scaleset vm instances provided
    enough

    capacity has been reserved. Please refer to [https://aka.ms/CapacityReservation](https://aka.ms/CapacityReservation)
    for more details.'
  name: capacity_reservation_group
  types:
  - <xref:azure.mgmt.compute.models.SubResource>
- description: 'Specifies whether the virtual machine is

    explicitly opted out from being associated with any capacity reservation. When
    set to true, the

    virtual machine will not be allowed to implicitly or explicitly associate with
    any type of

    capacity reservation and will consume capacity from the publicly available capacity.
    Minimum

    api-version: 2026-04-01.'
  name: disable_capacity_reservation_assignment
  types:
  - <xref:bool>
