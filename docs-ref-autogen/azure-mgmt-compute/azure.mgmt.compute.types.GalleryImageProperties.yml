### YamlMime:PythonClass
uid: azure.mgmt.compute.types.GalleryImageProperties
name: GalleryImageProperties
fullName: azure.mgmt.compute.types.GalleryImageProperties
module: azure.mgmt.compute.types
summary: Describes the properties of a gallery image definition.
constructor:
  syntax: GalleryImageProperties()
variables:
- description: 'The description of this gallery image definition resource. This property
    is

    updatable.'
  name: description
  types:
  - <xref:str>
- description: The Eula agreement for the gallery image definition.
  name: eula
  types:
  - <xref:str>
- description: The privacy statement uri.
  name: privacyStatementUri
  types:
  - <xref:str>
- description: The release note uri.
  name: releaseNoteUri
  types:
  - <xref:str>
- description: 'This property allows you to specify the type of the OS that is included
    in the

    disk when creating a VM from a managed image. Possible values are: **Windows,**
    **Linux.**.

    Required. Known values are: "Windows" and "Linux".'
  name: osType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperatingSystemTypes">]
- description: 'This property allows the user to specify whether the virtual machines
    created

    under this image are ''Generalized'' or ''Specialized''. Required. Known values
    are: "Generalized"

    and "Specialized".'
  name: osState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperatingSystemStateTypes">]
- description: 'The hypervisor generation of the Virtual Machine. Applicable to OS

    disks only. Known values are: "V1" and "V2".'
  name: hyperVGeneration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HyperVGeneration">]
- description: 'The end of life date of the gallery image definition. This property
    can be

    used for decommissioning purposes. This property is updatable.'
  name: endOfLifeDate
  types:
  - <xref:str>
- description: This is the gallery image definition identifier. Required.
  name: identifier
  types:
  - <xref:<xref:"GalleryImageIdentifier">>
- description: 'The properties describe the recommended machine configuration for
    this Image

    Definition. These properties are updatable.'
  name: recommended
  types:
  - <xref:<xref:"RecommendedMachineConfiguration">>
- description: Describes the disallowed disk types.
  name: disallowed
  types:
  - <xref:<xref:"Disallowed">>
- description: 'Describes the gallery image definition purchase plan. This is used
    by

    marketplace images.'
  name: purchasePlan
  types:
  - <xref:<xref:"ImagePurchasePlan">>
- description: 'The provisioning state, which only appears in the response. Known

    values are: "Creating", "Updating", "Failed", "Succeeded", "Deleting", and "Migrating".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GalleryProvisioningState">]
- description: A list of gallery image features.
  name: features
  types:
  - <xref:list>[<xref:"GalleryImageFeature">]
- description: 'The architecture of the image. Applicable to OS disks only. Known
    values

    are: "x64" and "Arm64".'
  name: architecture
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Architecture">]
- description: 'Optional. Must be set to true if the gallery image features are being

    updated.'
  name: allowUpdateImage
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.compute.types.GalleryImageProperties.allowUpdateImage
  name: allowUpdateImage
  summary: Optional. Must be set to true if the gallery image features are being updated.
  signature: 'allowUpdateImage: bool'
- uid: azure.mgmt.compute.types.GalleryImageProperties.architecture
  name: architecture
  summary: '"x64" and

    "Arm64".'
  signature: 'architecture: str | Architecture'
- uid: azure.mgmt.compute.types.GalleryImageProperties.description
  name: description
  summary: The description of this gallery image definition resource. This property
    is updatable.
  signature: 'description: str'
- uid: azure.mgmt.compute.types.GalleryImageProperties.disallowed
  name: disallowed
  summary: Describes the disallowed disk types.
  signature: 'disallowed: Disallowed'
- uid: azure.mgmt.compute.types.GalleryImageProperties.endOfLifeDate
  name: endOfLifeDate
  summary: 'The end of life date of the gallery image definition. This property can
    be used for

    decommissioning purposes. This property is updatable.'
  signature: 'endOfLifeDate: str'
- uid: azure.mgmt.compute.types.GalleryImageProperties.eula
  name: eula
  summary: The Eula agreement for the gallery image definition.
  signature: 'eula: str'
- uid: azure.mgmt.compute.types.GalleryImageProperties.features
  name: features
  summary: A list of gallery image features.
  signature: 'features: list[''GalleryImageFeature'']'
- uid: azure.mgmt.compute.types.GalleryImageProperties.hyperVGeneration
  name: hyperVGeneration
  summary: 'The hypervisor generation of the Virtual Machine. Applicable to OS disks
    only. Known values

    are: "V1" and "V2".'
  signature: 'hyperVGeneration: str | HyperVGeneration'
- uid: azure.mgmt.compute.types.GalleryImageProperties.identifier
  name: identifier
  summary: This is the gallery image definition identifier. Required.
  signature: 'identifier: Required[GalleryImageIdentifier]'
- uid: azure.mgmt.compute.types.GalleryImageProperties.osState
  name: osState
  summary: 'This property allows the user to specify whether the virtual machines
    created under this image

    are ''Generalized'' or ''Specialized''. Required. Known values are: "Generalized"
    and

    "Specialized".'
  signature: 'osState: Required[str | OperatingSystemStateTypes]'
- uid: azure.mgmt.compute.types.GalleryImageProperties.osType
  name: osType
  summary: 'This property allows you to specify the type of the OS that is included
    in the disk when

    creating a VM from a managed image. Possible values are: **Windows,** **Linux.**.
    Required.

    Known values are: "Windows" and "Linux".'
  signature: 'osType: Required[str | OperatingSystemTypes]'
- uid: azure.mgmt.compute.types.GalleryImageProperties.privacyStatementUri
  name: privacyStatementUri
  summary: The privacy statement uri.
  signature: 'privacyStatementUri: str'
- uid: azure.mgmt.compute.types.GalleryImageProperties.provisioningState
  name: provisioningState
  summary: '"Creating",

    "Updating", "Failed", "Succeeded", "Deleting", and "Migrating".'
  signature: 'provisioningState: str | GalleryProvisioningState'
- uid: azure.mgmt.compute.types.GalleryImageProperties.purchasePlan
  name: purchasePlan
  summary: Describes the gallery image definition purchase plan. This is used by marketplace
    images.
  signature: 'purchasePlan: ImagePurchasePlan'
- uid: azure.mgmt.compute.types.GalleryImageProperties.recommended
  name: recommended
  summary: 'The properties describe the recommended machine configuration for this
    Image Definition. These

    properties are updatable.'
  signature: 'recommended: RecommendedMachineConfiguration'
- uid: azure.mgmt.compute.types.GalleryImageProperties.releaseNoteUri
  name: releaseNoteUri
  summary: The release note uri.
  signature: 'releaseNoteUri: str'
