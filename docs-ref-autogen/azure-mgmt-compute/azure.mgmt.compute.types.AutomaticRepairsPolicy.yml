### YamlMime:PythonClass
uid: azure.mgmt.compute.types.AutomaticRepairsPolicy
name: AutomaticRepairsPolicy
fullName: azure.mgmt.compute.types.AutomaticRepairsPolicy
module: azure.mgmt.compute.types
summary: Specifies the configuration parameters for automatic repairs on the virtual
  machine scale set.
constructor:
  syntax: AutomaticRepairsPolicy()
variables:
- description: 'Specifies whether automatic repairs should be enabled on the virtual
    machine

    scale set. The default value is false.'
  name: enabled
  types:
  - <xref:bool>
- description: 'The amount of time for which automatic repairs are suspended due to
    a state

    change on VM. The grace time starts after the state change has completed. This
    helps avoid

    premature or accidental repairs. The time duration should be specified in ISO
    8601 format. The

    minimum allowed grace period is 10 minutes (PT10M), which is also the default
    value. The

    maximum allowed grace period is 90 minutes (PT90M).'
  name: gracePeriod
  types:
  - <xref:str>
- description: 'Type of repair action (replace, restart, reimage) that will be used
    for

    repairing unhealthy virtual machines in the scale set. Default value is replace.
    Known values

    are: "Replace", "Restart", and "Reimage".'
  name: repairAction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RepairAction">]
attributes:
- uid: azure.mgmt.compute.types.AutomaticRepairsPolicy.enabled
  name: enabled
  summary: 'Specifies whether automatic repairs should be enabled on the virtual machine
    scale set. The

    default value is false.'
  signature: 'enabled: bool'
- uid: azure.mgmt.compute.types.AutomaticRepairsPolicy.gracePeriod
  name: gracePeriod
  summary: 'The amount of time for which automatic repairs are suspended due to a
    state change on VM. The

    grace time starts after the state change has completed. This helps avoid premature
    or

    accidental repairs. The time duration should be specified in ISO 8601 format.
    The minimum

    allowed grace period is 10 minutes (PT10M), which is also the default value. The
    maximum

    allowed grace period is 90 minutes (PT90M).'
  signature: 'gracePeriod: str'
- uid: azure.mgmt.compute.types.AutomaticRepairsPolicy.repairAction
  name: repairAction
  summary: 'Type of repair action (replace, restart, reimage) that will be used for
    repairing unhealthy

    virtual machines in the scale set. Default value is replace. Known values are:
    "Replace",

    "Restart", and "Reimage".'
  signature: 'repairAction: str | RepairAction'
