uid: azure.mgmt.compute.types.AdditionalReplicaSet
name: AdditionalReplicaSet
fullName: azure.mgmt.compute.types.AdditionalReplicaSet
module: azure.mgmt.compute.types
summary: Describes the additional replica set information.
constructor:
  syntax: AdditionalReplicaSet()
variables:
- description: 'Specifies the storage account type to be used to create the direct

    drive replicas. Known values are: "Standard_LRS", "Standard_ZRS", "Premium_LRS",
    and

    "PremiumV2_LRS".'
  name: storage_account_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageAccountType">]
- description: 'The number of direct drive replicas of the Image Version to be

    created.This Property is updatable.'
  name: regional_replica_count
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.compute.types.AdditionalReplicaSet.regionalReplicaCount
  name: regionalReplicaCount
  summary: 'The number of direct drive replicas of the Image Version to be created.This
    Property is

    updatable.'
  signature: 'regionalReplicaCount: int'
- uid: azure.mgmt.compute.types.AdditionalReplicaSet.storageAccountType
  name: storageAccountType
  summary: 'Specifies the storage account type to be used to create the direct drive
    replicas. Known values

    are: "Standard_LRS", "Standard_ZRS", "Premium_LRS", and "PremiumV2_LRS".'
  signature: 'storageAccountType: str | StorageAccountType'
