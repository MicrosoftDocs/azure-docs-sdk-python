### YamlMime:PythonClass
uid: azure.mgmt.compute.types.ImageProperties
name: ImageProperties
fullName: azure.mgmt.compute.types.ImageProperties
module: azure.mgmt.compute.types
summary: Describes the properties of an Image.
constructor:
  syntax: ImageProperties()
variables:
- description: The source virtual machine from which Image is created.
  name: source_virtual_machine
  types:
  - <xref:<xref:"SubResource">>
- description: Specifies the storage settings for the virtual machine disks.
  name: storage_profile
  types:
  - <xref:<xref:"ImageStorageProfile">>
- description: The provisioning state.
  name: provisioning_state
  types:
  - <xref:str>
- description: 'Specifies the HyperVGenerationType of the VirtualMachine created from

    the image. From API Version 2019-03-01 if the image source is a blob, then we
    need the user to

    specify the value, if the source is managed resource like disk or snapshot, we
    may require the

    user to specify the property if we cannot deduce it from the source managed resource.
    Known

    values are: "V1" and "V2".'
  name: hyper_v_generation
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HyperVGenerationTypes">]
attributes:
- uid: azure.mgmt.compute.types.ImageProperties.hyperVGeneration
  name: hyperVGeneration
  summary: 'Specifies the HyperVGenerationType of the VirtualMachine created from
    the image. From API

    Version 2019-03-01 if the image source is a blob, then we need the user to specify
    the value,

    if the source is managed resource like disk or snapshot, we may require the user
    to specify the

    property if we cannot deduce it from the source managed resource. Known values
    are: "V1" and

    "V2".'
  signature: 'hyperVGeneration: str | HyperVGenerationTypes'
- uid: azure.mgmt.compute.types.ImageProperties.provisioningState
  name: provisioningState
  summary: The provisioning state.
  signature: 'provisioningState: str'
- uid: azure.mgmt.compute.types.ImageProperties.sourceVirtualMachine
  name: sourceVirtualMachine
  summary: The source virtual machine from which Image is created.
  signature: 'sourceVirtualMachine: SubResource'
- uid: azure.mgmt.compute.types.ImageProperties.storageProfile
  name: storageProfile
  summary: Specifies the storage settings for the virtual machine disks.
  signature: 'storageProfile: ImageStorageProfile'
