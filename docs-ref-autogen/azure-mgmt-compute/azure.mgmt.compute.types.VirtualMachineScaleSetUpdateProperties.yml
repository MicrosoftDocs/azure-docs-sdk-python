### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties
name: VirtualMachineScaleSetUpdateProperties
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties
module: azure.mgmt.compute.types
summary: Describes the properties of a Virtual Machine Scale Set.
constructor:
  syntax: VirtualMachineScaleSetUpdateProperties()
variables:
- description: The upgrade policy.
  name: upgrade_policy
  types:
  - <xref:<xref:"UpgradePolicy">>
- description: Policy for automatic repairs.
  name: automatic_repairs_policy
  types:
  - <xref:<xref:"AutomaticRepairsPolicy">>
- description: The virtual machine profile.
  name: virtual_machine_profile
  types:
  - <xref:<xref:"VirtualMachineScaleSetUpdateVMProfile">>
- description: Specifies whether the Virtual Machine Scale Set should be overprovisioned.
  name: overprovision
  types:
  - <xref:bool>
- description: 'When Overprovision is enabled, extensions

    are launched only on the requested number of VMs which are finally kept. This
    property will

    hence ensure that the extensions do not run on the extra overprovisioned VMs.'
  name: do_not_run_extensions_on_overprovisioned_v_ms
  types:
  - <xref:bool>
- description: 'When true this limits the scale set to a single placement group,

    of max size 100 virtual machines. NOTE: If singlePlacementGroup is true, it may
    be modified to

    false. However, if singlePlacementGroup is false, it may not be modified to true.'
  name: single_placement_group
  types:
  - <xref:bool>
- description: 'Specifies additional capabilities enabled or disabled on the

    Virtual Machines in the Virtual Machine Scale Set. For instance: whether the Virtual
    Machines

    have the capability to support attaching managed data disks with UltraSSD_LRS
    storage account

    type.'
  name: additional_capabilities
  types:
  - <xref:<xref:"AdditionalCapabilities">>
- description: 'Specifies the policies applied when scaling in Virtual Machines in
    the

    Virtual Machine Scale Set.'
  name: scale_in_policy
  types:
  - <xref:<xref:"ScaleInPolicy">>
- description: 'Specifies information about the proximity placement group that

    the virtual machine scale set should be assigned to. <br><br>Minimum api-version:
    2018-04-01.'
  name: proximity_placement_group
  types:
  - <xref:<xref:"SubResource">>
- description: 'Specifies the desired targets for mixing Spot and Regular priority

    VMs within the same VMSS Flex instance.'
  name: priority_mix_policy
  types:
  - <xref:<xref:"PriorityMixPolicy">>
- description: 'Specifies the Spot Restore properties for the virtual machine scale

    set.'
  name: spot_restore_policy
  types:
  - <xref:<xref:"SpotRestorePolicy">>
- description: Policy for Resiliency.
  name: resiliency_policy
  types:
  - <xref:<xref:"ResiliencyPolicy">>
- description: 'Specifies the align mode between Virtual Machine

    Scale Set compute and storage Fault Domain count. Known values are: "Aligned",
    "Unaligned", and

    "BestEffortAligned".'
  name: zonal_platform_fault_domain_align_mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ZonalPlatformFaultDomainAlignMode">]
- description: Specifies the sku profile for the virtual machine scale set.
  name: sku_profile
  types:
  - <xref:<xref:"SkuProfile">>
- description: 'Specifies the lifecycle hooks profile for the virtual machine

    scale set.'
  name: lifecycle_hooks_profile
  types:
  - <xref:<xref:"LifecycleHooksProfile">>
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.additionalCapabilities
  name: additionalCapabilities
  summary: 'Specifies additional capabilities enabled or disabled on the Virtual Machines
    in the Virtual

    Machine Scale Set. For instance: whether the Virtual Machines have the capability
    to support

    attaching managed data disks with UltraSSD_LRS storage account type.'
  signature: 'additionalCapabilities: AdditionalCapabilities'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.automaticRepairsPolicy
  name: automaticRepairsPolicy
  summary: Policy for automatic repairs.
  signature: 'automaticRepairsPolicy: AutomaticRepairsPolicy'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.doNotRunExtensionsOnOverprovisionedVMs
  name: doNotRunExtensionsOnOverprovisionedVMs
  summary: 'When Overprovision is enabled, extensions are launched only on the requested
    number of VMs

    which are finally kept. This property will hence ensure that the extensions do
    not run on the

    extra overprovisioned VMs.'
  signature: 'doNotRunExtensionsOnOverprovisionedVMs: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.lifecycleHooksProfile
  name: lifecycleHooksProfile
  summary: Specifies the lifecycle hooks profile for the virtual machine scale set.
  signature: 'lifecycleHooksProfile: LifecycleHooksProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.overprovision
  name: overprovision
  summary: Specifies whether the Virtual Machine Scale Set should be overprovisioned.
  signature: 'overprovision: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.priorityMixPolicy
  name: priorityMixPolicy
  summary: 'Specifies the desired targets for mixing Spot and Regular priority VMs
    within the same VMSS

    Flex instance.'
  signature: 'priorityMixPolicy: PriorityMixPolicy'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.proximityPlacementGroup
  name: proximityPlacementGroup
  summary: 'Specifies information about the proximity placement group that the virtual
    machine scale set

    should be assigned to. <br><br>Minimum api-version: 2018-04-01.'
  signature: 'proximityPlacementGroup: SubResource'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.resiliencyPolicy
  name: resiliencyPolicy
  summary: Policy for Resiliency.
  signature: 'resiliencyPolicy: ResiliencyPolicy'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.scaleInPolicy
  name: scaleInPolicy
  summary: 'Specifies the policies applied when scaling in Virtual Machines in the
    Virtual Machine Scale

    Set.'
  signature: 'scaleInPolicy: ScaleInPolicy'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.singlePlacementGroup
  name: singlePlacementGroup
  summary: 'When true this limits the scale set to a single placement group, of max
    size 100 virtual

    machines. NOTE: If singlePlacementGroup is true, it may be modified to false.
    However, if

    singlePlacementGroup is false, it may not be modified to true.'
  signature: 'singlePlacementGroup: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.skuProfile
  name: skuProfile
  summary: Specifies the sku profile for the virtual machine scale set.
  signature: 'skuProfile: SkuProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.spotRestorePolicy
  name: spotRestorePolicy
  summary: Specifies the Spot Restore properties for the virtual machine scale set.
  signature: 'spotRestorePolicy: SpotRestorePolicy'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.upgradePolicy
  name: upgradePolicy
  summary: The upgrade policy.
  signature: 'upgradePolicy: UpgradePolicy'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.virtualMachineProfile
  name: virtualMachineProfile
  summary: The virtual machine profile.
  signature: 'virtualMachineProfile: VirtualMachineScaleSetUpdateVMProfile'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateProperties.zonalPlatformFaultDomainAlignMode
  name: zonalPlatformFaultDomainAlignMode
  summary: 'Specifies the align mode between Virtual Machine Scale Set compute and
    storage Fault Domain

    count. Known values are: "Aligned", "Unaligned", and "BestEffortAligned".'
  signature: 'zonalPlatformFaultDomainAlignMode: str | ZonalPlatformFaultDomainAlignMode'
