### YamlMime:PythonClass
uid: azure.mgmt.compute.types.ImageDisk
name: ImageDisk
fullName: azure.mgmt.compute.types.ImageDisk
module: azure.mgmt.compute.types
summary: Describes a image disk.
constructor:
  syntax: ImageDisk()
variables:
- description: The snapshot.
  name: snapshot
  types:
  - <xref:<xref:"SubResource">>
- description: The managedDisk.
  name: managedDisk
  types:
  - <xref:<xref:"SubResource">>
- description: The Virtual Hard Disk.
  name: blobUri
  types:
  - <xref:str>
- description: 'Specifies the caching requirements. Possible values are: **None,**
    **ReadOnly,**

    **ReadWrite.** The default values are: **None for Standard storage. ReadOnly for
    Premium

    storage.**. Known values are: "None", "ReadOnly", and "ReadWrite".'
  name: caching
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CachingTypes">]
- description: 'Specifies the size of empty data disks in gigabytes. This element
    can be used

    to overwrite the name of the disk in a virtual machine image. This value cannot
    be larger than

    1023 GB.'
  name: diskSizeGB
  types:
  - <xref:int>
- description: 'Specifies the storage account type for the managed disk. NOTE:

    UltraSSD_LRS can only be used with data disks, it cannot be used with OS Disk.
    Known values

    are: "Standard_LRS", "Premium_LRS", "StandardSSD_LRS", "UltraSSD_LRS", "Premium_ZRS",

    "StandardSSD_ZRS", and "PremiumV2_LRS".'
  name: storageAccountType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageAccountTypes">]
- description: 'Specifies the customer managed disk encryption set resource id for
    the

    managed image disk.'
  name: diskEncryptionSet
  types:
  - <xref:<xref:"DiskEncryptionSetParameters">>
attributes:
- uid: azure.mgmt.compute.types.ImageDisk.blobUri
  name: blobUri
  summary: The Virtual Hard Disk.
  signature: 'blobUri: str'
- uid: azure.mgmt.compute.types.ImageDisk.caching
  name: caching
  summary: '**None,** **ReadOnly,** **ReadWrite.**

    The default values are: **None for Standard storage. ReadOnly for Premium storage.**.
    Known

    values are: "None", "ReadOnly", and "ReadWrite".'
  signature: 'caching: str | CachingTypes'
- uid: azure.mgmt.compute.types.ImageDisk.diskEncryptionSet
  name: diskEncryptionSet
  summary: Specifies the customer managed disk encryption set resource id for the
    managed image disk.
  signature: 'diskEncryptionSet: DiskEncryptionSetParameters'
- uid: azure.mgmt.compute.types.ImageDisk.diskSizeGB
  name: diskSizeGB
  summary: 'Specifies the size of empty data disks in gigabytes. This element can
    be used to overwrite the

    name of the disk in a virtual machine image. This value cannot be larger than
    1023 GB.'
  signature: 'diskSizeGB: int'
- uid: azure.mgmt.compute.types.ImageDisk.managedDisk
  name: managedDisk
  summary: The managedDisk.
  signature: 'managedDisk: SubResource'
- uid: azure.mgmt.compute.types.ImageDisk.snapshot
  name: snapshot
  summary: The snapshot.
  signature: 'snapshot: SubResource'
