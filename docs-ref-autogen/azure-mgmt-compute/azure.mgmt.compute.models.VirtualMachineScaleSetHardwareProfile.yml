name: VirtualMachineScaleSetHardwareProfile
fullName: azure.mgmt.compute.models.VirtualMachineScaleSetHardwareProfile
module: azure.mgmt.compute.models
summary: Specifies the hardware settings for the virtual machine scale set.
constructor:
  syntax: 'VirtualMachineScaleSetHardwareProfile(*args: Any, **kwargs: Any)'
variables:
- description: 'Specifies the properties for customizing the size of the virtual

    machine. Minimum api-version: 2021-11-01. Please follow the instructions in [VM
    Customization](https://aka.ms/vmcustomization) for more details.'
  name: vm_size_properties
  types:
  - <xref:azure.mgmt.compute.models.VMSizeProperties>
- description: 'Specifies the processor mode for the virtual machine scale set. Optional;

    if omitted, the platform default applies (currently Deterministic). This property
    can be

    updated on a running VMSS without deallocation or reboot. Minimum api-version:
    2026-04-01.

    Known values are: "Deterministic" and "Opportunistic".'
  name: processor_mode
  types:
  - <xref:str>
  - <xref:azure.mgmt.compute.models.ProcessorMode>
