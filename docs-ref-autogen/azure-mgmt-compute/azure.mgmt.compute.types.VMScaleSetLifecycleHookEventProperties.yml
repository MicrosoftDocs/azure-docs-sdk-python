### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventProperties
name: VMScaleSetLifecycleHookEventProperties
fullName: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventProperties
module: azure.mgmt.compute.types
summary: Defines the virtual machine scale set lifecycle hook event properties.
constructor:
  syntax: VMScaleSetLifecycleHookEventProperties()
variables:
- description: 'Defines the type or scenario for sending a virtual machine scale set
    lifecycle hook

    event to the customer. Known values are: "UpgradeAutoOSScheduling" and

    "UpgradeAutoOSRollingBatchStarting".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VMScaleSetLifecycleHookEventType">]
- description: 'Specifies the exact UTC timestamp in ISO 8601 format till which the
    event

    would remain in the current lifecycle state waiting for an action from the customer.
    Beyond

    this timestamp, the platform will apply the defaultAction for the event.'
  name: waitUntil
  types:
  - <xref:str>
- description: 'Specifies the exact UTC timestamp in ISO 8601 format till when the
    customer

    can delay the lifecycle hook event. The customer will not be allowed to delay
    the event to a

    timestamp beyond this.'
  name: maxWaitUntil
  types:
  - <xref:str>
- description: 'The UTC timestamp in ISO 8601 format at which the platform creates
    the

    virtual machine scale set lifecycle hook event entity.'
  name: timeCreated
  types:
  - <xref:str>
- description: 'Specify the action that will be applied on the a target resource in
    the

    virtual machine scale set lifecycle hook event if the platform does not get a
    response from the

    customer for the target resource before waitUntil. Known values are: "Approve"
    and "Reject".'
  name: defaultAction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LifecycleHookAction">]
- description: 'List of target resources which are getting processed in the virtual

    machine scale set lifecycle hook event.'
  name: targetResources
  types:
  - <xref:list>[<xref:"VMScaleSetLifecycleHookEventTargetResource">]
- description: 'Additional key-value pairs set on the lifecycle hook event that gives

    customer some useful context/data. The keys in this dictionary are specific to
    the lifecycle

    hook type. Different lifecycle hook events can have different sets of keys in
    the additional

    context depending on the lifecycle hook type. For example, for a lifecycle hook
    event with

    UpgradeAutoOSScheduling type, the additional context can contain the key "priority"
    that helps

    customer identify the priority of the Auto OS Upgrade operation triggered on the
    virtual

    machine scale set.'
  name: additionalContext
  types:
  - <xref:<xref:"VMScaleSetLifecycleHookEventAdditionalContext">>
- description: 'Specifies the state of the virtual machine scale set lifecycle hook
    event. Known

    values are: "Active" and "Completed".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VMScaleSetLifecycleHookEventState">]
attributes:
- uid: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventProperties.additionalContext
  name: additionalContext
  summary: 'Additional key-value pairs set on the lifecycle hook event that gives
    customer some useful

    context/data. The keys in this dictionary are specific to the lifecycle hook type.
    Different

    lifecycle hook events can have different sets of keys in the additional context
    depending on

    the lifecycle hook type. For example, for a lifecycle hook event with UpgradeAutoOSScheduling

    type, the additional context can contain the key "priority" that helps customer
    identify the

    priority of the Auto OS Upgrade operation triggered on the virtual machine scale
    set.'
  signature: 'additionalContext: VMScaleSetLifecycleHookEventAdditionalContext'
- uid: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventProperties.defaultAction
  name: defaultAction
  summary: 'Specify the action that will be applied on the a target resource in the
    virtual machine scale

    set lifecycle hook event if the platform does not get a response from the customer
    for the

    target resource before waitUntil. Known values are: "Approve" and "Reject".'
  signature: 'defaultAction: str | LifecycleHookAction'
- uid: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventProperties.maxWaitUntil
  name: maxWaitUntil
  summary: 'Specifies the exact UTC timestamp in ISO 8601 format till when the customer
    can delay the

    lifecycle hook event. The customer will not be allowed to delay the event to a
    timestamp beyond

    this.'
  signature: 'maxWaitUntil: str'
- uid: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventProperties.state
  name: state
  summary: 'Specifies the state of the virtual machine scale set lifecycle hook event.
    Known values are:

    "Active" and "Completed".'
  signature: 'state: str | VMScaleSetLifecycleHookEventState'
- uid: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventProperties.targetResources
  name: targetResources
  summary: 'List of target resources which are getting processed in the virtual machine
    scale set lifecycle

    hook event.'
  signature: 'targetResources: list[''VMScaleSetLifecycleHookEventTargetResource'']'
- uid: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventProperties.timeCreated
  name: timeCreated
  summary: 'The UTC timestamp in ISO 8601 format at which the platform creates the
    virtual machine scale

    set lifecycle hook event entity.'
  signature: 'timeCreated: str'
- uid: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventProperties.type
  name: type
  summary: 'Defines the type or scenario for sending a virtual machine scale set lifecycle
    hook event to

    the customer. Known values are: "UpgradeAutoOSScheduling" and

    "UpgradeAutoOSRollingBatchStarting".'
  signature: 'type: str | VMScaleSetLifecycleHookEventType'
- uid: azure.mgmt.compute.types.VMScaleSetLifecycleHookEventProperties.waitUntil
  name: waitUntil
  summary: 'Specifies the exact UTC timestamp in ISO 8601 format till which the event
    would remain in the

    current lifecycle state waiting for an action from the customer. Beyond this timestamp,
    the

    platform will apply the defaultAction for the event.'
  signature: 'waitUntil: str'
