### YamlMime:PythonClass
uid: azure.mgmt.compute.types.GalleryInVMAccessControlProfileVersionProperties
name: GalleryInVMAccessControlProfileVersionProperties
fullName: azure.mgmt.compute.types.GalleryInVMAccessControlProfileVersionProperties
module: azure.mgmt.compute.types
summary: Describes the properties of an inVMAccessControlProfile version.
constructor:
  syntax: GalleryInVMAccessControlProfileVersionProperties()
variables:
- description: 'The target regions where the Resource Profile version is going to
    be

    replicated to. This property is updatable.'
  name: target_locations
  types:
  - <xref:list>[<xref:"TargetRegion">]
- description: 'If set to true, Virtual Machines deployed from the latest version
    of

    the Resource Profile won''t use this Profile version.'
  name: exclude_from_latest
  types:
  - <xref:bool>
- description: The timestamp for when the Resource Profile Version is published.
  name: published_date
  types:
  - <xref:str>
- description: 'The provisioning state, which only appears in the response. Known

    values are: "Creating", "Updating", "Failed", "Succeeded", "Deleting", and "Migrating".'
  name: provisioning_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"GalleryProvisioningState">]
- description: This is the replication status of the gallery image version.
  name: replication_status
  types:
  - <xref:<xref:"ReplicationStatus">>
- description: 'This property allows you to specify whether the access control rules
    are in Audit

    mode, in Enforce mode or Disabled. Possible values are: ''Audit'', ''Enforce''
    or ''Disabled''.

    Required. Known values are: "Audit", "Enforce", and "Disabled".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AccessControlRulesMode">]
- description: 'This property allows you to specify if the requests will be allowed
    to

    access the host endpoints. Possible values are: ''Allow'', ''Deny''. Required.
    Known values are:

    "Allow" and "Deny".'
  name: default_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EndpointAccess">]
- description: 'This is the Access Control Rules specification for an inVMAccessControlProfile

    version.'
  name: rules
  types:
  - <xref:<xref:"AccessControlRules">>
attributes:
- uid: azure.mgmt.compute.types.GalleryInVMAccessControlProfileVersionProperties.defaultAccess
  name: defaultAccess
  summary: 'This property allows you to specify if the requests will be allowed to
    access the host

    endpoints. Possible values are: ''Allow'', ''Deny''. Required. Known values are:
    "Allow" and

    "Deny".'
  signature: 'defaultAccess: Required[str | EndpointAccess]'
- uid: azure.mgmt.compute.types.GalleryInVMAccessControlProfileVersionProperties.mode
  name: mode
  summary: 'This property allows you to specify whether the access control rules are
    in Audit mode, in

    Enforce mode or Disabled. Possible values are: ''Audit'', ''Enforce'' or ''Disabled''.
    Required.

    Known values are: "Audit", "Enforce", and "Disabled".'
  signature: 'mode: Required[str | AccessControlRulesMode]'
- uid: azure.mgmt.compute.types.GalleryInVMAccessControlProfileVersionProperties.rules
  name: rules
  summary: This is the Access Control Rules specification for an inVMAccessControlProfile
    version.
  signature: 'rules: AccessControlRules'
- uid: azure.mgmt.compute.types.GalleryInVMAccessControlProfileVersionProperties.excludeFromLatest
  name: excludeFromLatest
  signature: 'excludeFromLatest: bool'
- uid: azure.mgmt.compute.types.GalleryInVMAccessControlProfileVersionProperties.provisioningState
  name: provisioningState
  signature: 'provisioningState: str | GalleryProvisioningState'
- uid: azure.mgmt.compute.types.GalleryInVMAccessControlProfileVersionProperties.publishedDate
  name: publishedDate
  signature: 'publishedDate: str'
- uid: azure.mgmt.compute.types.GalleryInVMAccessControlProfileVersionProperties.replicationStatus
  name: replicationStatus
  signature: 'replicationStatus: ReplicationStatus'
- uid: azure.mgmt.compute.types.GalleryInVMAccessControlProfileVersionProperties.targetLocations
  name: targetLocations
  signature: 'targetLocations: list[''TargetRegion'']'
