### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk
name: VirtualMachineScaleSetOSDisk
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk
module: azure.mgmt.compute.types
summary: Describes a virtual machine scale set operating system disk.
constructor:
  syntax: VirtualMachineScaleSetOSDisk()
variables:
- description: The disk name.
  name: name
  types:
  - <xref:str>
- description: 'Specifies the caching requirements. Possible values are: **None,**
    **ReadOnly,**

    **ReadWrite.** The default values are: **None for Standard storage. ReadOnly for
    Premium

    storage.**. Known values are: "None", "ReadOnly", and "ReadWrite".'
  name: caching
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CachingTypes">]
- description: 'Specifies whether writeAccelerator should be enabled or

    disabled on the disk.'
  name: write_accelerator_enabled
  types:
  - <xref:bool>
- description: 'Specifies how the virtual machines in the scale set should be created.
    The

    only allowed value is: **FromImage.** This value is used when you are using an
    image to create

    the virtual machine. If you are using a platform image, you also use the imageReference
    element

    described above. If you are using a marketplace image, you  also use the plan
    element

    previously described. Required. Known values are: "FromImage", "Empty", "Attach",
    "Copy", and

    "Restore".'
  name: create_option
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskCreateOptionTypes">]
- description: 'Specifies the ephemeral disk Settings for the operating system disk

    used by the virtual machine scale set.'
  name: diff_disk_settings
  types:
  - <xref:<xref:"DiffDiskSettings">>
- description: 'Specifies the size of an empty data disk in gigabytes. This element
    can be

    used to overwrite the size of the disk in a virtual machine image. The property
    ''diskSizeGB'' is

    the number of bytes x 1024^3 for the disk and the value cannot be larger than
    1023.'
  name: disk_size_gb
  types:
  - <xref:int>
- description: 'Specifies the storage fault domain alignment type for the

    disk. Known values are: "Aligned" and "BestEffortAligned".'
  name: storage_fault_domain_alignment
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageFaultDomainAlignmentType">]
- description: 'This property allows you to specify the type of the OS that is included
    in the

    disk if creating a VM from user-image or a specialized VHD. Possible values are:
    **Windows,**

    **Linux.**. Known values are: "Windows" and "Linux".'
  name: os_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperatingSystemTypes">]
- description: Specifies information about the unmanaged user image to base the scale
    set on.
  name: image
  types:
  - <xref:<xref:"VirtualHardDisk">>
- description: 'Specifies the container urls that are used to store operating system

    disks for the scale set.'
  name: vhd_containers
  types:
  - <xref:list>[<xref:str>]
- description: The managed disk parameters.
  name: managed_disk
  types:
  - <xref:<xref:"VirtualMachineScaleSetManagedDiskParameters">>
- description: 'Specifies whether OS Disk should be deleted or detached upon VMSS
    Flex

    deletion (This feature is available for VMSS with Flexible OrchestrationMode only).
    <br><br>

    Possible values: <br><br> **Delete** If this value is used, the OS disk is deleted
    when VMSS

    Flex VM is deleted.<br><br> **Detach** If this value is used, the OS disk is retained
    after

    VMSS Flex VM is deleted. <br><br> The default value is set to **Delete**. For
    an Ephemeral OS

    Disk, the default value is set to **Delete**. User cannot change the delete option
    for

    Ephemeral OS Disk. Known values are: "Delete" and "Detach".'
  name: delete_option
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskDeleteOptionTypes">]
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk.caching
  name: caching
  summary: '**None,** **ReadOnly,** **ReadWrite.**

    The default values are: **None for Standard storage. ReadOnly for Premium storage.**.
    Known

    values are: "None", "ReadOnly", and "ReadWrite".'
  signature: 'caching: str | CachingTypes'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk.createOption
  name: createOption
  summary: 'Specifies how the virtual machines in the scale set should be created.
    The only allowed value

    is: **FromImage.** This value is used when you are using an image to create the
    virtual

    machine. If you are using a platform image, you also use the imageReference element
    described

    above. If you are using a marketplace image, you  also use the plan element previously

    described. Required. Known values are: "FromImage", "Empty", "Attach", "Copy",
    and

    "Restore".'
  signature: 'createOption: Required[str | DiskCreateOptionTypes]'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk.deleteOption
  name: deleteOption
  summary: 'Specifies whether OS Disk should be deleted or detached upon VMSS Flex
    deletion (This feature

    is available for VMSS with Flexible OrchestrationMode only). <br><br> Possible
    values: <br><br>

    **Delete** If this value is used, the OS disk is deleted when VMSS Flex VM is
    deleted.<br><br>

    **Detach** If this value is used, the OS disk is retained after VMSS Flex VM is
    deleted.

    <br><br> The default value is set to **Delete**. For an Ephemeral OS Disk, the
    default value is

    set to **Delete**. User cannot change the delete option for Ephemeral OS Disk.
    Known values

    are: "Delete" and "Detach".'
  signature: 'deleteOption: str | DiskDeleteOptionTypes'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk.diffDiskSettings
  name: diffDiskSettings
  summary: 'Specifies the ephemeral disk Settings for the operating system disk used
    by the virtual machine

    scale set.'
  signature: 'diffDiskSettings: DiffDiskSettings'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk.diskSizeGB
  name: diskSizeGB
  summary: 'Specifies the size of an empty data disk in gigabytes. This element can
    be used to overwrite

    the size of the disk in a virtual machine image. The property ''diskSizeGB'' is
    the number of

    bytes x 1024^3 for the disk and the value cannot be larger than 1023.'
  signature: 'diskSizeGB: int'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk.image
  name: image
  summary: Specifies information about the unmanaged user image to base the scale
    set on.
  signature: 'image: VirtualHardDisk'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk.managedDisk
  name: managedDisk
  summary: The managed disk parameters.
  signature: 'managedDisk: VirtualMachineScaleSetManagedDiskParameters'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk.name
  name: name
  summary: The disk name.
  signature: 'name: str'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk.osType
  name: osType
  summary: 'This property allows you to specify the type of the OS that is included
    in the disk if creating

    a VM from user-image or a specialized VHD. Possible values are: **Windows,** **Linux.**.
    Known

    values are: "Windows" and "Linux".'
  signature: 'osType: str | OperatingSystemTypes'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk.storageFaultDomainAlignment
  name: storageFaultDomainAlignment
  summary: '"Aligned"

    and "BestEffortAligned".'
  signature: 'storageFaultDomainAlignment: str | StorageFaultDomainAlignmentType'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk.vhdContainers
  name: vhdContainers
  summary: Specifies the container urls that are used to store operating system disks
    for the scale set.
  signature: 'vhdContainers: list[str]'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetOSDisk.writeAcceleratorEnabled
  name: writeAcceleratorEnabled
  summary: Specifies whether writeAccelerator should be enabled or disabled on the
    disk.
  signature: 'writeAcceleratorEnabled: bool'
