### YamlMime:PythonClass
uid: azure.mgmt.compute.types.EncryptionSetProperties
name: EncryptionSetProperties
fullName: azure.mgmt.compute.types.EncryptionSetProperties
module: azure.mgmt.compute.types
summary: EncryptionSetProperties.
constructor:
  syntax: EncryptionSetProperties()
variables:
- description: 'The type of key used to encrypt the data of the disk. Known values
    are:

    "EncryptionAtRestWithCustomerKey", "EncryptionAtRestWithPlatformAndCustomerKeys",
    and

    "ConfidentialVmEncryptedWithCustomerKey".'
  name: encryption_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskEncryptionSetType">]
- description: The key vault key which is currently used by this disk encryption set.
  name: active_key
  types:
  - <xref:<xref:"KeyForDiskEncryptionSet">>
- description: 'A readonly collection of key vault keys previously used by this disk

    encryption set while a key rotation is in progress. It will be empty if there
    is no ongoing key

    rotation.'
  name: previous_keys
  types:
  - <xref:list>[<xref:"KeyForDiskEncryptionSet">]
- description: The disk encryption set provisioning state.
  name: provisioning_state
  types:
  - <xref:str>
- description: 'Set this flag to true to enable auto-updating of

    this disk encryption set to the latest key version.'
  name: rotation_to_latest_key_version_enabled
  types:
  - <xref:bool>
- description: 'The time when the active key of this disk encryption set was

    updated.'
  name: last_key_rotation_timestamp
  types:
  - <xref:str>
- description: 'The error that was encountered during auto-key rotation. If an

    error is present, then auto-key rotation will not be attempted until the error
    on this disk

    encryption set is fixed.'
  name: auto_key_rotation_error
  types:
  - <xref:<xref:"ApiError">>
- description: 'Multi-tenant application client id to access key vault in a

    different tenant. Setting the value to ''None'' will clear the property.'
  name: federated_client_id
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.compute.types.EncryptionSetProperties.activeKey
  name: activeKey
  summary: The key vault key which is currently used by this disk encryption set.
  signature: 'activeKey: KeyForDiskEncryptionSet'
- uid: azure.mgmt.compute.types.EncryptionSetProperties.autoKeyRotationError
  name: autoKeyRotationError
  summary: 'The error that was encountered during auto-key rotation. If an error is
    present, then auto-key

    rotation will not be attempted until the error on this disk encryption set is
    fixed.'
  signature: 'autoKeyRotationError: ApiError'
- uid: azure.mgmt.compute.types.EncryptionSetProperties.encryptionType
  name: encryptionType
  summary: 'The type of key used to encrypt the data of the disk. Known values are:

    "EncryptionAtRestWithCustomerKey", "EncryptionAtRestWithPlatformAndCustomerKeys",
    and

    "ConfidentialVmEncryptedWithCustomerKey".'
  signature: 'encryptionType: str | DiskEncryptionSetType'
- uid: azure.mgmt.compute.types.EncryptionSetProperties.federatedClientId
  name: federatedClientId
  summary: 'Multi-tenant application client id to access key vault in a different
    tenant. Setting the value

    to ''None'' will clear the property.'
  signature: 'federatedClientId: str'
- uid: azure.mgmt.compute.types.EncryptionSetProperties.lastKeyRotationTimestamp
  name: lastKeyRotationTimestamp
  summary: The time when the active key of this disk encryption set was updated.
  signature: 'lastKeyRotationTimestamp: str'
- uid: azure.mgmt.compute.types.EncryptionSetProperties.previousKeys
  name: previousKeys
  summary: 'A readonly collection of key vault keys previously used by this disk encryption
    set while a key

    rotation is in progress. It will be empty if there is no ongoing key rotation.'
  signature: 'previousKeys: list[''KeyForDiskEncryptionSet'']'
- uid: azure.mgmt.compute.types.EncryptionSetProperties.provisioningState
  name: provisioningState
  summary: The disk encryption set provisioning state.
  signature: 'provisioningState: str'
- uid: azure.mgmt.compute.types.EncryptionSetProperties.rotationToLatestKeyVersionEnabled
  name: rotationToLatestKeyVersionEnabled
  summary: 'Set this flag to true to enable auto-updating of this disk encryption
    set to the latest key

    version.'
  signature: 'rotationToLatestKeyVersionEnabled: bool'
