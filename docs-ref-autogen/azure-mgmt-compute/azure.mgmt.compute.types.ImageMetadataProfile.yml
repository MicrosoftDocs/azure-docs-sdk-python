### YamlMime:PythonClass
uid: azure.mgmt.compute.types.ImageMetadataProfile
name: ImageMetadataProfile
fullName: azure.mgmt.compute.types.ImageMetadataProfile
module: azure.mgmt.compute.types
summary: Describes the metadata profile of an image.
constructor:
  syntax: ImageMetadataProfile()
variables:
- description: 'The type of metadata. Required. Known values are:

    "SecretsProvisioningImageMetadata" and "UserProvidedSecretsProvisioningMetadata".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MetadataType">]
- description: 'The list of public metadata key-value pairs. Contains non-sensitive

    image capability metadata such as supported OS, component names, and versions.
    No secret

    material is emitted in this list.'
  name: publicMetadataList
  types:
  - <xref:list>[<xref:"MetadataKeyValue">]
- description: 'The list of internal metadata key-value pairs. Contains

    non-sensitive service-internal metadata for diagnostics and tracking. No secret
    material is

    emitted in this list.'
  name: internalMetadataList
  types:
  - <xref:list>[<xref:"MetadataKeyValue">]
attributes:
- uid: azure.mgmt.compute.types.ImageMetadataProfile.internalMetadataList
  name: internalMetadataList
  summary: 'The list of internal metadata key-value pairs. Contains non-sensitive
    service-internal metadata

    for diagnostics and tracking. No secret material is emitted in this list.'
  signature: 'internalMetadataList: list[''MetadataKeyValue'']'
- uid: azure.mgmt.compute.types.ImageMetadataProfile.publicMetadataList
  name: publicMetadataList
  summary: 'The list of public metadata key-value pairs. Contains non-sensitive image
    capability metadata

    such as supported OS, component names, and versions. No secret material is emitted
    in this

    list.'
  signature: 'publicMetadataList: list[''MetadataKeyValue'']'
- uid: azure.mgmt.compute.types.ImageMetadataProfile.type
  name: type
  summary: '"SecretsProvisioningImageMetadata" and

    "UserProvidedSecretsProvisioningMetadata".'
  signature: 'type: Required[str | MetadataType]'
