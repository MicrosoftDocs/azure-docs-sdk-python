### YamlMime:PythonClass
uid: azure.mgmt.compute.types.UpgradePolicy
name: UpgradePolicy
fullName: azure.mgmt.compute.types.UpgradePolicy
module: azure.mgmt.compute.types
summary: Describes an upgrade policy - automatic, manual, or rolling.
constructor:
  syntax: UpgradePolicy()
variables:
- description: 'Specifies the mode of an upgrade to virtual machines in the scale
    set.<br /><br />

    Possible values are:<br /><br /> **Manual** - You  control the application of
    updates to

    virtual machines in the scale set. You do this by using the manualUpgrade action.<br
    /><br />

    **Automatic** - All virtual machines in the scale set are  automatically updated
    at the same

    time. Known values are: "Automatic", "Manual", and "Rolling".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UpgradeMode">]
- description: 'The configuration parameters used while performing a rolling

    upgrade.'
  name: rollingUpgradePolicy
  types:
  - <xref:<xref:"RollingUpgradePolicy">>
- description: 'Configuration parameters used for performing automatic OS

    Upgrade.'
  name: automaticOSUpgradePolicy
  types:
  - <xref:<xref:"AutomaticOSUpgradePolicy">>
attributes:
- uid: azure.mgmt.compute.types.UpgradePolicy.automaticOSUpgradePolicy
  name: automaticOSUpgradePolicy
  summary: Configuration parameters used for performing automatic OS Upgrade.
  signature: 'automaticOSUpgradePolicy: AutomaticOSUpgradePolicy'
- uid: azure.mgmt.compute.types.UpgradePolicy.mode
  name: mode
  summary: 'Specifies the mode of an upgrade to virtual machines in the scale set.<br
    /><br /> Possible

    values are:<br /><br /> **Manual** - You  control the application of updates to
    virtual

    machines in the scale set. You do this by using the manualUpgrade action.<br /><br
    />

    **Automatic** - All virtual machines in the scale set are  automatically updated
    at the same

    time. Known values are: "Automatic", "Manual", and "Rolling".'
  signature: 'mode: str | UpgradeMode'
- uid: azure.mgmt.compute.types.UpgradePolicy.rollingUpgradePolicy
  name: rollingUpgradePolicy
  summary: The configuration parameters used while performing a rolling upgrade.
  signature: 'rollingUpgradePolicy: RollingUpgradePolicy'
