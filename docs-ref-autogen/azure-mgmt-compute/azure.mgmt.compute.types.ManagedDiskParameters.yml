### YamlMime:PythonClass
uid: azure.mgmt.compute.types.ManagedDiskParameters
name: ManagedDiskParameters
fullName: azure.mgmt.compute.types.ManagedDiskParameters
module: azure.mgmt.compute.types
summary: The parameters of a managed disk.
constructor:
  syntax: ManagedDiskParameters()
variables:
- description: Resource Id.
  name: id
  types:
  - <xref:str>
- description: 'Specifies the storage account type for the managed disk. NOTE:

    UltraSSD_LRS can only be used with data disks, it cannot be used with OS Disk.
    Known values

    are: "Standard_LRS", "Premium_LRS", "StandardSSD_LRS", "UltraSSD_LRS", "Premium_ZRS",

    "StandardSSD_ZRS", and "PremiumV2_LRS".'
  name: storageAccountType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageAccountTypes">]
- description: 'Specifies the customer managed disk encryption set resource id for
    the

    managed disk.'
  name: diskEncryptionSet
  types:
  - <xref:<xref:"DiskEncryptionSetParameters">>
- description: Specifies the security profile for the managed disk.
  name: securityProfile
  types:
  - <xref:<xref:"VMDiskSecurityProfile">>
- description: 'Specifies additional properties for the managed disk that can

    be set at the time of implicit creation of the disk. This property is not captured
    for Restore

    Points.'
  name: additionalDiskProperties
  types:
  - <xref:<xref:"AdditionalDiskProperties">>
attributes:
- uid: azure.mgmt.compute.types.ManagedDiskParameters.additionalDiskProperties
  name: additionalDiskProperties
  summary: 'Specifies additional properties for the managed disk that can be set at
    the time of implicit

    creation of the disk. This property is not captured for Restore Points.'
  signature: 'additionalDiskProperties: AdditionalDiskProperties'
- uid: azure.mgmt.compute.types.ManagedDiskParameters.diskEncryptionSet
  name: diskEncryptionSet
  summary: Specifies the customer managed disk encryption set resource id for the
    managed disk.
  signature: 'diskEncryptionSet: DiskEncryptionSetParameters'
- uid: azure.mgmt.compute.types.ManagedDiskParameters.securityProfile
  name: securityProfile
  summary: Specifies the security profile for the managed disk.
  signature: 'securityProfile: VMDiskSecurityProfile'
- uid: azure.mgmt.compute.types.ManagedDiskParameters.storageAccountType
  name: storageAccountType
  summary: 'UltraSSD_LRS can only be used

    with data disks, it cannot be used with OS Disk. Known values are: "Standard_LRS",

    "Premium_LRS", "StandardSSD_LRS", "UltraSSD_LRS", "Premium_ZRS", "StandardSSD_ZRS",

    and "PremiumV2_LRS".'
  signature: 'storageAccountType: str | StorageAccountTypes'
- uid: azure.mgmt.compute.types.ManagedDiskParameters.id
  name: id
  signature: 'id: str'
