### YamlMime:PythonClass
uid: azure.mgmt.compute.types.SkuProfile
name: SkuProfile
fullName: azure.mgmt.compute.types.SkuProfile
module: azure.mgmt.compute.types
summary: 'Specifies the sku profile for the virtual machine scale set. With this property
  the customer is

  able to specify a list of VM sizes and an allocation strategy.'
constructor:
  syntax: SkuProfile()
variables:
- description: Specifies the VM sizes for the virtual machine scale set.
  name: vmSizes
  types:
  - <xref:list>[<xref:"SkuProfileVMSize">]
- description: 'Specifies the allocation strategy for the virtual machine scale set

    based on which the VMs will be allocated. Known values are: "LowestPrice", "CapacityOptimized",

    and "Prioritized".'
  name: allocationStrategy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AllocationStrategy">]
- description: 'Specifies the policy that controls whether the platform may

    automatically migrate scale set instances to a different VM size from the SKU
    profile depending

    on platform demands. When omitted, automatic SKU migration is disabled.'
  name: automaticSkuMigrationPolicy
  types:
  - <xref:<xref:"AutomaticSkuMigrationPolicy">>
attributes:
- uid: azure.mgmt.compute.types.SkuProfile.allocationStrategy
  name: allocationStrategy
  summary: 'Specifies the allocation strategy for the virtual machine scale set based
    on which the VMs will

    be allocated. Known values are: "LowestPrice", "CapacityOptimized", and "Prioritized".'
  signature: 'allocationStrategy: str | AllocationStrategy'
- uid: azure.mgmt.compute.types.SkuProfile.automaticSkuMigrationPolicy
  name: automaticSkuMigrationPolicy
  summary: 'Specifies the policy that controls whether the platform may automatically
    migrate scale set

    instances to a different VM size from the SKU profile depending on platform demands.
    When

    omitted, automatic SKU migration is disabled.'
  signature: 'automaticSkuMigrationPolicy: AutomaticSkuMigrationPolicy'
- uid: azure.mgmt.compute.types.SkuProfile.vmSizes
  name: vmSizes
  summary: Specifies the VM sizes for the virtual machine scale set.
  signature: 'vmSizes: list[''SkuProfileVMSize'']'
