    image version is unusable but can still be recovered if required. After this period
    elapses,

    the gallery image version is permanently (hard) deleted.'
  signature: 'grace_period_in_days: int | None'
- uid: azure.mgmt.compute.models.SoftDeletePolicy.is_soft_delete_enabled
  name: is_soft_delete_enabled
  summary: 'Enables soft-deletion for resources in this gallery, allowing them to
    be recovered within

    retention time.'
  signature: 'is_soft_delete_enabled: bool | None'
- uid: azure.mgmt.compute.models.SoftDeletePolicy.retention_period_in_days
