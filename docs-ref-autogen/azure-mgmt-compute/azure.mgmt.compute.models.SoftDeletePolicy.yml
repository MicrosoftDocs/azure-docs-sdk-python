### YamlMime:PythonClass
uid: azure.mgmt.compute.models.SoftDeletePolicy
name: SoftDeletePolicy
fullName: azure.mgmt.compute.models.SoftDeletePolicy
module: azure.mgmt.compute.models
summary: Contains information about the soft deletion policy of the gallery.
constructor:
  syntax: 'SoftDeletePolicy(*args: Any, **kwargs: Any)'
variables:
- description: 'Enables soft-deletion for resources in this gallery, allowing

    them to be recovered within retention time.'
  name: is_soft_delete_enabled
  types:
  - <xref:bool>
- description: 'The retention period in days for a soft-deleted resource. After

    this period elapses, the soft-deleted gallery image version transitions to a simulated

    hard-deleted state.'
  name: retention_period_in_days
  types:
  - <xref:int>
- description: 'The grace period in days for a simulated hard-deleted resource.

    During this period the gallery image version is unusable but can still be recovered
    if

    required. After this period elapses, the gallery image version is permanently
    (hard) deleted.'
  name: grace_period_in_days
  types:
  - <xref:int>
attributes:
