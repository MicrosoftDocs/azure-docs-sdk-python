### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetStorageProfile
name: VirtualMachineScaleSetStorageProfile
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetStorageProfile
module: azure.mgmt.compute.types
summary: Describes a virtual machine scale set storage profile.
constructor:
  syntax: VirtualMachineScaleSetStorageProfile()
variables:
- description: 'Specifies information about the image to use. You can specify information

    about platform images, marketplace images, or virtual machine images. This element
    is required

    when you want to use a platform image, marketplace image, or virtual machine image,
    but is not

    used in other creation operations.'
  name: imageReference
  types:
  - <xref:<xref:"ImageReference">>
- description: 'Specifies information about the operating system disk used by the
    virtual

    machines in the scale set. For more information about disks, see [About disks
    and VHDs for

    Azure virtual machines](https://docs.microsoft.com/azure/virtual-machines/managed-disks-overview).'
  name: osDisk
  types:
  - <xref:<xref:"VirtualMachineScaleSetOSDisk">>
- description: 'Specifies the parameters that are used to add data disks to the virtual

    machines in the scale set. For more information about disks, see [About disks
    and VHDs for

    Azure virtual machines](https://docs.microsoft.com/azure/virtual-machines/managed-disks-overview).'
  name: dataDisks
  types:
  - <xref:list>[<xref:"VirtualMachineScaleSetDataDisk">]
- description: 'Specifies the disk controller type configured for the virtual

    machines in the scale set. Minimum api-version: 2022-08-01. Known values are:
    "SCSI" and

    "NVMe".'
  name: diskControllerType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskControllerTypes">]
- description: 'Specifies the Disk API version used when applying

    additionalDiskProperties to managed disks. The value must be in the format YYYY-MM-DD
    (e.g.,

    "2026-03-02"). Known values are: "2025-01-02" and "2026-03-02".'
  name: diskApiVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskApiVersion">]
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetStorageProfile.dataDisks
  name: dataDisks
  summary: 'Specifies the parameters that are used to add data disks to the virtual
    machines in the scale

    set. For more information about disks, see [About disks and VHDs for Azure virtual
    machines](https://docs.microsoft.com/azure/virtual-machines/managed-disks-overview).'
  signature: 'dataDisks: list[''VirtualMachineScaleSetDataDisk'']'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetStorageProfile.diskApiVersion
  name: diskApiVersion
  summary: 'Specifies the Disk API version used when applying additionalDiskProperties
    to managed disks.

    The value must be in the format YYYY-MM-DD (e.g., "2026-03-02"). Known values
    are:

    "2025-01-02" and "2026-03-02".'
  signature: 'diskApiVersion: str | DiskApiVersion'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetStorageProfile.diskControllerType
  name: diskControllerType
  summary: 'Specifies the disk controller type configured for the virtual machines
    in the scale set.

    Minimum api-version: 2022-08-01. Known values are: "SCSI" and "NVMe".'
  signature: 'diskControllerType: str | DiskControllerTypes'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetStorageProfile.imageReference
  name: imageReference
  summary: 'Specifies information about the image to use. You can specify information
    about platform

    images, marketplace images, or virtual machine images. This element is required
    when you want

    to use a platform image, marketplace image, or virtual machine image, but is not
    used in other

    creation operations.'
  signature: 'imageReference: ImageReference'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetStorageProfile.osDisk
  name: osDisk
  summary: 'Specifies information about the operating system disk used by the virtual
    machines in the scale

    set. For more information about disks, see [About disks and VHDs for Azure virtual
    machines](https://docs.microsoft.com/azure/virtual-machines/managed-disks-overview).'
  signature: 'osDisk: VirtualMachineScaleSetOSDisk'
