### YamlMime:PythonClass
uid: azure.mgmt.compute.types.DedicatedHostProperties
name: DedicatedHostProperties
fullName: azure.mgmt.compute.types.DedicatedHostProperties
module: azure.mgmt.compute.types
summary: Properties of the dedicated host.
constructor:
  syntax: DedicatedHostProperties()
variables:
- description: Fault domain of the dedicated host within a dedicated host group.
  name: platform_fault_domain
  types:
  - <xref:int>
- description: 'Specifies whether the dedicated host should be replaced

    automatically in case of a failure. The value is defaulted to ''true'' when not
    provided.'
  name: auto_replace_on_failure
  types:
  - <xref:bool>
- description: 'A unique id generated and assigned to the dedicated host by the platform.
    Does

    not change throughout the lifetime of the host.'
  name: host_id
  types:
  - <xref:str>
- description: A list of references to all virtual machines in the Dedicated Host.
  name: virtual_machines
  types:
  - <xref:list>[<xref:"SubResourceReadOnly">]
- description: 'Specifies the software license type that will be applied to the VMs

    deployed on the dedicated host. Possible values are: **None,** **Windows_Server_Hybrid,**

    **Windows_Server_Perpetual.** The default value is: **None.**. Known values are:
    "None",

    "Windows_Server_Hybrid", and "Windows_Server_Perpetual".'
  name: license_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DedicatedHostLicenseTypes">]
- description: The date when the host was first provisioned.
  name: provisioning_time
  types:
  - <xref:str>
- description: The provisioning state, which only appears in the response.
  name: provisioning_state
  types:
  - <xref:str>
- description: The dedicated host instance view.
  name: instance_view
  types:
  - <xref:<xref:"DedicatedHostInstanceView">>
- description: 'Specifies the time at which the Dedicated Host resource was created.

    Minimum api-version: 2021-11-01.'
  name: time_created
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.compute.types.DedicatedHostProperties.autoReplaceOnFailure
  name: autoReplaceOnFailure
  summary: 'Specifies whether the dedicated host should be replaced automatically
    in case of a failure. The

    value is defaulted to ''true'' when not provided.'
  signature: 'autoReplaceOnFailure: bool'
- uid: azure.mgmt.compute.types.DedicatedHostProperties.hostId
  name: hostId
  summary: 'A unique id generated and assigned to the dedicated host by the platform.
    Does not change

    throughout the lifetime of the host.'
  signature: 'hostId: str'
- uid: azure.mgmt.compute.types.DedicatedHostProperties.instanceView
  name: instanceView
  summary: The dedicated host instance view.
  signature: 'instanceView: DedicatedHostInstanceView'
- uid: azure.mgmt.compute.types.DedicatedHostProperties.licenseType
  name: licenseType
  summary: 'Specifies the software license type that will be applied to the VMs deployed
    on the dedicated

    host. Possible values are: **None,** **Windows_Server_Hybrid,** **Windows_Server_Perpetual.**

    The default value is: **None.**. Known values are: "None", "Windows_Server_Hybrid",
    and

    "Windows_Server_Perpetual".'
  signature: 'licenseType: str | DedicatedHostLicenseTypes'
- uid: azure.mgmt.compute.types.DedicatedHostProperties.platformFaultDomain
  name: platformFaultDomain
  summary: Fault domain of the dedicated host within a dedicated host group.
  signature: 'platformFaultDomain: int'
- uid: azure.mgmt.compute.types.DedicatedHostProperties.provisioningState
  name: provisioningState
  summary: The provisioning state, which only appears in the response.
  signature: 'provisioningState: str'
- uid: azure.mgmt.compute.types.DedicatedHostProperties.provisioningTime
  name: provisioningTime
  summary: The date when the host was first provisioned.
  signature: 'provisioningTime: str'
- uid: azure.mgmt.compute.types.DedicatedHostProperties.timeCreated
  name: timeCreated
  summary: 'Specifies the time at which the Dedicated Host resource was created. Minimum
    api-version:

    2021-11-01.'
  signature: 'timeCreated: str'
- uid: azure.mgmt.compute.types.DedicatedHostProperties.virtualMachines
  name: virtualMachines
  summary: A list of references to all virtual machines in the Dedicated Host.
  signature: 'virtualMachines: list[''SubResourceReadOnly'']'
