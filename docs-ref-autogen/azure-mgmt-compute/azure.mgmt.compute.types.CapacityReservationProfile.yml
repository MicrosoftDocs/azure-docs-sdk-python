### YamlMime:PythonClass
uid: azure.mgmt.compute.types.CapacityReservationProfile
name: CapacityReservationProfile
fullName: azure.mgmt.compute.types.CapacityReservationProfile
module: azure.mgmt.compute.types
summary: The parameters of a capacity reservation Profile.
constructor:
  syntax: CapacityReservationProfile()
variables:
- description: 'Specifies the capacity reservation group resource id that

    should be used for allocating the virtual machine or scaleset vm instances provided
    enough

    capacity has been reserved. Please refer to [https://aka.ms/CapacityReservation](https://aka.ms/CapacityReservation)
    for more details.'
  name: capacityReservationGroup
  types:
  - <xref:<xref:"SubResource">>
- description: 'Specifies whether the virtual machine is explicitly

    opted out from being associated with any capacity reservation. When set to true,
    the virtual

    machine will not be allowed to implicitly or explicitly associate with any type
    of capacity

    reservation and will consume capacity from the publicly available capacity. Minimum

    api-version: 2026-04-01.'
  name: disableCapacityReservationAssignment
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.compute.types.CapacityReservationProfile.capacityReservationGroup
  name: capacityReservationGroup
  summary: 'Specifies the capacity reservation group resource id that should be used
    for allocating the

    virtual machine or scaleset vm instances provided enough capacity has been reserved.
    Please

    refer to [https://aka.ms/CapacityReservation](https://aka.ms/CapacityReservation)
    for more

    details.'
  signature: 'capacityReservationGroup: SubResource'
- uid: azure.mgmt.compute.types.CapacityReservationProfile.disableCapacityReservationAssignment
  name: disableCapacityReservationAssignment
  summary: 'Specifies whether the virtual machine is explicitly opted out from being
    associated with any

    capacity reservation. When set to true, the virtual machine will not be allowed
    to implicitly

    or explicitly associate with any type of capacity reservation and will consume
    capacity from

    the publicly available capacity. Minimum api-version: 2026-04-01.'
  signature: 'disableCapacityReservationAssignment: bool'
