### YamlMime:PythonClass
uid: azure.mgmt.compute.types.WindowsParameters
name: WindowsParameters
fullName: azure.mgmt.compute.types.WindowsParameters
module: azure.mgmt.compute.types
summary: Input for InstallPatches on a Windows VM, as directly received by the API.
constructor:
  syntax: WindowsParameters()
variables:
- description: 'The update classifications to select when installing patches

    for Windows.'
  name: classificationsToInclude
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"VMGuestPatchClassificationWindows">]]
- description: Kbs to include in the patch operation.
  name: kbNumbersToInclude
  types:
  - <xref:list>[<xref:str>]
- description: Kbs to exclude in the patch operation.
  name: kbNumbersToExclude
  types:
  - <xref:list>[<xref:str>]
- description: 'Filters out Kbs that don''t have an InstallationRebootBehavior

    of ''NeverReboots'' when this is set to true.'
  name: excludeKbsRequiringReboot
  types:
  - <xref:bool>
- description: 'This is used to install patches that were published on or before

    this given max published date.'
  name: maxPatchPublishDate
  types:
  - <xref:str>
- description: 'This is used to include patches that match the given patch name

    masks. Alphanumeric strings and wildcard expressions consisting of * and ? are
    only supported

    as input values in the list. Null, empty and only whitespaces strings as inputs
    values are not

    supported.'
  name: patchNameMasksToInclude
  types:
  - <xref:list>[<xref:str>]
- description: 'This is used to exclude patches that match the given patch name

    masks. Alphanumeric strings and wildcard expressions consisting of * and ? are
    only supported

    as input values in the list. Null, empty and only whitespaces strings as inputs
    values are not

    supported.'
  name: patchNameMasksToExclude
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.compute.types.WindowsParameters.classificationsToInclude
  name: classificationsToInclude
  summary: The update classifications to select when installing patches for Windows.
  signature: 'classificationsToInclude: list[typing.Union[str, ForwardRef(''VMGuestPatchClassificationWindows'')]]'
- uid: azure.mgmt.compute.types.WindowsParameters.excludeKbsRequiringReboot
  name: excludeKbsRequiringReboot
  summary: 'Filters out Kbs that don''t have an InstallationRebootBehavior of ''NeverReboots''
    when this is

    set to true.'
  signature: 'excludeKbsRequiringReboot: bool'
- uid: azure.mgmt.compute.types.WindowsParameters.kbNumbersToExclude
  name: kbNumbersToExclude
  summary: Kbs to exclude in the patch operation.
  signature: 'kbNumbersToExclude: list[str]'
- uid: azure.mgmt.compute.types.WindowsParameters.kbNumbersToInclude
  name: kbNumbersToInclude
  summary: Kbs to include in the patch operation.
  signature: 'kbNumbersToInclude: list[str]'
- uid: azure.mgmt.compute.types.WindowsParameters.maxPatchPublishDate
  name: maxPatchPublishDate
  summary: This is used to install patches that were published on or before this given
    max published date.
  signature: 'maxPatchPublishDate: str'
- uid: azure.mgmt.compute.types.WindowsParameters.patchNameMasksToExclude
  name: patchNameMasksToExclude
  summary: 'This is used to exclude patches that match the given patch name masks.
    Alphanumeric strings and

    wildcard expressions consisting of * and ? are only supported as input values
    in the list.

    Null, empty and only whitespaces strings as inputs values are not supported.'
  signature: 'patchNameMasksToExclude: list[str]'
- uid: azure.mgmt.compute.types.WindowsParameters.patchNameMasksToInclude
  name: patchNameMasksToInclude
  summary: 'This is used to include patches that match the given patch name masks.
    Alphanumeric strings and

    wildcard expressions consisting of * and ? are only supported as input values
    in the list.

    Null, empty and only whitespaces strings as inputs values are not supported.'
  signature: 'patchNameMasksToInclude: list[str]'
