### YamlMime:PythonClass
uid: azure.mgmt.compute.types.LastPatchInstallationSummary
name: LastPatchInstallationSummary
fullName: azure.mgmt.compute.types.LastPatchInstallationSummary
module: azure.mgmt.compute.types
summary: Describes the properties of the last installed patch summary.
constructor:
  syntax: LastPatchInstallationSummary()
variables:
- description: 'The overall success or failure status of the operation. It remains
    "InProgress"

    until the operation completes. At that point it will become "Unknown", "Failed",
    "Succeeded",

    or "CompletedWithWarnings.". Known values are: "Unknown", "InProgress", "Failed",
    "Succeeded",

    and "CompletedWithWarnings".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PatchOperationStatus">]
- description: 'The activity ID of the operation that produced this result. It is

    used to correlate across CRP and extension logs.'
  name: installationActivityId
  types:
  - <xref:str>
- description: 'Describes whether the operation ran out of time before it

    completed all its intended actions.'
  name: maintenanceWindowExceeded
  types:
  - <xref:bool>
- description: 'The number of all available patches but not going to be installed

    because it didn''t match a classification or inclusion list entry.'
  name: notSelectedPatchCount
  types:
  - <xref:int>
- description: 'The number of all available patches but excluded explicitly by a

    customer-specified exclusion list match.'
  name: excludedPatchCount
  types:
  - <xref:int>
- description: 'The number of all available patches expected to be installed over
    the

    course of the patch installation operation.'
  name: pendingPatchCount
  types:
  - <xref:int>
- description: The count of patches that successfully installed.
  name: installedPatchCount
  types:
  - <xref:int>
- description: The count of patches that failed installation.
  name: failedPatchCount
  types:
  - <xref:int>
- description: The UTC timestamp when the operation began.
  name: startTime
  types:
  - <xref:str>
- description: The UTC timestamp when the operation began.
  name: lastModifiedTime
  types:
  - <xref:str>
- description: 'The errors that were encountered during execution of the operation.
    The details

    array contains the list of them.'
  name: error
  types:
  - <xref:<xref:"ApiError">>
