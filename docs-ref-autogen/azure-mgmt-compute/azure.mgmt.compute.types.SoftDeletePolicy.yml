### YamlMime:PythonClass
uid: azure.mgmt.compute.types.SoftDeletePolicy
name: SoftDeletePolicy
fullName: azure.mgmt.compute.types.SoftDeletePolicy
module: azure.mgmt.compute.types
summary: Contains information about the soft deletion policy of the gallery.
constructor:
  syntax: SoftDeletePolicy()
variables:
- description: 'Enables soft-deletion for resources in this gallery, allowing them

    to be recovered within retention time.'
  name: isSoftDeleteEnabled
  types:
  - <xref:bool>
- description: 'The retention period in days for a soft-deleted resource. After

    this period elapses, the soft-deleted gallery image version transitions to a simulated

    hard-deleted state.'
  name: retentionPeriodInDays
  types:
  - <xref:int>
- description: 'The grace period in days for a simulated hard-deleted resource. During

    this period the gallery image version is unusable but can still be recovered if
    required. After

    this period elapses, the gallery image version is permanently (hard) deleted.'
  name: gracePeriodInDays
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.compute.types.SoftDeletePolicy.gracePeriodInDays
  name: gracePeriodInDays
  summary: 'The grace period in days for a simulated hard-deleted resource. During
    this period the gallery

    image version is unusable but can still be recovered if required. After this period
    elapses,

    the gallery image version is permanently (hard) deleted.'
  signature: 'gracePeriodInDays: int'
- uid: azure.mgmt.compute.types.SoftDeletePolicy.isSoftDeleteEnabled
  name: isSoftDeleteEnabled
  summary: 'Enables soft-deletion for resources in this gallery, allowing them to
    be recovered within

    retention time.'
  signature: 'isSoftDeleteEnabled: bool'
- uid: azure.mgmt.compute.types.SoftDeletePolicy.retentionPeriodInDays
  name: retentionPeriodInDays
  summary: 'The retention period in days for a soft-deleted resource. After this period
    elapses, the

    soft-deleted gallery image version transitions to a simulated hard-deleted state.'
  signature: 'retentionPeriodInDays: int'
