    and "DenyAll".'
  signature: 'networkAccessPolicy: str | NetworkAccessPolicy'
- uid: azure.mgmt.compute.types.SnapshotProperties.osType
  name: osType
  summary: '"Windows" and "Linux".'
  signature: 'osType: str | OperatingSystemTypes'
- uid: azure.mgmt.compute.types.SnapshotProperties.provisioningState
  name: provisioningState
  summary: The disk provisioning state.
  signature: 'provisioningState: str'
- uid: azure.mgmt.compute.types.SnapshotProperties.publicNetworkAccess
  name: publicNetworkAccess
  summary: '"Enabled" and "Disabled".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.compute.types.SnapshotProperties.purchasePlan
  name: purchasePlan
  summary: 'Purchase plan information for the image from which the source disk for
