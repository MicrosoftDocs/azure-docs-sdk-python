    are: "V1" and "V2".'
  signature: 'hyperVGeneration: str | HyperVGeneration'
- uid: azure.mgmt.compute.types.SnapshotProperties.immutabilityPolicy
  name: immutabilityPolicy
  summary: 'The immutability policy currently applied to this snapshot. Present only
