### YamlMime:PythonClass
uid: azure.mgmt.compute.types.PriorityMixPolicy
name: PriorityMixPolicy
fullName: azure.mgmt.compute.types.PriorityMixPolicy
module: azure.mgmt.compute.types
summary: 'Specifies the target splits for Spot and Regular priority VMs within a scale
  set with flexible

  orchestration mode. With this property the customer is able to specify the base
  number of

  regular priority VMs created as the VMSS flex instance scales out and the split
  between Spot

  and Regular priority VMs after this base target has been reached.'
constructor:
  syntax: PriorityMixPolicy()
variables:
- description: 'The base number of regular priority VMs that will be created

    in this scale set as it scales out.'
  name: base_regular_priority_count
  types:
  - <xref:int>
- description: 'The percentage of VM instances, after the base

    regular priority count has been reached, that are expected to use regular priority.'
  name: regular_priority_percentage_above_base
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.compute.types.PriorityMixPolicy.baseRegularPriorityCount
  name: baseRegularPriorityCount
  summary: 'The base number of regular priority VMs that will be created in this scale
    set as it scales

    out.'
  signature: 'baseRegularPriorityCount: int'
- uid: azure.mgmt.compute.types.PriorityMixPolicy.regularPriorityPercentageAboveBase
  name: regularPriorityPercentageAboveBase
  summary: 'The percentage of VM instances, after the base regular priority count
    has been reached, that

    are expected to use regular priority.'
  signature: 'regularPriorityPercentageAboveBase: int'
