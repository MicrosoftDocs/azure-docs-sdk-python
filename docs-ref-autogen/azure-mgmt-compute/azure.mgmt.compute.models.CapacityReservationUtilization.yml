### YamlMime:PythonClass
uid: azure.mgmt.compute.models.CapacityReservationUtilization
name: CapacityReservationUtilization
fullName: azure.mgmt.compute.models.CapacityReservationUtilization
module: azure.mgmt.compute.models
summary: Represents the capacity reservation utilization in terms of resources allocated.
constructor:
  syntax: 'CapacityReservationUtilization(*args: Any, **kwargs: Any)'
variables:
- description: 'The value provides the current capacity of the VM size which was

    reserved successfully and for which the customer is getting billed. Minimum api-version:

    2022-08-01.'
  name: current_capacity
  types:
  - <xref:int>
- description: 'A list of all virtual machines resource ids allocated against

    the capacity reservation.'
  name: virtual_machines_allocated
  types:
  - <xref:list>[<xref:azure.mgmt.compute.models.SubResourceReadOnly>]
- description: 'For open capacity reservations, this provides a map

    of the used reserved capacity count keyed by the subscription id (a GUID) that
    is consuming the

    capacity, i.e. each entry maps a consuming subscription id to the count of reserved
    capacity it

    is currently using. This is populated only for open capacity reservations and
    is not reported

    for targeted and block capacity reservations, which instead report allocation
    through

    virtualMachinesAllocated. Minimum api-version: 2026-04-01.'
  name: used_reserved_count_by_subscription
  types:
  - <xref:dict>[<xref:str>, <xref:int>]
attributes:
- uid: azure.mgmt.compute.models.CapacityReservationUtilization.current_capacity
  name: current_capacity
  summary: 'The value provides the current capacity of the VM size which was reserved
    successfully and for

    which the customer is getting billed. Minimum api-version: 2022-08-01.'
  signature: 'current_capacity: int | None'
- uid: azure.mgmt.compute.models.CapacityReservationUtilization.used_reserved_count_by_subscription
  name: used_reserved_count_by_subscription
  summary: 'For open capacity reservations, this provides a map of the used reserved
    capacity count keyed

    by the subscription id (a GUID) that is consuming the capacity, i.e. each entry
    maps a

    consuming subscription id to the count of reserved capacity it is currently using.
    This is

    populated only for open capacity reservations and is not reported for targeted
    and block

    capacity reservations, which instead report allocation through virtualMachinesAllocated.

    Minimum api-version: 2026-04-01.'
  signature: 'used_reserved_count_by_subscription: dict[str, int] | None'
- uid: azure.mgmt.compute.models.CapacityReservationUtilization.virtual_machines_allocated
  name: virtual_machines_allocated
  summary: A list of all virtual machines resource ids allocated against the capacity
    reservation.
  signature: 'virtual_machines_allocated: list[''_models.SubResourceReadOnly''] |
    None'
