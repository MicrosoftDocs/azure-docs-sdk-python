### YamlMime:PythonClass
uid: azure.mgmt.compute.types.BootDiagnosticsInstanceView
name: BootDiagnosticsInstanceView
fullName: azure.mgmt.compute.types.BootDiagnosticsInstanceView
module: azure.mgmt.compute.types
summary: The instance view of a virtual machine boot diagnostics.
constructor:
  syntax: BootDiagnosticsInstanceView()
variables:
- description: 'The console screenshot blob URI. **Note:** This will **not**

    be set if boot diagnostics is currently enabled with managed storage.'
  name: console_screenshot_blob_uri
  types:
  - <xref:str>
- description: 'The serial console log blob Uri. **Note:** This will **not**

    be set if boot diagnostics is currently enabled with managed storage.'
  name: serial_console_log_blob_uri
  types:
  - <xref:str>
- description: 'The boot diagnostics status information for the VM. **Note:** It will
    be set only

    if there are errors encountered in enabling boot diagnostics.'
  name: status
  types:
  - <xref:<xref:"InstanceViewStatus">>
attributes:
- uid: azure.mgmt.compute.types.BootDiagnosticsInstanceView.consoleScreenshotBlobUri
  name: consoleScreenshotBlobUri
  summary: '** This will **not** be set if boot diagnostics is

    currently enabled with managed storage.'
  signature: 'consoleScreenshotBlobUri: str'
- uid: azure.mgmt.compute.types.BootDiagnosticsInstanceView.serialConsoleLogBlobUri
  name: serialConsoleLogBlobUri
  summary: '** This will **not** be set if boot diagnostics is

    currently enabled with managed storage.'
  signature: 'serialConsoleLogBlobUri: str'
- uid: azure.mgmt.compute.types.BootDiagnosticsInstanceView.status
  name: status
  summary: '** It will be set only if there are

    errors encountered in enabling boot diagnostics.'
  signature: 'status: InstanceViewStatus'
