### YamlMime:PythonClass
uid: azure.mgmt.compute.types.AvailablePatchSummary
name: AvailablePatchSummary
fullName: azure.mgmt.compute.types.AvailablePatchSummary
module: azure.mgmt.compute.types
summary: Describes the properties of an virtual machine instance view for available
  patch summary.
constructor:
  syntax: AvailablePatchSummary()
variables:
- description: 'The overall success or failure status of the operation. It remains
    "InProgress"

    until the operation completes. At that point it will become "Unknown", "Failed",
    "Succeeded",

    or "CompletedWithWarnings.". Known values are: "Unknown", "InProgress", "Failed",
    "Succeeded",

    and "CompletedWithWarnings".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PatchOperationStatus">]
- description: 'The activity ID of the operation that produced this result. It is

    used to correlate across CRP and extension logs.'
  name: assessmentActivityId
  types:
  - <xref:str>
- description: 'The overall reboot status of the VM. It will be true when partially

    installed patches require a reboot to complete installation but the reboot has
    not yet

    occurred.'
  name: rebootPending
  types:
  - <xref:bool>
- description: 'The number of critical or security patches that have been

    detected as available and not yet installed.'
  name: criticalAndSecurityPatchCount
  types:
  - <xref:int>
- description: The number of all available patches excluding critical and security.
  name: otherPatchCount
  types:
  - <xref:int>
- description: The UTC timestamp when the operation began.
  name: startTime
  types:
  - <xref:str>
- description: The UTC timestamp when the operation began.
  name: lastModifiedTime
  types:
  - <xref:str>
- description: 'The errors that were encountered during execution of the operation.
    The details

    array contains the list of them.'
  name: error
  types:
  - <xref:<xref:"ApiError">>
attributes:
- uid: azure.mgmt.compute.types.AvailablePatchSummary.assessmentActivityId
  name: assessmentActivityId
  summary: 'The activity ID of the operation that produced this result. It is used
    to correlate across CRP

    and extension logs.'
  signature: 'assessmentActivityId: str'
- uid: azure.mgmt.compute.types.AvailablePatchSummary.criticalAndSecurityPatchCount
  name: criticalAndSecurityPatchCount
  summary: 'The number of critical or security patches that have been detected as
    available and not yet

    installed.'
  signature: 'criticalAndSecurityPatchCount: int'
- uid: azure.mgmt.compute.types.AvailablePatchSummary.error
  name: error
  summary: 'The errors that were encountered during execution of the operation. The
    details array contains

    the list of them.'
  signature: 'error: ApiError'
- uid: azure.mgmt.compute.types.AvailablePatchSummary.lastModifiedTime
  name: lastModifiedTime
  summary: The UTC timestamp when the operation began.
  signature: 'lastModifiedTime: str'
- uid: azure.mgmt.compute.types.AvailablePatchSummary.otherPatchCount
  name: otherPatchCount
  summary: The number of all available patches excluding critical and security.
  signature: 'otherPatchCount: int'
- uid: azure.mgmt.compute.types.AvailablePatchSummary.rebootPending
  name: rebootPending
  summary: 'The overall reboot status of the VM. It will be true when partially installed
    patches require a

    reboot to complete installation but the reboot has not yet occurred.'
  signature: 'rebootPending: bool'
- uid: azure.mgmt.compute.types.AvailablePatchSummary.startTime
  name: startTime
  summary: The UTC timestamp when the operation began.
  signature: 'startTime: str'
- uid: azure.mgmt.compute.types.AvailablePatchSummary.status
  name: status
  summary: 'The overall success or failure status of the operation. It remains "InProgress"
    until the

    operation completes. At that point it will become "Unknown", "Failed", "Succeeded",
    or

    "CompletedWithWarnings.". Known values are: "Unknown", "InProgress", "Failed",

    "Succeeded", and "CompletedWithWarnings".'
  signature: 'status: str | PatchOperationStatus'
