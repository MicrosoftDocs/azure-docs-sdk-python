### YamlMime:PythonClass
uid: azure.mgmt.compute.types.ImageOSDisk
name: ImageOSDisk
fullName: azure.mgmt.compute.types.ImageOSDisk
module: azure.mgmt.compute.types
summary: Describes an Operating System disk.
constructor:
  syntax: ImageOSDisk()
variables:
- description: The snapshot.
  name: snapshot
  types:
  - <xref:<xref:"SubResource">>
- description: The managedDisk.
  name: managed_disk
  types:
  - <xref:<xref:"SubResource">>
- description: The Virtual Hard Disk.
  name: blob_uri
  types:
  - <xref:str>
- description: 'Specifies the caching requirements. Possible values are: **None,**
    **ReadOnly,**

    **ReadWrite.** The default values are: **None for Standard storage. ReadOnly for
    Premium

    storage.**. Known values are: "None", "ReadOnly", and "ReadWrite".'
  name: caching
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CachingTypes">]
- description: 'Specifies the size of empty data disks in gigabytes. This element
    can be

    used to overwrite the name of the disk in a virtual machine image. This value
    cannot be larger

    than 1023 GB.'
  name: disk_size_gb
  types:
  - <xref:int>
- description: 'Specifies the storage account type for the managed disk. NOTE:

    UltraSSD_LRS can only be used with data disks, it cannot be used with OS Disk.
    Known values

    are: "Standard_LRS", "Premium_LRS", "StandardSSD_LRS", "UltraSSD_LRS", "Premium_ZRS",

    "StandardSSD_ZRS", and "PremiumV2_LRS".'
  name: storage_account_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageAccountTypes">]
- description: 'Specifies the customer managed disk encryption set resource id for

    the managed image disk.'
  name: disk_encryption_set
  types:
  - <xref:<xref:"DiskEncryptionSetParameters">>
- description: 'This property allows you to specify the type of the OS that is included
    in the

    disk if creating a VM from a custom image. Possible values are: **Windows,** **Linux.**.

    Required. Known values are: "Windows" and "Linux".'
  name: os_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperatingSystemTypes">]
- description: 'The OS State. For managed images, use Generalized. Required. Known
    values are:

    "Generalized" and "Specialized".'
  name: os_state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperatingSystemStateTypes">]
attributes:
- uid: azure.mgmt.compute.types.ImageOSDisk.osState
  name: osState
  summary: '"Generalized"

    and "Specialized".'
  signature: 'osState: Required[str | OperatingSystemStateTypes]'
- uid: azure.mgmt.compute.types.ImageOSDisk.osType
  name: osType
  summary: 'This property allows you to specify the type of the OS that is included
    in the disk if creating

    a VM from a custom image. Possible values are: **Windows,** **Linux.**. Required.
    Known values

    are: "Windows" and "Linux".'
  signature: 'osType: Required[str | OperatingSystemTypes]'
- uid: azure.mgmt.compute.types.ImageOSDisk.blobUri
  name: blobUri
  signature: 'blobUri: str'
- uid: azure.mgmt.compute.types.ImageOSDisk.caching
  name: caching
  signature: 'caching: str | CachingTypes'
- uid: azure.mgmt.compute.types.ImageOSDisk.diskEncryptionSet
  name: diskEncryptionSet
  signature: 'diskEncryptionSet: DiskEncryptionSetParameters'
- uid: azure.mgmt.compute.types.ImageOSDisk.diskSizeGB
  name: diskSizeGB
  signature: 'diskSizeGB: int'
- uid: azure.mgmt.compute.types.ImageOSDisk.managedDisk
  name: managedDisk
  signature: 'managedDisk: SubResource'
- uid: azure.mgmt.compute.types.ImageOSDisk.snapshot
  name: snapshot
  signature: 'snapshot: SubResource'
- uid: azure.mgmt.compute.types.ImageOSDisk.storageAccountType
  name: storageAccountType
  signature: 'storageAccountType: str | StorageAccountTypes'
