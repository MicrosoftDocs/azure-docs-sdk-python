### YamlMime:PythonClass
uid: azure.mgmt.compute.types.CapacityReservationGroupProperties
name: CapacityReservationGroupProperties
fullName: azure.mgmt.compute.types.CapacityReservationGroupProperties
module: azure.mgmt.compute.types
summary: capacity reservation group Properties.
constructor:
  syntax: CapacityReservationGroupProperties()
variables:
- description: 'A list of all capacity reservation resource ids that belong to

    capacity reservation group.'
  name: capacityReservations
  types:
  - <xref:list>[<xref:"SubResourceReadOnly">]
- description: 'A list of references to all virtual machines associated to the

    capacity reservation group.'
  name: virtualMachinesAssociated
  types:
  - <xref:list>[<xref:"SubResourceReadOnly">]
- description: 'The capacity reservation group instance view which has the list of
    instance

    views for all the capacity reservations that belong to the capacity reservation
    group.'
  name: instanceView
  types:
  - <xref:<xref:"CapacityReservationGroupInstanceView">>
- description: 'Specifies the settings to enable sharing across subscriptions for
    the

    capacity reservation group resource. The capacity reservation group resource can
    generally be

    shared across subscriptions belonging to a single Azure AAD tenant or across AAD
    tenants if

    there is a trust relationship established between the tenants.  Block capacity
    reservation does

    not support sharing across subscriptions. **Note:** Minimum api-version: 2023-09-01.
    Please

    refer to [https://aka.ms/computereservationsharing](https://aka.ms/computereservationsharing)

    for more details.'
  name: sharingProfile
  types:
  - <xref:<xref:"ResourceSharingProfile">>
- description: 'Indicates the type of capacity reservation. Allowed values are ''Block''

    for block capacity reservations that enable a VM to consume capacity only from
    this capacity

    block when it is associated using a capacity reservation group, ''Targeted'' for
    reservations

    that enable a VM to consume capacity from an explicitly associated capacity reservation
    group

    and fall back to the publicly available capacity if the reservation is full, and
    ''Open'' for

    reservations that a VM consumes when it is eligible from an implicitly associated
    capacity

    reservation group with the matching VM size and zone without associating that
    capacity

    reservation group and fall back to the publicly available capacity if the reservation
    is full.

    The reservation type is immutable and cannot be changed after the capacity reservation
    group is

    created. Known values are: "Targeted", "Block", and "Open".'
  name: reservationType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReservationType">]
attributes:
