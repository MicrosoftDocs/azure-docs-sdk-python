### YamlMime:PythonClass
uid: azure.mgmt.compute.types.CapacityReservationGroupProperties
name: CapacityReservationGroupProperties
fullName: azure.mgmt.compute.types.CapacityReservationGroupProperties
module: azure.mgmt.compute.types
summary: capacity reservation group Properties.
constructor:
  syntax: CapacityReservationGroupProperties()
variables:
- description: 'A list of all capacity reservation resource ids that belong to

    capacity reservation group.'
  name: capacity_reservations
  types:
  - <xref:list>[<xref:"SubResourceReadOnly">]
- description: 'A list of references to all virtual machines associated to

    the capacity reservation group.'
  name: virtual_machines_associated
  types:
  - <xref:list>[<xref:"SubResourceReadOnly">]
- description: 'The capacity reservation group instance view which has the list of

    instance views for all the capacity reservations that belong to the capacity reservation
    group.'
  name: instance_view
  types:
  - <xref:<xref:"CapacityReservationGroupInstanceView">>
- description: 'Specifies the settings to enable sharing across subscriptions for
    the

    capacity reservation group resource. The capacity reservation group resource can
    generally be

    shared across subscriptions belonging to a single Azure AAD tenant or across AAD
    tenants if

    there is a trust relationship established between the tenants.  Block capacity
    reservation does

    not support sharing across subscriptions. **Note:** Minimum api-version: 2023-09-01.
    Please

    refer to [https://aka.ms/computereservationsharing](https://aka.ms/computereservationsharing)

    for more details.'
  name: sharing_profile
  types:
  - <xref:<xref:"ResourceSharingProfile">>
- description: 'Indicates the type of capacity reservation. Allowed values are ''Block''

    for block capacity reservations and ''Targeted'' for reservations that enable
    a VM to consume a

    specific capacity reservation when a capacity reservation group is provided. The
    reservation

    type is immutable and cannot be changed after it is assigned. Known values are:
    "Targeted" and

    "Block".'
  name: reservation_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReservationType">]
attributes:
- uid: azure.mgmt.compute.types.CapacityReservationGroupProperties.capacityReservations
  name: capacityReservations
  summary: A list of all capacity reservation resource ids that belong to capacity
    reservation group.
  signature: 'capacityReservations: list[''SubResourceReadOnly'']'
- uid: azure.mgmt.compute.types.CapacityReservationGroupProperties.instanceView
  name: instanceView
  summary: 'The capacity reservation group instance view which has the list of instance
    views for all the

    capacity reservations that belong to the capacity reservation group.'
  signature: 'instanceView: CapacityReservationGroupInstanceView'
- uid: azure.mgmt.compute.types.CapacityReservationGroupProperties.reservationType
  name: reservationType
  summary: 'Indicates the type of capacity reservation. Allowed values are ''Block''
    for block capacity

    reservations and ''Targeted'' for reservations that enable a VM to consume a specific
    capacity

    reservation when a capacity reservation group is provided. The reservation type
    is immutable

    and cannot be changed after it is assigned. Known values are: "Targeted" and "Block".'
  signature: 'reservationType: str | ReservationType'
- uid: azure.mgmt.compute.types.CapacityReservationGroupProperties.sharingProfile
  name: sharingProfile
  summary: 'Specifies the settings to enable sharing across subscriptions for the
    capacity reservation

    group resource. The capacity reservation group resource can generally be shared
    across

    subscriptions belonging to a single Azure AAD tenant or across AAD tenants if
    there is a trust

    relationship established between the tenants.  Block capacity reservation does
    not support

    sharing across subscriptions. **Note:** Minimum api-version: 2023-09-01. Please
    refer to

    [https://aka.ms/computereservationsharing](https://aka.ms/computereservationsharing)
    for more

    details.'
  signature: 'sharingProfile: ResourceSharingProfile'
- uid: azure.mgmt.compute.types.CapacityReservationGroupProperties.virtualMachinesAssociated
  name: virtualMachinesAssociated
  summary: A list of references to all virtual machines associated to the capacity
    reservation group.
  signature: 'virtualMachinesAssociated: list[''SubResourceReadOnly'']'
