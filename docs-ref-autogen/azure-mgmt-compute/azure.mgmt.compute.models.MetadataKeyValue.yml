### YamlMime:PythonClass
uid: azure.mgmt.compute.models.MetadataKeyValue
name: MetadataKeyValue
fullName: azure.mgmt.compute.models.MetadataKeyValue
module: azure.mgmt.compute.models
summary: Describes a key-value pair for image metadata.
constructor:
  syntax: 'MetadataKeyValue(*args: Any, **kwargs: Any)'
variables:
- description: 'The metadata key. Known keys emitted by the service include

    ''Linux.AzureSecretsProvisioning.Enabled'', ''OS.Name'', and ''{componentName}.Version''
    (e.g.,

    ''AzureGuestAgent.Version''). All values are non-sensitive configuration; no secrets,

    credentials, or cryptographic material transit this field. Required.'
  name: metadata_key
  types:
  - <xref:str>
- description: 'The metadata value. Contains non-sensitive configuration such as

    capability flags (''true''/''false''), OS names (''Linux'', ''Windows''), and
    version strings (e.g.,

    ''1.0.0'').'
  name: metadata_value
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.compute.models.MetadataKeyValue.metadata_key
  name: metadata_key
  summary: 'The metadata key. Known keys emitted by the service include

    ''Linux.AzureSecretsProvisioning.Enabled'', ''OS.Name'', and ''{componentName}.Version''
    (e.g.,

    ''AzureGuestAgent.Version''). All values are non-sensitive configuration; no secrets,

    credentials, or cryptographic material transit this field. Required.'
  signature: 'metadata_key: str'
- uid: azure.mgmt.compute.models.MetadataKeyValue.metadata_value
  name: metadata_value
  summary: 'The metadata value. Contains non-sensitive configuration such as capability
    flags

    (''true''/''false''), OS names (''Linux'', ''Windows''), and version strings (e.g.,
    ''1.0.0'').'
  signature: 'metadata_value: str | None'
