### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetIPConfigurationProperties
name: VirtualMachineScaleSetIPConfigurationProperties
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetIPConfigurationProperties
module: azure.mgmt.compute.types
summary: Describes a virtual machine scale set network profile's IP configuration
  properties.
constructor:
  syntax: VirtualMachineScaleSetIPConfigurationProperties()
variables:
- description: Specifies the identifier of the subnet.
  name: subnet
  types:
  - <xref:<xref:"ApiEntityReference">>
- description: 'Specifies the primary network interface in case the virtual machine
    has more

    than 1 network interface.'
  name: primary
  types:
  - <xref:bool>
- description: The publicIPAddressConfiguration.
  name: public_ip_address_configuration
  types:
  - <xref:<xref:"VirtualMachineScaleSetPublicIPAddressConfiguration">>
- description: 'Available from Api-Version 2017-03-30 onwards, it represents

    whether the specific ipconfiguration is IPv4 or IPv6. Default is taken as IPv4.  Possible

    values are: ''IPv4'' and ''IPv6''. Known values are: "IPv4" and "IPv6".'
  name: private_ip_address_version
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IPVersion">]
- description: 'Specifies an array of references to backend

    address pools of application gateways. A scale set can reference backend address
    pools of

    multiple application gateways. Multiple scale sets cannot use the same application
    gateway.'
  name: application_gateway_backend_address_pools
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'Specifies an array of references to application security

    group.'
  name: application_security_groups
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'Specifies an array of references to backend address

    pools of load balancers. A scale set can reference backend address pools of one
    public and one

    internal load balancer. Multiple scale sets cannot use the same basic sku load
    balancer.'
  name: load_balancer_backend_address_pools
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'Specifies an array of references to inbound Nat pools of

    the load balancers. A scale set can reference inbound nat pools of one public
    and one internal

    load balancer. Multiple scale sets cannot use the same basic sku load balancer.'
  name: load_balancer_inbound_nat_pools
  types:
  - <xref:list>[<xref:"SubResource">]
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetIPConfigurationProperties.applicationGatewayBackendAddressPools
  name: applicationGatewayBackendAddressPools
  summary: 'Specifies an array of references to backend address pools of application
    gateways. A scale set

    can reference backend address pools of multiple application gateways. Multiple
    scale sets

    cannot use the same application gateway.'
  signature: 'applicationGatewayBackendAddressPools: list[''SubResource'']'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetIPConfigurationProperties.applicationSecurityGroups
  name: applicationSecurityGroups
  summary: Specifies an array of references to application security group.
  signature: 'applicationSecurityGroups: list[''SubResource'']'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetIPConfigurationProperties.loadBalancerBackendAddressPools
  name: loadBalancerBackendAddressPools
  summary: 'Specifies an array of references to backend address pools of load balancers.
    A scale set can

    reference backend address pools of one public and one internal load balancer.
    Multiple scale

    sets cannot use the same basic sku load balancer.'
  signature: 'loadBalancerBackendAddressPools: list[''SubResource'']'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetIPConfigurationProperties.loadBalancerInboundNatPools
  name: loadBalancerInboundNatPools
  summary: 'Specifies an array of references to inbound Nat pools of the load balancers.
    A scale set can

    reference inbound nat pools of one public and one internal load balancer. Multiple
    scale sets

    cannot use the same basic sku load balancer.'
  signature: 'loadBalancerInboundNatPools: list[''SubResource'']'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetIPConfigurationProperties.primary
  name: primary
  summary: 'Specifies the primary network interface in case the virtual machine has
    more than 1 network

    interface.'
  signature: 'primary: bool'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetIPConfigurationProperties.privateIPAddressVersion
  name: privateIPAddressVersion
  summary: 'Available from Api-Version 2017-03-30 onwards, it represents whether the
    specific

    ipconfiguration is IPv4 or IPv6. Default is taken as IPv4.  Possible values are:
    ''IPv4'' and

    ''IPv6''. Known values are: "IPv4" and "IPv6".'
  signature: 'privateIPAddressVersion: str | IPVersion'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetIPConfigurationProperties.publicIPAddressConfiguration
  name: publicIPAddressConfiguration
  summary: The publicIPAddressConfiguration.
  signature: 'publicIPAddressConfiguration: VirtualMachineScaleSetPublicIPAddressConfiguration'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetIPConfigurationProperties.subnet
  name: subnet
  summary: Specifies the identifier of the subnet.
  signature: 'subnet: ApiEntityReference'
