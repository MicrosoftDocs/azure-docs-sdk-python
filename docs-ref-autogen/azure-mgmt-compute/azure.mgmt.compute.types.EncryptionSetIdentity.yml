### YamlMime:PythonClass
uid: azure.mgmt.compute.types.EncryptionSetIdentity
name: EncryptionSetIdentity
fullName: azure.mgmt.compute.types.EncryptionSetIdentity
module: azure.mgmt.compute.types
summary: 'The managed identity for the disk encryption set. It should be given permission
  on the key

  vault before it can be used to encrypt disks.'
constructor:
  syntax: EncryptionSetIdentity()
variables:
- description: 'The type of Managed Identity used by the DiskEncryptionSet. Only SystemAssigned
    is

    supported for new creations. Disk Encryption Sets can be updated with Identity
    type None during

    migration of subscription to a new Azure Active Directory tenant; it will cause
    the encrypted

    resources to lose access to the keys. Known values are: "SystemAssigned", "UserAssigned",

    "SystemAssigned, UserAssigned", and "None".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DiskEncryptionSetIdentityType">]
- description: 'The object id of the Managed Identity Resource. This will be sent
    to the RP

    from ARM via the x-ms-identity-principal-id header in the PUT request if the resource
    has a

    systemAssigned(implicit) identity.'
  name: principal_id
  types:
  - <xref:str>
- description: 'The tenant id of the Managed Identity Resource. This will be sent
    to the RP

    from ARM via the x-ms-client-tenant-id header in the PUT request if the resource
    has a

    systemAssigned(implicit) identity.'
  name: tenant_id
  types:
  - <xref:str>
- description: 'The list of user identities associated with the disk encryption

    set. The user identity dictionary key references will be ARM resource ids in the
    form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}''.'
  name: user_assigned_identities
  types:
  - <xref:dict>[<xref:str>, <xref:"UserAssignedIdentitiesValue">]
attributes:
- uid: azure.mgmt.compute.types.EncryptionSetIdentity.principalId
  name: principalId
  summary: 'The object id of the Managed Identity Resource. This will be sent to the
    RP from ARM via the

    x-ms-identity-principal-id header in the PUT request if the resource has a

    systemAssigned(implicit) identity.'
  signature: 'principalId: str'
- uid: azure.mgmt.compute.types.EncryptionSetIdentity.tenantId
  name: tenantId
  summary: 'The tenant id of the Managed Identity Resource. This will be sent to the
    RP from ARM via the

    x-ms-client-tenant-id header in the PUT request if the resource has a systemAssigned(implicit)

    identity.'
  signature: 'tenantId: str'
- uid: azure.mgmt.compute.types.EncryptionSetIdentity.type
  name: type
  summary: 'The type of Managed Identity used by the DiskEncryptionSet. Only SystemAssigned
    is supported

    for new creations. Disk Encryption Sets can be updated with Identity type None
    during migration

    of subscription to a new Azure Active Directory tenant; it will cause the encrypted
    resources

    to lose access to the keys. Known values are: "SystemAssigned", "UserAssigned",

    "SystemAssigned, UserAssigned", and "None".'
  signature: 'type: str | DiskEncryptionSetIdentityType'
- uid: azure.mgmt.compute.types.EncryptionSetIdentity.userAssignedIdentities
  name: userAssignedIdentities
  summary: 'The list of user identities associated with the disk encryption set. The
    user identity

    dictionary key references will be ARM resource ids in the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}''.'
  signature: 'userAssignedIdentities: dict[str, ''UserAssignedIdentitiesValue'']'
