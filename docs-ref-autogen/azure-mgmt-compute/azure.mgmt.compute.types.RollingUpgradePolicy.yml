### YamlMime:PythonClass
uid: azure.mgmt.compute.types.RollingUpgradePolicy
name: RollingUpgradePolicy
fullName: azure.mgmt.compute.types.RollingUpgradePolicy
module: azure.mgmt.compute.types
summary: The configuration parameters used while performing a rolling upgrade.
constructor:
  syntax: RollingUpgradePolicy()
variables:
- description: 'The maximum percent of total virtual machine instances that will

    be upgraded simultaneously by the rolling upgrade in one batch. As this is a maximum,
    unhealthy

    instances in previous or future batches can cause the percentage of instances
    in a batch to

    decrease to ensure higher reliability. The default value for this parameter is
    20%.'
  name: maxBatchInstancePercent
  types:
  - <xref:int>
- description: 'The maximum percentage of the total virtual machine

    instances in the scale set that can be simultaneously unhealthy, either as a result
    of being

    upgraded, or by being found in an unhealthy state by the virtual machine health
    checks before

    the rolling upgrade aborts. This constraint will be checked prior to starting
    any batch. The

    default value for this parameter is 20%.'
  name: maxUnhealthyInstancePercent
  types:
  - <xref:int>
- description: 'The maximum percentage of upgraded virtual machine

    instances that can be found to be in an unhealthy state. This check will happen
    after each

    batch is upgraded. If this percentage is ever exceeded, the rolling update aborts.
    The default

    value for this parameter is 20%.'
  name: maxUnhealthyUpgradedInstancePercent
  types:
  - <xref:int>
- description: 'The wait time between completing the update for all virtual

    machines in one batch and starting the next batch. The time duration should be
    specified in ISO

    8601 format. The default value is 0 seconds (PT0S).'
  name: pauseTimeBetweenBatches
  types:
  - <xref:str>
- description: 'Allow VMSS to ignore AZ boundaries when constructing upgrade

    batches. Take into consideration the Update Domain and maxBatchInstancePercent
    to determine the

    batch size.'
  name: enableCrossZoneUpgrade
  types:
  - <xref:bool>
- description: 'Upgrade all unhealthy instances in a scale set before any

    healthy instances.'
  name: prioritizeUnhealthyInstances
  types:
  - <xref:bool>
- description: 'Rollback failed instances to previous model if the

    Rolling Upgrade policy is violated.'
  name: rollbackFailedInstancesOnPolicyBreach
  types:
  - <xref:bool>
- description: 'Create new virtual machines to upgrade the scale set, rather than
    updating the

    existing virtual machines. Existing virtual machines will be deleted once the
    new virtual

    machines are created for each batch.'
  name: maxSurge
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.compute.types.RollingUpgradePolicy.enableCrossZoneUpgrade
  name: enableCrossZoneUpgrade
  summary: 'Allow VMSS to ignore AZ boundaries when constructing upgrade batches.
    Take into consideration

    the Update Domain and maxBatchInstancePercent to determine the batch size.'
  signature: 'enableCrossZoneUpgrade: bool'
- uid: azure.mgmt.compute.types.RollingUpgradePolicy.maxBatchInstancePercent
  name: maxBatchInstancePercent
  summary: 'The maximum percent of total virtual machine instances that will be upgraded
    simultaneously by

    the rolling upgrade in one batch. As this is a maximum, unhealthy instances in
    previous or

    future batches can cause the percentage of instances in a batch to decrease to
    ensure higher

    reliability. The default value for this parameter is 20%.'
  signature: 'maxBatchInstancePercent: int'
- uid: azure.mgmt.compute.types.RollingUpgradePolicy.maxSurge
  name: maxSurge
  summary: 'Create new virtual machines to upgrade the scale set, rather than updating
    the existing virtual

    machines. Existing virtual machines will be deleted once the new virtual machines
    are created

    for each batch.'
  signature: 'maxSurge: bool'
- uid: azure.mgmt.compute.types.RollingUpgradePolicy.maxUnhealthyInstancePercent
  name: maxUnhealthyInstancePercent
  summary: 'The maximum percentage of the total virtual machine instances in the scale
    set that can be

    simultaneously unhealthy, either as a result of being upgraded, or by being found
    in an

    unhealthy state by the virtual machine health checks before the rolling upgrade
    aborts. This

    constraint will be checked prior to starting any batch. The default value for
    this parameter is

    20%.'
  signature: 'maxUnhealthyInstancePercent: int'
- uid: azure.mgmt.compute.types.RollingUpgradePolicy.maxUnhealthyUpgradedInstancePercent
  name: maxUnhealthyUpgradedInstancePercent
  summary: 'The maximum percentage of upgraded virtual machine instances that can
    be found to be in an

    unhealthy state. This check will happen after each batch is upgraded. If this
    percentage is

    ever exceeded, the rolling update aborts. The default value for this parameter
    is 20%.'
  signature: 'maxUnhealthyUpgradedInstancePercent: int'
- uid: azure.mgmt.compute.types.RollingUpgradePolicy.pauseTimeBetweenBatches
  name: pauseTimeBetweenBatches
  summary: 'The wait time between completing the update for all virtual machines in
    one batch and starting

    the next batch. The time duration should be specified in ISO 8601 format. The
    default value is

    0 seconds (PT0S).'
  signature: 'pauseTimeBetweenBatches: str'
- uid: azure.mgmt.compute.types.RollingUpgradePolicy.prioritizeUnhealthyInstances
  name: prioritizeUnhealthyInstances
  summary: Upgrade all unhealthy instances in a scale set before any healthy instances.
  signature: 'prioritizeUnhealthyInstances: bool'
- uid: azure.mgmt.compute.types.RollingUpgradePolicy.rollbackFailedInstancesOnPolicyBreach
  name: rollbackFailedInstancesOnPolicyBreach
  summary: Rollback failed instances to previous model if the Rolling Upgrade policy
    is violated.
  signature: 'rollbackFailedInstancesOnPolicyBreach: bool'
