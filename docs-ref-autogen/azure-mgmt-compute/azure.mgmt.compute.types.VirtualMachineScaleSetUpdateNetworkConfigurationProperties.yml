uid: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateNetworkConfigurationProperties
name: VirtualMachineScaleSetUpdateNetworkConfigurationProperties
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetUpdateNetworkConfigurationProperties
module: azure.mgmt.compute.types
summary: 'Describes a virtual machine scale set updatable network profile''s IP configuration.Use
  this

  object for updating network profile''s IP Configuration.'
constructor:
  syntax: VirtualMachineScaleSetUpdateNetworkConfigurationProperties()
variables:
- description: Whether this is a primary NIC on a virtual machine.
  name: primary
  types:
  - <xref:bool>
- description: 'Specifies whether the network interface is accelerated

    networking-enabled.'
  name: enableAcceleratedNetworking
  types:
  - <xref:bool>
- description: 'Specifies whether the network interface is disabled for tcp

    state tracking.'
  name: disableTcpStateTracking
  types:
  - <xref:bool>
- description: Specifies whether the network interface is FPGA networking-enabled.
  name: enableFpga
  types:
  - <xref:bool>
- description: The network security group.
  name: networkSecurityGroup
  types:
  - <xref:<xref:"SubResource">>
- description: The dns settings to be applied on the network interfaces.
  name: dnsSettings
  types:
  - <xref:<xref:"VirtualMachineScaleSetNetworkConfigurationDnsSettings">>
- description: The virtual machine scale set IP Configuration.
  name: ipConfigurations
  types:
  - <xref:list>[<xref:"VirtualMachineScaleSetUpdateIPConfiguration">]
- description: Whether IP forwarding enabled on this NIC.
  name: enableIPForwarding
  types:
  - <xref:bool>
