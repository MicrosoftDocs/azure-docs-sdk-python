### YamlMime:PythonClass
uid: azure.mgmt.compute.types.SnapshotUpdateProperties
name: SnapshotUpdateProperties
fullName: azure.mgmt.compute.types.SnapshotUpdateProperties
module: azure.mgmt.compute.types
summary: Snapshot resource update properties.
constructor:
  syntax: SnapshotUpdateProperties()
variables:
- description: 'the Operating System type. Known values are: "Windows" and "Linux".'
  name: osType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperatingSystemTypes">]
- description: 'If creationData.createOption is Empty, this field is mandatory and
    it

    indicates the size of the disk to create. If this field is present for updates
    or creation with

    other options, it indicates a resize. Resizes are only allowed if the disk is
    not attached to a

    running VM, and can only increase the disk''s size.'
  name: diskSizeGB
  types:
  - <xref:int>
- description: 'Encryption settings collection used be Azure Disk

    Encryption, can contain multiple encryption settings per disk or snapshot.'
  name: encryptionSettingsCollection
  types:
  - <xref:<xref:"EncryptionSettingsCollection">>
- description: 'Encryption property can be used to encrypt data at rest with customer
    managed

    keys or platform managed keys.'
  name: encryption
  types:
  - <xref:<xref:"Encryption">>
- description: 'Policy for accessing the disk via network. Known values are:

    "AllowAll", "AllowPrivate", and "DenyAll".'
  name: networkAccessPolicy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkAccessPolicy">]
- description: ARM id of the DiskAccess resource for using private endpoints on disks.
  name: diskAccessId
  types:
  - <xref:str>
- description: Indicates the OS on a snapshot supports hibernation.
  name: supportsHibernation
  types:
  - <xref:bool>
- description: 'Policy for controlling export on the disk. Known values are:

    "Enabled" and "Disabled".'
  name: publicNetworkAccess
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: 'Additional authentication requirements when exporting or uploading
    to

    a disk or snapshot. Known values are: "AzureActiveDirectory" and "None".'
  name: dataAccessAuthMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DataAccessAuthMode">]
- description: 'List of supported capabilities for the image from which the OS

    disk was created.'
  name: supportedCapabilities
  types:
  - <xref:<xref:"SupportedCapabilities">>
- description: 'The state of snapshot which determines the access availability of

    the snapshot. Known values are: "Unknown", "Pending", "Available", "InstantAccess",
    and

    "AvailableWithInstantAccess".'
  name: snapshotAccessState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SnapshotAccessState">]
attributes:
- uid: azure.mgmt.compute.types.SnapshotUpdateProperties.dataAccessAuthMode
  name: dataAccessAuthMode
  summary: 'Additional authentication requirements when exporting or uploading to
    a disk or snapshot. Known

    values are: "AzureActiveDirectory" and "None".'
  signature: 'dataAccessAuthMode: str | DataAccessAuthMode'
- uid: azure.mgmt.compute.types.SnapshotUpdateProperties.diskAccessId
  name: diskAccessId
  summary: ARM id of the DiskAccess resource for using private endpoints on disks.
  signature: 'diskAccessId: str'
- uid: azure.mgmt.compute.types.SnapshotUpdateProperties.diskSizeGB
  name: diskSizeGB
  summary: 'If creationData.createOption is Empty, this field is mandatory and it
    indicates the size of the

    disk to create. If this field is present for updates or creation with other options,
    it

    indicates a resize. Resizes are only allowed if the disk is not attached to a
    running VM, and

    can only increase the disk''s size.'
  signature: 'diskSizeGB: int'
- uid: azure.mgmt.compute.types.SnapshotUpdateProperties.encryption
  name: encryption
  summary: 'Encryption property can be used to encrypt data at rest with customer
    managed keys or platform

    managed keys.'
  signature: 'encryption: Encryption'
- uid: azure.mgmt.compute.types.SnapshotUpdateProperties.encryptionSettingsCollection
  name: encryptionSettingsCollection
  summary: 'Encryption settings collection used be Azure Disk Encryption, can contain
    multiple encryption

    settings per disk or snapshot.'
  signature: 'encryptionSettingsCollection: EncryptionSettingsCollection'
- uid: azure.mgmt.compute.types.SnapshotUpdateProperties.networkAccessPolicy
  name: networkAccessPolicy
  summary: '"AllowAll", "AllowPrivate",

    and "DenyAll".'
  signature: 'networkAccessPolicy: str | NetworkAccessPolicy'
- uid: azure.mgmt.compute.types.SnapshotUpdateProperties.osType
  name: osType
  summary: '"Windows" and "Linux".'
  signature: 'osType: str | OperatingSystemTypes'
- uid: azure.mgmt.compute.types.SnapshotUpdateProperties.publicNetworkAccess
  name: publicNetworkAccess
  summary: '"Enabled" and "Disabled".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.compute.types.SnapshotUpdateProperties.snapshotAccessState
  name: snapshotAccessState
  summary: 'The state of snapshot which determines the access availability of the
    snapshot. Known values

    are: "Unknown", "Pending", "Available", "InstantAccess", and

    "AvailableWithInstantAccess".'
  signature: 'snapshotAccessState: str | SnapshotAccessState'
- uid: azure.mgmt.compute.types.SnapshotUpdateProperties.supportedCapabilities
  name: supportedCapabilities
  summary: List of supported capabilities for the image from which the OS disk was
    created.
  signature: 'supportedCapabilities: SupportedCapabilities'
- uid: azure.mgmt.compute.types.SnapshotUpdateProperties.supportsHibernation
  name: supportsHibernation
  summary: Indicates the OS on a snapshot supports hibernation.
  signature: 'supportsHibernation: bool'
