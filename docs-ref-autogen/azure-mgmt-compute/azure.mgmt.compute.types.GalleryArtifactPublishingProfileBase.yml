### YamlMime:PythonClass
uid: azure.mgmt.compute.types.GalleryArtifactPublishingProfileBase
name: GalleryArtifactPublishingProfileBase
fullName: azure.mgmt.compute.types.GalleryArtifactPublishingProfileBase
module: azure.mgmt.compute.types
summary: Describes the basic gallery artifact publishing profile.
constructor:
  syntax: GalleryArtifactPublishingProfileBase()
variables:
- description: 'The target regions where the Image Version is going to be replicated
    to.

    This property is updatable.'
  name: targetRegions
  types:
  - <xref:list>[<xref:"TargetRegion">]
- description: 'The number of replicas of the Image Version to be created per region.
    This

    property would take effect for a region when regionalReplicaCount is not specified.
    This

    property is updatable.'
  name: replicaCount
  types:
  - <xref:int>
- description: 'If set to true, Virtual Machines deployed from the latest version
    of

    the Image Definition won''t use this Image Version.'
  name: excludeFromLatest
  types:
  - <xref:bool>
- description: The timestamp for when the gallery image version is published.
  name: publishedDate
  types:
  - <xref:str>
- description: 'The end of life date of the gallery image version. This property can
    be

    used for decommissioning purposes. This property is updatable.'
  name: endOfLifeDate
  types:
  - <xref:str>
- description: 'Specifies the storage account type to be used to store the image.

    Cannot be specified along with storageAccountStrategy. This property is not updatable.
    Known

    values are: "Standard_LRS", "Standard_ZRS", "Premium_LRS", and "PremiumV2_LRS".'
  name: storageAccountType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageAccountType">]
- description: 'Optional parameter which specifies the mode to be used for replication.

    This property is not updatable. Known values are: "Full" and "Shallow".'
  name: replicationMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationMode">]
- description: 'The target extended locations where the Image Version is going

    to be replicated to. This property is updatable.'
  name: targetExtendedLocations
  types:
  - <xref:list>[<xref:"GalleryTargetExtendedLocation">]
- description: 'Specifies the strategy to be used when selecting the storage

    account type. Cannot be specified along with storageAccountType, but can be overridden
    per

    region by specifying targetRegions[].storageAccountType. This property is not
    updatable. Known

    values are: "PreferStandard_ZRS" and "DefaultStandard_LRS".'
  name: storageAccountStrategy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageAccountStrategy">]
attributes:
- uid: azure.mgmt.compute.types.GalleryArtifactPublishingProfileBase.endOfLifeDate
  name: endOfLifeDate
  summary: 'The end of life date of the gallery image version. This property can be
    used for

    decommissioning purposes. This property is updatable.'
  signature: 'endOfLifeDate: str'
- uid: azure.mgmt.compute.types.GalleryArtifactPublishingProfileBase.excludeFromLatest
  name: excludeFromLatest
  summary: 'If set to true, Virtual Machines deployed from the latest version of the
    Image Definition won''t

    use this Image Version.'
  signature: 'excludeFromLatest: bool'
- uid: azure.mgmt.compute.types.GalleryArtifactPublishingProfileBase.publishedDate
  name: publishedDate
  summary: The timestamp for when the gallery image version is published.
  signature: 'publishedDate: str'
- uid: azure.mgmt.compute.types.GalleryArtifactPublishingProfileBase.replicaCount
  name: replicaCount
  summary: 'The number of replicas of the Image Version to be created per region.
    This property would take

    effect for a region when regionalReplicaCount is not specified. This property
    is updatable.'
  signature: 'replicaCount: int'
- uid: azure.mgmt.compute.types.GalleryArtifactPublishingProfileBase.replicationMode
  name: replicationMode
  summary: 'Optional parameter which specifies the mode to be used for replication.
    This property is not

    updatable. Known values are: "Full" and "Shallow".'
  signature: 'replicationMode: str | ReplicationMode'
- uid: azure.mgmt.compute.types.GalleryArtifactPublishingProfileBase.storageAccountStrategy
  name: storageAccountStrategy
  summary: 'Specifies the strategy to be used when selecting the storage account type.
    Cannot be specified

    along with storageAccountType, but can be overridden per region by specifying

    targetRegions[].storageAccountType. This property is not updatable. Known values
    are:

    "PreferStandard_ZRS" and "DefaultStandard_LRS".'
  signature: 'storageAccountStrategy: str | StorageAccountStrategy'
- uid: azure.mgmt.compute.types.GalleryArtifactPublishingProfileBase.storageAccountType
  name: storageAccountType
  summary: 'Specifies the storage account type to be used to store the image. Cannot
    be specified along

    with storageAccountStrategy. This property is not updatable. Known values are:

    "Standard_LRS", "Standard_ZRS", "Premium_LRS", and "PremiumV2_LRS".'
  signature: 'storageAccountType: str | StorageAccountType'
- uid: azure.mgmt.compute.types.GalleryArtifactPublishingProfileBase.targetExtendedLocations
  name: targetExtendedLocations
  summary: 'The target extended locations where the Image Version is going to be replicated
    to. This

    property is updatable.'
  signature: 'targetExtendedLocations: list[''GalleryTargetExtendedLocation'']'
- uid: azure.mgmt.compute.types.GalleryArtifactPublishingProfileBase.targetRegions
  name: targetRegions
  summary: 'The target regions where the Image Version is going to be replicated to.
    This property is

    updatable.'
  signature: 'targetRegions: list[''TargetRegion'']'
