  name: networkApiVersion
  summary: 'specifies the Microsoft.Network API version used when creating networking
    resources in the

    Network Interface Configurations for Virtual Machine Scale Set with orchestration
    mode

    ''Flexible''. Known values are: "2020-11-01" and "2022-11-01".'
  signature: 'networkApiVersion: str | NetworkApiVersion'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetNetworkProfile.networkInterfaceConfigurations
  name: networkInterfaceConfigurations
