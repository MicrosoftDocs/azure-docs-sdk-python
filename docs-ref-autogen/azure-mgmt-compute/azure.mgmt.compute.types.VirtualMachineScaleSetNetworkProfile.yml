### YamlMime:PythonClass
uid: azure.mgmt.compute.types.VirtualMachineScaleSetNetworkProfile
name: VirtualMachineScaleSetNetworkProfile
fullName: azure.mgmt.compute.types.VirtualMachineScaleSetNetworkProfile
module: azure.mgmt.compute.types
summary: Describes a virtual machine scale set network profile.
constructor:
  syntax: VirtualMachineScaleSetNetworkProfile()
variables:
- description: 'A reference to a load balancer probe used to determine the health
    of an

    instance in the virtual machine scale set. The reference will be in the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/loadBalancers/{loadBalancerName}/probes/{probeName}''.'
  name: healthProbe
  types:
  - <xref:<xref:"ApiEntityReference">>
- description: The list of network configurations.
  name: networkInterfaceConfigurations
  types:
  - <xref:list>[<xref:"VirtualMachineScaleSetNetworkConfiguration">]
- description: 'specifies the Microsoft.Network API version used when creating

    networking resources in the Network Interface Configurations for Virtual Machine
    Scale Set with

    orchestration mode ''Flexible''. Known values are: "2020-11-01" and "2022-11-01".'
  name: networkApiVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NetworkApiVersion">]
- description: 'Specifies the interconnect group profile to associate with the

    scale set. Minimum api-version: 2026-03-01.'
  name: interconnectGroupProfile
  types:
  - <xref:<xref:"InterconnectGroupProfile">>
attributes:
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetNetworkProfile.healthProbe
  name: healthProbe
  summary: 'A reference to a load balancer probe used to determine the health of an
    instance in the virtual

    machine scale set. The reference will be in the form:

    ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/loadBalancers/{loadBalancerName}/probes/{probeName}''.'
  signature: 'healthProbe: ApiEntityReference'
- uid: azure.mgmt.compute.types.VirtualMachineScaleSetNetworkProfile.interconnectGroupProfile
  name: interconnectGroupProfile
  summary: 'Specifies the interconnect group profile to associate with the scale set.
    Minimum api-version:

    2026-03-01.'
  signature: 'interconnectGroupProfile: InterconnectGroupProfile'
