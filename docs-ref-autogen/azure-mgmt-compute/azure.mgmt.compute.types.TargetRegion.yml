### YamlMime:PythonClass
uid: azure.mgmt.compute.types.TargetRegion
name: TargetRegion
fullName: azure.mgmt.compute.types.TargetRegion
module: azure.mgmt.compute.types
summary: Describes the target region information.
constructor:
  syntax: TargetRegion()
variables:
- description: The name of the region. Required.
  name: name
  types:
  - <xref:str>
- description: 'The number of replicas of the Image Version to be created per

    region. This property is updatable.'
  name: regionalReplicaCount
  types:
  - <xref:int>
- description: 'Specifies the storage account type to be used to store the image.

    This property is not updatable. Known values are: "Standard_LRS", "Standard_ZRS",

    "Premium_LRS", and "PremiumV2_LRS".'
  name: storageAccountType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageAccountType">]
- description: 'Optional. Allows users to provide customer managed keys for encrypting
    the OS

    and data disks in the gallery artifact.'
  name: encryption
  types:
  - <xref:<xref:"EncryptionImages">>
- description: 'Contains the flag setting to hide an image when users specify

    version=''latest''.'
  name: excludeFromLatest
  types:
  - <xref:bool>
- description: 'List of storage sku with replica count to create direct drive

    replicas.'
  name: additionalReplicaSets
  types:
  - <xref:list>[<xref:"AdditionalReplicaSet">]
attributes:
- uid: azure.mgmt.compute.types.TargetRegion.additionalReplicaSets
  name: additionalReplicaSets
  summary: List of storage sku with replica count to create direct drive replicas.
  signature: 'additionalReplicaSets: list[''AdditionalReplicaSet'']'
- uid: azure.mgmt.compute.types.TargetRegion.encryption
  name: encryption
  summary: 'Optional. Allows users to provide customer managed keys for encrypting
    the OS and data disks in

    the gallery artifact.'
  signature: 'encryption: EncryptionImages'
- uid: azure.mgmt.compute.types.TargetRegion.excludeFromLatest
  name: excludeFromLatest
  summary: Contains the flag setting to hide an image when users specify version='latest'.
  signature: 'excludeFromLatest: bool'
- uid: azure.mgmt.compute.types.TargetRegion.name
  name: name
  summary: The name of the region. Required.
  signature: 'name: Required[str]'
- uid: azure.mgmt.compute.types.TargetRegion.regionalReplicaCount
  name: regionalReplicaCount
  summary: 'The number of replicas of the Image Version to be created per region.
    This property is

    updatable.'
  signature: 'regionalReplicaCount: int'
- uid: azure.mgmt.compute.types.TargetRegion.storageAccountType
  name: storageAccountType
  summary: 'Specifies the storage account type to be used to store the image. This
