### YamlMime:PythonClass
uid: azure.mgmt.compute.types.GalleryScriptVersionPublishingProfile
name: GalleryScriptVersionPublishingProfile
fullName: azure.mgmt.compute.types.GalleryScriptVersionPublishingProfile
module: azure.mgmt.compute.types
summary: The publishing profile of a gallery image version.
constructor:
  syntax: GalleryScriptVersionPublishingProfile()
variables:
- description: 'The target regions where the Image Version is going to be replicated
    to.

    This property is updatable.'
  name: targetRegions
  types:
  - <xref:list>[<xref:"TargetRegion">]
- description: 'The number of replicas of the Image Version to be created per region.
    This

    property would take effect for a region when regionalReplicaCount is not specified.
    This

    property is updatable.'
  name: replicaCount
  types:
  - <xref:int>
- description: 'If set to true, Virtual Machines deployed from the latest version
    of

    the Image Definition won''t use this Image Version.'
  name: excludeFromLatest
  types:
  - <xref:bool>
- description: The timestamp for when the gallery image version is published.
  name: publishedDate
  types:
  - <xref:str>
- description: 'The end of life date of the gallery image version. This property can
    be

    used for decommissioning purposes. This property is updatable.'
  name: endOfLifeDate
  types:
  - <xref:str>
- description: 'Specifies the storage account type to be used to store the image.

    Cannot be specified along with storageAccountStrategy. This property is not updatable.
    Known

    values are: "Standard_LRS", "Standard_ZRS", "Premium_LRS", and "PremiumV2_LRS".'
  name: storageAccountType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageAccountType">]
- description: 'Optional parameter which specifies the mode to be used for replication.

    This property is not updatable. Known values are: "Full" and "Shallow".'
  name: replicationMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ReplicationMode">]
- description: 'The target extended locations where the Image Version is going

    to be replicated to. This property is updatable.'
  name: targetExtendedLocations
  types:
  - <xref:list>[<xref:"GalleryTargetExtendedLocation">]
- description: 'Specifies the strategy to be used when selecting the storage

    account type. Cannot be specified along with storageAccountType, but can be overridden
    per

    region by specifying targetRegions[].storageAccountType. This property is not
    updatable. Known

    values are: "PreferStandard_ZRS" and "DefaultStandard_LRS".'
  name: storageAccountStrategy
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"StorageAccountStrategy">]
- description: The source script from which the Script Version is going to be created.
    Required.
  name: source
  types:
  - <xref:<xref:"ScriptSource">>
attributes:
- uid: azure.mgmt.compute.types.GalleryScriptVersionPublishingProfile.source
  name: source
  summary: The source script from which the Script Version is going to be created.
    Required.
  signature: 'source: Required[ScriptSource]'
- uid: azure.mgmt.compute.types.GalleryScriptVersionPublishingProfile.endOfLifeDate
  name: endOfLifeDate
  signature: 'endOfLifeDate: str'
- uid: azure.mgmt.compute.types.GalleryScriptVersionPublishingProfile.excludeFromLatest
  name: excludeFromLatest
  signature: 'excludeFromLatest: bool'
- uid: azure.mgmt.compute.types.GalleryScriptVersionPublishingProfile.publishedDate
  name: publishedDate
  signature: 'publishedDate: str'
- uid: azure.mgmt.compute.types.GalleryScriptVersionPublishingProfile.replicaCount
  name: replicaCount
  signature: 'replicaCount: int'
- uid: azure.mgmt.compute.types.GalleryScriptVersionPublishingProfile.replicationMode
  name: replicationMode
  signature: 'replicationMode: str | ReplicationMode'
- uid: azure.mgmt.compute.types.GalleryScriptVersionPublishingProfile.storageAccountStrategy
  name: storageAccountStrategy
  signature: 'storageAccountStrategy: str | StorageAccountStrategy'
- uid: azure.mgmt.compute.types.GalleryScriptVersionPublishingProfile.storageAccountType
  name: storageAccountType
  signature: 'storageAccountType: str | StorageAccountType'
- uid: azure.mgmt.compute.types.GalleryScriptVersionPublishingProfile.targetExtendedLocations
  name: targetExtendedLocations
  signature: 'targetExtendedLocations: list[''GalleryTargetExtendedLocation'']'
- uid: azure.mgmt.compute.types.GalleryScriptVersionPublishingProfile.targetRegions
  name: targetRegions
  signature: 'targetRegions: list[''TargetRegion'']'
