### YamlMime:PythonClass
uid: azure.mgmt.network.types.ConnectionMonitorTestConfiguration
name: ConnectionMonitorTestConfiguration
fullName: azure.mgmt.network.types.ConnectionMonitorTestConfiguration
module: azure.mgmt.network.types
summary: Describes a connection monitor test configuration.
constructor:
  syntax: ConnectionMonitorTestConfiguration()
variables:
- description: The name of the connection monitor test configuration. Required.
  name: name
  types:
  - <xref:str>
- description: The frequency of test evaluation, in seconds.
  name: testFrequencySec
  types:
  - <xref:int>
- description: 'The protocol to use in test evaluation. Required. Known values are:
    "Tcp",

    "Http", and "Icmp".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectionMonitorTestConfigurationProtocol">]
- description: 'The preferred IP version to use in test evaluation. The connection

    monitor may choose to use a different version depending on other parameters. Known
    values are:

    "IPv4" and "IPv6".'
  name: preferredIPVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PreferredIPVersion">]
- description: The parameters used to perform test evaluation over HTTP.
  name: httpConfiguration
  types:
  - <xref:<xref:"ConnectionMonitorHttpConfiguration">>
- description: The parameters used to perform test evaluation over TCP.
  name: tcpConfiguration
  types:
  - <xref:<xref:"ConnectionMonitorTcpConfiguration">>
- description: The parameters used to perform test evaluation over ICMP.
  name: icmpConfiguration
  types:
  - <xref:<xref:"ConnectionMonitorIcmpConfiguration">>
- description: The threshold for declaring a test successful.
  name: successThreshold
  types:
  - <xref:<xref:"ConnectionMonitorSuccessThreshold">>
attributes:
- uid: azure.mgmt.network.types.ConnectionMonitorTestConfiguration.httpConfiguration
  name: httpConfiguration
  summary: The parameters used to perform test evaluation over HTTP.
  signature: 'httpConfiguration: ConnectionMonitorHttpConfiguration'
- uid: azure.mgmt.network.types.ConnectionMonitorTestConfiguration.icmpConfiguration
  name: icmpConfiguration
  summary: The parameters used to perform test evaluation over ICMP.
  signature: 'icmpConfiguration: ConnectionMonitorIcmpConfiguration'
- uid: azure.mgmt.network.types.ConnectionMonitorTestConfiguration.name
  name: name
  summary: The name of the connection monitor test configuration. Required.
  signature: 'name: Required[str]'
- uid: azure.mgmt.network.types.ConnectionMonitorTestConfiguration.preferredIPVersion
  name: preferredIPVersion
  summary: 'The preferred IP version to use in test evaluation. The connection monitor
    may choose to use a

    different version depending on other parameters. Known values are: "IPv4" and
    "IPv6".'
  signature: 'preferredIPVersion: str | PreferredIPVersion'
- uid: azure.mgmt.network.types.ConnectionMonitorTestConfiguration.protocol
  name: protocol
  summary: '"Tcp", "Http", and

    "Icmp".'
  signature: 'protocol: Required[str | ConnectionMonitorTestConfigurationProtocol]'
- uid: azure.mgmt.network.types.ConnectionMonitorTestConfiguration.successThreshold
  name: successThreshold
  summary: The threshold for declaring a test successful.
  signature: 'successThreshold: ConnectionMonitorSuccessThreshold'
- uid: azure.mgmt.network.types.ConnectionMonitorTestConfiguration.tcpConfiguration
  name: tcpConfiguration
  summary: The parameters used to perform test evaluation over TCP.
  signature: 'tcpConfiguration: ConnectionMonitorTcpConfiguration'
- uid: azure.mgmt.network.types.ConnectionMonitorTestConfiguration.testFrequencySec
  name: testFrequencySec
  summary: The frequency of test evaluation, in seconds.
  signature: 'testFrequencySec: int'
