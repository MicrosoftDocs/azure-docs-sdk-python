### YamlMime:PythonClass
uid: azure.mgmt.network.types.ConnectivityParameters
name: ConnectivityParameters
fullName: azure.mgmt.network.types.ConnectivityParameters
module: azure.mgmt.network.types
summary: Parameters that determine how the connectivity check will be performed.
constructor:
  syntax: ConnectivityParameters()
variables:
- description: The source of the connection. Required.
  name: source
  types:
  - <xref:<xref:"ConnectivitySource">>
- description: The destination of connection. Required.
  name: destination
  types:
  - <xref:<xref:"ConnectivityDestination">>
- description: 'Network protocol. Known values are: "Tcp", "Http", "Https", and "Icmp".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Protocol">]
- description: Configuration of the protocol.
  name: protocolConfiguration
  types:
  - <xref:<xref:"ProtocolConfiguration">>
- description: 'Preferred IP version of the connection. Known values are: "IPv4" and

    "IPv6".'
  name: preferredIPVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IPVersion">]
attributes:
- uid: azure.mgmt.network.types.ConnectivityParameters.destination
  name: destination
  summary: The destination of connection. Required.
  signature: 'destination: Required[ConnectivityDestination]'
- uid: azure.mgmt.network.types.ConnectivityParameters.preferredIPVersion
  name: preferredIPVersion
  summary: '"IPv4" and "IPv6".'
  signature: 'preferredIPVersion: str | IPVersion'
- uid: azure.mgmt.network.types.ConnectivityParameters.protocol
  name: protocol
  summary: '"Tcp", "Http", "Https", and "Icmp".'
  signature: 'protocol: str | Protocol'
- uid: azure.mgmt.network.types.ConnectivityParameters.protocolConfiguration
  name: protocolConfiguration
  summary: Configuration of the protocol.
  signature: 'protocolConfiguration: ProtocolConfiguration'
- uid: azure.mgmt.network.types.ConnectivityParameters.source
  name: source
  summary: The source of the connection. Required.
  signature: 'source: Required[ConnectivitySource]'
