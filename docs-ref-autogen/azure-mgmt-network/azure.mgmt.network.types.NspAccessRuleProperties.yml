### YamlMime:PythonClass
uid: azure.mgmt.network.types.NspAccessRuleProperties
name: NspAccessRuleProperties
fullName: azure.mgmt.network.types.NspAccessRuleProperties
module: azure.mgmt.network.types
summary: Properties of NSP access rule.
constructor:
  syntax: NspAccessRuleProperties()
variables:
- description: 'The provisioning state of the scope assignment resource. Known values

    are: "Succeeded", "Creating", "Updating", "Deleting", "Accepted", and "Failed".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NspProvisioningState">]
- description: 'Direction that specifies whether the access rules is inbound/outbound.
    Known

    values are: "Inbound" and "Outbound".'
  name: direction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AccessRuleDirection">]
- description: Inbound address prefixes (IPv4/IPv6).
  name: addressPrefixes
  types:
  - <xref:list>[<xref:str>]
- description: Outbound rules in fully qualified domain name format.
  name: fullyQualifiedDomainNames
  types:
  - <xref:list>[<xref:str>]
- description: List of subscription ids.
  name: subscriptions
  types:
  - <xref:list>[<xref:"SubscriptionId">]
- description: Rule specified by the perimeter id.
  name: networkSecurityPerimeters
  types:
  - <xref:list>[<xref:"PerimeterBasedAccessRule">]
- description: 'Outbound rules in email address format. This access rule type is

    currently unavailable for use.'
  name: emailAddresses
  types:
  - <xref:list>[<xref:str>]
- description: 'Outbound rules in phone number format. This access rule type is currently

    unavailable for use.'
  name: phoneNumbers
  types:
  - <xref:list>[<xref:str>]
- description: 'Inbound rules of type service tag. This access rule type is currently

    unavailable for use.'
  name: serviceTags
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.network.types.NspAccessRuleProperties.addressPrefixes
  name: addressPrefixes
  summary: Inbound address prefixes (IPv4/IPv6).
  signature: 'addressPrefixes: list[str]'
- uid: azure.mgmt.network.types.NspAccessRuleProperties.direction
  name: direction
  summary: 'Direction that specifies whether the access rules is inbound/outbound.
    Known values are:

    "Inbound" and "Outbound".'
  signature: 'direction: str | AccessRuleDirection'
- uid: azure.mgmt.network.types.NspAccessRuleProperties.emailAddresses
  name: emailAddresses
  summary: Outbound rules in email address format. This access rule type is currently
    unavailable for use.
  signature: 'emailAddresses: list[str]'
- uid: azure.mgmt.network.types.NspAccessRuleProperties.fullyQualifiedDomainNames
  name: fullyQualifiedDomainNames
  summary: Outbound rules in fully qualified domain name format.
  signature: 'fullyQualifiedDomainNames: list[str]'
- uid: azure.mgmt.network.types.NspAccessRuleProperties.networkSecurityPerimeters
  name: networkSecurityPerimeters
  summary: Rule specified by the perimeter id.
  signature: 'networkSecurityPerimeters: list[''PerimeterBasedAccessRule'']'
- uid: azure.mgmt.network.types.NspAccessRuleProperties.phoneNumbers
  name: phoneNumbers
  summary: Outbound rules in phone number format. This access rule type is currently
    unavailable for use.
  signature: 'phoneNumbers: list[str]'
- uid: azure.mgmt.network.types.NspAccessRuleProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded",

    "Creating", "Updating", "Deleting", "Accepted", and "Failed".'
  signature: 'provisioningState: str | NspProvisioningState'
- uid: azure.mgmt.network.types.NspAccessRuleProperties.serviceTags
  name: serviceTags
  summary: Inbound rules of type service tag. This access rule type is currently unavailable
    for use.
  signature: 'serviceTags: list[str]'
- uid: azure.mgmt.network.types.NspAccessRuleProperties.subscriptions
  name: subscriptions
  summary: List of subscription ids.
  signature: 'subscriptions: list[''SubscriptionId'']'
