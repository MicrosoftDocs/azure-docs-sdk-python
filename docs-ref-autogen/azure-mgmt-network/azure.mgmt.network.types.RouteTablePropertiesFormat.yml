### YamlMime:PythonClass
uid: azure.mgmt.network.types.RouteTablePropertiesFormat
name: RouteTablePropertiesFormat
fullName: azure.mgmt.network.types.RouteTablePropertiesFormat
module: azure.mgmt.network.types
summary: Route Table resource.
constructor:
  syntax: RouteTablePropertiesFormat()
variables:
- description: Collection of routes contained within a route table.
  name: routes
  types:
  - <xref:list>[<xref:"Route">]
- description: A collection of references to subnets.
  name: subnets
  types:
  - <xref:list>[<xref:"Subnet">]
- description: 'Whether to disable the routes learned by BGP on that route

    table. True means disable.'
  name: disableBgpRoutePropagation
  types:
  - <xref:bool>
- description: 'Whether to disable the routes learned by peering on the route table.

    ''None'' means peering routes are enabled, ''All'' means all peering routes are
    disabled. Known

    values are: "None" and "All".'
  name: disablePeeringRoute
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DisablePeeringRoute">]
- description: 'The provisioning state of the route table resource. Known values are:

    "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The resource GUID property of the route table.
  name: resourceGuid
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.types.RouteTablePropertiesFormat.disableBgpRoutePropagation
  name: disableBgpRoutePropagation
  summary: Whether to disable the routes learned by BGP on that route table. True
    means disable.
  signature: 'disableBgpRoutePropagation: bool'
- uid: azure.mgmt.network.types.RouteTablePropertiesFormat.disablePeeringRoute
  name: disablePeeringRoute
  summary: 'Whether to disable the routes learned by peering on the route table. ''None''
    means peering

    routes are enabled, ''All'' means all peering routes are disabled. Known values
    are: "None" and

    "All".'
  signature: 'disablePeeringRoute: str | DisablePeeringRoute'
- uid: azure.mgmt.network.types.RouteTablePropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.RouteTablePropertiesFormat.resourceGuid
  name: resourceGuid
  summary: The resource GUID property of the route table.
  signature: 'resourceGuid: str'
- uid: azure.mgmt.network.types.RouteTablePropertiesFormat.routes
  name: routes
  summary: Collection of routes contained within a route table.
  signature: 'routes: list[''Route'']'
- uid: azure.mgmt.network.types.RouteTablePropertiesFormat.subnets
  name: subnets
  summary: A collection of references to subnets.
  signature: 'subnets: list[''Subnet'']'
