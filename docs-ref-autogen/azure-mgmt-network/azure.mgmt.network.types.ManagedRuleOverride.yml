### YamlMime:PythonClass
uid: azure.mgmt.network.types.ManagedRuleOverride
name: ManagedRuleOverride
fullName: azure.mgmt.network.types.ManagedRuleOverride
module: azure.mgmt.network.types
summary: Defines a managed rule group override setting.
constructor:
  syntax: ManagedRuleOverride()
variables:
- description: Identifier for the managed rule. Required.
  name: ruleId
  types:
  - <xref:str>
- description: 'The state of the managed rule. Defaults to Disabled if not specified.
    Known values

    are: "Disabled" and "Enabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ManagedRuleEnabledState">]
- description: 'Describes the override action to be applied when rule matches. Known
    values are:

    "AnomalyScoring", "Allow", "Block", "Log", "JSChallenge", and "CAPTCHA".'
  name: action
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ActionType">]
- description: 'Describes the override sensitivity to be applied when rule matches.
    Known

    values are: "Low", "Medium", and "High".'
  name: sensitivity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SensitivityType">]
attributes:
- uid: azure.mgmt.network.types.ManagedRuleOverride.action
  name: action
  summary: 'Describes the override action to be applied when rule matches. Known values
    are:

    "AnomalyScoring", "Allow", "Block", "Log", "JSChallenge", and "CAPTCHA".'
  signature: 'action: str | ActionType'
- uid: azure.mgmt.network.types.ManagedRuleOverride.ruleId
  name: ruleId
  summary: Identifier for the managed rule. Required.
  signature: 'ruleId: Required[str]'
- uid: azure.mgmt.network.types.ManagedRuleOverride.sensitivity
  name: sensitivity
  summary: '"Low",

    "Medium", and "High".'
  signature: 'sensitivity: str | SensitivityType'
- uid: azure.mgmt.network.types.ManagedRuleOverride.state
  name: state
  summary: 'The state of the managed rule. Defaults to Disabled if not specified.
    Known values are:

    "Disabled" and "Enabled".'
  signature: 'state: str | ManagedRuleEnabledState'
