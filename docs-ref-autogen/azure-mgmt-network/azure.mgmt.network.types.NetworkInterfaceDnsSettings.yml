### YamlMime:PythonClass
uid: azure.mgmt.network.types.NetworkInterfaceDnsSettings
name: NetworkInterfaceDnsSettings
fullName: azure.mgmt.network.types.NetworkInterfaceDnsSettings
module: azure.mgmt.network.types
summary: DNS settings of a network interface.
constructor:
  syntax: NetworkInterfaceDnsSettings()
variables:
- description: 'List of DNS servers IP addresses. Use ''AzureProvidedDNS'' to switch
    to azure

    provided DNS resolution. ''AzureProvidedDNS'' value cannot be combined with other
    IPs, it must be

    the only value in dnsServers collection.'
  name: dnsServers
  types:
  - <xref:list>[<xref:str>]
- description: 'If the VM that uses this NIC is part of an Availability Set, then
    this

    list will have the union of all DNS servers from all NICs that are part of the
    Availability

    Set. This property is what is configured on each of those VMs.'
  name: appliedDnsServers
  types:
  - <xref:list>[<xref:str>]
- description: 'Relative DNS name for this NIC used for internal communications

    between VMs in the same virtual network.'
  name: internalDnsNameLabel
  types:
  - <xref:str>
- description: 'Fully qualified DNS name supporting internal communications between
    VMs in

    the same virtual network.'
  name: internalFqdn
  types:
  - <xref:str>
- description: 'Even if internalDnsNameLabel is not specified, a DNS entry is

    created for the primary NIC of the VM. This DNS name can be constructed by concatenating
    the VM

    name with the value of internalDomainNameSuffix.'
  name: internalDomainNameSuffix
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.types.NetworkInterfaceDnsSettings.appliedDnsServers
  name: appliedDnsServers
  summary: 'If the VM that uses this NIC is part of an Availability Set, then this
    list will have the union

    of all DNS servers from all NICs that are part of the Availability Set. This property
    is what

    is configured on each of those VMs.'
  signature: 'appliedDnsServers: list[str]'
- uid: azure.mgmt.network.types.NetworkInterfaceDnsSettings.dnsServers
  name: dnsServers
  summary: 'List of DNS servers IP addresses. Use ''AzureProvidedDNS'' to switch to
    azure provided DNS

    resolution. ''AzureProvidedDNS'' value cannot be combined with other IPs, it must
    be the only

    value in dnsServers collection.'
  signature: 'dnsServers: list[str]'
- uid: azure.mgmt.network.types.NetworkInterfaceDnsSettings.internalDnsNameLabel
  name: internalDnsNameLabel
  summary: 'Relative DNS name for this NIC used for internal communications between
    VMs in the same virtual

    network.'
  signature: 'internalDnsNameLabel: str'
- uid: azure.mgmt.network.types.NetworkInterfaceDnsSettings.internalDomainNameSuffix
  name: internalDomainNameSuffix
  summary: 'Even if internalDnsNameLabel is not specified, a DNS entry is created
    for the primary NIC of

    the VM. This DNS name can be constructed by concatenating the VM name with the
    value of

    internalDomainNameSuffix.'
  signature: 'internalDomainNameSuffix: str'
- uid: azure.mgmt.network.types.NetworkInterfaceDnsSettings.internalFqdn
  name: internalFqdn
  summary: 'Fully qualified DNS name supporting internal communications between VMs
    in the same virtual

    network.'
  signature: 'internalFqdn: str'
