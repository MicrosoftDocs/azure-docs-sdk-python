uid: azure.mgmt.network.types.ApplicationGatewayConnectionDraining
name: ApplicationGatewayConnectionDraining
fullName: azure.mgmt.network.types.ApplicationGatewayConnectionDraining
module: azure.mgmt.network.types
summary: 'Connection draining allows open connections to a backend server to be active
  for a specified

  time after the backend server got removed from the configuration.'
constructor:
  syntax: ApplicationGatewayConnectionDraining()
variables:
- description: Whether connection draining is enabled or not. Required.
  name: enabled
  types:
  - <xref:bool>
- description: 'The number of seconds connection draining is active. Acceptable values

    are from 1 second to 3600 seconds. Required.'
  name: drainTimeoutInSec
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.network.types.ApplicationGatewayConnectionDraining.drainTimeoutInSec
  name: drainTimeoutInSec
  summary: 'The number of seconds connection draining is active. Acceptable values
    are from 1 second to

    3600 seconds. Required.'
  signature: 'drainTimeoutInSec: int'
- uid: azure.mgmt.network.types.ApplicationGatewayConnectionDraining.enabled
  name: enabled
  summary: Whether connection draining is enabled or not. Required.
  signature: 'enabled: bool'
