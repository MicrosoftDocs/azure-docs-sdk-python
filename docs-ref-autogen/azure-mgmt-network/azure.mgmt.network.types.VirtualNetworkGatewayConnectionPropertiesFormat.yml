  types:
  - <xref:<xref:"LocalNetworkGateway">>
- description: List of ingress NatRules.
  name: ingressNatRules
  types:
  - <xref:list>[<xref:"SubResource">]
- description: List of egress NatRules.
  name: egressNatRules
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'Gateway connection type. Required. Known values are: "IPsec",

    "Vnet2Vnet", "ExpressRoute", and "VPNClient".'
  name: connectionType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualNetworkGatewayConnectionType">]
