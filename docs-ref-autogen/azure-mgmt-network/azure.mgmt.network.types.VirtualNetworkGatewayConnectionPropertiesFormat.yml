    "IKEv2" and "IKEv1".'
  name: connectionProtocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualNetworkGatewayConnectionProtocol">]
- description: The routing weight.
  name: routingWeight
  types:
  - <xref:int>
