  name: sharedKey
  types:
  - <xref:str>
- description: 'Virtual Network Gateway connection status. Known values are: "Unknown",

    "Connecting", "Connected", and "NotConnected".'
  name: connectionStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualNetworkGatewayConnectionStatus">]
- description: Collection of all tunnels' connection health status.
  name: tunnelConnectionStatus
  types:
  - <xref:list>[<xref:"TunnelConnectionHealth">]
- description: The egress bytes transferred in this connection.
  name: egressBytesTransferred
  types:
  - <xref:int>
- description: The ingress bytes transferred in this connection.
  name: ingressBytesTransferred
  types:
  - <xref:int>
- description: The reference to peerings resource.
  name: peer
  types:
  - <xref:<xref:"SubResource">>
- description: EnableBgp flag.
  name: enableBgp
  types:
  - <xref:bool>
- description: 'GatewayCustomBgpIpAddresses to be used for virtual network

    gateway Connection.'
  name: gatewayCustomBgpIpAddresses
  types:
  - <xref:list>[<xref:"GatewayCustomBgpIpAddressIpConfiguration">]
- description: Use private local Azure IP for the connection.
  name: useLocalAzureIpAddress
  types:
  - <xref:bool>
- description: Enable policy-based traffic selectors.
  name: usePolicyBasedTrafficSelectors
  types:
  - <xref:bool>
- description: The IPSec Policies to be considered by this connection.
  name: ipsecPolicies
  types:
  - <xref:list>[<xref:"IpsecPolicy">]
- description: 'The Traffic Selector Policies to be considered by this

    connection.'
  name: trafficSelectorPolicies
  types:
  - <xref:list>[<xref:"TrafficSelectorPolicy">]
- description: 'The resource GUID property of the virtual network gateway connection

    resource.'
  name: resourceGuid
  types:
  - <xref:str>
- description: 'The provisioning state of the virtual network gateway connection

    resource. Known values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating",
    and

    "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: Bypass ExpressRoute Gateway for data forwarding.
  name: expressRouteGatewayBypass
  types:
  - <xref:bool>
- description: 'Bypass the ExpressRoute gateway when accessing private-links.

    ExpressRoute FastPath (expressRouteGatewayBypass) must be enabled.'
  name: enablePrivateLinkFastPath
  types:
  - <xref:bool>
- description: 'Gateway connection authentication type. Known values are: "PSK" and

    "Certificate".'
  name: authenticationType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectionAuthenticationType">]
- description: 'Certificate Authentication information for a certificate based

    authentication connection.'
  name: certificateAuthentication
  types:
  - <xref:<xref:"CertificateAuthentication">>
- description: 'The routing configuration indicating the associated and propagated

    route tables for this connection.'
  name: routingConfiguration
  types:
  - <xref:<xref:"RoutingConfiguration">>
