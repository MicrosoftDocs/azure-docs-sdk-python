### YamlMime:PythonClass
uid: azure.mgmt.network.types.VirtualNetworkGatewayConnectionPropertiesFormat
name: VirtualNetworkGatewayConnectionPropertiesFormat
fullName: azure.mgmt.network.types.VirtualNetworkGatewayConnectionPropertiesFormat
module: azure.mgmt.network.types
summary: VirtualNetworkGatewayConnection properties.
constructor:
  syntax: VirtualNetworkGatewayConnectionPropertiesFormat()
variables:
- description: The authorizationKey.
  name: authorizationKey
  types:
  - <xref:str>
- description: The reference to virtual network gateway resource. Required.
  name: virtualNetworkGateway1
  types:
  - <xref:<xref:"VirtualNetworkGateway">>
- description: The reference to virtual network gateway resource.
  name: virtualNetworkGateway2
  types:
  - <xref:<xref:"VirtualNetworkGateway">>
- description: The reference to local network gateway resource.
