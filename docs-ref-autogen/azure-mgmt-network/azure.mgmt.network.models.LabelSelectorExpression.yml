uid: azure.mgmt.network.models.LabelSelectorExpression
name: LabelSelectorExpression
fullName: azure.mgmt.network.models.LabelSelectorExpression
module: azure.mgmt.network.models
summary: 'A label selector requirement is a selector that contains values, a key,
  and an operator that

  relates the key and values.'
constructor:
  syntax: 'LabelSelectorExpression(*args: Any, **kwargs: Any)'
variables:
- description: 'key is a string of 63 characters or less, and must consist of alphanumeric

    characters, ''-'', ''_'' or ''.''.'
  name: key
  types:
  - <xref:str>
- description: 'operator represents a key''s relationship to a set of values. Valid
    operators

    are In, NotIn, Exists and DoesNotExist. Known values are: "In", "NotIn", "Exists",
    and

    "DoesNotExist".'
  name: operator
  types:
  - <xref:str>
  - <xref:azure.mgmt.network.models.LabelSelectorOperator>
- description: 'values is an array of string values. If the operator is In or NotIn,
    the

    values array must be non-empty. If the operator is Exists or DoesNotExist, the
    values array

    must be empty.'
  name: values_property
  types:
  - <xref:list>[<xref:str>]
