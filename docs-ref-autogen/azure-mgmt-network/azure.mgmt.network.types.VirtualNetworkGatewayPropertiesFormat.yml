### YamlMime:PythonClass
uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat
name: VirtualNetworkGatewayPropertiesFormat
fullName: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat
module: azure.mgmt.network.types
summary: VirtualNetworkGateway properties.
constructor:
  syntax: VirtualNetworkGatewayPropertiesFormat()
variables:
- description: Autoscale configuration for virutal network gateway.
  name: autoScaleConfiguration
  types:
  - <xref:<xref:"VirtualNetworkGatewayAutoScaleConfiguration">>
- description: IP configurations for virtual network gateway.
  name: ipConfigurations
  types:
  - <xref:list>[<xref:"VirtualNetworkGatewayIPConfiguration">]
- description: 'The type of this virtual network gateway. Known values are: "Vpn",

    "ExpressRoute", and "LocalGateway".'
  name: gatewayType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualNetworkGatewayType">]
- description: 'The type of this virtual network gateway. Known values are: "PolicyBased"
    and

    "RouteBased".'
  name: vpnType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VpnType">]
- description: 'The generation for this VirtualNetworkGateway. Must be None if

    gatewayType is not VPN. Known values are: "None", "Generation1", and "Generation2".'
  name: vpnGatewayGeneration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VpnGatewayGeneration">]
- description: Whether BGP is enabled for this virtual network gateway or not.
  name: enableBgp
  types:
  - <xref:bool>
- description: 'Whether private IP needs to be enabled on this gateway for

    connections or not.'
  name: enablePrivateIpAddress
  types:
  - <xref:bool>
- description: 'The reference to the

    VirtualNetworkGatewayMigrationStatus which represents the status of migration.'
  name: virtualNetworkGatewayMigrationStatus
  types:
  - <xref:<xref:"VirtualNetworkGatewayMigrationStatus">>
- description: ActiveActive flag.
  name: activeActive
  types:
  - <xref:bool>
- description: To enable Advanced Connectivity feature for VPN gateway.
  name: enableHighBandwidthVpnGateway
  types:
  - <xref:bool>
- description: disableIPSecReplayProtection flag.
  name: disableIPSecReplayProtection
  types:
  - <xref:bool>
- description: 'The reference to the LocalNetworkGateway resource which represents

    local network site having default routes. Assign Null value in case of removing
    existing

    default site setting.'
  name: gatewayDefaultSite
  types:
  - <xref:<xref:"SubResource">>
- description: 'The reference to the VirtualNetworkGatewaySku resource which represents
    the SKU

    selected for Virtual network gateway.'
  name: sku
  types:
  - <xref:<xref:"VirtualNetworkGatewaySku">>
- description: 'The reference to the VpnClientConfiguration resource which

    represents the P2S VpnClient configurations.'
  name: vpnClientConfiguration
  types:
  - <xref:<xref:"VpnClientConfiguration">>
- description: 'The reference to the VirtualNetworkGatewayPolicyGroup

    resource which represents the available VirtualNetworkGatewayPolicyGroup for the
    gateway.'
  name: virtualNetworkGatewayPolicyGroups
  types:
  - <xref:list>[<xref:"VirtualNetworkGatewayPolicyGroup">]
- description: Virtual network gateway's BGP speaker settings.
  name: bgpSettings
  types:
  - <xref:<xref:"BgpSettings">>
- description: 'The reference to the address space resource which represents the custom

    routes address space specified by the customer for virtual network gateway and
    VpnClient.'
  name: customRoutes
  types:
  - <xref:<xref:"AddressSpace">>
- description: The resource GUID property of the virtual network gateway resource.
  name: resourceGuid
  types:
  - <xref:str>
- description: 'The provisioning state of the virtual network gateway resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: Whether dns forwarding is enabled or not.
  name: enableDnsForwarding
  types:
  - <xref:bool>
- description: 'The IP address allocated by the gateway to which dns

    requests can be sent.'
  name: inboundDnsForwardingEndpoint
  types:
  - <xref:str>
- description: 'Customer vnet resource id. VirtualNetworkGateway of type

    local gateway is associated with the customer vnet.'
  name: vNetExtendedLocationResourceId
  types:
  - <xref:str>
- description: NatRules for virtual network gateway.
  name: natRules
  types:
  - <xref:list>[<xref:"VirtualNetworkGatewayNatRule">]
- description: EnableBgpRouteTranslationForNat flag.
  name: enableBgpRouteTranslationForNat
  types:
  - <xref:bool>
- description: 'Configures this gateway to accept traffic from remote Virtual WAN

    networks.'
  name: allowVirtualWanTraffic
  types:
  - <xref:bool>
- description: 'Configure this gateway to accept traffic from other Azure Virtual

    Networks. This configuration does not support connectivity to Azure Virtual WAN.'
  name: allowRemoteVnetTraffic
  types:
  - <xref:bool>
- description: 'Property to indicate if the Express Route Gateway serves traffic when
    there

    are multiple Express Route Gateways in the vnet. Known values are: "Enabled" and
    "Disabled".'
  name: adminState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AdminState">]
- description: 'Property to indicate if the Express Route Gateway has resiliency model

    of MultiHomed or SingleHomed. Known values are: "SingleHomed" and "MultiHomed".'
  name: resiliencyModel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ResiliencyModel">]
attributes:
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.activeActive
  name: activeActive
  summary: ActiveActive flag.
  signature: 'activeActive: bool'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.adminState
  name: adminState
  summary: 'Property to indicate if the Express Route Gateway serves traffic when
    there are multiple

    Express Route Gateways in the vnet. Known values are: "Enabled" and "Disabled".'
  signature: 'adminState: str | AdminState'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.allowRemoteVnetTraffic
  name: allowRemoteVnetTraffic
  summary: 'Configure this gateway to accept traffic from other Azure Virtual Networks.
    This configuration

    does not support connectivity to Azure Virtual WAN.'
  signature: 'allowRemoteVnetTraffic: bool'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.allowVirtualWanTraffic
  name: allowVirtualWanTraffic
  summary: Configures this gateway to accept traffic from remote Virtual WAN networks.
  signature: 'allowVirtualWanTraffic: bool'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.autoScaleConfiguration
  name: autoScaleConfiguration
  summary: Autoscale configuration for virutal network gateway.
  signature: 'autoScaleConfiguration: VirtualNetworkGatewayAutoScaleConfiguration'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.bgpSettings
  name: bgpSettings
  summary: Virtual network gateway's BGP speaker settings.
  signature: 'bgpSettings: BgpSettings'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.customRoutes
  name: customRoutes
  summary: 'The reference to the address space resource which represents the custom
    routes address space

    specified by the customer for virtual network gateway and VpnClient.'
  signature: 'customRoutes: AddressSpace'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.disableIPSecReplayProtection
  name: disableIPSecReplayProtection
  summary: disableIPSecReplayProtection flag.
  signature: 'disableIPSecReplayProtection: bool'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.enableBgp
  name: enableBgp
  summary: Whether BGP is enabled for this virtual network gateway or not.
  signature: 'enableBgp: bool'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.enableBgpRouteTranslationForNat
  name: enableBgpRouteTranslationForNat
  summary: EnableBgpRouteTranslationForNat flag.
  signature: 'enableBgpRouteTranslationForNat: bool'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.enableDnsForwarding
  name: enableDnsForwarding
  summary: Whether dns forwarding is enabled or not.
  signature: 'enableDnsForwarding: bool'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.enableHighBandwidthVpnGateway
  name: enableHighBandwidthVpnGateway
  summary: To enable Advanced Connectivity feature for VPN gateway.
  signature: 'enableHighBandwidthVpnGateway: bool'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.enablePrivateIpAddress
  name: enablePrivateIpAddress
  summary: Whether private IP needs to be enabled on this gateway for connections
    or not.
  signature: 'enablePrivateIpAddress: bool'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.gatewayDefaultSite
  name: gatewayDefaultSite
  summary: 'The reference to the LocalNetworkGateway resource which represents local
    network site having

    default routes. Assign Null value in case of removing existing default site setting.'
  signature: 'gatewayDefaultSite: SubResource'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.gatewayType
  name: gatewayType
  summary: '"Vpn", "ExpressRoute", and

    "LocalGateway".'
  signature: 'gatewayType: str | VirtualNetworkGatewayType'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.inboundDnsForwardingEndpoint
  name: inboundDnsForwardingEndpoint
  summary: The IP address allocated by the gateway to which dns requests can be sent.
  signature: 'inboundDnsForwardingEndpoint: str'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.ipConfigurations
  name: ipConfigurations
  summary: IP configurations for virtual network gateway.
  signature: 'ipConfigurations: list[''VirtualNetworkGatewayIPConfiguration'']'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.natRules
  name: natRules
  summary: NatRules for virtual network gateway.
  signature: 'natRules: list[''VirtualNetworkGatewayNatRule'']'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.resiliencyModel
  name: resiliencyModel
  summary: 'Property to indicate if the Express Route Gateway has resiliency model
    of MultiHomed or

    SingleHomed. Known values are: "SingleHomed" and "MultiHomed".'
  signature: 'resiliencyModel: str | ResiliencyModel'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.resourceGuid
  name: resourceGuid
  summary: The resource GUID property of the virtual network gateway resource.
  signature: 'resourceGuid: str'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.sku
  name: sku
  summary: 'The reference to the VirtualNetworkGatewaySku resource which represents
    the SKU selected for

    Virtual network gateway.'
  signature: 'sku: VirtualNetworkGatewaySku'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.vNetExtendedLocationResourceId
  name: vNetExtendedLocationResourceId
  summary: 'Customer vnet resource id. VirtualNetworkGateway of type local gateway
    is associated with the

    customer vnet.'
  signature: 'vNetExtendedLocationResourceId: str'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.virtualNetworkGatewayMigrationStatus
  name: virtualNetworkGatewayMigrationStatus
  summary: 'The reference to the VirtualNetworkGatewayMigrationStatus which represents
    the status of

    migration.'
  signature: 'virtualNetworkGatewayMigrationStatus: VirtualNetworkGatewayMigrationStatus'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.virtualNetworkGatewayPolicyGroups
  name: virtualNetworkGatewayPolicyGroups
  summary: 'The reference to the VirtualNetworkGatewayPolicyGroup resource which represents
    the available

    VirtualNetworkGatewayPolicyGroup for the gateway.'
  signature: 'virtualNetworkGatewayPolicyGroups: list[''VirtualNetworkGatewayPolicyGroup'']'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.vpnClientConfiguration
  name: vpnClientConfiguration
  summary: 'The reference to the VpnClientConfiguration resource which represents
    the P2S VpnClient

    configurations.'
  signature: 'vpnClientConfiguration: VpnClientConfiguration'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.vpnGatewayGeneration
  name: vpnGatewayGeneration
  summary: 'The generation for this VirtualNetworkGateway. Must be None if gatewayType
    is not VPN. Known

    values are: "None", "Generation1", and "Generation2".'
  signature: 'vpnGatewayGeneration: str | VpnGatewayGeneration'
- uid: azure.mgmt.network.types.VirtualNetworkGatewayPropertiesFormat.vpnType
  name: vpnType
  summary: '"PolicyBased" and "RouteBased".'
  signature: 'vpnType: str | VpnType'
