### YamlMime:PythonClass
uid: azure.mgmt.network.types.ApplicationGatewayBackendSettingsPropertiesFormat
name: ApplicationGatewayBackendSettingsPropertiesFormat
fullName: azure.mgmt.network.types.ApplicationGatewayBackendSettingsPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of Backend address pool settings of an application gateway.
constructor:
  syntax: ApplicationGatewayBackendSettingsPropertiesFormat()
variables:
- description: The destination port on the backend.
  name: port
  types:
  - <xref:int>
- description: 'The protocol used to communicate with the backend. Known values are:
    "Http",

    "Https", "Tcp", and "Tls".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewayProtocol">]
- description: 'Connection timeout in seconds. Application Gateway will fail the request
    if

    response is not received within ConnectionTimeout. Acceptable values are from
    1 second to 86400

    seconds.'
  name: timeout
  types:
  - <xref:int>
- description: Probe resource of an application gateway.
  name: probe
  types:
  - <xref:<xref:"SubResource">>
- description: 'Array of references to application gateway trusted root

    certificates.'
  name: trustedRootCertificates
  types:
  - <xref:list>[<xref:"SubResource">]
- description: Server name indication to be sent to the backend servers for Tls protocol.
  name: hostName
  types:
  - <xref:str>
- description: 'Whether to pick server name indication from the host name

    of the backend server for Tls protocol. Default value is false.'
  name: pickHostNameFromBackendAddress
  types:
  - <xref:bool>
- description: 'Whether to send Proxy Protocol header to backend servers

    over TCP or TLS protocols. Default value is false.'
  name: enableL4ClientIpPreservation
  types:
  - <xref:bool>
- description: 'The provisioning state of the backend HTTP settings resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.ApplicationGatewayBackendSettingsPropertiesFormat.enableL4ClientIpPreservation
  name: enableL4ClientIpPreservation
  summary: 'Whether to send Proxy Protocol header to backend servers over TCP or TLS
    protocols. Default

    value is false.'
  signature: 'enableL4ClientIpPreservation: bool'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendSettingsPropertiesFormat.hostName
  name: hostName
  summary: Server name indication to be sent to the backend servers for Tls protocol.
  signature: 'hostName: str'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendSettingsPropertiesFormat.pickHostNameFromBackendAddress
  name: pickHostNameFromBackendAddress
  summary: 'Whether to pick server name indication from the host name of the backend
    server for Tls

    protocol. Default value is false.'
  signature: 'pickHostNameFromBackendAddress: bool'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendSettingsPropertiesFormat.port
  name: port
  summary: The destination port on the backend.
  signature: 'port: int'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendSettingsPropertiesFormat.probe
  name: probe
  summary: Probe resource of an application gateway.
  signature: 'probe: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendSettingsPropertiesFormat.protocol
  name: protocol
  summary: '"Http", "Https",

    "Tcp", and "Tls".'
  signature: 'protocol: str | ApplicationGatewayProtocol'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendSettingsPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendSettingsPropertiesFormat.timeout
  name: timeout
  summary: 'Connection timeout in seconds. Application Gateway will fail the request
    if response is not

    received within ConnectionTimeout. Acceptable values are from 1 second to 86400
    seconds.'
  signature: 'timeout: int'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendSettingsPropertiesFormat.trustedRootCertificates
  name: trustedRootCertificates
  summary: Array of references to application gateway trusted root certificates.
  signature: 'trustedRootCertificates: list[''SubResource'']'
