### YamlMime:PythonClass
uid: azure.mgmt.network.types.NetworkInterfacePropertiesFormat
name: NetworkInterfacePropertiesFormat
fullName: azure.mgmt.network.types.NetworkInterfacePropertiesFormat
module: azure.mgmt.network.types
summary: NetworkInterface properties.
constructor:
  syntax: NetworkInterfacePropertiesFormat()
variables:
- description: The reference to a virtual machine.
  name: virtualMachine
  types:
  - <xref:<xref:"SubResource">>
- description: The reference to the NetworkSecurityGroup resource.
  name: networkSecurityGroup
  types:
  - <xref:<xref:"NetworkSecurityGroup">>
- description: 'A reference to the private endpoint to which the network interface
    is

    linked.'
  name: privateEndpoint
  types:
  - <xref:<xref:"PrivateEndpoint">>
- description: A list of IPConfigurations of the network interface.
  name: ipConfigurations
  types:
  - <xref:list>[<xref:"NetworkInterfaceIPConfiguration">]
- description: A list of TapConfigurations of the network interface.
  name: tapConfigurations
  types:
  - <xref:list>[<xref:"NetworkInterfaceTapConfiguration">]
- description: The DNS settings in network interface.
  name: dnsSettings
  types:
  - <xref:<xref:"NetworkInterfaceDnsSettings">>
- description: The MAC address of the network interface.
  name: macAddress
  types:
  - <xref:str>
- description: Whether this is a primary network interface on a virtual machine.
  name: primary
  types:
  - <xref:bool>
