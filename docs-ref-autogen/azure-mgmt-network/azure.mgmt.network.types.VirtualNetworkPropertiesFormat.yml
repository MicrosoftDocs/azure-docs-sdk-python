### YamlMime:PythonClass
uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat
name: VirtualNetworkPropertiesFormat
fullName: azure.mgmt.network.types.VirtualNetworkPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of the virtual network.
constructor:
  syntax: VirtualNetworkPropertiesFormat()
variables:
- description: 'The AddressSpace that contains an array of IP address ranges that
    can be

    used by subnets.'
  name: addressSpace
  types:
  - <xref:<xref:"AddressSpace">>
- description: 'The dhcpOptions that contains an array of DNS servers available to
    VMs

    deployed in the virtual network.'
  name: dhcpOptions
  types:
  - <xref:<xref:"DhcpOptions">>
- description: The FlowTimeout value (in minutes) for the Virtual Network.
  name: flowTimeoutInMinutes
  types:
  - <xref:int>
- description: A list of subnets in a Virtual Network.
  name: subnets
  types:
  - <xref:list>[<xref:"Subnet">]
- description: A list of peerings in a Virtual Network.
  name: virtualNetworkPeerings
  types:
  - <xref:list>[<xref:"VirtualNetworkPeering">]
- description: The resourceGuid property of the Virtual Network resource.
  name: resourceGuid
  types:
  - <xref:str>
- description: 'The provisioning state of the virtual network resource. Known values

    are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Indicates if DDoS protection is enabled for all the protected

    resources in the virtual network. It requires a DDoS protection plan associated
    with the

    resource.'
  name: enableDdosProtection
  types:
  - <xref:bool>
- description: 'Indicates if VM protection is enabled for all the subnets in the

    virtual network.'
  name: enableVmProtection
  types:
  - <xref:bool>
- description: The DDoS protection plan associated with the virtual network.
  name: ddosProtectionPlan
  types:
  - <xref:<xref:"SubResource">>
- description: 'Bgp Communities sent over ExpressRoute with each route corresponding
    to a

    prefix in this VNET.'
  name: bgpCommunities
  types:
  - <xref:<xref:"VirtualNetworkBgpCommunities">>
- description: 'Indicates if encryption is enabled on virtual network and if VM without

    encryption is allowed in encrypted VNet.'
  name: encryption
  types:
  - <xref:<xref:"VirtualNetworkEncryption">>
- description: Array of IpAllocation which reference this VNET.
  name: ipAllocations
  types:
  - <xref:list>[<xref:"SubResource">]
- description: A collection of references to flow log resources.
  name: flowLogs
  types:
  - <xref:list>[<xref:"FlowLog">]
- description: 'Private Endpoint VNet Policies. Known values are: "Disabled"

    and "Basic".'
  name: privateEndpointVNetPolicies
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PrivateEndpointVNetPolicies">]
- description: 'A reference to the default public nat gateway being used by this

    virtual network resource.'
  name: defaultPublicNatGateway
  types:
  - <xref:<xref:"SubResource">>
- description: 'A configurable list of summarized gateway prefixes advertised

    for the virtual network.'
  name: summarizedGatewayPrefixes
  types:
  - <xref:<xref:"AddressSpace">>
attributes:
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.addressSpace
  name: addressSpace
  summary: The AddressSpace that contains an array of IP address ranges that can be
    used by subnets.
  signature: 'addressSpace: AddressSpace'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.bgpCommunities
  name: bgpCommunities
  summary: Bgp Communities sent over ExpressRoute with each route corresponding to
    a prefix in this VNET.
  signature: 'bgpCommunities: VirtualNetworkBgpCommunities'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.ddosProtectionPlan
  name: ddosProtectionPlan
  summary: The DDoS protection plan associated with the virtual network.
  signature: 'ddosProtectionPlan: SubResource'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.defaultPublicNatGateway
  name: defaultPublicNatGateway
  summary: A reference to the default public nat gateway being used by this virtual
    network resource.
  signature: 'defaultPublicNatGateway: SubResource'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.dhcpOptions
  name: dhcpOptions
  summary: 'The dhcpOptions that contains an array of DNS servers available to VMs
    deployed in the virtual

    network.'
  signature: 'dhcpOptions: DhcpOptions'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.enableDdosProtection
  name: enableDdosProtection
  summary: 'Indicates if DDoS protection is enabled for all the protected resources
    in the virtual network.

    It requires a DDoS protection plan associated with the resource.'
  signature: 'enableDdosProtection: bool'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.enableVmProtection
  name: enableVmProtection
  summary: Indicates if VM protection is enabled for all the subnets in the virtual
    network.
  signature: 'enableVmProtection: bool'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.encryption
  name: encryption
  summary: 'Indicates if encryption is enabled on virtual network and if VM without
    encryption is allowed

    in encrypted VNet.'
  signature: 'encryption: VirtualNetworkEncryption'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.flowLogs
  name: flowLogs
  summary: A collection of references to flow log resources.
  signature: 'flowLogs: list[''FlowLog'']'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.flowTimeoutInMinutes
  name: flowTimeoutInMinutes
  summary: The FlowTimeout value (in minutes) for the Virtual Network.
  signature: 'flowTimeoutInMinutes: int'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.ipAllocations
  name: ipAllocations
  summary: Array of IpAllocation which reference this VNET.
  signature: 'ipAllocations: list[''SubResource'']'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.privateEndpointVNetPolicies
  name: privateEndpointVNetPolicies
  summary: '"Disabled" and "Basic".'
  signature: 'privateEndpointVNetPolicies: str | PrivateEndpointVNetPolicies'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.resourceGuid
  name: resourceGuid
  summary: The resourceGuid property of the Virtual Network resource.
  signature: 'resourceGuid: str'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.subnets
  name: subnets
  summary: A list of subnets in a Virtual Network.
  signature: 'subnets: list[''Subnet'']'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.summarizedGatewayPrefixes
  name: summarizedGatewayPrefixes
  summary: A configurable list of summarized gateway prefixes advertised for the virtual
    network.
  signature: 'summarizedGatewayPrefixes: AddressSpace'
- uid: azure.mgmt.network.types.VirtualNetworkPropertiesFormat.virtualNetworkPeerings
  name: virtualNetworkPeerings
  summary: A list of peerings in a Virtual Network.
  signature: 'virtualNetworkPeerings: list[''VirtualNetworkPeering'']'
