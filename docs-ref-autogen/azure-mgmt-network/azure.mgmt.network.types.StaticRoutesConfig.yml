### YamlMime:PythonClass
uid: azure.mgmt.network.types.StaticRoutesConfig
name: StaticRoutesConfig
fullName: azure.mgmt.network.types.StaticRoutesConfig
module: azure.mgmt.network.types
summary: 'Configuration for static routes on this HubVnetConnectionConfiguration for
  static routes on

  this HubVnetConnection.'
constructor:
  syntax: StaticRoutesConfig()
variables:
- description: 'Boolean indicating whether static routes on this connection are

    automatically propagate to route tables which this connection propagates to.'
  name: propagateStaticRoutes
  types:
  - <xref:bool>
- description: 'Parameter determining whether NVA in spoke vnet is

    bypassed for traffic with destination in spoke. Known values are: "Contains" and
    "Equal".'
  name: vnetLocalRouteOverrideCriteria
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VnetLocalRouteOverrideCriteria">]
attributes:
- uid: azure.mgmt.network.types.StaticRoutesConfig.propagateStaticRoutes
  name: propagateStaticRoutes
  summary: 'Boolean indicating whether static routes on this connection are automatically
    propagate to

    route tables which this connection propagates to.'
  signature: 'propagateStaticRoutes: bool'
- uid: azure.mgmt.network.types.StaticRoutesConfig.vnetLocalRouteOverrideCriteria
  name: vnetLocalRouteOverrideCriteria
  summary: 'Parameter determining whether NVA in spoke vnet is bypassed for traffic
    with destination in

    spoke. Known values are: "Contains" and "Equal".'
  signature: 'vnetLocalRouteOverrideCriteria: str | VnetLocalRouteOverrideCriteria'
