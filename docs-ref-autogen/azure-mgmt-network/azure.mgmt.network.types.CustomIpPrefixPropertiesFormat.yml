### YamlMime:PythonClass
uid: azure.mgmt.network.types.CustomIpPrefixPropertiesFormat
name: CustomIpPrefixPropertiesFormat
fullName: azure.mgmt.network.types.CustomIpPrefixPropertiesFormat
module: azure.mgmt.network.types
summary: Custom IP prefix properties.
constructor:
  syntax: CustomIpPrefixPropertiesFormat()
variables:
- description: The ASN for CIDR advertising. Should be an integer as string.
  name: asn
  types:
  - <xref:str>
- description: 'The prefix range in CIDR notation. Should include the start address
    and the prefix

    length.'
  name: cidr
  types:
  - <xref:str>
- description: Signed message for WAN validation.
  name: signedMessage
  types:
  - <xref:str>
- description: Authorization message for WAN validation.
  name: authorizationMessage
  types:
  - <xref:str>
- description: The Parent CustomIpPrefix for IPv6 /64 CustomIpPrefix.
  name: customIpPrefixParent
  types:
  - <xref:<xref:"SubResource">>
- description: The list of all Children for IPv6 /48 CustomIpPrefix.
  name: childCustomIpPrefixes
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'The commissioned state of the Custom IP Prefix. Known values are:

    "Provisioning", "Provisioned", "Commissioning", "CommissionedNoInternetAdvertise",

    "Commissioned", "Decommissioning", "Deprovisioning", and "Deprovisioned".'
  name: commissionedState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CommissionedState">]
- description: Whether to do express route advertise.
  name: expressRouteAdvertise
  types:
  - <xref:bool>
- description: 'The Geo for CIDR advertising. Should be an Geo code. Known values
    are: "GLOBAL",

    "AFRI", "APAC", "EURO", "LATAM", "NAM", "ME", "OCEANIA", and "AQ".'
  name: geo
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Geo">]
- description: Whether to Advertise the range to Internet.
  name: noInternetAdvertise
  types:
  - <xref:bool>
- description: 'Type of custom IP prefix. Should be Singular, Parent, or Child. Known
    values

    are: "Singular", "Parent", and "Child".'
  name: prefixType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CustomIpPrefixType">]
- description: The list of all referenced PublicIpPrefixes.
  name: publicIpPrefixes
  types:
  - <xref:list>[<xref:"SubResource">]
- description: The resource GUID property of the custom IP prefix resource.
  name: resourceGuid
  types:
  - <xref:str>
- description: The reason why resource is in failed state.
  name: failedReason
  types:
  - <xref:str>
- description: 'The provisioning state of the custom IP prefix resource. Known values

    are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
