### YamlMime:PythonClass
uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat
name: LoadBalancingRulePropertiesFormat
fullName: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat
module: azure.mgmt.network.types
summary: Properties of the load balancer.
constructor:
  syntax: LoadBalancingRulePropertiesFormat()
variables:
- description: A reference to frontend IP addresses.
  name: frontendIPConfiguration
  types:
  - <xref:<xref:"SubResource">>
- description: 'A reference to a pool of DIPs. Inbound traffic is randomly load

    balanced across IPs in the backend IPs.'
  name: backendAddressPool
  types:
  - <xref:<xref:"SubResource">>
- description: An array of references to pool of DIPs.
  name: backendAddressPools
  types:
  - <xref:list>[<xref:"SubResource">]
- description: The reference to the load balancer probe used by the load balancing
    rule.
  name: probe
  types:
  - <xref:<xref:"SubResource">>
- description: 'The reference to the transport protocol used by the load balancing
    rule.

    Required. Known values are: "Udp", "Tcp", "All", and "Quic".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TransportProtocol">]
- description: 'The load distribution policy for this rule. Known values are:

    "Default", "SourceIP", and "SourceIPProtocol".'
  name: loadDistribution
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LoadDistribution">]
- description: 'The port for the external endpoint. Port numbers for each rule must
    be

    unique within the Load Balancer. Acceptable values are between 0 and 65534. Note
    that value 0

    enables "Any Port". Required.'
  name: frontendPort
  types:
  - <xref:int>
- description: 'The port used for internal connections on the endpoint. Acceptable
    values

    are between 0 and 65535. Note that value 0 enables "Any Port".'
  name: backendPort
  types:
  - <xref:int>
- description: 'The timeout for the TCP idle connection. The value can be set

    between 4 and 30 minutes. The default value is 4 minutes. This element is only
    used when the

    protocol is set to TCP.'
  name: idleTimeoutInMinutes
  types:
  - <xref:int>
- description: 'Configures a virtual machine''s endpoint for the floating IP capability

    required to configure a SQL AlwaysOn Availability Group. This setting is required
    when using

    the SQL AlwaysOn Availability Groups in SQL server. This setting can''t be changed
    after you

    create the endpoint.'
  name: enableFloatingIP
  types:
  - <xref:bool>
- description: 'Receive bidirectional TCP Reset on TCP flow idle timeout or unexpected

    connection termination. This element is only used when the protocol is set to
    TCP.'
  name: enableTcpReset
  types:
  - <xref:bool>
- description: 'Configures SNAT for the VMs in the backend pool to use the publicIP

    address specified in the frontend of the load balancing rule.'
  name: disableOutboundSnat
  types:
  - <xref:bool>
- description: 'Enables UDP flow tracking for the load balancing rule. This

    property is retained for rule-level configuration compatibility. When enableConnectionTracking

    is specified on the associated frontend IP configuration, the frontend setting
    takes

    precedence.'
  name: enableConnectionTracking
  types:
  - <xref:bool>
- description: 'The provisioning state of the load balancing rule resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.backendAddressPool
  name: backendAddressPool
  summary: 'A reference to a pool of DIPs. Inbound traffic is randomly load balanced
    across IPs in the

    backend IPs.'
  signature: 'backendAddressPool: SubResource'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.backendAddressPools
  name: backendAddressPools
  summary: An array of references to pool of DIPs.
  signature: 'backendAddressPools: list[''SubResource'']'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.backendPort
  name: backendPort
  summary: 'The port used for internal connections on the endpoint. Acceptable values
    are between 0 and

    65535. Note that value 0 enables "Any Port".'
  signature: 'backendPort: int'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.disableOutboundSnat
  name: disableOutboundSnat
  summary: 'Configures SNAT for the VMs in the backend pool to use the publicIP address
    specified in the

    frontend of the load balancing rule.'
  signature: 'disableOutboundSnat: bool'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.enableConnectionTracking
  name: enableConnectionTracking
  summary: 'Enables UDP flow tracking for the load balancing rule. This property is
    retained for rule-level

    configuration compatibility. When enableConnectionTracking is specified on the
    associated

    frontend IP configuration, the frontend setting takes precedence.'
  signature: 'enableConnectionTracking: bool'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.enableFloatingIP
  name: enableFloatingIP
  summary: 'Configures a virtual machine''s endpoint for the floating IP capability
    required to configure a

    SQL AlwaysOn Availability Group. This setting is required when using the SQL AlwaysOn

    Availability Groups in SQL server. This setting can''t be changed after you create
    the endpoint.'
  signature: 'enableFloatingIP: bool'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.enableTcpReset
  name: enableTcpReset
  summary: 'Receive bidirectional TCP Reset on TCP flow idle timeout or unexpected
    connection termination.

    This element is only used when the protocol is set to TCP.'
  signature: 'enableTcpReset: bool'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.frontendIPConfiguration
  name: frontendIPConfiguration
  summary: A reference to frontend IP addresses.
  signature: 'frontendIPConfiguration: SubResource'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.frontendPort
  name: frontendPort
  summary: 'The port for the external endpoint. Port numbers for each rule must be
    unique within the Load

    Balancer. Acceptable values are between 0 and 65534. Note that value 0 enables
    "Any Port".

    Required.'
  signature: 'frontendPort: Required[int]'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.idleTimeoutInMinutes
  name: idleTimeoutInMinutes
  summary: 'The timeout for the TCP idle connection. The value can be set between
    4 and 30 minutes. The

    default value is 4 minutes. This element is only used when the protocol is set
    to TCP.'
  signature: 'idleTimeoutInMinutes: int'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.loadDistribution
  name: loadDistribution
  summary: '"Default", "SourceIP", and

    "SourceIPProtocol".'
  signature: 'loadDistribution: str | LoadDistribution'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.probe
  name: probe
  summary: The reference to the load balancer probe used by the load balancing rule.
  signature: 'probe: SubResource'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.protocol
  name: protocol
  summary: 'The reference to the transport protocol used by the load balancing rule.
    Required. Known values

    are: "Udp", "Tcp", "All", and "Quic".'
  signature: 'protocol: Required[str | TransportProtocol]'
- uid: azure.mgmt.network.types.LoadBalancingRulePropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
