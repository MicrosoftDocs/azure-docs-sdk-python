### YamlMime:PythonClass
uid: azure.mgmt.network.types.ConnectionAnalyzerProperties
name: ConnectionAnalyzerProperties
fullName: azure.mgmt.network.types.ConnectionAnalyzerProperties
module: azure.mgmt.network.types
summary: Properties of a connection analyzer.
constructor:
  syntax: ConnectionAnalyzerProperties()
variables:
- description: Source endpoint of the connection analyzer. Required.
  name: source
  types:
  - <xref:<xref:"ConnectionAnalyzerEndpoint">>
- description: Destination endpoint of the connection analyzer. Required.
  name: destination
  types:
  - <xref:<xref:"ConnectionAnalyzerEndpoint">>
- description: List of diagnostic operations to run. Required.
  name: diagnosticOperations
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"DiagnosticOperation">]]
- description: Protocol-level settings.
  name: protocolSettings
  types:
  - <xref:<xref:"ProtocolSettings">>
- description: Per-operation diagnostic settings.
  name: diagnosticOperationsSettings
  types:
  - <xref:<xref:"DiagnosticOperationsSettings">>
- description: Time-to-live (days) before the analyzer expires.
  name: expiryInDays
  types:
  - <xref:int>
- description: Output settings (e.g. storage account).
  name: outputSettings
  types:
  - <xref:<xref:"OutputSettings">>
- description: UTC time when the connection analyzer request was received.
  name: requestTime
  types:
  - <xref:str>
- description: 'The provisioning state of the connection analyzer resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Current execution status of the connection analyzer. Known values
    are:

    "NotStarted", "Running", "Succeeded", and "Failed".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectionAnalyzerStatus">]
attributes:
- uid: azure.mgmt.network.types.ConnectionAnalyzerProperties.destination
  name: destination
  summary: Destination endpoint of the connection analyzer. Required.
  signature: 'destination: Required[ConnectionAnalyzerEndpoint]'
- uid: azure.mgmt.network.types.ConnectionAnalyzerProperties.diagnosticOperations
  name: diagnosticOperations
  summary: List of diagnostic operations to run. Required.
  signature: 'diagnosticOperations: Union[str, ForwardRef(''DiagnosticOperation'')]]]'
- uid: azure.mgmt.network.types.ConnectionAnalyzerProperties.diagnosticOperationsSettings
  name: diagnosticOperationsSettings
  summary: Per-operation diagnostic settings.
  signature: 'diagnosticOperationsSettings: DiagnosticOperationsSettings'
- uid: azure.mgmt.network.types.ConnectionAnalyzerProperties.expiryInDays
  name: expiryInDays
  summary: Time-to-live (days) before the analyzer expires.
  signature: 'expiryInDays: int'
- uid: azure.mgmt.network.types.ConnectionAnalyzerProperties.outputSettings
  name: outputSettings
  summary: Output settings (e.g. storage account).
  signature: 'outputSettings: OutputSettings'
- uid: azure.mgmt.network.types.ConnectionAnalyzerProperties.protocolSettings
  name: protocolSettings
  summary: Protocol-level settings.
  signature: 'protocolSettings: ProtocolSettings'
- uid: azure.mgmt.network.types.ConnectionAnalyzerProperties.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.ConnectionAnalyzerProperties.requestTime
  name: requestTime
  summary: UTC time when the connection analyzer request was received.
  signature: 'requestTime: str'
- uid: azure.mgmt.network.types.ConnectionAnalyzerProperties.source
  name: source
  summary: Source endpoint of the connection analyzer. Required.
  signature: 'source: Required[ConnectionAnalyzerEndpoint]'
- uid: azure.mgmt.network.types.ConnectionAnalyzerProperties.status
  name: status
  summary: '"NotStarted",

    "Running", "Succeeded", and "Failed".'
  signature: 'status: str | ConnectionAnalyzerStatus'
