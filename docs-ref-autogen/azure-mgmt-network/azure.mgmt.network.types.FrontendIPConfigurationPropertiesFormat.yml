### YamlMime:PythonClass
uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat
name: FrontendIPConfigurationPropertiesFormat
fullName: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of Frontend IP Configuration of the load balancer.
constructor:
  syntax: FrontendIPConfigurationPropertiesFormat()
variables:
- description: An array of references to inbound rules that use this frontend IP.
  name: inboundNatRules
  types:
  - <xref:list>[<xref:"SubResource">]
- description: An array of references to inbound pools that use this frontend IP.
  name: inboundNatPools
  types:
  - <xref:list>[<xref:"SubResource">]
- description: An array of references to outbound rules that use this frontend IP.
  name: outboundRules
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'An array of references to load balancing rules that use this frontend

    IP.'
  name: loadBalancingRules
  types:
  - <xref:list>[<xref:"SubResource">]
- description: The private IP address of the IP configuration.
  name: privateIPAddress
  types:
  - <xref:str>
- description: 'The Private IP allocation method. Known values are: "Static"

    and "Dynamic".'
  name: privateIPAllocationMethod
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IPAllocationMethod">]
- description: 'Whether the specific ipconfiguration is IPv4 or IPv6. Default is

    taken as IPv4. Known values are: "IPv4" and "IPv6".'
  name: privateIPAddressVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IPVersion">]
- description: The reference to the subnet resource.
  name: subnet
  types:
  - <xref:<xref:"Subnet">>
- description: The reference to the Public IP resource.
  name: publicIPAddress
  types:
  - <xref:<xref:"PublicIPAddress">>
- description: The reference to the Public IP Prefix resource.
  name: publicIPPrefix
  types:
  - <xref:<xref:"SubResource">>
- description: The reference to gateway load balancer frontend IP.
  name: gatewayLoadBalancer
  types:
  - <xref:<xref:"SubResource">>
- description: 'The provisioning state of the frontend IP configuration resource.

    Known values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and
    "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The DDoS protection settings associated with the frontend IP configuration.
  name: ddosSettings
  types:
  - <xref:<xref:"DdosFrontendIpConfigurationSettings">>
- description: 'Enables UDP flow tracking for traffic associated with the

    frontend IP configuration. When enabled, packets belonging to the same UDP flow
    are

    consistently directed to the same backend instance. This setting applies to all
    associated load

    balancing rules and takes precedence over rule-level enableConnectionTracking
    settings.'
  name: enableConnectionTracking
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.ddosSettings
  name: ddosSettings
  summary: The DDoS protection settings associated with the frontend IP configuration.
  signature: 'ddosSettings: DdosFrontendIpConfigurationSettings'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.enableConnectionTracking
  name: enableConnectionTracking
  summary: 'Enables UDP flow tracking for traffic associated with the frontend IP
    configuration. When

    enabled, packets belonging to the same UDP flow are consistently directed to the
    same backend

    instance. This setting applies to all associated load balancing rules and takes
    precedence over

    rule-level enableConnectionTracking settings.'
  signature: 'enableConnectionTracking: bool'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.gatewayLoadBalancer
  name: gatewayLoadBalancer
  summary: The reference to gateway load balancer frontend IP.
  signature: 'gatewayLoadBalancer: SubResource'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.inboundNatPools
  name: inboundNatPools
  summary: An array of references to inbound pools that use this frontend IP.
  signature: 'inboundNatPools: list[''SubResource'']'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.inboundNatRules
  name: inboundNatRules
  summary: An array of references to inbound rules that use this frontend IP.
  signature: 'inboundNatRules: list[''SubResource'']'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.loadBalancingRules
  name: loadBalancingRules
  summary: An array of references to load balancing rules that use this frontend IP.
  signature: 'loadBalancingRules: list[''SubResource'']'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.outboundRules
  name: outboundRules
  summary: An array of references to outbound rules that use this frontend IP.
  signature: 'outboundRules: list[''SubResource'']'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.privateIPAddress
  name: privateIPAddress
  summary: The private IP address of the IP configuration.
  signature: 'privateIPAddress: str'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.privateIPAddressVersion
  name: privateIPAddressVersion
  summary: 'Whether the specific ipconfiguration is IPv4 or IPv6. Default is taken
    as IPv4. Known values

    are: "IPv4" and "IPv6".'
  signature: 'privateIPAddressVersion: str | IPVersion'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.privateIPAllocationMethod
  name: privateIPAllocationMethod
  summary: '"Static" and "Dynamic".'
  signature: 'privateIPAllocationMethod: str | IPAllocationMethod'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.publicIPAddress
  name: publicIPAddress
  summary: The reference to the Public IP resource.
  signature: 'publicIPAddress: PublicIPAddress'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.publicIPPrefix
  name: publicIPPrefix
  summary: The reference to the Public IP Prefix resource.
  signature: 'publicIPPrefix: SubResource'
- uid: azure.mgmt.network.types.FrontendIPConfigurationPropertiesFormat.subnet
  name: subnet
  summary: The reference to the subnet resource.
  signature: 'subnet: Subnet'
