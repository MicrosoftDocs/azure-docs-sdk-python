### YamlMime:PythonClass
uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat
name: ApplicationGatewayProbePropertiesFormat
fullName: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat
module: azure.mgmt.network.types
summary: Properties of probe of an application gateway.
constructor:
  syntax: ApplicationGatewayProbePropertiesFormat()
variables:
- description: 'The protocol used for the probe. Known values are: "Http", "Https",
    "Tcp", and

    "Tls".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewayProtocol">]
- description: Host name to send the probe to.
  name: host
  types:
  - <xref:str>
- description: 'Relative path of probe. Valid path starts from ''/''. Probe is sent
    to

    <Protocol>://<host>:<port><path>.'
  name: path
  types:
  - <xref:str>
- description: 'The probing interval in seconds. This is the time interval between
    two

    consecutive probes. Acceptable values are from 1 second to 86400 seconds.'
  name: interval
  types:
  - <xref:int>
- description: 'The probe timeout in seconds. Probe marked as failed if valid response
    is not

    received with this timeout period. Acceptable values are from 1 second to 86400
    seconds.'
  name: timeout
  types:
  - <xref:int>
- description: 'The probe retry count. Backend server is marked down after

    consecutive probe failure count reaches UnhealthyThreshold. Acceptable values
    are from 1 second

    to 20.'
  name: unhealthyThreshold
  types:
  - <xref:int>
- description: 'Whether the host header should be picked from the

    backend http settings. Default value is false.'
  name: pickHostNameFromBackendHttpSettings
  types:
  - <xref:bool>
- description: 'Whether the server name indication should be picked from

    the backend settings for Tls protocol. Default value is false.'
  name: pickHostNameFromBackendSettings
  types:
  - <xref:bool>
- description: Minimum number of servers that are always marked healthy. Default value
    is 0.
  name: minServers
  types:
  - <xref:int>
- description: Criterion for classifying a healthy probe response.
  name: match
  types:
  - <xref:<xref:"ApplicationGatewayProbeHealthResponseMatch">>
- description: 'Whether to send Proxy Protocol header along with the

    Health Probe over TCP or TLS protocol. Default value is false.'
  name: enableProbeProxyProtocolHeader
  types:
  - <xref:bool>
- description: 'The provisioning state of the probe resource. Known values are:

    "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Custom port which will be used for probing the backend servers. The
    valid value

    ranges from 1 to 65535. In case not set, port from http settings will be used.
    This property is

    valid for Basic, Standard_v2 and WAF_v2 only.'
  name: port
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.enableProbeProxyProtocolHeader
  name: enableProbeProxyProtocolHeader
  summary: 'Whether to send Proxy Protocol header along with the Health Probe over
    TCP or TLS protocol.

    Default value is false.'
  signature: 'enableProbeProxyProtocolHeader: bool'
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.host
  name: host
  summary: Host name to send the probe to.
  signature: 'host: str'
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.interval
  name: interval
  summary: 'The probing interval in seconds. This is the time interval between two
    consecutive probes.

    Acceptable values are from 1 second to 86400 seconds.'
  signature: 'interval: int'
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.match
  name: match
  summary: Criterion for classifying a healthy probe response.
  signature: 'match: ApplicationGatewayProbeHealthResponseMatch'
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.minServers
  name: minServers
  summary: Minimum number of servers that are always marked healthy. Default value
    is 0.
  signature: 'minServers: int'
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.path
  name: path
  summary: 'Relative path of probe. Valid path starts from ''/''. Probe is sent to

    <Protocol>://<host>:<port><path>.'
  signature: 'path: str'
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.pickHostNameFromBackendHttpSettings
  name: pickHostNameFromBackendHttpSettings
  summary: 'Whether the host header should be picked from the backend http settings.
    Default value is

    false.'
  signature: 'pickHostNameFromBackendHttpSettings: bool'
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.pickHostNameFromBackendSettings
  name: pickHostNameFromBackendSettings
  summary: 'Whether the server name indication should be picked from the backend settings
    for Tls protocol.

    Default value is false.'
  signature: 'pickHostNameFromBackendSettings: bool'
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.port
  name: port
  summary: 'Custom port which will be used for probing the backend servers. The valid
    value ranges from 1

    to 65535. In case not set, port from http settings will be used. This property
    is valid for

    Basic, Standard_v2 and WAF_v2 only.'
  signature: 'port: int'
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.protocol
  name: protocol
  summary: '"Http", "Https", "Tcp", and "Tls".'
  signature: 'protocol: str | ApplicationGatewayProtocol'
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed", "Succeeded",

    "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.timeout
  name: timeout
  summary: 'The probe timeout in seconds. Probe marked as failed if valid response
    is not received with

    this timeout period. Acceptable values are from 1 second to 86400 seconds.'
  signature: 'timeout: int'
- uid: azure.mgmt.network.types.ApplicationGatewayProbePropertiesFormat.unhealthyThreshold
  name: unhealthyThreshold
  summary: 'The probe retry count. Backend server is marked down after consecutive
    probe failure count

    reaches UnhealthyThreshold. Acceptable values are from 1 second to 20.'
  signature: 'unhealthyThreshold: int'
