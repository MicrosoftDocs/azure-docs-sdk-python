  signature: 'localPort: str'
- uid: azure.mgmt.network.types.PacketCaptureFilter.protocol
  name: protocol
  summary: '"TCP", "UDP", and "Any".'
  signature: 'protocol: str | PcProtocol'
- uid: azure.mgmt.network.types.PacketCaptureFilter.remoteIPAddress
  name: remoteIPAddress
  summary: '"127.0.0.1" for single address entry.

