### YamlMime:PythonClass
uid: azure.mgmt.network.types.InboundNatPoolPropertiesFormat
name: InboundNatPoolPropertiesFormat
fullName: azure.mgmt.network.types.InboundNatPoolPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of Inbound NAT pool.
constructor:
  syntax: InboundNatPoolPropertiesFormat()
variables:
- description: A reference to frontend IP addresses.
  name: frontendIPConfiguration
  types:
  - <xref:<xref:"SubResource">>
- description: 'The reference to the transport protocol used by the inbound NAT pool.
    Required.

    Known values are: "Udp", "Tcp", "All", and "Quic".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TransportProtocol">]
- description: 'The first port number in the range of external ports that will be

    used to provide Inbound Nat to NICs associated with a load balancer. Acceptable
    values range

    between 1 and 65534. Required.'
  name: frontendPortRangeStart
  types:
  - <xref:int>
- description: 'The last port number in the range of external ports that will be

    used to provide Inbound Nat to NICs associated with a load balancer. Acceptable
    values range

    between 1 and 65535. Required.'
  name: frontendPortRangeEnd
  types:
  - <xref:int>
- description: 'The port used for internal connections on the endpoint. Acceptable
    values

    are between 1 and 65535. Required.'
  name: backendPort
  types:
  - <xref:int>
- description: 'The timeout for the TCP idle connection. The value can be set

    between 4 and 30 minutes. The default value is 4 minutes. This element is only
    used when the

    protocol is set to TCP.'
  name: idleTimeoutInMinutes
  types:
  - <xref:int>
- description: 'Configures a virtual machine''s endpoint for the floating IP capability

    required to configure a SQL AlwaysOn Availability Group. This setting is required
    when using

    the SQL AlwaysOn Availability Groups in SQL server. This setting can''t be changed
    after you

    create the endpoint.'
  name: enableFloatingIP
  types:
  - <xref:bool>
- description: 'Receive bidirectional TCP Reset on TCP flow idle timeout or unexpected

    connection termination. This element is only used when the protocol is set to
    TCP.'
  name: enableTcpReset
  types:
  - <xref:bool>
- description: 'The provisioning state of the inbound NAT pool resource. Known values

    are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.InboundNatPoolPropertiesFormat.backendPort
  name: backendPort
  summary: 'The port used for internal connections on the endpoint. Acceptable values
    are between 1 and

    65535. Required.'
  signature: 'backendPort: Required[int]'
- uid: azure.mgmt.network.types.InboundNatPoolPropertiesFormat.enableFloatingIP
  name: enableFloatingIP
  summary: 'Configures a virtual machine''s endpoint for the floating IP capability
    required to configure a

    SQL AlwaysOn Availability Group. This setting is required when using the SQL AlwaysOn

    Availability Groups in SQL server. This setting can''t be changed after you create
    the endpoint.'
  signature: 'enableFloatingIP: bool'
- uid: azure.mgmt.network.types.InboundNatPoolPropertiesFormat.enableTcpReset
  name: enableTcpReset
  summary: 'Receive bidirectional TCP Reset on TCP flow idle timeout or unexpected
    connection termination.

    This element is only used when the protocol is set to TCP.'
  signature: 'enableTcpReset: bool'
- uid: azure.mgmt.network.types.InboundNatPoolPropertiesFormat.frontendIPConfiguration
  name: frontendIPConfiguration
  summary: A reference to frontend IP addresses.
  signature: 'frontendIPConfiguration: SubResource'
- uid: azure.mgmt.network.types.InboundNatPoolPropertiesFormat.frontendPortRangeEnd
  name: frontendPortRangeEnd
  summary: 'The last port number in the range of external ports that will be used
    to provide Inbound Nat to

    NICs associated with a load balancer. Acceptable values range between 1 and 65535.
    Required.'
  signature: 'frontendPortRangeEnd: Required[int]'
- uid: azure.mgmt.network.types.InboundNatPoolPropertiesFormat.frontendPortRangeStart
  name: frontendPortRangeStart
  summary: 'The first port number in the range of external ports that will be used
    to provide Inbound Nat

    to NICs associated with a load balancer. Acceptable values range between 1 and
    65534. Required.'
  signature: 'frontendPortRangeStart: Required[int]'
- uid: azure.mgmt.network.types.InboundNatPoolPropertiesFormat.idleTimeoutInMinutes
  name: idleTimeoutInMinutes
  summary: 'The timeout for the TCP idle connection. The value can be set between
    4 and 30 minutes. The

    default value is 4 minutes. This element is only used when the protocol is set
    to TCP.'
  signature: 'idleTimeoutInMinutes: int'
- uid: azure.mgmt.network.types.InboundNatPoolPropertiesFormat.protocol
  name: protocol
  summary: 'The reference to the transport protocol used by the inbound NAT pool.
    Required. Known values

    are: "Udp", "Tcp", "All", and "Quic".'
  signature: 'protocol: Required[str | TransportProtocol]'
- uid: azure.mgmt.network.types.InboundNatPoolPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
