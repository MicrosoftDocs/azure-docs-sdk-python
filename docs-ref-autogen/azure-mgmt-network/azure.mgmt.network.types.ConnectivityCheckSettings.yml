### YamlMime:PythonClass
uid: azure.mgmt.network.types.ConnectivityCheckSettings
name: ConnectivityCheckSettings
fullName: azure.mgmt.network.types.ConnectivityCheckSettings
module: azure.mgmt.network.types
summary: Settings that control how connectivity checks are performed by the connection
  analyzer.
constructor:
  syntax: ConnectivityCheckSettings()
variables:
- description: 'Whether to generate a hop-by-hop path during the connectivity check.

    Default value is true.'
  name: generatePath
  types:
  - <xref:bool>
- description: 'Preferred IP version for the connectivity check. Known values are:

    "IPv4" and "IPv6".'
  name: preferredIPVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PreferredIPVersion">]
attributes:
- uid: azure.mgmt.network.types.ConnectivityCheckSettings.generatePath
  name: generatePath
  summary: Whether to generate a hop-by-hop path during the connectivity check. Default
    value is true.
  signature: 'generatePath: bool'
- uid: azure.mgmt.network.types.ConnectivityCheckSettings.preferredIPVersion
  name: preferredIPVersion
  summary: '"IPv4" and "IPv6".'
  signature: 'preferredIPVersion: str | PreferredIPVersion'
