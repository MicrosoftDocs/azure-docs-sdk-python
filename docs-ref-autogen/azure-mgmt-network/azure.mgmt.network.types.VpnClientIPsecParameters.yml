### YamlMime:PythonClass
uid: azure.mgmt.network.types.VpnClientIPsecParameters
name: VpnClientIPsecParameters
fullName: azure.mgmt.network.types.VpnClientIPsecParameters
module: azure.mgmt.network.types
summary: An IPSec parameters for a virtual network gateway P2S connection.
constructor:
  syntax: VpnClientIPsecParameters()
variables:
- description: 'The IPSec Security Association (also called Quick Mode or Phase 2
    SA)

    lifetime in seconds for P2S client. Required.'
  name: saLifeTimeSeconds
  types:
  - <xref:int>
- description: 'The IPSec Security Association (also called Quick Mode or Phase 2

    SA) payload size in KB for P2S client.. Required.'
  name: saDataSizeKilobytes
  types:
  - <xref:int>
- description: 'The IPSec encryption algorithm (IKE phase 1). Required. Known values

    are: "None", "DES", "DES3", "AES128", "AES192", "AES256", "GCMAES128", "GCMAES192",
    and

    "GCMAES256".'
  name: ipsecEncryption
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IpsecEncryption">]
- description: 'The IPSec integrity algorithm (IKE phase 1). Required. Known values
    are:

    "MD5", "SHA1", "SHA256", "GCMAES128", "GCMAES192", and "GCMAES256".'
  name: ipsecIntegrity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IpsecIntegrity">]
- description: 'The IKE encryption algorithm (IKE phase 2). Required. Known values
    are:

    "DES", "DES3", "AES128", "AES192", "AES256", "GCMAES256", and "GCMAES128".'
  name: ikeEncryption
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IkeEncryption">]
- description: 'The IKE integrity algorithm (IKE phase 2). Required. Known values
    are:

    "MD5", "SHA1", "SHA256", "SHA384", "GCMAES256", and "GCMAES128".'
  name: ikeIntegrity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IkeIntegrity">]
- description: 'The DH Group used in IKE Phase 1 for initial SA. Required. Known values
    are:

    "None", "DHGroup1", "DHGroup2", "DHGroup14", "DHGroup2048", "ECP256", "ECP384",
    and

    "DHGroup24".'
  name: dhGroup
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DhGroup">]
- description: 'The Pfs Group used in IKE Phase 2 for new child SA. Required. Known
    values are:

    "None", "PFS1", "PFS2", "PFS2048", "ECP256", "ECP384", "PFS24", "PFS14", and "PFSMM".'
  name: pfsGroup
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PfsGroup">]
attributes:
- uid: azure.mgmt.network.types.VpnClientIPsecParameters.dhGroup
  name: dhGroup
  summary: '"None",

    "DHGroup1", "DHGroup2", "DHGroup14", "DHGroup2048", "ECP256", "ECP384", and

    "DHGroup24".'
  signature: 'dhGroup: Required[str | DhGroup]'
- uid: azure.mgmt.network.types.VpnClientIPsecParameters.ikeEncryption
  name: ikeEncryption
  summary: '"DES", "DES3",

    "AES128", "AES192", "AES256", "GCMAES256", and "GCMAES128".'
  signature: 'ikeEncryption: Required[str | IkeEncryption]'
- uid: azure.mgmt.network.types.VpnClientIPsecParameters.ikeIntegrity
  name: ikeIntegrity
  summary: '"MD5", "SHA1",

    "SHA256", "SHA384", "GCMAES256", and "GCMAES128".'
  signature: 'ikeIntegrity: Required[str | IkeIntegrity]'
- uid: azure.mgmt.network.types.VpnClientIPsecParameters.ipsecEncryption
  name: ipsecEncryption
  summary: '"None", "DES",

    "DES3", "AES128", "AES192", "AES256", "GCMAES128", "GCMAES192", and "GCMAES256".'
  signature: 'ipsecEncryption: Required[str | IpsecEncryption]'
- uid: azure.mgmt.network.types.VpnClientIPsecParameters.ipsecIntegrity
  name: ipsecIntegrity
  summary: '"MD5", "SHA1",

    "SHA256", "GCMAES128", "GCMAES192", and "GCMAES256".'
  signature: 'ipsecIntegrity: Required[str | IpsecIntegrity]'
- uid: azure.mgmt.network.types.VpnClientIPsecParameters.pfsGroup
  name: pfsGroup
  summary: '"None",

    "PFS1", "PFS2", "PFS2048", "ECP256", "ECP384", "PFS24", "PFS14", and "PFSMM".'
  signature: 'pfsGroup: Required[str | PfsGroup]'
- uid: azure.mgmt.network.types.VpnClientIPsecParameters.saDataSizeKilobytes
  name: saDataSizeKilobytes
  summary: 'The IPSec Security Association (also called Quick Mode or Phase 2 SA)
    payload size in KB for

    P2S client.. Required.'
  signature: 'saDataSizeKilobytes: Required[int]'
- uid: azure.mgmt.network.types.VpnClientIPsecParameters.saLifeTimeSeconds
  name: saLifeTimeSeconds
  summary: 'The IPSec Security Association (also called Quick Mode or Phase 2 SA)
    lifetime in seconds for

    P2S client. Required.'
  signature: 'saLifeTimeSeconds: Required[int]'
