name: SecurityPartnerProviderPropertiesFormat
fullName: azure.mgmt.network.types.SecurityPartnerProviderPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of the Security Partner Provider.
constructor:
  syntax: SecurityPartnerProviderPropertiesFormat()
variables:
- description: 'The provisioning state of the Security Partner Provider resource.

    Known values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and
    "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The security provider name. Known values are: "ZScaler", "IBoss",

    and "Checkpoint".'
  name: securityProviderName
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityProviderName">]
- description: 'The connection status with the Security Partner Provider. Known values

    are: "Unknown", "PartiallyConnected", "Connected", and "NotConnected".'
  name: connectionStatus
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityPartnerProviderConnectionStatus">]
- description: The virtualHub to which the Security Partner Provider belongs.
  name: virtualHub
  types:
  - <xref:<xref:"SubResource">>
