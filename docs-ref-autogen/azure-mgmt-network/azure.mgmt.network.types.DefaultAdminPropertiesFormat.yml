    "Inbound" and "Outbound".'
  signature: 'direction: str | SecurityConfigurationRuleDirection'
- uid: azure.mgmt.network.types.DefaultAdminPropertiesFormat.flag
  name: flag
  summary: Default rule flag.
  signature: 'flag: str'
