  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.DefaultAdminPropertiesFormat.resourceGuid
  name: resourceGuid
  summary: Unique identifier for this resource.
  signature: 'resourceGuid: str'
- uid: azure.mgmt.network.types.DefaultAdminPropertiesFormat.sourcePortRanges
  name: sourcePortRanges
  summary: The source port ranges.
  signature: 'sourcePortRanges: list[str]'
- uid: azure.mgmt.network.types.DefaultAdminPropertiesFormat.sources
  name: sources
  summary: The CIDR or source IP ranges.
  signature: 'sources: list[''AddressPrefixItem'']'
