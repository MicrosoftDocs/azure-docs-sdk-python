### YamlMime:PythonClass
uid: azure.mgmt.network.types.RoutePropertiesFormat
name: RoutePropertiesFormat
fullName: azure.mgmt.network.types.RoutePropertiesFormat
module: azure.mgmt.network.types
summary: Route resource.
constructor:
  syntax: RoutePropertiesFormat()
variables:
- description: The destination CIDR to which the route applies.
  name: addressPrefix
  types:
  - <xref:str>
- description: 'The type of Azure hop the packet should be sent to. Required. Known
    values

    are: "VirtualNetworkGateway", "VnetLocal", "Internet", "VirtualAppliance",

    "VirtualApplianceEcmp", and "None".'
  name: nextHopType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RouteNextHopType">]
- description: 'The IP address packets should be forwarded to. Next hop values are
    only

    allowed in routes where the next hop type is VirtualAppliance.'
  name: nextHopIpAddress
  types:
  - <xref:str>
- description: 'The next hop definition containing ECMP next hop IP addresses. Only
    allowed when

    nextHopType is VirtualApplianceEcmp.'
  name: nextHop
  types:
  - <xref:<xref:"RouteNextHopEcmp">>
- description: 'The provisioning state of the route resource. Known values are:

    "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'A value indicating whether this route overrides overlapping BGP routes

    regardless of LPM.'
  name: hasBgpOverride
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.network.types.RoutePropertiesFormat.addressPrefix
  name: addressPrefix
  summary: The destination CIDR to which the route applies.
  signature: 'addressPrefix: str'
- uid: azure.mgmt.network.types.RoutePropertiesFormat.hasBgpOverride
  name: hasBgpOverride
  summary: A value indicating whether this route overrides overlapping BGP routes
    regardless of LPM.
  signature: 'hasBgpOverride: bool'
- uid: azure.mgmt.network.types.RoutePropertiesFormat.nextHop
  name: nextHop
  summary: 'The next hop definition containing ECMP next hop IP addresses. Only allowed
    when nextHopType is

    VirtualApplianceEcmp.'
  signature: 'nextHop: RouteNextHopEcmp'
- uid: azure.mgmt.network.types.RoutePropertiesFormat.nextHopIpAddress
  name: nextHopIpAddress
  summary: 'The IP address packets should be forwarded to. Next hop values are only
    allowed in routes where

    the next hop type is VirtualAppliance.'
  signature: 'nextHopIpAddress: str'
- uid: azure.mgmt.network.types.RoutePropertiesFormat.nextHopType
  name: nextHopType
  summary: 'The type of Azure hop the packet should be sent to. Required. Known values
    are:

    "VirtualNetworkGateway", "VnetLocal", "Internet", "VirtualAppliance",

    "VirtualApplianceEcmp", and "None".'
  signature: 'nextHopType: Required[str | RouteNextHopType]'
- uid: azure.mgmt.network.types.RoutePropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed", "Succeeded",

    "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
