### YamlMime:PythonClass
uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat
name: ApplicationGatewayRequestRoutingRulePropertiesFormat
fullName: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat
module: azure.mgmt.network.types
summary: Properties of request routing rule of the application gateway.
constructor:
  syntax: ApplicationGatewayRequestRoutingRulePropertiesFormat()
variables:
- description: 'Rule type. Known values are: "Basic", "PathBasedRouting", and

    "AdvancedRouting".'
  name: ruleType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewayRequestRoutingRuleType">]
- description: Priority of the request routing rule.
  name: priority
  types:
  - <xref:int>
- description: Backend address pool resource of the application gateway.
  name: backendAddressPool
  types:
  - <xref:<xref:"SubResource">>
- description: Backend http settings resource of the application gateway.
  name: backendHttpSettings
  types:
  - <xref:<xref:"SubResource">>
- description: Http listener resource of the application gateway.
  name: httpListener
  types:
  - <xref:<xref:"SubResource">>
- description: URL path map resource of the application gateway.
  name: urlPathMap
  types:
  - <xref:<xref:"SubResource">>
- description: Advanced routing map resource of the application gateway.
  name: advancedRoutingMap
  types:
  - <xref:<xref:"SubResource">>
- description: Rewrite Rule Set resource in Basic rule of the application gateway.
  name: rewriteRuleSet
  types:
  - <xref:<xref:"SubResource">>
- description: Redirect configuration resource of the application gateway.
  name: redirectConfiguration
  types:
  - <xref:<xref:"SubResource">>
- description: Load Distribution Policy resource of the application gateway.
  name: loadDistributionPolicy
  types:
  - <xref:<xref:"SubResource">>
- description: 'Entra JWT validation configuration resource of the application

    gateway.'
  name: entraJWTValidationConfig
  types:
  - <xref:<xref:"SubResource">>
- description: 'Authentication configuration bindings of the request routing rule.
    Only one

    authentication configuration is supported. Authentication configuration names
    must be unique

    across the Application Gateway, and an Application Gateway can reference at most
    100 distinct

    authentication policies. Authentication policies can only be bound to Application
    Gateways

    using the Standard_v2 or WAF_v2 SKU.'
  name: authConfigs
  types:
  - <xref:list>[<xref:"ApplicationGatewayAuthConfig">]
- description: 'The provisioning state of the request routing rule resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat.advancedRoutingMap
  name: advancedRoutingMap
  summary: Advanced routing map resource of the application gateway.
  signature: 'advancedRoutingMap: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat.authConfigs
  name: authConfigs
  summary: 'Authentication configuration bindings of the request routing rule. Only
    one authentication

    configuration is supported. Authentication configuration names must be unique
    across the

    Application Gateway, and an Application Gateway can reference at most 100 distinct

    authentication policies. Authentication policies can only be bound to Application
    Gateways

    using the Standard_v2 or WAF_v2 SKU.'
  signature: 'authConfigs: list[''ApplicationGatewayAuthConfig'']'
- uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat.backendAddressPool
  name: backendAddressPool
  summary: Backend address pool resource of the application gateway.
  signature: 'backendAddressPool: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat.backendHttpSettings
  name: backendHttpSettings
  summary: Backend http settings resource of the application gateway.
  signature: 'backendHttpSettings: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat.entraJWTValidationConfig
  name: entraJWTValidationConfig
  summary: Entra JWT validation configuration resource of the application gateway.
  signature: 'entraJWTValidationConfig: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat.httpListener
  name: httpListener
  summary: Http listener resource of the application gateway.
  signature: 'httpListener: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat.loadDistributionPolicy
  name: loadDistributionPolicy
  summary: Load Distribution Policy resource of the application gateway.
  signature: 'loadDistributionPolicy: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat.priority
  name: priority
  summary: Priority of the request routing rule.
  signature: 'priority: int'
- uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat.redirectConfiguration
  name: redirectConfiguration
  summary: Redirect configuration resource of the application gateway.
  signature: 'redirectConfiguration: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat.rewriteRuleSet
  name: rewriteRuleSet
  summary: Rewrite Rule Set resource in Basic rule of the application gateway.
  signature: 'rewriteRuleSet: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayRequestRoutingRulePropertiesFormat.ruleType
  name: ruleType
  summary: '"Basic", "PathBasedRouting", and "AdvancedRouting".'
