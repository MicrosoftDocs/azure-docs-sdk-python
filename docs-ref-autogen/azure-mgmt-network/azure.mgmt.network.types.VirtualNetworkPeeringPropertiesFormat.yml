### YamlMime:PythonClass
uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat
name: VirtualNetworkPeeringPropertiesFormat
fullName: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of the virtual network peering.
constructor:
  syntax: VirtualNetworkPeeringPropertiesFormat()
variables:
- description: 'Whether the VMs in the local virtual network space would be

    able to access the VMs in remote virtual network space.'
  name: allowVirtualNetworkAccess
  types:
  - <xref:bool>
- description: 'Whether the forwarded traffic from the VMs in the local virtual

    network will be allowed/disallowed in remote virtual network.'
  name: allowForwardedTraffic
  types:
  - <xref:bool>
- description: 'If gateway links can be used in remote virtual networking to link
    to

    this virtual network.'
  name: allowGatewayTransit
  types:
  - <xref:bool>
- description: 'If remote gateways can be used on this virtual network. If the flag
    is

    set to true, and allowGatewayTransit on remote peering is also true, virtual network
    will use

    gateways of remote virtual network for transit. Only one peering can have this
    flag set to

    true. This flag cannot be set if virtual network already has a gateway.'
  name: useRemoteGateways
  types:
  - <xref:bool>
- description: 'The reference to the remote virtual network. The remote virtual

    network can be in the same or different region (preview). See here to register
    for the preview

    and learn more

    ([https://docs.microsoft.com/en-us/azure/virtual-network/virtual-network-create-peering](https://docs.microsoft.com/en-us/azure/virtual-network/virtual-network-create-peering)).'
  name: remoteVirtualNetwork
  types:
  - <xref:<xref:"SubResource">>
- description: The local address space of the local virtual network that is peered.
  name: localAddressSpace
  types:
  - <xref:<xref:"AddressSpace">>
- description: 'The current local address space of the local virtual

    network that is peered.'
  name: localVirtualNetworkAddressSpace
  types:
  - <xref:<xref:"AddressSpace">>
- description: 'The reference to the address space peered with the remote virtual

    network.'
  name: remoteAddressSpace
  types:
  - <xref:<xref:"AddressSpace">>
- description: 'The reference to the current address space of the

    remote virtual network.'
  name: remoteVirtualNetworkAddressSpace
  types:
  - <xref:<xref:"AddressSpace">>
- description: The reference to the remote virtual network's Bgp Communities.
  name: remoteBgpCommunities
  types:
  - <xref:<xref:"VirtualNetworkBgpCommunities">>
- description: The reference to the remote virtual network's encryption.
  name: remoteVirtualNetworkEncryption
  types:
  - <xref:<xref:"VirtualNetworkEncryption">>
- description: 'The status of the virtual network peering. Known values are: "Initiated",

    "Connected", and "Disconnected".'
  name: peeringState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualNetworkPeeringState">]
- description: 'The peering sync status of the virtual network peering. Known values

    are: "FullyInSync", "RemoteNotInSync", "LocalNotInSync", and "LocalAndRemoteNotInSync".'
  name: peeringSyncLevel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualNetworkPeeringLevel">]
- description: 'The provisioning state of the virtual network peering resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'If we need to verify the provisioning state of the remote

    gateway.'
  name: doNotVerifyRemoteGateways
  types:
  - <xref:bool>
- description: The resourceGuid property of the Virtual Network peering resource.
  name: resourceGuid
  types:
  - <xref:str>
- description: Whether complete virtual network address space is peered.
  name: peerCompleteVnets
  types:
  - <xref:bool>
- description: Whether only Ipv6 address space is peered for subnet peering.
  name: enableOnlyIPv6Peering
  types:
  - <xref:bool>
- description: 'List of local subnet names that are subnet peered with remote virtual

    network.'
  name: localSubnetNames
  types:
  - <xref:list>[<xref:str>]
- description: 'List of remote subnet names from remote virtual network that are

    subnet peered.'
  name: remoteSubnetNames
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.allowForwardedTraffic
  name: allowForwardedTraffic
  summary: 'Whether the forwarded traffic from the VMs in the local virtual network
    will be

    allowed/disallowed in remote virtual network.'
  signature: 'allowForwardedTraffic: bool'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.allowGatewayTransit
  name: allowGatewayTransit
  summary: If gateway links can be used in remote virtual networking to link to this
    virtual network.
  signature: 'allowGatewayTransit: bool'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.allowVirtualNetworkAccess
  name: allowVirtualNetworkAccess
  summary: 'Whether the VMs in the local virtual network space would be able to access
    the VMs in remote

    virtual network space.'
  signature: 'allowVirtualNetworkAccess: bool'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.doNotVerifyRemoteGateways
  name: doNotVerifyRemoteGateways
  summary: If we need to verify the provisioning state of the remote gateway.
  signature: 'doNotVerifyRemoteGateways: bool'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.enableOnlyIPv6Peering
  name: enableOnlyIPv6Peering
  summary: Whether only Ipv6 address space is peered for subnet peering.
  signature: 'enableOnlyIPv6Peering: bool'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.localAddressSpace
  name: localAddressSpace
  summary: The local address space of the local virtual network that is peered.
  signature: 'localAddressSpace: AddressSpace'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.localSubnetNames
  name: localSubnetNames
  summary: List of local subnet names that are subnet peered with remote virtual network.
  signature: 'localSubnetNames: list[str]'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.localVirtualNetworkAddressSpace
  name: localVirtualNetworkAddressSpace
  summary: The current local address space of the local virtual network that is peered.
  signature: 'localVirtualNetworkAddressSpace: AddressSpace'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.peerCompleteVnets
  name: peerCompleteVnets
  summary: Whether complete virtual network address space is peered.
  signature: 'peerCompleteVnets: bool'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.peeringState
  name: peeringState
  summary: '"Initiated", "Connected", and

    "Disconnected".'
  signature: 'peeringState: str | VirtualNetworkPeeringState'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.peeringSyncLevel
  name: peeringSyncLevel
  summary: '"FullyInSync",

    "RemoteNotInSync", "LocalNotInSync", and "LocalAndRemoteNotInSync".'
  signature: 'peeringSyncLevel: str | VirtualNetworkPeeringLevel'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.remoteAddressSpace
  name: remoteAddressSpace
  summary: The reference to the address space peered with the remote virtual network.
  signature: 'remoteAddressSpace: AddressSpace'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.remoteBgpCommunities
  name: remoteBgpCommunities
  summary: The reference to the remote virtual network's Bgp Communities.
  signature: 'remoteBgpCommunities: VirtualNetworkBgpCommunities'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.remoteSubnetNames
  name: remoteSubnetNames
  summary: List of remote subnet names from remote virtual network that are subnet
    peered.
  signature: 'remoteSubnetNames: list[str]'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.remoteVirtualNetwork
  name: remoteVirtualNetwork
  summary: 'The reference to the remote virtual network. The remote virtual network
    can be in the same or

    different region (preview). See here to register for the preview and learn more

    ([https://docs.microsoft.com/en-us/azure/virtual-network/virtual-network-create-peering](https://docs.microsoft.com/en-us/azure/virtual-network/virtual-network-create-peering)).'
  signature: 'remoteVirtualNetwork: SubResource'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.remoteVirtualNetworkAddressSpace
  name: remoteVirtualNetworkAddressSpace
  summary: The reference to the current address space of the remote virtual network.
  signature: 'remoteVirtualNetworkAddressSpace: AddressSpace'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.remoteVirtualNetworkEncryption
  name: remoteVirtualNetworkEncryption
  summary: The reference to the remote virtual network's encryption.
  signature: 'remoteVirtualNetworkEncryption: VirtualNetworkEncryption'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.resourceGuid
  name: resourceGuid
  summary: The resourceGuid property of the Virtual Network peering resource.
  signature: 'resourceGuid: str'
- uid: azure.mgmt.network.types.VirtualNetworkPeeringPropertiesFormat.useRemoteGateways
  name: useRemoteGateways
  summary: 'If remote gateways can be used on this virtual network. If the flag is
    set to true, and

    allowGatewayTransit on remote peering is also true, virtual network will use gateways
    of remote

    virtual network for transit. Only one peering can have this flag set to true.
    This flag cannot

    be set if virtual network already has a gateway.'
  signature: 'useRemoteGateways: bool'
