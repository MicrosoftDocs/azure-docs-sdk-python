### YamlMime:PythonClass
uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingRulePropertiesFormat
name: ApplicationGatewayAdvancedRoutingRulePropertiesFormat
fullName: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingRulePropertiesFormat
module: azure.mgmt.network.models
summary: Properties of advanced routing rule of the application gateway.
constructor:
  syntax: 'ApplicationGatewayAdvancedRoutingRulePropertiesFormat(*args: Any, **kwargs:
    Any)'
variables:
- description: 'Priority of the advanced routing rule. Must be unique within the containing

    advanced routing map. Rules are evaluated in ascending priority order. Required.'
  name: priority
  types:
  - <xref:int>
- description: 'Advanced routing condition set resource evaluated by this

    rule.'
  name: advanced_routing_condition_set
  types:
  - <xref:azure.mgmt.network.models.SubResource>
- description: 'Backend address pool resource of the advanced routing rule.

    Required unless redirectConfiguration is specified.'
  name: backend_address_pool
  types:
  - <xref:azure.mgmt.network.models.SubResource>
- description: 'Backend http settings resource of the advanced routing rule.

    Required unless redirectConfiguration is specified.'
  name: backend_http_settings
  types:
  - <xref:azure.mgmt.network.models.SubResource>
- description: 'Redirect configuration resource of the advanced routing rule.

    Cannot be combined with backendAddressPool or backendHttpSettings.'
  name: redirect_configuration
  types:
  - <xref:azure.mgmt.network.models.SubResource>
- description: Rewrite rule set resource of the advanced routing rule.
  name: rewrite_rule_set
  types:
  - <xref:azure.mgmt.network.models.SubResource>
- description: 'Authentication configuration bindings of the advanced routing rule.
    Only

    one authentication configuration is supported. Authentication configuration names
    must be

    unique across the Application Gateway, and an Application Gateway can reference
    at most 100

    distinct authentication policies. Authentication policies can only be bound to
    Application

    Gateways using the Standard_v2 or WAF_v2 SKU.'
  name: auth_configs
  types:
  - <xref:list>[<xref:azure.mgmt.network.models.ApplicationGatewayAuthConfig>]
- description: 'The provisioning state of the advanced routing rule resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.network.models.ProvisioningState>
attributes:
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.advanced_routing_condition_set
  name: advanced_routing_condition_set
  summary: Advanced routing condition set resource evaluated by this rule.
  signature: 'advanced_routing_condition_set: _models.SubResource | None'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.auth_configs
  name: auth_configs
  summary: 'Authentication configuration bindings of the advanced routing rule. Only
    one authentication

    configuration is supported. Authentication configuration names must be unique
    across the

    Application Gateway, and an Application Gateway can reference at most 100 distinct

    authentication policies. Authentication policies can only be bound to Application
    Gateways

    using the Standard_v2 or WAF_v2 SKU.'
  signature: 'auth_configs: list[''_models.ApplicationGatewayAuthConfig''] | None'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.backend_address_pool
  name: backend_address_pool
  summary: 'Backend address pool resource of the advanced routing rule. Required unless

    redirectConfiguration is specified.'
  signature: 'backend_address_pool: _models.SubResource | None'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.backend_http_settings
  name: backend_http_settings
  summary: 'Backend http settings resource of the advanced routing rule. Required
    unless

    redirectConfiguration is specified.'
  signature: 'backend_http_settings: _models.SubResource | None'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.priority
  name: priority
  summary: 'Priority of the advanced routing rule. Must be unique within the containing
    advanced routing

    map. Rules are evaluated in ascending priority order. Required.'
  signature: 'priority: int'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.provisioning_state
  name: provisioning_state
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioning_state: str | _models.ProvisioningState | None'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.redirect_configuration
  name: redirect_configuration
  summary: 'Redirect configuration resource of the advanced routing rule. Cannot be
    combined with

    backendAddressPool or backendHttpSettings.'
  signature: 'redirect_configuration: _models.SubResource | None'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.rewrite_rule_set
  name: rewrite_rule_set
  summary: Rewrite rule set resource of the advanced routing rule.
  signature: 'rewrite_rule_set: _models.SubResource | None'
