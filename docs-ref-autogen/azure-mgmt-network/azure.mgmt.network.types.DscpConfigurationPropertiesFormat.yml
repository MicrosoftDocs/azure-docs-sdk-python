### YamlMime:PythonClass
uid: azure.mgmt.network.types.DscpConfigurationPropertiesFormat
name: DscpConfigurationPropertiesFormat
fullName: azure.mgmt.network.types.DscpConfigurationPropertiesFormat
module: azure.mgmt.network.types
summary: Differentiated Services Code Point configuration properties.
constructor:
  syntax: DscpConfigurationPropertiesFormat()
variables:
- description: List of markings to be used in the configuration.
  name: markings
  types:
  - <xref:list>[<xref:int>]
- description: Source IP ranges.
  name: sourceIpRanges
  types:
  - <xref:list>[<xref:"QosIpRange">]
- description: Destination IP ranges.
  name: destinationIpRanges
  types:
  - <xref:list>[<xref:"QosIpRange">]
- description: Sources port ranges.
  name: sourcePortRanges
  types:
  - <xref:list>[<xref:"QosPortRange">]
- description: Destination port ranges.
  name: destinationPortRanges
  types:
  - <xref:list>[<xref:"QosPortRange">]
- description: 'RNM supported protocol types. Known values are: "DoNotUse", "Icmp",
    "Tcp",

    "Udp", "Gre", "Esp", "Ah", "Vxlan", and "All".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProtocolType">]
- description: QoS object definitions.
  name: qosDefinitionCollection
  types:
  - <xref:list>[<xref:"QosDefinition">]
- description: Qos Collection ID generated by RNM.
  name: qosCollectionId
  types:
  - <xref:str>
- description: Associated Network Interfaces to the DSCP Configuration.
  name: associatedNetworkInterfaces
  types:
  - <xref:list>[<xref:"NetworkInterface">]
- description: The resource GUID property of the DSCP Configuration resource.
  name: resourceGuid
  types:
  - <xref:str>
- description: 'The provisioning state of the DSCP Configuration resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.DscpConfigurationPropertiesFormat.associatedNetworkInterfaces
  name: associatedNetworkInterfaces
  summary: Associated Network Interfaces to the DSCP Configuration.
  signature: 'associatedNetworkInterfaces: list[''NetworkInterface'']'
- uid: azure.mgmt.network.types.DscpConfigurationPropertiesFormat.destinationIpRanges
  name: destinationIpRanges
  summary: Destination IP ranges.
  signature: 'destinationIpRanges: list[''QosIpRange'']'
- uid: azure.mgmt.network.types.DscpConfigurationPropertiesFormat.destinationPortRanges
  name: destinationPortRanges
  summary: Destination port ranges.
  signature: 'destinationPortRanges: list[''QosPortRange'']'
- uid: azure.mgmt.network.types.DscpConfigurationPropertiesFormat.markings
  name: markings
  summary: List of markings to be used in the configuration.
  signature: 'markings: list[int]'
- uid: azure.mgmt.network.types.DscpConfigurationPropertiesFormat.protocol
  name: protocol
  summary: '"DoNotUse", "Icmp", "Tcp", "Udp",

    "Gre", "Esp", "Ah", "Vxlan", and "All".'
  signature: 'protocol: str | ProtocolType'
- uid: azure.mgmt.network.types.DscpConfigurationPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.DscpConfigurationPropertiesFormat.qosCollectionId
  name: qosCollectionId
  summary: Qos Collection ID generated by RNM.
  signature: 'qosCollectionId: str'
- uid: azure.mgmt.network.types.DscpConfigurationPropertiesFormat.qosDefinitionCollection
  name: qosDefinitionCollection
  summary: QoS object definitions.
  signature: 'qosDefinitionCollection: list[''QosDefinition'']'
- uid: azure.mgmt.network.types.DscpConfigurationPropertiesFormat.resourceGuid
  name: resourceGuid
  summary: The resource GUID property of the DSCP Configuration resource.
  signature: 'resourceGuid: str'
- uid: azure.mgmt.network.types.DscpConfigurationPropertiesFormat.sourceIpRanges
  name: sourceIpRanges
  summary: Source IP ranges.
  signature: 'sourceIpRanges: list[''QosIpRange'']'
- uid: azure.mgmt.network.types.DscpConfigurationPropertiesFormat.sourcePortRanges
  name: sourcePortRanges
  summary: Sources port ranges.
  signature: 'sourcePortRanges: list[''QosPortRange'']'
