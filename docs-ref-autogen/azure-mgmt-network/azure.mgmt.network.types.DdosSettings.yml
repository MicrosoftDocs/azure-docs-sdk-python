  - <xref:<xref:"SubResource">>
attributes:
- uid: azure.mgmt.network.types.DdosSettings.ddosCustomPolicy
  name: ddosCustomPolicy
  summary: The DDoS custom policy associated with the public IP.
  signature: 'ddosCustomPolicy: SubResource'
- uid: azure.mgmt.network.types.DdosSettings.ddosProtectionPlan
  name: ddosProtectionPlan
  summary: 'The DDoS protection plan associated with the public IP. Can only be set
    if ProtectionMode is

    Enabled.'
