### YamlMime:PythonClass
uid: azure.mgmt.network.types.WebApplicationFirewallScrubbingRules
name: WebApplicationFirewallScrubbingRules
fullName: azure.mgmt.network.types.WebApplicationFirewallScrubbingRules
module: azure.mgmt.network.types
summary: Allow certain variables to be scrubbed on WAF logs.
constructor:
  syntax: WebApplicationFirewallScrubbingRules()
variables:
- description: 'The variable to be scrubbed from the logs. Required. Known values
    are:

    "RequestHeaderNames", "RequestCookieNames", "RequestArgNames", "RequestPostArgNames",

    "RequestJSONArgNames", and "RequestIPAddress".'
  name: matchVariable
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScrubbingRuleEntryMatchVariable">]
- description: 'When matchVariable is a collection, operate on the selector to

    specify which elements in the collection this rule applies to. Required. Known
    values are:

    "Equals" and "EqualsAny".'
  name: selectorMatchOperator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScrubbingRuleEntryMatchOperator">]
- description: 'When matchVariable is a collection, operator used to specify which
    elements in

    the collection this rule applies to.'
  name: selector
  types:
  - <xref:str>
- description: 'Defines the state of log scrubbing rule. Default value is Enabled.
    Known values

    are: "Enabled" and "Disabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ScrubbingRuleEntryState">]
attributes:
- uid: azure.mgmt.network.types.WebApplicationFirewallScrubbingRules.matchVariable
  name: matchVariable
  summary: '"RequestHeaderNames",

    "RequestCookieNames", "RequestArgNames", "RequestPostArgNames", "RequestJSONArgNames",

    and "RequestIPAddress".'
  signature: 'matchVariable: Required[str | ScrubbingRuleEntryMatchVariable]'
- uid: azure.mgmt.network.types.WebApplicationFirewallScrubbingRules.selector
  name: selector
  summary: 'When matchVariable is a collection, operator used to specify which elements
    in the collection

    this rule applies to.'
  signature: 'selector: str'
- uid: azure.mgmt.network.types.WebApplicationFirewallScrubbingRules.selectorMatchOperator
  name: selectorMatchOperator
  summary: 'When matchVariable is a collection, operate on the selector to specify
    which elements in the

    collection this rule applies to. Required. Known values are: "Equals" and "EqualsAny".'
  signature: 'selectorMatchOperator: Required[str | ScrubbingRuleEntryMatchOperator]'
- uid: azure.mgmt.network.types.WebApplicationFirewallScrubbingRules.state
  name: state
  summary: 'Defines the state of log scrubbing rule. Default value is Enabled. Known
    values are:

    "Enabled" and "Disabled".'
  signature: 'state: str | ScrubbingRuleEntryState'
