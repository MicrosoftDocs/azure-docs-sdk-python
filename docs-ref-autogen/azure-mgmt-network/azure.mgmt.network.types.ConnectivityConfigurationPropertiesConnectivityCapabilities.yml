### YamlMime:PythonClass
uid: azure.mgmt.network.types.ConnectivityConfigurationPropertiesConnectivityCapabilities
name: ConnectivityConfigurationPropertiesConnectivityCapabilities
fullName: azure.mgmt.network.types.ConnectivityConfigurationPropertiesConnectivityCapabilities
module: azure.mgmt.network.types
summary: 'Collection of additional settings to enhance specific topology behaviors
  of the connectivity

  configuration resource.'
constructor:
  syntax: ConnectivityConfigurationPropertiesConnectivityCapabilities()
variables:
- description: 'Option indicating the scale of private endpoints

    allowed in the connected group of the connectivity configuration. Required. Known
    values are:

    "Standard" and "HighScale".'
  name: connectedGroupPrivateEndpointsScale
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectedGroupPrivateEndpointsScale">]
- description: 'Behavior to handle overlapped IP address space among

    members of the connected group of the connectivity configuration. Required. Known
    values are:

    "Allowed" and "Disallowed".'
  name: connectedGroupAddressOverlap
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectedGroupAddressOverlap">]
- description: 'Option indicating enforcement of peerings created by the connectivity

    configuration. Required. Known values are: "Unenforced" and "Enforced".'
  name: peeringEnforcement
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PeeringEnforcement">]
attributes:
- uid: azure.mgmt.network.types.ConnectivityConfigurationPropertiesConnectivityCapabilities.connectedGroupAddressOverlap
  name: connectedGroupAddressOverlap
  summary: 'Behavior to handle overlapped IP address space among members of the connected
    group of the

    connectivity configuration. Required. Known values are: "Allowed" and "Disallowed".'
  signature: 'connectedGroupAddressOverlap: Required[str | ConnectedGroupAddressOverlap]'
- uid: azure.mgmt.network.types.ConnectivityConfigurationPropertiesConnectivityCapabilities.connectedGroupPrivateEndpointsScale
  name: connectedGroupPrivateEndpointsScale
  summary: 'Option indicating the scale of private endpoints allowed in the connected
    group of the

    connectivity configuration. Required. Known values are: "Standard" and "HighScale".'
  signature: 'connectedGroupPrivateEndpointsScale: Required[str | ConnectedGroupPrivateEndpointsScale]'
- uid: azure.mgmt.network.types.ConnectivityConfigurationPropertiesConnectivityCapabilities.peeringEnforcement
  name: peeringEnforcement
  summary: 'Option indicating enforcement of peerings created by the connectivity
    configuration. Required.

    Known values are: "Unenforced" and "Enforced".'
  signature: 'peeringEnforcement: Required[str | PeeringEnforcement]'
