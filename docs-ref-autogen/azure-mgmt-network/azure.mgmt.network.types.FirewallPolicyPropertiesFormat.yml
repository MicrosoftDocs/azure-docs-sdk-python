### YamlMime:PythonClass
uid: azure.mgmt.network.types.FirewallPolicyPropertiesFormat
name: FirewallPolicyPropertiesFormat
fullName: azure.mgmt.network.types.FirewallPolicyPropertiesFormat
module: azure.mgmt.network.types
summary: Firewall Policy definition.
constructor:
  syntax: FirewallPolicyPropertiesFormat()
variables:
- description: 'A read-only string that represents the size of the FirewallPolicyPropertiesFormat

    in MB. (ex 0.5MB).'
  name: size
  types:
  - <xref:str>
- description: List of references to FirewallPolicyRuleCollectionGroups.
  name: ruleCollectionGroups
  types:
  - <xref:list>[<xref:"SubResource">]
- description: List of references to FirewallPolicyKubeSelectorGroups.
  name: kubeSelectorGroups
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'The provisioning state of the firewall policy resource. Known values

    are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The parent firewall policy from which rules are inherited.
  name: basePolicy
  types:
  - <xref:<xref:"SubResource">>
- description: 'List of references to Azure Firewalls that this Firewall Policy is
    associated

    with.'
  name: firewalls
  types:
  - <xref:list>[<xref:"SubResource">]
- description: List of references to Child Firewall Policies.
  name: childPolicies
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'The operation mode for Threat Intelligence. Known values are: "Alert",

    "Deny", and "Off".'
  name: threatIntelMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureFirewallThreatIntelMode">]
- description: ThreatIntel Whitelist for Firewall Policy.
  name: threatIntelWhitelist
  types:
  - <xref:<xref:"FirewallPolicyThreatIntelWhitelist">>
- description: Insights on Firewall Policy.
  name: insights
  types:
  - <xref:<xref:"FirewallPolicyInsights">>
- description: The private IP addresses/IP ranges to which traffic will not be SNAT.
  name: snat
  types:
  - <xref:<xref:"FirewallPolicySNAT">>
- description: SQL Settings definition.
  name: sql
  types:
  - <xref:<xref:"FirewallPolicySQL">>
- description: DNS Proxy Settings definition.
  name: dnsSettings
  types:
  - <xref:<xref:"DnsSettings">>
- description: Explicit Proxy Settings definition.
  name: explicitProxy
  types:
  - <xref:<xref:"ExplicitProxy">>
- description: The configuration for Intrusion detection.
  name: intrusionDetection
  types:
  - <xref:<xref:"FirewallPolicyIntrusionDetection">>
- description: TLS Configuration definition.
  name: transportSecurity
  types:
  - <xref:<xref:"FirewallPolicyTransportSecurity">>
- description: The Firewall Policy SKU.
  name: sku
  types:
  - <xref:<xref:"FirewallPolicySku">>
- description: 'Indicates that the Firewall Policy is managed by AFC (Azure Firewall
    for

    Containers). When set, the policy is treated as read-only for callers that do
    not supply the

    AFC-managed sync marker on write operations.'
  name: afcManaged
  types:
  - <xref:bool>
attributes:
