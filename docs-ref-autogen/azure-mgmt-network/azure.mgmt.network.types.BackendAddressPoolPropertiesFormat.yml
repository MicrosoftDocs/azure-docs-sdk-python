### YamlMime:PythonClass
uid: azure.mgmt.network.types.BackendAddressPoolPropertiesFormat
name: BackendAddressPoolPropertiesFormat
fullName: azure.mgmt.network.types.BackendAddressPoolPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of the backend address pool.
constructor:
  syntax: BackendAddressPoolPropertiesFormat()
variables:
- description: The location of the backend address pool.
  name: location
  types:
  - <xref:str>
- description: An array of gateway load balancer tunnel interfaces.
  name: tunnelInterfaces
  types:
  - <xref:list>[<xref:"GatewayLoadBalancerTunnelInterface">]
- description: An array of backend addresses.
  name: loadBalancerBackendAddresses
  types:
  - <xref:list>[<xref:"LoadBalancerBackendAddress">]
- description: 'An array of references to IP addresses defined in network

    interfaces.'
  name: backendIPConfigurations
  types:
  - <xref:list>[<xref:"NetworkInterfaceIPConfiguration">]
- description: 'An array of references to load balancing rules that use this backend

    address pool.'
  name: loadBalancingRules
  types:
  - <xref:list>[<xref:"SubResource">]
- description: A reference to an outbound rule that uses this backend address pool.
  name: outboundRule
  types:
  - <xref:<xref:"SubResource">>
- description: 'An array of references to outbound rules that use this backend address

    pool.'
  name: outboundRules
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'An array of references to inbound NAT rules that use this backend

    address pool.'
  name: inboundNatRules
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'The provisioning state of the backend address pool resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Amount of seconds Load Balancer waits for before sending RESET to

    client and backend address.'
  name: drainPeriodInSeconds
  types:
  - <xref:int>
- description: A reference to a virtual network.
  name: virtualNetwork
  types:
  - <xref:<xref:"SubResource">>
- description: 'Backend address synchronous mode for the backend pool. Known values
    are:

    "Automatic" and "Manual".'
  name: syncMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SyncMode">]
attributes:
