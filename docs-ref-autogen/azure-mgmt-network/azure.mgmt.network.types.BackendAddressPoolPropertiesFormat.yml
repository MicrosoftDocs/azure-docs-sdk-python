  name: loadBalancerBackendAddresses
  summary: An array of backend addresses.
  signature: 'loadBalancerBackendAddresses: list[''LoadBalancerBackendAddress'']'
- uid: azure.mgmt.network.types.BackendAddressPoolPropertiesFormat.loadBalancingRules
  name: loadBalancingRules
  summary: An array of references to load balancing rules that use this backend address
    pool.
  signature: 'loadBalancingRules: list[''SubResource'']'
