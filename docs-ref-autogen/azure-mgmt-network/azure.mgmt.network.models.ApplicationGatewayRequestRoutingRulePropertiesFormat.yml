    must be unique

    across the Application Gateway, and an Application Gateway can reference at most
    100 distinct

    authentication policies. Authentication policies can only be bound to Application
    Gateways

    using the Standard_v2 or WAF_v2 SKU.'
  name: auth_configs
  types:
