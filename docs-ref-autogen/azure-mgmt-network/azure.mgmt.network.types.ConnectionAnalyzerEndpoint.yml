### YamlMime:PythonClass
uid: azure.mgmt.network.types.ConnectionAnalyzerEndpoint
name: ConnectionAnalyzerEndpoint
fullName: azure.mgmt.network.types.ConnectionAnalyzerEndpoint
module: azure.mgmt.network.types
summary: "Describes a source or destination endpoint of a connection analyzer.\n\n\
  The schema is intentionally permissive (a flat object) because the set of\nvalid\
  \ fields is determined by `type` and is enforced server-side by the\nNetwork Resource\
  \ Provider. The required and allowed fields per `type` are:\n\n* *VM*, *VMSS*, *BastionHost*,\
  \ *ApplicationGateway*: *resourceId* is \n\nrequired and must be the ARM resource\
  \ ID of the corresponding resource\n(a virtual machine, virtual machine scale set\
  \ or VMSS instance, Azure\nBastion host, or Application Gateway, respectively);\
  \ *address* is not\nused; *port* is optional.\n* *ExternalAddress*: *address* is\
  \ required and must be an IP address or\nFQDN reachable from outside Azure; *resourceId*\
  \ is not used; *port* is\noptional.\n\nRequests that supply fields not allowed for\
  \ the chosen `type`, or omit a\nrequired field, are rejected by the service with\
  \ a validation error. This\nfollows the same convention used by `ConnectivitySource`\
  \ and\n`ConnectivityDestination` on Network Watcher."
constructor:
  syntax: ConnectionAnalyzerEndpoint()
variables:
- description: 'The type of the endpoint. Determines which of `resourceId` and `address`
    are

    required; see the model-level documentation for the per-type contract. Required.
    Known values

    are: "VM", "VMSS", "ExternalAddress", "BastionHost", and "ApplicationGateway".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectionAnalyzerEndpointType">]
- description: 'ARM resource ID of the endpoint resource. Required when `type` is
    `VM`,

    `VMSS`, `BastionHost`, or `ApplicationGateway`. Not used when `type` is

    `ExternalAddress`.'
  name: resourceId
  types:
  - <xref:str>
- description: 'IP address or FQDN of the endpoint. Required when `type` is

    `ExternalAddress`. Not used for the resource-typed endpoint kinds (`VM`, `VMSS`,

    `BastionHost`, `ApplicationGateway`).'
  name: address
  types:
  - <xref:str>
- description: Port to use for the endpoint (0-65535).
  name: port
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.network.types.ConnectionAnalyzerEndpoint.address
  name: address
  summary: 'IP address or FQDN of the endpoint. Required when `type` is `ExternalAddress`.
    Not used for

    the resource-typed endpoint kinds (`VM`, `VMSS`, `BastionHost`, `ApplicationGateway`).'
  signature: 'address: str'
- uid: azure.mgmt.network.types.ConnectionAnalyzerEndpoint.port
  name: port
  summary: Port to use for the endpoint (0-65535).
  signature: 'port: int'
- uid: azure.mgmt.network.types.ConnectionAnalyzerEndpoint.resourceId
  name: resourceId
  summary: 'ARM resource ID of the endpoint resource. Required when `type` is `VM`,
    `VMSS`,

    `BastionHost`, or `ApplicationGateway`. Not used when `type` is `ExternalAddress`.'
  signature: 'resourceId: str'
- uid: azure.mgmt.network.types.ConnectionAnalyzerEndpoint.type
  name: type
  summary: 'The type of the endpoint. Determines which of `resourceId` and `address`
    are required; see

    the model-level documentation for the per-type contract. Required. Known values
    are: "VM",

    "VMSS", "ExternalAddress", "BastionHost", and "ApplicationGateway".'
  signature: 'type: Required[str | ConnectionAnalyzerEndpointType]'
