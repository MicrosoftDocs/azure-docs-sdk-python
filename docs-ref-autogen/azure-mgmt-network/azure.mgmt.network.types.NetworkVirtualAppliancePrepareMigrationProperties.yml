### YamlMime:PythonClass
uid: azure.mgmt.network.types.NetworkVirtualAppliancePrepareMigrationProperties
name: NetworkVirtualAppliancePrepareMigrationProperties
fullName: azure.mgmt.network.types.NetworkVirtualAppliancePrepareMigrationProperties
module: azure.mgmt.network.types
summary: Properties supplied to prepare the migration of a Network Virtual Appliance.
constructor:
  syntax: NetworkVirtualAppliancePrepareMigrationProperties()
variables:
- description: 'The type of migration workflow to prepare. Required. Known values
    are:

    "MigrateToNewOSVersion" and "MigrateToNewILBArchitecture".'
  name: migrationType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"MigrationType">]
- description: 'The marketplace version to migrate to. Applicable when migrationType

    is MigrateToNewOSVersion.'
  name: marketPlaceVersion
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePrepareMigrationProperties.marketPlaceVersion
  name: marketPlaceVersion
  summary: The marketplace version to migrate to. Applicable when migrationType is
    MigrateToNewOSVersion.
  signature: 'marketPlaceVersion: str'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePrepareMigrationProperties.migrationType
  name: migrationType
  summary: 'The type of migration workflow to prepare. Required. Known values are:

    "MigrateToNewOSVersion" and "MigrateToNewILBArchitecture".'
  signature: 'migrationType: Required[str | MigrationType]'
