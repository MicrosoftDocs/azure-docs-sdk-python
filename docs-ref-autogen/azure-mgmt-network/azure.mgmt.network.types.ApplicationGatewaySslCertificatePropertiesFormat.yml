### YamlMime:PythonClass
uid: azure.mgmt.network.types.ApplicationGatewaySslCertificatePropertiesFormat
name: ApplicationGatewaySslCertificatePropertiesFormat
fullName: azure.mgmt.network.types.ApplicationGatewaySslCertificatePropertiesFormat
module: azure.mgmt.network.types
summary: Properties of SSL certificates of an application gateway.
constructor:
  syntax: ApplicationGatewaySslCertificatePropertiesFormat()
variables:
- description: Base-64 encoded pfx certificate. Only applicable in PUT Request.
  name: data
  types:
  - <xref:str>
- description: Password for the pfx file specified in data. Only applicable in PUT
    request.
  name: password
  types:
  - <xref:str>
- description: 'Base-64 encoded Public cert data corresponding to pfx specified in
    data.

    Only applicable in GET request.'
  name: publicCertData
  types:
  - <xref:str>
- description: 'Secret Id of (base-64 encoded unencrypted pfx) ''Secret'' or

    ''Certificate'' object stored in KeyVault.'
  name: keyVaultSecretId
  types:
  - <xref:str>
- description: Managed HSM properties of the Application Gateway resource.
  name: hsm
  types:
  - <xref:<xref:"ApplicationGatewayManagedHsm">>
- description: 'The provisioning state of the SSL certificate resource. Known values

    are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.ApplicationGatewaySslCertificatePropertiesFormat.data
  name: data
  summary: Base-64 encoded pfx certificate. Only applicable in PUT Request.
  signature: 'data: str'
- uid: azure.mgmt.network.types.ApplicationGatewaySslCertificatePropertiesFormat.hsm
  name: hsm
  summary: Managed HSM properties of the Application Gateway resource.
  signature: 'hsm: ApplicationGatewayManagedHsm'
- uid: azure.mgmt.network.types.ApplicationGatewaySslCertificatePropertiesFormat.keyVaultSecretId
  name: keyVaultSecretId
  summary: 'Secret Id of (base-64 encoded unencrypted pfx) ''Secret'' or ''Certificate''
    object stored in

    KeyVault.'
  signature: 'keyVaultSecretId: str'
- uid: azure.mgmt.network.types.ApplicationGatewaySslCertificatePropertiesFormat.password
  name: password
  summary: Password for the pfx file specified in data. Only applicable in PUT request.
  signature: 'password: str'
- uid: azure.mgmt.network.types.ApplicationGatewaySslCertificatePropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.ApplicationGatewaySslCertificatePropertiesFormat.publicCertData
  name: publicCertData
  summary: 'Base-64 encoded Public cert data corresponding to pfx specified in data.
    Only applicable in GET

    request.'
  signature: 'publicCertData: str'
