  name: configurationIds
  summary: List of configuration IDs.
  signature: 'configurationIds: list[str]'
- uid: azure.mgmt.network.types.CommitProperties.description
  name: description
  summary: A description of the commit.
  signature: 'description: str'
- uid: azure.mgmt.network.types.CommitProperties.forceUpdateTag
