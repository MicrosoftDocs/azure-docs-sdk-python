uid: azure.mgmt.network.types.CommitProperties
name: CommitProperties
fullName: azure.mgmt.network.types.CommitProperties
module: azure.mgmt.network.types
summary: Properties of commit.
constructor:
  syntax: CommitProperties()
variables:
- description: A description of the commit.
  name: description
  types:
  - <xref:str>
- description: 'The provisioning state of the resource. Known values are: "Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: Unique identifier for this resource.
  name: resourceGuid
  types:
  - <xref:str>
- description: 'Commit Type. Required. Known values are: "SecurityAdmin", "Connectivity",

    "SecurityUser", and "Routing".'
  name: commitType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConfigurationType">]
- description: List of configuration IDs.
  name: configurationIds
  types:
  - <xref:list>[<xref:str>]
- description: List of target locations. Required.
  name: targetLocations
  types:
  - <xref:list>[<xref:str>]
- description: List of active locations.
  name: activeLocations
  types:
  - <xref:list>[<xref:str>]
- description: 'A value that, when changed, forces the commit to be re-evaluated and

    redeployed.'
  name: forceUpdateTag
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.types.CommitProperties.activeLocations
  name: activeLocations
  summary: List of active locations.
