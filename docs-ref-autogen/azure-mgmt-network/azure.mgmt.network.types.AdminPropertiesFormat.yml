### YamlMime:PythonClass
uid: azure.mgmt.network.types.AdminPropertiesFormat
name: AdminPropertiesFormat
fullName: azure.mgmt.network.types.AdminPropertiesFormat
module: azure.mgmt.network.types
summary: Security admin rule resource.
constructor:
  syntax: AdminPropertiesFormat()
variables:
- description: A description for this rule. Restricted to 140 chars.
  name: description
  types:
  - <xref:str>
- description: 'Network protocol this rule applies to. Required. Known values are:
    "Tcp",

    "Udp", "Icmp", "Esp", "Any", and "Ah".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityConfigurationRuleProtocol">]
- description: The CIDR or source IP ranges.
  name: sources
  types:
  - <xref:list>[<xref:"AddressPrefixItem">]
- description: The destination address prefixes. CIDR or destination IP ranges.
  name: destinations
  types:
  - <xref:list>[<xref:"AddressPrefixItem">]
- description: The source port ranges.
  name: sourcePortRanges
  types:
  - <xref:list>[<xref:str>]
- description: The destination port ranges.
  name: destinationPortRanges
  types:
  - <xref:list>[<xref:str>]
- description: 'Indicates the access allowed for this particular rule. Required. Known
    values

    are: "Allow", "Deny", and "AlwaysAllow".'
  name: access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityConfigurationRuleAccess">]
- description: 'The priority of the rule. The value can be between 1 and 4096. The
    priority

    number must be unique for each rule in the collection. The lower the priority
    number, the

    higher the priority of the rule. Required.'
  name: priority
  types:
  - <xref:int>
- description: 'Indicates if the traffic matched against the rule in inbound or outbound.

    Required. Known values are: "Inbound" and "Outbound".'
  name: direction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityConfigurationRuleDirection">]
- description: 'The provisioning state of the resource. Known values are: "Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: Unique identifier for this resource.
  name: resourceGuid
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.types.AdminPropertiesFormat.access
  name: access
  summary: '"Allow",

    "Deny", and "AlwaysAllow".'
  signature: 'access: Required[str | SecurityConfigurationRuleAccess]'
- uid: azure.mgmt.network.types.AdminPropertiesFormat.description
  name: description
  summary: A description for this rule. Restricted to 140 chars.
  signature: 'description: str'
- uid: azure.mgmt.network.types.AdminPropertiesFormat.destinationPortRanges
  name: destinationPortRanges
  summary: The destination port ranges.
  signature: 'destinationPortRanges: list[str]'
- uid: azure.mgmt.network.types.AdminPropertiesFormat.destinations
  name: destinations
  summary: The destination address prefixes. CIDR or destination IP ranges.
  signature: 'destinations: list[''AddressPrefixItem'']'
- uid: azure.mgmt.network.types.AdminPropertiesFormat.direction
  name: direction
  summary: 'Indicates if the traffic matched against the rule in inbound or outbound.
    Required. Known

    values are: "Inbound" and "Outbound".'
  signature: 'direction: Required[str | SecurityConfigurationRuleDirection]'
- uid: azure.mgmt.network.types.AdminPropertiesFormat.priority
  name: priority
  summary: 'The priority of the rule. The value can be between 1 and 4096. The priority
    number must be

    unique for each rule in the collection. The lower the priority number, the higher
    the priority

    of the rule. Required.'
  signature: 'priority: Required[int]'
- uid: azure.mgmt.network.types.AdminPropertiesFormat.protocol
  name: protocol
  summary: '"Tcp", "Udp", "Icmp",

    "Esp", "Any", and "Ah".'
  signature: 'protocol: Required[str | SecurityConfigurationRuleProtocol]'
- uid: azure.mgmt.network.types.AdminPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed", "Succeeded",

    "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.AdminPropertiesFormat.resourceGuid
  name: resourceGuid
  summary: Unique identifier for this resource.
  signature: 'resourceGuid: str'
- uid: azure.mgmt.network.types.AdminPropertiesFormat.sourcePortRanges
  name: sourcePortRanges
  summary: The source port ranges.
  signature: 'sourcePortRanges: list[str]'
- uid: azure.mgmt.network.types.AdminPropertiesFormat.sources
  name: sources
  summary: The CIDR or source IP ranges.
  signature: 'sources: list[''AddressPrefixItem'']'
