### YamlMime:PythonClass
uid: azure.mgmt.network.types.PacketCaptureParameters
name: PacketCaptureParameters
fullName: azure.mgmt.network.types.PacketCaptureParameters
module: azure.mgmt.network.types
summary: Parameters that define the create packet capture operation.
constructor:
  syntax: PacketCaptureParameters()
variables:
- description: 'The ID of the targeted resource, only AzureVM and AzureVMSS as target
    type are

    currently supported. Required.'
  name: target
  types:
  - <xref:str>
- description: 'A list of AzureVMSS instances which can be included or excluded to
    run packet

    capture. If both included and excluded are empty, then the packet capture will
    run on all

    instances of AzureVMSS.'
  name: scope
  types:
  - <xref:<xref:"PacketCaptureMachineScope">>
- description: 'Target type of the resource provided. Known values are: "AzureVM"
    and

    "AzureVMSS".'
  name: targetType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PacketCaptureTargetType">]
- description: 'Number of bytes captured per packet, the remaining bytes are

    truncated.'
  name: bytesToCapturePerPacket
  types:
  - <xref:int>
- description: Maximum size of the capture output.
  name: totalBytesPerSession
  types:
  - <xref:int>
- description: Maximum duration of the capture session in seconds.
  name: timeLimitInSeconds
  types:
  - <xref:int>
- description: The storage location for a packet capture session. Required.
  name: storageLocation
  types:
  - <xref:<xref:"PacketCaptureStorageLocation">>
- description: A list of packet capture filters.
  name: filters
  types:
  - <xref:list>[<xref:"PacketCaptureFilter">]
- description: 'This continuous capture is a nullable boolean, which can hold ''null'',

    ''true'' or ''false'' value. If we do not pass this parameter, it would be consider
    as ''null'',

    default value is ''null''.'
  name: continuousCapture
  types:
  - <xref:bool>
- description: 'The capture setting holds the ''FileCount'', ''FileSizeInBytes'',

    ''SessionTimeLimitInSeconds'' values.'
  name: captureSettings
  types:
  - <xref:<xref:"PacketCaptureSettings">>
attributes:
- uid: azure.mgmt.network.types.PacketCaptureParameters.bytesToCapturePerPacket
  name: bytesToCapturePerPacket
  summary: Number of bytes captured per packet, the remaining bytes are truncated.
  signature: 'bytesToCapturePerPacket: int'
- uid: azure.mgmt.network.types.PacketCaptureParameters.captureSettings
  name: captureSettings
  summary: 'The capture setting holds the ''FileCount'', ''FileSizeInBytes'', ''SessionTimeLimitInSeconds''

    values.'
  signature: 'captureSettings: PacketCaptureSettings'
- uid: azure.mgmt.network.types.PacketCaptureParameters.continuousCapture
  name: continuousCapture
  summary: 'This continuous capture is a nullable boolean, which can hold ''null'',
    ''true'' or ''false'' value.

    If we do not pass this parameter, it would be consider as ''null'', default value
    is ''null''.'
  signature: 'continuousCapture: bool'
- uid: azure.mgmt.network.types.PacketCaptureParameters.filters
  name: filters
  summary: A list of packet capture filters.
  signature: 'filters: list[''PacketCaptureFilter'']'
- uid: azure.mgmt.network.types.PacketCaptureParameters.scope
  name: scope
  summary: 'A list of AzureVMSS instances which can be included or excluded to run
    packet capture. If both

    included and excluded are empty, then the packet capture will run on all instances
    of

    AzureVMSS.'
  signature: 'scope: PacketCaptureMachineScope'
- uid: azure.mgmt.network.types.PacketCaptureParameters.storageLocation
  name: storageLocation
  summary: The storage location for a packet capture session. Required.
  signature: 'storageLocation: Required[PacketCaptureStorageLocation]'
- uid: azure.mgmt.network.types.PacketCaptureParameters.target
  name: target
  summary: 'The ID of the targeted resource, only AzureVM and AzureVMSS as target
    type are currently

    supported. Required.'
  signature: 'target: Required[str]'
- uid: azure.mgmt.network.types.PacketCaptureParameters.targetType
  name: targetType
  summary: '"AzureVM" and "AzureVMSS".'
  signature: 'targetType: str | PacketCaptureTargetType'
- uid: azure.mgmt.network.types.PacketCaptureParameters.timeLimitInSeconds
  name: timeLimitInSeconds
  summary: Maximum duration of the capture session in seconds.
  signature: 'timeLimitInSeconds: int'
- uid: azure.mgmt.network.types.PacketCaptureParameters.totalBytesPerSession
  name: totalBytesPerSession
  summary: Maximum size of the capture output.
  signature: 'totalBytesPerSession: int'
