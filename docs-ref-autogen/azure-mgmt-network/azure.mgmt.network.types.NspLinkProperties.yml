### YamlMime:PythonClass
uid: azure.mgmt.network.types.NspLinkProperties
name: NspLinkProperties
fullName: azure.mgmt.network.types.NspLinkProperties
module: azure.mgmt.network.types
summary: Properties of NSP Link resource.
constructor:
  syntax: NspLinkProperties()
variables:
- description: 'The provisioning state of the NSP Link resource. Known values are:

    "Succeeded", "Creating", "Updating", "Deleting", "Accepted", "Failed", and

    "WaitForRemoteCompletion".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NspLinkProvisioningState">]
- description: 'Perimeter ARM Id for the remote NSP with which the

    link gets created in Auto-approval mode. It should be used when the NSP admin
    have

    Microsoft.Network/networkSecurityPerimeters/linkPerimeter/action permission on
    the remote NSP

    resource.'
  name: autoApprovedRemotePerimeterResourceId
  types:
  - <xref:str>
- description: Remote NSP Guid with which the link gets created.
  name: remotePerimeterGuid
  types:
  - <xref:str>
- description: Remote NSP location with which the link gets created.
  name: remotePerimeterLocation
  types:
  - <xref:str>
- description: 'Local Inbound profile names to which Inbound is allowed. Use [''*'']

    to allow inbound to all profiles.'
  name: localInboundProfiles
  types:
  - <xref:list>[<xref:str>]
- description: 'Local Outbound profile names from which Outbound is allowed. In

    current version, it is readonly property and it''s value is set to [''*''] to
    allow outbound from

    all profiles. In later version, user will be able to modify it.'
  name: localOutboundProfiles
  types:
  - <xref:list>[<xref:str>]
- description: 'Remote Inbound profile names to which Inbound is allowed. Use

    [''*''] to allow inbound to all profiles. This property can only be updated in
    auto-approval

    mode.'
  name: remoteInboundProfiles
  types:
  - <xref:list>[<xref:str>]
- description: 'Remote Outbound profile names from which Outbound is allowed. In

    current version, it is readonly property and it''s value is set to [''*''] to
    allow outbound from

    all profiles. In later version, user will be able to modify it.'
  name: remoteOutboundProfiles
  types:
  - <xref:list>[<xref:str>]
- description: 'A message passed to the owner of the remote NSP link resource with
    this

    connection request. In case of Auto-approved flow, it is default to ''Auto Approved''.
    Restricted

    to 140 chars.'
  name: description
  types:
  - <xref:str>
- description: 'The NSP link state. Known values are: "Approved", "Pending", "Rejected",
    and

    "Disconnected".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"NspLinkStatus">]
attributes:
- uid: azure.mgmt.network.types.NspLinkProperties.autoApprovedRemotePerimeterResourceId
  name: autoApprovedRemotePerimeterResourceId
  summary: 'Perimeter ARM Id for the remote NSP with which the link gets created in
    Auto-approval mode. It

    should be used when the NSP admin have

    Microsoft.Network/networkSecurityPerimeters/linkPerimeter/action permission on
    the remote NSP

    resource.'
  signature: 'autoApprovedRemotePerimeterResourceId: str'
- uid: azure.mgmt.network.types.NspLinkProperties.description
  name: description
  summary: 'A message passed to the owner of the remote NSP link resource with this
    connection request. In

    case of Auto-approved flow, it is default to ''Auto Approved''. Restricted to
    140 chars.'
  signature: 'description: str'
- uid: azure.mgmt.network.types.NspLinkProperties.localInboundProfiles
  name: localInboundProfiles
  summary: 'Local Inbound profile names to which Inbound is allowed. Use [''*''] to
    allow inbound to all

    profiles.'
  signature: 'localInboundProfiles: list[str]'
- uid: azure.mgmt.network.types.NspLinkProperties.localOutboundProfiles
  name: localOutboundProfiles
  summary: 'Local Outbound profile names from which Outbound is allowed. In current
    version, it is readonly

    property and it''s value is set to [''*''] to allow outbound from all profiles.
    In later version,

    user will be able to modify it.'
  signature: 'localOutboundProfiles: list[str]'
- uid: azure.mgmt.network.types.NspLinkProperties.provisioningState
  name: provisioningState
  summary: '"Succeeded", "Creating",

    "Updating", "Deleting", "Accepted", "Failed", and "WaitForRemoteCompletion".'
  signature: 'provisioningState: str | NspLinkProvisioningState'
- uid: azure.mgmt.network.types.NspLinkProperties.remoteInboundProfiles
  name: remoteInboundProfiles
  summary: 'Remote Inbound profile names to which Inbound is allowed. Use [''*'']
    to allow inbound to all

    profiles. This property can only be updated in auto-approval mode.'
  signature: 'remoteInboundProfiles: list[str]'
- uid: azure.mgmt.network.types.NspLinkProperties.remoteOutboundProfiles
  name: remoteOutboundProfiles
  summary: 'Remote Outbound profile names from which Outbound is allowed. In current
    version, it is

    readonly property and it''s value is set to [''*''] to allow outbound from all
    profiles. In later

    version, user will be able to modify it.'
  signature: 'remoteOutboundProfiles: list[str]'
- uid: azure.mgmt.network.types.NspLinkProperties.remotePerimeterGuid
  name: remotePerimeterGuid
  summary: Remote NSP Guid with which the link gets created.
  signature: 'remotePerimeterGuid: str'
- uid: azure.mgmt.network.types.NspLinkProperties.remotePerimeterLocation
  name: remotePerimeterLocation
  summary: Remote NSP location with which the link gets created.
  signature: 'remotePerimeterLocation: str'
- uid: azure.mgmt.network.types.NspLinkProperties.status
  name: status
  summary: '"Approved", "Pending", "Rejected", and

    "Disconnected".'
  signature: 'status: str | NspLinkStatus'
