### YamlMime:PythonClass
uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat
name: NetworkInterfaceIPConfigurationPropertiesFormat
fullName: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of IP configuration.
constructor:
  syntax: NetworkInterfaceIPConfigurationPropertiesFormat()
variables:
- description: The reference to gateway load balancer frontend IP.
  name: gatewayLoadBalancer
  types:
  - <xref:<xref:"SubResource">>
- description: The reference to Virtual Network Taps.
  name: virtualNetworkTaps
  types:
  - <xref:list>[<xref:"VirtualNetworkTap">]
- description: 'The reference to

    ApplicationGatewayBackendAddressPool resource.'
  name: applicationGatewayBackendAddressPools
  types:
  - <xref:list>[<xref:"ApplicationGatewayBackendAddressPool">]
- description: 'The reference to LoadBalancerBackendAddressPool

    resource.'
  name: loadBalancerBackendAddressPools
  types:
  - <xref:list>[<xref:"BackendAddressPool">]
- description: A list of references of LoadBalancerInboundNatRules.
  name: loadBalancerInboundNatRules
  types:
  - <xref:list>[<xref:"InboundNatRule">]
- description: 'Private IP address of the IP configuration. It can be a single IP

    address or a CIDR block in the format <address>/<prefix-length>.'
  name: privateIPAddress
  types:
  - <xref:str>
- description: 'The private IP address prefix length. If specified and the

    allocation method is dynamic, the service will allocate a CIDR block instead of
    a single IP

    address.'
  name: privateIPAddressPrefixLength
  types:
  - <xref:int>
- description: 'The private IP address allocation method. Known values are:

    "Static" and "Dynamic".'
  name: privateIPAllocationMethod
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IPAllocationMethod">]
- description: 'Whether the specific IP configuration is IPv4 or IPv6. Default

    is IPv4. Known values are: "IPv4" and "IPv6".'
  name: privateIPAddressVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IPVersion">]
- description: Subnet bound to the IP configuration.
  name: subnet
  types:
  - <xref:<xref:"Subnet">>
- description: Whether this is a primary customer address on the network interface.
  name: primary
  types:
  - <xref:bool>
- description: Public IP address bound to the IP configuration.
  name: publicIPAddress
  types:
  - <xref:<xref:"PublicIPAddress">>
- description: 'Application security groups in which the IP configuration is

    included.'
  name: applicationSecurityGroups
  types:
  - <xref:list>[<xref:"ApplicationSecurityGroup">]
- description: 'The provisioning state of the network interface IP configuration.

    Known values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and
    "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'PrivateLinkConnection properties for the network

    interface.'
  name: privateLinkConnectionProperties
  types:
  - <xref:<xref:"NetworkInterfaceIPConfigurationPrivateLinkConnectionProperties">>
attributes:
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.applicationGatewayBackendAddressPools
  name: applicationGatewayBackendAddressPools
  summary: The reference to ApplicationGatewayBackendAddressPool resource.
  signature: 'applicationGatewayBackendAddressPools: list[''ApplicationGatewayBackendAddressPool'']'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.applicationSecurityGroups
  name: applicationSecurityGroups
  summary: Application security groups in which the IP configuration is included.
  signature: 'applicationSecurityGroups: list[''ApplicationSecurityGroup'']'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.gatewayLoadBalancer
  name: gatewayLoadBalancer
  summary: The reference to gateway load balancer frontend IP.
  signature: 'gatewayLoadBalancer: SubResource'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.loadBalancerBackendAddressPools
  name: loadBalancerBackendAddressPools
  summary: The reference to LoadBalancerBackendAddressPool resource.
  signature: 'loadBalancerBackendAddressPools: list[''BackendAddressPool'']'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.loadBalancerInboundNatRules
  name: loadBalancerInboundNatRules
  summary: A list of references of LoadBalancerInboundNatRules.
  signature: 'loadBalancerInboundNatRules: list[''InboundNatRule'']'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.primary
  name: primary
  summary: Whether this is a primary customer address on the network interface.
  signature: 'primary: bool'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.privateIPAddress
  name: privateIPAddress
  summary: 'Private IP address of the IP configuration. It can be a single IP address
    or a CIDR block in

    the format <address>/<prefix-length>.'
  signature: 'privateIPAddress: str'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.privateIPAddressPrefixLength
  name: privateIPAddressPrefixLength
  summary: 'The private IP address prefix length. If specified and the allocation
    method is dynamic, the

    service will allocate a CIDR block instead of a single IP address.'
  signature: 'privateIPAddressPrefixLength: int | None'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.privateIPAddressVersion
  name: privateIPAddressVersion
  summary: 'Whether the specific IP configuration is IPv4 or IPv6. Default is IPv4.
    Known values are:

    "IPv4" and "IPv6".'
  signature: 'privateIPAddressVersion: str | IPVersion'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.privateIPAllocationMethod
  name: privateIPAllocationMethod
  summary: '"Static" and "Dynamic".'
  signature: 'privateIPAllocationMethod: str | IPAllocationMethod'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.privateLinkConnectionProperties
  name: privateLinkConnectionProperties
  summary: PrivateLinkConnection properties for the network interface.
  signature: 'privateLinkConnectionProperties: NetworkInterfaceIPConfigurationPrivateLinkConnectionProperties'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.publicIPAddress
  name: publicIPAddress
  summary: Public IP address bound to the IP configuration.
  signature: 'publicIPAddress: PublicIPAddress'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.subnet
  name: subnet
  summary: Subnet bound to the IP configuration.
  signature: 'subnet: Subnet'
- uid: azure.mgmt.network.types.NetworkInterfaceIPConfigurationPropertiesFormat.virtualNetworkTaps
  name: virtualNetworkTaps
  summary: The reference to Virtual Network Taps.
  signature: 'virtualNetworkTaps: list[''VirtualNetworkTap'']'
