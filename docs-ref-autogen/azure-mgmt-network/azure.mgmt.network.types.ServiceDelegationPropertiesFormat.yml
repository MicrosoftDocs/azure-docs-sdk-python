### YamlMime:PythonClass
uid: azure.mgmt.network.types.ServiceDelegationPropertiesFormat
name: ServiceDelegationPropertiesFormat
fullName: azure.mgmt.network.types.ServiceDelegationPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of a service delegation.
constructor:
  syntax: ServiceDelegationPropertiesFormat()
variables:
- description: 'The name of the service to whom the subnet should be delegated (e.g.

    Microsoft.Sql/servers).'
  name: serviceName
  types:
  - <xref:str>
- description: The actions permitted to the service upon delegation.
  name: actions
  types:
  - <xref:list>[<xref:str>]
- description: 'The provisioning state of the service delegation resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.ServiceDelegationPropertiesFormat.actions
  name: actions
  summary: The actions permitted to the service upon delegation.
  signature: 'actions: list[str]'
- uid: azure.mgmt.network.types.ServiceDelegationPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.ServiceDelegationPropertiesFormat.serviceName
  name: serviceName
  summary: The name of the service to whom the subnet should be delegated (e.g. Microsoft.Sql/servers).
  signature: 'serviceName: str'
