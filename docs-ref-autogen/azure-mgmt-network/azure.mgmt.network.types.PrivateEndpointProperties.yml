### YamlMime:PythonClass
uid: azure.mgmt.network.types.PrivateEndpointProperties
name: PrivateEndpointProperties
fullName: azure.mgmt.network.types.PrivateEndpointProperties
module: azure.mgmt.network.types
summary: Properties of the private endpoint.
constructor:
  syntax: PrivateEndpointProperties()
variables:
- description: The ID of the subnet from which the private IP will be allocated.
  name: subnet
  types:
  - <xref:<xref:"Subnet">>
- description: 'An array of references to the network interfaces created for this

    private endpoint.'
  name: networkInterfaces
  types:
  - <xref:list>[<xref:"NetworkInterface">]
- description: 'The provisioning state of the private endpoint resource. Known values

    are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Specifies the IP version type for the private IPs of the private endpoint.

    If not defined, this defaults to IPv4. Known values are: "IPv4", "IPv6", and "DualStack".'
  name: ipVersionType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PrivateEndpointIPVersionType">]
- description: 'A grouping of information about the connection to the

    remote resource.'
  name: privateLinkServiceConnections
  types:
  - <xref:list>[<xref:"PrivateLinkServiceConnection">]
- description: 'A grouping of information about the connection to

    the remote resource. Used when the network admin does not have access to approve
    connections to

    the remote resource.'
  name: manualPrivateLinkServiceConnections
  types:
  - <xref:list>[<xref:"PrivateLinkServiceConnection">]
- description: An array of custom dns configurations.
  name: customDnsConfigs
  types:
  - <xref:list>[<xref:"CustomDnsConfigPropertiesFormat">]
- description: 'Application security groups in which the private endpoint IP

    configuration is included.'
  name: applicationSecurityGroups
  types:
  - <xref:list>[<xref:"ApplicationSecurityGroup">]
- description: 'A list of IP configurations of the private endpoint. This will be
    used

    to map to the First Party Service''s endpoints.'
  name: ipConfigurations
  types:
  - <xref:list>[<xref:"PrivateEndpointIPConfiguration">]
- description: 'The custom name of the network interface attached to the

    private endpoint.'
  name: customNetworkInterfaceName
  types:
  - <xref:str>
- description: 'The billing sku of the private endpoint. Known values are: "PayAsYouGo"
    and

    "Fixed".'
  name: billingSku
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PrivateEndpointBillingSku">]
attributes:
- uid: azure.mgmt.network.types.PrivateEndpointProperties.applicationSecurityGroups
  name: applicationSecurityGroups
  summary: Application security groups in which the private endpoint IP configuration
    is included.
  signature: 'applicationSecurityGroups: list[''ApplicationSecurityGroup'']'
- uid: azure.mgmt.network.types.PrivateEndpointProperties.billingSku
  name: billingSku
  summary: '"PayAsYouGo" and "Fixed".'
  signature: 'billingSku: str | PrivateEndpointBillingSku'
- uid: azure.mgmt.network.types.PrivateEndpointProperties.customDnsConfigs
  name: customDnsConfigs
  summary: An array of custom dns configurations.
  signature: 'customDnsConfigs: list[''CustomDnsConfigPropertiesFormat'']'
- uid: azure.mgmt.network.types.PrivateEndpointProperties.customNetworkInterfaceName
  name: customNetworkInterfaceName
  summary: The custom name of the network interface attached to the private endpoint.
  signature: 'customNetworkInterfaceName: str'
- uid: azure.mgmt.network.types.PrivateEndpointProperties.ipConfigurations
  name: ipConfigurations
  summary: 'A list of IP configurations of the private endpoint. This will be used
    to map to the First

    Party Service''s endpoints.'
  signature: 'ipConfigurations: list[''PrivateEndpointIPConfiguration'']'
- uid: azure.mgmt.network.types.PrivateEndpointProperties.ipVersionType
  name: ipVersionType
  summary: 'Specifies the IP version type for the private IPs of the private endpoint.
    If not defined, this

    defaults to IPv4. Known values are: "IPv4", "IPv6", and "DualStack".'
  signature: 'ipVersionType: str | PrivateEndpointIPVersionType'
- uid: azure.mgmt.network.types.PrivateEndpointProperties.manualPrivateLinkServiceConnections
  name: manualPrivateLinkServiceConnections
  summary: 'A grouping of information about the connection to the remote resource.
    Used when the network

    admin does not have access to approve connections to the remote resource.'
  signature: 'manualPrivateLinkServiceConnections: list[''PrivateLinkServiceConnection'']'
- uid: azure.mgmt.network.types.PrivateEndpointProperties.networkInterfaces
  name: networkInterfaces
  summary: An array of references to the network interfaces created for this private
    endpoint.
  signature: 'networkInterfaces: list[''NetworkInterface'']'
- uid: azure.mgmt.network.types.PrivateEndpointProperties.privateLinkServiceConnections
  name: privateLinkServiceConnections
  summary: A grouping of information about the connection to the remote resource.
  signature: 'privateLinkServiceConnections: list[''PrivateLinkServiceConnection'']'
- uid: azure.mgmt.network.types.PrivateEndpointProperties.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.PrivateEndpointProperties.subnet
  name: subnet
  summary: The ID of the subnet from which the private IP will be allocated.
  signature: 'subnet: Subnet'
