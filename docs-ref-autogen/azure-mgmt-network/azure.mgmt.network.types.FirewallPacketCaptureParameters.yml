### YamlMime:PythonClass
uid: azure.mgmt.network.types.FirewallPacketCaptureParameters
name: FirewallPacketCaptureParameters
fullName: azure.mgmt.network.types.FirewallPacketCaptureParameters
module: azure.mgmt.network.types
summary: Azure Firewall Packet Capture Parameters.
constructor:
  syntax: FirewallPacketCaptureParameters()
variables:
- description: 'Duration of packet capture in seconds. If the field is not provided,

    the default value is 60.'
  name: durationInSeconds
  types:
  - <xref:int>
- description: 'Number of packets to be captured. If the field is not provided,

    the default value is 1000.'
  name: numberOfPacketsToCapture
  types:
  - <xref:int>
- description: Upload capture location.
  name: sasUrl
  types:
  - <xref:str>
- description: Name of file to be uploaded to sasURL.
  name: fileName
  types:
  - <xref:str>
- description: 'The protocol of packets to capture. Known values are: "TCP", "UDP",
    "Any", and

    "ICMP".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureFirewallNetworkRuleProtocol">]
- description: The tcp-flag type to be captured. Used with protocol TCP.
  name: flags
  types:
  - <xref:list>[<xref:"AzureFirewallPacketCaptureFlags">]
- description: Rules to filter packet captures.
  name: filters
  types:
  - <xref:list>[<xref:"AzureFirewallPacketCaptureRule">]
- description: 'The packet capture operation to perform. If the Start operation is
    selected,

    please provide all the fields in the firewallPacketCaptureParameters to successfully
    initiate

    the packet capture. If the Status or Stop operation is selected, only the operation
    field is

    required; all other fields in the firewallPacketCaptureParameters can be omitted
    to

    successfully retrieve the capture status or stop the capture. Known values are:
    "Start",

    "Status", and "Stop".'
  name: operation
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureFirewallPacketCaptureOperationType">]
attributes:
- uid: azure.mgmt.network.types.FirewallPacketCaptureParameters.durationInSeconds
  name: durationInSeconds
  summary: Duration of packet capture in seconds. If the field is not provided, the
    default value is 60.
  signature: 'durationInSeconds: int'
- uid: azure.mgmt.network.types.FirewallPacketCaptureParameters.fileName
  name: fileName
  summary: Name of file to be uploaded to sasURL.
  signature: 'fileName: str'
- uid: azure.mgmt.network.types.FirewallPacketCaptureParameters.filters
  name: filters
  summary: Rules to filter packet captures.
  signature: 'filters: list[''AzureFirewallPacketCaptureRule'']'
- uid: azure.mgmt.network.types.FirewallPacketCaptureParameters.flags
  name: flags
  summary: The tcp-flag type to be captured. Used with protocol TCP.
  signature: 'flags: list[''AzureFirewallPacketCaptureFlags'']'
- uid: azure.mgmt.network.types.FirewallPacketCaptureParameters.numberOfPacketsToCapture
  name: numberOfPacketsToCapture
  summary: Number of packets to be captured. If the field is not provided, the default
    value is 1000.
  signature: 'numberOfPacketsToCapture: int'
- uid: azure.mgmt.network.types.FirewallPacketCaptureParameters.operation
  name: operation
  summary: 'The packet capture operation to perform. If the Start operation is selected,
    please provide all

    the fields in the firewallPacketCaptureParameters to successfully initiate the
    packet capture.

    If the Status or Stop operation is selected, only the operation field is required;
    all other

    fields in the firewallPacketCaptureParameters can be omitted to successfully retrieve
    the

    capture status or stop the capture. Known values are: "Start", "Status", and "Stop".'
  signature: 'operation: str | AzureFirewallPacketCaptureOperationType'
- uid: azure.mgmt.network.types.FirewallPacketCaptureParameters.protocol
  name: protocol
  summary: '"TCP", "UDP", "Any", and "ICMP".'
  signature: 'protocol: str | AzureFirewallNetworkRuleProtocol'
- uid: azure.mgmt.network.types.FirewallPacketCaptureParameters.sasUrl
  name: sasUrl
  summary: Upload capture location.
  signature: 'sasUrl: str'
