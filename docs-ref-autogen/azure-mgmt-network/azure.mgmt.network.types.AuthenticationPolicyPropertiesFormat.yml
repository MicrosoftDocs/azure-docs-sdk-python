### YamlMime:PythonClass
uid: azure.mgmt.network.types.AuthenticationPolicyPropertiesFormat
name: AuthenticationPolicyPropertiesFormat
fullName: azure.mgmt.network.types.AuthenticationPolicyPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of the authentication policy.
constructor:
  syntax: AuthenticationPolicyPropertiesFormat()
variables:
- description: 'The type of the user trust provider. Only Microsoft Entra is

    supported, using the serialized value `entra`. Required. "entra"'
  name: userTrustProviderType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"UserTrustProviderType">]
- description: 'The action to take when a request is unauthenticated. When

    omitted, user sign-in policies default to `authenticate` and JWT validation policies
    default

    to `deny`. Known values are: "allow", "authenticate", and "deny".'
  name: onUnauthenticatedRequest
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OnUnauthenticatedRequest">]
- description: 'The authentication provider configuration for the policy.

    Required.'
  name: authenticationProperties
  types:
  - <xref:<xref:"AuthenticationProviderProperties">>
- description: 'A collection of resource IDs that reference this authentication

    policy.'
  name: associatedResources
  types:
  - <xref:list>[<xref:str>]
- description: 'The provisioning state of the authentication policy resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The resource GUID property of the authentication policy resource.
  name: resourceGuid
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.types.AuthenticationPolicyPropertiesFormat.associatedResources
  name: associatedResources
  summary: A collection of resource IDs that reference this authentication policy.
  signature: 'associatedResources: list[str]'
- uid: azure.mgmt.network.types.AuthenticationPolicyPropertiesFormat.authenticationProperties
  name: authenticationProperties
  summary: The authentication provider configuration for the policy. Required.
  signature: 'authenticationProperties: Required[AuthenticationProviderProperties]'
- uid: azure.mgmt.network.types.AuthenticationPolicyPropertiesFormat.onUnauthenticatedRequest
  name: onUnauthenticatedRequest
  summary: 'The action to take when a request is unauthenticated. When omitted, user
    sign-in policies

    default to `authenticate` and JWT validation policies default to `deny`. Known
    values are:

    "allow", "authenticate", and "deny".'
  signature: 'onUnauthenticatedRequest: str | OnUnauthenticatedRequest'
- uid: azure.mgmt.network.types.AuthenticationPolicyPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.AuthenticationPolicyPropertiesFormat.resourceGuid
  name: resourceGuid
  summary: The resource GUID property of the authentication policy resource.
  signature: 'resourceGuid: str'
- uid: azure.mgmt.network.types.AuthenticationPolicyPropertiesFormat.userTrustProviderType
  name: userTrustProviderType
  summary: 'The type of the user trust provider. Only Microsoft Entra is supported,
    using the serialized

    value `entra`. Required. "entra"'
  signature: 'userTrustProviderType: Required[str | UserTrustProviderType]'
