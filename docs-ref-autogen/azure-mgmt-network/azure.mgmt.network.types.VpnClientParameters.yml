### YamlMime:PythonClass
uid: azure.mgmt.network.types.VpnClientParameters
name: VpnClientParameters
fullName: azure.mgmt.network.types.VpnClientParameters
module: azure.mgmt.network.types
summary: Vpn Client Parameters for package generation.
constructor:
  syntax: VpnClientParameters()
variables:
- description: 'VPN client Processor Architecture. Known values are: "Amd64" and

    "X86".'
  name: processorArchitecture
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProcessorArchitecture">]
- description: 'VPN client authentication method. Known values are: "EAPTLS" and

    "EAPMSCHAPv2".'
  name: authenticationMethod
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AuthenticationMethod">]
- description: 'The public certificate data for the radius server

    authentication certificate as a Base-64 encoded string. Required only if external
    radius

    authentication has been configured with EAPTLS authentication.'
  name: radiusServerAuthCertificate
  types:
  - <xref:str>
- description: 'A list of client root certificates public certificate data

    encoded as Base-64 strings. Optional parameter for external radius based authentication
    with

    EAPTLS.'
  name: clientRootCertificates
  types:
  - <xref:list>[<xref:str>]
attributes:
- uid: azure.mgmt.network.types.VpnClientParameters.authenticationMethod
  name: authenticationMethod
  summary: '"EAPTLS" and "EAPMSCHAPv2".'
  signature: 'authenticationMethod: str | AuthenticationMethod'
- uid: azure.mgmt.network.types.VpnClientParameters.clientRootCertificates
  name: clientRootCertificates
  summary: 'A list of client root certificates public certificate data encoded as
    Base-64 strings. Optional

    parameter for external radius based authentication with EAPTLS.'
  signature: 'clientRootCertificates: list[str]'
- uid: azure.mgmt.network.types.VpnClientParameters.processorArchitecture
  name: processorArchitecture
  summary: '"Amd64" and "X86".'
  signature: 'processorArchitecture: str | ProcessorArchitecture'
- uid: azure.mgmt.network.types.VpnClientParameters.radiusServerAuthCertificate
  name: radiusServerAuthCertificate
  summary: 'The public certificate data for the radius server authentication certificate
    as a Base-64

    encoded string. Required only if external radius authentication has been configured
    with EAPTLS

    authentication.'
  signature: 'radiusServerAuthCertificate: str'
