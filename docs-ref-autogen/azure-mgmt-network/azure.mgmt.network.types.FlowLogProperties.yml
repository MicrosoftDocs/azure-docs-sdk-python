### YamlMime:PythonClass
uid: azure.mgmt.network.types.FlowLogProperties
name: FlowLogProperties
fullName: azure.mgmt.network.types.FlowLogProperties
module: azure.mgmt.network.types
summary: Parameters that define the configuration of flow log.
constructor:
  syntax: FlowLogProperties()
variables:
- description: ID of the storage account which is used to store the flow log. Required.
  name: storageId
  types:
  - <xref:str>
- description: 'Optional field to filter network traffic logs based on SrcIP,

    SrcPort, DstIP, DstPort, Protocol, Encryption, Direction and Action. If not specified,
    all

    network traffic will be logged.'
  name: enabledFilteringCriteria
  types:
  - <xref:str>
- description: 'Optional field to filter network traffic logs based on flow states.
    Value of

    this field could be any comma separated combination string of letters B,C,E or
    D. B represents

    Begin, when a flow is created. C represents Continue for an ongoing flow generated
    at every

    five-minute interval. E represents End, when a flow is terminated. D represents
    Deny, when a

    flow is denied. If not specified, all network traffic will be logged.'
  name: recordTypes
  types:
  - <xref:str>
- description: Flag to enable/disable flow logging. Required.
  name: enabled
  types:
  - <xref:bool>
- description: Parameters that define the retention policy for flow log.
  name: retentionPolicy
  types:
  - <xref:<xref:"RetentionPolicyParameters">>
- description: Parameters that define the flow log format.
  name: format
  types:
  - <xref:<xref:"FlowLogFormatParameters">>
attributes:
- uid: azure.mgmt.network.types.FlowLogProperties.enabled
  name: enabled
  summary: Flag to enable/disable flow logging. Required.
  signature: 'enabled: bool'
- uid: azure.mgmt.network.types.FlowLogProperties.enabledFilteringCriteria
  name: enabledFilteringCriteria
  summary: 'Optional field to filter network traffic logs based on SrcIP, SrcPort,
    DstIP, DstPort,

    Protocol, Encryption, Direction and Action. If not specified, all network traffic
    will be

    logged.'
  signature: 'enabledFilteringCriteria: str'
- uid: azure.mgmt.network.types.FlowLogProperties.format
  name: format
  summary: Parameters that define the flow log format.
  signature: 'format: FlowLogFormatParameters'
- uid: azure.mgmt.network.types.FlowLogProperties.recordTypes
  name: recordTypes
  summary: 'Optional field to filter network traffic logs based on flow states. Value
    of this field could

    be any comma separated combination string of letters B,C,E or D. B represents
    Begin, when a

    flow is created. C represents Continue for an ongoing flow generated at every
    five-minute

    interval. E represents End, when a flow is terminated. D represents Deny, when
    a flow is

    denied. If not specified, all network traffic will be logged.'
  signature: 'recordTypes: str'
- uid: azure.mgmt.network.types.FlowLogProperties.retentionPolicy
  name: retentionPolicy
  summary: Parameters that define the retention policy for flow log.
  signature: 'retentionPolicy: RetentionPolicyParameters'
- uid: azure.mgmt.network.types.FlowLogProperties.storageId
  name: storageId
  summary: ID of the storage account which is used to store the flow log. Required.
  signature: 'storageId: str'
