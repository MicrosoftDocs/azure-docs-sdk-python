### YamlMime:PythonClass
uid: azure.mgmt.network.types.LoadBalancerPropertiesFormat
name: LoadBalancerPropertiesFormat
fullName: azure.mgmt.network.types.LoadBalancerPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of the load balancer.
constructor:
  syntax: LoadBalancerPropertiesFormat()
variables:
- description: 'Object representing the frontend IPs to be used for the load

    balancer.'
  name: frontendIPConfigurations
  types:
  - <xref:list>[<xref:"FrontendIPConfiguration">]
- description: Collection of backend address pools used by a load balancer.
  name: backendAddressPools
  types:
  - <xref:list>[<xref:"BackendAddressPool">]
- description: 'Object collection representing the load balancing rules Gets the

    provisioning.'
  name: loadBalancingRules
  types:
  - <xref:list>[<xref:"LoadBalancingRule">]
- description: Collection of probe objects used in the load balancer.
  name: probes
  types:
  - <xref:list>[<xref:"Probe">]
- description: 'Collection of inbound NAT Rules used by a load balancer. Defining

    inbound NAT rules on your load balancer is mutually exclusive with defining an
    inbound NAT

    pool. Inbound NAT pools are referenced from virtual machine scale sets. NICs that
    are

    associated with individual virtual machines cannot reference an Inbound NAT pool.
    They have to

    reference individual inbound NAT rules.'
  name: inboundNatRules
  types:
  - <xref:list>[<xref:"InboundNatRule">]
- description: 'Defines an external port range for inbound NAT to a single backend
    port

    on NICs associated with a load balancer. Inbound NAT rules are created automatically
    for each

    NIC associated with the Load Balancer using an external port from this range.
    Defining an

    Inbound NAT pool on your Load Balancer is mutually exclusive with defining inbound
    NAT rules.

    Inbound NAT pools are referenced from virtual machine scale sets. NICs that are
    associated with

    individual virtual machines cannot reference an inbound NAT pool. They have to
    reference

    individual inbound NAT rules.'
  name: inboundNatPools
  types:
  - <xref:list>[<xref:"InboundNatPool">]
- description: The outbound rules.
  name: outboundRules
  types:
  - <xref:list>[<xref:"OutboundRule">]
- description: The resource GUID property of the load balancer resource.
  name: resourceGuid
  types:
  - <xref:str>
- description: 'The provisioning state of the load balancer resource. Known values

    are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Indicates the scope of the load balancer: external (Public) or internal
    (Private).

    Known values are: "Public" and "Private".'
  name: scope
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LoadBalancerScope">]
- description: 'The load balancer mode. Set to `Advanced` to enable additional capabilities
    on a

    Standard SKU load balancer. Advanced mode must be specified at creation and cannot
    be changed

    afterward. "Advanced"'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LoadBalancerMode">]
attributes:
- uid: azure.mgmt.network.types.LoadBalancerPropertiesFormat.backendAddressPools
  name: backendAddressPools
  summary: Collection of backend address pools used by a load balancer.
  signature: 'backendAddressPools: list[''BackendAddressPool'']'
- uid: azure.mgmt.network.types.LoadBalancerPropertiesFormat.frontendIPConfigurations
  name: frontendIPConfigurations
  summary: Object representing the frontend IPs to be used for the load balancer.
  signature: 'frontendIPConfigurations: list[''FrontendIPConfiguration'']'
- uid: azure.mgmt.network.types.LoadBalancerPropertiesFormat.inboundNatPools
  name: inboundNatPools
  summary: 'Defines an external port range for inbound NAT to a single backend port
    on NICs associated with

    a load balancer. Inbound NAT rules are created automatically for each NIC associated
    with the

    Load Balancer using an external port from this range. Defining an Inbound NAT
    pool on your Load

    Balancer is mutually exclusive with defining inbound NAT rules. Inbound NAT pools
    are

    referenced from virtual machine scale sets. NICs that are associated with individual
    virtual

    machines cannot reference an inbound NAT pool. They have to reference individual
    inbound NAT

    rules.'
  signature: 'inboundNatPools: list[''InboundNatPool'']'
- uid: azure.mgmt.network.types.LoadBalancerPropertiesFormat.inboundNatRules
  name: inboundNatRules
  summary: 'Collection of inbound NAT Rules used by a load balancer. Defining inbound
    NAT rules on your

    load balancer is mutually exclusive with defining an inbound NAT pool. Inbound
    NAT pools are

    referenced from virtual machine scale sets. NICs that are associated with individual
    virtual

    machines cannot reference an Inbound NAT pool. They have to reference individual
    inbound NAT

    rules.'
  signature: 'inboundNatRules: list[''InboundNatRule'']'
- uid: azure.mgmt.network.types.LoadBalancerPropertiesFormat.loadBalancingRules
  name: loadBalancingRules
  summary: Object collection representing the load balancing rules Gets the provisioning.
  signature: 'loadBalancingRules: list[''LoadBalancingRule'']'
- uid: azure.mgmt.network.types.LoadBalancerPropertiesFormat.mode
  name: mode
  summary: 'The load balancer mode. Set to `Advanced` to enable additional capabilities
    on a Standard SKU

    load balancer. Advanced mode must be specified at creation and cannot be changed
    afterward.

    "Advanced"'
  signature: 'mode: str | LoadBalancerMode'
- uid: azure.mgmt.network.types.LoadBalancerPropertiesFormat.outboundRules
  name: outboundRules
  summary: The outbound rules.
  signature: 'outboundRules: list[''OutboundRule'']'
- uid: azure.mgmt.network.types.LoadBalancerPropertiesFormat.probes
  name: probes
  summary: Collection of probe objects used in the load balancer.
  signature: 'probes: list[''Probe'']'
- uid: azure.mgmt.network.types.LoadBalancerPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.LoadBalancerPropertiesFormat.resourceGuid
  name: resourceGuid
  summary: The resource GUID property of the load balancer resource.
  signature: 'resourceGuid: str'
- uid: azure.mgmt.network.types.LoadBalancerPropertiesFormat.scope
  name: scope
  summary: 'external (Public) or internal (Private). Known values

    are: "Public" and "Private".'
  signature: 'scope: str | LoadBalancerScope'
