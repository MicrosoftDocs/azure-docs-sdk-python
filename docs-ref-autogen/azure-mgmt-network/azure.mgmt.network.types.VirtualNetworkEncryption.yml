### YamlMime:PythonClass
uid: azure.mgmt.network.types.VirtualNetworkEncryption
name: VirtualNetworkEncryption
fullName: azure.mgmt.network.types.VirtualNetworkEncryption
module: azure.mgmt.network.types
summary: 'Indicates if encryption is enabled on virtual network and if VM without
  encryption is allowed

  in encrypted VNet.'
constructor:
  syntax: VirtualNetworkEncryption()
variables:
- description: Indicates if encryption is enabled on the virtual network. Required.
  name: enabled
  types:
  - <xref:bool>
- description: 'If the encrypted VNet allows VM that does not support encryption.
    This field

    is for future support, AllowUnencrypted is the only supported value at general
    availability.

    Known values are: "DropUnencrypted" and "AllowUnencrypted".'
  name: enforcement
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualNetworkEncryptionEnforcement">]
attributes:
- uid: azure.mgmt.network.types.VirtualNetworkEncryption.enabled
  name: enabled
  summary: Indicates if encryption is enabled on the virtual network. Required.
  signature: 'enabled: Required[bool]'
- uid: azure.mgmt.network.types.VirtualNetworkEncryption.enforcement
  name: enforcement
  summary: 'If the encrypted VNet allows VM that does not support encryption. This
    field is for future

    support, AllowUnencrypted is the only supported value at general availability.
    Known values

    are: "DropUnencrypted" and "AllowUnencrypted".'
  signature: 'enforcement: str | VirtualNetworkEncryptionEnforcement'
