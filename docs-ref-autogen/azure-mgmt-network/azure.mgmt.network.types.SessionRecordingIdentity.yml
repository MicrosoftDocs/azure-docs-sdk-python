uid: azure.mgmt.network.types.SessionRecordingIdentity
name: SessionRecordingIdentity
fullName: azure.mgmt.network.types.SessionRecordingIdentity
module: azure.mgmt.network.types
summary: The identity to use for accessing the blob container where recordings will
  be stored.
constructor:
  syntax: SessionRecordingIdentity()
variables:
- description: 'The type of identity to use. Required. Known values are: "SystemAssigned"
    and

    "UserAssigned".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SessionRecordingIdentityType">]
- description: 'User assigned identity to use for accessing blob container Uri.

    Ex: /subscriptions/fa5fc227-a624-475e-b696-cdd604c735bc/resourceGroups/<resource

    group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myId. Mutually
    exclusive with

    identity type systemAssigned.'
  name: userAssignedIdentityId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.types.SessionRecordingIdentity.type
  name: type
  summary: '"SystemAssigned" and

    "UserAssigned".'
  signature: 'type: Required[str | SessionRecordingIdentityType]'
- uid: azure.mgmt.network.types.SessionRecordingIdentity.userAssignedIdentityId
  name: userAssignedIdentityId
  summary: 'User assigned identity to use for accessing blob container Uri. Ex:

    /subscriptions/fa5fc227-a624-475e-b696-cdd604c735bc/resourceGroups/<resource

    group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myId. Mutually
    exclusive with

    identity type systemAssigned.'
  signature: 'userAssignedIdentityId: str'
