uid: azure.mgmt.network.types.WebApplicationFirewallPolicyPropertiesFormat
name: WebApplicationFirewallPolicyPropertiesFormat
fullName: azure.mgmt.network.types.WebApplicationFirewallPolicyPropertiesFormat
module: azure.mgmt.network.types
summary: Defines web application firewall policy properties.
constructor:
  syntax: WebApplicationFirewallPolicyPropertiesFormat()
variables:
- description: The PolicySettings for policy.
  name: policySettings
  types:
  - <xref:<xref:"PolicySettings">>
- description: The custom rules inside the policy.
  name: customRules
  types:
  - <xref:list>[<xref:"WebApplicationFirewallCustomRule">]
- description: A collection of references to application gateways.
  name: applicationGateways
