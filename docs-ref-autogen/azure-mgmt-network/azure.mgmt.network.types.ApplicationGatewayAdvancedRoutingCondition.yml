uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingCondition
name: ApplicationGatewayAdvancedRoutingCondition
fullName: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingCondition
module: azure.mgmt.network.types
summary: A condition evaluated as part of an advanced routing condition set.
constructor:
  syntax: ApplicationGatewayAdvancedRoutingCondition()
variables:
- description: 'The type of request property the condition is evaluated against. Required.

    Known values are: "Header", "QueryString", "Path", "ClientIP", and "Method".'
  name: conditionType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewayAdvancedRoutingConditionType">]
- description: 'Name of the request property the condition is evaluated against. Required

    when conditionType is Header or QueryString, and not applicable when conditionType
    is Path,

    ClientIP or Method.'
  name: propertyName
  types:
  - <xref:str>
- description: 'Values the request property is matched against. Exactly one of

    propertyValues or propertyValueMatcher must be specified.'
  name: propertyValues
  types:
  - <xref:list>[<xref:str>]
- description: 'Pattern the request property is matched against. Exactly one of

    propertyValues or propertyValueMatcher must be specified. Not applicable when
    conditionType is

    ClientIP or Method.'
  name: propertyValueMatcher
  types:
  - <xref:<xref:"ApplicationGatewayAdvancedRoutingPropertyValueMatcher">>
attributes:
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingCondition.conditionType
  name: conditionType
  summary: 'The type of request property the condition is evaluated against. Required.
    Known values are:

    "Header", "QueryString", "Path", "ClientIP", and "Method".'
  signature: 'conditionType: Required[str | ApplicationGatewayAdvancedRoutingConditionType]'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingCondition.propertyName
  name: propertyName
  summary: 'Name of the request property the condition is evaluated against. Required
    when conditionType is

    Header or QueryString, and not applicable when conditionType is Path, ClientIP
    or Method.'
  signature: 'propertyName: str'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingCondition.propertyValueMatcher
  name: propertyValueMatcher
  summary: 'Pattern the request property is matched against. Exactly one of propertyValues
    or

    propertyValueMatcher must be specified. Not applicable when conditionType is ClientIP
    or

    Method.'
  signature: 'propertyValueMatcher: ApplicationGatewayAdvancedRoutingPropertyValueMatcher'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingCondition.propertyValues
  name: propertyValues
  summary: 'Values the request property is matched against. Exactly one of propertyValues
    or

    propertyValueMatcher must be specified.'
  signature: 'propertyValues: list[str]'
