### YamlMime:PythonClass
uid: azure.mgmt.network.types.VerificationIPFlowParameters
name: VerificationIPFlowParameters
fullName: azure.mgmt.network.types.VerificationIPFlowParameters
module: azure.mgmt.network.types
summary: Parameters that define the IP flow to be verified.
constructor:
  syntax: VerificationIPFlowParameters()
variables:
- description: The ID of the target resource to perform next-hop on. Required.
  name: targetResourceId
  types:
  - <xref:str>
- description: 'The direction of the packet represented as a 5-tuple. Required. Known
    values

    are: "Inbound" and "Outbound".'
  name: direction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"Direction">]
- description: 'Protocol to be verified on. Required. Known values are: "TCP" and
    "UDP".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IpFlowProtocol">]
- description: 'The local port. Acceptable values are a single integer in the range
    (0-65535).

    Support for * for the source port, which depends on the direction. Required.'
  name: localPort
  types:
  - <xref:str>
- description: 'The remote port. Acceptable values are a single integer in the range

    (0-65535). Support for * for the source port, which depends on the direction.
    Required.'
  name: remotePort
  types:
  - <xref:str>
- description: 'The local IP address. Acceptable values are valid IPv4 addresses.

    Required.'
  name: localIPAddress
  types:
  - <xref:str>
- description: 'The remote IP address. Acceptable values are valid IPv4 addresses.

    Required.'
  name: remoteIPAddress
  types:
  - <xref:str>
- description: 'The NIC ID. (If VM has multiple NICs and IP forwarding is enabled
    on

    any of them, then this parameter must be specified. Otherwise optional).'
  name: targetNicResourceId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.types.VerificationIPFlowParameters.direction
  name: direction
  summary: '"Inbound"

    and "Outbound".'
  signature: 'direction: Required[str | Direction]'
- uid: azure.mgmt.network.types.VerificationIPFlowParameters.localIPAddress
  name: localIPAddress
  summary: The local IP address. Acceptable values are valid IPv4 addresses. Required.
  signature: 'localIPAddress: Required[str]'
- uid: azure.mgmt.network.types.VerificationIPFlowParameters.localPort
  name: localPort
  summary: 'The local port. Acceptable values are a single integer in the range (0-65535).
    Support for *

    for the source port, which depends on the direction. Required.'
  signature: 'localPort: Required[str]'
- uid: azure.mgmt.network.types.VerificationIPFlowParameters.protocol
  name: protocol
  summary: '"TCP" and "UDP".'
  signature: 'protocol: Required[str | IpFlowProtocol]'
- uid: azure.mgmt.network.types.VerificationIPFlowParameters.remoteIPAddress
  name: remoteIPAddress
  summary: The remote IP address. Acceptable values are valid IPv4 addresses. Required.
  signature: 'remoteIPAddress: Required[str]'
- uid: azure.mgmt.network.types.VerificationIPFlowParameters.remotePort
  name: remotePort
  summary: 'The remote port. Acceptable values are a single integer in the range (0-65535).
    Support for *

    for the source port, which depends on the direction. Required.'
  signature: 'remotePort: Required[str]'
- uid: azure.mgmt.network.types.VerificationIPFlowParameters.targetNicResourceId
  name: targetNicResourceId
  summary: 'The NIC ID. (If VM has multiple NICs and IP forwarding is enabled on any
    of them, then this

    parameter must be specified. Otherwise optional).'
  signature: 'targetNicResourceId: str'
- uid: azure.mgmt.network.types.VerificationIPFlowParameters.targetResourceId
  name: targetResourceId
  summary: The ID of the target resource to perform next-hop on. Required.
  signature: 'targetResourceId: Required[str]'
