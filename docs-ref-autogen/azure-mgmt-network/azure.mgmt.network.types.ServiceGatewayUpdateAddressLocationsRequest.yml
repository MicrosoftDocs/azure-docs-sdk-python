variables:
- description: "Specifies the type of update operation to perform on address locations\
    \ within the\nservice gateway.\n\n* FullUpdate: Replaces all existing address\
    \ location data with the new list provided in the request. Any previously defined\
    \ locations not included will be removed. \n\n* PartialUpdate: Updates only the\
    \ specified address locations. Known values are: \"FullUpdate\" and \"PartialUpdate\"\
    ."
