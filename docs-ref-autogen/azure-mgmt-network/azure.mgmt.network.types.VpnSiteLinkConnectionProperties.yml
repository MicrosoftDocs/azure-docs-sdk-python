  - <xref:<xref:"SubResource">>
- description: Routing weight for vpn connection.
  name: routingWeight
  types:
  - <xref:int>
- description: 'Vpn link connection mode. Known values are: "Default",

    "ResponderOnly", and "InitiatorOnly".'
  name: vpnLinkConnectionMode
