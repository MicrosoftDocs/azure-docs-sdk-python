  name: ingressBytesTransferred
  types:
  - <xref:int>
- description: Egress bytes transferred.
  name: egressBytesTransferred
  types:
  - <xref:int>
- description: Expected bandwidth in MBPS.
  name: connectionBandwidth
  types:
  - <xref:int>
- description: 'SharedKey for the vpn link connection. We will no longer return sharedKey
    in

    any Create/Update/Get/List/UpdateTags VpnGateway/VpnConnection/VpnLinkConnection
    APIs response.

    Please use ''Vpn Link Connections - List Default Shared Key'' API to fetch Vpn
    link connection

    sharedKey.'
  name: sharedKey
  types:
  - <xref:str>
- description: EnableBgp flag.
  name: enableBgp
