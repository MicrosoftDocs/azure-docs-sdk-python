  - <xref:bool>
- description: vpnGatewayCustomBgpAddresses used by this connection.
  name: vpnGatewayCustomBgpAddresses
  types:
  - <xref:list>[<xref:"GatewayCustomBgpIpAddressIpConfiguration">]
- description: Enable policy-based traffic selectors.
  name: usePolicyBasedTrafficSelectors
  types:
  - <xref:bool>
- description: The IPSec Policies to be considered by this connection.
  name: ipsecPolicies
  types:
  - <xref:list>[<xref:"IpsecPolicy">]
- description: EnableBgp flag.
  name: enableRateLimiting
  types:
  - <xref:bool>
- description: Use local azure ip to initiate connection.
  name: useLocalAzureIpAddress
  types:
  - <xref:bool>
- description: 'The provisioning state of the VPN site link connection resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: List of ingress NatRules.
  name: ingressNatRules
  types:
  - <xref:list>[<xref:"SubResource">]
- description: List of egress NatRules.
  name: egressNatRules
  types:
  - <xref:list>[<xref:"SubResource">]
- description: Dead Peer Detection timeout in seconds for VpnLink connection.
  name: dpdTimeoutSeconds
  types:
  - <xref:int>
