### YamlMime:PythonClass
uid: azure.mgmt.network.types.ExpressRouteConnectionProperties
name: ExpressRouteConnectionProperties
fullName: azure.mgmt.network.types.ExpressRouteConnectionProperties
module: azure.mgmt.network.types
summary: Properties of the ExpressRouteConnection subresource.
constructor:
  syntax: ExpressRouteConnectionProperties()
variables:
- description: 'The provisioning state of the express route connection resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The ExpressRoute circuit peering. Required.
  name: expressRouteCircuitPeering
  types:
  - <xref:<xref:"ExpressRouteCircuitPeeringId">>
- description: Authorization key to establish the connection.
  name: authorizationKey
  types:
  - <xref:str>
- description: The routing weight associated to the connection.
  name: routingWeight
  types:
  - <xref:int>
- description: Enable internet security.
  name: enableInternetSecurity
  types:
  - <xref:bool>
- description: Enable FastPath to vWan Firewall hub.
  name: expressRouteGatewayBypass
  types:
  - <xref:bool>
- description: 'Bypass the ExpressRoute gateway when accessing private-links.

    ExpressRoute FastPath (expressRouteGatewayBypass) must be enabled.'
  name: enablePrivateLinkFastPath
  types:
  - <xref:bool>
- description: 'The Routing Configuration indicating the associated and propagated

    route tables on this connection.'
  name: routingConfiguration
  types:
  - <xref:<xref:"RoutingConfiguration">>
attributes:
- uid: azure.mgmt.network.types.ExpressRouteConnectionProperties.authorizationKey
  name: authorizationKey
  summary: Authorization key to establish the connection.
  signature: 'authorizationKey: str'
- uid: azure.mgmt.network.types.ExpressRouteConnectionProperties.enableInternetSecurity
  name: enableInternetSecurity
  summary: Enable internet security.
  signature: 'enableInternetSecurity: bool'
- uid: azure.mgmt.network.types.ExpressRouteConnectionProperties.enablePrivateLinkFastPath
  name: enablePrivateLinkFastPath
  summary: 'Bypass the ExpressRoute gateway when accessing private-links. ExpressRoute
    FastPath

    (expressRouteGatewayBypass) must be enabled.'
  signature: 'enablePrivateLinkFastPath: bool'
- uid: azure.mgmt.network.types.ExpressRouteConnectionProperties.expressRouteCircuitPeering
  name: expressRouteCircuitPeering
  summary: The ExpressRoute circuit peering. Required.
  signature: 'expressRouteCircuitPeering: Required[ExpressRouteCircuitPeeringId]'
- uid: azure.mgmt.network.types.ExpressRouteConnectionProperties.expressRouteGatewayBypass
  name: expressRouteGatewayBypass
  summary: Enable FastPath to vWan Firewall hub.
  signature: 'expressRouteGatewayBypass: bool'
- uid: azure.mgmt.network.types.ExpressRouteConnectionProperties.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.ExpressRouteConnectionProperties.routingConfiguration
  name: routingConfiguration
  summary: 'The Routing Configuration indicating the associated and propagated route
    tables on this

    connection.'
  signature: 'routingConfiguration: RoutingConfiguration'
- uid: azure.mgmt.network.types.ExpressRouteConnectionProperties.routingWeight
  name: routingWeight
  summary: The routing weight associated to the connection.
  signature: 'routingWeight: int'
