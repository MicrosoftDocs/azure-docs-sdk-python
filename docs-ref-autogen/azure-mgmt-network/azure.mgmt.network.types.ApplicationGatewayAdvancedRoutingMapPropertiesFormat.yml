### YamlMime:PythonClass
uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingMapPropertiesFormat
name: ApplicationGatewayAdvancedRoutingMapPropertiesFormat
fullName: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingMapPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of advanced routing map of the application gateway.
constructor:
  syntax: ApplicationGatewayAdvancedRoutingMapPropertiesFormat()
variables:
- description: 'Default backend address pool resource of the advanced routing

    map. Required unless defaultRedirectConfiguration is specified.'
  name: defaultBackendAddressPool
  types:
  - <xref:<xref:"SubResource">>
- description: 'Default backend http settings resource of the advanced

    routing map. Required unless defaultRedirectConfiguration is specified.'
  name: defaultBackendHttpSettings
  types:
  - <xref:<xref:"SubResource">>
- description: 'Default redirect configuration resource of the advanced

    routing map. Cannot be combined with defaultBackendAddressPool or defaultBackendHttpSettings.'
  name: defaultRedirectConfiguration
  types:
  - <xref:<xref:"SubResource">>
- description: Default rewrite rule set resource of the advanced routing map.
  name: defaultRewriteRuleSet
  types:
  - <xref:<xref:"SubResource">>
- description: 'Default authentication configuration bindings of the advanced routing

    map. Only one authentication configuration is supported. Authentication configuration
    names

    must be unique across the Application Gateway, and an Application Gateway can
    reference at most

    100 distinct authentication policies. Authentication policies can only be bound
    to Application

    Gateways using the Standard_v2 or WAF_v2 SKU.'
  name: defaultAuthConfigs
  types:
  - <xref:list>[<xref:"ApplicationGatewayAuthConfig">]
- description: 'Advanced routing rules of the advanced routing map. Each rule must

    specify a priority that is unique within the map. Required.'
  name: advancedRoutingRules
  types:
  - <xref:list>[<xref:"ApplicationGatewayAdvancedRoutingRule">]
- description: 'The provisioning state of the advanced routing map resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.advancedRoutingRules
  name: advancedRoutingRules
  summary: 'Advanced routing rules of the advanced routing map. Each rule must specify
    a priority that is

    unique within the map. Required.'
  signature: 'advancedRoutingRules: Required[list[''ApplicationGatewayAdvancedRoutingRule'']]'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.defaultAuthConfigs
  name: defaultAuthConfigs
  summary: 'Default authentication configuration bindings of the advanced routing
    map. Only one

    authentication configuration is supported. Authentication configuration names
    must be unique

    across the Application Gateway, and an Application Gateway can reference at most
    100 distinct

    authentication policies. Authentication policies can only be bound to Application
    Gateways

    using the Standard_v2 or WAF_v2 SKU.'
  signature: 'defaultAuthConfigs: list[''ApplicationGatewayAuthConfig'']'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.defaultBackendAddressPool
  name: defaultBackendAddressPool
  summary: 'Default backend address pool resource of the advanced routing map. Required
    unless

    defaultRedirectConfiguration is specified.'
  signature: 'defaultBackendAddressPool: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.defaultBackendHttpSettings
  name: defaultBackendHttpSettings
  summary: 'Default backend http settings resource of the advanced routing map. Required
    unless

    defaultRedirectConfiguration is specified.'
  signature: 'defaultBackendHttpSettings: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.defaultRedirectConfiguration
  name: defaultRedirectConfiguration
  summary: 'Default redirect configuration resource of the advanced routing map. Cannot
    be combined with

    defaultBackendAddressPool or defaultBackendHttpSettings.'
  signature: 'defaultRedirectConfiguration: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.defaultRewriteRuleSet
  name: defaultRewriteRuleSet
  summary: Default rewrite rule set resource of the advanced routing map.
  signature: 'defaultRewriteRuleSet: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
