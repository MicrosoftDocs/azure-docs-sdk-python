### YamlMime:PythonClass
uid: azure.mgmt.network.types.SubnetPropertiesFormat
name: SubnetPropertiesFormat
fullName: azure.mgmt.network.types.SubnetPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of the subnet.
constructor:
  syntax: SubnetPropertiesFormat()
variables:
- description: The address prefix for the subnet.
  name: addressPrefix
  types:
  - <xref:str>
- description: List of address prefixes for the subnet.
  name: addressPrefixes
  types:
  - <xref:list>[<xref:str>]
- description: The reference to the NetworkSecurityGroup resource.
  name: networkSecurityGroup
  types:
  - <xref:<xref:"NetworkSecurityGroup">>
- description: The reference to the RouteTable resource.
  name: routeTable
  types:
  - <xref:<xref:"RouteTable">>
- description: Nat gateway associated with this subnet.
  name: natGateway
  types:
  - <xref:<xref:"SubResource">>
- description: An array of service endpoints.
  name: serviceEndpoints
  types:
  - <xref:list>[<xref:"ServiceEndpointPropertiesFormat">]
- description: An array of service endpoint policies.
  name: serviceEndpointPolicies
  types:
  - <xref:list>[<xref:"ServiceEndpointPolicy">]
- description: An array of references to private endpoints.
  name: privateEndpoints
  types:
  - <xref:list>[<xref:"PrivateEndpoint">]
- description: 'An array of references to the network interface IP configurations
    using

    subnet.'
  name: ipConfigurations
  types:
  - <xref:list>[<xref:"IPConfiguration">]
- description: Array of IP configuration profiles which reference this subnet.
  name: ipConfigurationProfiles
  types:
  - <xref:list>[<xref:"IPConfigurationProfile">]
- description: Array of IpAllocation which reference this subnet.
  name: ipAllocations
  types:
  - <xref:list>[<xref:"SubResource">]
- description: An array of references to the external resources using subnet.
  name: resourceNavigationLinks
  types:
  - <xref:list>[<xref:"ResourceNavigationLink">]
- description: An array of references to services injecting into this subnet.
  name: serviceAssociationLinks
  types:
  - <xref:list>[<xref:"ServiceAssociationLink">]
- description: An array of references to the delegations on the subnet.
  name: delegations
  types:
  - <xref:list>[<xref:"Delegation">]
- description: 'A read-only string identifying the intention of use for this subnet
    based on

    delegations and other user-defined properties.'
  name: purpose
  types:
  - <xref:str>
- description: 'The provisioning state of the subnet resource. Known values are:

    "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Enable or Disable apply network policies on private end

    point in the subnet. Known values are: "Enabled", "Disabled", "NetworkSecurityGroupEnabled",

    and "RouteTableEnabled".'
  name: privateEndpointNetworkPolicies
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualNetworkPrivateEndpointNetworkPolicies">]
- description: 'Enable or Disable apply network policies on private

    link service in the subnet. Known values are: "Enabled" and "Disabled".'
  name: privateLinkServiceNetworkPolicies
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualNetworkPrivateLinkServiceNetworkPolicies">]
- description: 'Application gateway IP configurations of virtual

    network resource.'
  name: applicationGatewayIPConfigurations
  types:
  - <xref:list>[<xref:"ApplicationGatewayIPConfiguration">]
- description: 'Set this property to Tenant to allow sharing subnet with other

    subscriptions in your AAD tenant. This property can only be set if defaultOutboundAccess
    is set

    to false, both properties can only be set if subnet is empty. Known values are:
    "Tenant" and

    "DelegatedServices".'
  name: sharingScope
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SharingScope">]
- description: 'Set this property to false to disable default outbound

    connectivity for all VMs in the subnet.'
  name: defaultOutboundAccess
  types:
  - <xref:bool>
- description: A list of IPAM Pools for allocating IP address prefixes.
  name: ipamPoolPrefixAllocations
  types:
  - <xref:list>[<xref:"IpamPoolPrefixAllocation">]
- description: Reference to an existing service gateway.
  name: serviceGateway
  types:
  - <xref:<xref:"SubResource">>
attributes:
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.addressPrefix
  name: addressPrefix
  summary: The address prefix for the subnet.
  signature: 'addressPrefix: str'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.addressPrefixes
  name: addressPrefixes
  summary: List of address prefixes for the subnet.
  signature: 'addressPrefixes: list[str]'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.applicationGatewayIPConfigurations
  name: applicationGatewayIPConfigurations
  summary: Application gateway IP configurations of virtual network resource.
  signature: 'applicationGatewayIPConfigurations: list[''ApplicationGatewayIPConfiguration'']'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.defaultOutboundAccess
  name: defaultOutboundAccess
  summary: Set this property to false to disable default outbound connectivity for
    all VMs in the subnet.
  signature: 'defaultOutboundAccess: bool'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.delegations
  name: delegations
  summary: An array of references to the delegations on the subnet.
  signature: 'delegations: list[''Delegation'']'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.ipAllocations
  name: ipAllocations
  summary: Array of IpAllocation which reference this subnet.
  signature: 'ipAllocations: list[''SubResource'']'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.ipConfigurationProfiles
  name: ipConfigurationProfiles
  summary: Array of IP configuration profiles which reference this subnet.
  signature: 'ipConfigurationProfiles: list[''IPConfigurationProfile'']'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.ipConfigurations
  name: ipConfigurations
  summary: An array of references to the network interface IP configurations using
    subnet.
  signature: 'ipConfigurations: list[''IPConfiguration'']'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.ipamPoolPrefixAllocations
  name: ipamPoolPrefixAllocations
  summary: A list of IPAM Pools for allocating IP address prefixes.
  signature: 'ipamPoolPrefixAllocations: list[''IpamPoolPrefixAllocation'']'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.natGateway
  name: natGateway
  summary: Nat gateway associated with this subnet.
  signature: 'natGateway: SubResource'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.networkSecurityGroup
  name: networkSecurityGroup
  summary: The reference to the NetworkSecurityGroup resource.
  signature: 'networkSecurityGroup: NetworkSecurityGroup'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.privateEndpointNetworkPolicies
  name: privateEndpointNetworkPolicies
  summary: 'Enable or Disable apply network policies on private end point in the subnet.
    Known values are:

    "Enabled", "Disabled", "NetworkSecurityGroupEnabled", and "RouteTableEnabled".'
  signature: 'privateEndpointNetworkPolicies: str | VirtualNetworkPrivateEndpointNetworkPolicies'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.privateEndpoints
  name: privateEndpoints
  summary: An array of references to private endpoints.
  signature: 'privateEndpoints: list[''PrivateEndpoint'']'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.privateLinkServiceNetworkPolicies
  name: privateLinkServiceNetworkPolicies
  summary: 'Enable or Disable apply network policies on private link service in the
    subnet. Known values

    are: "Enabled" and "Disabled".'
  signature: 'privateLinkServiceNetworkPolicies: str | VirtualNetworkPrivateLinkServiceNetworkPolicies'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed", "Succeeded",

    "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.purpose
  name: purpose
  summary: 'A read-only string identifying the intention of use for this subnet based
    on delegations and

    other user-defined properties.'
  signature: 'purpose: str'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.resourceNavigationLinks
  name: resourceNavigationLinks
  summary: An array of references to the external resources using subnet.
  signature: 'resourceNavigationLinks: list[''ResourceNavigationLink'']'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.routeTable
  name: routeTable
  summary: The reference to the RouteTable resource.
  signature: 'routeTable: RouteTable'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.serviceAssociationLinks
  name: serviceAssociationLinks
  summary: An array of references to services injecting into this subnet.
  signature: 'serviceAssociationLinks: list[''ServiceAssociationLink'']'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.serviceEndpointPolicies
  name: serviceEndpointPolicies
  summary: An array of service endpoint policies.
  signature: 'serviceEndpointPolicies: list[''ServiceEndpointPolicy'']'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.serviceEndpoints
  name: serviceEndpoints
  summary: An array of service endpoints.
  signature: 'serviceEndpoints: list[''ServiceEndpointPropertiesFormat'']'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.serviceGateway
  name: serviceGateway
  summary: Reference to an existing service gateway.
  signature: 'serviceGateway: SubResource'
- uid: azure.mgmt.network.types.SubnetPropertiesFormat.sharingScope
  name: sharingScope
  summary: 'Set this property to Tenant to allow sharing subnet with other subscriptions
    in your AAD

    tenant. This property can only be set if defaultOutboundAccess is set to false,
    both properties

    can only be set if subnet is empty. Known values are: "Tenant" and "DelegatedServices".'
  signature: 'sharingScope: str | SharingScope'
