### YamlMime:PythonClass
uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat
name: InboundNatRulePropertiesFormat
fullName: azure.mgmt.network.types.InboundNatRulePropertiesFormat
module: azure.mgmt.network.types
summary: Properties of the inbound NAT rule.
constructor:
  syntax: InboundNatRulePropertiesFormat()
variables:
- description: A reference to frontend IP addresses.
  name: frontendIPConfiguration
  types:
  - <xref:<xref:"SubResource">>
- description: 'A reference to a private IP address defined on a network

    interface of a VM. Traffic sent to the frontend port of each of the frontend IP
    configurations

    is forwarded to the backend IP.'
  name: backendIPConfiguration
  types:
  - <xref:<xref:"NetworkInterfaceIPConfiguration">>
- description: 'The reference to the transport protocol used by the load balancing
    rule. Known

    values are: "Udp", "Tcp", "All", and "Quic".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TransportProtocol">]
- description: 'The port for the external endpoint. Port numbers for each rule must
    be

    unique within the Load Balancer. Acceptable values range from 1 to 65534.'
  name: frontendPort
  types:
  - <xref:int>
- description: 'The port used for the internal endpoint. Acceptable values range from
    1 to

    65535.'
  name: backendPort
  types:
  - <xref:int>
- description: 'The timeout for the TCP idle connection. The value can be set

    between 4 and 30 minutes. The default value is 4 minutes. This element is only
    used when the

    protocol is set to TCP.'
  name: idleTimeoutInMinutes
  types:
  - <xref:int>
- description: 'Configures a virtual machine''s endpoint for the floating IP capability

    required to configure a SQL AlwaysOn Availability Group. This setting is required
    when using

    the SQL AlwaysOn Availability Groups in SQL server. This setting can''t be changed
    after you

    create the endpoint.'
  name: enableFloatingIP
  types:
  - <xref:bool>
- description: 'Receive bidirectional TCP Reset on TCP flow idle timeout or unexpected

    connection termination. This element is only used when the protocol is set to
    TCP.'
  name: enableTcpReset
  types:
  - <xref:bool>
- description: 'The port range start for the external endpoint. This property is

    used together with BackendAddressPool and FrontendPortRangeEnd. Individual inbound
    NAT rule

    port mappings will be created for each backend address from BackendAddressPool.
    Acceptable

    values range from 1 to 65534.'
  name: frontendPortRangeStart
  types:
  - <xref:int>
- description: 'The port range end for the external endpoint. This property is used

    together with BackendAddressPool and FrontendPortRangeStart. Individual inbound
    NAT rule port

    mappings will be created for each backend address from BackendAddressPool. Acceptable
    values

    range from 1 to 65534.'
  name: frontendPortRangeEnd
  types:
  - <xref:int>
- description: A reference to backendAddressPool resource.
  name: backendAddressPool
  types:
  - <xref:<xref:"SubResource">>
- description: 'The provisioning state of the inbound NAT rule resource. Known values

    are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat.backendAddressPool
  name: backendAddressPool
  summary: A reference to backendAddressPool resource.
  signature: 'backendAddressPool: SubResource'
- uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat.backendIPConfiguration
  name: backendIPConfiguration
  summary: 'A reference to a private IP address defined on a network interface of
    a VM. Traffic sent to the

    frontend port of each of the frontend IP configurations is forwarded to the backend
    IP.'
  signature: 'backendIPConfiguration: NetworkInterfaceIPConfiguration'
- uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat.backendPort
  name: backendPort
  summary: The port used for the internal endpoint. Acceptable values range from 1
    to 65535.
  signature: 'backendPort: int'
- uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat.enableFloatingIP
  name: enableFloatingIP
  summary: 'Configures a virtual machine''s endpoint for the floating IP capability
    required to configure a

    SQL AlwaysOn Availability Group. This setting is required when using the SQL AlwaysOn

    Availability Groups in SQL server. This setting can''t be changed after you create
    the endpoint.'
  signature: 'enableFloatingIP: bool'
- uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat.enableTcpReset
  name: enableTcpReset
  summary: 'Receive bidirectional TCP Reset on TCP flow idle timeout or unexpected
    connection termination.

    This element is only used when the protocol is set to TCP.'
  signature: 'enableTcpReset: bool'
- uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat.frontendIPConfiguration
  name: frontendIPConfiguration
  summary: A reference to frontend IP addresses.
  signature: 'frontendIPConfiguration: SubResource'
- uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat.frontendPort
  name: frontendPort
  summary: 'The port for the external endpoint. Port numbers for each rule must be
    unique within the Load

    Balancer. Acceptable values range from 1 to 65534.'
  signature: 'frontendPort: int'
- uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat.frontendPortRangeEnd
  name: frontendPortRangeEnd
  summary: 'The port range end for the external endpoint. This property is used together
    with

    BackendAddressPool and FrontendPortRangeStart. Individual inbound NAT rule port
    mappings will

    be created for each backend address from BackendAddressPool. Acceptable values
    range from 1 to

    65534.'
  signature: 'frontendPortRangeEnd: int'
- uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat.frontendPortRangeStart
  name: frontendPortRangeStart
  summary: 'The port range start for the external endpoint. This property is used
    together with

    BackendAddressPool and FrontendPortRangeEnd. Individual inbound NAT rule port
    mappings will be

    created for each backend address from BackendAddressPool. Acceptable values range
    from 1 to

    65534.'
  signature: 'frontendPortRangeStart: int'
- uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat.idleTimeoutInMinutes
  name: idleTimeoutInMinutes
  summary: 'The timeout for the TCP idle connection. The value can be set between
    4 and 30 minutes. The

    default value is 4 minutes. This element is only used when the protocol is set
    to TCP.'
  signature: 'idleTimeoutInMinutes: int'
- uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat.protocol
  name: protocol
  summary: 'The reference to the transport protocol used by the load balancing rule.
    Known values are:

    "Udp", "Tcp", "All", and "Quic".'
  signature: 'protocol: str | TransportProtocol'
- uid: azure.mgmt.network.types.InboundNatRulePropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
