### YamlMime:PythonClass
uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingMapPropertiesFormat
name: ApplicationGatewayAdvancedRoutingMapPropertiesFormat
fullName: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingMapPropertiesFormat
module: azure.mgmt.network.models
summary: Properties of advanced routing map of the application gateway.
constructor:
  syntax: 'ApplicationGatewayAdvancedRoutingMapPropertiesFormat(*args: Any, **kwargs:
    Any)'
variables:
- description: 'Default backend address pool resource of the advanced

    routing map. Required unless defaultRedirectConfiguration is specified.'
  name: default_backend_address_pool
  types:
  - <xref:azure.mgmt.network.models.SubResource>
- description: 'Default backend http settings resource of the advanced

    routing map. Required unless defaultRedirectConfiguration is specified.'
  name: default_backend_http_settings
  types:
  - <xref:azure.mgmt.network.models.SubResource>
- description: 'Default redirect configuration resource of the advanced

    routing map. Cannot be combined with defaultBackendAddressPool or defaultBackendHttpSettings.'
  name: default_redirect_configuration
  types:
  - <xref:azure.mgmt.network.models.SubResource>
- description: Default rewrite rule set resource of the advanced routing map.
  name: default_rewrite_rule_set
  types:
  - <xref:azure.mgmt.network.models.SubResource>
- description: 'Default authentication configuration bindings of the advanced

    routing map. Only one authentication configuration is supported. Authentication
    configuration

    names must be unique across the Application Gateway, and an Application Gateway
    can reference

    at most 100 distinct authentication policies. Authentication policies can only
    be bound to

    Application Gateways using the Standard_v2 or WAF_v2 SKU.'
  name: default_auth_configs
  types:
  - <xref:list>[<xref:azure.mgmt.network.models.ApplicationGatewayAuthConfig>]
- description: 'Advanced routing rules of the advanced routing map. Each rule

    must specify a priority that is unique within the map. Required.'
  name: advanced_routing_rules
  types:
  - <xref:list>[<xref:azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingRule>]
- description: 'The provisioning state of the advanced routing map resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioning_state
  types:
  - <xref:str>
  - <xref:azure.mgmt.network.models.ProvisioningState>
attributes:
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.advanced_routing_rules
  name: advanced_routing_rules
  summary: 'Advanced routing rules of the advanced routing map. Each rule must specify
    a priority that is

    unique within the map. Required.'
  signature: 'advanced_routing_rules: list[''_models.ApplicationGatewayAdvancedRoutingRule'']'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.default_auth_configs
  name: default_auth_configs
  summary: 'Default authentication configuration bindings of the advanced routing
    map. Only one

    authentication configuration is supported. Authentication configuration names
    must be unique

    across the Application Gateway, and an Application Gateway can reference at most
    100 distinct

    authentication policies. Authentication policies can only be bound to Application
    Gateways

    using the Standard_v2 or WAF_v2 SKU.'
  signature: 'default_auth_configs: list[''_models.ApplicationGatewayAuthConfig'']
    | None'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.default_backend_address_pool
  name: default_backend_address_pool
  summary: 'Default backend address pool resource of the advanced routing map. Required
    unless

    defaultRedirectConfiguration is specified.'
  signature: 'default_backend_address_pool: _models.SubResource | None'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.default_backend_http_settings
  name: default_backend_http_settings
  summary: 'Default backend http settings resource of the advanced routing map. Required
    unless

    defaultRedirectConfiguration is specified.'
  signature: 'default_backend_http_settings: _models.SubResource | None'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.default_redirect_configuration
  name: default_redirect_configuration
  summary: 'Default redirect configuration resource of the advanced routing map. Cannot
    be combined with

    defaultBackendAddressPool or defaultBackendHttpSettings.'
  signature: 'default_redirect_configuration: _models.SubResource | None'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.default_rewrite_rule_set
  name: default_rewrite_rule_set
  summary: Default rewrite rule set resource of the advanced routing map.
  signature: 'default_rewrite_rule_set: _models.SubResource | None'
- uid: azure.mgmt.network.models.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.provisioning_state
  name: provisioning_state
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioning_state: str | _models.ProvisioningState | None'
