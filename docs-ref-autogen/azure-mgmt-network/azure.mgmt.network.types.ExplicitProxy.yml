### YamlMime:PythonClass
uid: azure.mgmt.network.types.ExplicitProxy
name: ExplicitProxy
fullName: azure.mgmt.network.types.ExplicitProxy
module: azure.mgmt.network.types
summary: Explicit Proxy Settings in Firewall Policy.
constructor:
  syntax: ExplicitProxy()
variables:
- description: When set to true, explicit proxy mode is enabled.
  name: enableExplicitProxy
  types:
  - <xref:bool>
- description: Port number for explicit proxy http protocol, cannot be greater than
    64000.
  name: httpPort
  types:
  - <xref:int>
- description: Port number for explicit proxy https protocol, cannot be greater than
    64000.
  name: httpsPort
  types:
  - <xref:int>
- description: When set to true, pac file port and url needs to be provided.
  name: enablePacFile
  types:
  - <xref:bool>
- description: Port number for firewall to serve PAC file.
  name: pacFilePort
  types:
  - <xref:int>
- description: SAS URL for PAC file.
  name: pacFile
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.types.ExplicitProxy.enableExplicitProxy
  name: enableExplicitProxy
  summary: When set to true, explicit proxy mode is enabled.
  signature: 'enableExplicitProxy: bool | None'
- uid: azure.mgmt.network.types.ExplicitProxy.enablePacFile
  name: enablePacFile
  summary: When set to true, pac file port and url needs to be provided.
  signature: 'enablePacFile: bool | None'
- uid: azure.mgmt.network.types.ExplicitProxy.httpPort
  name: httpPort
  summary: Port number for explicit proxy http protocol, cannot be greater than 64000.
  signature: 'httpPort: int'
- uid: azure.mgmt.network.types.ExplicitProxy.httpsPort
  name: httpsPort
  summary: Port number for explicit proxy https protocol, cannot be greater than 64000.
  signature: 'httpsPort: int'
- uid: azure.mgmt.network.types.ExplicitProxy.pacFile
  name: pacFile
  summary: SAS URL for PAC file.
  signature: 'pacFile: str'
- uid: azure.mgmt.network.types.ExplicitProxy.pacFilePort
  name: pacFilePort
  summary: Port number for firewall to serve PAC file.
  signature: 'pacFilePort: int'
