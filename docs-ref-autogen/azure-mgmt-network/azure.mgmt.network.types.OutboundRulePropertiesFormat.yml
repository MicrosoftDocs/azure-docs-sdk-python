### YamlMime:PythonClass
uid: azure.mgmt.network.types.OutboundRulePropertiesFormat
name: OutboundRulePropertiesFormat
fullName: azure.mgmt.network.types.OutboundRulePropertiesFormat
module: azure.mgmt.network.types
summary: Outbound rule of the load balancer.
constructor:
  syntax: OutboundRulePropertiesFormat()
variables:
- description: The number of outbound ports to be used for NAT.
  name: allocatedOutboundPorts
  types:
  - <xref:int>
- description: The Frontend IP addresses of the load balancer. Required.
  name: frontendIPConfigurations
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'A reference to a pool of DIPs. Outbound traffic is randomly load

    balanced across IPs in the backend IPs. Required.'
  name: backendAddressPool
  types:
  - <xref:<xref:"SubResource">>
- description: 'The provisioning state of the outbound rule resource. Known values

    are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The protocol for the outbound rule in load balancer. Required. Known
    values

    are: "Tcp", "Udp", and "All".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LoadBalancerOutboundRuleProtocol">]
- description: 'Receive bidirectional TCP Reset on TCP flow idle timeout or unexpected

    connection termination. This element is only used when the protocol is set to
    TCP.'
  name: enableTcpReset
  types:
  - <xref:bool>
- description: The timeout for the TCP idle connection.
  name: idleTimeoutInMinutes
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.network.types.OutboundRulePropertiesFormat.allocatedOutboundPorts
  name: allocatedOutboundPorts
  summary: The number of outbound ports to be used for NAT.
  signature: 'allocatedOutboundPorts: int'
- uid: azure.mgmt.network.types.OutboundRulePropertiesFormat.backendAddressPool
  name: backendAddressPool
  summary: 'A reference to a pool of DIPs. Outbound traffic is randomly load balanced
    across IPs in the

    backend IPs. Required.'
  signature: 'backendAddressPool: Required[SubResource]'
- uid: azure.mgmt.network.types.OutboundRulePropertiesFormat.enableTcpReset
  name: enableTcpReset
  summary: 'Receive bidirectional TCP Reset on TCP flow idle timeout or unexpected
    connection termination.

    This element is only used when the protocol is set to TCP.'
  signature: 'enableTcpReset: bool'
- uid: azure.mgmt.network.types.OutboundRulePropertiesFormat.frontendIPConfigurations
  name: frontendIPConfigurations
  summary: The Frontend IP addresses of the load balancer. Required.
  signature: 'frontendIPConfigurations: Required[list[''SubResource'']]'
- uid: azure.mgmt.network.types.OutboundRulePropertiesFormat.idleTimeoutInMinutes
  name: idleTimeoutInMinutes
  summary: The timeout for the TCP idle connection.
  signature: 'idleTimeoutInMinutes: int'
- uid: azure.mgmt.network.types.OutboundRulePropertiesFormat.protocol
  name: protocol
  summary: '"Tcp",

    "Udp", and "All".'
  signature: 'protocol: Required[str | LoadBalancerOutboundRuleProtocol]'
- uid: azure.mgmt.network.types.OutboundRulePropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
