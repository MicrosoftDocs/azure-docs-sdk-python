### YamlMime:PythonClass
uid: azure.mgmt.network.types.ExpressRouteLinkMacSecConfig
name: ExpressRouteLinkMacSecConfig
fullName: azure.mgmt.network.types.ExpressRouteLinkMacSecConfig
module: azure.mgmt.network.types
summary: Definition of ExpressRouteLink Mac Security configuration.
constructor:
  syntax: ExpressRouteLinkMacSecConfig()
variables:
- description: Keyvault Secret Identifier URL containing Mac security CKN key.
  name: cknSecretIdentifier
  types:
  - <xref:str>
- description: Keyvault Secret Identifier URL containing Mac security CAK key.
  name: cakSecretIdentifier
  types:
  - <xref:str>
- description: 'Mac security cipher. Known values are: "GcmAes256", "GcmAes128", "GcmAesXpn128",

    and "GcmAesXpn256".'
  name: cipher
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExpressRouteLinkMacSecCipher">]
- description: 'Sci mode enabled/disabled. Known values are: "Disabled" and "Enabled".'
  name: sciState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExpressRouteLinkMacSecSciState">]
attributes:
- uid: azure.mgmt.network.types.ExpressRouteLinkMacSecConfig.cakSecretIdentifier
  name: cakSecretIdentifier
  summary: Keyvault Secret Identifier URL containing Mac security CAK key.
  signature: 'cakSecretIdentifier: str'
- uid: azure.mgmt.network.types.ExpressRouteLinkMacSecConfig.cipher
  name: cipher
  summary: '"GcmAes256", "GcmAes128", "GcmAesXpn128", and

    "GcmAesXpn256".'
  signature: 'cipher: str | ExpressRouteLinkMacSecCipher'
- uid: azure.mgmt.network.types.ExpressRouteLinkMacSecConfig.cknSecretIdentifier
  name: cknSecretIdentifier
  summary: Keyvault Secret Identifier URL containing Mac security CKN key.
  signature: 'cknSecretIdentifier: str'
- uid: azure.mgmt.network.types.ExpressRouteLinkMacSecConfig.sciState
  name: sciState
  summary: '"Disabled" and "Enabled".'
  signature: 'sciState: str | ExpressRouteLinkMacSecSciState'
