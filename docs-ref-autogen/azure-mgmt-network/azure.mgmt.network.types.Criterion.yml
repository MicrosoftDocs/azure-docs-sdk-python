### YamlMime:PythonClass
uid: azure.mgmt.network.types.Criterion
name: Criterion
fullName: azure.mgmt.network.types.Criterion
module: azure.mgmt.network.types
summary: A matching criteria which matches routes based on route prefix, community,
  and AS path.
constructor:
  syntax: Criterion()
variables:
- description: List of route prefixes which this criteria matches.
  name: routePrefix
  types:
  - <xref:list>[<xref:str>]
- description: List of BGP communities which this criteria matches.
  name: community
  types:
  - <xref:list>[<xref:str>]
- description: List of AS paths which this criteria matches.
  name: asPath
  types:
  - <xref:list>[<xref:str>]
- description: 'Match condition to apply RouteMap rules. Known values are: "Unknown",

    "Contains", "Equals", "NotContains", and "NotEquals".'
  name: matchCondition
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"RouteMapMatchCondition">]
attributes:
- uid: azure.mgmt.network.types.Criterion.asPath
  name: asPath
  summary: List of AS paths which this criteria matches.
  signature: 'asPath: list[str]'
- uid: azure.mgmt.network.types.Criterion.community
  name: community
  summary: List of BGP communities which this criteria matches.
  signature: 'community: list[str]'
- uid: azure.mgmt.network.types.Criterion.matchCondition
  name: matchCondition
  summary: '"Unknown", "Contains",

    "Equals", "NotContains", and "NotEquals".'
  signature: 'matchCondition: str | RouteMapMatchCondition'
- uid: azure.mgmt.network.types.Criterion.routePrefix
  name: routePrefix
  summary: List of route prefixes which this criteria matches.
  signature: 'routePrefix: list[str]'
