### YamlMime:PythonClass
uid: azure.mgmt.network.types.VirtualNetworkAppliancePropertiesFormat
name: VirtualNetworkAppliancePropertiesFormat
fullName: azure.mgmt.network.types.VirtualNetworkAppliancePropertiesFormat
module: azure.mgmt.network.types
summary: VirtualNetworkAppliance properties.
constructor:
  syntax: VirtualNetworkAppliancePropertiesFormat()
variables:
- description: Bandwidth of the VirtualNetworkAppliance resource in Gbps.
  name: bandwidthInGbps
  types:
  - <xref:float>
- description: A list of IPConfigurations of the virtual network appliance.
  name: ipConfigurations
  types:
  - <xref:list>[<xref:"VirtualNetworkApplianceIpConfiguration">]
- description: 'Whether the specific virtual network appliance is IPv4 or Dual

    Stack. Default is IPv4. Known values are: "IPv4" and "DualStack".'
  name: privateIPAddressVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"VirtualNetworkApplianceIpVersionType">]
- description: 'The provisioning state of the virtual network appliance resource.

    Known values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and
    "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The resource GUID property of the virtual network appliance resource.
  name: resourceGuid
  types:
  - <xref:str>
- description: The reference to the subnet resource.
  name: subnet
  types:
  - <xref:<xref:"Subnet">>
attributes:
- uid: azure.mgmt.network.types.VirtualNetworkAppliancePropertiesFormat.bandwidthInGbps
  name: bandwidthInGbps
  summary: Bandwidth of the VirtualNetworkAppliance resource in Gbps.
  signature: 'bandwidthInGbps: float'
- uid: azure.mgmt.network.types.VirtualNetworkAppliancePropertiesFormat.ipConfigurations
  name: ipConfigurations
  summary: A list of IPConfigurations of the virtual network appliance.
  signature: 'ipConfigurations: list[''VirtualNetworkApplianceIpConfiguration'']'
- uid: azure.mgmt.network.types.VirtualNetworkAppliancePropertiesFormat.privateIPAddressVersion
  name: privateIPAddressVersion
  summary: 'Whether the specific virtual network appliance is IPv4 or Dual Stack.
    Default is IPv4. Known

    values are: "IPv4" and "DualStack".'
  signature: 'privateIPAddressVersion: str | VirtualNetworkApplianceIpVersionType'
- uid: azure.mgmt.network.types.VirtualNetworkAppliancePropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.VirtualNetworkAppliancePropertiesFormat.resourceGuid
  name: resourceGuid
  summary: The resource GUID property of the virtual network appliance resource.
  signature: 'resourceGuid: str'
- uid: azure.mgmt.network.types.VirtualNetworkAppliancePropertiesFormat.subnet
  name: subnet
  summary: The reference to the subnet resource.
  signature: 'subnet: Subnet'
