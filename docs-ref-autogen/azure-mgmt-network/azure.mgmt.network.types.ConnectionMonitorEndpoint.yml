### YamlMime:PythonClass
uid: azure.mgmt.network.types.ConnectionMonitorEndpoint
name: ConnectionMonitorEndpoint
fullName: azure.mgmt.network.types.ConnectionMonitorEndpoint
module: azure.mgmt.network.types
summary: Describes the connection monitor endpoint.
constructor:
  syntax: ConnectionMonitorEndpoint()
variables:
- description: The name of the connection monitor endpoint. Required.
  name: name
  types:
  - <xref:str>
- description: 'The endpoint type. Known values are: "AzureVM", "AzureVNet", "AzureSubnet",

    "ExternalAddress", "MMAWorkspaceMachine", "MMAWorkspaceNetwork", "AzureArcVM",
    "AzureVMSS", and

    "AzureArcNetwork".'
  name: type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EndpointType">]
- description: 'Resource ID of the connection monitor endpoint are supported for AzureVM,

    AzureVMSS, AzureVNet, AzureSubnet, MMAWorkspaceMachine, MMAWorkspaceNetwork, AzureArcVM

    endpoint type.'
  name: resourceId
  types:
  - <xref:str>
- description: 'Address of the connection monitor endpoint. Supported for AzureVM,

    ExternalAddress, ArcMachine, MMAWorkspaceMachine endpoint type.'
  name: address
  types:
  - <xref:str>
- description: 'Filter field is getting deprecated and should not be used. Instead
    use

    Include/Exclude scope fields for it.'
  name: filter
  types:
  - <xref:<xref:"ConnectionMonitorEndpointFilter">>
- description: 'Endpoint scope defines which target resource to monitor in case of
    compound

    resource endpoints like VMSS, AzureSubnet, AzureVNet, MMAWorkspaceNetwork, AzureArcNetwork.'
  name: scope
  types:
  - <xref:<xref:"ConnectionMonitorEndpointScope">>
- description: 'Test coverage for the endpoint. Known values are: "Default", "Low",

    "BelowAverage", "Average", "AboveAverage", and "Full".'
  name: coverageLevel
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"CoverageLevel">]
- description: 'Location details is optional and only being used for ''AzureArcNetwork''

    type endpoints, which contains region details.'
  name: locationDetails
  types:
  - <xref:<xref:"ConnectionMonitorEndpointLocationDetails">>
- description: 'Subscription ID for connection monitor endpoint. It''s an optional

    parameter which is being used for ''AzureArcNetwork'' type endpoint.'
  name: subscriptionId
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.types.ConnectionMonitorEndpoint.address
  name: address
  summary: 'Address of the connection monitor endpoint. Supported for AzureVM, ExternalAddress,
    ArcMachine,

    MMAWorkspaceMachine endpoint type.'
  signature: 'address: str'
- uid: azure.mgmt.network.types.ConnectionMonitorEndpoint.coverageLevel
  name: coverageLevel
  summary: '"Default", "Low", "BelowAverage",

    "Average", "AboveAverage", and "Full".'
  signature: 'coverageLevel: str | CoverageLevel'
- uid: azure.mgmt.network.types.ConnectionMonitorEndpoint.filter
  name: filter
  summary: 'Filter field is getting deprecated and should not be used. Instead use
    Include/Exclude scope

    fields for it.'
  signature: 'filter: ConnectionMonitorEndpointFilter'
- uid: azure.mgmt.network.types.ConnectionMonitorEndpoint.locationDetails
  name: locationDetails
  summary: 'Location details is optional and only being used for ''AzureArcNetwork''
    type endpoints, which

    contains region details.'
  signature: 'locationDetails: ConnectionMonitorEndpointLocationDetails'
- uid: azure.mgmt.network.types.ConnectionMonitorEndpoint.name
  name: name
  summary: The name of the connection monitor endpoint. Required.
  signature: 'name: Required[str]'
- uid: azure.mgmt.network.types.ConnectionMonitorEndpoint.resourceId
  name: resourceId
  summary: 'Resource ID of the connection monitor endpoint are supported for AzureVM,
    AzureVMSS, AzureVNet,

    AzureSubnet, MMAWorkspaceMachine, MMAWorkspaceNetwork, AzureArcVM endpoint type.'
  signature: 'resourceId: str'
- uid: azure.mgmt.network.types.ConnectionMonitorEndpoint.scope
  name: scope
  summary: 'Endpoint scope defines which target resource to monitor in case of compound
    resource endpoints

    like VMSS, AzureSubnet, AzureVNet, MMAWorkspaceNetwork, AzureArcNetwork.'
  signature: 'scope: ConnectionMonitorEndpointScope'
- uid: azure.mgmt.network.types.ConnectionMonitorEndpoint.subscriptionId
  name: subscriptionId
  summary: 'Subscription ID for connection monitor endpoint. It''s an optional parameter
    which is being used

    for ''AzureArcNetwork'' type endpoint.'
  signature: 'subscriptionId: str'
- uid: azure.mgmt.network.types.ConnectionMonitorEndpoint.type
  name: type
  summary: '"AzureVM", "AzureVNet", "AzureSubnet",

    "ExternalAddress", "MMAWorkspaceMachine", "MMAWorkspaceNetwork", "AzureArcVM",

    "AzureVMSS", and "AzureArcNetwork".'
  signature: 'type: str | EndpointType'
