### YamlMime:PythonClass
uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingRulePropertiesFormat
name: ApplicationGatewayAdvancedRoutingRulePropertiesFormat
fullName: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingRulePropertiesFormat
module: azure.mgmt.network.types
summary: Properties of advanced routing rule of the application gateway.
constructor:
  syntax: ApplicationGatewayAdvancedRoutingRulePropertiesFormat()
variables:
- description: 'Priority of the advanced routing rule. Must be unique within the containing

    advanced routing map. Rules are evaluated in ascending priority order. Required.'
  name: priority
  types:
  - <xref:int>
- description: 'Advanced routing condition set resource evaluated by this

    rule.'
  name: advancedRoutingConditionSet
  types:
  - <xref:<xref:"SubResource">>
- description: 'Backend address pool resource of the advanced routing rule. Required

    unless redirectConfiguration is specified.'
  name: backendAddressPool
  types:
  - <xref:<xref:"SubResource">>
- description: 'Backend http settings resource of the advanced routing rule.

    Required unless redirectConfiguration is specified.'
  name: backendHttpSettings
  types:
  - <xref:<xref:"SubResource">>
- description: 'Redirect configuration resource of the advanced routing rule.

    Cannot be combined with backendAddressPool or backendHttpSettings.'
  name: redirectConfiguration
  types:
  - <xref:<xref:"SubResource">>
- description: Rewrite rule set resource of the advanced routing rule.
  name: rewriteRuleSet
  types:
  - <xref:<xref:"SubResource">>
- description: 'Authentication configuration bindings of the advanced routing rule.
    Only one

    authentication configuration is supported. Authentication configuration names
    must be unique

    across the Application Gateway, and an Application Gateway can reference at most
    100 distinct

    authentication policies. Authentication policies can only be bound to Application
    Gateways

    using the Standard_v2 or WAF_v2 SKU.'
  name: authConfigs
  types:
  - <xref:list>[<xref:"ApplicationGatewayAuthConfig">]
- description: 'The provisioning state of the advanced routing rule resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.advancedRoutingConditionSet
  name: advancedRoutingConditionSet
  summary: Advanced routing condition set resource evaluated by this rule.
  signature: 'advancedRoutingConditionSet: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.authConfigs
  name: authConfigs
  summary: 'Authentication configuration bindings of the advanced routing rule. Only
    one authentication

    configuration is supported. Authentication configuration names must be unique
    across the

    Application Gateway, and an Application Gateway can reference at most 100 distinct

    authentication policies. Authentication policies can only be bound to Application
    Gateways

    using the Standard_v2 or WAF_v2 SKU.'
  signature: 'authConfigs: list[''ApplicationGatewayAuthConfig'']'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.backendAddressPool
  name: backendAddressPool
  summary: 'Backend address pool resource of the advanced routing rule. Required unless

    redirectConfiguration is specified.'
  signature: 'backendAddressPool: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.backendHttpSettings
  name: backendHttpSettings
  summary: 'Backend http settings resource of the advanced routing rule. Required
    unless

    redirectConfiguration is specified.'
  signature: 'backendHttpSettings: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.priority
  name: priority
  summary: 'Priority of the advanced routing rule. Must be unique within the containing
    advanced routing

    map. Rules are evaluated in ascending priority order. Required.'
  signature: 'priority: Required[int]'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.redirectConfiguration
  name: redirectConfiguration
  summary: 'Redirect configuration resource of the advanced routing rule. Cannot be
    combined with

    backendAddressPool or backendHttpSettings.'
  signature: 'redirectConfiguration: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayAdvancedRoutingRulePropertiesFormat.rewriteRuleSet
  name: rewriteRuleSet
  summary: Rewrite rule set resource of the advanced routing rule.
  signature: 'rewriteRuleSet: SubResource'
