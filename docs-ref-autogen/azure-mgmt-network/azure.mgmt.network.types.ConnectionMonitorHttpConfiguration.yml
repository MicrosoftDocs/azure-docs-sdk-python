  name: requestHeaders
  summary: The HTTP headers to transmit with the request.
  signature: 'requestHeaders: list[''HTTPHeader'']'
- uid: azure.mgmt.network.types.ConnectionMonitorHttpConfiguration.validStatusCodeRanges
  name: validStatusCodeRanges
  summary: HTTP status codes to consider successful. For instance, "2xx,301-304,418".
  signature: 'validStatusCodeRanges: list[str]'
