uid: azure.mgmt.network.types.ConnectionMonitorHttpConfiguration
name: ConnectionMonitorHttpConfiguration
fullName: azure.mgmt.network.types.ConnectionMonitorHttpConfiguration
module: azure.mgmt.network.types
summary: Describes the HTTP configuration.
constructor:
  syntax: ConnectionMonitorHttpConfiguration()
variables:
- description: The port to connect to.
  name: port
  types:
  - <xref:int>
- description: 'The HTTP method to use. Known values are: "Get" and "Post".'
  name: method
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"HTTPConfigurationMethod">]
- description: The path component of the URI. For instance, "/dir1/dir2".
  name: path
  types:
  - <xref:str>
- description: The HTTP headers to transmit with the request.
  name: requestHeaders
  types:
  - <xref:list>[<xref:"HTTPHeader">]
- description: 'HTTP status codes to consider successful. For instance,

    "2xx,301-304,418".'
  name: validStatusCodeRanges
  types:
  - <xref:list>[<xref:str>]
- description: 'Value indicating whether HTTPS is preferred over HTTP in cases where
    the

    choice is not explicit.'
  name: preferHTTPS
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.network.types.ConnectionMonitorHttpConfiguration.method
  name: method
  summary: '"Get" and "Post".'
  signature: 'method: str | HTTPConfigurationMethod'
- uid: azure.mgmt.network.types.ConnectionMonitorHttpConfiguration.path
  name: path
  summary: The path component of the URI. For instance, "/dir1/dir2".
  signature: 'path: str'
- uid: azure.mgmt.network.types.ConnectionMonitorHttpConfiguration.port
  name: port
  summary: The port to connect to.
  signature: 'port: int'
- uid: azure.mgmt.network.types.ConnectionMonitorHttpConfiguration.preferHTTPS
  name: preferHTTPS
  summary: 'Value indicating whether HTTPS is preferred over HTTP in cases where the
    choice is not

    explicit.'
  signature: 'preferHTTPS: bool'
