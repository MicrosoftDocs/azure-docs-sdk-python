### YamlMime:PythonClass
uid: azure.mgmt.network.models.DiagnosticOperationResult
name: DiagnosticOperationResult
fullName: azure.mgmt.network.models.DiagnosticOperationResult
module: azure.mgmt.network.models
summary: Result of an individual diagnostic operation run by a connection analyzer.
constructor:
  syntax: 'DiagnosticOperationResult(*args: Any, **kwargs: Any)'
variables:
- description: 'The diagnostic operation that was run. Required. Known values are:

    "NextHop", "NSG", "PortScan", "ConnectivityCheck", and "ExpressRouteDiagnostic".'
  name: diagnostic_operation
  types:
  - <xref:str>
  - <xref:azure.mgmt.network.models.DiagnosticOperation>
- description: Error encountered while running the diagnostic operation, if any.
  name: error
  types:
  - <xref:str>
- description: 'The result of the diagnostic operation, serialized as a JSON string.


    The payload shape varies by `diagnosticOperation`. For example, a

    `ConnectivityCheck` operation returns a JSON object such as

    `{ "ConnectivityStatus": "Reachable" }`. Consumers should parse this

    string as JSON according to the corresponding diagnostic operation.'
  name: result
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.models.DiagnosticOperationResult.diagnostic_operation
  name: diagnostic_operation
  summary: '"NextHop", "NSG",

    "PortScan", "ConnectivityCheck", and "ExpressRouteDiagnostic".'
  signature: 'diagnostic_operation: str | _models.DiagnosticOperation'
- uid: azure.mgmt.network.models.DiagnosticOperationResult.error
  name: error
  summary: Error encountered while running the diagnostic operation, if any.
  signature: 'error: str | None'
- uid: azure.mgmt.network.models.DiagnosticOperationResult.result
  name: result
  summary: 'The result of the diagnostic operation, serialized as a JSON string.


    The payload shape varies by `diagnosticOperation`. For example, a

    `ConnectivityCheck` operation returns a JSON object such as

