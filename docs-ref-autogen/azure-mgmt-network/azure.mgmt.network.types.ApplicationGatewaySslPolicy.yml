### YamlMime:PythonClass
uid: azure.mgmt.network.types.ApplicationGatewaySslPolicy
name: ApplicationGatewaySslPolicy
fullName: azure.mgmt.network.types.ApplicationGatewaySslPolicy
module: azure.mgmt.network.types
summary: Application Gateway Ssl policy.
constructor:
  syntax: ApplicationGatewaySslPolicy()
variables:
- description: Ssl protocols to be disabled on application gateway.
  name: disabledSslProtocols
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewaySslProtocol">]]
- description: 'Type of Ssl Policy. Known values are: "Predefined", "Custom", and
    "CustomV2".'
  name: policyType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewaySslPolicyType">]
- description: 'Name of Ssl predefined policy. Known values are: "AppGwSslPolicy20150501",

    "AppGwSslPolicy20170401", "AppGwSslPolicy20170401S", "AppGwSslPolicy20220101",
    and

    "AppGwSslPolicy20220101S".'
  name: policyName
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewaySslPolicyName">]
- description: 'Ssl cipher suites to be enabled in the specified order to application

    gateway.'
  name: cipherSuites
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewaySslCipherSuite">]]
- description: 'Minimum version of Ssl protocol to be supported on application

    gateway. Known values are: "TLSv1_0", "TLSv1_1", "TLSv1_2", and "TLSv1_3".'
  name: minProtocolVersion
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewaySslProtocol">]
attributes:
- uid: azure.mgmt.network.types.ApplicationGatewaySslPolicy.cipherSuites
  name: cipherSuites
  summary: Ssl cipher suites to be enabled in the specified order to application gateway.
  signature: 'cipherSuites: list[typing.Union[str, ForwardRef(''ApplicationGatewaySslCipherSuite'')]]'
- uid: azure.mgmt.network.types.ApplicationGatewaySslPolicy.disabledSslProtocols
  name: disabledSslProtocols
  summary: Ssl protocols to be disabled on application gateway.
  signature: 'disabledSslProtocols: list[typing.Union[str, ForwardRef(''ApplicationGatewaySslProtocol'')]]'
- uid: azure.mgmt.network.types.ApplicationGatewaySslPolicy.minProtocolVersion
  name: minProtocolVersion
  summary: 'Minimum version of Ssl protocol to be supported on application gateway.
    Known values are:

    "TLSv1_0", "TLSv1_1", "TLSv1_2", and "TLSv1_3".'
  signature: 'minProtocolVersion: str | ApplicationGatewaySslProtocol'
- uid: azure.mgmt.network.types.ApplicationGatewaySslPolicy.policyName
  name: policyName
  summary: '"AppGwSslPolicy20150501",

    "AppGwSslPolicy20170401", "AppGwSslPolicy20170401S", "AppGwSslPolicy20220101",
    and

    "AppGwSslPolicy20220101S".'
  signature: 'policyName: str | ApplicationGatewaySslPolicyName'
- uid: azure.mgmt.network.types.ApplicationGatewaySslPolicy.policyType
  name: policyType
  summary: '"Predefined", "Custom", and "CustomV2".'
  signature: 'policyType: str | ApplicationGatewaySslPolicyType'
