### YamlMime:PythonClass
uid: azure.mgmt.network.types.AzureFirewallIPConfigurationPropertiesFormat
name: AzureFirewallIPConfigurationPropertiesFormat
fullName: azure.mgmt.network.types.AzureFirewallIPConfigurationPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of IP configuration of an Azure Firewall.
constructor:
  syntax: AzureFirewallIPConfigurationPropertiesFormat()
variables:
- description: 'The Firewall Internal Load Balancer IP to be used as the next hop
    in

    User Defined Routes.'
  name: privateIPAddress
  types:
  - <xref:str>
- description: 'Reference to the subnet resource. This resource must be named

    ''AzureFirewallSubnet'' or ''AzureFirewallManagementSubnet''.'
  name: subnet
  types:
  - <xref:<xref:"SubResource">>
- description: 'Reference to the PublicIP resource. This field is a mandatory input
    if

    subnet is not null.'
  name: publicIPAddress
  types:
  - <xref:<xref:"SubResource">>
- description: 'The provisioning state of the Azure firewall IP configuration

    resource. Known values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating",
    and

    "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.AzureFirewallIPConfigurationPropertiesFormat.privateIPAddress
  name: privateIPAddress
  summary: The Firewall Internal Load Balancer IP to be used as the next hop in User
    Defined Routes.
  signature: 'privateIPAddress: str'
- uid: azure.mgmt.network.types.AzureFirewallIPConfigurationPropertiesFormat.provisioningState
  name: provisioningState
  summary: 'The provisioning state of the Azure firewall IP configuration resource.
    Known values are:

    "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.AzureFirewallIPConfigurationPropertiesFormat.publicIPAddress
  name: publicIPAddress
  summary: Reference to the PublicIP resource. This field is a mandatory input if
    subnet is not null.
  signature: 'publicIPAddress: SubResource'
- uid: azure.mgmt.network.types.AzureFirewallIPConfigurationPropertiesFormat.subnet
  name: subnet
  summary: 'Reference to the subnet resource. This resource must be named ''AzureFirewallSubnet''
    or

    ''AzureFirewallManagementSubnet''.'
  signature: 'subnet: SubResource'
