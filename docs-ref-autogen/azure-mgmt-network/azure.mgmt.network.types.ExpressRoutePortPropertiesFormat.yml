uid: azure.mgmt.network.types.ExpressRoutePortPropertiesFormat
name: ExpressRoutePortPropertiesFormat
fullName: azure.mgmt.network.types.ExpressRoutePortPropertiesFormat
module: azure.mgmt.network.types
summary: ExpressRoutePort Properties.
constructor:
  syntax: ExpressRoutePortPropertiesFormat()
variables:
- description: 'The name of the peering location that the ExpressRoutePort is mapped
    to

    physically.'
  name: peeringLocation
  types:
  - <xref:str>
- description: Bandwidth of procured ports in Gbps.
  name: bandwidthInGbps
  types:
  - <xref:int>
- description: Aggregate Gbps of associated circuit bandwidths.
  name: provisionedBandwidthInGbps
  types:
  - <xref:float>
- description: Maximum transmission unit of the physical port pair(s).
  name: mtu
  types:
  - <xref:str>
- description: 'Encapsulation method on physical ports. Known values are: "Dot1Q"
    and

    "QinQ".'
  name: encapsulation
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExpressRoutePortsEncapsulation">]
- description: Ether type of the physical port.
  name: etherType
  types:
  - <xref:str>
- description: 'Date of the physical port allocation to be used in Letter of

    Authorization.'
  name: allocationDate
  types:
  - <xref:str>
- description: ExpressRouteLink Sub-Resources.
  name: links
  types:
  - <xref:list>[<xref:"ExpressRouteLink">]
