    ExpressRoutePort resource.'
  name: circuits
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'The provisioning state of the express route port resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The resource GUID property of the express route port resource.
  name: resourceGuid
  types:
  - <xref:str>
- description: 'The billing type of the ExpressRoutePort resource. Known values are:

    "MeteredData" and "UnlimitedData".'
  name: billingType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExpressRoutePortsBillingType">]
