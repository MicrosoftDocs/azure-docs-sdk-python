### YamlMime:PythonClass
uid: azure.mgmt.network.types.SecurityRulePropertiesFormat
name: SecurityRulePropertiesFormat
fullName: azure.mgmt.network.types.SecurityRulePropertiesFormat
module: azure.mgmt.network.types
summary: Security rule resource.
constructor:
  syntax: SecurityRulePropertiesFormat()
variables:
- description: A description for this rule. Restricted to 140 chars.
  name: description
  types:
  - <xref:str>
- description: 'Network protocol this rule applies to. Required. Known values are:
    "Tcp",

    "Udp", "Icmp", "Esp", "*", and "Ah".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityRuleProtocol">]
- description: 'The source port or range. Integer or range between 0 and 65535. Asterisk

    ''*'' can also be used to match all ports.'
  name: sourcePortRange
  types:
  - <xref:str>
- description: 'The destination port or range. Integer or range between 0 and

    65535. Asterisk ''*'' can also be used to match all ports.'
  name: destinationPortRange
  types:
  - <xref:str>
- description: 'The CIDR or source IP range. Asterisk ''*'' can also be used to match

    all source IPs. Default tags such as ''VirtualNetwork'', ''AzureLoadBalancer''
    and ''Internet'' can

    also be used. If this is an ingress rule, specifies where network traffic originates
    from.'
  name: sourceAddressPrefix
  types:
  - <xref:str>
- description: The CIDR or source IP ranges.
  name: sourceAddressPrefixes
  types:
  - <xref:list>[<xref:str>]
- description: The application security group specified as source.
  name: sourceApplicationSecurityGroups
  types:
  - <xref:list>[<xref:"ApplicationSecurityGroup">]
- description: 'The destination address prefix. CIDR or destination IP range.

    Asterisk ''*'' can also be used to match all source IPs. Default tags such as
    ''VirtualNetwork'',

    ''AzureLoadBalancer'' and ''Internet'' can also be used.'
  name: destinationAddressPrefix
  types:
  - <xref:str>
- description: 'The destination address prefixes. CIDR or destination IP

    ranges.'
  name: destinationAddressPrefixes
  types:
  - <xref:list>[<xref:str>]
- description: 'The application security group specified as

    destination.'
  name: destinationApplicationSecurityGroups
  types:
  - <xref:list>[<xref:"ApplicationSecurityGroup">]
- description: The source port ranges.
  name: sourcePortRanges
  types:
  - <xref:list>[<xref:str>]
- description: The destination port ranges.
  name: destinationPortRanges
  types:
  - <xref:list>[<xref:str>]
- description: 'The network traffic is allowed or denied. Required. Known values are:
    "Allow" and

    "Deny".'
  name: access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityRuleAccess">]
- description: 'The priority of the rule. The value can be between 100 and 4096. The
    priority

    number must be unique for each rule in the collection. The lower the priority
    number, the

    higher the priority of the rule. Required.'
  name: priority
  types:
  - <xref:int>
- description: 'The direction of the rule. The direction specifies if rule will be
    evaluated

    on incoming or outgoing traffic. Required. Known values are: "Inbound" and "Outbound".'
  name: direction
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SecurityRuleDirection">]
- description: 'The provisioning state of the security rule resource. Known values

    are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.access
  name: access
  summary: '"Allow" and "Deny".'
  signature: 'access: Required[str | SecurityRuleAccess]'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.description
  name: description
  summary: A description for this rule. Restricted to 140 chars.
  signature: 'description: str'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.destinationAddressPrefix
  name: destinationAddressPrefix
  summary: 'The destination address prefix. CIDR or destination IP range. Asterisk
    ''*'' can also be used to

    match all source IPs. Default tags such as ''VirtualNetwork'', ''AzureLoadBalancer''
    and ''Internet''

    can also be used.'
  signature: 'destinationAddressPrefix: str'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.destinationAddressPrefixes
  name: destinationAddressPrefixes
  summary: The destination address prefixes. CIDR or destination IP ranges.
  signature: 'destinationAddressPrefixes: list[str]'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.destinationApplicationSecurityGroups
  name: destinationApplicationSecurityGroups
  summary: The application security group specified as destination.
  signature: 'destinationApplicationSecurityGroups: list[''ApplicationSecurityGroup'']'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.destinationPortRange
  name: destinationPortRange
  summary: 'The destination port or range. Integer or range between 0 and 65535. Asterisk
    ''*'' can also be

    used to match all ports.'
  signature: 'destinationPortRange: str'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.destinationPortRanges
  name: destinationPortRanges
  summary: The destination port ranges.
  signature: 'destinationPortRanges: list[str]'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.direction
  name: direction
  summary: 'The direction of the rule. The direction specifies if rule will be evaluated
    on incoming or

    outgoing traffic. Required. Known values are: "Inbound" and "Outbound".'
  signature: 'direction: Required[str | SecurityRuleDirection]'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.priority
  name: priority
  summary: 'The priority of the rule. The value can be between 100 and 4096. The priority
    number must be

    unique for each rule in the collection. The lower the priority number, the higher
    the priority

    of the rule. Required.'
  signature: 'priority: Required[int]'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.protocol
  name: protocol
  summary: '"Tcp", "Udp", "Icmp",

    "Esp", "*", and "Ah".'
  signature: 'protocol: Required[str | SecurityRuleProtocol]'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.sourceAddressPrefix
  name: sourceAddressPrefix
  summary: 'The CIDR or source IP range. Asterisk ''*'' can also be used to match
    all source IPs. Default

    tags such as ''VirtualNetwork'', ''AzureLoadBalancer'' and ''Internet'' can also
    be used. If this is

    an ingress rule, specifies where network traffic originates from.'
  signature: 'sourceAddressPrefix: str'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.sourceAddressPrefixes
  name: sourceAddressPrefixes
  summary: The CIDR or source IP ranges.
  signature: 'sourceAddressPrefixes: list[str]'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.sourceApplicationSecurityGroups
  name: sourceApplicationSecurityGroups
  summary: The application security group specified as source.
  signature: 'sourceApplicationSecurityGroups: list[''ApplicationSecurityGroup'']'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.sourcePortRange
  name: sourcePortRange
  summary: 'The source port or range. Integer or range between 0 and 65535. Asterisk
    ''*'' can also be used

    to match all ports.'
  signature: 'sourcePortRange: str'
- uid: azure.mgmt.network.types.SecurityRulePropertiesFormat.sourcePortRanges
  name: sourcePortRanges
  summary: The source port ranges.
  signature: 'sourcePortRanges: list[str]'
