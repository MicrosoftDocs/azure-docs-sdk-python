uid: azure.mgmt.network.types.PacketCaptureSettings
name: PacketCaptureSettings
fullName: azure.mgmt.network.types.PacketCaptureSettings
module: azure.mgmt.network.types
summary: The storage location for a packet capture session.
constructor:
  syntax: PacketCaptureSettings()
variables:
- description: 'Number of file count. Default value of count is 10 and maximum number
    is

    10000.'
  name: fileCount
  types:
  - <xref:int>
- description: 'Number of bytes captured per packet. Default value in bytes 104857600

    (100MB) and maximum in bytes 4294967295 (4GB).'
  name: fileSizeInBytes
  types:
  - <xref:int>
- description: 'Maximum duration of the capture session in seconds is 604800s

    (7 days) for a file. Default value in second 86400s (1 day).'
  name: sessionTimeLimitInSeconds
  types:
  - <xref:int>
