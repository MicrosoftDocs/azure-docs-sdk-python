  signature: 'vpnClientRootCertificates: list[''VpnServerConfigVpnClientRootCertificate'']'
- uid: azure.mgmt.network.types.VpnServerConfigurationProperties.vpnProtocols
  name: vpnProtocols
  summary: VPN protocols for the VpnServerConfiguration.
  signature: 'vpnProtocols: list[typing.Union[str, ForwardRef(''VpnGatewayTunnelingProtocol'')]]'
