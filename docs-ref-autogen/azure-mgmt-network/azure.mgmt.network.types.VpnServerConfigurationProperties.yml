  name: radiusClientRootCertificates
  summary: Radius client root certificate of VpnServerConfiguration.
  signature: 'radiusClientRootCertificates: list[''VpnServerConfigRadiusClientRootCertificate'']'
- uid: azure.mgmt.network.types.VpnServerConfigurationProperties.radiusServerAddress
  name: radiusServerAddress
  summary: 'The radius server address property of the VpnServerConfiguration resource
    for point to site

    client connection.'
  signature: 'radiusServerAddress: str'
- uid: azure.mgmt.network.types.VpnServerConfigurationProperties.radiusServerRootCertificates
  name: radiusServerRootCertificates
  summary: Radius Server root certificate of VpnServerConfiguration.
  signature: 'radiusServerRootCertificates: list[''VpnServerConfigRadiusServerRootCertificate'']'
- uid: azure.mgmt.network.types.VpnServerConfigurationProperties.radiusServerSecret
  name: radiusServerSecret
