### YamlMime:PythonClass
uid: azure.mgmt.network.types.VpnServerConfigurationProperties
name: VpnServerConfigurationProperties
fullName: azure.mgmt.network.types.VpnServerConfigurationProperties
module: azure.mgmt.network.types
summary: Parameters for VpnServerConfiguration.
constructor:
  syntax: VpnServerConfigurationProperties()
variables:
- description: The name of the VpnServerConfiguration that is unique within a resource
    group.
  name: name
  types:
  - <xref:str>
- description: VPN protocols for the VpnServerConfiguration.
  name: vpnProtocols
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"VpnGatewayTunnelingProtocol">]]
- description: VPN authentication types for the VpnServerConfiguration.
  name: vpnAuthenticationTypes
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"VpnAuthenticationType">]]
- description: VPN client root certificate of VpnServerConfiguration.
  name: vpnClientRootCertificates
  types:
  - <xref:list>[<xref:"VpnServerConfigVpnClientRootCertificate">]
- description: VPN client revoked certificate of VpnServerConfiguration.
  name: vpnClientRevokedCertificates
  types:
  - <xref:list>[<xref:"VpnServerConfigVpnClientRevokedCertificate">]
- description: Radius Server root certificate of VpnServerConfiguration.
  name: radiusServerRootCertificates
  types:
  - <xref:list>[<xref:"VpnServerConfigRadiusServerRootCertificate">]
- description: Radius client root certificate of VpnServerConfiguration.
  name: radiusClientRootCertificates
  types:
  - <xref:list>[<xref:"VpnServerConfigRadiusClientRootCertificate">]
- description: VpnClientIpsecPolicies for VpnServerConfiguration.
  name: vpnClientIpsecPolicies
  types:
  - <xref:list>[<xref:"IpsecPolicy">]
- description: 'The radius server address property of the VpnServerConfiguration

    resource for point to site client connection.'
  name: radiusServerAddress
  types:
  - <xref:str>
- description: 'The radius secret property of the VpnServerConfiguration resource
    for

    point to site client connection. We will no longer return radiusServerSecret in

    VpnServerConfiguration Create/Update/Get/List/UpdateTags APIs response. Please
    use

    VpnServerConfiguration ListRadiusSecrets API to fetch radius server secrets.'
  name: radiusServerSecret
  types:
  - <xref:str>
- description: Multiple Radius Server configuration for VpnServerConfiguration.
  name: radiusServers
  types:
  - <xref:list>[<xref:"RadiusServer">]
- description: The set of aad vpn authentication parameters.
  name: aadAuthenticationParameters
  types:
  - <xref:<xref:"AadAuthenticationParameters">>
- description: 'The provisioning state of the VpnServerConfiguration resource.

    Possible values are: ''Updating'', ''Deleting'', and ''Failed''.'
  name: provisioningState
  types:
  - <xref:str>
- description: List of references to P2SVpnGateways.
  name: p2SVpnGateways
  types:
  - <xref:list>[<xref:"P2SVpnGateway">]
- description: List of all VpnServerConfigurationPolicyGroups.
  name: configurationPolicyGroups
  types:
  - <xref:list>[<xref:"VpnServerConfigurationPolicyGroup">]
- description: A unique read-only string that changes whenever the resource is updated.
  name: etag
  types:
  - <xref:str>
