### YamlMime:PythonClass
uid: azure.mgmt.network.types.ApplicationGatewayOnDemandProbe
name: ApplicationGatewayOnDemandProbe
fullName: azure.mgmt.network.types.ApplicationGatewayOnDemandProbe
module: azure.mgmt.network.types
summary: Details of on demand test probe request.
constructor:
  syntax: ApplicationGatewayOnDemandProbe()
variables:
- description: 'The protocol used for the probe. Known values are: "Http", "Https",
    "Tcp", and

    "Tls".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewayProtocol">]
- description: Host name to send the probe to.
  name: host
  types:
  - <xref:str>
- description: 'Relative path of probe. Valid path starts from ''/''. Probe is sent
    to

    <Protocol>://<host>:<port><path>.'
  name: path
  types:
  - <xref:str>
- description: 'The probe timeout in seconds. Probe marked as failed if valid response
    is not

    received with this timeout period. Acceptable values are from 1 second to 86400
    seconds.'
  name: timeout
  types:
  - <xref:int>
- description: 'Whether the host header should be picked from the

    backend http settings. Default value is false.'
  name: pickHostNameFromBackendHttpSettings
  types:
  - <xref:bool>
- description: 'Whether to send Proxy Protocol header along with the

    Health Probe over TCP or TLS protocol. Default value is false.'
  name: enableProbeProxyProtocolHeader
  types:
  - <xref:bool>
- description: Criterion for classifying a healthy probe response.
  name: match
  types:
  - <xref:<xref:"ApplicationGatewayProbeHealthResponseMatch">>
- description: 'Reference to backend pool of application gateway to which probe

    request will be sent.'
  name: backendAddressPool
  types:
  - <xref:<xref:"SubResource">>
- description: 'Reference to backend http setting of application gateway to be used

    for test probe.'
  name: backendHttpSettings
  types:
  - <xref:<xref:"SubResource">>
attributes:
- uid: azure.mgmt.network.types.ApplicationGatewayOnDemandProbe.backendAddressPool
  name: backendAddressPool
  summary: Reference to backend pool of application gateway to which probe request
    will be sent.
  signature: 'backendAddressPool: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayOnDemandProbe.backendHttpSettings
  name: backendHttpSettings
  summary: Reference to backend http setting of application gateway to be used for
    test probe.
  signature: 'backendHttpSettings: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayOnDemandProbe.enableProbeProxyProtocolHeader
  name: enableProbeProxyProtocolHeader
  summary: 'Whether to send Proxy Protocol header along with the Health Probe over
    TCP or TLS protocol.

    Default value is false.'
  signature: 'enableProbeProxyProtocolHeader: bool'
- uid: azure.mgmt.network.types.ApplicationGatewayOnDemandProbe.host
  name: host
  summary: Host name to send the probe to.
  signature: 'host: str'
- uid: azure.mgmt.network.types.ApplicationGatewayOnDemandProbe.match
  name: match
  summary: Criterion for classifying a healthy probe response.
  signature: 'match: ApplicationGatewayProbeHealthResponseMatch'
- uid: azure.mgmt.network.types.ApplicationGatewayOnDemandProbe.path
  name: path
  summary: 'Relative path of probe. Valid path starts from ''/''. Probe is sent to

    <Protocol>://<host>:<port><path>.'
  signature: 'path: str'
- uid: azure.mgmt.network.types.ApplicationGatewayOnDemandProbe.pickHostNameFromBackendHttpSettings
  name: pickHostNameFromBackendHttpSettings
  summary: 'Whether the host header should be picked from the backend http settings.
    Default value is

    false.'
  signature: 'pickHostNameFromBackendHttpSettings: bool'
- uid: azure.mgmt.network.types.ApplicationGatewayOnDemandProbe.protocol
  name: protocol
  summary: '"Http", "Https", "Tcp", and "Tls".'
  signature: 'protocol: str | ApplicationGatewayProtocol'
- uid: azure.mgmt.network.types.ApplicationGatewayOnDemandProbe.timeout
  name: timeout
  summary: 'The probe timeout in seconds. Probe marked as failed if valid response
    is not received with

    this timeout period. Acceptable values are from 1 second to 86400 seconds.'
  signature: 'timeout: int'
