### YamlMime:PythonClass
uid: azure.mgmt.network.types.FlowLogPropertiesFormat
name: FlowLogPropertiesFormat
fullName: azure.mgmt.network.types.FlowLogPropertiesFormat
module: azure.mgmt.network.types
summary: Parameters that define the configuration of flow log.
constructor:
  syntax: FlowLogPropertiesFormat()
variables:
- description: 'ID of network security group to which flow log will be applied.

    Required.'
  name: targetResourceId
  types:
  - <xref:str>
- description: Guid of network security group to which flow log will be applied.
  name: targetResourceGuid
  types:
  - <xref:str>
- description: ID of the storage account which is used to store the flow log. Required.
  name: storageId
  types:
  - <xref:str>
- description: 'Optional field to filter network traffic logs based on SrcIP,

    SrcPort, DstIP, DstPort, Protocol, Encryption, Direction and Action. If not specified,
    all

    network traffic will be logged.'
  name: enabledFilteringCriteria
  types:
  - <xref:str>
- description: 'Optional field to filter network traffic logs based on flow states.
    Value of

    this field could be any comma separated combination string of letters B,C,E or
    D. B represents

    Begin, when a flow is created. C represents Continue for an ongoing flow generated
    at every

    five-minute interval. E represents End, when a flow is terminated. D represents
    Deny, when a

    flow is denied. If not specified, all network traffic will be logged.'
  name: recordTypes
  types:
  - <xref:str>
- description: Flag to enable/disable flow logging.
  name: enabled
  types:
  - <xref:bool>
- description: Parameters that define the retention policy for flow log.
  name: retentionPolicy
  types:
  - <xref:<xref:"RetentionPolicyParameters">>
- description: Parameters that define the flow log format.
  name: format
  types:
  - <xref:<xref:"FlowLogFormatParameters">>
- description: 'Parameters that define the configuration of traffic

    analytics.'
  name: flowAnalyticsConfiguration
  types:
  - <xref:<xref:"TrafficAnalyticsProperties">>
- description: 'The provisioning state of the flow log. Known values are: "Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.FlowLogPropertiesFormat.enabled
  name: enabled
  summary: Flag to enable/disable flow logging.
  signature: 'enabled: bool'
- uid: azure.mgmt.network.types.FlowLogPropertiesFormat.enabledFilteringCriteria
  name: enabledFilteringCriteria
  summary: 'Optional field to filter network traffic logs based on SrcIP, SrcPort,
    DstIP, DstPort,

    Protocol, Encryption, Direction and Action. If not specified, all network traffic
    will be

    logged.'
  signature: 'enabledFilteringCriteria: str'
- uid: azure.mgmt.network.types.FlowLogPropertiesFormat.flowAnalyticsConfiguration
  name: flowAnalyticsConfiguration
  summary: Parameters that define the configuration of traffic analytics.
  signature: 'flowAnalyticsConfiguration: TrafficAnalyticsProperties'
- uid: azure.mgmt.network.types.FlowLogPropertiesFormat.format
  name: format
  summary: Parameters that define the flow log format.
  signature: 'format: FlowLogFormatParameters'
- uid: azure.mgmt.network.types.FlowLogPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed", "Succeeded",

    "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.FlowLogPropertiesFormat.recordTypes
  name: recordTypes
  summary: 'Optional field to filter network traffic logs based on flow states. Value
    of this field could

    be any comma separated combination string of letters B,C,E or D. B represents
    Begin, when a

    flow is created. C represents Continue for an ongoing flow generated at every
    five-minute

    interval. E represents End, when a flow is terminated. D represents Deny, when
    a flow is

    denied. If not specified, all network traffic will be logged.'
  signature: 'recordTypes: str'
- uid: azure.mgmt.network.types.FlowLogPropertiesFormat.retentionPolicy
  name: retentionPolicy
  summary: Parameters that define the retention policy for flow log.
  signature: 'retentionPolicy: RetentionPolicyParameters'
- uid: azure.mgmt.network.types.FlowLogPropertiesFormat.storageId
  name: storageId
  summary: ID of the storage account which is used to store the flow log. Required.
  signature: 'storageId: Required[str]'
- uid: azure.mgmt.network.types.FlowLogPropertiesFormat.targetResourceGuid
  name: targetResourceGuid
  summary: Guid of network security group to which flow log will be applied.
  signature: 'targetResourceGuid: str'
- uid: azure.mgmt.network.types.FlowLogPropertiesFormat.targetResourceId
  name: targetResourceId
  summary: ID of network security group to which flow log will be applied. Required.
  signature: 'targetResourceId: Required[str]'
