### YamlMime:PythonClass
uid: azure.mgmt.network.types.VirtualNetworkTapPropertiesFormat
name: VirtualNetworkTapPropertiesFormat
fullName: azure.mgmt.network.types.VirtualNetworkTapPropertiesFormat
module: azure.mgmt.network.types
summary: Virtual Network Tap properties.
constructor:
  syntax: VirtualNetworkTapPropertiesFormat()
variables:
- description: 'Specifies the list of resource IDs for the network

    interface IP configuration that needs to be tapped.'
  name: networkInterfaceTapConfigurations
  types:
  - <xref:list>[<xref:"NetworkInterfaceTapConfiguration">]
- description: The resource GUID property of the virtual network tap resource.
  name: resourceGuid
  types:
  - <xref:str>
- description: 'The provisioning state of the virtual network tap resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The reference to the private IP Address of

    the collector nic that will receive the tap.'
  name: destinationNetworkInterfaceIPConfiguration
  types:
  - <xref:<xref:"NetworkInterfaceIPConfiguration">>
- description: 'The reference to the private IP address

    on the internal Load Balancer that will receive the tap.'
  name: destinationLoadBalancerFrontEndIPConfiguration
  types:
  - <xref:<xref:"FrontendIPConfiguration">>
- description: The VXLAN destination port that will receive the tapped traffic.
  name: destinationPort
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.network.types.VirtualNetworkTapPropertiesFormat.destinationLoadBalancerFrontEndIPConfiguration
  name: destinationLoadBalancerFrontEndIPConfiguration
  summary: 'The reference to the private IP address on the internal Load Balancer
    that will receive the

    tap.'
  signature: 'destinationLoadBalancerFrontEndIPConfiguration: FrontendIPConfiguration'
- uid: azure.mgmt.network.types.VirtualNetworkTapPropertiesFormat.destinationNetworkInterfaceIPConfiguration
  name: destinationNetworkInterfaceIPConfiguration
  summary: The reference to the private IP Address of the collector nic that will
    receive the tap.
  signature: 'destinationNetworkInterfaceIPConfiguration: NetworkInterfaceIPConfiguration'
- uid: azure.mgmt.network.types.VirtualNetworkTapPropertiesFormat.destinationPort
  name: destinationPort
  summary: The VXLAN destination port that will receive the tapped traffic.
  signature: 'destinationPort: int'
- uid: azure.mgmt.network.types.VirtualNetworkTapPropertiesFormat.networkInterfaceTapConfigurations
  name: networkInterfaceTapConfigurations
  summary: 'Specifies the list of resource IDs for the network interface IP configuration
    that needs to be

    tapped.'
  signature: 'networkInterfaceTapConfigurations: list[''NetworkInterfaceTapConfiguration'']'
- uid: azure.mgmt.network.types.VirtualNetworkTapPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.VirtualNetworkTapPropertiesFormat.resourceGuid
  name: resourceGuid
  summary: The resource GUID property of the virtual network tap resource.
  signature: 'resourceGuid: str'
