  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.sku
  name: sku
  summary: The Azure Firewall Resource SKU.
  signature: 'sku: AzureFirewallSku'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.threatIntelMode
  name: threatIntelMode
  summary: '"Alert", "Deny", and "Off".'
  signature: 'threatIntelMode: str | AzureFirewallThreatIntelMode'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.virtualHub
  name: virtualHub
  summary: The virtualHub to which the firewall belongs.
  signature: 'virtualHub: SubResource'
