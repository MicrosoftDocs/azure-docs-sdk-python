### YamlMime:PythonClass
uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat
name: AzureFirewallPropertiesFormat
fullName: azure.mgmt.network.types.AzureFirewallPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of the Azure Firewall.
constructor:
  syntax: AzureFirewallPropertiesFormat()
variables:
- description: 'Collection of application rule collections used by Azure

    Firewall.'
  name: applicationRuleCollections
  types:
  - <xref:list>[<xref:"AzureFirewallApplicationRuleCollection">]
- description: Collection of NAT rule collections used by Azure Firewall.
  name: natRuleCollections
  types:
  - <xref:list>[<xref:"AzureFirewallNatRuleCollection">]
- description: Collection of network rule collections used by Azure Firewall.
  name: networkRuleCollections
  types:
  - <xref:list>[<xref:"AzureFirewallNetworkRuleCollection">]
- description: IP configuration of the Azure Firewall resource.
  name: ipConfigurations
  types:
  - <xref:list>[<xref:"AzureFirewallIPConfiguration">]
- description: 'IP configuration of the Azure Firewall used for management

    traffic.'
  name: managementIpConfiguration
  types:
  - <xref:<xref:"AzureFirewallIPConfiguration">>
- description: 'The provisioning state of the Azure firewall resource. Known values

    are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'The operation mode for Threat Intelligence. Known values are: "Alert",

    "Deny", and "Off".'
  name: threatIntelMode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"AzureFirewallThreatIntelMode">]
- description: The virtualHub to which the firewall belongs.
  name: virtualHub
  types:
  - <xref:<xref:"SubResource">>
- description: The firewallPolicy associated with this azure firewall.
  name: firewallPolicy
  types:
  - <xref:<xref:"SubResource">>
- description: IP addresses associated with AzureFirewall.
  name: hubIPAddresses
  types:
  - <xref:<xref:"HubIPAddresses">>
- description: IpGroups associated with AzureFirewall.
  name: ipGroups
  types:
  - <xref:list>[<xref:"AzureFirewallIpGroups">]
- description: The Azure Firewall Resource SKU.
  name: sku
  types:
  - <xref:<xref:"AzureFirewallSku">>
- description: 'The additional properties used to further config this azure

    firewall.'
  name: additionalProperties
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'Properties to provide a custom autoscale configuration to this

    azure firewall.'
  name: autoscaleConfiguration
  types:
  - <xref:<xref:"AzureFirewallAutoscaleConfiguration">>
- description: AFC configuration for the Azure Firewall.
  name: afcConfiguration
  types:
  - <xref:<xref:"AfcConfiguration">>
attributes:
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.additionalProperties
  name: additionalProperties
  summary: The additional properties used to further config this azure firewall.
  signature: 'additionalProperties: dict[str, str]'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.afcConfiguration
  name: afcConfiguration
  summary: AFC configuration for the Azure Firewall.
  signature: 'afcConfiguration: AfcConfiguration'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.applicationRuleCollections
  name: applicationRuleCollections
  summary: Collection of application rule collections used by Azure Firewall.
  signature: 'applicationRuleCollections: list[''AzureFirewallApplicationRuleCollection'']'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.autoscaleConfiguration
  name: autoscaleConfiguration
  summary: Properties to provide a custom autoscale configuration to this azure firewall.
  signature: 'autoscaleConfiguration: AzureFirewallAutoscaleConfiguration'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.firewallPolicy
  name: firewallPolicy
  summary: The firewallPolicy associated with this azure firewall.
  signature: 'firewallPolicy: SubResource'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.hubIPAddresses
  name: hubIPAddresses
  summary: IP addresses associated with AzureFirewall.
  signature: 'hubIPAddresses: HubIPAddresses'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.ipConfigurations
  name: ipConfigurations
  summary: IP configuration of the Azure Firewall resource.
  signature: 'ipConfigurations: list[''AzureFirewallIPConfiguration'']'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.ipGroups
  name: ipGroups
  summary: IpGroups associated with AzureFirewall.
  signature: 'ipGroups: list[''AzureFirewallIpGroups'']'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.managementIpConfiguration
  name: managementIpConfiguration
  summary: IP configuration of the Azure Firewall used for management traffic.
  signature: 'managementIpConfiguration: AzureFirewallIPConfiguration'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.natRuleCollections
  name: natRuleCollections
  summary: Collection of NAT rule collections used by Azure Firewall.
  signature: 'natRuleCollections: list[''AzureFirewallNatRuleCollection'']'
- uid: azure.mgmt.network.types.AzureFirewallPropertiesFormat.networkRuleCollections
  name: networkRuleCollections
  summary: Collection of network rule collections used by Azure Firewall.
  signature: 'networkRuleCollections: list[''AzureFirewallNetworkRuleCollection'']'
