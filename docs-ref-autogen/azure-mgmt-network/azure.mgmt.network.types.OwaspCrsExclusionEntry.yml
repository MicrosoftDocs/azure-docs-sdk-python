### YamlMime:PythonClass
uid: azure.mgmt.network.types.OwaspCrsExclusionEntry
name: OwaspCrsExclusionEntry
fullName: azure.mgmt.network.types.OwaspCrsExclusionEntry
module: azure.mgmt.network.types
summary: Allow to exclude some variable satisfy the condition for the WAF check.
constructor:
  syntax: OwaspCrsExclusionEntry()
variables:
- description: 'The variable to be excluded. Required. Known values are:

    "RequestHeaderNames", "RequestCookieNames", "RequestArgNames", "RequestHeaderKeys",

    "RequestHeaderValues", "RequestCookieKeys", "RequestCookieValues", "RequestArgKeys",
    and

    "RequestArgValues".'
  name: matchVariable
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OwaspCrsExclusionEntryMatchVariable">]
- description: 'When matchVariable is a collection, operate on the selector to

    specify which elements in the collection this exclusion applies to. Required.
    Known values are:

    "Equals", "Contains", "StartsWith", "EndsWith", and "EqualsAny".'
  name: selectorMatchOperator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OwaspCrsExclusionEntrySelectorMatchOperator">]
- description: 'When matchVariable is a collection, operator used to specify which
    elements in

    the collection this exclusion applies to. Required.'
  name: selector
  types:
  - <xref:str>
- description: The managed rule sets that are associated with the exclusion.
  name: exclusionManagedRuleSets
  types:
  - <xref:list>[<xref:"ExclusionManagedRuleSet">]
attributes:
- uid: azure.mgmt.network.types.OwaspCrsExclusionEntry.exclusionManagedRuleSets
  name: exclusionManagedRuleSets
  summary: The managed rule sets that are associated with the exclusion.
  signature: 'exclusionManagedRuleSets: list[''ExclusionManagedRuleSet'']'
- uid: azure.mgmt.network.types.OwaspCrsExclusionEntry.matchVariable
  name: matchVariable
  summary: '"RequestHeaderNames",

    "RequestCookieNames", "RequestArgNames", "RequestHeaderKeys", "RequestHeaderValues",

    "RequestCookieKeys", "RequestCookieValues", "RequestArgKeys", and "RequestArgValues".'
  signature: 'matchVariable: Required[str | OwaspCrsExclusionEntryMatchVariable]'
- uid: azure.mgmt.network.types.OwaspCrsExclusionEntry.selector
  name: selector
  summary: 'When matchVariable is a collection, operator used to specify which elements
    in the collection

    this exclusion applies to. Required.'
  signature: 'selector: Required[str]'
- uid: azure.mgmt.network.types.OwaspCrsExclusionEntry.selectorMatchOperator
  name: selectorMatchOperator
  summary: 'When matchVariable is a collection, operate on the selector to specify
    which elements in the

    collection this exclusion applies to. Required. Known values are: "Equals", "Contains",

    "StartsWith", "EndsWith", and "EqualsAny".'
  signature: 'selectorMatchOperator: Required[str | OwaspCrsExclusionEntrySelectorMatchOperator]'
