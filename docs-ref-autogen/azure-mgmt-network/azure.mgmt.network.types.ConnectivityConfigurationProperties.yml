### YamlMime:PythonClass
uid: azure.mgmt.network.types.ConnectivityConfigurationProperties
name: ConnectivityConfigurationProperties
fullName: azure.mgmt.network.types.ConnectivityConfigurationProperties
module: azure.mgmt.network.types
summary: Properties of network manager connectivity configuration.
constructor:
  syntax: ConnectivityConfigurationProperties()
variables:
- description: A description of the connectivity configuration.
  name: description
  types:
  - <xref:str>
- description: 'Connectivity topology type. Required. Known values are:

    "HubAndSpoke" and "Mesh".'
  name: connectivityTopology
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ConnectivityTopology">]
- description: List of hubItems.
  name: hubs
  types:
  - <xref:list>[<xref:"Hub">]
- description: 'Flag if global mesh is supported. Known values are: "False" and "True".'
  name: isGlobal
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IsGlobal">]
- description: 'Collection of additional settings to enhance specific topology

    behaviors of the connectivity configuration resource.'
  name: connectivityCapabilities
  types:
  - <xref:<xref:"ConnectivityConfigurationPropertiesConnectivityCapabilities">>
- description: Groups for configuration. Required.
  name: appliesToGroups
  types:
  - <xref:list>[<xref:"ConnectivityGroupItem">]
- description: 'The provisioning state of the connectivity configuration resource.

    Known values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and
    "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: 'Flag if need to remove current existing peerings. Known values

    are: "False" and "True".'
  name: deleteExistingPeering
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"DeleteExistingPeering">]
- description: Unique identifier for this resource.
  name: resourceGuid
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.types.ConnectivityConfigurationProperties.appliesToGroups
  name: appliesToGroups
  summary: Groups for configuration. Required.
  signature: 'appliesToGroups: Required[list[''ConnectivityGroupItem'']]'
- uid: azure.mgmt.network.types.ConnectivityConfigurationProperties.connectivityCapabilities
  name: connectivityCapabilities
  summary: 'Collection of additional settings to enhance specific topology behaviors
    of the connectivity

    configuration resource.'
  signature: 'connectivityCapabilities: ConnectivityConfigurationPropertiesConnectivityCapabilities'
- uid: azure.mgmt.network.types.ConnectivityConfigurationProperties.connectivityTopology
  name: connectivityTopology
  summary: '"HubAndSpoke" and "Mesh".'
  signature: 'connectivityTopology: Required[str | ConnectivityTopology]'
- uid: azure.mgmt.network.types.ConnectivityConfigurationProperties.deleteExistingPeering
  name: deleteExistingPeering
  summary: '"False" and "True".'
  signature: 'deleteExistingPeering: str | DeleteExistingPeering'
- uid: azure.mgmt.network.types.ConnectivityConfigurationProperties.description
  name: description
  summary: A description of the connectivity configuration.
  signature: 'description: str'
- uid: azure.mgmt.network.types.ConnectivityConfigurationProperties.hubs
  name: hubs
  summary: List of hubItems.
  signature: 'hubs: list[''Hub'']'
- uid: azure.mgmt.network.types.ConnectivityConfigurationProperties.isGlobal
  name: isGlobal
  summary: '"False" and "True".'
  signature: 'isGlobal: str | IsGlobal'
- uid: azure.mgmt.network.types.ConnectivityConfigurationProperties.provisioningState
  name: provisioningState
  summary: 'The provisioning state of the connectivity configuration resource. Known
    values are:

    "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.ConnectivityConfigurationProperties.resourceGuid
  name: resourceGuid
  summary: Unique identifier for this resource.
  signature: 'resourceGuid: str'
