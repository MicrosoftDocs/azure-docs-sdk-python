### YamlMime:PythonClass
uid: azure.mgmt.network.types.PolicySettings
name: PolicySettings
fullName: azure.mgmt.network.types.PolicySettings
module: azure.mgmt.network.types
summary: Defines contents of a web application firewall global configuration.
constructor:
  syntax: PolicySettings()
variables:
- description: 'The state of the policy. Known values are: "Disabled" and "Enabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WebApplicationFirewallEnabledState">]
- description: 'The mode of the policy. Known values are: "Prevention" and "Detection".'
  name: mode
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WebApplicationFirewallMode">]
- description: Whether to allow WAF to check request Body.
  name: requestBodyCheck
  types:
  - <xref:bool>
- description: 'Max inspection limit in KB for request body inspection for

    WAF.'
  name: requestBodyInspectLimitInKB
  types:
  - <xref:int>
- description: Whether allow WAF to enforce request body limits.
  name: requestBodyEnforcement
  types:
  - <xref:bool>
- description: Maximum request body size in Kb for WAF.
  name: maxRequestBodySizeInKb
  types:
  - <xref:int>
- description: Whether allow WAF to enforce file upload limits.
  name: fileUploadEnforcement
  types:
  - <xref:bool>
- description: Maximum file upload size in Mb for WAF.
  name: fileUploadLimitInMb
  types:
  - <xref:int>
- description: 'If the action type is block, customer can override the

    response status code.'
  name: customBlockResponseStatusCode
  types:
  - <xref:int>
- description: 'If the action type is block, customer can override the response

    body. The body must be specified in base64 encoding.'
  name: customBlockResponseBody
  types:
  - <xref:str>
- description: To scrub sensitive log fields.
  name: logScrubbing
  types:
  - <xref:<xref:"PolicySettingsLogScrubbing">>
- description: 'Web Application Firewall JavaScript Challenge Cookie

    Expiration time in minutes.'
  name: jsChallengeCookieExpirationInMins
  types:
  - <xref:int>
- description: 'Web Application Firewall CAPTCHA Cookie Expiration time in

    minutes.'
  name: captchaExpirationInMins
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.network.types.PolicySettings.captchaExpirationInMins
  name: captchaExpirationInMins
  summary: Web Application Firewall CAPTCHA Cookie Expiration time in minutes.
  signature: 'captchaExpirationInMins: int'
- uid: azure.mgmt.network.types.PolicySettings.customBlockResponseBody
  name: customBlockResponseBody
  summary: 'If the action type is block, customer can override the response body.
    The body must be

    specified in base64 encoding.'
  signature: 'customBlockResponseBody: str'
- uid: azure.mgmt.network.types.PolicySettings.customBlockResponseStatusCode
  name: customBlockResponseStatusCode
  summary: If the action type is block, customer can override the response status
    code.
  signature: 'customBlockResponseStatusCode: int'
- uid: azure.mgmt.network.types.PolicySettings.fileUploadEnforcement
  name: fileUploadEnforcement
  summary: Whether allow WAF to enforce file upload limits.
  signature: 'fileUploadEnforcement: bool'
- uid: azure.mgmt.network.types.PolicySettings.fileUploadLimitInMb
  name: fileUploadLimitInMb
  summary: Maximum file upload size in Mb for WAF.
  signature: 'fileUploadLimitInMb: int'
- uid: azure.mgmt.network.types.PolicySettings.jsChallengeCookieExpirationInMins
  name: jsChallengeCookieExpirationInMins
  summary: Web Application Firewall JavaScript Challenge Cookie Expiration time in
    minutes.
  signature: 'jsChallengeCookieExpirationInMins: int'
- uid: azure.mgmt.network.types.PolicySettings.logScrubbing
  name: logScrubbing
  summary: To scrub sensitive log fields.
  signature: 'logScrubbing: PolicySettingsLogScrubbing'
- uid: azure.mgmt.network.types.PolicySettings.maxRequestBodySizeInKb
  name: maxRequestBodySizeInKb
  summary: Maximum request body size in Kb for WAF.
  signature: 'maxRequestBodySizeInKb: int'
- uid: azure.mgmt.network.types.PolicySettings.mode
  name: mode
  summary: '"Prevention" and "Detection".'
  signature: 'mode: str | WebApplicationFirewallMode'
- uid: azure.mgmt.network.types.PolicySettings.requestBodyCheck
  name: requestBodyCheck
  summary: Whether to allow WAF to check request Body.
  signature: 'requestBodyCheck: bool'
- uid: azure.mgmt.network.types.PolicySettings.requestBodyEnforcement
  name: requestBodyEnforcement
  summary: Whether allow WAF to enforce request body limits.
  signature: 'requestBodyEnforcement: bool'
- uid: azure.mgmt.network.types.PolicySettings.requestBodyInspectLimitInKB
  name: requestBodyInspectLimitInKB
  summary: Max inspection limit in KB for request body inspection for WAF.
  signature: 'requestBodyInspectLimitInKB: int'
- uid: azure.mgmt.network.types.PolicySettings.state
  name: state
  summary: '"Disabled" and "Enabled".'
  signature: 'state: str | WebApplicationFirewallEnabledState'
