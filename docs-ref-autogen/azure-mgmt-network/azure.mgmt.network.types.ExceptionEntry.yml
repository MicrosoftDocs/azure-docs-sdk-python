### YamlMime:PythonClass
uid: azure.mgmt.network.types.ExceptionEntry
name: ExceptionEntry
fullName: azure.mgmt.network.types.ExceptionEntry
module: azure.mgmt.network.types
summary: Adds exception to allow a request when the condition is satisfied.
constructor:
  syntax: ExceptionEntry()
variables:
- description: 'The variable on which we evaluate the exception condition. Required.
    Known

    values are: "RequestURI", "RemoteAddr", and "RequestHeader".'
  name: matchVariable
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExceptionEntryMatchVariable">]
- description: Allowed values for the matchVariable.
  name: values
  types:
  - <xref:list>[<xref:str>]
- description: 'Operates on the allowed values for the matchVariable. Required. Known

    values are: "Equals", "Contains", "StartsWith", "EndsWith", and "IPMatch".'
  name: valueMatchOperator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExceptionEntryValueMatchOperator">]
- description: 'When the matchVariable points to a key-value pair (e.g,

    RequestHeader), this operates on the selector. Known values are: "Equals", "Contains",

    "StartsWith", and "EndsWith".'
  name: selectorMatchOperator
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ExceptionEntrySelectorMatchOperator">]
- description: 'When the matchVariable points to a key-value pair (e.g, RequestHeader),
    this

    identifies the key.'
  name: selector
  types:
  - <xref:str>
- description: The managed rule sets that are associated with the exception.
  name: exceptionManagedRuleSets
  types:
  - <xref:list>[<xref:"ExclusionManagedRuleSet">]
attributes:
- uid: azure.mgmt.network.types.ExceptionEntry.exceptionManagedRuleSets
  name: exceptionManagedRuleSets
  summary: The managed rule sets that are associated with the exception.
  signature: 'exceptionManagedRuleSets: list[''ExclusionManagedRuleSet'']'
- uid: azure.mgmt.network.types.ExceptionEntry.matchVariable
  name: matchVariable
  summary: 'The variable on which we evaluate the exception condition. Required. Known
    values are:

    "RequestURI", "RemoteAddr", and "RequestHeader".'
  signature: 'matchVariable: Required[str | ExceptionEntryMatchVariable]'
- uid: azure.mgmt.network.types.ExceptionEntry.selector
  name: selector
  summary: 'When the matchVariable points to a key-value pair (e.g, RequestHeader),
    this identifies the

    key.'
  signature: 'selector: str'
- uid: azure.mgmt.network.types.ExceptionEntry.selectorMatchOperator
  name: selectorMatchOperator
  summary: 'When the matchVariable points to a key-value pair (e.g, RequestHeader),
    this operates on the

    selector. Known values are: "Equals", "Contains", "StartsWith", and "EndsWith".'
  signature: 'selectorMatchOperator: str | ExceptionEntrySelectorMatchOperator'
- uid: azure.mgmt.network.types.ExceptionEntry.valueMatchOperator
  name: valueMatchOperator
  summary: '"Equals",

    "Contains", "StartsWith", "EndsWith", and "IPMatch".'
  signature: 'valueMatchOperator: Required[str | ExceptionEntryValueMatchOperator]'
