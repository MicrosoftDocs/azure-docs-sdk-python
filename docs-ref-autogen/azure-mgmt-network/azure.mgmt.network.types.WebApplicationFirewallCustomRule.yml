  name: etag
  summary: A unique read-only string that changes whenever the resource is updated.
  signature: 'etag: str'
- uid: azure.mgmt.network.types.WebApplicationFirewallCustomRule.groupByUserSession
  name: groupByUserSession
  summary: List of user session identifier group by clauses.
  signature: 'groupByUserSession: list[''GroupByUserSession'']'
- uid: azure.mgmt.network.types.WebApplicationFirewallCustomRule.matchConditions
  name: matchConditions
  summary: List of match conditions. Required.
  signature: 'matchConditions: Required[list[''MatchCondition'']]'
