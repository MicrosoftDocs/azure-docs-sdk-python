### YamlMime:PythonClass
uid: azure.mgmt.network.types.WebApplicationFirewallCustomRule
name: WebApplicationFirewallCustomRule
fullName: azure.mgmt.network.types.WebApplicationFirewallCustomRule
module: azure.mgmt.network.types
summary: Defines contents of a web application rule.
constructor:
  syntax: WebApplicationFirewallCustomRule()
variables:
- description: 'The name of the resource that is unique within a policy. This name
    can be used to

    access the resource.'
  name: name
  types:
  - <xref:str>
- description: A unique read-only string that changes whenever the resource is updated.
  name: etag
  types:
  - <xref:str>
- description: 'Priority of the rule. Rules with a lower value will be evaluated before
    rules

    with a higher value. Required.'
  name: priority
  types:
  - <xref:int>
- description: 'Describes if the custom rule is in enabled or disabled state. Defaults
    to Enabled

    if not specified. Known values are: "Disabled" and "Enabled".'
  name: state
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WebApplicationFirewallState">]
- description: 'Duration over which Rate Limit policy will be applied. Applies only

    when ruleType is RateLimitRule. Known values are: "OneMin" and "FiveMins".'
  name: rateLimitDuration
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewayFirewallRateLimitDuration">]
- description: 'Rate Limit threshold to apply in case ruleType is RateLimitRule. Must

    be greater than or equal to 1.'
  name: rateLimitThreshold
  types:
  - <xref:int>
- description: 'The rule type. Required. Known values are: "MatchRule", "RateLimitRule",
    and

    "Invalid".'
  name: ruleType
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WebApplicationFirewallRuleType">]
- description: List of match conditions. Required.
  name: matchConditions
  types:
  - <xref:list>[<xref:"MatchCondition">]
- description: List of user session identifier group by clauses.
  name: groupByUserSession
  types:
  - <xref:list>[<xref:"GroupByUserSession">]
- description: 'Type of Actions. Required. Known values are: "Allow", "Block", "Log",

    "JSChallenge", and "CAPTCHA".'
  name: action
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WebApplicationFirewallAction">]
attributes:
- uid: azure.mgmt.network.types.WebApplicationFirewallCustomRule.action
  name: action
  summary: '"Allow", "Block", "Log", "JSChallenge",

    and "CAPTCHA".'
  signature: 'action: Required[str | WebApplicationFirewallAction]'
