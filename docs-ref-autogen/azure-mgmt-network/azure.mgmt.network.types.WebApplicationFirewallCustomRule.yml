  name: name
  summary: 'The name of the resource that is unique within a policy. This name can
    be used to access the

    resource.'
  signature: 'name: str'
- uid: azure.mgmt.network.types.WebApplicationFirewallCustomRule.priority
  name: priority
  summary: 'Priority of the rule. Rules with a lower value will be evaluated before
    rules with a higher

    value. Required.'
  signature: 'priority: Required[int]'
- uid: azure.mgmt.network.types.WebApplicationFirewallCustomRule.rateLimitDuration
  name: rateLimitDuration
  summary: 'Duration over which Rate Limit policy will be applied. Applies only when
    ruleType is

    RateLimitRule. Known values are: "OneMin" and "FiveMins".'
  signature: 'rateLimitDuration: str | ApplicationGatewayFirewallRateLimitDuration'
- uid: azure.mgmt.network.types.WebApplicationFirewallCustomRule.rateLimitThreshold
  name: rateLimitThreshold
  summary: 'Rate Limit threshold to apply in case ruleType is RateLimitRule. Must
    be greater than or equal

    to 1.'
  signature: 'rateLimitThreshold: int'
- uid: azure.mgmt.network.types.WebApplicationFirewallCustomRule.ruleType
  name: ruleType
  summary: '"MatchRule", "RateLimitRule", and "Invalid".'
  signature: 'ruleType: Required[str | WebApplicationFirewallRuleType]'
- uid: azure.mgmt.network.types.WebApplicationFirewallCustomRule.state
  name: state
  summary: 'Describes if the custom rule is in enabled or disabled state. Defaults
    to Enabled if not

    specified. Known values are: "Disabled" and "Enabled".'
  signature: 'state: str | WebApplicationFirewallState'
