### YamlMime:PythonClass
uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat
name: NetworkVirtualAppliancePropertiesFormat
fullName: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat
module: azure.mgmt.network.types
summary: Network Virtual Appliance definition.
constructor:
  syntax: NetworkVirtualAppliancePropertiesFormat()
variables:
- description: Network Virtual Appliance SKU.
  name: nvaSku
  types:
  - <xref:<xref:"VirtualApplianceSkuProperties">>
- description: Address Prefix.
  name: addressPrefix
  types:
  - <xref:str>
- description: Address Prefix for Dual-Stack NVAs.
  name: addressPrefixV6
  types:
  - <xref:str>
- description: BootStrapConfigurationBlobs storage URLs.
  name: bootStrapConfigurationBlobs
  types:
  - <xref:list>[<xref:str>]
- description: The Virtual Hub where Network Virtual Appliance is being deployed.
  name: virtualHub
  types:
  - <xref:<xref:"SubResource">>
- description: CloudInitConfigurationBlob storage URLs.
  name: cloudInitConfigurationBlobs
  types:
  - <xref:list>[<xref:str>]
- description: CloudInitConfiguration string in plain text.
  name: cloudInitConfiguration
  types:
  - <xref:str>
- description: 'VirtualAppliance ASN. Microsoft private, public and IANA reserved

    ASN are not supported.'
  name: virtualApplianceAsn
  types:
  - <xref:int>
- description: Public key for SSH login.
  name: sshPublicKey
  types:
  - <xref:str>
- description: List of Virtual Appliance Network Interfaces.
  name: virtualApplianceNics
  types:
  - <xref:list>[<xref:"VirtualApplianceNicProperties">]
- description: Network Profile containing configurations for Public and Private NIC.
  name: networkProfile
  types:
  - <xref:<xref:"NetworkVirtualAppliancePropertiesFormatNetworkProfile">>
- description: 'Details required for Additional Network Interface. This property is
    not

    compatible with the NVA deployed in VNets.'
  name: additionalNics
  types:
  - <xref:list>[<xref:"VirtualApplianceAdditionalNicProperties">]
- description: 'List of Resource Uri of Public IPs for Internet Ingress

    Scenario.'
  name: internetIngressPublicIps
  types:
  - <xref:list>[<xref:"InternetIngressPublicIpsProperties">]
- description: List of references to VirtualApplianceSite.
  name: virtualApplianceSites
  types:
  - <xref:list>[<xref:"SubResource">]
- description: List of references to VirtualApplianceConnections.
  name: virtualApplianceConnections
  types:
  - <xref:list>[<xref:"SubResource">]
- description: List of references to InboundSecurityRules.
  name: inboundSecurityRules
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'The provisioning state of the resource. Known values are: "Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
- description: The deployment type. PartnerManaged for the SaaS NVA.
  name: deploymentType
  types:
  - <xref:str>
- description: The delegation for the Virtual Appliance. Only appliable for SaaS NVA.
  name: delegation
  types:
  - <xref:<xref:"DelegationProperties">>
- description: The delegation for the Virtual Appliance.
  name: partnerManagedResource
  types:
  - <xref:<xref:"PartnerManagedResourceProperties">>
- description: The NVA in VNet interface configurations.
  name: nvaInterfaceConfigurations
  types:
  - <xref:list>[<xref:"NvaInterfaceConfigurationsProperties">]
- description: 'The address families to deploy the NVA in. ["IPv4", "IPv6"] deploys
    a

    dual-stack NVA (the vHub/VNet must also be dual-stack). ["IPv4"], an empty array,
    or omitting

    the field deploys an IPv4-only NVA. The value "IPv6" may only appear in combination
    with

    "IPv4"; standalone ["IPv6"] is reserved for future use and is rejected by the
    service today.'
  name: addressFamily
  types:
  - <xref:list>[<xref:typing.Union>[<xref:str>, <xref:"IPVersion">]]
- description: 'A Internal Load Balancer''s HA port frontend IP address. Can be used
    to

    set routes & UDR to load balance traffic between NVA instances.'
  name: privateIpAddress
  types:
  - <xref:str>
- description: 'An Internal Load Balancer''s HA port frontend IPv6 address. Can be

    used to set routes & UDR to load balance traffic between NVA instances. This field
    appears in

    dual-stack NVAs.'
  name: privateIpAddressV6
  types:
  - <xref:str>
- description: The migration status of the Network Virtual Appliance.
  name: migrationStatus
  types:
  - <xref:<xref:"NetworkVirtualApplianceMigrationStatus">>
attributes:
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.additionalNics
  name: additionalNics
  summary: 'Details required for Additional Network Interface. This property is not
    compatible with the NVA

    deployed in VNets.'
  signature: 'additionalNics: list[''VirtualApplianceAdditionalNicProperties'']'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.addressFamily
  name: addressFamily
  summary: 'The address families to deploy the NVA in. ["IPv4", "IPv6"] deploys a
    dual-stack NVA (the

    vHub/VNet must also be dual-stack). ["IPv4"], an empty array, or omitting the
    field deploys

    an IPv4-only NVA. The value "IPv6" may only appear in combination with "IPv4";
    standalone

    ["IPv6"] is reserved for future use and is rejected by the service today.'
  signature: 'addressFamily: list[typing.Union[str, ForwardRef(''IPVersion'')]]'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.addressPrefix
  name: addressPrefix
  summary: Address Prefix.
  signature: 'addressPrefix: str'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.addressPrefixV6
  name: addressPrefixV6
  summary: Address Prefix for Dual-Stack NVAs.
  signature: 'addressPrefixV6: str'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.bootStrapConfigurationBlobs
  name: bootStrapConfigurationBlobs
  summary: BootStrapConfigurationBlobs storage URLs.
  signature: 'bootStrapConfigurationBlobs: list[str]'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.cloudInitConfiguration
  name: cloudInitConfiguration
  summary: CloudInitConfiguration string in plain text.
  signature: 'cloudInitConfiguration: str'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.cloudInitConfigurationBlobs
  name: cloudInitConfigurationBlobs
  summary: CloudInitConfigurationBlob storage URLs.
  signature: 'cloudInitConfigurationBlobs: list[str]'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.delegation
  name: delegation
  summary: The delegation for the Virtual Appliance. Only appliable for SaaS NVA.
  signature: 'delegation: DelegationProperties'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.deploymentType
  name: deploymentType
  summary: The deployment type. PartnerManaged for the SaaS NVA.
  signature: 'deploymentType: str'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.inboundSecurityRules
  name: inboundSecurityRules
  summary: List of references to InboundSecurityRules.
  signature: 'inboundSecurityRules: list[''SubResource'']'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.internetIngressPublicIps
  name: internetIngressPublicIps
  summary: List of Resource Uri of Public IPs for Internet Ingress Scenario.
  signature: 'internetIngressPublicIps: list[''InternetIngressPublicIpsProperties'']'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.migrationStatus
  name: migrationStatus
  summary: The migration status of the Network Virtual Appliance.
  signature: 'migrationStatus: NetworkVirtualApplianceMigrationStatus'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.networkProfile
  name: networkProfile
  summary: Network Profile containing configurations for Public and Private NIC.
  signature: 'networkProfile: NetworkVirtualAppliancePropertiesFormatNetworkProfile'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.nvaInterfaceConfigurations
  name: nvaInterfaceConfigurations
  summary: The NVA in VNet interface configurations.
  signature: 'nvaInterfaceConfigurations: list[''NvaInterfaceConfigurationsProperties'']'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.nvaSku
  name: nvaSku
  summary: Network Virtual Appliance SKU.
  signature: 'nvaSku: VirtualApplianceSkuProperties'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.partnerManagedResource
  name: partnerManagedResource
  summary: The delegation for the Virtual Appliance.
  signature: 'partnerManagedResource: PartnerManagedResourceProperties'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.privateIpAddress
  name: privateIpAddress
  summary: 'A Internal Load Balancer''s HA port frontend IP address. Can be used to
    set routes & UDR to load

    balance traffic between NVA instances.'
  signature: 'privateIpAddress: str'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.privateIpAddressV6
  name: privateIpAddressV6
  summary: 'An Internal Load Balancer''s HA port frontend IPv6 address. Can be used
    to set routes & UDR to

    load balance traffic between NVA instances. This field appears in dual-stack NVAs.'
  signature: 'privateIpAddressV6: str'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed", "Succeeded",

    "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.sshPublicKey
  name: sshPublicKey
  summary: Public key for SSH login.
  signature: 'sshPublicKey: str'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.virtualApplianceAsn
  name: virtualApplianceAsn
  summary: VirtualAppliance ASN. Microsoft private, public and IANA reserved ASN are
    not supported.
  signature: 'virtualApplianceAsn: int'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.virtualApplianceConnections
  name: virtualApplianceConnections
  summary: List of references to VirtualApplianceConnections.
  signature: 'virtualApplianceConnections: list[''SubResource'']'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.virtualApplianceNics
  name: virtualApplianceNics
  summary: List of Virtual Appliance Network Interfaces.
  signature: 'virtualApplianceNics: list[''VirtualApplianceNicProperties'']'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.virtualApplianceSites
  name: virtualApplianceSites
  summary: List of references to VirtualApplianceSite.
  signature: 'virtualApplianceSites: list[''SubResource'']'
- uid: azure.mgmt.network.types.NetworkVirtualAppliancePropertiesFormat.virtualHub
  name: virtualHub
  summary: The Virtual Hub where Network Virtual Appliance is being deployed.
  signature: 'virtualHub: SubResource'
