### YamlMime:PythonClass
uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat
name: ApplicationGatewayBackendHttpSettingsPropertiesFormat
fullName: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat
module: azure.mgmt.network.types
summary: Properties of Backend address pool settings of an application gateway.
constructor:
  syntax: ApplicationGatewayBackendHttpSettingsPropertiesFormat()
variables:
- description: The destination port on the backend.
  name: port
  types:
  - <xref:int>
- description: 'The protocol used to communicate with the backend. Known values are:
    "Http",

    "Https", "Tcp", and "Tls".'
  name: protocol
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewayProtocol">]
- description: 'Cookie based affinity. Known values are: "Enabled" and "Disabled".'
  name: cookieBasedAffinity
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ApplicationGatewayCookieBasedAffinity">]
- description: 'Request timeout in seconds. Application Gateway will fail the request
    if

    response is not received within RequestTimeout. Acceptable values are from 1 second
    to 86400

    seconds.'
  name: requestTimeout
  types:
  - <xref:int>
- description: Probe resource of an application gateway.
  name: probe
  types:
  - <xref:<xref:"SubResource">>
- description: 'Array of references to application gateway authentication

    certificates.'
  name: authenticationCertificates
  types:
  - <xref:list>[<xref:"SubResource">]
- description: 'Array of references to application gateway trusted root

    certificates.'
  name: trustedRootCertificates
  types:
  - <xref:list>[<xref:"SubResource">]
- description: Connection draining of the backend http settings resource.
  name: connectionDraining
  types:
  - <xref:<xref:"ApplicationGatewayConnectionDraining">>
- description: Host header to be sent to the backend servers.
  name: hostName
  types:
  - <xref:str>
- description: 'Whether to pick host header should be picked from the

    host name of the backend server. Default value is false.'
  name: pickHostNameFromBackendAddress
  types:
  - <xref:bool>
- description: Cookie name to use for the affinity cookie.
  name: affinityCookieName
  types:
  - <xref:str>
- description: Whether the probe is enabled. Default value is false.
  name: probeEnabled
  types:
  - <xref:bool>
- description: 'Path which should be used as a prefix for all HTTP requests. Null
    means no path

    will be prefixed. Default value is null.'
  name: path
  types:
  - <xref:str>
- description: 'Enable or disable dedicated connection per backend server.

    Default is set to false.'
  name: dedicatedBackendConnection
  types:
  - <xref:bool>
- description: 'Verify or skip both chain and expiry validations of the

    certificate on the backend server. Default is set to true.'
  name: validateCertChainAndExpiry
  types:
  - <xref:bool>
- description: 'When enabled, verifies if the Common Name of the certificate provided
    by the

    backend server matches the Server Name Indication (SNI) value. Default value is
    true.'
  name: validateSNI
  types:
  - <xref:bool>
- description: 'Specify an SNI value to match the common name of the certificate on
    the backend.

    By default, the application gateway uses the incoming request''s host header as
    the SNI. Default

    value is null.'
  name: sniName
  types:
  - <xref:str>
- description: 'The provisioning state of the backend HTTP settings resource. Known

    values are: "Failed", "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  name: provisioningState
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"ProvisioningState">]
attributes:
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.affinityCookieName
  name: affinityCookieName
  summary: Cookie name to use for the affinity cookie.
  signature: 'affinityCookieName: str'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.authenticationCertificates
  name: authenticationCertificates
  summary: Array of references to application gateway authentication certificates.
  signature: 'authenticationCertificates: list[''SubResource'']'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.connectionDraining
  name: connectionDraining
  summary: Connection draining of the backend http settings resource.
  signature: 'connectionDraining: ApplicationGatewayConnectionDraining'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.cookieBasedAffinity
  name: cookieBasedAffinity
  summary: '"Enabled" and "Disabled".'
  signature: 'cookieBasedAffinity: str | ApplicationGatewayCookieBasedAffinity'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.dedicatedBackendConnection
  name: dedicatedBackendConnection
  summary: Enable or disable dedicated connection per backend server. Default is set
    to false.
  signature: 'dedicatedBackendConnection: bool'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.hostName
  name: hostName
  summary: Host header to be sent to the backend servers.
  signature: 'hostName: str'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.path
  name: path
  summary: 'Path which should be used as a prefix for all HTTP requests. Null means
    no path will be

    prefixed. Default value is null.'
  signature: 'path: str'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.pickHostNameFromBackendAddress
  name: pickHostNameFromBackendAddress
  summary: 'Whether to pick host header should be picked from the host name of the
    backend server. Default

    value is false.'
  signature: 'pickHostNameFromBackendAddress: bool'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.port
  name: port
  summary: The destination port on the backend.
  signature: 'port: int'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.probe
  name: probe
  summary: Probe resource of an application gateway.
  signature: 'probe: SubResource'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.probeEnabled
  name: probeEnabled
  summary: Whether the probe is enabled. Default value is false.
  signature: 'probeEnabled: bool'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.protocol
  name: protocol
  summary: '"Http", "Https",

    "Tcp", and "Tls".'
  signature: 'protocol: str | ApplicationGatewayProtocol'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.provisioningState
  name: provisioningState
  summary: '"Failed",

    "Succeeded", "Canceled", "Creating", "Updating", and "Deleting".'
  signature: 'provisioningState: str | ProvisioningState'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.requestTimeout
  name: requestTimeout
  summary: 'Request timeout in seconds. Application Gateway will fail the request
    if response is not

    received within RequestTimeout. Acceptable values are from 1 second to 86400 seconds.'
  signature: 'requestTimeout: int'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.sniName
  name: sniName
  summary: 'Specify an SNI value to match the common name of the certificate on the
    backend. By default,

    the application gateway uses the incoming request''s host header as the SNI. Default
    value is

    null.'
  signature: 'sniName: str'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.trustedRootCertificates
  name: trustedRootCertificates
  summary: Array of references to application gateway trusted root certificates.
  signature: 'trustedRootCertificates: list[''SubResource'']'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.validateCertChainAndExpiry
  name: validateCertChainAndExpiry
  summary: 'Verify or skip both chain and expiry validations of the certificate on
    the backend server.

    Default is set to true.'
  signature: 'validateCertChainAndExpiry: bool'
- uid: azure.mgmt.network.types.ApplicationGatewayBackendHttpSettingsPropertiesFormat.validateSNI
  name: validateSNI
  summary: 'When enabled, verifies if the Common Name of the certificate provided
    by the backend server

    matches the Server Name Indication (SNI) value. Default value is true.'
  signature: 'validateSNI: bool'
