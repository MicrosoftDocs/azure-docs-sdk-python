    for the requested

    instance will be written.'
  signature: 'consoleScreenshotStorageSasUrl: str'
- uid: azure.mgmt.network.types.NetworkVirtualApplianceBootDiagnosticParameters.instanceId
  name: instanceId
  summary: The network virtual appliance instance id for which boot diagnostic logs
    is being requested.
  signature: 'instanceId: int'
- uid: azure.mgmt.network.types.NetworkVirtualApplianceBootDiagnosticParameters.serialConsoleStorageSasUrl
  name: serialConsoleStorageSasUrl
