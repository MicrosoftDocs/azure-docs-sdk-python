name: NetworkVirtualApplianceBootDiagnosticParameters
fullName: azure.mgmt.network.types.NetworkVirtualApplianceBootDiagnosticParameters
module: azure.mgmt.network.types
summary: Specifies input parameters required to retrieve the boot diagnostic logs
  for an NVA instance.
constructor:
  syntax: NetworkVirtualApplianceBootDiagnosticParameters()
variables:
- description: 'The network virtual appliance instance id for which boot diagnostic
    logs is

    being requested.'
  name: instanceId
  types:
  - <xref:int>
- description: 'Specifies the sas-url to the storage blob into which serial

    console logs for the requested instance will be written.'
  name: serialConsoleStorageSasUrl
  types:
  - <xref:str>
- description: 'Specifies the sas-url to the storage blob into which

    console screen shot for the requested instance will be written.'
