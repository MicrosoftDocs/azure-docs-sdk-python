### YamlMime:PythonClass
uid: azure.mgmt.network.models.AuthenticationProviderProperties
name: AuthenticationProviderProperties
fullName: azure.mgmt.network.models.AuthenticationProviderProperties
module: azure.mgmt.network.models
summary: 'Properties for authentication provider configuration. A policy must configure
  either JWT

  validation fields or user sign-in fields; the two configurations are mutually exclusive
  and

  cannot be combined.'
constructor:
  syntax: 'AuthenticationProviderProperties(*args: Any, **kwargs: Any)'
variables:
- description: 'The absolute HTTPS URL of the Secure Token Service. Include a trailing
    slash at

    the end of the value. Example: [https://login.microsoftonline.com/{Microsoft](https://login.microsoftonline.com/{Microsoft)
    Entra Tenant ID}/. Required.'
  name: issuer
  types:
  - <xref:str>
- description: 'The JSON Web Key Set (JWKS) URI used to retrieve the public keys for
    JWT

    validation. Example: [https://login.microsoftonline.com/{Microsoft](https://login.microsoftonline.com/{Microsoft)
    Entra Tenant ID}/discovery/v2.0/keys.'
  name: jwks_uri
  types:
  - <xref:str>
- description: 'The intended audience for the JWT. Only a single audience value is
    supported in

    this API version. Example: [https://audience.com/{application-id}](https://audience.com/{application-id}).'
  name: audience
  types:
  - <xref:str>
- description: 'The Application (client) ID for the related application registered
    in

    Microsoft Entra ID, formatted as a GUID. Required.'
  name: client_id
  types:
  - <xref:str>
- description: 'The absolute HTTPS Key Vault secret URL identifying the client secret
    used

    for authentication. This property is required for user sign-in policies. It holds
    only the Key

    Vault reference; the secret value itself is never accepted or returned by this
    API and is read

    from Key Vault at runtime using the resource''s user-assigned identity. The secret
    value stored

    in Key Vault can contain up to 4096 characters. Example:

    [https://myvault.vault.azure.net/secrets/mysecret](https://myvault.vault.azure.net/secrets/mysecret).'
  name: client_secret
  types:
  - <xref:str>
- description: 'The scopes used by an application during authentication to authorize
    access to a

    user''s details. A maximum of 10 scopes is supported, each scope can contain up
    to 128

    characters, and all scopes can contain up to 256 characters combined.'
  name: scope
  types:
  - <xref:list>[<xref:str>]
- description: 'The timeout of the session cookie used for user authentication. The

    service accepts and returns this value as a string containing a base-10 unsigned
    integer number

    of seconds with no sign, decimal point, unit suffix, or whitespace (for example
    `86400`). The

    supported range is 1 to 604800 seconds, and the default is 86400 seconds. Applicable
    to the

    Application Gateway post-OIDC workflow.'
  name: session_timeout
  types:
  - <xref:str>
- description: 'The name of the session cookie used for user authentication.

    Applicable to the Application Gateway post-OIDC workflow.'
  name: session_cookie_name
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.network.models.AuthenticationProviderProperties.audience
  name: audience
  summary: 'The intended audience for the JWT. Only a single audience value is supported
    in this API

    version. Example: [https://audience.com/{application-id}](https://audience.com/{application-id}).'
  signature: 'audience: str | None'
- uid: azure.mgmt.network.models.AuthenticationProviderProperties.client_id
  name: client_id
  summary: 'The Application (client) ID for the related application registered in
    Microsoft Entra ID,

    formatted as a GUID. Required.'
  signature: 'client_id: str'
- uid: azure.mgmt.network.models.AuthenticationProviderProperties.client_secret
  name: client_secret
  summary: 'The absolute HTTPS Key Vault secret URL identifying the client secret
    used for authentication.

    This property is required for user sign-in policies. It holds only the Key Vault
    reference; the

    secret value itself is never accepted or returned by this API and is read from
    Key Vault at

    runtime using the resource''s user-assigned identity. The secret value stored
    in Key Vault can

    contain up to 4096 characters. Example: [https://myvault.vault.azure.net/secrets/mysecret](https://myvault.vault.azure.net/secrets/mysecret).'
  signature: 'client_secret: str | None'
- uid: azure.mgmt.network.models.AuthenticationProviderProperties.issuer
  name: issuer
  summary: 'The absolute HTTPS URL of the Secure Token Service. Include a trailing
    slash at the end of the

    value. Example: [https://login.microsoftonline.com/{Microsoft](https://login.microsoftonline.com/{Microsoft)
    Entra Tenant ID}/. Required.'
  signature: 'issuer: str'
- uid: azure.mgmt.network.models.AuthenticationProviderProperties.jwks_uri
  name: jwks_uri
  summary: 'The JSON Web Key Set (JWKS) URI used to retrieve the public keys for JWT
    validation. Example:

    [https://login.microsoftonline.com/{Microsoft](https://login.microsoftonline.com/{Microsoft)

    Entra Tenant ID}/discovery/v2.0/keys.'
  signature: 'jwks_uri: str | None'
- uid: azure.mgmt.network.models.AuthenticationProviderProperties.scope
  name: scope
  summary: 'The scopes used by an application during authentication to authorize access
    to a user''s

    details. A maximum of 10 scopes is supported, each scope can contain up to 128
    characters, and

    all scopes can contain up to 256 characters combined.'
  signature: 'scope: list[str] | None'
- uid: azure.mgmt.network.models.AuthenticationProviderProperties.session_cookie_name
  name: session_cookie_name
  summary: 'The name of the session cookie used for user authentication. Applicable
    to the Application

    Gateway post-OIDC workflow.'
  signature: 'session_cookie_name: str | None'
- uid: azure.mgmt.network.models.AuthenticationProviderProperties.session_timeout
  name: session_timeout
  summary: 'The timeout of the session cookie used for user authentication. The service
    accepts and returns

    this value as a string containing a base-10 unsigned integer number of seconds
    with no sign,

    decimal point, unit suffix, or whitespace (for example `86400`). The supported
    range is 1 to

    604800 seconds, and the default is 86400 seconds. Applicable to the Application
    Gateway

    post-OIDC workflow.'
  signature: 'session_timeout: str | None'
