### YamlMime:PythonClass
uid: azure.mgmt.prometheusrulegroups.types.PrometheusRule
name: PrometheusRule
fullName: azure.mgmt.prometheusrulegroups.types.PrometheusRule
module: azure.mgmt.prometheusrulegroups.types
summary: An Azure Prometheus alerting or recording rule.
constructor:
  syntax: PrometheusRule()
variables:
- description: Recorded metrics name.
  name: record
  types:
  - <xref:str>
- description: Alert rule name.
  name: alert
  types:
  - <xref:str>
- description: Enable/disable rule.
  name: enabled
  types:
  - <xref:bool>
- description: 'The PromQL expression to evaluate.

    [https://prometheus.io/docs/prometheus/latest/querying/basics/](https://prometheus.io/docs/prometheus/latest/querying/basics/).
    Evaluated periodically as

    given by ''interval'', and the result recorded as a new set of time series with
    the metric name

    as given by ''record''. Required.'
  name: expression
  types:
  - <xref:str>
- description: Labels to add or overwrite before storing the result.
  name: labels
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: The severity of the alerts fired by the rule. Must be between 0 and
    4.
  name: severity
  types:
  - <xref:int>
- description: The amount of time alert must be active before firing.
  name: for_property
  types:
  - <xref:str>
- description: 'The annotations clause specifies a set of informational labels that
    can be

    used to store longer additional information such as alert descriptions or runbook
    links. The

    annotation values can be templated.'
  name: annotations
  types:
  - <xref:dict>[<xref:str>, <xref:str>]
- description: 'Actions that are performed when the alert rule becomes active, and
    when an alert

    condition is resolved.'
  name: actions
  types:
  - <xref:list>[<xref:"PrometheusRuleGroupAction">]
- description: 'Defines the configuration for resolving fired alerts. Only

    relevant for alerts.'
  name: resolve_configuration
  types:
  - <xref:<xref:"PrometheusRuleResolveConfiguration">>
attributes:
- uid: azure.mgmt.prometheusrulegroups.types.PrometheusRule.actions
  name: actions
  signature: 'actions: list[azure.mgmt.prometheusrulegroups.types.PrometheusRuleGroupAction]'
- uid: azure.mgmt.prometheusrulegroups.types.PrometheusRule.alert
  name: alert
  signature: 'alert: str'
- uid: azure.mgmt.prometheusrulegroups.types.PrometheusRule.annotations
  name: annotations
  signature: 'annotations: dict[str, str]'
- uid: azure.mgmt.prometheusrulegroups.types.PrometheusRule.enabled
  name: enabled
  signature: 'enabled: bool'
- uid: azure.mgmt.prometheusrulegroups.types.PrometheusRule.expression
  name: expression
  signature: 'expression: str'
- uid: azure.mgmt.prometheusrulegroups.types.PrometheusRule.for
  name: for
  signature: 'for: str'
- uid: azure.mgmt.prometheusrulegroups.types.PrometheusRule.labels
  name: labels
  signature: 'labels: dict[str, str]'
- uid: azure.mgmt.prometheusrulegroups.types.PrometheusRule.record
  name: record
  signature: 'record: str'
- uid: azure.mgmt.prometheusrulegroups.types.PrometheusRule.resolveConfiguration
  name: resolveConfiguration
  signature: 'resolveConfiguration: PrometheusRuleResolveConfiguration'
- uid: azure.mgmt.prometheusrulegroups.types.PrometheusRule.severity
  name: severity
  signature: 'severity: int'
