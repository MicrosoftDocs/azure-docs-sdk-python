### YamlMime:PythonClass
uid: azure.mgmt.servicebus.types.Action
name: Action
fullName: azure.mgmt.servicebus.types.Action
module: azure.mgmt.servicebus.types
summary: 'Represents the filter actions which are allowed for the transformation of
  a message that have

  been matched by a filter expression.'
constructor:
  syntax: Action()
variables:
- description: SQL expression. e.g. MyProperty='ABC'.
  name: sql_expression
  types:
  - <xref:str>
- description: 'This property is reserved for future use. An integer value showing

    the compatibility level, currently hard-coded to 20.'
  name: compatibility_level
  types:
  - <xref:int>
- description: 'Value that indicates whether the rule action requires

    preprocessing.'
  name: requires_preprocessing
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.servicebus.types.Action.compatibilityLevel
  name: compatibilityLevel
  summary: 'This property is reserved for future use. An integer value showing the
    compatibility level,

    currently hard-coded to 20.'
  signature: 'compatibilityLevel: int'
- uid: azure.mgmt.servicebus.types.Action.requiresPreprocessing
  name: requiresPreprocessing
  summary: Value that indicates whether the rule action requires preprocessing.
  signature: 'requiresPreprocessing: bool'
- uid: azure.mgmt.servicebus.types.Action.sqlExpression
  name: sqlExpression
  summary: SQL expression. e.g. MyProperty='ABC'.
  signature: 'sqlExpression: str'
