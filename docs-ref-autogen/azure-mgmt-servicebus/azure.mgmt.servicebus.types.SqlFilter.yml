### YamlMime:PythonClass
uid: azure.mgmt.servicebus.types.SqlFilter
name: SqlFilter
fullName: azure.mgmt.servicebus.types.SqlFilter
module: azure.mgmt.servicebus.types
summary: 'Represents a filter which is a composition of an expression and an action
  that is executed in

  the pub/sub pipeline.'
constructor:
  syntax: SqlFilter()
variables:
- description: The SQL expression. e.g. MyProperty='ABC'.
  name: sql_expression
  types:
  - <xref:str>
- description: 'This property is reserved for future use. An integer value showing

    the compatibility level, currently hard-coded to 20.'
  name: compatibility_level
  types:
  - <xref:int>
- description: 'Value that indicates whether the rule action requires

    preprocessing.'
  name: requires_preprocessing
  types:
  - <xref:bool>
attributes:
- uid: azure.mgmt.servicebus.types.SqlFilter.compatibilityLevel
  name: compatibilityLevel
  summary: 'This property is reserved for future use. An integer value showing the
    compatibility level,

    currently hard-coded to 20.'
  signature: 'compatibilityLevel: int'
- uid: azure.mgmt.servicebus.types.SqlFilter.requiresPreprocessing
  name: requiresPreprocessing
  summary: Value that indicates whether the rule action requires preprocessing.
  signature: 'requiresPreprocessing: bool'
- uid: azure.mgmt.servicebus.types.SqlFilter.sqlExpression
  name: sqlExpression
  summary: The SQL expression. e.g. MyProperty='ABC'.
  signature: 'sqlExpression: str'
