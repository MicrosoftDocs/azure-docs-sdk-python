### YamlMime:PythonClass
uid: azure.mgmt.servicebus.types.SBSku
name: SBSku
fullName: azure.mgmt.servicebus.types.SBSku
module: azure.mgmt.servicebus.types
summary: SKU of the namespace.
constructor:
  syntax: SBSku()
variables:
- description: 'Name of this SKU. Required. Known values are: "Basic", "Standard",
    and "Premium".'
  name: name
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SkuName">]
- description: 'The billing tier of this particular SKU. Known values are: "Basic",
    "Standard", and

    "Premium".'
  name: tier
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SkuTier">]
- description: 'Messaging units for your service bus premium namespace. Valid capacities
    are

    {1, 2, 4, 8, 16} multiples of your properties.premiumMessagingPartitions setting.
    For example,

    If properties.premiumMessagingPartitions is 1 then possible capacity values are
    1, 2, 4, 8, and

    16. If properties.premiumMessagingPartitions is 4 then possible capacity values
    are 4, 8, 16,

    32 and 64.'
  name: capacity
  types:
  - <xref:int>
attributes:
- uid: azure.mgmt.servicebus.types.SBSku.capacity
  name: capacity
  summary: 'Messaging units for your service bus premium namespace. Valid capacities
    are {1, 2, 4, 8, 16}

    multiples of your properties.premiumMessagingPartitions setting. For example,
    If

    properties.premiumMessagingPartitions is 1 then possible capacity values are 1,
    2, 4, 8, and

    16. If properties.premiumMessagingPartitions is 4 then possible capacity values
    are 4, 8, 16,

    32 and 64.'
  signature: 'capacity: int'
- uid: azure.mgmt.servicebus.types.SBSku.name
  name: name
  summary: '"Basic", "Standard", and "Premium".'
  signature: 'name: Required[str | SkuName]'
- uid: azure.mgmt.servicebus.types.SBSku.tier
  name: tier
  summary: '"Basic", "Standard", and

    "Premium".'
  signature: 'tier: str | SkuTier'
