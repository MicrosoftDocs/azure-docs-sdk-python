  name: countDetails
  summary: Message count details.
  signature: 'countDetails: MessageCountDetails'
- uid: azure.mgmt.servicebus.types.SBSubscriptionProperties.createdAt
  name: createdAt
  summary: Exact time the message was created.
  signature: 'createdAt: str'
