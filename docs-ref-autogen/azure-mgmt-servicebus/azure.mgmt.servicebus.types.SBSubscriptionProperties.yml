  signature: 'autoDeleteOnIdle: str'
- uid: azure.mgmt.servicebus.types.SBSubscriptionProperties.clientAffineProperties
  name: clientAffineProperties
  summary: Properties specific to client affine subscriptions.
  signature: 'clientAffineProperties: SBClientAffineProperties'
