  signature: 'lockDuration: str'
- uid: azure.mgmt.servicebus.types.SBSubscriptionProperties.maxDeliveryCount
  name: maxDeliveryCount
  summary: Number of maximum deliveries.
  signature: 'maxDeliveryCount: int'
- uid: azure.mgmt.servicebus.types.SBSubscriptionProperties.messageCount
  name: messageCount
  summary: Number of messages.
  signature: 'messageCount: int'
- uid: azure.mgmt.servicebus.types.SBSubscriptionProperties.requiresSession
  name: requiresSession
  summary: Value indicating if a subscription supports the concept of sessions.
  signature: 'requiresSession: bool'
- uid: azure.mgmt.servicebus.types.SBSubscriptionProperties.status
  name: status
  summary: 'Enumerates the possible values for the status of a messaging entity. Known
