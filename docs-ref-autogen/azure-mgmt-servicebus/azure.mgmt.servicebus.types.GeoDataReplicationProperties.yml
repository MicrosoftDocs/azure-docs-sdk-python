uid: azure.mgmt.servicebus.types.GeoDataReplicationProperties
name: GeoDataReplicationProperties
fullName: azure.mgmt.servicebus.types.GeoDataReplicationProperties
module: azure.mgmt.servicebus.types
summary: GeoDR Replication properties.
constructor:
  syntax: GeoDataReplicationProperties()
variables:
- description: 'The maximum acceptable lag for data replication

    operations from the primary replica to a quorum of secondary replicas.  When the
    lag exceeds

    the configured amount, operations on the primary replica will be failed. The allowed
    values are

    0 and 5 minutes to 1 day.'
  name: max_replication_lag_duration_in_seconds
  types:
  - <xref:int>
- description: A list of regions where replicas of the namespace are maintained.
  name: locations
  types:
  - <xref:list>[<xref:"NamespaceReplicaLocation">]
attributes:
- uid: azure.mgmt.servicebus.types.GeoDataReplicationProperties.locations
  name: locations
  summary: A list of regions where replicas of the namespace are maintained.
  signature: 'locations: list[azure.mgmt.servicebus.types.NamespaceReplicaLocation]'
- uid: azure.mgmt.servicebus.types.GeoDataReplicationProperties.maxReplicationLagDurationInSeconds
  name: maxReplicationLagDurationInSeconds
  summary: 'The maximum acceptable lag for data replication operations from the primary
    replica to a quorum

    of secondary replicas.  When the lag exceeds the configured amount, operations
    on the primary

    replica will be failed. The allowed values are 0 and 5 minutes to 1 day.'
  signature: 'maxReplicationLagDurationInSeconds: int'
