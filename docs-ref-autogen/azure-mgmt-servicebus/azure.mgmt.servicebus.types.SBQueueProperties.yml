### YamlMime:PythonClass
uid: azure.mgmt.servicebus.types.SBQueueProperties
name: SBQueueProperties
fullName: azure.mgmt.servicebus.types.SBQueueProperties
module: azure.mgmt.servicebus.types
summary: The Queue Properties definition.
constructor:
  syntax: SBQueueProperties()
variables:
- description: Message Count Details.
  name: count_details
  types:
  - <xref:<xref:"MessageCountDetails">>
- description: The exact time the message was created.
  name: created_at
  types:
  - <xref:str>
- description: The exact time the message was updated.
  name: updated_at
  types:
  - <xref:str>
- description: 'Last time a message was sent, or the last time there was a receive
    request

    to this queue.'
  name: accessed_at
  types:
  - <xref:str>
- description: The size of the queue, in bytes.
  name: size_in_bytes
  types:
  - <xref:int>
- description: The number of messages in the queue.
  name: message_count
  types:
  - <xref:int>
- description: 'ISO 8601 timespan duration of a peek-lock; that is, the amount of
    time

    that the message is locked for other receivers. The maximum value for LockDuration
    is 5

    minutes; the default value is 1 minute.'
  name: lock_duration
  types:
  - <xref:str>
- description: 'The maximum size of the queue in megabytes, which is the size of

    memory allocated for the queue. Default is 1024.'
  name: max_size_in_megabytes
  types:
  - <xref:int>
- description: 'Maximum size (in KB) of the message payload that can be

    accepted by the queue. This property is only used in Premium today and default
    is 1024.'
  name: max_message_size_in_kilobytes
  types:
  - <xref:int>
- description: 'A value indicating if this queue requires duplicate

    detection.'
  name: requires_duplicate_detection
  types:
  - <xref:bool>
- description: 'A value that indicates whether the queue supports the concept of

    sessions.'
  name: requires_session
  types:
  - <xref:bool>
- description: 'ISO 8601 default message timespan to live value. This is

    the duration after which the message expires, starting from when the message is
    sent to Service

    Bus. This is the default value used when TimeToLive is not set on a message itself.'
  name: default_message_time_to_live
  types:
  - <xref:str>
- description: 'A value that indicates whether this queue has dead

    letter support when a message expires.'
  name: dead_lettering_on_message_expiration
  types:
  - <xref:bool>
- description: 'ISO 8601 timeSpan structure that defines the

    duration of the duplicate detection history. The default value is 10 minutes.'
  name: duplicate_detection_history_time_window
  types:
  - <xref:str>
- description: 'The maximum delivery count. A message is automatically deadlettered

    after this number of deliveries. default value is 10.'
  name: max_delivery_count
  types:
  - <xref:int>
- description: 'Enumerates the possible values for the status of a messaging entity.
    Known values

    are: "Active", "Disabled", "Restoring", "SendDisabled", "ReceiveDisabled", "Creating",

    "Deleting", "Renaming", and "Unknown".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EntityStatus">]
- description: 'Value that indicates whether server-side batched operations

    are enabled.'
  name: enable_batched_operations
  types:
  - <xref:bool>
- description: 'ISO 8061 timeSpan idle interval after which the queue is

    automatically deleted. The minimum duration is 5 minutes.'
  name: auto_delete_on_idle
  types:
  - <xref:str>
- description: 'A value that indicates whether the queue is to be partitioned across

    multiple message brokers.'
  name: enable_partitioning
  types:
  - <xref:bool>
- description: 'A value that indicates whether Express Entities are enabled. An express

    queue holds a message in memory temporarily before writing it to persistent storage.'
  name: enable_express
  types:
  - <xref:bool>
- description: Queue/Topic name to forward the messages.
  name: forward_to
  types:
  - <xref:str>
- description: Queue/Topic name to forward the Dead Letter message.
  name: forward_dead_lettered_messages_to
  types:
  - <xref:str>
- description: Gets and Sets Metadata of User.
  name: user_metadata
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.servicebus.types.SBQueueProperties.accessedAt
  name: accessedAt
  summary: Last time a message was sent, or the last time there was a receive request
    to this queue.
  signature: 'accessedAt: str'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.autoDeleteOnIdle
  name: autoDeleteOnIdle
  summary: 'ISO 8061 timeSpan idle interval after which the queue is automatically
    deleted. The minimum

    duration is 5 minutes.'
  signature: 'autoDeleteOnIdle: str'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.countDetails
  name: countDetails
  summary: Message Count Details.
  signature: 'countDetails: MessageCountDetails'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.createdAt
  name: createdAt
  summary: The exact time the message was created.
  signature: 'createdAt: str'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.deadLetteringOnMessageExpiration
  name: deadLetteringOnMessageExpiration
  summary: A value that indicates whether this queue has dead letter support when
    a message expires.
  signature: 'deadLetteringOnMessageExpiration: bool'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.defaultMessageTimeToLive
  name: defaultMessageTimeToLive
  summary: 'ISO 8601 default message timespan to live value. This is the duration
    after which the message

    expires, starting from when the message is sent to Service Bus. This is the default
    value used

    when TimeToLive is not set on a message itself.'
  signature: 'defaultMessageTimeToLive: str'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.duplicateDetectionHistoryTimeWindow
  name: duplicateDetectionHistoryTimeWindow
  summary: 'ISO 8601 timeSpan structure that defines the duration of the duplicate
    detection history. The

    default value is 10 minutes.'
  signature: 'duplicateDetectionHistoryTimeWindow: str'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.enableBatchedOperations
  name: enableBatchedOperations
  summary: Value that indicates whether server-side batched operations are enabled.
  signature: 'enableBatchedOperations: bool'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.enableExpress
  name: enableExpress
  summary: 'A value that indicates whether Express Entities are enabled. An express
    queue holds a message

    in memory temporarily before writing it to persistent storage.'
  signature: 'enableExpress: bool'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.enablePartitioning
  name: enablePartitioning
  summary: A value that indicates whether the queue is to be partitioned across multiple
    message brokers.
  signature: 'enablePartitioning: bool'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.forwardDeadLetteredMessagesTo
  name: forwardDeadLetteredMessagesTo
  summary: Queue/Topic name to forward the Dead Letter message.
  signature: 'forwardDeadLetteredMessagesTo: str'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.forwardTo
  name: forwardTo
  summary: Queue/Topic name to forward the messages.
  signature: 'forwardTo: str'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.lockDuration
  name: lockDuration
  summary: 'ISO 8601 timespan duration of a peek-lock; that is, the amount of time
    that the message is

    locked for other receivers. The maximum value for LockDuration is 5 minutes; the
    default value

    is 1 minute.'
  signature: 'lockDuration: str'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.maxDeliveryCount
  name: maxDeliveryCount
  summary: 'The maximum delivery count. A message is automatically deadlettered after
    this number of

    deliveries. default value is 10.'
  signature: 'maxDeliveryCount: int'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.maxMessageSizeInKilobytes
  name: maxMessageSizeInKilobytes
  summary: 'Maximum size (in KB) of the message payload that can be accepted by the
    queue. This property is

    only used in Premium today and default is 1024.'
  signature: 'maxMessageSizeInKilobytes: int'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.maxSizeInMegabytes
  name: maxSizeInMegabytes
  summary: 'The maximum size of the queue in megabytes, which is the size of memory
    allocated for the

    queue. Default is 1024.'
  signature: 'maxSizeInMegabytes: int'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.messageCount
  name: messageCount
  summary: The number of messages in the queue.
  signature: 'messageCount: int'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.requiresDuplicateDetection
  name: requiresDuplicateDetection
  summary: A value indicating if this queue requires duplicate detection.
  signature: 'requiresDuplicateDetection: bool'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.requiresSession
  name: requiresSession
  summary: A value that indicates whether the queue supports the concept of sessions.
  signature: 'requiresSession: bool'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.sizeInBytes
  name: sizeInBytes
  summary: The size of the queue, in bytes.
  signature: 'sizeInBytes: int'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.status
  name: status
  summary: 'Enumerates the possible values for the status of a messaging entity. Known
    values are:

    "Active", "Disabled", "Restoring", "SendDisabled", "ReceiveDisabled", "Creating",

    "Deleting", "Renaming", and "Unknown".'
  signature: 'status: str | EntityStatus'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.updatedAt
  name: updatedAt
  summary: The exact time the message was updated.
  signature: 'updatedAt: str'
- uid: azure.mgmt.servicebus.types.SBQueueProperties.userMetadata
  name: userMetadata
  summary: Gets and Sets Metadata of User.
  signature: 'userMetadata: str'
