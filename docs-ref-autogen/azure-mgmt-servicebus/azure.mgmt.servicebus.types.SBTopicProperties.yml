### YamlMime:PythonClass
uid: azure.mgmt.servicebus.types.SBTopicProperties
name: SBTopicProperties
fullName: azure.mgmt.servicebus.types.SBTopicProperties
module: azure.mgmt.servicebus.types
summary: The Topic Properties definition.
constructor:
  syntax: SBTopicProperties()
variables:
- description: Size of the topic, in bytes.
  name: size_in_bytes
  types:
  - <xref:int>
- description: Exact time the message was created.
  name: created_at
  types:
  - <xref:str>
- description: The exact time the message was updated.
  name: updated_at
  types:
  - <xref:str>
- description: Last time the message was sent, or a request was received, for this
    topic.
  name: accessed_at
  types:
  - <xref:str>
- description: Number of subscriptions.
  name: subscription_count
  types:
  - <xref:int>
- description: Message count details.
  name: count_details
  types:
  - <xref:<xref:"MessageCountDetails">>
- description: 'ISO 8601 Default message timespan to live value. This is

    the duration after which the message expires, starting from when the message is
    sent to Service

    Bus. This is the default value used when TimeToLive is not set on a message itself.'
  name: default_message_time_to_live
  types:
  - <xref:str>
- description: 'Maximum size of the topic in megabytes, which is the size of the

    memory allocated for the topic. Default is 1024.'
  name: max_size_in_megabytes
  types:
  - <xref:int>
- description: 'Maximum size (in KB) of the message payload that can be

    accepted by the topic. This property is only used in Premium today and default
    is 1024.'
  name: max_message_size_in_kilobytes
  types:
  - <xref:int>
- description: 'Value indicating if this topic requires duplicate

    detection.'
  name: requires_duplicate_detection
  types:
  - <xref:bool>
- description: 'ISO8601 timespan structure that defines the

    duration of the duplicate detection history. The default value is 10 minutes.'
  name: duplicate_detection_history_time_window
  types:
  - <xref:str>
- description: 'Value that indicates whether server-side batched operations

    are enabled.'
  name: enable_batched_operations
  types:
  - <xref:bool>
- description: 'Enumerates the possible values for the status of a messaging entity.
    Known values

    are: "Active", "Disabled", "Restoring", "SendDisabled", "ReceiveDisabled", "Creating",

    "Deleting", "Renaming", and "Unknown".'
  name: status
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"EntityStatus">]
- description: Value that indicates whether the topic supports ordering.
  name: support_ordering
  types:
  - <xref:bool>
- description: 'ISO 8601 timespan idle interval after which the topic is

    automatically deleted. The minimum duration is 5 minutes.'
  name: auto_delete_on_idle
  types:
  - <xref:str>
- description: 'Value that indicates whether the topic to be partitioned across

    multiple message brokers is enabled.'
  name: enable_partitioning
  types:
  - <xref:bool>
- description: 'Value that indicates whether Express Entities are enabled. An express

    topic holds a message in memory temporarily before writing it to persistent storage.'
  name: enable_express
  types:
  - <xref:bool>
- description: Gets and Sets Metadata of User.
  name: user_metadata
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.servicebus.types.SBTopicProperties.accessedAt
  name: accessedAt
  summary: Last time the message was sent, or a request was received, for this topic.
  signature: 'accessedAt: str'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.autoDeleteOnIdle
  name: autoDeleteOnIdle
  summary: 'ISO 8601 timespan idle interval after which the topic is automatically
    deleted. The minimum

    duration is 5 minutes.'
  signature: 'autoDeleteOnIdle: str'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.countDetails
  name: countDetails
  summary: Message count details.
  signature: 'countDetails: MessageCountDetails'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.createdAt
  name: createdAt
  summary: Exact time the message was created.
  signature: 'createdAt: str'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.defaultMessageTimeToLive
  name: defaultMessageTimeToLive
  summary: 'ISO 8601 Default message timespan to live value. This is the duration
    after which the message

    expires, starting from when the message is sent to Service Bus. This is the default
    value used

    when TimeToLive is not set on a message itself.'
  signature: 'defaultMessageTimeToLive: str'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.duplicateDetectionHistoryTimeWindow
  name: duplicateDetectionHistoryTimeWindow
  summary: 'ISO8601 timespan structure that defines the duration of the duplicate
    detection history. The

    default value is 10 minutes.'
  signature: 'duplicateDetectionHistoryTimeWindow: str'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.enableBatchedOperations
  name: enableBatchedOperations
  summary: Value that indicates whether server-side batched operations are enabled.
  signature: 'enableBatchedOperations: bool'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.enableExpress
  name: enableExpress
  summary: 'Value that indicates whether Express Entities are enabled. An express
    topic holds a message in

    memory temporarily before writing it to persistent storage.'
  signature: 'enableExpress: bool'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.enablePartitioning
  name: enablePartitioning
  summary: 'Value that indicates whether the topic to be partitioned across multiple
    message brokers is

    enabled.'
  signature: 'enablePartitioning: bool'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.maxMessageSizeInKilobytes
  name: maxMessageSizeInKilobytes
  summary: 'Maximum size (in KB) of the message payload that can be accepted by the
    topic. This property is

    only used in Premium today and default is 1024.'
  signature: 'maxMessageSizeInKilobytes: int'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.maxSizeInMegabytes
  name: maxSizeInMegabytes
  summary: 'Maximum size of the topic in megabytes, which is the size of the memory
    allocated for the

    topic. Default is 1024.'
  signature: 'maxSizeInMegabytes: int'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.requiresDuplicateDetection
  name: requiresDuplicateDetection
  summary: Value indicating if this topic requires duplicate detection.
  signature: 'requiresDuplicateDetection: bool'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.sizeInBytes
  name: sizeInBytes
  summary: Size of the topic, in bytes.
  signature: 'sizeInBytes: int'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.status
  name: status
  summary: 'Enumerates the possible values for the status of a messaging entity. Known
    values are:

    "Active", "Disabled", "Restoring", "SendDisabled", "ReceiveDisabled", "Creating",

    "Deleting", "Renaming", and "Unknown".'
  signature: 'status: str | EntityStatus'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.subscriptionCount
  name: subscriptionCount
  summary: Number of subscriptions.
  signature: 'subscriptionCount: int'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.supportOrdering
  name: supportOrdering
  summary: Value that indicates whether the topic supports ordering.
  signature: 'supportOrdering: bool'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.updatedAt
  name: updatedAt
  summary: The exact time the message was updated.
  signature: 'updatedAt: str'
- uid: azure.mgmt.servicebus.types.SBTopicProperties.userMetadata
  name: userMetadata
  summary: Gets and Sets Metadata of User.
  signature: 'userMetadata: str'
