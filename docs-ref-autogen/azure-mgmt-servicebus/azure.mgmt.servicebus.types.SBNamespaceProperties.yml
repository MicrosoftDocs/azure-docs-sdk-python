  name: premiumMessagingPartitions
  summary: 'The number of partitions of a Service Bus namespace. This property is
    only applicable to

    Premium SKU namespaces. The default value is 1 and possible values are 1, 2 and
    4.'
  signature: 'premiumMessagingPartitions: int'
