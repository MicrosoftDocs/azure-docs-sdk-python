### YamlMime:PythonClass
uid: azure.mgmt.servicebus.types.SBNamespaceProperties
name: SBNamespaceProperties
fullName: azure.mgmt.servicebus.types.SBNamespaceProperties
module: azure.mgmt.servicebus.types
summary: Properties of the namespace.
constructor:
  syntax: SBNamespaceProperties()
variables:
- description: 'The minimum TLS version for the cluster to support, e.g. ''1.2''.

    Known values are: "1.0", "1.1", "1.2", and "1.3".'
  name: minimum_tls_version
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"TlsVersion">]
- description: Provisioning state of the namespace.
  name: provisioning_state
  types:
  - <xref:str>
- description: Status of the namespace.
  name: status
  types:
  - <xref:str>
- description: The time the namespace was created.
  name: created_at
  types:
  - <xref:str>
- description: The time the namespace was updated.
  name: updated_at
  types:
  - <xref:str>
- description: Endpoint you can use to perform Service Bus operations.
  name: service_bus_endpoint
  types:
  - <xref:str>
- description: Identifier for Azure Insights metrics.
  name: metric_id
  types:
  - <xref:str>
- description: 'Enabling this property creates a Premium Service Bus Namespace in
    regions

    supported availability zones.'
  name: zone_redundant
  types:
  - <xref:bool>
- description: Properties of BYOK Encryption description.
  name: encryption
  types:
  - <xref:<xref:"Encryption">>
- description: List of private endpoint connections.
  name: private_endpoint_connections
  types:
  - <xref:list>[<xref:"PrivateEndpointConnection">]
- description: 'This property disables SAS authentication for the Service Bus

    namespace.'
  name: disable_local_auth
  types:
  - <xref:bool>
- description: Alternate name for namespace.
  name: alternate_name
  types:
  - <xref:str>
- description: 'This determines if traffic is allowed over public network. By

    default it is enabled. Known values are: "Enabled", "Disabled", and "SecuredByPerimeter".'
  name: public_network_access
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"PublicNetworkAccess">]
- description: 'The number of partitions of a Service Bus namespace. This

    property is only applicable to Premium SKU namespaces. The default value is 1
    and possible

    values are 1, 2 and 4.'
  name: premium_messaging_partitions
  types:
  - <xref:int>
- name: platform_capabilities
  types:
  - <xref:<xref:"PlatformCapabilities">>
- description: Geo Data Replication settings for the namespace.
  name: geo_data_replication
  types:
  - <xref:<xref:"GeoDataReplicationProperties">>
- description: 'The IP address type for the namespace. Determines whether the namespace

    supports IPv4 only or both IPv4 and IPv6 (dual stack). Known values are: "IPv4"
    and

    "DualStack".'
  name: ip_address_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"IpAddressType">]
attributes:
- uid: azure.mgmt.servicebus.types.SBNamespaceProperties.alternateName
  name: alternateName
