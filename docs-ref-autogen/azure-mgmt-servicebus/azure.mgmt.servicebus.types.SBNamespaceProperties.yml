  name: privateEndpointConnections
  summary: List of private endpoint connections.
  signature: 'privateEndpointConnections: list[''PrivateEndpointConnection'']'
- uid: azure.mgmt.servicebus.types.SBNamespaceProperties.provisioningState
  name: provisioningState
  summary: Provisioning state of the namespace.
  signature: 'provisioningState: str'
- uid: azure.mgmt.servicebus.types.SBNamespaceProperties.publicNetworkAccess
  name: publicNetworkAccess
  summary: 'This determines if traffic is allowed over public network. By default
