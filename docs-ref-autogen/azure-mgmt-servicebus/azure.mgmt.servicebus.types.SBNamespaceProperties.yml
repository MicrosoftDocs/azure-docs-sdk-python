    values are: "Enabled", "Disabled", and "SecuredByPerimeter".'
  signature: 'publicNetworkAccess: str | PublicNetworkAccess'
- uid: azure.mgmt.servicebus.types.SBNamespaceProperties.serviceBusEndpoint
  name: serviceBusEndpoint
  summary: Endpoint you can use to perform Service Bus operations.
  signature: 'serviceBusEndpoint: str'
- uid: azure.mgmt.servicebus.types.SBNamespaceProperties.status
  name: status
  summary: Status of the namespace.
  signature: 'status: str'
- uid: azure.mgmt.servicebus.types.SBNamespaceProperties.updatedAt
  name: updatedAt
  summary: The time the namespace was updated.
  signature: 'updatedAt: str'
- uid: azure.mgmt.servicebus.types.SBNamespaceProperties.zoneRedundant
  name: zoneRedundant
  summary: 'Enabling this property creates a Premium Service Bus Namespace in regions
    supported

    availability zones.'
  signature: 'zoneRedundant: bool'
- uid: azure.mgmt.servicebus.types.SBNamespaceProperties.platformCapabilities
  name: platformCapabilities
  signature: 'platformCapabilities: PlatformCapabilities'
