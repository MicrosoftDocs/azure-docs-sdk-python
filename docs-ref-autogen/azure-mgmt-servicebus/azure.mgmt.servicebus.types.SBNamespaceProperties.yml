  name: disableLocalAuth
  summary: This property disables SAS authentication for the Service Bus namespace.
  signature: 'disableLocalAuth: bool'
- uid: azure.mgmt.servicebus.types.SBNamespaceProperties.encryption
  name: encryption
  summary: Properties of BYOK Encryption description.
  signature: 'encryption: Encryption'
- uid: azure.mgmt.servicebus.types.SBNamespaceProperties.geoDataReplication
  name: geoDataReplication
  summary: Geo Data Replication settings for the namespace.
  signature: 'geoDataReplication: GeoDataReplicationProperties'
- uid: azure.mgmt.servicebus.types.SBNamespaceProperties.ipAddressType
  name: ipAddressType
  summary: 'The IP address type for the namespace. Determines whether the namespace
    supports IPv4 only or

    both IPv4 and IPv6 (dual stack). Known values are: "IPv4" and "DualStack".'
  signature: 'ipAddressType: str | IpAddressType'
- uid: azure.mgmt.servicebus.types.SBNamespaceProperties.metricId
  name: metricId
  summary: Identifier for Azure Insights metrics.
  signature: 'metricId: str'
