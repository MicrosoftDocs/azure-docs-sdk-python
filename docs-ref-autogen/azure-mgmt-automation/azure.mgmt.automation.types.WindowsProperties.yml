### YamlMime:PythonClass
uid: azure.mgmt.automation.types.WindowsProperties
name: WindowsProperties
fullName: azure.mgmt.automation.types.WindowsProperties
module: azure.mgmt.automation.types
summary: Windows specific update configuration.
constructor:
  syntax: WindowsProperties()
variables:
- description: 'Update classification included in the software update

    configuration. A comma separated string with required values. Known values are:
    "Unclassified",

    "Critical", "Security", "UpdateRollup", "FeaturePack", "ServicePack", "Definition",
    "Tools",

    and "Updates".'
  name: included_update_classifications
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"WindowsUpdateClasses">]
- description: KB numbers excluded from the software update configuration.
  name: excluded_kb_numbers
  types:
  - <xref:list>[<xref:str>]
- description: KB numbers included from the software update configuration.
  name: included_kb_numbers
  types:
  - <xref:list>[<xref:str>]
- description: Reboot setting for the software update configuration.
  name: reboot_setting
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.automation.types.WindowsProperties.excludedKbNumbers
  name: excludedKbNumbers
  summary: KB numbers excluded from the software update configuration.
  signature: 'excludedKbNumbers: list[str]'
- uid: azure.mgmt.automation.types.WindowsProperties.includedKbNumbers
  name: includedKbNumbers
  summary: KB numbers included from the software update configuration.
  signature: 'includedKbNumbers: list[str]'
- uid: azure.mgmt.automation.types.WindowsProperties.includedUpdateClassifications
  name: includedUpdateClassifications
  summary: 'Update classification included in the software update configuration. A
    comma separated string

    with required values. Known values are: "Unclassified", "Critical", "Security",

    "UpdateRollup", "FeaturePack", "ServicePack", "Definition", "Tools", and "Updates".'
  signature: 'includedUpdateClassifications: str | WindowsUpdateClasses'
- uid: azure.mgmt.automation.types.WindowsProperties.rebootSetting
  name: rebootSetting
  summary: Reboot setting for the software update configuration.
  signature: 'rebootSetting: str'
