### YamlMime:PythonClass
uid: azure.mgmt.automation.types.SourceControlCreateOrUpdateProperties
name: SourceControlCreateOrUpdateProperties
fullName: azure.mgmt.automation.types.SourceControlCreateOrUpdateProperties
module: azure.mgmt.automation.types
summary: The properties of the create source control operation.
constructor:
  syntax: SourceControlCreateOrUpdateProperties()
variables:
- description: The repo url of the source control.
  name: repo_url
  types:
  - <xref:str>
- description: 'The repo branch of the source control. Include branch as empty string
    for

    VsoTfvc.'
  name: branch
  types:
  - <xref:str>
- description: The folder path of the source control. Path must be relative.
  name: folder_path
  types:
  - <xref:str>
- description: The auto async of the source control. Default is false.
  name: auto_sync
  types:
  - <xref:bool>
- description: The auto publish of the source control. Default is true.
  name: publish_runbook
  types:
  - <xref:bool>
- description: 'The source type. Must be one of VsoGit, VsoTfvc, GitHub, case sensitive.

    Known values are: "VsoGit", "VsoTfvc", and "GitHub".'
  name: source_type
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"SourceType">]
- description: The authorization token for the repo of the source control.
  name: security_token
  types:
  - <xref:<xref:"SourceControlSecurityTokenProperties">>
- description: The user description of the source control.
  name: description
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.automation.types.SourceControlCreateOrUpdateProperties.autoSync
  name: autoSync
  summary: The auto async of the source control. Default is false.
  signature: 'autoSync: bool'
- uid: azure.mgmt.automation.types.SourceControlCreateOrUpdateProperties.branch
  name: branch
  summary: The repo branch of the source control. Include branch as empty string for
    VsoTfvc.
  signature: 'branch: str'
- uid: azure.mgmt.automation.types.SourceControlCreateOrUpdateProperties.description
  name: description
  summary: The user description of the source control.
  signature: 'description: str'
- uid: azure.mgmt.automation.types.SourceControlCreateOrUpdateProperties.folderPath
  name: folderPath
  summary: The folder path of the source control. Path must be relative.
  signature: 'folderPath: str'
- uid: azure.mgmt.automation.types.SourceControlCreateOrUpdateProperties.publishRunbook
  name: publishRunbook
  summary: The auto publish of the source control. Default is true.
  signature: 'publishRunbook: bool'
- uid: azure.mgmt.automation.types.SourceControlCreateOrUpdateProperties.repoUrl
  name: repoUrl
  summary: The repo url of the source control.
  signature: 'repoUrl: str'
- uid: azure.mgmt.automation.types.SourceControlCreateOrUpdateProperties.securityToken
  name: securityToken
  summary: The authorization token for the repo of the source control.
  signature: 'securityToken: SourceControlSecurityTokenProperties'
- uid: azure.mgmt.automation.types.SourceControlCreateOrUpdateProperties.sourceType
  name: sourceType
  summary: 'The source type. Must be one of VsoGit, VsoTfvc, GitHub, case sensitive.
    Known values are:

    "VsoGit", "VsoTfvc", and "GitHub".'
  signature: 'sourceType: str | SourceType'
