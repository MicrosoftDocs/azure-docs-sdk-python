### YamlMime:PythonClass
uid: azure.mgmt.automation.types.LinuxProperties
name: LinuxProperties
fullName: azure.mgmt.automation.types.LinuxProperties
module: azure.mgmt.automation.types
summary: Linux specific update configuration.
constructor:
  syntax: LinuxProperties()
variables:
- description: 'Update classifications included in the software update

    configuration. Known values are: "Unclassified", "Critical", "Security", and "Other".'
  name: included_package_classifications
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"LinuxUpdateClasses">]
- description: packages excluded from the software update configuration.
  name: excluded_package_name_masks
  types:
  - <xref:list>[<xref:str>]
- description: packages included from the software update configuration.
  name: included_package_name_masks
  types:
  - <xref:list>[<xref:str>]
- description: Reboot setting for the software update configuration.
  name: reboot_setting
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.automation.types.LinuxProperties.excludedPackageNameMasks
  name: excludedPackageNameMasks
  summary: packages excluded from the software update configuration.
  signature: 'excludedPackageNameMasks: list[str]'
- uid: azure.mgmt.automation.types.LinuxProperties.includedPackageClassifications
  name: includedPackageClassifications
  summary: 'Update classifications included in the software update configuration.
    Known values are:

    "Unclassified", "Critical", "Security", and "Other".'
  signature: 'includedPackageClassifications: str | LinuxUpdateClasses'
- uid: azure.mgmt.automation.types.LinuxProperties.includedPackageNameMasks
  name: includedPackageNameMasks
  summary: packages included from the software update configuration.
  signature: 'includedPackageNameMasks: list[str]'
- uid: azure.mgmt.automation.types.LinuxProperties.rebootSetting
  name: rebootSetting
  summary: Reboot setting for the software update configuration.
  signature: 'rebootSetting: str'
