### YamlMime:PythonClass
uid: azure.mgmt.automation.types.SourceControlUpdateProperties
name: SourceControlUpdateProperties
fullName: azure.mgmt.automation.types.SourceControlUpdateProperties
module: azure.mgmt.automation.types
summary: The properties of the update source control.
constructor:
  syntax: SourceControlUpdateProperties()
variables:
- description: The repo branch of the source control.
  name: branch
  types:
  - <xref:str>
- description: The folder path of the source control. Path must be relative.
  name: folder_path
  types:
  - <xref:str>
- description: The auto sync of the source control. Default is false.
  name: auto_sync
  types:
  - <xref:bool>
- description: The auto publish of the source control. Default is true.
  name: publish_runbook
  types:
  - <xref:bool>
- description: The authorization token for the repo of the source control.
  name: security_token
  types:
  - <xref:<xref:"SourceControlSecurityTokenProperties">>
- description: The user description of the source control.
  name: description
  types:
  - <xref:str>
attributes:
- uid: azure.mgmt.automation.types.SourceControlUpdateProperties.autoSync
  name: autoSync
  summary: The auto sync of the source control. Default is false.
  signature: 'autoSync: bool'
- uid: azure.mgmt.automation.types.SourceControlUpdateProperties.branch
  name: branch
  summary: The repo branch of the source control.
  signature: 'branch: str'
- uid: azure.mgmt.automation.types.SourceControlUpdateProperties.description
  name: description
  summary: The user description of the source control.
  signature: 'description: str'
- uid: azure.mgmt.automation.types.SourceControlUpdateProperties.folderPath
  name: folderPath
  summary: The folder path of the source control. Path must be relative.
  signature: 'folderPath: str'
- uid: azure.mgmt.automation.types.SourceControlUpdateProperties.publishRunbook
  name: publishRunbook
  summary: The auto publish of the source control. Default is true.
  signature: 'publishRunbook: bool'
- uid: azure.mgmt.automation.types.SourceControlUpdateProperties.securityToken
  name: securityToken
  summary: The authorization token for the repo of the source control.
  signature: 'securityToken: SourceControlSecurityTokenProperties'
