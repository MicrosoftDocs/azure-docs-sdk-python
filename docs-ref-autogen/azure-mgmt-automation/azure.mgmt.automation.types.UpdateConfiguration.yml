### YamlMime:PythonClass
uid: azure.mgmt.automation.types.UpdateConfiguration
name: UpdateConfiguration
fullName: azure.mgmt.automation.types.UpdateConfiguration
module: azure.mgmt.automation.types
summary: Update specific properties of the software update configuration.
constructor:
  syntax: UpdateConfiguration()
variables:
- description: 'operating system of target machines. Required. Known values are:

    "Windows" and "Linux".'
  name: operating_system
  types:
  - <xref:typing.Union>[<xref:str>, <xref:"OperatingSystemType">]
- description: Windows specific update configuration.
  name: windows
  types:
  - <xref:<xref:"WindowsProperties">>
- description: Linux specific update configuration.
  name: linux
  types:
  - <xref:<xref:"LinuxProperties">>
- description: 'Maximum time allowed for the software update configuration run. Duration
    needs

    to be specified using the format PT[n]H[n]M[n]S as per ISO8601.'
  name: duration
  types:
  - <xref:str>
- description: 'List of azure resource Ids for azure virtual machines targeted by

    the software update configuration.'
  name: azure_virtual_machines
  types:
  - <xref:list>[<xref:str>]
- description: 'List of names of non-azure machines targeted by the software

    update configuration.'
  name: non_azure_computer_names
  types:
  - <xref:list>[<xref:str>]
- description: Group targets for the software update configuration.
  name: targets
  types:
  - <xref:<xref:"TargetProperties">>
attributes:
- uid: azure.mgmt.automation.types.UpdateConfiguration.azureVirtualMachines
  name: azureVirtualMachines
  summary: 'List of azure resource Ids for azure virtual machines targeted by the
    software update

    configuration.'
  signature: 'azureVirtualMachines: list[str]'
- uid: azure.mgmt.automation.types.UpdateConfiguration.duration
  name: duration
  summary: 'Maximum time allowed for the software update configuration run. Duration
    needs to be specified

    using the format PT[n]H[n]M[n]S as per ISO8601.'
  signature: 'duration: str'
- uid: azure.mgmt.automation.types.UpdateConfiguration.linux
  name: linux
  summary: Linux specific update configuration.
  signature: 'linux: LinuxProperties'
- uid: azure.mgmt.automation.types.UpdateConfiguration.nonAzureComputerNames
  name: nonAzureComputerNames
  summary: List of names of non-azure machines targeted by the software update configuration.
  signature: 'nonAzureComputerNames: list[str]'
- uid: azure.mgmt.automation.types.UpdateConfiguration.operatingSystem
  name: operatingSystem
  summary: '"Windows" and "Linux".'
  signature: 'operatingSystem: Required[str | OperatingSystemType]'
- uid: azure.mgmt.automation.types.UpdateConfiguration.targets
  name: targets
  summary: Group targets for the software update configuration.
  signature: 'targets: TargetProperties'
- uid: azure.mgmt.automation.types.UpdateConfiguration.windows
  name: windows
  summary: Windows specific update configuration.
  signature: 'windows: WindowsProperties'
